<style>

}

  }

:root[data-theme="dark"] {

body { margin: 0; background: var(--bg); color: var(--text);

  border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; }
.tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

.score b { color: var(--text); }
main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 80px; }
.part-intro { color: var(--muted); font-size: 14px; margin: 0 0 16px; }

<script>
const SOURCE = "# 目錄\n\n1. [PART 5：單句文法與詞彙](#part-5)\n   概念：101~130 題是單句文法／詞彙選擇題，重點分成兩大類。一類是「詞性判斷」，看空格在句中的位置決定要填名詞、形容詞還是副詞（含可數／不可數名詞、比較級、反身代名詞、指示代名詞等）；另一類是「詞彙／慣用語」，要靠上下文語意選出正確的動詞、名詞、形容詞、副詞，或是固定搭配的介系詞／連接詞慣用語。另外也會考動詞的時態、語態、單複數一致，以及祈使句、to 不定詞這類固定句型結構。\n\n2. [PART 6：段落填空](#part-6)\n   概念：131~146 題共 4 篇短文克漏字，每篇 4 格。除了和 Part 5 一樣的詞性、詞彙、慣用語考點之外，多了兩種跨句題型：「連接副詞」要判斷空格前後兩句的邏輯關係（轉折、因果、附加說明等），「選出空格中正確的句子」則要讀懂整段文意才能選出銜接最順的句子，不能只看單句。\n   1. [Questions 131-134 refer to the following notice](#questions-131-134-refer-to-the-following-notice-)\n      概念：公寓管理公司 Wimberley Group 通知房客，收租方式將改為線上電子系統。考點：動詞詞彙（convert）、選出空格中正確的句子（呼應上下句的邏輯）、動詞慣用語（make a payment）、表時間的副詞子句連接詞（As soon as）。\n   2. [Questions 135-138 refer to the following e-mail](#questions-135-138-refer-to-the-following-e-mail-)\n      概念：電腦店客服人員寫信給顧客，說明送修筆電的維修進度及賠償方案。考點：人物名詞 vs. 抽象名詞（technicians）、動詞詞彙（repaired）、連接副詞（Alternatively，表示「或者」的補充選項）、選出空格中正確的句子。\n   3. [Questions 139-142 refer to the following announcement](#questions-139-142-refer-to-the-following-announcement-)\n      概念：店經理發給全體員工的公告，說明購物中心休館期間該如何進入店面準備特賣活動。考點：連接副詞（However，表轉折）、選出空格中正確的句子、主要子句表建議／義務時 that 子句用動詞原形（meet）、副詞詞彙（punctually）。\n   4. [Questions 143-146 refer to the following e-mail](#questions-143-146-refer-to-the-following-e-mail-)\n      概念：政府稽查人員寫給服飾工廠負責人的信，通知年度勞動法規稽查及配合事項。考點：名詞詞彙（assessment）、形容詞詞彙（previous）、副詞位置（legally 修飾動詞）、選出空格中正確的句子。\n\n3. [PART 7：閱讀理解](#part-7)\n   概念：147~200 題共 15 篇文章，從單篇到雙篇、三篇綜合閱讀都有。主要題型包括：尋找文章主題／目的（通常看文章開頭）、wh- 問題（針對 Why/How/What/Who 等找細節）、Not/True 是非題（比對選項與文章敘述）、推論題（含需要交叉比對多篇文章線索的「多篇文章綜合題」）、掌握意圖題（判斷對話或訊息中某句話的言外之意）、同義詞題，以及新制題型「找出句子插入位置」。雙篇、三篇文章的題目通常需要串連不同文章中的線索才能作答。\n   1. [Questions 147-148 refer to the following invitation](#questions-147-148-refer-to-the-following-invitation)\n      概念：醫院募款晚宴的邀請函，說明為何需要資金整修建築物東側，以及購票贈書的優惠方式。考點：wh- 問題（Why 需要資金、How 取得贈品）。\n   2. [Questions 149-150 refer to the following ticket](#questions-149-150-refer-to-the-following-ticket)\n      概念：巴士公司開立的車票，記載乘客資料、行程時刻表、行李與退費規定。考點：Not/True 是非題（關於乘客的敘述、車票上未記載的資訊）。\n   3. [Questions 151-152 refer to the following letter](#questions-151-152-refer-to-the-following-letter)\n      概念：員工福利保險公司業務寫給製藥公司福利經理的推銷信，介紹保險套裝方案。考點：尋找信件目的（介紹公司產品）、wh- 問題（How 取得育嬰假保險）。\n   4. [Questions 153-154 refer to the following text message chain](#questions-153-154-refer-to-the-following-text-message-chain-)\n      概念：同事之間關於代送辦公室租約合約的簡訊對話紀錄。考點：推論題（從對話內容推知某地區停車不易）、掌握意圖題（判斷「應該在我桌上」這句話的實際意思）。\n   5. [Questions 155-157 refer to the following e-mail](#questions-155-157-refer-to-the-following-e-mail)\n      概念：唱片行寄給會員關於「世界唱片行日」活動行程的電子郵件。考點：尋找郵件目的（提供活動時間表）、Not/True 是非題（未提及的活動類型、關於特定店家的敘述）。\n   6. [Questions 158-161 refer to the following announcement](#questions-158-161-refer-to-the-following-announcement)\n      概念：城市公園關於浣熊出沒問題的公告，並附志工清掃活動報名資訊。考點：尋找公告理由（提醒遊客注意問題）、Not/True 是非題（關於浣熊未提及的敘述）、wh- 問題（志工會得到的物品）、找出句子插入位置。\n   7. [Questions 162-165 refer to the following online chat discussion](#questions-162-165-refer-to-the-following-online-chat-discussion-)\n      概念：廣告公司同事討論汽車客戶宣傳案進度的線上聊天記錄。考點：推論題（推知說話者所屬產業）、掌握意圖題（片語「on the right track」的含義）、Not/True 是非題（關於特定人物的敘述）、wh- 問題（某人被要求做的事）。\n   8. [Questions 166-168 refer to the following information](#questions-166-168-refer-to-the-following-information)\n      概念：咖啡公司說明道德採購政策、如何回饋咖啡農社區的文件。考點：Not/True 是非題（關於合作農場的敘述）、wh- 問題（開發基金會的主要受益對象）、找出句子插入位置。\n   9. [Questions 169-171 refer to the following article](#questions-169-171-refer-to-the-following-article)\n      概念：報導軟體公司執行長獲選年度科技女性的新聞。考點：Not/True 是非題（關於公司過去產品定位的敘述、關於人物未提及的敘述）、wh- 問題（公司未來預計發生的事）。\n   10. [Questions 172-175 refer to the following report](#questions-172-175-refer-to-the-following-report)\n       概念：城市趨勢報告，分析西班牙瓦倫西亞市觀光人數成長的原因。考點：尋找文章主題（觀光業的改善）、Not/True 是非題（未提及的成長原因、關於馬德里的敘述）、wh- 問題（Why 排名第三）。\n   11. [Questions 176-180 refer to the following letter and e-mail](#questions-176-180-refer-to-the-following-letter-and-e-mail)\n       概念：雙篇文章。金融公司寄給客戶說明改為無紙化對帳單的信件，以及後續寄送第一份電子對帳單的電子郵件。考點：尋找信件理由、Not/True 是非題（無紙對帳單的特性）、wh- 問題（如何申請紙本副本、為何被要求檢查對帳單）、推論題（多篇文章綜合，判斷客戶是否付了年費）。\n   12. [Questions 181-185 refer to the following announcement and schedule](#questions-181-185-refer-to-the-following-announcement-and-schedule)\n       概念：雙篇文章。商人協會徵求企業贊助夏季音樂會的公告，以及各場音樂會贊助費用的日程表。考點：尋找公告主題（本地企業的宣傳機會）、wh- 問題（活動目標）、推論題（多篇文章綜合，共同贊助者可做的事）、wh- 問題（贊助者的義務）、Not/True 是非題（多篇文章綜合，判斷哪場音樂會未達刊登報紙的贊助門檻）。\n   13. [Questions 186-190 refer to the following article, Web page, and e-mail](#questions-186-190-refer-to-the-following-article-web-page-and-e-mail-)\n       概念：三篇文章。報導市議會討論大型超市進駐提案的新聞、市民在報社網站上反對此案的留言、商會秘書邀請該市民出席公聽會的電子郵件。考點：尋找文章主題、wh- 問題（多篇文章綜合，某人希望市長採取的行動）、同義詞題（limits）、wh- 問題（特定日期會發生的事）、推論題（多篇文章綜合，判斷人物立場）。\n   14. [Questions 191-195 refer to the following invoice, e-mail, and message](#questions-191-195-refer-to-the-following-invoice-e-mail-and-message-)\n       概念：三篇文章。設計公司寄給投資顧問公司的發票、客戶要求更換封面照片的回信、公司執行長的年終公司內部通訊。考點：Not/True 是非題（關於設計公司服務項目的敘述）、推論題（多篇文章綜合，須支付的額外修改費用）、尋找訊息目的、同義詞題（outperformed）、推論題（多篇文章綜合，判斷公司最近做了什麼活動）。\n   15. [Questions 196-200 refer to the following e-mail, program, and form](#questions-196-200-refer-to-the-following-e-mail-program-and-form-)\n       概念：三篇文章。攝影社團社長寫信詢問數位藝術中心團體課程資訊的電子郵件、中心的一日課程表、社長填寫的報名表。考點：尋找郵件目的（詢問課程資訊）、Not/True 是非題（多篇文章綜合，判斷社團成員可上的課程）、同義詞題（focused on）、推論題（多篇文章綜合，須支付的團體報名費用）、wh- 問題（報名者須自備的物品）。\n\n-----------------------------------------------------------\n\n<!-- page 022 -->\n\n# TEST 01\n\nPart 5 翻譯・解說\nPart 6 翻譯・解說 🆕\nPart 7 翻譯・解說 🆕\n\n<!-- page 023 -->\n\n## PART 5\n\n**101.** 答案 (B)｜難度：低\nEmily introduced ______ before starting the interview for the management job.\n- (A) she\n- (B) herself\n- (C) hers\n- (D) her\n\n> Emily 在開始管理職的面試之前先自我介紹。\n\n**〔受詞位置〕反身代名詞**\n動詞（introduced）的受詞位置可能填入反身代名詞 (B)、所有格代名詞 (C) 或受格人稱代名詞 (D)。介紹（introduced）的主詞是 Emily，因為要表達「Emily 介紹她自己」的意思，而當動詞或介系詞的受詞等於主詞本身時，應該使用反身代名詞，所以反身代名詞 (B) herself 是正確答案。如果填入所有格代名詞 (C) 或人稱代名詞受格 (D) 的話，意思會變成「介紹她的東西」、「介紹她（Emily 以外的其他女性）」，不符合句子的情境。主格人稱代名詞 (A) 必須放在主詞的位置。另外，要記住 introduce oneself（自我介紹）這個慣用語。\n\n**單字** management (n.) 管理，經營\n\n**102.** 答案 (C)｜難度：低\n______ to the e-mail from the supervisor as soon as possible and ask questions if anything is unclear.\n- (A) Response\n- (B) Responding\n- (C) Respond\n- (D) Responds\n\n> 盡快回覆主管寄的電子郵件，如果有任何不清楚的地方就問問題。\n\n**祈使句沒有主詞，由動詞原形開始**\n這是沒有主詞的祈使句，所以可用於祈使句的動詞原形 (C) Respond（回答，反應）是正確答案。名詞 (A)、動名詞或分詞 (B)、第三人稱單數形 (D) 都不是祈使句可使用的動詞形態。\n\n**單字** supervisor (n.) 管理者，主管；unclear (adj.) 不明確的，不清楚的\n\n**103.** 答案 (D)｜難度：中\nThe ______ of the retreat was to allow all of the employees to bond with one another.\n- (A) measure\n- (B) convention\n- (C) scheme\n- (D) purpose\n\n> 員工研習營的目的是讓所有員工能夠彼此團結。\n\n**名詞詞彙**\n文意是「員工研習營的目的是讓所有員工能夠彼此團結」，所以名詞 (D) purpose（目的）是正確答案。(A) measure 表示「措施，度量單位」，(B) convention 表示「習俗，慣例」，(C) scheme 表示「計畫，陰謀」。\n\n**單字** retreat (n.) 員工研習營，退修會（通常在鄉野的活動場地舉行，包含各種動、靜態的團隊凝聚活動）(v.) 撤退；bond with (phr.) 和…黏合，團結；measure (n.) 措施，度量單位 (v.) 測量\n\n**104.** 答案 (A)｜難度：低\nThe wildlife preserve was created by the Florida Nature Commission to ______ the state's endangered species.\n- (A) protect\n- (B) protection\n- (C) protective\n- (D) protecting\n\n> 這個野生動物保護區，是佛羅里達自然委員會為了保護該州瀕危物種而設立的。\n\n**to 不定詞的形式**\n能和空格前面的 to 形成 to 不定詞的動詞原形 (A) protect（保護）是正確答案。名詞 (B)、形容詞 (C)、動名詞或分詞 (D) 都不能用在 to 不定詞的動詞原形位置上。\n\n**單字** wildlife (n.) 野生動物；preserve (n.) 保護區 (v.) 保存；commission (n.) 委員會，佣金 (v.) 委任；endangered (adj.) 瀕臨絕種的，瀕危的；species (n.) 物種\n\n<!-- page 024 -->\n\n**105.** 答案 (A)｜難度：高\nStaff members with ______ engagements need not feel obliged to attend next week's trip.\n- (A) prior\n- (B) timely\n- (C) late\n- (D) old\n\n> 已經有約的員工，不必參加下週的旅行。\n\n**形容詞詞彙**\n文意是「事先有約的員工，不必參加下週的旅行」，所以 (A) prior（先前的）是正確答案。(B) timely 表示「適時的」，(C) late 表示「晚的」，(D) old 表示「老的，舊的」。\n\n**單字** engagement (n.) 做某事的約定，訂婚；oblige (v.) 使不得不做…，迫使做…；trip (n.) 旅行，出差\n\n**106.** 答案 (C)｜難度：中\nThe building's new tenants ______ in the next couple of days, so the staff is getting everything ready.\n- (A) to arrive\n- (B) have arrived\n- (C) are arriving\n- (D) arrival\n\n> 大樓的新租戶將在未來幾天來到，所以員工們正在把一切準備好。\n\n**〔動詞位置〕未來式**\n第一個子句（The building's ~ days）缺少動詞，所以動詞 (B)、(C) 是可能的答案。因為句中有表示未來時間的詞語（in the next couple of days），所以可以表示未來的現在進行式 (C) are arriving 是正確答案。現在完成式 (B) 不能和表示未來時間的詞語連用。to 不定詞 (A) 和名詞 (D) 不能用在動詞的位置。另外要記住，現在進行式（be + -ing）可以表達預計要做或即將發生的事，所以有表示未來的意味。\n\n**單字** tenant (n.) 承租人，住戶 (v.) 租屋使用\n\n**107.** 答案 (B)｜難度：低\nThe banquet hall was ______ decorated for the fund-raising gala on June 11.\n- (A) elaborated\n- (B) elaborately\n- (C) elaborate\n- (D) elaborator\n\n> 為了 6 月 11 日的募資盛會，宴會廳經過精心布置。\n\n**副詞位置**\n能修飾動詞（was decorated）的是副詞，所以副詞 (B) elaborately（精心地，精巧地）是正確答案。動詞或分詞 (A)、動詞或形容詞 (C)、名詞 (D) 都不能修飾動詞。\n\n**單字** banquet hall (phr.) 宴會廳；fund-raising (n.) 募款，募資活動；gala (n.) 盛會；elaborate (v.) 精心製作 (adj.) 精心的，精巧的；elaborator (n.) 精心製作者\n\n**108.** 答案 (B)｜難度：中\nThe Whitby Town Council recently prepared a brochure recommending ways that residents can play an ______ role in the community.\n- (A) activate\n- (B) active\n- (C) action\n- (D) activity\n\n> Whitby 市議會最近準備了小冊子，建議居民們能在社區扮演積極角色的一些方法。\n\n**形容詞位置**\n能修飾空格後方名詞（role）的是形容詞，所以形容詞 (B) active（積極的，活躍的）是正確答案。動詞 (A)、名詞 (C) 和 (D) 都不能修飾名詞。\n\n**單字** brochure (n.) 小冊子；recommend (v.) 建議，勸告；role (n.) 角色，作用；community (n.) 社區，社會；activate (v.) 使活化，啟動；activity (n.) 活動，活躍\n\n<!-- page 025 -->\n\n**109.** 答案 (A)｜難度：最高\nMs. Johnson ______ a feasible solution to the customer's network problem.\n- (A) came up with\n- (B) dropped by\n- (C) looked in on\n- (D) ran out of\n\n> Johnson 小姐想出了顧客網路問題的可行解決方法。\n\n**動詞慣用語**\n文意是「想出了顧客網路問題的可行解決方法」，所以動詞慣用語 come up with（想出）的過去式 (A) came up with 是正確答案。(B) 的慣用語 drop by 表示「順道拜訪…」，(C) 的 look in on 表示「短暫拜訪查看…」，(D) 的 run out of 表示「用光…」。\n\n**單字** feasible (adj.) 可行的，可實行的；solution (n.)（問題、困境的）解決方法\n\n**110.** 答案 (C)｜難度：中\nThe human resources department is ______ pressure to find a replacement for the senior accountant.\n- (A) within\n- (B) through\n- (C) under\n- (D) among\n\n> 人事部面臨要找到資深會計師接任者的壓力。\n\n**與動詞、形容詞、名詞連用的介系詞慣用語**\n要表達「人事部面臨要找到資深會計師繼任者的壓力」的意思，所以能表示「受到壓力、在壓力之下」的介系詞 (C) under（在…之下）是正確答案。(A) within 表示「在…之內」，(B) through 表示「通過…」，(D) among 表示「在…之間」。\n\n**單字** pressure (n.) 壓力，壓迫；replacement (n.) 代替者，接任者；senior (adj.) 資深的，年長的；accountant (n.) 會計師\n\n**111.** 答案 (C)｜難度：中\nBelTrax has ______ ranked as one of the top providers of marketing research since its foundation seven years ago.\n- (A) conveniently\n- (B) temporarily\n- (C) consistently\n- (D) wishfully\n\n> 自七年前創立以來，BelTrax 持續獲評為行銷研究的頂尖提供者之一。\n\n**副詞詞彙**\n文意是「BelTrax 持續獲評為頂尖提供者之一」，所以副詞 (C) consistently（一貫地）是正確答案。(A) conveniently 表示「便利地」，(B) temporarily 表示「臨時地」，(D) wishfully 表示「渴望地」。\n\n**單字** rank as (phr.) 評為…的等級；provider (n.) 提供機構，供應者，賺錢養家的人；marketing research (phr.) 行銷研究；foundation (n.) 創立，基礎\n\n**112.** 答案 (B)｜難度：高\nMansfield Chemical built an extension that ______ additional space for the newly purchased machinery.\n- (A) will have furnished\n- (B) would furnish\n- (C) had furnished\n- (D) to furnish\n\n> Mansfield Chemical 公司進行了擴建，將為新採購的機械提供額外空間。\n\n**〔動詞位置〕時態一致**\nthat 子句（that ~ machinery）缺少動詞，所以動詞 (A)、(B)、(C) 是可能的答案。主要子句（Mansfield Chemical built an extension）的時態是過去式（built），所以從屬子句應該使用過去式或過去完成式。擴建部分提供額外空間是在過去蓋好（built）的時間點之後，所以過去式 (B) would furnish 是正確答案。(A) 是未來完成式，表示在未來特定時間點以前發生的動作，也就是在某個未來時間點之前會完成，所以不對。(C) 是過去完成式，表示比過去特定時間點更早發生的事，所以不對。to 不定詞 (D) 不能放在動詞位置。\n\n**單字** extension (n.) 建築物的擴建，擴展；additional (adj.) 額外的；newly (adv.) 新近，新地；machinery (n.) 機械；furnish (v.) 提供，配置（家具）\n\n<!-- page 026 -->\n\n**113.** 答案 (C)｜難度：中\nAs the argument raised at the last meeting was on a ______ point, it did not affect the proposal's overall plan.\n- (A) defensive\n- (B) creative\n- (C) minor\n- (D) critical\n\n> 由於上次會議提起的爭論是關於不重要的事項，所以不影響提案的整體計畫。\n\n**形容詞詞彙**\n文意是「因為被提起的爭論是關於不重要的事項，所以不影響提案的整體計畫」，所以形容詞 (C) minor（不重要的，次要的）是正確答案。(A) defensive 表示「防禦的，守備的」，(B) creative 表示「有創意的」，(D) critical 表示「批判的，關鍵的」。\n\n**單字** argument (n.) 爭吵，爭論；raise (v.) 提起，抬起；proposal (n.) 提案，提議；overall (adj.) 全體的，總體的\n\n**114.** 答案 (B)｜難度：中\n______ who still wish to submit applications after the deadline must pay a $45 late fee in order to be considered.\n- (A) Anyone\n- (B) Those\n- (C) Though\n- (D) Seldom\n\n> 截止期限後仍然想要提交申請書的人，必須付 45 美元的逾期費用才能被納入考慮。\n\n**〔主詞位置〕指示代名詞**\n句子中有動詞（must pay），但沒有主詞，所以能當主詞的不定代名詞 (A) 和指示代名詞 (B) 是可能的答案。空格後面的關係子句（who ~ deadline）中，動詞（wish）是複數形，而且要表達的意思是「要交申請書的人們」，所以表示複數的指示代名詞 (B) Those（…的人們）是正確答案。(A) Anyone 表示「任何人」，是單數名詞，動詞必須用單數形。副詞子句連接詞 (C) Though（儘管…）和副詞 (D) Seldom（很少…）不能用在主詞的位置。\n\n**單字** submit (v.) 提交，使服從；application (n.) 申請表，應用；late fee (phr.) 逾期費用\n\n**115.** 答案 (D)｜難度：高\nEveryone at Hammond Construction, Inc. was surprised to find out that the year's greatest cost saving measure was ______ by an intern.\n- (A) attracted\n- (B) reserved\n- (C) continued\n- (D) suggested\n\n> Hammond Construction 公司的所有人驚訝地發現，年度最佳節省成本措施是由一位實習生建議的。\n\n**動詞詞彙**\n文意是「措施是由實習生建議的」，所以 suggest（建議）的 p.p. 形 (D) suggested 是正確答案。(A) 的動詞 attract 表示「吸引」，(B) 的 reserve 表示「預約，保留」，(C) 的 continue 表示「繼續」。\n\n**單字** find out (phr.) 發現，得知；measure (n.) 措施 (v.) 測量；intern (n.) 實習生，實習醫師\n\n**116.** 答案 (C)｜難度：高\nUpon his retirement, Mr. Ross was highly commended for his vital contributions during the company's ______ years.\n- (A) formed\n- (B) formation\n- (C) formative\n- (D) form\n\n> 退休時，Ross 先生因為在公司草創時期的重大貢獻而備受推崇。\n\n**〔形容詞位置〕容易混淆的形容詞**\n能修飾空格後方名詞（years）的是形容詞，所以形容詞 (A)、(C) 是可能的答案。因為要表達的是「在公司草創時期的貢獻」，所以 (C) formative（設立的，形成的）是正確答案。(A) formed 表示「被形成的，有某種生物學特徵的」，意義上似乎可以說得通，但時間是不能被形成的，所以不對。名詞 (B) 和名詞或動詞 (D) 不能修飾名詞。\n\n**單字** retirement (n.) 退休；commend (v.) 稱讚，讚賞；vital (adj.) 重要的，必要的；contribution (n.) 貢獻，捐款；formation (n.) 形成，構成；form (n.) 形狀，形式 (v.) 形成\n\n<!-- page 027 -->\n\n**117.** 答案 (C)｜難度：中\nMs. Waddill provided a few members of her department with an ______ covering the key points of the CEO's speech.\n- (A) objection\n- (B) expansion\n- (C) overview\n- (D) experience\n\n> Waddill 小姐為她部門的幾位成員提供執行長演講重點的概述。\n\n**名詞詞彙**\n文意是「為成員提供演講重點的概述」，所以名詞 (C) overview（概要，概述）是正確答案。(A) objection 表示「反對，異議」，(B) expansion 表示「擴大，擴張」，(D) experience 表示「經驗，經歷」。\n\n**單字** department (n.) 部門；cover (v.) 涵蓋，包含；key points (phr.) 重點；speech (n.) 演說，言談\n\n**118.** 答案 (C)｜難度：高\nThe doubts among investors ______ the company's ability to expand in the coming year led to a steep decline in the stock's price.\n- (A) behind\n- (B) from\n- (C) regarding\n- (D) across\n\n> 投資者對於公司明年擴張能力的懷疑，導致了股價的急遽下跌。\n\n**選擇介系詞** 關於…\n要表達的意思是「對於公司明年擴張能力的懷疑」，所以介系詞 (C) regarding（關於…）是正確答案。(A) behind 表示「在…後方」，(B) from 表示「從…開始」，(D) across 表示「越過…」。\n\n**單字** doubt (n.) 懷疑 (v.) 懷疑；investor (n.) 投資者；ability (n.) 能力；expand (v.) 擴張，擴大；steep (adj.) 陡峭的，急遽的；stock (n.) 股票，存貨，儲備\n\n**119.** 答案 (D)｜難度：中\n______ at the Latipa Film Festival increased by nearly 30 percent this year thanks to an online marketing campaign.\n- (A) Attend\n- (B) Attendee\n- (C) Attendant\n- (D) Attendance\n\n> 多虧有網路行銷活動，今年 Latipa 電影節的參加人數增加了將近百分之 30。\n\n**〔主詞位置〕人物名詞 vs. 抽象名詞**\n句中有動詞（increased），但缺少主詞，所以能當主詞的名詞 (B)、(C)、(D) 是可能的答案。因為要表達「參加人數增加將近百分之 30」的意思，所以抽象名詞 (D) Attendance（出席人數）是正確答案。(B) Attendee（出席者）和 (C) Attendant（出席者，服務員）是可數名詞，應該使用複數形或與冠詞連用，而且用「人數增加」來表達會比「人增加」來得恰當。動詞 (A) 不能當主詞。\n\n**單字** nearly (adv.) 將近，幾乎；thanks to (phr.) 多虧有…，因為有…\n\n<!-- page 028 -->\n\n**120.** 答案 (D)｜難度：最高\nDuring the summer, rooms at the Marigold Hotel are always fully booked ______ the large size of the facility.\n- (A) thereby\n- (B) even though\n- (C) aside from\n- (D) notwithstanding\n\n> 在夏季期間，儘管設施規模很大，Marigold 飯店也總是訂房客滿的狀態。\n\n**〔引導修飾語的成分〕選擇介系詞** 讓步\n這個句子是有主詞（rooms at the Marigold Hotel）和動詞（are ~ booked）的完整句，所以將 ______ the large size of the facility 的部分視為修飾語，能夠引導修飾片語的介系詞 (C)、(D) 是可能的答案。因為要表達「儘管規模很大還是訂房客滿」的意思，所以表示讓步的介系詞 (D) notwithstanding（儘管…）是正確答案。(C) aside from 表示「除了…以外」。副詞 (A) thereby（因此）不能引導修飾語。(B) even though（即使…）可以引導修飾語，但後面應該接有動詞的修飾子句。\n\n**單字** fully (adv.) 完全地，徹底地；book (v.) 預約，預訂；facility (n.) 設施（場所）\n\n**121.** 答案 (A)｜難度：低\nAll employees need a written ______ from the manager to access the office during off-hours.\n- (A) permit\n- (B) permissive\n- (C) permits\n- (D) permissively\n\n> 所有員工都需要經理的書面許可，才能在非辦公時間進入辦公室。\n\n**〔名詞位置〕可數名詞與不可數名詞**\n能被空格前面的形容詞（written）修飾的是名詞，所以名詞 (A)、(C) 是可能的答案。因為空格前面還有不定冠詞 a，所以應該填入可數名詞單數形，(A) permit（許可，許可證）是正確答案，而複數的 (C) 是錯的。形容詞 (B)、副詞 (D) 不能被形容詞修飾。\n\n**單字** written (adj.) 被寫下的，書面的；access (v.) 進入，使用；off-hours (n.) 上班時間以外的時間；permissive (adj.) 許可的，寬容的；permissively (adv.) 許可地，寬容地\n\n**122.** 答案 (A)｜難度：中\nSince the trainees were having difficulty following the instruction manual, the trainer decided to create a ______ version.\n- (A) simplified\n- (B) similar\n- (C) controversial\n- (D) contradictory\n\n> 由於受訓者很難理解指導手冊，所以訓練員決定製作簡化的版本。\n\n**形容詞詞彙**\n文意是「因為很難理解指導手冊，所以決定製作簡化的版本」，所以形容詞 (A) simplified（簡化的）是正確答案。(B) similar 表示「類似的」，(C) controversial 表示「有爭議的」，(D) contradictory 表示「矛盾的」。\n\n**單字** trainee (n.) 受訓者；instruction (n.) 指示，指導；manual (n.) 手冊\n\n<!-- page 029 -->\n\n**123.** 答案 (C)｜難度：高\nHGS Company was awarded the construction contract as it had a ______ bid than any of the other competing firms.\n- (A) worthiest\n- (B) worth\n- (C) worthier\n- (D) worthy\n\n> HGS 公司獲得了建設契約，因為它的投標比其他競爭公司更有利。\n\n**〔形容詞位置〕比較級**\n能修飾空格後方名詞（bid）的是形容詞，所以形容詞 (A)、(C)、(D) 是可能的答案。因為句中有和比較級連用的 than，所以形容詞 worthy（有價值的，值得的）的比較級 (C) worthier 是正確答案。最高級 (A) 和原級 (D) 不能和 than 連用。名詞 (B) 不能放在形容詞的位置，就算當成形容詞（有…價值的）也不能用在這個比較級的句子裡。\n\n**單字** award a contract (phr.) 給予合約；bid (n.) 出價，投標 (v.) 出價；firm (n.) 公司；worth (adj.) 價值…的 (n.) 價值\n\n**124.** 答案 (A)｜難度：中\nMs. Nissim, the founder of Hartwell Industries, will ______ a talk on effective sales strategies at the marketing convention.\n- (A) deliver\n- (B) register\n- (C) showcase\n- (D) imply\n\n> Hartwell Industries 公司創辦人 Nissim 小姐將在行銷大會上發表關於有效銷售策略的演說。\n\n**動詞慣用語**\n文意是「發表關於有效銷售策略的演說」，所以能形成慣用語 deliver a talk 的動詞 (A) deliver（發表〔演說等〕）是正確答案。(B) register 表示「登記」，通常以 register for 的形式使用。(C) showcase 表示「展示，介紹」，通常是介紹新人、新產品的意思。(D) imply 表示「暗示」。\n\n**單字** founder (n.) 創立者，創辦人；strategy (n.) 策略，戰略\n\n**125.** 答案 (D)｜難度：中\nMany people have succeeded in reducing household waste by buying fewer ______ products.\n- (A) basic\n- (B) decisive\n- (C) effective\n- (D) disposable\n\n> 許多人藉由減少購買拋棄式的產品而成功減少了家庭廢棄物。\n\n**形容詞詞彙**\n文意是「藉由減少購買用完即丟的產品而成功減少家庭廢棄物」，所以形容詞 (D) disposable（用完即丟的）是正確答案。(A) basic 表示「基本的」，(B) decisive 表示「決定的，決定性的」，(C) effective 表示「有效的」。\n\n**單字** succeed in (phr.) 在…方面成功；household waste (phr.) 家庭廢棄物\n\n**126.** 答案 (B)｜難度：最高\nThe next work of art for sale ______ one of the finest paintings ever exhibited at the Cole Morton Museum.\n- (A) has considered\n- (B) is considered\n- (C) is considering\n- (D) considered\n\n> 接下來要出售的藝術品，被認為是 Cole Morton 博物館展示過最好的畫作之一。\n\n**動詞的單複數、時態、語態要正確**\n這是要判斷第 5 類動詞（consider）應該採用什麼語態的題目。文意是「接下來要出售的藝術品被認為是最佳畫作之一」，所以被動態 (B) is considered 是正確答案。(A)、(C)、(D) 都是主動態，所以不對。另外，consider 是後面接受詞和受詞補語的第 5 類動詞，所以改為被動態、受詞往前移的時候，動詞後面還是會留下受詞補語的部分（one of the ~ Cole Morton Museum）。\n\n**單字** fine (adj.) 很好的，優秀的；exhibit (v.) 展示；consider (v.) 認為\n\n<!-- page 030 -->\n\n**127.** 答案 (D)｜難度：中\nThe tenor received widespread ______ for his superb performances at the annual opera festival.\n- (A) criticism\n- (B) persuasion\n- (C) deliberation\n- (D) recognition\n\n> 那位男高音因為在年度歌劇節的極佳演出而廣獲讚賞。\n\n**名詞詞彙**\n文意是「因為極佳的演出而獲得廣泛的讚賞」，所以 (D) recognition（認可，讚譽）是正確答案。(A) criticism 表示「批判，批評」，(B) persuasion 表示「說服」，(C) deliberation 表示「深思熟慮，慎重」。\n\n**單字** widespread (adj.) 分布範圍廣的，廣泛的；superb (adj.) 十分傑出的，極好的；annual (adj.) 年度的，每年的\n\n**128.** 答案 (A)｜難度：中\n______ having television stations across the state, the American Media Corporation owns several magazines and newspapers.\n- (A) Besides\n- (B) Rather\n- (C) Among\n- (D) Along\n\n> 除了有遍及全州的電視台以外，American Media 公司還擁有幾家雜誌社和報社。\n\n**〔引導修飾語的成分〕選擇介系詞 附加**\n這個句子已經有包含主詞（the American Media Corporation）、動詞（owns）和受詞（several magazines and newspapers）的完整子句，所以把 ______ ~ state 的部分視為修飾語。修飾語是沒有動詞的修飾片語，所以能夠引導修飾片語的介系詞 (A)、(C)、(D) 是可能的答案。因為要表示「除了電視台以外，還有幾家雜誌社和報社」的意思，所以表示附加的介系詞 (A) Besides（除了…以外）是正確答案。(C) Among（在…之間）表示位置，(D) Along（沿著…）表示方向。副詞 (B) Rather（相當，有點）不能引導修飾片語。\n\n**單字** station (n.) 車站，電台，電視台；own (v.) 擁有；(adj.) 自己的\n\n**129.** 答案 (C)｜難度：高\nDelegates from the industry's most widely ______ social media marketing firms will speak at next week's summit.\n- (A) respectful\n- (B) respecting\n- (C) respected\n- (D) respective\n\n> 業界最廣受尊崇的社群媒體行銷公司的代表，將在下週的高峰會演說。\n\n**易混淆的形容詞**\n要表示「業界最廣受尊崇的社群媒體行銷公司」的意思，所以形容詞 (C) respected（受尊敬的）是正確答案。形容詞 (A) respectful 表示「尊敬的，恭敬的」，現在分詞 (B) respecting 表示「尊敬的」，形容詞 (D) respective 表示「各自的」，用在這裡會變成「態度很恭敬的公司／各自的公司」的意思，所以不對。另外，要記住 respecting 也可以當成介系詞，表示「關於…」。\n\n**單字** delegate (n.) 代表；(v.) 委派；summit (n.) 高峰會\n\n**130.** 答案 (B)｜難度：高\nTNP Tech will allow users to download its new software for free until September 1 but will start charging for it ______.\n- (A) since\n- (B) thereafter\n- (C) consequently\n- (D) now\n\n> TNP Tech 公司將讓使用者免費下載新軟體到 9 月 1 日為止，但之後將開始收費。\n\n**選擇副詞 時間副詞**\n要表示「9 月 1 日前允許免費下載，但之後要開始收費」的意思，所以副詞 (B) thereafter（之後）是正確答案。(A) since 也有表示「在那之後」的副詞用法，但只能用在過去某個時間點到現在之間的情況，不能用在未來式的句子裡。(C) consequently 表示「結果，因此」，(D) now 表示「現在」。\n\n**單字** for free (phr.) 免費；charge (v.) 收費，把…記在帳上；(n.) 費用，指控\n\n<!-- page 031 -->\n## PART 6\n\n### Questions 131-134 refer to the following notice. 🆕\n131-134 題參照以下通知。\n\n> ATTENTION ALL TENANTS\n>\n> Wimberley Group will ______(131) its rent collection system to electronic one. This change will apply to all apartments effective February 1. ______(132). Cash and personal checks will no longer be accepted.\n>\n> Every tenant needs to create a user profile at www.wimberlygroup.com. After logging in, tenants will be able to ______(133) a payment. You can do this by selecting the unpaid bill and then clicking on the button at the bottom of the screen. ______(134) you hit \"Pay\", the amount you designate will be deducted from your registered credit card or bank account. If you wish to arrange automatic payments, please click the button labeled \"Pay this amount every month.\"\n>\n> Thank you for your cooperation. If you have any questions, e-mail us at help@wimberlygroup.com.\n\n**翻譯**\n> 所有承租戶注意\n>\n> [131] Wimberley Group 公司將轉換收租系統為電子系統。此變更將適用於所有公寓戶，自 2 月 1 日起生效。[132] 自該日起，承租戶須線上繳納租金。現金及個人支票將不再接受。\n>\n> 每位承租戶皆須於 www.wimberlygroup.com 建立使用者資料。[133] 登入後，承租戶將可進行付款。您可以選擇未付帳單並點擊畫面下方按鈕付款。[134] 當您點擊「付款」後，您所指定之金額將立即自您登記之信用卡或銀行帳戶扣除。若您希望設定自動付款，請點「每月支付此金額」按鈕。\n>\n> 感謝您的合作。如有任何問題，請寄電子郵件至 help@wimberlygroup.com 聯絡我們。\n\n**131.**\n- (A) induce\n- (B) fluctuate\n- (C) convert\n- (D) recover\n\n**132.** 🆕\n- (A) Tenants had found the new system easy to use.\n- (B) From that day on, tenants must pay their rental fees online.\n- (C) The new system allowed for a greater variety of payment options.\n- (D) Only certain Wimberley Group occupants will be affected.\n\n**133.**\n- (A) postpone\n- (B) cancel\n- (C) oppose\n- (D) make\n\n**134.**\n- (A) Even though\n- (B) During\n- (C) Since\n- (D) As soon as\n\n**單字** tenant (n.) 承租人，住戶；(v.) 租屋居住；rent (n.) 租金；(v.) 租用，租出；collection (n.) 收集，收取，募捐；apply (v.) 適用，申請；no longer (phr.) 不再…；accept (v.) 接受；unpaid (adj.) 未付的，未償還的；bill (n.) 帳單；hit (v.) 用力按壓或點擊（實體或電腦畫面上的按鈕）；designate (v.) 指定；(adj.) 指定的；deduct (v.) 扣除；arrange (v.) 安排，整理；automatic (adj.) 自動的；label (v.)（在表格等處）標註（必要的資訊）；cooperation (n.) 合作，協力\n\n<!-- page 032 -->\n**131.** 答案 (C)｜難度：中\n**動詞詞彙**\n文意是「將轉換收租系統為電子系統」，所以 (C) convert（轉換，變換）是正確答案。(A) induce 表示「引起」，(B) fluctuate 表示「波動」，(D) recover 表示「恢復，重獲」。\n\n**132.** 🆕 答案 (B)｜難度：中\n**選出空格中正確的句子**\n這是選擇句子的題目，所以要參考空格前後或文章整體的內容。上一句「This change will apply to all apartments effective February 1.」提到即將發生的改變，也就是電子收租系統將從 2 月 1 日起開始適用於所有公寓戶；下一句「Cash and personal checks will no longer be accepted.」提到將不再接受現金和個人支票。所以，空格的內容應該是採用上一句所說的電子收租系統之後，對於付款方式的說明，正確答案是 (B) From that day on, tenants must pay their rental fees online。\n\n**選項翻譯**\n- (A) 承租戶感到新系統易於使用。\n- (B) 自該日起，承租戶須線上繳納租金。\n- (C) 新系統提供更多元的付費方式選擇。\n- (D) 僅特定 Wimberley Group 住戶將受影響。\n\n**單字** rental (adj.) 租賃的；(n.) 租賃，租金；a variety of (phr.) 多樣的，許多的；certain (adj.) 特定的，確定的；occupant (n.) 佔用者，居住者；affect (v.) 影響，對…發生作用\n\n**133.** 答案 (D)｜難度：中\n**動詞慣用語** 參考上下文\n文意是「登入後，承租戶將可 ______ 付款」，每個選項都有可能。因為無法從空格所在的句子判斷答案，所以必須參考空格前後或文章整體的內容。下一句提到可以選擇未付帳單並點擊畫面下方按鈕來做這件事，再下一句說只要點擊「付款」就會從信用卡或銀行帳戶扣除指定金額。所以，登入之後做的事情是付款，能夠形成慣用語 make a payment（進行付款）的 (D) make（做，進行）是正確答案。(A) postpone 表示「延期，延遲」，(B) cancel 表示「取消」，(C) oppose 表示「反對」。\n\n**134.** 答案 (D)｜難度：中\n**〔引導修飾語的成分〕副詞子句連接詞** 時間\n句子是有主詞（the amount）和動詞（will be deducted）的完整句，所以 ______ you hit \"Pay\" 的部分視為修飾語。這個修飾語是有動詞（hit）的修飾子句，所以能引導修飾子句的副詞子句連接詞 (A)、(C)、(D) 是可能的答案。因為要表示「點擊『付款』後，指定之金額將立即自信用卡或銀行帳戶扣除」的意思，所以表示時間的副詞子句連接詞 (D) As soon as（一…就）是正確答案。(A) Even though 表示「儘管…」，(C) Since 表示「自從…」。(B) During 是表示「在…期間」的介系詞，所以後面不是接子句，而是接名詞片語。\n\n<!-- page 033 -->\n### Questions 135-138 refer to the following e-mail. 🆕\n135-138 題參照以下電子郵件。\n\n> To: Angela Thornberry <athornberry@fastmail.com>\n> From: Vincent Nakamura <vnakamura@traxcomputers.com>\n> Subject: Your laptop\n> Date: June 18\n>\n> Dear Ms. Thornberry,\n>\n> I am writing about the Trax 2700 laptop you dropped off at our store on June 15 because of problems with its screen. After sending it to our ______(135) for examination, we discovered that it contained a faulty component. At present, your laptop is being ______(136). As requested, we are also thoroughly testing the device to see if there are any other issues.\n>\n> As this problem appears to have been entirely our fault, we will provide you with a $50 voucher to use at our retail store. ______(137), e-coupons for our Web site are also available. Just let us know which you'd prefer.\n>\n> ______(138). If you have not received it by then, please call customer service.\n>\n> Best wishes,\n>\n> Vincent Nakamura\n> Customer Satisfaction Department\n\n**翻譯**\n> 收件者：Angela Thornberry <athornberry@fastmail.com>\n> 寄件者：Vincent Nakamura <vnakamura@traxcomputers.com>\n> 主旨：您的筆記型電腦\n> 日期：6 月 18 日\n>\n> 親愛的 Thornberry 小姐：\n>\n> 我寫這封信是關於您 6 月 15 日因螢幕問題送到本店的 Trax 2700 筆記型電腦。[135] 送交我們的技術人員檢查後，我們發現這台電腦的一個零件故障。[136] 目前，您的筆記型電腦正在修理中。依照您的要求，我們也正在徹底檢測這台裝置，看看還有沒有其他問題。\n>\n> 由於這個問題似乎完全是我們的過錯，所以我們將提供您可以在我們的零售店使用的 50 美元禮券。[137] 或者也可以提供我們網站的電子折價券。只要讓我們知道您想要哪一種即可。\n>\n> [138] 我們將在三天內送回您的電腦。如果您到時候沒有收到，請打電話聯絡客服。\n>\n> Vincent Nakamura\n> 顧客滿意部門\n\n**135.**\n- (A) technicality\n- (B) technical\n- (C) technicians\n- (D) technology\n\n**136.**\n- (A) replaced\n- (B) repaired\n- (C) shipped\n- (D) recalled\n\n**137.**\n- (A) Regrettably\n- (B) Subsequently\n- (C) Approximately\n- (D) Alternatively\n\n**138.** 🆕\n- (A) The model you inquired about is no longer available at this location.\n- (B) We will send the computer back to you within three days.\n- (C) You are not covered under the warranty as it has expired.\n- (D) We have been receiving a number of complaints about our service.\n\n**單字** examination (n.) 檢查，調查；contain (v.) 包含，容納；faulty (adj.) 有缺陷的，故障的；component (n.) 零件，構成要素；thoroughly (adv.) 徹底地，完全地；device (n.) 裝置，設備；issue (n.) 問題，議題；entirely (adv.) 完全地；voucher (n.) 商品券，禮券；retail store (phr.) 零售店\n\n<!-- page 034 -->\n**135.** 答案 (C)｜難度：中\n**〔名詞位置〕人物名詞 vs. 抽象名詞**\n空格是介系詞（to）的受詞，而且被人稱代名詞所有格（our）修飾，所以名詞 (A)、(C)、(D) 是可能的答案。因為要表示「為了檢查而送交技術人員」的意思，所以 (C) technicians（技術人員）是正確答案。如果使用抽象名詞 (A) technicality（細則，技術性，專門性）或事物名詞 (D) technology（技術，科技），意思會變成「為了檢查而送交技術性／技術」，所以不對。形容詞 (B) 不能放在名詞的位置。\n\n**單字** technical (adj.) 技術性的，專門的\n\n**136.** 答案 (B)｜難度：中\n**動詞詞彙** 參考全文\n文意是「目前筆記型電腦正在被 ______」，每個選項都有可能。因為無法從空格所在的句子判斷答案，所以必須參考空格前後或文章整體的內容。前面提到了因為螢幕問題而把筆記型電腦交給店家，而下一句提到正在檢測是否還有其他問題，可知筆記型電腦正在修理中。所以，動詞 repair（修理）的 p.p. 形 (B) repaired 是正確答案。選項 (A) 的動詞 replace 表示「取代」，(C) 的 ship 表示「運送」，(D) 的 recall 表示「召回」。\n\n**137.** 答案 (D)｜難度：高\n**連接副詞** 參考上下文\n空格和逗號一起出現在句首的連接副詞位置，所以要判斷空格所在的句子和上一個句子的關係再作答。上一句說會提供可在零售店使用的 50 美元禮券，而空格所在的句子說也可以提供網站的電子折價券，所以表示除了前述內容以外還有其他方案的 (D) Alternatively（或者）是正確答案。(A) Regrettably 表示「後悔地，遺憾地」，(B) Subsequently 表示「之後，隨後」，(C) Approximately 表示「大約」，都和文意不符。\n\n**138.** 🆕 答案 (B)｜難度：中\n**選出空格中正確的句子**\n這是選擇句子的題目，所以要參考空格前後或文章整體的內容。下一句「If you have not received it by then, please call customer service.」提到，如果到時候沒收到，請打電話聯絡客服。所以，空格的內容應該是預計寄出東西的時間，正確答案是 (B) We will send the computer back to you within three days。\n\n**選項翻譯**\n- (A) 您詢問的機型在這個據點已經沒有了。\n- (B) 我們將在三天內送回您的電腦。\n- (C) 您沒有保固，因為已經到期了。\n- (D) 我們收到了許多關於服務的投訴。\n\n**單字** inquire (v.) 詢問；location (n.) 地點，場所；cover (v.) 覆蓋，包含；under (prep.) 在…之下；(adj.) 下面的；warranty (n.) 保證書，保固；expire (v.) 到期，期滿；a number of (phr.) 許多的\n\n<!-- page 035 -->\n### Questions 139-142 refer to the following announcement. 🆕\n139-142 題參照以下公告。\n\n> Notice for All Staff\n>\n> The shopping mall our store is located in will be closed from December 24 to 26. ______(139), some of you will be coming in on December 24 to set up for our post-holiday sale. The guard who usually opens the mall doors in the morning is off duty during this time. ______(140). Daniel Monahan is the most senior staff member, so I will give it to him, and he will let everyone inside.\n>\n> It is vital that you ______(141) Daniel at the entrance at exactly 10 a.m. We don't want to waste time making him go back and forth to open the doors, so please be considerate and arrive as ______(142) as you can.\n>\n> Thank you for your understanding.\n>\n> Alison Culpepper\n> Store manager\n\n**翻譯**\n> 給所有員工的通知\n>\n> 本店所在的購物中心將於 12 月 24 日至 26 日暫停營業。[139] 不過，各位當中有些人要在 12 月 24 日來上班，為假期後的特賣做準備。早上通常會到購物中心開門的警衛，這段期間不上班。[140] 所以必須要有保全密碼才能進入建築物內。Daniel Monahan 是最資深的員工，所以我會給他密碼，而他會讓大家進入。\n>\n> [141] 大家必須早上 10 點整在入口和 Daniel 會合。[142] 我們不想浪費時間讓他來來回回開門，所以請考量這一點，盡可能準時到達。\n>\n> 感謝大家的體諒。\n>\n> Alison Culpepper\n> 店經理\n\n**139.**\n- (A) Besides\n- (B) Otherwise\n- (C) Accordingly\n- (D) However\n\n**140.** 🆕\n- (A) Making sure we answer customer inquiries in a timely manner is our priority.\n- (B) You should be able to use your employee pass to access the mall.\n- (C) A security code will therefore be required to enter the building.\n- (D) You will need to handle backorders caused by his absence.\n\n**141.**\n- (A) are meeting\n- (B) meet\n- (C) had met\n- (D) met\n\n**142.**\n- (A) punctually\n- (B) regularly\n- (C) politely\n- (D) impressively\n\n**單字** set up (phr.) 準備，創立；guard (n.) 警衛；(v.) 看守；off duty (phr.) 不在值勤中的；senior (adj.) 上級的，資深的；(n.) 年長者；vital (adj.) 重要的，必要的；entrance (n.) 入口，入場；back and forth (phr.) 來來回回；considerate (adj.) 體諒的，考慮周到的\n\n<!-- page 036 -->\n**139.** 答案 (D)｜難度：中\n**連接副詞** 參考上下文\n空格和逗號一起出現在句首的連接副詞位置，所以要判斷空格所在的句子和上一個句子的關係再作答。上一句說購物中心 12 月 24 日到 26 日暫停營業，而空格所在的句子說有些員工 12 月 24 日要上班，所以表示前後句語意轉折的 (D) However（然而）是正確答案。(A) Besides 表示「而且」，(B) Otherwise 表示「否則」，(C) Accordingly 表示「相應地」。\n\n**140.** 🆕 答案 (C)｜難度：高\n**選出空格中正確的句子**\n這是選擇句子的題目，所以要參考空格前後或文章整體的內容。上一句「The guard who usually opens the mall doors in the morning is off duty during this time.」提到，平常到購物中心開門的警衛在這段期間不上班。所以，空格的內容應該是說明進入建築物的方法，所以 (C) A security code will therefore be required to enter the building 是正確答案。\n\n**選項翻譯**\n- (A) 確保及時回覆顧客詢問是我們首要之務。\n- (B) 各位可以用員工通行證進入購物中心。\n- (C) 所以必須要有保全密碼才能進入建築物內。\n- (D) 各位必須處理因為他缺席而造成的未交貨訂單。\n\n**單字** making sure (phr.) 務必…；inquiry (n.) 詢問；timely (adj.) 及時的，適時的；priority (n.) 優先事項；pass (n.) 通行證；(v.) 通過；security (n.) 保全，安全；handle (v.) 處理；backorder (n.) 因缺貨而暫時無法交貨的訂單；absence (n.) 不在，缺席\n\n**141.** 答案 (B)｜難度：高\n**主要子句表示建議、要求、義務時，that 子句要使用動詞原形**\n因為主要子句（It is vital）有表示義務的形容詞（vital），所以 that 子句（that you ~ 10 a.m.）的動詞位置要填入原形，(B) meet 是正確答案。現在進行式 (A)、過去完成式 (C)、過去式 (D) 都不能用在動詞原形的位置。\n\n**142.** 答案 (A)｜難度：中\n**副詞詞彙**\n文意是「請盡可能準時到」，所以副詞 (A) punctually（準時地）是正確答案。(B) regularly 表示「定期地」，(C) politely 表示「禮貌地」，(D) impressively 表示「令人印象深刻地」。\n\n<!-- page 037 -->\n### Questions 143-146 refer to the following e-mail. 🆕\n143-146 題參照以下電子郵件。\n\n> To: Rajesh Singh <rajesh.singh@indiaclothing.in>\n> From: Faria Deveraj <f.deveraj@mumbai.gov.in>\n> Subject: Scheduled Inspection\n> Date: October 12\n>\n> Dear Mr. Singh,\n>\n> On October 17, your clothing factory will face its yearly government inspection. This annual ______(143) will verify that all labor laws are being followed. Your factory passed the ______(144) evaluation with no major problems, so our inspectors hope to see a similar level of compliance this time around.\n>\n> You are ______(145) obliged to provide access to any part of the factory that the inspectors may wish to see. Failure to comply in this regard may result in fines and further investigation. Also, the inspectors need to confirm that workers are being properly compensated. ______(146).\n>\n> Thank you for your attention to this matter.\n>\n> Faria Deveraj\n> Inspection Team Leader\n> City Government of Mumbai\n\n**翻譯**\n> 收件者：Rajesh Singh <rajesh.singh@indiaclothing.in>\n> 寄件者：Faria Deveraj <f.deveraj@mumbai.gov.in>\n> 主旨：預定的檢查\n> 日期：10 月 12 日\n>\n> 親愛的 Singh 先生：\n>\n> 10 月 17 日，貴服飾工廠將接受年度政府稽查。[143] 此年度評鑑將確認工廠是否遵守所有勞動法規。[144] 貴廠已通過上回評鑑，且無重大問題，因此本部稽查人員希望結果顯示貴廠仍具同等守法水準。\n>\n> [145] 台端依法應允許檢查人員進入任何希望檢視之工廠區域。若不遵守，將遭到罰款及後續調查。檢查人員亦需確認員工皆獲得合理薪酬。[146]（貴廠）人事部門必須備妥相關文件。\n>\n> 謹此致謝\n>\n> Faria Deveraj\n> 檢查小組組長\n> 孟買市政府\n\n**143.**\n- (A) meeting\n- (B) investment\n- (C) commemoration\n- (D) assessment\n\n**144.**\n- (A) decided\n- (B) forthcoming\n- (C) previous\n- (D) ultimate\n\n**145.**\n- (A) legally\n- (B) legality\n- (C) legal\n- (D) legitimate\n\n**146.** 🆕\n- (A) A copy of the receipt for your recent payment has been sent to you in the mail.\n- (B) The human resources department will need to prepare the relevant documents.\n- (C) Consequently, the company wishes to avoid paying any such penalties.\n- (D) We are interested in hearing about certain products that were recalled.\n\n**單字** inspection (n.) 檢查，視察；annual (adj.) 年度的；verify (v.) 確認，證實；evaluation (n.) 評價；inspector (n.) 檢察員，視察員；compliance (n.) 遵守，遵從；oblige (v.) 迫使，使有義務；access (n.) 接近，利用；(v.) 接近；in this regard (phr.) 在這方面；result in (phr.) 導致；fine (n.) 罰金；(v.) 處…以罰金；further (adj.) 進一步的，更多的；investigation (n.) 調查；confirm (v.) 確認；compensate (v.) 補償，付酬勞；attention (n.) 注意，關注；matter (n.) 事情，問題；(v.) 重要\n\n<!-- page 038 -->\n**143.** 答案 (D)｜難度：高\n**名詞詞彙** 參考上下文\n文意是「這次年度 ______ 將確認是否遵守所有勞動法規」，(A)、(C)、(D) 是可能的答案。因為無法從空格所在的句子判斷答案，所以必須參考空格前後或文章整體的內容。上一句提到，服飾工廠要接受年度政府稽查，可知應該是要進行評鑑，所以 (D) assessment（評價）是正確答案。(A) meeting 表示「聚會，會議」，(B) investment 表示「投資」，(C) commemoration 表示「紀念儀式」。\n\n**144.** 答案 (C)｜難度：中\n**形容詞詞彙**\n文意是「工廠通過了上次評鑑，沒有重大問題，希望這次也看到同等的守法程度」，所以形容詞 (C) previous（先前的）是正確答案。(A) decided 表示「明確的，果斷的」，(B) forthcoming 表示「即將到來的」，(D) ultimate 表示「終極的」。\n\n**145.** 答案 (A)｜難度：低\n**副詞位置**\n能修飾動詞（are obliged）的是副詞，所以副詞 (A) legally（在法律上，合法地）是正確答案。名詞 …；wing (n.) 翅膀，建築物兩側延伸的部分；(v.) 飛行；barely (adv.) 幾乎沒有，勉強；nutrition (n.) 營養；care (n.) 照顧，看護；(v.) 關心\n\n**147.** 答案 (C)｜難度：中\nWhy does the hospital need funding?\n- (A) It needs to pay for extra research into diseases.\n- (B) It has to hire more medical personnel.\n- (C) It would like to refurbish a section of the building.\n- (D) It requires the purchase of new medical equipment.\n\n> 為什麼醫院需要資金？\n> (A) 它需要為額外的疾病研究付款。\n> (B) 它必須雇用更多醫療人員。\n> (C) 它想要整修建築物的一部分。\n> (D) 它需要購買新的醫療設備。\n\n**wh- 問題 Why**\n這是問醫院為什麼（Why）需要資金的 wh- 問題，所以要尋找和問題重點 the hospital need funding 相關的內容。「the east wing has barely changed since the opening day. In order to make improvements to it, the hospital needs about £300,000」的部分顯示，建築物東側從開院以來幾乎沒有改變過，為了進行改善，大約需要 30 萬英鎊，可知是因為要整修才需要資金，所以 (C) It would like to refurbish a section of the building. 是正確答案。\n\n**單字** medical personnel (phr.) 醫療人員；refurbish (v.) 整修；medical equipment (phr.) 醫療設備\n\n**148.** 答案 (A)｜難度：中\nHow can guests obtain a complimentary item?\n- (A) By paying for at least four guests\n- (B) By presenting an invitation from a previous event\n- (C) By making reservations for an event online\n- (D) By volunteering to help at the hospital\n\n> 賓客怎樣可以得到贈品？\n> (A) 付至少四名賓客的費用\n> (B) 出示上次活動的邀請函\n> (C) 在網路上進行活動的預約\n> (D) 在醫院當志工幫忙\n\n<!-- page 040 -->\n**wh- 問題 How**\n這是問賓客怎樣（How）可以得到贈品的 wh- 問題，所以要尋找和問題重點 guests obtain a complimentary item 相關的內容。「Those purchasing four tickets or more at one time will receive a ~ book ~ as a gift.」的部分顯示，一次購買四張以上門票的人可以得到書作為贈品，所以 (A) By paying for at least four guests 是正確答案。\n\n**單字** complimentary (adj.) 免費贈送的，稱讚的；at least (phr.) 至少，最少；present (v.) 贈送，出示；volunteer (v.) 自願服務；(n.) 志工\n\n### Questions 149-150 refer to the following ticket.\n149-150 題參照以下票券。\n\n> WALLACE TRANSPORTATION: TICKET\n> \\*PLEASE PRINT THIS OUT\\*\n>\n> [149-D] PASSENGER: William Singer\n> PHONE NUMBER: (212) 555-3201\n> [149-D] HOME ADDRESS: 21 West 74th St., New York, NY 10023\n>\n> TICKET NUMBER: 41249101ABKOA\n> CLASS: Regular\n> FARE: $52.00\n>\n or parking in that area. [154] What about the contract?\n>\n> **Sonya Meadows** 1:51 p.m.\n> It should be sitting on my desk. [154] I asked our receptionist to make copies of it earlier and leave it in my office.\n\n**翻譯**\n> **Sonya Meadows** 下午 1:45\n> Brian，抱歉打擾你，但我需要請你幫忙。我得送一份最終版的辦公空間租賃契約，但我上一個會面進行太久了。我覺得我來不及趕到那裡。\n>\n> **Brian Hull** 下午 1:46\n> 我應該可以幫你送。把詳細資料傳給我。\n>\n> **Sonya Meadows** 下午 1:48\n> 謝謝！客戶是 Coventry Financial 公司，[153] 他們要租 Market 街上 State Tower 的一個空間。是 1804 室。\n>\n> **Brian Hull** 下午 1:49\n> 好。是約幾點？\n>\n> **Sonya Meadows** 下午 1:49\n> 2:40。如果你 10-15 分鐘以內出發的話，應該能趕上。\n>\n> **Brian Hull** 下午 1:50\n> 我會搭計程車，這樣能更快到。[153] 如果我要在那一區找停車位的話，會花我兩倍時間。[154] 那契約呢？\n>\n> **Sonya Meadows** 下午 1:51\n> 應該在我桌上。[154] 我稍早請接待員複印並且放在我辦公室了。\n\n**單字** bother (v.) 打擾，煩擾；favor (n.) 好意，幫助；deliver (v.) 運送，遞交；rental (adj.) 租賃的；(n.) 租金，租賃；contract (n.) 合約，契約；(v.) 訂定契約；rent (v.) 租用，租出；(n.) 租金；make it (phr.) 及時趕到；on time (phr.) 準時；receptionist (n.) 接待員；look for (phr.) 尋找；sit on (phr.) 位於…上面\n\n<!-- page 045 -->\n\n**153.** 答案 (C)｜難度：中\nWhat is suggested about Market Street?\n- (A) It is half an hour away from Ms. Meadows' office.\n- (B) It is located in a shopping district.\n- (C) It is difficult to find parking there.\n- (D) It is near a major transit stop.\n\n> 關於 Market 街，文中顯示什麼？\n> (A) 離 Meadows 小姐的辦公室有半小時的路程。\n> (B) 位於購物商圈。\n> (C) 那裡很難找到停車位。\n> (D) 離主要公車站很近。\n\n**推論** 細節資訊\n這是關於題目關鍵字 Market Street 的推論問題。「they're renting a space at State Tower on Market Street」顯示客戶要租 Market 街上 State Tower 的辦公空間，而 Brian Hull 說的「It'd take me twice as long if I had to look for parking in that area.」顯示在那一區找停車位要花兩倍時間，可推知 Market 街很難找停車位，所以 (C) It is difficult to find parking there 是正確答案。\n\n**替換表達**\nlook for 尋找 → find 找到\n\n**單字** district (n.) 地區，區域；transit (n.) 運輸，過境，中轉\n\n**154.** 🆕 答案 (D)｜難度：中\nAt 1:51 p.m., what does Ms. Meadows mean when she writes, \"It should be sitting on my desk\"?\n- (A) She put a message from a customer on a counter.\n- (B) She misplaced a client's business card.\n- (C) She could not access her appointment schedule.\n- (D) She believes that a document is in her workspace.\n\n> 在下午 1:51，Meadows 小姐說的「It should be sitting on my desk」是什麼意思？\n> (A) 她把顧客的訊息放在一個櫃台。\n> (B) 她弄丟了客戶的名片。\n> (C) 她不能存取自己的會面行程。\n> (D) 她確定文件在她工作的地方。\n\n**掌握意圖**\n題目問 Meadows 小姐的意思，所以要掌握引用部分（It should be sitting on my desk）上下文的情境。Brian Hull 問了關於合約的問題「What about the contract?」，Meadows 小姐則回答「It should be sitting on my desk.（應該在我桌上）」，又說「I asked our receptionist to make copies of it earlier and leave it in my office.」，表示她請接待員複印並且放在辦公室了，所以 Meadows 小姐是認為文件在自己工作的地方，(D) She believes that a document is in her workspace. 是正確答案。\n\n**替換表達**\ncontract 合約 → document 文件\noffice 辦公室 → workspace 工作的地方\n\n**單字** misplace (v.) 放錯地方，放在想不起來的地方（→弄丟）；business card (phr.) 名片；access (v.) 接近，使用，存取；workspace (n.) 工作空間\n\n<!-- page 046 -->\n\n### Questions 155-157 refer to the following e-mail.\n155-157 題參照以下電子郵件。\n\n> TO: Steven Joyce <sjoyce@fastmail.com>\n> FROM: Fast Track Records <information@fasttrackrecords.com>\n> DATE: May 20\n> SUBJECT: Information\n>\n> Dear Mr. Joyce,\n>\n> Every year on the third Saturday of May, we celebrate Record Store Day as a way to honor the independent spirit of record stores. That means [155] Fast Track Records will once again be partnering with all the other major stores in the city for a day of music celebration. As you are a member of our Music Fans Club, [155] we are forwarding you some of the planned highlights of the day:\n>\n> 11 a.m.-12 p.m. — John Kher, Sarah Feinstein, Ernest Yates, and other [156-D] local music critics will be reading selections from their work at Gold Sounds Records.\n>\n> 12 p.m.-5 p.m. — [157-A] Marshalltown Records will be offering a special discount on all jazz and blues records. Stop by their store and receive up to 50% off on your favorite albums.\n>\n> 1 p.m.-5 p.m. — Duke Records will stage a raffle for a variety of merchandise, including vinyl cases, T-shirts, and other memorabilia.\n>\n> 2:30 p.m.-3:30 p.m. — [156-B] Local rock band The Chimney Sweeps will be performing an in-store concert at Desert Island Records.\n>\n> 4 p.m.-5 p.m. — [156-A] Gold Sounds Records will be holding a music-themed trivia competition. Winners will receive special prizes including autographed CDs and posters.\n>\n> [157-D] 5 p.m. — A small after-party will be held at Marshalltown Records.\n>\n> If you have questions about the events and activities, call Fast Track Records at 555-3009 or send a reply to this e-mail. A detailed schedule with further festivities can be found at www.fasttrackrecords.com/recordstoreday.\n\n**翻譯**\n> 收件者：Steven Joyce <sjoyce@fastmail.com>\n> 寄件者：Fast Track 唱片行 <information@fasttrackrecords.com>\n> 日期：5 月 20 日\n> 主旨：資訊\n>\n> 親愛的 Joyce 先生：\n>\n> 每年五月第三個星期六，我們慶祝世界唱片行日，來讚揚唱片行的獨立精神。這意味著 [155] Fast Track 唱片行將再次與市內所有主要唱片行攜手慶祝這個音樂的日子。因為您是我們 Music Fans 俱樂部的會員，所以 [155] 我們寄給您當天預定的一些重點活動：\n>\n> 上午 11 點－中午 12 點 — John Kher、Sarah Feinstein、Ernest Yates 和其他 [156-D] 本地樂評將在 Gold Sounds 唱片行朗讀他們的作品。\n>\n> 中午 12 點－下午 5 點 — [157-A] Marshalltown 唱片行將提供所有爵士與藍調唱片的特別折扣。到該店獲得您最愛專輯最高 50% 的折扣。\n>\n> 下午 1 點－下午 5 點 — Duke 唱片行將舉行贈送多種商品的抽獎，包括黑膠唱片收納箱、T 恤和其他紀念品。\n>\n> 下午 2:30－下午 3:30 — [156-B] 本地搖滾樂團 The Chimney Sweeps 將在 Desert Island 唱片行店內進行演唱會。\n>\n> 下午 4 點－下午 5 點 — [156-A] Gold Sounds 唱片行將舉行以音樂為主題的問答競賽。獲勝者將獲得包括親筆簽名 CD 及海報的特別獎品。\n>\n> [157-D] 下午 5 點 — 將在 Marshalltown 唱片行舉行小型慶功派對。\n>\n> 如果您對活動有問題，請撥打 555-3009 聯絡 Fast Track 唱片行，或者回覆這封電子郵件。更多慶祝活動的詳細時間表，可以在 www.fasttrackrecords.com/recordstoreday 查看。\n\n**單字** independent (adj.) 獨立的；spirit (n.) 精神，靈魂；partner (v.) 搭檔，合作；celebration (n.) 慶祝，慶祝活動；forward (v.) 轉交，發送；highlight (n.) 最突出的部分，重點；(v.) 強調；critic (n.) 評論家；selection (n.) 選擇，選擇的東西；up to (phr.) 最高到…；stage (v.) 舉行；(n.) 階段；raffle (n.) 摸彩（許多人付費參加，被抽中的人能得到商品的活動）；(v.) 將…作為摸彩獎品；merchandise (n.) 商品；memorabilia (n.) 紀念品，收集品；in-store (adj.) 店內的；theme (v.) 以…為主題；(n.) 主題；trivia competition (phr.) （問各種有趣但不重要的小知識的）問答競賽；autograph (v.) 在…簽名；(n.) 簽名；after-party (n.) 活動後舉行的派對；further (adj.) 進一步的，更多的；festivity (n.) 慶祝活動\n\n<!-- page 047 -->\n\n**155.** 答案 (C)｜難度：低\nWhat is the main purpose of the e-mail?\n- (A) To announce a record store's grand opening\n- (B) To list music-related events for the summer months\n- (C) To provide a schedule for a special celebration\n- (D) To keep members informed of local concerts\n\n> 這封電子郵件的主要目的是什麼？\n> (A) 為了公告唱片行開幕\n> (B) 為了列出夏季期間的音樂相關活動\n> (C) 為了提供特別慶祝活動的時間表\n> (D) 為了通知會員當地演唱會的消息\n\n**尋找主題／目的** 文章的目的\n這是詢問電子郵件目的的問題，所以要特別注意文章開頭的部分。「Fast Track Records will once again be partnering with all the other major stores in the city for a day of music celebration」和「we are forwarding you some of the planned highlights of the day」提到，Fast Track 唱片行將和市內主要唱片行合作舉行音樂慶祝活動，並且要寄給收件者當天預定的重點活動，所以這封電子郵件是為了告知活動的行程，(C) To provide a schedule for a special celebration 是正確答案。\n\n**替換表達**\nare forwarding 發送 → provide 提供\n\n**單字** grand opening (phr.) （盛大）開幕；list (v.) 列出，列成清單；(n.) 列表，名單；informed (adj.) 知道資訊的\n\n**156.** 答案 (C)｜難度：中\nWhat is NOT mentioned as an activity planned for Record Store Day?\n- (A) A store-sponsored contest\n- (B) A musical performance\n- (C) A speech by a musician\n- (D) A reading from local reviewers\n\n> 文中沒有提到什麼世界唱片行日預定的活動？\n> (A) 店家贊助的比賽\n> (B) 音樂表演\n> (C) 音樂人的演說\n> (D) 當地評論家的朗讀\n\n**Not/True** Not 問題\n這是需要在文章中找到與關鍵字 activity planned for Record Store Day 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A) 對應文中的「Gold Sounds Records will be holding a music-themed trivia competition.」，表示 Gold Sounds 唱片行要舉辦音樂主題的問答競賽，符合選項敘述。(B) 對應文中的「Local rock band The Chimney Sweeps will be performing an in-store concert」，表示當地搖滾樂團要進行店內演唱會，符合選項敘述。(C) 在文中沒有提到，所以 (C) A speech by a musician 是正確答案。(D) 對應文中的「local music critics will be reading selections from their work」，表示當地樂評要朗讀一些作品，符合選項敘述。\n\n**替換表達**\ncompetition 競賽 → contest 競賽\ncritics 評論家 → reviewers 評論家\n\n**157.** 答案 (D)｜難度：低\nWhat is stated about Marshalltown Records?\n- (A) It specializes in jazz and blues records.\n- (B) It has two branches in the city.\n- (C) It is giving away a selection of merchandise.\n- (D) It will be the venue for the final event.\n\n> 關於 Marshalltown 唱片行，文中敘述了什麼？\n> (A) 專門販賣爵士和藍調唱片。\n> (B) 在市內有兩家分店。\n> (C) 正在贈送一些商品。\n> (D) 將會是最終活動的場地。\n\n**Not/True** True 問題\n這是需要在文章中找到與關鍵字 Marshalltown Records 相關的資訊，並且與選項敘述對照的 Not/True 問題。和 (A) 相關的部分是「Marshalltown Records will be offering a special discount on all jazz and blues records.」，表示 Marshalltown 唱片行會提供爵士和藍調唱片的特別折扣，不是說唱片行專門賣這兩種唱片，不符合選項敘述。(B)、(C) 在文中沒有提到。(D) 對應文中的「5 p.m.: A small after-party will be held at Marshalltown Records.」，表示下午 5 點以後要在 Marshalltown 唱片行舉行活動後的慶功派對，而且在這之後沒有其他活動，符合選項敘述，所以 (D) It will be the venue for the final event 是正確答案。\n\n**單字** specialize in (phr.) 專門從事…；give away (phr.) 贈送；a selection of (phr.) 多種的；venue (n.) 場地\n\n<!-- page 048 -->\n\n### Questions 158-161 refer to the following announcement.\n158-161 題參照以下公告。\n\n> Eagle Canyon City Park\n>\n> [158] Over the past month, there has been a sharp increase in reported sightings of raccoons in the open spaces of the park. The park rangers suspect [159-C] the creatures are attracted by food scraps that are left—whether on purpose or accidentally—by visitors to the park. — [1] —. The city's public health department does not want to encourage the raccoons to leave the wooded areas of the park as [159-A] they can be carriers of disease and pose a risk to visitors and their pets. — [2] —. With that in mind:\n>\n> - Please do not leave any garbage in the park—either take it with you when you leave, or place it in the closed garbage bins that are provided throughout the park.\n> - If you see raccoons, do not approach them or give them food as [159-D] they are wild animals with sharp claws and can be dangerous when they feel frightened.\n>\n> — [3] —. Along with this, we will be holding volunteer park cleanups on the last Saturday of each month. Our next one is scheduled for June 27. [161] Anyone interested in taking part should report to the park visitor center to register. — [4] —. [160] All participants will be provided with protective gloves and vests, water, and a light lunch.\n\n**翻譯**\n> Eagle Canyon 城市公園\n>\n> [158] 上個月，在公園開放空間看見浣熊的通報件數大幅增加。公園巡守員懷疑 [159-C] 這些動物是受到公園遊客遺留的吃剩食物吸引——不管是刻意或不經意的。— [1] —。市府的公共衛生部門不希望讓浣熊離開公園林木區，因為 [159-A] 牠們可能帶有疾病，對遊客及其寵物有危險。— [2] —。考慮到這一點：\n>\n> - 請勿在公園內留下垃圾——請在離開時帶走垃圾，或將垃圾置於園內各處提供的密閉式垃圾桶內。\n> - 如果看到浣熊，不要接近或給牠們食物，因為 [159-D] 牠們是有利爪的野生動物，如果感覺受驚可能會很危險。\n>\n> — [3] —。此外，我們也會在每月最後的星期六舉辦志工公園清掃活動。下次預定在 6 月 27 日。[161] 有興趣參加的人都要到公園遊客中心報名。— [4] —。[160] 活動中將會提供所有參加者保護用的手套及背心、水、還有簡易午餐。\n\n**單字** public health (phr.) 公共衛生；open space (phr.) 開放空間，空曠處（例如公園的草地）；sighting (n.) 看見，目擊；raccoon (n.) 浣熊；park ranger (phr.) 公園巡守員；suspect (v.) 推測，懷疑；creature (n.) 動物，生物；food scraps (phr.) 吃剩的食物殘餘；on purpose (phr.) 故意，刻意；accidentally (adv.) 意外地，不小心；carrier (n.) 運送者，帶病原者；pose a risk (phr.) 造成危險；garbage (n.) 垃圾；throughout (prep.) 到處，遍布；approach (v.) 接近，靠近；claw (n.) 爪子；(v.) 用爪子抓；frightened (adj.) 受驚嚇的，害怕的；along with (phr.) 和…一起；cleanup (n.) 清掃，大掃除；take part (phr.) 參與，參加；report (v.) 報告，報到；(n.) 報導；register (v.) 登記，報名；participant (n.) 參與者，參加者；protective (adj.) 保護用的，保護的\n\n**158.** 答案 (D)｜難度：低\nWhy was the announcement written?\n- (A) To declare a public meeting\n- (B) To announce the opening of a wildlife park\n- (C) To provide directions to a visitor center\n- (D) To alert visitors of a problem\n\n> 為什麼寫了這則公告？\n> (A) 為了宣布公開說明會\n> (B) 為了公告野生動物園區開幕\n> (C) 為了提供前往旅客中心的指引\n> (D) 為了提醒遊客注意一個問題\n\n**尋找主題／目的** 寫文章的理由\n這是詢問為什麼寫了公告的尋找目的題型，所以要特別注意文章開頭的部分。「Over the past month, there has been a sharp increase in reported sightings of raccoons in the open spaces of the park.」提到，上個月在公園開放空間看見浣熊的通報件數大幅增加，後面則說明關於浣熊問題的注意事項，所以 (D) To alert visitors of a problem 是正確答案。\n\n**單字** declare (v.) 宣布，宣告；public meeting (phr.) 公開說明會；opening (n.) 開幕，空缺，空地；alert (v.) 提醒…注意，通知，使警覺\n\n<!-- page 049 -->\n\n**159.** 答案 (B)｜難度：高\nWhat is NOT stated about raccoons?\n- (A) They are potential threats to other animals.\n- (B) They should only be approached under staff supervision.\n- (C) They are drawn toward food left by humans.\n- (D) They pose a hazard when fee he promotion project for N-Genz Auto?」顯示 Michelle Hanson 想要知道大家關於 N-Genz Auto 公司宣傳計畫的最新情況，而 Barry Carr 回答說「The script changes for the TV commercial will be done this afternoon.」，表示電視廣告腳本的修正會在下午完成。Michelle Hanson 之後又說「What about the online campaign?」，詢問網路宣傳活動的情況，可推知 Michelle Hanson 應該是在處理電視廣告、網路宣傳等活動的廣告公司工作，所以 (B) An advertising firm 是正確答案。\n\n**單字** manufacturer (n.) 製造商\n\n**163.** 🆕 答案 (C)｜難度：中\nAt 11:58, what does Ms. Hanson mean when she writes, \"on the right track\"?\n- (A) She has agreed to some script modifications.\n- (B) She is pleased with the progress for a site design.\n- (C) She thinks the project is going according to plan.\n- (D) She is satisfied with a casting decision.\n\n> 在 11:58 時，Hanson 小姐說的「on the right track」是什麼意思？\n> (A) 她同意了腳本的一些修改。\n> (B) 她滿意網站設計的進度。\n> (C) 她認為企畫案正照著計畫進行。\n> (D) 她滿意選角的決定。\n\n**掌握意圖**\n題目問 Hanson 小姐的意思，所以要掌握引用部分（on the right track）上下文的情境。Michelle Hanson 開頭說「Can I get an update from everyone on the ~ project ~?」，詢問關於計畫的最新消息，之後 Dustin Rodriguez 說「we can proceed with our shoot on July 18 at Snappy Studios」，表示 7 月 18 日可以在 Snappy 攝影棚拍攝，而 Willa Hopkins 說「I'm quite confident we'll be done in time」，表示很有信心可以準時完成，於是 Hanson 小姐回應「It looks like we are on the right track.」（看來我們進行得很順利）。所以 Hanson 小姐說的 on the right track 應該是表示計畫很順利的意思，(C) She thinks the project is going according to plan 是正確答案。\n\n**單字** modification (n.) 修改，變更；according to (phr.) 根據……，依照……；casting (n.) 投擲，選角\n\n**164.** 答案 (B)｜難度：高\nWhat is true about Mr. Rodriguez?\n- (A) He only recently started working at the company.\n- (B) He plans to get in contact with Ms. Johns.\n- (C) He will send someone in his place to a meeting.\n- (D) He will deliver an upcoming client presentation.\n\n> 關於 Rodriguez 先生，何者正確？\n> (A) 他最近才開始在這家公司工作。\n> (B) 他打算和 Johns 小姐取得聯繫。\n> (C) 他會派某人代替他出席會議。\n> (D) 他會進行接下來的客戶簡報。\n\n**Not/True True 問題**\n這是需要在文章中找到與關鍵字 Mr. Rodriguez 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A) 在文中沒有提到。和 (B) 相關的部分是 Carr 先生說的「I can't make it on the 18th ~, so I'll send Brianna Johns in my rd work of our farmers and ensure that they have acceptable working conditions and wages. But our commitment doesn't end there. — [3] —. Hanlan's pays them an additional 10 percent above current market prices as our way of saying \"thanks.\"\n>\n> Furthermore, [167] to give even more back to these communities, we have started the Hanlan's Development Foundation. Each year through this organization, we put five percent of our total corporate profits into building schools, water pumps and purification plants, and health care facilities in the towns and villages near where our coffee is grown. [167/168] The main goal is to make certain that all our workers' children are safe, healthy, and have the chance to go to school and receive a full education. — [4] —.\n>\n> Find out more about Hanlan's development projects, our coffee producers, and what you can do to support our cause at www.hanlancoffee.com/foundation.\n\n**翻譯**\n> Hanlan's Coffee 公司－道德採購政策\n>\n> 在 Hanlan's 公司，我們知道顧客只希望喝到世界各地最好的咖啡。我們也知道顧客想確定種這些咖啡的人獲得公平的對待。許多咖啡製造商給員工惡劣的工作環境和低薪，這種行為是 Hanlan's 公司不支持的。－[1]－。\n>\n> 在公開市場購買貨品的咖啡公司，永遠不會確切知道咖啡的來源。但在 Hanlan's 公司，我們採取不同的方式。[166-D] 我們和瓜地馬拉、衣索比亞、越南的農場有專屬契約。－[2]－。正因如此，我們確切知道誰生產我們的咖啡，以及咖啡種植的環境。我們感謝我們所有農夫的努力，也確保他們擁有合理的工作條件與工資。但我們的承諾不只如此。－[3]－。Hanlan's 公司付給他們額外 10% 高於市場行情的價格，作為我們表達「感謝」的方式。\n>\n> 此外，[167] 為了給這些社區更多的回饋，我們也創立了 Hanlan's 開發基金會。我們每年透過這個組織，投入公司總利潤的 5%，作為我們咖啡種植地附近城鎮與村莊建設學校、抽水設施、淨水廠及醫療設施之用。[167/168] 主要的目標是確保我們所有員工的小孩都安全、健康，而且有機會上學並接受完整的教育。－[4]－。\n>\n> 請上 www.hanlancoffee.com/foundation 進一步了解 Hanlan's 的開發計畫、我們的咖啡製造商，以及您可以做什麼來支援我們的目標。\n\n**單字** treat (v.) 對待；fairly (adv.) 公平地，公正地，相當；practice (n.) 慣例，實行；stock (n.) 庫存，存貨；open market (phr.) 公開市場，自由市場；approach (n.) 接近，方法；(v.) 接近；exclusive (adj.) 獨佔的，排他的；ensure (v.) 保障，確保；acceptable (adj.) 可以接受的，還算讓人滿意的；market price (phr.) 市場價格；purification plant (phr.) 淨水廠；cause (n.) 原因，目標\n\n**166.** 答案 (D)｜難度：中\nWhat is indicated about Hanlan's Coffee Company's partner farms?\n- (A) They sell their products on the open market.\n- (B) They are subsidized by local governments.\n- (C) They grow a number of different crops.\n- (D) They are situated in several countries.\n\n> 關於 Hanlan's 咖啡公司的合作農場，文中提到什麼？\n> (A) 它們在公開市場販售產品。\n> (B) 它們受到當地政府的補助。\n> (C) 它們種植多種不同的作物。\n> (D) 它們位於幾個國家。\n\n**Not/True True 問題**\n這是需要在文章中找到與關鍵字 Coffee Company's partner farms 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A)、(B)、(C) 在文中沒有提到。(D) 對應文中的「We have exclusive contracts with farms in\n\n<!-- page 054 -->\n\nGuatemala, Ethiopia, and Vietnam.」，表示 Hanlan's Coffee 公司和了瓜地馬拉、衣索比亞、越南的農場簽了契約，符合選項敘述，所以 (D) They are situated in several countries 是正確答案。\n\n**單字** subsidize (v.) 給……補助金；a number of (phr.) 許多的；crop (n.) 作物，農作物；situate (v.) 使……位於\n\n**167.** 答案 (B)｜難度：高\nWho does the Hanlan's Development Foundation mostly benefit?\n- (A) International agriculture researchers\n- (B) Coffee farmers' children\n- (C) Employees working abroad\n- (D) Members of a coffee growers' association\n\n> Hanlan's 開發基金會最主要對誰有益？\n> (A) 國際農業研究員\n> (B) 咖啡農的小孩\n> (C) 在國外工作的員工\n> (D) 咖啡農協會的成員\n\n**wh- 問題 Who**\n這是問 Hanlan's 開發基金會最主要對誰（Who）有益的 wh- 問題，所以要尋找和問題重點 the Hanlan's Development Foundation mostly benefit 相關的內容。「to give even more back to these communities, we have started the Hanlan's Development Foundation」和「The main goal is to make certain that all our workers' children are safe, healthy, and have the chance to go to school and receive a full education.」的部分顯示，為了回饋咖啡農場所在的社區，Hanlan's 公司創立了開發基金會，主要目標是讓咖啡農的小孩能夠安全、健康、上學並接受完整教育，所以 (B) Coffee farmers' children 是正確答案。\n\n**單字** benefit (v.) 對……有益；association (n.) 協會\n\n**168.** 🆕 答案 (D)｜難度：高\nIn which of the positions marked [1], [2], [3], and [4] does the following sentence best belong?\n\"By achieving this worthwhile objective, we'll be able to continue our efforts.\"\n- (A) [1]\n- (B) [2]\n- (C) [3]\n- (D) [4]\n\n> 以下這個句子最適合放在文中標記 [1]、[2]、[3]、[4] 的哪一個位置？\n> 「藉由達成這個值得努力的目標，我們將能夠持續進行我們的活動。」\n> (A) [1]\n> (B) [2]\n> (C) [3]\n> (D) [4]\n\n**找出句子位置**\n這是要依照文章的內容架構，判斷句子應該插入哪個位置的題目。題目所給的句子「By achieving this worthwhile objective, we'll be able to continue our efforts」表示藉由達成某個值得努力的目標，將能夠持續進行活動，所以應該接在提到 Hanlan's Coffee 公司計畫目標的內容之後。[4] 的上一句「The main goal is to make certain that all our workers' children are safe, healthy, and have the chance to go to school and receive a full education.」提到主要的目標是讓咖啡農的小孩安全、健康、能上學接受完整教育，而在 [4] 的位置插入句子之後，表示達成了這個目標就能持續進行活動，文意前後連貫，所以 (D) [4] 是正確答案。\n\n**單字** achieve (v.) 達成，達到；worthwhile (adj.) 值得做的，值得的；effort (n.)（為得到特定成果而做的集團組織性）活動，努力\n\n<!-- page 055 -->\n\n### Questions 169-171 refer to the following article.\n169-171 題參照以下報導。\n\n> Ping Software's Head Honored as Tech Woman of the Year\n>\n> By Carmen Marshall\n>\n> [170-C] Rebecca Curtis, CEO of software company Ping, has been named the most successful woman in the tech world by *Gadget Lover* magazine. [169-B/170-A] Ms. Curtis, who took over the company five years ago [170-A] and transformed it into a thriving multi-platform enterprise, is expected to deliver an acceptance speech at the *Gadget Lover* annual conference on December 2.\n>\n> Ms. Curtis's achievements as CEO have been widely celebrated. When she replaced the previous CEO, Mark Spalding, [169-D] Ping was mainly known for its word processing software. Due to the influx of new word-processing products, Ping's software was not selling as well as it once had. [170-D] Ms. Curtis quickly reversed that situation by developing a wide range of high-quality software including photo-editing and spreadsheet programs. Now the name \"Ping\" is notable for its cutting-edge, dependable technology.\n>\n> Over the next several years, Ms. Curtis says Ping will create a membership plan for its frequent users. [169-C/171] Those who sign up will be able to download new Ping products at a reduced rate. Ms. Curtis says the company also plans to redevelop its Web site. With all these plans ahead, Ping is expected to grow even more. Most experts agree that Ms. Curtis has been the primary reason behind the company's success.\n\n**翻譯**\n> Ping Software 公司領導人獲得年度女性科技人榮譽\n>\n> Carmen Marshall 撰文\n>\n> [170-C] Ping 軟體公司執行長 Rebecca Curtis 被《Gadget Lover》雜誌列名為科技界最成功的女性。[169-B/170-A] Curtis 女士五年前接掌公司，[170-A] 並且將公司轉變為茁壯成長的多平台企業，她預計將在 12 月 2 日於《Gadget Lover》年度會議發表得獎感言。\n>\n> Curtis 女士身為執行長的成就廣受讚譽。當她接替前任執行長 Mark Spalding 時，[169-D] Ping 公司主要以其文書處理軟體為人所知。由於新的文書處理產品湧入市場，使得 Ping 的軟體不如以往暢銷。[170-D] 藉由開發多樣的高品質軟體，包括相片編輯與試算表程式，Curtis 女士迅速扭轉了局勢。現在，「Ping」這個名字因為它先進、可靠的科技而聞名。\n>\n> 在未來幾年，Curtis 女士表示 Ping 公司將為經常使用者創立會員計畫。[169-C/171] 加入者將能夠以折扣價下載 Ping 公司的新產品。Curtis 女士表示，公司也計畫重新開發自家網站。由於這些預定的計畫，預期 Ping 公司將進一步成長。多數專家同意，Curtis 女士是公司成功背後的主因。\n\n**單字** name (v.) 指名，命名；(n.) 名字；take over (phr.) 接管，繼任；transform (v.) 轉變，使變形；thriving (adj.) 成功的，興盛的；enterprise (n.) 企業，公司；acceptance speech (phr.) 得獎感言；replace (v.) 接替……，取代；word processing (phr.) 文書處理；influx (n.) 湧入，流入；reverse (v.) 翻轉，逆轉；notable (adj.) 有名的，重要的；cutting-edge (adj.) 最尖端的；dependable (adj.) 可靠的；plan (n.) 計畫，方案；sign up (phr.) 註冊，報名；rate (n.) 比率，費率，速度；primary (adj.) 主要的\n\n**169.** 答案 (D)｜難度：高\nWhat is stated about Ping?\n- (A) It recently hired new systems programmers.\n- (B) It was founded five years ago.\n- (C) It offers free downloads to members.\n- (D) It was associated with a particular software type.\n\n> 關於 Ping 公司，文中敘述了什麼？\n> (A) 最近雇用了新的系統程式設計師。\n> (B) 成立於五年前。\n> (C) 提供會員免費下載。\n> (D) 以前讓人和一種特定軟體類型聯想在一起。\n\n**Not/True True 問題**\n這是需要在文章中找到與關鍵字 Ping 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A) 在文中沒有提到。和 (B) 相關的部分是「Ms. Curtis ~ took over the company five years ago」，表示 Curtis 女士五年前接管公司，當時公司已經存在了，而不是當時成立的，不符合選項敘述。和 (C) 相關的部分是「Those who sign up will be able to download new Ping products at a reduced rate.」，表示加入會員可以用折扣價下載 Ping 公司的新產品，而不是免費，不符合選項敘述。(D) 對應文中的「Ping was mainly known for its word\n\n<!-- page 056 -->\n\nprocessing software」，表示 Ping 公司過去主要以文書處理軟體為人所知，符合選項敘述，所以 (D) It was associated with a particular software type 是正確答案。\n\n**單字** found (v.) 設立，創立；associate (v.) 使有關聯，把……聯想在一起\n\n**170.** 答案 (B)｜難度：高\nWhat is NOT mentioned about Rebecca Curtis?\n- (A) She could be speaking at an upcoming conference.\n- (B) She was Ping's first female CEO.\n- (C) She was recognized by a magazine.\n- (D) She helped Ping expand its product line.\n\n> 關於 Rebecca Curtis，文中沒有提到什麼？\n> (A) 她可能在即將舉行的會議演說。\n> (B) 她是 Ping 公司第一位女性執行長。\n> (C) 她獲得雜誌表揚。\n> (D) 她幫助 Ping 公司拓展產品線。\n\n**Not/True Not 問題**\n這是需要在文章中找到與關鍵字 Rebecca Curtis 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A) 對應文中的「Ms. Curtis ~ is expected to deliver an acceptance speech at the *Gadget Lover* annual conference」，表示預料 Curtis 女士將在《Gadget Lover》雜誌的年度會議發表得獎感言，符合選項敘述。(B) 在文中沒有提到，所以 (B) She was Ping's first female CEO 是正確答案。(C) 對應文中的「Rebecca Curtis ~ has been named the most successful woman in the tech world by *Gadget Lover* magazine.」，表示 Rebecca Curtis 被《Gadget Lover》雜誌列名為科技界最成功的女性，符合選項敘述。(D) 對應文中的「Ms. Curtis ~ reversed that situation by developing a wide range of high-quality software including photo-editing and spreadsheet programs.」，表示 Curtis 女士藉由開發照片編輯、試算表等多樣的軟體而逆轉了情況，符合選項敘述。\n\n**替換表達**\ndeliver ~ speech 發表演說 → be speaking 演說\nhas been named the most successful woman 被列名為最成功的女人 → was recognized 受到表揚\ndeveloping a wide range of high-quality software 開發多樣的高品質軟體 → expand its product line 拓展產品線\n\n**單字** upcoming (adj.) 即將到來的；recognize (v.) 認可，表彰；expand (v.) 擴展\n\n**171.** 答案 (C)｜難度：中\nAccording to the article, what is expected to happen at Ping Software?\n- (A) It will develop a hardware product.\n- (B) Its Web site will be closed down permanently.\n- (C) It will offer programs at lower prices.\n- (D) It will merge with another company.\n\n> 根據這篇報導，預期 Ping Software 公司會發生什麼事？\n> (A) 它會開發硬體產品。\n> (B) 它的網站會永久關閉。\n> (C) 它會用較低的價格提供軟體程式。\n> (D) 它會和另一家公司合併。\n\n**wh- 問題 What**\n這是問 Ping Software 公司會發生什麼（What）的 wh- 問題，所以要尋找和問題重點 happen at Ping Software 相關的內容。「Those who sign up will be able to download new Ping products at a reduced rate.」的部分顯示，加入會員的人可以用折扣價下載 Ping 公司的新產品，所以 (C) It will offer programs at lower prices 是正確答案。\n\n**替換表達**\nreduced rate 折扣價 → lower prices 較低的價格\n\n**單字** close down (phr.) 關閉，停業；permanently (adv.) 永久地；merge (v.) 合併\n\n<!-- page 057 -->\n\n### Questions 172-175 refer to the following report.\n172-175 題參照以下報告。\n\n> City Trends Report — Valencia\n>\n> [172] Tourism numbers in Valencia have been increasing for three years running as people are beginning to discover this often underrated city on the eastern coast of Spain. At the beginning of the survey period, the city received just under a million visitors a year, but the latest figures show this has jumped to over 1.4 million.\n>\n> [172] There are a number of factors that can account for this change. [173-A] The new Sanchez Museum of Iberian Art and its nearby conference facilities have proven to be a big draw since opening last year. And [173-D/174-C] updates to rail services from Valencia to Madrid and Barcelona have reduced travel time significantly. With a major airport expansion due to be completed before the end of the year, things are expected to get even better for Valencia.\n>\n> In addition, [173-C] the city government's launch of an international advertising campaign two years ago has also proved beneficial. The city was marketed by television, print, and social media as a tourism destination. Reaction to the campaign continues to be positive.\n>\n> Finally, as well as its attraction to tourists and business visitors, Valencia is increasingly being recognized as an excellent place to live. [174-A/175] The consultancy Apollo and Company recently put the city in third place in a report measuring the quality of life in small European cities. [175] They cited its lovely waterfront location, low housing costs, and modern infrastructure as reasons for its high place.\n\n**翻譯**\n> 城市趨勢報告－瓦倫西亞\n>\n> [172] 瓦倫西亞的觀光數字已經連續三年上升，因為人們正開始發現這個經常被輕視的西班牙東岸城市。在調查期初，這座城市的觀光客一年還不到 100 萬人，但最新數字顯示觀光客人數已經躍升到 140 多萬。\n>\n> [172] 有一些因素可以解釋這個改變。自從去年開幕後，[173-A] 新的 Sanchez 伊比利美術館及附近的會議設施已經證明非常能夠吸引人潮。而且 [173-D/174-C] 瓦倫西亞至馬德里及巴塞隆納的鐵路服務升級，顯著減少了旅行時間。伴隨著預計在年底前完工的機場大幅擴建，預期瓦倫西亞的情況還會更好。\n>\n> 此外，[173-C] 市政府兩年前開始進行國際廣告宣傳活動，結果也證明有所助益。經由電視、出版品、社群媒體，將這個城市作為觀光目的地來行銷。宣傳活動持續獲得正面的反應。\n>\n> 最後，除了對觀光客及商務旅客的吸引力以外，瓦倫西亞也越來越被認為是非常適合居住的地方。[174-A/175] Apollo and Company 顧問公司最近在一份評估歐洲小型城市生活品質的報告中，將這個城市列為第三名。[175] 他們指出，瓦倫西亞美好的濱海位置、低房價和現代的基礎建設是獲得高名次的原因。\n\n**單字** tourism (n.) 觀光，觀光業；running (adj.) 連續的；underrate (v.) 評價過低，低估；figure (n.) 數值，人物；(v.) 計算；account (v.) 說明，解釋；draw (n.) 吸引人的事物；(v.) 拉；update (n.) 更新；(v.) 更新；rail service (phr.) 鐵路服務；significantly (adv.) 顯著地，相當地；expansion (n.) 擴張，擴大；due (adj.) 預計……的；before the end of the year (phr.) 在今年底前；launch (n.) 開始，上市；(v.) 開始，使上市；market (v.) 銷售，行銷；(n.) 市場，消費群體；reaction (n.) 反應；beneficial (adj.) 有益的，有利的；destination (n.) 目的地，目標；consultancy (n.) 顧問公司；attraction (n.) 吸引力，名勝景點；increasingly (adv.) 越來越；waterfront (n.) 水岸地區；measure (v.) 測量，評價；cite (v.) 引用，舉出（理由、例子）；infrastructure (n.) 基礎建設\n\n<!-- page 058 -->\n\n**172.** 答案 (D)｜難度：低\nWhat is the report mainly about?\n- (A) Campaigns to make a city more liveable\n- (B) Upgrades to an international conference facility\n- (C) Changes to a government's building codes\n- (D) Improvements to a city's tourism industry\n\n> 這份報告主要是關於什麼？\n> (A) 使城市更適合居住的活動\n> (B) 國際會議設施的升級\n> (C) 政府建築法規的變更\n> (D) 城市觀光業的改善\n\n**尋找主題／目的 文章的主題**\n這是詢問報告主題的問題，所以要特別注意文章開頭的部分。「Tourism numbers in Valencia have been increasing for three years running」提到瓦倫西亞的觀光數字連續三年增加，而「There are a number of factors that can account for this change.」提到有一些因素可以解釋這個改變，接下來說明觀光客增加的原因，所以 (D) Improvements to a city's tourism industry 是正確答案。\n\n**單字** liveable (adj.) 適合居住的；code (n.) 法規，代碼，密碼\n\n**173.** 答案 (B)｜難度：中\nWhat is NOT mentioned as a reason for the figure increase?\n- (A) A new museum facility\n- (B) An updated tax system\n- (C) A marketing campaign\n- (D) A shorter transit time\n\n> 什麼不是文章中提到數字增加的原因？\n> (A) 新的博物館設施\n> (B) 更新的稅制\n> (C) 行銷活動\n> (D) 較短的運輸時間\n\n**Not/True Not 問題**\n這是需要在文章中找到與關鍵字 a reason for the figure increase 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A) 對應文中的「The new Sanchez Museum of Iberian Art ~ have proven to be a big draw」，表示新的 Sanchez 伊比利美術館吸引了很多人，符合選項敘述。(B) 在文中沒有提到，所以 (B) An updated tax system 是正確答案。(C) 對應文中的「the city government's launch of an international advertising campaign ~ has also proved beneficial」，表示政府的國際宣傳活動有所助益，符合選項敘述。(D) 對應文中的「updates to rail services from Valencia to Madrid and Barcelona have reduced travel time significantly」，表示鐵路服務的更新明顯減少了從瓦倫西亞到馬德里和巴塞隆納的時間，符合選項敘述。\n\n**替換表達**\nadvertising campaign 廣告宣傳活動 → marketing campaign 市場行銷活動\nreduced travel time 減少的旅行時間 → A shorter transit time 較短的運輸時間\n\n**單字** transit (n.) 運輸，（航程中的）過境\n\n<!-- page 059 -->\n\n**174.** 答案 (C)｜難度：中\nWhat is indicated about Madrid?\n- (A) It was selected by a consultancy as having a high quality of life.\n- (B) It was less popular with tourists than Barcelona for three years.\n- (C) Its transportation time from Valencia has been shortened.\n- (D) Its city council hired a firm to develop a marketing strategy.\n\n> 關於馬德里，文中提到什麼？\n> (A) 獲得顧問公司選為擁有高生活品質的城市。\n> (B) 過去有三年時間不像巴塞隆納那麼受旅客歡迎。\n> (C) 從瓦倫西亞到馬德里的運輸時間縮短了。\n> (D) 馬德里市政府雇用了公司來發展行銷策略。\n\n**Not/True True 問題**\n這是需要在文章中找到與關鍵字 Madrid 相關的資訊，並且與選項敘述對照的 Not/True 問題。和 (A) 相關的部分是「The consultancy Apollo and Company recently put the city in third place in a report measuring the quality of life in small European cities.」，表示 Apollo and Company 顧問公司在評價歐洲小型城市的報告中將瓦倫西亞名列第三，但沒有提到馬德里，不符合文章敘述。(B) 在文中沒有提到。(C) 對應文中的「updates to rail services from Valencia to Madrid ~ have reduced travel time significantly」，表示瓦倫西亞到馬德里的鐵路服務更新使得旅行時間顯著減少，符合文章敘述，所以 (C) Its transportation time from Valencia has been shortened 是正確答案。(D) 在文中沒有提到。\n\n**單字** shorten (v.) 縮短；strategy (n.) 戰略，策略\n\n**175.** 答案 (C)｜難度：高\nWhy was Valencia ranked in third place?\n- (A) It is popular with business travelers.\n- (B) It recently updated its waterfront location.\n- (C) It offers residents affordable homes.\n- (D) It schedules a lot of outdoor activities.\n\n> 為什麼瓦倫西亞排名第三？\n> (A) 它很受商務旅客歡迎。\n> (B) 它最近更新了海岸地區。\n> (C) 它提供居民買得起的房子。\n> (D) 它安排許多戶外活動。\n\n**wh- 問題 Why**\n這是問瓦倫西亞為什麼（Why）排名第三的 wh- 問題，所以要尋找和問題重點 Valencia ranked in third place 相關的內容。「The consultancy ~ put the city in third place in a report measuring the quality of life in small European cities.」的部分顯示，Apollo and Company 顧問公司在評價歐洲小型城市的報告中將瓦倫西亞名列第三，而「They cited ~ low housing costs ~ as reasons for its high place.」的部分顯示，他們列出的原因包含低房價，所以 (C) It offers residents affordable homes 是正確答案。\n\n**替換表達**\nlow housing costs 低房價 → affordable homes 買得起的房子\n\n**單字** rank (v.) 評級，處於某個等級；(n.) 等級，階級；affordable (adj.) 可負擔的，買得起的；schedule (v.) 預定，安排；(n.) 時間表，行程\n\n<!-- page 060 -->\n\n### Questions 176-180 refer to the following letter and e-mail.\n176-180 題參照以下信件與電子郵件。\n\n**文章 1**\n\n> Maxfield Financial Group\n>\n> May 10\n>\n> Bethany Aldridge\n> 18 Juniper Road\n> Westport, CT 06880\n>\n> Dear Ms. Aldridge,\n>\n> [176] This letter is in response to your request to sign up for paperless statements. Your statements will now be sent via e-mail on the 25th of each month. [177-C] All such statements will also be accessible from your online account, and you will be able to print them at your convenience. [177-D] They will contain all of the same information that is included in your paper statements. In order to protect your account details, please ensure that the device you use to download and save your paperless statements is secure.\n>\n> [178] If you would like a paper statement mailed to your primary address in addition to the paperless one, log on to your account and check the \"Mail my Statement\" box under \"Delivery Preferences.\" Keep in mind that [180] Maxfield Financial Group does charge an annual fee of $24 to clients who choose to receive paper statements. If you would like to stop receiving paperless statements and revert back to mailed paper statements only, return to your account and uncheck \"E-mail my Statement.\"\n>\n> Best regards,\n>\n> Customer Service\n> Maxfield Financial Group\n\n**翻譯**\n> Maxfield Financial Group 公司\n>\n> 5 月 10 日\n>\n> Bethany Aldridge\n> 18 號，Juniper 路\n> 威斯特波特，康乃狄克州 06880\n>\n> 親愛的 Aldridge 小姐：\n>\n> [176] 這封信是要回覆您申請無紙化對帳單的要求。您的對帳單現在起將於每月 25 日以電子郵件寄送。[177-C] 電子對帳單也可以從您的
