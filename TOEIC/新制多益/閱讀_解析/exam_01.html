accessible (adj.) 可得的，可利用的；secure (adj.) 安全的，穩當的；revert (v.) 回復，恢復\n文章 2：electronic (adj.) 電子的；make sure (phr.) 務必做…；section (n.) 部分；payment (n.) 付款；current (adj.) 最新的，現在的；block (v.) 阻隔，阻斷；notification (n.) 通知；postal address (phr.) 郵寄地址；receipt (n.) 收到，收據\n\n**176.** 答案 (B)｜難度：高\nWhy was the letter written?\n- (A) To describe the steps necessary to obtain a card\n- (B) To inform a customer of a change in correspondence\n- (C) To alert an online banking user of unusual transactions\n- (D) To offer receipt recycling policy details to an account holder\n\n> 為什麼寫了這封信件？\n> (A) 為了描述獲得卡片的必要步驟\n> (B) 為了通知顧客通信上的變更\n> (C) 為了警告網路銀行使用者有不正常交易\n> (D) 為了提供收據回收政策的細節給帳戶持有人\n\n**尋找主題／目的** 寫文章的理由\n這是詢問寫信理由的問題，所以要看信件（第一篇文章）的內容。信件中的「This letter is in response to your request to sign up for paperless statements. Your statements will now be sent via e-mail」提到，這封信是要回覆申請無紙對帳單的要求，並且告知對帳單將以電子郵件寄送，然後說明關於無紙對帳單的事項，所以 (B) To inform a customer of a change in correspondence 是正確答案。\n\n**替換表達** statements 明細表 → correspondence 通信，信件\n\n**單字** correspondence (n.) 通信，信件；alert (v.) 使警覺，使注意；transaction (n.) 交易，處理；account holder (phr.) 帳戶持有人\n\n**177.** 答案 (C)｜難度：中\nWhat is stated about paperless statements in the letter?\n- (A) They must be retained by recipients for tax purposes.\n- (B) They require an assigned password to open.\n- (C) They can be accessed from an online account at anytime.\n- (D) They contain less detail than the paper documents that are mailed.\n\n> 關於無紙對帳單，信件中敘述了什麼？\n> (A) 由於稅務上的理由，收件人必須保留。\n> (B) 需要指定的密碼來開啟。\n> (C) 可以隨時從網路帳戶取得。\n> (D) 包含的細節比郵寄的紙本文件少。\n\n**Not/True** True 問題\n這是需要在信件中找到與關鍵字 paperless statements 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A)、(B) 在文中沒有提到。(C) 對應文中的「All such statements will ~ be accessible from your online account and you will be able to print them at your convenience.」，表示所有電子（無紙）對帳單都可以從線上帳戶自由取得並列印，符合選項敘述，所以 (C) They can be accessed from an online account at anytime 是正確答案。和 (D) 相關的部分是「will contain all of the same information that is included in your paper statements」，表示無紙對帳單會包含所有和紙本對帳單相同的內容，不符合選項敘述。\n\n**替換表達** be accessible ~ at ~ convenience 可以自由取得 → can be accessed ~ at anytime 可以隨時取得\n\n**單字** retain (v.) 保留，保持；recipient (n.) 收件人；assign (v.) 指定，分配；document (n.) 文件\n\n<!-- page 062 -->\n\n**178.** 答案 (C)｜難度：中\nAccording to the letter, how can print copies of statements be requested?\n- (A) By e-mailing the service center\n- (B) By calling the accounts department\n- (C) By selecting an option online\n- (D) By faxing a request form\n\n> 根據信件，要怎樣申請對帳單的（實體）列印複本？\n> (A) 寄電子郵件給服務中心\n> (B) 打電話給會計部門\n> (C) 在網路上選擇選項\n> (D) 傳真申請表\n\n**wh- 問題 How**\n這是問根據信件內容，要怎樣（How）申請實體對帳單的 wh- 問題。題目的關鍵是 print copies of statements be requested，文中相關部分是「If you would like a paper statement ~ log on to your account and check the \"Mail my Statement\" box」，表示如果想要紙本對帳單的話，要登入帳戶並勾選「郵寄我的對帳單」，所以 (C) By selecting an option online 是正確答案。\n\n**179.** 答案 (D)｜難度：中\nWhy has Ms. Aldridge been asked to check her digital statement?\n- (A) It includes an important notification.\n- (B) It has the incorrect contact information.\n- (C) It shows some additional charges for services.\n- (D) It is the first one she has received.\n\n> 為什麼 Aldridge 小姐被要求查看她的數位對帳單？\n> (A) 對帳單內含重要通知。\n> (B) 對帳單有錯誤的聯絡資訊。\n> (C) 對帳單顯示一些額外的服務費用。\n> (D) 這是她收到的第一份數位對帳單。\n\n**wh- 問題 Why**\n這是問 Aldridge 小姐為什麼（Why）被要求查看數位對帳單的 wh- 問題，所以要尋找和問題重點 Ms. Aldridge been asked to check ~ digital statement 相關的內容。第二篇文章（電子郵件）中「As this is the first electronic statement that has been sent to you, please review it carefully」的部分顯示，因為這是寄給收件人 Aldridge 小姐的第一份電子對帳單，所以請她仔細檢查，(D) It is the first one she has received 是正確答案。\n\n**單字** incorrect (adj.) 不正確的，錯誤的；additional (adj.) 額外的；charge (n.) 費用，控告；(v.) 收費\n\n**180.** 答案 (D)｜難度：高\nWhat can be inferred about Ms. Aldridge?\n- (A) She notified a financial provider of an address change.\n- (B) She must submit a complete payment within seven days.\n- (C) She reported an error found on a monthly statement.\n- (D) She paid a yearly charge to Maxfield Financial Group.\n\n> 關於 Aldridge 小姐，可以推知什麼？\n> (A) 她向金融服務提供者通知了地址變更。\n> (B) 她必須在七天內全額付款。\n> (C) 她回報了每月對帳單上發現的錯誤。\n> (D) 她付了年費給 Maxfield Financial Group 公司。\n\n**推論** 多篇文章綜合題\n這是必須參考兩篇文章內容的多篇文章綜合題。首先確認寄給題目關鍵字 Ms. Aldridge 的電子郵件（第二篇文章）內容。\n\n第二篇文章（電子郵件）中的「We have received your payment, and your copy will arrive via mail ~.」提到，寄件方（也就是 Maxfield Financial Group 公司）已經收到 Aldridge 小姐的付款，而某個文件會以郵寄方式寄達，這是第一個線索。但是，這裡沒有具體說明所付的款項和得到的文件是什麼，所以還需要在第一篇文章（信件）中確認。第一篇文章中的「Maxfield Financial Group does charge an annual fee ~ to clients who choose to receive paper statements」提到，Maxfield Financial Group 公司會向選擇收到紙本對帳單的客戶收取年費，這是第二個線索。\n\n綜合「Maxfield Financial Group 公司收到 Aldridge 小姐的付款，並且會郵寄文件」和「Maxfield Financial Group 公司會向選擇收到紙本對帳單的客戶收取年費」這兩個線索，可以推知 Aldridge 小姐為了得到紙本對帳單而付了年費。所以答案是 (D) She paid a yearly charge to Maxfield Financial Group。\n\n**替換表達** an annual fee 年度費用 → a yearly charge 每年的收費\n\n**單字** notify (v.) 通知，告知；provider (n.) 提供者，提供機構\n\n<!-- page 063 -->\n\n### Questions 181-185 refer to the following announcement and schedule.\n181-185 題參照以下公告與時間表。\n\n文章 1\n\n> **Announcement for Woodlands Business Owners:**\n>\n> The Woodlands Merchants Association is planning to host Thursday evening concerts on the Center Square lawn from May 28 through July 2, from 6 p.m. until 9 p.m. We have held the concerts over the past few years and have had a good turnout every time. However, these events do entail a significant expense for the association, as we most pay our performers. As a result, [181]we are offering local businesses the opportunity to sponsor a concert. This will help the association to control costs while promoting your stores or shops to the public.\n>\n> A sponsorship includes a banner with your business name on it that will be attached to the performance stage. [183]You have the option of setting up a promotional booth on the lawn and are allowed to hand out flyers or give away coupons and product samples. [185]Those sponsoring a concert for $500 or more will also have their business's name, logo, and contact information printed with event advertisements in *The Woodlands Times* newspaper.\n>\n> [182]The Woodlands Merchants Association aims to bring together the business community and local residents, and the sponsored concerts will be an enjoyable way to achieve that goal. If you would like to participate, contact the event coordinator, Dan Perry, at DanPerry@woodlandsmerchantsassn.com to finalize the sponsorship arrangements.\n\n**翻譯**\n> **給伍德蘭市企業主的公告：**\n>\n> 伍德蘭市商人協會計畫從 5 月 28 日到 7 月 2 日的每週四在中央廣場草坪舉辦晚間音樂會。我們過去幾年都舉辦了音樂會，每次參加人數都很不錯。然而這些活動需要協會的大量經費，因為我們付大部分的錢給演出者。因此，[181]我們提供本地業者贊助音樂會的機會。這將有助於協會控制開銷，同時也能向大眾宣傳您的店鋪。\n>\n> 贊助內容包括將掛在表演舞台、有貴企業名稱的廣告布條。[183]您可以選擇在草坪設置宣傳攤位，也可以發放傳單或發送折價券及試用品。[185]贊助音樂會達 500 美元以上的企業，該企業的名稱、標誌、聯絡資訊還會一併刊登在《The Woodlands Times》報紙上的活動廣告。\n>\n> [182]伍德蘭市商人協會的目標是將商業社群和本地居民結合在一起，而贊助音樂會是達到這個目標的愉快方法。如果您想參與，請寄到 DanPerry@woodlandsmerchantsassn.com 聯絡活動籌辦人 Dan Perry，以完成贊助的安排。\n\n文章 2\n\n> **Woodlands Merchants Association Summer Concert Schedule**\n>\n> [183]Below is the concert schedule. Sponsorship rates were determined by the cost of the performer or band. Each sponsorship package includes a banner and one promotional booth if desired. [183]Co-sponsorship by two companies is also permissible. [184]Any distributed items are not part of the listed cost and must be paid for by the sponsor. Sponsors must be current members of the Woodlands Merchants Association.\n>\n> | Date | Performer or Band | Style of Music | Sponsorship Cost |\n> |---|---|---|---|\n> | May 28 | [185-D]Pearson Trio | Jazz | [185-D]$450 |\n> | June 4 | Amy Evans | Children's Folk | $150 |\n> | June 11 | [185-A]Throwback | 1950's Pop | [185-A]$500 |\n> | June 18 | [185-C]University Chorus* | Broadway Tunes | [185-C]$550 |\n> | June 25 | [185-B]Treble Trouble | Dance and Pop | [185-B]$550 |\n> | July 2 | Joe Thomas* | Blues | $150 |\n>\n> *Contract not yet signed. Performers subject to change.\n\n**翻譯**\n> **伍德蘭市商人協會夏季音樂會日程表**\n>\n> [183]下表為音樂會日程表。贊助費依表演者或樂團費用而定。如有需要，贊助方案皆包括廣告布條及一個宣傳攤位。[183]亦可由兩家公司共同贊助。[184]所有發放物品皆不包含於表列費用中，必須由贊助者支付。贊助者須為伍德蘭市商人協會現行會員。\n>\n> | 日期 | 表演者或樂團 | 音樂風格 | 贊助費用 |\n> |---|---|---|---|\n> | 5 月 28 日 | [185-D]Pearson Trio | 爵士 | [185-D]450 美元 |\n> | 6 月 4 日 | Amy Evans | 兒童民謠 | 150 美元 |\n> | 6 月 11 日 | [185-A]Throwback | 1950 年代流行樂 | [185-A]500 美元 |\n> | 6 月 18 日 | [185-C]University Chorus* | 百老匯歌曲 | [185-C]550 美元 |\n> | 6 月 25 日 | [185-B]Treble Trouble | 舞曲和流行樂 | [185-B]550 美元 |\n> | 7 月 2 日 | Joe Thomas* | 藍調 | 150 美元 |\n>\n> *合約尚未簽訂。表演者可能有異動。\n\n<!-- page 064 -->\n\n**單字** 文章 1：turnout (n.) 到場人數，參加投票人數；expense (n.) 費用，支出；promote (v.) 宣傳，促進；hand out (phr.) 分發；arrangement (n.) 安排，準備；entail (v.) 隨之產生…，需要；sponsor (v.) 贊助；(n.) 贊助者；banner (n.) 廣告橫幅，廣告布條；give away (phr.) 分發，送出；significant (adj.) 相當多的，重要的；control (v.) 控制，控管；(n.) 控制；attach (v.) 貼上，附加；aim (v.) 以什麼為目標；(n.) 目標\n文章 2：rate (n.) 費用，比率，速度；folk (n.) 民謠；(adj.) 民俗的；permissible (adj.) 可允許的；tune (n.) 曲子，旋律；distribute (v.) 分配，分發\n\n**181.** 答案 (D)｜難度：中\nWhat is the announcement mainly about?\n- (A) A request for performers for a concert series\n- (B) A revised policy regarding advertising materials\n- (C) A campaign to increase membership in a group\n- (D) A promotional opportunity for local establishments\n\n> 公告主要是關於什麼？\n> (A) 系列音樂會的演出者徵求\n> (B) 關於廣告物的修訂政策\n> (C) 為了增加團體會員的宣傳活動\n> (D) 本地機構的宣傳機會\n\n**尋找主題／目的** 文章的主題\n這是詢問公告主要關於什麼的問題，所以要看公告（第一篇文章）的內容。公告中的「we are offering local businesses the opportunity to sponsor a concert. This will help ~ promoting your stores or shops to the public.」提到，要提供本地企業贊助音樂會的機會，而這有助於宣傳店鋪，接下來說明音樂會中可以進行的宣傳方式，所以 (D) A promotional opportunity for local establishments 是正確答案。\n\n**替換表達** local businesses 本地企業 → local establishments 本地機構\n\n**單字** revise (v.) 修訂，修改；policy (n.) 政策；regarding (prep.) 關於…；advertising material (phr.) 廣告物；establishment (n.) 機構，企業，創立\n\n**182.** 答案 (B)｜難度：高\nAccording to the announcement, what is a goal of the event?\n- (A) Increasing economic activity in a town\n- (B) Fostering interaction between businesses and citizens\n- (C) Recognizing the creative talents of local performers\n- (D) Raising money for a charity program\n\n> 根據公告，活動的目標是什麼？\n> (A) 增加市內經濟活動\n> (B) 促進企業與市民的互動\n> (C) 表彰當地表演者的創意天分\n> (D) 為慈善計畫募款\n\n**wh- 問題 What**\n這是問根據公告，活動的目標是什麼（What）的 wh- 問題，所以要確認公告（第一篇文章）中的相關內容。公告中的「The Woodlands Merchants Association aims to bring together the business community and local residents, and the sponsored concerts will be ~ way to achieve that goal.」提到，伍德蘭市商人協會的目標是將商業社群和本地居民結合在一起，而贊助音樂會是達到這個目標的方法，所以 (B) Fostering interaction between businesses and citizens 是正確答案。\n\n**替換表達** bring together the business community and local residents 將商業社群和本地居民結合在一起 → Fostering interaction between businesses and citizens 促進企業與市民的互動\n\n**單字** activity (n.) 活動，活動力；foster (v.) 增進，促進；interaction (n.) 互動；citizen (n.) 市民，居民；talent (n.) 天才，天賦；charity (n.) 慈善\n\n<!-- page 065 -->\n\n**183.** 答案 (C)｜難度：最高\nWhat is suggested about the evening concerts?\n- (A) Poor weather conditions may cause them to be held indoors.\n- (B) They are paid for partly by donations gathered from the audiences.\n- (C) Cosponsors can distribute flyers and samples at them.\n- (D) They will take place for the first time at Center Square this year.\n\n> 關於晚間音樂會，文中顯示什麼？\n> (A) 天候不佳可能使音樂會改在室內舉辦。\n> (B) 部分費用是由向觀眾收取的捐款支付的。\n> (C) 共同贊助者可以發放傳單和試用品。\n> (D) 今年將於中央廣場首度舉辦。\n\n**推論** 多篇文章綜合題\n這是必須參考兩篇文章內容的多篇文章綜合題。首先看與題目關鍵字 the evening concerts 有關的日程表（第二篇文章）中的相關內容。\n\n第二篇文章（日程表）中的「Below is the concert schedule.」和「Co-sponsorship by two companies is also permissible.」顯示音樂會可以由兩間公司共同贊助，這是第一個線索。但是，這裡沒有提到贊助者可以做什麼，所以還需要在第一篇文章（公告）中確認。第一篇文章中的「You ~ are allowed to hand out flyers or give away coupons and product samples.」顯示公告的讀者（也就是可能的贊助者）可以發放傳單或發送折價券及試用品，這是第二個線索。綜合「音樂會可以由兩間公司共同贊助」和「贊助者可以發放傳單或發送折價券及試用品」這兩個線索，可以推知共同贊助者能在音樂會發送傳單、折價券、試用品。所以答案是 (C) Cosponsors can distribute flyers and samples at them。\n\n**單字** poor weather condition (phr.) 不好的天氣狀況；indoors (adv.) 在室內；partly (adv.) 部分地；donation (n.) 捐款，捐獻；audience (n.) 觀眾，聽眾；cosponsor (n.) 共同贊助者\n\n**184.** 答案 (A)｜難度：中\nWhat are sponsors required to do?\n- (A) Cover the cost of handouts\n- (B) Finalize concert schedules\n- (C) Provide samples of products\n- (D) Sign contracts with performers\n\n> 贊助者必須做什麼？\n> (A) 負擔傳單的費用。\n> (B) 完成音樂會日程表。\n> (C) 提供產品的試用品。\n> (D) 和表演者簽約。\n\n**wh- 問題 What**\n這是問贊助者必須做什麼（What）的 wh- 問題，所以要尋找和問題重點 sponsors required to do 相關的內容。第二篇文章（日程表）中「Any distributed items are not part of the listed cost and must be paid for by the sponsor.」的部分顯示，發放的東西不包括在表列費用內，必須由贊助者支付，所以 (A) Cover the cost of handouts 是正確答案。\n\n**單字** cover (v.) 負擔，覆蓋；handout (n.) 傳單，講義；finalize (v.) 完成，最後確定\n\n<!-- page 066 -->\n\n**185.** 答案 (D)｜難度：高\nFor which concert would sponsors NOT have their details printed in the local newspaper?\n- (A) Throwback\n- (B) Treble Trouble\n- (C) University Chorus\n- (D) Pearson Trio\n\n> 哪場音樂會的贊助商詳細資料不會印在當地報紙上？\n> (A) Throwback\n> (B) Treble Trouble\n> (C) University Chorus\n> (D) Pearson Trio\n\n**Not/True** 多篇文章綜合題\n這是需要在文章中找到與關鍵字 sponsors ~ have their details printed in the local newspaper 相關的資訊，並且與選項敘述對照的 Not/True 問題，首先確認提到當地報紙相關內容的第一篇文章（公告）。\n\n由第一篇文章中的「Those sponsoring a concert for $500 or more will also have their business's name, logo, and contact information printed ~ in *The Woodlands Times* newspaper.」可知，贊助音樂會達 500 美元以上的企業，企業名稱、標誌、聯絡資訊會被刊登在《The Woodlands Times》報紙的廣告上，這是第一個線索。但是，這裡沒有提到各演唱會的贊助費用，所以還需要在第二篇文章中確認。第二篇文章中的「Pearson Trio, $450, Throwback, $500, University Chorus, $550, Treble Trouble, $550」顯示 Pearson Trio 的演唱會贊助費用是 450 美元、Throwback 是 500 美元、University Chorus 是 550 美元、Treble Trouble 是 550 元，這是第二個線索。\n\n綜合「贊助音樂會達 500 美元以上的企業，名稱、標誌、聯絡資訊會刊登在《The Woodlands Times》報紙的廣告上」和「Throwback、University Chorus、Treble Trouble 的演唱會贊助費用在 500 美元以上」這兩個線索，可以推知這三場演唱會的贊助商詳細資料會刊登在當地報紙上，(A)、(B)、(C) 符合文章敘述。Pearson Trio 的演唱會贊助費用是 450 美元，可以推知 Pearson Trio 的演唱會贊助商詳細資料不會刊登在報紙廣告上，所以 (D) Pearson Trio 是正確答案。\n\n<!-- page 067 -->\n\n### Questions 186-190 refer to the following article, Web page, and e-mail. 🆕\n186-190 題參照以下報導、網頁及電子郵件。\n\n文章 1\n\n> **Gunton City Council to Consider Blandfolk Superstore Proposal**\n>\n> [186]At a Gunton City Council meeting on May 2, members listened to a presentation from representatives of Blandfolk Superstore about building a branch locally. The retail giant proposed erecting an outlet measuring 9,500 square meters just within city limits on Medford Avenue. However, the chosen land has not yet been authorized for commercial establishments, so Blandfolk has requested that the property be rezoned. [187]Gunton mayor Claire O'Rourke told representatives that the council would discuss the proposition this month and address it at their next meeting in June. A spokesperson for Blandfolk said the corporation hopes the proposal will pass, emphasizing that the development would provide employment for up to 190 local residents.\n\n**翻譯**\n> **Gunton 市議會將考慮 Blandfolk Superstore 的提案**\n>\n> [186]在 Gunton 市議會 5 月 2 日的會議中，議員聽取 Blandfolk Superstore 的代表關於在當地建設分店的簡報。這家零售業巨人提出在正好位於該市邊界內的 Medford 大街建設面積達 9,500 平方公尺的賣場的計畫。然而，選中的土地尚未獲准建設商業設施，所以 Blandfolk 公司要求對土地重新分區。[187]Gunton 市長 Claire O'Rourke 告訴（公司的）代表，議會將於本月討論此提案，並且在六月的下一次會議處理此事。Blandfolk 公司發言人表示，公司希望提案通過，並強調開發案最多將提供當地居民 190 個工作機會。\n\n文章 2\n\n> ***Gunton Herald***\n> www.guntonherald.com\n>\n> Home | News | Sports | Business | Entertainment | Lifestyle | **Opinion** | Contact Us\n>\n> **Readers' Comments**\n> *Ronald Pinero posted on May 7:*\n> [187]I am writing in regard to an article printed in your newspaper's May 3 edition about the construction proposal from Blandfolk Superstore. As a long-time business owner in Gunton, I am concerned. [190]I manage Ballas Boutique, a clothing store in the downtown area, and many of my friends and business acquaintances also operate private shops in the city. Large corporate retailers have forced many smaller stores out of business in other locations where they have opened, even when such establishments have been situated on the outskirts of towns. I'm not sure most businesses like mine will be able to compete without significantly dropping prices and, by extension, the quality of our goods. For now, Gunton is a very vibrant and diverse city, and [187]I hope the mayor and council members will reject the proposal in order to keep it that way.\n\n**翻譯**\n> ***Gunton Herald* 報紙**\n> www.guntonherald.com\n>\n> 首頁 | 新聞 | 運動 | 商業 | 娛樂 | 生活風格 | **意見** | 聯絡我們\n>\n> **讀者留言**\n> *Ronald Pinero 發表於 5 月 7 日：*\n> [187]我要針對貴報 5 月 3 日關於 Blandfolk Superstore 建設提案的報導發表意見。身為 Gunton 市長年以來的企業主，我很擔心。[190]我經營市中心區的服裝店 Ballas Boutique，我的許多朋友和商業界認識的人也在市內經營個人商店。在大型零售業者開設的其他地點，它們已經迫使許多較小的商店結束營業，即使這些據點設立於市郊區域也是一樣。我不確定大部分像我的店一樣的業者能否不靠大幅降價、甚至降低產品品質與其競爭。目前 Gunton 市是非常有活力而多元的城市，所以[187]我希望市長和議員否決這個提案，以保持本市目前的樣子。\n\n文章 3\n\n> TO: Ronald Pinero <rpinero@dailymaily.com>\n> FROM: Adeline Morris <amorris@guntoncoc.org>\n> SUBJECT: Request from Gunton COC\n> DATE: May 8\n>\n> Dear Mr. Pinero,\n>\n> I came across your comments on the *Gunton Herald* Web site. Your concern is something the board of the Gunton Chamber of Commerce has been discussing, and [190]we\n\n**翻譯**\n> 收件者：Ronald Pinero <rpinero@dailymaily.com>\n> 寄件者：Adeline Morris <amorris@guntoncoc.org>\n> 主旨：Gunton 市商會的請求\n> 日期：5 月 8 日\n>\n> 親愛的 Pinero 先生：\n>\n> 我在《Gunton Herald》報紙的網站上碰巧看到您的留言。您的擔心正是\n\n<!-- page 068 -->\n\n> agree that something must be done to protect stores in the downtown area, like yours. [189]On June 3, the city council will be holding a public meeting that some of us will be attending. It would be helpful if you joined us at the event. You could give a short talk describing the concerns you mentioned in your comments. You are welcome to use visual aids, bring supporting documents, and invite others who share our concerns. Please let me know if you would like to participate.\n>\n> Sincerely yours,\n>\n> [189]Adeline Morris\n> Secretary, Gunton Chamber of Commerce\n\n**翻譯**\n> Gunton 市商會的委員會一直在討論的，[190]我們同意必須做些什麼來保護市中心像您一樣的店家。[189]在 6 月 3 日，市議會將會召開公聽會，我們將有一些成員出席。如果您來參加，將會有所幫助。您可以發表簡短的談話，說明您在留言中提到的擔憂。您可以自由使用視覺輔助道具、攜帶佐證的文件，並且邀請其他和我們有同樣的擔憂的人。如果您想參加請通知我。\n>\n> [189]Adeline Morris\n> Gunton 市商會祕書\n\n**單字** 文章 1：council (n.) 議會，委員會；locally (adv.) 在當地；measure (v.) 測量（尺寸、長度、量等）；rezone (v.) 變更都市分區；resident (n.) 居民，居住者；representative (n.) 代表，代表人；erect (v.) 建設，設立；proposition (n.) 提議，建議；branch (n.) 分店，樹枝；(v.) 分支；authorize (v.) 許可，授權；emphasize (v.) 強調\n文章 2：comment (n.) 評論，網站留言；acquaintance (n.) 相識的人；outskirt (n.) 市郊，郊區；vibrant (adj.) 有活力的，震動的；in regard to (phr.) 關於…；operate (v.) 營運，操作；compete (v.) 競爭，對抗；reject (v.) 拒絕，否決；concern (v.) 擔心；(n.) 關心，憂慮；out of business (phr.) 結束營業的；by extension (phr.) 更進一步\n文章 3：come across (phr.) 偶然遇到…；visual (adj.) 視覺的；board (n.) 委員會，董事會；aid (n.) 輔助的事物，援助；protect (v.) 保護\n\n**186.** 答案 (B)｜難度：低\nWhat is the article mainly about?\n- (A) A mayor's recent proposal\n- (B) A corporation's plans to build a store\n- (C) A city's thriving downtown scene\n- (D) A council's efforts to reduce unemployment\n\n> 報導主要是關於什麼？\n> (A) 市長最近的提案\n> (B) 企業建設商店的計畫\n> (C) 城市繁榮的中心區景象\n> (D) 市議會減少失業的努力\n\n**尋找主題／目的** 文章的主題\n這是詢問報導主要關於什麼的問題，所以要看報導（第一篇文章）的內容。報導中的「At a Gunton City Council meeting ~, members listened to a presentation from representatives of Blandfolk Superstore about building a branch locally.」提到，在 Gunton 市議會的會議中，議員聽了 Blandfolk Superstore 的代表說明在當地建設分店的計畫，接下來說明計畫的細節，所以 (B) A corporation's plans to build a store 是正確答案。\n\n**替換表達** building a branch 建設分店 → build a store 建設商店\n\n**單字** thriving (adj.) 繁榮的，茁壯的；scene (n.) 景象，狀況；unemployment (n.) 失業，失業人數\n\n<!-- page 069 -->\n\n**187.** 答案 (A)｜難度：高\nWhat does Mr. Pinero want Ms. O'Rourke to do?\n- (A) Turn down a proposition from Blandfolk Superstore\n- (B) Meet with executives from Ballas Boutique\n- (C) Rezone some property to allow for construction\n- (D) Defer funding for private business owners\n\n> Pinero 先生希望 O'Rourke 小姐做什麼？\n> (A) 拒絕 Blandfolk Superstore 的提案\n> (B) 與 Ballas Boutique 的主管見面\n> (C) 將一些土地重新分區，讓建設可以進行\n> (D) 推遲對私人企業業主的資金提供\n\n**wh- 問題** 多篇文章綜合題\n這是必須參考三篇文章其中兩篇內容的多篇文章綜合題。題目問 Pinero 先生希望 O'Rourke 小姐做什麼（What），所以先看 Pinero 先生所寫的網路留言（第二篇文章）。\n\n由第二篇文章的「I am writing in regard to an article ~ about the construction proposal from Blandfolk Superstore.」和「I hope the mayor ~ will reject the proposal」可知，Pinero 先生的留言是回應關於 Blandfolk Superstore 建設案的報導，他希望市長拒絕這個提案，這是第一個線索。但是，這裡沒有提到市長是誰，所以還需要確認報導（第一篇文章）的內容。第一篇文章中的「Gunton mayor Claire O'Rourke」顯示 Gunton 市的市長是 Claire O'Rourke，這是第二個線索。\n\n綜合「Pinero 先生希望市長拒絕 Blandfolk Superstore 的提案」和「Gunton 市的市長是 Claire O'Rourke」這兩個線索，可以推知 Pinero 先生希望 O'Rourke 小姐拒絕 Blandfolk Superstore 的提案，所以 (A) Turn down a proposition from Blandfolk Superstore 是正確答案。\n\n**替換表達** reject the proposal 拒絕提案 → Turn down a proposition 拒絕提議\n\n**單字** turn down (phr.) 拒絕…；executive (n.) 主管；defer (v.) 推遲\n\n**188.** 答案 (B)｜難度：高\nIn the article, the word \"limits\" in paragraph 1, line 5, is closest in meaning to\n- (A) regulations\n- (B) borders\n- (C) levels\n- (D) obstacles\n\n> 報導第 1 段第 5 行的「limits」，意思最接近\n> (A) 規定\n> (B) 邊界\n> (C) 水準\n> (D) 障礙\n\n**同義詞**\n在報導（第一篇文章）中，limits 在「The retail giant proposed erecting an outlet ~ just within city limits」這個句子裡的意思是「邊界，界線」，所以表示「邊界」的 (B) borders 是正確答案。\n\n<!-- page 070 -->\n\n**189.** 答案 (B)｜難度：高\nWhat will take place on June 3?\n- (A) Those on the Gunton City Council will vote on a plan.\n- (B) Some Chamber of Commerce members will attend a public hearing.\n- (C) Construction of a large retail outlet will get underway.\n- (D) Ms. Morris will voice some citizens' concerns at a trial.\n\n> 6 月 3 日會發生什麼事？\n> (A) Gunton 市議會的人（議員）會針對計畫進行投票。\n> (B) 一些商會成員將出席公聽會。\n> (C) 大型賣場的建設工程將開始進行。\n> (D) Morris 小姐將在審判中說出一些市民的擔憂。\n\n**wh- 問題 What**\n這是問 6 月 3 日會發生什麼事（What）的 wh- 問題，所以要看提到問題重點 June 3 的第三篇文章（電子郵件）。第三篇文章中，「On June 3, the city council will be holding a public meeting that some of us will be attending.」和「Adeline Morris, Secretary, Gunton Chamber of Commerce」的部分顯示在 6 月 3 日，市議會將舉辦公聽會，寄件方的一些人會參加，而寄件人 Adeline Morris 是 Gunton 市商會的祕書，所以 (B) Some Chamber of Commerce members will attend a public hearing 是正確答案。\n\n**替換表達** public meeting 公聽會 → public hearing 公聽會\n\n**單字** underway (adj.) 進行中的；voice (v.) 發聲，說出；(n.) 聲音；citizen (n.) 市民；trial (n.) 審判，試驗\n\n**190.** 答案 (C)｜難度：高\nWhat is indicated about Ms. Morris?\n- (A) She is in charge of relocation for the city council.\n- (B) She runs a store that sells items at bargain prices.\n- (C) She thinks that Ballas Boutique should be preserved.\n- (D) She signed a petition sponsored by Gunton City Council.\n\n> 關於 Morris 小姐，文中提到什麼？\n> (A) 她負責市議會的遷移事宜。\n> (B) 她經營低價販賣商品的商店。\n> (C) 她認為 Ballas Boutique 應該受到保護。\n> (D) 她簽署了由 Gunton 市議會支持的請願。\n\n**推論** 多篇文章綜合題\n這是必須參考三篇文章其中兩篇內容的多篇文章綜合題。首先確認題目關鍵字 Ms. Morris 所寫的電子郵件（第三篇文章）。\n\n第三篇文章中的「we agree that something must be done to protect stores in the downtown area, like yours」提到，寄件方（Morris 小姐所屬的商會）同意必須做些什麼來保護市中心像 Pinero 先生所經營的店一樣的地方，這是第一個線索。但是，這裡沒有提到 Pinero 先生經營的店是什麼，所以還需要在 Pinero 先生所寫的網路留言（第二篇文章）中確認。第二篇文章中的「I manage Ballas Boutique, a clothing store in the downtown area」顯示留言者 Pinero 先生在市中心經營服裝店 Ballas Boutique，這是第二個線索。\n\n綜合「Morris 小姐所屬的商會同意應該保護像 Pinero 先生所經營的店一樣的地方」和「Pinero 先生經營服裝店 Ballas Boutique」這兩個線索，可以推知 Morris 小姐認為 Ballas Boutique 應該受到保護。所以答案是 (C) She thinks that Ballas Boutique should be preserved。\n\n**替換表達** to protect 保護 → be preserved 受到保護\n\n**單字** in charge of (phr.) 負責…；relocation (n.) 遷移；bargain price (phr.) 折扣價；preserve (v.) 保護，保存；petition (n.) 請願書；(v.) 請願\n\n<!-- page 071 -->\n### Questions 191-195 refer to the following invoice, e-mail, and message. 🆕\n191-195 題參照以下發票、電子郵件及訊息。\n\n**文章 1**\n\n> **Invoice** Date: October 4\n>\n> From: Oresund Graphics and Design\n> 49 Rozenstraat, Arnhem, Netherlands\n> To: Kaiser Investment Services\n> 1 Kornmarkt, Floor 4, Frankfurt, Germany\n\n| Services | Charges |\n|---|---|\n| Design, Layout, and Photography of Annual Shareholders Report | €745 |\n| [191-B] Design and Layout of *Investing with Kaiser* Brochure | €545 |\n| [191-B] Design and Layout of Terms and Conditions Booklet | €300 |\n| TOTAL DUE | €2,240 |\n\n> Payment is due in 15 days. [192] Requests for additional changes will incur a €100 surcharge per document. For sioned a photographer to take a new picture, and I will send it to you」提到，他（總經理）要求換掉封面使用的照片，而寄件方（Kaiser Investment Services 公司）已經請了攝影師拍新的照片，並且會寄給對方，這是第一個線索。但是，這裡沒有提到更換封面照片牽涉的事項，所以還需要在發票（第一篇文章）中確認相關內容。第一篇文章中的「Requests for additional changes will incur a €100 surcharge per document.」顯示需要額外變更時，每件文件將加收 100 歐元，這是第二個線索。\n\n綜合「Kaiser Investment Services 公司會寄替換封面用的照片」和「額外變更要加收 100 歐元」這兩個線索，可以推知 Kaiser Investment Services 公司必須支付 100 歐元的修改費用。所以答案是 (D) It will have to pay a fee of €100 for a revision。\n\n**替換表達**\nsurcharge 額外收費 → fee 費用\nchanges 變更 → revision 修訂\n\n**單字** fee (n.) 費用，手續費\n\n**193.** 答案 (B)｜難度：中\nWhat is one purpose of the message?\n- (A) To recognize a firm's top employees\n- (B) To go over a company's achievements\n- (C) To announce the results of a sale\n- (D) To invite participants to a celebration\n\n> 訊息的一個目的是什麼？\n> (A) 表揚公司的頂尖員工\n> (B) 回顧公司的成就\n> (C) 公布特賣會的結果\n> (D) 邀請參加慶祝活動\n\n**尋找主題／目的** 文章的目的\n這是問訊息目的的問題，所以要看訊息（第三篇文章）的內容。訊息中的「I want to ~ thank everyone for their commitment and hard work」提到，作者（Matthias Furst）想要感謝大家的奉獻和努力，接下來說明公司過去一年的成就，所以 (B) To go over a company's achievements 是正確答案。\n\n**單字** recognize (v.) 認定，表彰；go over (phr.) 檢查，察看；achievement (n.) 成就\n\n<!-- page 074 -->\n**194.** 答案 (C)｜難度：高\nIn the message, the word \"outperformed\" in paragraph 1, line 2, is closest in meaning to\n- (A) taken part in\n- (B) put apart from\n- (C) done better than\n- (D) given more than\n\n> 訊息第 1 段第 2 行的「outperformed」，意思最接近\n> (A) 參與…\n> (B) 從…分離\n> (C) 做得比…好\n> (D) 給得比…多\n\n**同義詞**\n在訊息（第三篇文章）中，outperformed 在「Kaiser Investment Services has outperformed analysts' expectations」這個句子裡的意思是「表現優於…」，所以表示「做得比…好」的 (C) done better than 是正確答案。\n\n**195.** 答案 (D)｜難度：最高\nWhat most likely did Kaiser Investment Services do recently?\n- (A) It held a retirement party for staff members.\n- (B) It conducted a survey among employees.\n- (C) It launched a series of new products in Germany.\n- (D) It distributed brochures to potential US clients.\n\n> Kaiser Investment Services 公司最 /* ---------- 迷你 Markdown 轉 HTML ---------- */
// 答案線索標記，例如 [147]、[149-D]、[162/163]、[159-B/160-A/D]
const MARK = /\[(\d{3}(?:-[A-D](?:\/[A-D])*)?(?:\/\d{3}(?:-[A-D](?:\/[A-D])*)?)*)\]\s?/g;
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function inline(s) {
  s = esc(s).replace(/\\\*/g, "\u0001");
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>");
  s = s.replace(/\u0001/g, "*").replace(/\\([\[\]_#-])/g, "$1");
  return s.replace(MARK, (_, m) => `<span class="mk">${m}</span>`);
}
function md(text) {
  const lines = text.split("\n");
  let out = "", i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    if (l.startsWith(">")) {
      const buf = [];
      while (i < lines.length && lines[i].startsWith(">")) { buf.push(lines[i].replace(/^> ?/, "")); i++; }
      out += "<blockquote>" + md(buf.join("\n")) + "</blockquote>"; continue;
    }
    if (l.trim().startsWith("|")) {
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith("|")) { rows.push(lines[i].trim()); i++; }
      const cells = r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      let html = "<table>";
      rows.forEach((r, k) => {
        if (/^\|[\s\-:|]+\|$/.test(r)) return;
        const cs = cells(r);
        if (k === 0 && cs.every(c => !c)) return;
        const tag = k === 0 && rows[1] && /^\|[\s\-:|]+\|$/.test(rows[1]) ? "th" : "td";
        html += "<tr>" + cs.map(c => `<${tag}>${inline(c)}</${tag}>`).join("") + "</tr>";
      });
      out += html + "</table>"; continue;
    }
    if (/^- /.test(l)) {
      out += "<ul>";
      while (i < lines.length && /^- /.test(lines[i])) { out += "<li>" + inline(lines[i].slice(2)) + "</li>"; i++; }
      out += "</ul>"; continue;
    }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !lines[i].startsWith(">") && !/^- /.test(lines[i]) && !lines[i].trim().startsWith("|")) { buf.push(inline(lines[i])); i++; }
    out += "<p>" + buf.join("<br>") + "</p>";
  }
  return out;
}
// 作答時把文章裡提示答案位置的 [147]、[149-D] 標記藏起來
const stripMarks = s => s.replace(MARK, "");

/* ---------- 解析題本 ---------- */
const Q_HEAD = /^\*\*(\d{3})\.\*\*\s*(🆕)?\s*(?:答案 \(([A-D])\)(?:｜難度：([^\s🆕]+))?)?\s*(🆕)?/;
function parseQBlock(lines) {
  const m = lines[0].match(Q_HEAD);
  const q = { num: m[1], isNew: !!(m[2] || m[5]), answer: m[3] || null, level: m[4] || "", text: [], options: [], rest: [] };
  let stage = "text";
  for (const l of lines.slice(1)) {
    const o = l.match(/^- \(([A-D])\)\s?(.*)$/);
    if (stage !== "rest" && o) { stage = "opts"; q.options.push({ key: o[1], text: o[2] }); continue; }
    if (stage === "opts") stage = "rest";
    (stage === "text" ? q.text : q.rest).push(l);
  }
  q.body = lines.slice(1).join("\n").trim();
  q.text = q.text.join("\n").trim();
  q.rest = q.rest.join("\n").trim();
  return q;
}
function splitBlocks(lines) {
  const pre = [], blocks = [];
  for (const l of lines) {
    if (Q_HEAD.test(l)) blocks.push([l]);
    else if (blocks.length) blocks[blocks.length - 1].push(l);
    else pre.push(l);
  }
  return { pre, blocks: blocks.map(parseQBlock) };
}
function parsePreamble(pre, expected) {
  const sub = pre.length && !pre[0].startsWith(">") ? pre.shift() : "";
  // 判斷是不是中文翻譯：看中文字佔的比例（原文偶爾夾少量中文註記）
  const isTrans = t => {
    const cjk = (t.match(/[一-鿿]/g) || []).length, latin = (t.match(/[A-Za-z]/g) || []).length;
    return cjk > 0 && cjk / (cjk + latin) > 0.2;
  };
  // 第一步：切成一塊一塊（文章標籤 / 原文 / 翻譯）
  const chunks = [], vocab = [];
  let quote = null, afterTransLabel = false, inVocab = false;
  const flush = () => {
    if (!quote) return;
    const text = quote.join("\n");
    chunks.push({ type: afterTransLabel || isTrans(stripMarks(text)) ? "trans" : "en", text });
    quote = null; afterTransLabel = false;
  };
  for (const l of pre) {
    if (inVocab) { vocab.push(l); continue; }
    if (l.startsWith(">") || l.trim().startsWith("|")) { (quote || (quote = [])).push(l); continue; }
    flush();
    const lab = l.match(/^\*{0,2}文章\s*(\d+)\*{0,2}\s*$/);
    if (lab) chunks.push({ type: "label", text: "文章 " + lab[1] });
    else if (l.startsWith("**單字**")) { inVocab = true; vocab.push(l); }
    else if (l.trim() === "**翻譯**") afterTransLabel = true;
  }
  flush();
  // 第二步：沒標「文章 N」的地方，從「翻譯之後又出現的英文」裡挑最長的幾段當作新文章的開頭
  const labels = chunks.filter(c => c.type === "label").length;
  const lastLabel = chunks.map(c => c.type).lastIndexOf("label");
  const cands = chunks.map((c, k) => ({ c, k }))
    .filter(({ c, k }) => c.type === "en" && k > lastLabel && k > 0 && chunks[k - 1].type === "trans" && chunks.slice(0, k).some(x => x.type === "en"));
  const need = expected - Math.max(labels, 1);
  if (need > 0) cands.sort((a, b) => b.c.text.length - a.c.text.length).slice(0, need).forEach(({ c }) => c.split = true);
  // 第三步：組合
  const passages = [], trans = [];
  let cur = null;
  for (const c of chunks) {
    if (c.type === "label") { cur = { label: c.text, lines: [] }; passages.push(cur); trans.push(`**${c.text}**`); }
    else if (c.type === "trans") trans.push(c.text);
    else {
      if (!cur || c.split) { cur = { label: "", lines: [] }; passages.push(cur); }
      cur.lines.push(c.text);
    }
  }
  if (passages.length > 1) passages.forEach((p, k) => { if (!p.label) p.label = "文章 " + (k + 1); });
  return { sub, passages: passages.filter(p => p.lines.length), trans: trans.join("\n\n"), vocab: vocab.join("\n") };
}

const raw = SOURCE.split("\n").filter(l => !/^<!-- page/.test(l.trim()));
const startIdx = raw.findIndex(l => /^# TEST/.test(l));
const title = (raw[startIdx] || "# TOEIC").replace(/^#\s*/, "");
const intros = {};
SOURCE.split("\n").forEach((l, k, arr) => {
  const m = l.match(/\[PART (\d)：(.+?)\]/);
  if (m) intros[m[1]] = { name: m[2], text: (arr[k + 1] || "").replace(/^\s*概念：/, "") };
});

const parts = {};
let part = null, section = null;
for (const l of raw.slice(startIdx)) {
  const pm = l.match(/^## PART (\d)/);
  if (pm) { part = pm[1]; parts[part] = []; section = null; continue; }
  if (!part) continue;
  const sm = l.match(/^### (.+)$/);
  if (sm) { section = { heading: sm[1].replace(/\s*🆕\s*$/, ""), isNew: /🆕/.test(sm[1]), lines: [] }; parts[part].push(section); continue; }
  if (!section) { section = { heading: null, lines: [] }; parts[part].push(section); }
  section.lines.push(l);
}

// 統一成「題組」：Part 5 每題一組，Part 6/7 每篇文章一組
const sets = [];
for (const p of Object.keys(parts)) {
  for (const sec of parts[p]) {
    const { pre, blocks } = splitBlocks(sec.lines);
    if (!sec.heading) {
      blocks.forEach(q => sets.push({ id: "q" + q.num, part: p, heading: null, questions: [q] }));
      continue;
    }
    const first = +(blocks[0] && blocks[0].num);
    const info = parsePreamble(pre, first >= 186 ? 3 : first >= 176 ? 2 : 1); // 多益 176-185 雙篇、186-200 三篇
    const byNum = {};
    for (const b of blocks) {
      const q = byNum[b.num] || (byNum[b.num] = { num: b.num, isNew: false, options: [], text: "", rest: "" });
      q.isNew = q.isNew || b.isNew;
      if (b.answer && q.options.length) { q.answer = b.answer; q.level = b.level; q.rest = b.body; } // Part 6：選項在前面，這塊全是解析
      else if (b.answer) { q.answer = b.answer; q.level = b.level; q.rest = b.rest; q.text = b.text; q.options = b.options; }
      else { if (b.options.length) q.options = b.options; if (b.rest) info.vocab += (info.vocab ? "\n\n" : "") + b.rest; }
    }
    const questions = Object.values(byNum).sort((a, b) => a.num - b.num);
    sets.push({ id: "s" + questions[0].num, part: p, heading: sec.heading, isNew: sec.isNew, ...info, questions });
  }
}

try { const saved = localStorage.getItem(STORE_KEY + "-tab"); if (partKeys.includes(saved)) curPart = saved; } catch (e) {}

function renderTabs() {
  $("#tabs").innerHTML = partKeys.map(p =>
    `<button data-p="${p}" class="${p === curPart ? "active" : ""}">Part ${p}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    curPart = b.dataset.p;
    try { localStorage.setItem(STORE_KEY + "-tab", curPart); } catch (e) {}
    renderTabs(); renderMain(); scrollTo({ top: 0 });
  });
}

function renderScore() {
  let right = 0, done = 0, total = 0;
  for (const s of sets) {
    total += s.questions.length;
    const x = state[s.id];
    if (x && x.done) s.questions.forEach(q => { done++; if (x.picks[q.num] === q.answer) right++; });
  }
  $("#score").innerHTML = `已作答 <b>${done}</b> / ${total} 題，答對 <b>${right}</b> 題` + (done ? `（${Math.round(right / done * 100)}%）` : "");
}

function questionHTML(set, q) {
  const x = st(set.id), pick = x.picks[q.num];
  const opts = q.options.map(o => {
    let cls = "opt", tag = "";
    if (x.done) {
      if (o.key === q.answer) { cls += " right"; tag = "正解"; }
      else if (o.key === pick) { cls += " wrong"; tag = "你的答案"; }
      if (o.key === q.answer && o.key === pick) tag = "✓ 答對";
    } else if (o.key === pick) cls += " sel";
    return `<button class="${cls}" data-set="${set.id}" data-q="${q.num}" data-k="${o.key}" ${x.done ? "disabled" : ""}>
      <span class="l">(${o.key})</span><span>${inline(o.text)}</span>${tag ? `<span class="tag">${tag}</span>` : ""}</button>`;
  }).join("");
  let after = "";
  if (x.done) {
    const ok = pick === q.answer;
    after = `<div class="verdict ${ok ? "ok" : "bad"}">${ok ? "答對了" : pick ? `答錯了，你選 (${pick})` : "未作答"}・正確答案 (${q.answer})${q.level && q.level !== "?" ? `・難度：${q.level}` : ""}</div>
      <div class="explain">${md(q.rest)}</div>`;
  }
  return `<div class="q"><div class="qtext"><span class="qnum">${q.num}.</span>${q.isNew ? '<span class="new">新題型</span> ' : ""}${q.text ? md(q.text).replace(/^<p>|<\/p>$/g, "") : ""}</div>
    <div class="opts">${opts}</div>${after}</div>`;
}

function setHTML(set) {
  const x = st(set.id);
  const unanswered = set.questions.filter(q => !x.picks[q.num]).length;
  let passages = "";
  if (set.passages && set.passages.length) {
    passages = `<div class="passages">` + set.passages.map(p => {
      const body = p.lines.join("\n\n");
      return (p.label ? `<div class="plabel">${p.label}</div>` : "") + `<div class="passage">${md(x.done ? body : stripMarks(body))}</div>`;
    }).join("") + `</div>`;
  }
  const reveal = x.done && (set.trans || set.vocab)
    ? `<details class="reveal" open><summary>文章翻譯與單字</summary>${md(set.trans)}${md(set.vocab)}</details>` : "";
  const head = set.heading
    ? `<p class="set-title">${esc(set.heading)}${set.isNew ? ' <span class="new">新題型</span>' : ""}</p><p class="set-sub">${esc(set.sub || "")}</p>` : "";
  const btnLabel = set.heading ? "送出本題組" : "送出";
  const actions = x.done
    ? `<div class="actions"><span class="result">本組答對 ${set.questions.filter(q => x.picks[q.num] === q.answer).length} / ${set.questions.length}</span>
       <button class="btn" data-redo="${set.id}">重做這組</button></div>`
    : `<div class="actions"><button class="btn primary" data-submit="${set.id}" ${unanswered ? "disabled" : ""}>${btnLabel}</button>
       ${unanswered && set.questions.length > 1 ? `<span class="hint">還有 ${unanswered} 題沒選</span>` : ""}</div>`;
  return `<section class="card" id="${set.id}">${head}
    <div class="set-body ${passages ? "two" : ""}">${passages}<div>${set.questions.map(q => questionHTML(set, q)).join("")}${actions}</div></div>
    ${reveal}</section>`;
}

function renderSet(id) {
  const set = sets.find(s => s.id === id);
  const el = document.getElementById(id);
  el.outerHTML = setHTML(set);
  renderScore();
}

function renderMain() {
  const intro = intros[curPart];
  $("#main").innerHTML = (intro ? `<p class="part-intro"><b>Part ${curPart}：${intro.name}</b>　${esc(intro.text)}</p>` : "")
    + sets.filter(s => s.part === curPart).map(setHTML).join("");
  renderScore();
}

$("#main").addEventListener("click", e => {
  const opt = e.target.closest(".opt");
  if (opt && !opt.disabled) {
    st(opt.dataset.set).picks[opt.dataset.q] = opt.dataset.k; save(); renderSet(opt.dataset.set); return;
  }
  const sub = e.target.closest("[data-submit]");
  if (sub && !sub.disabled) { st(sub.dataset.submit).done = true; save(); renderSet(sub.dataset.submit); return; }
  const redo = e.target.closest("[data-redo]");
  if (redo) { state[redo.dataset.redo] = { picks: {}, done: false }; save(); renderSet(redo.dataset.redo); }
});
$("#resetAll").onclick = () => {
  if (!confirm("確定要清除這份考卷的所有作答紀錄？")) return;
  state = {}; save(); renderMain();
};

renderTabs();
renderMain();
</script>
</body>
</html>
