g department staff」，表示這則備忘錄是寫給廣告部員工的，以及「all staff involved in online advertising will have their own office space located on the second floor」、「Remaining staff will stay in the current space on the third floor」，表示從事網路廣告的員工將會在二樓辦公、其餘員工將留在三樓，符合選項敘述，所以 (C) It will be split up into two groups that will work on different floors. 是正確答案。(D) 在文中沒有提到。\n\n**單字** transfer (v.) 轉移，調動；take off (phr.) 休（某段時間的）假\n\n**175.** 🆕 答案 (D)｜難度：高\nIn which of the positions marked [1], [2], [3], and [4] does the following sentence best belong?\n\"Plastic containers for storing belongings will also be provided to these employees.\"\n- (A) [1]\n- (B) [2]\n- (C) [3]\n- (D) [4]\n\n> 以下這個句子最適合放在文中標記 [1]、[2]、[3]、[4] 的哪一個位置？\n> 「存放個人物品的塑膠容器也會提供給這些員工。」\n> (A) [1]\n> (B) [2]\n> (C) [3]\n> (D) [4]\n\n**找出句子位置**\n這是要依照文章的內容架構，判斷句子應該插入哪個位置的題目。題目所給的句子「Plastic containers for storing belongings will also be provided to these employees.」表示存放個人物品的塑膠容器也會提供給這些員工，所以應該接在提到要搬位子的員工的內容之後。[4] 的上一句「Employees who are members of the teams headed by Timothy Wendell, Sinead Barry, and Gina Jong will be moved to different desks.」提到 Timothy Wendell、Sinead Barry、Gina Jong 帶領的團隊成員會移動到不同的辦公桌，而在 [4] 的位置插入句子之後，表示這些員工也會得到存放個人物品的塑膠容器，文意前後連貫，所以 (D) [4] 是正確答案。\n\n<!-- page 172 -->\n\n### Questions 176-180 refer to the following e-mails.\n176-180 題參照以下電子郵件。\n\n> To: Rebecca Katrinsky <r.katrinsky@turnipbooks.com>\n> From: Timothy Soranes <tsoranes05@nailmail.net>\n> Date: September 15\n> Subject: Freelancer for new project\n> [178] Attachment: Carl_Deluth_article\n>\n> Hi Rebecca,\n>\n> How has everything been going? I heard that you are working on a children's e-book project over at Turnip, and [176] I am wondering if you are still looking for a freelance illustrator to help out. My friend, Carl Deluth, wrote to me recently and mentioned that he was seeking some part-time work.\n>\n> Carl has done artwork for children's literature and comic books for over eight years. His drawings were even featured in an exhibition last year at the Corander Museum of Modern Art. [178] I've attached an article from a local newspaper for your reference. It discusses some of his most recent work.\n>\n> Also, Carl mentioned that he was curious about the project schedule and timing. If you think he would be a good fit for the project, you may contact him directly at carldel@genericpost.com, and he can send you a résumé and samples of his work. Let me know if you have any questions or concerns.\n>\n> Best,\n> Tim\n\n**翻譯**\n> 收件者：Rebecca Katrinsky <r.katrinsky@turnipbooks.com>\n> 寄件者：Timothy Soranes <tsoranes05@nailmail.net>\n> 日期：9 月 15 日\n> 主旨：新專案的自由接案者\n> [178] 附件：Carl_Deluth_報導\n>\n> 嗨 Rebecca：\n>\n> 最近還順利嗎？我聽說你在 Turnip 公司進行兒童電子書專案，[176] 我想知道你是不是還在找可以幫忙的接案插畫家。我朋友 Carl Deluth 最近寫信給我，提到他在找兼職工作。\n>\n> Carl 為兒童文學和漫畫書畫圖已經 8 年多了。他的畫作去年甚至在 Corander 現代美術館展出過。[178] 我附上了地方報紙的一篇報導讓你參考。這篇報導談到他最近的一些作品。\n>\n> Carl 也提到他想知道專案的進度規畫和時期。如果你覺得他適合這個專案，可以直接寄到 carldel@genericpost.com 聯絡他，他可以把履歷和試看作品寄給你。如果有任何問題或疑惑請告訴我。\n>\n> Tim\n\n> To: Carl Deluth <carldel@genericpost.com>\n> From: Rebecca Katrinsky <r.katrinsky@turnipbooks.com>\n> Date: September 18\n> Subject: Freelance position for new project\n>\n> Dear Mr. Deluth,\n>\n> Thank you for forwarding me a copy of your résumé and some pictures of your previous work. [178] I've had a look through everything, as well as an attachment forwarded to me by your friend, Mr. Soranes. My colleagues and I are very impressed with your work and accomplishments.\n>\n> [179-C] In regard to the details of Turnip's ongoing project, the stories are 12 pages long with one main illustration on each page. We may request that the images span across two pages, however. The artwork will be used in our e-books as well as in some educational games we are developing, so the completed files need to be provided in the proper formats.\n>\n> As to our work process for freelance illustrators, we will first provide you with art descriptions and give you five business days to provide us with sketches. We will give\n\n**翻譯**\n> 收件者：Carl Deluth <carldel@genericpost.com>\n> 寄件者：Rebecca Katrinsky <r.katrinsky@turnipbooks.com>\n> 日期：9 月 18 日\n> 主旨：新專案的自由接案職缺\n>\n> 親愛的 Deluth 先生：\n>\n> 感謝您把履歷和一些過去作品的圖片寄給我。[178] 我全部看過了，也包括您的朋友 Soranes 先生寄給我的附件。我和同事對於您的作品和成就印象非常深刻。\n>\n> [179-C] 關於 Turnip 公司進行中的專案細節，這些故事的篇幅是 12 頁，每頁都有一張主要的插圖。不過，我們也有可能要求圖片橫跨兩頁。圖畫將用於我們的電子書，以及我們正在開發的一些教育遊戲，所以完稿檔案必須以適當格式提供。\n>\n> 至於我們對於接案插畫家的工作流程，我們會先提供插畫內容說明，並且給您\n\n<!-- page 173 -->\n\n> you feedback within two business days, and you will need to make the necessary adjustments and do drawing and coloring within nine business days. [180] We will complete a final review within two business days and make requests for minor adjustments which you'll have one business day to carry those out.\n>\n> Should this be of interest of you, please let me know, and I will arrange for an interview. Information regarding payment and a contract can be discussed at that time.\n>\n> Regards,\n> Rebecca Katrinsky\n\n**翻譯**\n> 5 個工作天的時間提供素描稿給我們。我們會在 2 個工作天以內給您回饋意見，您必須做必要的調整，並且在 9 個工作天內進行描繪與上色。[180] 我們將會在 2 個工作天以內完成最終審閱，並且要求細部調整，您有 1 個工作天的時間可以進行。\n>\n> 如果您有興趣，請告知我，我將會安排面談。屆時可以討論報酬及合約的資訊。\n>\n> Rebecca Katrinsky\n\n**單字** 文章 1：illustrator (n.) 插畫家；literature (n.) 文學；reference (n.) 參考，參照；mention (v.) 提到，說到；feature (v.) 以…為特色，特別刊載…；directly (adv.) 直接，直直地；artwork (n.) 藝術品，插畫；attach (v.) 附上，貼上\n**單字** 文章 2：forward (v.) 發送，轉交 (adv.) 往前；ongoing (adj.) 進行中的；proper (adj.) 適當的；adjustment (n.) 調整；regarding (prep.) 關於…；accomplishment (n.) 成就，技藝；span (v.) 橫跨，跨越；format (n.) 格式；carry out (phr.) 實行，執行；contract (n.) 合約；in regard to (phr.) 關於…；as well as (phr.) 除了…還有；description (n.) 說明，敘述；arrange (v.) 安排，準備\n\n**176.** 答案 (B)｜難度：中\nWhy did Mr. Soranes write to Ms. Katrinsky?\n- (A) To inquire about his job application\n- (B) To refer a friend for a position\n- (C) To follow up on an ongoing project\n- (D) To invite a colleague to an exhibit\n\n> 為什麼 Soranes 先生要寫信給 Katrinsky 小姐？\n> (A) 為了詢問他的工作應徵\n> (B) 為了推薦朋友擔任職務\n> (C) 為了追蹤進行中的專案\n> (D) 為了邀請同事參觀展覽\n\n**尋找主題／目的 寫文章的理由**\n這是詢問 Soranes 先生寫信給 Katrinsky 小姐的理由的問題，所以要看 Soranes 先生寫的電子郵件（第一篇文章）的內容。第一篇文章中的「I am wondering if you are still looking for a freelance illustrator ~. My friend ~ was seeking some part-time work.」提到，想知道你（Katrinsky 小姐）是不是還在找插畫家，因為他（Soranes 先生）朋友在找兼職工作，接下來說明朋友的經歷，所以 (B) To refer a friend for a position 是正確答案。\n\n**單字** application (n.) 申請（書），（工作的）應徵；refer (v.) 參考，轉介（人）；follow up (phr.) 對…採取進一步行動，跟進\n\n**177.** 答案 (B)｜難度：低\nIn the first e-mail, the word \"concerns\" in paragraph 3, line 3, is closest in meaning to\n- (A) opinions\n- (B) problems\n- (C) inclinations\n- (D) enterprises\n\n> 第一封電子郵件第 3 段第 3 行的「concerns」，意思最接近\n> (A) 意見\n> (B) 問題\n> (C) 傾向\n> (D) 企業\n\n**同義詞**\n在第一封電子郵件中，concerns 在「Let me know if you have any questions or concerns.」這個句子裡的意思是「擔心，疑問」，所以表示「問題」的 (B) problems 是正確答案。\n\n<!-- page 174 -->\n\n**178.** 答案 (A)｜難度：高\nWhat is suggested about Ms. Katrinsky?\n- (A) She showed an article about Mr. Deluth to her colleagues.\n- (B) She saw some of Mr. Deluth's artwork at a museum exhibit.\n- (C) She requested further references from former employers.\n- (D) She required an artist to work for a period of one month.\n\n> 關於 Katrinsky 小姐，文中顯示什麼？\n> (A) 她讓同事看了關於 Deluth 先生的報導。\n> (B) 她在博物館的展覽看到 Deluth 先生的作品。\n> (C) 她要求還要有前雇主的推薦。\n> (D) 她需要有藝術家做一個月的工作。\n\n**推論 多篇文章綜合題**\n這是必須參考兩篇文章內容的多篇文章綜合題。首先看題目關鍵字 Katrinsky 小姐所寫的第二封電子郵件中的相關內容。\n\n第二封電子郵件中的「I've had a look through ~ an attachment forwarded to me by your friend, Mr. Soranes. My colleagues and I are very impressed with your work」提到 Katrinsky 小姐看了收件人（Carl Deluth）的朋友 Soranes 先生寄的附件，她和同事對 Carl Deluth 的作品印象深刻，這是第一個線索。但是，這裡沒有提到 Soranes 先生寄的附件是什麼，所以還需要在第一封電子郵件中確認。第一封電子郵件中的「Attachment: Carl_Deluth_article」和「I've attached an article ~. It discusses some of his most recent work.」顯示寄件者 Soranes 先生附上了關於 Carl Deluth 的報導，內容提到他最近的一些作品，這是第二個線索。\n\n綜合「Katrinsky 小姐可能和同事看了 Soranes 先生寄的附件」和「Soranes 先生寄的附件是關於 Carl Deluth 的報導」這兩個線索，可以推知 Katrinsky 小姐可能讓同事看了關於 Carl Deluth 的報導。所以答案是 (A) She showed an article about Mr. Deluth to her colleagues。\n\n**179.** 答案 (C)｜難度：中\nWhat is true about Turnip's ongoing book project?\n- (A) It is broken up into 12 different stories.\n- (B) It uses characters from an existing series.\n- (C) It might require illustrations that spread across two pages.\n- (D) It will be released in monthly installments.\n\n> 關於 Turnip 公司進行中的圖書專案，何者正確？\n> (A) 分為 12 個不同的故事。\n> (B) 使用現有系列的角色。\n> (C) 可能需要橫跨兩頁的插圖。\n> (D) 將會逐月分別推出。\n\n**Not/True True 問題**\n這是需要找到與關鍵字 Turnip's ongoing book project 相關的資訊，並且與選項敘述對照的 Not/True 問題，所以要看提到 Turnip 公司進行中的圖書專案的第二封電子郵件。(A) 和 (B) 在文中沒有提到。(C) 對應文中的「In regard to the details of Turnip's ongoing project, the stories are 12 pages long with one main illustration on each page. We may request that the images span across two pages, however.」，表示 Turnip 公司進行中專案的故事篇幅有 12 頁，每頁都有主要的插圖，但也有可能要求插圖橫跨兩頁，符合選項敘述，所以 (C) It might require illustrations that spread across two page 是正確答案。(D) 在文中沒有提到。\n\n**單字** break up (phr.) 打破，拆開；spread (v.) 展開；installment (n.) 分期付款，（分期連載物的）部分，分冊\n\n**180.** 答案 (A)｜難度：低\nHow much time is an illustrator given to make final revisions?\n- (A) One day\n- (B) Two days\n- (C) Five days\n- (D) Nine days\n\n> 插畫家有多少時間可以做最後的修改？\n> (A) 1 天\n> (B) 2 天\n> (C) 5 天\n> (D) 9 天\n\n**wh- 問題 How**\n這是問插畫家有多少（How much）時間可以做最後修改的 wh- 問題，所以要看提到問題重點 an illustrator given to make final revisions 的第二封電子郵件。第二封電子郵件中，「We will complete a final review ~ and make requests for minor adjustments which you'll have one business day to carry those out.」的部分提到完成最終審閱後會要求細部調整，有一個工作天的時間可以進行，所以 (A) One day 是正確答案。\n\n**替換表達**\nrevisions 修訂 → adjustments 調整\n\n<!-- page 175 -->\n\n### Questions 181-185 refer to the following memo and e-mail.\n181-185 題參照以下備忘錄與電子郵件。\n\n文章 1\n> Dakota Logistics\n> MEMO\n>\n> To: All Staff\n> From: Jasmine Alexander, Chief Operations Officer\n> Subject: Pension scheme\n> [181] Date: November 28\n>\n> As you know, the company executives reviewed our pension policy at Friday's board meeting, and agreed to make some changes to add more flexibility to the system. Currently, [182/184] employees who have been with the company less than five years contribute 1.8 percent of their salary to the pension fund, [184] while those who have been here five years or longer contribute 2.7 percent.\n>\n> [181/183] From January 1 of next year, this policy will change. [183] All staff will be able to choose which level of pension payment they want to use. [184] As well as the two existing options, employees will also be able to contribute an amount of up to 3.5 percent of their salary if they wish. In December, you will all be asked to communicate your preferences on this issue. [185] If you would like to discuss the options and receive some advice about what might be best for your current situation, please make an appointment with the head of the human resources department.\n\n**翻譯**\n> Dakota Logistics 公司\n> 備忘錄\n>\n> 收件者：所有員工\n> 寄件者：Jasmine Alexander，營運長\n> 主旨：退休金制度\n> [181] 日期：11 月 28 日\n>\n> 如各位所知，公司高層在週五的董事會議檢討了我們的退休金政策，並且同意做一些改變，為制度增加一點彈性。目前，[182/184] 在公司工作未滿五年的員工提撥百分之 1.8 的薪水到退休基金，[184] 而在這裡五年以上的人提撥百分之 2.7。\n>\n> [181/183] 從明年 1 月 1 日起，這個政策將會改變。[183] 所有員工都能夠選擇想要使用哪個退休金提撥等級。[184] 除了現有的兩個選擇以外，如果想要的話，員工也可以提撥最高百分之 3.5 的薪水。在 12 月，所有人都會被要求表示自己對這個議題的偏好。[185] 如果你想要討論這些選擇，並且獲得關於哪個選擇可能對自己的現況最有利的建議，請和人事部長安排會面。\n\n文章 2\n> To: Sarah Chang <schang@dlogistics.com>\n> From: Adam Cartwright <acartwright@dlogistics.com>\n> Subject: Pension appointment\n> Date: November 29\n>\n> Hello Sarah,\n>\n> [185] I am writing in response to yesterday's memo from Ms. Alexander. [182] I currently contribute 1.8 percent of my salary to the pension fund. However, I received a pay raise when my contract was renewed in September, so I can now afford to contribute more. Because of that, [184] I'm interested in increasing my contribution to 3.5 percent.\n>\n> [185] I will be available to talk about this issue all day Tuesday and Thursday, and will also be free on Friday before 2 p.m. Let me know if there is a time that works best for you during those periods.\n>\n> Best wishes,\n> Adam Cartwright\n\n**翻譯**\n> 收件者：Sarah Chang <schang@dlogistics.com>\n> 寄件者：Adam Cartwright <acartwright@dlogistics.com>\n> 主旨：關於退休金的會面安排\n> 日期：11 月 29 日\n>\n> 哈囉 Sarah：\n>\n> [185] 我寫信是要回應昨天 Alexander 小姐寄的備忘錄。[182] 我目前提撥百分之 1.8 的薪水到退休基金。不過，9 月雇用合約續約的時候我獲得了加薪，所以我現在付得起更多。因此，[184] 我想要把提撥比率增加到百分之 3.5。\n>\n> [185] 我星期二和星期四整天都可以討論這件事，星期五下午 2 點之前也有空。請告訴我這裡面是否有最適合你的時間。\n>\n> Adam Cartwright\n\n**單字** 文章 1：pension (n.) 退休金，年金；executive (n.) 高層主管；(adj.) 經營管理的；board meeting (phr.) 董事會議；fund (n.) 資金，基金；scheme (n.) 制度，計畫；flexibility (n.) 彈性，靈活性；communicate (v.) 溝通，傳達；policy (n.) 政策，方針；contribute (v.) 貢獻，捐出（財物等）\n**單字** 文章 2：pay raise (phr.) 加薪；afford (v.)（經濟上或時間上）有餘裕，有本錢；contribution (n.)（醫療保險、退休金等的）個人負擔額，提撥額；contract (n.) 合約（書）；renew (v.) 更新，續（約）；available (adj.) 有空的，可以使用的\n\n<!-- page 176 -->\n\n**181.** 答案 (B)｜難度：高\nWhat is suggested about employees at Dakota Logistics?\n- (A) They can only change a contribution amount during contract negotiations.\n- (B) They have about a month to act on revised policy.\n- (C) They can arrange to have payments deducted automatically.\n- (D) They complained about a former company policy.\n\n> 關於 Dakota Logistics 公司的員工，文中顯示什麼？\n> (A) 他們只能在協商合約的時候改變提撥金額。\n> (B) 他們有大約一個月的時間對修訂的政策做出反應。\n> (C) 他們可以安排自動扣款。\n> (D) 他們抱怨之前的公司政策。\n\n**推論 細節資訊**\n這是關於題目關鍵字 employees at Dakota Logistics 的推論問題，要從 Dakota Logistics 公司給全體員工的備忘錄（第一篇文章）中找出相關的內容。備忘錄中的「Date: November 28」顯示這是 11 月 28 日發出的訊息，而「From January 1 of next year, this policy will change.」提到明年 1 月 1 日政策將會改變，可以推知修改過的政策大約一個月之後實施，所以 (B) They have about a month to act on revised policy 是正確答案。\n\n**單字** negotiation (n.) 協商，談判；act (v.) 行動；(n.) 行為；arrange (v.) 安排，準備；deduct (v.) 扣除\n\n**182.** 答案 (B)｜難度：高\nWhat is implied about Mr. Cartwright?\n- (A) He is being considered for a major promotion.\n- (B) He has been with the company for less than five years.\n- (C) He will be transferred to another department next week.\n- (D) He has completed a performance evaluation form.\n\n> 關於 Cartwright 先生，文中暗示什麼？\n> (A) 他現在被列為重大升職的考慮人選。\n> (B) 他在公司還不到 5 年。\n> (C) 他下週會被調到其他部門。\n> (D) 他完成了績效評估表。\n\n**推論 多篇文章綜合題**\n這是必須參考兩篇文章內容的多篇文章綜合題。首先看題目關鍵字 Mr. Cartwright 所寫的第二篇文章（電子郵件）中的相關內容。\n\n第二篇文章中的「I currently contribute 1.8 percent of my salary to the pension fund.」提到寄件者 Cartwright 先生目前提撥百分之 1.8 的薪水到退休基金，這是第一個線索。但是，這裡沒有提到他提撥百分之 1.8 的理由，所以還需要在第一篇文章（備忘錄）中確認。第一篇文章中的「employees who have been with the company less than five years contribute 1.8 percent of their salary to the pension fund」提到，在公司未滿五年的員工提撥百分之 1.8 的薪水到退休基金，這是第二個線索。綜合「Cartwright 先生目前提撥百分之 1.8 的薪水到退休基金」和「在公司未滿五年的員工提撥百分之 1.8 的薪水到退休基金」這兩個線索，可以推知 Cartwright 先生在公司資歷未滿 5 年，所以 (B) He has been with the company for less than five years 是正確答案。\n\n**單字** transfer (v.) 轉移，調動；evaluation (n.) 評價，評估\n\n**183.** 答案 (A)｜難度：中\nBased on the memo, what will change at the beginning of next year?\n- (A) The sum that workers can put toward a pension\n- (B) The bonuses employees are given for performing well\n- (C) The number of years needed to qualify for a program\n- (D) The method by which payments must be made\n\n> 根據備忘錄，什麼會在明年初改變？\n> (A) 員工能夠投入退休資金的數額\n> (B) 員工表現良好得到的獎金\n> (C) 適用計畫的年資數\n> (D) 必須使用的付款方式\n\n**wh- 問題 What**\n這是問根據備忘錄，什麼（What）會在明年初改變的 wh- 問題，所以要看第一篇文章（備忘錄）中關於問題重點 change at the beginning of next year 的部分。「From January 1 of next year, this policy will change. All staff will be able to choose which level of pension payment they want to use.」的部分提到，從明年 1 月 1 日開始，（退休金）政策將會改變，所有員工可以選擇退休金提撥的程度，所以 (A) The sum that workers can put toward a pension 是正確答案。\n\n**替換表達**\nat the beginning of next year 在明年初 → From January 1 of next year 從明年 1 月 1 日開始\n\n**單字** sum (n.) 總計，金額；qualify (v.) 得到資格，符合資格\n\n<!-- page 177 -->\n\n**184.** 答案 (C)｜難度：高\nWhat is Mr. Cartwright hoping to do?\n- (A) Increase the number of his working hours\n- (B) Get an extension on the deadline for a task\n- (C) Pay the maximum amount toward a pension scheme\n- (D) Take a temporary leave of absence from work\n\n> Cartwright 先生希望做什麼？\n> (A) 增加他的工作時數\n> (B) 讓一件工作的期限可以延期\n> (C) 付退休金計畫的最高額度\n> (D) 申請暫時休職\n\n**wh- 問題 多篇文章綜合題**\n這是必須參考兩篇文章內容的多篇文章綜合題。題目的關鍵部分是 Mr. Cartwright hoping to do，問 Cartwright 先生希望做什麼（What），所以先看 Cartwright 先生所寫的電子郵件（第二篇文章）中的相關內容。\n\n由第二篇文章的「I'm interested in increasing my contribution to 3.5 percent」可知，寄件者 Cartwright 先生想要把退休金提撥比增加到百分之 3.5，這是第一個線索。但是，這裡沒有提到百分之 3.5 是怎樣的數字，所以還需要確認備忘錄（第一篇文章）的內容。第一篇文章的「employees ~ contribute 1.8 percent of their salary to the pension fund, while those ~ contribute 2.7 percent」和「As well as the two existing options, employees will also be able to contribute an amount of up to 3.5 percent of their salary if they wish.」提到，員工目前提撥退休金比例有百分之 1.8 和 2.7 兩種，之後如果想要的話也可以提撥最高百分之 3.5 的金額，這是第二個線索。\n\n綜合「Cartwright 先生想要把退休金提撥比增加到百分之 3.5」和「退休金提撥比最高將會是百分之 3.5」這兩個線索，可以推知 Cartwright 先生想要付退休金計畫的最高提撥比，所以 (C) Pay the maximum amount toward a pension scheme 是正確答案。\n\n**單字** extension (n.) 延長，擴大；temporary (adj.) 臨時的，暫時的\n\n**185.** 答案 (D)｜難度：最高\nWhat is indicated about Ms. Chang?\n- (A) She requested a meeting with Mr. Cartwright.\n- (B) She schedules appointments for Ms. Alexander.\n- (C) She is usually unavailable in the afternoons.\n- (D) She is in charge of a department at Dakota Logistics.\n\n> 關於 Chang 小姐，文中提到什麼？\n> (A) 她要求和 Cartwright 先生會面。\n> (B) 她為 Alexander 小姐安排會面。\n> (C) 她下午通常沒空。\n> (D) 他負責 Dakota Logistics 公司的一個部門。\n\n**推論 多篇文章綜合題**\n這是必須參考兩篇文章內容的多篇文章綜合題。首先看寄給題目關鍵字 Ms. Chang 的第二篇文章（電子郵件）中的相關內容。\n\n第二篇文章中的「I am writing in response to yesterday's memo from Ms. Alexander.」和「I will be available to talk about this issue all day Tuesday and Thursday, and will also be free on Friday before 2 p.m. Let me know if there is a time that works best for you during those periods.」表示寄件者 Cartwright 先生是為了回應昨天 Alexander 小姐的備忘錄而寫這封信，而他星期二、星期四整天和星期五下午兩點前可以和收件者 Chang 小姐討論這件事，希望她告知什麼時候比較方便，這是第一個線索。但是，這裡沒有提到 Cartwright 先生為什麼是和 Chang 小姐討論，所以還需要在第一篇文章（備忘錄）中確認。第一篇文章中的「If you would like to discuss the options and receive some advice ~, please make an appointment with the head of the human resources department.」提到，如果想要討論並且獲得關於退休金的建議，要和人事部長安排會面，這是第二個線索。\n\n綜合「Cartwright 先生希望安排時間和 Chang 小姐會面，要討論 Alexander 小姐的備忘錄提到的事情」和「要討論退休金事宜，要和人事部長安排會面」這兩個線索，可以推知 Chang 小姐是人事部長，所以 (D) She is in charge of a department at Dakota Logistics 是正確答案。\n\n**替換表達**\nthe head of the ~ department 部長 → is in charge of a department 負責一個部門\n\n**單字** be in charge of (phr.) 負責…，掌管…\n\n<!-- page 178 -->\n\n### Questions 186-190 refer to the following announcement, e-mail, and information.\n186-190 題參照以下公告、電子郵件及資訊。\n\n文章 1\n> Association of Materials Engineers (AME)\n> 9th Annual Eastern Regional Conference\n> March 10 to 11 | Clifton, New Jersey\n>\n> Organized by the New Jersey Chapter of AME and hosted by the Clifton University College of Materials Science and Engineering, [186-A/D] the 9th Annual Eastern Regional Conference provides an opportunity for engineers and scientists to learn about new technologies and network with their peers. Join practical workshops, hear about the latest research, and build relationships with stakeholders and representatives from various sectors.\n>\n> Additionally, [186-B] the New Jersey Chapter is pleased to continue supporting the High School Engineering Outreach Program as part of the conference. High school students in the area will be invited to participate in planned activities to learn about various aspects of the materials engineering profession. [186-B] The program includes a special luncheon where students can interact with practicing engineers.\n>\n> [187] Businesses are also invited to run advertisements in our program brochure or display promotional banners at the venue. If your company is interested in doing so to support this event, please contact event coordinator Melinda Rose at m.rose@ame.org. For all other information, visit our Web site at www.ame.org/conference.\n\n**翻譯**\n> 材料工程師協會（AME）\n> 第 9 屆東部區域年會\n> 3 月 10 至 11 日 | 克利夫頓，紐澤西州\n>\n> 由 AME 紐澤西分會籌備、克利夫頓大學材料科學暨工程學院主辦的 [186-A/D] 第 9 屆東部區域年會，為工程師及科學家提供學習最新科技並與同儕交流的機會。請加入實用的研習會、聽最新的研究內容，並且和來自各種領域的關係人以及代表建立關係。\n>\n> 此外，[186-B] 作為會議的一部分，紐澤西分會很高興能持續贊助高中生工程學推廣計畫。區域內的高中生將受邀參加預定的活動，學習材料工程職業的各種面向。[186-B] 這個計畫包括一場特別午餐會，讓學生能和實際執業的工程師互動。\n>\n> [187] 我們也邀請企業在我們的會議手冊刊登廣告，或者在會場懸掛宣傳布條。如果您的公司有興趣藉此贊助本活動，請聯絡活動籌辦人 Melinda Rose，郵件位址是 m.rose@ame.org。其他所有資訊請上我們的網站 www.ame.org/conference。\n\n文章 2\n> To: Melinda Rose <m.rose@ame.org>\n> From: Paula Vance <p.vance@hiller.com>\n> Date: January 22\n> Subject: Conference\n>\n> Dear Ms. Rose,\n>\n> Thank you for processing our request. [187] A digital copy of the full-page advertisement meant for inclusion in your brochure has been attached. [188] Other marketing materials will be sent in a separate e-mail as soon as they are finalized. I also received the four conference tickets as part of the benefits package. Incidentally, [190] I'd like to inquire about the price of obtaining full conference tickets on the day of the event. A colleague from an affiliated company in Europe is interested in attending, but he cannot be sure of his availability until a few days before the event. [190] He is not yet a member of the AME but belongs to the European Society of Engineers, with whom we will be working closely on a future project.\n>\n> I appreciate your assistance and look forward to hearing from you shortly.\n>\n> Paula Vance\n> Senior engineer\n> Hiller Engineering\n\n**翻譯**\n> 收件者：Melinda Rose <m.rose@ame.org>\n> 寄件者：Paula Vance <p.vance@hiller.com>\n> 日期：1 月 22 日\n> 主旨：會議\n>\n> 親愛的 Rose 小姐：\n>\n> 感謝您處理我們的請求。[187] 我附上了要放進你們手冊裡的全頁廣告電子檔。[188] 其他宣傳資料只要確定之後就會另外用電子郵件寄過去。我也收到了優待方案所提供的 4 張會議門票。對了，[190] 我想要詢問活動當天購買會議全程門票的價格。我在歐洲的關係企業的一位同事有興趣參加，但他要到活動前幾天才能確定有沒有空。[190] 他還不是 AME 的會員，但他是歐洲工程師協會的成員，我們會和他密切合作一項未來的計畫。\n>\n> 感謝您的協助，也期待很快得到您的回覆。\n>\n> Paula Vance\n> 資深工程師\n> Hiller Engineering 公司\n\n<!-- page 179 -->\n\n文章 3\n> [189-B] Association of Materials Engineers (AME)\n> 9th Annual Eastern Regional Conference\n>\n> Registration Fees\n>\n> **One-day registration**\n>\n> | | Early | Regular | On-site |\n> |---|---|---|---|\n> | Member | $150 | $230 | $285 |\n> | Non-member | $175 | $255 | $310 |\n> | Student* | $45 | $75 | $100 |\n>\n> **[190] Two-day registration**\n>\n> | | Early | Regular | [190] On-site |\n> |---|---|---|---|\n> | Member | $225 | $340 | $425 |\n> | [190] Non-member | $265 | $380 | [190] $460 |\n> | Student* | $75 | $95 | $120 |\n>\n> The deadline for early registration is on January 24, and February 16 is the deadline for regular registration.\n>\n> *Prices shown are for both graduate and undergraduate students enrolled in any science or engineering program around the country. [189-B] High school students attending as part of our outreach program may enter free.\n\n**翻譯**\n> [189-B] 材料工程師協會（AME）\n> 第 9 屆東部區域年會\n>\n> 報名費\n>\n> **報名 1 天**\n>\n> | | 早期報名 | 一般報名 | 現場報名 |\n> |---|---|---|---|\n> | 會員 | 150 美元 | 230 美元 | 285 美元 |\n> | 非會員 | 175 美元 | 255 美元 | 310 美元 |\n> | 學生* | 45 美元 | 75 美元 | 100 美元 |\n>\n> **[190] 報名 2 天**\n>\n> | | 早期報名 | 一般報名 | [190] 現場報名 |\n> |---|---|---|---|\n> | 會員 | 225 美元 | 340 美元 | 425 美元 |\n> | [190] 非會員 | 265 美元 | 380 美元 | [190] 460 美元 |\n> | 學生* | 75 美元 | 95 美元 | 120 美元 |\n>\n> 早期報名截止期限為 1 月 24 日，2 月 16 日為一般報名截止期限。\n>\n> *表列價格適用於全國科學或工程學程註冊研究生及大學生。[189-B] 藉由我們的推廣計畫參加的高中生可免費入場。\n\n**單字** 文章 1：association (n.) 協會，聯合；conference (n.) 會議，討論會，研討會；opportunity (n.) 機會；stakeholder (n.) 利害關係人（股東與經營者、員工等等）；sector (n.) 領域，部門；luncheon (n.) 午餐會；regional (adj.) 區域的，地方的；peer (n.) 同儕，同輩；outreach (n.) 對外的關懷活動，推廣活動；promotional (adj.) 宣傳的，促銷的；chapter (n.) 分會，一章；representative (n.) 代表，代理人；profession (n.) 職業，專業\n**單字** 文章 2：benefits package (phr.) 優待方案，福利方案；inclusion (n.) 包含；separate (adj.) 分別的；(v.) 分開；full-page (adj.) 全頁的；incidentally (adv.) 順帶一提\n**單字** 文章 3：enroll (v.) 註冊，使入學\n\n**186.** 答案 (C)｜難度：中\nAccording to the announcement, what is NOT included in the 9th Annual Eastern Regional Conference?\n- (A) Networking opportunities\n- (B) A lunch with students\n- (C) A tour of a facility\n- (D) Learning sessions\n\n> 根據公告，第 9 屆東部區域年會不包括什麼？\n> (A) 交流（建立人脈）的機會\n> (B) 與學生共進午餐\n> (C) 設施導覽\n> (D) 學習的課程\n\n**Not/True Not 問題**\n這是需要在公告中找到與關鍵字 included in the 9th Annual Eastern Regional Conference 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A) 和 (D) 對應文中的「the 9th Annual Eastern Regional Conference provides an opportunity ~ to learn about new technologies and network with their peers」，表示第 9 屆東部區域年會提供學習新技術以及和同儕交流的機會，符合選項敘述。(B) 對應文中的「the New Jersey Chapter is pleased to continue supporting the High School Engineering Outreach Program as part of the conference」、「The program includes a special luncheon where students can interact with ~ engineers.」，表示會議內容也包括對於高中生的工程學推廣活動，以及可以讓學生和工程師互動的午餐會，符合選項敘述。(C) 在文中沒有提到，所以 (C) A tour of a facility 是正確答案。\n\n<!-- page 180 -->\n\n**替換表達**\nluncheon 午餐會 → lunch 午餐\n\n**單字** session (n.)（會議、課程等等的）時間\n\n**187.** 答案 (C)｜難度：（掃描左緣被切，無法辨識）\nWhat is indicated about Hiller Engineering?\n- (A) It signed up for a session through a Web site.\n- (B) It plans to open an exhibit booth.\n- (C) It registered as a conference sponsor.\n- (D) It is sending all of its employees to an event.\n\n> 關於 Hiller Engineering 公司，文中提到什麼？\n> (A) 透過網站報名了一場會議。\n> (B) 計畫設立一個展示攤位。\n> (C) 登記成為了會議贊助商。\n> (D) 會派所有員工去一場活動。\n\n**推論 多篇文章綜合題**\n這是必須參考三篇文章其中兩篇內容的多篇文章綜合題。首先看題目關鍵字 Hiller Engineering 公司的 Paula Vance 所寫的電子郵件（第二篇文章）中的相關內容。\n\n第二篇文章中的「A digital copy of the full-page advertisement meant for inclusion in your brochure has been attached.」表示已經附上了要放在手冊裡的全頁廣告電子檔，這是第一個線索。但是，這裡沒有提到 Hiller Engineering 公司寄廣告檔案的理由，所以還需要在在第一篇文章（公告）中確認。第一篇文章中的「Businesses are also invited to run advertisements in our program brochure or display promotional banners at the venue. If your company is interested in doing so to support this event, please contact」提到，邀請企業在會議手冊刊登廣告，或者在會場懸掛宣傳布條，請有意贊助活動者聯絡，這是第二個線索。綜合「Hiller Engineering 公司寄了手冊用的廣告檔案」和「贊助企業可以在會議手冊刊登廣告或懸掛宣傳布條」這兩個線索，可以推知 Hiller Engineering 公司已經決定贊助這場會議，所以 (C) It registered as a conference sponsor 是正確答案。\n\n**單字** exhibit (n.) 展示；(v.) 展示；sponsor (n.) 贊助者\n\n**188.** 答案 (D)｜難度：（掃描左緣被切，無法辨識）\nWhat can Ms. Rose expect to receive from Ms. Vance?\n- (A) A list of names\n- (B) Copies of a contract\n- (C) A product brochure\n- (D) Further promotional documents\n\n> Rose 小姐可以預期會從 Vance 小姐那邊收到什麼？\n> (A) 名單\n> (B) 合約的一些複本\n> (C) 產品手冊\n> (D) 更多宣傳文件\n\n**wh- 問題 What**\n這是問 Rose 小姐可以預期會從 Vance 小姐那邊收到什麼（What）的 wh- 問題，所以要看問題重點 Vance 小姐寄給 Rose 小姐的電子郵件（第二篇文章）。第二篇文章中，「Other marketing materials will be sent in a separate e-mail as soon as they are finalized.」的部分提到，其他宣傳資料只要確定之後就會另外用電子郵件寄過去，所以 (D) Further promotional documents 是正確答案。\n\n**替換表達**\nmarketing materials 宣傳資料 → promotional documents 宣傳文件\n\n**單字** contract (n.) 合約\n\n<!-- page 181 -->\n\n**189.** 答案 (B)｜難度：中\nWhat is mentioned about the conference fees?\n- (A) They cannot be refunded after having been paid.\n- (B) They do not apply to participants of the AME's high school program.\n- (C) They are lower for high school students than college students.\n- (D) They may be discounted for people who apply in groups.\n\n> 關於會議費用，文中提到什麼？\n> (A) 付款後就不能退費。\n> (B) 不適用於 AME 的高中計畫參加者。\n> (C) 高中生的費用比大學生低。\n> (D) 團體報名的人，費用會有折扣。\n\n**Not/True** True 問題\n這是需要找到與關鍵字 the conference fees 相關的資訊，並且與選項敘述對照的 Not/True 問題，所以要看提到報名費的資訊（第三篇文章）。(A) 在文中沒有提到。(B) 對應文中的「Association of Materials Engineers (AME)」、「High school students attending as part of our outreach program may enter free.」，表示參加推廣活動的高中生，可以免費參加材料工程師協會的東部區域年會，表列的價格和他們無關，所以 (B) They do not apply to participants of the AME's high school program 是正確答案。(C) 和 (D) 在文中沒有提到。\n\n**單字** refund (v.) 退回（款項）；(n.) 退款；apply (v.) 適用，申請\n\n**190.** 答案 (D)｜難度：最高\nHow much will Ms. Vance's colleague have to pay for his ticket?\n- (A) $230\n- (B) $310\n- (C) $380\n- (D) $460\n\n> Vance 小姐的同事要付多少錢買門票？\n> (A) 230 美元\n> (B) 310 美元\n> (C) 380 美元\n> (D) 460 美元\n\n**wh- 問題** 多篇文章綜合題\n這是必須參考三篇文章其中兩篇內容的多篇文章綜合題。題目的關鍵部分是 Ms. Vance's colleague ~ pay for his ticket，問 Vance 小姐的同事要付多少錢（How much）買門票，所以先看 Vance 小姐所寫的電子郵件（第二篇文章）。\n\n第二篇文章中的「I'd like to inquire about the price of obtaining full conference tickets on the day of the event」、「colleague ~ is interested in attending, but he cannot be sure of his availability」和「He is not yet a member of the AME」提到，寄件者 Vance 小姐想知道活動當天購買會議全程門票的價格，因為她的同事想參加，但是不能確定是否有空，而且他不是 AME 的成員，這是第一個線索。但是，這裡沒有提到費用是多少，所以還需要確認資訊（第三篇文章）的內容。第三篇文章中的「Two-day registration, On-site, Non-member, $460」顯示非會員現場報名全程 2 天的費用是 460 美元，這是第二個線索。\n\n綜合「Vance 小姐的同事想在活動當天購買會議全程門票，而且他不是會員」和「非會員現場報名全程 2 天的費用是 460 美元」這兩個線索，可以推知 Vance 小姐的同事要付 460 美元買門票，所以 (D) $460 是正確答案。\n\n<!-- page 182 -->\n\n### Questions 191-195 refer to the following advertisement, e-mail, and program.\n191-195 題參照以下廣告、電子郵件及活動時程表。\n\n**文章 1**\n\n> Grand Deville Hotel: Five-Star Accommodation on the Vancouver Waterfront\n>\n> [191-B] The Grand Deville Hotel is opening at the end of August, and we are excited about offering our guests the best experience in downtown Vancouver. Our 10-story facility has already been receiving positive coverage in numerous publications, and our rooms are almost fully booked for the first two weeks.\n>\n> Some of our amenities include:\n> - A large indoor swimming pool and exercise room, both of which every guest can use free of charge\n> - Single rooms starting at $100 a night and double rooms starting at $160 a night\n> - [192-A] A restaurant and event space, La Vie Boheme, that serves a variety of dishes from around the globe\n> - [194] A conference room with a 100-person capacity, a salon with a 50-person capacity, a boardroom with a 60-person capacity, and a ballroom with a 200-person capacity\n> - A hot tub and [192-D] a minibar in every room\n> - [192-B] Cable television with over 300 channels\n>\n> Don't wait — book your room today by visiting www.devillevancouver.co.ca or by calling 555-9532. If you have any questions, send an e-mail to questions@devillevancouver.co.ca.\n\n**翻譯**\n> Grand Deville 飯店：溫哥華海岸五星級住宿\n>\n> [191-B] Grand Deville 飯店將於 8 月底開幕，我們很期待為住客提供溫哥華市中心最佳的體驗。我們 10 層樓的設施已經獲得許多刊物的正面報導，我們最初 2 週的客房也幾乎完全預約客滿。\n>\n> 我們的便利設施包括：\n> - 大型室內游泳池及運動室，每位住客皆可免費使用\n> - 單人房每晚 100 美元起，雙人房每晚 160 美元起\n> - [192-A] 餐廳暨活動空間「La Vie Boheme」，供應全球各地的多樣料理\n> - [194-A] 可容納 100 人的會議廳、容納 50 人的會客室、容納 60 人的會議室，以及容納 200 人的宴會廳\n> - [192-D] 每間客房皆有大型浴缸及迷你吧\n> - [192-B] 有超過 300 個頻道的有線電視\n>\n> 別再等了－今天就上 www.devillevancouver.co.ca 或撥打 555-9532 訂房。若您有任何問題，請寄電子郵件至 questions@devillevancouver.co.ca。\n\n**文章 2**\n\n> TO: <questions@devillevancouver.co.ca>\n> FROM: Derek Raymond <draymond@bcinstitute.co.ca>\n> SUBJECT: Some queries\n> DATE: August 30\n>\n> My name is Derek Raymond, and I'm an employee at the Biological Research Center at the British Columbia Technology Institute (BCTI). Several members of our center recently won a prestigious science award. We plan to celebrate this **momentous** occasion with a banquet. [194] We would like to book a space that is large enough for about 150 guests. If that's possible, [194/195] we will be holding our event on September 27 at your hotel.\n>\n> Also, some of my colleagues and [195] I would like to stay the night. Please let me know if there are any rooms still available for that date. If so, I think eight single rooms would suit our requirements.\n>\n> Regards,\n>\n> Derek Raymond\n\n**翻譯**\n> 收件者：<questions@devillevancouver.co.ca>\n> 寄件者：Derek Raymond <draymond@bcinstitute.co.ca>\n> 主旨：一些詢問\n> 日期：8 月 30 日\n>\n> 我的名字是 Derek Raymond，我是不列顛哥倫比亞科技學院（BCTI）生物研究中心的員工。本中心幾位同仁最近獲得極具聲譽的科學獎項。我們計畫舉辦宴會慶祝這個重大的時刻。[194] 我們想要預訂大小足以容納約 150 名賓客的空間。如果可以（提供這樣的空間）的話，[194/195] 我們 9 月 27 日將於貴飯店舉辦活動。\n>\n> 還有，一些同事和 [195] 我想要住一晚。請告訴我那天是否還有房間。如果有的話，我想 8 間單人房可以滿足我們的需求。\n>\n> Derek Raymond\n\n<!-- page 183 -->\n\n**文章 3**\n\n> BCTI Biological Research Center\n> STAFF RECOGNITION BANQUET: For Pine Beetle Research Team\n> September 27, 7:00 p.m., Grand Deville Hotel\n>\n> | 時間 | 內容 |\n> |---|---|\n> | 7:00 p.m. | Opening remarks, Josh Rainer, Director of BCTI Biological Research Center |\n> | 7:15 p.m. | Dinner* service, meal provided by La Vie Boheme |\n> | 8:15 p.m. | Presentation of certificates of appreciation and bonuses to team members and team leader |\n> | 9:00 p.m. | Talk by team leader Edwina Paige on her team's award-winning work using technology that halts deforestation brought on by pine beetles |\n> | 9:15 p.m. | Live performance by band The Fulstone Trio playing favorite jazz numbers |\n>\n> *Please check menu cards on the table for fish, meat, and vegetarian options. Check your preference and hand the card to your server. [195] Guests staying overnight will also be provided a complimentary buffet breakfast between 7 a.m. and 11 a.m. the next day.\n\n**翻譯**\n> BCTI 生物研究中心\n> 員工表揚宴會：\n> 為了松樹甲蟲研究團隊舉辦\n> 9 月 27 日，晚上 7:00，Grand Deville 飯店\n>\n> | 時間 | 內容 |\n> |---|---|\n> | 晚上 7:00 | 開場致詞，BCTI 生物研究中心主任 Josh Rainer |\n> | 晚上 7:15 | 晚餐*服務，餐點由 La Vie Boheme 提供 |\n> | 晚上 8:15 | 頒發感謝狀及獎金給團隊成員及團隊領導人 |\n> | 晚上 9:00 | 團隊領導人 Edwina Paige 發表關於運用科技阻止松樹甲蟲帶來森林危害的獲獎研究的演說 |\n> | 晚上 9:15 | The Fulstone Trio 樂團現場表演受歡迎的爵士金曲 |\n>\n> *請勾選桌上的菜單卡，從魚、肉、素食中選擇。請勾選您偏好的選擇，並且交給侍者。[195] 要過夜的來賓將獲得隔天上午 7 點至 11 點間的免費自助早餐。\n\n**單字**\n文章 1：accommodation (n.) 住宿設施，適應；coverage (n.) 報導，保險理賠範圍；capacity (n.) 容量，容納人數；amenity (n.) 便利設施；salon (n.) 會客室，（美容美髮）沙龍；waterfront (n.) 水岸，海岸地區；free of charge (phr.) 免費；ball room (phr.) 宴會廳\n文章 2：query (n.) 詢問；banquet (n.) 宴會，晚宴；prestigious (adj.) 有名望的，有聲望的；requirement (n.) 要求，必要條件；occasion (n.) 場合，重大的時刻\n文章 3：recognition (n.) 表彰，認識，認出；remark (n.) 言論，談論；(v.) 談到；appreciation (n.) 感謝，欣賞；deforestation (n.) 森林砍伐，森林破壞；complimentary (adj.) 免費附贈的，稱讚的；pine beetle (phr.) 松樹甲蟲（山松甲蟲、松小蠹蟲）；presentation (n.) 贈與，提出；halt (v.) 停止，終止；certificate (n.) 證書，證明；preference (n.) 偏好\n\n**191.** 答案 (B)｜難度：高\nAccording to the advertisement, what is true about Vancouver?\n- (A) It hosted a large number of tourists over the past year.\n- (B) A new building will be opened in its city center.\n- (C) A waterfront area is being developed for visitor activities.\n- (D) It is a frequent location for conferences and conventions.\n\n> 根據廣告，關於溫哥華，何者正確？\n> (A) 去年迎接了許多觀光客。\n> (B) 市中心將有一棟新建築物開幕。\n> (C) 一塊濱海區域正為了觀光客活動用途進行開發。\n> (D) 是各種會議與大會經常舉行的地點。\n\n**Not/True** True 問題\n這是要在廣告（第一篇文章）中找到與關鍵字 Vancouver 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A) 在文中沒有提到。(B) 對應文中的「The Grand Deville Hotel is opening ~, and we are excited about offering our guests the best experience in downtown Vancouver.」，表示 Grand Deville 飯店即將開幕，很期待能為住客提供溫哥華市中心區最佳的體驗，符合選項敘述，所以 (B) A new building will be opened in its city center 是正確答案。(C) 和 (D) 在文中沒有提到。\n\n<!-- page 184 -->\n\n**替換表達** downtown 市中心區，市區 → city center 市中心\n\n**單字** frequent (adj.) 頻繁的，經常發生的\n\n**192.** 答案 (C)｜難度：[?]\nWhat is NOT a feature of the Grand Deville Hotel?\n- (A) An establishment serving international cuisines\n- (B) A large selection of television channels\n- (C) Outdoor sports and recreation facilities\n- (D) Bar items in private rooms\n\n> 什麼不是 Grand Deville 飯店的特色？\n> (A) 一間供應世界各地料理的設施\n> (B) 許多的電視頻道\n> (C) 戶外的運動及娛樂設施\n> (D) 個別客房的吧台供應品\n\n**Not/True** Not 問題\n這是需要找到與關鍵字 a feature of the Grand Deville Hotel 相關的資訊，並且與選項敘述對照的 Not/True 問題，所以要看介紹飯店的廣告（第一篇文章）。(A) 對應文中的「A restaurant ~ serves a variety of dishes from around the globe」，表示有一間供應全世界多種料理的餐廳，符合選項敘述。(B) 對應文中的「Cable television with over 300 channels」，表示有超過 300 個頻道的有線電視，符合選項敘述。(C) 在文中沒有提到，所以 (C) Outdoor sports and recreation facilities 是正確答案。(D) 對應文中的「a minibar in every room」，表示每間房間都有迷你吧（提供付費飲食的小冰箱，有時也包含食物櫃），符合選項敘述。\n\n**替換表達**\na variety of dishes from around the globe 全球的多樣菜餚 → international cuisines 國際的料理\ntelevision with over 300 channels 有超過 300 個頻道的電視 → A large selection of television channels 許多的電視頻道\n\n**單字** establishment (n.) 設施，機關；cuisine (n.) 菜餚，料理\n\n**193.** 答案 (C)｜難度：高\nIn the e-mail, the word \"momentous\" in paragraph 1, line 3, is closest in meaning to\n- (A) within a brief period of time\n- (B) of extreme necessity\n- (C) of considerable significance\n- (D) within the realm of possibility\n\n> 電子郵件第 1 段第 3 行的「momentous」，意思最接近\n> (A) 在短時間內\n> (B) 極具必要性的\n> (C) 有很重要的意義\n> (D) 在可能的範圍內（有可能的）\n\n**同義詞**\n在電子郵件（第二篇文章）中，momentous 在「We plan to celebrate this momentous occasion with a banquet.」這個句子裡的意思是「重大的」，所以表示「有很重要的意義」的 (C) of considerable significance 是正確答案。\n\n**單字** brief (adj.) 短暫的，簡短的；necessity (n.) 必要（性），必需品；significance (n.) 意義，重要性；realm (n.) 領域，範圍；possibility (n.) 可能性，可能的事情\n\n<!-- page 185 -->\n\n**194.** 答案 (D)｜難度：中\nWhere in the hotel will the celebration probably be held?\n- (A) In the conference room\n- (B) In the restaurant\n- (C) In the boardroom\n- (D) In the ballroom\n\n> 慶祝活動可能在飯店的哪裡舉行？\n> (A) 在會議廳\n> (B) 在餐廳\n> (C) 在（董事會）會議室\n> (D) 在宴會廳\n\n**推論** 多篇文章綜合題\n這是必須參考三篇文章其中兩篇內容的多篇文章綜合題。首先看與題目關鍵部分 in the hotel ~ the celebration ~ be held 相關的電子郵件（第二篇文章）。\n\n第二篇文章中的「We would like to book a space that is large enough for about 150 guests. If that's possible, we will be holding our event on September 27 at your hotel.」表示想要預訂可以容納 150 人的場地，如果訂得到的話，9 月 27 日就在飯店辦活動，這是第一個線索。但是，這裡沒有提到符合條件的場地是什麼，所以還需要在第一篇文章（廣告）中確認。第一篇文章中的「A conference room with a 100-person capacity, a salon with a 50-person capacity, a boardroom with a 60-person capacity, and a ballroom with a 200-person capacity」表示飯店裡有能容納 100 人的會議廳、容納 50 人的會客室、容納 60 人的（董事會）會議室，以及容納 200 人的宴會廳，這是第二個線索。\n\n綜合「9 月 27 日的活動希望能預訂到可容納 150 人的場地」和「飯店裡有能容納 100 人的會議廳、容納 50 人的會客室、容納 60 人的（董事會）會議室，以及容納 200 人的宴會廳」這兩個線索，可以推知活動將在飯店內可容納 200 人的宴會廳舉辦，所以 (D) In the ballroom 是正確答案。\n\n**195.** 答案 (C)｜難度：中\nWhat can be inferred about Derek Raymond?\n- (A) He selected the musical entertainment for a celebration.\n- (B) He was recently honored for a research achievement.\n- (C) He can have a free breakfast on September 28.\n- (D) He is the head of a technological research center.\n\n> 關於 Derek Raymond，可以推知什麼？\n> (A) 他為慶祝活動選擇了音樂娛樂表演。\n> (B) 他最近因為研究成就而獲得榮譽。\n> (C) 9 月 28 日他可以吃免費早餐。\n> (D) 他是科技研究中心的主任。\n\n**推論** 多篇文章綜合題\n這是必須參考三篇文章其中兩篇內容的多篇文章綜合題。首先看題目關鍵字 Derek Raymond 所寫的電子郵件（第二篇文章）。\n\n第二篇文章中的「we will be holding our event on September 27 at your hotel」提到 9 月 27 日想要在飯店舉辦活動，之後「I would like to stay the night」表明想要（當天在飯店）過夜，這是第一個線索。但是，這裡沒有提到住宿相關的細節，所以還需要在第三篇文章（活動時程表）中確認。第三篇文章中的「Guests staying overnight will also be provided a complimentary buffet breakfast between 7 a.m. and 11 a.m. the next day.」顯示在飯店過夜的賓客除了活動的晚餐以外 const MARK = /\[(\d{3}(?:-[A-D](?:\/[A-D])*)?(?:\/\d{3}(?:-[A-D](?:\/[A-D])*)?)*)\]\s?/g;
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function inline(s) {
  s = esc(s).replace(/\\\*/g, "\u0001");
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>");
  s = s.replace(/\u0001/g, "*").replace(/\\([\[\]_#-])/g, "$1");
  return s.replace(MARK, (_, m) => `<span class="mk">${m}</span>`);
}
function md(text) {
  const lines = text.split("\n");
  let out = "", i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    if (l.startsWith(">")) {
      const buf = [];
      while (i < lines.length && lines[i].startsWith(">")) { buf.push(lines[i].replace(/^> ?/, "")); i++; }
      out += "<blockquote>" + md(buf.join("\n")) + "</blockquote>"; continue;
    }
    if (l.trim().startsWith("|")) {
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith("|")) { rows.push(lines[i].trim()); i++; }
      const cells = r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      let html = "<table>";
      rows.forEach((r, k) => {
        if (/^\|[\s\-:|]+\|$/.test(r)) return;
        const cs = cells(r);
        if (k === 0 && cs.every(c => !c)) return;
        const tag = k === 0 && rows[1] && /^\|[\s\-:|]+\|$/.test(rows[1]) ? "th" : "td";
        html += "<tr>" + cs.map(c => `<${tag}>${inline(c)}</${tag}>`).join("") + "</tr>";
      });
      out += html + "</table>"; continue;
    }
    if (/^- /.test(l)) {
      out += "<ul>";
      while (i < lines.length && /^- /.test(lines[i])) { out += "<li>" + inline(lines[i].slice(2)) + "</li>"; i++; }
      out += "</ul>"; continue;
    }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !lines[i].startsWith(">") && !/^- /.test(lines[i]) && !lines[i].trim().startsWith("|")) { buf.push(inline(lines[i])); i++; }
    out += "<p>" + buf.join("<br>") + "</p>";
  }
  return out;
}

const Q_HEAD = /^\*\*(\d{3})\.\*\*\s*(🆕)?\s*(?:答案 \(([A-D])\)(?:｜難度：([^\s🆕]+))?)?\s*(🆕)?/;
function parseQBlock(lines) {
  const m = lines[0].match(Q_HEAD);
  const q = { num: m[1], isNew: !!(m[2] || m[5]), answer: m[3] || null, level: m[4] || "", text: [], options: [], rest: [] };
  let stage = "text";
  for (const l of lines.slice(1)) {
    const o = l.match(/^- \(([A-D])\)\s?(.*)$/);
    if (stage !== "rest" && o) { stage = "opts"; q.options.push({ key: o[1], text: o[2] }); continue; }
    if (stage === "opts") stage = "rest";
    (stage === "text" ? q.text : q.rest).push(l);
  }
  q.body = lines.slice(1).join("\n").trim();
  q.text = q.text.join("\n").trim();
  q.rest = q.rest.join("\n").trim();
  return q;
}
function splitBlocks(lines) {
  const pre = [], blocks = [];
  for (const l of lines) {
    if (Q_HEAD.test(l)) blocks.push([l]);
    else if (blocks.length) blocks[blocks.length - 1].push(l);
    else pre.push(l);
  }
  return { pre, blocks: blocks.map(parseQBlock) };
}
function parsePreamble(pre, expected) {
  const sub = pre.length && !pre[0].startsWith(">") ? pre.shift() : "";
  // 判斷是不是中文翻譯：看中文字佔的比例（原文偶爾夾少量中文註記）
  const isTrans = t => {
    const cjk = (t.match(/[一-鿿]/g) || []).length, latin = (t.match(/[A-Za-z]/g) || []).length;
    return cjk > 0 && cjk / (cjk + latin) > 0.2;
  };
  // 第一步：切成一塊一塊（文章標籤 / 原文 / 翻譯）
  const chunks = [], vocab = [];
  let quote = null, afterTransLabel = false, inVocab = false;
  const flush = () => {
    if (!quote) return;
    const text = quote.join("\n");
    chunks.push({ type: afterTransLabel || isTrans(stripMarks(text)) ? "trans" : "en", text });
    quote = null; afterTransLabel = false;
  };
  for (const l of pre) {
    if (inVocab) { vocab.push(l); continue; }
    if (l.startsWith(">") || l.trim().startsWith("|")) { (quote || (quote = [])).push(l); continue; }
    flush();
    const lab = l.match(/^\*{0,2}文章\s*(\d+)\*{0,2}\s*$/);
    if (lab) chunks.push({ type: "label", text: "文章 " + lab[1] });
    else if (l.startsWith("**單字**")) { inVocab = true; vocab.push(l); }
    else if (l.trim() === "**翻譯**") afterTransLabel = true;
  }
  flush();
  // 第二步：沒標「文章 N」的地方，從「翻譯之後又出現的英文」裡挑最長的幾段當作新文章的開頭
  const labels = chunks.filter(c => c.type === "label").length;
  const lastLabel = chunks.map(c => c.type).lastIndexOf("label");
  const cands = chunks.map((c, k) => ({ c, k }))
    .filter(({ c, k }) => c.type === "en" && k > lastLabel && k > 0 && chunks[k - 1].type === "trans" && chunks.slice(0, k).some(x => x.type === "en"));
  const need = expected - Math.max(labels, 1);
  if (need > 0) cands.sort((a, b) => b.c.text.length - a.c.text.length).slice(0, need).forEach(({ c }) => c.split = true);
  // 第三步：組合
  const passages = [], trans = [];
  let cur = null;
  for (const c of chunks) {
    if (c.type === "label") { cur = { label: c.text, lines: [] }; passages.push(cur); trans.push(`**${c.text}**`); }
    else if (c.type === "trans") trans.push(c.text);
    else {
      if (!cur || c.split) { cur = { label: "", lines: [] }; passages.push(cur); }
      cur.lines.push(c.text);
    }
  }
  if (passages.length > 1) passages.forEach((p, k) => { if (!p.label) p.label = "文章 " + (k + 1); });
  return { sub, passages: passages.filter(p => p.lines.length), trans: trans.join("\n\n"), vocab: vocab.join("\n") };
}

for (const l of raw.slice(startIdx)) {
  const pm = l.match(/^## PART (\d)/);
  if (pm) { part = pm[1]; parts[part] = []; section = null; continue; }
  if (!part) continue;
  const sm = l.match(/^### (.+)$/);
  if (sm) { section = { heading: sm[1].replace(/\s*🆕\s*$/, ""), isNew: /🆕/.test(sm[1]), lines: [] }; parts[part].push(section); continue; }
  if (!section) { section = { heading: null, lines: [] }; parts[part].push(section); }
  section.lines.push(l);
}

// 統一成「題組」：Part 5 每題一組，Part 6/7 每篇文章一組
const sets = [];
for (const p of Object.keys(parts)) {
  for (const sec of parts[p]) {
    const { pre, blocks } = splitBlocks(sec.lines);
    if (!sec.heading) {
      blocks.forEach(q => sets.push({ id: "q" + q.num, part: p, heading: null, questions: [q] }));
      continue;
    }
    const first = +(blocks[0] && blocks[0].num);
    const info = parsePreamble(pre, first >= 186 ? 3 : first >= 176 ? 2 : 1); // 多益 176-185 雙篇、186-200 三篇
    const byNum = {};
    for (const b of blocks) {
      const q = byNum[b.num] || (byNum[b.num] = { num: b.num, isNew: false, options: [], text: "", rest: "" });
      q.isNew = q.isNew || b.isNew;
      if (b.answer && q.options.length) { q.answer = b.answer; q.level = b.level; q.rest = b.body; } // Part 6：選項在前面，這塊全是解析
      else if (b.answer) { q.answer = b.answer; q.level = b.level; q.rest = b.rest; q.text = b.text; q.options = b.options; }
      else { if (b.options.length) q.options = b.options; if (b.rest) info.vocab += (info.vocab ? "\n\n" : "") + b.rest; }
    }
    const questions = Object.values(byNum).sort((a, b) => a.num - b.num);
    sets.push({ id: "s" + questions[0].num, part: p, heading: sec.heading, isNew: sec.isNew, ...info, questions });
  }
}

/* ---------- 作答紀錄 ---------- */
let state = {};
try { state = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) {}
const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} };
const st = id => state[id] || (state[id] = { picks: {}, done: false });

/* ---------- 畫面 ---------- */
const $ = s => document.querySelector(s);
document.title = title + " 閱讀練習";
$("#title").textContent = title + " 閱讀練習";
const partKeys = Object.keys(parts);
let curPart = partKeys[0];
try { const saved = localStorage.getItem(STORE_KEY + "-tab"); if (partKeys.includes(saved)) curPart = saved; } catch (e) {}

function renderTabs() {
  $("#tabs").innerHTML = partKeys.map(p =>
    `<button data-p="${p}" class="${p === curPart ? "active" : ""}">Part ${p}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    curPart = b.dataset.p;
    try { localStorage.setItem(STORE_KEY + "-tab", curPart); } catch (e) {}
    renderTabs(); renderMain(); scrollTo({ top: 0 });
  });
}

function renderScore() {
  let right = 0, done = 0, total = 0;
  for (const s of sets) {
    total += s.questions.length;
    const x = state[s.id];
    if (x && x.done) s.questions.forEach(q => { done++; if (x.picks[q.num] === q.answer) right++; });
  }
  $("#score").innerHTML = `已作答 <b>${done}</b> / ${total} 題，答對 <b>${right}</b> 題` + (done ? `（${Math.round(right / done * 100)}%）` : "");
}

function questionHTML(set, q) {
  const x = st(set.id), pick = x.picks[q.num];
  const opts = q.options.map(o => {
    let cls = "opt", tag = "";
    if (x.done) {
      if (o.key === q.answer) { cls += " right"; tag = "正解"; }
      else if (o.key === pick) { cls += " wrong"; tag = "你的答案"; }
      if (o.key === q.answer && o.key === pick) tag = "✓ 答對";
    } else if (o.key === pick) cls += " sel";
    return `<button class="${cls}" data-set="${set.id}" data-q="${q.num}" data-k="${o.key}" ${x.done ? "disabled" : ""}>
      <span class="l">(${o.key})</span><span>${inline(o.text)}</span>${tag ? `<span class="tag">${tag}</span>` : ""}</button>`;
  }).join("");
  let after = "";
  if (x.done) {
    const ok = pick === q.answer;
    after = `<div class="verdict ${ok ? "ok" : "bad"}">${ok ? "答對了" : pick ? `答錯了，你選 (${pick})` : "未作答"}・正確答案 (${q.answer})${q.level && q.level !== "?" ? `・難度：${q.level}` : ""}</div>
      <div class="explain">${md(q.rest)}</div>`;
  }
  return `<div class="q"><div class="qtext"><span class="qnum">${q.num}.</span>${q.isNew ? '<span class="new">新題型</span> ' : ""}${q.text ? md(q.text).replace(/^<p>|<\/p>$/g, "") : ""}</div>
    <div class="opts">${opts}</div>${after}</div>`;
}

function setHTML(set) {
  const x = st(set.id);
  const unanswered = set.questions.filter(q => !x.picks[q.num]).length;
  let passages = "";
  if (set.passages && set.passages.length) {
    passages = `<div class="passages">` + set.passages.map(p => {
      const body = p.lines.join("\n\n");
      return (p.label ? `<div class="plabel">${p.label}</div>` : "") + `<div class="passage">${md(x.done ? body : stripMarks(body))}</div>`;
    }).join("") + `</div>`;
  }
  const reveal = x.done && (set.trans || set.vocab)
    ? `<details class="reveal" open><summary>文章翻譯與單字</summary>${md(set.trans)}${md(set.vocab)}</details>` : "";
  const head = set.heading
    ? `<p class="set-title">${esc(set.heading)}${set.isNew ? ' <span class="new">新題型</span>' : ""}</p><p class="set-sub">${esc(set.sub || "")}</p>` : "";
  const btnLabel = set.heading ? "送出本題組" : "送出";
  const actions = x.done
    ? `<div class="actions"><span class="result">本組答對 ${set.questions.filter(q => x.picks[q.num] === q.answer).length} / ${set.questions.length}</span>
       <button class="btn" data-redo="${set.id}">重做這組</button></div>`
    : `<div class="actions"><button class="btn primary" data-submit="${set.id}" ${unanswered ? "disabled" : ""}>${btnLabel}</button>
       ${unanswered && set.questions.length > 1 ? `<span class="hint">還有 ${unanswered} 題沒選</span>` : ""}</div>`;
  return `<section class="card" id="${set.id}">${head}
    <div class="set-body ${passages ? "two" : ""}">${passages}<div>${set.questions.map(q => questionHTML(set, q)).join("")}${actions}</div></div>
    ${reveal}</section>`;
}

function renderSet(id) {
  const set = sets.find(s => s.id === id);
  const el = document.getElementById(id);
  el.outerHTML = setHTML(set);
  renderScore();
}

function renderMain() {
  const intro = intros[curPart];
  $("#main").innerHTML = (intro ? `<p class="part-intro"><b>Part ${curPart}：${intro.name}</b>　${esc(intro.text)}</p>` : "")
    + sets.filter(s => s.part === curPart).map(setHTML).join("");
  renderScore();
}

$("#main").addEventListener("click", e => {
  const opt = e.target.closest(".opt");
  if (opt && !opt.disabled) {
    st(opt.dataset.set).picks[opt.dataset.q] = opt.dataset.k; save(); renderSet(opt.dataset.set); return;
  }
  const sub = e.target.closest("[data-submit]");
  if (sub && !sub.disabled) { st(sub.dataset.submit).done = true; save(); renderSet(sub.dataset.submit); return; }
  const redo = e.target.closest("[data-redo]");
  if (redo) { state[redo.dataset.redo] = { picks: {}, done: false }; save(); renderSet(redo.dataset.redo); }
});
$("#resetAll").onclick = () => {
  if (!confirm("確定要清除這份考卷的所有作答紀錄？")) return;
  state = {}; save(); renderMain();
};

renderTabs();
renderMain();
</script>
</body>
</html>
