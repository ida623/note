<script>
const SOURCE = "# 目錄\n\n1. [PART 5：單句文法與詞彙](#part-5)\n   概念：這部分是 101~130 題的單句填空，考的核心是「詞性判斷」——名詞、動詞、形容詞、副詞放在句子裡哪個位置才對；還有動詞相關的主動/被動語態、單複數一致；代名詞（人稱代名詞的格、關係代名詞的選擇）；介系詞和連接詞的慣用搭配（選介系詞、副詞子句連接詞）；比較級的表達方式；最後就是大量的動詞、名詞、形容詞、副詞詞彙題，考你單字的精確語意。\n\n2. [PART 6：段落填空](#part-6)\n   概念：4 篇短文各挖 4 個空格，除了跟 Part 5 一樣的詞性、動詞詞彙、介系詞選擇之外，還多了「選出空格中正確的句子」和「連接副詞」這種要看懂整段文意、前後句邏輯關係的題型。\n   1. [Questions 131-134 refer to the following notice.](#questions-131-134-refer-to-the-following-notice-)\n      概念：Eddington's 百貨公司通知會員卡持卡人，集點對帳單改成每半年寄發一次。考選句（131）、介系詞片語 Regardless of（132）、動詞詞彙 monitor（133）、連接副詞 Moreover（134）。\n   2. [Questions 135-138 refer to the following letter.](#questions-135-138-refer-to-the-following-letter-)\n      概念：電信公司 Best Link Telecom 寫信給新客戶推銷高速網路和折扣方案。考時間介系詞 on（135）、動詞詞彙 guarantees（136）、選句（137）、名詞詞彙 statement（138）。\n   3. [Questions 139-142 refer to the following article.](#questions-139-142-refer-to-the-following-article-)\n      概念：報導 Marinville 市中心 Halpern 大樓重建案，開發商從 25 家篩選到剩 3 家的甄選進度。考名詞詞彙（139、140）、選句（141）、容易混淆的形容詞位置 impressive（142）。\n   4. [Questions 143-146 refer to the following e-mail.](#questions-143-146-refer-to-the-following-e-mail-)\n      概念：保險公司寄信通知既有保戶，公司名稱即將變更。考現在式動詞（143）、動詞詞彙 inform（144）、選句（145）、to 不定詞表目的（146）。\n\n3. [PART 7：閱讀理解](#part-7)\n   概念：15 篇單篇、雙篇、三篇文章的閱讀測驗，題型主要是「尋找主題／目的」（問文章在講什麼、為什麼寫）、「wh- 問題」（What/How/When 等細節題）、「Not/True」（找出文中沒提到或有提到的選項）、「推論」（尤其是多篇文章綜合題，要把兩三篇文章的線索拼在一起才能作答）、「掌握意圖」（問某句話真正想表達什麼）、「同義詞」、「找出句子位置」（把漏掉的句子塞回文章正確位置）。\n   1. [Questions 147-148 refer to the following advertisement.](#questions-147-148-refer-to-the-following-advertisement)\n      概念：Shoe Gold 鞋店的年度特賣廣告，說明折扣方案和分店地址。考尋找主題（147）、Not/True（148）。\n   2. [Questions 149-150 refer to the following text message chain.](#questions-149-150-refer-to-the-following-text-message-chain-)\n      概念：辦公室家具供應商和客戶 Justin Wachtel 用簡訊討論辦公椅、會議桌、投影螢幕的訂購細節。考掌握意圖（149）、Not/True（150）。\n   3. [Questions 151-152 refer to the following notice.](#questions-151-152-refer-to-the-following-notice)\n      概念：公司員工布告欄上一則徵求二手車的貼文，Roy Long 想幫兒子買車。考尋找目的（151）、Not/True（152）。\n   4. [Questions 153-155 refer to the following article.](#questions-153-155-refer-to-the-following-article)\n      概念：新聞報導 CCT News 電視台聘請新主播 Greg O'Connell 接替退休主播的消息。考尋找主題（153）、推論細節（154）、wh- 問題 What（155）。\n   5. [Questions 156-157 refer to the following online form.](#questions-156-157-refer-to-the-following-online-form)\n      概念：Seaside 半程馬拉松的線上報名表單，內含個人資料、贈品選項和付款資訊。考 Not/True（156）、wh- 問題 What（157）。\n   6. [Questions 158-161 refer to the following online information.](#questions-158-161-refer-to-the-following-online-information)\n      概念：Bennett House 古宅的參觀資訊網頁，說明開放時間、導覽費用、紀念品店等。考 wh- 問題 What（158、159）、Not/True（160）、找出句子位置（161）。\n   7. [Questions 162-164 refer to the following memo.](#questions-162-164-refer-to-the-following-memo)\n      概念：辦公室主管的備忘錄，提醒員工總部大樓將分樓層整修，並說明工作場所調整方案。考尋找目的（162）、推論細節（163）、wh- 問題 What（164）。\n   8. [Questions 165-167 refer to the following Web page.](#questions-165-167-refer-to-the-following-web-page)\n      概念：Lunch on Demand 線上訂餐網頁，介紹訂餐流程、菜單內容和會員推薦優惠。考 wh- 問題 What（165）、wh- 問題 How（166）、Not/True（167）。\n   9. [Questions 168-171 refer to the following text message chain.](#questions-168-171-refer-to-the-following-text-message-chain-)\n      概念：外燴公司 Kitchen Belle 的員工們用簡訊討論電視劇《Timelight》續約後的排班安排。考掌握意圖（168）、wh- 問題 When（169）、推論細節（170）、wh- 問題 What（171）。\n   10. [Questions 172-175 refer to the following memo.](#questions-172-175-refer-to-the-following-memo)\n       概念：廣告部部長發出的備忘錄，宣布部門一分為二並說明搬遷辦公室的時程與流程。考尋找目的（172）、wh- 問題 What（173）、Not/True（174）、找出句子位置（175）。\n   11. [Questions 176-180 refer to the following e-mails.](#questions-176-180-refer-to-the-following-e-mails)\n       概念：兩封往來 email，一封是朋友向出版社編輯推薦插畫家，另一封是編輯回覆說明童書專案的細節與接案流程。考尋找目的（176）、同義詞（177）、推論多篇文章綜合（178）、Not/True（179）、wh- 問題 How（180）。\n   12. [Questions 181-185 refer to the following memo and e-mail.](#questions-181-185-refer-to-the-following-memo-and-e-mail)\n       概念：物流公司備忘錄宣布退休金提撥制度將更有彈性，員工寫信詢問並要求調高提撥比例、安排面談時間。考推論細節（181）、推論多篇文章綜合（182）、wh- 問題 What（183）、wh- 問題多篇文章綜合（184）、推論多篇文章綜合（185）。\n   13. [Questions 186-190 refer to the following announcement, e-mail, and information.](#questions-186-190-refer-to-the-following-announcement-e-mail-and-information)\n       概念：材料工程師協會年會的公告、贊助廠商詢問報名費用的 email，加上報名費用表。考 Not/True（186）、推論多篇文章綜合（187）、wh- 問題 What（188）、Not/True（189）、wh- 問題多篇文章綜合（190）。\n   14. [Questions 191-195 refer to the following advertisement, e-mail, and program.](#questions-191-195-refer-to-the-following-advertisement-e-mail-and-program)\n       概念：Grand Deville 飯店開幕廣告、研究中心員工詢問訂場地訂房的 email，加上員工表揚宴會的活動時程表。考 Not/True（191、192）、同義詞（193）、推論多篇文章綜合（194、195）。\n   15. [Questions 196-200 refer to the following notice, Web page, and text message.](#questions-196-200-refer-to-the-following-notice-web-page-and-text-message)\n       概念：地鐵三站維修公告、大眾運輸局提供替代公車路線的網頁，加上朋友間約午餐討論合約的簡訊。考 Not/True（196、197）、wh- 問題多篇文章綜合（198）、推論多篇文章綜合（199、200）。\n\n-----------------------------------------------------------\n\n<!-- page 134 -->\n# TEST 03\nPart 5 翻譯・解說\nPart 6 翻譯・解說 🆕\nPart 7 翻譯・解說 🆕\n\n<!-- page 135 -->\n## PART 5\n\n**101.** 答案 (D)｜難度：中\nThe organizers of the fundraiser ______ a to-do list to hand out to volunteers.\n- (A) compiling\n- (B) compiles\n- (C) to compile\n- (D) are compiling\n\n> 募款活動的籌辦人正在編寫要發給志工的應辦事項列表。\n\n**〔動詞位置〕單數主詞使用動詞單數形，複數主詞使用動詞複數形**\n句中缺少動詞，所以動詞 (B) 和 (D) 是可能的答案。句子的主詞（The organizers）是複數，所以動詞 compile（匯編，編寫）的第三人稱複數形 (D) are compiling 是正確答案。動詞單數形 (B) 不能和複數主詞一起使用。動名詞或分詞 (A) 和 to 不定詞 (C) 不能用在動詞的位置。另外，空格前的 the fundraiser 是修飾成分（of the fundraiser）的一部分，而不是主詞的主體，所以不要只注意到 fundraiser 而誤選第三人稱單數形的 (B) compiles。\n\n**單字** organizer (n.) 主辦者；fundraiser (n.) 募款活動，募款者；to-do list (phr.) 待辦事項列表；hand out (phr.) 分發；volunteer (n.) 志願者，志工；(v.) 自願；compile (v.) 匯編，編寫\n\n**102.** 答案 (C)｜難度：低\nMr. Chen was surprised by the promotion because ______ had not imagined that it could happen this year.\n- (A) his\n- (B) himself\n- (C) he\n- (D) him\n\n> 陳先生對於升職感到驚訝，因為他沒想像過有可能在今年發生。\n\n**人稱代名詞的格**\n由 because 引導的子句（because ______ ~ year）缺少主詞，所以能用在主詞位置的所有代名詞 (A) 和主格人稱代名詞 (C) 是可能的答案。因為要表達「他沒想像過今年可能發生這件事」的意思，所以主格人稱代名詞 (C) he 是正確答案。如果使用所有代名詞 (A) 的話，會變成「他的東西沒有想像過」這種不恰當的意思。反身代名詞 (B) 和受格人稱代名詞 (D) 不能當主詞用。反身代名詞用於受詞和主詞為同一人或事物時，或者要強調主詞或受詞本身的時候。\n\n**103.** 答案 (C)｜難度：中\nSince the report had not yet been ______, Ms. Pantel had time to correct an error she had found.\n- (A) distributes\n- (B) distributing\n- (C) distributed\n- (D) distribution\n\n> 由於當時報告尚未發出，所以 Pantel 小姐還有時間修正她發現的一個錯誤。\n\n**〔可以接在 be 動詞後面的成分〕主動態與被動態的區別**\n空格在 be 動詞（been）後面，所以 -ing 形 (B)、p.p. 形 (C)、名詞 (D) 是可能的答案。因為句子是被動的意義「報告還沒被發出」，而且空格後面沒有及物動詞 distribute（分配，分發）的受詞，所以能和空格前的 be 動詞形成被動態的 (C) distributed 是正確答案。即使當成不及物動詞，和空格前的 be 動詞組成進行式，也會變成「報告還沒有在發放」（報告自己做發放的動作）這種不恰當的意思，所以答案不會是進行式。名詞 (D) 可以在 be 動詞後面當補語，但會變成「報告還不是發放／發行（這件事）」這種不恰當的意思。第三人稱單數形 (A) 不能用在 be 動詞後面。\n\n**單字** correct (v.) 修正，更正；distribution (n.) 分配，分發\n\n**104.** 答案 (A)｜難度：中\nOnce the account has been ______, the user will be asked to re-enter their login name and password.\n- (A) created\n- (B) composed\n- (C) preferred\n- (D) assembled\n\n> 帳戶一經建立，使用者就會被要求重新輸入登入名稱和密碼。\n\n**動詞詞彙**\n文意是「帳戶被建立後，使用者就會被要求重新輸入登入名稱和密碼」，所以動詞 create（創建）的 p.p. 形 (A) created 是正確答案。(B) 的動詞 compose 表示「構成，寫作」，(C) 的 prefer 表示「偏好」，(D) 的 assemble 表示「組合」。\n\n**單字** account (n.) 帳戶；enter (v.) 輸入，進入；password (n.) 密碼，暗號\n\n<!-- page 136 -->\n**105.** 答案 (B)｜難度：低\nThe downtown branch of Jim's Burgers has ______ outperformed the chain's other locations in the city.\n- (A) progressive\n- (B) progressively\n- (C) progress\n- (D) progressed\n\n> Jim's Burgers 的市中心分店，表現逐漸超越這個連鎖體系在市內其他的據點。\n\n**副詞位置**\n能修飾動詞（has outperformed）的是副詞，所以副詞 (B) progressively（逐漸地，日益增加地）是正確答案。形容詞 (A)、名詞或動詞 (C)、動詞或分詞 (D) 都不能修飾動詞。\n\n**單字** downtown (n.) 市中心區，商業區，鬧區；branch (n.) 分店，分公司；outperform (v.) 表現勝過…；chain (n.)（商店、飯店等的）連鎖體系；progressive (adj.) 進行的，進步的\n\n**106.** 答案 (B)｜難度：中\nThe marketing department has launched a social media campaign in an effort to reach a more ______ audience.\n- (A) necessary\n- (B) diverse\n- (C) deep\n- (D) comparable\n\n> 為了接觸到更多樣的閱聽大眾，行銷部門開始進行了社群媒體宣傳活動。\n\n**形容詞詞彙**\n文意是「為了努力接觸到更多樣的閱聽大眾」，所以形容詞 (B) diverse（多樣的）是正確答案。(A) necessary 表示「必需的，必然的」，(C) deep 表示「深的」，(D) comparable 表示「比得上的，類似的」。\n\n**單字** launch (v.) 開始，發動；in an effort to (phr.) 為了努力做到…；reach (v.) 接觸到（宣傳對象等），達到，到達；audience (n.) 觀眾，聽眾，閱聽大眾\n\n**107.** 答案 (D)｜難度：高\nGuests enjoyed the resort's new swimming pool ______ its outdoor restaurant.\n- (A) along\n- (B) due to\n- (C) as to\n- (D) in addition to\n\n> 住客享受了度假村新設的游泳池和戶外餐廳。\n\n**選擇介系詞** 附加\n要表達的意思是「除了戶外餐廳還有新的游泳池」，所以表示附加的介系詞 (D) in addition to（除了…還有）是正確答案。(A) along 表示方向「沿著…」，(B) due to 表示理由「由於…」，(C) as to 表示「至於…」。\n\n**單字** swimming pool (phr.) 游泳池；outdoor (adj.) 戶外的\n\n**108.** 答案 (C)｜難度：中\nEmployee assessments are ______ carried out in December but may be delayed until January.\n- (A) visibly\n- (B) casually\n- (C) typically\n- (D) slightly\n\n> 員工評鑑通常在 12 月實施，但也可以延到 1 月。\n\n**副詞詞彙**\n文意是「通常在 12 月實施，但也可以延到 1 月」，所以副詞 (C) typically（典型地，通常）是正確答案。(A) visibly 表示「明顯地，可見地」，(B) casually 表示「偶然地，隨意地」，(D) slightly 表示「稍微，纖弱地」。\n\n**單字** assessment (n.) 評價，評估金額；carry out (phr.) 實施，實行；delay (v.) 延遲，使延遲\n\n<!-- page 137 -->\n**109.** 答案 (C)｜難度：中\nThe ______ of the building had to find temporary accommodations during the renovation.\n- (A) reside\n- (B) residential\n- (C) residents\n- (D) residences\n\n> 這棟大樓的住戶在整修期間必須找臨時住宿處。\n\n**〔名詞位置〕人物名詞 vs. 事物名詞**\n能放在冠詞（The）和介系詞（of）之間的是名詞，所以名詞 (C) 和 (D) 是可能的答案。因為要表示「大樓的住戶必須找臨時住宿處」的意思，所以人物名詞 (C) residents（居住者）是正確答案。如果使用事物名詞 (D) residences（住所），意思會變成「大樓的住所必須找臨時住宿處」，所以不對。動詞 (A) 和形容詞 (B) 不能用在名詞的位置。residence 表示「住所」時是可數名詞，表示「居住」時是不可數名詞。\n\n**單字** temporary (adj.) 臨時的，暫時的；accommodation (n.) 住宿處；reside (v.) 住，居住；residential (adj.) 住宅的，適合居住的\n\n**110.** 答案 (C)｜難度：低\nThe fitness tracker is as perfectly ______ as the online advertisements say it is.\n- (A) accuracy\n- (B) accurately\n- (C) accurate\n- (D) accurateness\n\n> 這個體能追蹤器就像網路廣告上所說的一樣完全精確。\n\n**〔原級比較〕形容詞位置**\n因為空格前後都有 as，所以能構成原級比較（as + 形容詞/副詞 + as）的副詞 (B) 和形容詞 (C) 是可能的答案。因為空格被副詞（perfectly）修飾，而且是 be 動詞（is）的補語位置，所以形容詞 (C) accurate（精確的）是正確答案。副詞 (B) 不能用在補語的位置。名詞 (A) 和 (D) 不能被副詞修飾，而要以「as many/much/few/little 名詞 + as」的形態使用。另外，對於 as ~ as 之間的形容詞/副詞位置，可以把前後的 as 去掉之後，再判斷應該填入什麼。\n\n**單字** fitness (n.) 健康，健身；tracker (n.) 追蹤器，追蹤者；perfectly (adv.) 完美地，完全地；accuracy (n.) 準確，準確度；accurateness (n.) 準確性\n\n**111.** 答案 (C)｜難度：中\nTremont Airlines is offering ______ rates to passengers willing to travel late at night.\n- (A) shortened\n- (B) fragile\n- (C) reduced\n- (D) preserved\n\n> Tremont 航空公司現正提供折扣價給願意在深夜飛行的旅客。\n\n**形容詞詞彙**\n文意是「提供折扣價給願意在深夜飛行的旅客」，所以形容詞 (C) reduced（減少的，減價的）是正確答案。(A) shortened 表示「縮短了的」，(B) fragile 表示「脆弱的」，(D) preserved 表示「被保存的」。\n\n**單字** rate (n.) 費用，比率，速度；passenger (n.) 乘客；willing (adj.) 願意做什麼的\n\n**112.** 答案 (B)｜難度：中\nCustomers are asked to acknowledge receipt of their orders by ______ their names on a delivery form.\n- (A) sign\n- (B) signing\n- (C) signs\n- (D) signed\n\n> 顧客被要求在送貨單上簽名，表示收到訂購的物品。\n\n**〔受詞位置〕動名詞 vs. 名詞**\n能當介系詞（by）的受詞的名詞 (A) 和 (C)、動名詞 (B) 是可能的答案。其中，後面可以接受詞（their names）的是動名詞，所以動詞 sign（簽名）的動名詞 (B) signing 是正確答案。名詞 (A) 和 (C) 後面不能接名詞當受詞。動詞或分詞 (D) 不能用在介系詞的受詞位置。\n\n**單字** acknowledge (v.) 承認，告知收到；receipt (n.) 收到，收據；delivery (n.) 配送，運送\n\n<!-- page 138 -->\n**113.** 答案 (B)｜難度：低\nThe trade show convention center was ______ located right next to the subway station, making it easily accessible.\n- (A) currently\n- (B) conveniently\n- (C) knowingly\n- (D) insufficiently\n\n> 貿易會展中心位置便利，就在地鐵站旁，很容易到達。\n\n**副詞詞彙**\n文意是「貿易會展中心位置便利，就在地鐵站旁」，所以副詞 (B) conveniently（便利地）是正確答案。(A) currently 表示「目前」，(C) knowingly 表示「故意地」，(D) insufficiently 表示「不足地，不充分地」。\n\n**單字** trade (n.) 貿易，交易；next to (phr.) 在…旁邊；accessible (adj.) 可接近的，容易接近的\n\n**114.** 答案 (A)｜難度：中\nEmployees at Branford Computing Group are expected to respond to all technical support questions ______ 24 hours.\n- (A) within\n- (B) between\n- (C) since\n- (D) until\n\n> Branford Computing Group 公司的員工被期望在 24 小時以內回答所有技術支援問題。\n\n**選擇介系詞** 期間\n要表達的意思是「被期望在 24 小時以內回答」，所以表示期間的介系詞 (A) within（在…以內）是正確答案。(B) between「在…之間」表示位置或時間，通常以 between A and B（A 與 B 之間）的形態使用。(C) since 表示「自從…」，(D) until 表示「到…為止」，兩者都表示時間點。\n\n**單字** expect (v.) 期望，預期；respond (v.) 回答，反應；support (n.) 支援，支持；(v.) 支持\n\n**115.** 答案 (D)｜難度：高\nApplicants ______ a form for a new license should make certain that it is completely filled out.\n- (A) submits\n- (B) submitted\n- (C) submit\n- (D) submitting\n\n> 提交表格申請新執照的人，應該確認表格完全填好了。\n\n**〔引導修飾語的成分〕現在分詞 vs. 過去分詞**\n句子是有主詞（Applicants）和動詞（should make certain）、受詞（that ~ out）的完整句，所以 ______ a form for a new license 的部分視為修飾語。這個修飾語修飾名詞（Applicants），所以能在名詞後方做修飾的過去分詞 (B) 和現在分詞 (D) 是可能的答案。被修飾的主詞（Applicants）和分詞是表示「為了得到新執照而提交表格的申請者」的主動意義，所以動詞 submit（提交）的現在分詞 (D) submitting（提交的）是正確答案。如果使用過去分詞的話，會變成「被提交的申請者」這種不恰當的意思。動詞 (A) 和 (C) 不能引導修飾語。\n\n**單字** license (n.) 執照，許可證；make certain (phr.) 確認；fill out (phr.) 填寫，填好\n\n**116.** 答案 (C)｜難度：中\nStoring dangerous chemicals near the main factory floor creates a ______ hazardous situation for the employees who work there.\n- (A) potent\n- (B) potential\n- (C) potentially\n- (D) potentiality\n\n> 將危險化學物質貯存在主要廠區附近，對於在那裡工作的員工造成了有潛在危險的情況。\n\n**副詞位置**\n能修飾空格後方形容詞（hazardous）的是副詞，所以副詞 (C) potentially（潛在地）是正確答案。形容詞 (A)、形容詞或名詞 (B)、名詞 (D) 都不能修飾形容詞。\n\n**單字** store (v.) 貯存，貯藏；chemical (n.) 化學物質；(v.) 化學的；factory floor (phr.) 工廠廠區；hazardous (adj.) 危險的；potent (adj.) 強力的，有力的；potential (adj.) 潛在的，可能的；(n.) 潛力，可能性；potentiality (n.) 潛在可能性，潛力\n\n<!-- page 139 -->\n\n**117.** 答案 (C)｜難度：中\nHealth One Hospice's board of directors hopes to ______ the institution with a partner that shares similar values.\n- (A) request\n- (B) recruit\n- (C) affiliate\n- (D) adopt\n\n> Health One Hospice 的董事會希望讓這間機構加入有類似價值觀的合作夥伴旗下。\n\n**動詞詞彙**\n文意是「希望使機構隸屬於合作夥伴之下」，所以動詞 (C) affiliate（使…隸屬於）是正確答案。(A) request 表示「要求」，(B) recruit 表示「募集，招募」，(D) adopt 表示「採取，採用」。\n\n**單字** institution (n.) 機構，社會機構；share (v.) 共同擁有，分享；value (n.) 價值，價值觀\n\n**118.** 答案 (B)｜難度：最高\nThe casting director was looking for an actor with an ______ tone of voice that can persuade listeners to buy a product.\n- (A) occasional\n- (B) inviting\n- (C) operating\n- (D) apologetic\n\n> 選角指導當時在找聲調吸引人、能夠說服聽者購買產品的演員。\n\n**形容詞詞彙**\n文意是「能夠說服聽者買產品、吸引人的聲調」，所以形容詞 (B) inviting（吸引人的）是正確答案。(A) occasional 表示「偶爾的」，(C) operating 表示「營業的」，(D) apologetic 表示「道歉的」。\n\n**單字** casting (n.) 選角；look for (phr.) 尋找；persuade (v.) 說服，使相信\n\n**119.** 答案 (D)｜難度：中\nThe company issued a statement yesterday evening in ______ to the merger agreement.\n- (A) relates\n- (B) related\n- (C) relate\n- (D) relation\n\n> 公司昨晚發表了一份有關合併協議的聲明。\n\n**名詞位置**\n能用在介系詞（in）的受詞位置的是名詞，所以名詞 (D) relation（關聯，關係）是正確答案。動詞 (A) 和 (C)、動詞或分詞 (B) 不能用在名詞的位置。另外，請記得 in relation to ~（關於…）這個慣用語。\n\n**單字** issue (v.) 發布，發行；statement (n.) 聲明，聲明書；merger (n.)（組織、事業體的）合併；agreement (n.) 協議，協定；relate (v.) 使相關，使有聯繫\n\n**120.** 答案 (C)｜難度：最高\nA banquet was held to honor five employees, all of ______ have worked at the company for more than 20 years.\n- (A) them\n- (B) us\n- (C) whom\n- (D) which\n\n> 為了表揚五名員工而辦了一場宴會，他們全都在公司工作了超過 20 年。\n\n**〔數量表達方式＋關係代名詞〕關係代名詞的選擇與格**\n這個句子是有主詞（A banquet）和動詞（was held）的完整句，所以 all of ______ ~ years 的部分視為修飾語。這個修飾語的開頭是數量表達方式（all of），所以既能夠引導修飾子句，又能接在數量表達方式後面的關係代名詞 (C) 和 (D) 是可能的答案。因為關係代名詞的先行詞是 five employees（五名員工），所以先行詞為人物時使用的關係代名詞 (C) whom 是正確答案。關係代名詞 (D) which 用於先行詞是事物時。受格人稱代名詞 (A) them 和 (B) us 的用法則要像「A banquet ~ employees, and all of ______ ~ years」一樣，在兩個子句之間加上對等連接詞 and 來連接。\n\n**單字** banquet (n.) 宴會，晚宴；honor (v.) 給…榮譽，表彰\n\n<!-- page 140 -->\n\n**121.** 答案 (B)｜難度：高\nCompany policy requires that all staff members be at their desks before 9:30 a.m., ______ unforeseen circumstances.\n- (A) though\n- (B) barring\n- (C) toward\n- (D) with\n\n> 公司政策要求所有員工在上午 9:30 前就座，除非有預料之外的情況。\n\n**〔引導修飾語的成分〕選擇介系詞 除外**\n這個句子是有主詞（Company policy）和動詞（requires）的完整句，所以 ______ unforeseen circumstances 的部分視為修飾語。這個修飾語是沒有動詞的修飾片語，所以能引導修飾片語的介系詞 (B)、(C)、(D) 是可能的答案。因為要表示「除非有預料之外的情況，否則要求應該就座」的意思，所以表示除外的介系詞 (B) barring（除了…以外）是正確答案。(C) toward「往…」表示方向，(D) with「和…一起」也不符合文意。副詞子句連接詞 (A) though（雖然…）應該引導有動詞的修飾子句。\n\n**單字** policy (n.) 政策；unforeseen (adj.) 預料之外的；circumstance (n.) 狀況，環境\n\n**122.** 答案 (C)｜難度：高\nHotel employees are stationed at the check-in desk ______ you have any questions during your stay.\n- (A) so far\n- (B) plus\n- (C) in case\n- (D) whereas\n\n> 飯店員工駐守在辦理入住櫃台，以備您住宿期間有任何問題時可以詢問。\n\n**〔引導修飾語的成分〕副詞子句連接詞 條件**\n這個句子是有主詞（Hotel employees）和動詞（are stationed）的完整句，所以 ______ ~ stay 的部分視為修飾語。這個修飾語是有動詞（have）的修飾子句，所以能引導修飾子句的副詞子句連接詞 (C) 和 (D) 是可能的答案。因為要表示「為了萬一有問題的時候可以處理，所以派駐員工在櫃台」的意思，所以表示條件的副詞子句連接詞 (C) in case（以備萬一…）是正確答案。(D) whereas「反之，然而…」表讓步。副詞 (A) so far（到目前為止）不能引導修飾子句。副詞 (B) plus（而且，還有）可以像連接詞一樣，以「子句 plus 子句」的形態使用，但用在這裡會變成「飯店員工駐守在辦理入住櫃台，而且您在住宿期間有任何問題」這種不恰當的意思。\n\n**單字** station (v.) 派駐；(n.) 車站；stay (n.) 停留，留宿；(v.) 停留\n\n**123.** 答案 (C)｜難度：高\nNew cycling safety regulations have just been ______ by the Ministry of Transportation.\n- (A) constructed\n- (B) engaged\n- (C) enacted\n- (D) measured\n\n> 交通部剛頒布了新的自行車安全法規。\n\n**動詞詞彙**\n文意是「自行車安全法規被頒布了」，所以動詞 enact（頒布）的 p.p. 形 (C) enacted 是正確答案。(A) 的動詞 construct 表示「建設」，(B) 的 engage 表示「使參加，從事」，(D) 的 measure 表示「測量」。\n\n**單字** regulation (n.) 規定；ministry of transportation (phr.) 交通部\n\n**124.** 答案 (B)｜難度：中\nAuthor Sylvia Feldman ______ for a Publishers Guild Award for her best-selling nonfiction novel, *21 Ravens*.\n- (A) nominates\n- (B) was nominated\n- (C) was nominating\n- (D) has nominated\n\n> 作家 Sylvia Feldman 因為她暢銷的紀實小說《21 Ravens》而獲得出版協會獎的提名。\n\n**主動態與被動態的區別**\nnominate（提名）是及物動詞，但空格後面沒有受詞，而且句子是被動的意義「獲得出版協會獎的提名」，所以被動態 (B) was nominated 是正確答案。(A)、(C)、(D) 是主動態，所以不對。\n\n**單字** guild (n.) 協會；best-selling (adj.) 賣得最好的，暢銷的\n\n<!-- page 141 -->\n\n**125.** 答案 (B)｜難度：高\nAccording to the study, the ______ a marketing campaign is among young people, the better a product is likely to sell.\n- (A) popular\n- (B) more popular\n- (C) popularity\n- (D) most popular\n\n> 根據研究，行銷活動越受年輕人歡迎，產品越有可能賣得好。\n\n**其他比較級表達方式**\n因為要表達「行銷活動越受歡迎，產品越有可能賣得好」的意思，所以能夠將兩個子句（the ______ ~ people, the better ~ sell）對等連接，形成「the 比較級～，+ the 比較級～」句型，表示「越…越…」的 (B) more popular 是正確答案。原級形容詞 (A)、名詞 (C)、最高級形容詞 (D) 不能用在比較級的位置。\n\n**單字** according to (phr.) 根據…；be likely to (phr.) 很可能…；popularity (n.) 受歡迎，流行\n\n**126.** 答案 (A)｜難度：最高\nThe individual that will take on Paige Manufacturing's vice president position is expected to come from a ______ of the company.\n- (A) subsidiary\n- (B) spectator\n- (C) turnover\n- (D) specialty\n\n> 將要接下 Paige Manufacturing 公司副總職位的人，預期將來自公司的一間子公司。\n\n**名詞詞彙**\n文意是「接下副總職位的人來自公司的子公司」，所以名詞 (A) subsidiary（子公司）是正確答案。(B) spectator 表示「觀眾」，(C) turnover 表示「營業額，人事異動率」，(D) specialty 表示「專長，特性」。\n\n**單字** individual (n.)（和修飾語連用）人，個人；(adj.) 個人的，個別的；take on (phr.) 承擔（工作）；vice (adj.) 副的，代理的\n\n**127.** 答案 (B)｜難度：高\nThe job comes with several significant ______ including health insurance and three weeks of paid leave.\n- (A) figures\n- (B) benefits\n- (C) profits\n- (D) values\n\n> 這份工作有幾項重要的福利，包括健康保險和三週的帶薪休假。\n\n**名詞詞彙**\n文意是「包括健康保險和帶薪休假的福利」，所以名詞 (B) benefits（福利）是正確答案。(A) 的名詞 figure 表示「數字」，(C) 的 profit 表示「利潤」，(D) 的 value 表示「價值」。另外，profit 表示賣什麼東西或者經營事業而賺到的錢、經濟上／物質上的收益、利潤，表示「益處」的時候則是不可數名詞。\n\n**單字** significant (adj.) 重要的，重大的；insurance (n.) 保險，保險費；paid leave (phr.) 帶薪休假\n\n**128.** 答案 (C)｜難度：中\n______ the deposit for the apartment has been paid, the tenant can move in immediately.\n- (A) So that\n- (B) Even though\n- (C) If\n- (D) Likewise\n\n> 如果公寓的押金已經付了，房客就可以立即入住。\n\n**〔引導修飾語的成分〕副詞子句連接詞** 條件\n這個句子是有主詞（the tenant）和動詞（can move）的完整句，所以 ______ ~ paid 的部分視為修飾語。這個修飾語是有動詞（has been paid）的修飾子句，所以能引導修飾子句的副詞子句連接詞 (A)、(B)、(C) 是可能的答案。因為要表示「押金已經付了的話就可以馬上搬進去」的意思，所以表示條件的副詞子句連接詞 (C) If（如果…）是正確答案。(A) So that「為了…，以便…」表示目的，(B) Even though「即使…」表示讓步。(D) Likewise（同樣地）不能引導修飾子句。\n\n**單字** deposit (n.) 押金，定金，保證金；tenant (n.) 房客；(v.) 租賃；move in (phr.) 搬入\n\n<!-- page 142 -->\n\n**129.** 答案 (B)｜難度：最高\n______ the terms of his employment contract, Mr. Allen receives 1.5 times his regular pay rate for overtime hours.\n- (A) On behalf of\n- (B) In compliance with\n- (C) Instead of\n- (D) Out of respect for\n\n> 依照雇用合約條款，Allen 先生加班的時數會得到平時 1.5 倍的薪水。\n\n**選擇介系詞** 其他\n要表達的意思是「依照雇用合約條款，對於加班的時數會得到平時薪水的 1.5 倍」，所以介系詞 (B) In compliance with（依照…）是正確答案。(A) On behalf of 表示「代表…」，(C) Instead of 表示「代替…」，(D) Out of respect for 表示「出於對…的尊敬」。\n\n**單字** term (n.) 條件，期間；contract (n.) 合約（書）；(v.) 收縮；overtime (adj.) 加班的\n\n**130.** 答案 (A)｜難度：高\nThe board of directors took a ______ to decide who would replace the retiring company president.\n- (A) vote\n- (B) summary\n- (C) program\n- (D) conference\n\n> 董事會投票決定誰將接替退休的公司總裁。\n\n**固定單字搭配的慣用語**\n文意是「投票決定誰接替總裁」，所以能和空格前的動詞 take 形成 take a vote、表示「投票」的 (A) vote（投票，表決）是正確答案。(B) summary 表示「概要」，(C) program 表示「計畫」。(D) conference 表示「會議」，但如果要表達「舉行／出席會議的話」，應該和 hold（舉行）或 attend（出席）等動詞連用才對。\n\n**單字** board of directors (phr.) 董事會；replace (v.) 取代，代替；retire (v.) 退休\n\n<!-- page 143 -->\n\n## PART 6\n\n### Questions 131-134 refer to the following notice. 🆕\n131-134 題參照以下通知。\n\n> NOTE: All Eddington's Membership Card Holders\n>\n> ______(131). We will be adjusting the frequency that point accumulation statements are sent to our members. From January 1, statements will be mailed every six months instead of quarterly. ______(132) this change, members may continue to log in at www.eddingtons.com/members to find current details. You can ______(133) your accumulated points and see what rewards are available in exchange for them through your online account. Or you can call us during business hours at 555-4955, and we will give you a total. ______(134), you can drop by a service counter at any Eddington's Department Store, and one of our staff will inform you of your current total.\n\n**翻譯**\n> 注意：所有 Eddington's 會員卡持卡人\n>\n> [131] Eddington's 預定對會員計畫加以變更。我們將調整寄發點數累積核對單給會員的頻率。1 月 1 日起，核對單將每六個月郵寄一次，而不再是每季一次。[132] 儘管有這項改變，但會員仍然可以登入 www.eddingtons.com/members 查看目前的（點數累積）細節。[133] 您可以透過網路帳戶查看累積點數，看看可以兌換什麼贈品。或者您也可以在上班時間撥打 555-4955 聯絡我們，我們將告知總計點數。[134] 您還可以到任何 Eddington's 百貨公司的服務櫃台，我們的人員將告知您目前的總計點數。\n\n**131.** 🆕\n- (A) We no longer accept membership applications.\n- (B) Eddington's is set to introduce a change to its membership program.\n- (C) We apologize for the recent difficulties with our card payment system.\n- (D) Eddington's Department Store has a special promotion for point cards.\n\n**132.**\n- (A) Apart from\n- (B) In case of\n- (C) Regardless of\n- (D) On behalf of\n\n**133.**\n- (A) submit\n- (B) monitor\n- (C) mediate\n- (D) convey\n\n**134.**\n- (A) Consequently\n- (B) Nevertheless\n- (C) Moreover\n- (D) Occasionally\n\n**單字** card holder (phr.) 持卡人；adjust (v.) 調整；frequency (n.) 頻率，頻繁；accumulation (n.) 累積；statement (n.) 結算單，對帳單；instead of (phr.) 而不是…，取代…；current (adj.) 現在的，目前的，通用的；reward (n.) 回饋，報償；in exchange for (phr.) 交換…，換來…；account (n.) 帳戶；(v.) 說明；total (n.) 總計，總分；(adj.) 總計的，整體的；drop by (phr.) 短暫拜訪；inform (v.) 告知，通知\n\n<!-- page 144 -->\n\n**131.** 🆕 答案 (B)｜難度：中\n**選出空格中正確的句子**\n這是選擇句子的題目，所以要參考空格前後或文章整體的內容。下一句「We will be adjusting the frequency that point accumulation statements are sent to our members.」提到，將會調整寄發點數累積核對單給會員的頻率，後面進一步說明相關的細節。所以，空格的內容應該跟點數累積核對單的相關變更有關，正確答案是 (B) Eddington's is set to introduce a change to its membership program。\n\n**選項翻譯**\n- (A) 我們不再接受會員申請。\n- (B) Eddington's 預定對會員計畫加以變更。\n- (C) 我們為最近刷卡付款系統的故障致歉。\n- (D) Eddington's 百貨公司有提供給集點卡的特別促銷。\n\n**單字** accept (v.) 接受；application (n.) 申請，應用；be set to (phr.) 預定做…；apologize (v.) 道歉；payment (n.) 付款，支付；promotion (n.) 促銷活動，升職\n\n**132.** 答案 (C)｜難度：高\n**〔引導修飾語的成分〕介系詞選擇** 參考上下文\n這個句子是有主詞（members）和動詞（may continue）的完整子句，所以將 ______ this change 的部分視為修飾語。這個修飾語是沒有動詞的修飾片語，所以能引導修飾片語的每個介系詞選項都是可能的答案。因為無法從空格所在的句子判斷答案，所以必須參考空格前後或文章整體的內容。上一句提到，1 月 1 日起，核對單將每六個月郵寄一次，而不再是每季一次，而空格所在的句子說會員仍然可以登入網站查看細節，可知即使變更寄送頻率，但只要線上查看就不受影響。所以，介系詞 (C) Regardless of（不管…）是正確答案。(A) Apart from 表示「除了…以外」，所以後面應該接「除了這項變更以外沒有別的了」或者「除了這項變更以外還有其他變更事項」之類的內容才自然。(B) In case of 表示「以備…的情況」，(D) On behalf of 表示「代表…」。\n\n**133.** 答案 (B)｜難度：高\n**動詞詞彙**\n文意是「可以查看累積的點數，看看可以換什麼贈品」，所以 (B) monitor（監看，監控）是正確答案。(A) submit 表示「提交」，(C) mediate 表示「調停」，(D) convey 表示「傳達」。\n\n**134.** 答案 (C)｜難度：高\n**連接副詞** 參考上下文\n空格和逗號一起出現在句首的連接副詞位置，所以要判斷空格所在的句子和上一個句子的關係再作答。文章前面的部分提到會員可以登入 www.eddingtons.com/members 或打電話查詢點數，而空格所在的句子說可以到 Eddington's 百貨公司的服務櫃台，員工就會告知點數，和前面的內容一樣舉出了查詢點數的方式。所以，表示追加補充前述內容的連接副詞 (C) Moreover（此外）是正確答案。(A) Consequently 表示「結果…」，(B) Nevertheless 表示「儘管如此，但還是…」，(D) Occasionally 表示「偶爾」，都不符合文意。\n\n<!-- page 145 -->\n\n### Questions 135-138 refer to the following letter. 🆕\n135-138 題參照以下信件。\n\n> Claire Staley\n> 874 Country Lane\n> Stillwater, OK 74074\n>\n> Dear Ms. Staley,\n>\n> Best Link Telecom recently upgraded its network and is offering high-speed Internet in your area. We began delivering service ______(135) July 17.\n>\n> Best Link ______(136) fast and reliable service for the lowest cost. We promise to match the price of any competitor charging less than us.\n>\n> As our customer, you may use our online storage services for free. Whether you're downloading videos and photos or sharing your work, you'll be able to get it done in less time than ever. ______(137).\n>\n> And those already using our telephone service can get a discount of 20 percent by upgrading to a high-speed Internet package. The reduced rates will be reflected in your ______(138) for the following month.\n>\n> Please call 555-1573 during regular business hours to arrange an installation appointment.\n>\n> Yours truly,\n>\n> George Hyde\n> Best Link Telecom Sales\n\n**翻譯**\n> Claire Staley\n> 874 號，Country 巷\n> Stillwater，奧克拉荷馬州 74074\n>\n> 親愛的 Staley 小姐：\n>\n> Best Link Telecom 公司最近升級了網路，現在在您的區域提供高速網路。[135] 我們已經在 7 月 17 日開始提供服務。\n>\n> [136] Best Link 公司保證以最低費用提供快速而可靠的服務。我們承諾如果有收費比我們低的競爭者，我們將提供同樣的價格。\n>\n> 身為我們的顧客，您可以免費利用我們的網路儲存服務。不論是下載影片、照片或分享您的作品，您都能夠用比以往更少的時間完成。[137] 我們的高速網路服務能夠處理好這一切。\n>\n> 而已經在使用我們的電話服務的顧客，只要升級為高速網路套裝方案就可以獲得 20% 的折扣。[138] 折扣價格將反映在您下個月的對帳單中。\n>\n> 請於正常營業時間撥打 555-1573 以安排預約安裝。\n>\n> George Hyde\n> Best Link Telecom 公司業務部\n\n**135.**\n- (A) to\n- (B) within\n- (C) on\n- (D) off\n\n**136.**\n- (A) improves\n- (B) guarantees\n- (C) demands\n- (D) receives\n\n**137.** 🆕\n- (A) This service is no longer available in your area.\n- (B) Your bill will vary based on how many files you store.\n- (C) This will cause the cost of computers to be cut.\n- (D) Our high-speed Internet service can handle it all.\n\n**138.**\n- (A) password\n- (B) statement\n- (C) demonstration\n- (D) repair\n\n**單字** network (n.) 網路，網絡；high-speed (adj.) 高速的；reliable (adj.) 可靠的，可信賴的；match (v.) 和…相配，使…一致；competitor (n.) 競爭者，競爭業者；charge (v.) 收費，請款；online storage (phr.) 網路儲存空間；for free (phr.) 免費地；rate (n.) 費用，速度，比率；reflect (v.) 反映，反射；business hours (phr.) 營業時間；arrange (v.) 安排，準備；installation (n.) 安裝，裝設；appointment (n.) 預約，任命\n\n<!-- page 146 -->\n\n**135.** 答案 (C)｜難度：低\n**選擇介系詞** 時間\n空格後面接表示時間的名詞（July 17），所以表示時間的介系詞 (C) on（在〔日期〕）是正確答案。介系詞 (A) to「往…」表示方向或位置，(B) within「在…之內」表示期間或位置，(D) off「遠離…」表示位置。\n\n**136.** 答案 (B)｜難度：中\n**動詞詞彙** 參考上下文\n文意是「Best Link 公司 ______ 快速而可靠的服務」，所有選項都是可能的答案。因為無法從空格所在的句子判斷答案，所以必須參考空格前後或文章整體的內容。下一句提到公司承諾會提供和任何收費更低的競爭者一樣的價錢，可知公司保證提供最低價，所以動詞 guarantee（保證）的第三人稱單數形 (B) guarantees 是正確答案。(A) 的動詞 improve 表示「改善，提升」，(C) 的 demand 表示「要求」，(D) 的 receive 表示「收到」。\n\n**137.** 🆕 答案 (D)｜難度：高\n**選出空格中正確的句子**\n這是選擇句子的題目，所以要參考空格前後或文章整體的內容。前面的部分提到顧客可以免費使用網路儲存服務，而上一句「Whether you're downloading videos and photos or sharing your work, you'll be able to get it done in less time than ever.」提到，不管是下載影片、照片或分享作品，都可以比以往更快完成。所以，空格的內容應該和高速網路能夠做到的事有關，正確答案是 (D) Our high-speed Internet service can handle it all。\n\n**選項翻譯**\n- (A) 這項服務在您的區域將不再提供。\n- (B) 您的帳單（費用）會依照您存了多少檔案而有所差異。\n- (C) 這將會使得電腦費用降低。\n- (D) 我們的高速網路服務能夠處理好這一切。\n\n**單字** no longer (phr.) 不再；based on (phr.) 根據…；handle (v.) 處理\n\n**138.** 答案 (B)｜難度：低\n**名詞詞彙**\n文意是「折扣後的費用會反映在下個月的帳單」，所以 (B) statement（結算單，對帳單）是正確答案。(A) password 表示「密碼」，(C) demonstration 表示「說明，示範」，(D) repair 表示「修理」。\n\n<!-- page 147 -->\n\n### Questions 139-142 refer to the following article. 🆕\n139-142 題參照以下報導。\n\n> City Officials Close to Selecting Developers for Downtown Building\n>\n> Marinville officials have shortlisted developers they are considering to redo the Halpern building. There are now only three ______(139) remaining from an initial 25.\n>\n> As stipulated when the project first started, the firms left in the running must now add more detail to the plans they submitted at the beginning of the year. In their ______(140) presentations, they should demonstrate that they can meet all of the board's remodeling requirements. ______(141). \"If all goes well,\" says Brian Schmidt, director of the Marinville Downtown Authority, \"We'll select the most ______(142) candidate, draw up an agreement, and get started before the year is out.\"\n\n**翻譯**\n> 市府官員即將選定市中心大樓開發業者\n>\n> Marinville 市的官員選出了 Halpern 大樓重建案的入選開發業者。[139] 從一開始的 25 家，到現在只剩下 3 家業者。\n>\n> 依照計畫一開始的規定，仍有資格角逐的業者現在必須對年初提出的計畫增加更多細節。[140] 在業者即將進行的簡報中，他們應該表現自己能夠達到委員會的所有改建需求。[141] 提案中也必須包含完整的預算與詳細的計畫圖。[142] Marinville 市中心管理局的負責人 Brian Schmidt 表示：「如果一切順利的話，我們將選擇最令人印象深刻的候選者，制訂協議，並且在年底前開始。」\n\n**139.**\n- (A) obstacles\n- (B) agencies\n- (C) locations\n- (D) questionnaires\n\n**140.**\n- (A) preceding\n- (B) general\n- (C) forthcoming\n- (D) incomplete\n\n**141.** 🆕\n- (A) The candidates all came up with compelling final proposals.\n- (B) They hoped to develop a construction plan at that time.\n- (C) The deadline was extended to allow for additional projects.\n- (D) A complete budget and detailed blueprints must also be included in the proposal.\n\n**142.**\n- (A) impression\n- (B) impressionable\n- (C) impressed\n- (D) impressive\n\n**單字** developer (n.) 開發業者，開發商；official (n.) 公務員，官員；(adj.) 正式的，官方的；shortlist (v.) 將…列入最後入圍名單；redo (v.) 重做，改裝；initial (adj.) 最初的，初期的；stipulate (v.) 規定；submit (v.) 提交，提出；demonstrate (v.) 展示，證明；requirement (n.) 必要條件，要求事項；authority (n.) 權力，當局；draw up an agreement (phr.) 制訂協議；before the year is out (phr.) 在今年結束之前\n\n<!-- page 148 -->\n\n**139.** 答案 (B)｜難度：中\n**名詞詞彙** 參考上下文\n文意是「從一開始的 25 個，到現在只有 3 個 ______ 剩下來」，所有選項都是可能的答案。因為無法從空格所在的句子判斷答案，所以必須參考空格前後或文章整體的內容。上一句提到 Marinville 市的官員選出了他們考慮可以為 Halpern 大樓進行重建的入圍業者，可知是從 25 家業者減少到 3 家業者，所以名詞 (B) agencies（代理業者，專門機構）是正確答案。(A) 的名詞 obstacle 表示「障礙物」，(C) 的 location 表示「地點」，(D) 的 questionnaire 表示「問卷」。\n\n**140.** 答案 (C)｜難度：高\n**名詞詞彙**\n文意是「在即 olicy documents as well。\n\n**選項翻譯**\n- (A) 它們已經寄給了表格上面提供的名字。\n- (B) 我們會每月將它們寄到您的住處。\n- (C) 它們必須當面交給我們的員工。\n- (D) 我們也將修改我們在保險文件上的名稱。\n\n**單字** residence (n.) 住處，住宅；in person (phr.) 親自，當面；modify (v.) 修改\n\n**146.** 答案 (C)｜難度：高\n**〔引導修飾語的成分〕to 不定詞的功能**\n這個句子主要是以 and 連接不需要主詞的祈使句（please ~ e-mail）和另一個完整句（you ~ representative），所以 ______ an appointment 的部分視為修飾語。這個修飾語是沒有動詞的修飾片語，所以能引導修飾片語的分詞 (B) 和 (D)、to 不定詞 (C) 是可能的答案。因為要表示「為了預約，請回覆這封電子郵件」的意思，所以表示目的的 to 不定詞 (C) To make 是正確答案。分詞 (B) 和 (D) 形成分詞構句時表示時間、理由、條件或連續動作。第三人稱單數形動詞 (A) 不能引導修飾片語。\n\n<!-- page 151 -->\n## PART 7\n\n### Questions 147-148 refer to the following advertisement.\n147-148 題參照以下廣告。\n\n> [147] It's time for the annual sale at Shoe Gold!\n>\n> Buy one pair, get the next pair for 40 PERCENT OFF\n> Buy a third pair for 50 PERCENT OFF\n> Buy a fourth pair for 60 PERCENT OFF\n>\n> [147] We sell the latest designer footwear at discount prices. You won't find a better selection of styles and colors anywhere. Additionally, Shoe Gold carries a variety of adult sizes for men and women. The sale ends August 14, so shop with us today!\n>\n> Open daily from 10:00 a.m. to 8:00 p.m.\n> [148-A] We accept cash, checks, and credit or debit cards.\n> [148-B] Open a Shoe Gold credit card account for an extra 10 percent discount.\n>\n> [148-D] Shoe Gold Locations:\n> 1223 Riverside Drive, [148-D] Minneapolis, MN 55401\n> 807 Interstate 12, [148-D] St. Paul, MN 55519\n\n**翻譯**\n> [147] Shoe Gold 年度特賣的時候到了！\n>\n> 只要買一雙，第二雙就折扣百分之 40\n> 買第三雙折扣百分之 50\n> 買第四雙折扣百分之 60\n>\n> [147] 我們以折扣價販賣最新設計師鞋款。您在其他地方找不到更多的款式與顏色選擇。而且，Shoe Gold 販售各種尺寸的成年男女鞋。特賣於 8 月 14 日結束，所以今天就來店購買吧！\n>\n> 每日上午 10:00 至晚上 8:00 營業\n> [148-A] 我們接受現金、支票、信用卡或簽帳卡。[148-B] 開設 Shoe Gold 信用卡帳戶，可獲得額外的百分之 10 折扣。\n>\n> [148-D] Shoe Gold 的地址：\n> 1223 號，Riverside 路，[148-D] 明尼亞波利斯，明尼蘇達州 55401\n> 807 號，州際公路 12 號，[148-D] 聖保羅，明尼蘇達州 55519\n\n**單字** designer (adj.) 設計師品牌的；(n.) 設計師；carry (v.) 搬運，攜帶，有售；accept (v.) 接受；debit card (phr.) 簽帳卡；account (n.) 帳戶，說明；interstate (n.) 州際公路；(adj.) 州與州之間的\n\n ety.」，表示為了兒子的安全，他偏好有防鎖死煞車和安全氣囊的車，符合選項敘述。和 (B) 相關的部分是「The brand of the car is not important」，表示車子的品牌不重要，不符合選項敘述，所以 (B) He prefers a particular model of car 是正確答案。(C) 對應文中的「Minor dents and scratches are fine as I have the ability to fix them.」，表示輕微的凹痕和刮痕沒有關係，因為他有能力修，符合選項敘述。(D) 對應文中的「my son, who will be going to college in the fall」，表示他的兒子今年秋天要上大學，符合選項敘述。\n\n**單字** concern (v.) 使擔心，使關心；(n.) 擔心，關心的事；perform (v.) 執行，表演\n\n<!-- page 155 -->\n### Questions 153-155 refer to the following article.\n153-155 題參照以下文章。\n\n> **CHANGES IN CCT NEWS**\n>\n> [153] CCT News, the most watched cable news station in the country, has just hired Greg O'Connell to be its new 8 p.m. anchor. Mr. O'Connell is taking over for Pauline Fields, an anchor who retired last month after 20 years on the job.\n>\n> Mr. O'Connell brings extensive industry experience. A veteran reporter, he began as a community news writer for *Cork County Ledger*, then graduated to editing headline news for five years. Following that, Mr. O'Connell took a job as the assistant news anchor at a local TV station. His broadcasts became increasingly popular, and two years later, [155] he was offered a job as the head anchor at WQZ Nightly News. After 10 years on the job, he left WQZ because of the new position at CCT News.\n>\n> [154] George McDonough, the head of CCT News, says he couldn't be happier with their new anchor. \"[154] I first met Greg while working as a producer at WQZ and have been a fan of his ever since,\" he says. \"He is an exemplary newscaster who brings both charisma and a true investigative spirit to the job.\"\n>\n> Mr. O'Connell's first night on the air will be May 7. Until then, Richard Marshall will be filling in as the temporary anchor.\n\n**翻譯**\n> **CCT NEWS 的改變**\n>\n> [153] 國內最多人收看的有線新聞台 CCT News 剛聘請 Greg O'Connell 擔任新的晚間 8 點主播。O'Connell 先生將會接替任職 20 年、上個月退休的主播 Pauline Fields。\n>\n> O'Connell 先生有廣泛的業界經驗。他是資深的記者，一開始擔任《Cork Country Ledger》報紙的地區新聞撰稿人，然後轉為編輯頭條新聞長達五年。之後，O'Connell 先生在一家地方電視台擔任副主播。他的節目越 n> (D) 付款收據\n\n**wh- 問題** What\n這是問什麼（What）會寄到 Robert Joyce 家裡的 wh- 問題，所以要尋找和問題重點 be sent to Robert Joyce's house 相關的內容。「Register now for the Seaside Half Marathon and receive a free T-shirt and other items in the mail!」的部分顯示，現在報名 Seaside 半程馬拉松，就可以收到以郵遞方式寄送的免費 T 恤和其他物品，而「Would you like to receive a free T-shirt ~?, YES ■」的部分顯示，Robert Joyce 願意收到免費 T 恤，可知 T 恤會寄到 Robert Joyce 的家，所以 (C) An article of clothing 是正確答案。\n\n**替換表達**\nbe sent 被寄出 → receive 收到\na ~ T-shirt T 恤 → An article of clothing 一件衣服\n\n**單字** running shoes (phr.) 跑步鞋；article (n.) 物品的一件，文章；receipt (n.) 收據\n\n<!-- page 159 -->\n### Questions 158-161 refer to the following online information.\n158-161 題參照以下網路資訊。\n\n> www.bennetthouse.org/visit\n>\n> | HOME | VISIT | HISTORY | MAP/LOCATION | CONTACT |\n> |---|---|---|---|---|\n>\n> Visitors and tour groups are welcome to view Bennett House from Tuesday through Saturday from 10 a.m. until 5 p.m. [158] Groups of 10 or more are asked to make reservations a day in advance. Those who fail to do so may face significant waiting times. [160-D] Admission is free, but cash boxes are located at the entrance and gift shop, where donations are gratefully accepted.\n>\n> [159] Bennett House can also arrange guided visits for students or tour groups for a flat fee of $25. — [1] —. [160-B] All guests will receive informational brochures, which include history and facts about the Victorian-era home and the art and furniture contained in the rooms. — [2] —. The brochures contain pictures and short biographies of the house's former inhabitants as well. — [3] —.\n>\n> [160-A] A gift boutique and a tea shop are located near the exit. [161] Postcards, [160-A/161] souvenirs, T-shirts, tins of English teas, and teacups are available for purchase. — [4] —. [160-C] The gift shop will not be open during the off-season from January through March, but the rest of our facilities will remain in operation. Bennett House closes on all national holidays.\n\n**翻譯**\n> www.bennetthouse.org/visit\n>\n> | 首頁 | 參觀 | 歷史 | 地圖/地點 | 聯絡 |\n> |---|---|---|---|---|\n>\n> 歡迎觀光客和旅行團在週二到週六的上午 10 點到下午 5 點參觀 Bennett 宅邸。[158] 10 人以上團體請於一天前預約。未預約者可能需等候相當久的時間。[160-D] 入場免費，但入口及禮品店有現金箱，我們會很感謝捐款。\n>\n> [159] Bennett 宅邸也可以為學生或旅行團以固定 25 美元的費用安排導覽。— [1] —。[160-B] 所有訪客都將獲得一份資訊小冊，其中包括這棟維多利亞時期住宅及房內藝術品與家具的歷史與相關事實。— [2] —。小冊子裡也有過去居住者的圖片和簡短的生平介紹。— [3] —。\n>\n> [160-A] 禮品店與茶館位於出口附近。[161] 有明信片、[160-A/161] 紀念品、T 恤、罐裝英國茶和茶杯可以購買。— [4] —。[160-C] 禮品店於一到三月之淡季期間將不營業，但我們的其他設施照常營運。Bennett 宅邸於國定假日皆不開放。\n\n**單字** face (v.) 面對，面臨；admission (n.) 入場，允許進入；entrance (n.) 入口，入場；donation (n.) 捐款，捐贈；arrange (v.) 安排，準備；flat (adj.) 平的，（費用）均一的；informational (adj.) 提供資訊的；fact (n.) 事實；contain (v.) 包含；biography (n.) 傳記，生平介紹；inhabitant (n.) 居住者，居民；boutique (n.) 精品店；souvenir (n.) 紀念品；off-season (n.) 淡季；in operation (phr.) 營運中的，運作中的；national holiday (phr.) 國定假日\n\n**158.** 答案 (B)｜難度：中\nWhat advice is included in the information?\n- (A) Using coupons for purchases in the gift shop\n- (B) Booking ahead of time for large groups\n- (C) Making reservations for weekend visits\n- (D) Following a designated path through the building\n\n> 資訊中包含什麼建議？\n> (A) 在禮品店用折價券買東西\n> (B) 大型團體事先預約\n> (C) 週末參觀事先預約\n> (D) 依照指定路線走過建築物內部\n\n**wh- 問題** What\n這是問資訊中有什麼（What）建議的 wh- 問題，所以要尋找和問題重點 advice 相關的內容。「Groups of 10 or more are asked to make reservations a day in advance.」的部分提到，請 10 人以上的團體提前一天預約，所以 (B) Booking ahead of time for large groups 是正確答案。\n\n**替換表達**\nmake reservations ~ in advance 事先預約 → Booking ahead of time 事先預約\nGroups of 10 or more 十人以上的團體 → large groups 大型團體\n\n**單字** ahead of time (phr.) 事先，比預定的時間早；designated (adj.) 指定的；path (n.) 路徑\n\n<!-- page 160 -->\n**159.** 答案 (B)｜難度：中\nWhat is available for an additional charge?\n- (A) Promotional materials containing pictures\n- (B) Guided tours of the home\n- (C) Admission to a photography exhibit\n- (D) Shipping of purchased souvenirs\n\n> 什麼是可以額外付費得到的？\n> (A) 有圖片的宣傳資料\n> (B) 宅邸的導覽\n> (C) 攝影展入場權\n> (D) 購買紀念品的運送服務\n\n**wh- 問題** What\n這是問什麼（What）可以額外付費得到的 wh- 問題，所以要尋找和問題重點 available for an additional charge 相關的內容。「Bennett House can also arrange guided visits ~ for a flat fee of $25.」的部分顯示，Bennett 宅邸可以安排導覽，一律 25 美元，所以 (B) Guided tours of the home 是正確答案。\n\n**160.** 答案 (C)｜難度：高\nWhat is NOT indicated about Bennett House?\n- (A) It sells keepsakes through a retail establishment.\n- (B) It offers descriptive pamphlets to all guests.\n- (C) It closes temporarily during periods with few tourists.\n- (D) It accepts donations instead of charging admission.\n\n> 關於 Bennett 宅邸，文中沒有提到什麼？\n> (A) 透過零售店販賣紀念品。\n> (B) 提供說明小冊給所有訪客。\n> (C) 觀光客少的期間會暫時關閉。\n> (D) 接受捐款而非收取入場費。\n\n**Not/True** Not 問題\n這是需要在文章中找到與關鍵字 Bennett House 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A) 對應文中的「A gift boutique and a tea shop are located near the exit.」和「souvenirs ~ are available for purchase.」，表示出口附近有禮品店和茶館可以購買紀念品，符合選項敘述。(B) 對應文中的「All guests will receive informational brochures」，表示所有訪客都會得到提供資訊的小冊，符合選項敘述。和 (C) 相關的部分是「The gift shop will not be open during the off-season ~, but the rest of our facilities will remain in operation.」，表示禮品店淡季不營業，但其他設施維持營運，不符合選項敘述，所以 (C) It closes temporarily during periods with few tourists 是正確答案。(D) 對應文中的「Admission is free, but cash boxes are located ~, where donations are gratefully accepted.」，表示入場免費，但設有接受捐款的現金箱，符合選項敘述。\n\n**替換表達**\nsouvenirs 紀念品 → keepsakes 紀念品\ninformational brochures 提供資訊的小冊 → descriptive pamphlets 說明小冊\n\n**單字** keepsake (n.) 紀念品；retail (adj.) 零售的；descriptive (adj.) 描述的，說明的；instead of (phr.) 而不是…，代替…\n\n**161.** 🆕 答案 (D)｜難度：高\nIn which of the positions marked [1], [2], [3], and [4] does the following sentence best belong?\n\"All proceeds from items sold go towards the preservation of this historic building.\"\n- (A) [1]\n- (B) [2]\n- (C) [3]\n- (D) [4]\n\n> 以下這個句子最適合放在文中標記 [1]、[2]、[3]、[4] 的哪一個位置？\n> 「販售物品的收入將全數用於這棟歷史建築的維護。」\n> (A) [1]\n> (B) [2]\n> (C) [3]\n> (D) [4]\n\n**找出句子位置**\n這是要依照文章的內容架構，判斷句子應該插入哪個位置的題目。題目所給的句子「All proceeds from items sold go towards the preservation of this historic building.」表示販售物品的收入將全數用於這棟歷史建築的維護，所以應該放在文章中和販售物品相關的部分。[4] 的上一句「Postcards, souvenirs, T-shirts, tins of English teas, and teacups are available for purchase.」提到，有明信片、紀念品、T 恤、罐裝英國茶和茶杯可以購買，而在 [4] 的位置插入句子之後，表示販賣這些商品獲得的收入將用於維護建築，文意前後連貫，所以 [4] 是正確答案。\n\n**單字** proceeds (n.) 收益，收入；go towards (phr.) （財物等）流向…，給…；preservation (n.) 保存，保護；historic (adj.) 歷史性的，有歷史意義的\n\n<!-- page 161 -->\n### Questions 162-164 refer to the following memo.\n162-164 題參照以下備忘錄。\n\n> To: All Staff\n> From: Angela Romanov, Office Manager\n> Subject: Building improvements\n>\n> Dear all,\n>\n> [162/163] Please remember that the renovation of the entire headquarters building will begin two weeks from now. [163] The work will take place one floor at a time, starting on the fifth and moving downward. Each floor is scheduled to take one week to finish. I've discussed this with the team leaders, and a solution has been reached for dealing with workspace concerns during this time.\n>\n> While your floor is being renovated, space will be made available for you in the conference rooms on the third floor. When it comes time to renovate the third floor, employees who normally work there will be redistributed throughout the rest of the building. We are hoping this will not present any problems since there are only a dozen employees who permanently work on that floor. [164] Those staff members are asked to wait for further instructions from their team leader.\n>\n> I apologize in advance for any inconvenience this situation may create over the coming weeks. I am confident that we can all work together to make the process go as smoothly as possible. If you have any further queries, please contact your team leaders.\n>\n> Thank you,\n> Angela Romanov\n\n**翻譯**\n> 收件者：所有員工\n> 寄件者：Angela Romanov，辦公室主管\n> 主旨：大樓改善\n>\n> 大家好：\n>\n> [162/163] 請記得從現在起的兩週後，整棟總部大樓的整修將開始進行。[163] 工程採一次一層樓的方式進行，從五樓開始往下。每層樓預計花一週的時間完成。我已和各團隊領導人討論過這件事，並且已經對於處理這段期間工作場所問題的方法達成了結論。\n>\n> 當你的樓層進行整修時，三樓的會議室空間將可供使用。當三樓整修時，平常在那裡工作的員工就會重新分配到大樓各處。我們希望這不會造成任何問題，因為固定在那層樓工作的員工只有 12 個人。[164] 請這些員工等候團隊領導人進一步的指示。\n>\n> 我先為這個情況在未來幾週可能造成的任何不便致歉。我相信我們能共同努力，讓這個過程盡可能順利。如果你還有任何問題，請聯絡你的團隊領導人。\n>\n> 謝謝\n> Angela Romanov\n\n**單字** improvement (n.) 改善；take place (phr.) 舉行，發生；deal with (phr.) 處理，解決；permanently (adv.) 永久地；smoothly (adv.) 順利地，圓滑地；renovation (n.) 翻修，整修；at a time (phr.) 一次；workspace (n.) 職場，工作場所；further (adj.) 進一步的；headquarters (n.) 總部，總公司；downward (adv.) 往下；redistribute (v.) 重新分配；in advance (phr.) 事先，預先\n\n**162.** 答案 (C)｜難度：低\nWhy was the memo written?\n- (A) To arrange a meeting about future renovations\n- (B) To discuss recent employee complaints\n- (C) To remind employees about some renewal work\n- (D) To ask for suggestions about a redevelopment project\n\n> 為什麼寫了這則備忘錄？\n> (A) 為了安排關於未來整修的會議\n> (B) 為了討論近期員工的抱怨\n> (C) 為了提醒員工更新的工程\n> (D) 為了徵求對於再開發計畫的建議\n\n**尋找主題／目的 寫文章的理由**\n這是問寫備忘錄理由的尋找主題問題，所以要特別注意文章開頭的部分。「Please remember that the renovation of the entire headquarters building will begin two weeks from now.」提醒收件者記得兩週後將開始進行公司總部大樓的整修，接下來說明整修的日程和變更工作場所的因應方案，所以 (C) To remind employees about some renewal work 是正確答案。\n\n**替換表達**\nrenovation 翻修 → renewal 更新\n\n**單字** remind (v.) 提醒；renewal (n.) 更新；suggestion (n.) 建議；redevelopment (n.) 再開發\n\n<!-- page 162 -->\n**163.** 答案 (A)｜難度：中\nWhat is indicated about the building?\n- (A) It is a five-story structure.\n- (B) It will be demolished next year.\n- (C) It is three decades old.\n- (D) It has one conference room on each floor.\n\n> 關於大樓，文中提到什麼？\n> (A) 是五層樓的建築。\n> (B) 明年將會被拆除。\n> (C) 屋齡有 30 年。\n> (D) 每層樓都有一間會議室。\n\n**推論 細節資訊**\n這是關於題目關鍵字 the building 的推論問題。「Please remember that the renovation of the entire headquarters building will begin ~. The work will take place one floor at a time, starting on the fifth and moving downward.」表示將會開始進行整棟總部大樓的整修，工程採一次一層樓的方式進行，從五樓開始往下。因此可推知這棟大樓有五層樓，所以 (A) It is a five-story structure 是正確答案。\n\n**單字** five-story (adj.) 五層樓的；demolish (v.) 拆除；decade (n.) 十年\n\n**164.** 答案 (C)｜難度：高\nWhat are the employees on the third floor asked to do?\n- (A) Report their concerns to the renovation crew leader\n- (B) Assist with presentations in the conference room\n- (C) Expect forthcoming details from their supervisor\n- (D) Distribute copies of the office manager's instructions\n\n> 三樓的員工被要求做什麼？\n> (A) 向整修工程團隊領班報告他們擔心的事\n> (B) 在會議室協助簡報的進行\n> (C) 等待主管未來告知的細節資訊\n> (D) 分送有辦公室主管指示的文件影本\n\n**wh- 問題 What**\n這是問三樓的員工被要求做什麼（What）的 wh- 問題，所以要尋找和問題重點 the employees on the third floor asked to do 相關的內容。「Those staff members are asked to wait for further instructions from their team leader.」的部分提到，請三樓的員工等候團隊領導人的進一步指示，所以 (C) Expect forthcoming details from their supervisor 是正確答案。\n\n**替換表達**\nwait for further instructions from ~ team leader 等候團隊領導人的進一步指示 → Expect forthcoming details from ~ supervisor 等待主管未來告知的細節資訊\n\n**單字** expect (v.) 期待；forthcoming (adj.) 即將到來的；supervisor (n.) 主管；office manager (phr.) 辦公室主管，辦公室經理\n\n<!-- page 165 -->\n### Questions 165-167 refer to the following Web page.\n165-167 題參照以下網頁。\n\n> HOME | ABOUT | MENUS | CONTACT\n>\n> Welcome to Lunch on Demand, where the food is both on demand and in demand!\n>\n> From August 8, you won't need to wait in long lines anymore to get your food. [165] Simply browse Lunch on Demand's current menu, place an order, and pay on our Web site. We'll give you a confirmation number and the time that your food will be ready. Turn up at our location at the time we provide, tell us your number, and we'll give you back a box of the tastiest, healthiest food you'll find anywhere downtown.\n>\n> [167-B] Our menu changes on a weekly basis but always includes the dishes listed below:\n>\n> [167-A] SOUPS – We combine the freshest vegetables, beans or lentils for protein, and nutritious rice noodles to fill you up until dinner. [167-A] Perfect for vegetarians.\n>\n> [167-D] PANINIS – Only the finest wholemeal bread is used to make our great variety of toasted sandwiches. [167-D] Served with sweet potato fries.\n>\n> [167-D] STEWS AND CURRIES – If you're looking for something more substantial, our stews and curries are perfect! [167-D] They come with rice or bread on the side.\n>\n> SALADS – For those who are health-conscious, we combine crisp and crunchy greens and other vegetables with our special low-fat salad dressings.\n>\n> Throughout August, [166] we are giving our registered customers a $10 coupon for every new customer they encourage to sign up. Click here for details.\n\n**翻譯**\n> 首頁 | 關於 | 菜單 | 聯絡\n>\n> 歡迎來到 Lunch on Demand，這裡的食物隨選隨做，同時也很受歡迎！\n>\n> 從 8 月 8 日起，您不需要再大排長龍才能買到你的食物了。[165] 只要瀏覽 Lunch on Demand 現在的菜單、下訂，並且在我們的網站付款即可。我們會給您確認號碼，以及您可以取餐的時間。請在我們告知的時間到我們的據點，告訴我們您的號碼，我們就會給您一盒市中心最美味、最健康的餐點。\n>\n> [167-B] 我們的菜單每週更換，但固定包含以下菜色：\n>\n> [167-A] 湯 — 我們結合最新鮮的蔬菜、提供蛋白質的豆子或小扁豆、營養的米粉，讓您的飽足感維持到晚餐時間。[167-A] 非常適合素食者。\n>\n> [167-D] 帕尼尼 — 只用最好的全麥麵包製作我們種類多樣的烤三明治。[167-D] 附地瓜薯條。\n>\n> [167-D] 燉菜和咖哩 — 如果您在找更有份量的餐點，我們的燉菜和咖哩非常適合！[167-D] 附飯或麵包。\n>\n> 沙拉 — 為了重視健康的人，我們將爽脆的綠色蔬菜及其他蔬菜和特製的低脂沙拉醬結合在一起。\n>\n> 整個八月，[166] 已註冊的會員每介紹一位新顧客加入，我們就贈送 10 美元折價券。請點這裡查看詳情。\n\n**單字** browse (v.) 瀏覽，翻閱；on a weekly basis (phr.) 以週為單位；protein (n.) 蛋白質；wholemeal (adj.) 全麥的；health-conscious (adj.) 意識到健康的；crunchy (adj.) （厚實而）脆的；confirmation (n.) 確認；lentil (n.) 小扁豆（一種顆粒為扁圓形的食用豆）；nutritious (adj.) 營養價值高的；toast (v.) 烤到焦黃；crisp (adj.) （蔬菜等）新鮮的，脆的；greens (n.) 綠色蔬菜；turn up (phr.) 出現，露面；vegetarian (n.) 素食者 (adj.) 素食的；substantial (adj.) 份量多的，大量的；sign up (phr.) 登記加入\n\n<!-- page 166 -->\n**165.** 答案 (B)｜難度：中\nWhat is given to customers when they place an order?\n- (A) A payment receipt\n- (B) A time to pick up a purchase\n- (C) An estimated delivery fee\n- (D) An updated menu\n\n> 顧客下訂單的時候會得到什麼？\n> (A) 付款收據\n> (B) 領取購買物的時間\n> (C) 預估的運費\n> (D) 更新過的菜單\n\n**wh- 問題 What**\n這是問顧客下訂單的時候會得到什麼（What）的 wh- 問題，所以要尋找和問題重點 given to customers when they place an order 相關的內容。「Simply ~ place an order ~. We'll give you ~ the time that your food will be ready.」的部分提到，只要下訂單，就會告知餐點準備好的時間，而「Turn up at our location at the time we provide ~ we'll give you back a box of ~ food」表示在告知的時間到場，就可以得到盒裝的食物，所以 (B) A time to pick up a purchase 是正確答案。\n\n**單字** purchase (n.) 購買的東西；(v.) 購買；estimate (v.) 估計；(n.) 估計，估價；delivery (n.) 運送\n\n**166.** 答案 (B)｜難度：（頁緣裁切，無法確認）\nHow can customers qualify to receive a coupon?\n- (A) By placing a minimum order\n- (B) By getting others to join a Web site\n- (C) By registering before a deadline\n- (D) By ordering food from a specific location\n\n> 顧客怎樣會有資格獲得折價券？\n> (A) 訂購達最低標準\n> (B) 讓別人加入一個網站\n> (C) 在截止日前註冊\n> (D) 從特定地點點餐\n\n**wh- 問題 How**\n這是問顧客怎樣（How）可以獲得折價券的 wh- 問題，所以要尋找和問題重點 customers qualify to receive a coupon 相關的內容。「we are giving our registered customers a $10 coupon for every new customer they encourage to sign up」提到已註冊的顧客每當鼓勵一位新顧客加入時，就會得到 10 美元的折價券，所以 (B) By getting others to join a Web site 是正確答案。\n\n**167.** 答案 (C)｜難度：（頁緣裁切，無法確認）\nWhat is NOT indicated about Lunch on Demand?\n- (A) It is suitable for those who don't eat meat.\n- (B) It alters its menu every week.\n- (C) It can customize all its menu items.\n- (D) It serves accompaniments with some dishes.\n\n> 關於 Lunch on Demand，文中沒有提到什麼？\n> (A) 適合不吃肉的人。\n> (B) 每週變換菜單。\n> (C) 可以對菜單上每道菜色進行客製化。\n> (D) 對於某些菜提供佐餐的食物。\n\n**Not/True Not 問題**\n這是需要在文章中找到與關鍵字 Lunch on Demand 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A) 對應文中的「SOUPS」、「Perfect for vegetarians」，表示湯很適合素食者，符合選項敘述。(B) 對應文中的「Our menu changes on a weekly basis」，表示菜單每週變更，符合選項敘述。(C) 在文中沒有提到，所以 (C) It can customize all its menu items 是正確答案。(D) 對應文中的「PANINIS」、「Served with sweet potato fries」、「STEWS AND CURRIES」、「They come with rice or bread on the side.」，表示帕尼尼附地瓜薯條、燉菜和咖哩附飯或麵包，符合選項敘述。\n\n**單字** alter (v.) 改變，變更；customize (v.) 量身訂做，客製化；accompaniment (n.) 附加的東西，佐餐的食物\n\n<!-- page 167 -->\n### Questions 168-171 refer to the following text message chain. 🆕\n168-171 題參照以下訊息對話紀錄。\n\n> **Helen Coulter** [July 15, 9:54 a.m.]\n> I hope you are all having a good break. [170] I just heard back from the producer of *Timelight* this morning, and they would like to extend Kitchen Belle's catering contract for another two years. [170] The studio has renewed the TV series. Shall we keep the same schedule as last year, or would you like to switch times?\n>\n> **Elaine Painter** [July 15, 10:00 a.m.]\n> That's great news! It will guarantee the business a steady income. [168/169] I know Henry Lincoln [168] usually does breakfast, but as long as he doesn't have a problem with it, can I take the morning shift instead of lunch this time?\n>\n> **Graham Fulton** [July 15, 10:04 a.m.]\n> It's fine by him. [168] He's with me now and just told me so, Elaine. He'd actually prefer midday. As for me, I want to stick with the breakfast shift. Will there be any extra evening shoots this year?\n>\n> **Helen Coulter** [July 15, 10:05 a.m.]\n> So Elaine and Graham can do the 7:30-11:00 shift, and [169] Henry and I will do 11:30-3:30. [170] There will be some evening shifts for extra pay, but none that will end past midnight. In addition, the show will also be filmed outside the studio this season, so we'll have to make adjustments. Anyway, we can discuss that issue when [171] we return from vacation next week.\n>\n> **Elaine Painter** [July 15, 10:07 a.m.]\n> Will the number of cast and crew be greater?\n>\n> **Graham Fulton** [July 15, 10:07 a.m.]\n> It sounds like more work than last year.\n>\n> **Helen Coulter** [July 15, 10:08 a.m.]\n> Yes, Elaine. There will be a total of 88 to feed rather than 67. And Graham, I think it will be more work. But they are paying us more, so I think we can afford to hire a couple of food preparation assistants.\n\n**翻譯**\n> **Helen Coulter** [7 月 15 日，上午 9:54]\n> 我希望大家現在都享受著美好的假日。[170] 我今天早上剛得到《Timelight》製作人的回覆，他們想要把 Kitchen Belle 公司的外燴合約再延長兩年。[170] 製作公司已經再次開拍這齣電視影集。我們應該維持跟去年一樣的時間表，還是你們想要改變時間呢？\n>\n> **Elaine Painter** [7 月 15 日，上午 10:00]\n> 真是好消息！這樣能保證公司有穩定的收入。[168/169] 我知道 Henry Lincoln 通常做早餐，但如果他沒有問題的話，我這次可以值早班而不是午餐嗎？\n>\n> **Graham Fulton** [7 月 15 日，上午 10:04]\n> 他覺得沒關係。[168] 他現在跟我在一起，他剛告訴我的，Elaine。他其實比較想要中午。至於我，我想繼續值早餐班。今年還有額外的晚間拍攝嗎？\n>\n> **Helen Coulter** [7 月 15 日，上午 10:05]\n> 所以 Elaine 和 Graham 可以值 7:30-11:00 的班，[169] Henry 和我會值 11:30-3:30 的班。[170] 會有一些有額外薪水的晚班，但都會在午夜前結 ？\n> (A) 上午 7:30\n> (B) 上午 11:00\n> (C) 上午 11:30\n> (D) 下午 3:30\n\n**wh- 問題 When**\n這是問 Lincoln 先生下一季什麼時候（When）開始值班的 wh- 問題，所以要尋找和問題重點 Mr. Lincoln start his regular shifts next season 相關的內容。從對話中出現的全名「Henry Lincoln」和 Helen Coulter 說的「Henry and I will do 11:30-3:30」，可知 Helen Coulter 會和 Lincoln 先生一起值上午 11:30 到下午 3:30 的班，所以 (C) At 11:30 a.m. 是正確答案。\n\n**170.** 答案 (A)｜難度：（頁緣裁切，無法確認）\nWhat is implied about *Timelight*?\n- (A) It will occasionally have production work at night.\n- (B) It reduced the size of its staff.\n- (C) It will film all scenes in a television studio.\n- (D) It will premiere on television next year.\n\n> 關於《Timelight》，文中暗示什麼？\n> (A) 偶爾會進行夜間製片工作。\n> (B) 減少了工作人員的數目。\n> (C) 將在電視攝影棚拍攝所有場景。\n> (D) 明年會在電視上首映。\n\n**推論 細節資訊**\n這是關於題目關鍵字 *Timelight* 的推論問題。Helen Coulter 說「I just heard back from the producer of *Timelight*」、「The studio has renewed the TV series.」，表示得到了《Timelight》製作人的回覆，得知製作公司已經再次開拍這齣電視影集，後面又說「There will be some evening shifts」，表示會有一些晚班。因此可以推知，《Timelight》偶爾會在晚間拍攝，所以 (A) It will occasionally have production work at night 是正確答案。\n\n**替換表達**\nbe ~ evening shifts 有晚班 → have production work at night 在夜間進行製作工作\n\n**單字** production (n.) 製作，製片；premiere (v.) 首次上演，使首次上演\n\n<!-- page 169 -->\n**171.** 答案 (C)｜難度：低\nWhat will happen next week at Kitchen Belle?\n- (A) A list of crew members will be finalized.\n- (B) A couple of new assistants will be hired.\n- (C) Some team members will return from a holiday.\n- (D) Some executives will be stopping by for a meeting.\n\n> 下週在 Kitchen Belle 公司會發生什麼事？\n> (A) 將會確定工作人員名單。\n> (B) 將會雇用幾位新的助理。\n> (C) 一些團隊成員將結束休假返回公司。\n> (D) 一些高層主管會到公司開會。\n\n**wh- 問題 When**\n這是問下週在 Kitchen Belle 公司會發生什麼（What）的 wh- 問題，所以要尋找和問題重點 happen next week at Kitchen Belle 相關的內容。Helen Coulter 說「we return from vacation next week」，表示下週在 Kitchen Belle 公司的其他一些員工將會休完假回公司，所以 (C) Some team members will return from a holiday 是正確答案。\n\n**替換表達**\nvacation 休假 → holiday 休假\n\n**單字** finalize (v.) 確定，完成；stop by (phr.) 短暫拜訪\n\n<!-- page 170 -->\n### Questions 17
