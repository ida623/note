wever, utilities such as gas, electricity, or Internet and cable service are the responsibility of the tenant. [184]Monthly maintenance fees for parking facility use are $10 per space. Payment of all fees is accepted by check, bank transfer, or credit card. [182]Late payments may be subject to penalties. Should you have any questions regarding these charges, please feel free to visit the administrative office at 302F any time, or call us at 555-4409.\n\n**翻譯**\n> [181-B]Burlington Towers，584 號，Denver 大街，拉赤蒙，華盛頓州 99487\n>\n> **維護費用付款通知**\n>\n> | | |\n> |---|---|\n> | [181-B]承租者 | Plumb 法律事務所 |\n> | [185]單位 | 401A, 401C |\n> | [181-D]付款期間 | 第 4 季 |\n> | 應付一般維護費用 | 10 月…400 美元（2 個單位）<br>11 月…400 美元（2 個單位）<br>12 月…400 美元（2 個單位） |\n> | 應付停車區域維護費用 | 10 月…100 美元（10 個車位）<br>11 月…100 美元（10 個車位）<br>12 月…100 美元（10 個車位） |\n> | 應付總金額 | 1,500 美元 |\n> | 到期日 | 1 月 15 日 |\n>\n> 請注意由於勞力成本上漲，明年每月維護費用將會增加，承租 1 個單位者從 200 美元提高至 230 美元，承租 2 個單位者從 400 美元提高至 450 美元，每增加 1 個單位將加收 150 美元。[181-B]維護費用包括設施、大廳及地面的保養。其中也包含垃圾清理與水費。但瓦斯、電、網路與有線電視等費用由承租者負擔。[184]使用停車設施之每月維護費用為每個停車位 10 美元。所有費用皆接受支票、銀行轉帳或信用卡付款。[182]逾期付款可能須繳罰金。若您對以上費用有任何疑問，請隨時親洽 302F 管理辦公室或撥 555-4409 聯絡我們。\n\n文章 2\n\n> To: Elizabeth Mackie <emack@burlingtontowers.com>\n> From: Tom Rousseau <tross@plumblegal.com>\n> Date: January 6\n> Subject: Maintenance fees\n>\n> Dear Ms. Mackie,\n>\n> I received the billing statement about the maintenance fees for the past three months. [183]Before submitting payment, there are some discrepancies I need to point out.\n>\n> As you know, [185]our firm underwent an expansion, and we took over the vacant unit next to ours. However, we did not move into this unit until November. Also, when we expanded, [184]we hired five new staff members, all of whom were assigned parking spaces in addition to the ten we were already using. Lastly, [185]our newest unit is actually 401B, and not 401A as listed in the billing statement, so you may wish to change your records.\n\n**翻譯**\n> 收件者：Elizabeth Mackie <emack@burlingtontowers.com>\n> 寄件者：Tom Rousseau <tross@plumblegal.com>\n> 日期：1 月 6 日\n> 主旨：維護費用\n>\n> 親愛的 Mackie 小姐：\n>\n> 我收到了過去三個月的維護費用帳單。[183]在付款前，我必須指出一些不符之處。\n>\n> 如您所知，[185]本公司進行了擴張，我們接下了隔壁閒置的單位。然而，我們到 11 月才搬進了這個單位。而且，當我們擴張時，[184]雇用了 5 名新員工，在我們原本已經使用的 10 個車位以外，他們都分配到了額外的車位。最後，[185]我們新租用的單位其實是 401B，不是帳單上所寫的 401A，所以您最好修改您的紀錄。\n\n<!-- page 287 -->\n\n> I will pay our fees upon receiving the modified notice.\n>\n> Tom Rousseau\n> Head of accounting, Plumb Legal Firm\n\n**翻譯**\n> 我會在收到修改過的通知時付款。\n>\n> Tom Rousseau\n> 會計部主任，Plumb 法律事務所\n\n**單字** 文章 1：labor (n.) 勞力，勞動；maintenance fee (phr.) 維護費用（管理費）；upkeep (n.) 保養，維護；tenant (n.) 承租者，住戶；incur (v.) 產生（費用），招致；responsibility (n.) 責任，義務；cover (v.) 包含，涵蓋；utility (n.) （水、電、瓦斯等）公用事業；penalty (n.) 罰金，處罰；be subject to (phr.) 受到…，是…的對象；administrative (adj.) 管理的，行政上的\n**單字** 文章 2：submit (v.) 提交，提出；discrepancy (n.) 不一致，差異；point out (phr.) 指出；undergo (v.) 經歷，接受；expansion (n.) 擴張，擴大；vacant (adj.) 空的，沒有人的；assign (v.) 分配，任命；modify (v.) 修改，變更\n\n**181.** 答案 (B)｜難度：最高\nWhat is indicated about Plumb Legal Firm in the payment notice?\n- (A) It recently moved into Burlington Towers.\n- (B) It is located in a building with a lobby.\n- (C) It sent a gas bill to the administrative office.\n- (D) It pays for maintenance every month.\n\n> 關於 Plumb 法律事務所，付款通知中提到什麼？\n> (A) 最近搬進了 Burlington Towers。\n> (B) 設址於一棟有大廳的大樓。\n> (C) 寄了瓦斯費帳單給行政辦公室。\n> (D) 每月支付維護費用。\n\n**推論 細節資訊**\n這是關於付款通知中對於 Plumb 法律事務所提到什麼的推論問題，所以要從給 Plumb 法律事務所的付款通知表格（第一篇文章）中找出相關的內容。表格中的「Burlington Towers」和「Tenant, Plumb Legal Firm」顯示 Plumb 法律事務所是 Burlington Towers 的承租戶之一，而「Maintenance fees include the cost of upkeep of facilities, lobbies」顯示維護費用包含設施及大廳的保養，因此可以推知 Plumb 法律事務所設址於一棟有大廳的大樓，所以 (B) It is located in a building with a lobby 是正確答案。和 (D) 相關的部分是「Payment period, 4th quarter」，顯示這次要支付的是第 4 季的費用，可以推斷是 3 個月繳一次維護費用，所以 (D) 不對。\n\n**182.** 答案 (A)｜難度：中\nWhat will happen if tenants fail to make the payment by a due date?\n- (A) They may incur an extra charge.\n- (B) Utility services may be disconnected.\n- (C) They will be asked to vacate units.\n- (D) Parking privileges will be revoked.\n\n> 如果承租者沒有在截止日前繳款，會發生什麼事？\n> (A) 可能產生額外費用。\n> (B) 公用服務可能被切斷。\n> (C) 會被要求搬出承租的單位。\n> (D) 停車權利會被撤銷。\n\n**wh- 問題 What**\n這是問如果承租者沒有在截止日前繳款，會發生什麼事（What）的 wh- 問題，所以要看提到與問題重點 tenants fail to make the payment by a due date 相關內容的表格（第一篇文章）。表格中「Late payments may be subject to penalties.」的部分提到，逾期付款可能須繳罰金，所以 (A) They may incur an extra charge 是正確答案。\n\n**單字** disconnect (v.) 切斷（水、電、瓦斯等的）供給，中斷連線；vacate (v.) 清空，搬出；privilege (n.) 特權，權利；revoke (v.) 撤回，取消\n\n<!-- page 288 -->\n\n**183.** 答案 (A)｜難度：低\nWhy was the e-mail written?\n- (A) To notify an administrator of billing errors\n- (B) To request copies of unit rental agreements\n- (C) To ask about legal services available\n- (D) To apply for permission to renovate a space\n\n> 為什麼寫了這封電子郵件？\n> (A) 為了通知管理員帳單上的錯誤\n> (B) 為了要求單位租用合約的複本\n> (C) 為了詢問可提供的法律服務\n> (D) 為了申請核准裝修空間\n\n**尋找主題／目的 寫文章的理由**\n這是詢問寫電子郵件（第二篇文章）理由的尋找主題問題。電子郵件中的「Before submitting payment, there are some discrepancies I need to point out.」提到，在付款之前，想要指出一些不符之處，之後說明了必須修正的部分，所以 (A) To notify an administrator of billing errors 是正確答案。\n\n**替換表達**\ndiscrepancies 不一致 → errors 錯誤\n\n**單字** apply (v.) 申請；permission (n.) 允許，許可；renovate (v.) 整修，翻修\n\n**184.** 答案 (B)｜難度：高\nWhat does Mr. Rousseau suggest about his maintenance fee charges?\n- (A) They are paid for by wire transfer on a regular basis.\n- (B) They should include an additional monthly charge for parking.\n- (C) They are exclusive of the costs of water expenditures.\n- (D) They need to be handed in to Burlington Towers by November.\n\n> 關於維護費用，Rousseau 先生所寫的內容顯示什麼？\n> (A) 是以電匯方式定期繳交的。\n> (B) 應該包括額外的每月停車費用。\n> (C) 不包括水費。\n> (D) 必須在 11 月以前交給 Burlington Towers。\n\n**推論 多篇文章綜合題**\n這是必須參考兩篇文章內容的多篇文章綜合題，關鍵部分是 Mr. Rousseau ~ his maintenance fee charges，問 Rousseau 先生對於維護費用提到了什麼，所以先看他所寫的電子郵件（第二篇文章）。\n\n第二篇文章中的「we hired five new staff members, all of whom were assigned parking spaces in addition to the ten we were already using」提到，雇用了 5 名新員工，而且除了公司原本已經使用的 10 個車位以外，這 5 個人也都分配到自己的車位，表示 Rousseau 所屬的 Plumb 法律事務所使用的車位增加了 5 個，這是第一個線索。但是，這裡沒有提到使用的車位增加會發生什麼事，所以還需要在第一篇文章（表格）中確認。第一篇文章中的「Monthly maintenance fees for parking facility use are $10 per space.」提到，每個車位的每月維護費用是 10 美元，可知使用車位會使維護費用增加，這是第二個線索。\n\n綜合「Plumb 法律事務所使用的車位增加了 5 個」和「使用車位會使維護費用增加」這兩個線索，可以推知 Plumb 法律事務所這次要繳的維護費用應該包括額外的停車費，所以 (B) They should include an additional monthly charge for parking 是正確答案。\n\n**單字** wire transfer (phr.) 電匯；on a regular basis (phr.) 定期地；exclusive of (phr.) 排除…的；expenditure (n.) 支出，花費；hand in (phr.) 交出…\n\n<!-- page 289 -->\n\n**185.** 答案 (D)｜難度：最高\nWhat was Plumb Legal Firm's first office space at Burlington Towers?\n- (A) 302F\n- (B) 401A\n- (C) 401B\n- (D) 401C\n\n> Plumb 法律事務所在 Burlington Towers 最早租用的辦公空間是哪個？\n> (A) 302F\n> (B) 401A\n> (C) 401B\n> (D) 401C\n\n**wh- 問題 多篇文章綜合題**\n這是必須參考兩篇文章內容的多篇文章綜合題。題目的關鍵部分是 Plumb Legal Firm's first office space，問 Plumb 法律事務所最早租用的辦公空間是哪個（What），所以先看給 Plumb 法律事務所的付款通知表格（第一篇文章）。\n\n由第一篇文章的「Unit, 401A, 401C」可知，Plumb 法律事務所使用的空間應該是 401A 和 401C，這是第一個線索。但是，這裡沒有提到最早租用的空間是哪個，所以還需要確認電子郵件（第二篇文章）的內容。第二篇文章的「our firm underwent an expansion, and we took over the vacant unit next to ours」和「our newest unit is actually 401B, and not 401A as listed in the billing statement」提到，Plumb 法律事務所擴大規模，又租了隔壁的空間，但新租的空間是 401B 而不是 401A，這是第二個線索。\n\n綜合「Plumb 法律事務所租用 401A 和 401C」和「Plumb 法律事務所擴張時新租的其實是 401B」這兩個線索，可以推知 Plumb 法律事務所並沒有租 401A，而 401C 是他們最早租用的空間，所以 (D) 401C 是正確答案。\n\n<!-- page 290 -->\n\n### Questions 186-190 refer to the following e-mail, schedule, and article. 🆕\n186-190 題參照以下電子郵件、時間表與報導。\n\n文章 1\n\n> To: Adam Johansson <adamj@helpinghouses.com>\n> From: Kristina Hausmann <kristinah@helpinghouses.com>\n> Date: February 17\n> Subject: Urgent event update\n>\n> Dear Mr. Johansson,\n>\n> There are some changes to the schedule for tonight's fundraising event. Professor Trevelyan's flight from San Francisco has been delayed. He will not be able to arrive at the venue in time to speak during his original time slot. So, we will serve dinner 20 minutes early, and Mr. Trevelyan can speak immediately after. Now, the schedule has already been sent out, and we have no time to reprint it anyway. Consequently, [187]it would be good if you could briefly mention these changes when you give your talk.\n>\n> [186]I'll be at the venue in about 15 minutes to make sure preparations are going smoothly and to meet with the caterers and help them set up. If you have any questions, call me at 555-7246.\n>\n> Best wishes,\n> Kristina Hausmann\n\n**翻譯**\n> 收件者：Adam Johansson <adamj@helpinghouses.com>\n> 寄件者：Kristina Hausmann <kristinah@helpinghouses.com>\n> 日期：2 月 17 日\n> 主旨：緊急告知活動最新情況\n>\n> 親愛的 Johansson 先生：\n>\n> 今晚募款活動的時間安排有些變動。Trevelyan 教授從舊金山起飛的班機延誤了。他來不及在原定時段到會場演講。所以，我們會提早 20 分鐘供應晚餐，而 Trevelyan 先生可以在那之後立刻進行演講。時間表早已寄出了，我們也沒有時間重印。所以，[187]如果您能在演講時簡單提一下這些變動就好了。\n>\n> [186]我大約會在 15 分鐘後到會場，確認準備工作順利進行，也要見外燴業者人員，並且幫他們布置。如果您有任何問題，請撥 555-7246 聯絡我。\n>\n> Kristina Hausmann\n\n文章 2\n\n> **Helping Houses**\n> **Homeless Shelter**\n> **Fundraising Event**\n>\n> February 17\n>\n> | | |\n> |---|---|\n> | 7:15 p.m. | [187]Opening remarks will be given by Adam Johansson, director of Helping Houses. |\n> | 7:30 p.m. | Performance: The Denver Public Schools Choir will sing several songs, including pop, classical, and gospel numbers. |\n> | 8:00 p.m. | Talk: Professor John Trevelyan of Bay Area University will discuss the impacts of homelessness on society and why social and financial support is so urgently needed. |\n> | 8:20 p.m. | Dinner and dessert will be served. |\n> | 9:30 p.m. | [189]Charity auction: Some of our lots this year include a two-night stay at the Carruthers Hotel, brand-new tablet computers donated by the Delft Corporation, and a signed jersey from the Colorado Coyotes baseball team. |\n> | 10:15 p.m. | Performance: Comedian Darren Benedict will do a stand-up routine for guests. |\n> | 10:40 p.m. | Performance: Singer-songwriter Kate Barton will treat us to some music from her new album, *A Murmur in Time*. |\n> | 11:00 p.m. | Denver mayor Tania Groot will deliver brief closing remarks. |\n\n**翻譯**\n> **Helping Houses**\n> **遊民庇護所**\n> **募款活動**\n>\n> 2 月 17 日\n>\n> | | |\n> |---|---|\n> | 晚上 7:15 | [187]Helping Houses 主任 Adam Johansson 致開幕致詞。 |\n> | 晚上 7:30 | 表演：丹佛公立學校合唱團演唱數首流行、古典與福音歌曲。 |\n> | 晚上 8:00 | 演講：Bay Area 大學 John Trevelyan 教授討論遊民對社會的影響，以及急需社會與財務支持的理由。 |\n> | 晚上 8:20 | 供應晚餐及點心。 |\n> | 晚上 9:30 | [189]慈善拍賣：今年的拍賣品包括 Carruthers 飯店住宿 2 晚、Delft 公司捐贈的全新平板電腦、以及 Colorado Coyotes 棒球隊的簽名球衣等等。 |\n> | 晚上 10:15 | 表演：搞笑藝人 Darren Benedict 為來賓進行脫口秀演出。 |\n> | 晚上 10:40 | 表演：創作歌手 Kate Barton 為我們帶來新專輯《A Murmur in Time》中的幾首歌曲。 |\n> | 晚上 11:00 | 丹佛市長 Tania Groot 發表簡短的閉幕致詞。 |\n\n<!-- page 291 -->\n\n文章3\n\n> Event Raises Funds for a Good Cause\n>\n> During [189]a fundraiser held at the Carruthers Hotel over the weekend, invited guests donated close to $25,000 for the continued operation of Helping Houses. Established 24 years ago, the organization has assisted homeless around the region in finding food, accommodation, counseling, and employment. Guests were presented with short talks, a selection of performances, and a banquet dinner. Mayor Tania Groot, who was in attendance, said \"It is our duty as a community to care for those less fortunate.\" [190-B]She also presented the director of Helping Houses with a check from the city for an additional donation of $15,000. [190-D]Corporate and private donations are still being accepted and can be made by visiting www.helpinghousesshelter.org/donate.\n\n**翻譯**\n\n> 活動為了公益目的而募款\n>\n> 上週末 [189]於 Carruthers 飯店舉行之募款活動中，受邀賓客捐出將近 25,000 美元以維持 Helping Houses 之營運。Helping Houses 組織成立於 24 年前，協助地區遊民獲得食物、住宿、諮詢與就業。募款活動為來賓進行簡短演講、一些表演，並且舉辦了晚宴。出席活動的市長 Tania Groot 表示：「關懷弱勢族群是我們社會的責任。」[190-B]她也頒發市府額外捐贈之 15,000 美元支票給 Helping Houses 主任。[190-D]目前仍接受企業與個人捐款，可至 www.helpinghousesshelter.org/donate 進行捐贈。\n\n**單字**\n文章 1：fundraising (n.) 募款；slot (n.) 時段，位置；make sure (phr.) 確認，務必做到；venue (n.) 場所；serve (v.) 供應，服務；preparation (n.) 準備；in time (phr.) 及時，按時；briefly (adv.) 簡短地；caterer (n.) 外燴業者\n文章 2：homeless (n.) 遊民；(adj.) 無家可歸的；choir (n.) 合唱團，唱詩班；lot (n.) 拍賣品；stand-up (adj.)（搞笑脫口秀）單人對觀眾表演的；routine (n.) 內容固定的表演，例行事務；shelter (n.) 庇護所；(v.) 庇護；number (n.) 一首曲子，數字；(v.) 計數；brand-new (adj.) 全新的；singer-songwriter (n.) 會創作歌曲的歌手；opening remarks (phr.) 開場致詞；charity auction (phr.) 慈善拍賣；jersey (n.) 運動服，球衣\n文章 3：operation (n.) 營運，手術；banquet (n.) 宴會；check (n.) 支票，檢查；(v.) 檢查；accommodation (n.) 住宿，住處；in attendance (phr.) 出席的；a selection of (phr.) 一些，多種；community (n.) 社會，社區\n\n**186.** 答案 (B)｜難度：中\nAccording to the e-mail, what will Ms. Hausmann do next?\n- (A) Print some documents\n- (B) Visit an event venue\n- (C) Speak with a colleague\n- (D) Call a performer\n\n> 根據電子郵件，Hausmann 小姐接下來會做什麼？\n> (A) 列印一些文件\n> (B) 去活動會場\n> (C) 和同事談話\n> (D) 打電話給演出者\n\n**wh- 問題 What**\n這是問根據電子郵件，Hausmann 小姐接下來會做什麼（What）的 wh- 問題，所以要看 Hausmann 小姐所寫的電子郵件（第一篇文章）。電子郵件中，「I'll be at the venue in about 15 minutes」的部分提到她大約 15 分鐘後會到會場，所以 (B) Visit an event venue 是正確答案。\n\n**單字** colleague (n.) 同事；performer (n.) 表演者，演出者\n\n<!-- page 292 -->\n\n**187.** 答案 (B)｜難度：中\nWhat most likely happened during the fundraising event?\n- (A) A university professor welcomed guests before dinner.\n- (B) A director announced program changes during opening remarks.\n- (C) Some tickets to a baseball game were auctioned.\n- (D) Some officials presented a certificate to a non-profit organization.\n\n> 募款活動中最有可能發生了什麼事？\n> (A) 大學教授在晚餐前歡迎來賓。\n> (B) 主任在開幕致詞時宣布節目時程的變動。\n> (C) 拍賣棒球比賽的門票。\n> (D) 一些官員頒發證書給一家非營利組織。\n\n**推論 多篇文章綜合題**\n這是必須參考三篇文章其中兩篇內容的多篇文章綜合題。題目的關鍵部分是 during the fundraising event，問募款活動中可能發生了什麼事，先看提到活動相關事項的電子郵件（第一篇文章）。\n\n第一篇文章中的「it would be good if you could briefly mention these changes when you give your talk」表示如果對方（Adam Johansson）能在演講時簡單提一下這些變動就好了，這是第一個線索。但是，這裡沒有提到 Adam Johansson 要做什麼演說，所以還需要在第二篇文章（時間表）中確認。第二篇文章中的「Opening remarks will be given by Adam Johansson, director of Helping Houses.」顯示 Helping Houses 主任 Adam Johansson 要發表開幕致詞，這是第二個線索。\n\n綜合「希望 Adam Johansson 在演講時簡單提一下變動」和「Helping Houses 主任 Adam Johansson 要發表開幕致詞」這兩個線索，可以推知主任應該會在開幕致詞時宣布節目時程的變動，所以 (B) A director announced program changes during opening remarks 是正確答案。\n\n**單字** auction (v.) 拍賣；(n.) 拍賣；certificate (n.) 證書；non-profit organization (phr.) 非營利組織\n\n**188.** 答案 (D)｜難度：中\nIn the article, the word \"duty\" in paragraph 1, line 6, is closest in meaning to\n- (A) motivation\n- (B) tendency\n- (C) labor\n- (D) responsibility\n\n> 報導第 1 段第 6 行的「duty」，意思最接近\n> (A) 動機\n> (B) 傾向\n> (C) 勞動\n> (D) 責任\n\n**同義詞**\n在報導（第三篇文章）中，duty 在「It is our duty as a community to care for those less fortunate.」這個句子的意思是「責任，義務」，所以表示「責任」的 (D) responsibility 是正確答案。\n\n<!-- page 293 -->\n\n**189.** 答案 (C)｜難度：高\nWhat was included in an auction?\n- (A) Two tickets for admission to an amusement park\n- (B) Autographed memorabilia from actors\n- (C) A stay at the same venue as the fundraiser\n- (D) A set of brand new desktop computers\n\n> 拍賣中包括什麼？\n> (A) 遊樂園入場券 2 張\n> (B) 演員簽名的紀念物品\n> (C) 募款活動舉辦地點的住宿\n> (D) 幾台全新的桌上型電腦\n\n**wh- 問題 多篇文章綜合題**\n這是必須參考三篇文章其中兩篇內容的多篇文章綜合題。題目的關鍵部分是 included in an auction，問拍賣裡面有什麼（What），所以先看簡介活動內容的時間表（第二篇文章）。\n\n第二篇文章中的「Charity auction: Some of our lots ~ include a two-night stay at the Carruthers Hotel」顯示拍賣品包括在 Carruthers 飯店住宿 2 晚，這是第一個線索。但是，這裡沒有提到 Carruthers 飯店是什麼地方，所以還需要確認報導（第三篇文章）的內容。第三篇文章中的「a fundraiser held at the Carruthers Hotel」顯示募款活動在 Carruthers 飯店舉辦，這是第二個線索。\n\n綜合「拍賣品包括在 Carruthers 飯店住宿 2 晚」和「募款活動在 Carruthers 飯店舉辦」這兩個線索，可以推知拍賣品包括募款活動舉辦地點的住宿，所以 (C) A stay at the same venue as the fundraiser 是正確答案。\n\n**單字** admission (n.) 入場，入學；autograph (v.) 親筆簽名；(n.) 親筆簽名；memorabilia (n.) 紀念物品，收藏品\n\n**190.** 答案 (B)｜難度：中\nWhat is indicated about Helping Houses?\n- (A) It earned more cash during the fundraiser than last year.\n- (B) It received funding from the city government.\n- (C) It plans to raise money to expand its current facilities.\n- (D) It primarily operates with funds from corporate sponsors.\n\n> 關於 Helping Houses，文中提到什麼？\n> (A) 在募款活動中募得比去年更多的現金。\n> (B) 收到了來自市政府的資金。\n> (C) 計畫募款擴建現有設施。\n> (D) 主要靠著贊助企業的資金運作。\n\n**Not/True True 問題**\n這是需要找到與關鍵字 Helping Houses 相關的資訊，並且與選項敘述對照的 Not/True 問題，所以要看提到 Helping Houses 相關事項的報導（第三篇文章）。(A) 在文中沒有提到。(B) 對應文中的「She also presented the director of Helping Houses with a check from the city for an additional donation of $15,000.」，表示她（市長 Tania Groot）頒發了市府額外捐贈的 15,000 美元支票給 Helping Houses 主任，符合選項敘述，所以 (B) It received funding from the city government 是正確答案。(C) 在文中沒有提到。和 (D) 相關的部分是「Corporate and private donations are still being accepted」，表示仍然接受企業與個人捐款，但無法得知是否主要靠贊助企業的資金運作，所以不能選 (D)。\n\n**單字** primarily (adv.) 主要\n\n<!-- page 294 -->\n\n### Questions 191-195 refer to the following article, e-mail, and form. 🆕\n191-195 題參照以下報導、電子郵件及表格。\n\n文章1\n\n> Aurora's First Job Fair\n> By Taylor Bridges\n>\n> [194]The Aurora Chamber of Commerce will conduct the first Aurora Job Fair on March 29, from 7:00 a.m. to 7:00 p.m. at the Aurora City Arena. Coordinator Alex McDade explained that [191-B]the fair was organized in response to calls from Mayor Owen Brownstein, who has asked the business community to help the city address issues with unemployment. Fifty companies are expected to participate.\n>\n> Employers wishing to secure [195]a regular-sized table at the event will be charged $150, while double-sized tables cost $250. However, [195]those who register before February 28 may reserve a regular table for just $130. For registration or payment, contact Liz Perry at lizperry@lightlife.com. [191-C]Job seekers do not need to register in advance and will be admitted for free.\n\n**翻譯**\n\n> Aurora 市的第一場就業博覽會\n> Taylor Bridges 撰文\n>\n> [194]Aurora 市商會將於 3 月 29 日上午 7:00 至晚間 7:00 於 Aurora 市體育場舉行第一屆 Aurora 市就業博覽會。籌辦人 Alex McDade 說明 [191-B]這場活動是為了回應市長 Owen Brownstein 的要求而舉辦的，市長要求商業界幫助該市解決失業問題。預計將有 50 家公司參加。\n>\n> 希望 [195]在活動中有一般尺寸桌位的雇主，須繳交 150 美元，兩倍大桌位則為 250 美元。不過，[195]於 2 月 28 日前登記之業者，僅需 130 美元即可預約一般尺寸桌位。欲登記或付款，請寄 lizperry@lightlife.com 聯絡 Liz Perry。[191-C]求職者不需事先報名，可免費入場。\n\n文章2\n\n> To: Liz Perry <lizperry@lightlife.com>\n> From: Kenneth Collins <ken_collins@starmortgage.com>\n> Date: January 29\n> Subject: Aurora Job Fair\n>\n> Dear Ms. Perry,\n>\n> [192]I read an article about the upcoming job fair, and my company, Star Mortgage, would like to be involved. We work closely with another company, [192]Bingham Title, which is also interested in participating. [193-B]We are actually subsidiaries of the company Moore Investments. [192/194]Is it possible for us to have booths located next to each other? This would allow us to coordinate closely during the event.\n>\n> [194]If this is acceptable, I will go ahead and register, pay for our table, and notify my colleague at Bingham Title to do the same. Thank you for your consideration.\n>\n> Sincerely,\n>\n> Kenneth Collins\n\n**翻譯**\n\n> 收件者：Liz Perry <lizperry@lightlife.com>\n> 寄件者：Kenneth Collins <ken_collins@starmortgage.com>\n> 日期：1 月 29 日\n> 主旨：Aurora 市就業博覽會\n>\n> 親愛的 Perry 小姐：\n>\n> [192]我讀到一則關於即將舉行的就業博覽會的報導，我的公司 Star Mortgage 希望能參加。我們和另一家公司 [192]Bingham Title 合作密切，而他們也有興趣參加。[193-B]我們其實都是 Moore Investments 公司的子公司。[192/194]我們的攤位有可能彼此相鄰嗎？這樣可以讓我們在活動中密切合作。\n>\n> [194]如果這個要求可以接受的話，我將接著進行登記、付桌位費用，並且通知 Bingham Title 公司的同事也這麼做。謝謝您的考慮。\n>\n> Kenneth Collins\n\n文章3\n\n> FIRST AURORA JOB FAIR: *Corporate Participant Confirmation Form*\n>\n> Thank you for registering, and we hope you find the fair beneficial. This form serves as confirmation of your registration, so please bring it to the venue.\n\n**翻譯**\n\n> 第一屆 Aurora 市就業博覽會：參加企業確認表格\n>\n> 感謝您的登記，我們希望就業博覽會對您有幫助。本表係作為登記確認用，因此請將本表攜帶至會場。\n\n<!-- page 295 -->\n\n> | [194]Company: Bingham Title | [195]Representative(s): Cora Jacobs |\n> |---|---|\n> | Phone: 555-4033 | E-mail: c.jacobs@binghamtitle.com |\n> | Total number of passes needed: Three | [195]Table(s): One / Regular |\n> | [195]Payment Method: Cash ○　Credit Card ●　Check ○　Bank Transfer ○ | |\n>\n> [194]Your table number is C-14, located near the venue's main entrance. Set-up will be permitted beginning at 6 a.m. on the day of the event.\n>\n> *Cora Jacobs*　　　　[195]*February 16*\n> Please sign your name here　　Date\n\n**翻譯**\n\n> | [194]公司：Bingham Title | [195]代表人：Cora Jacobs |\n> |---|---|\n> | 電話：555-4033 | 電子郵件：c.jacobs@binghamtitle.com |\n> | 所需通行證張數：3 | [195]桌位：1 張／一般 |\n> | [195]付款方式：現金 ○　信用卡 ●　支票 ○　銀行轉帳 ○ | |\n>\n> [194]您的桌位號碼是 C-14，位於會場主入口附近。活動當天上午 6 點起可進行布置。\n>\n> *Cora Jacobs*　　　　[195]*2 月 16 日*\n> 請於此處簽名　　日期\n\n**單字**\n文章 1：fair (n.) 博覽會；(adj.) 公平的；arena (n.) 競技場，體育場；in response to (phr.) 回應；address (v.) 處理；(n.) 地址，演說；job seeker (phr.) 求職者；for free (phr.) 免費；Chamber of Commerce (phr.) 商會；coordinator (n.) 籌辦人，協調者；call (n.) 請求，一通電話；unemployment (n.) 失業；in advance (phr.) 事先，提前；conduct (v.) 進行，實施；organize (v.) 安排，組織；business community (phr.) 業界；secure (v.) 獲得；(adj.) 安全的；admit (v.) 准許進入，承認\n文章 2：upcoming (adj.) 即將到來的；coordinate (v.) 協調，協調一致；notify (v.) 通知；involve (v.) 使涉入；acceptable (adj.) 可以接受的；consideration (n.) 考慮；subsidiary (n.) 子公司；(adj.) 隸屬的；go ahead (phr.) 開始進行，走在前面\n文章 3：corporate (adj.) 法人的，公司的；pass (n.) 通行證；(v.) 穿過，通過；confirmation (n.) 確認；permit (v.) 允許；(n.) 許可證；serve (v.) 作為某種用途，服務\n\n**191.** 答案 (C)｜難度：高\nWhat is true about the Aurora Job Fair?\n- (A) It will be focused on jobs in a particular industry.\n- (B) It was initially proposed by the mayor of the city.\n- (C) It will not charge some participants for attending.\n- (D) It is the first of a series of events planned for the year.\n\n> 關於 Aurora 市就業博覽會，何者正確？\n> (A) 將以特定產業的工作為主。\n> (B) 最早是由市長提議的。\n> (C) 不會對某些參加者收費。\n> (D) 這是今年計畫的一系列活動的第一場。\n\n**Not/True True 問題**\n這是需要找到與關鍵字 the Aurora Job Fair 相關的資訊，並且與選項敘述對照的 Not/True 問題，所以要看介紹 Aurora 市就業博覽會的報導（第一篇文章）。(A) 在文中沒有提到。和 (B) 相關的部分是「the fair was organized in response to calls from Mayor Owen Brownstein」，表示就業博覽會是應市長 Owen Brownstein 的要求而籌辦的，但不表示活動一開始是由市長提議的，所以不對。(C) 對應文中的「Job seekers do not need to register in advance and will be admitted for free.」，表示求職者不必登記報名，而且可以免費入場，符合選項敘述，所以 (C) It will not charge some participants for attending 是正確答案。(D) 在文中沒有提到。\n\n**替換表達**\nfor free 免費 → not charge 不收費\n\n**單字** focus on (phr.) 聚焦於，著重於…；initially (adv.) 起初；a series of (phr.) 一系列的\n\n<!-- page 296 -->\n\n**192.** 答案 (A)｜難度：中\nWhy did Mr. Collins write the e-mail?\n- (A) To make a special request for an upcoming event\n- (B) To find out which companies have joined the job fair\n- (C) To ask about prices for corporate participants\n- (D) To recruit volunteers to work at a career fair\n\n> Collins 先生為什麼寫了這封電子郵件？\n> (A) 為了對於即將舉行的活動提出特別要求\n> (B) 為了得知有哪些公司參加了就業博覽會\n> (C) 為了詢問企業參加的費用\n> (D) 為了招募自願在就業博覽會工作的人\n\n**尋找主題／目的 寫文章的理由**\n這是詢問 Collins 先生寫信理由的問題，所以要看 Collins 先生寫的電子郵件（第二篇文章）的內容。第二篇文章中的「I read an article about the upcoming job fair, and my company, Star Mortgage, would like to be involved.」、「Bingham Title ~ is also interested in participating」和「Is it possible for us to have booths located next to each other」提到，Collins 先生讀到關於即將舉行的就業博覽會的報導，而 Star Mortgage 公司和 Bingham Title 公司都有興趣參加，並且詢問兩家公司的攤位是否可以相鄰，所以 (A) To make a special request for an upcoming event 是正確答案。\n\n**單字** find out (phr.) 查明；recruit (v.) 招募；(n.) 新進員工；volunteer (n.) 自願參加者；career fair (phr.) 就業博覽會\n\n**193.** 答案 (B)｜難度：高\nWhat is mentioned about Bingham Title?\n- (A) It operates several branches in Aurora.\n- (B) It is owned by Moore Investments.\n- (C) It is currently expanding its operations.\n- (D) Its manager contacted Mr. Collins.\n\n> 關於 Bingham Title 公司，文中提到什麼？\n> (A) 在 Aurora 市有幾家分公司。\n> (B) 為 Moore Investments 公司所擁有。\n> (C) 正在擴大營運。\n> (D) 公司經理聯絡了 Collins 先生。\n\n**Not/True True 問題**\n這是需要找到與關鍵字 Bingham Title 相關的資訊，並且與選項敘述對照的 Not/True 問題，所以要看提到 Bingham Title 公司的電子郵件（第二篇文章）。(A) 在文中沒有提到。(B) 對應文中的「We are actually subsidiaries of the company Moore Investments.」，表示我們（Star Mortgage 和 Bingham Title 公司）是 Moore Investments 的子公司，符合選項敘述，所以 (B) It is owned by Moore Investments 是正確答案。(C) 和 (D) 在文中沒有提到。\n\n**單字** operation (n.) 營運，運作\n\n<!-- page 297 -->\n\n**194.** 答案 (C)｜難度：最高\nWhat is suggested about Mr. Collins?\n- (A) His company will pick up a promotional banner on the day of the fair.\n- (B) He sent a bill to Ms. Perry for fair participation.\n- (C) His company will set up a booth near Aurora City Arena's entrance.\n- (D) He wrote an article about the upcoming Aurora Job Fair.\n\n> 關於 Collins 先生，文中顯示什麼？\n> (A) 他的公司會在就業博覽會當天去拿宣傳用的布條。\n> (B) 他寄了參加就業博覽會的帳單給 Perry 小姐。\n> (C) 他的公司會在 Arena 市體育場入口附近設置攤位。\n> (D) 他寫了一篇關於即將舉行的 Aurora 市就業博覽會的報導。\n\n**推論 多篇文章綜合題**\n這是必須參考三篇文章內容的多篇文章綜合題。首先看題目關鍵字 Mr. Collins 所寫的信件（第二篇文章）。\n\n第二篇文章中，「Is it possible for us to have booths located next to each other?」和「If this is acceptable, I will ~ register, ~ and notify my colleague at Bingham Title to do the same.」的部分詢問我們（Star Mortgage 和 Bingham Title 公司）的攤位是否可以彼此相鄰，而如果對方接受的話就會進行登記，也會請 Bingham Title 公司去登記，這是第一個線索。但是，從這裡不能確定後來是否已經登記，所以還需要確認表格和報導的內容。第三篇文章（表格）中的「Company: Bingham Title」、「Your table ~ is ~ located near the venue's main entrance.」顯示 Bingham Title 公司已經報名，桌位在會場的主要入口附近，這是第二個線索；第一篇文章（報導）中的「The Aurora Chamber of Commerce will conduct the first Aurora Job Fair ~ at the Aurora City Arena.」表示 Aurora 市就業博覽會在 Aurora 市體育場舉行，這是第三個線索。\n\n綜合「如果攤位可以彼此相鄰的話，Star Mortgage 和 Bingham Title 公司就會登記」、「Bingham Title 公司已經報名，桌位在會場的主要入口附近」和「Aurora 市就業博覽會在 Aurora 市體育場舉行」這三個線索，可以推斷 Collins 先生所屬的 Star Mortgage 公司應該也登記參加了，而且攤位和 Bingham Title 公司同樣在 Aurora 市體育場的入口附近，所以 (C) His company will set up a booth near Aurora City Arena's entrance 是正確答案。\n\n**單字** bill (n.) 帳單；(v.) 開帳單，請款\n\n**195.** 答案 (C)｜難度：高\nWhat is indicated about Ms. Jacobs?\n- (A) She has asked three other staff to help her at the fair.\n- (B) She will be reimbursed by Star Mortgage soon.\n- (C) She paid a reduced rate for a table.\n- (D) She needs to bring proof of identity to the event.\n\n> 關於 Jacobs 小姐，文中提到什麼？\n> (A) 她請 3 位員工在就業博覽會幫忙她。\n> (B) 她很快會獲得 Star Mortgage 給予的費用核銷。\n> (C) 她付的桌位費用有折扣。\n> (D) 她必須帶身分證明到活動現場。\n\n**推論 多篇文章綜合題**\n這是必須參考三篇文章其中兩篇內容的多篇文章綜合題。首先看給題目關鍵字 Ms. Jacobs 的表格（第三篇文章）。\n\n第三篇文章中，「Representative(s): Cora Jacobs」、「Table(s): One / Regular」、「Payment Method: Credit Card ●」、「February 16」的部分顯示代表人 Cora Jacob 一張一般桌位的費用已經在 2 月 16 日確認用信用卡支付，這是第一個線索。但是，這裡沒有提到桌位的費用，所以還需要在第一篇文章（報導）中確認。第一篇文章中的「a regular-sized table at the event will be charged $150」、「those who register before February 28 may reserve a regular table for just $130」提到，一般尺寸桌位的費用是 150 美元，但 2 月 28 日前登記只要 130 美元，這是第二個線索。\n\n綜合「代表人 Cora Jacob 一張一般桌位的費用已經在 2 月 16 日確認用信用卡支付」和「2 月 28 日前登記的費用比較低」這兩個線索，可以推知 Jacob 小姐可以獲得桌位費用的折扣，所以 (C) She paid a reduced rate for a table 是正確答案。\n\n**單字** reimburse (v.) 核銷費用，補償；proof (n.) 證明，證據；identity (n.) 身分\n\n<!-- page 298 -->\n\n### Questions 196-200 refer to the following e-mail, information, and review. 🆕\n196-200 題參照以下電子郵件、資訊及評論。\n\n文章1\n\n> TO: Joel Steinbrenner <j_stein@webbwork.com>\n> FROM: Maria Longoria <mlong@mgcottages.com>\n> SUBJECT: Re: Update on Web site progress\n> DATE: March 20\n> ATTACHMENT: images\n>\n> Hi Joel,\n>\n> Thanks for the update on our Web site. I'm pleased with the layout. I like the photographs of our rooms and facilities, and I think the online slideshow is a good idea. However, [196]I'd like to add pictures to the slideshow that feature our natural surroundings. I was thinking that we can post images of activities like [200]canoeing from the boat dock on Grand Lake and hiking the trails around Lake Granby. I've attached some images that you can use for that. Also, my colleague Alfredo Cantone would like to add a tab on the Web site where he can post weekly menus and list the items available for room service. [197]Once these things have been added, we can probably launch the site, and I will then send you the balance of your payment.\n>\n> Thanks!\n> Maria\n\n**翻譯**\n\n> 收件者：Joel Steinbrenner <j_stein@webbwork.com>\n> 寄件者：Maria Longoria <mlong@mgcottages.com>\n> 主旨：回覆：網站進度的最新情況\n> 日期：3 月 20 日\n> 附件：圖片\n>\n> 嗨 Joel：\n>\n> 謝謝你對我們網站的更新。我對版面配置滿意。我喜歡我們房間和設施的照片，我也覺得線上圖片輪播是個好主意。不過，[196]我想在我們周遭自然環境的圖片輪播增加照片。我想我們可以 po 出活動的照片，像是 [200]從碼頭划獨木舟遊覽 Grand 湖，還有在 Granby 湖周邊的小徑健行等。我附上了一些你可以用的照片。還有，我的同事 Alfredo Cantone 想在網站上增加一個頁籤，讓他可以 po 出每週菜單，並且列出客房服務提供的項目。[197]加上這些東西之後，我們應該就可以讓網站上線了，我到時候會把還沒繳清的款項給你。\n>\n> 謝謝！\n> Maria\n\n文章2\n\n> **Morning Glory Guest Cottages**\n>\n> Home | Slideshow | Facilities | Rates | **Dining** | Contact Us / Reservations\n>\n> Open from 8:30 a.m. to 9:00 p.m. and located next to our compound's reception building is [199-C]the Lucky Lucy Restaurant run by Chef Alfredo Cantone.\n>\n> To see the weekly menus for breakfast, lunch, and dinner, click here. Meal service times are listed, and updates are posted every Sunday at 7:30 a.m.\n>\n> Lucky Lucy Restaurant is also pleased to offer a limited menu of items that can be delivered to your cottage. Click here to find out what is available. Room service is offered from 7:00 a.m. through 10:00 p.m. on weekdays, and 8:00 a.m. through 11:00 p.m. on weekends.\n\n**翻譯**\n\n> **Morning Glory 鄉間別墅民宿**\n>\n> 首頁 | 圖片輪播 | 設施 | 評價 | **用餐** | 聯絡我們／預約\n>\n> 從早上 8:30 營業至晚間 9:00，位於我們設施場地旁的接待會館是 [199-C]由主廚 Alfredo Cantone 經營的 Lucky Lucy 餐廳。\n>\n> 點擊此處觀看每週早餐、午餐、晚餐菜單。供餐時間如上所示，每週日早上 7:30 發布最新消息。\n>\n> Lucky Lucy 餐廳也很樂意提供可以送到您別墅的限定菜單項目。點擊此處查看供應項目。客房服務於平日早上 7:00 至晚間 10:00、週末早上 8:00 至晚間 11:00 提供。\n\n文章3\n\n> Morning Glory Guest Cottages, Colorado\n> Guest review　by: Jamie Wilder (jwilder@nwpostal.com)\n> ★★★★☆\n>\n> Morning Glory Guest Cottages is perfect for those wishing to escape into nature. [198-B]It's just two hours from Denver by car and is located next to a beautiful mountain lake. [200]My husband Keith and I stayed for three nights and\n\n**翻譯**\n\n> Morning Glory 鄉間別墅民宿，科羅拉多州\n> 住客評論　作者：Jamie Wilder (jwilder@nwpostal.com)\n> ★★★★☆\n>\n> Morning Glory 鄉間別墅民宿非常適合想要投奔自然的人。[198-B]它距離丹佛市\n\n<!-- page 299 -->\n\n> hiked every day at nearby lakes and along the Colorado River. We were most impressed by a walk along Shadow Mountain Lake. The cottages themselves are rustic but comfortable.\n>\n> [200]Keith liked paddling around in a canoe, and [198-C]I enjoyed mingling with other guests at the weekly bonfire party. [199-C]I would also like to compliment the Lucky Lucy Restaurant for their incredible meals, most notably the Greek dishes that are the chef's specialty. My one complaint is that the room service menu offered only simple sandwiches, snacks, and beverages.\n\n**翻譯**\n\n> 有 2 小時的車程，而且座落在美麗的山間湖泊旁。[200]我和我先生 Keith 住了 3 晚，我們每天都在附近的湖泊和 Colorado 河邊健行。我們印象最深刻的是沿著 Shadow Mountain 湖邊散步。別墅本身是鄉下質樸的風格，但很舒適。\n>\n> [200]Keith 喜歡划獨木舟遊覽，而 [198-C]我喜歡在每週的營火派對和其他住客交流。[199-C]我也想稱讚 Lucky Lucy 餐廳很棒的餐點，尤其是主廚招牌的希臘菜。我不滿意的是客房服務菜單只提供簡單的三明治、點心和飲料。\n\n**單字**\n文章 1：progress (n.) 進行，進度；surrounding (n.) 周遭環境；(adj.) 周圍的；dock (n.) 碼頭；balance (n.) 結餘金額，平衡；attachment (n.) 附件，附加；post (n.) 張貼，發布；(n.) 郵件，職位；list (v.) 列出；(n.) 列表；feature (v.) 作為特徵、特色；canoeing (n.) 划獨木舟；launch (v.) 發動，開始\n文章 2：cottage (n.) 鄉間別墅；compound (n.) 圍牆圍起的設施區域，化合物；(adj.) 複合的\n文章 3：rustic (adj.) 鄉村式的，質樸的；bonfire (n.) 營火；incredible (adj.) 非常美妙的，難以置信的；paddle (v.) 划槳；(n.) 槳；compliment (v.) 稱讚；(n.) 稱讚；notably (adv.) 尤其，顯著地；mingle (v.) 交往，往來，混合；specialty (n.) 專長，特產\n\n**196.** 答案 (D)｜難度：低\nWhat has Mr. Steinbrenner been requested to do?\n- (A) Find a photographer to take pictures of nearby lakes\n- (B) Put together a slideshow of rooms and facilities\n- (C) Change a room service menu\n- (D) Post more images of scenic local areas\n\n> Steinbrenner 先生被要求做什麼？\n> (A) 找攝影師拍附近湖泊的照片\n> (B) 製作房間與設施的圖片輪播\n> (C) 改變客房服務的菜單\n> (D) 發布更多當地風景區的照片\n\n**wh- 問題 What**\n這是問 Steinbrenner 先生被要求做什麼（What）的 wh- 問題，所以要看寄給題目關鍵字 Mr. Steinbrenner 的電子郵件（第一篇文章）。「I'd like to add pictures to the slideshow that feature our natural surroundings」的部分提到，我（Longoria 小姐）想要在周遭自然環境的圖片輪播裡增加照片，也就是要求收件者 Steinbrenner 先生發布更多當地自然風景的照片，所以 (D) Post more images of scenic local areas 是正確答案。\n\n**替換表達**\nadd pictures 增加照片 → Post more images 發布更多圖片\nnatural surroundings 周遭自然環境 → scenic local areas 當地風景區域\n\n**單字** put together (phr.) 組成，組合；scenic (adj.) 風景好的，舞台布景的\n\n<!-- page 300 -->\n\n**197.** 答案 (A)｜難度：低\nWhat can be inferred about Ms. Longoria?\n- (A) She has not fully paid Mr. Steinbrenner for his services.\n- (B) She would like Mr. Steinbrenner to give a presentation at her office.\n- (C) She wants restaurant menus to be updated on a daily basis.\n- (D) She requested that a payment option be added to an online page.\n\n> 關於 Longoria 小姐，可以推知什麼？\n> (A) 她還沒付清給 Steinbrenner 先生的服務費用。\n> (B) 她希望 Steinbrenner 先生在她的辦公室進行簡報。\n> (C) 她希望餐廳菜單每天更新。\n> (D) 她要求在網路頁面增加一個付款選項。\n\n**推論 細節資訊**\n這是關於 Longoria 小姐的推論問題，所以要從她寫的電子郵件（第一篇文章）中找出相關的內容。電子郵件中的「Once these things have been added, we can probably launch the site, and I will then send you the balance of your payment.」提到，加上她所要求的東西之後，就可以讓網站上線，而且會付還沒繳清的款項給收件者，所以可以推斷 Longoria 小姐還沒付清給 Steinbrenner 先生的服務費用，(A) She has not fully paid Mr. Steinbrenner for his services 是正確答案。\n\n**單字** service (n.) 服務；on a daily basis (phr.) 每天\n\n**198.** 答案 (C)｜難度：中\nWhat does Ms. Wilder indicate about Morning Glory Guest Cottages?\n- (A) It offers spacious accommodations.\n- (B) It is situated on the banks of a river.\n- (C) It holds a weekly social event.\n- (D) It is easily accessible by bus.\n\n> 關於 Morning Glory 鄉間別墅民宿，Wilder 小姐提到什麼？\n> (A) 提供寬敞的住宿設施。\n> (B) 位於河岸。\n> (C) 舉辦每週進行的社交活動。\n> (D) 可以搭公車輕易到達。\n\n**Not/True True 問題**\n這是需要找到與關鍵字 Ms. Wilder indicate about Morning Glory Guest Cottages 相關的資訊，並且與選項敘述對照的 Not/True 問題，所以要看 Wilder 小姐所寫的評論（第三篇文章）。(A) 在文中沒有提到。和 (B) 相關的部分是「It's ~ located next to a beautiful mountain lake.」，Morning Glory 鄉間別墅民宿位於山中湖泊邊，不符合選項敘述。(C) 對應文中的「I enjoyed mingling with other guests at the weekly bonfire party」，表示 Wilder 小姐很喜歡在每週舉行的營火派對和其他住客交流，符合選項敘述，所以 (C) It holds a weekly social event 是正確答案。(D) 在文章中沒有提到。\n\n**替換表達**\nthe weekly ~ party 每週舉行的派對 → a weekly social event 每週舉行的社交活動\n\n**單字** spacious (adj.) 寬敞的；accommodation (n.) 住宿設施；bank (n.) 岸，堆積；accessible (adj.) 容易到達的，可接近的\n\n<!-- page 301 -->\n\n**199.** 答案 (C)｜難度：高\nWhat is true about Alfredo Cantone?\n- (A) He accepts online dining reservations.\n- (B) He recently used room service from a restaurant.\n- (C) He is a chef specializing in the preparation of Greek cuisine.\n- (D) He posts reviews from diners on a resort's Web site.\n\n> 關於 Alfredo Cantone，何者正確？\n> (A) 他接受 // 答案線索標記，例如 [147]、[149-D]、[162/163]、[159-B/160-A/D]
const MARK = /\[(\d{3}(?:-[A-D](?:\/[A-D])*)?(?:\/\d{3}(?:-[A-D](?:\/[A-D])*)?)*)\]\s?/g;
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function inline(s) {
  s = esc(s).replace(/\\\*/g, "\u0001");
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>");
  s = s.replace(/\u0001/g, "*").replace(/\\([\[\]_#-])/g, "$1");
  return s.replace(MARK, (_, m) => `<span class="mk">${m}</span>`);
}
function md(text) {
  const lines = text.split("\n");
  let out = "", i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    if (l.startsWith(">")) {
      const buf = [];
      while (i < lines.length && lines[i].startsWith(">")) { buf.push(lines[i].replace(/^> ?/, "")); i++; }
      out += "<blockquote>" + md(buf.join("\n")) + "</blockquote>"; continue;
    }
    if (l.trim().startsWith("|")) {
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith("|")) { rows.push(lines[i].trim()); i++; }
      const cells = r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      let html = "<table>";
      rows.forEach((r, k) => {
        if (/^\|[\s\-:|]+\|$/.test(r)) return;
        const cs = cells(r);
        if (k === 0 && cs.every(c => !c)) return;
        const tag = k === 0 && rows[1] && /^\|[\s\-:|]+\|$/.test(rows[1]) ? "th" : "td";
        html += "<tr>" + cs.map(c => `<${tag}>${inline(c)}</${tag}>`).join("") + "</tr>";
      });
      out += html + "</table>"; continue;
    }
    if (/^- /.test(l)) {
      out += "<ul>";
      while (i < lines.length && /^- /.test(lines[i])) { out += "<li>" + inline(lines[i].slice(2)) + "</li>"; i++; }
      out += "</ul>"; continue;
    }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !lines[i].startsWith(">") && !/^- /.test(lines[i]) && !lines[i].trim().startsWith("|")) { buf.push(inline(lines[i])); i++; }
    out += "<p>" + buf.join("<br>") + "</p>";
  }
  return out;
}

const Q_HEAD = /^\*\*(\d{3})\.\*\*\s*(🆕)?\s*(?:答案 \(([A-D])\)(?:｜難度：([^\s🆕]+))?)?\s*(🆕)?/;
function parseQBlock(lines) {
  const m = lines[0].match(Q_HEAD);
  const q = { num: m[1], isNew: !!(m[2] || m[5]), answer: m[3] || null, level: m[4] || "", text: [], options: [], rest: [] };
  let stage = "text";
  for (const l of lines.slice(1)) {
    const o = l.match(/^- \(([A-D])\)\s?(.*)$/);
    if (stage !== "rest" && o) { stage = "opts"; q.options.push({ key: o[1], text: o[2] }); continue; }
    if (stage === "opts") stage = "rest";
    (stage === "text" ? q.text : q.rest).push(l);
  }
  q.body = lines.slice(1).join("\n").trim();
  q.text = q.text.join("\n").trim();
  q.rest = q.rest.join("\n").trim();
  return q;
}
function splitBlocks(lines) {
  const pre = [], blocks = [];
  for (const l of lines) {
    if (Q_HEAD.test(l)) blocks.push([l]);
    else if (blocks.length) blocks[blocks.length - 1].push(l);
    else pre.push(l);
  }
  return { pre, blocks: blocks.map(parseQBlock) };
}

  const labels = chunks.filter(c => c.type === "label").length;
  const lastLabel = chunks.map(c => c.type).lastIndexOf("label");
  const cands = chunks.map((c, k) => ({ c, k }))
    .filter(({ c, k }) => c.type === "en" && k > lastLabel && k > 0 && chunks[k - 1].type === "trans" && chunks.slice(0, k).some(x => x.type === "en"));
  const need = expected - Math.max(labels, 1);
  if (need > 0) cands.sort((a, b) => b.c.text.length - a.c.text.length).slice(0, need).forEach(({ c }) => c.split = true);
  // 第三步：組合
  const passages = [], trans = [];
  let cur = null;
  for (const c of chunks) {
    if (c.type === "label") { cur = { label: c.text, lines: [] }; passages.push(cur); trans.push(`**${c.text}**`); }
    else if (c.type === "trans") trans.push(c.text);
    else {
      if (!cur || c.split) { cur = { label: "", lines: [] }; passages.push(cur); }
      cur.lines.push(c.text);
    }
  }
  if (passages.length > 1) passages.forEach((p, k) => { if (!p.label) p.label = "文章 " + (k + 1); });
  return { sub, passages: passages.filter(p => p.lines.length), trans: trans.join("\n\n"), vocab: vocab.join("\n") };
}

const raw = SOURCE.split("\n").filter(l => !/^<!-- page/.test(l.trim()));
const startIdx = raw.findIndex(l => /^# TEST/.test(l));
const title = (raw[startIdx] || "# TOEIC").replace(/^#\s*/, "");
const intros = {};
SOURCE.split("\n").forEach((l, k, arr) => {
  const m = l.match(/\[PART (\d)：(.+?)\]/);
  if (m) intros[m[1]] = { name: m[2], text: (arr[k + 1] || "").replace(/^\s*概念：/, "") };
});

const parts = {};
let part = null, section = null;
for (const l of raw.slice(startIdx)) {
  const pm = l.match(/^## PART (\d)/);
  if (pm) { part = pm[1]; parts[part] = []; section = null; continue; }
  if (!part) continue;
  const sm = l.match(/^### (.+)$/);
  if (sm) { section = { heading: sm[1].replace(/\s*🆕\s*$/, ""), isNew: /🆕/.test(sm[1]), lines: [] }; parts[part].push(section); continue; }
  if (!section) { section = { heading: null, lines: [] }; parts[part].push(section); }
  section.lines.push(l);
}

// 統一成「題組」：Part 5 每題一組，Part 6/7 每篇文章一組
const sets = [];
for (const p of Object.keys(parts)) {
  for (const sec of parts[p]) {
    const { pre, blocks } = splitBlocks(sec.lines);
    if (!sec.heading) {
      blocks.forEach(q => sets.push({ id: "q" + q.num, part: p, heading: null, questions: [q] }));
      continue;
    }
    const first = +(blocks[0] && blocks[0].num);
    const info = parsePreamble(pre, first >= 186 ? 3 : first >= 176 ? 2 : 1); // 多益 176-185 雙篇、186-200 三篇
    const byNum = {};
    for (const b of blocks) {
      const q = byNum[b.num] || (byNum[b.num] = { num: b.num, isNew: false, options: [], text: "", rest: "" });
      q.isNew = q.isNew || b.isNew;
      if (b.answer && q.options.length) { q.answer = b.answer; q.level = b.level; q.rest = b.body; } // Part 6：選項在前面，這塊全是解析
      else if (b.answer) { q.answer = b.answer; q.level = b.level; q.rest = b.rest; q.text = b.text; q.options = b.options; }
      else { if (b.options.length) q.options = b.options; if (b.rest) info.vocab += (info.vocab ? "\n\n" : "") + b.rest; }
    }
    const questions = Object.values(byNum).sort((a, b) => a.num - b.num);
    sets.push({ id: "s" + questions[0].num, part: p, heading: sec.heading, isNew: sec.isNew, ...info, questions });
  }
}

/* ---------- 作答紀錄 ---------- */
let state = {};
try { state = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) {}
const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} };
const st = id => state[id] || (state[id] = { picks: {}, done: false });

/* ---------- 畫面 ---------- */
const $ = s => document.querySelector(s);
document.title = title + " 閱讀練習";
$("#title").textContent = title + " 閱讀練習";
const partKeys = Object.keys(parts);
let curPart = partKeys[0];
try { const saved = localStorage.getItem(STORE_KEY + "-tab"); if (partKeys.includes(saved)) curPart = saved; } catch (e) {}

function renderTabs() {
  $("#tabs").innerHTML = partKeys.map(p =>
    `<button data-p="${p}" class="${p === curPart ? "active" : ""}">Part ${p}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    curPart = b.dataset.p;
    try { localStorage.setItem(STORE_KEY + "-tab", curPart); } catch (e) {}
    renderTabs(); renderMain(); scrollTo({ top: 0 });
  });
}

function renderScore() {
  let right = 0, done = 0, total = 0;
  for (const s of sets) {
    total += s.questions.length;
    const x = state[s.id];
    if (x && x.done) s.questions.forEach(q => { done++; if (x.picks[q.num] === q.answer) right++; });
  }
  $("#score").innerHTML = `已作答 <b>${done}</b> / ${total} 題，答對 <b>${right}</b> 題` + (done ? `（${Math.round(right / done * 100)}%）` : "");
}

function questionHTML(set, q) {
  const x = st(set.id), pick = x.picks[q.num];
  const opts = q.options.map(o => {
    let cls = "opt", tag = "";
    if (x.done) {
      if (o.key === q.answer) { cls += " right"; tag = "正解"; }
      else if (o.key === pick) { cls += " wrong"; tag = "你的答案"; }
      if (o.key === q.answer && o.key === pick) tag = "✓ 答對";
    } else if (o.key === pick) cls += " sel";
    return `<button class="${cls}" data-set="${set.id}" data-q="${q.num}" data-k="${o.key}" ${x.done ? "disabled" : ""}>
      <span class="l">(${o.key})</span><span>${inline(o.text)}</span>${tag ? `<span class="tag">${tag}</span>` : ""}</button>`;
  }).join("");
  let after = "";
  if (x.done) {
    const ok = pick === q.answer;
    after = `<div class="verdict ${ok ? "ok" : "bad"}">${ok ? "答對了" : pick ? `答錯了，你選 (${pick})` : "未作答"}・正確答案 (${q.answer})${q.level && q.level !== "?" ? `・難度：${q.level}` : ""}</div>
      <div class="explain">${md(q.rest)}</div>`;
  }
  return `<div class="q"><div class="qtext"><span class="qnum">${q.num}.</span>${q.isNew ? '<span class="new">新題型</span> ' : ""}${q.text ? md(q.text).replace(/^<p>|<\/p>$/g, "") : ""}</div>
    <div class="opts">${opts}</div>${after}</div>`;
}

function setHTML(set) {
  const x = st(set.id);
  const unanswered = set.questions.filter(q => !x.picks[q.num]).length;
  let passages = "";
  if (set.passages && set.passages.length) {
    passages = `<div class="passages">` + set.passages.map(p => {
      const body = p.lines.join("\n\n");
      return (p.label ? `<div class="plabel">${p.label}</div>` : "") + `<div class="passage">${md(x.done ? body : stripMarks(body))}</div>`;
    }).join("") + `</div>`;
  }
  const reveal = x.done && (set.trans || set.vocab)
    ? `<details class="reveal" open><summary>文章翻譯與單字</summary>${md(set.trans)}${md(set.vocab)}</details>` : "";
  const head = set.heading
    ? `<p class="set-title">${esc(set.heading)}${set.isNew ? ' <span class="new">新題型</span>' : ""}</p><p class="set-sub">${esc(set.sub || "")}</p>` : "";
  const btnLabel = set.heading ? "送出本題組" : "送出";
  const actions = x.done
    ? `<div class="actions"><span class="result">本組答對 ${set.questions.filter(q => x.picks[q.num] === q.answer).length} / ${set.questions.length}</span>
       <button class="btn" data-redo="${set.id}">重做這組</button></div>`
    : `<div class="actions"><button class="btn primary" data-submit="${set.id}" ${unanswered ? "disabled" : ""}>${btnLabel}</button>
       ${unanswered && set.questions.length > 1 ? `<span class="hint">還有 ${unanswered} 題沒選</span>` : ""}</div>`;
  return `<section class="card" id="${set.id}">${head}
    <div class="set-body ${passages ? "two" : ""}">${passages}<div>${set.questions.map(q => questionHTML(set, q)).join("")}${actions}</div></div>
    ${reveal}</section>`;
}

function renderSet(id) {
  const set = sets.find(s => s.id === id);
  const el = document.getElementById(id);
  el.outerHTML = setHTML(set);
  renderScore();
}

function renderMain() {
  const intro = intros[curPart];
  $("#main").innerHTML = (intro ? `<p class="part-intro"><b>Part ${curPart}：${intro.name}</b>　${esc(intro.text)}</p>` : "")
    + sets.filter(s => s.part === curPart).map(setHTML).join("");
  renderScore();
}

$("#main").addEventListener("click", e => {
  const opt = e.target.closest(".opt");
  if (opt && !opt.disabled) {
    st(opt.dataset.set).picks[opt.dataset.q] = opt.dataset.k; save(); renderSet(opt.dataset.set); return;
  }
  const sub = e.target.closest("[data-submit]");
  if (sub && !sub.disabled) { st(sub.dataset.submit).done = true; save(); renderSet(sub.dataset.submit); return; }
  const redo = e.target.closest("[data-redo]");
  if (redo) { state[redo.dataset.redo] = { picks: {}, done: false }; save(); renderSet(redo.dataset.redo); }
});
$("#resetAll").onclick = () => {
  if (!confirm("確定要清除這份考卷的所有作答紀錄？")) return;
  state = {}; save(); renderMain();
};

renderTabs();
renderMain();
</script>
</body>
</html>
