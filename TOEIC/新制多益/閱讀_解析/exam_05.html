<script>
const SOURCE = "# 目錄\n\n1. [PART 5：單句文法與詞彙](#part-5)\n   概念：涵蓋詞性判斷（名詞、形容詞、副詞的位置與詞彙選擇）、動詞相關考點（單複數、時態、語態、被動態、動詞詞彙與「be + 形容詞」慣用語）、代名詞（反身代名詞、不定代名詞）、關聯詞（關係代名詞、對等連接詞、副詞子句連接詞）、介系詞固定搭配，以及分詞（現在分詞 vs. 過去分詞）、to 不定詞、動名詞慣用表達、最高級等其他文法重點。\n\n2. [PART 6：段落填空](#part-6)\n   概念：四篇短文分別是公告、報導、信件、資訊說明，每篇挖 4 個空格。考點大致分兩類：一類是單句層級的文法詞彙（名詞/形容詞/副詞詞彙與位置、介系詞、連接副詞、動詞時態如現在完成式/未來式），另一類是跨句題型「選出空格中正確的句子」，要讀懂上下文邏輯才能選出通順銜接的句子。\n   1. [Questions 131-134 refer to the following announcement.](#questions-131-134-refer-to-the-following-announcement-)\n      概念：社區大樓公告，說明週一會停電維修電路與配電箱。四題考名詞詞性、動詞詞彙、一題選出語意通順的句子，以及連接副詞的用法。\n   2. [Questions 135-138 refer to the following article.](#questions-135-138-refer-to-the-following-article-)\n      概念：報導 Parnopius 美術館整修後重新開幕的消息。四題考形容詞詞彙、動詞詞彙、一題選出正確句子，以及未來式動詞的判斷。\n   3. [Questions 139-142 refer to the following letter.](#questions-139-142-refer-to-the-following-letter-)\n      概念：公司回覆客戶 Charles Nave 關於老客戶折扣的詢問信。四題考副詞詞彙、一題選出正確句子、現在完成式動詞，以及名詞詞彙。\n   4. [Questions 143-146 refer to the following information.](#questions-143-146-refer-to-the-following-information-)\n      概念：Robinson 圖書館關於到期提醒與逾期規定的說明。四題考介系詞選擇、連接副詞、名詞詞彙，以及一題選出正確句子。\n\n3. [PART 7：閱讀理解](#part-7)\n   概念：15 組單篇、雙篇、三篇閱讀文章，文體涵蓋邀請函、備忘錄、簡訊/線上對話、報導、電子郵件、信件、表格等。主要題型有：尋找主題／目的、wh- 問題（What/Why/How）、Not/True 判斷、推論題、掌握意圖、找出句子位置（句子插入）、同義詞或替換表達，以及雙篇/三篇的「多篇文章綜合題」，越到後面的多篇文章組合，跨文章比對的推論題和綜合題比重越高。\n   1. [Questions 147-148 refer to the following invitation.](#questions-147-148-refer-to-the-following-invitation)\n      概念：邀請函，邀請大家參加 Almeida 教授主講的「強化區域關係」座談會。兩題都考 Not/True（一題 True、一題 Not），要逐一比對選項與文章細節。\n   2. [Questions 149-150 refer to the following memo.](#questions-149-150-refer-to-the-following-memo)\n      概念：公司內部備忘錄，宣布依銷售量分級發放獎金的新制度。考主旨題（備忘錄目的）和 Not/True（Not 題型），要抓大意並用排除法找出文中未提及的選項。\n   3. [Questions 151-152 refer to the following text message chain.](#questions-151-152-refer-to-the-following-text-message-chain)\n      概念：房仲與房東討論今天能否帶客戶看公寓的簡訊對話。考推論題和「掌握意圖」題，要理解對話中某句話背後的真正意思，並搭配同義詞替換。\n   4. [Questions 153-155 refer to the following article.](#questions-153-155-refer-to-the-following-article)\n      概念：報導介紹 Hartford 年度藝術拍賣會 25 週年，展出三位畫家的作品。考兩題 Not/True（一 True 一 Not）加一題推論題，選項常用同義詞改寫原文細節。\n   5. [Questions 156-157 refer to the following e-mail.](#questions-156-157-refer-to-the-following-e-mail)\n      概念：公司內部信件，提醒廣告部同仁下週新品發表會的行程安排。考推論題和 Not/True（True 題型），需對照行程表細節作答。\n   6. [Questions 158-160 refer to the following e-mail.](#questions-158-160-refer-to-the-following-e-mail)\n      概念：Kimberley 寫信推薦自己旗下的行銷經理 Anna Harwood 去應徵新度假村的活動經理職缺。考 wh- 問題（What）、Not/True（True），以及「找出句子位置」的句子插入題。\n   7. [Questions 161-163 refer to the following article.](#questions-161-163-refer-to-the-following-article)\n      概念：商業週刊報導，探討企業導入永續環保做法值不值得的正反意見。考主旨題（文章目的）、Not/True（Not）與 wh- 問題（What），要區分文中不同專家的立場。\n   8. [Questions 164-167 refer to the following online chat discussion.](#questions-164-167-refer-to-the-following-online-chat-discussion-)\n      概念：團隊在線上聊天群組討論明天產品發表會的場地佈置進度。考「掌握意圖」題、wh- 問題（What）、Not/True（Not）與推論題，同義詞替換也很多，要留意口語對話中的間接訊息。\n   9. [Questions 168-171 refer to the following letter.](#questions-168-171-refer-to-the-following-letter)\n      概念：電信公司提醒訂戶 Cable Plus 方案的合約條款與付款義務的信件。考主旨題（寫信理由）、Not/True（True）、wh- 問題（Why）與句子插入題。\n   10. [Questions 172-175 refer to the following article.](#questions-172-175-refer-to-the-following-article)\n       概念：報導介紹科幻經典電影《Outer Reaches》40 週年在倫敦重映，回顧電影從票房平平到成為經典的過程。考主旨題（文章目的）、Not/True（True）、wh- 問題（How）與同義詞題。\n   11. [Questions 176-180 refer to the following e-mail and form.](#questions-176-180-refer-to-the-following-e-mail-and-form)\n       概念：雙篇文章，第一篇是寵物用品電商 Furry Friends 的出貨通知信（含訂單明細），第二篇為相關表格。考 wh- 問題（How、Why）、Not/True（Not）、推論題，其中一題需跨兩篇文章比對的多篇文章綜合題。\n   12. [Questions 181-185 refer to the following form and e-mail.](#questions-181-185-refer-to-the-following-form-and-e-mail)\n       概念：雙篇文章，第一篇是 Burlington Towers 大樓管理費繳費通知表格，列出租戶費用明細；第二篇為相關電子郵件。考推論題、wh- 問題（What）、主旨題（寫信理由）與多篇文章綜合推論題，需同時參照表格數字與信件內容。\n   13. [Questions 186-190 refer to the following e-mail, schedule, and article.](#questions-186-190-refer-to-the-following-e-mail-schedule-and-article-)\n       概念：三篇文章，第一篇是活動當天的緊急通知信，說明講者班機延誤、流程要調整，搭配時間表與報導。考 wh- 問題（What）、多篇文章綜合推論題（兩題）、同義詞題與 Not/True（True），需交叉對照三篇文章的時間與內容變動。\n   14. [Questions 191-195 refer to the following article, e-mail, and form.](#questions-191-195-refer-to-the-following-article-e-mail-and-form-)\n       概念：三篇文章，第一篇報導介紹 Aurora 市首屆就業博覽會的資訊與攤位收費，搭配報名相關的電子郵件與表格。考 Not/True（兩題 True）、主旨題（寫文章的理由）與多篇文章綜合推論題（兩題），常需核對報導中的日期/價格與表格或信件內容是否一致。\n   15. [Questions 196-200 refer to the following e-mail, information, and review.](#questions-196-200-refer-to-the-following-e-mail-information-and-review-)\n       概念：三篇文章，第一篇是度假小屋業主寫給網頁設計師的信，討論官網要新增的風景照片與客房服務選單，搭配一份資訊頁與一則顧客評論。考 wh- 問題（含跨文章題）、推論題、Not/True（含跨文章綜合題）與大量同義詞替換，是全份試卷中多篇文章綜合題最密集的一組。\n\n-----------------------------------------------------------\n\n<!-- page 243 -->\n\n# TEST 05\nPart 5 翻譯・解說\nPart 6 翻譯・解說 🆕\nPart 7 翻譯・解說 🆕\n\n<!-- page 244 -->\n\n## PART 5\n\n**101.** 答案 (B)｜難度：低\nA lecturer with over 10 year's experience in information technology was the ______ for the seminar.\n- (A) instruct\n- (B) instructor\n- (C) instructive\n- (D) instruction\n\n> 一位擁有超過十年資訊科技經驗的講者是那場研討會的講師。\n\n**〔名詞位置〕人物名詞 vs. 事物/抽象名詞**\n能放在定冠詞（the）和介系詞（for）之間的是名詞，所以名詞 (B) 和 (D) 是可能的答案。因為要表示「擁有超過十年資訊科技經驗的講者是那場研討會的講師」的意思，所以人物名詞 (B) instructor（講師）是正確答案。如果使用事物／抽象名詞 (D) instruction（教導，指示），意思會變成「擁有超過十年經驗的講者是[?]教導／指示」，所以不對。動詞 (A) 和形容詞 (C) 不能用在名詞的位置。\n\n**單字** instruct (v.) 指示，教導；instructive (adj.) 教導的，有教育意義的\n\n**102.** 答案 (A)｜難度：低\nThe Greenville branch of Clockwork will be closed for its annual inventory on Monday, ______ customers are asked to visit nearby locations instead.\n- (A) so\n- (B) whereas\n- (C) or\n- (D) even\n\n> Clockwork 的 Greenville 分店將於週一暫停營業，進行年度盤點，所以請顧客改至附近其他據點。\n\n**對等連接詞**\n子句（The Greenville branch ~ on Monday）和子句（customers ~ instead）必須以連接詞連接，所以對等連接詞 (A) 和 (C)、副詞子句連接詞 (B) 是可能的答案。因為要表示「Greenville 分店將暫停營業，所以請顧客到附近的據點」的意思，所以表示因果關係的對等連接詞 (A) so（所以）是正確答案。(B) whereas「然而…」表示轉折，(C) or「或者，否則」表示兩者擇一，與文意不符。(D) even（甚至，就連；甚至更[?]）不能用來連接子句。另外，對等連接詞 so 只能連接子句和子句，不能連接單字或片語。\n\n**單字** close (v.) 關閉，使不營業；inventory (n.) 庫存，庫存盤點；nearby (adj.) 附近的；(adv.) 在附近\n\n**103.** 答案 (D)｜難度：中\nSpart-Gyms is advertising on television to ensure that the grand opening of its new athletics facility is widely ______.\n- (A) publicity\n- (B) publicizing\n- (C) public\n- (D) publicized\n\n> Spart-Gyms 正在打電視廣告，以確保它新的運動設施的開幕獲得廣大宣傳。\n\n**〔可以接在 be 動詞後的成分〕被動態（be + p.p.）**\n因為空格在 be 動詞（is）後面，所以能用在 be 動詞後，而且被副詞（widely）修飾的 -ing 形 (B)、形容詞 (C)、p.p. 形 (D) 是可能的答案。publicize（宣傳）是及物動詞，而空格後面沒有受詞，且文意是「新運動設施的開幕獲得廣大宣傳」，所以能和 be 動詞（is）形成被動態的 p.p. 形 (D) publicized 是正確答案。-ing 形 (B) 和空格前的 be 動詞（is）連用時，會形成主動態進行式，後面必須接受詞。形容詞 (C) 會形成「新運動設施的開幕廣泛地公共／公眾」這種不恰當的意思。名詞 (A) 雖然可以接在 be 動詞後面，但不能被副詞修飾。\n\n**單字** ensure (v.) 確保，務必做到…；athletics (n.) 體育運動；widely (adv.) 寬廣地，廣泛地；publicity (n.) 宣傳，媒體的[?]\n\n<!-- page 245 -->\n\n**104.** 答案 (B)\nAfter the marketing convention in Seychelles concludes, Mr. Stevens' staff is ______ to go on a weeklong vacation.\n- (A) like\n- (B) likely\n- (C) liked\n- (D) liking\n\n> 在塞席爾的行銷大會結束後，Stevens 先生的員工很可能會放一個禮拜的假。\n\n**「be + 形容詞」的慣用語**\n文意是「Stevens 先生的員工很可能會休假」，所以能和空格前的 be 動詞（is）、空格後的 to 形成 be likely to（很可能會做…）的形容詞 (B) likely（很可能的）是正確答案。動詞原形 (A) 不能接在 be 動詞後面。如果用動詞或分詞 (C) 的話，可以形成被動態「be 動詞（is）+ p.p.」，但會變成「Stevens 先生的員工被喜歡」這種不恰當的意思。-ing 形 (D) 可以形成進行式「be 動詞（is）+ -ing」，但 like（喜歡）等表示感情的動詞不能使用現在進行式。\n\n**單字** convention (n.) 會議，大會，慣例；conclude (v.) 結束，終了；weeklong (adj.) 長達一週的\n\n**105.** 答案 (A)\nThe Maritime Museum is requesting donations from local businesses to ______ an upcoming series of educational lectures on regional history.\n- (A) host\n- (B) revise\n- (C) locate\n- (D) remind\n\n> 海事博物館正在徵求當地企業的捐款，以主辦未來一系列關於地區歷史的教育講座。\n\n**動詞詞彙**\n文意是「為了舉辦教育講座而要求當地企業的捐款」，所以 (A) host（舉辦）是正確答案。(B) revise 表示「修訂，變更」，(C) locate 表示「找出…的所在位置」，(D) remind 表示「提醒」。\n\n**單字** maritime (adj.) 海事的，海洋的；upcoming (adj.) 即將到來的；educational (adj.) 教育的；regional (adj.) 地區的，地方的\n\n**106.** 答案 (C)\nImprovements to the subway system and the construction of bicycle lanes ______ city residents to reduce their reliance on cars in recent years.\n- (A) will allow\n- (B) is allowing\n- (C) have allowed\n- (D) to allow\n\n> 最近幾年，地鐵系統的改善和自行車道的建設使城市居民能夠減少對汽車的依賴。\n\n**〔動詞位置〕動詞的單複數、時態、語態要正確**\n句中缺少動詞，所以動詞 (A)、(B)、(C) 是可能的答案。句子的主詞（Improvements to the subway system and the construction of bicycle lanes）是複數，而且有和現在完成式連用的詞語（in recent years），所以現在完成式的複數形 (C) have allowed 是正確答案。未來式 (A) 表示未來發生的事、對未來狀況的推測或意向。現在進行式的單數形 (B) 要和單數主詞一起使用。to 不定詞 (D) 不能用在動詞的位置。\n\n**單字** improvement (n.) 改善，增進；construction (n.) 建設，施工；lane (n.) 小路，車道；reliance (n.) 依賴，依靠\n\n**107.** 答案 (D)\nFree copies of Richard Lucas's new book, *Lens Explorer*, will be handed out to guests ______ his photo exhibit at El Patio Museum on Monday.\n- (A) toward\n- (B) between\n- (C) since\n- (D) during\n\n> Richard Lucas 的新書《Lens Explorer》將會分送給星期一出席他在 El Patio 博物館的攝影展的來賓。\n\n**選擇介系詞** 期間\n要表達的意思是「新書會在攝影展中發放」，所以表示期間的介系詞 (D) during（在…的期間）是正確答案。(A) toward「往…」表示方向，(B) between「在…之間」表示期間。(C) since「自從…」常用於現在完成式，表示時間點，而不會和未來式一起使用。\n\n<!-- page 246 -->\n\n**108.** 答案 (D)｜難度：低\nHuntington Hotel provides a wide ______ of recreational activities for its guests, including water sports and sightseeing tours.\n- (A) varied\n- (B) variable\n- (C) vary\n- (D) variety\n\n> Huntington 飯店為住客提供多樣的娛樂活動，包括水上運動和觀光行程。\n\n**名詞位置**\n能被空格前的形容詞（wide）修飾的是名詞，所以名詞 (D) variety（多樣性）是正確答案。動詞或分詞 (A)、形容詞 (B)、動詞 (C) 不能用在名詞的位置。就算把 (B) 當成名詞「變數」，也會變成「提供娛樂活動的廣大變數」這種不恰當的意思。\n\n**單字** sightseeing (n.) 觀光；variable (adj.) 易變的，可變的；vary (v.) 不同，改變\n\n**109.** 答案 (B)｜難度：中\nCustomers will receive points for every purchase they make, ______ they can use to buy other products sold in the store.\n- (A) what\n- (B) which\n- (C) these\n- (D) who\n\n> 顧客每次購物都會獲得點數，可以用來買店裡販賣的其他產品。\n\n**〔引導修飾語的成分〕關係代名詞的選擇與格**\n這個句子是有主詞（Customers）、動詞（will receive）和受詞（points）的完整句，所以 ______ they ~ store 的部分視為修飾語。這個修飾語是有動詞（can use）的修飾子句，但缺少受詞，而且修飾的是空格前面的名詞 points（點），所以受格關係代名詞 (B) 和 (D) 是可能的答案。因為關係代名詞的先行詞是事物（points），所以先行詞為事物時使用的關係代名詞 (B) which 是正確答案。(D) who 用於先行詞是人物的時候。(A) what 是名詞子句連接詞，所以由 what 引導的整個子句在句子裡會是主詞或受詞等等，而不能修飾其他名詞。指示代名詞或指示形容詞 (C) these 不能引導修飾子句。\n\n**110.** 答案 (C)｜難度：低\nThe planning committee representatives made a ______ decision to postpone the event until the end of the month.\n- (A) collects\n- (B) collection\n- (C) collective\n- (D) collectively\n\n> 計畫委員會的代表們做出了將活動延到月底的集體決策。\n\n**形容詞位置**\n能修飾空格後方名詞（decision）的是形容詞，所以形容詞 (C) collective（集體的）是正確答案。動詞 (A)、名詞 (B)、副詞 (D) 不能修飾名詞。\n\n**單字** committee (n.) 委員會；representative (n.) 代表，代表人；postpone (v.) 延後，延期；collect (v.) 收集，聚集；collection (n.) 收集，收藏，募款；collectively (adv.) 集體地，全體地\n\n**111.** 答案 (C)｜難度：中\nIn a report, the Energy Department offered its best ______ of future oil prices in relation to the current world supply.\n- (A) expenses\n- (B) investments\n- (C) predictions\n- (D) beliefs\n\n> 在一份報告中，能源部提出了關於未來油價相應於目前全世界供給的最佳預測。\n\n**名詞詞彙**\n文意是「能源部提出未來油價的最佳預測」，所以名詞 (C) predictions（預測）是正確答案。(A) 的 expense 表示「費用，支出」，(B) 的 investment 表示「投資」，(D) 的 belief 表示「信念」。\n\n**單字** oil price (phr.) 油價；in relation to (phr.) 關於…，和…相關；supply (n.) 供給，供應\n\n<!-- page 247 -->\n\n**112.** 答案 (B)｜難度：高\nAs traveling by bus can be ______, many passengers bring along a book or an electronic device for entertainment throughout their journeys.\n- (A) diligent\n- (B) tedious\n- (C) classified\n- (D) thoughtful\n\n> 由於乘坐巴士可能很冗長乏味，所以許多乘客會帶書或者電子設備作為旅途中的娛樂。\n\n**形容詞詞彙**\n文意是「因為搭巴士移動可能很冗長乏味，所以乘客帶書或電子設備」，所以形容詞 (B) tedious（冗長乏味的）是正確答案。(A) diligent 表示「勤奮的」，(C) classified 表示「分類的，機密的」，(D) thoughtful 表示「深思的，考慮周到的」。\n\n**單字** passenger (n.) 乘客；bring along (phr.) 帶來…；device (n.) 設備，裝置；journey (n.) 旅程，旅行\n\n**113.** 答案 (D)｜難度：中\nThe opening of the warehouse in Philadelphia was ______ scheduled for next week, but construction problems have caused a significant delay.\n- (A) currently\n- (B) shortly\n- (C) slightly\n- (D) originally\n\n> 費城倉庫開始營運原本預定是在下週，但工程上的問題造成了大幅的延誤。\n\n**副詞詞彙**\n文意是「倉庫的開幕原本預定在下週，但工程上的問題造成大幅延誤」，所以副詞 (D) originally（原本）是正確答案。(A) currently 表示「目前」，會和現在式一起使用。(B) shortly 表示「馬上，不久」，(C) slightly 表示「稍微」。\n\n**單字** opening (n.) 開幕，開始；warehouse (n.) 倉庫；construction (n.) 建設，施工；delay (n.) 延誤，延期\n\n**114.** 答案 (B)｜難度：低\nBecause there are many job openings, applicants must indicate which position they are seeking by ______ marking the appropriate box.\n- (A) cleared\n- (B) clearly\n- (C) clearing\n- (D) clearance\n\n> 因為有很多職缺，所以應徵者必須清楚勾選適當的格子來標明要應徵哪個職位。\n\n**副詞位置**\n能修飾空格後的動名詞（marking）的是副詞，所以副詞 (B) clearly（清楚地）是正確答案。動詞或過去分詞 (A)、動名詞或現在分詞 (C)、名詞 (D) 都不能修飾動名詞。另外，介系詞（by）後面要接名詞或有名詞功能的動名詞，所以這裡接的是 marking。\n\n**單字** job opening (n.) 職缺；indicate (v.) 標明，指出；seek (v.) 尋找，尋求；mark (v.) 標記；(n.) 記號；appropriate (adj.) 適合的，適當的\n\n**115.** 答案 (C)｜難度：中\nPrices for certain commodities are rising around the nation as they become more ______.\n- (A) qualified\n- (B) expert\n- (C) scarce\n- (D) minor\n\n> 特定商品由於變得更加稀少，所以在全國的價格都在上升中。\n\n**形容詞詞彙**\n文意是「因為商品變少使得價格上升」，所以形容詞 (C) scarce（稀少的）是正確答案。(A) qualified 表示「有資格的，合格的」，(B) expert 表示「專家的，熟練的」，(D) minor 表示「較小的，次要的」。\n\n**單字** certain (adj.) 特定的，某種的；commodity (n.) 商品（指原物料、大宗產品等）\n\n<!-- page 248 -->\n\n**116.** 答案 (D)｜難度：低\nWhile the CEO is away at the conference in Santiago, his assistant, Mr. Hale, will handle all official ______ on his behalf.\n- (A) correspond\n- (B) corresponds\n- (C) correspondingly\n- (D) correspondence\n\n> 執行長參加聖地牙哥的會議而不在的期間，他的助理 Hale 先生會代他處理所有的正式通信往來。\n\n**名詞位置**\n能被空格前面的形容詞（official）修飾的是名詞，所以名詞 (D) correspondence（通信聯繫）是正確答案。動詞 (A) 和 (B)、副詞 (C) 不能用在名詞的位置。\n\n**單字** handle (v.) 處理；official (adj.) 正式的，官方的；on one's behalf (phr.) 代表某人；correspond (v.) 一致，符合；correspondingly (adv.) 相應地，相關地\n\n**117.** 答案 (A)｜難度：中\nThe vendors at the trade fair come ______ from Europe, but a few are from North America and other parts of the world.\n- (A) mostly\n- (B) nearly\n- (C) extremely\n- (D) promptly\n\n> 貿易展中的販賣業者大多來自歐洲，但有一些來自北美和世界其他地區。\n\n**副詞詞彙**\n文意是「販賣業者大多來自歐洲，但也有一些來自北美和其他地區」，所以副詞 (A) mostly（大多）是正確答案。(B) nearly 表示「幾乎，將近」，雖然意義上好像說得通，但這個詞通常和表達數目的用語連用，或者表示類似、完美、正確的程度。(C) extremely 表示「極度地」，(D) promptly 表示「迅速地，準時地」。\n\n**單字** vendor (n.) 小販，販賣業者；trade fair (phr.) 貿易展\n\n**118.** 答案 (B)｜難度：高\nThe bank only evaluates small business loan applications ______ clients submit a feasibility report on their proposed operational strategy.\n- (A) as if\n- (B) after\n- (C) in that\n- (D) still\n\n> 只有在客戶交出所提議的經營策略的可行性報告之後，銀行才會評估小型企業貸款的申請。\n\n**〔引導修飾語的成分〕副詞子句連接詞** 時間\n這個句子是有主詞（The bank）、動詞（evaluates）和受詞（small business loan applications）的完整句，所以 ______ clients ~ strategy 的部分視為修飾語。這個修飾語是有動詞（submit）的修飾子句，所以能引導修飾子句的副詞子句連接詞 (A)、(B)、(C) 是可能的答案。因為要表示「交出報告後才評估貸款的申請」，所以表示時間的 (B) after（…之後）是正確答案。(A) as if「彷彿…」表示假設，(C) in that「由於…」表示理由。副詞 (D) still（仍然）不能引導修飾子句。\n\n**單字** evaluate (v.) 評價，評估；loan (n.) 借貸，貸款；application (n.) 申請，申請書；submit (v.) 提交；feasibility (n.) 可行性[?]；operational (adj.) 經營的，運作的；strategy (n.) 策略，戰略\n\n**119.** 答案 (A)｜難度：高\nThe tour bus drove ______ several notable sites in Victoria and made three stops in particularly interesting districts.\n- (A) past\n- (B) out\n- (C) without\n- (D) up\n\n> 觀光巴士行駛經過了幾個維多利亞的著名景點，並且在三個特別有趣的地區中途停留。\n\n**選擇介系詞** 其他\n要表達的意思是「巴士行經一些著名景點，而且中途在有趣的地區停留了三次」，所以介系詞 (A) past（經過…）是正確答案。(B) out 經常以 out of（在…外面）的形式使用，表示位置。(C) without「沒有…」表示除外，(D) up「往…的上方」表示方向。\n\n**單字** notable (adj.) 有名的，值得注意的；particularly (adv.) 特別地，尤其；district (n.) 地區\n\n<!-- page 249 -->\n\n**120.** 答案 (C)\nBlueline Insurance will immediately cover the cost of repairing clients' automobiles if ______ amount to less than $1,000.\n- (A) experiments\n- (B) accidents\n- (C) damages\n- (D) facilities\n\n> 如果損害賠償金的總額未滿 1,000 美元，Blueline 保險公司會立即理賠修理客戶汽車的費用。\n\n**名詞詞彙**\n文意是「如果損害賠償金的總額比 1,000 美元少，就會立即理賠費用」，所以名詞 (C) damages（損害賠償金，損害）是正確答案。(A) 的名詞 experiment 表示「實驗」，(B) 的 accident 表示「意外事故」，(D) 的 facility 表示「設施」。\n\n**單字** immediately (adv.) 立即；repair (v.) 修理；(n.) 修理；automobile (n.) 汽車；amount (v.)（金額）合計…；less than (phr.) 少於…\n\n**121.** 答案 (C)｜難度：高\n______ minimize distractions, Janzyll Incorporated discourages the personal use of telephones and the Internet while on duty.\n- (A) Instead\n- (B) Provided\n- (C) In an effort to\n- (D) So long as\n\n> 為了將注意力散漫的情形減到最少，Janzyll 公司勸阻員工在工作時為了私人目的打電話和上網。\n\n**to 不定詞的形式**\n空格後面有動詞原形（minimize），所以能和「to + 動詞原形」代換的 (C) In an effort to（為了努力做到…）是正確答案。副詞 (A) Instead（反而）當連接副詞用於句首時，後面要有逗號，而且接完整子句。副詞子句連接詞 (B) Provided（倘若…）和 (D) So long as（只要…）後面要接完整子句。\n\n**單字** minimize (v.) 最小化；distraction (n.) 注意力分散，分散注意力的事物；discourage (v.) 阻撓，使打消念頭\n\n**122.** 答案 (B)｜難度：高\nThe Simon Pillars Foundation is a global organization of architects ______ to building free homes for underprivileged families.\n- (A) installed\n- (B) dedicated\n- (C) distributed\n- (D) generated\n\n> Simon Pillars 基金會是一群致力於為弱勢家庭建造免費房屋的建築師所組成的國際組織。\n\n**形容詞詞彙**\n文意是「致力於建造免費房屋」，所以形容詞 (B) dedicated（致力於某事的）是正確答案。(A) installed 表示「被安裝的」、(C) distributed 表示「被分發的，散布的」，(D) generated 表示「被產生的」。\n\n**單字** foundation (n.) 基金會，創立；global (adj.) 全球的，全世界的；organization (n.) 組織，團體；architect (n.) 建築師；underprivileged (adj.) 處於社會弱勢的\n\n**123.** 答案 (A)｜難度：高\nThe group was very pleased with the cruise arranged by Stellar Travel, with many saying that it was the most ______ of holidays they had ever been on.\n- (A) memorable\n- (B) memorize\n- (C) memory\n- (D) memorably\n\n> 這個團體對 Stellar 旅行社安排的遊輪旅行非常滿意，很多人說這是他們所度過最難忘的假期。\n\n**最高級**\n能夠形成「最高級（the most）______ of holidays」，表示「在…之中最…」的意思，而且能被副詞（most）修飾的形容詞 (A) 和副詞 (D) 是可能的答案。因為要表示「假日中最…的假日」的意思，所以這裡的最高級（the most memorable）是要表明後面的名詞（holidays）中特定性質的對象，而且省略了重複的名詞，所以能夠修飾名詞的形容詞 (A) memorable（值得紀念的，難忘的）是正確答案。副詞 (D) 不能修飾名詞。動詞 (B) 和名詞 (C) 不能形成最高級。\n\n**單字** pleased (adj.) 滿意的，高興的；cruise (n.) 遊輪旅行；arrange (v.) 安排，準備\n\n<!-- page 250 -->\n\n**124.** 答案 (D)｜難度：中\nAfter working in London for five years, Ms. Shatya had trouble ______ to the climate in her home country of Malaysia.\n- (A) readjust\n- (B) readjusts\n- (C) readjustments\n- (D) readjusting\n\n> 在倫敦工作五年後，Shatya 小姐很難重新適應母國馬來西亞的氣候。\n\n**動名詞的慣用表達方式**\nhave trouble（有困難）後面會接動名詞，所以動詞 readjust（重新適應）的動名詞 (D) readjusting 是正確答案。動詞 (A) 和 (B)、名詞 (C) 不能用在 have trouble 後面的動名詞位置。請把 have trouble -ing（做…有困難）這個慣用表達方式記起來。\n\n**單字** climate (n.) 氣候；home country (phr.) 母國\n\n**125.** 答案 (B)｜難度：最高\nUnless Kempley Telecom is ______ told to cancel a subscription, it will continue to charge users the regular monthly fee.\n- (A) supposedly\n- (B) explicitly\n- (C) alternately\n- (D) consecutively\n\n> 除非被明確告知要取消租用，否則 Kempley 電信公司會繼續向使用者收取月租費。\n\n**副詞詞彙**\n文意是「如果沒有被明確告知要取消租用，就會繼續收月租費」，所以副詞 (B) explicitly（明確地）是正確答案。(A) supposedly 表示「據一般推測，大概」，(C) alternately 表示「交替地」，(D) consecutively 表示「連續地」。(D) 看起來似乎也說得通，但因為表示時間上連續而不中斷的意思，所以不對。\n\n**單字** subscription (n.) 訂閱，服務的租用；charge (v.) 收費，請款；(n.) 收費\n\n**126.** 答案 (B)｜難度：高\nMotivated by the chance to earn a large bonus, Carver Properties' sales team ______ to meet its annual quota.\n- (A) eliminated\n- (B) strived\n- (C) climbed\n- (D) outlined\n\n> 因為受到可能獲得高額獎金的機會激勵，所以 Carver 不動產的業務團隊努力達到年度（業績的）配額。\n\n**動詞詞彙**\n文意是「業務團隊努力達到年度配額」，所以動詞 strive（努力）的過去式 (B) strived 是正確答案。(A) 的動詞 eliminate 表示「去除」，(C) 的 climb 表示「爬」，(D) 的 outline 表示「概述」。\n\n**單字** motivate (v.) 給予動機，激勵；earn (v.) 賺，獲得；annual (adj.) 年度的，每年的；quota (n.) 配額\n\n**127.** 答案 (D)｜難度：中\nA special recognition award was presented to Dane Evans, ______ him for his many years of service on the police force.\n- (A) honorable\n- (B) honored\n- (C) honors\n- (D) honoring\n\n> 為了表彰 Dane Evans 在警界的多年服務，所以頒了特別表揚獎給他。\n\n**〔引導修飾語的成分〕現在分詞 vs. 過去分詞**\n句子是有主詞（A special recognition award）和動詞（was presented）的完整句，所以 ______ him ~ force 的部分視為修飾語，能夠引導修飾成分的分詞 (B) 和 (D) 是可能的答案。空格後面有受詞（him），而主要子句的主詞（A special recognition award）和空格中的分詞表示「特別表揚獎表彰他的多年服務」的主動意義，所以動詞 honor（給…榮譽，向…表示尊敬）的現在分詞 (D) honoring 是正確答案。(B) honored 表示被動意義，所以不對。形容詞 (A) 和動詞或名詞 (C) 不能引導修飾語。\n\n**單字** recognition (n.) 承認，表彰；present (v.) 提出，呈獻；service (n.) 服務\n\n<!-- page 251 -->\n\n**128.** 答案 (C)｜難度：高\nThe Traffic Bureau ______ the new regulations to protect pedestrians and motorists from road accidents at night.\n- (A) gathered\n- (B) convinced\n- (C) implemented\n- (D) channeled\n\n> 交通局實施了新規定來保護行人與駕駛人，避免在夜間發生道路事故。\n\n**動詞詞彙**\n文意是「交通局實施了新規定」，所以動詞 implement（實施）的過去式 (C) implemented 是正確答案。(A) 的動詞 gather 表示「聚集」，(B) 的 convince 表示「說服」，(D) 的 channel 表示「引導」。\n\n**單字** bureau (n.)（政府機構的）局；regulation (n.) 規定，規則；pedestrian (n.) 行人；motorist (n.)（汽車）駕駛人；accident (n.) 意外事故\n\n**129.** 答案 (A)｜難度：高\nThe Hotel Duvarney is committed to providing ______ of its guests with a pleasant and comfortable stay.\n- (A) each\n- (B) whose\n- (C) whatever\n- (D) quite\n\n> Duvarney 飯店致力於為每位住客提供愉快且舒適的住宿。\n\n**〔名詞位置〕不定代名詞**\n能當及物動詞（providing）受詞的是名詞，所以相當於名詞的代名詞 (A)、疑問代名詞 (B)、複合關係代名詞 (C) 是可能的答案。因為要表達「為每位住客提供愉快且舒適的住宿」的意思，所以 (A) each（每一個）是正確答案。(B) whose（某人的東西）和 (C) whatever（不論什麼）與文意不符。(D) quite「相當，非常」是表示強調的副詞。\n\n**單字** be committed to (phr.) 致力於…；pleasant (adj.) 愉快的；comfortable (adj.) 舒適的\n\n**130.** 答案 (A)｜難度：高\nThe Labor Relations Commission is conducting thorough ______ into claims that some employees at the Hartford Company are being treated unfairly.\n- (A) investigations\n- (B) interpretations\n- (C) conditions\n- (D) interactions\n\n> 勞工關係委員會正在對於 Hartford 公司某些員工遭到不公平對待的投訴進行徹底的調查。\n\n**名詞詞彙**\n文意是「勞工關係委員會進行徹底的調查」，所以名詞 (A) investigations（調查）是正確答案。(B) 的名詞 interpretation 表示「解釋，說明」，(C) 的 condition 表示「狀況」，(D) 的 interaction 表示「互動，相互作用」。\n\n**單字** labor (n.) 勞動，勞工；conduct (v.) 進行，實施；thorough (adj.) 徹底的，全面的；claim (n.) 主張，要求；treat (v.) 對待，處理；unfairly (adv.) 不公平地\n\n<!-- page 252 -->\n\n## PART 6\n\n### Questions 131-134 refer to the following announcement. 🆕\n131-134 題參照以下公告。\n\n> Southwestern Residences\n>\n> IMPORTANT ANNOUNCEMENT\n>\n> The building's ______(131) will perform maintenance checks on the condominium's electrical circuits and switch boxes on Monday between 10 a.m. and 1 p.m. During this time, the power supply will be ______(132). We apologize for any inconvenience this may cause. ______(133). However, repair work may need to be carried out if any problems are detected. ______(134), the shutdown may be extended to accommodate repairs.\n>\n> For details regarding this and other related matters, please contact the building superintendent, Ms. Jena Gordon, at 555-2124. Thank you for your patience and understanding.\n\n**翻譯**\n> Southwestern 住宅\n>\n> 重要公告\n>\n> [131]大樓管理部將於週一上午 10 點至下午 1 點對公寓的電路及配電箱進行保養檢查。[132]在這段時間，供電將會中斷。我們為可能造成的任何不便致歉。[133]我們預定檢查完成後立即恢復供電。然而，若發現任何問題，可能必須進行維修。[134]在此情況下，可能延長停電時間以利維修。\n>\n> 欲知此事及相關事務之細節，請撥 555-2124 聯絡大樓總管 Jena Gordon 小姐。感謝您的耐心與諒解。\n\n**131.**\n- (A) administer\n- (B) administrative\n- (C) administration\n- (D) administratively\n\n**132.**\n- (A) motivated\n- (B) pressured\n- (C) interrupted\n- (D) dismissed\n\n**133.** 🆕\n- (A) A realtor will be showing people around the building during this time.\n- (B) The maintenance check lasted through the weekend.\n- (C) We are sorry that we were unable to complete the inspection.\n- (D) We intend to restore electricity immediately following the inspection.\n\n**134.**\n- (A) In this case\n- (B) Above all\n- (C) By far\n- (D) On the contrary\n\n**單字** residence (n.) 住宅，居住；maintenance (n.) 維護，保養；condominium (n.) 公寓；circuit (n.) 電路，回路；switch box (phr.) 配電箱；power (n.) 電力，力量；supply (n.) 供給（量）；(v.) 供給；carry out (phr.) 實行，實施；detect (v.) 發現，察覺；shutdown (n.) 關閉，停工，關機；extend (v.) 延長；superintendent (n.) 監管者，主管\n\n<!-- page 253 -->\n\n**131.** 答案 (C)｜難度：高\n**名詞位置**\n能被所有格（The building's）修飾，並且用於主詞位置的是名詞，所以名詞 (C) administration（管理，行政，管理部門）是正確答案。動詞 (A)、形容詞 (B)、副詞 (D) 不能用在名詞的位置。\n\n**單字** administer (v.) 管理，治理；administrative (adj.) 管理的，行政的；administratively (adv.) 在管理上，在行政上\n\n**132.** 答案 (C)｜難度：高\n**動詞詞彙**\n文意是「供電會被中斷」，所以動詞 interrupt（打斷，使中斷）的 p.p. 形 (C) interrupted 是正確答案。(A) 的動詞 motivate 表示「給予動機，激勵」，(B) 的 pressure 表示「施加壓力」，(D) 的 dismiss 表示「使解散，解雇」。\n\n**133.** 🆕 答案 (D)｜難度：高\n**選出空格中正確的句子**\n這是選擇句子的題目，所以要參考空格前後或文章整體的內容。前面部分提到大樓管理部將會對電路及配電箱進行保養檢查，而空格的上一句「We apologize for any inconvenience this may cause.」為這件事將帶來的不便致歉，空格後的下一句「However, repair work may need to be carried out if any problems are detected.」則說如果發現問題，可能必須維修。所以，空格的內容應該和檢查完成時的復原有關，正確答案是 (D) We intend to restore electricity immediately following the inspection。\n\n**選項翻譯**\n- (A) 房地產經紀人會在這時候帶人們在大樓四處看看。\n- (B) 保養檢查持續到了週末。\n- (C) 我們很抱歉沒能完成檢查。\n- (D) 我們預定檢查完成後立即恢復供電。\n\n**單字** realtor (n.) 房地產經紀人；through (prep.) 遍及…，一直持續到…；complete (v.) 完成，結束；(adj.) 完全的；inspection (n.) 檢查，視察；restore (v.) 恢復，使恢復\n\n**134.** 答案 (A)｜難度：中\n**連接副詞** 參考上下文\n空格和逗號一起出現在句首的連接副詞位置，所以要判斷空格所在的句子和上一個句子的關係再作答。上一句說如果發現問題就可能需要維修，而空格所在的句子說（供電）關閉可能會為了進行維修而延長，所以對上一句做進一步說明時會使用的 (A) In this case（在這種情況下，這樣的話）是正確答案。(B) Above all 表示「尤其，最重要的是」，(C) By far 表示「非常，顯然」。(D) On the contrary「相對地，反之」表示和上一句表達的內容相反，所以不對。\n\n<!-- page 254 -->\n\n### Questions 135-138 refer to the following article. 🆕\n135-138 題參照以下報導。\n\n> PARNOPIUS REOPENS IN SEPTEMBER!\n>\n> The newly renovated Parnopius Museum of the Arts will officially reopen its doors to the public on September 1 at 10 a.m. The ribbon-cutting ceremony will be led by City Mayor Adam Warren, and other ______(135) officials are expected to attend.\n>\n> Chief curator Minerva Hughes said the renovation focused on the construction of a south wing with 25 thousand square feet of exhibition space. The space allows for 20 galleries and will ______(136) the works of European and Asian artists. In addition, it has facilities not found in the rest of the building. ______(137).\n>\n> The first exhibit in the new wing ______(138) contemporary Greek sculpture. It will run from September 15 to October 31. For more information, visit www.parnopiusmuseum.org.\n\n**翻譯**\n> PARNOPIUS 於 9 月重新開幕！\n>\n> 新整修完成的 Parnopius 美術館將於 9 月 1 日上午 10 點正式重新開幕。[135]剪綵典禮將由市長 Adam Warren 主持，其他重要官員預料也將出席。\n>\n> 館長 Minerva Hughes 表示，本次整修主要著重於建設有 25,000 平方英尺展覽空間的南側延伸部分。[136]空間足以容納 20 間展覽室，並且將收藏歐洲及亞洲藝術家的作品。此外，這裡也有建築物其他部分所沒有的設施。[137]其中包括一樓的演講廳、禮品店及咖啡店。\n>\n> [138]新建部分的第一場展覽將展出現代希臘雕塑。本展將由 9 月 15 日展出至 10 月 31 日。欲知更多資訊，請上 www.parnopiusmuseum.org。\n\n**135.**\n- (A) prominent\n- (B) thorough\n- (C) casual\n- (D) precise\n\n**136.**\n- (A) generate\n- (B) portray\n- (C) house\n- (D) restore\n\n**137.** 🆕\n- (A) These unique artifacts had made the museum very popular.\n- (B) These include a lectu 資料。\n\n**143.**\n- (A) across\n- (B) near\n- (C) inside\n- (D) above\n\n**144.**\n- (A) Nevertheless\n- (B) Instead\n- (C) Otherwise\n- (D) Therefore\n\n**145.**\n- (A) envelopes\n- (B) items\n- (C) terms\n- (D) checks\n\n**146.** 🆕\n- (A) The library has stopped renting out periodicals and tapes.\n- (B) The library will add up the cost of the books that are purchased.\n- (C) Upon return of the material, the borrower will have to pay a late fee.\n- (D) As per the decision of the library management, alerts will be canceled.\n\n**單字** complimentary (adj.) 免費附贈的，稱讚的；alert (n.) 警報，提醒；remind (v.) 提醒，使想起；audiovisual (adj.) 視聽的；periodical (n.) 期刊；(adj.) 週期性的；due date (phr.) 到期日；excuse (v.) 原諒，免除某人的責任；(n.) 藉口，理由；borrower (n.) 借用者；on time (phr.) 準時；essential (adj.) 不可或缺的，必要的；take note of (phr.) 注意…；stamp (v.) 在…蓋章；regulation (n.) 規定，法規；appropriate (adj.) 適當的\n\n<!-- page 259 -->\n\n**143.** 答案 (B)｜難度：中\n**選擇介系詞** 位置\n文意是「在接近到期日時提醒」，所以表示時間、位置接近的介系詞 (B) near（接近…）是正確答案。(A) across「越過…」表示方向或位置，(C) inside 和 (D) above 分別是「在…裡面」、「在…上方」，都表示位置。\n\n**144.** 答案 (D)｜難度：中\n**連接副詞** 參考上下文\n空格和逗號一起出現在句首的連接副詞位置，所以要判斷空格所在的句子和上一個句子的關係再作答。上一句說即使沒收到提醒也不能免除借用者準時歸還資料的義務，而空格所在的句子說借用者必須隨時注意到期日，所以表示延續上一句內容的 (D) Therefore（因此）是正確答案。(A) Nevertheless 表示「儘管如此」，(B) Instead 表示「反之，反而」，(C) Otherwise 表示「否則」。\n\n**145.** 答案 (B)｜難度：中\n**名詞詞彙** 參考全文\n文意是「到期日蓋印於書本或其他 ______ 所附的歸還卡上」，所以 (A) 和 (B) 是可能的答案。因為無法從空格所在的句子判斷答案，所以必須參考空格前後或文章整體的內容。前面部分提到借書、視聽資料、期刊等資料快到期的時候會有通知，可知附有歸還卡的除了書以外還有視聽資料和期刊等。所以，(B) items（物品）是正確答案。(A) envelopes 表示「信封」，(B) terms 表示「條件，期間」，(D) checks 表示「支票，檢查」。\n\n**146.** 🆕 答案 (C)｜難度：中\n**選出空格中正確的句子**\n這是選擇句子的題目，所以要參考空格前後或文章整體的內容。上一句「Should anything borrowed from the library be returned late, a notice will be sent after the due date.」提到，如果從圖書館借出的任何資料逾期歸還，將在到期日後寄出通知。所以，空格的內容應該跟收到逾期通知的人要做的事有關，正確答案是 (C) Upon return of the material, the borrower will have to pay a late fee。\n\n**選項翻譯**\n- (A) 圖書館已經不再出借期刊和錄音帶。\n- (B) 圖書館將會累計所購買的書籍費用。\n- (C) 歸還資料時，借用者必須支付逾期費用。\n- (D) 依照圖書館經營團隊的決定，提醒服務將會取消。\n\n**單字** add up (phr.) 合計；late fee (phr.) 逾期費用；as per (phr.) 依照…\n\n<!-- page 260 -->\n\n## PART 7\n\n### Questions 147-148 refer to the following invitation.\n147-148 題參照以下邀請函。\n\n> You are invited to a seminar on\n> **Strengthening Regional Ties**\n> With Professor Bernardo Almeida\n> From 6 to 9 p.m. on October 13\n> At Thailand Royal University\n>\n> [147-A]Professor Almeida is an instructor of economics at Caracas University and a member of Centro Social Latino. [147-C]He had an important role developing trade policies between the governments of various Latin American nations and has agreed to share insights about his experience. [148-A/B/D]The event will consist of a one-hour presentation followed by dinner and a networking activity.\n>\n> Please inform us if you plan on attending by contacting Sinee Aromdee at s_aromdee@tru.edu.th or calling 555-2409.\n\n**翻譯**\n> 您受邀參加\n> **強化區域連結研討會**\n> 與 Bernardo Almeida 教授一起討論\n> 10 月 13 日下午 6~9 點\n> 在泰國皇家大學\n>\n> [147-A]Almeida 教授是卡拉卡斯大學的經濟學講師，以及 Centro Social Latino 的一員。[147-C]他在拉丁美洲各國政府間貿易政策的發展中曾扮演重要的角色，而他同意將分享關於自身經驗的洞見。[148-A/B/D]活動將有一小時的簡報，之後是晚餐及交流活動。\n>\n> 如果您預計參加，請通知我們，請寄 s_aromdee@tru.edu.th 或撥打 555-2409 聯絡 Sinee Aromdee。\n\n**單字** strengthen (v.) 強化，增強；tie (n.) 聯繫，關係；instructor (n.) 講師，大學講師；economics (n.) 經濟學；role (n.) 角色，作用；trade (n.) 貿易，商業；insight (n.) 洞察力，洞見；consist of (phr.) 由…構成\n\n**147.** 答案 (A)｜難度：低\nWhat is mentioned about Professor Almeida?\n- (A) He teaches in the field of economics.\n- (B) He is moving to Latin America.\n- (C) He works for the government.\n- (D) He attended school in Thailand.\n\n> 關於 Almeida 教授，文中提到什麼？\n> (A) 他在經濟學領域教書。\n> (B) 他即將搬到拉丁美洲。\n> (C) 他為政府工作。\n> (D) 他以前在泰國就學。\n\n**Not/True True 問題**\n這是需要在文章中找到與關鍵字 Professor Almeida 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A) 對應文中的「Professor Almeida is an instructor of economics at Caracas University」，表示 Almeida 教授在卡拉卡斯大學教經濟學，符合選項敘述，所以 (A) He teaches in the field of economics 是正確答案。(B) 和 (D) 在文中沒有提到。和 (C) 相關的部分是「He had an important role developing trade policies between the governments of various Latin American nations」，表示他以前在拉丁美洲各國政府間貿易政策的發展中扮演過重要角色，但不表示他目前還為政府工作，所以不符合選項敘述。\n\n**替換表達**\nis an instructor of economics 是經濟學講師 → teaches in the field of economics 在經濟學領域教書\n\n**148.** 答案 (C)｜難度：中\nWhat is NOT stated as a planned activity in the invitation?\n- (A) A sit-down meal\n- (B) An hour-long lecture\n- (C) A book signing event\n- (D) An opportunity for interaction\n\n> 邀請函沒有提到什麼預定的活動？\n> (A) 坐著用餐\n> (B) 一小時的演講\n> (C) 簽書活動\n> (D) 互動的機會\n\n**Not/True Not 問題**\n這是需要在文章中找到與關鍵字 a planned activity 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A)、(B)、(D) 對應文中的「The event will consist of a one-hour presentation followed by dinner and a networking activity.」，表示活動內容包括一小時的簡報，然後是晚餐和交流活動，符合選項敘述。(C) 在文中沒有提到，所以 (C) A book signing event 是正確答案。\n\n<!-- page 261 -->\n**替換表達**\na one-hour presentation 一小時的簡報 → An hour-long lecture 長度一小時的演講\nnetworking activity 交誼活動 → interaction 互動\n\n### Questions 149-150 refer to the following memo.\n149-150 題參照以下備忘錄。\n\n> **Hightower Electronics**\n>\n> To: All sales staff\n> From: Lisa McDaniel, personnel director\n> Subject: Bonus scheme\n> Date: May 4\n>\n> Before anything else, [150-D] I want to thank everyone for providing their feedback on the company's compensation policy. After discussing your proposals in a series of management meetings, [149] it was agreed last week that staff members who sell between 100 and 250 units will be entitled to a higher commission of 3 percent on top of their basic salary. At the same time, those who sell between 250 and 500 will receive 8 percent commission, and those who sell over 500, 11 percent. In addition, [150-C] staff who consistently achieve sales above 500 units per month will receive a permanent increase in their salary after six months. [149] These changes will be implemented beginning June 1. Remember, [150-A] those who do not meet the minimum of 100 units will receive no commission at all.\n\n**翻譯**\n> **Hightower Electronics 公司**\n>\n> 收件人：所有員工\n> 寄件人：Lisa McDaniel，人事部長\n> 主旨：獎金制度\n> 日期：5 月 4 日\n>\n> 首先，[150-D] 我想感謝大家對於公司的薪酬政策提供回饋意見。在一系列的主管會議中討論了大家的提案之後，[149] 上週議定，銷售 100 至 250 個產品的員工，除了基本薪水以外，將可獲得更高的 3% 佣金。同時，銷售 250 至 500 個的員工將獲得 8% 佣金，銷售超過 500 個的人有 11% 佣金。另外，[150-C] 持續達到每月銷售量超過 500 個的員工，將在六個月後獲得永久加薪。[149] 這些改變將從 6 月 1 日起開始實施。記得，[150-A] 沒有達到最低標準 100 個的人不會得到任何佣金。\n\n**單字** scheme (n.) 制度，計畫；feedback (n.) 回饋意見，反應；compensation (n.) 補償，報酬；unit (n.) （商品的）一個；be entitled to (phr.) 有資格得到…；commission (n.) 佣金；on top of (phr.) 除了…還有；basic salary (phr.) 基本薪資；consistently (adv.) 持續地，一貫地；permanent (adj.) 永久的，固定性的；implement (v.) 實行，實施；meet (v.) 滿足（標準），趕上（期限）；at all (phr.) 絲毫，根本\n\n**149.** 答案 (C)｜難度：低\nWhat is the purpose of the memo?\n- (A) To report on recent sales results\n- (B) To solicit comments on a proposal\n- (C) To announce a change in policy\n- (D) To explain the reasons for a salary increase\n\n> 這則備忘錄的目的是什麼？\n> (A) 為了報告近期銷售結果\n> (B) 為了徵求對提案的意見\n> (C) 為了公告政策的改變\n> (D) 為了說明加薪的理由\n\n**尋找主題／目的** 文章的目的\n這是詢問備忘錄目的的尋找主題問題，所以要特別注意文章開頭的部分。「it was agreed last week that staff members who sell between 100 and 250 units will be entitled to a higher commission of 3 percent」提到，上週議定的事情是銷售 100 至 250 個產品的員工可以得到更高的 3% 佣金，接下來說明獎金制度的其他細節，而「These changes will be implemented beginning June 1.」表示這些改變會從 6 月 1 日開始實施，所以 (C) To announce a change in policy 是正確答案。\n\n**單字** report (v.) 報告；solicit (v.) 請求，徵求\n\n<!-- page 262 -->\n**150.** 答案 (B)｜難度：高\nWhat is NOT mentioned about the sales staff?\n- (A) They need to sell at least 100 units a month to receive a commission bonus.\n- (B) They will undergo a performance evaluation in June.\n- (C) They must achieve consistently high sales to get a salary increase.\n- (D) They gave some feedback to management.\n\n> 關於業務人員，文中沒有提到什麼〔…〕\n> (A) 一個月至少要銷售 100 個才能〔…〕獎勵的佣金。\n> (B) 六月將會接受績效考評。\n> (C) 必須持續達到高銷售量才能〔…〕薪。\n> (D) 他們向經營團隊提供了回饋意見。\n\n**Not/True** Not 問題\n這題是 Not/True 問題，所以要在文章中找出和問題重點 the sales staff 相關的內容，並對照各選項〔…〕確。(A) 對應文中的「those who do not meet the minimum of 100 units will receive no commission at all」，〔…〕示沒達到最低 100 個的標準的人不會得到佣金，符合選項敘述。(B) 在文中沒有提到，所以 (B) They will undergo a performance evaluation in June 是正確答案。(C) 對應文中的「staff who consistently achieve sales above 500 units per month will receive a permanent increase in their salary after six months」，表示連續〔…〕銷售量超過 500 個的人會得到永久加薪，符合選項敘述。(D) 對應文中的「I want to thank everyone for providing their feedback on the company's compensation policy」，表示要感謝大家對於公司的薪酬政策〔…〕回饋意見，符合選項敘述。\n\n**替換表達**\nthe minimum of 100 units 最低 100 個的限度 → at least 100 units 至少 100 個\n\n**單字** undergo (v.) 經歷，接受\n\n<!-- page 263 -->\n### Questions 151-152 refer to the following text message chain.\n151-152 題參照以下訊息對話紀錄。\n\n> **Melinda Carmichael** 9:52\n> I have a client who would like to see your apartment this afternoon. Would that be possible?\n>\n> **Charles Fredericks** 9:54\n> [152] I'm only available at night today. [151/152] If not, tomorrow evening might work. [151] Or, you could show your client the space without me.\n>\n> **Melinda Carmichael** 9:56\n> I know he's busy after 5. [152] But let me see if he's free tomorrow. He seemed very interested in renting the apartment after he went over the detailed floor plan.\n>\n> **Charles Fredericks** 9:59\n> Oh, really? That's good to hear. I hope he wants to take it as I need to move into my new place by the beginning of next month.\n>\n> **Melinda Carmichael** 10:05\n> Just spoke with him on the phone. [151] The visit is set for 10 a.m. tomorrow. He wants to take a look around the building, too.\n>\n> **Charles Fredericks** 10:06\n> Sounds good. [151] I'll leave my pass key at the front desk like the last time. Could you call me tomorrow night after 6 to let me know how it went?\n>\n> **Melinda Carmichael** 10:07\n> Of course I will. If he is willing to sign a contract, I will send you a text message right away.\n\n**翻譯**\n> **Melinda Carmichael** 9:52\n> 我有位客戶想要在今天下午去看您的公寓。請問可以嗎？\n>\n> **Charles Fredericks** 9:54\n> [152] 我今天只有晚上有空。[151/152] 不然，明天傍晚應該可以。[151] 或者，您可以自己讓客戶看那個地方，不用我在場。\n>\n> **Melinda Carmichael** 9:56\n> 我知道他 5 點後很忙。[152] 但讓我看看他明天有沒有空。他看過詳細平面圖之後，好像很有興趣租這間公寓。\n>\n> **Charles Fredericks** 9:59\n> 噢，真的嗎？真是好消息。我希望他想租，因為我必須在下個月初之前搬到新家。\n>\n> **Melinda Carmichael** 10:05\n> 我剛才跟他講了電話。[151] 預計明天上午 10 點參觀。他也想看一下大樓附近。\n>\n> **Charles Fredericks** 10:06\n> 聽起來不錯。[151] 我會像上次一樣把我的萬用鑰匙放在櫃台。您可以明天晚上 6 點以後打電話告訴我進行得怎樣嗎？\n>\n> **Melinda Carmichael** 10:07\n> 當然會的。如果他有意簽約，我會馬上傳訊息給您。\n\n**單字** rent (v.) 租用，出租；go over (phr.) 察看；floor plan (phr.) （建築物的）平面圖；take (v.) 拿，買下，租下；look around (phr.) 四處看看；pass key (phr.) （可以開一些不同的鎖的）萬用鑰匙；contract (n.) 合約（書）\n\n<!-- page 264 -->\n**151.** 答案 (A)｜難度：中\nWhat is suggested about Mr. Fredericks?\n- (A) He will not be at home when the client visits his apartment.\n- (B) He is looking for someone to clean his residence on a regular basis.\n- (C) He will have a housekeeper come to his apartment after 5 p.m.\n- (D) He is relocating to another address at the end of next month.\n\n> 關於 Fredericks 先生，文中顯示什麼〔…〕\n> (A) 客戶參觀他的公寓時，他不會在家。\n> (B) 他正在找人定期打掃他的住所。\n> (C) 他會請家事服務員在下午 5 點後〔…〕他的公寓。\n> (D) 下個月底他會搬到新的住址。\n\n**推論** 細節資訊\n這是關於題目關鍵字 Mr. Fredericks 的推論問題。Fredericks 先生說「If not, tomorrow evening might work. Or, you could show your client the space without me.」，表示如果今天晚上不行的話，明天傍晚也可以，〔…〕者不用他在場，讓對方（Carmichael 小姐）帶客戶去看就好。然後 Carmichael 小姐說「The visit is set for 10 a.m. tomorrow.」，表示已經約好明天上午 10 點去看，Fredericks 先生則回答「I'll leave my pass key at the front desk like the last time.」，表示會像上次一樣把萬用鑰匙放在櫃台，可推知客戶到他家的時候〔…〕會在，所以 (A) He will not be at home when the client visits his apartment 是正確答案。\n\n**單字** residence (n.) 住所；on a regular basis (phr.) 定期地；housekeeper (n.) （住宅、辦公室等的）家事／清潔〔…〕；relocate (v.) 搬遷，重新安置\n\n**152.** 🆕 答案 (C)｜難度：中\nAt 9:56, what does Ms. Carmichael mean when she writes, \"I know he's busy after 5\"?\n- (A) She will make plans to meet a client earlier in the day.\n- (B) She will be showing another apartment after 5 p.m.\n- (C) She is certain that a client is unavailable in the evening.\n- (D) She is willing to accommodate Mr. Fredericks's schedule.\n\n> 在 9:56，Carmichael 小姐說的「I know he's busy after 5」是什麼意思〔…〕\n> (A) 她會計畫在那天早一點的時候跟客戶見面。\n> (B) 她會在下午 5 點之後帶人看另一間公寓。\n> (C) 她確定客戶傍晚沒空。\n> (D) 她願意配合 Fredericks 先生的行程〔…〕\n\n**掌握意圖**\n題目問 Carmichael 小姐的意思，所以要掌握引用部分（I know he's busy after 5）上下文的情境。Charles Fredericks 說「I'm only available at night today. If not, tomorrow evening might work.」，表示他今天只有晚上有空，或者明天傍晚也可以。接下來 Carmichael 小姐說「I know he's busy after 5.」（我知道他 5 點以後很忙），又說「But let me see if he's free tomorrow.」，表示客戶 5 點之後很忙，應該沒辦法去看公寓，〔…〕是會問問看明天是否有空，所以 (C) She is certain that a client is unavailable in the evening 是正確答案。\n\n**替換表達**\nbusy 忙碌的 → unavailable 沒空的\n\n**單字** certain (adj.) 確定的，確信的；accommodate (v.) 容納，給…方便\n\n<!-- page 265 -->\n### Questions 153-155 refer to the following article.\n153-155 題參照以下報導。\n\n> [153-A] **Landmark Art Auction Returns for Its 25th Year**\n>\n> Local collectors eager to own an important piece of historical artwork will have plenty of opportunities at this year's Annual Hartford Art Auction. Celebrating its 25th year, [153-C] organizers of this year's event have gathered a remarkable collection of artwork that includes pieces by regional residents [154-C] Patricia Irwin, Robert Walcott, and [154-A/C] Dorothy Stone. The three painters, who were very productive throughout their careers, [154-C] achieved fame in their late 30s when they lived together in an apartment in Paris and immersed themselves into the local art community. However, American fans most love the group's earlier paintings of scenes from around the northeastern US. [154-B] George Luckett, who is curating this year's auction, secured 18 pieces by the artists and expects them to bring in over $1 million in total. Favorites include Walcott's \"Fishers Island Sound\" and Irwin's \"Sebago Lake.\" However, [154-D] it is Stone's oil painting entitled \"White Mountain\" that has the highest estimate value, and is expected to fetch around $120,000.\n>\n> The auction begins at 2 p.m. on Saturday, July 14 at the newly refurbished Farmington Gallery. [155] As before, a portion of the proceeds will be donated to the Foundation for Creative Arts, promoting artistic endeavors among the nation's youth. For more information, contact the organizers at 555-2092.\n\n**翻譯**\n> [153-A] **具指標性之藝術拍賣會於 25 週年再度登場**\n>\n> 在今年的 Hartford 年度藝術拍賣會，渴望擁有重要歷史藝術作品的本地收藏家將會有很多的機會。為慶祝 25 週年，[153-C] 今年活動的主辦者匯聚了一些非常出色的藝術品，其中包括地區居民 [154-C] Patricia Irwin、Robert Walcott 和 [154-A/C] Dorothy Stone 的作品。[154-A/C] 這三位生涯中非常多產的畫家，35 至 40 歲左右在巴黎一間公寓同居時成名，並且融入了當地的藝術社群。然而，美國的藝術愛好者最喜愛他們早期以美國東北部景色為主題的畫作。[154-B] 策畫今年拍賣會的 George Luckett 取得了這幾位藝術家的 18 件作品，並且預期這些作品總共將帶來超過 100 萬美元的收入。最受歡迎的作品包括 Walcott 的「Fishers Island Sound」和 Irwin 的「Sebago Lake」。不過，[154-D] 估價最高的是 Stone 題名為「White Mountain」的油畫，預期將售得 12 萬美元左右。\n>\n> 拍賣會將於 7 月 14 日星期六下午 2 點在剛重新裝潢完成的 Farmington 藝廊開始進行。[155] 如同往常，收入的一部分將捐給促進國內青少年藝術活動的創意藝術基金會。欲知更多資訊，請撥 555-2092 聯絡主辦者。\n\n**單字** auction (n.) 拍賣，競標；artwork (n.) 藝術品；gather (v.) 收集，聚集；remarkable (adj.) 值得注意的，出色的；regional (adj.) 地區的，地方的；productive (adj.) 有生產力的，多產的；fame (n.) 名聲，名譽；immerse (v.) 浸泡，使…沉浸；scene (n.) 景色，場面；curate (v.) 策展，擔任館長；secure (v.) 獲得；(adj.) 安全的；oil painting (phr.) 油畫；estimate (n.) 估計，估價；fetch (v.) 售得，拿來；refurbish (v.) 重新裝潢；portion (n.) 部分，一部分；proceeds (n.) 收入，收入金額；promote (v.) 促進，提升；endeavor (n.) 努力，嘗試；(v.) 努力\n\n**153.** 答案 (C)｜難度：中\nWhat is true about the auction?\n- (A) It is the first time it is being held.\n- (B) It is the largest of its kind in the region.\n- (C) It will feature a number of important pieces.\n- (D) It is being organized by several collectors.\n\n> 關於拍賣會，何者正確？\n> (A) 是第一次舉辦。\n> (B) 是地區上類似活動中最大型的。\n> (C) 會有一些重要的作品。\n> (D) 由幾位收藏家籌辦。\n\n**Not/True** True 問題\n這是需要在文章中找到與關鍵字 the auction 相關的資訊，並且與選項敘述對照的 Not/True 問題。和 (A) 相關的部分是「Landmark Art Auction Returns for Its 25th Year」，表示這個具指標性意義的藝術拍賣會舉辦到現在已經是 25 週年，不符合選項敘述。(B) 在文中沒有提到。(C) 對應文中的「organizers of this year's event have gathered a remarkable collection of artwork」，表示今年活動的主辦者匯聚了一些非常出色的藝術品，符合選項敘述，所以 (C) It will feature a number of important pieces 是正確答案。(D) 在文中沒有提到。\n\n<!-- page 266 -->\n**替換表達**\na remarkable collection of artwork 一些很出色的藝術品 → important pieces 重要的作品\n\n**154.** 答案 (B)｜難度：高\nWhat is NOT indicated about Dorothy Stone?\n- (A) She produced many paintings in her lifetime.\n- (B) She is expected to earn $1 million alone.\n- (C) She once lived in Paris with some colleagues.\n- (D) She made the painting with the highest value estimate.\n\n> 關於 Dorothy Stone，文中沒有提到什麼？\n> (A) 她一生中產出了許多畫作。\n> (B) 預期她一個人會賺進 100 萬美元。\n> (C) 她曾經和一些共事者住在巴黎。\n> (D) 她畫了估價最高的畫作。\n\n**Not/True** Not 問題\n這是需要在文章中找到與關鍵字 Dorothy Stone 相關的資訊，並且與選項敘述對照的 Not/True 問題。〔…〕應文中的「Dorothy Stone ~ who were very productive throughout their careers」，表示 Dorothy Stone 〔…〕中非常多產，符合選項敘述。和 (B) 相關的部分是「George Luckett ~ secured 18 pieces by the artists and expects them to bring in over $1 million in total」，表示 George Luckett 取得了 Patricia Irwin、Robert Walcott、Dorothy Stone 的 18 件作品，預期這些作品總共可以帶來 100 萬美元的收入，而不是一個人〔…〕入，不符合選項敘述，所以 (B) She is expected to earn $1 million alone 是正確答案。(C) 對應文中的「Patricia Irwin, Robert Walcott, and Dorothy Stone. The three painters ~ they lived together in an apartment in Paris」，表示 Dorothy Stone 等三名畫家曾經在巴黎的公寓同居，符合選項敘述。(D) 對應文中的「〔…〕Stone's oil painting entitled \"White Mountain\" that has the highest estimate value」，表示 Stone 名叫「White Mountain」的油畫是估價最高的，符合選項敘述。\n\n**替換表達**\nwere ~ productive throughout ~ careers 在生涯中很多產 → produced many paintings in ~ lifetime 一生中〔…〕了許多畫作\n\n**單字** lifetime (n.) 一生；(adj.) 一生的\n\n**155.** 答案 (D)｜難度：高\nWhat is suggested about the Foundation for Creative Arts?\n- (A) It was started by Ms. Irwin and her colleagues.\n- (B) It provides art supplies to local artists.\n- (C) It shares an office with the owners of the Farmington Gallery.\n- (D) It has benefited financially from sales at past auctions.\n\n> 關於創意藝術基金會，文中顯示什麼〔…〕\n> (A) 由 Irwin 小姐和她的同事們創立。\n> (B) 提供藝術用品給地方上的藝術家。\n> (C) 和 Farmington 藝廊的所有人共用辦公室。\n> (D) 在財務上曾受益於過去拍賣會的銷售款項。\n\n**推論** 細節資訊\n這是關於題目關鍵字 the Foundation for Creative Arts 的推論問題。「As before, a portion of the proceeds will be donated to the Foundation for Creative Arts」表示和以前一樣，收入的一部分會捐給創意藝術基金會，〔…〕此可推知創意藝術基金會以前也曾經受益於拍賣會的收入，所以 (D) It has benefited financially from sales at past auctions 是正確答案。\n\n**替換表達**\nproceeds ~ be donated 收入被捐出 → benefited financially 在財務上受益\n\n**單字** share (v.) 分享，共有；benefit (v.) 得益，受惠\n\n<!-- page 267 -->\n### Questions 156-157 refer to the following e-mail.\n156-157 題參照以下電子郵件。\n\n> TO: Barry Maddocks <bmad@appletonman.com>\n> FROM: Wilma Haynes <wilhay@appletonman.com>\n> SUBJECT: Launch reminder\n> DATE: March 28\n>\n> I just wanted to send out a reminder regarding our product launch next week. [156] All members of the advertising department will be required to attend one of the following events and assist where needed:\n>\n> [157-A] April 4: 10:30 a.m. Presentation of Jui-C-Ness beverage line at Cole Supermarket\n> April 4: 7:30 p.m. Grand Gala Launch Cocktail Reception at Newcroft Hotel\n> [157-A] April 5: 10 a.m. [157-C] Presentation of Promotional Campaign at Appleton Manufacturers' corporate headquarters\n> April 5: 7 p.m. Investors' Banquet, Presentation of Promotional Campaign at Newcroft Hotel\n>\n> Please inform your team leader of your top two preferences for assignments by the end of tomorrow. We will do our best to accommodate selections but cannot guarantee that your choices will be available. Thanks for your cooperation.\n>\n> Wilma Haynes\n> Departmental director\n\n**翻譯**\n> 收件者 Barry Maddocks <bmad@appletonman.com>\n> 寄件者 Wilma Haynes <wilhay@appletonman.com>\n> 主旨 上市提醒\n> 日期 3 月 28 日\n>\n> 我只是想寄信提醒關於下禮拜產品上市的事情。[156] 廣告部門的所有員工都必須出席以下其中一場活動，並且在任何需要的地方給予協助：\n>\n> [157-A] 4 月 4 日：上午 10:30 在 Cole 超市的 Jui-C-Ness 飲料系列發表會\n> 4 月 4 日：晚上 7:30 在 Newcroft 飯店慶祝產品上市的大型雞尾酒會\n> [157-A] 4 月 5 日：上午 10 點 [157-C] 在 Appleton Manufacturers 公司總部的宣傳活動發表會\n> 4 月 5 日：晚上 7 點在 Newcroft 飯店的投資者宴會及宣傳活動發表會\n>\n> 請在明天結束前將希望分配到的前二志願告知你的組長。我們會盡力符合大家的選擇，但不能保證可以安排你所選擇的活動。謝謝大家的配合。\n>\n> Wilma Haynes\n> 部長\n\n**單字** launch (n.) 發動，上市（活動）；beverage (n.) 飲料；gala trip\n- (C) Made some new acquaintances at an event\n- (D) Applied for a part-time position\n\n> Phillips 小姐上週做了什麼？\n> (A) 出席佛羅里達的行銷研討會\n> (B) 確定出差的安排事項\n> (C) 在活動中認識了新的人\n> (D) 應徵兼職工作\n\n**wh- 問題** What\n這是問 Phillips 小姐上週做了什麼（What）的 wh- 問題，所以要尋找和問題重點 Ms. Phillips do last week 相關的內容。「I came away with several new contacts who can help me promote my establishment, Oleandar Hotel」的部分提到，她離開活動的收穫是認識了幾個可以幫忙宣傳她的 Oleandar 飯店的人，所以 (C)\n\n<!-- page 270 -->\nMade some new acquaintances at an event 是正確答案。和 (A) 相關的部分是「It was terrific seeing you at the tourism conference in Miami last week.」，表示她參加的是觀光業會議，而不是行銷會議，所以 (A) 不〔…〕\n\n**替換表達**\ncame away with several new contacts 認識了幾個新的聯絡人而離開 → Made some new acquaintances 認識〔…〕一些新的人\n\n**159.** 答案 (D)｜難度：中\nWhat is indicated about Ms. Harwood?\n- (A) She presently works as a consultant.\n- (B) She is looking for a job in Miami.\n- (C) She is planning a vacation in Orlando.\n- (D) She has been with Oleandar Hotel for six years.\n\n> 關於 Harwood 小姐，文中提到什麼？\n> (A) 她目前擔任顧問。\n> (B) 她正在找邁阿密的工作。\n> (C) 她正在計畫奧蘭多的假期。\n> (D) 她在 Oleandar 飯店工作了六年。\n\n**Not/True** True 問題\n這是需要在文章中找到與關鍵字 Ms. Harwood 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A) 在文中沒有提到。和 (B)、(C) 相關的部分是「The marketing manager currently working ~ here in New Orleans will be relocating to Orlando next summer, and she will be searching for employment.」，表示目前在紐奧良〔…〕任行銷經理的 Harwood 小姐明年要搬到奧蘭多，到時候要找工作，不符合選項敘述。(D) 對應文中的「Her name is Anna Harwood, and I have known her for six years.」和「She has been fantastic to work with here at the Oleandar」，表示寄件人認識 Anna Harwood 六年了，和她在 Oleandar 飯店共事很愉快，符合選項敘述，所以 (D) She has been with Oleandar Hotel for six years 是正確答案。\n\n**替換表達**\nsearching for employment 尋找工作 → looking for a job 尋找工作\n\n**單字** presently (adv.) 現在，目前；look for (phr.) 尋找\n\n**160.** 🆕 答案 (D)｜難度：高\nIn which of the positions marked [1], [2], [3], and [4] does the following sentence best belong?\n\"I believe the role you're offering also requires staff supervision and client communication.\"\n- (A) [1]\n- (B) [2]\n- (C) [3]\n- (D) [4]\n\n> 以下這個句子最適合放在文中標記 [1]、[2]、[3]、[4] 的哪一個位置？\n> 「我相信你提供的職位也需要管理員工並與客戶溝通。」\n> (A) [1]\n> (B) [2]\n> (C) [3]\n> (D) [4]\n\n**找出句子位置**\n這是要依照文章的內容架構，判斷句子應該插入哪個位置的題目。題目所給的句子「I believe the role you're offering also requires staff supervision and client communication.」表示 Robert Crowley 提供的工作職務〔…〕須管理員工、與客戶溝通，所以應該接在提到這兩種能力的內容之後。[4] 的上一句「Currently, she oversees a staff of about 30 employees and presides over most client meetings for her department.」提到〔…〕Anna Harwood 監督大約 30 名員工，並且為她的部門主持大部分的客戶會議，而在 [4] 的位置插入〔…〕後，表示 Robert Crowley 提供的工作職務和 Anna Harwood 目前所做的事類似，文意前後連貫，所以 (D) [4] 是正確答案。\n\n**單字** supervision (n.) 管理，監督\n\n<!-- page 271 -->\n### Questions 161-163 refer to the following article.\n161-163 題參照以下報導。\n\n> *Business Buzz Weekly*\n>\n> Sustainability and Your Business\n> By Jonathan Demarco\n> November 14\n>\n> Increasingly aware of the importance of environmental sustainability, [161] growing numbers of businesses are taking steps to adopt ethical methods of production. However, some people wonder whether these changes are worth doing.\n>\n> [162-B] Business consultant and ethical sustainability [161/162-B] expert Andrea McGibbon says, \"Yes, they most certainly are.\" According to her, [162-D] at least 10 major corporations that have recently improved their environmental and social sustainability practices have had overwhelmingly positive responses. [162-A] She goes on to mention that over 75 percent of consumers of such corporations also stated that they were much more likely to purchase products from brands that have concern for the environment. [162-C] She also noted that the corporations which implemented such practices have reported no significant difference in profit margins.\n>\n> Nonetheless, [161] other experts contend that cost is a major factor to consider. Replacing factory equipment with eco-friendly devices, for example, can be a very expensive task. Subsequently, a company may try to recover this cost by increasing the selling price of goods. And ultimately, it is argued, consumers are more likely to buy merchandise based on its price, not on how it was produced.\n>\n> [163] Style Be With You, a mid-sized casual fashion brand, recently put these issues to the test. Upon releasing a new line of ethically produced sweaters made from organic materials, management found that overall sales for the quarter increased. Despite more customers being attracted to the brand's new responsible image, however, sales for the sweaters fell below projected forecasts. [163] Once customers were in their stores, it seemed, they chose to buy products that were cheaper rather than environmentally friendly. In doing so, they have shown that price still dominates ethics.\n\n**翻譯**\n\n> 《Business Buzz 週刊》\n>\n> 永續性與你的企業\n> Jonathan Demarco 撰文\n> 11 月 14 日\n>\n> 因為越來越認知到環境永續性的重要，所以 [161] 越來越多企業正實行措施以採用合乎環境倫理的生產方式。然而，有些人疑惑這些改變是否值得。\n>\n> [162-B] 企業顧問暨環境倫理永續性 [161/162-B] 專家 Andrea McGibbon 表示：「是的，大部分的改變絕對是值得的。」根據她的說法，[162-D] 最近改善了環境及社會永續性措施的至少 10 家主要企業，得到非常正面的反應。[162-A] 她接著提到，這類公司超過 75% 的消費者也表示，他們購買環保品牌產品的可能性高出許多。[162-C] 她也提到，實行這類措施的企業所發表的利潤率數字（和未實施時）並沒有很大的差別。\n>\n> 儘管如此，[161] 其他專家主張，成本是需要考慮的主要因素。例如，將工廠設備替換成環保的設備可能非常昂貴。結果，公司可能試圖藉由提高產品販售價格來彌補這筆成本。他們主張，消費者最終比較可能是根據價格而不是生產方式來購買商品。\n>\n> [163] 中型規模的休閒時尚品牌 Style Be With You 最近測試了這些議題。發售有機素材製成，並以符合環境倫理方式生產的新系列毛衣時，經營團隊發現當季整體營業額增加了。不過，雖然有更多顧客受到品牌負責任的新形象吸引，但這些毛衣的營業額低於預期。[163] 當消費者進入店內，他們似乎選擇購買比較便宜的產品，而不是環保的產品。這樣的行為顯示價格仍然比環境倫理重要。\n\n**單字** sustainability (n.) 永續性；adopt (v.) 採用，採行；certainly (adv.) 當然，確實；implement (v.) 實施；subsequently (adv.) 隨後，接著；project (v.) 預測，預計；aware (adj.) 知道的，察覺的；ethical (adj.) 倫理的，道德的；overwhelmingly (adv.) 壓倒性地；contend (v.) 主張；merchandise (n.) 商品；forecast (n.) 預測，預報；step (n.) 步驟，措施；method (n.) 方法；concern (n.) 關心，擔心；factor (n.) 因素，要素；material (n.) 材料，布料；dominate (v.) 佔優勢\n\n<!-- page 272 -->\n**161.** 答案 (A)｜難度：高\nWhat is the main purpose of the article?\n- (A) To compare opinions on sustainable businesses practices\n- (B) To criticize wasteful corporate spending\n- (C) To describe laws affecting company proprietors\n- (D) To promote ethical production methods\n\n> 這篇報導的主要目的是什麼？\n> (A) 為了比較關於企業永續性措施的不同意見\n> (B) 為了批評浪費的企業支出\n> (C) 為了描述影響企業主的法規\n> (D) 為了宣傳符合環境倫理的生產方式\n\n**尋找主題／目的** 文章的目的\n這是詢問報導目的的尋找主題問題。這一題比較特殊，必須綜合整篇文章的內容才能找出主題。「growing numbers of businesses are taking steps to adopt ethical methods of production」和「expert Andrea McGibbon says, \"Yes, they most certainly are.\"」的部分提到有越來越多業者採取符合環境倫理的生產方式，而 Andrea McGibbon 說這樣做絕對值得；另一方面，「other experts contend that cost is a major factor to consider」提到其他專家認為成本是必須考量的重要因素，並且提出支持這個相反意見的依據。所以，(A) To compare opinions on sustainable businesses practices 是正確答案。\n\n**單字** wasteful (adj.) 浪費的；proprietor (n.) 業主，所有人\n\n**162.** 答案 (D)｜難度：高\nWhat was NOT mentioned by Andrea McGibbon?\n- (A) Many consumers look favorably upon sustainable brands.\n- (B) There is value in sustainable business methods.\n- (C) Some corporations have reported little change in profitability.\n- (D) Fewer than 10 companies have modified their practices.\n\n> Andrea McGibbon 沒有提到什麼？\n> (A) 許多消費者正面看待支持永續性的品牌。\n> (B) 符合永續性的企業模式是有價值的。\n> (C) 一些企業的獲利能力幾乎沒有改變。\n> (D) 只有不到 10 家公司改變了做法。\n\n**Not/True** Not 問題\n這是需要在文章中找到關鍵字 Andrea McGibbon 提到的內容，並且與選項敘述對照的 Not/True 問題。(A) 對應文中的「She goes on to mention that over 75 percent of consumers of such corporations also stated that they were much more likely to purchase products from brands that have concern for the environment.」，表示她（Andrea McGibbon）提到有超過 75% 的消費者表示比較可能購買考慮環境的品牌所製造的產品，符合選項敘述。(B) 對應文中的「Business consultant and ethical sustainability expert Andrea McGibbon says, \"Yes, they most certainly are.\"」，表示企業顧問暨環境倫理永續性專家 Andrea McGibbon 認為，改用合乎環境倫理的生產方式是很值得的，符合選項敘述。(C) 對應文中的「She also noted that the corporations which implemented such practices have reported no significant difference in profit margins.」，表示她提到實施這類措施的企業在利潤率方面沒有很大的改變，符合選項敘述。和 (D) 相關的部分是「at least 10 major corporations that have recently improved their environmental and social sustainability practices」，表示至少有 10 家主要企業改善了環境及社會永續性措施，不符合選項敘述，所以 (D) Fewer than 10 companies have modified their practices 是正確答案。\n\n**單字** favorably (adv.) 善意地，正面地；profitability (n.) 獲利能力；modify (v.) 修改，更改\n\n<!-- page 273 -->\n**163.** 答案 (C)｜難度：最高\nAccording to the author, what has the example of Style Be With You revealed?\n- (A) Companies are reluctant to make changes.\n- (B) Maintaining a responsible image is fairly inexpensive.\n- (C) People are not willing to pay more for ethically produced goods.\n- (D) Clothes made with organic materials are becoming more popular.\n\n> 根據作者所寫的，Style Be With You 的例子透露出什麼？\n> (A) 各家公司不情願作出改變。\n> (B) 維持負責任的形象不怎麼昂貴。\n> (C) 人們不願意多花錢購買以符合環境倫理的方式製造的產品。\n> (D) 以有機素材製造的衣服越來越受歡迎。\n\n**wh- 問題** What\n這是問 Style Be With You 的例子透露出什麼（What）的 wh- 問題，所以要尋找和問題重點 the example of Style Be With You revealed 相關的內容。「Style Be With You, a mid-sized casual fashion brand, recently put these issues to the test.」的部分提到，Style Be With You 這家中型休閒時尚品牌最近測試了關於永續性生產方式的議題，結果「Once customers were in their stores, it seemed, they chose to buy products that were cheaper rather than environmentally friendly.」，表示顧客在店裡似乎會選擇比較便宜而不是比較環保的產品，所以 (C) People are not willing to pay more for ethically produced goods 是正確答案。\n\n**單字** reluctant (adj.) 不情願的，勉強的\n\n<!-- page 274 -->\n\n### Questions 164-167 refer to the following online chat discussion. 🆕\n164-167 題參照以下網路聊天討論。\n\n> **Gail Royce** 7:32 p.m.\n> So, [167] are we all ready for the product launch tomorrow? Let me know if there is anything else we need to do. We won't have much time, as the event starts at 11 a.m.\n>\n> **Reena Singh** 7:36 p.m.\n> My team and I have the venue nearly ready. We have a few large banners to hang in the morning, but everything else has been set up.\n>\n> **Roger Bryce** 7:37 p.m.\n> [165] We have to make some final lighting adjustments in the morning, but the video screens are up and [166-A] the sound system is operational.\n>\n> **Olga Russovich** 7:38 p.m.\n> About 500 guests have confirmed, but a few more may show up .) 茶點；reserve (v.) 保留，預約（座位等）；(n.) 儲備（的東西）；showcase (v.) 展示；(n.) 展示櫃；venue (n.) 場所；adjustment (n.) 調整，適應；press (n.) 報章媒體；(v.) 壓；proceed (v.) 進行；access (n.) 入場；(v.) 接近，進入；banner (n.) 布條，橫幅廣告；operational (adj.) 運作中的；caterer (n.) 外燴業者；journalist (n.) 記者；display (n.) 展示物；(v.) 展示\n\n<!-- page 275 -->\n\n**164.** 🆕 答案 (B)｜難度：中\nAt 7:46 p.m., what does Ms. Royce most likely mean when she writes, \"That's a shame\"?\n- (A) She does not believe that a banner's design is attractive.\n- (B) She expected more media members to attend an event.\n- (C) She wanted a product display to be finished earlier in the day.\n- (D) She was disappointed that some video screens are out of order.\n\n> 在晚上 7:46，Royce 小姐說的「That's a shame」是什麼意思？\n> (A) 她覺得布條的設計不吸引人。\n> (B) 她期望有更多媒體人士參加活動。\n> (C) 她希望某個產品展示可以在當天稍早時完成。\n> (D) 她對於某些影片螢幕故障感到失望。\n\n**掌握意圖**\n題目問 Royce 小姐的意思，所以要掌握引用部分（That's a shame）上下文的情境。Gail Royce 說「why are so few members of the press coming?」，問為什麼會到場的記者那麼少，Olga Russovich 回答說「There is an important meeting at City Hall at the same time. Many local journalists need to attend that instead.」，表示是因為同時在市政府有一場很重要的會議，很多記者必須去那場會議而不能參加產品上市活動。於是 Royce 小姐說「That's a shame.」（真可惜），表示她期望有更多媒體人士參加活動，所以 (B) She expected more media members to attend an event 是正確答案。\n\n**替換表達** members of the press 記者 → media members 媒體人士\n\n**單字** media (n.) 媒體；out of order (phr.) 故障的，不能正常運作的\n\n**165.** 答案 (C)｜難度：低\nWhat will Mr. Bryce do the following morning?\n- (A) Hang up some signs\n- (B) Conduct a video presentation\n- (C) Make some equipment adjustments\n- (D) Show guests to their seats\n\n> Bryce 先生隔天上午會做什麼？\n> (A) 懸掛看板\n> (B) 進行視訊報告\n> (C) 調整設備\n> (D) 帶領來賓入座\n\n**wh- 問題 What**\n這是問 Bryce 先生隔天上午會做什麼（What）的 wh- 問題，所以要尋找和問題重點 Mr. Bryce do the following morning 相關的內容。Roger Bryce 說「We have to make some final lighting adjustments in the morning」，表示他在活動那天早上要對燈光做最後調整，所以 (C) Make some equipment adjustments 是正確答案。\n\n**替換表達** lighting 照明，燈光 → equipment 設備\n\n**單字** sign (n.) 看板，招牌，標誌；conduct (v.) 實施，進行\n\n<!-- page 276 -->\n\n**166.** 答案 (C)｜難度：高\nWhat is NOT true about the event venue?\n- (A) Its sound system is ready for use.\n- (B) It has a food and drink service area.\n- (C) Its press zone will be expanded.\n- (D) It can be opened early by a supervisor.\n\n> 關於活動會場，何者不正確？\n> (A) 音響系統已經準備好供使用了。\n> (B) 有飲食服務區域。\n> (C) 媒體區將會擴大。\n> (D) 可以由管理者提早開放。\n\n**Not/True Not 問題**\n這是需要在文章中找到與關鍵字 the event venue 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A) 對應 Roger Bryce 說的「the sound system is operational」，表示音響系統已經可以運作，符合選項敘述。(B) 對應 Olga Russovich 說的「The caterer has also set up the food table and refreshment counter.」，表示〔…〕業者已經設置好陳列飲食的桌子和茶點吧台，符合選項敘述。和 (C) 相關的部分是 Gail Royce 說的「if you need, feel free to use up to half of the press area for further product displays」，表示如果需要的話可以把媒體〔…〕區域的一半用來陳列更多產品，不符合選項敘述，所以 (C) Its press zone will be expanded 是正確答案。(D) 對應 Roger Bryce 說的「I asked the venue manager today, and he can be there earlier than usual, at 7 a.m., to give us access.」，表示場地管理者可以在比平常更早的上午 7 點到會場，讓準備活動的人進入，符合選項敘述。\n\n**替換表達** operational 可運作的 → ready for use 準備好供使用的\nthe food table and refreshment counter 陳列飲食的桌子和茶點吧台 → a food and drink service area 飲食〔…〕\nmanager 管理者 → supervisor 管理者\n\n**單字** expand (v.) 擴張，擴大；supervisor (n.) 管理者，主管\n\n**167.** 答案 (C)｜難度：高\nWhat type of company does Ms. Singh most likely work for?\n- (A) A local newspaper\n- (B) An event planning agency\n- (C) A jewelry manufacturer\n- (D) A convention center\n\n> Singh 小姐最有可能在哪種公司工作？\n> (A) 地方報社\n> (B) 活動企畫公司\n> (C) 珠寶製造商\n> (D) 會議中心\n\n**推論 細節資訊**\n這是關於題目關鍵字 Ms. Singh ~ work for 的推論問題。Gail Royce 問「are we all ready for the product launch tomorrow?」，想知道明天的產品上市活動是否完全準備妥當了，而 Reena Singh 說「There are a couple of jewelry displays that seem rather crowded, so I'll move some things ~. We will want to showcase our new products in the best way ~.」，表示有些珠寶展示顯得有點擠，所以會移動一些東西，希望盡量用最好的方式〔…〕們的新產品，可以推知 Singh 小姐應該是珠寶製造商的員工，所以 (C) A jewelry manufacturer 是正確答案。\n\n**單字** agency (n.) 代辦公司；manufacturer (n.) 製造商\n\n<!-- page 277 -->\n\n### Questions 168-171 refer to the following letter.\n168-171 題參照以下信件。\n\n> Baxter Communications\n> 87 Hollowbrook Road\n> Bloomington, IL 61704\n>\n> Melinda Armin\n> 73 Lessenger Drive\n> Bloomington, IL 61704\n>\n> Dear Ms. Armin,\n>\n> Thank you for signing up for Baxter's Cable Plus package, which includes all the basic television channels plus movie and educational networks. — [1] —. [168] This letter is to remind you of the terms of service as stipulated in the standard contract.\n>\n> First and foremost, the account holder must use the cable service for lawful purposes only. — [2] —. [171] It is strictly prohibited to copy any program for the purposes of distributing it on the Internet without the express permission of the program's producers or of Baxter Communications. [171] Similarly, profiting from a full or partial copy of a program through sale or rental is also forbidden. — [3] —.\n>\n> Baxter agrees to maintain service for as long as the customer follows the stipulations and pays for use. Service includes continued delivery of cable programming, repairs, and general maintenance of the cable box. However, [170] repairs or replacement due to damage or loss caused by the user is the financial responsibility of the client.\n>\n> [169-D] Baxter Communications is the top cable, Internet, and phone service provider in the city. — [4] —. As such, we look forward to many more years of doing business with you.\n>\n> Sincerely,\n>\n> Otto Weed\n> Accounts manager, Baxter Communications\n\n**翻譯**\n> Baxter Communications 公司\n> 87 號，Hollowbrook 路\n> 布盧明頓，伊利諾州 61704\n>\n> Melinda Armin\n> 73 號，Lessenger 路\n> 布盧明頓，伊利諾州 61704\n>\n> 親愛的 Armin 小姐：\n>\n> 感謝您登記使用 Baxter 公司的 Cable Plus 方案，其中包括所有基本電視頻道，還有電影與教育電視網。— [1] —。[168] 這封信是要提醒您標準合約中規定的服務條款。\n>\n> 首先最重要的是，帳戶持有人必須僅為合法目的使用有線電視服務。— [2] —。[171] 未經節目製作者或 Baxter Communications 公司特別許可拷貝任何節目並於網路散布，是嚴格禁止的。[171] 同樣地，販賣或出租完整或部分節目獲利也是禁止的。— [3] —。\n>\n> Baxter 同意在顧客遵守規定並支付使用費的情況下維持服務。服務包括持續播送有線電視節目、維修，以及有線電視盒的一般維護。然而，[170] 由使用者造成的損害或遺失之維修或替換，費用必須由客戶負擔。\n>\n> [169-D] Baxter Communications 公司是市內第一的有線電視、網路暨電話服務提供者。— [4] —。所以，我們期望未來多年都能與您持續往來。\n>\n> Otto Weed\n> 客戶經理，Baxter Communications 公司\n\n**單字** sign up (phr.) 登錄，加入；stipulate (v.) 規定；account (n.) 帳戶；prohibit (v.) 禁止；permission (n.) 許可，允許；rental (n.) 租賃，出租，租金；provider (n.) 提供者，服務提供業者；network (n.) 廣播電視網，通訊網；first and foremost (phr.) 首先，比什麼都重要地；lawful (adj.) 合法的；distribute (v.) 分發，散布；profit (v.) 獲利，盈利；(n.) 利潤；forbid (v.) 禁止；term (n.) 條件，期間；strictly (adv.) 嚴格地，嚴密地；express (adj.) 特別的，明確的；(v.) 表達；partial (adj.) 部分的；replacement (n.) 替換，代替\n\n<!-- page 278 -->\n\n**168.** 答案 (C)｜難度：中\nWhy was the letter written?\n- (A) To terminate a customer contract\n- (B) To offer a discount on packages\n- (C) To explain agreement guidelines\n- (D) To provide an update on repairs\n\n> 為什麼寫了這封信？\n> (A) 為了終止顧客契約\n> (B) 為了提供套裝方案的折扣\n> (C) 為了說明合約準則\n> (D) 為了提供維修的最新情況說明\n\n**尋找主題／目的 寫文章的理由**\n這是問寫信理由的尋找主題問題，所以要特別注意文章開頭的部分。「This letter is to remind you of the terms of service as stipulated in the standard contract.」表明這封信是為了提醒收件人合約中規定的服務條〔…〕款，所以 (C) To explain agreement guidelines 是正確答案。\n\n**替換表達** terms ~ stipulated in the ~ contract 合約規定的條件 → agreement guidelines 合約準則\n\n**單字** terminate (v.) 終止，結束；agreement (n.) 協議，合約；guideline (n.) 準則，指南\n\n**169.** 答案 (D)｜難度：高\nWhat is mentioned about Baxter Communications?\n- (A) It has its own television channel.\n- (B) It updated its subscription policies.\n- (C) It will terminate a video rental service.\n- (D) It offers multiple services to customers.\n\n> 關於 Baxter Communications 公司，文中提到什麼？\n> (A) 擁有自己的電視頻道。\n> (B) 更新了服務租用政策。\n> (C) 將會結束影片出租服務。\n> (D) 為顧客提供多種服務。\n\n**Not/True True 問題**\n這是需要在文章中找到與關鍵字 Baxter Communications 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A)、(B)、(C) 在文中沒有提到。(D) 對應文中的「Baxter Communications is the top cable, Internet, and phone service provider in the city.」，表示 Baxter Communications 公司是市內第一的有線電視、網路暨電話〔…〕服務提供者，符合選項敘述，所以 (D) It offers multiple services to customers 是正確答案。\n\n**替換表達** cable, Internet, and phone service provider 有線電視、網路暨電話服務提供者 → multiple services 多種服務\n\n**單字** subscription (n.) 訂閱，長期租用服務；multiple (adj.) 多樣的，多種的\n\n**170.** 答案 (A)｜難度：中\nWhy might service users have to pay an additional fee?\n- (A) If they damage a cable box\n- (B) If they record a program\n- (C) If they pay an invoice late\n- (D) If they cancel a service early\n\n> 服務使用者可能因為什麼原因而必須支付〔…〕額外的費用？\n> (A) 損壞有線電視盒\n> (B) 錄下節目\n> (C) 逾期付帳\n> (D) 提早取消服務\n\n**wh- 問題 Why**\n這是問使用者可能因為什麼原因（Why）而必須付額外費用的 wh- 問題，所以要尋找和問題重點 service users ~ pay an additional fee 相關的內容。「repairs or replacement due to damage or loss caused by the user is the financial responsibility of the client」的部分提到，由使用者造成的損害或遺失之維修或替換，費用必須由客〔…〕戶負擔，所以 (A) If they damage a cable box 是正確答案。\n\n**替換表達** pay an additional fee 支付額外費用 → financial responsibility 財務上（付款）的義務\n\n<!-- page 279 -->\n\n**171.** 🆕 答案 (C)｜難度：最高\nIn which of the positions marked [1], [2], [3], and [4] does the following sentence best belong?\n\"Failure to abide by any of these regulations could result in termination of services without further notice or even legal penalties.\"\n- (A) [1]\n- (B) [2]\n- (C) [3]\n- (D) [4]\n\n> 以下這個句子最適合放在文中標記 [1]、[2]、[3]、[4] 的哪一個位置？\n> 「未能遵守以上任何規定，可能導致不經通知即終止服務，甚至法律處罰。」\n> (A) [1]\n> (B) [2]\n> (C) [3]\n> (D) [4]\n\n**找出句子位置**\n這是要依照文章的內容架構，判斷句子應該插入哪個位置的題目。題目所給的句子「Failure to abide by any of these regulations could result in termination of services without further notice or even legal penalties.」表示對於前面提到的規定，如果不遵守的話，公司可能不通知就終止服務，甚至可能導致使用者遭受法律處罰，所以應該接在提到規定的內容之後。[3] 前面部分的「It is strictly prohibited to copy any program for the purposes of distributing it on the Internet without the express permission」提到，未經特別許可拷貝任何節目並於網路散布，是嚴格禁止的，而 [3] 的上一句「Similarly, profiting from a full or partial copy of a program through sale or rental is also forbidden.」則提到販賣或出租完整或部分節目獲利也是禁止的。在 [3] 的位置插入句子之後，表示如果不遵守前面提到的規定，會發生什麼事情，文意前後連貫，所以 (C) [3] 是正確答案。\n\n**單字** abide by (phr.) 遵守，遵從…；regulation (n.) 規定，規範；result in (phr.) 導致…；termination (n.) 終止，結束；penalty (n.) 處罰，不利結果\n\n<!-- page 280 -->\n\n### Questions 172-175 refer to the following article.\n172-175 題參照以下報導。\n\n> ***Outer Reaches* Celebrates 40th Anniversary with Screening in London**\n>\n> [172] Director Francis Templeton's acclaimed science fiction film *Outer Reaches* will be shown on October 12 at London's Empire Theater as part of the city's weeklong celebration of classic films of the genre. The screening falls on the 40th anniversary of the movie's premiere. Its musical score will be performed live by the Sydney Symphony Orchestra and Sydney Chamber Singers conducted by Luigi Ludovico.\n>\n> [173-A] At the time of its opening, *Outer Reaches* had a modest reception at the box office, barely breaking even at the end of its initial run. Yet [173-B] the film managed to make an impact on some of its viewers and, over successive years, attracted loyal fans. [173-B/D] A decade after its premiere, the movie achieved cult status [173-D] and has even made its way back into several cinemas across the nation.\n>\n> Several of today's best-known creative minds have credited *Outer Reaches*, and indeed the work of Templeton in general, with influencing their own style of filmmaking. For instance, multi-awarded director Everett Walsh has repeatedly stated that his film *Dry Run* was inspired by the main character in *Outer Reaches*. Cinematographer Gail Ferguson derived her photographic style from the look of the film. And [174] numerous others have said *Outer Reaches* broke new ground in the art and science of moviemaking, advancing the use of special effects and transcending the boundaries of what a science fiction film should be.\n>\n> Whether or not one is a fan of the science fiction genre, *Outer Reaches* is still worth seeing. It has a beautifully presented and engaging story. Moreover, many audiences will find that its universal themes are highly relevant. With the aid of a live musical score, its vibrancy and brilliance will be highlighted all the more.\n\n**翻譯**\n> **《Outer Reaches》於倫敦放映，慶祝〔…〕40 週年**\n>\n> [172] Francis Templeton 導演受到讚譽的〔…〕科幻電影《Outer Reaches》將於 10〔…〕月 12 日在倫敦的 Empire 戲院放映，〔…〕作為該市讚頌經典科幻片、為期一週〔…〕活動的一環。放映日是這部電影首映〔…〕40 週年。電影配樂將由雪梨交響樂團〔…〕及雪梨室內合唱團現場演出，由 Luigi〔…〕Ludovico 指揮。\n>\n> [173-A]《Outer Reaches》剛上映時，票〔…〕房反應平平，在首輪結束時勉強達到損〔…〕益平衡。然而 [173-B] 本片對部分觀眾造成〔…〕深刻的影響，在接下來幾年吸引了一群〔…〕忠實的愛好者。[173-B/D] 首映 10 年後，這〔…〕部電影達到了小眾狂熱支持的地位，〔…〕[173-D] 甚至在全國數家戲院再度上映。\n>\n> 有幾位現今最知名的創意人士表示，〔…〕《Outer Reaches》和 Templeton 的整〔…〕體作品影響了他們自己的拍片風格。例〔…〕如，曾獲得多項大獎的導演 Everett〔…〕Walsh 一再表明自己的電影《Dry〔…〕Run》的靈感來自於《Outer〔…〕Reaches》的主要角色。電影攝影師〔…〕Gail Ferguson 從這部電影的影像發展〔…〕出自己的拍攝風格。還有 [174] 許多人認為〔…〕《Outer Reaches》開拓了電影拍攝藝〔…〕術與科學的新境界，尤其是讓特殊效果的運〔…〕用有所進步，並且超越了科幻電影應有〔…〕樣貌的疆界。\n>\n> 不論是不是科幻類電影的愛好者，〔…〕《Outer Reaches》仍然值得一看。它〔…〕有呈現出色又引人入勝的劇情。而且，〔…〕許多觀眾會發現它具普世性的主題是非〔…〕常適切的。有了現場演奏配樂助陣，本〔…〕片的活力與卓越將更顯得突出。\n\n**單字** acclaim (v.) 稱讚，喝采；modest (adj.) 不太大的，謙虛的；break even (phr.) 損益兩平；impact (n.) 衝擊，很大的影響；cult (adj.) 受到某些人狂熱追捧的；(n.) 膜拜，狂熱崇拜；indeed (adv.) 確實，實際上；repeatedly (adv.) 一再，多次；derive A from B (phr.) 從 B 衍生出 A；advance (v.) 使進步，使向前；worth (adj.) 值得…的；vibrancy (n.) 活力，精力充沛；premiere (n.) 首映，初次上演；reception (n.) 接受，反應；initial (adj.) 初次的，最初的；successive (adj.) 接下來的，連續的；in general (phr.) 整體上；inspire (v.) 給予靈感，鼓舞；transcend (v.) 超越，勝過；universal (adj.) 普遍的，普世的；brilliance (n.) 卓越，才華橫溢；conduct (v.) 指揮，進行；box office (phr.) 票房；run (n.) （連續的）上映期間〔…〕；mind (n.) 有才智的人，智力；influence (v.) 影響；(n.) 影響；cinematographer (n.) 電影攝影師〔…〕；break new ground (phr.) 開拓新領域〔…〕；boundary (n.) 邊界，界線；aid (n.) 幫助，援助；(v.) 幫助\n\n<!-- page 281 -->\n\n**172.** 答案 (D)｜難度：中\nWhat is the purpose of the article?\n- (A) To describe a promising movie director\n- (B) To discuss a particular genre of film\n- (C) To explain how a production was made\n- (D) To announce a special event\n\n> 這篇報導的目的是什麼？\n> (A) 為了描述一位前途有望的電影導演\n> (B) 為了討論特定類型的電影\n> (C) 為了說明某部電影是怎麼製作的\n> (D) 為了宣布一場特別活動\n\n**尋找主題／目的 文章的目的**\n這是問報導目的的尋找主題問題，所以要特別注意文章開頭的部分。「Director Francis Templeton's acclaimed science fiction film *Outer Reaches* will be shown ~ as part of the city's weeklong celebration of classic films of the genre.」提到，將會放映 Francis Templeton 導演受到讚揚的科幻電影《Outer Reaches》，作為市內讚頌經典科幻片的活動的一環，所以 (D) To announce a special event 是正確答案。\n\n**單字** promising (adj.) 前途有望的；production (n.) 製作，製作作品（電影、戲劇等）\n\n**173.** 答案 (B)｜難度：高\nWhat is stated about *Outer Reaches*?\n- (A) It broke box office records at the time of its premiere.\n- (B) It accumulated fans over a decade-long period.\n- (C) It received numerous awards when first released.\n- (D) It is rarely shown in theaters anymore.\n\n> 關於《Outer Reaches》，文中提到什麼？\n> (A) 首映時就打破了票房紀錄。\n> (B) 在 10 年期間裡累積了一群愛好者。\n> (C) 剛發行時就獲得許多獎項。\n> (D) 已經很少在戲院上映了。\n\n**Not/True True 問題**\n這是需要在文章中找到與關鍵字 *Outer Reaches* 相關的資訊，並且與選項敘述對照的 Not/True 問題。和 (A) 相關的部分是「At the time of its opening, *Outer Reaches* had a modest reception at the box office」，表示《Outer Reaches》一開始票房還好而已，不符合選項敘述。(B) 對應文中的「the film managed to make an impact on some of its viewers and, over successive years, attracted loyal fans. A decade after its premiere, the movie achieved cult status」，表示這部電影成功在某些觀眾心中造成很大的影響，在其後幾年吸引了忠實粉絲，並且在 10 年後達到了小眾狂熱支持的地位，符合選項敘述，所以 (B) It accumulated fans over a decade-long period 是正確答案。(C) 在文中沒有提到。和 (D) 相關的部分是「A decade after its premiere, the movie ~ has even made its way back into several cinemas across the nation.」，表示這部片上映 10 年後還能在全國幾家戲院重新上映，不符合選項敘述。\n\n**單字** break (v.) 打破；accumulate (v.) 聚集，累積；rarely (adv.) 很少，難得\n\n<!-- page 282 -->\n\n**174.** 答案 (B)｜難度：中\nHow did Mr. Templeton influence others in his field?\n- (A) By inspiring people to become actors\n- (B) By pioneering the use of certain special effects\n- (C) By writing his own scripts\n- (D) By mixing different genres of film\n\n> Templeton 先生在他的領域怎樣影響其他人？\n> (A) 激勵人們成為演員\n> (B) 率先使用某些特效\n> (C) 自己寫劇本\n> (D) 混合不同的電影類型\n\n**wh- 問題 How**\n這是問 Templeton 先生在他的領域怎樣（How）影響其他人的 wh- 問題，所以要尋找和問題重點 Templeton influence others 相關的內容。「numerous others have said *Outer Reaches* broke new ground in the art and science of moviemaking, advancing the use of special effects」的部分提到，很多人  (C) 查詢運送狀態的號碼\n> (D) 電話專線的開放時間\n\n**Not/True Not 問題**\n這是需要在電子郵件（第一篇文章）中找到相關的資訊，並且與選項敘述對照的 Not/True 問題。這題沒有特定的關鍵字，必須在文中逐一找出與選項相關的內容。(A) 和 (C) 對應文中的「You may track your shipment by visiting www.excelfreight.com and entering this tracking number: XHFG36CIF92.」，表示在運送服務提供業者的網站輸入追蹤號碼就能追蹤貨物，符合選項敘述。(B) 在文中沒有提到，所以 (B) The total cost of his order 是正確答案。(D) 對應文中的「call 555-3083 during our business hours from Monday to Saturday, 7 a.m. to 7 p.m., Eastern Standard Time」，表示可以在公司營業的美東標準時間每週一至週六上午 7 點到晚上 7 點打 555-3083，符合選項敘述。\n\n**替換表達**\ntracking number 追蹤號碼 → A number for checking on the status 查詢狀態的號碼\n\n**178.** 答案 (C)｜難度：中\nWhat does the e-mail indicate about Furry Friends?\n- (A) It responds personally to every message.\n- (B) It assists customers seven days a week.\n- (C) It ships items through a separate company.\n- (D) It allows returns within a given period.\n\n> 關於 Furry Friends 公司，電子郵件中提到什麼？\n> (A) 會親自回覆每則訊息。\n> (B) 每週七天都協助顧客。\n> (C) 透過別的公司運送物品。\n> (D) 允許在一定的期間內退貨。\n\n**推論 細節資訊**\n這是問關於 Furry Friends 公司，電子郵件（第一篇文章）提到什麼的推論問題。電子郵件中的「Shipping will be provided by Excel Freight.」提到，運送服務將由 Excel Freight 公司提供，可以推斷 Furry Friends 公司是透過別的公司運送物品，所以 (C) It ships items through a separate company 是正確答案。\n\n**單字** personally (adv.) 親自，個人地\n\n<!-- page 285 -->\n\n**179.** 答案 (A)｜難度：高\nWhy was Mr. Wright dissatisfied with his experience?\n- (A) He was unable to locate a product.\n- (B) He thought some goods were overpriced.\n- (C) He disliked the limited selection.\n- (D) He received the wrong brand of item.\n\n> 為什麼 Wright 先生對他的經驗不滿意？\n> (A) 他找不到產品在哪裡。\n> (B) 他認為某些產品定價過高。\n> (C) 他不喜歡產品種類有限。\n> (D) 他收到錯誤的產品品牌。\n\n**wh- 問題 Why**\n這是問 Wright 先生為什麼（Why）對他的經驗不滿意的 wh- 問題，所以要看提到與問題重點 Mr. Wright dissatisfied with his experience 相關內容的表格（第二篇文章）。表格中「Ease of navigation」、「☒Dissatisfied」的部分顯示他對瀏覽的容易度不滿意，所以 (A) He was unable to locate a product 是正確答案。\n\n**替換表達**\nnavigation 導航，導覽 → locate a product 找出產品的位置\n\n**單字** locate (v.) 找出位置；overprice (v.) 定價過高\n\n**180.** 答案 (C)｜難度：高\nWhose product did Mr.
