hort film presentation which attempts to shed more light on the mystery behind the ship's unexplained sinking in 1898.\n>\n> \"This will give an opportunity for everyone to see what the ship really looked like inside,\" says museum curator Jonathan Wiley. \"People can walk through the exhibits as if they were passengers on the ship and see the places where some of the richest and most influential people stayed during their trip.\"\n>\n> *The Ocean King* exhibit aims to provide a comprehensive understanding of The Armitage's history, importance, and impact on the shipping industry. [171-D] It will be open Tuesday to Sunday from 9 a.m. to 7 p.m. General admission is $20, while [171-C] students get a 50 percent discount. Children six years old and under are admitted for free. For ticket reservations, visit www.blackwell.org/armitage or call the museum's ticketing office at 555-0391.\n\n**翻譯**\n> Armitage 號來到富勒頓\n>\n> [168] 位於富勒頓的 Blackwell 海事博物館將舉行名為「The Ocean King」的展覽，其中將展出 [169-A] 美國首艘從美國橫越太平洋抵達日本的豪華客船 Armitage 號的歷史。展期為 7 月 1 日至 10 月 30 日，內容包括 [169-D] 5 公尺的 Armitage 號複製模型、重現船隻內部空間，以及私人探察時拾回的 500 多件工藝品。[169-C/171-B] 展覽中也將有介紹短片，試圖說明 1898 年這艘船無法解釋的沉船事件背後的謎團。\n>\n> 館長 Jonathan Wiley 表示：「這場展覽讓大家有機會看到這艘船內部真實的模樣。大家可以像船上的乘客一樣在展示品間行走，並且看到一些最富有、最有影響力的人士在旅程中所住的地方。」\n>\n> 「The Ocean King」展的目標是讓參觀者全面了解 Armitage 號的歷史、重要性，以及對運輸業的影響。[171-D] 展覽將於週二至週日上午 9 點至晚間 7 點開放參觀。一般入場費用為 20 美元，[171-C] 學生享有 50% 的折扣。6 歲以下兒童免費入場。預約門票請至 www.blackwell.org/armitage，或撥 555-0391 聯絡博物館售票處。\n\n**單字** maritime (adj.) 海事的，海的；interior (n.) 內部；(adj.) 內部的；expedition (n.) 探查，探險；unexplained (adj.) 未解釋的，無法說明的；influential (adj.) 有影響力的，有權勢的；admission (n.) 入場費，入場；replica (n.) 複製模型，複製品；artifact (n.) 人造物，工藝品；shed light on (phr.) 解釋清楚…；sinking (n.) 沉沒；(adj.) 下沉中的；aim (v.) 以什麼為目標，瞄準；reconstruction (n.) 重建，再現；recover (v.) 找回，恢復；behind (prep.) 在…背後；curator (n.) 館長，策展人；understanding (n.) 理解，認識\n\n**168.** 答案 (A)｜難度：低\nWhy was the article written?\n- (A) To offer information on an upcoming museum event\n- (B) To provide details about a history lecture\n- (C) To invite people to the opening of a facility\n- (D) To publicize a documentary film\n\n> 為什麼寫了這篇報導？\n> (A) 為了提供即將舉行的博物館活動的資訊\n> (B) 為了提供歷史課講課的細節\n> (C) 為了邀請民眾參加設施的開幕\n> (D) 為了宣傳一部紀錄片\n\n**尋找主題／目的** 寫文章的理由\n這是問報導理由的尋找主題問題，所以要特別注意文章開頭的部分。「The Blackwell Maritime Museum in Fullerton will be holding an exhibition called *The Ocean King*」提到富勒頓的 Blackwell 海事博物館將舉辦「The Ocean King」展，之後則說明展覽的詳細內容，所以 (A) To offer information on an upcoming museum event 是正確答案。\n\n**替換表達**\nMuseum ~ will be holding an exhibition 博物館將舉辦展覽 → an upcoming museum event 即將到來的博物館活動\n\n<!-- page 334 -->\n\n**169.** 答案 (C)｜難度：高\nWhat is true about The Armitage?\n- (A) It was a cargo vessel that sailed in the Pacific region.\n- (B) It was a cruise ship built in Japan.\n- (C) It sank for reasons that are unknown.\n- (D) It underwent renovations to its facilities.\n\n> 關於 Armitage 號，何者正確？\n> (A) 是一艘曾航行於太平洋區域的貨船。\n> (B) 是一艘在日本製造的遊輪。\n> (C) 由於不明原因而沉沒。\n> (D) 進行過設施整修。\n\n**Not/True** True 問題\n這是需要在文章中找到與關鍵字 The Armitage 相關的資訊，並且與選項敘述對照的 Not/True 問題。和 (A) 相關的部分是「The Armitage, ~ luxury passenger ship」，表示 Armitage 是豪華客船，不符合選項敘述。(B) 在文中沒有提到。(C) 對應文中的「There will also be a short film presentation which attempts to shed more light on the mystery behind the ship's unexplained sinking」，表示展覽中會有介紹短片，試圖說明這艘船無法解釋的沉船事件背後的謎團，符合選項敘述，所以 (C) It sank for reasons that are unknown 是正確答案。和 (D) 相關的部分是「a 5-meter replica of The Armitage, reconstructions of the ship's interior」，表示展覽中會有 Armitage 號的複製模型和重現的船隻內部空間，但不是說原本那艘船實際上整修過，不符合選項敘述。\n\n**替換表達**\nunexplained sinking 無法解釋的沉沒 → sank for reasons that are unknown 因為不明的原因而沉沒\n\n**單字** cargo vessel (phr.) 貨船；sail (v.) 航海；cruise ship (phr.) 遊輪\n\n**170.** 答案 (D)｜難度：中\nThe word \"comprehensive\" in paragraph 3, line 1, is closest in meaning to\n- (A) logical\n- (B) interpreted\n- (C) legible\n- (D) thorough\n\n> 第 3 段第 1 行的「comprehensive」，意思最接近\n> (A) 邏輯的\n> (B) 經過解釋的\n> (C) 易讀的\n> (D) 徹底的\n\n**同義詞**\ncomprehensive 在「*The Ocean King* exhibit aims to provide a comprehensive understanding of The Armitage's history」這個句子裡的意思是「全面的」，所以表示「徹底的」的 (D) thorough 是正確答案。\n\n**171.** 答案 (C)｜難度：中\nWhat is mentioned about *The Ocean King* exhibition?\n- (A) It will allow visitors to meet the crew of the ship.\n- (B) It will include a video presentation on the ship's construction.\n- (C) It will admit students at a reduced price.\n- (D) It will be accessible to the public seven days a week.\n\n> 關於「The Ocean King」展，文中提到什麼？\n> (A) 參觀者可以見到船員。\n> (B) 展覽中將有介紹船隻建造過程的影片。\n> (C) 開放學生以折扣價入場。\n> (D) 每週 7 天開放大眾參觀。\n\n**Not/True** True 問題\n這是需要在文章中找到與關鍵字 *The Ocean King* 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A) 在文中沒有提到。和 (B) 相關的部分是「There will also be a short film presentation which attempts to shed more light on the mystery behind the ship's unexplained sinking」，表示會有介紹短片，但內容是關於沉船事件背後的謎團，不符合選項敘述。(C) 對應文中的「students get a 50 percent discount」，表示學生入場有 50% 的折扣，符合選項敘述，所以 (C) It will admit students at a reduced price 是正確答案。和 (D) 相關的部分是「It will be open Tuesday to Sunday」，表示展覽週二至週日開放參觀，不符合選項敘述。\n\n**替換表達**\nget a 50 percent discount 得到 50% 折扣 → at a reduced price 用減低的價格\n\n**單字** crew (n.) 全體船員，全體機務人員\n\n<!-- page 335 -->\n\n### Questions 172-175 refer to the following memo.\n172-175 題參照以下備忘錄。\n\n> Davenport Accounting\n> MEMORANDUM\n>\n> TO: All Staff\n> FROM: Phillip Christensen\n>\n> [172] As most of you are already aware, we will soon be undergoing a complete update of our office hardware. Much of our equipment is quite old and due for replacement this year. — [1] —. [173-A] We will be upgrading our server as well as providing new PCs to everyone who has not received one in the past five years. In addition, [173-C] new printer terminals will be stationed throughout the office. [175] Many of you have also asked for new monitors. — [2] —. [175] We regret that we were unable to authorize all requests as funding is limited.\n>\n> [174] If you are receiving a new computer, please make sure to download all the files you will need onto an external hard drive by Friday. This is important as [173-B] the old equipment will be replaced over the weekend and will be inaccessible to staff from Monday.\n>\n> — [3] —. The technicians hope to complete all the work on Saturday and Sunday. Should there be a delay, you will be notified. If you have any questions, call me at extension 115 or send me an e-mail at philchristensen@davenport.com.\n>\n> — [4] —. Thank you for your cooperation.\n\n**翻譯**\n> Davenport 會計事務所\n> 備忘錄\n>\n> 收件者：所有員工\n> 寄件者：Phillip Christensen\n>\n> [172] 各位大多已經知道，我們不久將進行辦公室硬體全面更新。我們許多設備相當老舊，今年應該替換。—[1]—。[173-A] 我們將會升級伺服器，並且為每位過去 5 年沒有獲得新電腦的人提供新機。此外，[173-C] 也將在辦公室各處設置新的終端印表機。[175] 許多同仁申請了新的顯示器。—[2]—。[175] 可惜我們無法核准所有申請，因為經費有限。\n>\n> [174] 如果你將獲得新電腦，請務必在星期五之前將所有需要的檔案下載到外部硬碟。這很重要，因為 [173-B] 舊設備將在週末更換，星期一之後員工就不能使用。\n>\n> —[3]—。技術人員希望在星期六和星期日完成所有工作。要是有所延誤，大家會收到通知。如果有任何問題，請打分機 115 聯絡我，或者寄電子郵件至 philchristensen@davenport.com 給我。\n>\n> —[4]—。謝謝大家的配合。\n\n**單字** aware (adj.) 知道的，察覺到的；replacement (n.) 替換，代替；authorize (v.) 批准，授權；external (adj.) 外部的，外在的；cooperation (n.) 合作，協力；hardware (n.) 硬體，五金器具；terminal (n.) 終端機，總站，航廈；funding (n.) 資金；inaccessible (adj.) 無法使用的；due (adj.) 到期的，適當的；regret (v.) 遺憾，後悔；limited (adj.) 有限的，受限的；delay (n.) 延誤；(v.) 使延誤\n\n**172.** 答案 (D)｜難度：低\nWhat is the purpose of the memo?\n- (A) To update workers on security procedures\n- (B) To explain reasons for staff replacement\n- (C) To communicate a change in work hours\n- (D) To remind employees about a planned activity\n\n> 這則備忘錄的目的是什麼？\n> (A) 為了告知員工最新的安全程序\n> (B) 為了說明替換員工的理由\n> (C) 為了傳達工作時間的變更\n> (D) 為了提醒員工預定的行動\n\n**尋找主題／目的** 文章的目的\n這是問備忘錄目的的尋找主題問題，所以要特別注意文章開頭的部分。「As most of you are already aware, we will soon be undergoing a complete update of our office hardware.」提到，大部分的員工已經知道，公司不久將進行全面的硬體更新，之後則說明員工申請設備的結果，以及設備更新的相關注意事項，所以 (D) To remind employees about a planned activity 是正確答案。\n\n**單字** procedure (n.) 程序，步驟；communicate (v.) 傳達，溝通\n\n<!-- page 336 -->\n\n**173.** 答案 (D)｜難度：中\nWhat is NOT indicated in the memo?\n- (A) Some computers are less than five years old.\n- (B) The equipment will be removed after Friday.\n- (C) The office will receive some new printers.\n- (D) Some staff will have to do overtime next week.\n\n> 備忘錄中沒有提到什麼？\n> (A) 有些電腦的機齡還不到 5 年。\n> (B) 設備週五之後會被搬走。\n> (C) 辦公室將有新的印表機。\n> (D) 有些員工下禮拜必須加班。\n\n**Not/True** Not 問題\n這是問備忘錄沒有提到什麼的 Not/True 問題。題目並沒有特定的關鍵字，所以要在文中找到與各選項相關的資訊，並確認是否正確。(A) 對應文中的「We will be ~ providing new PCs to everyone who has not received one in the past five years.」，表示將會提供新電腦給過去 5 年都沒有得到的人，符合選項敘述。(B) 對應文中的「the old equipment will be replaced over the weekend and will be inaccessible to staff from Monday」，表示會在週末更換舊設備，星期一員工就沒辦法使用，符合選項敘述。(C) 對應文中的「new printer terminals will be stationed throughout the office」，表示辦公室各處將設置新的終端印表機，符合選項敘述。(D) 在文中沒有提到，所以 (D) Some staff will have to do overtime next week 是正確答案。\n\n**替換表達**\nwill be replaced ~ and will be inaccessible 會被更換並且無法使用 → will be removed 會被移除\n\n**174.** 答案 (C)｜難度：低\nAccording to Mr. Christensen, what are employees responsible for?\n- (A) Installing programs\n- (B) Scanning documents\n- (C) Saving needed files\n- (D) Scheduling work appointments\n\n> 根據 Christensen 先生所寫的，員工要負責什麼？\n> (A) 安裝程式\n> (B) 掃描文件\n> (C) 儲存需要的檔案\n> (D) 安排工作會面行程\n\n**wh- 問題** What\n這是問員工要負責什麼（What）的 wh- 問題。和問題重點 employees responsible for 相關的部分是「If you are receiving a new computer, please make sure to download all the files you will need onto an external hard drive by Friday.」，表示會得到新電腦的人必須在星期五之前將所有需要的檔案下載到外部硬碟，所以 (C) Saving needed files 是正確答案。\n\n**替換表達**\ndownload ~ files ~ will need 下載需要的檔案 → Saving needed files 儲存需要的檔案\n\n**175.** 🆕 答案 (B)｜難度：低\nIn which of the positions marked [1], [2], [3], and [4] does the following sentence best belong?\n\"You should already have received an e-mail concerning your request if it was approved.\"\n- (A) [1]\n- (B) [2]\n- (C) [3]\n- (D) [4]\n\n> 以下這個句子最適合放在文中標記 [1]、[2]、[3]、[4] 的哪一個位置？\n> 「如果獲准的話，你們應該已經收到關於申請事宜的電子郵件了。」\n> (A) [1]\n> (B) [2]\n> (C) [3]\n> (D) [4]\n\n**找出句子位置**\n這是要依照文章的內容架構，判斷句子應該插入哪個位置的題目。題目所給的句子「You should already have received an e-mail concerning your request if it was approved」表示某些獲准的人應該已經收到關於申請事宜的電子郵件，所以應該放在和提出申請及等待核准有關的部分。[2] 的上一句「Many of you have also asked for new monitors.」提到，許多人申請了新的顯示器，而 [2] 的下一句「We regret that we were unable to authorize all requests」則說很遺憾不能核准所有申請。在 [2] 的位置插入句子之後，表示申請顯示器獲准的人應該已經收到電子郵件，文意前後連貫，所以 (B) [2] 是正確答案。\n\n<!-- page 337 -->\n\n### Questions 176-180 refer to the following article and e-mail.\n176-180 題參照以下報導與電子郵件。\n\n**文章 1**\n> Generix Motors Announces Recall of Sports Vehicle\n>\n> [176] Detroit-based Generix Motors announced last Friday the recall of its GX-490 Sports Coupe for replacement of a defective safety system. All owners of the vehicle have been requested to bring them to the nearest Generix dealership for an upgrade. Generix said the company has already sent out official notification letters to those in possession of the vehicles.\n>\n> [180] Due to faulty programming in the car's computer system, front-seat passenger airbags have been found to malfunction on occasion, and Generix will be installing an update and replacing two small vehicle components. In [178] a press statement written by Davis Martino, public relations director for Generix, the problem is described as minor. Martino also writes that Generix takes every precaution for the safety of those that drive our vehicles, and even the smallest problem should be rectified.\n>\n> The recall is expected to cost the manufacturer close to $70 million, but most agree that such a responsible corporate reaction can only be beneficial for the public perception of Generix Motors.\n>\n> [177] Those in possession of the recalled model may visit www.generixmotors.com/outlets to find the nearest location that can do the necessary work. Or the manufacturer can be contacted directly with regard to the recall by e-mailing recall@generixmotors.com.\n\n**翻譯**\n> Generix 汽車公司宣布召回跑車\n>\n> [176] 總公司位於底特律的 Generix 汽車公司上週五宣布召回 GX-490 雙門跑車，以更換有缺陷的安全系統。此車款車主皆被要求將車輛送至最近的 Generix 經銷商進行升級。Generix 公司表示，公司已寄出正式通知信給持有本款車輛者。\n>\n> [180] 由於車輛電腦系統程式編寫錯誤，使得副駕駛座安全氣囊被發現偶爾會失靈，而 Generix 汽車公司將會安裝更新，並更換兩個小的車輛零件。在 Generix 公司公關主任 [178] Davis Martino 所撰寫的新聞稿中，他描述這是輕微的問題。Martino 也寫道，為了該廠牌車輛駕駛人的安全，Generix 公司採取所有預防措施，就連最小的問題也該修正。\n>\n> 本次召回預期將花費該製造商將近 7 千萬美元，但多數人同意，如此負責的企業應對將對 Generix 汽車公司的大眾觀感有益。\n>\n> [177] 持有召回車款者可上 www.generixmotors.com/outlets 查看可進行必要處理的最近據點。或者可直接寄電子郵件至 recall@generixmotors.com 向製造商洽詢召回事宜。\n\n**文章 2**\n> TO: Customer assistance <recall@generixmotors.com>\n> FROM: Graham Worthington <gworth@funmail.com>\n> SUBJECT: Recall\n> DATE: April 22\n>\n> Dear Madam or Sir,\n>\n> [180] I purchased a GX-490 Sports Coupe six months ago. I recently read in an article from my local newspaper that your company has recalled the vehicle. I have not received a notification letter yet, so the news was surprising to me.\n>\n> I would like to bring in my car for the necessary work but am unsure of where to take it. Unfortunately, [179] I could not find any dealerships listed for my region on your Web site. The nearest Generix outlet seems to be in Madison, and that is quite a long distance for me to drive.\n>\n> [179] Could you please let me know where I should take my vehicle? I live in a small town in Wisconsin called Monroe, with a zip code of 53556. Naturally, the closer to my town the dealership is, the better it will be for me. I hope you will notify me as soon as possible either by e-mail or by contacting me at (608) 555-3456. This is a serious issue\n\n**翻譯**\n> 收件者：顧客協助 <recall@generixmotors.com>\n> 寄件者：Graham Worthington <gworth@funmail.com>\n> 主旨：召回\n> 日期：4 月 22 日\n>\n> 敬啟者：\n>\n> [180] 我六個月前購買了一台 GX-490 雙門跑車。我最近在本地報紙的一篇報導中看到，貴公司已經召回這款車。我還沒收到通知信，所以這則消息讓我很訝異。\n>\n> 我想把我的車送去做必要處理，但我不確定要送到哪裡。糟糕的是，[179] 我在貴公司網站找不到位於我所在區域的經銷商。最近的 Generix 銷售據點似乎在麥迪遜，我開車到那裡距離很遠。\n>\n> [179] 可以請你們告訴我應該把車送到哪裡嗎？我住在威斯康辛州叫門羅的小鎮，郵遞區號是 53556。當然，經銷商離我住的城鎮越近越好。我希望你們能盡快用電子郵件或打 (608) 555-3456 通知\n\n<!-- page 338 -->\n\n> for me, as I have two young children that ride in the vehicle, so I would like to take care of the problem quickly.\n>\n> Sincerely,\n>\n> Graham Worthington\n\n**翻譯**\n> 我。這對我來說是很嚴重的問題，因為我有兩個小孩會坐這台車，所以我想快速處理這個問題。\n>\n> Graham Worthington\n\n**單字**\n文章 1：recall (n.) 召回，收回；(v.) 召回；notification (n.) 通知，通告；on occasion (phr.) 偶爾；public relations (phr.) 公共關係，公關；reaction (n.) 反應，（對某事的）態度；defective (adj.) 有缺陷的，有瑕疵的；possession (n.) 擁有，持有；component (n.) 零件，構成要素；precaution (n.) 預防措施；beneficial (adj.) 有益的，有利益的；dealership (n.) 經銷商，代理店；malfunction (v.) 故障，失靈；press statement (phr.) 新聞稿；rectify (v.) 改正，矯正；perception (n.) 感知，認知\n文章 2：unsure (adj.) 不確定的；distance (n.) 距離，遠處；serious (adj.) 嚴重的，認真的；region (n.) 地區，區域；zip code (phr.) 郵遞區號；outlet (n.) 販賣的通路，商店；naturally (adv.) 當然，自然地\n\n**176.** 答案 (B)｜難度：低\nWhat is the article mainly about?\n- (A) The launch of a vehicle line\n- (B) Technical problems with a product\n- (C) The acquisition of an automotive factory\n- (D) Additional security features on cars\n\n> 報導主要是關於什麼？\n> (A) 系列車款上市\n> (B) 產品的技術問題\n> (C) 收購汽車工廠\n> (D) 車輛額外的安全特色\n\n**尋找主題／目的** 文章的主題\n這是詢問寫報導（第一篇文章）主要是關於什麼的尋找主題問題。報導中的「Detroit-based Generix Motors announced last Friday the recall of its GX-490 Sports Coupe for replacement of a defective safety system.」提到，總公司位於底特律的 Generix 汽車公司上週五宣布召回 GX-490 雙門跑車，以更換有缺陷的安全系統，所以 (B) Technical problems with a product 是正確答案。\n\n**單字** launch (n.) 上市，開始；acquisition (n.) 收購，獲得；automotive (adj.) 汽車的；feature (n.) 特徵，特色\n\n**177.** 答案 (D)｜難度：中\nWho would most likely visit the Generix Web site?\n- (A) Customers wanting to schedule test drives\n- (B) Drivers requesting further advice on model selection\n- (C) Clients wishing to extend warranties\n- (D) Owners of vehicles with possible safety issues\n\n> 誰最有可能上 Generix 公司的網站？\n> (A) 想要安排試駕的顧客\n> (B) 對於車款選擇，想獲得進一步建議的駕駛人\n> (C) 想要延長保固的客戶\n> (D) 可能有安全問題的車輛的車主\n\n**推論** 細節資訊\n這是關於題目關鍵字 visit the Generix Web site 的推論問題，所以要看關於 Generix 汽車公司的報導（第一篇文章）。「Those in possession of the recalled model may visit www.generixmotors.com/outlets to find the nearest location that can do the necessary work.」的部分提到，持有召回車款者可上 www.generixmotors.com/outlets 查看可進行必要處理的最近據點，可推知擁有問題車款的人可能會上 Generix 汽車公司的網站，所以 (D) Owners of vehicles with possible safety issues 是正確答案。\n\n**替換表達**\nThose in possession 擁有的人 → Owners 擁有者，所有人\n\n**單字** test drive (phr.) 試駕；selection (n.) 選擇；warranty (n.) 品質保證（書）\n\n<!-- page 339 -->\n\n**178.** 答案 (D)｜難度：低\nAccording to the article, what did Davis Martino do?\n- (A) Conducted an inspection\n- (B) Gave a public speech\n- (C) Worked on a vehicle design\n- (D) Wrote a press release\n\n> 根據報導，Davis Martino 做了什麼？\n> (A) 進行視察\n> (B) 公開演講\n> (C) 進行車輛設計\n> (D) 撰寫新聞稿\n\n**wh- 問題 What**\n這是問根據報導，Davis Martino 做了什麼（What）的 wh- 問題，所以要看報導（第一篇文章）中的相關內容。「a press statement written by Davis Martino」的部分提到 Davis Martino 寫的新聞稿，所以 (D) Wrote a press release 是正確答案。\n\n**替換表達** press statement 新聞稿 → press release 新聞稿\n\n**單字** inspection (n.) 視察，檢查；press release (phr.) 新聞稿\n\n**179.** 答案 (B)｜難度：中\nWhy did Mr. Worthington contact Generix Motors?\n- (A) To look into family-suitable automobiles\n- (B) To inquire about a dealership\n- (C) To verify some contact details\n- (D) To point out a device error\n\n> Worthington 先生為什麼聯絡了 Generix 汽車公司？\n> (A) 為了查知適合家庭的汽車\n> (B) 為了詢問經銷商的事\n> (C) 為了確認詳細聯絡資訊\n> (D) 為了指出裝置發生的錯誤\n\n**尋找主題／目的 寫文章的理由**\n這是問 Worthington 先生聯絡 Generix 汽車公司的理由的尋找主題問題，所以要看 Worthington 先生寫的電子郵件（第二篇文章）。這題要特別注意的是文章中後段才有關於目的的內容。電子郵件中的「I couldn't find any dealerships listed for my region on your Web site」提到，在公司的網站上找不到自己所在地區的經銷商，而「Could you please let me know where I should take my vehicle?」則請收件者告知應該把車送到哪裡，所以 (B) To inquire about a dealership 是正確答案。\n\n**單字** look into (phr.) 調查；verify (v.) 確認，證明；point out (phr.) 指出\n\n**180.** 答案 (A)｜難度：中\nWhat is suggested about Mr. Worthington?\n- (A) His vehicle requires a computer system update.\n- (B) He has a warranty that covers repair costs.\n- (C) His car was purchased at an outlet in the region.\n- (D) He works for a local newspaper publication.\n\n> 關於 Worthington 先生，文中顯示什麼？\n> (A) 他的車需要進行電腦系統更新。\n> (B) 他有包含維修費用的產品保固。\n> (C) 他的車是在該地區的通路買的。\n> (D) 他在地方報社工作。\n\n**推論 多篇文章綜合題**\n這是必須參考兩篇文章內容的多篇文章綜合題，所以先看題目關鍵字 Mr. Worthington 所寫的電子郵件（第二篇文章）。\n\n第二篇文章中的「I purchased a GX-490 Sports Coupe ~ I recently read in an article ~ that your company had recalled the vehicle.」提到，Worthington 先生購買了 GX-490 雙門跑車，最近看到公司召回這款車的報導，這是第一個線索。但是，這裡沒有提到召回的理由，所以還需要在第一篇文章（報導）中確認。第一篇文章中的「Due to faulty programming in the car's computer system ~ Generix will be installing an update」提到，由於車輛電腦系統程式編寫錯誤，Generix 汽車公司將會安裝更新，這是第二個線索。\n\n綜合「Worthington 先生購買的車輛被召回」和「由於車輛電腦系統程式編寫錯誤，Generix 汽車公司將會安裝更新」這兩個線索，可以推知 Worthington 先生的車需要進行電腦系統更新，所以 (A) His vehicle requires a computer system update 是正確答案。\n\n**單字** publication (n.) 刊物，出版\n\n<!-- page 340 -->\n\n### Questions 181-185 refer to the following advertisement and letter.\n181-185 題參照以下廣告與信件。\n\n**文章 1**\n> [181] Donnelly & Chung Publicity... Your Branding Experts!\n>\n> [181] Are you a new company having trouble increasing public awareness of your brand? Do you have a line of terrific products but don't know how to promote them? Or does your business need to change its image? [181] Whatever your marketing problem might be, Donnelly & Chung Publicity can help! Our clients vary from local businesses, including Shasta-Clear Beverages and Deerborne Stationery, to large, international corporate customers, such as Compton Clothiers and Just-Ate Dietary Supplements.\n>\n> Our experts at Donnelly & Chung can help you come up with a specific plan to promote your products or services. We offer development of advertising campaigns, corporate branding services, consumer targeting consultations, market research, and much more!\n>\n> [182] Your first consultation is completely free! One of our associates will discuss your needs and provide you with a fee estimate. Simply call 555-4951 to arrange your complimentary appointment.\n\n**翻譯**\n> [181] Donnelly & Chung 宣傳公司…您的品牌塑造專家！\n>\n> [181] 您的新公司在提升大眾對品牌的認知度方面遇到了困難嗎？您是否擁有一系列優秀產品，卻不知道如何宣傳呢？或者您的事業需要改變形象？[181] 不管您的行銷問題是什麼，Donnelly & Chung 宣傳公司都幫得上忙！我們的客戶小自地方業者如 Shasta-Clear 飲料公司、Deerborne 文具公司，大至國際企業 Compton 服飾公司和 Just-Ate 營養補充食品等等。\n>\n> Donnelly & Chung 公司的專家們能幫助您想出宣傳產品或服務的具體計畫。我們提供廣告活動開發、企業品牌塑造、鎖定客群諮詢、市場調查，還有其他許多服務！\n>\n> [182] 您的首次諮詢完全免費！我們的同仁會討論您的需求並提供報價。只要撥打 555-4951，即可安排您的免費預約。\n\n**文章 2**\n> July 2\n>\n> Patricia Draper\n> Donnelly & Chung Publicity\n> Unit 405 C, Acres Center, 312 East. 21st Avenue.\n> Denver, CO 89110\n>\n> Dear Ms. Draper,\n>\n> [182] I enjoyed meeting with you recently and appreciate being able to consult with someone about my branding needs. I've only just opened my business in Denver and could really use some help promoting it.\n>\n> [183] I have discussed our consultation with my business partner Walter Preston, and he remembers a promotional campaign you did for Shasta-Clear that was very successful. So, we have agreed to hire your firm to help us come up with a branding plan for our bakery. We would like to get things underway as soon as possible, so [184] please let me know when you are free to meet with Walter and me in person. Walter and I are generally free after 11 a.m. on weekdays.\n>\n> You mentioned during our meeting that your firm would require complete descriptions of all products that we sell if we decide to proceed with the branding work. [185] I have enclosed a list of all our goods, including the ingredients they are made of. Should you require any additional information before we meet, I would be happy to supply it for you.\n\n**翻譯**\n> 7 月 2 日\n>\n> Patricia Draper\n> Donnelly & Chung 宣傳公司\n> 405 C 室，Acres 中心，東 21 街 312 號\n> 丹佛，科羅拉多州 89110\n>\n> 親愛的 Draper 小姐：\n>\n> [182] 最近和您的會面很愉快，我也很感謝能和人商量品牌塑造的需求。我才剛在丹佛創業，確實需要有人幫忙宣傳。\n>\n> [183] 我和我的事業夥伴 Walter Preston 討論過了，他記得貴公司為 Shasta-Clear 公司所做的宣傳活動非常成功。所以，我們已經同意聘請貴公司幫忙構想我們烘焙坊的品牌塑造計畫。我們希望盡快開始進行，所以 [184] 請告訴我您什麼時候有空親自和 Walter 還有我見面。Walter 和我通常平日上午 11 點後有空。\n>\n> 您在我們會面時提到，如果我們決定進行品牌塑造工作的話，貴公司需要我們販賣的所有產品的完整敘述。[185] 我附上了我們所有商品的列表，其中包括製造成分。如果您在我們會面前還需要額外的資訊，我很樂意提供給您。\n\n<!-- page 341 -->\n<!-- 本頁右緣受裝訂摺痕遮蔽，右欄行末少數字元依上下文補入 -->\n\n> We look forward to working together with you and hope to hear from you soon.\n>\n> Regards,\n> [183] Kevin Swords\n> Co-proprietor, PS Baked Goods\n\n**翻譯**\n> 我們期待和您合作，也希望很快得到您的回覆。\n>\n> [183] Kevin Swords\n> 共同經營者，PS 烘焙食品公司\n\n**單字** 文章 1：publicity (n.) 宣傳，廣告；have trouble -ing (phr.) 做…遇到困難；public (adj.) 大眾的；n. 大眾；awareness (n.) 認知度，意識；terrific (adj.) 很棒的，非常好的；come up with (phr.) 想出；completely (adv.) 完全地，徹底地；associate (n.) 同事，夥伴；estimate (n.) 估計；v. 估算；complimentary (adj.) 免費贈送的\n**單字** 文章 2：underway (adj.) 進行中的；enclose (v.) 隨信附上，封入；generally (adv.) 通常，一般地；ingredient (n.) 材料，成分\n\n**181.** 答案 (C)｜難度：低\nWhat can Donnelly & Chung offer assistance with?\n- (A) Setting up a new business\n- (B) Designing entertaining Web sites\n- (C) Promoting a corporate brand\n- (D) Supplying event-related services\n\n> Donnelly & Chung 公司可以提供什麼協助？\n> (A) 成立新事業\n> (B) 設計有趣的網站\n> (C) 宣傳企業品牌\n> (D) 提供活動相關服務\n\n**wh- 問題 What**\n這是問 Donnelly & Chung 宣傳公司可以對什麼（What）提供協助的 wh- 問題，所以要看提到與題目關鍵部分 Donnelly & Chung offer assistance with 相關內容的廣告（第一篇文章）。廣告的標題「Donnelly & Chung Publicity... Your Branding Experts!」說 Donnelly & Chung 宣傳公司是品牌塑造專家，而「Are you a new company having trouble increasing public awareness of your brand?」問讀者是不是在提升品牌認知度方面遇到困難的新公司，「Whatever your marketing problem might be, Donnelly & Chung Publicity can help.」說 Donnelly & Chung 宣傳公司可以幫忙處理任何行銷問題，所以 (C) Promoting a corporate brand 是正確答案。\n\n**單字** entertaining (adj.) 有趣的，讓人得到娛樂的\n\n**182.** 答案 (B)｜難度：高\nWhat is suggested about Kevin Swords?\n- (A) He has worked with Ms. Draper on previous projects.\n- (B) He was not charged a fee for his session with Ms. Draper.\n- (C) He plans to open additional bakery branches.\n- (D) He has a supply partnership with Just-Ate.\n\n> 關於 Kevin Swords，文中顯示什麼？\n> (A) 他和 Draper 小姐合作過之前的專案。\n> (B) 他和 Draper 小姐會面沒有被收費。\n> (C) 他打算多開新的烘焙坊分店。\n> (D) 他和 Just-Ate 公司有供應方面的合作關係。\n\n**推論 多篇文章綜合題**\n這是必須參考兩篇文章內容的多篇文章綜合題，所以先看題目關鍵字 Kevin Swords 所寫的信件（第二篇文章）。\n第二篇文章中的「I enjoyed meeting with you recently and appreciate being able to consult with someone about my branding needs.」提到，最近和收件人 Draper 小姐會面很愉快，很感謝能和人商量品牌塑造的需求，可以推知 Kevin Swords 接受了 Draper 小姐的第一次諮詢，這是第一個線索。但是，這裡沒有提到關於諮詢的細節，所以還需要在第一篇文章（廣告）中確認。第一篇文章中的「Your first consultation is completely free!」提到，第一次諮詢免費，這是第二個線索。\n綜合「Kevin Swords 接受了 Draper 小姐的第一次諮詢」和「第一次諮詢免費」這兩個線索，可以推知\n\n<!-- page 342 -->\n\nKevin Swords 接受了免費的諮詢，所以 (B) He was not charged a fee for his session with Ms. Draper 是正確答案。\n\n**單字** partnership (n.) 合作，合夥\n\n**183.** 答案 (B)\nWho is Walter Preston?\n- (A) An advertising consultant\n- (B) A co-owner of PS Baked Goods\n- (C) An ingredients supplier\n- (D) A Shasta-Clear executive\n\n> Walter Preston 是誰？\n> (A) 廣告顧問\n> (B) PS 烘焙食品公司的共同擁有者\n> (C) 食材供應商\n> (D) Shasta-Clear 公司的高階主管\n\n**wh- 問題 Who**\n這是問 Walter Preston 是誰（Who）的 wh- 問題，所以要看提到題目關鍵字 Walter Preston 的信件（第二篇文章）。「I have discussed our consultation with my business partner Walter Preston」的部分提到，已經和事業夥伴 Walter Preston 討論過了，而「Kevin Swords, Co-proprietor, PS Baked Goods」顯示 Kevin Swords 是 PS 烘焙食品公司的共同經營者之一，所以 Walter Preston 是這家公司的另一位共同經營者，(B) A co-owner of PS Baked Goods 是正確答案。\n\n**替換表達**\nCo-proprietor 共同經營者 → co-owner 共同擁有者\n\n**184.** 答案 (D)\nWhat does Mr. Swords want Ms. Draper to do?\n- (A) Print out a list of produce\n- (B) Schedule a complimentary consultation\n- (C) Write a promotional proposal\n- (D) Confirm her availability for a meeting\n\n> Swords 先生希望 Draper 小姐做什麼？\n> (A) 印出農產品列表\n> (B) 安排免費諮詢時間\n> (C) 撰寫宣傳提案\n> (D) 確認她是否有空會面\n\n**wh- 問題 What**\n這是問 Swords 先生希望 Draper 小姐做什麼（What）的 wh- 問題，所以要看提到與題目關鍵部分 Ms. Swords want Ms. Draper to do 相關內容的第二篇文章（信件）。「please let me know when you are free to meet with Walter and me in person」的部分提到，希望對方告知什麼時候有空親自和 Walter 還有自己見面，所以 (D) Confirm her availability for a meeting 是正確答案。\n\n**單字** produce (n.) 農產品；v. 生產\n\n**185.** 答案 (A)\nWhat is enclosed with the letter?\n- (A) Descriptions of items for sale\n- (B) An order form for supplies\n- (C) Signed business contracts\n- (D) A completed questionnaire\n\n> 信件附了什麼？\n> (A) 銷售物品的描述\n> (B) 用品訂購單\n> (C) 已簽署的商業合約\n> (D) 填好的問卷\n\n**wh- 問題 What**\n這是問信件附了什麼（What）的 wh- 問題，所以要看信件（第二篇文章）的內容。「I have enclosed a list of all our goods, including the ingredients they are made of.」的部分提到，已經附上了所有商品的列表，其中包括製造成分，所以 (A) Descriptions of items for sale 是正確答案。\n\n**替換表達**\na list of all ~ goods 所有商品的列表 → Descriptions of items 物品的描述\n\n**單字** contract (n.) 合約，契約；v. 簽約；questionnaire (n.) 問卷\n\n<!-- page 343 -->\n<!-- 本頁右緣受裝訂摺痕遮蔽，中譯行末少數字元依上下文補入 -->\n\n### Questions 186-190 refer to the following e-mails, and form. 🆕\n186-190 題參照以下電子郵件及表格。\n\n**文章 1**\n> To: Customer Service <cs@tailwindairlines.com>\n> From: Maggie Flowers <m.flo@fastmail.com>\n> Date: May 29\n> Subject: Compensation\n> Attachment: Rental receipt\n>\n> Dear Customer Service,\n>\n> On May 25, I was scheduled to fly on Flight 535 from Cleveland to Pittsburgh. However, the flight was canceled due to mechanical problems. While at the airport, I was promised a flight voucher as compensation for the inconvenience. [186] I never claimed it and would like to follow up now. Also, I'd like reimbursement for an incurred expense. I had a job interview to attend and could not wait until the following day. So, [187] I rented a car and drove to my destination. [187] I have attached a copy of the rental receipt in case you need it.\n>\n> I hope you can help me resolve this matter.\n>\n> Sincerely,\n> Maggie Flowers\n\n**翻譯**\n> 收件者：客服部 <cs@tailwindairlines.com>\n> 寄件者：Maggie Flowers <m.flo@fastmail.com>\n> 日期：5 月 29 日\n> 主旨：補償\n> 附件：租金收據\n>\n> 親愛的客服部：\n>\n> 5 月 25 日，我原定要搭乘 535 號班機從克里夫蘭飛往匹茲堡。然而班機由於機械問題取消了。在機場時，工作人員跟我保證會給我機票抵用券，作為造成不便的補償。[186] 我還沒索取，現在想要進行後續的處置了。還有，因為這件事而產生的一筆費用，我也希望獲得補償。我當時有工作面試要參加，不能等到隔天。所以，[187] 我租了車並且開到目的地。[187] 我附上了租金收據複本，以防您有需要。\n>\n> 希望你們能幫我解決這件事。\n> Maggie Flowers\n\n**文章 2**\n> To: Maggie Flowers <m.flo@fastmail.com>\n> From: Customer service <cs@tailwindairlines.com>\n> Date: June 8\n> Attachment: reimbursement_form\n> Subject: Re: Compensation\n>\n> Dear Ms. Flowers,\n>\n> I am n number\n- (D) A car rental receipt\n\n> Russell 先生要求 Flowers 小姐提供什麼？\n> (A) 護照副本\n> (B) 登機證\n> (C) 飯店預約號碼\n> (D) 租車收據\n\n**wh- 問題 多篇文章綜合題**\n這是必須參考三篇文章其中兩篇內容的多篇文章綜合題。題目的關鍵部分是 Mr. Russell ask Ms. Flowers to provide，問 Russell 先生要求 Flowers 小姐提供什麼（What），所以先看 Russell 先生所寫的電子郵件（第二篇文章）。\n\n第二篇文章中的「mail it to us along with your original receipt」，是 Russell 先生請收件人 Flowers 小姐把收據正本和填好的表格一起寄回，這是第一個線索。但是，這裡沒有提到那是什麼的收據，所以還需要確認 Flowers 小姐所寫的電子郵件（第一篇文章）的內容。第一篇文章中的「I rented a car」、「I have attached a copy of the rental receipt in case you need it.」表示 Flowers 小姐租了車，並且提供過租車收據的副本，這是第二個線索。\n\n綜合「Russell 先生請收件人 Flowers 小姐把收據正本寄回」和「Flowers 小姐提供過租車收據的副本」這兩個線索，可以推知 Russell 先生是請 Flowers 小姐把租車收據的正本寄回，所以 (D) A car rental receipt 是正確答案。\n\n**替換表達** provide 提供 → mail 郵寄\n\n**188.** 答案 (B)｜難度：中\nIn the second e-mail, the word \"convey\" in paragraph 2, line 2, is closest in meaning to\n- (A) pick up\n- (B) make known\n- (C) take into consideration\n- (D) take to another place\n\n> 第二封電子郵件第 2 段第 2 行的「convey」，意思最接近\n> (A) 領取\n> (B) 使…被人知道\n> (C) 考慮\n> (D) 帶到別的地方\n\n**同義詞**\n在第二封電子郵件中，convey 在「our airline staff failed to convey this information properly」這個句子裡的意思是「傳達」，所以表示「使…被人知道」的 (B) make known 是正確答案。\n\n**189.** 答案 (B)｜難度：高\nWhat is indicated about passengers on the canceled flight?\n- (A) They all took the next available flight.\n- (B) Their hotel rooms cost over $135 each.\n- (C) They all received their promised vouchers.\n- (D) Their meals were paid for by the airline.\n\n> 關於被取消航班的乘客，文中提到什麼？\n> (A) 他們都搭了下一班可以搭乘的航班。\n> (B) 他們每個人的飯店房間費用超過 135 美元。\n> (C) 他們都收到了承諾會提供的抵用券。\n> (D) 航空公司支付了他們的餐費。\n\n**推論 多篇文章綜合題**\n這是必須參考兩篇文章內容的多篇文章綜合題。先看提到與題目關鍵部分 passengers on the canceled flight 相關內容的第二封電子郵件。\n\n第二封電子郵件中的「all of the passengers on your flight were offered a night's stay at an airport hotel」、「the car rental amount was less than this cost」提到，對於 Flowers 小姐那班被取消的飛機，航空公司提供每位乘客在機場飯店一個晚上的住宿，而 Flowers 小姐的租車費用少於住宿費用，這是第一個線索。但是，這裡沒有提到租車費用是多少，所以還需要在第三篇文章（表格）中確認。第三篇文章中的「Name: Maggie\n\n<!-- page 346 -->\n<!-- 本頁 \n> are any other changes to make, I'll let you know in the morning. After that, the program will be finalized.\n>\n> Thanks!\n> Ellen\n\n**翻譯**\n> 了，他也接受了邀請。如果還有其他變動，我會在早上通知你。在那之後，議程就會定下來了。\n>\n> 謝謝！\n> Ellen\n\n**文章 3**\n> **Business Bulletin**\n>\n> Singapore, June 11 – [195] The Green Technology Association (GTA) recently held its 12th Green Technology Conference at the Singapore Convention Hall. The heads of several organizations playing a critical role in the development of green technologies around the world were in attendance. [193-D] According to speaker Jeremy Porter of the Green Research Institute, the outlook for the industry appears stable despite [193-B] politicians in some nations who are holding back the use of green technologies. [193-D/195] GTA chair Ellen Matsushita was equally hopeful, [195] citing insightful comments from the minister of the Singapore Economic Development Board, David Mah. Download a full report on the talks and material presented at the conference by visiting the organization's Web site at www.gta.org.\n\n**翻譯**\n> **商業快報**\n>\n> 新加坡，6 月 11 日－[195] 綠色科技協會（GTA）近日於新加坡會議廳舉辦了第 12 屆綠色科技會議。在全世界綠色科技發展中扮演關鍵角色的幾所機構的領袖出席了會議。[193-D] 根據綠色研究機構的講者 Jeremy Porter 所說，這項產業的前景看來穩定，儘管 [193-B] 有些國家的政治人物阻礙了綠色科技的使用。[193-D/195] GTA 主席 Ellen Matsushita 也同樣抱持希望，[195] 她提到了新加坡經濟發展局局長 David Mah 的洞見。請上該機構網站 www.gta.org 下載演講的完整記述，以及會議中提出的資料。\n\n**單字** 文章 1：green (adj.) 綠色的（環保的）；(v.) 綠化，使環保；keynote address (phr.)（定調會議核心主題的）專題演講；outlook (n.) 展望，前景；finance (v.) 籌措資金；(n.) 資金，財政；solar (adj.) 太陽的；moderator (n.) 會議主持人，仲裁者；industry (n.) 業界，產業；biomass (n.) 生物質\n**單字** 文章 2：additional (adj.) 追加的，額外的；suggest (v.) 建議，暗示；finalize (v.) 最後確定，完成\n**單字** 文章 3：bulletin (n.) 新聞快報，簡要的新聞；cite (v.) 提及，引用；hold back (phr.) 阻礙，抑制；insightful (adj.) 有洞察力的；use (n.) 使用，用途；(v.) 使用，消耗；present (v.) 提出，呈現\n\n**191.** 答案 (C)\nWhat has NOT been scheduled for the conference?\n- (A) A closing speech\n- (B) A presentation on solar power\n- (C) A special luncheon\n- (D) A talk on the future of the industry\n\n> 會議中沒有預定什麼？\n> (A) 閉幕演說\n> (B) 關於太陽能的簡報\n> (C) 特別午餐會\n> (D) 關於產業未來的演說\n\n**Not/True Not 問題**\n這是需要找到與關鍵字 scheduled for the conference 相關的資訊，並且與選項敘述對照的 Not/True 問題，所以要看會議議程時間表（第一篇文章）。(A) 對應文中的「Closing remarks」，表示有閉幕致詞，符合選項敘述。(B) 對應文中的「Wind, solar, and biomass power」，表示有關於太陽能的演說，符合選項敘述。(C) 在文中沒有提到，所以 (C) A special luncheon 是正確答案。(D) 對應文中的「Industry outlook」，表示有關於產業展望的演說，符合選項敘述。\n\n**替換表達**\nClosing remarks 閉幕致詞 → A closing speech 閉幕演說\noutlook 展望 → future 未來\n\n<!-- page 349 -->\n<!-- 本頁右緣受裝訂摺痕遮蔽，解析行末少數字元依上下文補入 -->\n\n**192.** 答案 (B)｜難度：中\nWhat time did Dr. Aromdee most likely speak?\n- (A) At 1:00 p.m.\n- (B) At 1:30 p.m.\n- (C) At 2:00 p.m.\n- (D) At 2:30 p.m.\n\n> Aromdee 博士最有可能在什麼時候演講？\n> (A) 在下午 1:00\n> (B) 在下午 1:30\n> (C) 在下午 2:00\n> (D) 在下午 2:30\n\n**推論 多篇文章綜合題**\n這是必須參考三篇文章其中兩篇內容的多篇文章綜合題。首先看提到與題目關鍵字 Dr. Aromdee ~ speak 相關內容的電子郵件（第二篇文章）。\n\n第二篇文章中，「the president of Greentrade Technologies is unavailable. Instead, we will have Dr. Connor Aromdee」提到 Greentrade Technologies 公司的總裁不能出席，Connor Aromdee 博士會代替他，這是第一個線索。但是，這裡沒有提到 Greentrade Technologies 公司總裁預定演講的時間，所以還需要在第一篇文章（時間表）中確認。第一篇文章中的「1:30 p.m., Keynote address」和「Speaker: ~ President, Greentrade Technologies」顯示下午 1:30 時預定由 Greentrade Technologies 公司總裁發表專題演講，這是第二個線索。\n\n綜合「Connor Aromdee 博士會代替不能出席的 Greentrade Technologies 公司總裁」和「Greentrade Technologies 公司總裁預定下午 1:30 發表專題演講」這兩個線索，可以推知 Aromdee 博士在下午 1:30 演講，所以 (B) At 1:30 p.m. 是正確答案。\n\n**193.** 答案 (B)｜難度：高\nWhat does the article mention about green technology?\n- (A) Its development has been stunted by high equipment costs.\n- (B) Its adoption is being opposed by some people in government.\n- (C) Its role is particularly important in developing nations.\n- (D) Its supporters are pessimistic about the future.\n\n> 關於綠色科技，報導提到什麼？\n> (A) 發展因高設備成本而受阻。\n> (B) 政府中有些人反對採用。\n> (C) 它的角色對開發中國家特別重要。\n> (D) 支持者對未來悲觀。\n\n**Not/True True 問題**\n這是需要在報導（第三篇文章）中找到與關鍵字 green technology 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A) 在文中沒有提到。(B) 對應文中的「politicians in some nations who are holding back the use of green technologies」，表示有些國家的政治人物阻礙了綠色科技的使用，符合選項敘述，所以 (B) Its adoption is being opposed by some people in government 是正確答案。(C) 在文中沒有提到。和 (D) 相關的部分是「According to speaker Jeremy Porter of the Green Research Institute, the outlook for the industry appears stable」和「GTA chair Ellen Matsushita was equally hopeful」，表示綠色研究機構的講者 Jeremy Porter 看好這個產業的前景，GTA 主席 Ellen Matsushita 也同樣抱持希望，不符合選項敘述。\n\n**替換表達**\nholding back the use of ~ 阻礙…的使用 → Its adoption is being opposed 它的採用受到反對\npoliticians 政治人物 → people in government 政府裡的人\n\n**單字** stunt (v.) 阻礙，妨礙；adoption (n.) 採用，採納；oppose (v.) 反對；pessimistic (adj.) 悲觀的\n\n<!-- page 350 -->\n<!-- 本頁左緣受掃描裁切：第 194、195 題的題號標籤與難度標示（低/中/高）已被切掉，無法辨識 -->\n\n**194.** 答案 (D)\nIn the article, the word \"critical\" in paragraph 1, line 3, is closest in meaning to\n- (A) analytical\n- (B) opinionated\n- (C) disapproving\n- (D) crucial\n\n> 報導第 1 段第 3 行的「critical」，意思最接近\n> (A) 分析的\n> (B) 堅持己見的\n> (C) 不贊成的\n> (D) 至關重要的\n\n**同義詞**\n在報導（第三篇文章）中，critical 在「The heads of several organizations playing a critical role in the development of green technologies」這個句子裡的意思是「關鍵的」，所以表示「至關重要的」的 (D) crucial 是正確答案。\n\n**195.** 答案 (C)\nWhat is indicated about David Mah?\n- (A) He was contacted by a government group about a schedule.\n- (B) He is a member of the GTA board of directors.\n- (C) He led a panel discussion on funding green projects.\n- (D) He participated in a conference call hosted by Ms. Matsushita.\n\n> 關於 David Mah，文中提到什麼？\n> (A) 政府團體和他聯絡了關於時間表的事。\n> (B) 他是 GTA 董事會的成員。\n> (C) 他帶領了關於為綠色計畫籌措資金的座談會。\n> (D) 他參加了 Matsushita 小姐主持的電話會議。\n\n**推論 多篇文章綜合題**\n這是必須參考三篇文章內容的多篇文章綜合題。首先看提到題目關鍵字 David Mah 的報導（第三篇文章）。\n\n第三篇文章中，「The Green Technology Association (GTA) recently held its 12th Green Technology Conference」和「GTA chair ~ was ~ citing insightful comments from the minister of the Singapore Economic Development Board, David Mah.」提到綠色科技協會（GTA）最近舉辦了第 12 屆綠色科技會議，而 GTA 主席提到了新加坡經濟發展局局長 David Mah 的洞見，所以可知 David Mah 是新加坡經濟發展局局長。但是，這裡沒有提到關於 David Mah 的其他資訊，所以還需要確認時間表和電子郵件的內容。第二篇文章（電子郵件）中的「Ms. Woodbine ~ cannot moderate the panel discussion. She suggested that we invite the minister of the Singapore Economic Development Board to take her place. I have contacted him, and he has accepted the invitation.」提到 Woodbine 小姐不能主持座談會，而新加坡經濟發展局局長會代替她，這是第二個線索；第一篇文章（時間表）中的「Panel discussion: Financing green projects」、「Moderator: Barbara Woodbine」顯示原本預定由 Woodbine 小姐主持關於為綠色計畫籌措資金的座談會，這是第三個線索。\n\n綜合「David Mah 是新加坡經濟發展局局長」、「新加坡經濟發展局局長會代替 Woodbine 小姐主持座談會」和「原本預定由 Woodbine 小姐主持關於為綠色計畫籌措資金的座談會」這三個線索，可以推知 David Mah 會帶領了關於為綠色計畫籌措資金的座談會，所以 (C) He led a panel discussion on funding green projects 是正確答案。\n\n**替換表達** Financing 籌措資金 → funding 提供資金\n\n**單字** fund (v.) 提供資金；(n.) 資金；conference call (phr.) 電話會議\n\n<!-- page 351 -->\n### Questions 196-200 refer to the following information, Web page, and e-mail. 🆕\n196-200 題參照以下資訊、網頁及電子郵件。\n\n**文章 1**\n\n> Westerburn Public Library Online Renewal Policy\n>\n> [196] All books owned by Westerburn can be renewed through your online account. Simply log in, click on the \"View\" menu, select \"Checked out items,\" and mark the boxes next to the titles you wish to renew. Then press \"Send\" at the bottom of the screen. [197-A] Members are allowed to renew our material for two-week periods provided there are no pending requests for them. [197-B/198-B] If materials you have checked out have been requested in advance by any other member, [198-B] the system will indicate that they cannot be borrowed again.\n>\n> Interlibrary loans can also be renewed online. However, some restrictions may apply. [197-D] Please check the sticker on the back of the book cover for the lending library's renewal policies, which may be different from our own.\n\n**翻譯**\n\n> Westerburn 公立圖書館網路續借政策\n>\n> [196] Westerburn 圖書館擁有的所有書籍，都能透過您的網路帳號續借。只要登入、點擊「觀看」選單、選擇「已借出項目」，並且勾選您想續借的書名旁邊的方塊。然後，按下螢幕下方的「送出」。[197-A] 會員可續借我們的資料 2 週，只要沒有人預約等候即可。[197-B/198-B] 如果您借出的資料已經有其他會員預約，[198-B] 系統將標明不可續借。\n>\n> 跨館借閱亦可線上續借。然而，可能有一些限制。[197-D] 請查看封底上的貼紙 const MARK = /\[(\d{3}(?:-[A-D](?:\/[A-D])*)?(?:\/\d{3}(?:-[A-D](?:\/[A-D])*)?)*)\]\s?/g;
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function inline(s) {
  s = esc(s).replace(/\\\*/g, "\u0001");
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>");
  s = s.replace(/\u0001/g, "*").replace(/\\([\[\]_#-])/g, "$1");
  return s.replace(MARK, (_, m) => `<span class="mk">${m}</span>`);
}
function md(text) {
  const lines = text.split("\n");
  let out = "", i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    if (l.startsWith(">")) {
      const buf = [];
      while (i < lines.length && lines[i].startsWith(">")) { buf.push(lines[i].replace(/^> ?/, "")); i++; }
      out += "<blockquote>" + md(buf.join("\n")) + "</blockquote>"; continue;
    }
    if (l.trim().startsWith("|")) {
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith("|")) { rows.push(lines[i].trim()); i++; }
      const cells = r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      let html = "<table>";
      rows.forEach((r, k) => {
        if (/^\|[\s\-:|]+\|$/.test(r)) return;
        const cs = cells(r);
        if (k === 0 && cs.every(c => !c)) return;
        const tag = k === 0 && rows[1] && /^\|[\s\-:|]+\|$/.test(rows[1]) ? "th" : "td";
        html += "<tr>" + cs.map(c => `<${tag}>${inline(c)}</${tag}>`).join("") + "</tr>";
      });
      out += html + "</table>"; continue;
    }
    if (/^- /.test(l)) {
      out += "<ul>";
      while (i < lines.length && /^- /.test(lines[i])) { out += "<li>" + inline(lines[i].slice(2)) + "</li>"; i++; }
      out += "</ul>"; continue;
    }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !lines[i].startsWith(">") && !/^- /.test(lines[i]) && !lines[i].trim().startsWith("|")) { buf.push(inline(lines[i])); i++; }
    out += "<p>" + buf.join("<br>") + "</p>";
  }
  return out;
}

const Q_HEAD = /^\*\*(\d{3})\.\*\*\s*(🆕)?\s*(?:答案 \(([A-D])\)(?:｜難度：([^\s🆕]+))?)?\s*(🆕)?/;
function parseQBlock(lines) {
  const m = lines[0].match(Q_HEAD);
  const q = { num: m[1], isNew: !!(m[2] || m[5]), answer: m[3] || null, level: m[4] || "", text: [], options: [], rest: [] };
  let stage = "text";
  for (const l of lines.slice(1)) {
    const o = l.match(/^- \(([A-D])\)\s?(.*)$/);
    if (stage !== "rest" && o) { stage = "opts"; q.options.push({ key: o[1], text: o[2] }); continue; }
    if (stage === "opts") stage = "rest";
    (stage === "text" ? q.text : q.rest).push(l);
  }
  q.body = lines.slice(1).join("\n").trim();
  q.text = q.text.join("\n").trim();
  q.rest = q.rest.join("\n").trim();
  return q;
}
function splitBlocks(lines) {
  const pre = [], blocks = [];
  for (const l of lines) {
    if (Q_HEAD.test(l)) blocks.push([l]);
    else if (blocks.length) blocks[blocks.length - 1].push(l);
    else pre.push(l);
  }
  return { pre, blocks: blocks.map(parseQBlock) };
}
function parsePreamble(pre, expected) {
  const sub = pre.length && !pre[0].startsWith(">") ? pre.shift() : "";
  // 判斷是不是中文翻譯：看中文字佔的比例（原文偶爾夾少量中文註記）
  const isTrans = t => {
    const cjk = (t.match(/[一-鿿]/g) || []).length, latin = (t.match(/[A-Za-z]/g) || []).length;
    return cjk > 0 && cjk / (cjk + latin) > 0.2;
  };
  // 第一步：切成一塊一塊（文章標籤 / 原文 / 翻譯）
  const chunks = [], vocab = [];
  let quote = null, afterTransLabel = false, inVocab = false;
  const flush = () => {
    if (!quote) return;
    const text = quote.join("\n");
    chunks.push({ type: afterTransLabel || isTrans(stripMarks(text)) ? "trans" : "en", text });
    quote = null; afterTransLabel = false;
  };
  for (const l of pre) {
    if (inVocab) { vocab.push(l); continue; }
    if (l.startsWith(">") || l.trim().startsWith("|")) { (quote || (quote = [])).push(l); continue; }
    flush();
    const lab = l.match(/^\*{0,2}文章\s*(\d+)\*{0,2}\s*$/);
    if (lab) chunks.push({ type: "label", text: "文章 " + lab[1] });
    else if (l.startsWith("**單字**")) { inVocab = true; vocab.push(l); }
    else if (l.trim() === "**翻譯**") afterTransLabel = true;
  }
  flush();
  // 第二步：沒標「文章 N」的地方，從「翻譯之後又出現的英文」裡挑最長的幾段當作新文章的開頭
  const labels = chunks.filter(c => c.type === "label").length;
  const lastLabel = chunks.map(c => c.type).lastIndexOf("label");
  const cands = chunks.map((c, k) => ({ c, k }))
    .filter(({ c, k }) => c.type === "en" && k > lastLabel && k > 0 && chunks[k - 1].type === "trans" && chunks.slice(0, k).some(x => x.type === "en"));
  const need = expected - Math.max(labels, 1);
  if (need > 0) cands.sort((a, b) => b.c.text.length - a.c.text.length).slice(0, need).forEach(({ c }) => c.split = true);
  // 第三步：組合
  const passages = [], trans = [];
  let cur = null;
  for (const c of chunks) {
    if (c.type === "label") { cur = { label: c.text, lines: [] }; passages.push(cur); trans.push(`**${c.text}**`); }
    else if (c.type === "trans") trans.push(c.text);
    else {
      if (!cur || c.split) { cur = { label: "", lines: [] }; passages.push(cur); }
      cur.lines.push(c.text);
    }
  }
  if (passages.length > 1) passages.forEach((p, k) => { if (!p.label) p.label = "文章 " + (k + 1); });
  return { sub, passages: passages.filter(p => p.lines.length), trans: trans.join("\n\n"), vocab: vocab.join("\n") };
}

    }
    const first = +(blocks[0] && blocks[0].num);
    const info = parsePreamble(pre, first >= 186 ? 3 : first >= 176 ? 2 : 1); // 多益 176-185 雙篇、186-200 三篇
    const byNum = {};
    for (const b of blocks) {
      const q = byNum[b.num] || (byNum[b.num] = { num: b.num, isNew: false, options: [], text: "", rest: "" });
      q.isNew = q.isNew || b.isNew;
      if (b.answer && q.options.length) { q.answer = b.answer; q.level = b.level; q.rest = b.body; } // Part 6：選項在前面，這塊全是解析
      else if (b.answer) { q.answer = b.answer; q.level = b.level; q.rest = b.rest; q.text = b.text; q.options = b.options; }
      else { if (b.options.length) q.options = b.options; if (b.rest) info.vocab += (info.vocab ? "\n\n" : "") + b.rest; }
    }
    const questions = Object.values(byNum).sort((a, b) => a.num - b.num);
    sets.push({ id: "s" + questions[0].num, part: p, heading: sec.heading, isNew: sec.isNew, ...info, questions });
  }
}

/* ---------- 作答紀錄 ---------- */
let state = {};
try { state = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) {}
const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} };
const st = id => state[id] || (state[id] = { picks: {}, done: false });

/* ---------- 畫面 ---------- */
const $ = s => document.querySelector(s);
document.title = title + " 閱讀練習";
$("#title").textContent = title + " 閱讀練習";
const partKeys = Object.keys(parts);
let curPart = partKeys[0];
try { const saved = localStorage.getItem(STORE_KEY + "-tab"); if (partKeys.includes(saved)) curPart = saved; } catch (e) {}

function renderTabs() {
  $("#tabs").innerHTML = partKeys.map(p =>
    `<button data-p="${p}" class="${p === curPart ? "active" : ""}">Part ${p}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    curPart = b.dataset.p;
    try { localStorage.setItem(STORE_KEY + "-tab", curPart); } catch (e) {}
    renderTabs(); renderMain(); scrollTo({ top: 0 });
  });
}

function renderScore() {
  let right = 0, done = 0, total = 0;
  for (const s of sets) {
    total += s.questions.length;
    const x = state[s.id];
    if (x && x.done) s.questions.forEach(q => { done++; if (x.picks[q.num] === q.answer) right++; });
  }
  $("#score").innerHTML = `已作答 <b>${done}</b> / ${total} 題，答對 <b>${right}</b> 題` + (done ? `（${Math.round(right / done * 100)}%）` : "");
}

function questionHTML(set, q) {
  const x = st(set.id), pick = x.picks[q.num];
  const opts = q.options.map(o => {
    let cls = "opt", tag = "";
    if (x.done) {
      if (o.key === q.answer) { cls += " right"; tag = "正解"; }
      else if (o.key === pick) { cls += " wrong"; tag = "你的答案"; }
      if (o.key === q.answer && o.key === pick) tag = "✓ 答對";
    } else if (o.key === pick) cls += " sel";
    return `<button class="${cls}" data-set="${set.id}" data-q="${q.num}" data-k="${o.key}" ${x.done ? "disabled" : ""}>
      <span class="l">(${o.key})</span><span>${inline(o.text)}</span>${tag ? `<span class="tag">${tag}</span>` : ""}</button>`;
  }).join("");
  let after = "";
  if (x.done) {
    const ok = pick === q.answer;
    after = `<div class="verdict ${ok ? "ok" : "bad"}">${ok ? "答對了" : pick ? `答錯了，你選 (${pick})` : "未作答"}・正確答案 (${q.answer})${q.level && q.level !== "?" ? `・難度：${q.level}` : ""}</div>
      <div class="explain">${md(q.rest)}</div>`;
  }
  return `<div class="q"><div class="qtext"><span class="qnum">${q.num}.</span>${q.isNew ? '<span class="new">新題型</span> ' : ""}${q.text ? md(q.text).replace(/^<p>|<\/p>$/g, "") : ""}</div>
    <div class="opts">${opts}</div>${after}</div>`;
}

function setHTML(set) {
  const x = st(set.id);
  const unanswered = set.questions.filter(q => !x.picks[q.num]).length;
  let passages = "";
  if (set.passages && set.passages.length) {
    passages = `<div class="passages">` + set.passages.map(p => {
      const body = p.lines.join("\n\n");
      return (p.label ? `<div class="plabel">${p.label}</div>` : "") + `<div class="passage">${md(x.done ? body : stripMarks(body))}</div>`;
    }).join("") + `</div>`;
  }
  const reveal = x.done && (set.trans || set.vocab)
    ? `<details class="reveal" open><summary>文章翻譯與單字</summary>${md(set.trans)}${md(set.vocab)}</details>` : "";
  const head = set.heading
    ? `<p class="set-title">${esc(set.heading)}${set.isNew ? ' <span class="new">新題型</span>' : ""}</p><p class="set-sub">${esc(set.sub || "")}</p>` : "";
  const btnLabel = set.heading ? "送出本題組" : "送出";
  const actions = x.done
    ? `<div class="actions"><span class="result">本組答對 ${set.questions.filter(q => x.picks[q.num] === q.answer).length} / ${set.questions.length}</span>
       <button class="btn" data-redo="${set.id}">重做這組</button></div>`
    : `<div class="actions"><button class="btn primary" data-submit="${set.id}" ${unanswered ? "disabled" : ""}>${btnLabel}</button>
       ${unanswered && set.questions.length > 1 ? `<span class="hint">還有 ${unanswered} 題沒選</span>` : ""}</div>`;
  return `<section class="card" id="${set.id}">${head}
    <div class="set-body ${passages ? "two" : ""}">${passages}<div>${set.questions.map(q => questionHTML(set, q)).join("")}${actions}</div></div>
    ${reveal}</section>`;
}

function renderSet(id) {
  const set = sets.find(s => s.id === id);
  const el = document.getElementById(id);
  el.outerHTML = setHTML(set);
  renderScore();
}

function renderMain() {
  const intro = intros[curPart];
  $("#main").innerHTML = (intro ? `<p class="part-intro"><b>Part ${curPart}：${intro.name}</b>　${esc(intro.text)}</p>` : "")
    + sets.filter(s => s.part === curPart).map(setHTML).join("");
  renderScore();
}

$("#main").addEventListener("click", e => {
  const opt = e.target.closest(".opt");
  if (opt && !opt.disabled) {
    st(opt.dataset.set).picks[opt.dataset.q] = opt.dataset.k; save(); renderSet(opt.dataset.set); return;
  }
  const sub = e.target.closest("[data-submit]");
  if (sub && !sub.disabled) { st(sub.dataset.submit).done = true; save(); renderSet(sub.dataset.submit); return; }
  const redo = e.target.closest("[data-redo]");
  if (redo) { state[redo.dataset.redo] = { picks: {}, done: false }; save(); renderSet(redo.dataset.redo); }
});
$("#resetAll").onclick = () => {
  if (!confirm("確定要清除這份考卷的所有作答紀錄？")) return;
  state = {}; save(); renderMain();
};

renderTabs();
renderMain();
</script>
</body>
</html>
