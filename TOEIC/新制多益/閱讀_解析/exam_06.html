const SOURCE = "# 目錄\n\n1. [PART 5：單句文法與詞彙](#part-5)\n   概念：這回合的 101~130 題涵蓋詞性判斷（名詞、形容詞、副詞的詞彙與位置）、動詞相關考點（單複數一致、未來進行式、被動態、對等句型的動詞形式）、代名詞（人稱代名詞的格、whoever 複合關係代名詞）、連接詞與介系詞的選擇（相關連接詞、副詞子句連接詞如讓步/時間、期間介系詞），以及分詞當形容詞（現在分詞 vs. 過去分詞）、沒有 if 的假設句、最高級等特殊句型，另外也穿插不少動詞、名詞、形容詞、副詞的詞彙題，考的是「看上下文選最合邏輯的字」。\n\n2. [PART 6：段落填空](#part-6)\n   概念：四篇短文分別是活動邀請函、投書信件、公司內部信件與徵才資訊，每篇挖 4 個空格。除了動詞時態語態、詞彙（動詞/名詞/副詞）、介系詞等基本文法之外，每篇都至少有一題「選出空格中正確的句子」（整句選擇題）與連接詞/連接副詞的判斷，需要讀懂上下文邏輯脈絡才能作答，不能只看單句。\n   1. [Questions 131-134 refer to the following invitation.](#questions-131-134-refer-to-the-following-invitation-)\n      概念：Dogorail 公司邀請商業夥伴參加運輸物流展覽的邀請函，說明展覽期間安排、執行長專題演講與私人諮詢服務。空格考點包含期間介系詞、名詞/副詞詞彙，以及一題整句選擇（選出空格中正確的句子）。\n   2. [Questions 135-138 refer to the following letter.](#questions-135-138-refer-to-the-following-letter-)\n      概念：讀者投書報社，澄清一篇報導誤傳兩家醫療機構合併會裁員的消息。空格考點包含動詞的單複數/時態/語態、動詞與名詞詞彙，以及一題整句選擇題。\n   3. [Questions 139-142 refer to the following e-mail.](#questions-139-142-refer-to-the-following-e-mail-)\n      概念：公司內部信件，說明新分公司設備到貨延遲、可能延後開幕，以及是否改向其他供應商調貨的因應方案。空格考點包含未來式、動詞詞彙、接 to 不定詞的動詞用法，以及一題整句選擇題。\n   4. [Questions 143-146 refer to the following information.](#questions-143-146-refer-to-the-following-information-)\n      概念：Goldline Staffing 公司徵才資訊，說明薪資事務人員的職務內容與公司提供的員工培訓資源。空格考點包含動詞詞彙、副詞選擇、連接副詞（表示因果的上下文銜接），以及一題整句選擇題。\n\n3. [PART 7：閱讀理解](#part-7)\n   概念：共 15 篇文章，文體涵蓋備忘錄、公告、網頁、簡訊/線上聊天對話、報告、廣告、信件、表單、議程表等；題型包括尋找主旨/目的、wh- 問題、Not/True 細節比對、推論題（含跨文章綜合推論）、替換表達（同義詞置換）、找出句子位置（插入句題），以及簡訊與聊天對話特有的「掌握意圖」題（判斷某句話的言外之意）。176 題之後多為雙篇或三篇文章的整合閱讀，需要對照不同文章才能作答。\n   1. [Questions 147-148 refer to the following memo.](#questions-147-148-refer-to-the-following-memo)\n      概念：公司內部備忘錄，宣布新任採購經理 Matthew Webb 將接替 Daniel Rodgers，並提醒同仁後續請購流程。考尋找主題/目的、wh- 問題（How）與替換表達。\n   2. [Questions 149-150 refer to the following announcement.](#questions-149-150-refer-to-the-following-announcement)\n      概念：西大寫作中心公告，介紹提供給學生的作業校對與寫作指導服務。考掌握文章目的、Not/True（找出未提及的選項）與替換表達。\n   3. [Questions 151-152 refer to the following information.](#questions-151-152-refer-to-the-following-information)\n      概念：拉法葉郡公園的入園規則公告，說明開放時間、遛狗規定、球場與花園位置等。考 Not/True 細節比對、wh- 問題（What）與替換表達。\n   4. [Questions 153-156 refer to the following text-message chain.](#questions-153-156-refer-to-the-following-text-message-chain-)\n      概念：Hilda 與 Larry 討論本週工作排程、Hanifan 專案進度與能否互相支援的簡訊對話。考推論細節資訊、Not/True、「掌握意圖」（判斷某句話真正想表達什麼）與 wh- 問題。\n   5. [Questions 157-159 refer to the following Web page.](#questions-157-159-refer-to-the-following-web-page)\n      概念：MyPost.com 網頁介紹其海外代收轉運服務的運作方式與加值服務。考整體與細節推論題，以及替換表達（同義詞置換）。\n   6. [Questions 160-161 refer to the following online chat discussion.](#questions-160-161-refer-to-the-following-online-chat-discussion-)\n      概念：同事間討論各部門薪資尚未入帳的線上聊天紀錄。考推論細節資訊與「掌握意圖」（判斷某句話的言外之意）。\n   7. [Questions 162-164 refer to the following report.](#questions-162-164-refer-to-the-following-report)\n      概念：市議會會議報告，說明老舊高架道路的三種處理方案及各自利弊。考 Not/True 細節比對與替換表達。\n   8. [Questions 165-167 refer to the following e-mail.](#questions-165-167-refer-to-the-following-e-mail)\n      概念：網路商店客服信，說明客戶訂購的兩個包包其中一款缺貨、預計到貨時間及後續處理選項。考尋找主題/目的、Not/True、替換表達，以及「找出句子位置」（插入句題）。\n   9. [Questions 168-171 refer to the following article.](#questions-168-171-refer-to-the-following-article)\n      概念：報導 Blackwell 海事博物館即將舉辦以 The Armitage 號郵輪為主題的展覽內容與門票資訊。考尋找主題/目的、Not/True、替換表達與同義詞判斷。\n   10. [Questions 172-175 refer to the following memo.](#questions-172-175-refer-to-the-following-memo)\n       概念：會計公司內部備忘錄，說明即將汰換辦公室硬體設備（伺服器、電腦、印表機）的計畫與員工需配合事項。考尋找主題/目的、Not/True、wh- 問題（What）、替換表達，以及「找出句子位置」。\n   11. [Questions 176-180 refer to the following article and e-mail.](#questions-176-180-refer-to-the-following-article-and-e-mail)\n       概念：雙篇文章——第一篇是 Generix 汽車公司召回瑕疵休旅車的新聞報導，第二篇是相關聯絡信件。考文章主旨、細節推論、wh- 問題（What）與跨兩篇文章的綜合推論題。\n   12. [Questions 181-185 refer to the following advertisement and letter.](#questions-181-185-refer-to-the-following-advertisement-and-letter)\n       概念：雙篇文章——第一篇是 Donnelly & Chung 品牌顧問公司的廣告，第二篇是客戶回覆信件。考 wh- 問題，以及需要對照兩篇文章才能作答的綜合推論題。\n   13. [Questions 186-190 refer to the following e-mails, and form.](#questions-186-190-refer-to-the-following-e-mails-and-form-)\n       概念：三篇文章——乘客 Maggie Flowers 因班機取消向航空公司申請補償與租車費用核銷的往來信件與表單。考尋找主題/目的、wh- 問題、替換表達、同義詞判斷，以及需要對照多篇文章的綜合推論與細節推論題。\n   14. [Questions 191-195 refer to the following schedule, e-mail, and article.](#questions-191-195-refer-to-the-following-schedule-e-mail-and-article-)\n       概念：三篇文章——綠色科技研討會的議程表，加上相關的信件與後續報導。考 Not/True（含跨文章綜合版）、多篇文章綜合推論、替換表達與同義詞判斷。\n   15. [Questions 196-200 refer to the following information, Web page, and e-mail.](#questions-196-200-refer-to-the-following-information-web-page-and-e-mail-)\n       概念：三篇文章——Westerburn 公立圖書館的線上續借規則、館藏查詢網頁與會員來信。考尋找主題/目的、Not/True（含跨文章綜合版）、替換表達，以及跨文章的 wh- 問題。\n\n-----------------------------------------------------------\n\n<!-- page 302 -->\n\n# TEST 06\nPart 5 翻譯・解說\nPart 6 翻譯・解說 🆕\nPart 7 翻譯・解說 🆕\n\n<!-- page 303 -->\n\n## PART 5\n\n**101.** 答案 (B)｜難度：高\nThe City of Clarkston requires that retail outlets obtain business licenses in order to ______ in commerce.\n- (A) attain\n- (B) engage\n- (C) permit\n- (D) emerge\n\n> Clarkston 市要求零售店家取得營業執照以從事商業活動。\n\n**動詞詞彙**\n文意是「要求取得營業執照以從事商業活動」，所以 (B) engage（從事）是正確答案。(A) attain 表示「達到，獲得」，(C) permit 表示「允許，許可」，(D) emerge 表示「出現，浮現」。另外，請注意 engage 通常以 engage in（從事…）的形式使用。\n\n**單字** retail outlet (phr.) 零售店；obtain (v.) 獲得，取得；license (n.) 許可，許可證，執照；commerce (n.) 商業，貿易\n\n**102.** 答案 (A)｜難度：中\nDanika Incorporated has promised substantial bonuses to employees who ______ in a minimum of 100 new customers this year.\n- (A) bring\n- (B) brings\n- (C) bringing\n- (D) to bring\n\n> Danika 公司承諾過會給今年帶來 100 名以上新顧客的員工豐厚的獎金。\n\n**〔動詞位置〕主格關係子句的先行詞與動詞單複數一致**\n主格關係子句（who ~ this year）缺少動詞，所以動詞 (A) 和 (B) 是可能的答案。主格關係代名詞（who）的先行詞（employees）是複數名詞，所以動詞複數形 (A) bring 是正確答案。動詞單數形 (B) 不能和複數主詞連用。動名詞或分詞 (C)、to 不定詞 (D) 不能用在動詞的位置。\n\n**單字** substantial (adj.) 相當多的，實際存在的；a minimum of (phr.) 至少…的\n\n**103.** 答案 (C)｜難度：低\n______ the mayor but all of the members of the city council attended the New Year's celebrations at city hall.\n- (A) As if\n- (B) Rather than\n- (C) Not only\n- (D) So long as\n\n> 不止是市長，所有市議會成員也都參加了在市府舉行的新年慶祝活動。\n\n**相關連接詞**\n能和 but 搭配形成相關連接詞 Not only A but (also) B（不止 A，還有 B）的 (C) Not only 是正確答案。Not only A but B 連接「the mayor」和「all of the members of the city council」這兩個名詞片語。(A) As if 表示「好像…一樣」，(D) So long as 表示「只要…的話」，兩者都是引導修飾子句的副詞子句連接詞。(B) Rather than 表示「而不是…」，用來連接兩個片語。\n\n**單字** mayor (n.) 市長；city council (phr.) 市議會；celebration (n.) 慶祝（活動）；city hall (phr.) 市府\n\n**104.** 答案 (C)｜難度：中\nDespite its vast assortment of attractive new features, Belta's latest smartphone is ______ priced compared to similar items produced by competitors.\n- (A) reason\n- (B) reasonable\n- (C) reasonably\n- (D) reasoned\n\n> Belta 最新的智慧型手機具備各式各樣吸引人的新特色，定價卻比競爭業者生產的類似產品來得合理。\n\n**副詞位置**\n能修飾動詞（is priced）的是副詞，所以副詞 (C) reasonably（合理地）是正確答案。名詞 (A)、形容詞 (B)、動詞或分詞 (D) 都不能修飾動詞。另外，修飾被動態（be + p.p）的副詞會放在 be 動詞和 p.p 之間，或者放在其後。\n\n**單字** vast (adj.) 廣大的，龐大的；assortment of (phr.) 各種的；price (v.) 定價；(n.) 價格；competitor (n.) 競爭業者，競爭者\n\n<!-- page 304 -->\n\n**105.** 答案 (C)｜難度：高\nAt the end of the concert, audience members ______ with excitement when the band agreed to perform two additional songs.\n- (A) displayed\n- (B) indicated\n- (C) reacted\n- (D) countered\n\n> 在演唱會的尾聲，當樂團同意再表演兩首歌時，觀眾反應熱烈。\n\n**動詞詞彙**\n文意是「當樂團同意再表演兩首歌時，觀眾反應熱烈」，所以動詞 react（反應）的過去式 (C) reacted 是正確答案。(A) 的動詞 display（展示）和 (B) 的 indicate（指出）似乎在意義上也說得通，但因為是及物動詞，所以不能和介系詞（with）連用。(D) 的動詞 counter 表示「反對，反駁」。\n\n**單字** audience (n.) 觀眾，聽眾；agree (v.) 同意\n\n**106.** 答案 (A)｜難度：低\nPassengers must confirm ______ flights at least 72 hours prior to the scheduled time of departure.\n- (A) their\n- (B) them\n- (C) theirs\n- (D) themselves\n\n> 乘客必須在預定出發時間的至少 72 小時前確認航班。\n\n**人稱代名詞的格**\n能像形容詞一樣，在名詞（flights）前面做修飾的人稱代名詞是所有格，所以人稱代名詞所有格 (A) their 是正確答案。人稱代名詞受格 (B)、所有代名詞 (C)、反身代名詞 (D) 都不能修飾名詞。\n\n**單字** confirm (v.) 確認，確定；flight (n.) 飛機的航班，飛行；prior to (phr.) 在…之前；departure (n.) 出發，離開\n\n**107.** 答案 (B)｜難度：高\n______ the money earned from its most recent promotion, Health-Ease Beverages expanded its product line of organic fruit drinks.\n- (A) Apart from\n- (B) With\n- (C) After\n- (D) If only\n\n> 利用最近一次促銷所賺的錢，Health-Ease Beverages 公司擴大了有機水果飲料的產品系列。\n\n**〔引導修飾語的成分〕選擇介系詞 其他**\n這個句子是有主詞（Health-Ease Beverages）、動詞（expanded）、受詞（its product line of organic fruit drinks）的完整句，所以 ______ ~ promotion 的部分視為修飾語。這個修飾語是沒有動詞的修飾片語，所以能引導修飾片語的介系詞 (A)、(B)、(C) 是可能的答案。因為要表示「用最近一次促銷所賺的錢擴大有機水果飲料的產品系列」的意思，所以介系詞 (B) With（用…）是正確答案。(A) Apart from「除了…」表示除外，(C) After（…之後）表示時間點。(D) If only（要是…就好了）是副詞子句連接詞，引導的不是修飾片語，而是修飾子句。\n\n**單字** earn (v.) 賺，獲得；promotion (n.) 促銷，宣傳；expand (v.) 擴大，擴張；organic (adj.) 有機農業的，有機的\n\n**108.** 答案 (A)｜難度：低\nAs part of the advertising campaign, an article with a very ______ description of the Ark Restaurant will be published in a food magazine.\n- (A) detailed\n- (B) stated\n- (C) limitless\n- (D) initial\n\n> 作為廣告宣傳活動的一部分，將會在一份飲食雜誌刊登詳細描述 Ark 餐廳的文章。\n\n**形容詞詞彙**\n文意是「詳細描述 Ark 餐廳的文章」，所以形容詞 (A) detailed（詳細的）是正確答案。(B) stated 表示「被陳述的，指定的」，(C) limitless 表示「無限的」，(D) initial 表示「最初的」。\n\n**單字** advertising (n.) 廣告；description (n.) 說明，描述；publish (v.) 刊登，出版\n\n<!-- page 305 -->\n\n**109.** 答案 (D)｜難度：中\nThe artist Vera Sheen ______ her work at the Center Gallery in Toronto later this year from September 1 to November 30.\n- (A) exhibiting\n- (B) has exhibited\n- (C) has been exhibited\n- (D) will be exhibiting\n\n> 藝術家 Vera Sheen 將於今年下半年的 9 月 1 日至 11 月 30 日在多倫多 Center 藝廊展出她的作品。\n\n**〔動詞位置〕未來進行式**\n句中缺少動詞，所以動詞 (B)、(C)、(D) 是可能的答案。因為有表示未來時間的詞語（later this year），所以表示在未來特定時間點進行中的未來進行式 (D) will be exhibiting 是正確答案。現在完成式 (B) 和 (C) 不能和表示未來時間的詞語連用。動名詞或分詞 (A) 不能用在動詞位置。\n\n**單字** work (n.) 作品，工作\n\n**110.** 答案 (C)｜難度：中\nStaff members attending the trade fair in Miami were instructed to make ______ for accommodations and bill the company at a later date.\n- (A) pays\n- (B) paying\n- (C) payments\n- (D) to pay\n\n> 參加邁阿密貿易展的員工被指示要付住宿費用，並且在日後向公司請款。\n\n**〔名詞位置〕動名詞 vs. 名詞**\n能放在及物動詞（make）受詞位置的是名詞，所以能當名詞的動名詞 (B)、名詞 (C)、to 不定詞 (D) 是可能的答案。因為要表示「付住宿的費用」的意思，所以能形成表示「付款」的慣用語 make payments 的 (C) payments 是正確答案。請記住 make payments（付款）這個慣用語。如果使用動名詞 (B)，意思會變成「製作住宿的支付」，所以不對。至於 to 不定詞 (D)，因為動詞 make（做）後面接的不應該是 to 不定詞，而是一般名詞，所以不對。另外，「make to 動詞原形」是一個慣用語，表示「正打算要做…（但被打斷）」的意思。動詞 (A) 不能用在名詞的位置。\n\n**單字** trade fair (phr.) 貿易展；instruct (v.) 指示，指導；accommodation (n.) 住宿，住處；bill (v.) 請款，開帳單\n\n**111.** 答案 (C)｜難度：高\n______ the factory operates at full capacity, it will not be able to produce enough items to satisfy the client's order requirements.\n- (A) Overall\n- (B) Wherever\n- (C) Even if\n- (D) Otherwise\n\n> 即使工廠以全部產能運作，也無法生產足夠的產品來滿足客戶的訂單要求。\n\n**〔引導修飾語的成分〕副詞子句連接詞 讓步**\n這個句子是有主詞（it）、動詞（will not be）、補語（able）的完整句，所以 ______ ~ capacity 的部分視為修飾語。這個修飾語是有動詞（operates）的修飾子句，所以能引導修飾子句的複合關係副詞 (B) 和副詞子句連接詞 (C) 是可能的答案。因為要表示「即使以全部產能運作，也無法生產足夠的產品來滿足訂單要求」的意思，所以表讓步的副詞子句連接詞 (C) Even if（即使…）是正確答案。如果使用複合關係副詞 (B) Wherever（不管哪裡），意思會變成「不管工廠在哪裡以全部產能運作」，所以不對。形容詞或副詞 (A) Overall（總體的；總體上）和連接副詞 (D) Otherwise（不然的話）不能引導修飾子句。\n\n**單字** operate at full capacity (phr.) 以全部產能運作；satisfy (v.) 滿足，符合；requirement (n.) 要求，必要條件，需要\n\n<!-- page 306 -->\n\n**112.** 答案 (A)｜難度：中\nVisitors to Cordera Chemicals are asked to ______ at the security desk and speak with a guard before proceeding into the building.\n- (A) stop\n- (B) reflect\n- (C) drop\n- (D) retire\n\n> Cordera Chemicals 公司的訪客被要求留在保全櫃台並知會警衛，然後才能進入大樓。\n\n**動詞詞彙**\n文意是「在進入大樓之前要留在保全櫃台並且和警衛談過」，所以動詞 (A) stop（停下，停留）是正確答案。(B) reflect 表示「反映」，(C) drop 表示「落下」，(D) retire 表示「退休」。\n\n**單字** security (n.) 保全，安全；proceed (v.) 前進，進行\n\n**113.** 答案 (C)｜難度：低\nSummer interns are expected to perform a variety of tasks, from completing routine paperwork to ______ a hand on different research projects when needed.\n- (A) lend\n- (B) lent\n- (C) lending\n- (D) lender\n\n> 暑期實習生預計將進行多種工作，包括從完成日常文書作業到需要時協助多種不同研究計畫等等。\n\n**對等句型**\nfrom A to B（從 A 到 B）的結構中，介系詞 from 和 to 的受詞必須是相同的文法成分，所以和 A 位置的動名詞（completing）形態相同的 (C) lending 是正確答案。另外，請記得 lend a hand（幫忙）這個慣用語。動詞 (A)、動詞或分詞 (B) 不能當介系詞的受詞，而名詞 (D) 不能在沒有連接詞的情況下和名詞（a hand）並列。請注意不要把空格前面的 to 當成不定詞的 to 而誤選動詞 (A)。\n\n**單字** expect (v.) 預期，期望；a variety of (phr.) 多樣的；task (n.) 任務，工作；routine (adj.) 日常的；(n.) 例行事務；paperwork (n.) 文書作業\n\n**114.** 答案 (B)｜難度：中\nThe lineup of speakers ______ by organizers to appear at this month's lecture series has been modified.\n- (A) inviting\n- (B) invited\n- (C) will invite\n- (D) has been invited\n\n> 受主辦人邀請出席本月系列講座的演講者陣容已經更改了。\n\n**〔引導修飾語的成分〕現在分詞 vs. 過去分詞**\n這個句子是有主詞（The lineup of speakers）和動詞（has been modified）的完整子句，所以 ______ by organizers ~ series 的部分視為修飾語，能夠引導修飾語的現在分詞 (A) 和過去分詞 (B) 是可能的答案。被修飾的名詞（speakers）和分詞表示「演講者受到邀請」的被動意義，而且 by 後面接行為主體，所以過去分詞 (B) invited 是正確答案。如果使用現在分詞 (A)，意思會變成「在進行邀請的演說者」，所以不對。動詞 (C) 和 (D) 不能引導修飾語。\n\n**單字** lineup (n.) 陣容，列隊；organizer (n.) 主辦者，組織者；modify (v.) 變更，修改\n\n**115.** 答案 (D)｜難度：高\nTo thank the clients who participated in the marketing study, the company sent out e-mails with ______ vouchers worth a total of $50.\n- (A) tolerable\n- (B) affordable\n- (C) gratified\n- (D) attached\n\n> 為了感謝參與行銷研究的客戶，公司寄出了附上總價值 50 美元的禮券的電子郵件。\n\n**形容詞詞彙**\n文意是「為了感謝客戶而寄出附禮券的電子郵件」，所以形容詞 (D) attached（附加的）是正確答案。(A) tolerable 表示「可以容忍的」，(B) affordable 表示「負擔得起的」，(C) gratified 表示「滿意的」。\n\n**單字** study (n.) 調查，研究；(v.) 學習；voucher (n.) 商品券，優惠券；worth (adj.) 價值…的\n\n<!-- page 307 -->\n\n**116.** 答案 (D)｜難度：高\nHad he known sooner about the opening at Gray Consulting, Michael ______ for a job there instead of at Hardwick International.\n- (A) applied\n- (B) is applying\n- (C) should apply\n- (D) would have applied\n\n> 要是當時早點知道 Gray 顧問公司的職缺的話，Michael 就會應徵那裡的工作，而不是 Hardwick International 公司的。\n\n**沒有 if 的假設句型**\n因為句子用 Had 開頭，而且主詞（he）後面直接接 p.p.（known），可知這是假設語氣過去完成式的 if 子句省略 if 之後，將主詞與助動詞倒置的結果。所以，時態能夠和 if 子句的 Had ~ known 搭配並構成假設語氣過去完成式的 (D) would have applied 是正確答案。假設語氣過去完成式表示與過去事實相反的假設，句型是「If + 主詞 + had p.p., 主詞 + would(could, might, should) have p.p.」；另一方面，假設語氣過去式則表示與現在事實相反的假設，句型是「If + 主詞 + 動詞過去式（be 動詞則為 were）, 主詞 + would + 動詞原形」。過去式 (A) 和現在進行式 (B) 不適用於假設語氣過去完成式的主要子句，而 should + 動詞原形 (C) 則應該用在假設語氣過去式的主要子句。\n\n**117.** 答案 (D)｜難度：高\nThe junior chefs were given a test to determine how ______ they could prepare a meal using only a few ingredients.\n- (A) importantly\n- (B) sparsely\n- (C) totally\n- (D) skillfully\n\n> 資歷較淺的廚師們接受了測試，判定他們只用幾種食材做出餐點的技能如何。\n\n**副詞詞彙**\n文意是「判定他們做菜技能如何的測試」，所以副詞 (D) skillfully（熟練地）是正確答案。(A) importantly 表示「重要地」，(B) sparsely 表示「稀疏地，稀少地」。(C) totally 表示「完全地，全部地」，只能說明被修飾的對象程度完全與否，不能和表示程度多少的 how 連用。\n\n**單字** junior (adj.) 資歷較淺的，年紀較輕的；determine (v.) 判定，決定；prepare (v.) 準備，做（菜）；ingredient (n.) 材料，成分\n\n**118.** 答案 (A)｜難度：高\nEgypt's National History Museum seeks to preserve the country's rich cultural ______ by protecting many priceless artifacts.\n- (A) heritage\n- (B) findings\n- (C) scenery\n- (D) texture\n\n> 埃及的國家歷史博物館希望藉由保護許多無價的文物來保存該國豐富的文化遺產。\n\n**名詞詞彙**\n文意是「試圖保存這個國家豐富的文化遺產」，所以名詞 (A) heritage（遺產）是正確答案。(B) findings 表示「研究結果」，通常用複數形。(C) scenery 表示「風景，景色」，(D) texture 表示「質地」。\n\n**單字** preserve (v.) 保存，維持；rich (adj.) 豐富的，富有的；priceless (adj.) 無價的，寶貴的；artifact (n.)（有歷史或文化價值的）人工製品，文物\n\n**119.** 答案 (C)｜難度：中\nIt took the work crew one week to repair the fence running along the ______ of Mr. Haskell's property.\n- (A) angle\n- (B) dimension\n- (C) border\n- (D) expression\n\n> 修理 Haskell 先生的房地周邊的圍欄，花了施工團隊一週的時間。\n\n**名詞詞彙**\n文意是「修理沿著房地邊界的圍欄」，所以名詞 (C) border（邊界）是正確答案。(A) angle 表示「角度」，(B) dimension 表示「大小，範圍」，(D) expression 表示「表達」。\n\n**單字** crew (n.) 全體工作人員，全體船員／機組人員；fence (n.) 柵欄；run (v.) 延伸，持續\n\n<!-- page 308 -->\n\n**120.** 答案 (D)｜難度：低\nFiercely determined to demonstrate she was worthy of the job, Ms. Olmedo consistently worked the ______ among the newly hired personnel.\n- (A) harder\n- (B) hard\n- (C) hardly\n- (D) hardest\n\n> 因為有強烈的決心要證明自己值得這份工作，所以 Olmedo 小姐一直是新雇用的員工中最努力工作的。\n\n**最高級**\n因為動詞（worked）必須以副詞修飾，而且空格前面有 the，而空格後面有經常和最高級連用、表示「…之中」的 among，所以副詞 hard（努力地）的最高級 (D) hardest 是正確答案。比較級 (A) 不能接在這裡的 the 後面，而且要搭配 than 使用，表示兩者之一的程度比較高。原級 (B) 也不能接在這裡的 the 後面。(C) hardly 表示「幾乎不…」，當頻率副詞時通常用在一般動詞前面，或者助動詞、be 動詞後面，請區分它和當形容詞或副詞的 hard（硬的，辛苦的，努力地）的差別。\n\n**單字** fiercely (adv.) 強烈地，猛烈地；demonstrate (v.) 證明，表露；worthy (adj.) 值得的，有價值的；consistently (adv.) 持續地，一貫地；personnel (n.) 員工，全體人員\n\n**121.** 答案 (C)｜難度：中\nThe administrative department announced that ______ the new cafeteria is built, office workers will be provided with weekly meal allowances.\n- (A) already\n- (B) likewise\n- (C) once\n- (D) still\n\n> 行政部門宣布，新的員工餐廳落成後，員工就會得到每週用餐津貼。\n\n**〔引導修飾語的成分〕副詞子句連接詞 時間**\n及物動詞（announced）的受詞 that 子句（that ~ allowances）是有主詞（office workers）和動詞（will be provided）的完整句，所以 ______ the new cafeteria is built 的部分視為修飾語。這個修飾語是有動詞（is built）的修飾子句，所以能引導修飾子句的副詞子句連接詞 (C) once（一旦…）是正確答案。副詞 (A) already（已經）、(B) likewise（同樣地）、(D) still（仍然）都不能引導修飾子句。\n\n**單字** administrative (adj.) 行政的，管理的；cafeteria (n.) 員工／學生餐廳；allowance (n.) 津貼，零用金\n\n**122.** 答案 (B)｜難度：中\nCottage rentals at the Devon Resort are typically sold out by early spring and ______ difficult to book by the time summer starts in June.\n- (A) now\n- (B) thus\n- (C) else\n- (D) besides\n\n> Devon 度假村的出租度假屋通常在早春就銷售一空，所以在夏天開始的六月很難訂到。\n\n**選擇副詞**\n要表達的意思是「因為在早春銷售一空，所以在夏天開始的六月很難訂到」的因果關係，所以 (B) thus（因此，從而）是正確答案。(A) now（現在）因為後面有表達其他時間的詞語（by the time summer starts in June），所以不適用。(C) else 是表示「其他」的副詞。(D) besides 當副詞時表示「而且，此外」，用來補充前面敘述的內容，通常用在有主詞和動詞的完整句之前或之後。\n\n**單字** cottage (n.)（鄉間的）小屋，別墅；rental (n.) 出租，租金；typically (adv.) 通常，典型地；sell out (phr.) 賣完；book (v.) 預訂\n\n<!-- page 309 -->\n\n**123.** 答案 (A)｜難度：高\nEconomists use advanced statistical methods that they believe can ______ forecast buying trends in the market.\n- (A) correctly\n- (B) previously\n- (C) motivationally\n- (D) extremely\n\n> 經濟學家運用他們認為能夠正確預測…場購買趨勢的先進統計方法。\n\n**副詞詞彙**\n文意是「正確預測購買趨勢」，所以副詞 (A) correctly（正確地）是正確答案。(B) previously 表示「…前」，(C) motivationally 表示「激發地，促進地」，(D) extremely 表示「極度地」。\n\n**單字** advanced (adj.) 先進的，進階的；statistical (adj.) 統計的；method (n.) 方法，條理；trend (n.) 趨勢，傾向\n\n**124.** 答案 (C)｜難度：最高\nLibrary patrons who lose borrowed materials ______ accountable for paying the cost of replacing them.\n- (A) were holding\n- (B) has held\n- (C) are held\n- (D) will be holding\n\n> 遺失借出資料的圖書館利用者必須…替代品的費用。\n\n**第 5 類句型的被動態**\n表示「要 A 為 B 負責」的慣用語是 hold A accountable for B，其中的動詞 hold 是及物動詞，但這裡…後面沒有受詞，而且表示「被要求必須付出更替資料的費用」的被動意義，所以被動態 (C) are held 是正…答案。這個句子將接受詞及受詞補語的第 5 類動詞 hold（在這裡表示「認為」）構成被動態，實際…的受詞（Library patrons who lose borrowed materials）放在主詞位置，而受詞補語（accountable）仍…動詞後面。(A)、(B)、(D) 都是主動態，所以不對。\n\n**單字** patron (n.) 顧客，贊助人；replace (v.) 代替，替換\n\n**125.** 答案 (A)｜難度：低\nAccording to the company timetable, the business luncheon is supposed to take place ______ 12 p.m. and 2 p.m. this coming Friday.\n- (A) between\n- (B) except\n- (C) during\n- (D) within\n\n> 根據公司的時間表，商務午餐會預…本週五中午 12 點到下午 2 點間舉行。\n\n**選擇介系詞 期間**\n要表達的意思是「午餐會在中午 12 點到下午 2 點之間舉行」，所以表示特定時間點之間的介系…between（在…之間）是正確答案。(B) except 表示「除了…以外」，也經常以 except for 的形式使用…during 表示「在…期間」，雖然也表示期間，但後面要接表示持續期間或活動的詞語。如果使用 (D) within（在…以內）的話，雖然好像也說得通，但其實應該像 within 2 hours（在 2 小時以內）一樣，表達以…時間長度或範圍為限的意思，所以不對。\n\n**單字** timetable (n.) 時間表；luncheon (n.) 午餐會；be supposed to (phr.) 應該做…；take place (phr.) 舉行\n\n**126.** 答案 (D)｜難度：中\nThe Barbuda Hotel and Spa has a staff of professional performers whose sole job is to provide nightly ______ for the guests.\n- (A) entertains\n- (B) entertainers\n- (C) entertained\n- (D) entertainment\n\n> Barbuda Hotel and Spa 有一群專業…演者，他們唯一的工作就是為賓客提…晚間的娛樂。\n\n**〔名詞位置〕人物名詞 vs. 抽象名詞**\n能被空格前的形容詞（nightly）修飾的是名詞，所以名詞 (B) 和 (D) 是可能的答案。因為要表達「提供晚…間的娛樂」的意思，所以抽象名詞 (D) entertainment（娛樂）是正確答案。如果使用人物名詞 (B) entertainers（表演者）的話，意思會變成「提供晚間的表演者」，所以不對。動詞 (A)、動詞或分詞 (C) 不能被形容詞修飾。\n\n<!-- 註：本頁右緣被書溝陰影遮住，上列「…」處無法辨識；右側「答案 (X)」標籤亦被遮住，答案依解析內文所述填入。 -->\n\n<!-- page 310 -->\n\n**127.** 答案 (B)｜難度：低\nEconomic conditions in the country have not been ______ for Avatech to market a new tablet computer line, and so far sales have been mediocre.\n- (A) optimize\n- (B) optimal\n- (C) optimally\n- (D) optimization\n\n> 國內經濟狀況對於 Avatech 公司推出新平板電腦系列並不是最理想的，目前銷售成績也平平。\n\n**〔補語位置〕名詞補語 vs. 形容詞補語**\n空格是 be 動詞（been）後面的補語位置，所以能用在補語位置的形容詞 (B) 和名詞 (D) 是可能的答案。因為要表達「對於推出新平板電腦系列上市並不是最理想的」的意思，所以能說明主詞（Economic conditions）狀態的形容詞 (B) optimal（最理想的）是正確答案。如果使用名詞 (D) optimization（最佳化）的話，應該表示和主詞相同的事物，意思會變成「經濟狀況不是最佳化」，所以不對。動詞 (A) 和副詞 (C) 不能用在補語的位置。\n\n**單字** condition (n.) 狀況，狀態，條件；so far (phr.) 到目前為止；mediocre (adj.) 平凡的，普通的\n\n**128.** 答案 (B)｜難度：中\nFinancial advisors at Bishop Investment give ______ suggestions for saving money and planning budgets in everyday life.\n- (A) construct\n- (B) constructive\n- (C) constructing\n- (D) constructively\n\n> Bishop 投資公司的財務顧問對於在日常生活中儲蓄以及計畫預算提供建設性的建議。\n\n**形容詞位置**\n能修飾空格後方名詞（suggestions）的是形容詞，所以形容詞 (B) 和能當形容詞用的分詞 (C) 是可能的答案。因為要表達「給予關於儲蓄以及計畫預算的建設性建議」的意思，所以形容詞 (B) constructive（建設性的）是正確答案。如果使用現在分詞 (C) constructing，意思會變成「做建設的建議」，所以不對。動詞 (A) 和副詞 (D) 不能修飾名詞。\n\n**單字** advisor (n.) 顧問；budget (n.) 預算；everyday life (phr.) 日常生活\n\n**129.** 答案 (C)｜難度：高\nThe short-term student exchange program is open to ______ is presently enrolled in a full-time course at Gardner University.\n- (A) all\n- (B) every\n- (C) whoever\n- (D) many\n\n> 短期交換學生計畫開放任何目前已經註冊 Gardner 大學正規課程者報名。\n\n**名詞子句連接詞 複合關係代名詞 whoever**\n空格之後的部分（______ ~ University）是介系詞 to 的受詞，所以能形成名詞子句、能當成名詞子句連接詞的複合關係代名詞 (C) whoever（任何人）是正確答案。限定詞或代名詞 (A) all（所有的；所有的東西）和 (D) many（許多的；許多）、限定詞 (B) every（任何的）不能引導子句。\n\n**單字** short-term (adj.) 短期的；presently (adv.) 現在，目前；enroll (v.) 註冊，使入學；full-time (adj.) 全部時間的，正規的\n\n**130.** 答案 (B)｜難度：最高\nMr. Benning seemed ______ calm when performing at the recital last evening, but later he mentioned having felt quite nervous.\n- (A) hesitantly\n- (B) outwardly\n- (C) smoothly\n- (D) intimately\n\n> 在昨晚的演奏會，Benning 先生外表看起來很冷靜，但事後他說自己覺得很緊張。\n\n**副詞詞彙**\n文意是「在演奏會外表看起來很冷靜，但其實很緊張」，所以副詞 (B) outwardly（外表上）是正確答案。(A) hesitantly 表示「猶豫地」，(C) smoothly 表示「順利地」，(D) intimately 表示「親密地」。\n\n<!-- page 311 -->\n## PART 6\n\n### Questions 131-134 refer to the following invitation. 🆕\n131-134 題參照以下邀請函。\n\n> You are Cordially Invited\n>\n> Dogorail would like to invite its business associates to the 25th Dogorail Transport and Logistics Exhibition scheduled for November 9 to 11 in Prague. Dogorail will be displaying its products and services on the main floor of the Zidenic Convention Center ______(131) the three-day event. And there will be a special presentation by Dogorail CEO Miroslav Sergeyev on the final night. ______(132) Representatives from Dogorail will be in attendance to assist visitors with their queries. Private ______(133) on any of our offerings are welcome if you wish to obtain advice about your particular requirements.\n>\n> To confirm your attendance to this event, please return the enclosed form, ______(134) filled out and with your signature appended, on or before April 30.\n\n**翻譯**\n> 誠摯邀請您\n>\n> Dogorail 公司希望邀請商業夥伴們參[加]…預定 11 月 9 日至 11 日於布拉格舉[行]之第 25 屆 Dogorail 運輸暨物流展。…為期三天的活動中，Dogorail 公司將[全]程於 Zidenic 會議中心一樓展示產品[及]服務。而最終日晚間將由 Dogorail 公司執行長 Miroslav Sergeyev 進行特別[報]告。[132]他將會討論近期於摩爾多瓦、[保]加利亞及希臘等地的鐵路計畫。…Dogorail 公司代表將到場協助回答參[觀]者的詢問。[133]若您希望獲得關於您特[殊]需求之建議，也歡迎您接受關於本公[司]所提供之任何產品及服務的私人諮[詢]。\n>\n> [134]欲確認出席本活動，請於 4 月 30 [日]前將隨函所附之表格填妥並簽名[後寄]回。\n\n*(註：本頁右欄中譯右緣被掃描裁切，方括號內文字為依殘留筆畫推定，「…」為完全無法辨識的部分。)*\n\n**131.**\n- (A) onto\n- (B) upon\n- (C) throughout\n- (D) outside\n\n**132.** 🆕\n- (A) Dogorail products will be unveiled to event invitees once he has finished.\n- (B) He will be discussing the recent rail projects in Moldova, Bulgaria, and Greece.\n- (C) Requests to use a meeting room at the event must be submitted in advance.\n- (D) His special address has been arranged to begin at 9:00 a.m.\n\n**133.**\n- (A) occupations\n- (B) consultations\n- (C) dominions\n- (D) possessions\n\n**134.**\n- (A) primarily\n- (B) fluently\n- (C) fully\n- (D) temporarily\n\n**單字** cordially (adv.) 誠摯地，熱忱地；associate (n.) 同事，夥伴；transport (n.) 運輸；(v.) 輸送；logistics (n.) 物流；display (v.) 展示，展出；be in attendance (phr.) 出席；assist (v.) 協助，幫助；query (n.) 詢問；(v.) 詢問；private (adj.) 個人的，私人的；enclose (v.) 隨信封入，圍起；fill out (phr.) 填寫；append (v.) 附加，附上（簽名）\n\n<!-- page 312 -->\n**131.** 答案 (C)｜難度：高\n**選擇介系詞 期間**\n文意是「在為期三天的活動中，從頭到尾持續展示產品和服務」，所以表示期間的介系詞 (C) throughout（在…的整段期間）是正確答案。(A) onto「到…上面」表示位置，(B) upon「在…上面，一…就」表示位置或時間點，(D) outside「在…外面」表示位置。\n\n**132.** 答案 (B)｜難度：中 🆕\n**選出空格中正確的句子**\n這是選擇句子的題目，所以要參考空格前後或文章整體的內容。上一句「there will be a special presentation by Dogorail CEO Miroslav Sergeyev on the final night.」提到，最後一天晚上有 Dogorail 公司執行長的特別報告，所以空格的內容應該跟報告內容有關，正確答案是 (B) He will be discussing the recent rail projects in Moldova, Bulgaria, and Greece。\n\n**選項翻譯**\n- (A) 他的報告結束後，將向受邀參加活動者公開 Dogorail 公司的產品。\n- (B) 他將會討論近期於摩爾多瓦、保加利亞及希臘等地的鐵路計畫。\n- (C) 於活動中使用會議室的申請必須預先提出。\n- (D) 他的特別演講安排在上午 9 點開始。\n\n**單字** unveil (v.) 揭露，公開；invitee (n.) 受邀者；once (conj.) 一旦…；submit (v.) 提出，屈從；address (n.) 演說，地址\n\n**133.** 答案 (B)｜難度：（左緣裁切，無法辨識）\n**名詞詞彙** 參考上下文\n文意是「關於本公司所提供任何事物的個人 ______ 也很歡迎」，所有選項都是可能的答案。因為無法從空格所在的句子判斷答案，所以必須參考空格前後或文章整體的內容。上一句「Representatives from Dogorail will be in attendance to assist visitors with their queries.」提到公司代表將到場協助回答參觀者的詢問，可知現場應該可以提供個人諮詢，所以名詞 (B) consultations（諮詢）是正確答案。(A) 的名詞 occupation 表示「職業」，(C) 的 dominion 表示「統治」，(D) 的 possession 表示「擁有」。\n\n**134.** 答案 (C)｜難度：（左緣裁切，無法辨識）\n**副詞詞彙**\n文意是「完整地填寫（表格）」，所以副詞 (C) fully（完全地，全部）是正確答案。(A) primarily 表示「主要」，(B) fluently 表示「流暢地」，(D) temporarily 表示「臨時地」。\n\n<!-- page 313 -->\n### Questions 135-138 refer to the following letter. 🆕\n135-138 題參照以下信件。\n\n> April 28\n>\n> *The Missourian*\n> 438 East St. Louis Street\n> Springfield, MO 65806\n>\n> To the Editor:\n>\n> I wish to point out an error in a recent article in your newspaper. Last week, it ______(135) that over a thousand workers could lose their jobs if Liberty Medical Group merges with Midland Health Services. This is untrue.\n>\n> I would like to emphasize that ______(136) have not been completed. I can say this because I am involved in the talks on behalf of Liberty Medical Group. In addition, if these two organizations merge, they would be in a better position to create new employment opportunities. This is because a consolidated firm can ______(137) jobs that each of the companies would have been unable to offer on their own.\n>\n> It is our expectation that you will print a retraction. ______(138). I am hoping for your immediate response.\n>\n> Sincerely,\n> Andrew Sweet\n> Company spokesperson\n\n**翻譯**\n> 4 月 28 日\n>\n> 《The Missourian》\n> 438 號，East St. Louis 街\n> 春田市，密蘇里州 65806\n>\n> 致編輯：\n>\n> 我想指出貴報最近一則報導中的錯[誤]。[135]上週貴報報導，若 Liberty Medic[al] Group 與 Midland Health Services [公]司合併，有一千餘名員工可能失業。[這]並非事實。\n>\n> [136]我想強調，協商尚未完成。因為我[代]表 Liberty Medical Group 參與商[談]，所以有資格這麼說。此外，如果兩[個組]織合併，將有更好的立足點來創造[新的]就業機會。[137]這是因為合併的公司[能]產生過去兩家公司無法獨自提供的[工]作。\n>\n> 我們期望您能夠刊出撤回先前內容的[更]正。[138]如此將可修正貴報先前報導[所造]成的誤會。希望您能夠立即回覆。\n>\n> Andrew Sweet\n> 公司發言人\n\n*(註：本頁右欄中譯右緣被掃描裁切，方括號內文字為依殘留筆畫推定。)*\n\n**135.**\n- (A) was reported\n- (B) is reported\n- (C) will report\n- (D) will be reported\n\n**136.**\n- (A) evaluations\n- (B) acquisitions\n- (C) assignments\n- (D) negotiations\n\n**137.**\n- (A) review\n- (B) generate\n- (C) perfect\n- (D) monitor\n\n**138.** 🆕\n- (A) We will be holding a press conference regarding the recent merger.\n- (B) Midland Health Services will be closing its doors this month.\n- (C) This will correct any misunderstanding caused by your earlier article.\n- (D) This will reduce the number of employees in our establishment.\n\n**單字** point out (phr.) 指出，提出；merge (v.) 合併，融合；emphasize (v.) 強調，著重；on behalf of (phr.) 代表…；employment (n.) 雇用，就業；consolidate (v.) 合併，鞏固；print (v.) 刊出，印刷；retraction (n.) 撤回，更正啟事，縮回\n\n<!-- page 314 -->\n**135.** 答案 (A)｜難度：（左緣裁切，無法辨識）\n**動詞的單複數、時態、語態要正確**\n因為是「有上千名員工可能失業這件事被報導出來」的被動意義，而且空格後面沒有受詞，所以被動態 (A) 和 (B) 是可能的答案。因為有表示過去時間的詞語（Last week），所以過去式被動態 (A) was reported 是正確答案。現在式 (B)、未來式 (C) 和 (D) 不能搭配表示過去時間的詞語使用。另外，請記得動詞 report（報導，報告）有及物和不及物的用法。\n\n**136.** 答案 (D)｜難度：高\n**名詞詞彙** 參考全文\n文意是「______ 還沒結束」，所有選項都是可能的答案。因為無法從空格所在的句子判斷答案，所以必須參考空格前後或文章整體的內容。前面部分提到，關於 Liberty Medical Group 與 Midland Health Services 公司合併的報導不是事實，而文章整體說明若是兩家公司合併，未來可能發生什麼結果，可知公司合併的協商還沒有完成，所以名詞 (D) negotiations（協商）是正確答案。(A) 的名詞 evaluation 表示「評價」，(B) 的 acquisition 表示「收購（公司）」，(C) 的 assignment 表示「分配，（課後）作業」。\n\n**137.** 答案 (B)｜難度：（左緣裁切，無法辨識）\n**動詞詞彙** 參考上下文\n文意是「合併的公司能夠 ______ 過去兩家公司各自無法提供的工作」，所有選項都是可能的答案。因為無法從空格所在的句子判斷答案，所以必須參考空格前後或文章整體的內容。上一句提到，合併將使兩家公司有更好的立足點來創造新的就業機會，可知合併後的公司有可能提供以前兩家公司無法提供的工作，所以動詞 (B) generate（產生）是正確答案。(A) review 表示「審查，再檢查」，(C) perfect 表示「使完美」，(D) monitor 表示「監控」。\n\n**138.** 答案 (C)｜難度：（左緣裁切，無法辨識） 🆕\n**選出空格中正確的句子**\n這是選擇句子的題目，所以要參考空格前後或文章整體的內容。上一句「It is our expectation that you will print a retraction.」提到，希望對方能夠刊出更正啟事，所以空格的內容應該和更正的理由有關，正確答案是 (C) This will correct any misunderstanding caused by your earlier article。\n\n**選項翻譯**\n- (A) 我們將召開關於最近合併案的記者會。\n- (B) Midland Health Services 公司將於本月結束營業。\n- (C) 如此將可修正貴報先前報導所造成的誤會。\n- (D) 如此將可減少本機構的員工人數。\n\n**單字** press conference (phr.) 記者會；misunderstanding (n.) 誤解，誤會；reduce (v.) 減少，縮小\n\n<!-- page 315 -->\n### Questions 139-142 refer to the following e-mail. 🆕\n139-142 題參照以下電子郵件。\n\n> To: Margo Sloane <msloane@bowenassociates.com>\n> From: Jan Fitch <jfitch@bowenassociates.com>\n> Subject: Equipment delivery\n> Date: October 11\n>\n> Mr. Jurgens at the new branch called to say that the office equipment we ordered from Filepros arrived on October 9. He and the technicians are now busy installing the machinery.\n>\n> Unfortunately, I learned that the shipment of other items from Draper ______(139) longer. The earliest they can guarantee delivery is after October 16, which could force us to delay our opening to October 25. If management prefers, we can ______(140) the order. I have asked Mr. Sampson, one of our suppliers, ______(141) if he can get the needed items at short notice. He understands the situation and has confirmed that he can obtain the materials immediately. ______(142). I will wait for word from you regarding the Draper order and will keep sending you updates.\n\n**翻譯**\n> 收件者：Margo Sloane <msloane@bowenassociates.com>\n> 寄件者：Jan Fitch <jfitch@bowenassociates.com>\n> 主旨：設備運送\n> 日期：10 月 11 日\n>\n> 新分公司的 Jurgens 先生打電話來[說]，我們向 Filepros 公司訂購的辦公室[設備]10 月 9 日送到了。他和技術人員[現在]忙著安裝機械。\n>\n> [139]但很遺憾，我得知 Draper 公司的[其]他貨物要花比較久的時間才會送到。[他]們能保證的最早送達時間是 10 月 [16] 日之後，這樣可能迫使我們把開幕延[後]到 10 月 25 日。[140]如果經營團隊希[望的]話，我們可以取消訂單。[141]我已經[問我]們供應商之一的 Sampson 先生確認[是]否能在臨時通知的情況下取得需要[的品]項。他了解這個情況，也已經確認[可以]馬上取得材料。[142]也就是說，我們[可以]準時得到我們所需要的。我會等[候你對] Draper 公司訂單的意見，也會持[續把]最新消息傳給你。\n\n*(註：本頁右欄中譯右緣被掃描裁切，方括號內文字為依殘留筆畫推定。)*\n\n**139.**\n- (A) took\n- (B) takes\n- (C) had taken\n- (D) will take\n\n**140.**\n- (A) dispatch\n- (B) refund\n- (C) process\n- (D) cancel\n\n**141.**\n- (A) to check\n- (B) checking\n- (C) checks\n- (D) checked\n\n**142.** 🆕\n- (A) Meanwhile, we will order the equipment from another supplier.\n- (B) As a result, we had no choice but to announce a new opening date.\n- (C) Unfortunately, the items from Mr. Sampson will be delayed again.\n- (D) In other words, we will be able to get what we need on time.\n\n**單字** equipment (n.) 設備，裝備；install (v.) 安裝，設置；machinery (n.) 機械，機器；shipment (n.) 運送，運送的[貨物]；guarantee (v.) 保證；force (v.) 迫使…，強迫；delay (v.) 延期；(n.) 延遲；management (n.) 經營團隊；supplier (n.) 供應者，供應商；at short notice (phr.) 在臨時通知的情況下；update (n.) 最新消息；(v.) 為…提供最新[消息]\n\n<!-- page 316 -->\n**139.** 答案 (D)｜難度：（左緣裁切，無法辨識）\n**未來式** 參考上下文\n文意是「Draper 公司的貨物運送要花比較久的時間」，因為無法從空格所在的句子判斷適當的動詞時態，所以必須參考空格前後或文章整體的內容。下一句提到 Draper 公司能保證的最早送達時間是 10 月 16 日之後，比寄出電子郵件的 10 月 11 日還要晚，所以未來式 (D) will take 是正確答案。過去式 (A)、第三人稱單數現在式 (B)、過去完成式 (C) 不能表達未來的事情。\n\n**140.** 答案 (D)｜難度：（左緣裁切，無法辨識）\n**動詞詞彙** 參考上下文\n文意是「如果經營團隊偏好的話，我們可以 ______ 訂單」，所有選項都是可能的答案。因為無法從空格所在的句子判斷答案，所以必須參考空格前後或文章整體的內容。前面部分提到 Draper 公司的貨物運送要花比較久的時間，而後面部分提到已經跟別的供應商 Sampson 先生確認可以馬上取得材料，可知取消目前的訂單是可行的。所以，動詞 (D) cancel（取消）是正確答案。(A) dispatch 表示「發送」，(C) process 表示「處理」。(B) refund（退還）雖然感覺意思有點接近，但這個動詞是表示退還款項，如果要用在這裡的話，應該以名詞用法 get a refund for the order 來表達才對。\n\n**141.** 答案 (A)｜難度：（左緣裁切，無法辨識）\n**接 to 不定詞的動詞**\n這個句子的第 5 類動詞（asked）後面接受詞，以及空格部分的受詞補語。ask 會接 to 不定詞當受詞補語，所以 to 不定詞 (A) to check 是正確答案。動名詞或現在分詞 (B)、第三人稱單數動詞 (C)、動詞過去式或過去分詞 (D) 不能用在 to 不定詞的位置。另外，其他像 ask 一樣接受詞和 to 不定詞當受詞補語的動詞還有 expect（期望）、convince（說服）、require（要求）、remind（提醒）等等。\n\n**142.** 答案 (D)｜難度：（左緣裁切，無法辨識） 🆕\n**選出空格中正確的句子**\n這是選擇句子的題目，所以要參考空格前後或文章整體的內容。上一句「He understands the situation and has confirmed that he can obtain the materials immediately.」提到，Sampson 先生了解目前的情況，也已經確認可以馬上取得材料。所以，空格的內容應該跟取得材料有關，正確答案是 (D) In other words, we will be able to get what we need on time。\n\n**選項翻譯**\n- (A) 同時，我們會向另一家供應商訂購設備。\n- (B) 因而，我們不得不宣布新的開幕日期。\n- (C) 遺憾的是，來自 Sampson 先生的品項會再次延誤。\n- (D) 也就是說，我們可以準時得到我們所需要的。\n\n**單字** have no choice but to (phr.) 除了做…以外別無選擇；on time (phr.) 準時，及時\n\n<!-- page 317 -->\n### Questions 143-146 refer to the following information. 🆕\n143-146 題參照以下資訊。\n\n> Goldline Staffing is seeking payroll clerks for its rapidly expanding head office in Minneapolis. Candidates will be responsible for maintaining payroll data for up to 2,000 employees. As a result, they must be highly organized and able to perform ______(143) tasks at a proficient level. In addition, they must have working knowledge of word processing and accounting software ______(144).\n>\n> Newly hired employees will be placed in positions best suited to their educational background and experience. We have noted that most applicants ask if there are opportunities to gain new skills. ______(145). In fact, employee development is one of our key programs. ______(146), appropriate training will be provided to all successful applicants.\n>\n> To apply, send your résumé and other required documents to jobs@goldline.com.\n\n**翻譯**\n> Goldline Staffing 公司正在為迅速擴[展]中的明尼亞波利斯總公司尋找辦理[薪資]業務的人員。本職位的人選將負責[維護]多達 2,000 名員工的發薪資料。[143]…以，擔任本職位者必須極有條理，並[且]能以專業水準執行委派的工作。[144]此外，也必須對文書處理及會計軟體同[樣]具有工作所需的知識。\n>\n> 新雇員將派到最適合其教育背景與[經驗]的職位。我們已經注意到大部分應[徵者]詢問是否有獲得新技能的機會。[145]我們欣賞這樣的態度，也希望能提供所[需的]支援。事實上，員工發展是我們的主[要]計畫之一。[146]因此，所有錄取的應[徵者]將獲得適當的訓練。\n>\n> 如欲應徵，請將您的履歷及其他必要[文]件寄至 jobs@goldline.com。\n\n*(註：本頁右欄中譯右緣被掃描裁切，方括號內文字為依殘留筆畫推定，「…」為無法辨識。)*\n\n**143.**\n- (A) delegated\n- (B) devoted\n- (C) outdated\n- (D) confused\n\n**144.**\n- (A) just\n- (B) complete\n- (C) equal\n- (D) alike\n\n**145.** 🆕\n- (A) We appreciate this attitude and wish to provide the needed support.\n- (B) Pleasing our customers is just one of the company's many goals.\n- (C) The number of employees on our payroll is likely to decrease.\n- (D) There is an increasing need for staff who have already had training.\n\n**146.**\n- (A) In short\n- (B) Furthermore\n- (C) Consequently\n- (D) On the other hand\n\n**單字** payroll (n.) 薪水帳冊，發薪名單；clerk (n.) 辦事員，職員；head office (phr.) 總公司；candidate (n.) 人選，候選[人]；maintain (v.) 維持，保持；organized (adj.) 有條理的，有組織的；proficient (adj.) 熟練的，精通的；word processing (phr.) 文書處理；accounting (n.) 會計；key (adj.) 關鍵的，重要的；(n.) 鑰匙；successful applicant (phr.) 合格的申請者\n\n<!-- page 318 -->\n**143.** 答案 (A)｜難度：高\n**動詞詞彙**\n文意是「他們必須非常有條理，並且能以專業水準執行被委派的工作」，所以動詞 delegate（委派）的過去分詞 (A) delegated 是正確答案。(B) 的動詞 devote 表示「奉獻」，(C) 的 outdate 表示「使過時」，(D) 的 confuse 表示「使困惑」。\n\n**144.** 答案 (D)｜難度：高\n**選擇副詞**\n能夠強調空格前的兩個名詞片語（word processing, accounting software），並且表示「文書處理和會計軟體兩者同樣地」的副詞 (D) alike（同樣地）是正確答案。(A) just（正好，只是）當強調副詞時，必須用在被強調的詞語前面。形容詞或動詞 (B) complete（完成的；完成）和形容詞 (C) equal（相等的）不能用在副詞的位置。另外，請記住 A and B alike（A 和 B 同樣地）這個慣用結構。\n\n**145.** 答案 (A)｜難度：中 🆕\n**選出空格中正確的句子**\n這是選擇句子的題目，所以要參考空格前後或文章整體的內容。上一句「We have noted that most applicants ask if there are opportunities to gain new skills.」提到公司已經注意到大部分應徵者詢問是否有獲得新技能的機會，而下一句「In fact, employee development is one of our key programs.」提到員工發展是公司的主要計畫之一，所以空格的內容應該是對於能否學到新技能的詢問給予肯定的回答，正確答案是 (A) We appreciate this attitude and wish to provide the needed support。\n\n**選項翻譯**\n- (A) 我們欣賞這樣的態度，也希望能提供所需的支援。\n- (B) 讓顧客滿意只是本公司眾多目標之一。\n- (C) 受雇的員工人數很有可能會減少。\n- (D) 對於已經受過訓練的員工的需求正在增加。\n\n**單字** on the payroll (phr.) （在發薪名單上）受雇中的\n\n**146.** 答案 (C)｜難度：中\n**連接副詞** 參考上下文\n空格和逗號一起出現在句首的連接副詞位置，所以要判斷空格所在的句子和上一個句子的關係再作答。前面的部分提到，大部分應徵者詢問是否有獲得新技能的機會，以及員工發展是公司的主要計畫之一，而空格所在的句子說所有錄取的應徵者將獲得適當的訓練，所以延續前文內容並且做出結論時會使用的連接副詞 (C) Consequently（結果，因此）是正確答案。(A) In short 表示「簡而言之」，(B) Furthermore 表示「而且，此外」，(D) On the other hand 表示「另一方面」，用在這裡的意思都不恰當。\n\n<!-- page 319 -->\n## PART 7\n\n### Questions 147-148 refer to the following memo.\n147-148 題參照以下備忘錄。\n\n> MEMO\n> To: All staff\n> From: Amanda Robinson\n> Subject: New assignment\n> Date: May 20\n>\n> Please be informed that effective June 1, [147]Mr. Matthew Webb will be replacing Mr. Daniel Rodgers as purchasing manager for Longview Holdings. Please address all purchase requests for office supplies and equipment to Mr. Webb from that date. As before, [148]all request forms must be approved and signed by a departmental supervisor before submission. Those with questions may reach Mr. Webb at extension number 82.\n\n**翻譯**\n> 備忘錄\n> 收件者：所有員工\n> 寄件者：Amanda Robinson\n> 主旨：新派任\n> 日期：5 月 20 日\n>\n> 請注意從 6 月 1 日起，[147]Matthew Webb 先生將接替 Daniel Rodgers 先[生]擔任 Longview Holdings 公司的採[購經]理。從當天開始，請向 Webb 先生[提出]所有辦公用品及設備採購申請。跟[以前]一樣，[148]所有申請表格提交前都必[須]由部門主管核准並簽名。有問題的[人可]以打分機 82 聯絡 Webb 先生。\n\n*(註：本頁右欄中譯右緣被掃描裁切，方括號內文字為依殘留筆畫推定。)*\n\n**單字** assignment (n.) 指派，分配，工作；effective (adj.) （從特定時間開始）生效的，有效的；replace (v.) 取代，代替；address (v.) 提出，處理，演說；departmental (adj.) 部門[的]；supervisor (n.) 管理者，主管；extension number (phr.) 分機號碼\n\n**147.** 答案 (D)｜難度：低\nWhy did Ms. Robinson write the memo?\n- (A) To provide instructions about a new office policy\n- (B) To collect orders for office supplies\n- (C) To inform staff about a manager's resignation\n- (D) To notify employees about a change in personnel\n\n> Robinson 小姐為什麼寫了這則備忘[錄]？\n> (A) 為了提供關於新辦公室政策的指[示]\n> (B) 為了收集辦公用品的訂單\n> (C) 為了通知員工一位經理辭職\n> (D) 為了通知員工人事異動\n\n**尋找主題／目的** 寫文章的理由\n這是詢問 Robinson 小姐為什麼寫了這則備忘錄的尋找主題問題，所以要特別注意文章開頭的部分。「Mr. Matthew Webb will be replacing Mr. Daniel Rodgers as purchasing manager for Longview Holdings」提到 Matthew Webb 先生將接替 Daniel Rodgers 先生擔任 Longview Holdings 公司的採購經理，所以 (D) To notify employees about a change in personnel 是正確答案。雖然採購經理要換人，但從文章無法得知是不是現任辭職才換人，整體內容也不是只關於員工辭職，所以 (C) 不對。\n\n**單字** resignation (n.) 辭職\n\n**148.** 答案 (C)｜難度：中\nHow should employees at Longview Holdings request new office supplies?\n- (A) By filling out an online form\n- (B) By calling an office extension\n- (C) By submitting a signed document\n- (D) By going to a supplier's Web site\n\n> Longview Holdings 公司的員工應該[怎]麼申請新的辦公用品？\n> (A) 填寫網路上的表格\n> (B) 打辦公室分機電話\n> (C) 提交簽了名的文件\n> (D) 上供應商的網站\n\n**wh- 問題** How\n這是問 Longview Holdings 公司的員工應該怎麼（How）申請新的辦公用品的 wh- 問題，所以要尋找與問題重點 request new office supplies 相關的內容。「all request forms must be ~ signed by a departmental supervisor before submission」的部分提到，所有申請表格提交前都必須經由部門主管簽名，所以 (C) By submitting a signed document 是正確答案。雖然說要填表格，但文章沒有提到表格是不是在網路上，所以 (A) 不對。\n\n**替換表達**\nrequest forms must be ~ signed 申請表格必須經過簽名 → signed document 簽了名的文件\n\n**單字** supplier (n.) 供應者，供應商\n\n<!-- page 320 -->\n### Questions 149-150 refer to the following announcement.\n149-150 題參照以下公告。\n\n> West University Writing Center\n>\n> [149/150-C]The Writing Center at West University offers all registered students assistance with editing their writing assignments for classes. [150-B]Assignment proofreading services are available Mondays through Saturdays from 8:30 a.m. to 8:00 p.m.\n>\n> As an additional offering for those of you looking to better develop your writing skills, [150-D]we arrange tutoring sessions via appointment at our main desk. [150-A]Writing tutors are current graduate students in the colleges of education and liberal arts and are dedicated to guiding you through the writing process for any class assignment.\n>\n> So, don't waste another minute worrying about that term paper! Stop by the West University Writing Center at 450 Ernestine Hall for more information.\n\n**翻譯**\n> West 大學寫作中心\n>\n> [149/150-C]West 大學寫作中心為所有註冊學生提供校訂課堂寫作作業方面的協助。[150-B]作業校對服務在每週一至週六上午 8:30 至晚間 8:00 提供。\n>\n> 為了額外提供服務給想要進一步培養寫作技巧的人，[150-D]我們安排家教課程，可以在我們的總櫃台預約。[150-A]寫作家教是目前就讀教育學院和文學院的研究生，他們致力於在任何課堂作業的整個寫作過程中引導大家。\n>\n> 所以，不要再浪費時間擔心期末報告了！來一趟位於 Ernestine Hall 450 號的 West 大學寫作中心，以獲得更多資訊。\n\n**單字** register (v.) 註冊，登記；proofread (v.) 校對；graduate student (phr.) 研究生；liberal arts (phr.) 文科，人文學科；guide (v.) 引導，指導；term paper (phr.) 期末報告\n\n**149.** 答案 (D)｜難度：（左緣裁切，無法辨識）\nWhat is the purpose of the announcement?\n- (A) To invite professional writers to a workshop\n- (B) To publicize the opening of an educational center\n- (C) To explain the importance of written assignments\n- (D) To promote various services offered at a facility\n\n> 這則公告的目的是什麼？\n> (A) 為了邀請專業作家參與研習會\n> (B) 為了宣傳一所教育中心的開幕\n> (C) 為了說明寫作作業的重要性\n> (D) 為了宣傳一所設施提供的多種服務\n\n**尋找主題／目的** 文章的目的\n這是詢問公告目的的尋找主題問題，所以要特別注意文章開頭的部分。「The Writing Center at West University offers all registered students assistance with editing their writing assignments for classes.」提到，West 大學寫作中心為所有註冊學生提供編輯課堂寫作作業方面的協助，之後則介紹作業校對服務和家教課程，所以 (D) To promote various services offered at a facility 是正確答案。\n\n**150.** 答案 (B)｜難度：（左緣裁切，無法辨識）\nWhat is NOT mentioned about the writing center?\n- (A) It employs graduate students as tutors.\n- (B) It is open seven days a week.\n- (C) It is available for anyone enrolled at the school.\n- (D) It can arrange private instructional sessions.\n\n> 關於寫作中心，文中沒有提到什麼？\n> (A) 雇用研究生擔任家教。\n> (B) 一週開放七天。\n> (C) 供學校任何註冊學生利用。\n> (D) 可以安排私人教學時間。\n\n**Not/True** Not 問題\n這是需要在文章中找到與關鍵字 the writing center 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A) 對應文中的「Writing tutors are current graduate students」，表示寫作家教是目前就讀研究所的學生，符合選項敘述。和 (B) 相關的部分是「Assignment proofreading services are available Mondays through Saturdays」，表示週一至週六提供作業校對服務，不符合選項敘述，所以 (B) It is open seven days a week 是正確答案。(C) 對應文中的「The Writing Center at West University offers all registered students assistance」，表示 West 大學寫作中心為所有註冊學生提供協助，符合選項敘述。(D) 對應文中的「we arrange tutoring sessions via appointment at our main desk」，表示可以在總櫃台預約家教課程，符合選項敘述。\n\n<!-- page 321 -->\n\n**替換表達**\nall registered students 所有註冊學生 → anyone enrolled at the school 任何在學校有註冊的人\ntutoring sessions 家教課程 → private instructional sessions 私人教學\n\n### Questions 151-152 refer to the following information.\n151-152 題參照以下資訊。\n\n> **Lafayette County Park**\n>\n> We wish everyone a safe and pleasant visit to Lafayette County Park. To ensure that the park is kept fun and inviting for all, please observe the following rules:\n>\n> - The park gates close at 10 p.m. every night and reopen at 6 a.m. Please respect these hours and do not enter the park when it is closed.\n> - Children should be supervised at all times. We accept no responsibility for any accidents occurring in the play area or elsewhere in the park.\n> - Dogs must be kept on a leash, except in [151-B] the designated off-leash area in the north end of the park.\n> - [151-D] A basketball court and a soccer field are located on the west side of the park. Please limit any ball games to these areas in order to avoid damaging [151-A] the rose garden located on the park's east side.\n> - The speed limit is 20 miles per hour for all vehicles. On multiuse paths, cyclists are asked to avoid riding at high speeds for the safety of pedestrians.\n> - [152] All visitors are advised to cross only at designated points and be aware of cars.\n>\n> Should a problem arise, contact the park administration at 555-6103, which is located in the park's northeast corner, off Greenwood Drive.\n\n**翻譯**\n> **Lafayette 郡立公園**\n>\n> 我們希望所有來到 Lafayette 郡立公…的人都安全而愉快。為確保公園對所…人都具有趣味與吸引力，請遵守以下…則：\n>\n> - 公園入口每晚 10 點關閉，上午…點重新開放。請遵守時間，不要…關閉時進入公園。\n> - 兒童應該隨時受到監督。我們不…遊戲區或公園其他場所發生的…意外負責。\n> - 狗必須繫上牽繩，除了 [151-B] 公園…端的指定免繫牽繩區域以外。\n> - [151-D] 籃球場和足球場位於公園西…請只在這些區域進行球類運動，…免傷害 [151-A] 位於公園東側的玫瑰…。\n> - 所有車輛速限為時速 20 英里。…多用途道路，請自行車騎士避…速騎乘，以維持行人安全。\n> - [152] 建議所有遊客只在指定地點穿…道路，並注意車輛。\n>\n> 如果發生問題，請撥 555-6103 聯…園行政處，地點在公園東北角接近 Greenwood 路的地方。\n\n**單字** county (n.) 郡；respect (v.) 尊重，遵守；designated (adj.) 指定的；pedestrian (n.) 行人；inviting (adj.) 吸引人的，迷人的；supervise (v.) 監督，指導；limit (v.) 限制；(n.) 限制，限度；cross (v.) 越過；observe (v.) 遵守，觀察；leash (n.)（狗用的）牽繩；path (n.) 路，通路，小徑\n\n<!-- 註：右欄中譯每行末端被書溝陰影遮住，「…」處無法辨識。 -->\n\n<!-- page 322 -->\n\n**151.** 答案 (C)｜難度：…\nWhat is NOT mentioned as a facility in the park?\n- (A) A rose garden\n- (B) An off-leash area\n- (C) A bike rental stand\n- (D) A section for ball games\n\n> 文中沒有提到什麼公園設施？\n> - (A) 玫瑰園\n> - (B) 免繫牽繩區域\n> - (C) 單車出租站\n> - (D) 球類運動區\n\n**Not/True Not 問題**\n這是需要在文章中找到與關鍵字 a facility in the park 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A) 對應文中的「the rose garden located on the park's east side」，表示公園東側有玫瑰園，符合選項敘述。(B) 對應文中的「the designated off-leash area in the north end of the park」，表示公園有指定免繫牽繩的區域，符合選項敘述。(C) 在文中沒有提到，所以 (C) A bike rental stand 是正確答案。(D) 對應文中的「A basketball court and a soccer field are located on the west side of the park.」，表示公園西側有籃球場和足球場，符合選項敘述。\n\n**替換表達**\nA basketball court and a soccer field 籃球場和足球場 → A section for ball games 球類運動區\n\n**152.** 答案 (D)｜難度：…\nAccording to the information, what are visitors urged to do?\n- (A) Clean up after their pets\n- (B) Return rented equipment\n- (C) Dispose of trash properly\n- (D) Take care when crossing a road\n\n> 根據這則資訊，遊客被勸告要做什麼？\n> - (A) 為寵物清理（排泄物）\n> - (B) 歸還租用的裝備\n> - (C) 把垃圾丟在正確的地方\n> - (D) 在穿越道路時小心謹慎\n\n**wh- 問題 What**\n這是問遊客被勸告要做什麼（What）的 wh- 問題，所以要尋找和問題重點 visitors urged to do 相關的內容。「All visitors are advised to cross only at designated points and be aware of cars.」的部分提到，建議所有遊客只在指定地點穿越道路，並注意車輛，所以 (D) Take care when crossing a road 是正確答案。\n\n**替換表達**\nurged 勸告 → advised 建議\ncross only at designated points and be aware of cars 只在指定地點穿越道路並注意車輛 → Take care when crossing a road 在穿越道路時小心謹慎\n\n**單字** clean up (phr.) 清理，打掃；dispose of (phr.) 處理掉，丟掉\n\n<!-- 註：本頁左緣題號與難度直排標籤被裁切，151、152 的難度無法辨識。 -->\n\n<!-- page 323 -->\n\n### Questions 153-156 refer to the following text-message chain. 🆕\n153-156 題參照以下訊息對話紀錄。\n\n> **Hilda Jacobsen** [9:37 a.m.]\n> Larry, how's your schedule looking for the week? Anything major going on?\n>\n> **Larry Boyd** [9:39 a.m.]\n> Not really. [153] I was planning to spend most of my time working on the Hanifan project, but there's no rush. [153] They don't need my designs for their office interior for another two weeks.\n>\n> **Larry Boyd** [9:40 a.m.]\n> Something I can help you with?\n>\n> **Hilda Jacobsen** [9:42 a.m.]\n> [154-D/155] I was wondering if you would be free to join me in the city on Wednesday to meet some representatives from Digitek. I'll be pitching a lobby renovation idea to them. [154-D] I really want their company as a client, so I think it would be great if you were there for support. You could help direct the conversation to my proposal's selling points just in case I forget something.\n>\n> **Larry Boyd** [9:42 a.m.]\n> I hear you. What time on Wednesday is this meeting?\n>\n> **Hilda Jacobsen** [9:43 a.m.]\n> It's at 10:30 a.m. [155/156] We can take my car from here. I'll buy you lunch when we're done.\n>\n> **Larry Boyd** [9:44 a.m.]\n> It's a deal. [156] I'll see you on Wednesday. We'll be coming back to the office, right?\n>\n> **Hilda Jacobsen** [9:45 a.m.]\n> [156] Yes. I will e-mail you more details about the project in a moment. Thanks!\n\n**翻譯**\n> **Hilda Jacobsen** [9:37 a.m.]\n> Larry，你這禮拜行程怎樣？有什麼重…的事嗎？\n>\n> **Larry Boyd** [9:39 a.m.]\n> 不是什麼大事。[153] 我打算用大部分的時…間處理 Hanifan 專案，但不急。[153] 他們…接下來兩個禮拜都還不需要我為他們…辦公室所做的室內設計。\n>\n> **Larry Boyd** [9:40 a.m.]\n> 有什麼我可以幫你的嗎？\n>\n> **Hilda Jacobsen** [9:42 a.m.]\n> [154-D/155] 我想知道你星期三有沒有空…一起去市區見幾位 Digitek 公司的代…表。我要向他們推銷大廳整修的想法。…[154-D] 我真的很希望他們公司成為我們…客戶，所以我想如果你在場支援的話…太好了。你可以幫忙把話題引導到我…案的賣點，以防我忘了什麼。\n>\n> **Larry Boyd** [9:42 a.m.]\n> 我知道了。這場會議在星期三…\n>\n> **Hilda Jacobsen** [9:43 a.m.]\n> 上午 10:30。[155/156] 我們可以從這裡…的車過去。結束的時候我會買午餐…\n>\n> **Larry Boyd** [9:44 a.m.]\n> 就這麼說定了。[156] 我們星期三見。…會回辦公室對吧？\n>\n> **Hilda Jacobsen** [9:45 a.m.]\n> [156] 對。我稍後會把專案的更多細…e-mail 給你。謝謝！\n\n**單字** major (adj.) 重大的，主要的；go on (phr.)（事情）發生，繼續；pitch (v.)（為了說服購買或達成交易等）大力推銷；direct (v.) 引導…；(adj.) 直接的；proposal (n.) 提案，提議；renovation (n.) 整修，翻新，…；selling point (phr.) 賣點，產品…\n\n**153.** 答案 (C)｜難度：中\nWhat is suggested about Mr. Boyd?\n- (A) He needs to reschedule a client meeting.\n- (B) He asked for an extension on a deadline.\n- (C) He is working on plans for an interior.\n- (D) He will be reassigned to a new project.\n\n> 關於 Boyd 先生，文中顯示什麼？\n> - (A) 他需要重新安排一場與客戶的會議。\n> - (B) 他要求延後期限。\n> - (C) 他正在進行室內設計的計畫。\n> - (D) 他會被重新分派到新的專案。\n\n**推論 細節資訊**\n這是關於題目關鍵字 Mr. Boyd 的推論問題。Boyd 先生說「I was planning to spend most of my time working on the Hanifan project」，表示他打算用大部分的時間處理 Hanifan 專案，又說「They don't need my designs for their office interior for another two weeks.」，表示未來兩週還不需要把辦公室室內設計交給 Hanifan 公司，可推知 Boyd 先生正在為 Hanifan 公司進行辦公室室內設計，所以 (C) He is working on plans for an interior 是正確答案。\n\n**單字** extension (n.)（期間的）延長，延伸；reassign (v.) 重新指派，重新分配\n\n<!-- 註：右欄中譯及 153 解析右緣被書溝陰影遮住，「…」處無法辨識；153 解析中被遮住的英文引句依本頁對話原文與選項補齊，「答案 (C)」標籤被遮住，依解析內文填入。 -->\n\n<!-- page 324 -->\n\n**154.** 答案 (D)｜難度：中\nWhat is true about Ms. Jacobsen?\n- (A) She has finalized details on an office interior design.\n- (B) She plans to meet with a Hanifan representative.\n- (C) Her schedule was changed at the last minute.\n- (D) She hopes to acquire Digitek as a new client.\n\n> 關於 Jacobsen 小姐，何者正確？\n> - (A) 她完成了辦公室室內設計的細節。\n> - (B) 她打算和 Hanifan 公司的代表見面。\n> - (C) 她的行程在最後一刻改變了。\n> - (D) 她希望獲得 Digitek 公司這個新客戶。\n\n**Not/True True 問題**\n這是需要在文章中找到與關鍵字 Ms. Jacobsen 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A)、(B)、(C) 在文中沒有提到。(D) 對應 Jacobsen 小姐所說的「I was wondering if you would be free to join me ~ to meet some representatives from Digitek.」，問 Boyd 先生有沒有空一起去見 Digitek 公司的代表，然後她又說「I really want their company as a client」，表示真的很希望這家公司成為客戶，符合選項敘述，所以 (D) She hopes to acquire Digitek as a new client 是正確答案。\n\n**單字** acquire (v.) 獲得，習得\n\n**155.** 🆕 答案 (C)｜難度：中\nAt 9:44 a.m., what does Mr. Boyd mean when he writes, \"It's a deal\"?\n- (A) He is satisfied with the outcome of a business negotiation.\n- (B) He knows a restaurant that serves food at low prices.\n- (C) He consents to accompanying his colleague to a meeting.\n- (D) He thinks that a client will benefit from a project's low cost.\n\n> 在上午 9:44，Boyd 先生說的「It's a deal」是什麼意思？\n> - (A) 他對商業協商的結果滿意。\n> - (B) 他知道一間低價供應餐食的餐廳。\n> - (C) 他同意陪同事一起去開會。\n> - (D) 他認為客戶會因為專案的低費用而獲益。\n\n**掌握意圖**\n題目問 Boyd 先生的意思，所以要掌握引用部分（It's a deal）上下文的情境。Jacobsen 小姐說「I was wondering if you would be free to join me in the city on Wednesday to meet some representatives from Digitek.」，表示她想問 Boyd 先生星期三有沒有空陪她一起去市區見一些 Digitek 公司的代表，之後又說「We can take my car from here. I'll buy you lunch when we're done.」，表示他們可以從公司坐她的車過去，結束的時候她會買午餐。Boyd 先生回答「It's a deal.」（就這麼說定了），表示他同意陪同事一起去星期三的會議，所以 (C) He consents to accompanying his colleague to a meeting 是正確答案。\n\n**單字** outcome (n.) 結果，成果；negotiation (n.) 協商，協議；consent (v.) 同意，准許；accompany (v.) 陪伴，同行\n\n**156.** 答案 (C)｜難度：低\nWhat will Mr. Boyd do after lunch on Wednesday?\n- (A) Go home to research a project\n- (B) Send an e-mail with project details\n- (C) Return to his workplace\n- (D) Suggest changes to a lobby\n\n> Boyd 先生星期三午餐後會做什麼？\n> - (A) 回家研究企畫案\n> - (B) 寄一封有企畫案細節的電子郵件\n> - (C) 回到他工作的地方\n> - (D) 建議大廳的變更\n\n**wh- 問題 What**\n這是問 Boyd 先生星期三午餐後會做什麼（What）的 wh- 問題，所以要尋找和問題重點 Mr. Boyd do after lunch on Wednesday 相關的內容。Jacobsen 小姐說「We can take my car from here. I'll buy you lunch when we're done.」，表示他們可以從公司坐她的車過去，結束的時候她會買午餐。Boyd 先生回應「I'll see you on Wednesday. We'll be coming back to the office, right?」，表示星期三會和她見面，又問開完會後是否會回辦公室，而 Jacobsen 小姐回答「Yes.」，表示會回辦公室，所以 (C) Return to his workplace 是正確答案。\n\n**替換表達**\ncoming back to the office 回到辦公室 → Return to ~ workplace 回到工作的地方\n\n<!-- page 325 -->\n\n### Questions 157-159 refer to the following Web page.\n157-159 題參照以下網頁。\n\n> **MyPost.com**\n>\n> Home | Business | Products and Services | About us | Help | Register | Log in\n>\n> You are here: MyPost > Help\n>\n> **What is MyPost and how does it work?**\n> MyPost provides a US-based delivery address for customers living overseas. [157] Since not all online retailers in the US will ship internationally, [157/158] MyPost allows you to use its physical address located in the US as a shipment transfer point to temporarily store ordered items. So, [157] the next time you shop with an online US retailer, simply enter your MyPost address on the shipping form, and we will take care of the rest. MyPost uses an advanced tracking system and can also [159-C] provide additional ould most likely be interested in MyPost's services?\n- (A) Companies relocating abroad\n- (B) Business owners needing domestic delivery\n- (C) Customers ordering items from US Web sites\n- (D) Clients wishing to cut their shipping costs\n\n> 誰最有可能對 MyPost 的服務有興趣？\n> (A) 要遷移到國外的公司\n> (B) 需要國內貨運的企業主\n> (C) 向美國網站訂購物品的顧客\n> (D) 希望減少運費的客戶\n\n**推論 整體資訊**\n這是要綜合文章各處的線索，推斷對 MyPost 的服務有興趣的人的推論問題。「Since not all online retailers in the US will ship internationally, MyPost allows you to use its physical address located in the US」的部分提到，因為不是所有美國的網路零售業者都提供國際運送，所以 MyPost 讓使用者可以利用在美國的地址，而「the next time you shop with an online US retailer, simply enter your MyPost address on the shipping form, and we will take care of the rest」則提到向美國的網路零售業者購物時，只要在送貨表格輸入 MyPost 地址，接下來的事 MyPost 都會處理。所以可以推知，向美國網站訂購物品的顧客可能對這項服務感興趣，(C) Customers ordering items from US Web sites 是正確答案。\n\n**替換表達**\nshop with an online US retailer 向美國的網路零售業者購物 → ordering items from US Web sites 向美國網站訂購物品\n\n**158.** 答案 (A)｜難度：中\nWhat is indicated about MyPost?\n- (A) It has storage facilities in the US.\n- (B) It has special arrangements with trucking companies.\n- (C) It does not insure items under 500 grams.\n- (D) It charges extra for parcels over three meters in length.\n\n> 關於 MyPost，文中提到什麼？\n> (A) 在美國有倉儲設施。\n> (B) 和貨車運輸公司有特別的協議。\n> (C) 不為未滿 500 克的物品投保。\n> (D) 對長度超過 3 公尺的包裹收取額外費用。\n\n**推論 細節資訊**\n這是問關於 MyPost 提到了什麼的推論問題。「MyPost allows you to use its physical address located in the US as a shipment transfer point to temporarily store ordered items」提到，可以使用位於美國的實體地址，作為臨時存放訂購物品的轉運點，而「your parcel has been shipped from our overseas warehouse」提到包裹從海外的倉庫寄出，可以推斷他們在美國有倉儲設施，所以 (A) It has storage facilities in the US 是正確答案。\n\n**單字** arrangement (n.) 約定，安排；insure (v.) 為…投保\n\n**159.** 答案 (B)｜難度：低\nWhat is stated about the services?\n- (A) They are discounted for repeat customers.\n- (B) They are priced according to weight and size.\n- (C) They include sales of packing supplies.\n- (D) They cost less than other companies.\n\n> 關於服務，文中提到什麼？\n> (A) 再次使用的顧客有折扣。\n> (B) 依照重量與尺寸定價。\n> (C) 包括包裝用品的販售。\n> (D) 費用比其他公司少。\n\n**Not/True True 問題**\n這是需要在文章中找到與關鍵字 the services 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A) 和 (D) 在文中沒有提到。(B) 對應文中的「Postage is based both on the weight and dimensions of your parcel.」，表示郵資根據包裹的重量與尺寸而定，符合選項敘述，所以 (B) They are priced according to weight and size 是正確答案。和 (C) 相關的部分是「provide additional services, such as ~ item repacking」，表示提供物品重新包裝服務，而不是販售包裝用品，不符合選項敘述。\n\n**替換表達**\nPostage is based both on the weight and dimensions 郵資根據重量與尺寸而定 → are priced according to weight and size 依照重量與尺寸定價\n\n**單字** repeat customer (phr.) 再次光顧的顧客；price (v.) 定價；(n.) 價格\n\n<!-- page 327 -->\n\n### Questions 160-161 refer to the following online chat discussion. 🆕\n160-161 題參照以下網路聊天討論。\n\n> **Jessica Jang** 9:27\n> I just got a message from a staff member in sales saying that salaries for her department have not been deposited yet. They should have come in yesterday afternoon.\n>\n> **Jessica Jang** 9:28\n> Has anyone else gotten similar complaints from other departments?\n>\n> **William Stuttgart** 9:34\n> I just checked with production and they got theirs, but those in purchasing did not. Neither did the employees in finance. [160] Oh, and my salary hasn't come in yet. I guess that means none of us in human resources has been paid either.\n>\n> **Jessica Jang** 9:35\n> Nor mine. This is quite strange. I checked with research and development and they got theirs. I wonder if Erin's heard anything.\n>\n> **Erin Hinkle** 9:37\n> Sorry, I was on the phone just now. I discovered this issue earlier this morning, and I just contacted Beacon Bank to find out the cause of the problem. They promised a response in the next 10 minutes.\n>\n> **Erin Hinkle** 9:44\n> [161] So, the bank says they had some technical issues with a new payment software system that they recently started using. They've resolved the problem now and those who haven't been paid yet should have their funds within the next hour. Let me know what happens.\n>\n> **William Stuttgart** 10:34\n> I just received notification from the bank that the funds have been sent.\n>\n> **Jessica Jang** 10:35\n> Same here. [161] Erin, could you contact the other departments to confirm that the problem's been solved?\n>\n> **Erin Hinkle** 10:36\n> OK. I can do that.\n\n**翻譯**\n*（註：中譯欄右緣被書溝陰影遮住，每行末 1–3 字無法辨識，以「…」標示）*\n\n> **Jessica Jang** 9:27\n> 我剛收到業務部同仁傳來的訊息，說…部門的薪水還沒存入。薪水應該昨天…午入帳的。\n>\n> **Jessica Jang** 9:28\n> 有人接到來自其他部門的類似抱怨嗎？\n>\n> **William Stuttgart** 9:34\n> 我剛跟生產部確認，他們收到了，但…購部的人沒有。財務部的員工也沒有…[160] 噢，我的薪水也還沒進來。我猜這…示我們人事部也還沒有人領到薪水。\n>\n> **Jessica Jang** 9:35\n> 我的也沒。這很怪。我跟研發部確…過，他們收到了。不知道 Erin 有沒…聽說什麼。\n>\n> **Erin Hinkle** 9:37\n> 抱歉，我剛才在講電話。我今天稍早…現這個問題，剛才為了查明問題的原…而聯絡了 Beacon 銀行。他們承諾 10 分鐘以內回覆。\n>\n> **Erin Hinkle** 9:44\n> [161] 嗯，銀行說他們最近開始使用的新…支付軟體系統發生了一些技術問題。…在他們已經解決問題了，還沒收到薪…的人應該會在接下來 1 個小時內收…錢。請讓我知道情況。\n>\n> **William Stuttgart** 10:34\n> 我剛收到銀行的通知，說錢已經匯了。\n>\n> **Jessica Jang** 10:35\n> 我也是。[161] Erin，可以請你聯絡其他…門確認問題已經解決了嗎？\n>\n> **Erin Hinkle** 10:36\n> OK。可以。\n\n**單字** staff member (phr.) 員工；salary (n.) 薪水；technical (adj.) 技術性的，專業的；fund (n.) 錢，資金；notification (n.) 通知；confirm (v.) 確認\n\n<!-- page 328 -->\n\n**160.** 答案 (C)｜難度：中\nWhat is suggested about Mr. Stuttgart?\n- (A) He received his salary before others in the company.\n- (B) He was unsuccessful in his attempts to contact a bank.\n- (C) He is employed in the human resources department.\n- (D) He has encountered the problem of late payment before.\n\n> 關於 Stuttgart 先生，文中顯示什麼？\n> (A) 他比公司其他人早收到薪水。\n> (B) 他試圖聯絡銀行，但沒有聯絡上。\n> (C) 他受雇於人事部。\n> (D) 他以前遇過發薪延遲的問題。\n\n**推論 細節資訊**\n這是關於題目關鍵字 Mr. Stuttgart 的推論問題。Stuttgart 先生說「Oh, and my salary hasn't come in yet. I guess that means none of us in human resources has been paid either.」，表示 Stuttgart 先生的薪水沒有入帳，他猜想他們人事部也還沒有人領到薪水，可以推知 Stuttgart 先生應該是人事部的員工，所以 (C) He is employed in the human resources department 是正確答案。\n\n**單字** unsuccessful (adj.) 不成功的，失敗的；attempt (n.) 企圖，嘗試；(v.) 試圖；encounter (v.) 遭遇，遇到\n\n**161.** 🆕 答案 (B)｜難度：中\nAt 10:36, what does Ms. Hinkle mean when she writes, \"I can do that\"?\n- (A) She will check whether a new software system was installed.\n- (B) She will find out whether all the employees have been paid.\n- (C) She will call a bank to confirm that a deposit has been made.\n- (D) She will make an announcement regarding monthly salaries.\n\n> 在 10:36，Hinkle 小姐說的「I can do that」是什麼意思？\n> (A) 她會確認新軟體系統是否已安裝。\n> (B) 她會查明是否所有員工都收到了薪水。\n> (C) 她會打電話給銀行，確認已經存入款項。\n> (D) 她會發布關於月薪的公告。\n\n**掌握意圖**\n題目問 Hinkle 小姐的意思，所以要掌握引用部分（I can do that）上下文的情境。Hinkle 小姐說「So, the bank says they had some technical issues with a new payment software system ~. They've resolved the problem now and those ~ within the next hour.」，表示 Beacon 銀行使用新的支付軟體系統時發生了一些技術問題，但是問題已經解決了，所以還沒收到薪水的人應該會在接下來 1 小時內收到。然後 Jang 小姐說「Erin, could you contact the other departments to confirm that the problem's been solved?」，想請她聯絡其他部門，確認問題是否解決了，而 Erin Hinkle 回答「I can do that.」（我可以做那件事），表示她可以聯絡其他部門，確認是否所有員工都收到薪水了，所以 (B) She will find out whether all the employees have been paid 是正確答案。\n\n**單字** find out (phr.) 查明，發現\n\n<!-- page 329 -->\n\n### Questions 162-164 refer to the following report.\n162-164 題參照以下報告。\n\n> **Report for City Council Executive Meeting, March 18**\n> **Options from the Planning Department**\n>\n> The Truman Expressway is now 50 years old and is no longer fit for use. The surface is becoming less even, and the underside of the elevated road is crumbling, posing a potential hazard to the pedestrian areas and smaller roads that run beneath it. There are three main options for how to handle these issues with the expressway.\n>\n> [162-C] The first is to invest money in the repair of damaged sections. This is the cheapest possible option, as well as the quickest. However, some community activists have noted that people do not like [163-A] having to walk along the dark streets underneath the expressway to reach the waterfront on the other side. [163-C] The city has been trying to increase low visitation rates to the waterfront area, and making road repairs only would not address this problem.\n>\n> [162-A] The second option is to rebuild the roadway underground. This would allow us to maintain the same traffic capacity and provide more space aboveground for other structures or buildings. However, it would be extremely expensive and possibly disruptive.\n>\n> [162-D] The final option is to tear the expressway down and widen Elmview Road, which currently runs beneath it. This could help to expand local retail, as shops at ground level would be able to tap into a large customer base. However, Elmview Road would not be able to take all of the traffic that currently runs on the expressway. [162-B/164-D] Much of this traffic would try to bypass the city by taking smaller roads to the north, probably through the community of Greenville. [164-D] At the same time, the residents of this community would most likely be against using their city as an alternative route due to an increase in through traffic and noise on their roads.\n\n**翻譯**\n*（註：中譯欄右緣被書溝陰影遮住，每行末 1–3 字無法辨識，以「…」標示）*\n\n> **市議會執行委員會議報告，3 月 18 日**\n> **計畫處提供的選項**\n>\n> Truman 高速公路落成已經 50 年，已…經不適合繼續使用。路面越來越不平…整，高架道路的底面也逐漸碎裂，對…過下方的人行區域及較小的道路造成…在危險。處理高速公路問題的方法，主…要有三個選項。\n>\n> [162-C] 第一個是投入資金進行損壞區…維修。這是最便宜的選擇，也是最…的。不過，部分社區行動人士提到，民…眾不喜歡 [163-A] 必須走過高速公路下的…暗道路才能到另一邊的水岸地區。[163-C] …本市一直努力將水岸地區低迷的到訪…提高，只是維修道路的話無法解決這…問題。\n>\n> [162-A] 第二個選項是在地面下重新建設…路。這樣能讓我們維持同樣的交通…量，並且在地面上提供更多空間給其…建設或建築物。不過，費用可能會非…昂貴，而且可能會造成擾亂。\n>\n> [162-D] 最後一個選項是拆除高速公路並…寬目前行經其下方的 Elmview 路。這…可能有助於擴展當地零售業，因為地…層的商店能夠開闢廣大的客群。不過…Elmview 路應該無法容納目前行駛高…公路的所有交通量。[162-B/164-D] 許多車…可能藉由行駛較小的道路往北，或許…由 Greenville 社區，來繞過本市。[164-D] …同時，該社區居民非常可能因為行經…們道路的交通量及噪音增加而反對用…們的城市作為替代路線。\n\n**單字** expressway (n.) 高速公路；no longer (phr.) 不再；fit (adj.) 適合的；surface (n.) 表面，外表；even (adj.) 平坦的，一致的；underside (n.) 底面，底側；elevated road (phr.) 高架道路；crumble (v.) 碎裂，崩壞；pose (v.) 造成（危險或問題等）；hazard (n.) 危險；activist (n.) 行動人士，行動主義者；underneath (prep.) 在…下面；waterfront (n.)（都市的）水岸地區，海岸；visitation (n.) 造訪，視察；address (v.) 處理（問題）；capacity (n.) 容量，容納能力；aboveground (adv.) 在地面上；disruptive (adj.) 引起擾亂的；tear down (phr.) 拆除；widen (v.) 拓寬；tap into (phr.) 開闢，打進（市…）；bypass (v.) 繞過；(n.)（繞過某個路線的）外環道路；alternative (adj.) 替代的；(n.) 替代方案\n\n<!-- page 330 -->\n\n**162.** 答案 (B)｜難度：中\nWhat is NOT an option suggested in the report?\n- (A) Rebuilding the road underground\n- (B) Moving the expressway farther north\n- (C) Repairing the damaged portions\n- (D) Pulling down the elevated roadway\n\n> 什麼不是報告中建議的選項？\n> (A) 在地面下重新建設道路\n> (B) 將高速公路北遷\n> (C) 維修損壞部分\n> (D) 拆除高架道路\n\n**Not/True Not 問題**\n這是需要在文章中找到與關鍵字 an option suggested 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A) 對應文中的「The second option is to rebuild the roadway underground.」，表示第二個選項是在地面下重新建設道路，符合選項敘述。和 (B) 相關的部分是「Much of this traffic would try to bypass the city by taking smaller roads to the north」，表示可能會有很多車繞到北邊較小的道路，但不是說要把高速公路遷移過去，所以不符合選項敘述，(B) Moving the expressway farther north 是正確答案。(C) 對應文中的「The first is to invest money in the repair of damaged sections.」，表示第一個選項是投入資金進行損壞區域的維修，符合選項敘述。(D) 對應文中的「The final option is to tear the expressway down」，表示最後一個選項是拆除高速公路，符合選項敘述。\n\n**替換表達**\nsections 部分 → portions 部分\ntear the expressway down 拆除高速公路 → Pulling down the elevated roadway 拆除高架道路\n\n**163.** 答案 (C)｜難度：高\nWhat is suggested about the city's waterfront?\n- (A) It has a highway running through the middle of it.\n- (B) It experiences severe road congestion.\n- (C) It has a low number of visitors.\n- (D) It is being redeveloped by the city.\n\n> 關於這個城市的水岸地區，文中顯示什麼？\n> (A) 有公路穿過中間。\n> (B) 塞車很嚴重。\n> (C) 到訪的人很少。\n> (D) 正由市府進行再開發。\n\n**推論 細節資訊**\n這是關於題目關鍵字 the city's waterfront 的推論問題。「The city has been trying to increase low visitation rates to the waterfront area」提到市府一直努力要把水岸地區低迷的到訪率提高，可以推知會去那裡的人很少，所以 (C) It has a low number of visitors 是正確答案。和 (A) 相關的部分是「having to walk along the dark streets underneath the expressway to reach the waterfront on the other side」，表示要走過高速公路下的陰暗道路才能到另一邊的水岸地區，但並沒有說公路是從水岸地區的中間穿過，所以不能選 (A)。\n\n**替換表達**\nlow visitation rates 低到訪率 → a low number of visitors 很低的到訪人數\n\n**單字** severe (adj.) 嚴重的；congestion (n.) 壅塞，堵塞；redevelop (v.) 再開發\n\n**164.** 答案 (D)｜難度：高\nWhat is mentioned about Greenville citizens?\n- (A) They want more shops in the area.\n- (B) They mostly drive to their workplaces.\n- (C) They are unhappy with public transportation.\n- (D) They may oppose a detour plan.\n\n> 關於 Greenville 的居民，文中提到什麼？\n> (A) 他們希望該區有更多商店。\n> (B) 他們大多開車上班。\n> (C) 他們對大眾運輸不滿意。\n> (D) 他們可能反對繞道計畫。\n\n**Not/True True 問題**\n這是需要在文章中找到與關鍵字 Greenville citizens 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A)、(B)、(C) 在文中沒有提到。(D) 對應文中的「Much of this traffic would try to bypass the city by taking smaller roads to the north, probably through the community of Greenville. At the same time, the residents of this community would most likely be against using their city as an alternative route」，表示許多車輛可能繞過市區而行經 Greenville 社區，而 Greenville 的居民很可能會反對將當地作為替代路線，符合選項敘述，所以 (D) They may oppose a detour plan 是正確答案。\n\n<!-- page 331 -->\n\n### Questions 165-167 refer to the following e-mail.\n165-167 題參照以下電子郵件。\n\n> To: Marcie Camden <mcamden@dawsoninc.com>\n> From: Christina Garcia <cgarcia@eshopping.com>\n> Date: November 10\n> Subject: Your order\n>\n> Ms. Camden,\n>\n> [166-B] This is about the two Lucia Simonetti designer handbags you ordered from our Web site on November 8. Unfortunately, [165] one of the handbags, Model #452, is currently unavailable. It has been a popular item, and I'm sorry to say that [165] we've just run out of stock. — [1] —. [167] We placed an order with our supplier in Italy around a week and a half ago. — [2] —. [167] The earliest we can expect the new items to arrive would be two weeks from today.\n>\n> [165] We would like to know if you still wish to proceed with your order. — [3] —. If so, we will send the available item, Model #450, by overnight shipping at no extra cost. Or you can wait for Model #452 to arrive, and we will ship everything together. — [4] —. Kindly send us a reply e-mail to inform us of your decision. I will be sure to keep you posted on any new developments as they occur. We apologize once more for the inconvenience.\n>\n> Sincerely,\n> Christina Garcia\n> Sales representative\n> E-Shopping\n\n**翻譯**\n> 收件者：Marcie Camden <mcamden@dawsoninc.com>\n> 寄件者：Christina Garcia <cgarcia@eshopping.com>\n> 日期：11 月 10 日\n> 主旨：您的訂單\n>\n> Camden 小姐：\n>\n> [166-B] 這封信是關於您 11 月 8 日在我們網站上訂購的 2 個 Lucia Simonetti 設計師手提包。很遺憾，[165] 其中一款型號 452 的手提包目前無法提供。這是熱門商品，我很抱歉告知 [165] 沒有存貨了。—[1]—。[167] 我們大約一週半之前向義大利的供應商下了訂單。—[2]—。[167] 我們預計新品最快會在今天起的 2 週後抵達。\n>\n> [165] 我們想知道您是否還希望繼續執行訂單。—[3]—。如果是的話，我們將會以隔日配送寄出可以供貨的型號 450，不另加收費用。或者您可以等待型號 452 到達，我們會將商品一起寄出。—[4]—。請用電子郵件回覆我們，告知您的決定。如果有新的進展，我一定會通知您最新情況。我們再次為您的不便致歉。\n>\n> Christina Garcia\n> 業務代表\n> E-Shopping 公司\n\n**單字** unfortunately (adv.) 遺憾地，不幸地；currently (adv.) 目前，現在；unavailable (adj.) 不能提供的，得不到的；out of stock (phr.) 沒有庫存的；proceed (v.) 繼續進行，行進；overnight (adj.) 一夜間的，隔日的；ship (v.) 運送，寄送；keep ~ posted (phr.) 使…持續得知最新情形；development (n.) 事態進展，發展\n\n**165.** 答案 (B)｜難度：低\nWhy did Ms. Garcia send the e-mail?\n- (A) To apologize for a billing error\n- (B) To ask for a preference for an order\n- (C) To propose a new project\n- (D) To schedule a business trip\n\n> 為什麼 Garcia 小姐寄了這封電子郵件？\n> (A) 為了請款錯誤致歉\n> (B) 為了詢問對於一筆訂單的偏好\n> (C) 為了提出新企畫案\n> (D) 為了安排出差日程\n\n**尋找主題／目的** 寫文章的理由\n這是問 Garcia 小姐寄電子郵件理由的尋找主題問題。不過，這一題必須綜合整篇文章的內容才能確定答題。「one of the handbags, Model #452, is currently unavailable」和「we've just run out of stock」提到訂購的手提包中，型號 452 缺貨，而「We would like to know if you still wish to proceed with your order.」表示想知道收件者是否希望照原訂購內容進行，所以 (B) To ask for a preference for an order 是正確答案。\n\n**單字** preference (n.) 偏好\n\n<!-- page 332 -->\n\n**166.** 答案 (B)｜難度：低\nWhat is mentioned about Ms. Camden?\n- (A) She ordered the wrong product from a catalog.\n- (B) She purchased items on the Internet.\n- (C) She asked for a refund two days ago.\n- (D) She made a reservation by e-mail.\n\n> 關於 Camden 小姐，文中提到什麼？\n> (A) 她在型錄中訂了錯誤的產品。\n> (B) 她在網路上購買了物品。\n> (C) 她兩天前
