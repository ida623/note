<script>
const SOURCE = "# 目錄\n\n1. [PART 5：單句文法與詞彙](#part-5)\n   概念：101~130 題都是單句選擇題，考點很雜但大致分幾類：詞性判斷（該填名詞、動名詞、形容詞還是副詞，以及它們該放哪個位置）、動詞的時態語態與單複數一致、代名詞（人稱代名詞的格、不定代名詞）、連接詞與介系詞的選用（子句連接詞表讓步/理由、介系詞表時間點/期間/除外等慣用搭配），以及大量的動詞/名詞/形容詞/副詞詞彙題（同詞性選項中挑意思對的字）。\n\n2. [PART 6：段落填空](#part-6)\n   概念：131~146 題共 4 篇短文，每篇考 4 個空格。除了 Part 5 那些詞性、時態語態、詞彙題型之外，這裡多了兩種要「讀完整篇文章」才能作答的題型：一種是「選出空格中正確的句子」，要靠上下句的邏輯銜接判斷；另一種是「連接副詞」，要判斷前後句是轉折、舉例還是換句話說的關係。\n   1. [Questions 131-134 refer to the following memo.](#questions-131-134-refer-to-the-following-memo-)\n      概念：公司內部發的備忘錄，宣布幫 Kaur 先生辦退休歡送會的流程安排。考點有時間副詞（onward）、要看全文才能判斷的未來式、選出銜接執行長致辭後內容的正確句子，以及動詞詞彙（circulate 傳閱）。\n   2. [Questions 135-138 refer to the following letter.](#questions-135-138-refer-to-the-following-letter-)\n      概念：投資顧問寫信恭喜客戶升職，並建議調整投資策略、增加投資項目。考點有名詞詞彙（promotion 升職）、選出提醒重新考慮投資策略的句子、to 不定詞表目的，以及名詞詞彙（status 狀態）。\n   3. [Questions 139-142 refer to the following letter.](#questions-139-142-refer-to-the-following-letter-)\n      概念：醫院寫給病患的患者關懷調查感謝信，請對方填問卷評分。考點有選出強調醫院重視病患需求的句子、被動語態判斷（is rated）、祈使句要用動詞原形（include），以及表轉折的連接副詞（Nonetheless）。\n   4. [Questions 143-146 refer to the following article.](#questions-143-146-refer-to-the-following-article-)\n      概念：科技公司 GizmoTech 展示會新聞稿，宣傳新手機開賣資訊與報名誘因。考點有表時間點的介系詞（following）、副詞詞彙（readily）、選出說明報名好處的句子，以及動詞 avoid 後面要接動名詞當受詞（getting）。\n\n3. [PART 7：閱讀理解](#part-7)\n   概念：147~200 題共 15 篇文章，從單篇的表格、信件、公告，到雙篇、三篇混合閱讀（網頁+email、email+公告、報導+收據+email 等）都有。常見題型是尋找主題／目的、wh- 問題（Why/Who/What/Where/How）、Not/True 是非題、推論題（尤其多篇文章要交叉比對）、同義詞／替換表達，以及找出句子插入的正確位置。\n   1. [Questions 147-148 refer to the following form.](#questions-147-148-refer-to-the-following-form)\n      概念：有線電視公司 SHARPNET 的帳號「重新啟用申請表」，客戶填寫搬家後想恢復訂閱的原因。考點是 wh- 問題 Why（退租原因）和 wh- 問題 Who（誰要在表格上簽名批准），屬於直接在表格裡找細節的題型。\n   2. [Questions 149-150 refer to the following letter.](#questions-149-150-refer-to-the-following-letter-)\n      概念：spa 業主寫信詢問 POS 收銀系統廠商，能否客製化追蹤折扣、點數消費等功能。考點是 wh- 問題 What（POS 系統能做什麼）和推論細節資訊（從常客回饋計畫推知該店允許用點數付款）。\n   3. [Questions 151-153 refer to the following information.](#questions-151-153-refer-to-the-following-information)\n      概念：Great Files 公司內部的會議室線上預約規則說明，附各樓層負責管理人對照表。考點是尋找主題／目的、Not/True 是非題（對照樓層與規則細節），以及推論細節資訊。\n   4. [Questions 154-155 refer to the following text message chain.](#questions-154-155-refer-to-the-following-text-message-chain-)\n      概念：兩位同事的簡訊對話，討論幫主管訂機票需要飛行常客卡號、以及點數不夠時該怎麼處理。考點是 wh- 問題 Why（還沒訂票的原因）和掌握意圖題（判斷某句話在對話中真正想表達的用意）。\n   5. [Questions 156-157 refer to the following article.](#questions-156-157-refer-to-the-following-article)\n      概念：報導中國科技公司 Chaoji 推出太陽能電腦 Hyperbar，可供偏鄉乾淨水電與網路。考點是 Not/True 是非題（比對文章細節與選項）和 wh- 問題 What（該公司今年內的下一步計畫）。\n   6. [Questions 158-160 refer to the following e-mail.](#questions-158-160-refer-to-the-following-e-mail)\n      概念：顧問公司人資主管寫給全體員工的信，說明因常態外包平面設計工作，想開內部訓練課程。考點是推論題、wh- 問題 What（主管在考慮做什麼），以及找出句子插入位置（[1][2][3][4] 標記）。\n   7. [Questions 161-163 refer to the following announcement.](#questions-161-163-refer-to-the-following-announcement)\n      概念：小學給家長的每週公告，說明假期前提早放學的安排以及書展活動。考點是兩題 Not/True 是非題（分別針對提早放學安排、書展與指定閱讀）和 wh- 問題 How。\n   8. [Questions 164-167 refer to the following online chat.](#questions-164-167-refer-to-the-following-online-chat-)\n      概念：銀行客服與客戶的線上對話紀錄，處理客戶想恢復已過期支票帳戶的問題。考點是掌握意圖題、推論題，以及兩題 wh- 問題 What（銀行政策、客戶偏好的處理方式）。\n   9. [Questions 168-171 refer to the following notice.](#questions-168-171-refer-to-the-following-notice)\n      概念：遊樂園公告萬聖節期間 Fright Nights 系列活動內容，附活動日期地點表格。考點是尋找主題／目的、wh- 問題 Where，以及兩題 Not/True 是非題（比對表格與內文細節）。\n   10. [Questions 172-175 refer to the following article.](#questions-172-175-refer-to-the-following-article)\n       概念：報導律師 Edmond Estrada 當選法官，接替即將退休的法官並談及個人資歷與社區參與。考點是尋找主題／目的、兩題 Not/True 是非題，以及找出句子插入位置。\n   11. [Questions 176-180 refer to the following Web page and e-mail.](#questions-176-180-refer-to-the-following-web-page-and-e-mail)\n       概念：雙篇閱讀，第一篇是滑雪度假村介紹網頁（設施、房型、優惠），第二篇是顧客詢問訂房與課程的 email。考點是 Not/True 是非題、同義詞題，以及兩題需要交叉比對兩篇文章的推論題，加上一題 wh- 問題 What。\n   12. [Questions 181-185 refer to the following e-mail and notice.](#questions-181-185-refer-to-the-following-e-mail-and-notice)\n       概念：雙篇閱讀，第一篇是主管寫給同事說明假期排班規定的 email，第二篇是公司發給全體員工的正式休假申請公告。考點是尋找主題／目的、兩題 Not/True 是非題，以及兩題要交叉比對兩篇文章時間點的 wh- 問題。\n   13. [Questions 186-190 refer to the following article, receipt, and e-mail.](#questions-186-190-refer-to-the-following-article-receipt-and-e-mail-)\n       概念：三篇混合閱讀，依序是美術館重新開幕特展的雜誌報導、購票收據，以及館內因文物延誤而通知展覽延期的 email。考點是尋找主題／目的、需交叉比對三篇文章的推論題、wh- 問題 What，以及需交叉比對的 Not/True 是非題。\n   14. [Questions 191-195 refer to the following memo, e-mail, and online form.](#questions-191-195-refer-to-the-following-memo-e-mail-and-online-form-)\n       概念：三篇混合閱讀，依序是通知公司併購後新員工報到的備忘錄、部門主管請採購部訂購辦公用品的 email，以及線上購物車訂單明細。考點是需交叉比對三篇文章的 wh- 問題與推論題，以及一題 Not/True 是非題。\n   15. [Questions 196-200 refer to the following article, e-mail, and form.](#questions-196-200-refer-to-the-following-article-e-mail-and-form-)\n       概念：三篇混合閱讀，依序是報導市政府計畫翻修火車站的新聞、市府回覆承包商投標詢問的 email，以及投標申請表。考點是尋找主題／目的、兩題需交叉比對三篇文章的推論題，以及兩題 Not/True 是非題。\n\n-----------------------------------------------------------\n\n<!-- page 355 -->\n# TEST 07\nPart 5 翻譯・解說\nPart 6 翻譯・解說 🆕\nPart 7 翻譯・解說 🆕\n\n<!-- page 356 -->\n## PART 5\n\n**101.** 答案 (B)｜難度：中\nPlease note that this establishment implements a time limit of 14 days for ______ non-defective and unopened purchases.\n- (A) return\n- (B) returning\n- (C) returns\n- (D) returned\n\n> 請注意本設施對於無瑕疵且未開封的購買物品的退貨，有 14 天的時間限制。\n\n**〔受詞位置〕動名詞 vs. 名詞**\n能用在介系詞（for）的受詞位置的名詞 (A) 和動名詞 (B) 是可能的答案。能接後面的名詞片語（non-defective and unopened purchases）當受詞的是動名詞，所以動詞 return（退回）的動名詞 (B) returning 是正確答案。名詞 (A) 後面不能接受詞。(C) 當名詞複數形時，後面不能接受詞；當動詞的第三人稱單數形時，本身也不能當介系詞的受詞。動詞過去式或過去分詞 (D) 不能當介系詞的受詞。\n\n**單字** implement (v.) 實施，履行；defective (adj.) 有缺陷的；unopened (adj.) 未開封的；purchase (n.) 購買的物品，購買；(v.) 購買\n\n**102.** 答案 (B)｜難度：低\nNo special seating arrangement was made for the seminar participants, but as ______ arrive, attendants will show them to the available seats.\n- (A) these\n- (B) they\n- (C) their\n- (D) them\n\n> 對於研討會參加者並沒有做特別的座位安排，但當他們抵達時，服務人員會帶他們到空位。\n\n**〔主詞位置〕人稱代名詞的格**\n從屬子句（as ____ arrive）缺少主詞，所以能用在主詞位置的指示代名詞 (A) 和人稱代名詞主格 (B) 是可能的答案。因為要表示「當他們抵達時，服務人員會帶他們到空位」的意思，所以人稱代名詞主格 (B) they 是正確答案。(A) these 是指時間、空間、心理上較近的事物，所以不對。人稱代名詞所有格 (C)、人稱代名詞受格 (D) 不能用在主詞位置。\n\n**103.** 答案 (C)｜難度：中\nHuman resources will periodically ______ employees to determine if they are meeting the company's performance standards.\n- (A) legitimize\n- (B) register\n- (C) evaluate\n- (D) coordinate\n\n> 人事部將定期評鑑員工，以判定他們是否符合公司的績效標準。\n\n**動詞詞彙**\n文意是「為了判定員工是否符合公司的標準而進行評價」，所以動詞 (C) evaluate（評價，估價）是正確答案。(A) legitimize 表示「正當化，合法化」，(B) register 表示「登記，註冊」，(D) coordinate 表示「協調」。\n\n**單字** periodically (adv.) 週期地，定期地；meet (v.) 符合，會面；performance (n.) 表現，業績\n\n**104.** 答案 (A)｜難度：中\nHaving studied South America for several decades, Professor Hartley ______ the pre-eminent authority on its civilizations.\n- (A) is considered\n- (B) considering\n- (C) consideration\n- (D) considers\n\n> Hartley 教授研究南美洲數十年，被認為是卓越的南美洲文明權威。\n\n**〔動詞位置〕第 5 類句型的被動態**\n主要子句（Professor Hartley ~ civilizations）缺少動詞，所以動詞 (A) 和 (D) 是可能的答案。選項中的動詞 consider（認為，視為）是接受詞和受詞補語的第 5 類句型動詞，但空格後面只有受詞補語（the pre-eminent authority），所以被動態的 (A) is considered 是正確答案。主動態 (D) 後面要有受詞和受詞補語。動名詞或分詞 (B)、名詞 (C) 不能用在動詞位置。另外，這裡動詞（consider）原本的受詞是 Professor\n\n<!-- page 357 -->\nHartley，但移到了主詞的位置，而形成被動態。\n\n**單字** decade (n.) 十年；pre-eminent (adj.) 卓越的，顯著的；authority (n.) 權威人士，權力；civilization (n.) 文明\n\n**105.** 答案 (C)｜難度：中\nThe espresso machine comes with an easily ______ nozzle that allows users to control the amount of coffee dispensed.\n- (A) adjust\n- (B) adjusts\n- (C) adjustable\n- (D) to adjust\n\n> 這台義式濃縮咖啡機有一個可輕易調節的出水口，讓使用者能控制咖啡流出的量。\n\n**形容詞位置**\n能修飾空格後方名詞（nozzle）的是形容詞，所以形容詞 (C) adjustable（可調整的）是正確答案。動詞 (A) 和 (B) 不能修飾名詞，而 to 不定詞 (D) 雖然可以像形容詞一樣修飾名詞，但是用在名詞後面做修飾。\n\n**單字** come with (phr.) 伴隨著…；nozzle (n.) 噴嘴，噴射口；dispense (v.) 分配，施與\n\n**106.** 答案 (C)｜難度：中\n______ the new payment method postponed the pay date, the employees appreciate the benefits of the new system.\n- (A) Because\n- (B) Despite\n- (C) Although\n- (D) Perhaps\n\n> 雖然新的發薪方式延後了發薪日，但員工還是喜歡新制度的好處。\n\n**〔引導修飾語的成分〕副詞子句連接詞** 讓步\n這個句子是有主詞（the employees）、動詞（appreciate）和受詞（the benefits）的完整句，所以 ____ ~ the pay date 的部分視為修飾語。這個修飾語是有動詞（postponed）的修飾子句，所以能引導修飾子句的副詞子句連接詞 (A) 和 (C) 是可能的答案。因為要表示「雖然發薪日延後，但員工喜歡新制度的好處」的意思，所以表讓步的副詞子句連接詞 (C) Although（雖然…，儘管…）是正確答案。(A) Because（因為…）表示理由。介系詞 (B) Despite（儘管…）引導沒有動詞的修飾片語，副詞 (D) Perhaps（或許）不能引導修飾成分。\n\n**單字** payment (n.) 支付，付款；postpone (v.) 延期，延遲；appreciate (v.) 欣賞，感謝\n\n**107.** 答案 (A)｜難度：中\n______ hearing the fire alarm, the students evacuated the building via the nearest exit.\n- (A) Upon\n- (B) From\n- (C) Within\n- (D) Besides\n\n> 一聽到火災警報，學生就從大樓最近的出口疏散了。\n\n**選擇介系詞** 時間點\n因為要表示「一聽到火災警報就疏散」的意思，所以表示時間點的介系詞 (A) Upon（一…就）是正確答案。(B) From「從…」表示方向，(C) Within「…之內」表示期間或範圍，(D) Besides「除了…以外」表示附加。\n\n**單字** fire alarm (phr.) 火災警報；evacuate (v.) 撤空，撤離，使疏散；via (prep.) 經由，透過…；exit (n.) 出口，退場；(v.) 出去\n\n**108.** 答案 (A)｜難度：中\nCitizens expressed their ______ for the mayor, who helped the city become financially solvent after 10 years of being heavily in debt.\n- (A) appreciation\n- (B) applause\n- (C) responsibility\n- (D) reluctance\n\n> 對於幫助嚴重負債達 10 年的城市變得有償債能力的市長，市民們表達了感謝。\n\n**名詞詞彙**\n文意是「表達對市長的感謝」，所以名詞 (A) appreciation（感謝，欣賞）是正確答案。(B) applause 表示「鼓掌」，(C) responsibility 表示「責任，職責」，(D) reluctance 表示「不情願」。\n\n**單字** mayor (n.) 市長；financially (adv.) 財政上，財務上；solvent (adj.) 有償還能力的；in debt (phr.) 負債\n\n<!-- page 358 -->\n**109.** 答案 (B)｜難度：中\nLong Road Truck Rental posted an announcement stating that it ______ employees to wear jeans with company shirts beginning on April 2.\n- (A) allow\n- (B) would allow\n- (C) is allowed\n- (D) were allowing\n\n> Long Road Truck Rental 公司貼出公告表示，將從 4 月 2 日起允許員工穿牛仔褲搭配公司襯衫。\n\n**動詞的單複數、時態、語態要正確**\nthat 子句（that ~ April 2）的主詞是第三人稱單數（it），而空格後面有受詞（employees），所以能和第三人稱單數主詞連用、形態為主動態的 (B) would allow 是正確答案。動詞原形 (A) 是和第一人稱、第二人稱或第三人稱複數的主詞連用，而被動態 (C) 後面不能接受詞。複數形的動詞 (D) were allowing 不能和單數主詞連用。另外，這個句子的主要子句是過去式，所以從屬子句也使用過去式（would）以保持時態一致。\n\n**單字** post (v.) 貼出，發表；(n.) 郵件；state (v.)（常用於書面語）陳述，說明\n\n**110.** 答案 (B)｜難度：高\nWith ______ information available on the terrain, the hikers hired a personal guide in order to ensure their safety.\n- (A) few\n- (B) little\n- (C) most\n- (D) this\n\n> 因為關於地形可得的資訊很少，所以這些健行者雇用了個人嚮導以確保安全。\n\n**數量表達方式**\n能修飾空格後方不可數名詞（information）的數量表達方式 (B)、(C) 和指示形容詞 (D) 是可能的答案。因為要表示「因為關於地形可得的資訊很少，所以雇用了嚮導」的意思，所以數量表達方式 (B) little（很少的）是正確答案。(C) most（大部分的）和 (D) this（這個）表達的意思不恰當。數量表達方式 (A) few 必須和可數名詞複數形連用。\n\n**單字** terrain (n.) 地形，地帶；hiker (n.) 健行者，徒步旅行者；ensure (v.) 確保，保證\n\n**111.** 答案 (B)｜難度：中\nMs. Latta usually uses her car to get to work, but she finds it simpler to commute via bus than ______ with city traffic.\n- (A) deals\n- (B) to deal\n- (C) is dealing\n- (D) has been dealing\n\n> Latta 小姐通常開她的車上班，但她發現搭公車通勤比應付市區交通來得簡單。\n\n**對等句型**\n因為要表示「搭公車通勤比應付市區交通來得簡單」的意思，所以表示比較的連接詞（than）應該是連接和 to commute via bus 同為 to 不定詞片語的結構，(B) to deal 是正確答案。動詞第三人稱單數形或名詞複數形 (A)、現在進行式 (C)、現在完成進行式 (D) 都不能和 to 不定詞並列比較。\n\n**112.** 答案 (C)｜難度：最高\nThe program for the charity concert is ______ and subject to change depending on the availability of performers.\n- (A) exempt\n- (B) privileged\n- (C) tentative\n- (D) finalized\n\n> 慈善音樂會的節目表是暫定的，有可能因為表演者的檔期而變更。\n\n**形容詞詞彙**\n文意是「節目表是暫定的，有可能因為表演者是否有空而受到變更」，所以形容詞 (C) tentative（暫定的）是正確答案。(A) exempt 表示「被免除的」，(B) privileged 表示「有特權的」，(D) finalized 表示「最終的，已確認的」。\n\n**單字** charity (n.) 慈善；subject (adj.) 容易受到…的；(n.) 主題；availability (n.) 可得性，可利用性\n\n<!-- page 359 -->\n**113.** 答案 (A)｜難度：中\nFollowing the retirement of popular video game company PB Play's founder, long-serving executive Robert Crane was ______ president of the firm.\n- (A) appointed\n- (B) affiliated\n- (C) resigned\n- (D) consented\n\n> 受歡迎的電玩遊戲公司 PB Play 的創辦人退休後，任職多年的主管 Robert Crane 被任命為公司總裁。\n\n**動詞詞彙**\n文意是「創辦人退休後，Robert Crane 被任命為公司總裁」，所以動詞 appoint（任命，指派）的 p.p. 形 (A) appointed 是正確答案。(B) 的動詞 affiliate 表示「使隸屬」，(C) 的 resign 表示「辭職，辭去」，(D) 的 consent 表示「同意，允許」。\n\n**單字** following (prep.) 在…之後；founder (n.) 創辦人；executive (n.) 主管；(adj.) 經營管理的，執行的\n\n**114.** 答案 (B)｜難度：中\n______ temperatures are expected to drop during the day, it might be wise to bring a warm winter coat.\n- (A) Unless\n- (B) Given that\n- (C) Except for\n- (D) As well as\n\n> 因為日間氣溫預期將會下降，所以帶件溫暖的冬季大衣可能是明智的。\n\n**〔引導修飾語的成分〕副詞子句連接詞** 理由\n這個句子是有主詞（it）、動詞（might be）、補語（wise）的完整句，所以 ____ ~ the day 的部分視為修飾語。這個修飾語是有動詞（are expected）的修飾子句，所以能引導修飾子句的副詞子句連接詞 (A) 和 (B) 是可能的答案。因為要表示「因為預期氣溫會下降，所以帶件溫暖的冬季大衣是明智的」的意思，所以表示理由的副詞子句連接詞 (B) Given that（考慮到…）是正確答案。(A) Unless（除非…）表示條件。介系詞 (C) Except for（除了…以外）引導的是沒有動詞的修飾片語。相關連接詞 (D) As well as 是以 B as well as A 的形式使用，表示「不止 A，B 也是」的意思。\n\n**115.** 答案 (A)｜難度：中\nMr. Powers informed a customer that the special security service was not customizable, but that the payment terms were ______.\n- (A) negotiable\n- (B) probable\n- (C) knowledgeable\n- (D) profitable\n\n> Powers 先生通知顧客，特別保全服務是不能客製化的，但是付款條款可以協商。\n\n**形容詞詞彙**\n文意是「特別保全服務是不能客製化的，但付款的條款是可以協商的」，所以形容詞 (A) negotiable（可協商的）是正確答案。(B) probable 表示「有可能的」，(C) knowledgeable 表示「知識豐富的」，(D) profitable 表示「有利益的」。\n\n**單字** security (n.) 保全，安全；customizable (adj.) 可以客製化／自訂的；term (n.) 條款，期間，措辭\n\n**116.** 答案 (D)｜難度：中\nMevTech representatives ______ arranged a press conference in order to address the sudden surge in customer complaints regarding their products.\n- (A) greatly\n- (B) noticeably\n- (C) severely\n- (D) hastily\n\n> MevTech 公司的代表匆促地安排了記者會，以處理對公司產品忽然激增的客訴。\n\n**副詞詞彙**\n文意是「匆促地安排了記者會，以處理對於公司產品忽然激增的客訴」，所以副詞 (D) hastily（匆促地）是正確答案。(A) greatly 表示「程度相當大地，非常」，(B) noticeably 表示「顯著地，明顯地」，(C) severely 表示「嚴格地，嚴重地」。\n\n**單字** press conference (phr.) 記者會；address (v.) 處理；surge (n.) 激增；complaint (n.) 抱怨，投訴\n\n<!-- page 360 -->\n**117.** 答案 (A)｜難度：高\n______ speculation that Whitmore Incorporated was in talks to merge with Busch & Hawley, stock prices for both companies began rising.\n- (A) Amid\n- (B) Abroad\n- (C) Atop\n- (D) Across\n\n> 在（大眾）臆測 Whitmore 公司正與 Busch & Hawley 商討合併的情況下，兩家公司的股價都開始上漲。\n\n**〔引導修飾語的成分〕選擇介系詞** 其他\n這個句子是有主詞（stock prices）、動詞（began）、受詞（rising）的完整句，所以 ____ ~ Busch & Hawley 的部分視為修飾語。這個修飾語是沒有動詞的修飾片語，所以能引導修飾片語的介系詞 (A)、(C)、(D) 是可能的答案。因為要表示「在對於合併的猜測中，股價開始上漲」的意思，所以介系詞 (A) Amid（在…之中）是正確答案。(C) Atop「在…頂上」表示位置，(D) Across（越過…）表示方向。副詞 (B) Abroad（往海外，在海外）不能引導修飾片語。\n\n**單字** speculation (n.) 推測，猜測；merge (v.) 合併；stock price (phr.) 股價\n\n**118.** 答案 (B)｜難度：中\nMr. Barton received a notice for an unpaid electricity bill and was asked to pay immediately to ensure ______ of the service.\n- (A) application\n- (B) continuation\n- (C) origination\n- (D) celebration\n\n> Barton 先生收到電費帳單未繳費的通知，並且被要求立即繳款，以確保服務持續不中斷。\n\n**名詞詞彙**\n文意是「收到電費帳單未繳費的通知，並且被要求立即繳款，以確保服務持續不中斷」，所以名詞 (B) continuation（持續，繼續）是正確答案。(A) application 表示「適用，應用」，(C) origination 表示「開始，起源」，(D) celebration 表示「慶祝，慶祝活動」。\n\n**單字** unpaid (adj.) 未繳款的；electricity bill (phr.) 電費帳單；immediately (adv.) 立即，馬上\n\n**119.** 答案 (A)｜難度：中\nThe company Web site recently underwent significant changes, making ______ who logged on confused by the modifications.\n- (A) all\n- (B) either\n- (C) more\n- (D) none\n\n> 公司網站最近有相當大的改變，使得所有登入的人都對這些更改感到困惑。\n\n**不定代名詞**\n因為要表示「公司網站有很大的改變，使得所有登入的人都感到困惑」的意思，所以不定代名詞 (A) all（全部）是正確答案。(B) either 表示兩者中的任何一個。可以當代名詞的數量表達方式 (C) more（更多的人事物）、不定代名詞 (D) none（沒有任何…）用在這裡的話，意思不恰當。\n\n**單字** undergo (v.) 經歷，接受；log on (phr.) 登入；modification (n.) 修改，改變\n\n<!-- page 361 -->\n\n**120.** 答案 (C)｜難度：？\nMr. Simmons is ______ in charge of keeping financial records, but he also takes care of other minor duties.\n- (A) steeply\n- (B) shortly\n- (C) mainly\n- (D) affordably\n\n> Simmons 先生主要負責做財務記錄，但也處理其他次要事務。\n\n**副詞詞彙**\n文意是「主要負責做財務記錄，但也處理其他次要事務」，所以副詞 (C) mainly（主要，大部分）是正確答案。(A) steeply 表示「陡直地，急劇地」，(B) shortly 表示「不久，很快」，(D) affordably 表示「可負擔地」。\n\n**單字** be in charge of (phr.) 負責…；take care of (phr.) 處理，照顧…；duty (n.) 職務，義務，稅\n\n**121.** 答案 (B)｜難度：？\nAfter closely inspecting the antique cabinet alongside the reproduction, the dealer could identify the ______ characteristics of each.\n- (A) distinguished\n- (B) distinguishing\n- (C) distinguishes\n- (D) distinguish\n\n> 仔細檢視了古董櫃和複製品之後，那位古董商能夠辨識出兩者各自具有識別性的特徵。\n\n**〔形容詞位置〕容易混淆的形容詞**\n能修飾空格後方名詞（characteristics）的是形容詞，所以形容詞 (A) 和 (B) 是可能的答案。因為要表達「能夠辨識出兩者各自具有識別性的特徵」的意思，所以形容詞 (B) distinguishing（和其他有所區別的，有特色的）是正確答案。(A) distinguished 表示「著名的」，用在這裡意思會變成「能夠辨識出兩者各自著名的特徵」，所以不對。動詞 (C) 和 (D) 不能修飾名詞。\n\n**單字** inspect (v.) 檢查，檢視；antique (n.) 古董；(adj.) 古式的；cabinet (n.) 櫃子，收納櫃；alongside (prep.) 和…一起，在…旁邊；reproduction (n.) 複製品，繁殖\n\n**122.** 答案 (D)｜難度：？\nThe CEO ______ resisted appeals from investors to expand the business, but he has since changed his mind.\n- (A) accordingly\n- (B) exactly\n- (C) ultimately\n- (D) initially\n\n> 執行長起初抗拒投資者所提出擴展事業的訴求，但他從那之後就改變了心意。\n\n**副詞詞彙**\n文意是「執行長起初抗拒，但之後改變了心意」，所以副詞 (D) initially（最初，起初）是正確答案。(A) accordingly 表示「照著，相應地」，(B) exactly 表示「確切地，精確地」，(C) ultimately 表示「最終，終極地」。\n\n**單字** resist (v.) 抵抗，抗拒；appeal (n.) 呼籲，請求，吸引力；expand (v.) 擴張，擴大；since (adv.) 從那之後；(conj.) 由於…\n\n**123.** 答案 (B)｜難度：？\nMs. Muncy prefers investing in bonds and mutual funds rather than facing the daily ______ of individual stocks.\n- (A) pronunciations\n- (B) fluctuations\n- (C) experimentations\n- (D) installations\n\n> Muncy 小姐偏好投資債券和共同基金，而不是面對個股每天的波動。\n\n**名詞詞彙**\n文意是「面對個別股票每天的波動」，所以名詞 (B) fluctuations（波動）是正確答案。(A) 的名詞 pronunciation 表示「發音」，(C) 的 experimentation 表示「實驗」，(D) 的 installation 表示「安裝」。\n\n**單字** bond (n.) 債券，聯繫；(v.) 黏合；mutual fund (phr.) 共同基金；individual (adj.) 個別的；(n.) 個人\n\n<!-- page 362 -->\n\n**124.** 答案 (B)｜難度：最高\nSports commentators have been guessing ______ of the weaker teams in the league will still be eligible to participate.\n- (A) what\n- (B) which\n- (C) that\n- (D) whose\n\n> 體育評論員們當時在猜測聯盟的弱隊當中哪一隊還有資格參賽。\n\n**〔主詞位置〕名詞子句連接詞 疑問詞 which**\n動詞 have been guessing 的受詞是 ______ ~ participate，其中缺少主詞，所以能當名詞子句連接詞，同時當主詞的疑問詞 (A)、(B)、(D) 是可能的答案。因為要表達「哪一隊還有資格參加」的意思，所以 (B) which（哪個）是正確答案。(A) what（什麼）和 (D) whose（誰的）用在這裡的話，意思不恰當。當名詞子句連接詞（整個子句視為名詞）的 (C) that 後面要接有主詞和動詞的完整句，不能同時充當子句中的主詞。\n\n**單字** commentator (n.) 評論員，實況解說員；eligible (adj.) 有資格（做某事）的\n\n**125.** 答案 (A)｜難度：中\nCrime rates have decreased considerably, thanks in part to the establishment of hotlines that people can use to ______ report suspicious behavior.\n- (A) anonymously\n- (B) anonymity\n- (C) anonymousness\n- (D) anonymous\n\n> 犯罪率大幅下降，一部分要歸功於設置了讓民眾能夠匿名舉報可疑行為的電話專線。\n\n**副詞位置**\n能修飾空格後方動詞（report）的是副詞，所以副詞 (A) anonymously（匿名地）是正確答案。名詞 (B)、(C) 和形容詞 (D) 都不能修飾動詞。\n\n**單字** crime rate (phr.) 犯罪率；considerably (adv.) 相當，相當多地；thanks to (phr.) 多虧有…，由於有…；hotline (n.) 熱線電話；report (v.) 報告，告發；suspicious (adj.) 可疑的，懷疑的\n\n**126.** 答案 (C)｜難度：中\n______ letting recyclable materials at the office go to waste, the Colton Company brings them to a local recycling center.\n- (A) After\n- (B) Nevertheless\n- (C) Instead of\n- (D) Not only\n\n> Colton 公司不是讓辦公室的可回收物品被白白丟棄，而是帶到當地的回收中心。\n\n**〔引導修飾語的成分〕選擇介系詞 除外**\n這個句子是有主詞（the Colton Company）、動詞（brings）、受詞（them）的完整句，所以 ______ ~ waste 的部分視為修飾語。這個修飾語是沒有動詞的修飾片語，所以能引導修飾片語的介系詞 (A) 和 (C) 是可能的答案。因為要表示「不讓可回收物品被浪費，而是帶到當地的回收中心」，所以表示除外的介系詞 (C) Instead of（而不是…，代替…）是正確答案。(A) After「…之後」表示時間點。連接副詞 (B) Nevertheless（儘管如此）不能引導修飾片語。(D) Not only 常以 not only A but (also) B 的相關連接詞形態使用。修飾片語（______ ~ waste）中形成動名詞的 let（讓…）是使役動詞，所以使用「使役動詞（letting）＋受詞（recyclable materials）＋原形不定詞（go to waste）」的句型，注意不要把 go to waste 誤認為句中的主要動詞。\n\n**單字** recyclable (adj.) 可回收再利用的；go to waste (phr.) 被浪費掉\n\n<!-- page 363 -->\n\n**127.** 答案 (D)｜難度：？\nFor the directors' luncheon, the administrative department reserved a ______ room away from the main dining area to discuss sensitive issues.\n- (A) relevant\n- (B) crowded\n- (C) decorated\n- (D) private\n\n> 行政部門為董事們的午餐會預約了遠離主要用餐區的私人包廂，以便討論機密議題。\n\n**形容詞詞彙**\n文意是「預約遠離主要用餐區的私人包廂，以便討論機密議題」，所以形容詞 (D) private（私人的，個人的）是正確答案。(A) relevant 表示「有關的，適切的」，(B) crowded 表示「擁擠的」，(C) decorated 表示「經過裝飾的」。\n\n**單字** luncheon (n.) 午餐會；sensitive (adj.) 機密的，敏感的\n\n**128.** 答案 (A)｜難度：？\nDr. Marcus spoke ______ the allotted 30 minutes, leaving no time for questions after his speech.\n- (A) beyond\n- (B) about\n- (C) under\n- (D) around\n\n> Marcus 博士演講超過他分配到的 30 分鐘，結果演講後沒剩下讓人發問的時間。\n\n**選擇介系詞 期間**\n要表達的意思是「演講超過被分配到的 30 分鐘」，所以表示期間的介系詞 (A) beyond 是正確答案。(B) about 表示「關於…」，(C) under 表示「在…下方，未滿…，按照（規定）」，(D) around 表示「在…周圍」。\n\n**單字** allotted (adj.) 被分配的\n\n**129.** 答案 (B)｜難度：？\nThe Nigel Art Gallery was small relative to well-known museums, but its sculptures were ______ among the best in the world.\n- (A) arguable\n- (B) arguably\n- (C) argument\n- (D) argues\n\n> Nigel 藝廊和著名博物館比起來相對較小，但它的雕塑品收藏可以稱得上是世界一流。\n\n**副詞位置**\n能修飾 but 後面的子句（its sculptures ~ the world）的是副詞，所以副詞 (B) arguably（可以說是怎樣地）是正確答案。形容詞 (A)、名詞 (C)、動詞 (D) 都不能修飾子句。即使把 (A) arguable（可論證的）當成空格前面的動詞 were 的補語，也會形成「它的雕塑品是可以論證的」這種不恰當的意思，所以不對。\n\n**單字** relative to (phr.) 相對於…，和…相關的；sculpture (n.) 雕塑品；(v.) 雕刻\n\n**130.** 答案 (A)｜難度：？\nIn an attempt to make its products immediately ______, the company worked with a top advertising agency on an eye-catching logo.\n- (A) identifiable\n- (B) identifying\n- (C) identification\n- (D) identify\n\n> 為了讓產品能立即被認出，公司和一家頂尖的廣告公司合作設計引人注目的標誌。\n\n**可以放在補語位置的成分：名詞或形容詞**\n動詞 make（使…變得…）是可以接受詞補語的動詞，所以能當補語的形容詞 (A)、動名詞或現在分詞 (B)、名詞 (C) 是可能的答案。其中，可以被空格前面的副詞（immediately）修飾，並且表示「產品馬上就能被認出」的形容詞 (A) identifiable（可識別的）是正確答案。動名詞或現在分詞 (B) 的意思會變成「使得產品馬上就在辨認」，所以不對。名詞 (C) 不能被副詞修飾。動詞 (D) 不能用在補語的位置。\n\n**單字** in an attempt to (phr.) 為了試圖做到…；eye-catching (adj.) 引人注目的；logo (n.) 標誌，商標\n\n<!-- page 364 -->\n\n## PART 6\n\n### Questions 131-134 refer to the following memo. 🆕\n131-134 題參照以下備忘錄。\n\n> To: All Staff\n> From: Stephanie Johnstone\n> Subject: Mr. Kaur's retirement\n>\n> Hello everyone,\n>\n> This is just a reminder that we have organized a retirement party for Mr. Kaur next Friday from 6 p.m. ______(131). I would appreciate it if you could all attend unless you have good reason not to. After everyone is seated, the program ______(132) at precisely 6:15 p.m. The CEO plans to give a congratulatory speech. ______(133). As our longest-serving staff member, he has certainly earned this recognition.\n>\n> I have asked the supervisors of each department to ______(134) a book in which members of staff may write messages to Mr. Kaur wishing him well upon his retirement. The book will be passed around starting tomorrow morning. It will be given to him at the end of the ceremony, so please make the time to write something.\n\n**翻譯**\n> 收件者：所有員工\n> 寄件者：Stephanie Johnstone\n> 主旨：Kaur 先生的退休\n>\n> 大家好：\n>\n> [131] 這則訊息是要提醒大家，我們在下週五下午 6 點之後籌畫了 Kaur 先生的退休派對。我希望大家都能出席，除非有正當的理由不去。[132] 大家就座之後，活動節目將從下午 6:15 準時開始。執行長預計將發表賀辭。[133] 然後一位董事會成員將頒發忠誠員工獎給 Kaur 先生。身為公司裡服務最久的員工，他當然有資格獲得這項表揚。\n>\n> [134] 我已經請各部門主管把一本冊子傳下去，讓同仁們可以留言祝福 Kaur 先生退休後順利。冊子會從明天早上開始傳下去。這本冊子會在典禮結束時給他，所以請抽空寫些東西。\n\n**131.**\n- (A) around\n- (B) over\n- (C) upward\n- (D) onward\n\n**132.**\n- (A) has begun\n- (B) will begin\n- (C) will have begun\n- (D) began\n\n**133.** 🆕\n- (A) We will then ask Mr. Kaur to put off his retirement for a year.\n- (B) Our employees will be expected to remain loyal to the company.\n- (C) A board member will then present a loyalty award to Mr. Kaur.\n- (D) The office staff should say whether they can attend the ceremony.\n\n**134.**\n- (A) circulate\n- (B) retrieve\n- (C) determine\n- (D) reveal\n\n**單字** retirement (n.) 退休；reminder (n.)（為了讓人想起約定或要做的事）作為提醒的事物；precisely (adv.) 準確地，正好；congratulatory speech (phr.) 賀辭，祝賀的演說；long-serving (adj.) 長期任職服務的；staff member (phr.) 員工；earn (v.) 獲得，賺；recognition (n.)（對於功勞之類的）認定，表揚；supervisor (n.) 管理者，監督者；pass around (phr.) 把…傳遞下去（讓大家都看到）\n\n<!-- page 365 -->\n\n**131.** 答案 (D)｜難度：？\n**選擇副詞 時間副詞**\n因為要表示「在下週五下午 6 點之後籌畫了退休派對」的意思，所以表示時間的副詞 (D) onward（在某個時間以後）是正確答案。其他選項當副詞時，(A) around 表示「大約，到處」，(B) over 表示「在上方，越過」，(C) upward 表示「往上」。\n\n**132.** 答案 (B)｜難度：？\n**未來式** 參考全文\n文意是「大家就座之後，活動節目從 6:15 準時開始」，因為無法從空格所在的句子判斷適當的動詞時態，所以必須參考空格前後或文章整體的內容。前面部分提到下週五（next Friday）籌畫了退休派對，然後詳細說明活動內容，可知活動節目開始是未來會發生的事情，所以未來式 (B) will begin 是正確答案。未來完成式 (C) 雖然也表示未來，但確切的意思是某個行為會在未來特定時間點之前完成，在這裡意思會變成「大家就座之後，活動節目會準時在 6:15 就已經開始了」，意思不恰當。現在完成式 (A) 和過去式 (D) 不能表示未來。\n\n**133.** 🆕 答案 (C)｜難度：？\n**選出空格中正確的句子**\n這是選擇句子的題目，所以要參考空格前後或文章整體的內容。上一句「The CEO plans to give a congratulatory speech.」提到，執行長預計將發表賀辭，而下一句「As our longest-serving staff member, he has certainly earned this recognition.」則說他是公司裡服務最久的員工，當然有資格獲得表揚。所以，空格的內容應該和執行長演說後對 Kaur 先生的表揚有關，正確答案是 (C) A board member will then present a loyalty award to Mr. Kaur。\n\n**選項翻譯**\n- (A) 然後我們會請求 Kaur 先生把他的退休延後一年。\n- (B) 希望我們的員工對公司保持忠心。\n- (C) 然後一位董事會成員將頒發忠誠員工獎給 Kaur 先生。\n- (D) 公司員工應該表明是否能參加活動。\n\n**單字** put off (phr.) 延後；loyal (adj.) 忠實的，忠心的；board member (phr.) 董事會成員；present (v.) 頒發，出示；(n.) 現在\n\n**134.** 答案 (A)｜難度：？\n**動詞詞彙** 參考上下文\n文意是「______ 一本讓員工們可以寫下訊息的冊子」，(A) 和 (B) 是可能的答案。因為無法從空格所在的句子判斷答案，所以必須參考空格前後或文章整體的內容。後面部分提到冊子會從明天早上開始傳下去，然後會在典禮結束時給他，希望大家抽空寫些東西，可知是要把冊子傳下去讓大家留言。所以，動詞 (A) circulate（傳遞）是正確答案。(B) retrieve 表示「取回」，(C) determine 表示「判定，決定」，(D) reveal 表示「揭露」。\n\n<!-- page 366 -->\n\n### Questions 135-138 refer to the following letter. 🆕\n135-138 題參照以下信件。\n\n> March 5\n>\n> Jeanie Handa\n> 837 River Ridge Street\n> St. Louis, MO 63115\n>\n> Dear Ms. Handa,\n>\n> I heard about the good news from one of your colleagues. Congratulations on your ______(135) to senior systems analyst!\n>\n> The reason I am writing is to update you on your investments, which are doing satisfactorily. ______(136). Now that your career is flourishing, you can invest in other funds or additional stock ______(137) your earnings and develop your portfolio. I'd like to set an appointment with you so that we can discuss your options in more detail. I am free to meet with you as early as next week.\n>\n> We can review the ______(138) of your current portfolio and explore additional financial opportunities. Please contact me at 555-8343 or send an e-mail to j.clark@secureinvestments.com to set up an appointment.\n>\n> Sincerely,\n> Jack Clark\n> Consultant\n> Secure Investments\n\n**翻譯**\n> 3 月 5 日\n>\n> Jeanie Handa\n> 837 號，River Ridge 街\n> 聖路易，密蘇里州 63115\n>\n> 親愛的 Handa 小姐：\n>\n> 我從您同事那邊聽說了好消息。[135] 恭喜您升職為資深系統分析師！\n>\n> 我之所以寫這封信，是要告知您投資的最新情況，目前投資的表現令人滿意。[136] 不過，現在可能是重新考慮投資策略的時候了。[137] 既然您的事業正發達，您可以投資其他基金或更多股票來增加您的收入並擴展投資組合。 (B) In other words\n- (C) Nonetheless\n- (D) For instance\n\n**單字** medical (adj.) 醫療的，醫學的；facility (n.) 設施；survey (n.)（問卷）調查；fill out (phr.) 填好，填寫；questionnaire (n.) 問卷；direct (v.) 指示，導演；(adj.) 直接的；analyze (v.) 分析；privacy (n.) 隱私；track (v.) 追蹤，追溯；assessment (n.) 評價\n\n<!-- page 369 -->\n\n**139.** 🆕 答案 (C)｜難度：？\n**選出空格中正確的句子**\n這是選擇句子的題目，所以要參考空格前後或文章整體的內容。下一句「We hope that you are fully satisfied with the quality of care that you received.」提到，希望對方對於獲得的醫療服務品質完全滿意，所以空格的內容應該跟醫院提供給患者的醫療服務品質有關，正確答案是 (C) At High Point Medical, we always strive to meet the needs of each patient。\n\n**選項翻譯**\n- (A) 對於您受到的對待，請接受我們誠摯的道歉。\n- (B) 我們非常感謝您對醫院的慷慨捐贈。\n- (C) 在 High Point Medical，我們一向致力於滿足每位患者的需求。\n- (D) 我們的紀錄顯示您預約但未到診。\n\n**單字** sincere (adj.) 誠摯的，真誠的；treatment (n.) 對待，治療；delighted (adj.) 高興的，愉快的；generous (adj.) 慷慨的，大方的；donation (n.) 捐贈，捐款；strive (v.) 努力，奮鬥\n\n**140.** 答案 (C)｜難度：？\n**〔動詞位置〕主動態與被動態的區別**\nthat 子句（that ~ directed）缺少動詞，所以動詞 (A) 和 (C) 是可能的答案。空格後面沒有受詞，而且要表示「確認五個項目中的每一個都依照指示被評分了」的被動意義，所以被動態 (C) is rated 是正確答案。主動態 (A) 不正確，而動名詞 (B)、to 不定詞 (D) 不能用在動詞的位置。另外，請注意 rate（評價，受到評價）有及物動詞和不及物動詞的用法，當及物動詞時後面接受詞，而當不及物動詞時後面接補語或副詞。\n\n**141.** 答案 (B)｜難度：？\n**祈使句沒有主詞，由動詞原形開始**\n這個句子是沒有主詞，以 please 開始的祈使句，所以用於祈使句的動詞原形 (B) include（包含）是正確答案。to 不定詞 (A)、動詞過去式或過去分詞 (C)、名詞 (D) 都不能當祈使句的動詞。\n\n**142.** 答案 (C)｜難度：？\n**連接副詞** 參考上下文\n空格和逗號一起出現在句首的連接副詞位置，所以要判斷空格所在的句子和上一個句子的關係再作答。上一句提到，問卷調查中提供的資訊將受到分析，並作為未來改善服務之用，而空格所在的句子說隱私將獲得保護，所以表示句子內容和前文形成對比時使用的連接副詞 (C) Nonetheless（雖然如此）是正確答案。(A) Likewise 表示「同樣地」，(B) In other words 表示「換句話說」，(D) For instance 表示「舉例來說」，用在這裡的意思都不恰當。\n\n<!-- page 370 -->\n\n### Questions 143-146 refer to the following article. 🆕\n143-146 題參照以下文章。\n\n> The GizmoTech Technology Showcase will be held at Somerset Hall on Friday, October 3 from 7:00 p.m. to 11:45 p.m. The most highly anticipated item, the GizPhone Gold, is expected to draw a huge crowd of people anxious to purchase the device as soon as it goes on sale at midnight ______(143) the event. During the showcase, GizmoTech employees will be ______(144) available to answer people's questions. Attendees will also have the opportunity to try the device out for themselves after a demonstration of its functions. ______(145). Given that GizmoTech inventory has been known to sell out in a matter of minutes, this is sure to provide consumers with added incentive to sign up early.\n>\n> Anyone interested is advised to register at www.GizmoTech.com/Showcase as soon as possible to avoid ______(146) shut out of the exhibit.\n\n**翻譯**\n> GizmoTech 公司科技展示會將於 10 月 3 日週五晚間 7:00 至 11:45 在 Somerset 廳舉行。[143] 最受期待的產品 GizPhone Gold 預期將吸引大批急著在活動後的午夜開賣時就購買的群眾。[144] 展示會期間，GizmoTech 員工會隨時在場回答大家的問題。參加者也將有機會在這款裝置的功能示範後親自試用。[145] 最棒的是，他們將獲得購買這款電話的優先權。眾所皆知，GizmoTech 的存貨在幾分鐘內就會銷售一空，所以這一定會給消費者額外的誘因去提早報名。\n>\n> [146] 建議所有有興趣者盡快在 www.GizmoTech.com/Showcase 登記報名，以免無法參與展示會。\n\n**143.**\n- (A) throughout\n- (B) within\n- (C) following\n- (D) into\n\n**144.**\n- (A) daily\n- (B) lately\n- (C) normally\n- (D) readily\n\n**145.** 🆕\n- (A) Best of all, they will be given priority status to buy the phone.\n- (B) GizPhone Golds will likely hit shelves a month after the product launch.\n- (C) Their products will be sold at marked-down prices to all customers.\n- (D) In fact, the company's other products sold remarkably well this year.\n\n**146.**\n- (A) get\n- (B) getting\n- (C) gotten\n- (D) got\n\n**單字** showcase (n.) 展示會，展示；anticipate (v.) 預期；go on sale (phr.) 發售；attendee (n.) 出席者；try out (phr.) 試用；demonstration (n.) 示範操作，說明；function (n.) 功能；(v.) 起作用；given that (phr.) 考慮到…；inventory (n.) 存貨，庫存；sell out (phr.) 賣完；incentive (n.) 動機，鼓勵方式；register (v.) 登記，註冊\n\n<!-- page 371 -->\n\n**143.** 答案 (C)｜難度：〔無法辨識〕\n**選擇介系詞 時間點**\n要表達的意思是「在活動後的午夜開賣」，所以表示時間點的介系詞 (C) following（在…之後）是正確答案。(A) throughout「在…從頭到尾，遍及…」表示期間或位置。(B) within「在…之內」表示期間或範圍。雖然 (A) throughout 和 (B) within 似乎可以用在這裡，表示「在活動期間內的午夜時分開賣」，但因為活動時間只到 11:45，而開賣時間是午夜 12 點（at midnight），所以這兩個答案不恰當。(D) into「往…裡面」表示方向。\n\n**144.** 答案 (D)｜難度：〔無法辨識〕\n**副詞詞彙**\n文意是「展示會期間，GizmoTech 員工會隨時在場回答問題」，所以副詞 (D) readily（準備好地，立即地）是正確答案。(A) daily 表示「每天」，(B) lately 表示「最近」，(C) normally 表示「通常，正常地」。\n\n**145.** 🆕 答案 (A)｜難度：〔無法辨識〕\n**選出空格中正確的句子**\n這是選擇句子的題目，所以要參考空格前後或文章整體的內容。前面部分提到，最受期待的產品預期將在活動後的午夜開賣時就吸引大批急欲購買的群眾，而下一句「Given that GizmoTech inventory has been known to sell out in a matter of minutes, this is sure to provide consumers with added incentive to sign up early.」則提到，考慮到 GizmoTech 的存貨在幾分鐘內就會銷售一空，這件事一定會給消費者額外的誘因去提早報名。所以，空格的內容應該和報名活動的好處有關，正確答案是 (A) Best of all, they will be given priority status to buy the phone。\n\n**選項翻譯**\n- (A) 最棒的是，他們將獲得購買這款電話的優先權。\n- (B) GizPhone Gold 可能在產品發表會一個月後上架販賣。\n- (C) 他們的產品將降價販賣給所有顧客。\n- (D) 事實上，這家公司的其他產品在今年賣得非常好。\n\n**單字** priority (n.) 優先，優先權；status (n.) 地位，身分；hit shelves (phr.) 上市，開始販售；launch (n.) 發行，上市；marked-down (adj.) （價格）調降了的；remarkably (adv.) 非常，顯著地\n\n**146.** 答案 (B)｜難度：〔無法辨識〕\n**〔受詞位置〕接動名詞當受詞的動詞**\n空格前面的動詞 avoid（避免）會接動名詞當受詞，所以動詞 get（變成…，被…）的動名詞 (B) getting 是正確答案。動詞 (A)、(D) 和分詞 (C) 不能當動詞 avoid 的受詞。\n\n<!-- page 372 -->\n\n## PART 7\n\n### Questions 147-148 refer to the following form.\n147-148 題參照以下表格。\n\n> SHARPNET CABLE\n> 840 B Street, San Diego, CA 92101\n>\n> **REACTIVATION REQUEST**\n>\n> Please fill in the information below and [148] mail the completed form back to us, addressed to our head of accounts, Wendy Shore. If you have any further questions, please contact our customer service representative Raymond Hinckley at 555-8734, extension #016.\n>\n> [147] Subscriber name: Darius Jackson\n> Account number: MM7681WRE3\n>\n> [147] Reason for initial cancellation:\n> ☐ Quality was less than expected\n> ☐ Unsatisfied with terms and conditions\n> [147] ☑ Moved to a new location\n> ☐ Not interested in receiving cable service\n>\n> Additional comments:\n> I had originally planned to get an extension through the account of another subscriber, Michael Blakeley, but he will be moving away next month. So, I'd like my old account to be reactivated under a new address. I'm hoping my student discount still applies.\n>\n> *Darius Jackson* — Subscriber's signature　　*June 25* — Date\n>\n> [148] Approved by: ________ — Head of Accounts\n\n**翻譯**\n> SHARPNET CABLE 公司\n> 840 號，B 街，聖地牙哥，加州 92101\n>\n> **重新啟用申請**\n>\n> 請填寫以下資料，並且 [148] 將填妥的表格寄回給我們的會計部主任 Wendy Shore。如果您還有疑問，請撥 555-8734 分機 016 聯絡我們的客服專員 Raymond Hinckley。\n>\n> [147] 用戶姓名：Darius Jackson\n> 帳號：MM7681WRE3\n>\n> [147] 原先退租理由：\n> ☐ 品質不如預期\n> ☐ 不滿意服務條款\n> [147] ☑ 搬到新的地點\n> ☐ 沒有興趣接受有線電視服務\n>\n> 其他意見：\n> 我原本打算透過另一個用戶 Michael Blakeley 的帳號辦理續用，但他下個月要搬走了。所以，我想用新地址重新啟用我的舊帳號。我希望我的學生折扣還適用。\n>\n> *Darius Jackson* — 用戶簽名　　6 月 25 日 — 日期\n>\n> [148] 批准者：________ — 會計部主任\n\n**單字** fill in (phr.) 填寫；extension (n.) 電話分機，延長，擴大；cancellation (n.) 取消；terms and conditions (phr.) 條款；apply (v.) 適用，申請；mail (v.) 郵寄；(n.) 郵件；subscriber (n.) 訂閱者，租用長期服務的人；unsatisfied (adj.) 不滿意的，未滿足的；originally (adv.) 原本，本來；account (n.) 帳戶，說明；discount (n.) 折扣；(v.) 打折扣\n\n<!-- page 373 -->\n\n**147.** 答案 (B)｜難度：〔無法辨識〕\nWhy did Mr. Jackson cancel his subscription?\n- (A) He extended a trip.\n- (B) He changed addresses.\n- (C) He lost a student discount.\n- (D) He was dissatisfied with a service.\n\n> Jackson 先生為什麼退租了？\n> (A) 他延長了旅行。\n> (B) 他換了地址。\n> (C) 他失去了學生折扣。\n> (D) 他不滿意服務。\n\n**wh- 問題 Why**\n這是問 Jackson 先生為什麼（Why）退租的 wh- 問題，所以要尋找和問題重點 Mr. Jackson cancel his subscription 相關的內容。「Subscriber name: Darius Jackson」、「Reason for initial cancellation:」、「Moved to a new location」的部分顯示，Darius Jackson 原先退租的理由是他搬到新的地方了，所以 (B) He changed addresses 是正確答案。\n\n**替換表達**\nMoved to a new location 搬到了新的地方 → changed addresses 換了地址\n\n**單字** subscription (n.) 訂閱，租用長期服務\n\n**148.** 答案 (A)｜難度：〔無法辨識〕\nWho will be signing the form?\n- (A) Wendy Shore\n- (B) Darius Jackson\n- (C) Michael Blakeley\n- (D) Raymond Hinckley\n\n> 誰會在這張表格簽名？\n> (A) Wendy Shore\n> (B) Darius Jackson\n> (C) Michael Blakeley\n> (D) Raymond Hinckley\n\n**wh- 問題 Who**\n這是問誰（Who）會在這張表格簽名的 wh- 問題，所以要尋找和問題重點 signing the form 相關的內容。「mail the completed form ~ to our head of accounts, Wendy Shore」提醒要把填好的表格寄回給會計部主任 Wendy Shore，而「Approved by: Head of Accounts」是讓會計部主任批准的空格，也就是說會計部主任 Wendy Shore 要在這張表格上簽名，所以 (A) Wendy Shore 是正確答案。\n\n<!-- page 374 -->\n\n### Questions 149-150 refer to the following letter. 🆕\n149-150 題參照以下信件。\n\n> [150] Hilltop Spa and Wellness Center\n> 1141 Oak Street, Hillsborough, OR 97123\n>\n> August 14\n>\n> Theodore Cummings\n> Account Manager\n> Revtech Systems\n> 5620 Prescott St.\n> Portland, OR 97218\n>\n> Dear Mr. Cummings,\n>\n> I picked up a brochure on your company at a recent trade fair and wanted to inquire about purchasing one of your point-of-sale (POS) systems. It says on your brochure that you can customize a POS system for almost any type of business. [150] I run the above-named spa, and we sell products, including name-brand lotions and creams, and offer services such as massages and various other treatments.\n>\n> I appreciate the fact that your POS system can track sales of goods or services paid for with cash, as well as debit and credit cards. I also like that [149] it can generate detailed sales reports. However, [150] I want to know whether it can also show items that have been sold at discounted prices or that have been paid for with points. I hold occasional promotions, hand out gift cards, and [150] maintain a rewards program for frequent customers. For this reason, I'd like the POS system to track items sold under those categories and reflect them in the sales report.\n>\n> Please let me know when we can meet to discuss this further. I'd like to have a new system up and running by October 15. You can reach me during our regular hours between 8:00 a.m. and 7:00 p.m., Tuesday through Sunday, at 555-2306. Thank you.\n>\n> Sincerely,\n>\n> Shauna Gillis\n> Proprietor\n> Hilltop Spa and Wellness Center\n\n**翻譯**\n> [150] Hilltop Spa and Wellness Center\n> 1141 號，Oak 街，希爾斯伯勒，奧勒岡州 97123\n>\n> 8 月 14 日\n>\n> Theodore Cummings\n> 客戶經理\n> Revtech Systems 公司\n> 5620 號，Prescott 街\n> 波特蘭，奧勒岡州 97218\n>\n> 親愛的 Cummings 先生：\n>\n> 我在最近一場貿易展拿了貴公司的小冊，想詢問採購貴公司銷售點（POS）系統的事宜。小冊上說貴公司能為幾乎任何種類的企業客製化 POS 系統。[150] 我經營上述名稱的 spa，我們販售包括知名品牌乳液與乳霜等產品，並提供如按摩與各種其他療程的服務。\n>\n> 我很欣賞貴公司的 POS 系統能夠追蹤以現金、簽帳卡和信用卡付款的商品或服務。我也喜歡 [149] 它能夠產生詳細的銷售報告。不過，[150] 我想知道它是否也能顯示以折扣價賣出或以點數付帳的項目。我偶爾會舉辦促銷、發送禮品券，也 [150] 維持著常客的回饋計畫。因此，我希望 POS 系統可以追蹤這些類別的售出項目，並且反映在銷售報告上。\n>\n> 請告訴我，我們什麼時候可以見面進一步討論這件事。我希望新系統能在 10 月 15 日前開始運作。您可以在我們週二至週日上午 8:00 到晚間 7:00 的正常營業時間撥打 555-2306 聯絡我。謝謝。\n>\n> Shauna Gillis\n> 業主\n> Hilltop Spa and Wellness Center\n\n**單字** brochure (n.) （介紹、廣告用的）小冊；name-brand (adj.) 知名品牌的；sales (n.) 銷售，銷售額，（擴展銷路的）業務；goods (n.) 商品，財產；hand out (phr.) 分發；up and running (phr.) 運作中的；proprietor (n.) 業主，所有人，經營者；customize (v.) 訂做，客製化；track (v.) 追蹤，跟蹤；generate (v.) 產生；frequent customer (phr.) 常客；reach (v.) （尤其指用電話）聯絡，抵達；(n.) 可及的範圍；above-named (adj.) 上述名稱的；occasional (adj.) 偶爾的，臨時的；reflect (v.) 反映，反射\n\n<!-- page 375 -->\n\n**149.** 答案 (C)｜難度：〔無法辨識〕\nAccording to the letter, what can Revtech's POS system do?\n- (A) Print out gift cards\n- (B) Analyze inventory levels\n- (C) Produce sales data\n- (D) Create custom invoices\n\n> 根據這封信，Revtech 的 POS 系統能夠做什麼？\n> (A) 印出禮品券\n> (B) 分析存貨量\n> (C) 產生銷售資料\n> (D) 製作客製化的發票\n\n**wh- 問題 What**\n這是問 Revtech 的 POS 系統能夠做什麼（What）的 wh- 問題，所以要尋找和問題重點 Revtech's POS system do 相關的內容。「it can generate detailed sales reports」提到，它（POS 系統）能夠產生詳細的銷售報告，所以 (C) Produce sales data 是正確答案。文中只有提到 POS 系統能產生詳細的銷售報告，沒有提到分析存貨量，所以 (B) 不對。\n\n**替換表達**\ngenerate ~ sales reports 產生銷售報告 → Produce sales data 產生銷售資料\n\n**單字** inventory (n.) 庫存，存貨清單；create (v.) 創造，做出；custom (adj.) 訂製的；(n.) （用複數形）海關；invoice (n.) 發票\n\n**150.** 答案 (C)｜難度：〔無法辨識〕\nWhat is suggested about Hilltop Spa and Wellness Center?\n- (A) It is open seven days a week.\n- (B) It manufactures its own line of products.\n- (C) It allows people to use reward points as payment.\n- (D) It will be expanding to another location in October.\n\n> 關於 Hilltop Spa and Wellness Center，文中顯示什麼？\n> (A) 每週營業 7 天。\n> (B) 製造自己的系列產品。\n> (C) 允許使用回饋點數付款。\n> (D) 10 月將會拓展到新地點。\n\n**推論 細節資訊**\n這是問關於 Hilltop Spa and Wellness Center 可以得知什麼的推論問題。「Hilltop Spa and Wellness Center」和「I run the above-named spa」表示寄件人經營名叫 Hilltop Spa and Wellness Center 的 spa，而「I want to know whether it can also show items ~ that have been paid for with points」和「maintain a rewards program for frequent customers」表示想知道 POS 系統能不能顯示以點數付帳的項目，因為寄件人所經營的 spa 有常客回饋計畫。所以可以推知，Hilltop Spa and Wellness Center 允許顧客使用回饋點數付款，(C) It allows people to use reward points as payment 是正確答案。\n\n**單字** manufacture (v.) 生產，製造；payment (n.) 支付，付款\n\n<!-- page 376 -->\n### Questions 151-153 refer to the following information.\n151-153 題參照以下資訊。\n\n> **Conference Room Reservations**\n>\n> [151] If any employee of Great Files Inc. wishes to reserve a meeting room, go to the conference room reservation schedule online at: www.greatfiles.com/employee/meetings to check for available time slots. [152-D] If the slot you require is not available, please send an e-mail to your respective floor administration representative listed below and include the purpose of your reservation.\n>\n> | [152-B] Floor | Representative |\n> |---|---|\n> | 2nd | Heather Greenstone |\n> | [152-A/C] 3rd | Roxanne Laddington |\n> | [152-C] 4th | Elissa Hunter |\n> | [152-B] 5th | Victor Anzelo |\n> | [152-A/B/C] 7th | Roxanne Laddington |\n> | 8th | Jonathan Madison |\n> | 9th | Ian Dexter |\n> | [152-C] 10th | Elissa Hunter |\n>\n> The representative will then follow up with you if the reservation schedule can be changed. Please do not contact any party who has already reserved the room to negotiate a scheduling change.\n>\n> If the online schedule shows that your desired time is open, select the time from the drop-down menu and enter the number of attendees along with the purpose of the meeting. It is strongly suggested that reservations be made at least one week in advance as last minute reservations can be difficult to accommodate. Furthermore, please note that [153] the large meeting rooms on the 7th and 8th floors are now available until 11 p.m. every day, including Saturday and Sunday. All others may only be reserved during regular working hours. [152-A] For any questions or concerns regarding the scheduling system, contact Roxanne Laddington at extension #2968.\n\n**翻譯**\n> **會議室預約**\n>\n> [151] Great Files 公司任何員工如果希望[?]約會議室，請上網路版會議室預約時[?]表：www.greatfiles.com/employee/meetings 查看可預約的時段。[152-D] 如果[?]你需要的時段無法預約，請寄電子郵件給下列各樓層管理人，並註明你的預[?]目的。\n>\n> | [152-B] 樓層 | 管理人 |\n> |---|---|\n> | 2 樓 | Heather Greenstone |\n> | [152-A/C] 3 樓 | Roxanne Laddington |\n> | [152-C] 4 樓 | Elissa Hunter |\n> | [152-B] 5 樓 | Victor Anzelo |\n> | [152-A/B/C] 7 樓 | Roxanne Laddington |\n> | 8 樓 | Jonathan Madison |\n> | 9 樓 | Ian Dexter |\n> | [152-C] 10 樓 | Elissa Hunter |\n>\n> 如果預約時間表可以變更，管理人將[?]進一步聯絡你。請不要聯絡任何已預[?]約會議室的當事人協商時程變更。\n>\n> 如果線上時間表顯示你想要的時段空著，請從下拉式選單選擇時間，並輸入[?]參加人數與會議目的。強烈建議至少一週前預約，因為最後一刻的預約可能很[?]難安排。還有，請注意 [153] 位於 7 樓和 8[?] 樓的大型會議室現在每天開放至晚間 11 點為止，包括週六和週日。其他會[?]議室都只能預約正常上班時段。[152-A] 如[?]果有任何關於排程系統的問題，請打分[?]機 2968 聯絡 Roxanne Laddington。\n\n**單字** conference room (phr.) 會議室；slot (n.) 時段，位置，投入孔；respective (adj.) 各自的；party (n.) 當事人，團體，政黨；negotiate (v.) 協商，談判；open (adj.) 空著的，開放的；along with (phr.) 和…一起，連同…；accommodate (v.) 容納，為…提供便利，通融；regular (adj.) 一般的，規則的；regarding (prep.) 關於…\n\n**151.** 答案 (A)｜難度：低\n*(答案與解析印在次頁 p-377)*\nWhat is the main purpose of the information?\n- (A) To explain an office procedure to staff\n- (B) To clarify manager names by floor\n- (C) To announce meeting regulations\n- (D) To notify employees of room changes\n\n> 這則資訊的主要目的是什麼？\n> (A) 為了向員工說明辦公室程序\n> (B) 為了說明各樓層管理者姓名\n> (C) 為了公告會議規定\n> (D) 為了通知員工會議室變更\n\n<!-- page 377 -->\n（151 續，答案 (A)）\n\n**尋找主題／目的 文章的目的**\n這是詢問資訊主要目的的尋找主題問題，所以要特別注意文章開頭的部分。「If any employee ~ wishes to reserve a meeting room, go to the conference room reservation schedule online ~ to check for available time slots.」提到，如果員工想預約會議室，要在網路上的時間表查看可預約的時段，之後則具體說明預約會議室的方法和規定，所以 (A) To explain an office procedure to staff 是正確答案。\n\n**單字** procedure (n.) 程序，步驟；regulation (n.) 規定，規範；notify (v.) 通知，告知\n\n**152.** 答案 (C)｜難度：中\nWhat is NOT indicated about the floor representatives?\n- (A) One of them is the contact for scheduling system questions.\n- (B) None of them are responsible for the 6th floor.\n- (C) Only one of them is assigned to two floors.\n- (D) All of them can be contacted for room changes by floor.\n\n> 關於樓層管理人，文中沒有提到什麼？\n> (A) 其中一個人是排程系統問題的聯絡人。\n> (B) 沒有人負責 6 樓。\n> (C) 只有一個人被分配了兩個樓層。\n> (D) 所有人都接受聯絡以進行該當樓層的會議室變更。\n\n**Not/True Not 問題**\n這是需要在文章中找到與關鍵字 the floor representatives 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A) 對應文中的「For any questions or concerns regarding the scheduling system, contact Roxanne Laddington」，表示有關於時程管理系統的問題就聯絡 Roxanne Laddington，而「3rd, Roxanne Laddington」和「7th, Roxanne Laddington」表示她是 3 樓和 7 樓的管理人，符合選項敘述。(B) 對應文中的「Floor」、「5th」、「7th」，顯示中間的 6 樓沒有管理人，符合選項敘述。和 (C) 相關的部分是「3rd, Roxanne Laddington」、「7th, Roxanne Laddington」和「4th, Elissa Hunter」、「10th, Elissa Hunter」，顯示分配到兩個樓層的人有兩個，不符合選項敘述，所以 (C) Only one of them is assigned to two floors. 是正確答案。(D) 對應文中的「If the slot you require is not available, please send an e-mail to your respective floor administration representative」，表示當需要的時段無法預約時，可以寄電子郵件聯絡各樓層的管理人，符合選項敘述。\n\n**替換表達**\nsend an e-mail 寄電子郵件 → be contacted 被聯絡\nrespective floor 各自的樓層 → by floor 依樓層\n\n**單字** contact (n.) 聯絡人，聯絡，接觸；(v.) 聯絡；assign (v.) 分配，指派\n\n**153.** 答案 (B)｜難度：高\nWhat is suggested about the meeting rooms?\n- (A) They can be reserved by calling representatives directly.\n- (B) The hours for some of them have been extended.\n- (C) The ones on the 7th and 8th floors were renovated.\n- (D) They may be booked with the department supervisors.\n\n> 關於會議室，文中顯示什麼？\n> (A) 可以直接打電話給管理人預約。\n> (B) 部分會議室的開放時間延長了。\n> (C) 7 樓和 8 樓的會議室翻修過了。\n> (D) 可以向部門主管預約。\n\n**推論 細節資訊**\n這是關於題目關鍵字 the meeting rooms 的推論問題。「the large meeting rooms on the 7th and 8th floors are now available until 11 p.m. every day, including Saturday and Sunday. All others may only be reserved during regular working hours.」提到，位於 7 樓和 8 樓的大型會議室現在每天開放至晚間 11 點為止，包括週六和週日，而其他會議室都只能預約正常上班時段，可以推斷 7 樓和 8 樓的大型會議開放時間延長了，所以 (B) The hours for some of them have been extended 是正確答案。\n\n<!-- page 378 -->\n### Questions 154-155 refer to the following text message chain. 🆕\n154-155 題參照以下備忘錄。\n\n> **Dorothy Lee** [4:15]\n> You're the intern in charge of booking Mr. Parker's flight to Las Vegas, right? He asked me to tell you there's been a change, and he needs to leave on June 9 and return on the 14th.\n>\n> **James Harter** [4:18]\n> [154] I haven't done it yet because I need his frequent flier number to check his points balance. I was going to ask for it earlier, but he and the other supervisors are still in a meeting.\n>\n> **Dorothy Lee** [4:20]\n> I've got that information somewhere. I'm his personal assistant, so you can contact me anytime you need details like that. Let me find it.\n>\n> **Dorothy Lee** [4:24]\n> It's KLJ0294SB1.\n>\n> **James Harter** [4:25]\n> Got it. I'm checking now.\n>\n> **James Harter** [4:28]\n> [155] He hasn't got enough points to cover a round-trip. Should we still use them?\n>\n> **Dorothy Lee** [4:29]\n> Don't bother. [155] We can save them for a future flight.\n>\n> **James Harter** [4:30]\n> OK. I'll go ahead and make the booking now.\n>\n> **Dorothy Lee** [4:30]\n> Send me the confirmation by e-mail. Thanks, James.\n\n**翻譯**\n> **Dorothy Lee** [4:15]\n> 你是負責幫 Parker 先生訂往拉斯維加斯航班的實習生對吧？他要我告訴你有[?]變動，他必須在 6 月 9 日出發，14 日回來。\n>\n> **James Harter** [4:18]\n> [154] 我還沒訂，因為我需要他的飛行常客[?]號碽來確認點數餘額。我剛才本來想跟[?]他要的，但他還在和其他主管開會。\n>\n> **Dorothy Lee** [4:20]\n> 我應該有那個資訊。我是他的個人助[?]理，所以你需要這種詳細資料時都可以[?]聯絡我。讓我找找。\n>\n> **Dorothy Lee** [4:24]\n> 是 KLJ0294SB1。\n>\n> **James Harter** [4:25]\n> 明白了。我正在查。\n>\n> **James Harter** [4:28]\n> [155] 他的點數不夠換來回票。我們還要用[?]點數嗎？\n>\n> **Dorothy Lee** [4:29]\n> 不用了。[155] 我們可以留著以後訂機票用。\n>\n> **James Harter** [4:30]\n> OK。我現在繼續訂票。\n>\n> **Dorothy Lee** [4:30]\n> 把確認信 e-mail 給我。謝了，James。\n\n**單字** frequent flier (phr.) 常搭飛機的乘客；balance (n.) 餘額，平衡；(v.) 使平衡；personal assistant (phr.) 個人助理[?]；cover (v.) 足夠付（某事物的費用），覆蓋，包含；round-trip (n.) 往返旅行\n\n<!-- page 379 -->\n**154.** 答案 (A)｜難度：低\nWhy was Mr. Harter unable to complete a task?\n- (A) He lacked some necessary information.\n- (B) He received two different sets of instructions.\n- (C) He was busy with another assignment.\n- (D) He misunderstood what he was supposed to do.\n\n> 為什麼 Harter 先生沒能完成一件工作？\n> (A) 他缺少某個必要資訊。\n> (B) 他接到兩套不同的指示。\n> (C) 他忙著做另一件工作。\n> (D) 他誤會了自己應該要做的事。\n\n**wh- 問題 Why**\n這是問 Harter 先生為什麼（Why）沒能完成一件工作的 wh- 問題，所以要尋找和問題重點 Mr. Harter unable to complete a task 相關的內容。Harter 先生說「I haven't done it yet because I need his frequent flier number to check his points balance.」，表示 Harter 先生還沒訂機票，因為還需要他（Parker 先生）的飛行常客號碼來確認點數餘額，所以 (A) He lacked some necessary information 是正確答案。\n\n**單字** lack (v.) 缺少，缺乏…；instruction (n.) 指示，說明，命令；misunderstand (v.) 誤解，誤會\n\n**155.** 🆕 答案 (C)｜難度：中\nAt 4:29, what does Ms. Lee mean when she writes, \"Don't bother\"?\n- (A) She wants Mr. Harter to cancel a reservation.\n- (B) She does not want to disturb Mr. Parker while he is busy.\n- (C) She prefers that Mr. Parker's flight be paid for without points.\n- (D) She does not think Mr. Parker will require a round-trip flight.\n\n> 在 4:29，Lee 小姐說的「Don't bother」是什麼意思？\n> (A) 她希望 Harter 先生取消預訂。\n> (B) 她不想在 Parker 先生忙碌的時候打擾他。\n> (C) 她希望不要用點數支付 Parker 先生的機票費用。\n> (D) 她認為 Parker 先生不需要來回機票。\n\n**掌握意圖**\n題目問 Lee 小姐的意思，所以要掌握引用部分（Don't bother）上下文的情境。Harter 先生說「He hasn't got enough points to cover a round-trip. Should we still use them?」，表示因為 Parker 先生的點數不夠換來回票，所以想問是否還應該使用點數。Lee 小姐回答「Don't bother.」（不用麻煩了），接著又說「We can save them for a future flight.」，表示可以留著以後訂機票用，可知 Lee 小姐希望這次訂 Parker 先生的機票不要使用點數，所以 (C) She prefers that Mr. Parker's flight be paid for without points 是正確答案。\n\n**單字** disturb (v.) 打擾，擾亂；without (prep.) 不使用…，沒有…\n\n<!-- page 380 -->\n### Questions 156-157 refer to the following article.\n156-157 題參照以下報導。\n\n> **The Hyperbar is a Futuristic Solution to a Present-day Problem**\n> By Gregory Diehl\n>\n> KHARTOUM, Sudan—The Chinese technology firm Chaoji International has just unveiled a powerful new machine that could transform the lives of millions of people around the world. Dubbed [156-A] the Hyperbar, this solar-powered computer aims to provide rural communities with access to clean water, electricity, and an Internet connection.\n>\n> It works by capturing solar energy through panels on its surface and converting this into electricity using a built-in battery. [156-B] The electricity is then used to power a water treatment system that can yield up to 3,000 liters of clean drinking water a day. Excess electricity can also be used to charge mobile devices. Moreover, the system provides wireless Internet access to anyone within a 750-kilometer radius.\n>\n> \"The Hyperbar will fulfill a few of the basic needs that many of us today take for granted,\" says Chaoji spokesperson Damien Lin. \"Additionally, it will provide employment through jobs associated with construction and maintenance of the machines.\" Chaoji further envisions that [156-D] business-minded individuals will be able to use the Hyperbar's Internet connection to develop new services and enhance economic activity.\n>\n> [157] The Hyperbar is currently being tested in a handful of villages in Sudan, but Chaoji plans to expand into Ethiopia and Chad before the year is out. If the trials are successful, the company can produce thousands more machines over the coming decade. Several Western firms have already expressed an interest in investing.\n\n**翻譯**\n> **Hyperbar 是現今問題極為先進的解決[?]方案**\n> Gregory Diehl 撰文\n>\n> 喀土穆，蘇丹－中國科技業者 Chaoji International 公司剛公開了可能改變全[?]世界數百萬人生活的強大新型機器，名[?]為 [156-A] Hyperbar，這款靠太陽能運作的[?]電腦的目標是使鄉村地區有乾淨的水、[?]電力以及網路連線可用。\n>\n> 它的運作方式是透過表面的太陽能板吸[?]收太陽能，並且用內建電池轉換為電[?]力。[156-B] 接著，電力將用來驅動每天可[?]產生多達 3,000 公升乾淨飲用水的水[?]處理系統。多餘的電力也能用來為行動[?]裝置充電。而且，本系統能為半徑 750[?] 公里以內的任何人提供無線網路連線。\n>\n> Chaoji 公司發言人 Damien Lin 表示：[?]「Hyperbar 將滿足我們許多人現今視[?]為理所當然的一些基本需求。此外，它[?]也將提供與機器組裝及維護相關工作的[?]就業機會。」Chaoji 公司更進一步想[?]像，[156-D] 具有商業頭腦的個人將可利用[?] Hyperbar 的網路連線開發新服務，並[?]促進經濟活動。\n>\n> [157] Hyperbar 目前在蘇丹少數幾個村莊[?]測試中，但 Chaoji 公司預計於年底前[?]拓展至衣索比亞與查德。若試驗成功，[?]公司將能在未來數十年多生產數千台機[?]器。已經有數家西方企業表示有興趣投[?]資。\n\n**單字** futuristic (adj.) 未來感的，非常先進的；present-day (adj.) 今日的，現今的；unveil (v.) 首次公開，揭露；transform (v.) 完全轉變，使變形；dub (v.) 給…某個稱號；solar-powered (adj.) 以太陽能為動力的[?]；rural (adj.) 鄉村的，農村的；access (n.) 能利用的機會，接近；panel (n.) 板，金屬板；surface (n.) 表面；convert (v.) 轉換，變換；built-in (adj.) 內建的，嵌入的；yield (v.) 產出，產生；radius (n.) 半徑，半徑範圍；fulfill (v.) 滿足，完成；construction (n.) 組裝，建設；envision (v.) 想像，展望；handful (n.) 少量，一把；trial (n.) 嘗試，試驗，審判\n\n<!-- page 381 -->\n**156.** 答案 (C)｜難度：高\nWhat is NOT true about the Hyperbar?\n- (A) It uses the sun as its main source of energy.\n- (B) It may produce more electricity than is needed for water purification.\n- (C) It can charge up to 750 mobile devices at a time.\n- (D) It has the potential to benefit entrepreneurs.\n\n> 關於 Hyperbar，何者不正確？\n> (A) 利用太陽作為主要能源。\n> (B) 可以產生超過水質淨化所需的電力。\n> (C) 一次可以同時為多達 750 個行動裝置充電。\n> (D) 有讓企業家受益的可能性。\n\n**Not/True Not 問題**\n這是需要在文章中找到與關鍵字 the Hyperbar 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A) 對應文中的「the Hyperbar, this solar-powered computer」，表示 Hyperbar 是靠太陽能運作的電腦，符合選項敘述。(B) 對應文中的「The electricity is then used to power a water treatment system that can yield up to 3,000 liters of clean drinking water a day.」和「Excess electricity can also be used」，表示產生的電力除了可以製造 3,000 公升的乾淨飲用水以外，多餘的電力也可以使用，符合選項敘述。(C) 在文中沒有提到，所以 (C) It can charge up to 750 mobile devices at a time. 是正確答案。(D) 對應文中的「business-minded individuals will be able to use the Hyperbar's Internet connection to develop new services and enhance economic activity」，表示有商業頭腦的個人可以利用 Hyperbar 的網路連線開發新服務，並促進經濟活動，符合選項敘述。\n\n**替換表達**\nsolar-powered 以太陽能為動力的 → uses the sun as ~ main source of energy 利用太陽作為主要能源\n\n**單字** at a time (phr.) 一次；potential (n.) 可能性；(adj.) 潛在的，可能的\n\n**157.** 答案 (C)｜難度：中\nWhat does Chaoji International plan to do within the year?\n- (A) Establish partnerships with various governments\n- (B) Start construction of over a thousand more machines\n- (C) Continue testing of the Hyperbar outside of Sudan\n- (D) Persuade several Western firms to invest\n\n> Chaoji International 公司今年打算做什麼？\n> (A) 和一些政府建立合作關係\n> (B) 開始多組裝一千多台機器\n> (C) 在蘇丹以外的地方繼續測試 Hyperbar\n> (D) 說服幾家西方公司投資\n\n**wh- 問題 What**\n這是問 Chaoji International 公司今年打算做什麼（What）的 wh- 問題。和問題重點 Chaoji International plan to do within the year 相關的部分是「The Hyperbar is currently being tested in a handful of villages in Sudan, but Chaoji plans to expand into Ethiopia and Chad before the year is out.」，表示 Hyperbar 目前在蘇丹少數幾個村莊測試中，但 Chaoji 公司預計於年底前拓展至衣索比亞與查德，所以 (C) Continue testing of the Hyperbar outside of Sudan 是正確答案。\n\n**替換表達**\nwithin the year 今年之內 → before the year is out 今年結束前\n\n**單字** partnership (n.) 合夥關係，合作關係\n\n<!-- page 382 -->\n### Questions 158-160 refer to the following e-mail.\n158-160 題參照以下電子郵件。\n\n> To: All Staff\n> From: Brendan Rogerson <b.rogerson@ellisellis.com>\n> Subject: Training Courses\n> Date: April 12\n>\n> Hello all Ellis and Ellis Consulting staff,\n>\n> As you know, I've been trying to find a way to improve efficiency here in the office and asked you to complete a survey providing your suggestions. — [1] —. [160] For instance, a number of employees have expressed the desire to take more professional development classes so they can add to their skills. [160] And at the same time, I have noticed that [158/160] we have had to hire graphic designers on a very regular basis. — [2] —. When it comes to very big projects, like Web site design or creating our annual report, this seems appropriate, but [158] in many cases, we are hiring them to do an hour of work that one of our own employees could probably do with a little training. — [3] —.\n>\n> Consequently, [159] I am considering organizing a short course on basic graphic design skills for any employees who are interested. — [4] —. [159] This would allow us to use in-house skills for smaller design projects in the future. If this sounds like something you would like to participate in, please respond to this e-mail and let me know before April 20.\n>\n> Best wishes,\n> Brendon Rogerson\n> Human Resources Director, Ellis and Ellis Consulting\n\n**翻譯**\n> 收件者：所有員工\n> 寄件者：Brendan Rogerson <b.rogerson@ellisellis.com>\n> 主旨：訓練課程\n> 日期：4 月 12 日\n>\n> 所有 Ellis and Ellis 顧問公司的員工大家好：\n>\n> 如各位所知，我一直努力尋找提升辦公[?]室效率的方法，並且要你們完成提供建[?]議的問卷調查。— [1] —。[160] 舉例來說，[?]很多員工表示希望能上更多專業發展課[?]程來增加自己的技能。[160] 同時，我也注[?]意到 [158/160] 我們往常都必須非常固定性[?]地聘請平面設計師。— [2] —。對於非常[?]大型的專案，像是網站設計或製作年度[?]報告書，這似乎是恰當的，但 [158] 在許多[?]情況中，我們雇用他們做一小時的工[?]作，而這可能是我們的員工只要接受一[?]點訓練就能做的。— [3] —。\n>\n> 所以，[159] 我在考慮為有興趣的任何員工[?]規畫基礎平面設計技巧的短期課程。— [4] —。[159] 這樣能使我們未來在較小的設[?]計專案中使用公司內部人員的技能。如[?]果這聽起來是你想要參加的，請在 4 月[?] 20 日之前回覆這封電子郵件讓我知道。\n>\n> Brendon Rogerson\n> 人事主任，Ellis and Ellis 顧問公司\n\n**單字** efficiency (n.) 效率，效能；add to (phr.) 使增加；on a regular basis (phr.) 定期地[?]；when it comes to (phr.) 說到…，至於…；annual (adj.) 每年的，一年的；appropriate (adj.) 適合的，適當的；in-house (adj.) 公司內的，組織內的\n\n**158.** 答案 (D)｜難度：高\nWhat is indicated about Ellis and Ellis Consulting?\n- (A) It provides training courses to other companies.\n- (B) It specializes in designing Web sites.\n- (C) It recently released an annual report.\n- (D) It has unnecessary expenditures on graphic design.\n\n> 關於 Ellis and Ellis 顧問公司，文中提[?]到什麼？\n> (A) 提供訓練課程給其他公司。\n> (B) 專門從事網站設計。\n> (C) 最近發布了年度報告。\n> (D) 在平面設計方面有不必要的支出。\n\n**推論 細節資訊**\n這是關於題目關鍵字 Ellis and Ellis Consulting 的推論問題。「we have had to hire graphic designers on a very regular basis」的部分提到，我們（Ellis and Ellis 顧問公司）總是必須定期聘請平面設計師，而「in many cases, we are hiring them to do an hour of work that one of our own employees could probably do with a little training」則指出，在許多情況中雇用的平面設計師只做一個小時的工作，而這樣的工作或許只要讓員工[?]受一點訓練就可以做。所以可以推知，Ellis and Ellis 顧問公司聘請平面設計師的支出可能有一部分是不必[?]要的，(D) It has unnecessary expenditures on graphic design 是正確答案。\n\n**單字** specialize (v.) 專門從事，專攻；release (v.) 發表，釋放；expenditure (n.) 支出，開支\n\n<!-- page 383 -->\n**159.** 答案 (C)｜難度：中\nWhat does Mr. Rogerson want to do?\n- (A) Hire graphic designers as permanent employees\n- (B) Get ideas from staff about some survey questions\n- (C) Reduce the company's reliance on outside help\n- (D) Boost employees' interest in a skill-building class\n\n> Rogerson 先生想要做什麼？\n> (A) 雇用平面設計師當正職員工。\n> (B) 得到員工對於一些問卷調查問題的想法\n> (C) 減少公司對外部支援的依賴\n> (D) 增加員工對於技能建立課程的興趣\n\n**wh- 問題 What**\n這是問 Rogerson 先生想要做什麼（What）的 wh- 問題。和問題重點 Mr. Rogerson want to do 相關的部分是「I am considering organizing a short course on basic graphic design skills for any employees」和「This would allow us to use in-house skills for smaller design projects in the future.」，表示 Rogerson 先生在考慮為員工規畫基礎平面設計技巧的短期課程，目的是在未來較小的設計專案中能使用公司內部人員的技能，可以推知他希望藉此減少對外聘人力的依賴，所以 (C) Reduce the company's reliance on outside help 是正確答案。\n\n**單字** permanent employee (phr.) 正職員工；reliance (n.) 依賴，依靠；outside (adj.) 外部的；(n.) 外面；boost (v.) 增加，推動\n\n**160.** 🆕 答案 (A)｜難度：中\nIn which of the positions marked [1], [2], [3], and [4] does the following sentence best belong?\n\"Going through them, a couple of trends have become very clear to me.\"\n- (A) [1]\n- (B) [2]\n- (C) [3]\n- (D) [4]\n\n> 以下這個句子最適合放在文中標記 [1]、[2]、[3]、[4] 的哪一個位置？\n> 「仔細看過以後，我觀察到有兩個傾向非常明顯。」\n> (A) [1]\n> (B) [2]\n> (C) [3]\n> (D) [4]\n\n**找出句子位置**\n這是要依照文章的內容架構，判斷句子應該插入哪個位置的題目。題目所給的句子「Going through them, a couple of trends have become very clear to me」表示看過了某些東西之後，Rogerson 先生觀察到有兩個傾向非常明顯，所以應該放在詳細說明這兩個傾向的部分前面。[1] 的下一句「For instance, a number of employees have expressed the desire to take more professional development classes」和「And at the same time, I have noticed that we have had to hire graphic designers on a very regular basis.」提到，舉例來說，很多員工表示希望能上更多專業發展課程，同時也注意到公司往常都必須固定聘請平面設計師。在 [1] 的位置插入句子之後，表示在調查中發現有兩個意見方面的傾向：員工希望上更多專業發展課程、公司往常都必須固定聘請平面設計師，文意前後連貫，所以 (A) [1] 是正確答案。\n\n**單字** go through (phr.) 仔細研究，仔細檢查；trend (n.) 趨勢，傾向\n\n<!-- page 384 -->\n### Questions 161-163 refer to the following announcement.\n161-163 題參照以下公告。\n\n> Hadenfield Elementary School\n> **Weekly Announcements for Parents**\n>\n> This is a reminder that through this Friday, emainder (n.) 剩餘，殘餘，剩餘部分；book fair (phr.) 書展；take place (phr.) 舉行，發生；booklet (n.) 小冊子；mandatory (adj.) 強制的，義務性的，規定的\n\n**161.** 答案 (D)｜難度：中\n*(答案與解析印在次頁 p-385)*\nWhat is NOT stated about the early release schedule?\n- (A) Two school buses will not be running their typical routes.\n- (B) School for the day will be over before 1 p.m.\n- (C) Classes are finishing early because of the holidays.\n- (D) Students may stay for after-school programs all week.\n\n> 關於提早放學的時程，文中沒有提到什[?]麼？\n> (A) 有兩台校車不會照平常的路線行駛。\n> (B) 學校上課時間會在下午 1 點前結束。\n> (C) 因為假期的關係，課程會提早結束。\n> (D) 學生整個禮拜都可以留下來參加課[?]後活動。\n\n**Not/True Not 問題**\n這是需要在文章中找到與關鍵字 the early release schedule 相關的資訊，並且與選項敘述對照的 Not/True 問[?]題。(A) 對應文中的「All school buses will follow their normal routes with the exception of bus numbers 4 and[?] 7.」，表示在所有校車中，4 號和 7 號車將不會依照正常路線行駛，符合選項敘述。(B) 對應文中的「the[?] final class of the day will end three hours early at 12:30 p.m.」，表示最後一堂課將提早 3 小時，在中午 12:30[?] 結束，符合選項敘述。(C) 對應文中的「the school will be operating under an early release schedule as the[?]\n\n<!-- page 385 -->\n（161 續，答案 (D)）\n\nholiday season is fast approaching」，表示因為很快就要休假，所以會提早放學，符合選項敘述。和 (D) 相關的部分是「all after-school programs will be out of session for the remainder of the week」，表示本週接下來幾天，所有課後活動都將停止，不符合選項敘述，所以 (D) Students may stay for after-school programs all week 是正確答案。\n\n**替換表達**\nfollow ~ normal routes 依循正常路線 → running ~ typical routes 行駛平常的路線\n\n**162.** 答案 (A)｜難度：中\nHow can students buy books at the fair?\n- (A) By completing a document beforehand\n- (B) By contacting the teacher in charge\n- (C) By checking off items in a booklet\n- (D) By sending a list to an e-mail address\n\n> 學生要怎樣在書展買書？\n> (A) 事先完成一份文件\n> (B) 聯絡負責的老師\n> (C) 在小冊子裡的物品上打勾\n> (D) 寄清單到一個電子郵件位址\n\n**wh- 問題 How**\n這是問學生要怎樣（How）在書展買書的 wh- 問題。和問題重點 students buy books at the fair 相關的部分是「order forms ~ that must be filled out prior to submission if a student wishes to make a purchase」，表示如果學生要買書的話，必須先填好訂購單再提出，所以 (A) By completing a document beforehand 是正確答案。\n\n**替換表達**\n
