ently (adv.) 永久地；security (n.) 安全，保全；policy (n.) 政策，方針；inactive account (phr.) 靜止帳戶；checking account (phr.) 支票存款帳戶；expire (v.) 到期，期滿；branch (n.) 分行，樹枝；verify (v.) 核對，證實；identity (n.) 身分，個性\n\n**164.** 答案 (C)｜難度：[?] 🆕\nAt 9:13 a.m., what does Ms. Gonyer mean when she writes, \"That's the problem\"?\n- (A) She is unable to use an online payment system.\n- (B) She cannot remember her account balance.\n- (C) She does not have access to some information.\n- (D) She discovered an issue with one of her transactions.\n\n> 在上午 9:13，Gonyer 小姐說的「That's the problem.」是什麼意思？\n> (A) 她無法使用網路付款系統。\n> (B) 她不記得她的帳戶餘額。\n> (C) 她無法取得某個資訊。\n> (D) 她發現她的一筆交易有問題。\n\n**掌握意圖**\n題目問 Gonyer 小姐的意思，所以要掌握引用部分（That's the problem.）上下文的情境。Gonyer 小姐被問到「May I have the number on your ATM card?」，表示需要她的 ATM 卡號，而她回答「That's the problem.」（那就是問題所在），又說「I didn't keep my ATM card because I didn't think I'd need it.」，表示她沒留著卡片，因為當時以為以後不需要了，由此可知 Gonyer 小姐無法得知關於 ATM 卡的資訊，所以 (C) She does not have access to some information 是正確答案。\n\n**單字** balance (n.) 帳戶餘額，結餘；have access to (phr.) 能夠接近、取得…；transaction (n.) 交易，辦理\n\n**165.** 答案 (B)｜難度：[?]\nWhat is suggested about Ms. Gonyer?\n- (A) She held two accounts with RMP Financial Trust.\n- (B) She has been abroad for at least two years.\n- (C) She returned an ATM card to her bank at home.\n- (D) She would like to set up online banking.\n\n> 關於 Gonyer 小姐，文中顯示什麼？\n> (A) 她在 RMP 金融信託有過兩個帳戶。\n> (B) 她在國外待了至少兩年。\n> (C) 她把 ATM 卡還給了母國的銀行。\n> (D) 她想要開立網路銀行帳戶。\n\n**推論 細節資訊**\n這是關於題目關鍵字 Ms. Gonyer 的推論問題。Gonyer 小姐說「I stopped using it when I moved overseas」，表示她搬到國外的時候就不再使用銀行帳戶，之後又說「the last time I used it must have been over two years ago」，表示最後一次用這個帳戶應該是兩年多以前，可以推知 Gonyer 小姐應該在國外待了至少兩年，所以 (B) She has been abroad for at least two years 是正確答案。\n\n**替換表達**\noverseas 在國外 → abroad 在國外\n\n**單字** hold (v.) 擁有，握著\n\n**166.** 答案 (C)｜難度：[?]\nWhat does Ms. Gonyer want to do?\n- (A) Create an account to use overseas\n- (B) Apply for a five-year credit card\n- (C) Open a checking account\n- (D) Withdraw funds from abroad\n\n> Gonyer 小姐想要做什麼？\n> (A) 開一個在國外使用的帳戶\n> (B) 申請一張期限五年的信用卡\n> (C) 開立支票帳戶\n> (D) 在國外提款\n\n**wh- 問題 What**\n這是問 Gonyer 小姐想要做什麼（What）的 wh- 問題。和問題重點 Ms. Gonyer want to do 相關的部分是「Well, you could open a new account, one that doesn't expire for five years. Or you could open another checking account.」，客服問想要開可以保持五年有效的帳戶，還是再開一個支票帳戶，而 Gonyer 小姐回答「I would prefer the latter.」，表示她想要開支票帳戶，所以 (C) Open a checking account 是正確答案。\n\n<!-- page 388 -->\n\n**167.** 答案 (B)｜難度：低\nAccording to Mr. Fournier, what must Ms. Gonyer do to open a new account?\n- (A) Speak to a teller over the phone\n- (B) Go to a financial institution personally\n- (C) Supply two pieces of identification\n- (D) Provide an ATM card number\n\n> 根據 Fournier 先生的說法，Gonyer 小姐必須做什麼才能開新帳戶？\n> (A) 和銀行行員講電話\n> (B) 親自去金融機構\n> (C) 提供兩種身分證明\n> (D) 提供 ATM 卡號\n\n**wh- 問題 What**\n這是問根據 Fournier 先生的說法，Gonyer 小姐必須做什麼（What）才能開新帳戶的 wh- 問題。和問題重點 Ms. Gonyer do to open a new account 相關的部分是 Gonyer 小姐所說的「Can I do that online? Or should I call someone from my branch and have them open one for me over the phone?」，她問是否能在網路上開新帳戶，或者能否打電話給分行辦理，而 Fournier 先生回答「I'm sorry, but they will need to verify your identity, and you have to be there for that.」，表示因為行員必須核對身分，所以她必須在場辦理，(B) Go to a financial institution personally 是正確答案。\n\n**單字** teller (n.)（銀行）出納員；identification (n.) 身分證明，識別\n\n<!-- page 389 -->\n\n### Questions 168-171 refer to the following notice.\n168-171 題參照以下通知。\n\n> **STRYKER AMUSEMENT PARK**\n>\n> October is just around the corner, and that means [171-B]everyone at Stryker Amusement Park is gearing up for a month of spooky Halloween fun. [168]Starting October 1 and continuing until October 31, [168]/[170-C]we will be holding our annual Fright Nights, a series of frighteningly fun activities for visitors of all ages. Below is a schedule of some of the events we have planned.\n\n| Date | Activity | Location |\n| --- | --- | --- |\n| October 1-31 | Haunted Mansion Tour | North Pavilion |\n| October 10-31 | [171-B]Evil Zombies Ride | East Pavilion |\n| October 15-31 | [171-C]Corn Maze | South Parking Lot |\n| October 25-31 | [169]Children's Zone | Food Court |\n\n> Be sure to check out the following highlights:\n> - The Haunted Mansion Tour returns for its third run here at Stryker Amusement Park. [170-B]*California Living* magazine recently ranked the mansion, which features three floors and over 100 actors, as \"the third scariest haunted house on the West Coast.\"\n> - [169]The Children's Zone features plenty of fun activities for small children, including face painting, storytelling, and pumpkin decorating.\n> - On October 31, the last day of Fright Nights, [171-A]actor Kayla Draper from the movie *Darkness Rises* will be signing autographs in the main pavilion.\n> - [171-D]Concession stands throughout the park will be serving our Fright Nights foods, including pumpkin spice coffee and candy apples.\n>\n> [170-D]Admission to Fright Nights is included with a regular ticket. For more information on these events, visit our Web site at www.strykeramusement.com/frightnights.\n\n**翻譯**\n\n> **STRYKER 遊樂園**\n>\n> 十月即將到來，這也表示 [171-B]Stryker 遊樂園的所有人正在為長達一個月、既恐怖又有趣的萬聖節活動做準備。[168]從 10 月 1 日開始，一直到 10 月 31 日為止，[168]/[170-C]我們將舉辦每年例行的 Fright Nights，這是一系列為所有年齡層遊客所準備、既嚇人又好玩的活動。以下是我們規畫的一部分活動的日程表。\n\n| 日期 | 活動 | 地點 |\n| --- | --- | --- |\n| 10 月 1-31 日 | 鬼屋遊歷 | 北館 |\n| 10 月 10-31 日 | [171-B]邪惡殭屍飛車 | 東館 |\n| 10 月 15-31 日 | [171-C]玉米田迷宮 | 南停車場 |\n| 10 月 25-31 日 | [169]兒童特區 | 美食廣場 |\n\n> 請務必看看以下亮點：\n> - 「鬼屋遊歷」將在 Stryker 遊樂園第三度舉行。[170-B]《California Living》雜誌最近將這座三層樓、演出者超過 100 人的鬼屋評為「西岸第三恐怖的鬼屋」。\n> - [169]「兒童特區」有許多為小朋友準備的有趣活動，包括臉部彩繪、說故事和裝飾南瓜。\n> - 在 10 月 31 日，Fright Nights 的最後一天，[171-A]電影《Darkness Rises》的演員 Kayla Draper 將在本館進行簽名活動。\n> - [171-D]整座園區的小吃吧都將供應 Fright Nights 特製飲食，包括南瓜咖啡和蘋果糖。\n>\n> [170-D]Fright Nights 入場費包含在普通門票內。請上我們的網站 www.strykeramusement.com/frightnights 查看更多關於這些活動的資訊。\n\n**單字** around the corner (phr.) 即將來臨；gear up for (phr.) 為…做準備；frighteningly (adv.) 嚇人地；mansion (n.) 別墅，大宅；pavilion (n.) 亭子，裝飾性的建築物，臨時展館；maze (n.) 迷宮，錯綜複雜；highlight (n.) 最突出的部分，畫中最明亮的部分；(v.) 強調…；rank (v.) 排名，評級；(n.) 等級；autograph (n.)（親筆）簽名；(v.) 簽名；concession stand (phr.)（賣簡便餐點的）小吃吧；admission (n.) 入場費，入場，准許進入\n\n<!-- page 390 -->\n\n**168.** 答案 (C)｜難度：低\nWhat is the notice mainly about?\n- (A) Renovations to a haunted house\n- (B) A special sale on tickets\n- (C) A month of festivities\n- (D) Amusement park admissions policies\n\n> 這則通知主要是關於什麼？\n> (A) 鬼屋翻修\n> (B) 票價優惠\n> (C) 一個月的慶祝活動\n> (D) 遊樂園的入場政策\n\n**尋找主題／目的 文章的主題**\n這是問通知主要是關於什麼的尋找主題問題，所以要特別注意文章開頭的部分。「Starting October 1 and continuing until October 31, we will be holding our annual Fright Nights, a series of ~ activities for visitors of all ages.」提到會從 10 月 1 日到 10 月 31 日舉辦每年例行的 Fright Nights，這是一系列為所有年齡層遊客所準備的活動，而之後的部分說明 Fright Nights 的活動日程和活動亮點，所以 (C) A month of festivities 是正確答案。\n\n**169.** 答案 (D)｜難度：中\nWhere will the pumpkin decorating take place?\n- (A) At the north pavilion\n- (B) At the east pavilion\n- (C) At the south parking lot\n- (D) At the food court\n\n> 裝飾南瓜會在哪裡進行？\n> (A) 在北館\n> (B) 在東館\n> (C) 在南停車場\n> (D) 在美食廣場\n\n**wh- 問題 Where**\n這是問裝飾南瓜會在哪裡（Where）進行的 wh- 問題。和問題重點 the pumpkin decorating take place 相關的部分是「The Children's Zone features ~ and pumpkin decorating.」，表示裝飾南瓜是「兒童特區」的一部分，而表格中的「Children's Zone」、「Food Court」顯示「兒童特區」在美食廣場舉行，所以 (D) At the food court 是正確答案。\n\n**170.** 答案 (B)｜難度：高\nWhat is indicated about Fright Nights?\n- (A) It tours around the country.\n- (B) One of its features has been recognized by a publication.\n- (C) It is geared mainly towards adults.\n- (D) Those who attend it must pay an extra admission fee.\n\n> 關於 Fright Nights，文中提到什麼？\n> (A) 在全國巡迴進行。\n> (B) 其中一個特色內容受到一份刊物讚揚。\n> (C) 主要是為成人準備的。\n> (D) 參加者必須付額外的入場費用。\n\n**Not/True True 問題**\n這是需要在文章中找到與關鍵字 Fright Nights 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A) 在[?]文中沒有提到。(B) 對應文中的「*California Living* magazine recently ranked the mansion ~ as \"the third scariest haunted house on the West Coast\"」，表示《California Living》雜誌將鬼屋評選為「西岸第三恐怖的鬼屋」，符合選項敘述，所以 (B) One of its features has been recognized by a publication 是正確答案。和 (C) 相關的部分是「we will be holding our annual Fright Nights, a series of frighteningly fun activities for visitors of all ages」，表示即將舉行的年度例行活動 Fright Nights 是一系列為所有年齡層遊客所準備的活動，不符合選項敘述。和 (D) 相關的部分是「Admission to Fright Nights is included with a regular ticket.」，表示 Fright Nights 入場費包含在普通門票內，不符合選項敘述。\n\n**單字** feature (n.) 特徵，特色；gear A towards B (phr.) 為了配合 B 而準備 A；fee (n.) 費用，手續費\n\n<!-- page 391 -->\n\n**171.** 答案 (A)｜難度：中\nWhat will NOT happen during the month of October?\n- (A) A special screening of *Darkness Rises* will occur.\n- (B) Halloween-themed rides will open to the public.\n- (C) A parking lot will be converted into a maze.\n- (D) Special refreshments will be available to purchase.\n\n> 在十月不會發生什麼事？\n> (A) 《Darkness Rises》進行特別上映。\n> (B) 萬聖節主題的（可搭乘的）遊樂設施將對大眾開放。\n> (C) 停車場會變成迷宮。\n> (D) 特製點心飲料可供購買。\n\n**Not/True** Not 問題\n這是需要在文章中找到與關鍵字 happen during the month of October 相關的資訊，並且與選項敘述對照的 Not/True 問題。和 (A) 相關的部分是「actor Kayla Draper from the movie *Darkness Rises* will be signing autographs」，表示電影《Darkness Rises》的演員 Kayla Draper 會進行簽名活動，但沒有提到會進行電影上映，不符合選項敘述，所以 (A) A special screening of *Darkness Rises* will occur 是正確答案。(B) 對應文中的「everyone at Stryker Amusement Park is gearing up for a month of spooky Halloween fun」，表示遊樂園的所有人正在為長達一個月的萬聖節活動做準備，而表格中的「Evil Zombies Ride, East Pavilion」顯示東館有「邪惡殭屍飛車」，符合選項敘述。(C) 對應文中的「Corn Maze, South Parking Lot」，表示停車場會有玉米田迷宮，符合選項敘述。(D) 對應文中的「Concession stands ~ will be serving our Fright Nights foods, including pumpkin spice coffee and candy apples.」，表示小吃吧都將供應 Fright Nights 特製飲食，包括南瓜咖啡和蘋果糖，符合選項敘述。\n\n**替換表達**\nEvil Zombies Ride 邪惡殭屍飛車 → Halloween-themed rides 萬聖節主題的遊樂設施\ncoffee and candy apples 咖啡和蘋果糖 → refreshments 點心飲料\n\n**單字** screening (n.) 放映，篩選；themed (adj.) 某個主題的；convert (v.) 轉變，轉換\n\n<!-- page 392 -->\n\n### Questions 172-175 refer to the following article.\n172-175 題參照以下報導。\n\n> **Edmond Estrada Wins Albuquerque Judge's Seat**\n>\n> March 18—[172]A spokesperson for the Albuquerque District Court announced that Attorney Edmond Estrada has won his bid for the judge's seat. — [1] —. He will replace [173-A]current Judge Wendy Delwes, who confirmed earlier this year that she is retiring at the end of March.\n>\n> [174-D]In his role as an attorney for the past 25 years, [175]Mr. Estrada has been involved in thousands of legal cases. These included both civil complaints and landlord-tenant cases. — [2] —.\n>\n> \"It has been my privilege to serve the citizens of Albuquerque in my capacity as a lawyer,\" said Estrada, \"and to have witnessed the capable leadership exhibited by Judge Delwes for many years. [173-C]Through her example, I have learned a great deal about how our courts work best for the people of Albuquerque. — [3] —. Indeed, I feel honored to be succeeding her.\"\n>\n> In addition to his legal experience, [174-C]Mr. Estrada is active in the local community. — [4] —. [174-B]According to Mr. Estrada's biography, he is a member of the Rio Rancho Land Commission and has volunteered with numerous local charities.\n\n**翻譯**\n> **Edmond Estrada 獲得阿布奎基的法官職位**\n>\n> 3 月 18 日—[172]阿布奎基地方法院發言人宣布，Edmond Estrada 律師獲得了法官職位。— [1] —。他將取代 [173-A]現任法官 Wendy Delwes，今年初 Wendy Delwes 已經證實自己將於三月底退休。\n>\n> [174-D]在擔任律師的過去 25 年，[175]Estrada 先生經手數千件法律訴訟，這些案件包括民事訴訟與房地租賃關係訴訟。— [2] —。\n>\n> Estrada 表示：「我很榮幸在過去以律師的身分為阿布奎基市民服務，並且見證 Delwes 法官多年來展現的領導才能。[173-C]以她作為榜樣，我學到許多讓法院為阿布奎基民眾發揮最佳效能的方法。— [3] —。能夠接下她的位子，我真的感到很光榮。」\n>\n> 除了法律經歷以外，[174-C]Estrada 先生在地方社會也很活躍。— [4] —。[174-B]根據 Estrada 先生的傳記，他是里奧蘭丘土地委員會成員，也擔任許多地方慈善機構的義工。\n\n**單字** spokesperson (n.) 發言人；bid (n.) 努力，出價；landlord (n.) 房東，地主；in one's capacity as (phr.) 以擔任…的身分；witness (v.) 見證，目擊；(n.) 證人，目擊者；a great deal (phr.) 很多，大量；commission (n.) 委員會，手續費；court (n.) 法院；confirm (v.) 證實，確認；tenant (n.) 房客，佃戶；succeed (v.) 接替，接續，成功；charity (n.) 慈善團體，慈善；attorney (n.) 出庭律師，法定代理人；civil complaint (phr.) 民事起訴；privilege (n.) 特權，殊榮；capable (adj.) 有能力的，能幹的；active (adj.) 活躍的，積極的\n\n<!-- page 393 -->\n\n**172.** 答案 (C)｜難度：中\nWhat does the article mainly discuss?\n- (A) A judge's career accomplishments\n- (B) The results of a mayoral election\n- (C) A lawyer's selection for a role\n- (D) The activities of an organization\n\n> 這則報導主要談論什麼？\n> (A) 一名法官的生涯成就\n> (B) 市長選舉的結果\n> (C) 一名律師獲選擔任某個角色\n> (D) 一個組織的活動\n\n**尋找主題／目的** 文章的主題\n這是問報導主要談論什麼的尋找主題問題，所以要特別注意文章開頭的部分。「A spokesperson for the Albuquerque District Court announced that Attorney Edmond Estrada has won his bid for the judge's seat.」提到，阿布奎基地方法院發言人宣布 Edmond Estrada 律師獲得了法官職位，所以 (C) A lawyer's selection for a role 是正確答案。\n\n**替換表達**\nAttorney 律師 → lawyer 律師\njudge's seat 法官的位子 → a role 角色\n\n**單字** accomplishment (n.) 成就，完成；mayoral (adj.) 市長的；election (n.) 選舉，當選\n\n**173.** 答案 (C)｜難度：中\nWhat is indicated about Ms. Delwes?\n- (A) She is being transferred to another city.\n- (B) She taught law courses for many years.\n- (C) She influenced Mr. Estrada's legal career.\n- (D) She is running for a seat on the senate.\n\n> 關於 Delwes 小姐，文中提到什麼？\n> (A) 她將會被調到別的城市。\n> (B) 她教法律課程教了很多年。\n> (C) 她對 Estrada 先生的法律生涯產生了影響。\n> (D) 她在角逐參議院的議席。\n\n**Not/True** True 問題\n這是需要在文章中找到與關鍵字 Ms. Delwes 相關的資訊，並且與選項敘述對照的 Not/True 問題。和 (A) 相關的部分是「current Judge Wendy Delwes, ~ is retiring at the end of March」，表示現任法官 Wendy Delwes 三月要退休，不符合選項敘述。(B) 在文中沒有提到。(C) 對應文中的「Through her example, I have learned a great deal about how our courts work best for the people of Albuquerque.」，表示 Estrada 先生以 Delwes 小姐作為榜樣，學到許多讓法院為阿布奎基民眾發揮最佳效用的方法，符合選項敘述，所以 (C) She influenced Mr. Estrada's legal career 是正確答案。(D) 在文中沒有提到。\n\n<!-- page 394 -->\n\n**174.** 答案 (A)｜難度：中\nWhat is NOT mentioned about Mr. Estrada?\n- (A) He represents a real estate company.\n- (B) He sometimes engages in unpaid work.\n- (C) He is frequently involved in the community.\n- (D) He has practiced law for over two decades.\n\n> 關於 Estrada 先生，文中沒有提到什麼？\n> (A) 他代表一間不動產公司。\n> (B) 他有時候從事無薪工作。\n> (C) 他經常參與社區事務。\n> (D) 他當律師超過 20 年了。\n\n**Not/True** Not 問題\n這是需要在文章中找到與關鍵字 Mr. Estrada 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A) 在文中沒有提到，所以 (A) He represents a real estate company 是正確答案。(B) 對應文中的「According to Mr. Estrada's biography, he ~ has volunteered with numerous local charities.」，表示 Estrada 先生擔任許多地方慈善機構的義工，符合選項敘述。(C) 對應文中的「Mr. Estrada is active in the local community」，表示 Estrada 先生在地方社會很活躍，符合選項敘述。(D) 對應文中的「In his role as an attorney for the past 25 years」，表示 Estrada 先生過去 25 年擔任律師，符合選項敘述。\n\n**替換表達**\nhas volunteered 做志願服務 → engages in unpaid work 從事無薪工作\nis active in the local community 在地方社會很活躍 → is frequently involved in the community 經常參與社區事務\n\n**單字** represent (v.) 代表；real estate (phr.) 不動產；engage (v.) 從事，參加；practice law (phr.) 擔任律師執業\n\n**175.** 🆕 答案 (B)｜難度：最高\nIn which of the positions marked [1], [2], [3], and [4] does the following sentence best belong?\n\"And in every legal matter he has handled, he has shown a firm commitment to the pursuit of justice.\"\n- (A) [1]\n- (B) [2]\n- (C) [3]\n- (D) [4]\n\n> 以下這個句子最適合放在文中標記 [1]、[2]、[3]、[4] 的哪一個位置？\n> 「而且在每個他所處理的法律案件中，他都展現出對於追求正義不變的奉獻。」\n> (A) [1]\n> (B) [2]\n> (C) [3]\n> (D) [4]\n\n**找出句子位置**\n這是要依照文章的內容架構，判斷句子應該插入哪個位置的題目。題目所給的句子「And in every legal matter he has handled, he has shown a firm commitment to the pursuit of justice」表示他（Estrada 先生）除了這樣以外，也在每個法律案件中表現他持續追求正義的努力，所以應該接在和他處理法律案件相關的內容後面。[2] 的上一句「Mr. Estrada has been involved in thousands of legal cases. These included both civil complaints and landlord-tenant cases.」提到，Estrada 先生經手數千件法律訴訟，其中包括民事訴訟與房地租賃關係訴訟。在 [2] 的位置插入句子之後，表示 Estrada 對上述案件的處理所展現的努力，文意前後連貫，所以 (B) [2] 是正確答案。\n\n<!-- page 395 -->\n\n### Questions 176-180 refer to the following Web page and e-mail.\n176-180 題參照以下網頁與電子郵件。\n\n**文章 1**\n> www.lakegodardskiresort.com/about\n>\n> LAKE GODARD SKI RESORT\n>\n> **ABOUT** | TICKETS & PROGRAMS | ACCOMMODATIONS | PHOTOS\n>\n> Attracting over 10,000 visitors and hosting numerous conventions each year, Lake Godard is one of the most popular winter resort destinations in the United States.\n>\n> Our slopes are among the most varied in the region. We have beginners' routes and challenging hills for experts. [176-B]Our automatic ski lifts ensure you never have to wait long to reach your preferred slope, and our attendants are always on hand in case you encounter any problems.\n>\n> But there's more to Lake Godard than just skiing. Our lodge offers a variety of activities. [176-A/C]Enjoy games in our recreation room, massages at our spa, and guided hikes through the woods. If you are interested in exploring the city outside of the resort, our staff would be glad to help you reserve tickets or recommend local attractions. Single units start at $129 per night, while [178]our popular deluxe rooms, which look out over the scenic slopes of Bear Mountain, start at $149 per night. Plus, [179]every stay of seven days or more entitles guests to free daily lessons from a professional skiing instructor.\n>\n> If you are interested in spending your winter vacation with us, call 555-3612, or send an e-mail to booking@lakegodardski.com.\n\n**翻譯**\n> www.lakegodardskiresort.com/about\n>\n> LAKE GODARD 滑雪度假村\n>\n> 關於 | 門票與方案 | 住宿 | 照片\n>\n> Lake Godard 每年吸引超過 10,000 名遊客並主辦多場會議，是美國最受歡迎的冬季度假勝地之一。\n>\n> 我們滑雪道的多樣程度是地區內數一數二的。我們有初學者路線和專家用的高難度山坡。[176-B]我們的自動滑雪場纜車能確保您絕對不用等很久，就能抵達想去的滑雪道，而我們的服務員隨時在場，以備您遇到問題時可以處理。\n>\n> 但 Lake Godard 除了滑雪以外還有更多。我們的小屋提供多樣的活動。[176-A/C]請享受我們娛樂室的遊戲、spa 的按摩，還有嚮導帶領的林中健行。如果您有興趣探索度假村外的城市，我們的工作人員很樂意幫您預約門票或推薦當地景點。每間客房每晚 129 美元起，而 [178]我們很受歡迎、可以眺望窗外 Bear 山美麗山坡的豪華房是每晚 149 美元起。另外，[179]每次住宿 7 天以上的來賓可享有專業滑雪教練的免費每日課程。\n>\n> 如果您有興趣和我們共同度過冬季假期，請撥打 555-3612，或寄電子郵件至 booking@lakegodardski.com。\n\n**文章 2**\n> TO: Lake Godard Booking <booking@lakegodardski.com>\n> FROM: Anna Fuller <annafuller@fastmail.com>\n> SUBJECT: Booking\n> DATE: November 24\n>\n> To Whom It May Concern,\n>\n> I have visited the Lake Godard area before, but have never stayed at your establishment. I plan to travel there with my husband and two daughters for the holidays. I understand that this season has been particularly busy, so [179]I was wondering if you still had a room available for December 20-29. I contacted several other hotels in the region, but they were fully booked.\n>\n> If so, [178]I'd like to reserve one of the deluxe rooms mentioned on your Web site. Also, [179]my daughters have never skied before, so I'd like them to take classes. Lastly, [180]can you recommend any local productions that we could catch while we are there? We would prefer something like a magic show or a light musical play.\n>\n> Best regards,\n>\n> Anna Fuller\n\n**翻譯**\n> 收件者：Lake Godard 預訂 <booking@lakegodardski.com>\n> 寄件者：Anna Fuller <annafuller@fastmail.com>\n> 主旨：預訂\n> 日期：11 月 24 日\n>\n> 敬啟者：\n>\n> 我以前去過 Godard 湖地區，但沒有住過你們的設施。我打算在假期的時候跟我丈夫和兩個女兒去那邊旅行。我明白這個季節特別忙，所以 [179]我想知道你們還有沒有 12 月 20-29 日的空房。我聯絡了這個地區的其他幾家飯店，但他們訂房都滿了。\n>\n> 如果還有空房的話，[178]我想預訂一間你們網站上提到的豪華房。還有，[179]我女兒以前沒滑過雪，所以我希望她們上課。最後，[180]你們可以推薦我們在那邊的時候可以看到的當地演出嗎？我們比較希望像是魔術表演或輕音樂劇之類的。\n>\n> Anna Fuller\n\n<!-- page 396 -->\n\n**單字** 文章 1：attract (v.) 吸引；host (v.) 主辦；(n.) 主人；convention (n.) 大會，慣例；automatic (adj.) 自動的；attendant (n.) 服務員，隨侍者；encounter (v.) 遭遇，遇到；lodge (n.) 小屋，旅舍；recreation room (phr.) 娛樂室；attraction (n.) 景點，吸引力；deluxe (adj.) 豪華的，高級的；(adv.) 豪華地；scenic (adj.) 風景優美的；entitle (v.) 給…資格，為…\n文章 2：establishment (n.) 設施，機構；production (n.)（戲劇等的）演出，製作，生產；musical play (phr.) 音樂劇\n\n**176.** 答案 (D)｜難度：低\nWhat is NOT mentioned as a service offered by Lake Godard?\n- (A) Tours of the nearby wilderness\n- (B) Transportation to the tops of slopes\n- (C) Activities in a game room\n- (D) Training for professional skiers\n\n> 文中沒有提到什麼是 Lake Godard 提供的服務？\n> (A) 附近荒野的導覽\n> (B) 到滑雪道頂部的運輸工具\n> (C) 遊戲室的活動\n> (D) 為專業滑雪者提供的訓練\n\n**Not/True** Not 問題\n這是需要找到與關鍵字 a service offered by Lake Godard 相關的資訊，並且與選項敘述對照的 Not/True 問題，所以要看介紹 Lake Godard 度假村服務內容的網頁（第一篇文章）。(A) 和 (C) 對應文中的「Enjoy games in our recreation room ~ and guided hikes through the woods.」，表示可以享受娛樂室的遊戲以及嚮導帶領的林中健行，符合選項敘述。(B) 對應文中的「Our automatic ski lifts ensure you never have to walk far to reach your preferred slope」，表示有自動的滑雪場纜車可以到達想去的滑雪道，符合選項敘述。(D) 在文中沒有提到，所以 (D) Training for professional skiers 是正確答案。\n\n**單字** nearby (adj.) 附近的；(adv.) 在附近；wilderness (n.) 荒野；transportation (n.) 運輸，運輸工具\n\n**177.** 答案 (C)｜難度：中\nIn the Web page, the phrase \"on hand\" in paragraph 2, line 3, is closest in meaning to\n- (A) vacant\n- (B) possible\n- (C) within reach\n- (D) on behalf\n\n> 網頁第 2 段第 3 行的「on hand」意思最接近\n> (A) 空著的\n> (B) 可能的\n> (C) 在近處的\n> (D) 代表\n\n**同義詞**\n在網頁（第一篇文章）中，on hand 在「our attendants are always on hand in case you encounter any problems」這個句子裡的意思是「在場」，所以表示「伸手可及的，在近處的」的 (C) within reach 是正確答案。\n\n**178.** 答案 (C)｜難度：高\nWhat is suggested about Ms. Fuller?\n- (A) She wants to change a reservation.\n- (B) She will cancel a booking at another hotel.\n- (C) She prefers accommodations with a mountain view.\n- (D) She would like recommendations on which slopes to ski.\n\n> 關於 Fuller 小姐，文中顯示什麼？\n> (A) 她想改變預約。\n> (B) 她會取消另一間飯店的訂房。\n> (C) 她偏好有山景的住處。\n> (D) 她想得到該在哪個滑雪道滑雪的建議。\n\n**推論** 多篇文章綜合題\n這是必須參考兩篇文章內容的多篇文章綜合題，所以先看題目關鍵字 Fuller 小姐所寫的電子郵件（第二篇文章）。\n第二篇文章中的「I'd like to reserve one of the deluxe rooms mentioned on your Web site」提到，Fuller 小姐想要預約網站上提到的豪華房，這是第一個線索。但是，這裡沒有提到那是怎樣的房間，所以還需要在第一篇文章（網頁）中確認。第一篇文章中的「our popular deluxe rooms, which look out over the scenic slopes\n\n<!-- page 397 -->\n\n提到很受歡迎的豪華房可以看到窗外美麗的山坡，這是第二個線索。\n綜合「Fuller 小姐想要預約豪華房」和「豪華房窗外有 Bear 山美麗的山坡景色」這兩個線索，可以推知 Fuller 小姐偏好有山景的房間，所以 (C) She prefers accommodations with a mountain view 是正確答案。\n\n**179.** 答案 (C)｜難度：最高\nWhat can be inferred about Ms. Fuller's children?\n- (A) They will reserve a guided hike through the woods.\n- (B) They will be missing a few days of school.\n- (C) They can receive free lessons from an expert instructor.\n- (D) They can be involved in a light musical play.\n\n> 關於 Fuller 小姐的小孩，從文中可以推知什麼？\n> (A) 他們會預約嚮導帶領的林中健行。\n> (B) 他們在學校會缺課幾天。\n> (C) 他們可以獲得專業教練的免費課程。\n> (D) 他們可以參加輕音樂劇表演。\n\n**推論** 多篇文章綜合題\n這是必須參考兩篇文章內容的多篇文章綜合題，所以先看提到題目關鍵字 Ms. Fuller's children 相關內容的電子郵件（第二篇文章）。\n第二篇文章中的「I was wondering if you still had a room available for December 20-29」和「my daughters have never skied before, so I'd like them to take classes」提到，Fuller 小姐想知道 12 月 20-29 日還有沒有空房，而且希望沒滑過雪的女兒可以上課，這是第一個線索。但是，這裡沒有提到 Fuller 小姐的女兒可以上的課的詳細資訊，所以還需要在第一篇文章（網頁）中確認。第一篇文章中的「every stay of seven days or more entitles guests to free daily lessons from a professional skiing instructor」提到，每次住宿 7 天以上的來賓可享有專業滑雪教練的免費每日課程，這是第二個線索。\n綜合「Fuller 小姐想預訂 12 月 20-29 日的房間，而且希望女兒可以上課」和「每次住宿 7 天以上可以獲得專業滑雪教練的免費每日課程」這兩個線索，可以推知 Fuller 小姐的女兒可以獲得專業教練的免費課程，所以 (C) They can receive free lessons from an expert instructor 是正確答案。\n\n**替換表達**\nprofessional skiing instructor 專業滑雪教練 → expert instructor 專業教練\n\n**單字** miss (v.) 未出席，錯過；involve (v.) 使涉入，包含\n\n**180.** 答案 (A)｜難度：中\nWhat does Ms. Fuller want to do?\n- (A) Make time to see a performance\n- (B) Book a room she has stayed in previously\n- (C) Obtain a list of local produce to try\n- (D) Receive a detailed skiing lesson plan by e-mail\n\n> Fuller 小姐想要做什麼？\n> (A) 抽空看表演\n> (B) 預訂她之前住過的房間\n> (C) 獲得可以吃吃看的當地農產品清單\n> (D) 收到關於滑雪課詳細計畫的電子郵件\n\n**wh- 問題** What\n這是問 Fuller 小姐想要做什麼（What）的 wh- 問題，所以要看題目關鍵字 Ms. Fuller 所寫的電子郵件（第二篇文章）。「can you recommend any local productions that we could catch while we are there?」的部分問能否推薦在當地可以看到的演出，所以 (A) Make time to see a performance 是正確答案。\n\n**替換表達**\nproductions 演出 → performance 表演\n\n**單字** produce (n.) 農產品；(v.) 生產\n\n<!-- page 398 -->\n\n### Questions 181-185 refer to the following e-mail and notice.\n181-185 題參照以下電子郵件與通知。\n\n**文章 1**\n> To: Angela Porter <a.porter@bigbuy.com>\n> From: Mason Daley <m.daley@bigbuy.com>\n> Subject: Managers' meeting\n> Date: September 21\n> Attachment: meeting_notes\n>\n> Hi Angela,\n>\n> I hope your discussion with the client went well yesterday. [181/185]We missed you at the managers' meeting. To read a summary of everything we covered, please check the notes attached to this e-mail. Otherwise, [181]the main thing you should know concerns work schedules around the upcoming holidays.\n>\n> Mr. Baker wants a notice posted for employees to remind them of their responsibilities in this regard. [182-D]Too many people were absent from work last year during this period, and he would like to make sure this doesn't happen again. He specifically mentioned planning holiday leave in advance, so that departmental supervisors can reassign work hours as needed. [184]The final schedule will be posted on the company Intranet by November 25. This is one day before the start of our [185]busy season, which generally lasts from November 26 to January 4. Mr. Baker added that no late requests for holiday leave will be approved, except in cases of medical or personal emergencies. The notice should be up by the end of this month.\n>\n> Let me know if you have any questions.\n>\n> Thanks,\n> Mason\n> Shift supervisor\n> Operations department\n\n**翻譯**\n> 收件者：Angela Porter <a.porter@bigbuy.com>\n> 寄件者：Mason Daley <m.daley@bigbuy.com>\n> 主旨：經理會議\n> 日期：9 月 21 日\n> 附件：會議_紀錄\n>\n> 嗨 Angela：\n>\n> 我希望你昨天跟客戶的討論進行順利。[181/185]經理會議少了你參加，我們覺得很可惜。請看這封電子郵件所附的會議紀錄，閱讀我們討論的所有事項的摘要。除此之外，[181]你應該知道的主要事情是關於即將到來的假期的工作班表。\n>\n> Baker 先生希望貼出給員工的通知，要提醒他們這方面的責任。[182-D]去年的這個時期太多人缺勤了，他想要確保這個情況不會再發生。他特別提到要預先計畫假期時的休假，讓部門主管可以依照需要重新分配工作時段。[184]最終工作班表會在 11 月 25 日前發布在公司內部網路。這一天是我們[185]忙碌時期開始的前一天，這段期間通常是從 11 月 26 日到 1 月 4 日。Baker 先生補充說不會核准太晚提出的假期休假申請，除了醫療上或個人的緊急情況以外。這則通知要在本月底前公布。\n>\n> 如果你有任何問題請告訴我。\n>\n> 謝謝\n> Mason\n> 排班主管\n> 營運部門\n\n**文章 2**\n> BigBuy\n>\n> Notice to All Employees\n>\n> In preparation for the holiday shopping season, we would like to remind you to take some time to review the work schedule posted on the company Intranet. Aside from checking to make sure that you have been assigned the correct number of hours, please verify that your days off are noted on the schedule.\n>\n> Please submit requests for holiday leave no later than October 30. [183-A]Any requests for time off made from that date until November 25 will be approved only at the discretion of [183-A/C]each department's supervisor, who must balance employee demands with the need to have the store fully staffed.\n\n**翻譯**\n> BigBuy\n>\n> 給全體員工的通知\n>\n> 為了做好連假購物時期的準備，我們想提醒大家花一些時間再次查看發布在公司內部網路的工作班表。除了確認你被分配的工作時數正確以外，也請核對你的休假日是否已經標註在班表上。\n>\n> 請在 10 月 30 日以前提出假期中的休假申請。[183-A]10 月 30 日之後到 11 月 25 日，任何休假申請只有經過各部門主管慎重考慮後才會核准，[183-A/C]他們必須在員工的需求與維持店內人員充足的必要之間取得平衡。\n\n<!-- page 399 -->\n\n> [184]These requests will be responded to before the final schedule is posted. [185]Requests for holiday leave sent from November 26 to January 4 will not be granted to anyone, management included, except in the case of a personal or medical emergency. As always, documentation proving that you are eligible for an emergency leave of absence will be required in such situations.\n>\n> [183-D]If you have any further questions, please consult your respective departmental supervisors. Thank you for your cooperation in this matter.\n\n**翻譯**\n> [184]休假申請將在最終班表貼出前得到回覆。[185]任何人在 11 月 26 日到 1 月 4 日之間提出的假期休假申請都不會獲准，經營團隊也是一樣，除非是個人或醫療方面的緊急狀況。和往常一樣，在這種情況下必須要有證明可申請緊急休假的文件。\n>\n> [183-D]如果還有任何問題，請和各自的部門主管商談。謝謝大家對於這件事的配合。\n\n**單字** 文章 1：cover (v.) 處理，包括，覆蓋；attach (v.) 附加，繫上；concern (v.) 和…有關；(n.) 關心的事，擔心；remind (v.) 提醒，使想起；in this regard (phr.) 在這方面，在這一點；leave (n.) 休假，許可；(v.) 離開，留下；in advance (phr.) 事先，提前；departmental (adj.) 部門的；approve (v.) 批准，贊成\n文章 2：review (v.) 再檢查，評論；aside from (phr.) 除了…以外還有；verify (v.) 核對，證實；time off (phr.) 休假；discretion (n.) 謹慎，斟酌；staff (v.) 配備員工；(n.) 全體員工；grant (v.) 准予；(n.) 補助金；management (n.) 經營團隊，管理階層，管理；cooperation (n.) 合作，協力；eligible (adj.) 有資格的，合適的；respective (adj.) 各自的\n\n**181.** 答案 (C)｜難度：低\nWhy did Mr. Daley write to Ms. Porter?\n- (A) To modify plans for an upcoming holiday\n- (B) To update her on a previous request\n- (C) To fill her in on a recent discussion\n- (D) To discuss a scheduling conflict with her\n\n> Daley 先生為什麼寫信給 Porter 小姐？\n> (A) 為了修改即將到來的假期的計畫\n> (B) 為了告訴她關於先前的申請的最新情況\n> (C) 為了告訴她最近討論的詳細內容\n> (D) 為了跟她討論行程的衝突\n\n**尋找主題／目的** 寫文章的理由\n這是詢問 Daley 先生為什麼寫信給 Porter 小姐的尋找主題問題，所以要看他所寫的電子郵件（第一篇文章）。「We missed you at the managers' meeting.」和「the main thing you should know concerns work schedules around the upcoming holidays」提到，Daley 先生說很可惜收件人 Porter 小姐沒能出席經理會議，而 Porter 小姐應該知道的主要事項是關於即將到來的假期的工作班表，之後的部分則說明詳細的會議內容，所以 (C) To fill her in on a recent discussion 是正確答案。\n\n**替換表達**\nmeeting 會議 → discussion 討論\n\n**單字** update (v.) 告知最新消息，更新；fill A in on B (phr.) 向 A 提供 B 的詳情；conflict (n.) 衝突；(v.) 衝突\n\n**182.** 答案 (D)｜難度：中\nWhat is stated about BigBuy?\n- (A) Its normal operating hours will change in the new year.\n- (B) It pays its employees overtime for holiday work.\n- (C) Its management is preparing for a restructuring.\n- (D) It has had issues concerning absent staff.\n\n> 關於 BigBuy，文中提到什麼？\n> (A) 一般營業時間將在新的一年變更。\n> (B) 支付員工在假期工作的加班費。\n> (C) 經營團隊正準備改組。\n> (D) 有關於缺勤員工的問題。\n\n**Not/True** True 問題\n這是需要在文章中找到與關鍵字 BigBuy 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A)、(B)、(C) 在文中沒有提到。(D) 對應電子郵件（第一篇文章）中的「Too many people were absent from work last year during this period, and he would like to make sure this doesn't happen again.」，表示去年假期期間太多人缺勤，BigBuy 公司的 Baker 先生想要確保這個情況不會再發生，符合選項敘述，所以 (D) It has had issues\n\n<!-- page 400 -->\n\nconcerning absent staff 是正確答案。\n\n**單字** overtime (n.) 加班（費），超時工作；restructuring (n.) 改組，重建\n\n**183.** 答案 (B)｜難度：高\nWhat is NOT mentioned as something department supervisors will do for the holidays?\n- (A) Approve some requests for additional leave\n- (B) Provide training to seasonal employees\n- (C) Ensure there are enough workers\n- (D) Address inquiries from the staff\n\n> 什麼不是文中提到部門主管會在假期時做的事？\n> (A) 批准某些額外的休假申請\n> (B) 為季節性（增聘）的員工提供訓練\n> (C) 確保有足夠的員工\n> (D) 處理員工的詢問\n\n**Not/True** Not 問題\n這是需要在文章中找到與關鍵字 department supervisors will do for the holidays 相關的資訊，並且與選項敘述對照的 Not/True 問題，所以要看提到主管應該做什麼的通知（第二篇文章）。(A) 對應文中的「Any requests for time off made from that date until November 25 will be approved only at the discretion of each department's supervisor」，表示 10 月 30 日之後到 11 月 25 日，任何休假申請只有經過各部門主管慎重考慮後才會核准，符合選項敘述。(B) 在文中沒有提到，所以 (B) Provide training to seasonal employees 是正確答案。(C) 對應文中的「each department's supervisor, who must balance employee demands with the need to have the store fully staffed」，表示部門主管須在員工的需求與維持店內人員充足的必要之間取得平衡，符合選項敘述。(D) 對應文中的「If you have any further questions, please consult your respective departmental supervisors.」，表示如果還有問題就跟各自的部門主管談，符合選項敘述。\n\n**替換表達**\nfully staffed 員工充足的 → there are enough workers 有足夠的員工\nquestions 問題 → inquiries 詢問\n\n**單字** address (v.) 處理，演說；(n.) 地址；inquiry (n.) 詢問，調查\n\n**184.** 答案 (C)｜難度：最高\nWhen can employees expect to receive confirmation of holiday leave?\n- (A) By the end of September\n- (B) No later than October 30\n- (C) Before the 25th of November\n- (D) Between December and January\n\n> 員工可以預期什麼時候收到假期休假的確認信？\n> (A) 9 月底前\n> (B) 最晚 10 月 30 日\n> (C) 11 月 25 日前\n> (D) 12 月和 1 月之間\n\n**wh- 問題** 多篇文章綜合題\n這是必須參考兩篇文章內容的多篇文章綜合題。題目的關鍵部分是 employees ~ receive confirmation of holiday leave，問員工可以預期什麼時候（When）收到假期休假的確認信，所以先看提到休假申請的通知（第二篇文章）。\n第二篇文章中的「These requests will be responded to before the final schedule is posted.」提到，休假申請會在最終班表貼出前得到回覆，這是第一個線索。但是，這裡沒有提到最終班表什麼時候會貼出，所以還需要確認電子郵件（第一篇文章）的內容。第一篇文章中的「The final schedule will be posted ~ by November 25.」提到最終班表會在 11 月 25 日前貼出，這是第二個線索。\n綜合「休假申請會在最終班表貼出前得到回覆」和「最終班表會在 11 月 25 日前貼出」這兩個線索，可以推知休假申請會在 11 月 25 日前得到回覆，所以 (C) Before the 25th of November 是正確答案。\n\n**替換表達**\nreceive confirmation 收到確認信 → be responded to 得到回覆\n\n<!-- page 401 -->\n\n**185.** 答案 (C)｜難度：高\nWhat is Ms. Porter required to do during the upcoming busy season?\n- (A) Post work schedules more frequently\n- (B) Make requests only for short vacations\n- (C) Submit documentation for emergency leave\n- (D) Have meetings with her department supervisors\n\n> 在即將到來的忙碌期，Porter 小姐必須做什麼？\n> (A) 更常貼出工作班表\n> (B) 只申請短期休假\n> (C) 在緊急休假時提出證明文件\n> (D) 和她的部門主管開會\n\n**wh- 問題 多篇文章綜合題**\n這是必須參考兩篇文章內容的多篇文章綜合題。題目的關鍵部分是 Ms. Porter required to do during the upcoming busy season，問 Porter 小姐在即將到來的忙碌期必須做什麼（What），所以先看寄給 Porter 小姐的電子郵件（第一篇文章）。\n\n第一篇文章中的「We missed you at the managers' meeting.」表示 Angela Porter 沒參加經理會議很可惜，可知她是經理級的人員；「busy season, ~ from November 26 to January 4」表示忙碌期是從 11 月 26 日到 1 月 4 日，這些是第一個線索。但是，這裡沒有提到她在忙碌期應該做什麼，所以還需要確認通知（第二篇文章）的內容。第二篇文章中的「Requests for holiday leave sent from November 26 to January 4 will not be granted to anyone, management included, except in the case of a personal or medical emergency. ~ documentation proving that you are eligible for an emergency leave of absence will be required」表示 11 月 26 日到 1 月 4 日提出的假期休假申請都不會獲准，經營團隊也是一樣，除非是個人或醫療方面的緊急狀況，而緊急休假需要證明文件，這是第二個線索。\n\n綜合「Porter 小姐是經理級的人員，忙碌期是從 11 月 26 日到 1 月 4 日」和「11 月 26 日到 1 月 4 日就連經營團隊也只有緊急情況可以請假，而且需要證明文件」這兩個線索，可以推知 Porter 小姐在緊急休假時必須提出證明文件，所以 (C) Submit documentation for emergency leave 是正確答案。\n\n<!-- page 402 -->\n\n### Questions 186-190 refer to the following article, receipt, and e-mail. 🆕\n186-190 題參照以下報導、收據及電子郵件。\n\n**文章 1**\n\n> **Art Vibe Magazine**\n>\n> [186] The remodeling of Brayman Museum of Art (BMA) has finally concluded, and [186/189-D] the facility will reopen on Wednesday, September 26. [186] This will be commemorated by a ceremony taking place on the front lawn of the museum, with a short speech by museum curator Jane Wellington. Ms. Wellington will talk about the progress BMA has made over its 50 years in the city of Auckland. [189-D] She will also introduce the museum's new special exhibition, *France in Focus*, beginning that day, which features artifacts from Europe's ancient Gallic tribes. This traveling exhibition received terrific reviews from French publications when it first opened in Paris, and [189-A] after the show at the BMA, it will go on to Sydney and then Perth. Tickets for the exhibit are $12 and may be reserved in advance at www.braymanart.org. [187] The museum will also be offering the special admission price of $5 for children aged 10 and under instead of its regular $7 for the duration of the exhibit. Inquiries may be directed to BMA's public relations specialist, Henry Kang, at 555-1288.\n\n**翻譯**\n> **《Art Vibe 雜誌》**\n>\n> [186] Brayman 美術館（BMA）的改建終於結束，[186/189-D] 設施將於 9 月 26 日星期三重新開幕。[186] 為慶祝本次重新開幕，美術館前草坪將舉行典禮，館長 Jane Wellington 將簡短致辭。Wellington 小姐將談論 BMA 50 年來在奧克蘭市的發展。[189-D] 她也將介紹美術館新的特展 *France in Focus*，展期於當天開始，其中展出歐洲古代高盧部落的文物。本巡迴展於巴黎首次展出時，獲得一些法國刊物的好評，而 [189-A] 於 BMA 展出後，將繼續巡迴至雪梨，之後是伯斯。展覽票價為 12 美元，可事先於 www.braymanart.org 預訂。[187] 美術館也將於特展期間為 10 歲以下孩童提供特惠入場票價，原本一般票價為 7 美元，特惠票價為 5 美元。有疑問可撥 555-1288 向 BMA 公關專員 Henry Kang 洽詢。\n\n**文章 2**\n\n> Brayman Museum of Art\n> Confirmation of Payment\n>\n> Today's Date: August 17\n> [187] Guest Name: Kerry Rosales\n> Exhibition Description: *France in Focus*\n> Admission Date: September 26\n>\n> | Description | Amount | Unit Price | Total Price |\n> |---|---|---|---|\n> | Regular Ticket | 1 | $12 | $12 |\n> | [187] Special Ticket | 2 | $5 | $10 |\n> | | | TOTAL | $22 |\n>\n> Payment Confirmation Number: 347792R\n>\n> [188] If you've made an advance purchase, please be sure to present this receipt to the museum official collecting tickets when entering the exhibition. Admission will be allowed daily between the hours of 8 a.m. and 3 p.m.\n\n**翻譯**\n> Brayman 美術館\n> 付款確認信\n>\n> 今天日期：8 月 17 日\n> [187] 來賓姓名：Kerry Rosales\n> 展覽名稱：*France in Focus*\n> 入場日期：9 月 26 日\n>\n> | 品名 | 數量 | 單價 | 合計 |\n> |---|---|---|---|\n> | 普通票 | 1 | 12 美元 | 12 美元 |\n> | [187] 特惠票 | 2 | 5 美元 | 10 美元 |\n> | | | 總計 | 22 美元 |\n>\n> 付款確認號碼：347792R\n>\n> [188] 若您已預購門票，請務必於進入展場時向美術館門票收取人員出示本收據。開放入場時間為每日上午 8 時至下午 3 時。\n\n**文章 3**\n\n> To: Henry Kang <h_kang@braymanart.org>\n> From: Jane Wellington <j_wellington@braymanart.org>\n> [189-B] Date: September 10\n> Subject: Important change\n>\n> Hi Henry,\n>\n> I've got an urgent request. Unfortunately, [189-B] I received a call this morning, and there will be a delay with the *France in Focus* exhibition. Some of the artifacts have been held up at customs. Apparently, the agents must see further\n\n**翻譯**\n> 收件者：Henry Kang <h_kang@braymanart.org>\n> 寄件者：Jane Wellington <j_wellington@braymanart.org>\n> [189-B] 日期：9 月 10 日\n> 主旨：重要的變更\n>\n> 嗨 Henry：\n>\n> 我有個緊急的請求。很遺憾，[189-B] 我今天早上接到電話，說 *France in Focus*\n\n<!-- page 403 -->\n\n> documentation before they can release the items to us. We're getting the necessary paperwork, but it won't be processed in time for the show. [189-D] The items should start arriving here at the museum the day after our exhibition is scheduled to open. Accordingly, [190] the opening must be delayed by at least two weeks. I'll need you to contact those who purchased exhibition tickets in advance. Assure them that they may use the same tickets to gain admission on the new opening date but that [190] they also have the option of getting their money back.\n>\n> Let me know if you have questions.\n>\n> [189-B] Jane Wellington\n> Brayman Museum of Art, Curator\n\n**翻譯**\n> 展將會延後。某些文物被海關攔了下來。海關官員似乎必須要看更多證明文件才能放行這些物品給我們。我們正在進行必要的書面作業，但文件處理趕不上展覽日程。[189-D] 這些物品會從預定開展日期的隔天開始（陸續）抵達。所以，[190] 開幕必須延後至少兩週。我需要你聯絡已經預先購買展覽門票的人。你要向他們保證可以在新的開幕日期使用同樣的門票，但 [190] 也可以選擇退錢。\n>\n> 如果有問題請告訴我。\n>\n> [189-B] Jane Wellington\n> Brayman 美術館，館長\n\n**單字**\n文章 1：conclude (v.) 結束，下結論；commemorate (v.) 慶祝，紀念；lawn (n.) 草坪；artifact (n.) （有歷史或文化價值的）人工製品，文物；tribe (n.) 部落，部族；terrific (adj.) 非常好的，極度的；publication (n.) 出版物，出版，發行；admission (n.) 入場，進入許可；duration (n.) 持續，持續期間；public relation (phr.) 公共關係，公關\n文章 2：confirmation (n.) 確認，證實；description (n.) 敘述，說明；advance purchase (phr.) 預購；official (n.) 官員，公務員；(adj.) 正式的\n文章 3：urgent (adj.) 緊急的，急迫的；hold up (phr.) 攔住，延誤；customs (n.) 海關，關稅；apparently (adv.) 似乎，顯然；documentation (n.) 證明文件，使用說明；paperwork (n.) 書面作業，文書工作；process (v.) 處理；(n.) 過程，處理；in time (phr.) 及時，準時；assure (v.) 保證，使確信，保障\n\n**186.** 答案 (C)｜難度：中\nWhat is the main topic of the article?\n- (A) The appointment of a new curator\n- (B) An anniversary banquet celebrating a facility's opening\n- (C) A special event following a renovation\n- (D) The exhibition of work by a local artist\n\n> 報導主要的主題是什麼？\n> (A) 新館長的任命\n> (B) 慶祝設施開幕的週年宴會\n> (C) 整修後的特別活動\n> (D) 一位地方藝術家的作品展覽\n\n**尋找主題／目的 文章的主題**\n這是問報導主題的尋找主題問題，所以要看報導（第一篇文章）的內容。「The remodeling of Brayman Museum of Art (BMA) has finally concluded, and the facility will reopen」和「This will be commemorated by a ceremony taking place on the front lawn of the museum」提到 Brayman 美術館（BMA）的改建結束，將會重新開幕，而當天會在美術館前的草坪舉行典禮，之後的部分則說明美術館改建後舉行的展覽內容與相關事項，所以 (C) A special event following a renovation 是正確答案。(B) 雖然看起來像是對的，但文中並沒有提到要舉辦宴會，所以不對。\n\n**替換表達**\nremodeling 改建 → renovation 整修\n\n**單字** appointment (n.) 任命，約定會面；banquet (n.) 宴會；celebrate (v.) 慶祝；local (adj.) 地方的；(n.) 本地居民\n\n<!-- page 404 -->\n\n**187.** 答案 (B)｜難度：高\nWhat is indicated about Ms. Rosales?\n- (A) She received a discount as she is a sponsor of the facility.\n- (B) She plans to accompany children to an opening exhibit.\n- (C) She intends to view the artifacts in the afternoon.\n- (D) She will pay the price of admission at the museum.\n\n> 關於 Rosales 小姐，文中提到什麼？\n> (A) 她因為是設施的贊助者而得到了折扣。\n> (B) 她打算和小孩一起參加即將開幕的展覽。\n> (C) 她打算在下午看文物。\n> (D) 她會在美術館付入場費。\n\n**推論 多篇文章綜合題**\n這是必須參考三篇文章其中兩篇內容的多篇文章綜合題。先看出現題目關鍵字 Ms. Rosales 的收據（第二篇文章）。\n\n第二篇文章中，「Guest Name: Kerry Rosales」、「Special Ticket, 2, $5」顯示 Kerry Rosales 除了自己的票以外，還買了 2 張 5 美元的特惠票，這是第一個線索。但是，這裡沒有提到 5 美元的票是怎樣的票，所以還需要在第一篇文章（報導）中確認。第一篇文章中的「The museum will also be offering the special admission price of $5 for children aged 10 and under instead of its regular $7 for the duration of the exhibit.」提到，美術館將在特展期間為 10 歲以下孩童提供特惠入場票價，原本一般票價為 7 美元，特惠票價為 5 美元。\n\n綜合「Kerry Rosales 除了自己的票以外，還買了 2 張 5 美元的特惠票」和「美術館將在特展期間為 10 歲以下孩童提供 5 美元的特惠票」這兩個線索，可以推測 Kerry Rosales 應該是要和 2 個小孩去看展，所以 (B) She plans to accompany children to an opening exhibit 是正確答案。\n\n**單字** sponsor (n.) 贊助者，贊助商；accompany (v.) 陪同，伴隨；intend (v.) 打算，意圖\n\n**188.** 答案 (B)｜難度：中\nWhat are those who purchase tickets in advance asked to bring to the exhibition?\n- (A) Official identification\n- (B) Proof of purchase\n- (C) A discount coupon\n- (D) An open ticket\n\n> 預先購買門票的人被要求帶什麼到展場？\n> (A) 正式的身分證明\n> (B) 購買證明\n> (C) 折扣優惠券\n> (D) 還沒定下日期的票\n\n**wh- 問題 What**\n這是問預先購買門票的人被要求帶什麼（What）到展場的 wh- 問題，所以要看提到與題目關鍵部分 those who purchase tickets in advance ~ exhibition 相關內容的收據（第二篇文章）。「If you've made an advance purchase, please be sure to present this receipt to the museum official collecting tickets when entering the exhibition.」的部分提到，已經預購門票的人一定要在進入展場時向美術館門票收取人員出示這張收據，所以 (B) Proof of purchase 是正確答案。\n\n**替換表達**\nreceipt 收據 → Proof of purchase 購買證明\n\n<!-- page 405 -->\n\n**189.** 答案 (D)｜難度：高\nWhat is suggested about the Brayman Museum of Art?\n- (A) It will send artifacts to Perth immediately after the exhibit.\n- (B) Its curator was informed about a delay in August.\n- (C) Its new facility in Auckland will not be built in time for a show.\n- (D) It is expecting to receive some exhibit items on September 27.\n\n> 關於 Brayman 美術館，文中顯示什麼？\n> (A) 展覽後會馬上把文物送到伯斯。\n> (B) 館長被告知了 8 月的延期。\n> (C) 在奧克蘭的新設施無法及時蓋好供展覽使用。\n> (D) 預計在 9 月 27 日會收到一些展示品。\n\n**Not/True 多篇文章綜合題**\n這是需要找到與關鍵字 Brayman Museum of Art 相關的資訊，並且與選項敘述對照的 Not/True 問題，所以要看提到與 Brayman 美術館相關內容的報導（第一篇文章）和電子郵件（第三篇文章）。\n\n和 (A) 相關的部分是第一篇文章中的「after the show at the BMA, it will go on to Sydney and then Perth」，表示展覽在 BMA 結束後，會先巡迴到雪梨，然後才是伯斯，不符合選項敘述。和 (B) 相關的部分是第三篇文章中的「Date: September 10」、「I received a call this morning ~ there will be a delay with the *France in Focus* exhibition.」和「Jane Wellington, Brayman Museum of Art, Curator」，表示 Brayman 美術館館長在 9 月 10 日早上接到電話通知展覽將會延期，不符合選項敘述。(C) 在文中沒有提到。(D) 對應第三篇文章中的「The items should start arriving here at the museum the day after our exhibition is scheduled to open.」，表示展品會從預定開展日期的隔天開始陸續抵達，這是第一個線索。但是，這裡沒有提到開展日期，所以還需要在第一篇文章中確認。第一篇文章中的「the facility will reopen on Wednesday, September 26」、「She will also introduce the museum's new special exhibition, *France in Focus*, beginning that day」表示美術館預計 9 月 26 日重新開幕，*France in Focus* 展也將在當天開展，這是第二個線索。綜合「展品會從預定開展日期的隔天開始陸續抵達」和「展覽預計 9 月 26 日開始」這兩個線索，可以推知隔天 9 月 27 日會收到一些展示品，所以 (D) It is expecting to receive some exhibit items on September 27 是正確答案。\n\n**190.** 答案 (B)｜難度：中\nWhat are those who already have tickets entitled to?\n- (A) Free admission to an upcoming lecture\n- (B) A refund of a payment\n- (C) Invitations to a celebration\n- (D) A guided tour of the displays\n\n> 已經有票的人有資格得到什麼？\n> (A) 免費參加即將舉行的演講\n> (B) 退款\n> (C) 慶祝活動的邀請\n> (D) 展覽的導覽\n\n**wh- 問題 What**\n這是問已經有票的人有資格得到什麼（What）的 wh- 問題，所以要看提到與問題重點 those who already have tickets entitled to 相關內容的電子郵件（第三篇文章）。「the opening must be delayed by at least two weeks. I'll need you to contact those who purchased exhibition tickets in advance.」和「they also have the option of getting their money back」的部分提到，開幕必須延後至少兩週，而收件者應該聯絡已經預先購買展覽門票的人，說他們也可以選擇退費，所以 (B) A refund of a payment 是正確答案。\n\n**替換表達**\nthose who already have tickets 已經有票的人 → those who purchased ~ tickets in advance 預先購買門票的人\ngetting ~ money back 把錢拿回來 → A refund 退款\n\n**單字** entitle (v.) 給予資格，賦予權力\n\n<!-- page 406 -->\n\n### Questions 191-195 refer to the following memo, e-mail, and online form. 🆕\n191-195 題參照以下備忘錄、電子郵件及線上表格。\n\n**文章 1**\n\n> MEMO\n>\n> To: All staff\n> [191] From: Tom Williams, Director\n> Date: August 10\n> Subject: New staff\n>\n> As most of you are aware, [191] Techno Tel officially bought out Regent Mobile on August 1. This is to let you know that, because of this, [191/193] five staff members from Regent Mobile will be joining our offices in about a week. [193] Three of them will be working for research and development, and the other two will be in marketing. They will start work on Monday, August 16, and will begin their training that day after fulfilling some administrative requirements. I hope that everyone will provide them with a warm welcome and answer any questions they may have so that they can adjust to their new work environment quickly.\n>\n> Thank you.\n\n**翻譯**\n> 備忘錄\n>\n> 收件者：所有員工\n> [191] 寄件者：Tom Williams，主任\n> 日期：8 月 10 日\n> 主旨：新員工\n>\n> 各位大多已經知道，[191] Techno Tel 公司在 8 月 1 日正式收購了 Regent Mobile 公司。這則備忘錄是要通知各位，由於這個原因，[191/193] 來自 Regent Mobile 公司的 5 位員工大約一週後將加入我們的辦公室。[193] 其中 3 位將在研發部工作，另外 2 位則在行銷部。他們將從 8 月 16 日星期一開始工作，當天完成一些行政上的必要事項後，就會開始受訓。我希望各位熱情歡迎他們，並且回答他們可能會有的任何問題，讓他們能迅速適應新的工作環境。\n>\n> 謝謝。\n\n**文章 2**\n\n> From: Neil Adams <nadams@technotel.com>\n> To: Maude Garcia 做了改變？\n> (A) 為了用新設備加以更新\n> (B) 為了準備重大的專案\n> (C) 為了遵守政策的改變\n> (D) 為了提供空間給新進員工\n\n**wh- 問題 多篇文章綜合題**\n這是必須參考三篇文章其中兩篇內容的多篇文章綜合題。題目的關鍵部分是 Mr. Adams and his staff ~ making changes to the office，問 Adams 先生和他的員工為什麼（Why）對辦公室做了改變，所以先看 Adams 先生所寫的電子郵件（第二篇文章）。\n\n在第二篇文章中的「You may have received a memo from Tom Williams ~. In preparation for the upcoming changes, my staff and I have cubicles set up in my department」，Adams 先生說收件人應該已經收到 Tom Williams 的備忘錄，而為了準備這次改變，Adams 先生已經和員工在部門裡設置了小隔間，這是第一個線\n\n<!-- page 408 -->\n\n索。但是，這裡沒有提到是為了怎樣的改變而這麼做，所以還需要確認備忘錄（第一篇文章）的內容。第一篇文章中的「From: Tom Williams, Director」、「Techno Tel officially bought out Regent Mobile on August 1. ~ because of this, five staff members from Regent Mobile will be joining our offices in about a week.」，Tom Williams 說 Techno Tel 公司在 8 月 1 日正式收購了 Regent Mobile 公司，所以來自 Regent Mobile 公司的 5 位員工大約一週後將加入辦公室，這是第二個線索。\n\n綜合「Adams 先生為了這次改變而和員工在部門裡設置了小隔間」和「由於 Techno Tel 公司收購了 Regent Mobile 公司，所以會有 5 位新員工加入」這兩個線索，可以推知 Adams 先生和他的員工是為了容納新員工而對辦公室做出改變，所以 (D) To accommodate incoming staff 是正確答案。\n\n**單字** make changes (phr.) 做出改變；conform (v.) 遵守，符合；accommodate (v.) 容納，為…提供住宿\n\n**192.** 答案 (C)｜難度：中\nWhat does Mr. Adams mention in the e-mail?\n- (A) A supplier has run out of some requested office furnishings.\n- (B) Some cubicles are missing important assembly components.\n- (C) Techno Tel has placed previous orders with Office Interiors and Supplies.\n- (D) The arriving staff members will start work on different days.\n\n> Adams 先生在電子郵件裡提到什麼？\n> (A) 對於某些要求的辦公家具，供應商已經缺貨了。\n> (B) 有些小隔間缺少重要的組裝零件。\n> (C) Techno Tel 公司以前跟 Office Interiors and Supplies 公司訂過東西。\n> (D) 新進員工會各自在不同的日期開始上班。\n\n**Not/True True 問題**\n這是問 Adams 先生在電子郵件（第二篇文章）裡提到什麼的 Not/True 問題。題目並沒有特定的關鍵字，所以要在文中找到與各選項相關的資訊，並確認是否正確。(A)、(B)、(D) 在文中沒有提到。(C) 對應文中的「I'm wondering if the purchasing department can get our regular supplier to deliver them」、「Please let Office Interiors and Supplies know that this is a rush order.」，表示 Adams 先生想知道採購部可不可以請平常的供應商把需要的東西送過來，又請收件者告訴 Office Interiors and Supplies 公司這是很急的訂單，可推知 Office Interiors and Supplies 公司就是 Techno Tel 公司平常訂購物品時會利用的供應商，所以 (C) Techno Tel has placed previous orders with Office Interiors and Supplies. 是正確答案。\n\n**單字** run out of (phr.) 把…用完了，沒有…了；furnishing (n.) 家具與家飾物品；assembly (n.) 組裝，集會；component (n.) 零件，構成要素\n\n**193.** 答案 (A)｜難度：高\nIn what department does Mr. Adams most likely work?\n- (A) Research and development\n- (B) Purchasing\n- (C) Marketing\n- (D) Administration\n\n> Adams 先生最有可能在什麼部門工作？\n> (A) 研發\n> (B) 採購\n> (C) 行銷\n> (D) 行政\n\n**推論 多篇文章綜合題**\n這是必須參考三篇文章其中兩篇內容的多篇文章綜合題。首先看題目關鍵字 Mr. Adams 所寫的電子郵件（第二篇文章）。\n\n第二篇文章中，「I want ~ the new staff have everything they need to start working. We need to order three of each ~.」提到 Adams 先生希望新員工會有開始工作時需要的所有東西，所以要訂購以下物品各 3 個，這是第一個線索。但是，這裡沒有提到為什麼是 3 個，所以還需要在第一篇文章（備忘錄）中確認。第一篇文章中，「five staff members ~ will be joining our offices ~. Three of them will be working for research and development」提到會有 5 位員工加入辦公室，其中 3 位在研發部，這是第二個線索。\n\n綜合「Adams 先生要為了新進員工訂購必要物品各 3 個」和「有 3 位新員工會到研發部」這兩個線索，可以推知 Adams 先生在分配到 3 位新員工的研發部，所以 (A) Research and development 是正確答案。\n\n<!-- page 409 -->\n\n**194.** 答案 (D)｜難度：中\nWhat is inferred in the online form?\n- (A) Office Interiors and Supplies gave the customer a discount.\n- (B) Payment will be made by credit card.\n- (C) The filing cabinets will be delivered separately.\n- (D) The order is applicable for shipping charges.\n\n> 從這張網路表格可以推知什麼？\n> (A) Office Interiors and Supplies 公司給了這位顧客折扣。\n> (B) 將以信用卡付款。\n> (C) 檔案櫃將會另外配送。\n> (D) 這筆訂單要收運費。\n\n**推論 細節資訊**\n這是問可以從線上表格（第三篇文章）推知什麼的推論問題。「TOTAL $2,423.16」和「For purchases of $3000 or more, shipping is free-of-charge.」的部分顯示，購買金額達 3000 美元以上免運費，而這張訂單的總金額是 2,423.16 美元，可以推知這張訂單要付運費，所以 (D) The order is applicable for shipping charges 是正確答案。\n\n**195.** 答案 (C)｜難度：高\nWhat is implied about Office Interiors and Supplies?\n- (A) It will allow one of the items to be canceled within two days.\n- (B) It will deliver more desks and chairs to Techno Tel before August 16.\n- (C) It will not satisfy Mr. Adams' delivery date requirement.\n- (D) It will send some dividers to Techno Tel by August 14.\n\n> 關於 Office Interiors and Supplies 公司，文中暗示什麼？\n> (A) 允許其中一項物品在兩天內取消訂購。\n> (B) 會在 8 月 16 日前配送更多桌椅到 Techno Tel 公司。\n> (C) 無法滿足 Adams 先生的配送日期要求。\n> (D) 會在 8 月 14 日前送一些隔板到 Techno Tel 公司。\n\n**推論 多篇文章綜合題**\n這是必須參考三篇文章其中兩篇內容的多篇文章綜合題。首先看要傳送給題目關鍵字 Office Interiors and Supplies 的線上表格（第三篇文章）。第三篇文章中，「08/12」、「Delivery will be made after three days' time.」顯示訂購日期是 8 月 12 日，而配送會在 3 天之後，這是第一個線索。但是，這裡沒有提到 Adams 先生希望什麼時候送到，所以還需要確認電子郵件（第二篇文章）的內容。第二篇文章中的「It should be delivered by August 13.」表示寄件人 Adams 先生希望在 8 月 13 日之前送到，這是第二個線索。\n\n綜合「訂購物品會在 3 天後的 8 月 15 日配送」和「Adams 先生希望物品在 8 月 13 日之前送到」這兩個線索，可以推知 Office Interiors and Supplies 公司無法滿足 Adams 先生的配送日期要求，所以 (C) It will not satisfy Mr. Adams' delivery date requirement 是正確答案。\n\n<!-- page 410 -->\n\n### Questions 196-200 refer to the following article, e-mail, and form. 🆕\n196-200 題參照以下報導、電子郵件及表格。\n\n**文章 1**\n\n> *Rochester Times*\n> Keeping up with the times\n>\n> ROCHESTER –Train and subway stations across the state now offer passengers comfortable waiting areas, spacious platforms, and better safety features. Sadly, [196] Rochester Central Station is lagging behind. This current situation, however, is expected to come to an end soon. [196/197] The city government has been negotiating with financiers and the federal government to procure funding for renovating and enlarging the Rochester railway facility, which was built back in the early 1950s. [197] Local government officials hope that there will be sufficient funds to proceed with much-needed updates and expansions within a few weeks. Should financing be secured, starting on February 1, the city plans to request proposals from contractors with ideas for making Rochester Central Station a transport facility that residents can be proud of. Plans call for the inclusion of additional retail and dining facilities, enlarged waiting areas, two new platforms, and an upgraded ticketing counter and an automated payment system. Officials are positive that financing will be found and that Rochester will have a fully upgraded station by the end of next year.\n\n**翻譯**\n> 《Rochester Times》報\n> 與時俱進\n>\n> 羅徹斯特－目前本州各地的鐵路與地鐵車站為乘客提供舒適的等候區、寬敞的月台，以及更好的安全設備。遺憾的是，[196] 羅徹斯特中央車站（在這方面）落後了。不過，目前的狀況預期很快就會終結。[196/197] 市政府持續與金主以及聯邦政府協商，以求取得資金來翻修並擴建這座興建於 1950 年代初期的羅徹斯特鐵路設施。[197] 本地政府官員希望數週內能夠有充足的資金進行極為需要的更新與擴建。倘若能取得資金，市府預計自 2 月 1 日起徵求承包商提案，提出將羅徹斯特中央車站成為市民能引以為傲的交通運輸設施的想法。計畫須包含增設零售與餐飲設施、擴大等候區、兩座新月台，以及改善售票櫃台及付款系統自動化。官員有信心能夠尋得資金挹注，使羅徹斯特於明年年底前擁有徹底改善的車站。\n\n**文章 2**\n\n> From: Selena Gambrell <sgambrell@rochester.gov>\n> To: James Vaughan <jvaughan@pettuspagano.com>\n> Subject: Railway station upgrade project\n> [197] Date: February 5\n>\n> Dear Mr. Vaughan,\n>\n> [198-A/C/D] Thank you for your interest in bidding for the Rochester Central Station upgrade project. The mayor's office has prepared some information on this bid opportunity. It may be downloaded from www.rochestergov/bidopportunities. Aside from a bid, [198-A/C/D] we will need a filled-out application form, a feasibility study, and a detailed proposal that includes a timetable and a budget estimate. [199] All bids should be sealed in an envelope and brought to City Hall in person along with everything else. [197] We are now in the stage of officially accepting bids, and the deadline for application is March 1. Thank you, and please don't hesitate to get in touch with me if you have any questions.\n>\n> Sincerely,\n>\n> Selena Gambrell\n\n**翻譯**\n> 寄件者：Selena Gambrell <sgambrell@rochester.gov>\n> 收件者：James Vaughan <jvaughan@pettuspagano.com>\n> 主旨：鐵路車站改善計畫\n> [197] 日期：2 月 5 日\n>\n> 親愛的 Vaughan 先生：\n>\n> [198-A/C/D] 感謝您有意參與羅徹斯特中央車站改善案投標。市長室準備了關於本次投標機會的資訊。資料可於 www.rochestergov/bidopportunities 下載。除投標書以外，[198-A/C/D] 我們也需要填妥的申請表、可行性研究，以及包含時間表與預算估計的詳細提案書。[199] 所有投標書均須以信封密封，並連同其他所有文件親自送至市府。[197] 我們目前正處於公開招標階段，申請截止日為 3 月 1 日。感謝您，若您有任何問題請隨時與我聯絡。\n>\n> Selena Gambrell\n\n<!-- page 411 -->\n\n> [199/200-B] **The City of Rochester Bid S ccordance with (phr.) 依照…；contractual (adj.) 合約的，契約的；bid price (phr.) 投標價格；accomplishment (n.) 成就，成績\n\n**196.** 答案 (C)｜難度：最高\nWhat is the article mainly about?\n- (A) A statewide transit system improvement project\n- (B) A lack of funds for the operation of a station\n- (C) A plan for the renewal of a transportation hub\n- (D) A government regulation regarding project funding\n\n> 這篇報導主要是關於什麼？\n> (A) 全州的交通運輸系統改善計畫\n> (B) 缺乏車站營運資金\n> (C) 交通樞紐的更新計畫\n> (D) 關於計畫資金的政府規範\n\n**尋找主題／目的** 文章的主題\n這是詢問報導（第一篇文章）主要關於什麼的尋找主題問題。報導中的「Rochester Central Station is lagging behind」和「The city government has been negotiating ~ to procure funding for renovating and enlarging the Rochester railway facility」提到，羅徹斯特中央車站在設施方面落後了，市政府希望能取得資金進行翻修與擴建，而之後的部分則說明詳細的計畫內容，所以 (C) A plan for the renewal of a transportation hub 是正確答案。至於選項 (A)，雖然文中提到州內各地的車站都有很好的設施，但整體而言文章的重點是羅徹斯特中央車站的設施更新，而不是整個州的交通運輸系統改善，所以 (A) 不對。\n\n<!-- page 412 -->\n\n**單字** statewide (adj.) 在全州範圍的；transit (n.)（公共）交通運輸，過境，中轉；transportation hub (phr.) 交通樞紐；regulation (n.) 規定，規範\n\n**197.** 答案 (D)｜難度：最高\nWhat is implied about the Rochester Central Station Project?\n- (A) Its schedule has been readjusted.\n- (B) Bid proposals can no longer be submitted.\n- (C) A cost will be higher than anticipated.\n- (D) It has received adequate funding.\n\n> 關於羅徹斯特中央車站計畫，文中暗示什麼？\n> (A) 時程經過重新調整。\n> (B) 已經不能投標了。\n> (C) 一項費用將高於預期。\n> (D) 已經得到足夠的資金。\n\n**推論** 多篇文章綜合題\n這是必須參考三篇文章其中兩篇內容的多篇文章綜合題。首先看提到與題目關鍵字 the Rochester Central Station Project 相關內容的報導（第一篇文章）。\n\n第一篇文章中，「The city government has been negotiating ~ to procure funding for renovating and enlarging the Rochester railway facility」和「Local government officials hope that there will be sufficient funds to proceed with much-needed updates and expansions ~. Should financing be secured, starting on February 1, the city plans to request proposals from contractors」提到市政府持續進行協商，以求取得資金來翻修並擴建羅徹斯特中央車站，而如果能取得資金的話，就會從 2 月 1 日起徵求承包商提案，這是第一個線索。但是，這裡沒有提到是否順利取得了資金，所以還需要在第二篇文章（電子郵件）中確認。第二篇文章中的「Date: February 5」、「We // 答案線索標記，例如 [147]、[149-D]、[162/163]、[159-B/160-A/D]
const MARK = /\[(\d{3}(?:-[A-D](?:\/[A-D])*)?(?:\/\d{3}(?:-[A-D](?:\/[A-D])*)?)*)\]\s?/g;
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function inline(s) {
  s = esc(s).replace(/\\\*/g, "\u0001");
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>");
  s = s.replace(/\u0001/g, "*").replace(/\\([\[\]_#-])/g, "$1");
  return s.replace(MARK, (_, m) => `<span class="mk">${m}</span>`);
}
function md(text) {
  const lines = text.split("\n");
  let out = "", i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    if (l.startsWith(">")) {
      const buf = [];
      while (i < lines.length && lines[i].startsWith(">")) { buf.push(lines[i].replace(/^> ?/, "")); i++; }
      out += "<blockquote>" + md(buf.join("\n")) + "</blockquote>"; continue;
    }
    if (l.trim().startsWith("|")) {
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith("|")) { rows.push(lines[i].trim()); i++; }
      const cells = r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      let html = "<table>";
      rows.forEach((r, k) => {
        if (/^\|[\s\-:|]+\|$/.test(r)) return;
        const cs = cells(r);
        if (k === 0 && cs.every(c => !c)) return;
        const tag = k === 0 && rows[1] && /^\|[\s\-:|]+\|$/.test(rows[1]) ? "th" : "td";
        html += "<tr>" + cs.map(c => `<${tag}>${inline(c)}</${tag}>`).join("") + "</tr>";
      });
      out += html + "</table>"; continue;
    }
    if (/^- /.test(l)) {
      out += "<ul>";
      while (i < lines.length && /^- /.test(lines[i])) { out += "<li>" + inline(lines[i].slice(2)) + "</li>"; i++; }
      out += "</ul>"; continue;
    }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !lines[i].startsWith(">") && !/^- /.test(lines[i]) && !lines[i].trim().startsWith("|")) { buf.push(inline(lines[i])); i++; }
    out += "<p>" + buf.join("<br>") + "</p>";
  }
  return out;
}

const Q_HEAD = /^\*\*(\d{3})\.\*\*\s*(🆕)?\s*(?:答案 \(([A-D])\)(?:｜難度：([^\s🆕]+))?)?\s*(🆕)?/;
function parseQBlock(lines) {
  const m = lines[0].match(Q_HEAD);
  const q = { num: m[1], isNew: !!(m[2] || m[5]), answer: m[3] || null, level: m[4] || "", text: [], options: [], rest: [] };
  let stage = "text";
  for (const l of lines.slice(1)) {
    const o = l.match(/^- \(([A-D])\)\s?(.*)$/);
    if (stage !== "rest" && o) { stage = "opts"; q.options.push({ key: o[1], text: o[2] }); continue; }
    if (stage === "opts") stage = "rest";
    (stage === "text" ? q.text : q.rest).push(l);
  }
  q.body = lines.slice(1).join("\n").trim();
  q.text = q.text.join("\n").trim();
  q.rest = q.rest.join("\n").trim();
  return q;
}
function splitBlocks(lines) {
  const pre = [], blocks = [];
  for (const l of lines) {
    if (Q_HEAD.test(l)) blocks.push([l]);
    else if (blocks.length) blocks[blocks.length - 1].push(l);
    else pre.push(l);
  }
  return { pre, blocks: blocks.map(parseQBlock) };
}
function parsePreamble(pre, expected) {

  // 判斷是不是中文翻譯：看中文字佔的比例（原文偶爾夾少量中文註記）
  const isTrans = t => {

  // 第一步：切成一塊一塊（文章標籤 / 原文 / 翻譯）

  const flush = () => {
    if (!quote) return;
    const text = quote.join("\n");

    if (lab) chunks.push({ type: "label", text: "文章 " + lab[1] });
    else if (l.startsWith("**單字**")) { inVocab = true; vocab.push(l); }
    else if (l.trim() === "**翻譯**") afterTransLabel = true;
  }
  flush();
  // 第二步：沒標「文章 N」的地方，從「翻譯之後又出現的英文」裡挑最長的幾段當作新文章的開頭
  const labels = chunks.filter(c => c.type === "label").length;
  const lastLabel = chunks.map(c => c.type).lastIndexOf("label");
  const cands = chunks.map((c, k) => ({ c, k }))
    .filter(({ c, k }) => c.type === "en" && k > lastLabel && k > 0 && chunks[k - 1].type === "trans" && chunks.slice(0, k).some(x => x.type === "en"));
  const need = expected - Math.max(labels, 1);
  if (need > 0) cands.sort((a, b) => b.c.text.length - a.c.text.length).slice(0, need).forEach(({ c }) => c.split = true);
  // 第三步：組合
  const passages = [], trans = [];
  let cur = null;
  for (const c of chunks) {
    if (c.type === "label") { cur = { label: c.text, lines: [] }; passages.push(cur); trans.push(`**${c.text}**`); }
    else if (c.type === "trans") trans.push(c.text);
    else {
      if (!cur || c.split) { cur = { label: "", lines: [] }; passages.push(cur); }
      cur.lines.push(c.text);
    }
  }
  if (passages.length > 1) passages.forEach((p, k) => { if (!p.label) p.label = "文章 " + (k + 1); });
  return { sub, passages: passages.filter(p => p.lines.length), trans: trans.join("\n\n"), vocab: vocab.join("\n") };
}

const raw = SOURCE.split("\n").filter(l => !/^<!-- page/.test(l.trim()));
const startIdx = raw.findIndex(l => /^# TEST/.test(l));
const title = (raw[startIdx] || "# TOEIC").replace(/^#\s*/, "");
const intros = {};
SOURCE.split("\n").forEach((l, k, arr) => {
  const m = l.match(/\[PART (\d)：(.+?)\]/);
  if (m) intros[m[1]] = { name: m[2], text: (arr[k + 1] || "").replace(/^\s*概念：/, "") };
});

const parts = {};
let part = null, section = null;
for (const l of raw.slice(startIdx)) {
  const pm = l.match(/^## PART (\d)/);
  if (pm) { part = pm[1]; parts[part] = []; section = null; continue; }
  if (!part) continue;
  const sm = l.match(/^### (.+)$/);
  if (sm) { section = { heading: sm[1].replace(/\s*🆕\s*$/, ""), isNew: /🆕/.test(sm[1]), lines: [] }; parts[part].push(section); continue; }
  if (!section) { section = { heading: null, lines: [] }; parts[part].push(section); }
  section.lines.push(l);
}

// 統一成「題組」：Part 5 每題一組，Part 6/7 每篇文章一組
const sets = [];
for (const p of Object.keys(parts)) {
  for (const sec of parts[p]) {
    const { pre, blocks } = splitBlocks(sec.lines);
    if (!sec.heading) {
      blocks.forEach(q => sets.push({ id: "q" + q.num, part: p, heading: null, questions: [q] }));
      continue;
    }
    const first = +(blocks[0] && blocks[0].num);
    const info = parsePreamble(pre, first >= 186 ? 3 : first >= 176 ? 2 : 1); // 多益 176-185 雙篇、186-200 三篇
    const byNum = {};
    for (const b of blocks) {
      const q = byNum[b.num] || (byNum[b.num] = { num: b.num, isNew: false, options: [], text: "", rest: "" });
      q.isNew = q.isNew || b.isNew;
      if (b.answer && q.options.length) { q.answer = b.answer; q.level = b.level; q.rest = b.body; } // Part 6：選項在前面，這塊全是解析
      else if (b.answer) { q.answer = b.answer; q.level = b.level; q.rest = b.rest; q.text = b.text; q.options = b.options; }
      else { if (b.options.length) q.options = b.options; if (b.rest) info.vocab += (info.vocab ? "\n\n" : "") + b.rest; }
    }
    const questions = Object.values(byNum).sort((a, b) => a.num - b.num);
    sets.push({ id: "s" + questions[0].num, part: p, heading: sec.heading, isNew: sec.isNew, ...info, questions });
  }
}

/* ---------- 作答紀錄 ---------- */
let state = {};
try { state = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) {}
const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} };
const st = id => state[id] || (state[id] = { picks: {}, done: false });

/* ---------- 畫面 ---------- */
const $ = s => document.querySelector(s);
document.title = title + " 閱讀練習";
$("#title").textContent = title + " 閱讀練習";
const partKeys = Object.keys(parts);
let curPart = partKeys[0];
try { const saved = localStorage.getItem(STORE_KEY + "-tab"); if (partKeys.includes(saved)) curPart = saved; } catch (e) {}

function renderTabs() {
  $("#tabs").innerHTML = partKeys.map(p =>
    `<button data-p="${p}" class="${p === curPart ? "active" : ""}">Part ${p}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    curPart = b.dataset.p;
    try { localStorage.setItem(STORE_KEY + "-tab", curPart); } catch (e) {}
    renderTabs(); renderMain(); scrollTo({ top: 0 });
  });
}

function renderScore() {
  let right = 0, done = 0, total = 0;
  for (const s of sets) {
    total += s.questions.length;
    const x = state[s.id];
    if (x && x.done) s.questions.forEach(q => { done++; if (x.picks[q.num] === q.answer) right++; });
  }
  $("#score").innerHTML = `已作答 <b>${done}</b> / ${total} 題，答對 <b>${right}</b> 題` + (done ? `（${Math.round(right / done * 100)}%）` : "");
}

function questionHTML(set, q) {
  const x = st(set.id), pick = x.picks[q.num];
  const opts = q.options.map(o => {
    let cls = "opt", tag = "";
    if (x.done) {
      if (o.key === q.answer) { cls += " right"; tag = "正解"; }
      else if (o.key === pick) { cls += " wrong"; tag = "你的答案"; }
      if (o.key === q.answer && o.key === pick) tag = "✓ 答對";
    } else if (o.key === pick) cls += " sel";
    return `<button class="${cls}" data-set="${set.id}" data-q="${q.num}" data-k="${o.key}" ${x.done ? "disabled" : ""}>
      <span class="l">(${o.key})</span><span>${inline(o.text)}</span>${tag ? `<span class="tag">${tag}</span>` : ""}</button>`;
  }).join("");
  let after = "";
  if (x.done) {
    const ok = pick === q.answer;
    after = `<div class="verdict ${ok ? "ok" : "bad"}">${ok ? "答對了" : pick ? `答錯了，你選 (${pick})` : "未作答"}・正確答案 (${q.answer})${q.level && q.level !== "?" ? `・難度：${q.level}` : ""}</div>
      <div class="explain">${md(q.rest)}</div>`;
  }
  return `<div class="q"><div class="qtext"><span class="qnum">${q.num}.</span>${q.isNew ? '<span class="new">新題型</span> ' : ""}${q.text ? md(q.text).replace(/^<p>|<\/p>$/g, "") : ""}</div>
    <div class="opts">${opts}</div>${after}</div>`;
}

function setHTML(set) {
  const x = st(set.id);
  const unanswered = set.questions.filter(q => !x.picks[q.num]).length;
  let passages = "";
  if (set.passages && set.passages.length) {
    passages = `<div class="passages">` + set.passages.map(p => {
      const body = p.lines.join("\n\n");
      return (p.label ? `<div class="plabel">${p.label}</div>` : "") + `<div class="passage">${md(x.done ? body : stripMarks(body))}</div>`;
    }).join("") + `</div>`;
  }
  const reveal = x.done && (set.trans || set.vocab)
    ? `<details class="reveal" open><summary>文章翻譯與單字</summary>${md(set.trans)}${md(set.vocab)}</details>` : "";
  const head = set.heading
    ? `<p class="set-title">${esc(set.heading)}${set.isNew ? ' <span class="new">新題型</span>' : ""}</p><p class="set-sub">${esc(set.sub || "")}</p>` : "";
  const btnLabel = set.heading ? "送出本題組" : "送出";
  const actions = x.done
    ? `<div class="actions"><span class="result">本組答對 ${set.questions.filter(q => x.picks[q.num] === q.answer).length} / ${set.questions.length}</span>
       <button class="btn" data-redo="${set.id}">重做這組</button></div>`
    : `<div class="actions"><button class="btn primary" data-submit="${set.id}" ${unanswered ? "disabled" : ""}>${btnLabel}</button>
       ${unanswered && set.questions.length > 1 ? `<span class="hint">還有 ${unanswered} 題沒選</span>` : ""}</div>`;
  return `<section class="card" id="${set.id}">${head}
    <div class="set-body ${passages ? "two" : ""}">${passages}<div>${set.questions.map(q => questionHTML(set, q)).join("")}${actions}</div></div>
    ${reveal}</section>`;
}

function renderSet(id) {
  const set = sets.find(s => s.id === id);
  const el = document.getElementById(id);
  el.outerHTML = setHTML(set);
  renderScore();
}

function renderMain() {
  const intro = intros[curPart];
  $("#main").innerHTML = (intro ? `<p class="part-intro"><b>Part ${curPart}：${intro.name}</b>　${esc(intro.text)}</p>` : "")
    + sets.filter(s => s.part === curPart).map(setHTML).join("");
  renderScore();
}

$("#main").addEventListener("click", e => {
  const opt = e.target.closest(".opt");
  if (opt && !opt.disabled) {
    st(opt.dataset.set).picks[opt.dataset.q] = opt.dataset.k; save(); renderSet(opt.dataset.set); return;
  }
  const sub = e.target.closest("[data-submit]");
  if (sub && !sub.disabled) { st(sub.dataset.submit).done = true; save(); renderSet(sub.dataset.submit); return; }
  const redo = e.target.closest("[data-redo]");
  if (redo) { state[redo.dataset.redo] = { picks: {}, done: false }; save(); renderSet(redo.dataset.redo); }
});
$("#resetAll").onclick = () => {
  if (!confirm("確定要清除這份考卷的所有作答紀錄？")) return;
  state = {}; save(); renderMain();
};

renderTabs();
renderMain();
</script>
</body>
</html>
