<script>
const SOURCE = "# 目錄\n\n1. [PART 5：單句文法與詞彙](#part-5)（101~130 題）\n   概念：這 30 題考的是單句挑錯／填空能力，範圍很廣，包括名詞、形容詞、副詞該放在句子哪個位置的詞性判斷題，動詞的時態、語態、單複數要跟主詞一致的動詞題，代名詞的格（主詞、受詞、反身代名詞），以及介系詞慣用語、相關連接詞、複合關係代名詞（whatever）等文法搭配題，另外也有不少動詞、名詞、形容詞的詞彙選擇題，需要靠上下文判斷語意最接近的答案。\n\n2. [PART 6：段落填空](#part-6)（131~146 題，共 4 篇）\n   概念：這個 Part 是段落填空，共 4 篇短文、每篇 4 題，除了跟 Part 5 一樣會考詞性、時態、介系詞、動詞慣用語等文法詞彙題以外，每篇都會有 1 題新制多益特有的「選出空格中正確的句子」題型，需要讀懂前後句意才能選出銜接最順的句子，也常出現要判斷句子邏輯關係的連接副詞題。\n   1. [Questions 131-134 refer to the following letter. ](#questions-131-134-refer-to-the-following-letter-)\n      概念：一封回覆 Murillo 小姐詢問子女美國國籍申請手續的信。考點包括要靠全文判斷語意的名詞詞彙題、動詞詞彙（verify）、連接副詞（Additionally），以及選出正確句子（幫忙找最近的政府辦事處）。\n   2. [Questions 135-138 refer to the following letter. ](#questions-135-138-refer-to-the-following-letter-)\n      概念：飯店經理寫給室內裝潢公司的感謝信，稱讚裝潢成果並預告接下來要整修客房、擴大商務中心。考點是動詞詞彙（commend 稱讚）、選出正確句子、名詞詞彙（atmosphere 氛圍），以及要靠上下文判斷的未來式動詞時態題。\n   3. [Questions 139-142 refer to the following advertisement. ](#questions-139-142-refer-to-the-following-advertisement-)\n      概念：五金用品店的年度清倉特賣廣告，介紹折扣內容和滿額贈送折價券的活動。考點有動詞片語（marked down 降價）、選出正確句子、被動態慣用語（be entitled to 有資格）、以及介系詞選擇（per 每…）。\n   4. [Questions 143-146 refer to the following article. ](#questions-143-146-refer-to-the-following-article-)\n      概念：介紹紀錄片《Feed》深入探討現代食品產業的影評報導。考點是修飾動詞的副詞位置題、名詞詞彙（topic 主題）、選出正確句子，以及 so~that 句型的副詞選擇題。\n\n3. [PART 7：閱讀理解](#part-7)（147~200 題，共 15 篇）\n   概念：這是閱讀理解，從單篇搭配 2 題的短文到 3 篇文章互相參照的題組都有。常見題型包括尋找主題/目的、wh- 問題（What/Where/Why/How/How long）、Not/True 是非題、推論題（包含需要對照多篇文章的「多篇文章綜合題」）、掌握說話者意圖（線上對話、簡訊常考）、單字同義詞替換，以及判斷句子該插入文章哪個位置。\n   1. [Questions 147-148 refer to the following memo.](#questions-147-148-refer-to-the-following-memo)\n      概念：公司內部備忘錄，宣布為新任區域副總裁舉辦歡迎會並簡述她過去待過的城市。考點是尋找文章目的的主旨題，以及需要比對她待過哪些城市的 Not/True 是非題。\n   2. [Questions 149-150 refer to the following text messages. ](#questions-149-150-refer-to-the-following-text-messages-)\n      概念：兩位同事用簡訊討論貿易展要準備的用品和宣傳摺頁。考點是掌握說話意圖（判斷「It isn't any trouble」的言外之意），以及需要整合對話內容的 Not/True 是非題。\n   3. [Questions 151-152 refer to the following e-mail.](#questions-151-152-refer-to-the-following-e-mail)\n      概念：房仲公司寄給新承租戶的信，說明押金保管與退還的相關規定。考點是從內容推論收件人身分的推論題，以及關於押金規定的 Not/True 是非題。\n   4. [Questions 153-155 refer to the following article.](#questions-153-155-refer-to-the-following-article)\n      概念：奈洛比國際馬拉松報名人數成長、帶動當地觀光的新聞報導。考點是今年賽事和去年有何不同的 wh- 問題（How）、關於當地觀光業的推論題，以及賽程終點地點的 wh- 問題（Where）。\n   5. [Questions 156-157 refer to the following Web page.](#questions-156-157-refer-to-the-following-web-page)\n      概念：公司推廣免費會計軟體的網頁。考點是尋找網頁目的的主旨題，以及關於公司產品／服務內容的 Not/True 是非題。\n   6. [Questions 158-160 refer to the following announcement.](#questions-158-160-refer-to-the-following-announcement)\n      概念：社區休閒中心開放兒童與青少年暑期運動課程報名的公告。考點是關於活動內容的 Not/True 是非題、報名方式的 wh- 問題（How），以及候補名額釋出時間的 wh- 問題（How long）。\n   7. [Questions 161-164 refer to the following online chat discussion. ](#questions-161-164-refer-to-the-following-online-chat-discussion-)\n      概念：市府職員線上討論如何解決城市垃圾問題、要提出哪些建議給市長的對話串。考點是被要求做什麼的 wh- 問題（What）、掌握某人發言意圖、哪些解決方案沒被提到的 Not/True 題，以及對某人身分的推論題。\n   8. [Questions 165-167 refer to the following flyer.](#questions-165-167-refer-to-the-following-flyer)\n      概念：歌手演唱會的宣傳傳單，附早鳥票贈後台通行證的優惠。考點是關於後台通行證條件的推論題、關於演唱會內容的 Not/True 是非題，以及判斷句子該插入文章哪個位置的題型。\n   9. [Questions 168-171 refer to the following e-mail.](#questions-168-171-refer-to-the-following-e-mail)\n      概念：禮品公司客服寄給顧客的信，說明訂單部分商品延遲出貨的處理方式。四題全部集中在 wh- 問題：訂單問題是什麼、關於顧客訂購狀況的推論、不回信會發生什麼事，以及要更換商品該怎麼做。\n   10. [Questions 172-175 refer to the following article.](#questions-172-175-refer-to-the-following-article)\n       概念：報導某城市即將上演音樂劇改編作品的新聞。考點是報導主旨的尋找主題題、關於這部作品的 Not/True 是非題、單字同義詞替換（realized），以及判斷句子插入位置的題型。\n   11. [Questions 176-180 refer to the following advertisement and form.](#questions-176-180-refer-to-the-following-advertisement-and-form)\n       概念：第一篇是辦公家具店的廣告，第二篇是客戶的網路訂購表格。考點包含關於辦公室工作者、LED 檯燈的 Not/True 是非題，以及需要同時對照兩篇文章才能算出運費、判斷哪項產品送贈品、公司哪天休館等細節的多篇文章綜合題。\n   12. [Questions 181-185 refer to the following letter and e-mail.](#questions-181-185-refer-to-the-following-letter-and-e-mail)\n       概念：第一篇是公司詢問飯店辦理年度高階主管退修會的信，第二篇是飯店回覆房型、會議室調整方案的電子郵件。考點包含尋找信件目的的主旨題、對公司背景的推論題、單篇文章的細節推論，以及需要對照兩封信才能算出哪種房型不夠、哪些飯店服務沒被提到的多篇文章綜合題。\n   13. [Questions 186-190 refer to the following Web page, e-mail, and invoice. ](#questions-186-190-refer-to-the-following-web-page-e-mail-and-invoice-)\n       概念：第一篇是自由撰稿人的個人網站介紹，第二篇是潛在客戶詢問合作的電子郵件，第三篇是完成案子後開立的發票。考點包含關於撰稿人背景的 Not/True 是非題、電子郵件目的的主旨題，以及需要對照多篇文章才能推論客戶熟悉哪個舊客戶、要求報價、以及她低估研究工時的多篇文章綜合題。\n   14. [Questions 191-195 refer to the following article, Web page, and map. ](#questions-191-195-refer-to-the-following-article-web-page-and-map-)\n       概念：第一篇是超市推出免費接駁車服務的新聞報導，第二篇是顧客留言反映接駁車班次問題的網頁留言，第三篇是接駁車站點地圖。考點包含開辦接駁車原因的 wh- 問題（Why）、需對照地圖確認站名的多篇文章 Not/True 題、需要對照留言與地圖才能算出顧客週末用哪一站的 wh- 問題、關於顧客意見的 Not/True 是非題，以及單字同義詞替換（presents）。\n   15. [Questions 196-200 refer to the following article, advertisement, and receipt. ](#questions-196-200-refer-to-the-following-article-advertisement-and-receipt-)\n       概念：第一篇是服飾店即將在購物中心展店的新聞報導，第二篇是該店開幕特賣的廣告，第三篇是顧客消費後拿到的收據。考點包含尋找報導主旨的主題題、單字同義詞替換，以及需要對照廣告與收據等多篇文章才能確認促銷內容是否符合、算出折扣金額的多篇文章綜合題。\n\n-----------------------------------------------------------\n\n<!-- page 414 -->\n\n# TEST 08\nPart 5 翻譯・解說\nPart 6 翻譯・解說 🆕\nPart 7 翻譯・解說 🆕\n\n<!-- page 415 -->\n## PART 5\n\n**101.** 答案 (A)｜難度：高\nNew assignments will be handed out after the team members ______ working on last week's project.\n- (A) finish\n- (B) to finish\n- (C) finished\n- (D) will finish\n\n> 新的作業會在小組成員完成上週的研究課題後發放。\n\n**〔動詞位置〕現在式**\n從屬子句（after ~ project）缺少動詞，所以動詞 (A)、(C)、(D) 是可能的答案。主要子句（New assignments ~ handed out）的動詞（will be）是未來式，所以 after 引導的從屬子句（after ~ project）也表示未來的事情，但表時間或條件的副詞子句會用現在式表示未來，所以現在式 (A) finish（完成，結束）是正確答案。過去式 (C) 和未來式 (D) 則不適用。to 不定詞 (B) 不能用在動詞的位置。\n\n**單字** assignment (n.) 作業，工作任務；hand out (phr.) 分發\n\n**102.** 答案 (C)｜難度：高\nMuseum management reminds all visitors not to leave their children ______ inside the building.\n- (A) unfamiliar\n- (B) invisible\n- (C) unattended\n- (D) inattentive\n\n> 博物館管理團隊提醒所有訪客，在建築物內不要讓孩童無人看管。\n\n**形容詞詞彙**\n文意是「不要讓孩童無人看管」，所以形容詞 (C) unattended（無人看管的）是正確答案。(A) unfamiliar 表示「不熟悉的，陌生的」，(B) invisible 表示「看不見的」，(D) inattentive 表示「不注意的」。另外，也請記得 leave A unattended（使 A 無人看管）這個慣用語。\n\n**單字** management (n.) 管理、經營團隊；remind (v.) 提醒，使想起\n\n**103.** 答案 (A)｜難度：低\nAfter working abroad for years, Alice Strepp was surprised when the company relocated her ______ the headquarters.\n- (A) to\n- (B) out\n- (C) onto\n- (D) through\n\n> 在國外工作幾年後，Alice Strepp 對於公司把她調到總部感到很驚訝。\n\n**選擇介系詞** 方向\n因為要表示「公司把她調到總部」的意思，所以表示方向或目的地的介系詞 (A) to（到⋯）是正確答案。(B) out 常以「out of」的形式使用，表示「往⋯的外面」，(C) onto 表示「到⋯上面」，(D) through 表示「穿過⋯」。\n\n**單字** abroad (adv.) 在國外，到國外；surprised (adj.) 感到驚訝的；relocate (v.) 調動，搬遷；headquarters (n.) 總部，總公司\n\n**104.** 答案 (B)｜難度：低\nThe train departing from Vancouver to Calgary ______ a full day, so many travelers prefer going by plane.\n- (A) take\n- (B) takes\n- (C) has taken\n- (D) to take\n\n> 從溫哥華出發到卡加利的列車要花一整天，所以許多旅客偏好搭飛機去。\n\n**〔動詞位置〕現在式**\nso 前面的子句（The train ~ a full day）有第三人稱單數主詞（The train）而缺少動詞，所以能搭配第三人稱單數主詞使用的 (B) 和 (C) 是可能的答案。so 後面的子句（many travelers ~ by plane）的動詞（prefer）是現在式，而且句子表示一般性的事實「因為列車要花一整天，所以旅客偏好搭飛機」，所以現在式 (B) takes（花費，需要）是正確答案。現在完成式 (C) 表示從過去開始發生，一直持續到現在或剛結束的事情，或者過去的經驗，以及過去發生但影響持續到現在的事情。動詞原形 (A) 用在助動詞後面，或者搭配複數主詞使用，而 to 不定詞 (D) 不能用在動詞的位置。\n\n**單字** depart (v.) 出發，離開；a full day (phr.) 整整一天；prefer (v.) 偏好，比較喜歡\n\n<!-- page 416 -->\n**105.** 答案 (C)｜難度：中\nThe famous paintings to be auctioned off by the Heritage Society are kept ______ in a locked location.\n- (A) certain\n- (B) realistic\n- (C) secure\n- (D) confident\n\n> Heritage 協會將要拍賣的名畫保管在上了鎖的地點。\n\n**形容詞詞彙**\n文意是「名畫被放在上了鎖的地點保持安全」，所以形容詞 (C) secure（安全的）是正確答案。(A) certain 表示「確定的」，(B) realistic 表示「實際的」，(D) confident 表示「有信心的」。另外，請注意這個句子是將「keep + 受詞（The famous paintings）+ 受詞補語（secure）」句型改為被動態，所以動詞（kept）後面直接接了形容詞（secure）。\n\n**單字** auction off (phr.) 拍賣；lock (v.) 鎖，鎖上\n\n**106.** 答案 (B)｜難度：中\nMr. Wilkins would like some ______ setting up the audio-visual equipment in the conference room before the seminar on Thursday.\n- (A) assisted\n- (B) assistance\n- (C) assistant\n- (D) assisting\n\n> Wilkins 先生希望在星期四的研討會前能獲得在會議室設置影音設備的協助。\n\n**〔名詞位置〕限定詞與名詞**\n能被空格前面的限定詞（some）修飾的是名詞，所以名詞 (B) 和 (C) 是可能的答案。因為要表示「想要一些設置影音設備的協助」的意思，所以 (B) assistance（協助）是正確答案。some 也可以用在單數形的可數名詞前面，但這時候是表示「某個」的意思，所以如果使用 (C) assistant（助理），意思會變成「想要有某個在設置影音設備的助理」，所以不對。動詞或分詞 (A)、動名詞或分詞 (D) 不能被限定詞修飾。另外，請注意如果動詞 would like 是直接接動名詞 setting up 當受詞的話，能修飾 setting up 的會是副詞而不是形容詞。\n\n**單字** set up (phr.) 設置；audio-visual (adj.) 視聽的\n\n**107.** 答案 (B)｜難度：中\nFor every $200 purchase of Billow Swimwear, shoppers will receive ______ a towel or a pair of slippers.\n- (A) also\n- (B) either\n- (C) until\n- (D) neither\n\n> 顧客在 Billow Swimwear 購買金額達 200 美元，即可獲得一條毛巾或一雙拖鞋。\n\n**相關連接詞**\n能和空格後面的 or（或者）搭配形成相關連接詞 either A or B（A 或 B 其中任一個）的 (B) either（兩者中任何一個）是正確答案。另外，請注意這個句子裡的 either 連接的是名詞（a towel）和名詞（a pair of slippers）。(A) also 是表示「也」的副詞，可形成相關連接詞 not only A but also B（不止 A，B 也是）。(C) until 是表示「直到⋯」的介系詞或副詞子句連接詞。(D) neither 會和 nor 形成相關連接詞 neither A nor B（A 和 B 都不是）。\n\n**單字** a pair of (phr.) 一對的；slipper (n.) 拖鞋\n\n**108.** 答案 (C)｜難度：中\nMark Hempel offered his full ______ on a project that is developing a new TV show about international cultures.\n- (A) cooperates\n- (B) cooperative\n- (C) cooperation\n- (D) cooperatively\n\n> 對於開發有關國際文化的新電視節目的計畫，Mark Hempel 全力配合。\n\n**名詞位置**\n能被形容詞（full）修飾的是名詞，所以名詞 (C) cooperation（合作）是正確答案。動詞 (A)、形容詞 (B)、副詞 (D) 都不能被形容詞修飾。\n\n**單字** full (adj.) 完全的，最大的，滿的；international (adj.) 國際的；culture (n.) 文化\n\n<!-- page 417 -->\n**109.** 答案 (A)｜難度：高\nThe restaurant ______ the right to refuse service to customers who are not dressed appropriately.\n- (A) reserves\n- (B) relates\n- (C) collects\n- (D) allows\n\n> 對於穿著不當的顧客，這間餐廳保留拒絕服務的權利。\n\n**動詞詞彙**\n文意是「這間餐廳保留拒絕服務的權利」，所以 reserve（保留）的第三人稱單數形 (A) reserves 是正確答案。(B) 的動詞 relate 表示「有關聯，聯繫」，(C) 的 collect 表示「收集」，(D) 的 allow 表示「允許」。另外，請記住「reserve the right to + 動詞原形（保留⋯的權利）」這個慣用語。\n\n**單字** dress (v.) 穿衣服，裝扮；appropriately (adv.) 適合地\n\n**110.** 答案 (C)｜難度：低\nThe Bolden School now offers courses for those ______ in learning a variety of pottery production methods.\n- (A) interesting\n- (B) interest\n- (C) interested\n- (D) interestingly\n\n> Bolden 學校現在為有興趣學習各種陶器製作方式的人提供課程。\n\n**〔形容詞位置〕現在分詞 vs. 過去分詞**\n能修飾空格前方指示代名詞（those）的是形容詞，或者能當形容詞用的分詞，所以現在分詞 (A) 和過去分詞 (C) 是可能的答案。被修飾的名詞（those）和分詞表示「人被引起興趣（感到有興趣）」的被動意義，所以動詞 interest（引起⋯的興趣）的過去分詞 (C) interested 是正確答案。現在分詞 (A) 因為空格中的動詞（interest）後沒有受詞，所以不對。動詞或名詞 (B) 和副詞 (D) 不能修飾名詞。像 interest 這種表示引起感情的動詞，如果修飾表示情感原因的名詞，就用現在分詞；如果修飾感受到情感的名詞，就用過去分詞。\n\n**單字** course (n.) 課程；pottery (n.) 陶器；method (n.) 方式，方法\n\n**111.** 答案 (C)｜難度：中\nFor train passengers with excess luggage, FineTrak Railways will impose a fee of $13 for every ______ bag.\n- (A) promising\n- (B) connected\n- (C) additional\n- (D) damaged\n\n> 對於攜帶超量行李的列車乘客，FineTrak 鐵路將對每件額外行李收取 13 美元的費用。\n\n**形容詞詞彙**\n文意是「每多一個包包收 13 美元的費用」，所以形容詞 (C) additional（額外的）是正確答案。(A) promising 表示「前途有望的」，(B) connected 表示「連在一起的，有關聯的」，(D) damaged 表示「損壞的」。\n\n**單字** excess (adj.) 超過的，過量的；(n.) 超過；luggage (n.) 行李；impose (v.) 課徵（費用）\n\n**112.** 答案 (A)｜難度：低\nThe charity does not accept food donations that have ______ expired because such items could be hazardous to recipients.\n- (A) already\n- (B) never\n- (C) more\n- (D) occasionally\n\n> 這間慈善機構不接受已經過期的食物捐贈，因為這種食物可能對收受者有害。\n\n**選擇副詞** 時間副詞\n要表達的意思是「不接受已經過期的食物捐贈，因為這種食物可能對收受者有害」，所以副詞 (A) already（已經）是正確答案。(B) never 表示「絕不⋯」，(C) more 表示「更加」，(D) occasionally 表示「偶爾」。\n\n**單字** charity (n.) 慈善機購，慈善；accept (v.) 接受，承認；donation (n.) 捐贈，捐贈品；expire (v.) 過期，到期；hazardous (adj.) 危險的，有害的；recipient (n.) 接受者\n\n<!-- page 419 -->\n**113.** 答案 (D)｜難度：低\nSales for Cubix's tablet computer were ______ growing last year, but there has been a slight decline in the past few months.\n- (A) consisting\n- (B) consisted\n- (C) consistency\n- (D) consistently\n\n> 去年 Cubix 平板電腦的銷量持續成長，但過去幾個月稍微下跌。\n\n**副詞位置**\n能修飾動詞（were growing）的是副詞，所以副詞 (D) consistently（持續地）是正確答案。動名詞或分詞 (A)、動詞或分詞 (B)、名詞 (C) 都不能修飾動詞。\n\n**單字** slight (adj.) 些微的，少量的；decline (n.) 下降；(v.) 下降；consist (v.) 構成，組成；consistency (n.) 一貫，一貫性\n\n**114.** 答案 (B)｜難度：中\nThe report ______ mentioned an upcoming merger between a textile company in Peru and a fashion corporation in France.\n- (A) intensely\n- (B) briefly\n- (C) structurally\n- (D) anymore\n\n> 報告簡短地提到一家祕魯紡織公司與一家法國時尚企業即將進行的合併。\n\n**副詞詞彙**\n文意是「報告簡短地提到即將進行的合併」，所以 (B) briefly（簡短地）是正確答案。(A) intensely 表示「強烈地」，(C) structurally 表示「結構上」，(D) anymore 表示「再也（不）」。\n\n**單字** merger (n.) 合併；textile (adj.) 紡織的；(n.) 紡織品\n\n**115.** 答案 (D)｜難度：高\n______ at least five participants sign up for the seminar, it will carry on as planned next weekend.\n- (A) Unless\n- (B) Rather than\n- (C) Instead\n- (D) As long as\n\n> 只要有至少五名參加者報名，研討會就會在下週末依計畫進行。\n\n**〔引導修飾語的成分〕副詞子句連接詞** 條件\n這個句子是有主詞（it）和動詞（will carry on）的完整句，所以 ______ ~ seminar 的部分視為修飾語。這個修飾語是有動詞（sign up for）的修飾子句，所以能引導修飾子句的副詞子句連接詞 (A) 和 (D) 是可能的答案。因為要表示「只要有至少五名參加者報名，研討會就會在下週末進行」的意思，所以表條件的 (D) As long as（只要⋯）是正確答案。(A) Unless 表示「除非⋯」，意思會變成「除非有至少五名參加者報名，不然研討會就會在下週末進行」，並不恰當。(B) Rather than 表示「而不是⋯」，後面會接片語而不是子句，而 (C) Instead 是表示「替代，改為」的副詞，不能引導子句。\n\n**單字** participant (n.) 參加者，參與者；sign up for (phr.) 報名⋯；carry on (phr.) 進行，繼續\n\n**116.** 答案 (C)｜難度：中\nWithdrawals from Barstow Bank's automated teller machines will now be ______ to $2,500 a day per customer.\n- (A) assigned\n- (B) adhered\n- (C) limited\n- (D) enclosed\n\n> 從 Barstow 銀行自動櫃員機進行的提款，現在起將限制為每位顧客每天 2,500 美元。\n\n**動詞詞彙**\n文意是「提款現在被限制為每位顧客每天 2,500 美元」，所以動詞 limit（限制）的 p.p. 形 (C) limited 是正確答案。(A) 的動詞 assign 表示「分派」，(B) 的 adhere 表示「黏附」，(D) 的 enclose 表示「圍繞」。\n\n**單字** withdrawal (n.) 提款，取回；automated teller machine (phr.) 自動櫃員機（ATM）\n\n<!-- page 420 -->\n**117.** 答案 (B)｜難度：最高\nThe financial consultant ______ Ms. Broderick to downsize the staff at the Denver branch to lower operational expenses.\n- (A) suggested\n- (B) advised\n- (C) commented\n- (D) argued\n\n> 財務顧問建議 Broderick 小姐縮減丹佛分公司的人員數以降低營運開支。\n\n**意義相近的動詞**\n主詞（The financial consultant）後面有受詞（Ms. Broderick）和受詞補語（to downsize the staff），而文意是「建議縮減人員數以降低營運開支」，所以能接 to 不定詞當受詞補語的第 5 類句型動詞 advise（建議，忠告）的過去式 (B) advised 是正確答案（advise A to do：建議 A 做⋯）。(A) 的動詞 suggest 表示「建議」，(C) 的 comment 表示「評論」，(D) 的 argue 表示「主張」，但這些動詞都不能接 to 不定詞當受詞補語。\n\n**單字** consultant (n.) 顧問；downsize (v.) 縮小（規模）；operational (adj.) 營運的，經營上的；expense (n.) 開支，費用\n\n**118.** 答案 (D)｜難度：中\n______ tough competition in the market, HiMobile continues to be the top cellular phone manufacturer in Asia.\n- (A) Concerning\n- (B) Except\n- (C) Above\n- (D) Despite\n\n> 儘管市場上的競爭激烈，HiMobile 公司仍然是亞洲第一的行動電話製造商。\n\n**選擇介系詞** 讓步\n要表達的意思是「儘管市場上有激烈的競爭，仍然持續保有第一名的行動電話製造商地位」，所以表讓步的介系詞 (D) Despite（儘管有⋯）是正確答案。另外，也請記得和 despite 意義相同的介系詞 in spite of。(A) Concerning 表示「關於⋯」。(B) Except「除了⋯」表示除外，(C) Above「在⋯上方」表示位置。\n\n**單字** tough (adj.) 艱難的，堅固的；competition (n.) 競爭，比賽\n\n**119.** 答案 (B)｜難度：中\nScientists have been saying for years that solar energy has incredible ______ to become the world's leading power source.\n- (A) insight\n- (B) potential\n- (C) activity\n- (D) permission\n\n> 科學家們這幾年一直在說，太陽能有極大的潛力成為世界上的主要能源。\n\n**名詞詞彙**\n文意是「有能夠成為世界主要能源的驚人潛力」，所以名詞 (B) potential（可能性，潛力）是正確答案。(A) insight 表示「洞察力，洞見」，(C) activity 表示「活動」，(D) permission 表示「允許」。\n\n**單字** solar (adj.) 太陽的；incredible (adj.) 令人難以置信的，驚人的；leading (adj.) 領導的，主要的\n\n**120.** 答案 (C)｜難度：中\nGrandilla cosmetics are available ______ Harmony products are sold, including Chester Department Stores.\n- (A) anytime\n- (B) sometime\n- (C) everywhere\n- (D) someplace\n\n> Grandilla 化妝品於任何 Harmony 公司產品販售處皆有售，包括 Chester 百貨。\n\n**〔引導修飾語的成分〕選擇副詞**\n這個句子是有主詞（Grandilla cosmetics）、動詞（are）、補語（available）的完整句，所以 ______ Harmony products ~ Department Stores 的部分視為修飾語。這個修飾語是有動詞（are sold）的修飾子句，所以選項中能引導修飾子句，且具有連接詞功能的副詞 (C) everywhere（在所有地方）是正確答案。副詞 (A) anytime（任何時候）、副詞或形容詞 (B) sometime（某個時候；從前的）、副詞或代名詞 (D) someplace（在某處；某處）不能引導這裡的修飾子句。\n\n**單字** cosmetics (n.) 化妝品；department store (phr.) 百貨公司\n\n<!-- page 421 -->\n\n**121.** 答案 (A)｜難度：低\nThe food industry is governed by many regulations, which ______ at Benagra Foods keep track of carefully.\n- (A) we\n- (B) us\n- (C) ours\n- (D) ourselves\n\n> 食品業受到許多規定管制，而我們 Benagra 食品公司很仔細地掌握這些規定。\n\n**〔主詞位置〕人稱代名詞的格**\nwhich 引導的關係子句（which ~ carefully）缺少主詞，所以能用在主詞位置的人稱代名詞主格 (A) 和所有代名詞 (C) 是可能的答案。因為要表示「我們仔細地掌握」的意思，所以人稱代名詞主格 (A) we 是正確答案。如果用所有代名詞 (C) 的話，意思會變成「我們的什麼很仔細地掌握這些規定」，並不恰當。人稱代名詞受格 (B) 和反身代名詞 (D) 不能當主詞。另外，反身代名詞是表示與主詞相同人事物的受詞，也可以用來強調主詞或受詞「自己」。\n\n**單字** govern (v.) 管理，統治；regulation (n.) 規定；keep track of (phr.) 掌握…的動態，記錄；carefully (adv.) 小心地，謹慎地\n\n**122.** 答案 (D)｜難度：中\nThe singer Arthur Fischman ______ his recital with a short Japanese piece that was unusual for the end of a concert.\n- (A) is concluding\n- (B) was concluded\n- (C) to conclude\n- (D) concluded\n\n> 歌手 Arthur Fischman 以音樂會結尾少見的簡短日語歌曲結束他的獨唱會。\n\n**〔動詞位置〕動詞的單複數、時態、語態要正確**\n句中缺少動詞，所以動詞 (A)、(B)、(D) 是可能的答案。空格後面有受詞（his recital），而且 that 子句（that ~ a concert）使用過去式，可知獨唱會是過去的事情。所以，主動態過去式 (D) concluded 是正確答案。現在進行式 (A) 表示表演現在進行中或未來即將舉行，與文意不符。被動態 (B) 不能接受詞。to 不定詞 (C) 不能用在動詞的位置。\n\n**單字** recital (n.) 獨奏會，獨唱會；piece (n.) （簡短的）曲子，作品，一片；unusual (adj.) 不尋常的，獨特的；conclude (v.) 結束，下結論\n\n**123.** 答案 (A)｜難度：高\nAt a meeting of finance ministers, Mr. Yao made an urgent ______ for assistance with his country's economic problems.\n- (A) plea\n- (B) index\n- (C) outcome\n- (D) clue\n\n> 在（多國）財政部長的會議上，Yao 先生緊急請求對於自國經濟問題的援助。\n\n**名詞詞彙**\n文意是「緊急請求對於自國經濟問題的援助」，所以名詞 (A) plea（請求，懇求）是正確答案。請記得 make a plea（提出請求）這個慣用說法。(B) index 表示「索引，指數」，(C) outcome 表示「結果」，(D) clue 表示「線索，提示」。\n\n**單字** minister (n.) （政府）部長，神職人員；urgent (adj.) 緊急的，迫切的\n\n**124.** 答案 (C)｜難度：中\nAll publications at the West End Book Store are categorized and arranged on shelves ______ subject and genre.\n- (A) in order to\n- (B) enabling\n- (C) according to\n- (D) alike\n\n> West End 書店的所有出版物都依照主題與類型分類排列在架上。\n\n**選擇介系詞** 其他\n因為要表示「所有出版物都依照主題與類型分類排列」的意思，所以介系詞 (C) according to（依照…）是正確答案。(A) in order to 表示「為了…」，其中的 to 是不定詞的 to，後面接動詞原形。使用 (B) enabling 的話，意思會變成「以使主題與類型成為可能的方式分類排列」，並不恰當。(D) alike（相似的；相似地）當形容詞時不能在名詞前面做修飾，而當副詞時要用在句尾，或者像「old and young alike」一樣放在兩個以上的比較對象後面。\n\n**單字** categorize (v.) 分類；arrange (v.) 整理，安排；shelf (n.) 架子；subject (n.) 主題，科目，對象；genre (n.) （作品的）類型\n\n<!-- page 422 -->\n\n**125.** 答案 (D)｜難度：中\nRepair services or exchanges for all of Dunway Electronics' devices may be requested at any ______ dealer across the country.\n- (A) authorization\n- (B) authority\n- (C) authorize\n- (D) authorized\n\n> Dunway Electronics 公司所有產品的維修服務或更換，可以在全國任何授權經銷商申請。\n\n**形容詞位置**\n能修飾空格後方名詞（dealer）的是形容詞，所以形容詞 (D) authorized（經授權的）是正確答案。名詞 (A) 和 (B)、動詞 (C) 都不能修飾名詞。另外，請記得 authorization 表示做某件事情的授權或委任，authority 表示有權力的個人或團體，或者能做某事的權力或權威。\n\n**單字** device (n.) 裝置，設備；dealer (n.) 經銷商\n\n**126.** 答案 (C)｜難度：高\nManagers formerly ______ the software engineering groups for the development project will now be in charge of much larger teams.\n- (A) supervise\n- (B) supervised\n- (C) supervising\n- (D) supervisor\n\n> 先前為開發案監督軟體工程小組的經理，現在將負責大上許多的團隊。\n\n**〔引導修飾語的成分〕現在分詞 vs. 過去分詞**\n這個句子是有主詞（Managers）和動詞（will be）的完整句，所以 formerly ____ the software ~ project 的部分視為修飾語。這個修飾語修飾名詞（Managers），所以能在名詞後面做修飾的過去分詞 (B) 和現在分詞 (C) 是可能的答案。被修飾的名詞（Managers）和分詞表示「經理監督小組」的主動意義，所以 supervise（監督）的現在分詞 (C) supervising 是正確答案。如果用過去分詞 (B) supervised（受監督的），會變成被動意義「經理受到監督」，而且後面不能接受詞。動詞 (A) 和名詞 (D) 不能引導修飾語。\n\n**單字** formerly (adv.) 以前，從前；in charge of (phr.) 負責…的\n\n**127.** 答案 (D)｜難度：高\nBecause the cost of the ______ in the factory equipment was higher than the owner had expected, he only purchased one new machine.\n- (A) cover\n- (B) blame\n- (C) depth\n- (D) investment\n\n> 因為對於工廠設備的投資成本高於業主先前預期，所以他只採購了一台新機器。\n\n**名詞詞彙**\n文意是「因為工廠設備投資成本很高，所以只採購了一台新機器」，所以名詞 (D) investment（投資）是正確答案。(A) cover 表示「蓋子，封面」，(B) blame 表示「責備，過錯的責任」，(C) depth 表示「深度」。\n\n**單字** factory (n.) 工廠；equipment (n.) 設備，裝備；expect (v.) 預期，期待；purchase (v.) 購買；(n.) 購買，購買的東西\n\n<!-- page 423 -->\n\n**128.** 答案 (C)｜難度：高\nAll personnel at the factory, ______ those under contract with an outside firm, get paid time off on national holidays.\n- (A) excludes\n- (B) exclusive\n- (C) excluding\n- (D) exclusively\n\n> 工廠所有人員，除了與外部公司簽約（雇用）的員工以外，在國定假日時都能有薪休假。\n\n**修飾語**\n這個句子是有主詞（All personnel）、動詞（get）、受詞（paid time off）的完整句，而空格所在的片語部分在兩個逗號中間，所以 ____ those ~ firm 的部分視為修飾語。這個修飾語是沒有動詞的修飾片語，所以能引導修飾片語的分詞 (C) excluding 是正確答案。另外，excluding 也可以視為表示「除了…以外」的介系詞。動詞 (A) 和副詞 (D) 不能引導修飾片語，形容詞 (B) 要改為 exclusive of（除了…以外）的形態才能引導修飾片語。(D) exclusively（僅僅，獨有地）即使視為修飾整個片語的副詞，所表達的意思「只有那些和外部公司簽約的員工」還是不恰當，所以不對。\n\n**單字** personnel (n.) 全體人員，全體員工；contract (n.) 合約，契約；outside (adj.) 外部的，外面的；paid time off (phr.) 有薪休假；exclude (v.) 排除\n\n**129.** 答案 (C)｜難度：中\nStaff attending the picnic can bring ______ food they would like to share with the group besides burgers, which will be provided.\n- (A) whenever\n- (B) whomever\n- (C) whatever\n- (D) wherever\n\n> 除了將會提供的漢堡以外，參加野餐的員工可以帶任何想要和小組分享的食物。\n\n**〔名詞子句連接詞〕複合關係代名詞 whatever**\n能當動詞（can bring）的受詞，而且能修飾空格後方名詞（food），兼具形容詞功能的複合關係代名詞 (C) whatever（無論什麼）是正確答案。複合關係副詞 (A) whenever（無論什麼時候）和 (D) wherever（無論哪裡）引導副詞性質的子句，而複合關係代名詞 (B) whomever（無論對誰）則是當名詞或引導副詞性質的子句。\n\n**單字** share (v.) 分享，共有；(n.) 一份；besides (prep.) 除了…還有\n\n**130.** 答案 (D)｜難度：最高\nIn ______ with the health department's stipulations, restaurant owners must conduct food safety sessions with kitchen staff.\n- (A) participating\n- (B) pursuing\n- (C) concurring\n- (D) keeping\n\n> 為了符合衛生部門的規定，餐廳業主必須對廚房員工進行食品安全課程。\n\n**與名詞連用的介系詞慣用語**\n因為要表示「為了符合衛生部門的規定」的意思，所以能和空格前的 In、空格後的 with 形成慣用語 in keeping with（與…一致，符合…）的動名詞 (D) keeping（保持）是正確答案。(A) 的動詞 participate 表示「參與」，(B) 的 pursue 表示「追求」，(C) 的 concur 表示「同意」。\n\n**單字** stipulation (n.) 條款，規定；conduct (v.) 實施，進行；safety (n.) 安全\n\n<!-- page 424 -->\n\n## PART 6\n\n### Questions 131-134 refer to the following letter. 🆕\n131-134 題參照以下信件。\n\n> September 18\n>\n> Dear Ms. Murillo,\n>\n> Thank you for inquiring about our services for obtaining ______(131).\n>\n> Based on the information in your letter, your daughter may have acquired citizenship by being the child of a U.S. citizen. This will need to be ______(132) through documentation, which was not included with your letter. Your child's record of birth abroad is considered proof if it was registered with a U.S. consulate or embassy. ______(133), the parent with citizenship must have been living in the United States for at least five years before your child's birth.\n>\n> For more information, feel free to visit us. Our Web site provides the address of the local office in your area. Simply click on the state or country you presently live in. ______(134). Please bring all related documents when you visit.\n>\n> Sincerely,\n>\n> Sonia Esteban\n\n**翻譯**\n> 9 月 18 日\n>\n> 親愛的 Murillo 小姐：\n>\n> [131]感謝您詢問我們取得國籍的服務。\n>\n> 根據您信件中的資訊，您的女兒可能已經因為身為美國公民子女而取得公民身分。[132]這仍然需要文件證實，而您的信件並未附上證明文件。貴子女的海外出生紀錄如經美國領事館或大使館登記，即可視為證明。[133]此外，擁有公民身分的家長必須於貴子女出生前居住美國至少五年。\n>\n> 欲獲得更多資訊，歡迎您隨時來訪。我們的網站提供您區域內的地方辦事處地址。只要點擊您目前居住的州或國家即可。[134]然後您就可以選擇離您最近的政府辦事處。前往時請攜帶所有相關文件。\n>\n> Sonia Esteban\n\n**131.**\n- (A) healthcare\n- (B) transportation\n- (C) nationality\n- (D) education\n\n**132.**\n- (A) decorated\n- (B) verified\n- (C) corrected\n- (D) postponed\n\n**133.**\n- (A) Afterward\n- (B) For example\n- (C) Additionally\n- (D) Henceforth\n\n**134.** 🆕\n- (A) We are sorry to hear that your documents are lost.\n- (B) There is no record of your child's birth in that country.\n- (C) You can then select the government office nearest you.\n- (D) The office in your area was closed only last year.\n\n**單字** inquire (v.) 詢問；acquire (v.) 取得，獲得；citizenship (n.) 公民權，公民身分；documentation (n.) 證明文件；proof (n.) 證明，證據；consulate (n.) 領事館；embassy (n.) 大使館；local office (phr.) 地方辦公室；presently (adv.) 目前，現在\n\n<!-- page 425 -->\n\n**131.** 答案 (C)｜難度：中\n**名詞詞彙** 參考全文\n文意是「感謝您詢問取得 ____ 的服務」，所有選項都是可能的答案。因為無法從空格所在的句子判斷答案，所以必須參考空格前後或文章整體的內容。文章前面部分對於能否獲得公民身分進行說明，並且提到是美國公民的女兒、需要出生紀錄作為證明文件，可知 Murillo 小姐問的應該是取得國籍的相關事宜，所以 (C) nationality（國籍）是正確答案。(A) healthcare 表示「健康照護，醫療保健」，(B) transportation 表示「交通運輸」，(D) education 表示「教育」。\n\n**132.** 答案 (B)｜難度：高\n**動詞詞彙**\n文意是「是否已經取得公民身分需要文件證實」，所以動詞 verify（證實）的 p.p. 形 (B) verified 是正確答案。(A) 的動詞 decorate 表示「裝飾」，(C) 的 correct 表示「修正」，(D) 的 postpone 表示「使延期」。\n\n**133.** 答案 (C)｜難度：高\n**連接副詞** 參考上下文\n空格和逗號一起出現在句首的連接副詞位置，所以要判斷空格所在的句子和上一個句子的關係再作答。上一句提到，如果海外出生紀錄經過美國領事館或大使館登記，就可以視為證明，而空格所在的句子說擁有公民身分的家長必須在小孩出生前居住美國至少五年，所以表示補充說明上一句內容的 (C) Additionally（附加地，此外）是正確答案。(A) Afterward 表示「之後」，(B) For example 表示「舉例來說」，(D) Henceforth 表示「從此以後」，用在這裡的意思都不恰當。\n\n**134.** 🆕 答案 (C)｜難度：中\n**選出空格中正確的句子**\n這是選擇句子的題目，所以要參考空格前後或文章整體的內容。前面部分提到網站上有對方區域內的地方辦公室地址，而空格所在句子的上一句說點擊目前居住的州或國家即可，所以空格的內容應該和找出距離最近的辦公室有關，正確答案是 (C) You can then select the government office nearest you。\n\n**選項翻譯**\n- (A) 我們很遺憾得知您的文件遺失了。\n- (B) 沒有貴子女於該國出生的紀錄。\n- (C) 然後您就可以選擇離您最近的政府辦事處。\n- (D) 您區域內的辦公室去年剛關閉。\n\n**單字** government office (phr.) 政府辦事處\n\n<!-- page 426 -->\n\n### Questions 135-138 refer to the following letter. 🆕\n135-138 題參照以下信件。\n\n> May 30\n> Cayman Interior Decorating\n> 23 Arbor Drive\n> Cleveland, Ohio, 39005\n>\n> Dear Mr. Maximus,\n>\n> I am writing to ______(135) you and your crew for redecorating the interior of our lobby. The results are even better than we had initially expected. ______(136). Overall, our guests appreciate the new look, and they love the authentic 1920s ______(137) and the comfortable furniture.\n>\n> We thought we'd mentioned that the hotel intends to renovate the guest rooms. If things go according to plan, we expect to begin renovating next month. In addition, we ______(138) expanding the business center on the second floor. More space will be allocated to permit the installation of new facilities.\n>\n> I would like to contact you again once our plans become more definite. We hope that your calendar will permit you to work for us when we are ready.\n>\n> I look forward to hearing from you soon.\n>\n> Sincerely,\n> Devon Green\n> Manager, Nuance Hotel\n\n**翻譯**\n> 5 月 30 日\n> Cayman 室內裝潢公司\n> 23 號，Arbor 路\n> 克里夫蘭，俄亥俄州 39005\n>\n> 親愛的 Maximus 先生：\n>\n> [135]我寫這封信是要稱讚您和您的團隊對我們大廳所做的室內重新裝潢。成果甚至比我們起初預期的還要好。[136]我們對於完工速度之快也同樣印象深刻。[137]大致上，我們的賓客喜歡新的風貌，他們也喜愛純正的 1920 年代氛圍與舒適的家具。\n>\n> 我們應該提過飯店希望整修客房。如果事情照計畫進行的話，我們預計下個月開始整修。[138]另外，我們將會擴大二樓的商務中心。那裡將會分配到更多空間，讓新設備能夠裝設。\n>\n> 我想在計畫更明確時再次聯絡您。我們希望當我們準備好的時候，您的行事曆安排能容許您為我們工作。\n>\n> 期待很快得到您的回覆。\n>\n> Devon Green\n> 經理，Nuance 飯店\n\n**135.**\n- (A) commend\n- (B) persuade\n- (C) invoice\n- (D) encourage\n\n**136.** 🆕\n- (A) We would have preferred it if you had followed our original plan.\n- (B) They contacted us to let us know what they thought about our work.\n- (C) We are equally impressed by how quickly the job was done.\n- (D) They should have informed us right away about these changes.\n\n**137.**\n- (A) explanation\n- (B) atmosphere\n- (C) combination\n- (D) condition\n\n**138.**\n- (A) were\n- (B) will be\n- (C) are being\n- (D) have been\n\n**單字** crew (n.) 全體工作人員；redecorate (v.) 重新裝潢；initially (adv.) 起初；authentic (adj.) 真正的，正宗的；renovate (v.) 翻新，整修；guest room (phr.) 客房；expand (v.) 擴張，擴大；allocate (v.) 分配；permit (v.) 允許，容許；installation (n.) 安裝，設置；facility (n.) 設備，能力；definite (adj.) 明確的，確切的\n\n<!-- page 427 -->\n\n**135.** 答案 (A)｜難度：高\n**動詞詞彙** 參考上下文\n文意是「我寫這封信是要 ____ 您和您的團隊對我們大廳所做的室內重新裝潢」，(A)、(C)、(D) 是可能的答案。因為無法從空格所在的句子判斷答案，所以必須參考空格前後或文章整體的內容。下一句提到成果比起初預期的還要好，所以動詞 (A) commend（稱讚）是正確答案。(B) persuade 表示「說服」，(C) invoice 表示「為…開發票」，(D) encourage 表示「鼓勵」。\n\n**136.** 🆕 答案 (C)｜難度：高\n**選出空格中正確的句子**\n這是選擇句子的題目，所以要參考空格前後或文章整體的內容。上一句「The results are even better than we had initially expected.」提到成果甚至比起初預期的還要好，所以空格的內容應該和對裝潢的稱讚有關，正確答案是 (C) We are equally impressed by how quickly the job was done。\n\n**選項翻譯**\n- (A) 我們當時希望您遵守我們原定的計畫。\n- (B) 他們聯絡了我們，告知他們對我們的施工有什麼想法。\n- (C) 我們對於完工速度之快也同樣印象深刻。\n- (D) 他們當時應該馬上通知我們這些變更的。\n\n**單字** original (adj.) 原本的，獨創的；inform (v.) 通知，告知\n\n**137.** 答案 (B)｜難度：中\n**名詞詞彙**\n文意是「喜愛純正的 1920 年代氛圍與舒適的家具」，所以 (B) atmosphere（氣氛）是正確答案。(A) explanation 表示「說明，解釋」，(C) combination 表示「結合，組合」，(D) condition 表示「條件，狀態」。\n\n**138.** 答案 (B)｜難度：中\n**未來式** 參考上下文\n文意是「擴大二樓的商務中心」，因為無法從空格所在的句子判斷適當的動詞時態，所以必須參考空格前後或文章整體的內容。上一句提到預計下個月開始整修，可知擴大二樓的商務中心是未來的事情，所以 (B) will be 是正確答案。(C) 如果後面接過去分詞的話，可以形成「be + being + p.p.」，表示「（不久的未來）即將被…」的意思，但這裡的空格後面是 -ing 形（expanding），所以不對。過去式 (A) 和現在完成式 (D) 不能表示未來。\n\n<!-- page 428 -->\n\n### Questions 139-142 refer to the following advertisement. 🆕\n139-142 題參照以下廣告。\n\n> Discover great deals at Dan's Hardware Store!\n>\n> In order to thank our loyal customers for giving us years of business, Dan's Hardware Store is inviting everyone to attend its yearly inventory clearance sale. From September 1 to 15, all merchandise will be ______(139). Take advantage of reduced prices of up to 80 percent off on everything from gardening supplies to outdoor equipment. ______(140).\n>\n> In addition, customers who buy $500 or more worth of merchandise will ______(141) to receive a $50 coupon, redeemable until December 31. A limit of one coupon ______(142) transaction applies.\n>\n> For further information on the sale and directions to the store nearest you, visit our Web site at www.danshardware.com.\n\n**翻譯**\n> 在 Dan's 五金用品店發現划算的東西！\n>\n> 為感謝忠實顧客多年來光顧本店，Dan's 五金用品店現在邀請大家參加年度清倉特賣。[139]從 9 月 1 日到 15 日，所有商品將會降價。請利用從園藝用品到戶外設備等各種物品最高打折 80% 的價格。[140]我們每個部門都為您提供令人興奮的優惠。\n>\n> [141]此外，購買商品滿 500 美元以上的顧客將能獲得可於 12 月 31 日前使用的 50 美元折價券。[142]每次交易限用一張折價券。\n>\n> 關於特賣的進一步資訊以及離您最近的店面的交通資訊，請上我們的網站 www.danshardware.com。\n\n**139.**\n- (A) held out\n- (B) done over\n- (C) marked down\n- (D) given away\n\n**140.** 🆕\n- (A) We have exciting offers for you in every department.\n- (B) The sale is for one day only, so hurry before it ends.\n- (C) This product is sold in various sizes to suit your needs.\n- (D) Make sure to go online and send in your product orders.\n\n**141.**\n- (A) be entitled\n- (B) be entitling\n- (C) entitle\n- (D) have entitled\n\n**142.**\n- (A) away\n- (B) among\n- (C) per\n- (D) next\n\n**單字** discover (v.) 發現；hardware (n.) 五金器具，硬體；loyal customer (phr.) 忠實顧客，常客；business (n.) 生意，商業；inventory (n.) 庫存，存貨清單；clearance sale (phr.) 清倉特賣；merchandise (n.) 商品；take advantage of (phr.) 利用…；gardening (n.) 園藝，園藝活動；redeemable (adj.) 可兌現的，可贖回的；limit (n.) 限制，界限；transaction (n.) 交易，辦理；apply (v.) 適用，申請；direction (n.) 方向，（複數形）指引\n\n<!-- page 429 -->\n\n**139.** 答案 (C)｜難度：最高\n**動詞慣用語** 參考上下文\n文意是「所有商品將會被 ____」，(C) 和 (D) 是可能的答案。因為無法從空格所在的句子判斷答案，所以必須參考空格前後或文章整體的內容。下一句說請利用從園藝用品到戶外設備等各種物品最高打折 80% 的價格，所以 (C) marked down（降價）是正確答案。(A) 的動詞片語 hold out 表示「堅持，維持」，(B) 的 do over 表示「重做」，(D) 的 give away 表示「贈送，洩露」。\n\n**140.** 🆕 答案 (A)｜難度：中\n**選出空格中正確的句子**\n這是選擇句子的題目，所以要參考空格前後或文章整體的內容。上一句「Take advantage of reduced prices of up to 80 percent off on everything from gardening supplies to outdoor equipment.」提到，請利用從園藝用品到戶外設備等各種物品最高打折 80% 的價格，所以空格的內容應該和折扣優惠有關，正確答案是 (A) We have exciting offers for you in every department。\n\n**選項翻譯**\n- (A) 我們每個部門都為您準備了令人興奮的優惠。\n- (B) 特賣只有一天，所以請在結束前趕快把握。\n- (C) 這項產品有販售多種不同尺寸，以符合您的需求。\n- (D) 請務必上網並送出產品訂單。\n\n**單字** offer (n.) （通常指短期的）特價優惠，提供；(v.) 提供；department (n.) 部門，賣場中販賣特定類型商品的分區；various (adj.) 多樣的，各種的；suit (v.) 適合，合…的意；(n.) 一套西裝，一套衣服\n\n**141.** 答案 (A)｜難度：中\n**被動態慣用語**\n因為要表示「購買商品滿 500 美元以上的顧客有資格得到折價券」的意思，所以能形成被動態的慣用語 be entitled to（有資格做…〔被賦予做…的資格〕）的 (A) be entitled 是正確答案。如果使用主動態的 (B)、(C)、(D) 的話，會變成「顧客給予資格」的意思，所以不對。\n\n**142.** 答案 (C)｜難度：中\n**選擇介系詞** 其他\n因為要表示「每次交易一張折價券的限制」的意思，所以表示「每…」的介系詞 (C) per 是正確答案。(A) away 是表示「離開」的副詞，(B) 是表示「在…之中」的介系詞。(D) next 當介系詞時表示「靠近…，貼近…」，當形容詞或副詞時表示「接下來的，隨後」。\n\n<!-- page 430 -->\n\n### Questions 143-146 refer to the following article. 🆕\n143-146 題參照以下報導。\n\n> Grimsby's *Feed* Satisfies Viewers\n>\n> In the three-part miniseries *Feed*, filmmaker David Grimsby ______(143) explores the modern food industry. The series takes viewers behind the scenes at farms and factories to reveal shocking details about the things we eat and how they are produced.\n>\n> While there are numerous other documentaries on this ______(144), a combination of smart narration, intriguing interviews, and animated graphics makes *Feed* stand out. ______(145). It presents both the benefits and drawbacks of modern food production without endorsing any one point of view. Richly informative and visually interesting, the series is ______(146) captivating that many people will want to see it twice. The first episode of *Feed* will air this month on the Modern Film Channel.\n\n**翻譯**\n> Grimsby 的《Feed》令觀眾感到滿意\n>\n> [143]在分三集的特集節目《Feed》中，電影製作人 David Grimsby 很熱衷地探索現代食品產業。這幾集節目帶領觀眾來到農場與工廠的工作幕後，揭露關於我們所吃的食物與其生產方式令人震驚的詳情。\n>\n> [144]雖然有許多其他關於本主題的紀錄片，但《Feed》結合了慧黠的旁白、引人入勝的訪談、動畫，使其脫穎而出。[145]本片最與眾不同之處或許是它不帶偏見。它呈現了現代食品生產的優點與缺點，不特別支持任何一種觀點。[146]本片資訊極為豐富，視覺上也能引人興趣，相當令人入迷，應該會有許多人想看兩遍。《Feed》的第一集本月將於 Modern Film 頻道播出。\n\n**143.**\n- (A) enthusiasm\n- (B) enthusiastic\n- (C) enthusiastically\n- (D) enthused\n\n**144.**\n- (A) trend\n- (B) level\n- (C) schedule\n- (D) topic\n\n**145.** 🆕\n- (A) The show attracted millions of viewers when it was televised last year.\n- (B) What is perhaps most distinctive about the film is its lack of bias.\n- (C) Mr. Grimsby plans to begin filming the documentary next month.\n- (D) Ratings for the network jumped when the final episode was aired.\n\n**146.**\n- (A) so\n- (B) even\n- (C) such\n- (D) right\n\n**單字** satisfy (v.) 使滿意，使滿足；three-part (adj.) 三部分構成的；miniseries (n.) 少數幾集之內就完結的電視劇或節目；filmmaker (n.) 電影製作人；explore (v.) 探究，探索；scene (n.) 現場，場景；combination (n.) 組合，結合；smart (adj.) 聰明的，伶俐的；intriguing (adj.) 激起好奇心的，引人入勝的；stand out (phr.) 突出，顯眼；present (v.) 呈現，提出；drawback (n.) 缺點，短處；endorse (v.) 支持，背書；richly (adv.) 豐富地，十足地；informative (adj.) 提供有用資訊的；visually (adv.) 視覺上，外表上；captivating (adj.) 令人入迷的；air (v.) （在廣播或電視上）播出\n\n<!-- page 431 -->\n\n**143.** 答案 (C)｜難度：低\n**副詞位置**\n能修飾空格後方動詞（explores）的是副詞，所以副詞 (C) enthusiastically（熱情地，熱心地）是正確答案。名詞 (A)、形容詞 (B)、動詞或分詞 (D) 都不能修飾動詞。\n\n**單字** enthuse (v.) 充滿熱情，使充滿熱情\n\n**144.** 答案 (D)｜難度：中\n**名詞詞彙** 參考全文\n文意是「有許多其他關於這個 ______ 的紀錄片」，所有選項都是可能的答案。因為無法從空格所在的句子判斷答案，所以必須參考空格前後或文章整體的內容。文章前面部分提到《Feed》探究現代食品產業，並揭露我們所吃的食物與其生產方式驚人的內幕，主要是說明這部片的主題，所以空格所在的句子應該是要表達「有許多同主題的紀錄片」，(D) topic（主題）是正確答案。(A) trend 表示「趨勢」，(B) level 表示「水準，程度」，(C) schedule 表示「時間表」。\n\n**145.** 🆕 答案 (B)｜難度：高\n**選出空格中正確的句子**\n這是選擇句子的題目，所以要參考空格前後或文章整體的內容。下一句「It presents both the benefits and drawbacks of modern food production without endorsing any one point of view.」提到，這部片呈現了現代食品生產的優點與缺點，不特別支持任何一種觀點。所以，空格的內容應該和這部片不帶偏見的特色有關，正確答案是 (B) What is perhaps most distinctive about the film is its lack of bias。\n\n**選項翻譯**\n- (A) 本節目去年在電視上播出時吸引了數百萬觀眾。\n- (B) 本片最與眾不同之處或許是它不帶偏見。\n- (C) Grimsby 先生計畫從下個月開始拍攝這部紀錄片。\n- (D) 最後一集播出時，頻道的收視率跳升。\n\n**單字** televise (v.) 在電視上播出；distinctive (adj.) 獨特的，與眾不同的；lack of (phr.) …的缺少；bias (n.) 偏見，偏向；rating (n.) （電視的）收視率，評等\n\n**146.** 答案 (A)｜難度：高\n**選擇副詞 so**\n空格後面接 that 子句（that ~ twice），而且要表示「因為很令人入迷，所以很多人會想看兩次」的意思，所以能和 that 連用，形成「so ~ that ...」（很～以致於…）句型的副詞 (A) so 是正確答案。(C) such 也可以形成「這麼～以致於…」的句型，但正確的形態是「such + a/an + 形容詞 + 名詞」，所以不對。(B) even「甚至」、(D) right「正好，就在」表示強調。\n\n<!-- page 432 -->\n\n## PART 7\n\n### Questions 147-148 refer to the following memo.\n147-148 題參照以下備忘錄。\n\n> To: All staff\n> From: Donald Manzo\n> Subject: Welcome reception\n> Date: August 5\n>\n> [147] We are holding a reception to welcome our new regional vice president, Gertrude Crowley. [148-A] Ms. Crowley previously worked as store manager of Knightland Electronics' affiliate in Charleston. After five years there, [148-B/C] she led our office in Atlanta for two years and then transferred to New Orleans, where she has been working since as their district manager. [148-D] She will now head the southeast district from our regional office here in Nashville.\n>\n> The reception will be held at the Bluegrass Hotel on Friday, August 9, at 7:30 p.m. If you plan on coming, please notify my secretary at extension number 44.\n>\n> Thank you.\n\n**翻譯**\n> 收件者：所有員工\n> 寄件者：Donald Manzo\n> 主旨：歡迎會\n> 日期：8 月 5 日\n>\n> [147] 我們將舉辦歡迎會來迎接新任區域副總裁 Gertrude Crowley。[148-A] Crowley 小姐先前在 Knightland Electronics 公司位於查爾斯頓的旗下公司擔任店經理。任職 5 年後，[148-B/C] 她帶領我們的亞特蘭大分公司 2 年，之後轉調紐奧良，持續擔任當地區域經理至今。[148-D] 現在她將在我們納許維爾這裡的區域分公司率領東南部地區。\n>\n> 歡迎會將於 8 月 9 日星期五晚間 7:30 在 Bluegrass 飯店舉行。如果你打算參加，請打分機 44 通知我的祕書。\n>\n> 謝謝大家。\n\n**單字** welcome (n.) 歡迎；(v.) 歡迎，迎接；previously (adv.) 先前；district (n.) 地區，區域；notify (v.) 告知，通知；reception (n.) 歡迎會，宴會；affiliate (n.) 旗下關係企業；head (v.) 率領，領導，擔任領導人；secretary (n.) 祕書；vice president (phr.) 副總裁；transfer (v.) 調動，轉移；plan on (phr.) 打算…；extension (n.) 電話分機\n\n**147.** 答案 (C)｜難度：低\nWhat is the purpose of the memo?\n- (A) To convince staff to volunteer for an activity\n- (B) To appeal for help with setting up a reception\n- (C) To inform employees about a coming event\n- (D) To notify staff about a visiting client\n\n> 這則備忘錄的目的是什麼？\n> (A) 為了說服員工為活動做志願服務\n> (B) 為了請求幫忙布置歡迎會\n> (C) 為了通知員工即將進行的活動\n> (D) 為了通知員工關於來訪客戶的事\n\n**尋找主題／目的** 文章的目的\n這是詢問備忘錄目的的尋找主題問題，所以要特別注意文章開頭的部分。「We are holding a reception」提到要辦歡迎會，之後則說明了歡迎會的日期和地點等具體資訊，所以 (C) To inform employees about a coming event 是正確答案。至於 (A) 和 (B)，因為文章只是說明活動本身，而沒有要求幫忙，所以不對。\n\n**替換表達**\nreception 歡迎會 → event 活動\n\n**148.** 答案 (D)｜難度：低\nWhere has Ms. Crowley NOT previously worked?\n- (A) Charleston\n- (B) Atlanta\n- (C) New Orleans\n- (D) Nashville\n\n> Crowley 小姐先前不曾在哪裡工作？\n> (A) 查爾斯頓\n> (B) 亞特蘭大\n> (C) 紐奧良\n> (D) 納許維爾\n\n**Not/True** Not 問題\n這是需要在文章中找到與關鍵字 Ms. Crowley ~ previously worked 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A) 對應文中的「Ms. Crowley previously worked ~ in Charleston.」，表示 Crowley 小姐先前在查爾斯頓工作過，符合選項敘述。(B) 和 (C) 對應文中的「she led our office in Atlanta ~ and then transferred to New Orleans」，表示 Crowley 小姐帶領亞特蘭大分公司後轉調紐奧良，符合選項敘述。和 (D) 相關的敘述\n\n<!-- page 433 -->\n\n是「She will now head ~ our regional office here in Nashville.」，表示她將會在納許維爾的區域分公司工作，但現在還沒有，不符合選項敘述，所以 (D) Nashville 是正確答案。\n\n### Questions 149-150 refer to the following text messages. 🆕\n149-150 題參照以下訊息對話。\n\n> **Helen Moon** 2:20 p.m.\n> Sue, I was going over the checklist for the trade show. Have you had a chance to pick up those supplies yet?\n>\n> **Sue Sloane** 2:24 p.m.\n> Actually, I found most of what we need in the supply room. The rest I will get on my way to the convention center tomorrow.\n>\n> **Helen Moon** 2:25 p.m.\n> That's perfect. Could you see if there are any clipboards in the supply room? If not, can you also buy some on your way? We need two to hold questionnaires and two more for sign-up sheets for new customers.\n>\n> **Sue Sloane** 2:27 p.m.\n> Not a problem. Anything else you need? [149] Has anyone picked up our pamphlets from the print shop yet? I can get them if nobody has done that.\n>\n> **Helen Moon** 2:28 p.m.\n> [149] I was supposed to do it. I'd be grateful if you could do it.\n>\n> **Sue Sloane** 2:29 p.m.\n> It isn't any trouble. [149] The print shop is nearby Coulier Office Supplies, and that's where I'm getting the rest of the supplies. [150-D] I'll bring them early so you can prepare to hand them out to participants as soon as the trade show opens. I'll be at the convention center for set-up by three o'clock.\n\n**翻譯**\n> **Helen Moon** 2:20 p.m.\n> Sue，我剛才在看貿易展的核對清單。你已經弄到那些用品了嗎？\n>\n> **Sue Sloane** 2:24 p.m.\n> 其實我已經在用品室找到大部分我們需要的東西了。剩下的我會在明天往會議中心的路上買。\n>\n> **Helen Moon** 2:25 p.m.\n> 太好了。你可以看看用品室有沒有板夾嗎？沒有的話，你可以在路上買幾個嗎？我們需要 2 個夾問卷，還有 2 個夾新顧客的加入申請書。\n>\n> **Sue Sloane** 2:27 p.m.\n> 沒問題。你還需要別的嗎？[149] 有人去印刷公司拿我們的摺頁了嗎？如果沒有的話，我可以去拿。\n>\n> **Helen Moon** 2:28 p.m.\n> [149] 我之前該去拿的。如果你可以的話，我會很感謝你。\n>\n> **Sue Sloane** 2:29 p.m.\n> 一點也不會麻煩。[149] 印刷公司在 Coulier 辦公用品店附近，我會在那間店買剩下的用品。[150-D] 我會早點把摺頁帶去，讓你可以準備好在貿易展開展的時候就發放給參加者。我會在 3 點前到會議中心做布置。\n\n**單字** go over (phr.) 查看；clipboard (n.) 板夾（頂端有紙夾的板子，方便使用者在任何地方寫字用）；pamphlet (n.) 宣傳用的摺頁；participant (n.) 參與者，參加者；trade show (phr.) 貿易展；grateful (adj.) 感謝的；supply (n.) 用品，供給；(v.) 供給；questionnaire (n.) 問卷；hand out (phr.) 發放\n\n**149.** 🆕 答案 (B)｜難度：高\nAt 2:29 p.m., what does Ms. Sloane mean when she writes, \"It isn't any trouble\"?\n- (A) She is satisfied she has everything she needs.\n- (B) She is fine with running an errand.\n- (C) She is willing to arrive early at a venue.\n- (D) She is happy to volunteer at a trade show booth.\n\n> 在下午 2:29，Sloane 小姐說的「It isn't any trouble」是什麼意思？\n> (A) 她因為有了自己需要的所有東西而感到滿意。\n> (B) 她覺得自己幫忙跑腿沒有關係。\n> (C) 她願意提早到會場。\n> (D) 她樂意在貿易展攤位自願工作。\n\n**掌握意圖**\n題目問 Sloane 小姐的意思，所以要掌握引用部分（It isn't any trouble）上下文的情境。Sloane 小姐說「Has\n\n<!-- page 434 -->\n\nanyone picked up our pamphlets from the print shop yet? I can get them if nobody has done that.」，表示如果沒有人去印刷公司拿摺頁，她可以去拿，而 Moon 小姐回應「I was supposed to do it. I'd be grateful if you could do it.」，表示本來應該是她要做這件事的，但如果 Sloane 小姐可以去做的話，她會很感謝。接著 Sloane 小姐表示「It isn't any trouble」（一點也不麻煩），接著說「The print shop is nearby Coulier Office Supplies, and that's where I'm getting the rest of the supplies.」，表示印刷公司離她要買剩餘用品的 Coulier 辦公用品店很近，可知她覺得順便幫忙拿摺頁不會很麻煩，所以 (B) She is fine with running an errand 是正確答案。\n\n**單字** run an errand (phr.) 幫忙跑腿；be willing to (phr.) 願意做…；venue (n.) 地點，舉辦場所\n\n**150.** 答案 (D)｜難度：中\nWhat is mentioned about the company Ms. Moon works for?\n- (A) It is conducting a survey among its employees.\n- (B) It has participated in conventions many times before.\n- (C) It has a supply agreement with a local store.\n- (D) It plans to distribute some brochures to event attendees.\n\n> 關於 Moon 小姐工作的公司，文中提到什麼？\n> (A) 正在進行員工意見調查。\n> (B) 以前參加過很多次大會。\n> (C) 和一間地方店家有供應協議。\n> (D) 計畫發放一些小冊給活動出席者。\n\n**Not/True** True 問題\n這是需要在文章中找到與關鍵字 the company Ms. Moon works 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A)、(B)、(C) 在文中沒有提到。(D) 對應 Sloane 小姐說的「I'll bring them early so you can prepare to hand them out to participants as soon as the trade show opens.」，表示會早點把摺頁帶去，讓 Moon 小姐可以準備好在貿易展開展的時候就發放給參加者，符合選項敘述，所以 (D) It plans to distribute some brochures to event attendees 是正確答案。\n\n**替換表達**\nhand ~ out 發放 → distribute 分發\ntrade show 貿易展 → event 活動\nparticipants 參加者 → attendees 出席者\n\n**單字** conduct (v.) 實施，指揮；(n.) 行為；agreement (n.) 協議，意見一致；attendee (n.) 出席者\n\n<!-- page 435 -->\n\n### Questions 151-152 refer to the following e-mail.\n151-152 題參照以下電子郵件。\n\n> To: Adam Webster <awebster@connex.com>\n> From: Caroline Gomez <services@seafront.com>\n> Date: April 17\n> Subject: Deposit\n>\n> Dear Mr. Webster,\n>\n> [151] Your deposit check has been cashed, and we are pleased to confirm that you can move in to your new office at Spiral Towers on the first day of next month. As a reminder, [152-A] the deposit will be kept by Seafront Realty until you choose to move out, at which time an inspection of the property will take place. The office space must be returned to the same condition it was in when your lease began. [152-D] If there is any excess damage, the related costs will be taken from the deposit before it is returned to you. Note also that [152-B] your deposit is being held in a bank account, and any interest earned as a result will be returned when you leave.\n>\n> Please e-mail me with any further questions. Thank you.\n>\n> Yours truly,\n> Caroline Gomez\n> Seafront Realty Miami\n\n**翻譯**\n> 收件者：Adam Webster <awebster@connex.com>\n> 寄件者：Caroline Gomez <services@seafront.com>\n> 日期：4 月 17 日\n> 主旨：押金\n>\n> 親愛的 Webster 先生：\n>\n> [151] 您的押金支票已經兌現，我們很高興確認您可以在下個月第一天搬進您在 Spiral Towers 的新辦公室。在此提醒您，[152-A] 押金將由 Seafront Realty 公司保管，直到您決定遷出為止，屆時將對建物進行檢查。辦公室空間必須回復至與開始租用時相同的狀態。[152-D] 如果有任何多出的損壞，將在退還押金給您之前從中扣除相關費用。也請注意 [152-B] 您的押金保管於銀行帳戶內，由此產生的利息將在您遷出時退回給您。\n>\n> 還有任何問題，請寄電子郵件給我。謝謝。\n>\n> Caroline Gomez\n> Seafront Realty 邁阿密分公司\n\n**單字** deposit (n.) 押金，保證金；lease (n.) 租賃；(v.) 租；inspection (n.) 檢查，視察；excess (adj.) 超過的，過多的；property (n.) 建築物與其地基，房地產；interest (n.) 利息，興趣\n\n**151.** 答案 (A)｜難度：中\nWho most likely is Mr. Webster?\n- (A) A building occupant\n- (B) A real estate investor\n- (C) A repair person\n- (D) A security guard\n\n> Webster 先生最有可能是什麼人？\n> (A) 建築物使用戶\n> (B) 不動產投資人\n> (C) 維修人員\n> (D) 警衛\n\n**推論** 細節資訊\n這是關於題目關鍵字 Mr. Webster 的推論問題。「Your deposit check has been cashed, and we are pleased to confirm that you can move in to your new office ~ next month.」提到，Webster 先生的押金支票已經兌現，並且很高興確認他可以在下個月搬進新的辦公室，可以推知 Webster 先生是大樓辦公室新的承租戶，所以 (A) A building occupant 是正確答案。\n\n**152.** 答案 (C)｜難度：中\nWhat is NOT stated about the deposit?\n- (A) It is returned when the lease ends.\n- (B) It is kept in a bank account.\n- (C) It is equivalent to one month's rent.\n- (D) It is used to pay for damage to the property.\n\n> 關於押金，文中沒有提到什麼？\n> (A) 租期結束時退還。\n> (B) 保管在銀行帳戶中。\n> (C) 等於一個月的租金。\n> (D) 用來支付建築物毀損的費用。\n\n**Not/True** Not 問題\n這是需要在文章中找到與關鍵字 the deposit 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A) 對應\n\n<!-- page 436 -->\n\n文中的「the deposit will be kept by Seafront Realty until you choose to move out」，表示押金將由 Seafront Realty 公司保管到遷出為止，符合選項敘述。(B) 對應文中的「your deposit is being held in a bank account」，表示押金保管於銀行帳戶內，符合選項敘述。(C) 在文中沒有提到，所以 (C) It is equivalent to one month's rent 是正確答案。(D) 對應文中的「If there is any excess damage, ~ before it is returned to you.」，表示如果有損壞的話會從押金中扣除相關費用，符合選項敘述。\n\n### Questions 153-155 refer to the following article.\n153-155 題參照以下報導。\n\n> **Nairobi International Marathon Draws Attention**\n>\n> July 28—Runners participating in this year's Nairobi International Marathon had better start getting ready for some competition. Organizers announced yesterday at a press conference that [153] 12,000 athletes have already signed up for the race, an increase of nearly 30 percent compared to last year. Chair of the organization board, Paul Oduya, says they are expecting even more registrations. \"Since the race last year, we have been working very hard to promote the marathon on social media. This allowed us to reach out more to international athletes.\" Oduya also said that [154] the race's growing popularity has helped give a boost to local tourism and believes that this year's event will continue that trend.\n>\n> New routes were also announced during the press conference. The full and half marathons will begin along the western edge of the National Park, while the shorter races will start on Outer Ring Road. [155] All races will end at City Stadium. Officials have released details online at www.nairobirace.org.ke, including closures and detours for motorists along Langata, Mombasa, and other major roads. For those interested in joining, registration will remain open until the end of August. Visit www.nairobimarathon.org to learn more about entry fees and other requirements.\n\n**翻譯**\n> **奈洛比國際馬拉松吸引注目**\n>\n> 7 月 28 日—參加今年奈洛比國際馬拉松的跑者最好開始為競爭做準備了。主辦者昨天在記者會中宣布，[153] 已經有 12,000 名選手報名參加本次比賽，較去年增加將近百分之 30。主辦委員會主席 Paul Oduya 表示，委員會預期會有更多人報名。「從去年的比賽開始，我們一直非常努力在社群媒體上宣傳馬拉松。這樣使得我們更能接觸到國際上的運動員。」Oduya 也表示，[154] 馬拉松賽越來越受歡迎，幫助促進了當地的觀光業，他也相信今年的活動將使這個趨勢持續下去。\n>\n> 記者會上也發表了新路線。全程與半程馬拉松將從國家公園西側開跑，而較短的賽事將從 Outer Ring 路開跑。[155] 所有賽程都將以市立體育館為終點。官方已經在 www.nairobirace.org.ke 網站公布詳細資訊，包括提供給駕駛人的 Langata 路、Mombasa 路與其他主要道路的封閉與改道資訊。有興趣參加的人在 8 月底前仍可報名。請上 www.nairobimarathon.org 以得知更多關於報名費與其他要求事項的資訊。\n\n**單字** international (adj.) 國際的，國與國之間的；attention (n.) 關注，注意；organizer (n.) 主辦者；compared to (phr.) 和…相比；popularity (n.) 受歡迎，普及；route (n.) 路線；release (v.) 發表，發行，釋放；entry (n.) 參賽，參加，入場；had better (phr.) 最好做…；press conference (phr.) 記者會；chair (n.) 主席；give a boost to (phr.) 推動…，促進…；edge (n.) 邊緣；motorist (n.) 汽車駕駛人；draw (v.) 吸引，畫；competition (n.) 競爭，競賽；athlete (n.) 運動員，運動選手；reach out (phr.) 觸及…，伸出手；trend (n.) 傾向，趨勢；outer ring road (phr.) 外圍環狀道路；remain (v.) 維持，保持\n\n<!-- page 437 -->\n\n**153.** 答案 (C)｜難度：低\nHow will this year's marathon be different from the last one?\n- (A) It is taking place at a different time of year.\n- (B) It is being held in a new city.\n- (C) It will have a larger number of participants.\n- (D) It will be broadcast on local television.\n\n> 今年的馬拉松和去年有什麼不同？\n> (A) 會在年內不同的時間舉行。\n> (B) 會在新的城市舉行。\n> (C) 會有更多的參加者。\n> (D) 會在地方電視台播出。\n\n**wh- 問題** How\n這是問今年的馬拉松和去年怎樣（How）不同的 wh- 問題，所以要尋找和問題重點 this year's marathon be different from the last one 相關的內容。「12,000 athletes have already signed up for the race, an increase of nearly 30 percent compared to last year」的部分提到，已經有 12,000 名選手報名參加本次比賽，比去年增加將近百分之 30，所以 (C) It will have a larger number of participants 是正確答案。\n\n**替換表達**\nan increase of nearly 30 percent 將近百分之 30 的增加 → a larger number of 數目比較多的…\n\n**單字** broadcast (v.) 在電視或廣播播出\n\n**154.** 答案 (C)｜難度：中\nWhat does the article suggest about Nairobi?\n- (A) Its sports programs have received more funding in recent years.\n- (B) Its athletes have gained increased international exposure.\n- (C) It has experienced an increase in tourism.\n- (D) Its geography is particularly well-suited to long-distance races.\n\n> 關於奈洛比，文中顯示什麼？\n> (A) 運動計畫近年獲得了更多經費。\n> (B) 當地的運動員獲得了更多國際曝光。\n> (C) 經歷了觀光業的成長。\n> (D) 當地地形特別適合長距離賽跑。\n\n**推論** 細節資訊\n這是關於題目關鍵字 Nairobi 的推論問題。「the race's growing popularity has helped give a boost to local tourism and believes that this year's event will continue that trend」提到馬拉松賽越來越受歡迎，幫助促進了當地的觀光業，而且今年的活動應該會讓這個趨勢持續下去，可以推知奈洛比的觀光業因為馬拉松而成長了，所以 (C) It has experienced an increase in tourism 是正確答案。\n\n**替換表達**\ngive a boost to ~ tourism 促進觀光業 → an increase in tourism 觀光業的成長\n\n**單字** funding (n.) 資金，資金提供；exposure (n.) 曝光，曝露；geography (n.) 地形，地理學\n\n**155.** 答案 (D)｜難度：低\nWhere will the full marathon end?\n- (A) At National Park\n- (B) At Outer Ring Road\n- (C) At Mombasa Road\n- (D) At City Stadium\n\n> 全程馬拉松的終點在哪裡？\n> (A) 國家公園\n> (B) Outer Ring 路\n> (C) Mombasa 路\n> (D) 市立體育館\n\n**wh- 問題** Where\n這是問全程馬拉松在哪裡（Where）結束的 wh- 問題。和問題重點 the full marathon end 相關的部分「All races will end at City Stadium.」表示所有賽程的終點都是市立體育館，所以 (D) At City Stadium 是正確答案。\n\n<!-- page 438 -->\n\n### Questions 156-157 refer to the following Web page.\n156-157 題參照以下網頁。\n\n> **Ace Venture Systems**\n>\n> | Home | **Products** | News | Contact Us |\n>\n> Accounting Software Version 1\n>\n> [156] Ace Venture Systems brings you new business accounting software for small and medium enterprises. Accounting Software Version 1 is a FREE software package that includes standard accounting functions essential to small business operations. Like other customized software, it has features that allow users to manage inventories and keep records of purchase orders and sales data. It can also be used to organize financial reports and various account information. Discover what Accounting Software Version 1 can do for your business by clicking the button below:\n>\n> *(按鈕：[157-D] Download Accounting Software Version 1)*\n>\n> [157-A] Ace Venture Systems is a promoter of open-source software. It offers reliable business applications for more tha ue to availability of staff and other factors outside of our control. However, places sometimes become vacant due to schedule changes or dropouts. [160] We will make these places available 14 days after registration closes, so please ask a member of staff at that time about what is available.\n\n**翻譯**\n> **麥迪遜社區休閒中心**\n> 青少年活動報名\n>\n> 夏日來臨，孩子們不用上學，所以 [158-C] 麥迪遜社區休閒中心將再度開辦（每年）固定為兒童與青少年準備的 10 週活動課程。今年的活動包括：\n>\n> - 羽毛球\n> - 游泳\n> - 籃球\n> - 足球\n> - 還有很多！\n>\n> [158-B] 所有運動都將由合格的成年教練督導，我們也會盡量將參加者分為能力大致相近的小組。這樣能確保每個人都能在學習新技能與保持健康的同時玩得愉快。\n>\n> 包含個別運動完整日期、時間、價格一覽表的小冊可以在我們設施的接待櫃台領取，或者也可以申請以郵件寄送。9 月 15 日起的一週之內開放報名。[159] 要報名活動，請上 www.mclc.com 並遵循網站上的指示。\n>\n> 課程的名額依照先報名先得的方式提供。我們的目標是盡可能多容納報名者，但由於我們的人員有空與否和其他不在我們掌控中的因素，所以不一定能夠做到。不過，有時會因為時程改變或有人退出而產生缺額。[160] 我們會在報名結束 14 天後開放這些名額，所以到那時候請向我們的人員詢問有什麼可以報名。\n\n**單字** run (v.) 經營，舉辦，跑；attempt (v.) 試圖，努力做到；keep fit (phr.) 保持健康；on a first-come, first-served basis (phr.) 以先到者先得的方式；accommodate (v.) 容納，提供住宿；vacant (adj.) 空缺的，空的；oversee (v.) 監督；place (v.) 放置，安置；(n.) 地方；seat (n.) 位子，座位；availability (n.) 可得性，有空與否；dropout (n.) 退出，退學；qualified (adj.) 合格的，適任的；roughly (adv.) 大略地，大約；award (v.) 給予，授予，頒發；factor (n.) 因素，要素\n\n<!-- page 441 -->\n\n**158.** 答案 (B)｜難度：中\nWhat is indicated about the planned activities?\n- (A) They will all take place indoors.\n- (B) They will be facilitated by qualified adults.\n- (C) They are open to participants of all ages.\n- (D) Some will conclude with a sports tournament.\n\n> 關於預定的活動，文中提到什麼？\n> (A) 都將在室內舉行。\n> (B) 將由符合資格的成年人主持。\n> (C) 開放所有年齡的人參加。\n> (D) 有些會以錦標賽作為結尾。\n\n**Not/True True 問題**\n這是需要在文章中找到與關鍵字 the planned activities 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A) 和 (D) 在文中沒有提到。(B) 對應文中的「All sports will be overseen by qualified adult instructors」，表示所有運動課程都將由合格的成年教練指導，符合選項敘述，所以 (B) They will be facilitated by qualified adults 是正確答案。和 (C) 相關的部分是「Madison Community Leisure Center will again be running our ~ programs for children and young people」，表示課程是為兒童與青少年開辦的，不符合選項敘述。\n\n**單字** take place (phr.) （活動）舉行；indoors (adv (n.) 容器，貨櫃；sanitation department (phr.) （公共）衛生部門；understaffed (adj.) 人手不足的；solid (adj.) 扎實的，牢靠的；put together (phr.) 製作，編寫；dispose of (phr.) 處理掉，丟棄；come up with (phr.) 想出（解決方法等）；funding (n.) 資金，提供資金；council (n.) 議會，委員會；shortage (n.) 不足，缺乏；day off (phr.) 休假日\n\n<!-- page 443 -->\n\n**161.** 答案 (D)｜難度：中\nWhat have Ms. Fiorentino and her colleagues been asked to do?\n- (A) Attend a discussion with staff at the sanitation department\n- (B) Determine the effects of a trash problem in the city\n- (C) Prepare a detailed budget for a recycling campaign\n- (D) Come up with suggestions to present at a city meeting\n\n> Fiorentino 小姐和她的同事被要求做什麼？\n> (A) 出席與衛生部人員進行的討論\n> (B) 判定市內垃圾問題造成的影響\n> (C) 為回收宣傳活動準備詳細的預算案\n> (D) 想出要在市府會議中報告的建議\n\n**wh- 問題 What**\n這是問 Fiorentino 小姐和她的同事被要求做什麼（What）的 wh- 問題。和問題重點 Ms. Fiorentino and her colleagues ~ asked to do 相關的部分是「Mayor Watkins wants the city to address the issue right away, and he wants us to put together a list of recommendations to present at the next council meeting.」，表示 Watkins 市長希望市府立即處理這個問題，也希望我們（Fiorentino 小姐和她的同事）列出建議，在下次議會中報告，所以 (D) Come up with suggestions to present at a city meeting 是正確答案。\n\n**替換表達**\nput together a list of recommendations 製作建議的列表 → Come up with suggestions 想出建議\ncouncil meeting 議會的會議 → city meeting 市府的會議\n\n**單字** determine (v.) 判定，決定；budget (n.) 預算，預算案\n\n**162.** 🆕 答案 (A)｜難度：中\nAt 3:12, what does Mr. Medrano mean when he writes, \"I couldn't agree more\"?\n- (A) He recognizes the benefit of having media involved.\n- (B) He has heard a trash reduction suggestion before.\n- (C) He feels that a proposed idea lacks substance.\n- (D) He believes some changes would cost too much.\n\n> 在 3:12，Medrano 先生說的「I couldn't agree more」是什麼意思？\n> (A) 他認同將媒體納入計畫的好處。\n> (B) 他以前聽過垃圾減量的提議。\n> (C) 他覺得提出來的想法缺乏實質內容。\n> (D) 他認為有些改變會花太多錢。\n\n**掌握意圖**\n題目問 Medrano 先生的意思，所以要掌握引用部分（I couldn't agree more）上下文的情境。Vickie Hill 說「I think a media campaign would be helpful.」，表示她認為媒體宣傳活動會有幫助，而 Medrano 先生回應「I couldn't agree more.」（我再贊同不過了），表示他也  應該是衛生部長，所以 (A) She is the head of the sanitation department. 是正確答案。\n\n**單字** promising (adj.) 前途有望的\n\n<!-- page 445 -->\n\n### Questions 165-167 refer to the following flyer.\n165-167 題參照以下傳單。\n\n> **A Night of Song**\n> **A concert**\n>\n> On December 5, French singers Pierre Chrétien and Celine Laurier will be at the Maroon Theater for [166-A] their second concert in Los Angeles, California. The event, which will begin at 7:30 p.m., will also feature French pianist Amanda Depuis as well as American soul singers Andy Red and Cindy Dawson, who will accompany Mr. Chrétien and Ms. Laurier during their performance. — [1] —. [166-C] During the concert, Ms. Laurier will be introducing her inspirational album, *Crossroads*, which was released in Paris last week. — [2] —.\n>\n> Witness an extraordinary fusion of French and American artists. — [3] —. And until November 20, [165/167] those purchasing three or more early-bird tickets will receive complimentary backstage passes! — [4] —. Tickets are available at any Gatewing Ticketing outlet nationwide. They may also be purchased online at www.gatewing.com. [166-B] Recordings from both Mr. Chrétien and Ms. Laurier will be available for purchase at the venue. Call Gatewing at 1-800-555-2541 for details.\n\n**翻譯**\n> **A Night of Song**\n> **演唱會**\n>\n> 12 月 5 日，法國歌手 Pierre Chrétien 與 Celine Laurier 將於 Maroon 劇場進行 [166-A] 他們在加州洛杉磯的第二場演唱會。本次活動將從晚間 7:30 開始，法國鋼琴家 Amanda Depuis、美國靈魂歌手 Andy Red 及 Cindy Dawson 也將與 Chrétien 先生及 Laurier 女士一同演出。— [1] —。[166-C] 演唱會中，Laurier 女士將介紹她上週在巴黎發行、啟發人心的專輯《Crossroads》。— [2] —。\n>\n> 見證一場法國與美國藝人的非凡融合。— [3] —。至 11 月 20 日止，[165/167] 購買 3 張以上早鳥票者將獲得免費贈送的後台通行證！— [4] —。門票可於全國任何 Gatewing 售票點購買。亦可於 www.gatewing.com 線上購買。[166-B] 演唱會場將可購買 Chrétien 先生與 Laurier 女士的錄音作品。詳情請撥 1-800-555-2541 洽詢 Gatewing。\n\n**單字** performance (n.) 表演，表現；witness (v.) 見證，目擊；early-bird ticket (phr.) 早鳥票（提早購買的票）；complimentary (adj.) 免費贈送的，稱讚的；backstage (n.) 後台，舞台後方；(adv.) 在後台；nationwide (adj.) 全國範圍的，全國性的；inspirational (adj.) 激發靈感的； h was released ~ last week 將介紹上週發行的專輯 → will promote a new recording 將會宣傳新的錄音作品\n\n**單字** autograph (n.) （親筆）簽名\n\n**167.** 🆕 答案 (D)｜難度：低\nIn which of the positions marked [1], [2], [3], and [4] does the following sentence best belong?\n\"This does not apply to regular tickets.\"\n- (A) [1]\n- (B) [2]\n- (C) [3]\n- (D) [4]\n\n> 以下這個句子最適合放在文中標記 [1]、[2]、[3]、[4] 的哪一個位置？\n> 「這並不適用於一般門票。」\n> (A) [1]\n> (B) [2]\n> (C) [3]\n> (D) [4]\n\n**找出句子位置**\n這是要依照文章的內容架構，判斷句子應該插入哪個位置的題目。題目所給的句子「This does not apply to regular tickets.」表示某個規定並不適用於一般門票，所以應該放在說明特殊票種優惠規定的內容後面。[4] 的上一句「those purchasing three or more early-bird tickets will receive complimentary backstage passes!」提到，購買 3 張以上早鳥票者將獲得免費贈送的後台通行證。在 [4] 的位置插入句子之後，表示贈送後台通行證的優惠只適用於早鳥票，一般票不適用，文意前後連貫，所以 (D) [4] 是正確答案。\n\n**單字** apply (v.) 適用，申請\n\n<!-- page 447 -->\n\n### Questions 168-171 refer to the following e-mail.\n168-171 題參照以下電子郵件。\n\n> To: Stephen Haggerty <s.haggerty@mailbag.com>\n> From: Customer service <cust_serv@giftlane.com>\n> Subject: Your order\n> Date: December 8\n>\n> Dear Mr. Haggerty,\n>\n> We received the order you placed on our online store, some details of which are below. Unfortunately, [168] we cannot send all of the items as requested. Due to an unusually high volume of orders this holiday season, some popular items are currently unavailable for delivery before Christmas Day. We apologize for this inconvenience.\n>\n> **ORDER DETAILS**\n>\n> | Quantity | Description | Status | Expected Delivery |\n> |---|---|---|---|\n> | 1 | Personalized bottle of rosé wine | Ready to ship | December 21 |\n> | 3 | Chocolate gift box (assorted) | Ready to ship | December 18 |\n> | 1 | Leather-bound journal and pen | Ready to ship | December 22 |\n> | 2 | Decorative plant pot | Pending | December 27 |\n>\n> To ensure at least a partial delivery of your order, [169] we can ship the first three items to the recipients at the different addresses you provided by the dates indicated above. However, in regard to the last item on 網站發生了技術性的錯誤。\n> (B) 裡面有錯誤的產品。\n> (C) 一項要求的商品還不能提供。\n> (D) 缺少重要的送貨資訊。\n\n**wh- 問題 What**\n這是問 Haggerty 先生訂單的問題是什麼（What）的 wh- 問題。和問題重點 the problem with Mr. Haggerty's order 相關的部分是「we cannot send all of the items as requested. Due to an unusually high volume of orders, some popular items are currently unavailable for delivery」，表示無法寄出要求的所有商品，因為連假有大量的訂單，造成某些熱門商品無法寄送，所以 (C) A requested item is not readily available 是正確答案。\n\n**169.** 答案 (C)｜難度：低\nWhat is indicated about Mr. Haggerty?\n- (A) He ordered one of every item.\n- (B) He purchased a bottle of wine for himself.\n- (C) He is sending items to different recipients.\n- (D) He has shopped with Gift Lane in the past.\n\n> 關於 Haggerty 先生，文中提到什麼？\n> (A) 他每項商品各訂了一個。\n> (B) 他為自己買了一瓶酒。\n> (C) 他要把商品寄給一些不同的收件人。\n> (D) 他過去曾經在 Gift Lane 購物。\n\n**推論 細節資訊**\n這是關於題目關鍵字 Mr. Haggerty 的推論問題。「we can ship the first three items to the recipients at the different addresses you provided」的部分提到，Gift Lane 公司可以把前三項商品寄到 Haggerty 先生提供的不同地址的收件人，可以推知他要把商品寄給一些各自不同的收件人，所以 (C) He is sending items to different recipients 是正確答案。\n\n**170.** 答案 (B)｜難度：低\nWhat will happen if Mr. Haggerty does not answer the e-mail?\n- (A) An order will be canceled.\n- (B) A delivery will proceed.\n- (C) An extra charge will be incurred.\n- (D) A special offer will be voided.\n\n> 如果 Haggerty 先生不回覆這封電子郵件，會發生什麼事？\n> (A) 訂單會被取消。\n> (B) 將會進行配送。\n> (C) 會產生額外費用。\n> (D) 特別優惠會失效。\n\n**wh- 問題 What**\n這是問 Haggerty 先生如果不回覆這封電子郵件，會發生什麼（What）的 wh- 問題。和問題重點 happen if Mr. Haggerty does not answer the e-mail 相關的部分是「you do not need to respond to this message, and we will proceed with the delivery」，表示不必回覆這封信，就會配送商品，所以 (B) A delivery will proceed 是正確答案。\n\n**單字** incur (v.) 招致，引起；void (v.) 使無效；(adj.) 無效的，空的\n\n**171.** 答案 (C)｜難度：低\nWhat should Mr. Haggerty do if he wishes to replace an item?\n- (A) Wait for further instructions\n- (B) Call the company hotline\n- (C) Follow a link to a Web site\n- (D) Send a message to customer service\n\n> 如果 Haggerty 先生希望替換商品，他應該做什麼？\n> (A) 等候進一步指示\n> (B)  Beebe》的音樂劇版本預定於次月 5 月 22 日首演。— [1] —。[173-D] 本劇以南本德為背景，描寫 1960 年代一名汽車工廠工人年少的兒子的故事。[173-B/175] 本書於 1968 年首度出版時即成為青少年讀者的最愛。— [2] —。\n>\n> 本劇製作人 Todd Carlisle 與 Emma Wright 在本書首度出版時尚未出生，但他們表示在首次閱讀故事時就和 Lester Beebe 青春期的奮鬥產生認同。Carlisle 說：「Lester Beebe 不只是南本德的少年。他也可以是任何地方的年輕人。」除了擔任本劇製作人以外，Carlisle 與 Wright 也經營南本德的 Eden 劇場。— [3] —。根據 Wright 的說法，該地區並非以音樂劇製作聞名，但她希望《The Triumph of Lester Beebe》將改變這個情況。她說：「Todd 和我也指望本地人的關注有助於建立這齣劇的觀眾群。」\n>\n> 扮演 Beebe 一角的是演員 Henry Thomas。資深表演者 Neil Chandler 扮演他的父親，而 Beebe 的姐妹 Mandy 與 Corinne 則由 Stephanie O'Connor 與 Audrey Blanco 演出。[173-A] 結束在南本德的演出後，Carlisle 與 Wright 將於 8 月將本劇帶到紐約，進行百老匯的首度演出。— [4] —。南本德場次的門票現正透過 Eden 劇場販售中，電話為 555-0493。\n\n**單字** be set to (phr.) 預定做…；identify with (phr.) 和…有認同感；playhouse (n.) 劇場；role (n.) 角色；premiere (v.) (n.) 首演，首映；adolescent (adj.) 青春期的；(n.) 青少年；count on (phr.) 依靠，指望；run (n.) （戲劇、電影等的）連續上演期間；release (v.) 出版，發售，公開；struggle (n.) 奮鬥，掙扎；play (v.) 扮演，演奏，玩\n\n<!-- page 450 -->\n\n**172.** 答案 (B)｜難度：低\nWhat is the article mainly about?\n- (A) A musical performer's return to the stage\n- (B) An upcoming theatrical production\n- (C) A grand opening for a play venue\n- (D) An adaptation of an author's biography\n\n> 這則報導主要是關於什麼？\n> (A) 一位音樂劇演員復出舞台\n> (B) 一齣即將上演的戲劇作品\n> (C) 戲劇表演場地盛大開幕\n> (D) 一位作家的傳記改編\n\n**尋找主題／目的 文章的主題**\n這是問報導主要關於什麼的尋找主題問題，所以要特別注意文章開頭的部分。「A musical version of Michelle Gable's novel The Triumph of Lester Beebe is set to premiere next month on May 22.」提到，一部小說的音樂劇版本預定於 5 月 22 日首演，之後則詳細說明音樂劇的相關事項，所以 (B) An upcoming theatrical production 是正確答案。\n\n**替換表達**\nmusical version of ~ novel 小說的音樂劇版本 → theatrical production 戲劇作品\n\n**單字** return (n.) 回歸，返回；(v.) 返回；venue (n.) 場所，場地；adaptation (n.) 改編，改寫；biography (n.) 傳記\n\n**173.** 答案 (A)｜難度：中\nWhat is NOT indicated about *The Triumph of Lester Beebe*?\n- (A) It had a successful run in New York.\n- (B) It was popular with some youth in the 1960s.\n- (C) It has been modified into a musical show.\n- (D) It is based in South Bend.\n\n> 關於《The Triumph of Lester Beebe》，文中沒有提到什麼？\n> (A) 在紐約的上演很成功。\n> (B) 在 1960 年代很受一些年輕人歡迎。\n> (C) 被改編成了音樂劇。\n> (D) 是以南本德為故事背景。\n\n**Not/True Not 問題**\n這是需要在文章中找到與關鍵字 The Triumph of Lester Beebe 相關的資訊，並且與選項敘述對照的 Not/True 問題。和 (A) 相關的部分是「Following the run in South Bend ~ will take the show to New York in August」，表示在南本德演出結束後，8 月才到紐約演出，不符合選項敘述，所以 (A) It had a successful run in New York 是正確答案。(B) 對應文中的「The book became a favorite of young adult readers when it was first printed in 1968.」，表示這本書在 1968 年首度出版時成為青少年讀者的最愛，符合選項敘述。(C) 對應文中的「A musical version of Michelle Gable's novel ~.」，表示這部小說被改編成了音樂劇，符合選項敘述。(D) 對應文中的「Set in South Bend」，表示故事以南本德為背景，符合選項敘述。\n\n**替換表達**\nbecame a favorite of young adult readers 成為青少年讀者的最愛 → was popular with some youth 受到一些年輕人歡迎\nSet in south Bend 以南本德為背景 → is based in South Bend 以南本德為背景\n\n**174.** 答案 (B)｜難度：中\nThe word \"realized\" in paragraph 3, line 2, is closest in meaning to\n- (A) caused\n- (B) depicted\n- (C) clarified\n- (D) discovered\n\n> 第 3 段第 2 行的「realized」，意思最接近\n> (A) 造成\n> (B) 描繪\n> (C) 闡明\n> (D) 發現\n\n**同義詞**\nrealized 在「the roles of Beebe's sisters ~ will be realized by Stephanie O'Connor and Audrey Blanco」這裡的意思是「體現，實現」，也就是在真實世界裡把角色演出來，所以表示「描繪」的 (B) depicted 是正確答案。\n\n<!-- page 451 -->\n**175.** 🆕 答案 (B)｜難度：中\nIn which of the positions marked [1], [2], [3], and [4] does the following sentence best belong?\n\"Its popularity earned it widespread acclaim and, ultimately, translation into 32 languages.\"\n- (A) [1]\n- (B) [2]\n- (C) [3]\n- (D) [4]\n\n> 以下這個句子最適合放在文中標記 [1]、[2]、[3]、[4] 的哪一個位置？\n> 「它受歡迎的程度使它廣受好評，最終更被翻譯為 32 種語言。」\n> (A) [1]\n> (B) [2]\n> (C) [3]\n> (D) [4]\n\n**找出句子位置**\n這是要依照文章的內容架構，判斷句子應該插入哪個位置的題目。題目所給的句子「Its popularity earned it widespread acclaim and, ultimately, translation into 32 languages.」表示它（這本書）很受歡迎，因而廣受好評，並翻譯為 32 種語言，所以應該接在說明本書受歡迎程度的內容後面。[2] 的上一句「The book became a favorite of young adult readers when it was first printed in 1968.」提到，這本書成為青少年讀者的最愛。在 [2] 的位置插入句子之後，表示因為書很受年輕人歡迎，所以廣受好評，並翻譯為 32 種語言，文意前後連貫，所以 (B) [2] 是正確答案。\n\n**單字** popularit urbance (n.) 打擾，擾亂\n\n<!-- page 454 -->\n**177.** 答案 (A)｜難度：低\nWhat is indicated about LED desk lamps?\n- (A) They minimize eye strain.\n- (B) Their bulbs last longer than traditional ones.\n- (C) They use little electricity.\n- (D) Their brightness can be adjusted.\n\n> 關於 LED 檯燈，文中提到什麼？\n> (A) 會將對眼睛的壓力減到最小。\n> (B) 燈泡比傳統型持久。\n> (C) 耗電量很小。\n> (D) 亮度可以調整。\n\n**Not/True** True 問題\n這是需要在文章中找到與關鍵字 LED desk lamps 相關的資訊，並且與選項敘述對照的 Not/True 問題，所以要看介紹產品的廣告（第一篇文章）。(A) 對應文中的「desk lamps with LED bulbs: ~ reducing eye stress」，表示 LED 檯燈可以減少對眼睛的壓力，符合選項敘述，所以 (A) They minimize eye strain 是正確答案。(B)、(C)、(D) 在文中沒有提到。\n\n**替換表達**\nreducing eye stress 減少對眼睛的壓力 → minimize eye strain 將對眼睛的壓力減到最小\n\n**單字** brightness (n.) 亮度，明亮；adjust (v.) 調整，適應\n\n**178.** 答案 (A)｜難度：高\nWhat is implied about Optimo Web Design?\n- (A) It will pay $200 for a delivery fee.\n- (B) It has a company outing planned for April 8.\n- (C) It occupies three floors of an office building.\n- (D) It is moving to a new location.\n\n> 關於 Optimo Web Design 公司，文中暗示什麼？\n> (A) 會付 200 美元的運費。\n> (B) 有預定 4 月 8 日進行的公司出遊。\n> (C) 使用一棟辦公大樓的三層樓。\n> (D) 會搬到新地點。\n\n**推論** 多篇文章綜合題\n這是必須參考兩篇文章內容的多篇文章綜合題，所以先看題目關鍵字 Optimo Web Design 公司的訂購表格（第二篇文章）。\n\n第二篇文章中的「Address: ~ Gresham」和「Total, $1,100」顯示 Optimo Web Design 公司位於格雷斯罕，訂單金額是 1,100 美元，這是第一個線索。但是，這裡沒有提到運費會是多少，所以還需要在第一篇文章（廣告）中確認。第一篇文章中的「For the nearby cities of Gresham ~ charges are $100 for orders up to $1,000, and $200 for any orders above that amount.」提到，對於格雷斯罕等鄰近城市，訂單金額 1,000 美元以下收 100 美元的運費，超過 1,000 美元收 200 美元，這是第二個線索。\n\n綜合「Optimo Web Design 公司位於格雷斯罕，訂單金額是 1,100 美元」和「訂單金額超過 1,000 美元收 200 美元運費」這兩個線索，可以推知 Optimo Web Design 公司會付 200 美元的運費，所以 (A) It will pay $200 for a delivery fee 是正確答案。和 (C) 相關的部分是「Address: Third Floor」，表示公司在三樓，並不代表他們使用三層樓的空間。\n\n**單字** outing (n.) 短途出遊\n\n<!-- page 455 -->\n**179.** 答案 (B)｜難度：中\nFor which item will Optimo Web Design receive a special gift?\n- (A) Item 3292\n- (B) Item 3665\n- (C) Item 4550\n- (D) Item 7600\n\n> Optimo Web Design 公司會因為哪項產品獲得特別贈禮？\n> (A f service. We will be bringing with us 12 executives from the board of directors, 15 team managers from across the company, and eight members of staff from the administration, event organization, accounting, and office management teams. [184] We will need suites for the executives, single rooms for the managers, and the other members of staff will be asked to share double rooms.\n>\n> During the daytime, we will need to have access to one large conference room which can accommodate all the attendees. We will also require three smaller rooms to be used for side meetings. Ideally, all of these rooms will be equipped with projectors and Internet access.\n>\n> We would also like to ask you to provide catering for the event, including breakfast, a light lunch, and an evening meal throughout the time we spend at the hotel. [183/184] We will be arriving around lunchtime on May 8 and leaving after dinner on May 10.\n>\n> Please let me know if such an event will be possible on the dates requested, by e-mailing me at Hoffman.charlotte@burke.de. I look forward to your response.\n>\n> Yours truly,\n> Charlotte Hoffman\n> Assistant to the executive director, Burke Capital\n\n**翻譯**\n\n> 1 月 27 日\n>\n> Renaldo Moreno\n> Rome Kingstonian 飯店\n> Viale dei Promontori 659 號\n> 00135 羅馬\n> 義大利\n>\n> 親愛的 Moreno 先生：\n>\n> [181] 我寫這封信是要詢問 5 月使用貴飯店進行 Burke Capital 公司年度高階主管退修會的事宜。我最近開始擔任現在的職位，[182] 前任的人告訴我，3 年前曾經使用貴飯店進行同樣的活動。她提到她自己對你們的服務水平多麼印象深刻。我們將有 12 名董事會的高階主管、公司各單位的 15 名團隊經理，還有來自行政、活動籌辦、會計、辦公室管理組的 8 名成員前往參加。[184] 我們將需要高階主管用的套房、經理用的單人房，而其他員工將被要求共用雙人床房。\n>\n> 白天我們必須能夠使用一間可容納所有參加者的大型會議室。我們也需要 3 間比較小的會議室，用來進行周邊會議。這些會議室最好都備有投影機和網路連線。\n>\n> 我們也想請你們提供活動飲食，包括我們在飯店整段期間的早餐、簡便午餐，以及晚餐。[183/184] 我們將於 5 月 8 日午餐時間左右抵達，5 月 10 日晚餐後離開。\n>\n> 請寄電子郵件到 Hoffman.charlotte@burke.de，告訴我能否在要求的日期舉行活動。期待您的回覆。\n>\n> Charlotte Hoffman\n> 執行董事助理，Burke Capital 公司\n\n**文章2**\n\n> To: Charlotte Hoffman <hoffman.charlotte@burke.de>\n> From: Renaldo Moreno <r.moreno@romekingstonian.it>\n> Subject: Event booking\n> Date: February 1\n>\n> Dear Ms. Hoffman,\n>\n> Thank you for your letter dated January 27, which we received this morning. I do indeed remember the last time Burke Capital held its retreat at the Kingstonian, and you are extremely welcome to return.\n\n**翻譯**\n\n> 收件者：Charlotte Hoffman <hoffman.charlotte@burke.de>\n> 寄件者：Renaldo Moreno <r.moreno@romekingstonian.it>\n> 主旨：活動預約\n> 日期：2 月 1 日\n>\n> 親愛的 Hoffman 小姐：\n>\n> 感謝您 1 月 27 日的來信，我們是今天早上收到的。我確實記得 Burke Capital\n\n<!-- page 457 -->\n\n> However, some small alterations to your original plan may be needed due to existing bookings from other customers. [184] While we have enough executive suites remaining to meet your needs, we are short on some of the other rooms you need for those dates. Would it be possible for four more people to share double rooms?\n>\n> We are also afraid to say that [185-A/C] our main conference room has been booked for another event during this time. [185-C] Nevertheless, we have an agreement with a venue which is only a 10-minute walk from the hotel. They have confirmed to me that they would be able to accommodate you, and [185-B] our catering service would be happy to bring lunch over to the conference center each day to minimize the need to go back and forth.\n>\n> With these changes in mind, please let me know if you would still like to proceed, and I will make the booking immediately.\n>\n> Sincerely,\n> Renaldo Moreno\n\n**翻譯**\n\n> 上次在 Kingstonian 舉行退修會的時候，也很歡迎你們再次前來。\n>\n> 然而，因為已經有其他客人預訂的關係，你們的原定計畫可能必須稍微修改。[184] 雖然我們還有足夠的行政套房能滿足你們的需求，但你們在指定日期需要的其他某些房間不足。有可能再讓其中 4 位共用雙人床房嗎？\n>\n> 我們也很遺憾告訴您，[185-A/C] 我們的主會議室在這段期間已經有其他活動預約了。[185-C] 不過，我們和一座從飯店走路只要 10 分鐘的場地有合作協議。他們向我確認，說可以供你們使用，[185-B] 我們的外燴服務也很樂意每天將午餐送到那座會議中心，盡量減少你們來來回回的必要。\n>\n> 考慮到這些變更，請告訴我你們是否想要繼續進行，我會立刻預訂。\n>\n> Renaldo Moreno\n\n**單字（文章 1）** executive (adj.) 高階主管的，執行的，行政的 (n.) 高階主管；retreat (n.)（讓員工暫時脫離工作環境並進行團體活動的）退修會；predecessor (n.) 前任，前輩；board of directors (phr.) 董事會；accommodate (v.) 容納；side (adj.) 旁邊的，附屬的 (n.) 邊，面；ideally (adv.) 理想上，最好；equip (v.) 使…配備（設備等必要物品）；catering (n.) 外燴服務\n\n**單字（文章 2）** indeed (adv.) 確實，真的；alteration (n.) 修改，變更；existing (adj.) 現有的，現存的；agreement (n.) 協議，協定，意見一致；venue (n.)（演唱會、比賽、會議等的）場地；minimize (v.) 最小化；go back and forth (phr.) 來來回回；proceed (v.) 繼續進行，前行\n\n**181.** 答案 (C)｜難度：低\nWhat is the purpose of the letter?\n- (A) To order specific kinds of food\n- (B) To ask about the price of accommodations\n- (C) To inquire about booking a venue\n- (D) To thank a hotel for a previous event\n\n> 信件的目的是什麼？\n> (A) 為了訂購特定種類的食物\n> (B) 為了詢問住宿價格\n> (C) 為了詢問預約場地事宜\n> (D) 為了針對先前的活動感謝一間飯店\n\n**尋找主題／目的** 文章的目的\n這是詢問信件目的的尋找主題問題，所以要看信件（第一篇文章）的內容。「I am writing to you to inquire about using your hotel for Burke Capital's executive retreat in May.」提到，寫這封信是要詢問 5 月使用飯店進行年度高階主管退修會的事宜，所以 (C) To inquire about booking a venue 是正確答案。\n\n<!-- page 458 -->\n\n**182.** 答案 (D)｜難度：中\nWhat is indicated about Burke Capital?\n- (A) Its executive retreat will take place in the winter.\n- (B) Members of its marketing team will attend an event.\n- (C) It has 15 executives on the board of directors.\n- (D) Some of its staff previously stayed at the hotel.\n\n> 關於 Burke Capital 公司，文中提到什麼？\n> (A) 高階主管退修會將在冬天舉行。\n> (B) 行銷團隊的成員會參加一場活動。\n> (C) 董事會有 15 名高階主管。\n> (D) 有些員工之前在飯店住過。\n\n**推論** 細節資訊\n這是關於題目關鍵字 Burke Capital 的推論問題，所以要看從 Burke Capital 公司發出的信件（第一篇文章）。「my predecessor told me that your hotel had been used three years ago for the same event」的部分提到，前任者說 3 年前辦活動的時候利用過對方的飯店，可以推斷有些員工之前在那間飯店住過，所以 (D) Some of its staff previously stayed at the hotel 是正確答案。\n\n**183.** 答案 (A)｜難度：中\nWhat can be inferred from the letter?\n- (A) Breakfast is not needed on May 8.\n- (B) Microphones are required for the conference rooms.\n- (C) The attendees will take time for sightseeing.\n- (D) Some of the meetings will take place in the evening.\n\n> 從信件內容可以推知什麼？\n> (A) 5 月 8 日不需要早餐。\n> (B) 會議室需要麥克風。\n> (C) 參加者會花時間觀光。\n> (D) 有些會議會在晚間舉行。\n\n**推論** 細節資訊\n這是問從信件（第一篇文章）內容可以推知什麼的推論問題。這一題沒有特定的關鍵字，所以要〔原書此處字跡被裝訂邊遮住，無法辨識〕選項相關的內容。信件中「We will be arriving around lunchtime on May 8」的部分提到，參加活動的人會在 5 月 8 日午餐時間左右抵達飯店，可以推斷當天不需要早餐，所以 (A) Breakfast is not needed on May 8 是正確答案。\n\n**184.** 答案 (B)｜難度：高\nWhat is most likely unavailable at the hotel on May 8?\n- (A) Executive suites\n- (B) Single rooms\n- (C) Double rooms\n- (D) Triple rooms\n\n> 飯店 5 月 8 日最可能沒有什麼？\n> (A) 行政套房\n> (B) 單人房\n> (C) 雙人床房\n> (D) 三人房\n\n**推論** 多篇文章綜合題\n這是必須參考兩篇文章內容的多篇文章綜合題，所以先看提到題目關鍵字 unavailable at the hotel on May 8 相關內容的電子郵件（第二篇文章）。\n\n第二篇文章中的「While we have enough executive suites ~ we are short on some of the other rooms you need for those dates. Would it be possible for four more people to share double rooms?」提到，雖然行政套房足夠，但其他房間不夠，所以想問能不能再讓其中 4 個人共用雙人床房，這是第一個線索。但是，這裡沒有提到那些被要求但必須改成雙人床房的房間類型是什麼，所以還需要在第一篇文章（信件）中確認。第一篇文章中的「We will need suites for the executives, single rooms for the managers, and the other members of staff will be asked to share double rooms.」和「We will be arriving around lunchtime on May 8」提到，需要高階主管用的套房（行政套房）、單人房和雙人床房，而且 5 月 8 日會到飯店，這是第二個線索。\n\n綜合「行政套房足夠，但其他房間不夠，所以有 4 個人要改住雙人床房」和「想要預訂 5 月 8 日的行政套房、單人房和雙人床房」這兩個線索，可以推斷因為單人房不夠，所以有 4 個人要改住雙人床房，所以 (B) Single rooms 是正確答案。\n\n<!-- page 459 -->\n\n**185.** 答案 (D)｜難度：最高\nWhat is NOT indicated about the Kingstonian Hotel?\n- (A) Its conference room is already booked for the dates discussed.\n- (B) It has a catering service that can provide lunch.\n- (C) It is located near a conference center.\n- (D) It offers a free bus service from the airport.\n\n> 關於 Kingstonian 飯店，文中沒有提到什麼？\n> (A) 會議室在討論到的日期已經被預訂了。\n> (B) 有可以提供午餐的外燴服務。\n> (C) 位於一座會議中心附近。\n> (D) 提供從機場出發的免費巴士服務。\n\n**Not/True** Not 問題\n這是需要在文章中找到與關鍵字 Kingstonian Hotel 相關的資訊，並且與選項敘述對照的 Not/True 問題，所以要看從 Kingstonian 飯店寄出的電子郵件（第二篇文章）。(A) 對應文中的「our main conference room has been booked for another event during this time」，表示主會議室在對方要求的期間已經有其他活動預約了，符合選項敘述。(B) 對應文中的「our catering service would be happy to bring lunch over to the conference center」，表示有可以提供午餐的外燴服務，符合選項敘述。(C) 對應文中的「our main conference has been booked for another event during this time」和「Nevertheless, we have an agreement with a venue which is only a 10-minute walk from the hotel.」，表示雖然主會議室被預約了，但飯店和附近一座走路只要 10 分鐘的場地有合作協議，由此可知飯店在一座會議中心附近，符合選項敘述。(D) 在文中沒有提到，所以 (D) It offers a free bus service from the airport 是正確答案。\n\n**替換表達**\nonly a 10-minute walk 走路只要 10 分鐘的路途 → near 在附近\n\n<!-- page 460 -->\n\n### Questions 186-190 refer to the following Web page, e-mail, and invoice. 🆕\n186-190 題參照以下網頁、電子郵件及發票。\n\n**文章1**\n\n> http://www.stclaireeditewrite.com/about\n>\n> Ruben St. Claire: Freelance Writer/Editor\n>\n> About　Contact　[186-B] Portfolio/Writing Samples\n>\n> **Services**\n> [186-A] I write, edit, proofread, and research materials on a wide variety of topics. If your association, business, or institution requires help creating or perfecting magazine articles, blog posts, newsletters, or press releases, do not hesitate to contact me.\n>\n> **[186-D/188] Major Clients**\n> [186-D] Borton University Alumni Association, *North East Gardener's Journal*, Urban Planning Association of Georgeville, [188] Sportsworld Outfitters, Society for the Decorative Arts\n>\n> **[186-C] Awards**\n> National Association of Businesses Communications Award, [186-C] GRB Prize for Editorial Excellence, Georgia P. Smythe Freelance Writers' Award\n>\n> **Education**\n> Western Pointhead University, BA, Double Major in English Literature and Journalism\n\n**翻譯**\n\n> http://www.stclaireeditewrite.com/about\n>\n> Ruben St. Claire：自由撰稿人／編輯\n>\n> 關於　聯絡　[186-B] 作品集／寫作範例\n>\n> **服務**\n> [186-A] 我撰寫、編輯、校對並研究多種廣泛主題的內容。若您的協會、事業或機構在創作或完善雜誌文章、部落格貼文、時事通訊或新聞稿等方面需要幫助，請隨時與我聯絡。\n>\n> **[186-D/188] 主要客戶**\n> [186-D] Borton 大學校友會、《North East Gardener's 期刊》、喬治維爾都市計畫協會、[188] Sportsworld 戶外用品店、裝飾藝術協會\n>\n> **[186-C] 獎項**\n> 國家商業傳播協會獎、[186-C] GRB 編輯優秀獎、Georgia P. Smythe 自由撰稿人獎\n>\n> **教育背景**\n> Western Pointhead 大學英文文學與新聞學雙學士\n\n**文章2**\n\n> To: Ruben St. Claire <rstclaire@stclaireeditwrite.com>\n> From: Christa Gables <chgab@FineThreads.com>\n> Date: February 28\n> Subject: Inquiry\n>\n> Dear Mr
