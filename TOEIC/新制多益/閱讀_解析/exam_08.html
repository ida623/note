ducational institution 是正確答案。\n\n<!-- page 462 -->\n\n**替換表達**\nresearch materials on a wide variety of topics 研究多種廣泛主題的材料 → do research on a variety of different subjects 進行關於多種不同主題的研究\nPortfolio/Writing Samples 作品集／寫作範例 → selections of ~ work 挑選出來的作品\n\n**單字** recognize (v.) 認可，表彰；employ (v.) 雇用，運用\n\n**187.** 答案 (B)｜難度：中\nWhat is the main purpose of the e-mail?\n- (A) To thank a writer for previous blog posts\n- (B) To make a business proposition\n- (C) To follow up on an editing request\n- (D) To inquire about preferred methods of payment\n\n> 電子郵件的主要目的是什麼？\n> (A) 為了感謝作家先前寫了部落格文章\n> (B) 為了提出工作提案\n> (C) 為了追蹤一項編輯要求的情況\n> (D) 為了詢問偏好的付款方式\n\n**尋找主題／目的** 文章的目的\n這是問電子郵件目的的尋找主題問題，所以要看電子郵件（第二篇文章）的內容。「I am interested in possibly hiring you to work on a series of short blog posts for my online clothing store」提到，Gables 小姐想聘請對方為自己的網路服飾店處理一系列的短篇部落格貼文，之後則說明具體工作事項，所以 (B) To make a business proposition 是正確答案。\n\n**單字** previous (adj.) 先前的；proposition (n.) 提議，（邏輯）命題\n\n**188.** 答案 (C)｜難度：中\nWith which of Mr. St. Claire's clients is Ms. Gables most likely familiar?\n- (A) Borton University Alumni Association\n- (B) *North East Gardener's Journal*\n- (C) Sportsworld Outfitters\n- (D) Society for the Decorative Arts\n\n> Gables 小姐最有可能熟悉 St. Claire 先生的哪個客戶？\n> (A) Borton 大學校友會\n> (B) 《North East Gardener's 期刊》\n> (C) Sportsworld 戶外用品店\n> (D) 裝飾藝術協會\n\n**推論** 多篇文章綜合題\n這是必須參考三篇文章其中兩篇內容的多篇文章綜合題。先看直接提到與題目關鍵部分 Ms. Gables ~ familiar 相關內容的電子郵件（第二篇文章）。\n第二篇文章中，「you have done quite a lot of work for an athletic wear company that I know rather well」提到對方（St. Claire 先生）為自己（Gables 小姐）相當熟悉的運動服飾公司做了很多，這是第一個線索。但是，這裡沒有提到那是 St. Claire 先生的哪個客戶，所以還需要在第一篇文章（網頁）中確認。第一篇文章中的「Major Clients」、「Sportsworld Outfitters」顯示 Sportsworld 戶外用品店是 St. Claire 先生的主要客戶之一，這是第二個線索。\n綜合「St. Claire 先生為 Gables 小姐相當熟悉的運動服飾公司做了很多」和「Sportsworld 戶外用品店是 St. Claire 先生的主要客戶之一」這兩個線索，可以推測 Gables 小姐熟悉的運動服飾公司應該是 Sportsworld 戶外用品，所以 (C) Sportsworld Outfitters 是正確答案。\n\n**替換表達**\nfamiliar 熟悉的 → know rather well 很熟知\n\n<!-- page 463 -->\n\n**189.** 答案 (B)｜難度：中\nWhat does Ms. Gables ask Mr. St. Claire to do?\n- (A) Send her a check in the mail\n- (B) Provide a price quotation\n- (C) Create links to some blog posts\n- (D) E-mail her some writing samples\n\n> Gables 小姐要 St. Claire 先生做什麼？\n> (A) 郵寄一張支票給她\n> (B) 提供報價\n> (C) 做一些連到部落格貼文的連結\n> (D) 用電子郵件寄出一些寫作範例給她\n\n**wh- 問題** What\n這是問 Gables 小姐要 St. Claire 先生做什麼（What）的 wh- 問題，所以要看提到與題目關鍵部分 Ms. Gables ask Mr. St. Claire to do 相關內容的電子郵件（第二篇文章）。「Please send me ~ an estimate for the total cost.」的部分，Gables 小姐要收件者 St. Claire 先生寄服務價目表和總費用估計給她，所以 (B) Provide a price quotation 是正確答案。\n\n**替換表達**\nsend ~ an estimate for the total cost 寄總費用估計 → Provide a price quotation 提供報價\n\n**單字** quotation (n.) 報價，引用\n\n**190.** 答案 (B)｜難度：高\nWhat can be inferred about Ms. Gables?\n- (A) She was late sending payment for some proofreading services.\n- (B) She underestimated the amount of time needed to do some research.\n- (C) She had to pay more for copywriting than she expected.\n- (D) She may recommend Mr. St. Claire to one of her associates.\n\n> 關於 Gables 小姐，從文中可以推知什麼？\n> (A) 她支付校稿服務費的時間晚了。\n> (B) 她低估了研究所需的時間。\n> (C) 她必須支付比預期更多的文案寫作費。\n> (D) 她可能會把 St. Claire 先生推薦給一位同事。\n\n**推論** 多篇文章綜合題\n這是必須參考三篇文章其中兩篇內容的多篇文章綜合題。先看題目關鍵字 Ms. Gables 所寫的電子郵件（第二篇文章）。\n第二篇文章中，「I will have three hours of research ~ assignments for you to do as well」表示 Gables 小姐會讓收件人 St. Claire 先生做 3 小時的研究和大約 6 小時的校對工作，這是第一個線索。但是，這裡沒有提到後來實際工作了多久，所以還需要在第三篇文章（發票）中確認。第三篇文章中的「Research, 5 hours」顯示實際上花了 5 小時做研究，這是第二個線索。\n綜合「Gables 小姐要讓 St. Claire 先生做 3 小時的研究」和「實際上花了 5 小時做研究」這兩個線索，可以推知她低估了研究所需的時間，所以 (B) She underestimated the amount of time needed to do some research 是正確答案。\n\n**單字** underestimate (v.) 低估，估計不足；copywriting (n.) 文案寫作；associate (n.) 同事；(v.) 使有關聯，聯想\n\n<!-- page 464 -->\n\n### Questions 191-195 refer to the following article, Web page, and map. 🆕\n191-195 題參照以下報導、網頁及地圖。\n\n**文章 1**\n\n> **TrueBlue Mart Offers Rides to Local Customers**\n>\n> Customers of Kenneth County's most popular big-box store, TrueBlue Mar presentatives start providing a shuttle?\n- (A) They agreed with customers' suggestions that it would be convenient.\n- (B) They felt it was difficult for some of their clients to get to the store.\n- (C) They anticipated that shuttle bus fees would boost overall profits.\n- (D) They could not arrange for city buses to stop directly at the store.\n\n> 為什麼 TrueBlue Mart 的代表開始提供接駁車？\n> (A) 他們同意顧客說這樣會很方便的建議。\n> (B) 他們覺得有些顧客不容易前往賣場。\n> (C) 他們預期接駁車費用將提高整體利潤。\n> (D) 他們無法安排市公車直接停靠賣場。\n\n**wh- 問題** Why\n這是問 TrueBlue Mart 的代表為什麼（Why）開始提供接駁車的 wh- 問題，所以要看提到與問題重點 TrueBlue Mart representatives start providing a shuttle 相關內容的報導（第一篇文章）。「Concerned that a lack of affordable transit services has prevented certain segments of the population from shopping at TrueBlue Mart, store management felt it was appropriate to provide a free shuttle」的部分提到，因為擔心缺少便宜的交通服務使得有些居民不去 TrueBlue Mart 購物，所以賣場經營團隊覺得提供免費接駁車是適當的做法，(B) They felt it was difficult for some of their clients to get to the store 是正確答案。\n\n**單字** boost (v.) 提高，促進；overall (adj.) 整體的；(adv.) 整體上；arrange (v.) 安排，準備\n\n<!-- page 466 -->\n\n**192.** 答案 (D)｜難度：高\nWhat is indicated about the store's new service?\n- (A) The minibus picks passengers up from a sports facility first.\n- (B) The shuttle repeats the same route four times every day.\n- (C) The ride schedule was recently adjusted to allow for more stops.\n- (D) The vehicle sometimes skips a stop at Glengarry University.\n\n> 關於賣場的新服務，文中提到什麼？\n> (A) 小巴士會先從某個體育設施開始載客。\n> (B) 接駁車每天反覆行駛同樣的路線 4 次。\n> (C) 班次時間表最近為了停靠更多站而調整過。\n> (D) 車子有時候會跳過 Glengarry 大學不停。\n\n**Not/True** 多篇文章綜合題\n這是需要找到與關鍵字 the store's new service 相關的資訊，並且與選項敘述對照的 Not/True 問題，所以要看介紹賣場新服務的報導（第一篇文章）。和 (A) 相關的部分是「The minibus will leave from Edgewood Avenue Apartments」，表示小巴士從 Edgewood 街公寓發車，不符合選項敘述。和 (B) 相關的部分是「On Saturdays, the minibus makes just three trips」和「The shuttle will not operate on Sundays.」，表示週六只有三班車，週日不營運，不符合選項敘述。(C) 在文中沒有提到。(D) 對應第一篇文章中的「On Saturdays, the minibus ~ skipping over the second stop.」，表示每週六小巴士不停靠第二站，這是第一個線索。但是，這裡沒有提到第二站是什麼，所以還需要在第二篇文章（網頁）中確認。第二篇文章中的「the second stop, Glengarry University」表示第二站是 Glengarry 大學，這是第二個線索。綜合「每週六小巴士不停靠第二站」和「第二站是 Glengarry 大學」這兩個線索，可以推知每週六小巴士不停靠 Glengarry 大學，符合選項敘述，所以 (D) The vehicle sometimes skips a stop at Glengarry University 是正確答案。\n\n**單字** vehicle (n.) 車輛，運載工具\n\n**193.** 答案 (C)｜難度：高\nWhich stop does Ms. Harper use on the weekends?\n- (A) Edgewood Avenue Apartments\n- (B) Glengarry University\n- (C) Horizons Crossings Recreation Club\n- (D) Lake Side Village Senior Center\n\n> Harper 小姐在週末使用哪一站？\n> (A) Edgewood 街公寓\n> (B) Glengarry 大學\n> (C) Horizons Crossings 休閒俱樂部\n> (D) Lake Side Village 老人中心\n\n**wh- 問題** 多篇文章綜合題\n這是必須參考三篇文章其中兩篇內容的多篇文章綜合題。題目的關鍵部分是 stop ~ Ms. Harper use on the weekends，問 Harper 小姐在週末使用哪個（Which）停靠站，所以先看 Harper 小姐填寫意見的網頁（第二篇文章）。\n\n在第二篇文章中的「I live at the Helmhurst Retirement Community, which is close to the second stop, Glengarry University. On weekends, however, I'm forced to walk a little further to the third one.」，Harper 小姐表示自己居住的 Helmhurst 退休社區接近第二站 Glengarry 大學，但週末不得不走遠一點到第三站，這是第一個線索。但是，這裡沒有提到第三站是什麼，所以還需要在第三篇文章（地圖）中確認。地圖顯示第三站是 Horizons Crossings 休閒俱樂部，這是第二個線索。\n\n綜合「Harper 小姐週末不得不走遠一點到第三站」和「第三站是 Horizons Crossings 休閒俱樂部」這兩個線索，可知 Harper 小姐週末使用的停靠站是 Horizons Crossings 休閒俱樂部，所以 (C) Horizons Crossings Recreation Club 是正確答案。\n\n<!-- page 467 -->\n\n**194.** 答案 (D)｜難度：高\nWhat is NOT indicated about Ms. Harper?\n- (A) She finds that a shuttle service is not always convenient.\n- (B) She has used the store's shuttle service multiple times before.\n- (C) She does not require a full two hours to complete her shopping.\n- (D) She has some mobility issues that make it difficult for her to walk.\n\n> 關於 Harper 小姐，文中沒有提到什麼？\n> (A) 她覺得接駁服務並不是隨時都很方便。\n> (B) 她之前多次使用過賣場的接駁服務。\n> (C) 她不需要整整兩小時來完成購物。\n> (D) 她有行動問題，所以走路有困難。\n\n**Not/True** Not 問題\n這是需要找到與關鍵字 Ms. Harper 相關的資訊，並且與選項敘述對照的 Not/True 問題，所以要看 Harper 小姐填寫意見的網頁（第二篇文章）。(A) 對應文中的「I was wondering if you'd consider sticking to the same pickup locations daily」，表示她希望接駁車可以改為每天都停靠同樣的地點載客，而「I would also suggest that the minibus run more frequently than every two hours.」則說她也建議小巴士的頻率應該比每兩小時一班更高，可知她覺得現在的接駁服務還不夠方便，符合選項敘述。(B) 對應文章前半的接駁服務使用經驗，以及「so I often find myself sitting around waiting for the bus」提到自己常常為了等巴士閒坐著這一點，可知她至少利用過接駁服務幾次，符合選項敘述。(C) 對應文中的「Generally, I don't need more than two hours to perform my errands」，表示她幫忙買東西這件事本身不用超過兩小時，符合選項敘述。和 (D) 相關的部分是「The walk is fine for me, but there are several other residents at Helmhurst who find it difficult because of mobility issues.」，表示她還可以走路，但 Helmhurst 有幾位其他的居民因為行動問題而有困難，不符合選項敘述，所以 (D) She has some mobility issues that make it difficult for her to walk 是正確答案。\n\n**替換表達**\ndon't need more than two hours to perform ~ errands 不需要超過兩小時來進行差事 → does not require a full two hours to complete ~ shopping 不需要整整兩小時來完成購物\n\n**單字** convenient (adj.) 方便的，便利的；multiple (adj.) 多個的，多種的\n\n**195.** 答案 (A)｜難度：中\nOn the Web page, the word \"presents\" in paragraph 1, line 6, is closest in meaning to\n- (A) poses\n- (B) reports\n- (C) performs\n- (D) expresses\n\n> 網頁第 1 段第 6 行的「presents」，意思最接近\n> (A) 造成\n> (B) 報告\n> (C) 執行\n> (D) 表達\n\n**同義詞**\n在網頁（第二篇文章）中，presents 在「the weather presents a hindrance」這個句子裡的意思是「造成」，所以表示「造成」的 (A) poses 是正確答案。\n\n<!-- page 468 -->\n\n### Questions 196-200 refer to the following article, advertisement, and receipt. 🆕\n196-200 題參照以下報導、廣告及收據。\n\n**文章1**\n\n> Stockton, May 9 – [196] A 1,200-square-foot branch of the popular Florida-based clothing and accessories store Fresh & Sharp will be opening in Stockton's Old Ridge Mall this year. Construction is due to commence today. [199] The store will be situated in the space that housed an Always Good Supermarket until recently. Old Ridge Mall spokesperson Christian Cabot said that expectations for Fresh & Sharp are high as other branches of the store have routinely demonstrated strong performance. \"We are confident that it will be an excellent addition to our collection of quality retailers, and we've placed it in a central location accordingly ticipated construction delay\n- (B) To promote an annual sale at a shopping center\n- (C) To announce the future opening of a retail shop\n- (D) To invite citizens to a store's ribbon-cutting event\n\n> 報導的目的是什麼？\n> (A) 為了敘述預料之外的工程延誤\n> (B) 為了宣傳購物中心的年度特賣\n> (C) 為了宣布零售店未來的開幕\n> (D) 為了邀請市民參加商店的剪綵活動\n\n**尋找主題／目的** 文章的目的\n這是問報導（第一篇文章）的目的是什麼的尋找主題問題。報導中的「A ~ branch of ~ clothing and accessories store Fresh & Sharp will be opening ~ this year.」提到，服裝與飾品店 Fresh & Sharp 今年將會開設新的分店，之後的部分則說明與開幕相關的事項，所以 (C) To announce the future opening of a retail shop 是正確答案。\n\n**替換表達**\nA ~ branch of ~ store ~ will be opening ~ this year 一家分店今年會開幕 → the future opening of a retail shop 一間零售店未來的開幕\n\n**單字** unanticipated (adj.) 沒有預料到的，預期之外的；ribbon-cutting (n.)（開幕）剪綵\n\n<!-- page 470 -->\n\n**197.** 答案 (B)｜難度：低\nIn the article, the word \"performance\" in paragraph 1, line 5, is closest in meaning to\n- (A) presentation\n- (B) achievement\n- (C) evaluation\n- (D) commitment\n\n> 報導第 1 段第 5 行的「performance」，意思最接近\n> (A) 簡報\n> (B) 成就\n> (C) 評估\n> (D) 投身奉獻\n\n**同義詞**\n在報導（第一篇文章）中，performance 在「other branches of the store have routinely demonstrated strong performance」這個句子裡的意思是「表現」，所以表示「成就」的 (B) achievement 是正確答案。\n\n**198.** 答案 (C)｜難度：中\nAccording to the advertisement, what is true about the sale?\n- (A) All outerwear in the store is on sale for 30 percent off.\n- (B) It takes place near the food court of the shopping center.\n- (C) Spending a certain amount entitles clients to another discount.\n- (D) Items purchased on sale are not subject to sales tax.\n\n> 根據廣告，關於特賣何者正確？\n> (A) 店內所有外套特賣折扣 30%。\n> (B) 在購物中心的美食區附近舉行。\n> (C) 消費特定金額，顧客就可以享有另外的折扣。\n> (D) 特賣時購買的商品不會被收銷售稅。\n\n**Not/True** True 問題\n這是需要在廣告（第二篇文章）中找到與關鍵字 the sale 相關的資訊，並且與選項敘述對照的 Not/True 問題。和 (A) 相關的部分是「30% off select sweaters and jackets!」，表示只有部分毛衣和外套折扣 30%，不符合選項敘述。和 (B) 相關的部分是「Fresh & Sharp Grand Opening Sale, Old Ridge Mall, Ground Floor」，表示 Fresh & Sharp 開幕特賣是在 Old Ridge 購物中心一樓舉行，不符合選項敘述。(C) 對應文中的「Spend over $200 and get an additional 10 percent off」，表示消費超過 200 美元可以再享有 10% 折扣，符合選項敘述，所以 (C) Spending a certain amount entitles clients to another discount 是正確答案。(D) 在文中沒有提到。\n\n**單字** outerwear (n.) 外套，外衣；entitle (v.) 使有資格，使有權利；be subject to (phr.) 受到…\n\n**199.** 答案 (C)｜難度：最高\nWhat is suggested about Always Good Supermarket?\n- (A) It recently came under new management.\n- (B) It was moved to a different spot due to its expansion.\n- (C) It was located on the ground floor of Old Ridge Mall.\n- (D) It can be found in cities throughout Florida.\n\n> 關於 Always Good 超市，文中暗示什麼？\n> (A) 最近改由新的經營團隊管理。\n> (B) 由於擴張而被遷移到不同的地點。\n> (C) 以前位於 Old Ridge 購物中心一樓。\n> (D) 可以在佛羅里達州各地的城市找到。\n\n**推論** 多篇文章綜合題\n這是必須參考三篇文章其中兩篇內容的多篇文章綜合題。先看出現題目關鍵字 Always Good Supermarket 的報導（第一篇文章）。\n\n第一篇文章中，「The store will be situated in the space that housed an Always Good Supermarket」提到 Fresh & Sharp 的店面位於 Always Good 超市原本使用的空間，這是第一個線索。但是，這裡沒有提到 Fresh & Sharp 的店面位置，所以還需要在第二篇文章（廣告）中確認。第二篇文章中的「Fresh & Sharp Grand Opening Sale, Old Ridge Mall, Ground Floor」顯示 Fresh & Sharp 的店面在 Old Ridge 購物中心一樓，這是第二個線索。\n\n<!-- page 471 -->\n綜合「Fresh & Sharp 的店面位於 Always Good 超市原本使用的空間」和「Fresh & Sharp 的店面在 Old Ridge 購物中心一樓」這兩個線索，可以推知 Always Good 超市以前位於 Old Ridge 購物中心一樓，所以 (C) It was located on the ground floor of Old Ridge Mall 是正確答案。\n\n**200.** 答案 (B)｜難度：高\nWhat is indicated about Ms. Jones?\n- (A) She had never shopped at a Fresh & Sharp before.\n- (B) She was not eligible to receive a complimentary item.\n- (C) She paid a reduced price for everything she bought.\n- (D) She has two weeks to get her money back if she is unsatisfied.\n\n> 關於 Jones 小姐，文中提到什麼？\n> (A) 她以前從來沒在 Fresh & Sharp 買過東西。\n> (B) 她沒有資格得到免費贈送的物品。\n> (C) 她買的每一樣東西都是付折扣價。\n> (D) 如果不滿意的話，她有兩週的時間可以把錢拿回來。\n\n**推論 多篇文章綜合題**\n這是必須參考三篇文章其中兩篇內容的多篇文章綜合題。首先看出現題目關鍵字 Ms. Jones 的發票（第三篇文章）。\n\n第三篇文章中，「Partricia Jones」、「Total Loyalty Points: 8,534」顯示 Jones 小姐現在累積了 8,534 點，這是第一個線索。但是，這裡沒有提到點數可以做什麼，所以還需要在第二篇文章（廣告）中確認。第二篇文章中的「Members with 10,000 loyalty points or more accumulated from any of our locations will receive a free Fresh & Sharp tote bag!」表示累積 10,000 點以上的會員會得到免費的 Fresh & Sharp 托特包，這是第二個線索。\n\n綜合「Jones 小姐現在累積了 8,534 點」和「累積 10,000 點以上的會員會得到免費的 Fresh & Sharp 托特包」這兩個線索，可以推知 Jones 小姐還沒辦法得到免費托特包，所以 (B) She was not eligible to receive a complimentary item 是正確答案。\n\n**替換表達**\na free ~ tote bag 免費托特包 → a complimentary item 免費贈送的物品\n\n**單字** eligible (adj.) 有資格的，有權利的；complimentary (adj.) 免費贈送的，稱讚的";

// 答案線索標記，例如 [147]、[149-D]、[162/163]、[159-B/160-A/D]
const MARK = /\[(\d{3}(?:-[A-D](?:\/[A-D])*)?(?:\/\d{3}(?:-[A-D](?:\/[A-D])*)?)*)\]\s?/g;
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function inline(s) {
  s = esc(s).replace(/\\\*/g, "\u0001");
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>");
  s = s.replace(/\u0001/g, "*").replace(/\\([\[\]_#-])/g, "$1");
  return s.replace(MARK, (_, m) => `<span class="mk">${m}</span>`);
}
function md(text) {
  const lines = text.split("\n");
  let out = "", i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    if (l.startsWith(">")) {
      const buf = [];
      while (i < lines.length && lines[i].startsWith(">")) { buf.push(lines[i].replace(/^> ?/, "")); i++; }
      out += "<blockquote>" + md(buf.join("\n")) + "</blockquote>"; continue;
    }
    if (l.trim().startsWith("|")) {
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith("|")) { rows.push(lines[i].trim()); i++; }
      const cells = r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      let html = "<table>";
      rows.forEach((r, k) => {
        if (/^\|[\s\-:|]+\|$/.test(r)) return;
        const cs = cells(r);
        if (k === 0 && cs.every(c => !c)) return;
        const tag = k === 0 && rows[1] && /^\|[\s\-:|]+\|$/.test(rows[1]) ? "th" : "td";
        html += "<tr>" + cs.map(c => `<${tag}>${inline(c)}</${tag}>`).join("") + "</tr>";
      });
      out += html + "</table>"; continue;
    }
    if (/^- /.test(l)) {
      out += "<ul>";
      while (i < lines.length && /^- /.test(lines[i])) { out += "<li>" + inline(lines[i].slice(2)) + "</li>"; i++; }
      out += "</ul>"; continue;
    }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !lines[i].startsWith(">") && !/^- /.test(lines[i]) && !lines[i].trim().startsWith("|")) { buf.push(inline(lines[i])); i++; }
    out += "<p>" + buf.join("<br>") + "</p>";
  }
  return out;
}

const stripMarks = s => s.replace(MARK, "");

/* ---------- 解析題本 ---------- */
const Q_HEAD = /^\*\*(\d{3})\.\*\*\s*(🆕)?\s*(?:答案 \(([A-D])\)(?:｜難度：([^\s🆕]+))?)?\s*(🆕)?/;
function parseQBlock(lines) {
  const m = lines[0].match(Q_HEAD);
  const q = { num: m[1], isNew: !!(m[2] || m[5]), answer: m[3] || null, level: m[4] || "", text: [], options: [], rest: [] };
  let stage = "text";
  for (const l of lines.slice(1)) {
    const o = l.match(/^- \(([A-D])\)\s?(.*)$/);
    if (stage !== "rest" && o) { stage = "opts"; q.options.push({ key: o[1], text: o[2] }); continue; }
    if (stage === "opts") stage = "rest";
    (stage === "text" ? q.text : q.rest).push(l);
  }
  q.body = lines.slice(1).join("\n").trim();
  q.text = q.text.join("\n").trim();
  q.rest = q.rest.join("\n").trim();
  return q;
}
function splitBlocks(lines) {
  const pre = [], blocks = [];
  for (const l of lines) {
    if (Q_HEAD.test(l)) blocks.push([l]);
    else if (blocks.length) blocks[blocks.length - 1].push(l);
    else pre.push(l);
  }
  return { pre, blocks: blocks.map(parseQBlock) };
}
function parsePreamble(pre, expected) {
  const sub = pre.length && !pre[0].startsWith(">") ? pre.shift() : "";
  // 判斷是不是中文翻譯：看中文字佔的比例（原文偶爾夾少量中文註記）
  const isTrans = t => {
    const cjk = (t.match(/[一-鿿]/g) || []).length, latin = (t.match(/[A-Za-z]/g) || []).length;
    return cjk > 0 && cjk / (cjk + latin) > 0.2;
  };
  // 第一步：切成一塊一塊（文章標籤 / 原文 / 翻譯）
  const chunks = [], vocab = [];
  let quote = null, afterTransLabel = false, inVocab = false;
  const flush = () => {
    if (!quote) return;
    const text = quote.join("\n");
    chunks.push({ type: afterTransLabel || isTrans(stripMarks(text)) ? "trans" : "en", text });
    quote = null; afterTransLabel = false;
  };
  for (const l of pre) {
    if (inVocab) { vocab.push(l); continue; }
    if (l.startsWith(">") || l.trim().startsWith("|")) { (quote || (quote = [])).push(l); continue; }
    flush();
    const lab = l.match(/^\*{0,2}文章\s*(\d+)\*{0,2}\s*$/);
    if (lab) chunks.push({ type: "label", text: "文章 " + lab[1] });
    else if (l.startsWith("**單字**")) { inVocab = true; vocab.push(l); }
    else if (l.trim() === "**翻譯**") afterTransLabel = true;
  }
  flush();
  // 第二步：沒標「文章 N」的地方，從「翻譯之後又出現的英文」裡挑最長的幾段當作新文章的開頭
  const labels = chunks.filter(c => c.type === "label").length;
  const lastLabel = chunks.map(c => c.type).lastIndexOf("label");
  const cands = chunks.map((c, k) => ({ c, k }))
    .filter(({ c, k }) => c.type === "en" && k > lastLabel && k > 0 && chunks[k - 1].type === "trans" && chunks.slice(0, k).some(x => x.type === "en"));
  const need = expected - Math.max(labels, 1);
  if (need > 0) cands.sort((a, b) => b.c.text.length - a.c.text.length).slice(0, need).forEach(({ c }) => c.split = true);
  // 第三步：組合
  const passages = [], trans = [];
  let cur = null;
  for (const c of chunks) {
    if (c.type === "label") { cur = { label: c.text, lines: [] }; passages.push(cur); trans.push(`**${c.text}**`); }
    else if (c.type === "trans") trans.push(c.text);
    else {
      if (!cur || c.split) { cur = { label: "", lines: [] }; passages.push(cur); }
      cur.lines.push(c.text);
    }
  }
  if (passages.length > 1) passages.forEach((p, k) => { if (!p.label) p.label = "文章 " + (k + 1); });
  return { sub, passages: passages.filter(p => p.lines.length), trans: trans.join("\n\n"), vocab: vocab.join("\n") };
}

    const { pre, blocks } = splitBlocks(sec.lines);
    if (!sec.heading) {
      blocks.forEach(q => sets.push({ id: "q" + q.num, part: p, heading: null, questions: [q] }));
      continue;
    }
    const first = +(blocks[0] && blocks[0].num);
    const info = parsePreamble(pre, first >= 186 ? 3 : first >= 176 ? 2 : 1); // 多益 176-185 雙篇、186-200 三篇
    const byNum = {};
    for (const b of blocks) {
      const q = byNum[b.num] || (byNum[b.num] = { num: b.num, isNew: false, options: [], text: "", rest: "" });
      q.isNew = q.isNew || b.isNew;
      if (b.answer && q.options.length) { q.answer = b.answer; q.level = b.level; q.rest = b.body; } // Part 6：選項在前面，這塊全是解析
      else if (b.answer) { q.answer = b.answer; q.level = b.level; q.rest = b.rest; q.text = b.text; q.options = b.options; }
      else { if (b.options.length) q.options = b.options; if (b.rest) info.vocab += (info.vocab ? "\n\n" : "") + b.rest; }
    }
    const questions = Object.values(byNum).sort((a, b) => a.num - b.num);
    sets.push({ id: "s" + questions[0].num, part: p, heading: sec.heading, isNew: sec.isNew, ...info, questions });
  }
}

/* ---------- 作答紀錄 ---------- */
let state = {};
try { state = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) {}
const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} };
const st = id => state[id] || (state[id] = { picks: {}, done: false });

/* ---------- 畫面 ---------- */
const $ = s => document.querySelector(s);
document.title = title + " 閱讀練習";
$("#title").textContent = title + " 閱讀練習";
const partKeys = Object.keys(parts);
let curPart = partKeys[0];
try { const saved = localStorage.getItem(STORE_KEY + "-tab"); if (partKeys.includes(saved)) curPart = saved; } catch (e) {}

function renderTabs() {
  $("#tabs").innerHTML = partKeys.map(p =>
    `<button data-p="${p}" class="${p === curPart ? "active" : ""}">Part ${p}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    curPart = b.dataset.p;
    try { localStorage.setItem(STORE_KEY + "-tab", curPart); } catch (e) {}
    renderTabs(); renderMain(); scrollTo({ top: 0 });
  });
}

function renderScore() {
  let right = 0, done = 0, total = 0;
  for (const s of sets) {
    total += s.questions.length;
    const x = state[s.id];
    if (x && x.done) s.questions.forEach(q => { done++; if (x.picks[q.num] === q.answer) right++; });
  }
  $("#score").innerHTML = `已作答 <b>${done}</b> / ${total} 題，答對 <b>${right}</b> 題` + (done ? `（${Math.round(right / done * 100)}%）` : "");
}

function questionHTML(set, q) {
  const x = st(set.id), pick = x.picks[q.num];
  const opts = q.options.map(o => {
    let cls = "opt", tag = "";
    if (x.done) {
      if (o.key === q.answer) { cls += " right"; tag = "正解"; }
      else if (o.key === pick) { cls += " wrong"; tag = "你的答案"; }
      if (o.key === q.answer && o.key === pick) tag = "✓ 答對";
    } else if (o.key === pick) cls += " sel";
    return `<button class="${cls}" data-set="${set.id}" data-q="${q.num}" data-k="${o.key}" ${x.done ? "disabled" : ""}>
      <span class="l">(${o.key})</span><span>${inline(o.text)}</span>${tag ? `<span class="tag">${tag}</span>` : ""}</button>`;
  }).join("");
  let after = "";
  if (x.done) {
    const ok = pick === q.answer;
    after = `<div class="verdict ${ok ? "ok" : "bad"}">${ok ? "答對了" : pick ? `答錯了，你選 (${pick})` : "未作答"}・正確答案 (${q.answer})${q.level && q.level !== "?" ? `・難度：${q.level}` : ""}</div>
      <div class="explain">${md(q.rest)}</div>`;
  }
  return `<div class="q"><div class="qtext"><span class="qnum">${q.num}.</span>${q.isNew ? '<span class="new">新題型</span> ' : ""}${q.text ? md(q.text).replace(/^<p>|<\/p>$/g, "") : ""}</div>
    <div class="opts">${opts}</div>${after}</div>`;
}

function setHTML(set) {
  const x = st(set.id);
  const unanswered = set.questions.filter(q => !x.picks[q.num]).length;
  let passages = "";
  if (set.passages && set.passages.length) {
    passages = `<div class="passages">` + set.passages.map(p => {
      const body = p.lines.join("\n\n");
      return (p.label ? `<div class="plabel">${p.label}</div>` : "") + `<div class="passage">${md(x.done ? body : stripMarks(body))}</div>`;
    }).join("") + `</div>`;
  }
  const reveal = x.done && (set.trans || set.vocab)
    ? `<details class="reveal" open><summary>文章翻譯與單字</summary>${md(set.trans)}${md(set.vocab)}</details>` : "";
  const head = set.heading
    ? `<p class="set-title">${esc(set.heading)}${set.isNew ? ' <span class="new">新題型</span>' : ""}</p><p class="set-sub">${esc(set.sub || "")}</p>` : "";
  const btnLabel = set.heading ? "送出本題組" : "送出";
  const actions = x.done
    ? `<div class="actions"><span class="result">本組答對 ${set.questions.filter(q => x.picks[q.num] === q.answer).length} / ${set.questions.length}</span>
       <button class="btn" data-redo="${set.id}">重做這組</button></div>`
    : `<div class="actions"><button class="btn primary" data-submit="${set.id}" ${unanswered ? "disabled" : ""}>${btnLabel}</button>
       ${unanswered && set.questions.length > 1 ? `<span class="hint">還有 ${unanswered} 題沒選</span>` : ""}</div>`;
  return `<section class="card" id="${set.id}">${head}
    <div class="set-body ${passages ? "two" : ""}">${passages}<div>${set.questions.map(q => questionHTML(set, q)).join("")}${actions}</div></div>
    ${reveal}</section>`;
}

function renderSet(id) {
  const set = sets.find(s => s.id === id);
  const el = document.getElementById(id);
  el.outerHTML = setHTML(set);
  renderScore();
}

function renderMain() {
  const intro = intros[curPart];
  $("#main").innerHTML = (intro ? `<p class="part-intro"><b>Part ${curPart}：${intro.name}</b>　${esc(intro.text)}</p>` : "")
    + sets.filter(s => s.part === curPart).map(setHTML).join("");
  renderScore();
}

$("#main").addEventListener("click", e => {
  const opt = e.target.closest(".opt");
  if (opt && !opt.disabled) {
    st(opt.dataset.set).picks[opt.dataset.q] = opt.dataset.k; save(); renderSet(opt.dataset.set); return;
  }
  const sub = e.target.closest("[data-submit]");
  if (sub && !sub.disabled) { st(sub.dataset.submit).done = true; save(); renderSet(sub.dataset.submit); return; }
  const redo = e.target.closest("[data-redo]");
  if (redo) { state[redo.dataset.redo] = { picks: {}, done: false }; save(); renderSet(redo.dataset.redo); }
});
$("#resetAll").onclick = () => {
  if (!confirm("確定要清除這份考卷的所有作答紀錄？")) return;
  state = {}; save(); renderMain();
};

renderTabs();
renderMain();
</script>
</body>
</html>
