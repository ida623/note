appropriate (adj.) 適合的，適當的；bachelor's degree (phr.) 學士學位；ancient (adj.) 古代的，古老的；originally (adv.) 起初，原來；meet (v.) 符合，趕上（期限等）；method (n.) 方式，方法\n\n<!-- page 550 -->\n\n**155.** 答案 (C)｜難度：中\nWhat is NOT a purpose of the e-mail?\n- (A) To acknowledge receipt of an inquiry\n- (B) To request additional details about a client\n- (C) To describe career options for a student\n- (D) To offer information regarding a service\n\n> 什麼不是這封電子郵件的目的？\n> (A) 為了告知收到詢問\n> (B) 為了要求關於客戶的額外細節\n> (C) 為了描述學生的職業選擇\n> (D) 為了提供關於一項服務的資訊\n\n**Not/True Not 問題**\n這是需要在文章中找到與電子郵件目的相關的資訊，並且與選項敘述對照的 Not/True 問題。(A) 對應文中的「We recently received your e-mail regarding tutoring for your son」，表示最近收到對方詢問兒子家教事宜的電子郵件，符合選項敘述。(B) 對應文中的「I would like to ask for a couple of extra details that you did not mention originally」，表示想要問對方幾個原先沒有提到的細節，符合選項敘述。(C) 在文中沒有提到，所以 (C) To describe career options for a student 是正確答案。(D) 對應文中的「would like to give you some more details about the services we offer」，表示想再給對方一些關於服務的細節資訊，符合選項敘述。\n\n**替換表達**\nask for a couple of extra details 問幾個額外的細節 → request additional details 要求額外細節\ngive ~ some more details about the services 多給一些關於服務的細節 → offer information regarding a service 提供關於一項服務的資訊\n\n**單字** acknowledge (v.) 告知收到…，承認；receipt (n.) 收到，接收；inquiry (n.) 詢問，調查；career (n.) 職業，生涯\n\n**156.** 答案 (B)｜難度：中\nWhere do Ms. Gatineau's tutoring sessions take place?\n- (A) In the student's house\n- (B) In an office in downtown Edmonton\n- (C) At the student's school\n- (D) At the University of Eastern Canada\n\n> Gatineau 小姐的家教課在哪裡進行？\n> (A) 在學生家中\n> (B) 在 Edmonton 市中心的辦公室\n> (C) 在學生的學校\n> (D) 在 Eastern Canada 大學\n\n**wh- 問題 Where**\n這是問 Gatineau 小姐的家教課在哪裡（Where）進行的 wh- 問題，所以要尋找和問題重點 Ms. Gatineau's tutoring sessions take place 相關的內容。「our office in downtown Edmonton」的部分提到，辦公室在 Edmonton 市中心，而「Ms. Gatineau only works from our office」的部分說 Gatineau 小姐只在辦公室工作，所以 (B) In an office in downtown Edmonton 是正確答案。\n\n**157.** 答案 (C)｜難度：低\nWhat will Mr. Harcourt be discussing in the future?\n- (A) Grading systems\n- (B) Class schedules\n- (C) Tuition payment\n- (D) Test scores\n\n> Harcourt 先生以後會討論什麼？\n> (A) 評分制度\n> (B) 課表\n> (C) 學費付款\n> (D) 考試分數\n\n**wh- 問題 What**\n這是問 Harcourt 先生以後會討論什麼（What）的 wh- 問題，所以要尋找和問題重點 Mr. Harcourt be discussing in the future 相關的內容。「After we have this information, we can discuss payment methods.」的部分提到，有了關於 Jason 的其他資訊之後，就可以討論付費方式了，所以 (C) Tuition payment 是正確答案。和 (A) 相關的部分是「what school grade is he currently in」，這裡的 grade 表示「年級」，但選項中的 grading 表示「評分」，請不要搞混了。\n\n<!-- page 551 -->\n\n### Questions 158-160 refer to the following advertisement.\n158-160 題參照以下廣告。\n\n> The Dublin Academy of Fine Arts\n> [158-C] In cooperation with the Ministry of Culture\n> PRESENTS\n> The Works of Annie O'Dell\n> A RETROSPECTIVE EXHIBIT\n>\n> [159-D] Spanning a career of more than three decades, the work of award-winning artist Annie O'Dell [158-B] will be on display at the Sumner Building on the main campus of The Dublin Academy of Fine Arts from August 10 to September 10. Considered a leader in contemporary sculpture, [159-C] Ms. O'Dell's work has been shown in famous galleries and museums around the world. [160-B/D] Included in this special show will be more than 30 pieces of sculpture and a short biographical film on Ms. O'Dell. [158-A] The gallery will be open from Monday through Saturday from 10 a.m. to 5 p.m. [158-D] The exhibit is free to all currently enrolled students and staff members at DAFA. Visitors are also welcome to view the works for a fee of €5. [160-A] Guided tours of the exhibit will also be offered. For details on the particular works being exhibited, visit www.events.dafa.com.\n\n**翻譯**\n> 都柏林美術學院\n> [158-C] 與文化部協力\n> 呈獻\n> Annie O'Dell 作品\n> 回顧展\n>\n> [159-D] 橫跨得獎藝術家 Annie O'Dell 三十餘年藝術生涯的作品 [158-B] 將自 8 月 10 日至 9 月 10 日於都柏林美術學院主校區 Sumner 大樓展出。[159-C] O'Dell 女士被視為當代雕塑的領導者，她的作品曾於世界各地知名藝廊及博物館展出。[160-B/D] 本次特展將有 30 餘件雕塑作品及一支關於 O'Dell 女士的傳記短片。[158-A] 藝廊將於週一至週六上午 10 點至下午 5 點開放。[158-D] DAFA 現在的註冊學生與員工可免費參觀本展。也歡迎其他訪客以 5 歐元的費用觀賞作品。[160-A] 本展也將提供導覽。關於個別展出作品之詳細資訊，請上 www.events.dafa.com。\n\n**單字** fine art (phr.) 美術；in cooperation with (phr.) 與…合作；work (n.)（藝術）作品；retrospective (adj.) 回顧的；span (v.) 橫跨，跨越（一段時間）；display (n.) 展示，陳列；consider (v.) 認為，考慮；contemporary (adj.) 當代的，現代的；sculpture (n.) 雕塑，雕塑品；biographical (adj.) 傳記的；enroll (v.) 註冊，使入學\n\n**158.** 答案 (D)｜難度：低\nWhat is indicated about the exhibition?\n- (A) It is open only on weekdays.\n- (B) It will last for one week.\n- (C) It was paid for by the Ministry of Culture.\n- (D) It is free for DAFA instructors.\n\n> 關於展覽，文中提到什麼？\n> (A) 只在平日開放。\n> (B) 將持續進行一週。\n> (C) 由文化部支付費用。\n> (D) DAFA 的教師免費。\n\n**Not/True** True 問題\n這是需要在文章中找到與關鍵字 the exhibition 相關的資訊，並且與選項敘述對照的 Not/True 問題。和 (A) 相關的部分是「The gallery will be open from Monday through Saturday」，表示週一到週六開放（週六不是平日），不符合選項敘述。和 (B) 相關的部分是「will be on display ~ from August 10 to September 10」，表示從 8 月 10 日展出到 9 月 10 日，長達一個月，不符合選項敘述。和 (C) 相關的部分是「In cooperation with the Ministry of Culture」，表示與文化部協辦，但無法得知是否由文化部提供經費，所以不符合選項敘述。(D) 對應文中的「The exhibit is free to all currently enrolled students and staff members at DAFA.」，表示 DAFA 註冊學生與員工可以免費看展，符合選項敘述，所以 (D) It is free for DAFA instructors 是正確答案。\n\n**單字** instructor (n.) 教師，指導者\n\n<!-- page 552 -->\n\n**159.** 答案 (D)｜難度：中\nWhat is mentioned about Annie O'Dell?\n- (A) She is a staff member at the DAFA.\n- (B) She will present awards to art students.\n- (C) She is exhibiting her pieces for the first time.\n- (D) She has worked as an artist for many years.\n\n> 關於 Annie O'Dell，文中提到什麼？\n> (A) 她是 DAFA 的員工。\n> (B) 她將會頒獎給藝術系學生。\n> (C) 她將首度展出自己的作品。\n> (D) 她已經從事藝術家工作多年。\n\n**Not/True** True 問題\n這是需要在文章中找到與關鍵字 Annie O'Dell 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A) 和 (B) 在文中沒有提到。和 (C) 相關的部分是「Ms. O'Dell's work has been shown in famous galleries and museums around the world」，表示她的作品已經在世界各地的知名藝廊與博物館展覽過，不符合選項敘述。(D) 對應文中的「Spanning a career of more than three decades, the work of award-winning artist Annie O'Dell」，表示展出的作品橫跨 Annie O'Dell 三十多年的藝術生涯，符合選項敘述，所以 (D) She has worked as an artist for many years 是正確答案。\n\n**替換表達**\nmore than three decades 三十多年 → for many years 許多年\n\n**160.** 答案 (C)｜難度：中\nWhat is NOT an event scheduled for the exhibition?\n- (A) Tours of the exhibit\n- (B) A movie screening\n- (C) An opening reception\n- (D) A display of sculptures\n\n> 何者不是展覽中預定的活動？\n> (A) 展覽導覽\n> (B) 影片放映\n> (C) 開幕歡迎會\n> (D) 雕塑展示\n\n**Not/True** Not 問題\n這是需要在文章中找到與關鍵字 an event scheduled for the exhibition 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A) 對應文中的「Guided tours of the exhibit will also be offered.」，表示提供展覽導覽，符合選項敘述。(B) 和 (D) 對應文中的「Included in this special show will be more than 30 pieces of sculpture and a short biographical film on Ms. O'Dell.」，表示展覽中將有 30 餘件雕塑作品和一支關於 O'Dell 女士的傳記短片，符合選項敘述。(C) 在文中沒有提到，所以 (C) An opening reception 是正確答案。\n\n**替換表達**\nfilm 電影 → movie 電影\n\n**單字** screening (n.) 放映，上映；reception (n.) 歡迎會\n\n<!-- page 553 -->\n\n### Questions 161-163 refer to the following notice.\n161-163 題參照以下通知。\n\n> NOTICE\n>\n> This is a notice to everyone at GlobalFerm that the cafeteria on the sixth floor of the Superion Building will be inaccessible to employees effective May 27. — [1] —. [161] We are pleased to inform all staff, however, that the cafeteria will be renovated and converted into a Servex Modern dining establishment with an array of new food offerings. [163] It is our hope that this cafeteria makeover will reflect the suggestions indicated in our recent survey. — [2] —. [163] Therefore, vegetarian, vegan, and gluten-free items will also be available daily for those with dietary restrictions. [162] Log on to the GlobalFerm intranet and click \"Servex Modern\" under the \"Employee Benefits\" tab to have a look at cafeteria menus for both breakfast and lunch. They will be updated weekly for your convenience. We are also excited to announce that seating at the Servex Modern cafeteria will be expanded to 550 seats. — [3] —. This will include ample provision for people with disabilities. We apologize for any inconveniences during this renovation period, but we are sure you will appreciate all the changes. — [4] —.\n\n**翻譯**\n> 通知\n>\n> 在此通知 GlobalFerm 公司所有人員，Superion 大樓 6 樓的自助餐廳自 5 月 27 日起不對員工開放。— [1] —。[161] 不過，我們很高興通知所有員工，自助餐廳將改裝為 Servex Modern 的餐飲設施，提供一系列新的餐點。[163] 我們希望本次自助餐廳改裝將反映最近調查中提到的建議。— [2] —。[163] 因此，也將每天為有飲食限制者供應蔬食、純素食及無麩質餐點。[162] 請登入 GlobalFerm 公司內部網路並點擊「員工福利」標籤下的「Servex Modern」，看看自助餐廳的早餐與午餐菜單。為了讓各位方便，菜單將每週更新。我們也很高興宣布，Servex Modern 自助餐廳的座位將增加至 550 個。— [3] —。其中包括為身障者提供的充足空間。我們為改裝期間的不便致歉，但我們相信大家會喜歡這一切的改變。— [4] —。\n\n**單字** inaccessible (adj.) 無法接近的，難以接近的；renovate (v.) 翻新，改裝；convert (v.) 轉換，變換；establishment (n.) 設施，機構；an array of (phr.) 一系列的，大批的；makeover (n.) 改造，變身；vegan (adj.)（不用任何動物製品）純素主義的；dietary (adj.) 飲食的，膳食的；restriction (n.) 限制；ample (adj.) 充足的，大量的；provision (n.) 提供，供給，供應；disability (n.) 身心障礙，沒有能力\n\n**161.** 答案 (D)｜難度：低\nWhat is the purpose of the notice?\n- (A) To announce the relocation of a facility\n- (B) To clarify a policy concerning lunch breaks\n- (C) To inform employees of survey results\n- (D) To apprise staff of a pending renovation\n\n> 這則通知的目的是什麼？\n> (A) 為了宣布設施遷移\n> (B) 為了說明關於午餐休息時間的政策\n> (C) 為了通知員工調查結果\n> (D) 為了通知員工即將進行的改裝\n\n**尋找主題／目的** 文章的目的\n這是問通知目的的尋找主題問題，所以要特別注意文章開頭的部分。「We are pleased to inform all staff ~ that the cafeteria will be renovated and converted into a Servex Modern dining establishment」提到，很高興通知所有員工，自助餐廳將改裝為 Servex Modern 的餐飲設施，之後則說明餐廳改裝的相關細節，所以 (D) To apprise staff of a pending renovation 是正確答案。\n\n**單字** relocation (n.) 遷移，改變位置；clarify (v.) 闡明，澄清，淨化；lunch break (phr.) 午餐休息時間；apprise (v.) 告知，通知；pending (adj.) 即將發生的，待決的\n\n<!-- page 554 -->\n\n**162.** 答案 (D)｜難度：低\nWhere can employees check food options?\n- (A) In the lobby of the Superion Building\n- (B) Next to the cafeteria's main entrance\n- (C) On a bulletin board on the sixth floor\n- (D) On the company's intranet site\n\n> 員工可以在哪裡查看可選擇的飲食？\n> (A) Superion 大樓的大廳裡\n> (B) 自助餐廳正門旁邊\n> (C) 6 樓布告欄上\n> (D) 公司內部網站上\n\n**wh- 問題 Where**\n這是問員工可以在哪裡（Where）查看飲食選擇的 wh- 問題，所以要尋找和問題重點 employees check food options 相關的內容。「Log on to the GlobalFerm intranet ~ to have a look at cafeteria menus」的部分提到，可以登入 GlobalFerm 公司內部網路查看自助餐廳菜單，所以 (D) On the company's intranet site 是正確答案。\n\n**替換表達**\nfood options 食物選擇 → menus 菜單\n\n**單字** main entrance (phr.) 正門，主要出入口；bulletin board (phr.) 布告欄\n\n**163.** 🆕 答案 (B)｜難度：中\nIn which of the positions marked [1], [2], [3], and [4] does the following sentence best belong?\n\"We agree with you that it is necessary to offer a variety of meal options to suit everyone.\"\n- (A) [1]\n- (B) [2]\n- (C) [3]\n- (D) [4]\n\n> 以下這個句子最適合放在文中標記 [1]、[2]、[3]、[4] 的哪一個位置？\n> 「我們同意大家的意見，提供適合所有人的多種餐點選擇是必要的。」\n> (A) [1]\n> (B) [2]\n> (C) [3]\n> (D) [4]\n\n**找出句子位置**\n這是要依照文章的內容架構，判斷句子應該插入哪個位置的題目。題目所給的句子「We agree with you that it is necessary to offer a variety of meal options to suit everyone」表示同意大家的意見，認為供應適合所有人的多種餐點選擇是必要的，所以應該放在和餐點選擇範圍有關的部分。[2] 的上一句「It is our hope that this cafeteria makeover will reflect the suggestions indicated in our recent survey.」提到，希望自助餐廳改裝能反映最近調查中提到的建議，而 [2] 的下一句「Therefore, vegetarian, vegan, and gluten-free items will also be available daily for those with dietary restrictions.」則說因為什麼的關係，將會每天供應蔬食、純素食及無麩質餐點。在 [2] 的位置插入句子之後，表示最近做了調查，大家認為應該供應適合所有人的多種餐點，所以將會每天供應蔬食、純素食及無麩質餐點，文意前後連貫，所以 (B) [2] 是正確答案。\n\n**單字** variety (n.) 多樣性，變化；suit (v.) 適合，與…相配\n\n<!-- page 555 -->\n\n### Questions 164-167 refer to the following article.\n164-167 題參照以下報導。\n\n> First Global Expands Further\n> December 28\n>\n> [164/166] Electronics giant First Global, which makes components for smartphone manufacturers, [164] said in a press release on Tuesday that it expects to start building its 20th overseas production plant soon. The announcement comes at the end of a successful year, with sales in the fourth quarter surpassing those in the third quarter by 15 percent. President and CEO Ms. Genevieve Durand attributes First Global's growth to its efficiency in manufacturing. — [1] —. \"We find ways to do more with less,\" Durand claims, \"producing high-quality goods at competitive prices.\" — [2] —.\n>\n> Upon completion, the new factory will be situated near Beijing, China. It will be First Global's largest and one of six of its facilities located in the East Asian region. — [3] —. [165] Just as First Global has done before, it is using its own earnings to fund construction rather than taking out additional loans or selling off assets. [167] It is hoped that the new factory will boost productivity by approximately 20 percent. — [4] —. Construction on the plant will begin in spring of next year.\n\n**翻譯**\n> First Global 公司進一步擴張\n> 12 月 28 日\n>\n> [164/166] 為智慧型手機製造商生產零件的電子業巨人 First Global 公司 [164] 於週二發布新聞稿，表示預計很快將開始興建第 20 座海外生產工廠。本次公告在大獲成功的年度尾聲發布，今年第 4 季營業額較第 3 季成長百分之 15。總裁暨執行長 Genevieve Durand 女士將 First Global 公司的成長歸因於生產的效率。— [1] —。Durand 表示：「我們找到了用更少資源做得更多的方式，能夠以有競爭力的價格生產高品質的產品。」— [2] —。\n>\n> 新工廠將於中國北京附近落成。這座工廠將是 First Global 公司最大的一座，也是位於東亞地區的六座設施之一。— [3] —。[165] 與以往做法相同，First Global 公司將以本身的利潤作為建設資金，而非增加貸款或出售資產。[167] 公司希望新工廠將提高生產力約百分之 20。— [4] —。工廠建設將於明年春季開始。\n\n**單字** expand (v.) 擴張，展開；electronics (n.) 電子學，電子技術；giant (n.) 巨人，大公司；(adj.) 巨大的；component (n.) 零件，要素；manufacturer (n.) 製造者，製造商；overseas (adj.) 海外的；(adv.) 往海外；plant (n.) 工廠，植物；surpass (v.) 超過，勝過；attribute A to B (phr.) 將 A 歸因於 B；efficiency (n.) 效率；competitive (adj.) 競爭的，有競爭力的；earning (n.) 收入，利潤；fund (v.) 提供資金；take out (phr.) 借出（貸款），取出；loan (n.) 借貸，貸款；asset (n.) 資產，財產；productivity (n.) 生產力，生產性\n\n**164.** 答案 (D)｜難度：低\nWhy was the article written?\n- (A) To describe business trends in a region\n- (B) To report on sales of mobile phones\n- (C) To profile the goals of a CEO\n- (D) To announce plans for a new facility\n\n> 為什麼寫了這篇文章？\n> (A) 為了描述一個地區的商業趨勢\n> (B) 為了報導手機銷售\n> (C) 為了簡短敘述執行長的目標\n> (D) 為了宣布新設施的計畫\n\n**尋找主題／目的** 寫文章的理由\n這是問寫文章理由的尋找主題問題，所以要特別注意文章開頭的部分。「Electronics giant First Global ~ said in a press release ~ that it expects to start building its 20th overseas production plant soon.」提到，電子業巨人 First Global 公司將要興建第 20 座海外生產工廠，之後則說明興建工廠的相關細節，所以 (D) To announce plans for a new facility 是正確答案。\n\n**單字** trend (n.) 趨勢，傾向；profile (v.) 用短篇文章敘述（…的概要）\n\n<!-- page 556 -->\n\n**165.** 答案 (D)｜難度：高\nHow does First Global plan to finance its newest project?\n- (A) By selling company shares\n- (B) By bringing in a partner\n- (C) By increasing its line of credit\n- (D) By relying on past profits\n\n> First Global 公司打算怎麼為最新計畫供應資金？\n> (A) 出售公司股份\n> (B) 引進合作夥伴\n> (C) 增加信貸額度\n> (D) 依靠過去的利潤\n\n**wh- 問題 How**\n這是問 First Global 公司打算怎麼（How）為最新計畫供應資金的 wh- 問題。和問題重點 finance its newest project 相關的部分是「Just as First Global has done before, it is using its own earnings to fund construction」，表示 First Global 公司將以本身的利潤作為建設資金，所以 (D) By relying on past profits 是正確答案。\n\n**替換表達**\nfinance 提供資金 → fund 提供資金\nusing its own earnings 用自己的利潤 → relying on past profits 靠著過去的利潤\n\n**單字** share (n.) 股份，股票；line of credit (phr.) 信貸額度\n\n**166.** 答案 (C)｜難度：中\nWhat does the article suggest about First Global?\n- (A) Factory working conditions are below standards.\n- (B) Manufacturing will not grow as much as expected.\n- (C) Smartphone manufacturers buy their products.\n- (D) Expanding into Asia will be a new experience for them.\n\n> 關於 First Global 公司，報導中顯示什麼？\n> (A) 工廠的工作環境低於標準。\n> (B) 生產將不會如預期成長得那麼多。\n> (C) 智慧型手機製造商購買他們的產品。\n> (D) 擴展到亞洲對他們來說會是新的經驗。\n\n**推論** 細節資訊\n這是關於題目關鍵字 First Global 的推論問題。「Electronics giant First Global, which makes components for smartphone manufacturers」提到，First Global 公司是為智慧型手機製造商生產零件的電子公司，可以推知智慧型手機製造商會採購他們的產品，所以 (C) Smartphone manufacturers buy their products 是正確答案。\n\n**167.** 🆕 答案 (D)｜難度：高\nIn which of the positions marked [1], [2], [3], and [4] does the following sentence best belong?\n\"This increase in output will help the company keep up with the strong demand for smartphones.\"\n- (A) [1]\n- (B) [2]\n- (C) [3]\n- (D) [4]\n\n> 以下這個句子最適合放在文中標記 [1]、[2]、[3]、[4] 的哪一個位置？\n> 「產量的增加將幫助公司跟上智慧型手機的強勁需求。」\n> (A) [1]\n> (B) [2]\n> (C) [3]\n> (D) [4]\n\n**找出句子位置**\n這是要依照文章的內容架構，判斷句子應該插入哪個位置的題目。題目所給的句子「This increase in output will help the company keep up with the strong demand for smartphones」表示前面提到的產量增加，將幫助公司跟上智慧型手機的強勁需求，所以應該放在提到產量增加的部分後面。[4] 的上一句「It is hoped that the new factory will boost productivity by approximately 20 percent.」提到，公司希望新工廠將提高生產力約百分之 20。在 [4] 的位置插入句子之後，表示期望提高生產力約百分之 20，而這樣的增加可以幫助公司跟上智慧型手機的強勁需求，文意前後連貫，所以 (D) [4] 是正確答案。\n\n**單字** output (n.) 產量，輸出；keep up with (phr.) 跟上…；demand (n.) 需求，要求\n\n<!-- page 557 -->\n\n### Questions 168-171 refer to the following online chat discussion. 🆕\n168-171 題參照以下網路聊天討論。\n\n> **Beatrice Swenson** [1:22]\n> [168] I was checking out the sample pictures Billy Blake took of our products for the launch of our online store. I don't think they fully convey what it is like to shop in one of our retail stores. [170-D] Our products should be displayed in a more comfortable setting that makes customers feel at home. I've forwarded the pictures to your e-mail. [168] Let me know what you think.\n>\n> **Roberto Hernandez** [1:29]\n> I see what you mean. It would be nice to have pictures of each product in an actual home setting.\n>\n> **Angela Orbison** [1:30]\n> I feel the same as Roberto. [170-B] And it might be a good idea to hire some models too. Show actual people using our dishes or sitting on rugs. It would help connect our products to consumers.\n>\n> **Beatrice Swenson** [1:31]\n> [170-B] I agree with both your points. [169] But should we go with a different photographer?\n>\n> **Angela Orbison** [1:33]\n> I thought his work was quite good, but it just doesn't match our products' style.\n>\n> **Roberto Hernandez** [1:34]\n> [169] Well, maybe give him a second chance. Tell him about our concerns and see what he can come up with. It would save us the hassle of locating someone else.\n>\n> **Beatrice Swenson** [1:38]\n> [169] You're right, Roberto. I should give him another shot at it. I'll tell him he can use one of our stores as a location if needed. I'll let you know how it goes. [171] Can I get an update on your assignments?\n>\n> **Roberto Hernandez** [1:42]\n> The shipment of vases from Thailand hasn't arrived yet, so we might not be able to list them on the site by the launch date. Other than that, everything is fine.\n>\n> **Angela Orbison** [1:42]\n> [171] I've completed most of the site's checkout system after several months of working on it. There are a few minor glitches to work out, but overall I am on schedule and the system will be operational within a few days.\n\n**翻譯**\n> **Beatrice Swenson** [1:22]\n> [168] 我在看 Billy Blake 為我們網路商店開幕所拍的商品照片樣張。我覺得照片沒有完全傳達在我們的（實體）零售店購物的感覺。[170-D] 我們的產品應該用讓顧客感覺像在家一樣自在、更舒服的擺設來陳列。我把照片轉寄到你們的電子郵件信箱了。[168] 讓我知道你們的想法。\n>\n> **Roberto Hernandez** [1:29]\n> 我明白你的意思。把每樣商品放在實際居家背景裡拍照應該不錯。\n>\n> **Angela Orbison** [1:30]\n> 我跟 Roberto 有同感。[170-B] 請一些模特兒應該也是個好主意。就是讓人看到真人使用我們的盤子或坐在地毯上的樣子。這樣有助於把我們的產品和消費者連結起來。\n>\n> **Beatrice Swenson** [1:31]\n> [170-B] 我同意你們兩個的意見。[169] 但我們是不是應該用別的攝影師？\n>\n> **Angela Orbison** [1:33]\n> 我覺得他的作品不錯，只是不符合我們產品的風格。\n>\n> **Roberto Hernandez** [1:34]\n> [169] 嗯，或許再給他一次機會吧。告訴他我們在意的地方，看看他可以想出什麼。這樣可以省下我們找別人的麻煩。\n>\n> **Beatrice Swenson** [1:38]\n> [169] 你說的對，Roberto。我應該再給他一次機會。我會告訴他，如果需要的話可以用我們的店鋪當場地。我會告訴你們進行的情況。[171] 可以告訴我你們工作的最新情況嗎？\n>\n> **Roberto Hernandez** [1:42]\n> 從泰國運來的那批花瓶還沒到，所以我們或許不能在開站日那天列在網站上。除了這個以外，其他都沒問題。\n>\n> **Angela Orbison** [1:42]\n> [171] 我弄了幾個月，網站的結帳系統大部分已經完成了。還有一些小毛病要處理，但整體來說我符合進度，系統幾天後就可以運作。\n\n<!-- page 558 -->\n\n**單字** launch (n.) 發動，上市，發行；convey (v.) 傳達，輸送；retail store (phr.) 零售店；forward (v.) 轉寄，轉交；actual (adj.) 實際的，事實上的；setting (n.) 背景，環境；consumer (n.) 消費者；match (v.) 與…相配；(n.) 比賽；concern (n.) 關心的事，擔心的事；(v.) 關係到…；come up with (phr.) 想出…；hassle (n.) 麻煩；(v.) 煩擾；locate (v.) 找出，設置；shipment (n.) 運輸，運輸的貨物；list (v.) 列出，列入商品目錄中；(n.) 列表；glitch (n.) 小故障，小毛病；work out (phr.) 解決，（事態）進展；on schedule (phr.) 按照預定時程；operational (adj.) 運作的，營運的\n\n**168.** 答案 (C)｜難度：高\nWhat is mainly being discussed?\n- (A) Scheduled tests for an online store's payment system\n- (B) Products to feature in a special promotion\n- (C) Images for a retail site taken by a professional\n- (D) Types of models to hire for an upcoming photoshoot\n\n> 主要在討論什麼？\n> (A) 網路商店付款系統預定的測試\n> (B) 將包含在特別促銷中的產品\n> (C) 專業人士為零售網站拍攝的圖片\n> (D) 接下來的照片拍攝要聘請的模特兒類型\n\n**尋找主題／目的** 文章的主題\n這是問討論主題的尋找主題問題，所以要特別注意文章開頭的部分。Beatrice Swenson 說「I was checking out the sample pictures Billy Blake took of our products for the launch of our online store.」，表示她在看 Billy Blake 為自家網路商店開幕所拍的商品照片樣張，又說「Let me know what you think.」徵詢其他人的意見，之後的部分則是討論大家對於攝影師所拍的照片的想法，所以 (C) Images for a retail site taken by a professional 是正確答案。\n\n**單字** feature (v.) 以…為特色，（特別）包含…；(n.) 特徵；promotion (n.) 促銷，宣傳；professional (n.) 專業人士；photoshoot (n.) 照片拍攝\n\n**169.** 🆕 答案 (B)｜難度：中\nAt 1:38, what does Ms. Swenson mean when she writes, \"give him another shot at it\"?\n- (A) She may hire Mr. Blake to develop an online shop.\n- (B) She will ask a photographer to retake some sample pictures.\n- (C) She may use the photos sent to her e-mail account.\n- (D) She will try to make a reservation at an establishment.\n\n> 在 1:38，Swenson 小姐說的「give him another shot at it」是什麼意思？\n> (A) 她可能會聘請 Blake 先生開發網路商店。\n> (B) 她會要求攝影師重拍一些照片樣張。\n> (C) 她會使用寄到她電子郵件帳戶的照片。\n> (D) 她會試圖在一間機構預約。\n\n**掌握意圖**\n題目問 Swenson 小姐的意思，所以要掌握引用部分（give him another shot at it）上下文的情境。她說「But should we go with a different photographer?」，想問其他人是否同意換別的攝影師，而 Roberto Hernandez 回答「Well, maybe give him a second chance.」，表示應該再給他一次機會。對此 Swenson 小姐回應「You're right, Roberto.」，表示同意 Roberto 的看法，並且說「I should give him another shot at it.」，其中的「give him another shot at it」（再給他一次嘗試做這件事的機會）表示讓現在的攝影師再拍一次看看，所以 (B) She will ask a photographer to retake some sample pictures 是正確答案。\n\n<!-- page 559 -->\n\n**170.** 答案 (B)｜難度：中\nWhat is true about Ms. Swenson?\n- (A) She manages sales at a home accessory store.\n- (B) She also thinks that models should be used.\n- (C) She has contacted other freelance photographers.\n- (D) She wants to make a retail store more comfortable.\n\n> 關於 Swenson 小姐，何者正確？\n> (A) 她管理一間家飾品店的銷售業務。\n> (B) 她也認為應該使用模特兒。\n> (C) 她已經聯絡了其他自由接案的攝影師。\n> (D) 她想要使零售店更舒適。\n\n**Not/True** True 問題\n這是需要在文章中找到與關鍵字 Ms. Swenson 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A) 在文中沒有提到。(B) 對應 Orbison 小姐說的「And it might be a good idea to hire some models too.」，表示她認為找模特兒拍照是個好主意，而 Swenson 小姐回應「I agree with both your points.」表示同意，符合選項敘述，所以 (B) She also thinks that models should be used 是正確答案。(C) 在文中沒有提到。和 (D) 相關的部分是「Our products should be displayed in a more comfortable setting」，表示產品在照片中應該用更舒服的擺設來陳列，而不是說店面應該更舒適，所以不符合選項敘述。\n\n**171.** 答案 (A)｜難度：低\nWhat most likely is Ms. Orbison's job?\n- (A) Payment system developer\n- (B) Corporate image consultant\n- (C) Store merchandise buyer\n- (D) Web graphics designer\n\n> Orbison 小姐的工作最有可能是什麼？\n> (A) 付款系統開發者\n> (B) 企業形象顧問\n> (C) 店內商品採購\n> (D) 網頁視覺設計師\n\n**推論** 細節資訊\n這是關於題目關鍵字 Ms. Orbison's job 的推論問題。Swenson 小姐說「Can I get an update on your assignments?」，請其他人報告自己工作的最新情況，Orbison 小姐回答「I've completed most of the site's checkout system after several months of working on it.」，表示自己花了幾個月的時間，把網站的結帳系統大部分完成了，可以推知她負責開發網站的結帳系統，所以 (A) Payment system developer 是正確答案。\n\n**替換表達**\ncheckout system 結帳系統 → Payment system 付款系統\n\n**單字** corporate (adj.) 企業的，公司的；merchandise (n.) 商品\n\n<!-- page 560 -->\n\n### Questions 172-175 refer to the following e-mail.\n172-175 題參照以下電子郵件。\n\n> TO: Benjamin Pinkerton <benpin@ponyexpress.com>\n> FROM: Carol Andrews <carol@ponyexpress.com>\n> SUBJECT: Trip to head office\n> DATE: July 18\n>\n> Benjamin,\n>\n> [172] I just wanted to give you a tentative summary of the itinerary for our visit to Washington, D.C. next week. A company car will pick us up at the airport when we arrive on Monday afternoon and take us to the Earthgate Hotel. I received a reservation e-mail this morning, and [173-B] the hotel has confirmed us for the presidential suite, so that will be quite nice. We will have a few hours at the hotel before we meet with [174] Linda Krakowski, the head of Recon Paper Company. She kindly offered to meet us for dinner at the hotel so that we don't have to travel anywhere after our long trip.\n>\n> The next day [173-D] we will have different meetings and engagements for almost the full day at the corporate headquarters. [173-A] We will also have lunch with the CEO and several members of the board of directors. I estimate that we should be finished with everything by about 7 p.m.\n>\n> We are booked on a return flight for Wednesday morning, but I've also been informed there's a late night flight to Los Angeles at 11:35 p.m. on Tuesday. [175] Would you prefer returning on Tuesday or Wednesday? Either flight is fine with me. [175] Let me know what you want to do, and I can go ahead and inform the office in D.C.\n>\n> Thanks!\n>\n> Carol Andrews\n> Sales supervisor\n> Pony Express, Inc.\n\n**翻譯**\n> 收件者：Benjamin Pinkerton <benpin@ponyexpress.com>\n> 寄件者：Carol Andrews <carol@ponyexpress.com>\n> 主旨：出差到總公司\n> 日期：7 月 18 日\n>\n> Benjamin：\n>\n> [172] 我想給你我們下週到華盛頓特區的暫定行程概要。我們星期一下午抵達的時候，會有公司的車來機場接我們，載我們到 Earthgate 飯店。我今天早上收到預約電子郵件，[173-B] 飯店已經確認了我們的總統套房，所以很不錯。我們和 [174] Recon 紙業公司的總經理 Linda Krakowski 見面前有幾個小時的時間待在飯店。她很好意地提議在飯店和我們見面吃晚餐，這樣我們就不用在長途旅行後接著去其他地方。\n>\n> 隔天 [173-D] 我們在公司總部幾乎一整天都有各種不同的會議和會面。[173-A] 我們也會和執行長以及幾位董事會成員吃午餐。我預估所有事情應該會在晚間 7 點左右結束。\n>\n> 我們預訂的回程航班是星期三上午，但我也被告知星期二晚上 11:35 有飛往洛杉磯的深夜航班。[175] 你比較希望星期二還是星期三回來？我哪一班都可以。[175] 告訴我你想怎麼做，我就可以處理並且通知華盛頓特區的辦公室。\n>\n> 謝謝！\n>\n> Carol Andrews\n> 業務部主管\n> Pony Express 公司\n\n**單字** head office (phr.) 總公司；tentative (adj.) 暫定的；summary (n.) 概要；itinerary (n.) 旅程，旅行計畫；confirm (v.) 確認，確定；presidential suite (phr.) 總統套房；engagement (n.) 約好做某事的約定；headquarters (n.) 總部，總公司；board of directors (phr.) 董事會\n\n**172.** 答案 (A)｜難度：低\nWhy did Ms. Andrews write the e-mail?\n- (A) To inform a colleague about a schedule\n- (B) To request changes to a reservation\n- (C) To ask about hotel facilities\n- (D) To summarize the results of a meeting\n\n> Andrews 小姐為什麼寫了這封電子郵件？\n> (A) 為了告知同事時程安排\n> (B) 為了要求變更預約\n> (C) 為了詢問飯店設施\n> (D) 為了概述會議的結果\n\n**尋找主題／目的** 寫文章的理由\n這是問 Andrews 小姐寫信理由的尋找主題問題，所以要特別注意文章開頭的部分。「I just wanted to give you a tentative summary of the itinerary for our visit」表示想要給對方暫定的行程概要，之後的部分則說明行程的細節，所以 (A) To inform a colleague about a schedule 是正確答案。\n\n<!-- page 561 -->\n\n**替換表達**\ngive ~ a ~ summary of the itinerary 給予行程概要 → inform ~ about a schedule 告知時程安排\n\n**173.** 答案 (C)｜難度：中\nWhat is NOT mentioned in the e-mail?\n- (A) A lunch has been scheduled with a superior.\n- (B) The hotel has already confirmed a reservation.\n- (C) The start of a project has been postponed.\n- (D) Meetings will take place at a head office.\n\n> 電子郵件中沒有提到什麼？\n> (A) 已經安排了和上級的午餐。\n> (B) 飯店已經確認了預約。\n> (C) 計畫開始的時間延後了。\n> (D) 會議將在總公司進行。\n\n**Not/True Not 問題**\n這是問電子郵件沒有提到什麼的 Not/True 問題。題目並沒有特定的關鍵字，所以要在文中找到與各選項相關的資訊，並確認是否正確。(A) 對應文中的「We will also have lunch with the CEO and several members of the board of directors.」，表示要和執行長以及幾位董事會成員吃午餐，符合選項敘述。(B) 對應文中的「the hotel has confirmed us for the presidential suite」，表示飯店已經確認房間的預訂，符合選項敘述。(C) 在文中沒有提到，所以 (C) The start of a project has been postponed 是正確答案。(D) 對應文中的「we will have different meetings and engagements ~ at the corporate headquarters」，表示會在總公司開會，符合選項敘述。\n\n**替換表達**\nwill ~ have lunch with the CEO and several members of the board of directors 會和執行長以及幾位董事會成員吃午餐 → A lunch has been scheduled with a superior 已經安排了和上級的午餐\nwill have ~ meetings ~ at the corporate headquarters 在總部將有會議 → Meetings will take place at a head office 會議將在總公司進行\n\n**單字** postpone (v.) 延後，使延期\n\n**174.** 答案 (A)｜難度：中\nWhy is Ms. Krakowski coming to the hotel?\n- (A) It is convenient for the visitors.\n- (B) She will be speaking at a conference there.\n- (C) It is located close to her office.\n- (D) She wants to try a new restaurant.\n\n> Krakowski 小姐為什麼會到飯店？\n> (A) 這裡對來訪的人方便。\n> (B) 她會在那裡舉行的會議演講。\n> (C) 飯店離她的辦公室很近。\n> (D) 她想吃吃看一家新餐廳。\n\n**wh- 問題 Why**\n這是問 Krakowski 小姐為什麼（Why）會到飯店的 wh- 問題。和問題重點 Ms. Krakowski coming to the hotel 相關的部分是「Linda Krakowski ~ kindly offered to meet us for dinner at the hotel so that we don't have to travel anywhere after our long trip.」，表示提議和到訪當地的兩人在飯店見面吃晚餐，讓他們不用在長途旅行後接著去其他地方，所以 (A) It is convenient for the visitors 是正確答案。\n\n**175.** 答案 (D)｜難度：低\nWhat information does Ms. Andrews require of Mr. Pinkerton?\n- (A) A seat assignment\n- (B) A contact number\n- (C) A meeting agenda\n- (D) A preferred date\n\n> Andrews 小姐要求 Pinkerton 先生提供什麼資訊？\n> (A) 座位安排\n> (B) 聯絡電話\n> (C) 會議議程\n> (D) 偏好的日期\n\n**wh- 問題 What**\n這是問 Andrews 小姐要求 Pinkerton 先生提供什麼（What）資訊的 wh- 問題。和問題重點 Ms. Andrews require of Mr. Pinkerton 相關的部分是「Would you prefer returning on Tuesday or Wednesday?」和「Let me know what you want to do」，請對方告知希望在星期二還是星期三回來，所以 (D) A preferred date 是正確答案。\n\n**單字** assignment (n.) 分配，分派；agenda (n.) 議程，待議諸事項\n\n<!-- page 562 -->\n\n### Questions 176-180 refer to the following article and e-mail.\n176-180 題參照以下報導與電子郵件。\n\n**文章 1**\n\n> **Lamington Ranch Proves Cooperative Farming Can Be Successful**\n> By Marjorie Nelson\n>\n> New Zealand-based Lamington Ranch was established 12 years ago by Ben and Rachel Lamington. [180] They purchased a piece of property in Masterton two hours away from Wellington, intending to farm it on their own. Without a workforce, however, the ranch was not productive. After just four years, the Lamingtons faced bankruptcy and searched desperately for solutions.\n>\n> [176-C] They looked into hiring workers but lacked the necessary funds. Next, [176-A] they considered selling some ranch land. When that did not work out, [176-B] they even thought about leasing the farm out to an agriculture corporation. Finally, Rachel remembered growing up on a cooperative farm in Israel, before her family moved to New Zealand. The couple discussed their options and decided to try cooperative farming.\n>\n> \"[177-B] We based our concept on the communal farm I grew up on in Israel,\" Rachel mentions in an interview. The Lamingtons assigned portions of the land to local residents, who pay a modest rent and a portion of their profits to the Lamingtons. The collected funds are then available for other uses, such as maintenance, future building projects, and payment of property taxes, with any remaining cash going to the Lamingtons as their share.\n>\n> Within a few years of [177-B] applying the farming concept to Lamington Ranch, the couple erased their debt and began making a profit. [177-C] The ranch currently hosts 22 farmers who raise livestock or grow crops including kiwi, apples, and olives. \"It's amazing that not so long ago we were about to lose everything, and now we earn a good income and help provide a living to other farmers as well,\" said Ben. He mentioned that other ranches in the country are also looking into cooperative farming as an alternative.\n\n**翻譯**\n\n> **Lamington 牧場證明合作農牧能夠成功**\n> Marjorie Nelson 撰文\n>\n> 位於紐西蘭的 Lamington 牧場由 Ben Lamington 與 Rachel Lamington 於 12 年前創立。[180] 他們在離威靈頓 2 小時路程的馬斯特頓購買了土地，打算自行從事農牧工作。但由於缺乏人力，牧場生產力不高。僅僅四年後，Lamington 夫婦面臨破產，拚命尋找解決辦法。\n>\n> [176-C] 他們曾考慮雇用員工，但缺少必要的資金。接著，[176-A] 他們考慮出售部分牧場土地。但這個方法也行不通，[176-B] 他們甚至考慮過出租農場給農業公司。最後，Rachel 記起她在舉家搬遷到紐西蘭之前，是在以色列的合作式農場長大的。這對夫婦討論了他們的選擇，並決定嘗試合作農牧。\n>\n> Rachel 在一次訪談中提到：「[177-B] 我們的概念是以我在以色列成長的集體農場為基礎。」Lamington 夫婦將土地分區分配給當地居民，而他們支付低廉的租金以及一部分的利潤給 Lamington 夫婦。收到的金錢則可作為其他用途，例如維護、未來建設計畫、支付房地產稅，剩餘的所有金錢歸 Lamington 夫婦所有。\n>\n> [177-B] 在 Lamington 牧場採用這個農牧概念後的幾年內，這對夫婦還清了債務並開始獲利。[177-C] 牧場目前有 22 位從業員，他們飼養家畜或種植奇異果、蘋果、橄欖等作物。Ben 說：「我們不久前幾乎要失去一切，現在卻有很好的收入，並且幫忙其他從事農牧的人謀生，真的很神奇。」他提到，國內其他牧場也在研究改採合作農牧的可能性。\n\n**文章 2**\n\n> TO: Rachel Lamington <raclam@lamingtonranch.co.nz>\n> FROM: Darius Carver <dcarver@oceaniaentrepreneurs.co.nz>\n> SUBJECT: Special request\n> DATE: June 11\n>\n> Dear Ms. Lamington,\n>\n> I recently read a newspaper article entitled \"Lamington Ranch Proves Cooperative Farming Can Be Successful\" in *The Cook Strait Times* about you and your husband. [178/180] I would be very interested in visiting your farm and meeting with you both for an interview. I work as a staff writer for *Oceania Entrepreneurs*, a magazine that features\n\n**翻譯**\n\n> 收件者：Rachel Lamington <raclam@lamingtonranch.co.nz>\n> 寄件者：Darius Carver <dcarver@oceaniaentrepreneurs.co.nz>\n> 主旨：特別的請求\n> 日期：6 月 11 日\n>\n> 親愛的 Lamington 小姐：\n>\n> 我最近在報紙《Cook Strait Times》一則標題為「Lamington 牧場證明合作農牧能夠成功」的報導讀到您和丈夫的故事。[178/180] 我很希望拜訪你們的農場，並\n\n<!-- page 563 -->\n\n> notable businesspeople, inventors, and innovative thinkers from the Australasia region.\n>\n> We would also like to feature some photographs of the ranch and its facilities and possibly interview some of the other farmers in your cooperative. [179-C] The article may also be considered for publication as a cover article, which would be great publicity for you!\n>\n> Our offices are based in Wellington, so [180] I would be happy to take my car out to the ranch anytime. Please let me know if you are interested and, if so, when you are available.\n>\n> Sincerely yours,\n> Darius Carver\n\n**翻譯**\n\n> 且採訪你們兩位。我是《Oceania Entrepreneurs》的特約撰稿人，這是報導澳大拉西亞（澳洲、紐西蘭及鄰近的太平洋島嶼）地區知名商業人士、發明家、創新思想家的雜誌。\n>\n> 我們也想刊登一些牧場及其設施的照片，或許也會訪問與你們合作的一些牧場從業人員。[179-C] 這則報導可能被考慮當成封面故事刊出，這對你們會是很棒的宣傳！\n>\n> 我們的辦公室位於威靈頓，所以 [180] 我很樂意隨時開自己的車到牧場。請告訴我您是否有興趣，如果有的話，也請告訴我您有空的時間。\n>\n> Darius Carver\n\n**單字**\n文章 1：ranch (n.) 牧場，農場；cooperative farming (phr.) 合作務農／畜牧；desperately (adv.) 拚命地，絕望地；intend (v.) 打算做……，意圖；workforce (n.) 勞動力，全體員工；communal (adj.) 共同的，共有的；productive (adj.) 有生產力的，多產的；bankruptcy (n.) 破產；property tax (phr.) 財產稅；look into (phr.) 調查，研究；agriculture (n.) 農業；livestock (n.) 家畜；modest (adj.) 不多的，適度的；maintenance (n.) 維護，保養；debt (n.) 債；host (v.) 當主人，主辦；be about to (phr.) 即將……，快要……；alternative (n.) 替代方案；(adj.) 替代的\n文章 2：staff writer (phr.) 特約撰稿人，本報記者；inventor (n.) 發明者，發明家；innovative (adj.) 創新的，革新的；cooperative (n.)（例如農業的）合作社；publication (n.) 出版，發行；publicity (n.) 宣傳，廣告\n\n**176.** 答案 (D)｜難度：中\nWhat is NOT mentioned as an option the Lamingtons considered when facing bankruptcy?\n- (A) Putting some property up for sale\n- (B) Renting out some land\n- (C) Taking on employees\n- (D) Applying for a bank loan\n\n> 文中沒有提到什麼 Lamington 夫婦面臨破產時曾經考慮的選擇？\n> (A) 出售部分土地\n> (B) 出租部分土地\n> (C) 雇用員工\n> (D) 申請銀行貸款\n\n**Not/True Not 問題**\n這是需要找到與關鍵字 an option the Lamingtons considered when facing bankruptcy 相關的資訊，並且與選項敘述對照的 Not/True 問題，所以要看提到 Lamington 夫婦面臨破產時考慮過什麼的報導（第一篇文章）。(A) 對應文中的「they considered selling some ranch land」，表示考慮過出售部分牧場土地，符合選項敘述。(B) 對應文中的「they even thought about leasing the farm out to an agriculture corporation」，表示考慮過出租農場給農業公司，符合選項敘述。(C) 對應文中的「They looked into hiring workers」，表示考慮過雇用員工，符合選項敘述。(D) 在文中沒有提到，所以 (D) Applying for a bank loan 是正確答案。\n\n**替換表達**\nselling 出售 → Putting ~ up for sale 釋出求售\nleasing ~ out 租出 → Renting out 租出\nhiring workers 雇用員工 → Taking on employees 雇用員工\n\n**單字** take on 雇用\n\n<!-- page 564 -->\n\n**177.** 答案 (B)｜難度：中\nWhat does the article say about Lamington Ranch?\n- (A) It has changed ownership on numerous occasions.\n- (B) It was inspired by a similar community in another country.\n- (C) It is used exclusively for raising agricultural animals.\n- (D) It is completely environmentally friendly.\n\n> 關於 Lamington 牧場，報導說了什麼？\n> (A) 所有權曾多次轉手。\n> (B) 靈感來自於另一個國家的類似社群。\n> (C) 只用來飼養農業動物。\n> (D) 完全符合環保。\n\n**Not/True True 問題**\n這是需要在報導（第一篇文章）中找到與關鍵字 Lamington Ranch 相關的資訊，並且與選項敘述對照的 Not/True 問題。(A) 在文中沒有提到。(B) 對應文中的「We based on our concept on the communal farm I grew up on in Israel」和「applying the farming concept to Lamington Ranch」，表示農場的概念來自以色列的集體農場，也實際在 Lamington 牧場運用了，符合選項敘述，所以 (B) It was inspired by a similar community in another country 是正確答案。和 (C) 相關的部分是「The ranch currently hosts 22 farmers who raise livestock or grow crops including kiwi, apples, and olives.」，表示牧場飼養家畜並種植奇異果、蘋果、橄欖等作物，不符合選項敘述。(D) 在文中沒有提到。\n\n**單字** ownership (n.) 所有權，擁有；numerous occasions (phr.) 許多次；inspire (v.) 激發靈感，激勵；exclusively (adv.) 專門地，僅僅；environmentally friendly (phr.) 環保的\n\n**178.** 答案 (B)｜難度：低\nWhy was the e-mail written?\n- (A) To request a subscription renewal\n- (B) To ask for an in person meeting\n- (C) To point out a mistake in an article\n- (D) To express interest in joining a cooperative\n\n> 為什麼寫了這封電子郵件？\n> (A) 為了申請續訂\n> (B) 為了要求實際見面\n> (C) 為了指出報導的錯誤\n> (D) 為了表達加入合作社的意願\n\n**尋找主題／目的 寫文章的理由**\n這是問寫信理由的尋找主題問題，所以要看電子郵件（第二篇文章）的內容。「I would be very interested in visiting your farm and meeting with you both for an interview.」的部分說，想要拜訪 Lamington 夫婦的農場，並且採訪他們，所以 (B) To ask for an in person meeting 是正確答案。\n\n**單字** subscription (n.) 訂閱，訂閱費；renewal (n.) 更新，續延\n\n**179.** 答案 (C)｜難度：高\nWhat does Mr. Carver indicate about the Lamingtons?\n- (A) They have motivated him to start a business.\n- (B) They have become quite popular in Israel.\n- (C) They could benefit from some free publicity.\n- (D) They receive many offers of investment.\n\n> 關於 Lamington 夫婦，Carver 先生提到什麼？\n> (A) 他們激勵了他開始創業。\n> (B) 他們在以色列變得很受歡迎。\n> (C) 他們可以因為一些免費的宣傳受益。\n> (D) 他們接到許多投資提議。\n\n**Not/True True 問題**\n這是問對於題目關鍵字 the Lamingtons，Carver 先生提到什麼的 Not/True 問題，所以要看他所寫的電子郵件（第二篇文章），並且與選項敘述對照。(A)、(B)、(D) 在文中沒有提到。(C) 對應文中的「The article may also be considered for publication as a cover article, which would be great publicity for you!」，表示報導可能被當成封面故事，對 Lamington 夫婦會是很好的宣傳，符合選項敘述，所以 (C) They could benefit from some free publicity 是正確答案。\n\n**單字** motivate (v.) 給予動機，激發，促使\n\n<!-- page 565 -->\n\n**180.** 答案 (B)｜難度：高\nWhat will Mr. Carver most likely do if his request is granted?\n- (A) Hire a photographer\n- (B) Visit Masterton\n- (C) Cancel some appointments\n- (D) Move to Wellington\n\n> 如果要求獲准的話，Carver 先生最有可能做什麼？\n> (A) 聘請攝影師\n> (B) 拜訪馬斯特頓\n> (C) 取消一些約會\n> (D) 搬到威靈頓\n\n**推論 多篇文章綜合題**\n這是必須參考兩篇文章內容的多篇文章綜合題。先看提到與題目關鍵部分 Mr. Carver ~ do if his request is granted 相關內容的電子郵件（第二篇文章）。\n\n第二篇文章中的「I would be very interested in visiting your farm and meeting with you both for an interview.」和「I would be happy to take my car out to the ranch anytime」提到，Carver 先生希望到牧場進行採訪，而且很樂意隨時開自己的車到牧場，這是第一個線索。但是，這裡沒有提到牧場在哪裡，所以還需要在第一篇文章（報導）中確認。第一篇文章中的「They purchased a piece of property in Masterton two hours away from Wellington」提到，Lamington 夫婦在離威靈頓 2 小時路程的馬斯特頓購買了土地，可知牧場在馬斯特頓，這是第二個線索。\n\n綜合「Carver 先生會開車到牧場進行採訪」和「牧場在馬斯特頓」這兩個線索，可知如果獲准採訪的話，Carver 先生會去馬斯特頓，所以 (B) Visit Masterton 是正確答案。\n\n**單字** grant (v.) 同意，准予；cancel (v.) 取消\n\n<!-- page 566 -->\n\n### Questions 181-185 refer to the following e-mail and notice.\n181-185 題參照以下電子郵件與通知。\n\n**文章 1**\n\n> To: Gary Flores <gflores49@thmail.com>\n> From: Wendy Rhodes <w_rhodes@tarmail.net>\n> Date: July 10\n> Subject: Planning suggestions\n>\n> Dear Mr. Flores,\n>\n> I hope this message finds you well. The last time we met, [181] you had asked me to advise you on drafting a retirement plan. Below are just a few tips to get you started.\n>\n> First, it is vital that you create and maintain a cash reserve for emergency purposes equal to roughly three times your typical monthly expenses. Since this amount could be quite large, it is important to start saving as early as possible.\n>\n> Additionally, [183] I recommend investigating long-term medical care options upon retiring for you, your spouse, and your parents, and compiling emergency information to share with your family members.\n>\n> I have attached a special guest pass so that you can attend my lecture, \"Retirement for One,\" at a university event. [185] The same pass also allows you to sit in on a special lunch seminar on health coverage for senior citizens conducted by Mr. Victor Rochester. The events will be free of charge to you if you present the pass at the door.\n>\n> I look forward to seeing you soon.\n>\n> Warmest Regards,\n>\n> Wendy Rhodes\n> Retirement planning specialist\n> Cottler Finance\n\n**翻譯**\n> 收件者：Gary Flores <gflores49@thmail.com>\n> 寄件者：Wendy Rhodes <w_rhodes@tarmail.net>\n> 日期：7 月 10 日\n> 主旨：關於計畫的建議\n>\n> 親愛的 Flores 先生：\n>\n> 收信愉快。上次我們見面時，[181] 您要我提供草擬退休計畫的建議。以下是可以幫助您開始的一點建議。\n>\n> 首先，累積並維持大約相當於您平常每月開支 3 倍的預留現金以備急用是必要的。由於這筆金額可能相當龐大，所以盡早開始儲蓄很重要。\n>\n> 另外，[183] 我也建議為您、您的配偶以及父母研究退休後長期醫療的選擇，並且收集緊急資訊與家人分享。\n>\n> 我附上了一張特別招待券，讓您可以參加我在大學活動中的「一個人的退休」演講。[185] 也可以用這張招待券參加由 Victor Rochester 先生主持、關於年長者健康保險的特別午餐研討會。在門口出示這張招待券，就能免費參加這些活動。\n>\n> 期待很快見到您。\n>\n> Wendy Rhodes\n> 退休計畫專家\n> Cottler 金融公司\n\n**文章 2**\n\n> **The Career Development Center**\n> Sunfield State University\n>\n> [184] The Career Development Center at Sunfield State University strives to provide high-quality, affordable education and professional development for working professionals and retirees in an open and encouraging environment.\n>\n> We are pleased to announce that our Annual Center Information Event will take place on Monday, July 12, on the fifth floor of Durgan Hall. We welcome you to join retirement advisor Wendy Rhodes for her lecture. On Tuesday, July 13, the first of a two-part seminar on part-time employment prospects will be held from 3 to 5 p.m. This will conclude at the same time the following day, on Wednesday, July 14. Lastly, [185] we will also hold a special\n\n**翻譯**\n> **職涯發展中心**\n> Sunfield 州立大學\n>\n> [184] Sunfield 州立大學職涯發展中心致力於在開放且激勵人心的環境中為在職專業人士及退休人士提供高品質且價格低廉的教育與專業發展服務。\n>\n> 我們很高興宣布，我們的年度中心說明會將於 7 月 12 日星期一在 Durgan 廳 5 樓舉行。歡迎您參加退休顧問 Wendy Rhodes 的演講。7 月 13 日星期二下午 3 點到 5 點將舉行兩階段的兼職工作展望研討會的第一場。隔天 7 月 14 日星期三的（第二階段）研討會也將在同一時間結束。最後，[185] 我們也將在 7 月 15\n\n<!-- page 567 -->\n\n> luncheon presentation by our center director, Mr. Victor Rochester on Thursday, July 15. Entrance for the event is $10 for center members and $15 for the open public. Tickets for the luncheon are an additional $10 and are available for purchase from July 1 through July 15 at our main office in Durgan Hall. To learn more, call 555-2402.\n\n**翻譯**\n> 日星期四舉辦由中心主任 Victor Rochester 先生主講的特別午餐簡報。活動入場費為中心會員 10 美元、一般大眾 15 美元。午餐會門票另收 10 美元，可自 7 月 1 日至 7 月 15 日於 Durgan 廳的中心總辦公室購買。欲知詳情請電洽 555-2402。\n\n**單字** 文章 1：advise (v.) 建議，勸告；draft (v.) 草擬；(n.) 草稿，草案；retirement (n.) 退休；vital (adj.) 必要的，充滿活力的；reserve (n.) 保留，儲備；emergency (n.) 緊急情況；roughly (adv.) 大約，大致上；typical (adj.) 典型的，代表性的；investigate (v.) 調查，研究；spouse (n.) 配偶；compile (v.) 匯編，收集；coverage (n.) 保險範圍\n文章 2：strive (v.) 努力，奮鬥；affordable (adj.) 價格或時間、資源上負擔得起的；retiree (n.) 退休者；encouraging (adj.) 鼓勵人心的；prospect (n.) 前景，展望；luncheon (n.) 午餐會；entrance (n.) 入場，進入權；open public (phr.) 一般大眾\n\n**181.** 答案 (A)｜難度：低\nWhat is the purpose of the e-mail?\n- (A) To extend some helpful advice\n- (B) To outline the details of a program\n- (C) To identify needs for a luncheon\n- (D) To discuss an upcoming lecture\n\n> 電子郵件的目的是什麼？\n> (A) 為了提供一些有幫助的建議\n> (B) 為了概述計畫的詳情\n> (C) 為了確定午餐會的必要性\n> (D) 為了討論即將進行的演講\n\n**尋找主題／目的 文章的目的**\n這是問電子郵件（第一篇文章）的目的是什麼的尋找主題問題。電子郵件中的「you had asked me to advise you on drafting a retirement plan」提到，對方要求提供草擬退休計畫的建議，而「Below are just a few tips to get you started.」表示接下來會提供一些建議，所以 (A) To extend some helpful advice 是正確答案。\n\n**替換表達**\na few tips 一些建議 → some ~ advice 一些建議\n\n**單字** extend (v.) 提供，延伸；outline (v.) 概述；(n.) 概要；identify (v.) 確定，辨別\n\n**182.** 答案 (B)｜難度：低\nIn the e-mail, the word \"Since\" in paragraph 2, line 2, is closest in meaning to\n- (A) Although\n- (B) Because\n- (C) Even if\n- (D) So that\n\n> 電子郵件第 2 段第 2 行的「Since」意思最接近\n> (A) 雖然\n> (B) 因為\n> (C) 即使\n> (D) 以便\n\n**同義詞**\n在電子郵件（第一篇文章）中，Since 在「Since this amount could be quite large, it is important to start saving」這個句子裡的意思是「由於」，所以表示「因為」的 (B) Because 是正確答案。\n\n**183.** 答案 (D)｜難度：中\nAccording to the e-mail, what should Mr. Flores do with his emergency information?\n- (A) Write it down in a list on his desk\n- (B) Save it in his cell phone\n- (C) Create a memo on his tablet\n- (D) Distribute it among family members\n\n> 根據電子郵件，Flores 先生應該對於緊急資訊做什麼？\n> (A) 在桌上寫成一張列表\n> (B) 存在行動電話裡\n> (C) 在平板電腦上寫備忘錄\n> (D) 分發給家人\n\n**wh- 問題 What**\n\n<!-- page 568 -->\n\n這是問根據電子郵件（第一篇文章），Flores 先生應該對於緊急資訊做什麼（What）的 wh- 問題。「I recommend ~ compiling emergency information to share with your family members」的部分說，建議收件人 Flores 先生收集緊急資訊與家人分享，所以 (D) Distribute it among family members 是正確答案。\n\n**替換表達**\nshare with ~ family members 與家庭成員分享 → Distribute ~ among family members 分發給家人\n\n**單字** write down (phr.) 寫下來；distribute (v.) 分發，分配\n\n**184.** 答案 (B)｜難度：中\nWho is welcome to visit the Career Development Center?\n- (A) Professionals in the field of human resources\n- (B) Employed and retired adults\n- (C) University students looking for jobs\n- (D) Faculty members seeking a promotion\n\n> 職涯發展中心歡迎什麼人前往？\n> (A) 人力資源領域的專業人士\n> (B) 受雇與退休的成年人\n> (C) 正在找工作的大學生\n> (D) 想要升職的教職員\n\n**wh- 問題 Who**\n這是問職涯發展中心歡迎什麼人（Who）前往的 wh- 問題，所以要看介紹題目關鍵字 Career Development Center 的通知（第二篇文章）。「The Career Development Center ~ strives to provide ~ education and professional development for working professionals and retirees」的部分提到，職涯發展中心致力於為在職專業人士及退休人士提供教育與專業發展服務，所以 (B) Employed and retired adults 是正確答案。\n\n**替換表達**\nworking professionals and retirees 工作中的專業人士和退休人士 → Employed and retired adults 受雇與退休的成年人\n\n**單字** faculty (n.) 全體教職員；promotion (n.) 升職，晉升\n\n**185.** 答案 (C)｜難度：高\nWhat is indicated about Mr. Flores?\n- (A) He will assist Dr. Rhodes with her lecture.\n- (B) He has a lunch meeting in Durgan Hall.\n- (C) He can attend an event on Thursday for free.\n- (D) He requires more than one ticket.\n\n> 關於 Flores 先生，文中提到什麼？\n> (A) 他會在 Rhodes 博士的演講中幫忙。\n> (B) 他在 Durgan 廳有一場午餐會議。\n> (C) 他可以免費參加星期四的活動。\n> (D) 他需要的票不止一張。\n\n**推論 多篇文章綜合題**\n這是必須參考兩篇文章內容的多篇文章綜合題，所以先看寫給題目關鍵字 Mr. Flores 的電子郵件（第一篇文章）。\n\n在第一篇文章「The same pass also allows you to sit in on a special lunch seminar ~ by Mr. Victor Rochester. The events will be free of charge ~ the door.」的部分，Rhodes 小姐說她給 Flores 先生的招待券也可以用來免費參加 Victor Rochester 主持的午餐研討會，這是第一個線索。但是，這裡沒有提到午餐研討會什麼時候舉行，所以還需要在第二篇文章（通知）中確認。第二篇文章中的「we will also hold a special luncheon presentation by ~ Mr. Victor Rochester on Thursday」提到，將在星期四舉辦 Victor Rochester 主講的特別午餐簡報，這是第二個線索。\n\n綜合「Rhodes 小姐給 Flores 先生的招待券可以用來免費參加 Victor Rochester 主持的午餐研討會」和「將在星期四舉辦 Victor Rochester 主講的特別午餐簡報」這兩個線索，可以推知 Flores 先生能用招待券免費參加星期四由 Victor Rochester 主持的午餐會，所以 (C) He can attend an event on Thursday for free 是正確答案。\n\n<!-- page 569 -->\n\n### Questions 186-190 refer to the following invitation, e-mail, and form. 🆕\n186-190 題參照以下邀請函、電子郵件及表格。\n\n**文章 1**\n\n> Pittsburgh Business Association (PBA) presents:\n> [187-A/188-B] **Business 101**\n> Thursday, October 12, from 8:30 a.m. to 1:00 p.m.\n> [187-C] at the Vantage Hotel, 5000 Fifth Avenue, Pittsburgh, PA 15232\n>\n> [188-B] Get advice on st ess 101\n> Date: September 28\n>\n> Dave,\n>\n> I have to be at a training seminar in Miami from October 11 to 14 along with other senior bank executives from around the country. As a result, [188-B/190] Simon Ashley will be assuming my position and screening loan applications at the Business 101 seminar. Please inform everyone that I am scheduled to meet with on Thursday that he will be taking my place. [188-C/190] Assure them that he is a highly skilled business development officer [188-C] who has worked with\n\n**翻譯**\n> 收件者：Dave Saxon <d.saxon@pba.org>\n> 寄件者：Linda Baker <l.baker@capitolbank.com>\n> 主旨：Business 101\n> 日期：9 月 28 日\n>\n> Dave：\n>\n> 我 10 月 11 日到 14 日要和全國各地的銀行高層主管一起參加邁阿密的一場培訓研討會。所以，[188-B/190] Simon Ashley 會代理我的職務，並且在 Business 101 研討會審查貸款申請。請告訴預定在星\n\n<!-- page 570 -->\n\n> Capitol Bank for eight years. [188-B] He is familiar with our practices, and has a thorough knowledge of the requirements for starting a business as well as mortgages. He'll have no problem answering any questions that come up.\n>\n> Sincerely,\n>\n> [190] Linda Baker\n> Supervising Loan Officer\n\n**翻譯**\n> 期四和我見面的所有人，說他會代替我。[188-C/190] 跟他們說他是非常有能力的事業發展專員，[188-C] 在 Capitol 銀行工作了 8 年，讓他們放心。[188-B] 他熟知我們的慣例，對於創業與抵押貸款的必要條件也有完備的知識。他回答任何詢問都不會有問題。\n>\n> [190] Linda Baker\n> 主管貸款專員\n\n**文章 3**\n\n> **CAPITOL BANK LOAN APPLICATION**\n>\n> Date: October 10\n>\n> Applicant Information\n> [189/190] Applicant's Name: Shirley Castle\n> Business Name: Castle Arts & Crafts\n> Business address: 3024 Beechwood Boulevard, Pittsburgh, PA 15217\n> Business type: Retail and services\n> Number of staff: 15\n> Phone: 555-6573\n> E-mail: s.castle@castlecrafts.com\n>\n> Desired loan amount:\n> ☒ $5,000 to $25,000　☐ $25,001 to $50,000\n> ☐ $50,001 and above\n>\n> [189] Please outline the use of funds below.\n>\n> | Purpose | Estimated cost | Comments |\n> |---|---|---|\n> | Land and building | - | |\n> | New construction | - | |\n> | Leasehold improvements | $7,000 | [189] Conversion of existing storage area to workshop classroom |\n> | Supplies or equipment | $2,500 | Fixtures and furnishing |\n> | Financial obligations | - | |\n>\n> Submission of this form does not guarantee a loan. [190] All loans must be evaluated by a business development officer or a supervising loan officer.\n\n**翻譯**\n> **CAPITOL 銀行貸款申請**\n>\n> 日期：10 月 10 日\n>\n> 申請者資訊\n> [189/190] 申請者名稱：Shirley Castle\n> 公司名稱：Castle Arts & Crafts\n> 公司地址：3024 號，Beechwood 大道，匹茲堡，賓夕法尼亞州 15217\n> 公司類型：零售與服務\n> 員工人數：15\n> 電話：555-6573\n> 電子郵件：s.castle@castlecrafts.com\n>\n> 希望貸款總額：\n> ☒ 5,000 至 25,000 美元　☐ 25,001 至 50,000 美元\n> ☐ 50,001 美元以上\n>\n> [189] 請於下表概述資金用途。\n>\n> | 用途 | 估計費用 | 說明 |\n> |---|---|---|\n> | 土地與建築物 | - | |\n> | 新建設 | - | |\n> | 租賃資產改良 | 7,000 美元 | [189] 將現有儲藏區域改為作坊教室 |\n> | 用品或設備 | 2,500 美元 | 固定設備與家具 |\n> | 金融債務 | - | |\n>\n> 提交本表不保證可獲得貸款。[190] 所有貸款必須經過事業發展專員或主管貸款專員評估。\n\n**單字** 文章 1：host (v.) 主辦，主持；(n.) 主人；foster (v.) 促進，培養；entrepreneurship (n.) 創業精神，創業活動；innovation (n.) 創新，革新；sign up (phr.) 報名，申請；loan (n.) 貸款，借出；screen (v.) 篩選，審查；application (n.) 申請書，適用，應用；consultant (n.) 顧問，提供諮詢者\n文章 2：along with (phr.) 和…一起；assume (v.) 承擔，假定；schedule (v.) 預定；(n.) 日程安排；assure (v.) 向…保證，使確信，使放心；skilled (adj.) 熟練的，有技能的；familiar (adj.) 熟知的，熟悉的；practice (n.) 慣例，練習；(v.) 練習；thorough (adj.) 徹底的，完全的；mortgage (n.) 抵押貸款；come up (phr.) 出現，發生\n文章 3：obligation (n.) 義務；責任；submission (n.) 提交，屈服；guarantee (v.) 保證，擔保；evaluate (v.) 評價，評估\n\n<!-- page 571 -->\n\n**186.** 答案 (C)｜難度：低\nWhat has Mr. Chang been scheduled to do?\n- (A) Provide loan consultations\n- (B) Discuss financing for small businesses\n- (C) Give a talk on matters pertaining to law\n- (D) Lead a discussion on attracting customer\n\n> Chang 先生預定要做什麼？\n> (A) 提供貸款諮詢\n> (B) 討論為小型企業籌措資金\n> (C) 發表關於法律問題的演講\n> (D) 帶領關於吸引顧客的討論\n\n**wh- 問題 What**\n這是問 Chang 先生預定要做什麼（What）的 wh- 問題，所以要看提到與題目關鍵部分 Mr. Chang 相關內容的邀請函（第一篇文章）。「Legal matters: Robert Chang」的部分顯示，Chang 先生要發表關於法律問題的演講，所以 (C) Give a talk on matters pertaining to law 是正確答案。\n\n**單字** give a talk (phr.) 演講；pertaining to (phr.) 和…相關的\n\n**187.** 答案 (A)｜難度：高\nWhat is true about the Business 101 seminar?\n- (A) It includes an activity led by a sponsoring organization.\n- (B) It is exclusively for members of a business association.\n- (C) It will be held at a group's headquarters in Pittsburgh.\n- (D) It will allow companies to recruit new staff.\n\n> 關於 Business 101 研討會，何者正確？\n> (A) 包括由贊助機構帶領的活動。\n> (B) 只限商業協會的會員參加。\n> (C) 將在匹茲堡的某個集團總部舉辦。\n> (D) 可以讓公司招募新員工。\n\n**Not/True True 問題**\n這是需要找到與關鍵字 the Business 101 seminar 相關的資訊，並且與選項敘述對照的 Not/True 問題，所以要看介紹 Business 101 研討會的邀請函（第一篇文章）。(A) 對應文中的「Business 101」、「Screening for loan applications with Capitol Bank supervising loan officer Linda Baker」，表示 Capitol 銀行主管貸款專員 Linda Baker 將在 Business 101 研討會中審查貸款申請，而「Sponsored by: Capitol Bank」顯示這場活動由 Capitol 銀行贊助，符合選項敘述，所以 (A) It includes an activity led by a sponsoring organization 是正確答案。和 (B) 相關的部分是「Non-members may purchase tickets for $125」，表示非會員也可以用 125 美元的費用參加，不符合選項敘述。和 (C) 相關的部分是「at the Vantage Hotel, ~ Pittsburgh」，表示會議在匹茲堡的 Vantage 飯店舉辦，不符合選項敘述。和 (D) 相關的部分是「Hiring staff」，表示有關於雇用員工的演講，但不是表示可以在會中招募員工，不符合選項敘述。\n\n**188.** 答案 (B)｜難度：高\nWhat is mentioned about Mr. Ashley?\n- (A) He has attended PBA events in the past.\n- (B) He is familiar with the subject of a seminar.\n- (C) He has been in the banking industry for decades.\n- (D) He plans to distribute promotional material.\n\n> 關於 Ashley 先生，文中提到什麼？\n> (A) 他以前參加過 PBA 的活動。\n> (B) 他對於一場研討會的主題很熟悉。\n> (C) 他在銀行業有數十年的經歷。\n> (D) 他計畫要分發宣傳資料。\n\n**Not/True 多篇文章綜合題**\n這是需要找到與關鍵字 Mr. Ashley 相關的資訊，並且與選項敘述對照的 Not/True 問題，所以先看提到 Ashley 先生的電子郵件（第二篇文章）。(A) 在文中沒有提到。(B) 對應第二篇文章中的「Simon Ashley will be ~ screening loan applications at the Business 101 seminar.」和「He ~ has a thorough knowledge of the requirements for starting a business as well as mortgages.」，表示 Ashley 先生將在 Business 101 研討會審查貸款申請，而他對於創業與抵押貸款的必要條件也有完備的知識，這是第一個線索。但是，這裡沒有提到 Business 101 研討會的主題是什麼，所以還需要在第一篇文章（邀請函）中確認。第一篇文章中的「Business 101」、「Get advice on starting a business by attending this seminar」表示在 Business 101 研討會可以獲得關於創業的建議，這是第二個線索。綜合「Ashley 先生將在 Business 101 研討會審查貸款申請，而且對於創業有完備的知識」和「在 Business 101 研討會可以獲得關於創業的建議」這兩個線索，可以得知 Ashley 先生很熟悉這場研討會的主題，所以 (B) He is familiar with the subject of a seminar. 是正確答案。\n\n<!-- page 572 -->\n\n和 (C) 相關的部分是第二篇文章的「Assure them that he ~ has worked with Capitol Bank for eight years.」，表示 Ashley 先生在 Capitol 銀行工作了 8 年，無法得知他是不是有幾十年的經歷，所以不符合選項敘述。(D) 在文中沒有提到。\n\n**替換表達**\nhas a thorough knowledge 擁有完備的知識 → is familiar 熟知\n\n**189.** 答案 (C)｜難度：中\nWhat can be inferred about Ms. Castle?\n- (A) She employs over two dozen staff members.\n- (B) Her store is expanding to a second location.\n- (C) She plans to hold classes at her establishment.\n- (D) Her estimated expenses exceed her requested loan amount.\n\n> 關於 Castle 小姐，可以推知什麼？\n> (A) 她雇用超過 24 名員工。\n> (B) 她的店鋪即將擴展到第二個地點。\n> (C) 她打算在自己的設施裡開課。\n> (D) 她的估計花費超過她申請的貸款總額。\n\n**推論 細節資訊**\n這是關於 Castle 小姐的推論問題，所以要從她填寫的表格（第三篇文章）中找出相關的內容。表格中的「Applicant's Name: Shirley Castle」、「Please outline the use of funds below.」和「Conversion of existing storage area to workshop classroom」顯示，Castle 小姐申請的貸款有一部分要用來把儲藏區域改為作坊教室，所以可以推斷，她打算在自己的設施裡開課，(C) She plans to hold classes at her establishment 是正確答案。\n\n**單字** employ (v.) 雇用，使用；expense (n.) 費用，開銷；exceed (v.) 超過\n\n**190.** 答案 (B)｜難度：最高\nWhat is suggested about Ms. Castle's loan application?\n- (A) It is missing some required information.\n- (B) It will be evaluated by Mr. Ashley.\n- (C) It was completed during a seminar.\n- (D) It must be mailed in by October 10.\n\n> Castle 小姐的貸款申請書顯示什麼？\n> (A) 缺少一些必要資訊。\n> (B) 將由 Ashley 先生評估。\n> (C) 是在研討會中填寫完成的。\n> (D) 必須在 10 月 10 日前寄出。\n\n**推論 多篇文章綜合題**\n這是必須參考三篇文章其中兩篇內容的多篇文章綜合題。首先看題目提到的 Castle 小姐的貸款申請書（第三篇文章）。\n\n第三篇文章中，「Applicant's Name: Shirley Castle」和「All loans must be evaluated by a business development officer or a supervising loan officer.」顯示 Castle 小姐的申請表必須經過事業發展專員或主管貸款專員評估，這是第一個線索。但是，這裡沒有提到事業發展專員或主管貸款專員是誰，所以還需要在第二篇文章（電子郵件）中確認。第二篇文章中，「Simon Ashley will be assuming my position and screening loan applications at the Business 101 seminar」、「Assure them that he is a highly skilled business development officer」和「Linda Baker, Supervising Loan Officer」提到 Ashley 先生將會代理 Linda Baker 在 Business 101 研討會審查貸款申請，同時可以得知 Ashley 先生是事業發展專員，而 Linda Baker 是主管貸款專員，這是第二個線索。\n\n綜合「Castle 小姐的申請表必須經過事業發展專員或主管貸款專員評估」和「事業發展專員 Ashley 先生將會代理主管貸款專員 Linda Baker 在 Business 101 研討會審查貸款申請」這兩個線索，可以推知 Castle 小姐的貸款申請書將由 Ashley 先生評估，所以 (B) It will be evaluated by Mr. Ashley 是正確答案。\n\n<!-- page 573 -->\n\n### Questions 191-195 refer to the following announcement, e-mail, and review. 🆕\n191-195 題參照以下公告、電子郵件及評論。\n\n**文章 1**\n\n> [191-A] The Meredith Fashion Institute (MFI) invites you to attend our annual spring fashion show featuring our graduating students:\n>\n> A Breath of Fresh Air\n> A showcase of fashions that are light, airy, and innovative\n>\n> [191-B] Entertainment, Lunch, and Fashion Show\n> [194-A/D] Master of ceremonies: Stylist Melvin Lee\n> Music by DJ Raina\n> [191-D] $40 per Person\n> Saturday, May 7, Noon\n>\n> Hannah Hall Banquet Room\n> Meredith Fashion Institute\n>\n> [191-A] As always, the event is being held at our campus on 1000 South Grand Avenue in Los Angeles. [192] All proceeds benefit a start-up fund for beginning designers who need support to become established in the competitive world of fashion design.\n\n**翻譯**\n> [191-A] Meredith 時尚學院（MFI）邀請您參加展出本院畢業生作品的年度春季時裝秀：\n>\n> 清新氣息\n> 輕盈如風的創新時尚展示\n>\n> [191-B] 娛樂、午餐與時裝秀\n> [194-A/D] 主持人：造型師 Melvin Lee\n> 音樂由 DJ Raina 演出\n> [191-D] 每人 40 美元\n> 5 月 7 日星期六中午\n>\n> Hannah 會館宴會廳\n> Meredith 時尚學院\n>\n> [191-A] 如同往常，活動將於本院校區洛杉磯 South Grand 街 1000 號舉行。[192] 所有收益將捐贈給支援新人設計師在競爭激烈的時尚設計界確立地位的創業者基金。\n\n**文章 2**\n\n> To: Troy Seeger <t.seeger@mfi.com>\n> From: Anna Cruise <anna_cruise@imagephoto.com>\n> Date: April 4\n> Subject: Re: Photo services\n>\n> Dear Mr. Seeger,\n>\n> I received your message concerning Meredith Fashion Institute's upcoming event. [192] I appreciate what the proceeds of the show will be used for, so I would be happy to participate as the official photographer. Moreover, I am willing to offer my services free of charge and provide you with images for the school's use. However, [193] the costs of covering an event as large as this one are quite high, even though it will provide me with a lot of exposure. Therefore, [193] I am asking your permission to install a photo booth by the entrance and to charge visitors a small fee for prints. All I need is space to set up my camera, table, backdrop, and printer. I can leave an assistant in charge of the table while I photograph the event. Please contact me at 555-0493 to discuss this further.\n>\n> Sincerely,\n> Anna Cruise\n\n**翻譯**\n> 收件者：Troy Seeger <t.seeger@mfi.com>\n> 寄件者：Anna Cruise <anna_cruise@imagephoto.com>\n> 日期：4 月 4 日\n> 主旨：回覆：攝影服務\n>\n> 親愛的 Seeger 先生：\n>\n> 我收到您關於 Meredith 時尚學院即將舉行活動的訊息。[192] 我很欣賞這場秀的收益用途，所以我很樂意以官方攝影師的身分參加。而且，我願意免費提供服務，並且提供圖片供學校使用。不過，雖然活動能為我帶來許多曝光，[193] 但負責這種大型活動的費用相當高。所以，[193] 請您允許我在入口搭建拍照處，並且向來客收取小小的照片輸出費用。我需要的就只是可以設置相機、桌子、背景和印表機的空間。我在為活動攝影的時候，可以留一位助理負責桌子這裡。請撥 555-0493 聯絡我，進一步討論這件事。\n>\n> Anna Cruise\n\n**文章 3**\n\n> **LA Scene**\n> By Beth Rowlands\n> *Fashion Guide Magazine*\n>\n> As always, the Meredith Fashion Institute's annual showcase of student fashion offered an exciting glimpse\n\n**翻譯**\n> 《Fashion Guide 雜誌》\n> **LA 業界現場**\n> Beth Rowlands 撰文\n>\n> 一如往常，Meredith 時尚學院的年度學\n\n<!-- page 574 -->\n\n> into the possible future of the industry. For those who are unaware, MFI has turned out many successful graduates, including Roxy Cooper and Belle Hashimoto. [194-D] The event's host, also a graduate of the institute, has done models' hair and makeup for several of *Fashion Guide Magazine*'s feature articles. [195-B] The fashions in this year's show truly lived up to the theme of being \"light, airy, and innovative.\" They featured plenty of loose tops, baggy pants, and oversize coats. The clothing was subdued, consisting mainly of neutral shades accented by the occasional hint of color. But the materials stood out the most—textured fabrics expertly cut into a variety of bold shapes. [195-C] Check out some photos below. You may be able to find some of them at a local fashion retailer one day.\n\n**翻譯**\n> 生時裝秀讓我們一瞥時尚業令人興奮的未來可能性。如果你不知道的話，其實 MFI 出了許多了成功的畢業生，包括 Roxy Cooper 和 Belle Hashimoto。[194-D] 本活動主持人，同時也是該學院畢業生，曾經為《Fashion Guide 雜誌》的幾篇專題報導打理模特兒的髮型與妝容。[195-B] 今年的秀所展示的時尚，的確實現了「輕盈如風而創新」的主題。這些服裝包括寬鬆的上衣、垮褲和寬版大衣。服裝顏色柔和，以低彩度的顏色為主，偶爾以些許色彩作為強調。但最突出的是材質——具有紋理的布料被巧妙地裁剪為各種大膽的形狀。[195-C] 請看以下照片。或許有一天你能在當地的時裝零售店找到其中某些設計。\n\n**單字**\n文章 1：graduating student (phr.) 將畢業的學生；master of ceremonies (phr.) 典禮主持人，司儀；benefit (v.) 使受益，對…有益；established (adj.) 已確立地位的；airy (adj.) 空氣般的，通風的；proceeds (n.) 收益，收入\n文章 2：concerning (prep.) 關於…；exposure (n.) 曝光；assistant (n.) 助理，助手；charge (n.) 費用，責任；(v.) 向…收費；permission (n.) 許可，允許；cover (v.) 負責，處理；backdrop (n.) 背景幕，背景\n文章 3：glimpse (n.) 一瞥；live up to (phr.) 實踐，符合…；neutral (adj.)（顏色）低彩度的，中立的；accent (v.) 強調；(n.) 強調；textured (adj.) 有粗糙或浮凸紋理的；turn out (phr.) 產出，結果是…；loose (adj.) 鬆的；(v.) 變鬆；occasional (adj.) 偶爾的；expertly (adv.) 技巧高超地，專業地；truly (adv.) 真正地，確實；subdued (adj.) 柔和的，緩和的；shade (n.) 色調，陰影；stand out (phr.) 突出，顯眼；bold (adj.) 大膽的，醒目的\n\n**191.** 答案 (C)｜難度：中\nWhat is NOT indicated about Meredith Fashion Institute's event?\n- (A) It is held yearly at a school ground.\n- (B) It includes a meal for participants.\n- (C) It coincides with the launch of a brand.\n- (D) It charges visitors a fee to gain entrance.\n\n> 關於 Meredith 時尚學院的活動，文中沒有提到什麼？\n> (A) 每年在校區舉辦。\n> (B) 包含為參加者準備的餐點。\n> (C) 和某個品牌的推出是同一天。\n> (D) 向來訪者收取入場費。\n\n**Not/True Not 問題**\n這是需要找到與關鍵字 Meredith Fashion Institute's event 相關的資訊，並且與選項敘述對照的 Not/True 問題，所以要看介紹活動的公告（第一篇文章）。(A) 對應文中的「The Meredith Fashion Institute (MFI) invites you to attend our annual spring fashion show」和「As always, the event is being held at our campus」，表示 Meredith 每年舉辦春季時裝秀，而且這次和往常一樣在學校校區舉行，符合選項敘述。(B) 對應文中的「Entertainment, Lunch, and Fashion Show」，表示活動中有娛樂、午餐與時裝秀，符合選項敘述。(C) 在文中沒有提到，所以 (C) It coincides with the launch of a brand 是正確答案。(D) 對應文中的「$40 per Person」，表示每人要付 40 美元，符合選項敘述。\n\n**替換表達**\nannual 年度的 → yearly 每年\ncampus 校區 → school ground 學校腹地\nLunch 午餐 → meal 餐點\n\n**單字** coincide (v.) 同時發生，一致；launch (n.) 發起，上市；(v.) 發動\n\n<!-- page 575 -->\n\n**192.** 答案 (A)｜難度：高\nWhat does Ms. Cruise say that she appreciates about the event?\n- (A) Profits from it will go toward helping aspiring designers.\n- (B) It will help amateur photographers gain some much-needed publicity.\n- (C) She will not have to bring her own equipment to it.\n- (D) It will provide her with an opportunity to display some work.\n\n> Cruise 小姐說她欣賞活動的什麼地方？\n> (A) 活動收益將用來幫助有志成為設計師的人。\n> (B) 活動將幫助業餘攝影師獲得十分需要的宣傳。\n> (C) 她不必帶自己的設備過去。\n> (D) 活動提供她展示作品的機會。\n\n**wh- 問題 多篇文章綜合題**\n這是必須參考三篇文章其中兩篇內容的多篇文章綜合題。題目的關鍵部分是 Ms. Cruise ~ appreciates about the event，問 Cruise 小姐表示自己欣賞活動的什麼地方（What），所以先看她所寫的電子郵件（第二篇文章）。\n\n在第二篇文章中的「I appreciate what the proceeds of the show will be used for」，Cruise 小姐表示她很欣賞這場秀的收益用途，這是第一個線索。但是，這裡沒有提到收益用途是什麼，所以還需要確認公告（第一篇文章）的內容。第一篇文章中的「All proceeds benefit a start-up fund for beginning designers」提到，所有收益將捐贈給支援新人設計師的創業者基金，這是第二個線索。\n\n綜合「Cruise 小姐表示她很欣賞這場秀的收益用途」和「所有收益將捐贈給支援新人設計師的創業者基金」這兩個線索，可以推知 Cruise 小姐欣賞活動收益將捐給支援新人設計師的基金這一點，所以 (A) Profits from it will go toward helping aspiring designers 是正確答案。\n\n**替換表達**\nproceeds 收益 → Profits 收益\nbeginning designers 新人設計師 → aspiring designers 有志成為設計師的人\n\n**單字** go toward (phr.) 作為…的款項，有助於…；aspiring (adj.) 有志於成為什麼的；amateur (n.) 業餘從事者；publicity (n.) 宣傳，媒體的關注\n\n**193.** 答案 (C)｜難度：中\nWhy does Ms. Cruise want to set up a booth?\n- (A) To interview a potential assistant\n- (B) To register arriving guests\n- (C) To get a chance to recover some costs\n- (D) To have an area for taking short breaks\n\n> 為什麼 Cruise 小姐想要設置攤位？\n> (A) 為了面試可能擔任助理的人\n> (B) 為了登記抵達的賓客\n> (C) 為了有機會拿回一點費用\n> (D) 為了擁有可以短暫休息的區域\n\n**wh- 問題 Why**\n這是問 Cruise 小姐為什麼（Why）想要設置攤位的 wh- 問題，所以要看提到與題目關鍵部分 Ms. Cruise want to set up a booth 相關內容的電子郵件（第二篇文章）。「the costs of covering an event as large as this one are quite high」和「I am asking your permission to install a photo booth by the entrance and to charge visitors a small fee for prints」的部分提到，負責這種大型活動的費用很高，所以希望能允許在入口搭建拍照處，並且向來客收取照片輸出費用，所以 (C) To get a chance to recover some costs 是正確答案。\n\n**單字** potential (adj.) 潛在的，有可能性的；register (v.) 登記，註冊；recover (v.) 拿回，恢復\n\n<!-- page 576 -->\n\n**194.** 答案 (D)｜難度：中\nWhat is true about Melvin Lee?\n- (A) He provided entertainment for an event.\n- (B) He teaches a class in fashion at MFI.\n- (C) He attended the same school as Ms. Rowlands.\n- (D) He has helped style models for a magazine.\n\n> 關於 Melvin Lee，何者正確？\n> (A) 他為活動提供娛樂。\n> (B) 他在 MFI 教關於時尚的課。\n> (C) 他和 Rowlands 小姐上過同一間學校。\n> (D) 他曾經幫一本雜誌打理模特兒造型。\n\n**Not/True 多篇文章綜合題**\n這是需要找到與關鍵字 Melvin Lee 相關的資訊，並且與選項敘述對照的 Not/True 問題，所以先看提到他的公告（第一篇文章）。和 (A) 相關的部分是第一篇文章的「Master of ceremonies: Stylist Melvin Lee」，表示造型師 Melvin Lee 是主持人，而不是提供娛樂表演，不符合選項敘述。(B)、(C) 在文中沒有提到。(D) 對應第一篇文章的「Master of ceremonies: Stylist Melvin Lee」，表示主持人 Melvin Lee 是造型師，而第三篇文章（評論）中的「The event's host ~ has done models' hair and makeup for several of Fashion Guide Magazine's feature」提到主持人曾經為《Fashion Guide 雜誌》的幾篇專題報導打理模特兒的髮型與妝容，符合選項敘述，所以 (D) He has helped style models for a magazine 是正確答案。\n\n**195.** 答案 (C)｜難度：高\nWhat does Ms. Rowlands mention about the fashions featured at MFI's event?\n- (A) They are more colorful than those of previous seasons.\n- (B) They hardly reflected the chosen theme of an event.\n- (C) They may be sold at clothing stores in the future.\n- (D) They were quickly adopted by leading fashion designers.\n\n> 關於 MFI 活動中展示的時尚，Rowlands 小姐提到什麼？\n> (A) 比前幾季色彩豐富。\n> (B) 幾乎沒有反映活動選定的主題。\n> (C) 未來可能在服裝店販售。\n> (D) 很快就被領導業界的時尚設計師採用了。\n\n**Not/True True 問題**\n題目的關鍵部分是 the fashions featured at MFI's event，問 Rowlands 小姐提到什麼，所以要在她所寫的評論（第三篇文章）中找到與各選項相關的資訊，並確認是否正確。(A) 在文中沒有提到。和 (B) 相關的部分是「The fashions in this year's show truly lived up to the theme of being \"light, airy, and innovative.\"」，表示今年的秀所展示的時尚，的確符合主題，所以不符合選項敘述。(C) 對應文中的「Check out some photos below. You may be able to find some of them at a local fashion retailer one day.」，表示有一天或許能在當地的時裝零售店找到照片中的某些設計，符合選項敘述，所以 (C) They may be sold at clothing stores in the future 是正確答案。(D) 在文中沒有提到。\n\n**替換表達**\nfashion retailer 時尚零售店 → clothing stores 服裝店\none day 有一天 → in the future 未來\n\n**單字** reflect (v.) 反映，反射；adopt (v.) 採用；leading (adj.) 領導的，佔主導地位的\n\n<!-- page 577 -->\n\n### Questions 196-200 refer to the following advertisement, form, and e-mail. 🆕\n196-200 題參照以下廣告、表格及電子郵件。\n\n**文章 1**\n\n> **Protect Yourself with PFS**\n>\n> [196-B/D] PFS is a safety systems contractor specializing in the installation of fire alarms and sprinklers for residential and corporate clients located in downtown New York. [196-C] We ensure quality workmanship that is in compliance with municipal building codes. Furthermore, our work is **executed** promptly, and we guarantee our clients' satisfaction. [200] If there are demands for repairs or adjustments to our work, we will take care of them within 48 hours, assuring the safety of your office or your commercial or industrial facility.\n>\n> [196-A] If you would like to learn about the pre-action, wet pipe, dry pipe, and deluge sprinkler systems we offer, call us at 555-5324 or visit our Web site at: www.pfssystems.com, where you can also fill out a service request form.\n\n**翻譯**\n> **用 PFS 保護自己**\n>\n> [196-B/D] PFS 是專門為紐約市區住宅及企業客戶安裝火災警報器與灑水器的安全系統承包商。[196-C] 我們保證提供符合本市建築法規的高品質施工。而且，我們施工迅速，並保證客戶滿意。[200] 如果對於我們的施工有修理或調整的需求，我們將在 48 小時內處理，確保您的辦公室或商業、工業設施的安全。\n>\n> [196-A] 如果您想了解我們提供的預動式、濕式、乾式、開放式灑水系統，請撥 555-5324 聯絡我們，或者上我們的網站：www.pfssystems.com，您也可以在網站上填寫服務申請表。\n\n**文章 2**\n\n> **PFS Service Request Form**\n>\n> Name: Gwyneth Pierce\n> E-mail: gpierce@spspa.com\n> Phone: 555-9622\n> Address: 84 William Street, New York, NY 10038\n> Company: Serene Peace Spa\n>\n> Details:\n> I would like to replace my outdated deluge sprinkler system. I was on your site reading about the different types of sprinklers available. [199] I think wet pipe sprinklers would be good to have in ea const MARK = /\[(\d{3}(?:-[A-D](?:\/[A-D])*)?(?:\/\d{3}(?:-[A-D](?:\/[A-D])*)?)*)\]\s?/g;
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function inline(s) {
  s = esc(s).replace(/\\\*/g, "\u0001");
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>");
  s = s.replace(/\u0001/g, "*").replace(/\\([\[\]_#-])/g, "$1");
  return s.replace(MARK, (_, m) => `<span class="mk">${m}</span>`);
}
function md(text) {
  const lines = text.split("\n");
  let out = "", i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    if (l.startsWith(">")) {
      const buf = [];
      while (i < lines.length && lines[i].startsWith(">")) { buf.push(lines[i].replace(/^> ?/, "")); i++; }
      out += "<blockquote>" + md(buf.join("\n")) + "</blockquote>"; continue;
    }
    if (l.trim().startsWith("|")) {
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith("|")) { rows.push(lines[i].trim()); i++; }
      const cells = r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      let html = "<table>";
      rows.forEach((r, k) => {
        if (/^\|[\s\-:|]+\|$/.test(r)) return;
        const cs = cells(r);
        if (k === 0 && cs.every(c => !c)) return;
        const tag = k === 0 && rows[1] && /^\|[\s\-:|]+\|$/.test(rows[1]) ? "th" : "td";
        html += "<tr>" + cs.map(c => `<${tag}>${inline(c)}</${tag}>`).join("") + "</tr>";
      });
      out += html + "</table>"; continue;
    }
    if (/^- /.test(l)) {
      out += "<ul>";
      while (i < lines.length && /^- /.test(lines[i])) { out += "<li>" + inline(lines[i].slice(2)) + "</li>"; i++; }
      out += "</ul>"; continue;
    }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !lines[i].startsWith(">") && !/^- /.test(lines[i]) && !lines[i].trim().startsWith("|")) { buf.push(inline(lines[i])); i++; }
    out += "<p>" + buf.join("<br>") + "</p>";
  }
  return out;
}

const Q_HEAD = /^\*\*(\d{3})\.\*\*\s*(🆕)?\s*(?:答案 \(([A-D])\)(?:｜難度：([^\s🆕]+))?)?\s*(🆕)?/;
function parseQBlock(lines) {
  const m = lines[0].match(Q_HEAD);
  const q = { num: m[1], isNew: !!(m[2] || m[5]), answer: m[3] || null, level: m[4] || "", text: [], options: [], rest: [] };
  let stage = "text";
  for (const l of lines.slice(1)) {
    const o = l.match(/^- \(([A-D])\)\s?(.*)$/);
    if (stage !== "rest" && o) { stage = "opts"; q.options.push({ key: o[1], text: o[2] }); continue; }
    if (stage === "opts") stage = "rest";
    (stage === "text" ? q.text : q.rest).push(l);
  }
  q.body = lines.slice(1).join("\n").trim();
  q.text = q.text.join("\n").trim();
  q.rest = q.rest.join("\n").trim();
  return q;
}
function splitBlocks(lines) {
  const pre = [], blocks = [];
  for (const l of lines) {
    if (Q_HEAD.test(l)) blocks.push([l]);
    else if (blocks.length) blocks[blocks.length - 1].push(l);
    else pre.push(l);
  }
  return { pre, blocks: blocks.map(parseQBlock) };
}
function parsePreamble(pre, expected) {
  const sub = pre.length && !pre[0].startsWith(">") ? pre.shift() : "";
  // 判斷是不是中文翻譯：看中文字佔的比例（原文偶爾夾少量中文註記）
  const isTrans = t => {
    const cjk = (t.match(/[一-鿿]/g) || []).length, latin = (t.match(/[A-Za-z]/g) || []).length;
    return cjk > 0 && cjk / (cjk + latin) > 0.2;
  };
  // 第一步：切成一塊一塊（文章標籤 / 原文 / 翻譯）
  const chunks = [], vocab = [];
  let quote = null, afterTransLabel = false, inVocab = false;
  const flush = () => {
    if (!quote) return;
    const text = quote.join("\n");
    chunks.push({ type: afterTransLabel || isTrans(stripMarks(text)) ? "trans" : "en", text });
    quote = null; afterTransLabel = false;
  };
  for (const l of pre) {
    if (inVocab) { vocab.push(l); continue; }
    if (l.startsWith(">") || l.trim().startsWith("|")) { (quote || (quote = [])).push(l); continue; }
    flush();
    const lab = l.match(/^\*{0,2}文章\s*(\d+)\*{0,2}\s*$/);
    if (lab) chunks.push({ type: "label", text: "文章 " + lab[1] });
    else if (l.startsWith("**單字**")) { inVocab = true; vocab.push(l); }
    else if (l.trim() === "**翻譯**") afterTransLabel = true;
  }
  flush();
  // 第二步：沒標「文章 N」的地方，從「翻譯之後又出現的英文」裡挑最長的幾段當作新文章的開頭
  const labels = chunks.filter(c => c.type === "label").length;
  const lastLabel = chunks.map(c => c.type).lastIndexOf("label");
  const cands = chunks.map((c, k) => ({ c, k }))
    .filter(({ c, k }) => c.type === "en" && k > lastLabel && k > 0 && chunks[k - 1].type === "trans" && chunks.slice(0, k).some(x => x.type === "en"));
  const need = expected - Math.max(labels, 1);
  if (need > 0) cands.sort((a, b) => b.c.text.length - a.c.text.length).slice(0, need).forEach(({ c }) => c.split = true);
  // 第三步：組合
  const passages = [], trans = [];
  let cur = null;
  for (const c of chunks) {
    if (c.type === "label") { cur = { label: c.text, lines: [] }; passages.push(cur); trans.push(`**${c.text}**`); }
    else if (c.type === "trans") trans.push(c.text);
    else {
      if (!cur || c.split) { cur = { label: "", lines: [] }; passages.push(cur); }
      cur.lines.push(c.text);
    }
  }
  if (passages.length > 1) passages.forEach((p, k) => { if (!p.label) p.label = "文章 " + (k + 1); });
  return { sub, passages: passages.filter(p => p.lines.length), trans: trans.join("\n\n"), vocab: vocab.join("\n") };
}

const parts = {};
let part = null, section = null;
for (const l of raw.slice(startIdx)) {
  const pm = l.match(/^## PART (\d)/);
  if (pm) { part = pm[1]; parts[part] = []; section = null; continue; }
  if (!part) continue;
  const sm = l.match(/^### (.+)$/);
  if (sm) { section = { heading: sm[1].replace(/\s*🆕\s*$/, ""), isNew: /🆕/.test(sm[1]), lines: [] }; parts[part].push(section); continue; }
  if (!section) { section = { heading: null, lines: [] }; parts[part].push(section); }
  section.lines.push(l);
}

// 統一成「題組」：Part 5 每題一組，Part 6/7 每篇文章一組
const sets = [];
for (const p of Object.keys(parts)) {
  for (const sec of parts[p]) {
    const { pre, blocks } = splitBlocks(sec.lines);
    if (!sec.heading) {
      blocks.forEach(q => sets.push({ id: "q" + q.num, part: p, heading: null, questions: [q] }));
      continue;
    }
    const first = +(blocks[0] && blocks[0].num);
    const info = parsePreamble(pre, first >= 186 ? 3 : first >= 176 ? 2 : 1); // 多益 176-185 雙篇、186-200 三篇
    const byNum = {};
    for (const b of blocks) {
      const q = byNum[b.num] || (byNum[b.num] = { num: b.num, isNew: false, options: [], text: "", rest: "" });
      q.isNew = q.isNew || b.isNew;
      if (b.answer && q.options.length) { q.answer = b.answer; q.level = b.level; q.rest = b.body; } // Part 6：選項在前面，這塊全是解析
      else if (b.answer) { q.answer = b.answer; q.level = b.level; q.rest = b.rest; q.text = b.text; q.options = b.options; }
      else { if (b.options.length) q.options = b.options; if (b.rest) info.vocab += (info.vocab ? "\n\n" : "") + b.rest; }
    }
    const questions = Object.values(byNum).sort((a, b) => a.num - b.num);
    sets.push({ id: "s" + questions[0].num, part: p, heading: sec.heading, isNew: sec.isNew, ...info, questions });
  }
}

/* ---------- 作答紀錄 ---------- */
let state = {};
try { state = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) {}
const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} };
const st = id => state[id] || (state[id] = { picks: {}, done: false });

/* ---------- 畫面 ---------- */
const $ = s => document.querySelector(s);
document.title = title + " 閱讀練習";
$("#title").textContent = title + " 閱讀練習";
const partKeys = Object.keys(parts);
let curPart = partKeys[0];
try { const saved = localStorage.getItem(STORE_KEY + "-tab"); if (partKeys.includes(saved)) curPart = saved; } catch (e) {}

function renderTabs() {
  $("#tabs").innerHTML = partKeys.map(p =>
    `<button data-p="${p}" class="${p === curPart ? "active" : ""}">Part ${p}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    curPart = b.dataset.p;
    try { localStorage.setItem(STORE_KEY + "-tab", curPart); } catch (e) {}
    renderTabs(); renderMain(); scrollTo({ top: 0 });
  });
}

function renderScore() {
  let right = 0, done = 0, total = 0;
  for (const s of sets) {
    total += s.questions.length;
    const x = state[s.id];
    if (x && x.done) s.questions.forEach(q => { done++; if (x.picks[q.num] === q.answer) right++; });
  }
  $("#score").innerHTML = `已作答 <b>${done}</b> / ${total} 題，答對 <b>${right}</b> 題` + (done ? `（${Math.round(right / done * 100)}%）` : "");
}

function questionHTML(set, q) {
  const x = st(set.id), pick = x.picks[q.num];
  const opts = q.options.map(o => {
    let cls = "opt", tag = "";
    if (x.done) {
      if (o.key === q.answer) { cls += " right"; tag = "正解"; }
      else if (o.key === pick) { cls += " wrong"; tag = "你的答案"; }
      if (o.key === q.answer && o.key === pick) tag = "✓ 答對";
    } else if (o.key === pick) cls += " sel";
    return `<button class="${cls}" data-set="${set.id}" data-q="${q.num}" data-k="${o.key}" ${x.done ? "disabled" : ""}>
      <span class="l">(${o.key})</span><span>${inline(o.text)}</span>${tag ? `<span class="tag">${tag}</span>` : ""}</button>`;
  }).join("");
  let after = "";
  if (x.done) {
    const ok = pick === q.answer;
    after = `<div class="verdict ${ok ? "ok" : "bad"}">${ok ? "答對了" : pick ? `答錯了，你選 (${pick})` : "未作答"}・正確答案 (${q.answer})${q.level && q.level !== "?" ? `・難度：${q.level}` : ""}</div>
      <div class="explain">${md(q.rest)}</div>`;
  }
  return `<div class="q"><div class="qtext"><span class="qnum">${q.num}.</span>${q.isNew ? '<span class="new">新題型</span> ' : ""}${q.text ? md(q.text).replace(/^<p>|<\/p>$/g, "") : ""}</div>
    <div class="opts">${opts}</div>${after}</div>`;
}

function setHTML(set) {
  const x = st(set.id);
  const unanswered = set.questions.filter(q => !x.picks[q.num]).length;
  let passages = "";
  if (set.passages && set.passages.length) {
    passages = `<div class="passages">` + set.passages.map(p => {
      const body = p.lines.join("\n\n");
      return (p.label ? `<div class="plabel">${p.label}</div>` : "") + `<div class="passage">${md(x.done ? body : stripMarks(body))}</div>`;
    }).join("") + `</div>`;
  }
  const reveal = x.done && (set.trans || set.vocab)
    ? `<details class="reveal" open><summary>文章翻譯與單字</summary>${md(set.trans)}${md(set.vocab)}</details>` : "";
  const head = set.heading
    ? `<p class="set-title">${esc(set.heading)}${set.isNew ? ' <span class="new">新題型</span>' : ""}</p><p class="set-sub">${esc(set.sub || "")}</p>` : "";
  const btnLabel = set.heading ? "送出本題組" : "送出";
  const actions = x.done
    ? `<div class="actions"><span class="result">本組答對 ${set.questions.filter(q => x.picks[q.num] === q.answer).length} / ${set.questions.length}</span>
       <button class="btn" data-redo="${set.id}">重做這組</button></div>`
    : `<div class="actions"><button class="btn primary" data-submit="${set.id}" ${unanswered ? "disabled" : ""}>${btnLabel}</button>
       ${unanswered && set.questions.length > 1 ? `<span class="hint">還有 ${unanswered} 題沒選</span>` : ""}</div>`;
  return `<section class="card" id="${set.id}">${head}
    <div class="set-body ${passages ? "two" : ""}">${passages}<div>${set.questions.map(q => questionHTML(set, q)).join("")}${actions}</div></div>
    ${reveal}</section>`;
}

function renderSet(id) {
  const set = sets.find(s => s.id === id);
  const el = document.getElementById(id);
  el.outerHTML = setHTML(set);
  renderScore();
}

function renderMain() {
  const intro = intros[curPart];
  $("#main").innerHTML = (intro ? `<p class="part-intro"><b>Part ${curPart}：${intro.name}</b>　${esc(intro.text)}</p>` : "")
    + sets.filter(s => s.part === curPart).map(setHTML).join("");
  renderScore();
}

$("#main").addEventListener("click", e => {
  const opt = e.target.closest(".opt");
  if (opt && !opt.disabled) {
    st(opt.dataset.set).picks[opt.dataset.q] = opt.dataset.k; save(); renderSet(opt.dataset.set); return;
  }
  const sub = e.target.closest("[data-submit]");
  if (sub && !sub.disabled) { st(sub.dataset.submit).done = true; save(); renderSet(sub.dataset.submit); return; }
  const redo = e.target.closest("[data-redo]");
  if (redo) { state[redo.dataset.redo] = { picks: {}, done: false }; save(); renderSet(redo.dataset.redo); }
});
$("#resetAll").onclick = () => {
  if (!confirm("確定要清除這份考卷的所有作答紀錄？")) return;
  state = {}; save(); renderMain();
};

renderTabs();
renderMain();
</script>
</body>
</html>
