<script>
const SOURCE = "# 目錄\n\n1. [PART 5：單句文法與詞彙](#part-5)\n   概念：101~130 題主要考詞性判斷，包含名詞、形容詞、副詞在句中該放哪個位置、該選哪個詞彙；動詞題型涵蓋時態（未來式、現在完成式）、主動態與被動態的區別，以及動詞慣用語和動詞詞彙；另外還有介系詞（方向、期間）、連接詞（名詞子句、副詞子句表時間/條件）、不定代名詞、易混淆形容詞比較等題型穿插其中。\n\n2. [PART 6：段落填空](#part-6)\n   概念：4 篇短文，每篇挖 4 個空格，題型除了跟 Part 5 類似的詞性/詞彙判斷外，每篇一定會出現一題「選出空格中正確的句子」（考上下文邏輯銜接），偶爾也會考需要讀完全文才能選出正確詞彙的題目。\n   1. [Questions 131-134 refer to the following announcement.](#questions-131-134-refer-to-the-following-announcement-)\n      概念：Sudbury 社區公告，通知居民鄰里大會的時間及交通議題討論。考點包含未來式動詞、名詞詞彙、跨句選句、副詞位置。\n   2. [Questions 135-138 refer to the following e-mail.](#questions-135-138-refer-to-the-following-e-mail-)\n      概念：同事間的郵件，Nelson 請 Denise 幫忙尋找遺失的業務文件草稿（Acton 客戶案）。考點包含名詞位置、跨句選句、表條件的副詞子句連接詞，以及要讀完全文才能判斷的名詞詞彙。\n   3. [Questions 139-142 refer to the following letter.](#questions-139-142-refer-to-the-following-letter-)\n      概念：顧客寫信給 Mythos Computers 客服部門，稱讚客服員工 Patrick Kelley 的服務。考點包含要參考上下文的副詞詞彙、跨句選句，以及現在完成式的動詞位置判斷。\n   4. [Questions 143-146 refer to the following advertisement.](#questions-143-146-refer-to-the-following-advertisement-)\n      概念：Seattle New Light 安養中心的廣告，強調長者的社交生活與生活品質。考點包含動名詞 vs. 名詞的名詞位置判斷、要參考上下文的動詞詞彙、跨句選句，以及名詞詞彙。\n\n3. [PART 7：閱讀理解](#part-7)\n   概念：15 篇單篇/雙篇/三篇文章，題型以「尋找主題／目的」「wh- 問題」「Not/True」「推論」「同義詞／替換表達」「找出句子位置」為主，雙篇、三篇文章常出現需要比對多篇資訊的「推論／Not/True／wh- 問題（多篇文章綜合題）」。\n   1. [Questions 147-148 refer to the following e-mail.](#questions-147-148-refer-to-the-following-e-mail)\n      概念：Gina 寫信給銀行行員 Frederick Montaigne，詢問線上轉帳時要求輸入六位數安全碼的問題。考主旨／目的題，以及 wh- 問題（What）。\n   2. [Questions 149-150 refer to the following text message chain.](#questions-149-150-refer-to-the-following-text-message-chain-)\n      概念：律師 Mitchell Roach 傳訊息找同事 Jillian Barrera 討論新案子並約碰面時間。考 wh- 問題（Which）與掌握意圖（判斷對話弦外之音）。\n   3. [Questions 151-152 refer to the following schedule.](#questions-151-152-refer-to-the-following-schedule)\n      概念：NEIMA 網路行銷協會研討會第一天的活動時間表。考 wh- 問題（Which）與需要對照表格細節的推論題。\n   4. [Questions 153-154 refer to the following information.](#questions-153-154-refer-to-the-following-information)\n      概念：遠距工作者可申報的稅務減免資訊說明。考需要統整全文的整體推論，以及對照細節的推論題。\n   5. [Questions 155-157 refer to the following e-mail.](#questions-155-157-refer-to-the-following-e-mail)\n      概念：Tuton 教育服務回信給家長 Sara Brunelli，說明兒子歷史家教的安排。考 Not/True（Not 問題）搭配替換表達，以及 wh- 問題（Where、What）。\n   6. [Questions 158-160 refer to the following advertisement.](#questions-158-160-refer-to-the-following-advertisement)\n      概念：都柏林美術學院為藝術家 Annie O'Dell 舉辦的回顧展廣告。大量考 Not/True 題（True 與 Not 混合出現），並搭配替換表達判斷選項。\n   7. [Questions 161-163 refer to the following notice.](#questions-161-163-refer-to-the-following-notice)\n      概念：GlobalFerm 公司內部通知，說明自助餐廳整修為 Servex Modern 的計畫。考主旨／目的題、wh- 問題（Where）、替換表達，以及依文章邏輯找出插入句子正確位置的題型。\n   8. [Questions 164-167 refer to the following article.](#questions-164-167-refer-to-the-following-article)\n      概念：電子公司 First Global 擴廠的新聞報導。考主旨／目的（寫文章的理由）、wh- 問題（How）、替換表達、推論細節，以及找出句子插入位置的題型。\n   9. [Questions 168-171 refer to the following online chat discussion.](#questions-168-171-refer-to-the-following-online-chat-discussion-)\n      概念：三位同事在線上聊天討論網路商店的產品拍攝風格與各自進度。考主旨題、掌握意圖（判斷發言弦外之音）、Not/True、推論細節與替換表達。\n   10. [Questions 172-175 refer to the following e-mail.](#questions-172-175-refer-to-the-following-e-mail)\n       概念：Carol Andrews 寫信給同事說明出差華盛頓特區總部的行程安排。考主旨（寫信理由）、Not/True（Not 問題），以及 wh- 問題（Why、What）。\n   11. [Questions 176-180 refer to the following article and e-mail.](#questions-176-180-refer-to-the-following-article-and-e-mail)\n       概念：雙篇文章，一篇是紐西蘭 Lamington 牧場改採合作農牧的成功報導，一篇是記者 Darius Carver 寫信想採訪牧場主人。考 Not/True（True 與 Not 混合）、主旨（寫信理由），以及需要比對兩篇文章的推論題。\n   12. [Questions 181-185 refer to the following e-mail and notice.](#questions-181-185-refer-to-the-following-e-mail-and-notice)\n       概念：雙篇文章，一篇是退休規劃顧問 Wendy Rhodes 給客戶的建議信，一篇是大學職涯發展中心的活動公告。考主旨題、同義詞題、wh- 問題（What、Who），以及替換表達。\n   13. [Questions 186-190 refer to the following invitation, e-mail, and form.](#questions-186-190-refer-to-the-following-invitation-e-mail-and-form-)\n       概念：三篇文章，匹茲堡商業協會「Business 101」創業研討會的邀請函，以及銀行貸款專員請假、安排代理人的通知信。考 wh- 問題（What）、Not/True（含跨文章綜合題）、替換表達，以及需要比對細節與跨文章資訊的推論題。\n   14. [Questions 191-195 refer to the following announcement, e-mail, and review.](#questions-191-195-refer-to-the-following-announcement-e-mail-and-review-)\n       概念：三篇文章，Meredith 時尚學院春季時裝秀公告、攝影師 Anna Cruise 回覆合作條件的信，以及雜誌對時裝秀的報導評論。考 Not/True（含跨文章綜合題）、wh- 問題（含跨文章綜合題、Why），以及替換表達。\n   15. [Questions 196-200 refer to the following advertisement, form, and e-mail.](#questions-196-200-refer-to-the-following-advertisement-form-and-e-mail-)\n       概念：三篇文章，消防安全系統公司 PFS 的廣告、客戶 Gwyneth Pierce 的服務申請表，以及客戶反映安裝錯誤系統的抱怨信。考 Not/True（Not 問題）、同義詞、推論細節，以及需要比對三篇文章的 wh- 問題。\n\n-----------------------------------------------------------\n\n<!-- page 526 -->\n\n# TEST 10\nPart 5 翻譯・解說\nPart 6 翻譯・解說 🆕\nPart 7 翻譯・解說 🆕\n\n<!-- page 527 -->\n\n## PART 5\n\n**101.** 答案 (A)｜難度：中\nHigh-end goods sold at Barton Jewelry are rarely offered at a discount, although a few items are ______ marked down for clearance.\n- (A) occasionally\n- (B) externally\n- (C) previously\n- (D) initially\n\n> Barton Jewelry 販售的高檔商品很少打折出售，雖然有些品項偶爾會降價出清。\n\n**副詞詞彙**\n文意是「雖然有些品項偶爾會降價出清，但基本上很少打折出售」，所以副詞 (A) occasionally（偶爾）是正確答案。(B) externally 表示「在外部，外表上」，(C) previously 表示「之前，以前」，(D) initially 表示「起初，原本」。\n\n**單字** high-end (adj.) 高檔的，高級的；goods (n.) 商品，產品；mark down (phr.) 降低價格；clearance (n.) 清倉特賣，清除，清空\n\n**102.** 答案 (A)｜難度：低\n______ tests must be done on all medications before they are offered for use by the general public.\n- (A) Rigorous\n- (B) Rigorousness\n- (C) Rigor\n- (D) Rigorously\n\n> 所有藥物在供一般大眾使用前，都必須經過嚴格的檢驗。\n\n**形容詞位置**\n能修飾空格後方名詞（tests）的是形容詞，所以形容詞 (A) Rigorous（嚴格的）是正確答案。名詞 (B)、(C) 和副詞 (D) 都不能修飾名詞。\n\n**單字** medication (n.) 藥物，藥物治療；general public (phr.) 一般大眾；rigorousness (n.) 嚴厲，嚴格；rigor (n.) 嚴厲，嚴酷，精確\n\n**103.** 答案 (D)｜難度：低\nAfter Jennifer Barnes ______ completed her commercial driver's license application, she was able to drive a delivery truck.\n- (A) successful\n- (B) succeeded\n- (C) succeeding\n- (D) successfully\n\n> Jennifer Barnes 成功完成了商業駕照申請後，就可以開貨運卡車了。\n\n**副詞位置**\n能修飾空格後方動詞（completed）的是副詞，所以副詞 (D) successfully（成功地）是正確答案。形容詞 (A)、動詞或過去分詞 (B)、動名詞或現在分詞 (C) 都不能修飾動詞。\n\n**單字** commercial driver's license (phr.) （駕駛營業用車輛所需的）商業駕照；application (n.) 申請（書），應用\n\n**104.** 答案 (B)｜難度：高\nMagnum Airlines began expanding its service five years ago and now ______ several daily flights throughout Eastern Europe.\n- (A) categorizes\n- (B) operates\n- (C) imparts\n- (D) multiplies\n\n> Magnum 航空公司 5 年前開始擴大服務，現在在整個東歐運行幾條每日定期航線。\n\n**動詞詞彙**\n文意是「在整個東歐運行幾條航線」，所以動詞 operate（營運，運作）的第三人稱單數形 (B) operates 是正確答案。(A) 的動詞 categorize 表示「分類」，(C) 的 impart 表示「傳授，傳達」。(D) 的動詞 multiply 表示「乘，使成倍增加」，雖然意思似乎說得通，但應該用 multiply the number of flights 表示使航班的數量加倍比較恰當。\n\n**單字** expand (v.) 擴大，擴張；daily (adj.) 每日的，按日的\n\n<!-- page 528 -->\n\n**105.** 答案 (C)｜難度：低\nThe train for Somerville ______ on schedule tomorrow even though bad weather is expected.\n- (A) left\n- (B) leaving\n- (C) will leave\n- (D) has left\n\n> 即使預期天氣不佳，但往薩莫維的列車明天還是會按表定時間出發。\n\n**〔動詞位置〕未來式**\n主要子句（The train ~ tomorrow）缺少動詞，所以動詞 (A)、(C)、(D) 是可能的答案。因為句中有表示未來的詞語（tomorrow），所以未來式 (C) will leave 是正確答案。過去式 (A)、現在完成式 (D) 不能和表示未來的詞語連用。動名詞或分詞 (B) 不能用在動詞的位置。\n\n**106.** 答案 (D)｜難度：低\nEmployees may not use the hotel's main entrance and must pass ______ a side door located near the back of the building.\n- (A) over\n- (B) to\n- (C) of\n- (D) through\n\n> 員工不可使用飯店正門，必須從位於建築物後方附近的側門通行。\n\n**選擇介系詞** 方向\n因為要表示「不可以用正門，要從側門通過」的意思，所以表示方向的介系詞 (D) through（穿過）是正確答案。(A) over 表示期間（在…期間）或位置（在…上方），(B) to 表示方向（往…），(C) of 表示所有（…的）或修飾。\n\n**單字** main entrance (phr.) 正門；pass (v.) 通過，經過\n\n**107.** 答案 (B)｜難度：中\nWorker evaluation forms should be submitted to Ann James in the personnel department ______ the week.\n- (A) due to\n- (B) within\n- (C) now that\n- (D) between\n\n> 員工評鑑表格應該在那一週之內交給人事部的 Ann James。\n\n**選擇介系詞** 期間\n空格後方接名詞（the week），所以後面能接名詞的介系詞 (A)、(B)、(D) 是可能的答案。因為要表示「評鑑表格應該在那一週之內交出」的意思，所以 (B) within 是正確答案。(A) due to「由於…」表示理由，(D) between「…之間」表示位置或時間，並且以 between A and B（A 與 B 之間）的形態使用。副詞子句連接詞 (C) now that（既然…）後面接有主詞和動詞的完整子句。\n\n**單字** evaluation (n.) 評估，評價；submit (v.) 交出，使服從\n\n**108.** 答案 (C)｜難度：中\nManagement may offer permanent positions to some of the employees ______ as temporary staff on the last project.\n- (A) hire\n- (B) hires\n- (C) hired\n- (D) hiring\n\n> 經營團隊可以為上個企畫案中某些臨時雇員提供正式職位。\n\n**現在分詞 vs. 過去分詞**\n能修飾空格前方名詞（employees）的是分詞，所以分詞 (C) 和 (D) 是可能的答案。被修飾的名詞（employees）和分詞表示「員工被雇用」的被動意義，所以過去分詞 (C) hired（被雇用的）是正確答案。現在分詞 (D) 表示主動意義，所以不對。動詞 (A) 和 (B) 不能修飾名詞。\n\n**單字** permanent position (phr.) 正式職位；temporary (adj.) 臨時的\n\n<!-- page 529 -->\n\n**109.** 答案 (D)｜難度：中\nPacific Cable News did not proceed with acquiring a rival network when its shareholders expressed ______ to the plan.\n- (A) oppose\n- (B) opposed\n- (C) opposingly\n- (D) opposition\n\n> 由於股東對計畫表示反對，所以 Pacific 有線電視新聞沒有繼續進行對競爭電視網的收購。\n\n**名詞位置**\n能當及物動詞（expressed）受詞的是名詞，所以名詞 (D) opposition（反對）是正確答案。動詞 (A)、動詞或分詞 (B)、副詞 (C) 不能用在名詞的位置。就算把副詞 (C) 解釋成「反對地表達」，及物動詞 expressed（表達）還是缺少受詞，所以不對。\n\n**單字** proceed (v.) 進展，繼續進行；acquire (v.) 收購，獲得；network (n.) 廣播網，電視網；opposingly (adv.) 相反地，反對地\n\n**110.** 答案 (C)｜難度：中\nThe employee handbook states the human resources director is ______ for reviewing job applications.\n- (A) reasonable\n- (B) genuine\n- (C) responsible\n- (D) applicable\n\n> 員工手冊說，人事主任負責審查工作應徵信。\n\n**形容詞詞彙**\n文意是「人事主任負責審查工作應徵信」，所以形容詞 (C) responsible（有責任的）是正確答案。另外，也請記得 be responsible for（對…有責任）這個慣用語。(A) reasonable 表示「合理的」，(B) genuine 表示「真正的」。(D) applicable「適用的」看似符合文意，但通常用來修飾事物，所以不對。\n\n**單字** state (v.) 陳述，敘述；(n.) 狀態；human resources (phr.) 人事（部）；director (n.) 主任，主管；review (v.) 審查，檢查\n\n**111.** 答案 (D)｜難度：低\nVisitors to Vedan Mountain are attracted by its remote location, which is ______ 25 miles away from the nearest city.\n- (A) approximate\n- (B) approximating\n- (C) approximation\n- (D) approximately\n\n> 位置離最近的城市也有大約 25 英里的 Vedan 山，遊客受到它偏遠的位置所吸引。\n\n**副詞位置**\n能修飾當形容詞的數量詞（25）的是副詞，所以副詞 (D) approximately（大約）是正確答案。另外，請注意空格修飾的不是名詞（miles）而是形容詞（25），所以「數字＋名詞」前面不是用形容詞，而是用副詞。形容詞 (A)、動名詞或分詞 (B)、名詞 (C) 都不能修飾形容詞。\n\n**單字** attract (v.) 吸引，引起（注意、興趣等）；remote (adj.) 偏遠的\n\n**112.** 答案 (B)｜難度：中\nAdditional doctors will be assigned to the Operham medical ______ next month to help run a new rehabilitation wing.\n- (A) territory\n- (B) facility\n- (C) exercise\n- (D) discussion\n\n> 下個月將有額外的醫師被派到 Operham 醫療設施，協助營運新的復健部門。\n\n**名詞詞彙**\n文意是「額外的醫師會被分配到醫療設施」，所以名詞 (B) facility（設施）是正確答案。(A) territory 表示「領土，領域」，(C) exercise 表示「運動」，(D) discussion 表示「討論」。\n\n**單字** assign (v.) 分配，指派；run (v.) 經營，使運作；rehabilitation (n.) 復健，（罪犯）更生；wing (n.) 建築物側邊的延伸部分\n\n<!-- page 530 -->\n\n**113.** 答案 (A)｜難度：中\nSince the cost of materials in Malaysia is relatively ______, Ms. Amarna decided to establish her factory there.\n- (A) affordable\n- (B) logical\n- (C) potential\n- (D) induced\n\n> 由於馬來西亞的原料成本相對便宜，所以 Amarna 小姐決定在那裡設立工廠。\n\n**形容詞詞彙**\n文意是「原料成本相對便宜」，所以形容詞 (A) affordable（負擔得起的，低廉的）是正確答案。(B) logical 表示「邏輯的」，(C) potential 表示「有潛力的，有可能性的」，(D) induced 表示「被引起的，被誘發的」。\n\n**單字** material (n.) 材料，原料；relatively (adv.) 相對地，比較而言；establish (v.) 建立，設立\n\n**114.** 答案 (A)｜難度：中\nThe central terminal's current ticketing counters will ______ be replaced by automatic machines.\n- (A) gradually\n- (B) comparatively\n- (C) tragically\n- (D) expectantly\n\n> 中央總站現有的售票櫃台將逐漸被自動化的機器取代。\n\n**副詞詞彙**\n文意是「售票櫃台逐漸被自動化的機器取代」，所以副詞 (A) gradually（逐漸）是正確答案。(B) comparatively 表示「比較地」，(C) tragically 表示「悲劇地」，(D) expectantly 表示「期待地」。\n\n**單字** ticketing counter (phr.) 售票櫃台；replace (v.) 取代，替換；automatic (adj.) 自動的，無意識的\n\n**115.** 答案 (D)｜難度：高\nFreidrich Clinic keeps all medical details completely ______ and does not release records to any third party without prior consent.\n- (A) confident\n- (B) confidentially\n- (C) confidentiality\n- (D) confidential\n\n> Freidrich 診所將所有詳細醫療資料完全保密，不會在未經事先同意的情況下向第三方公開病歷。\n\n**〔形容詞位置〕容易混淆的形容詞**\n動詞 keep（保持）以「keep + 受詞（all medical details）+ 受詞補語」的句型使用，所以空格應該填入受詞補語。空格前面有副詞（completely），所以能當補語，而且能被副詞修飾的形容詞 (A) 和 (D) 是可能的答案。因為要表達「將所有詳細醫療資料完全保密」，所以形容詞 (D) confidential（機密的，祕密的）是正確答案。(A) confident（有信心的）的意思在這裡不恰當。副詞 (B) 不能當這裡的補語，而名詞 (C) 雖然能當補語，但不能被副詞修飾。\n\n**單字** completely (adv.) 完全地，徹底地；release (v.) 發表，發行；third party (phr.) 第三方；prior (adj.) 先前的，事前的；consent (n.) 同意；(v.) 同意\n\n**116.** 答案 (B)｜難度：高\nThere was ______ any merchandise left at the end of Vanita Apparel's popular annual coat sale this year.\n- (A) loosely\n- (B) hardly\n- (C) mostly\n- (D) extremely\n\n> 今年在 Vanita Apparel 受歡迎的年度大衣特賣的最後，幾乎沒剩下任何商品。\n\n**副詞詞彙**\n文意是「在受歡迎的特賣的最後，幾乎沒剩下任何商品」，所以副詞 (B) hardly（幾乎不…）是正確答案。(A) loosely 表示「鬆弛地」，(C) mostly 表示「大多」，(D) extremely 表示「極度地」。\n\n**單字** merchandise (n.) 商品\n\n<!-- page 531 -->\n\n**117.** 答案 (B)｜難度：最高\n______ Paris is one of the world's most popular tourist destinations is unsurprising since it has so much amazing art and culture.\n- (A) In light of\n- (B) The fact that\n- (C) In keeping with\n- (D) Under the condition that\n\n> 巴黎是世界最受歡迎旅遊勝地之一的事實並不令人意外，因為它有許多令人驚豔的藝術與文化。\n\n**名詞子句連接詞**\n本句的主要動詞是 is，而 ____ Paris ~ tourist destinations 的部分是主詞，所以能引導當主詞的名詞子句的名詞子句連接詞 (B) The fact that（…的事實）是正確答案。(A) In light of（根據…，考慮到…）和 (C) In keeping with（與…協調、一致）當介系詞，後面接片語而不是子句。(D) Under the condition that（在…的條件下）雖然後面可以接子句，但「Under the condition that 子句」整體而言是一個介系詞片語，不能當主詞。\n\n**單字** tourist destination (phr.) 旅行地點；unsurprising (adj.) 不令人驚訝的\n\n**118.** 答案 (C)｜難度：高\nHooper Incorporated is ______ its internal management structure in order to improve communication among departments.\n- (A) recalling\n- (B) representing\n- (C) reorganizing\n- (D) returning\n\n> Hooper 公司正在改組內部管理結構，以改善部門間的溝通。\n\n**動詞詞彙**\n文意是「為了改善部門間的溝通而在改組內部管理結構」，所以動詞 reorganize（重新組織，改組）的 -ing 形 (C) reorganizing 是正確答案。(A) 的動詞 recall 表示「回想起」，(B) 的 represent 表示「代表，表現」，(D) 的 return 表示「歸還」。\n\n**單字** internal (adj.) 內部的，體內的；structure (n.) 結構，建築物；communication (n.) 溝通，通信\n\n**119.** 答案 (B)｜難度：中\nThe examination for the Ministry of Foreign Affairs this year was ______ a difficult test that only 10 percent of the test takers passed.\n- (A) how\n- (B) such\n- (C) so\n- (D) else\n\n> 外交部今年的考試很困難，所以只有百分之 10 的受試者通過。\n\n**選擇副詞 such**\n因為空格後面有 that，所以能形成「很…以致於～」句型「so/such... that~」的 (B) 和 (C) 是可能的答案。空格後面接名詞片語（a difficult test），所以能接名詞片語的 (B) such（這麼的…）是正確答案。(C) so（如此…，很…）雖然也可以和 that 形成「很…以致於～」句型，但後面是接形容詞。(A) how「如何，多麼」是疑問詞或關係副詞，(D) else「其他，另外」是副詞。\n\n**單字** examination (n.) 考試，檢查；Ministry of Foreign Affairs (phr.) 外交部；test taker (phr.) 受試者，考生；pass (v.) 通過\n\n**120.** 答案 (D)｜難度：中\nCritically ill patients requiring constant ______ must be confined in the hospital's intensive care unit on the second floor of the building.\n- (A) observes\n- (B) observant\n- (C) observe\n- (D) observation\n\n> 需要持續觀察的重症患者必須安置於醫院大樓二樓的加護病房。\n\n**名詞位置**\n\n<!-- page 532 -->\n\n因為空格前面有形容詞（constant），所以能被形容詞修飾的名詞 (D) observation（觀察）是正確答案。動詞 (A) 和 (C)、形容詞 (B) 不能用在名詞的位置。\n\n**單字** critically ill (phr.) 病危的；constant (adj.) 持續的；confine (v.) 限制，使臥病在床；intensive care unit (phr.) 加護病房\n\n**121.** 答案 (B)｜難度：中\nStudents may make a ______ for a transfer to a different department of study but must provide the school's dean of admissions with a valid reason.\n- (A) distinction\n- (B) request\n- (C) formation\n- (D) concern\n\n> 學生可以申請轉到不同科系，但必須向招生組主任提出正當的理由。\n\n**名詞詞彙**\n文意是「學生可以申請轉到不同科系」，所以名詞 (B) request（要求，請求）是正確答案。也請記得 make a request（申請）這個慣用語。(A) distinction 表示「區別」，(C) formation 表示「形成」，(D) concern 表示「關心的事，擔心」。\n\n**單字** transfer (v.) 轉移，轉乘；dean of admissions (phr.) 招生組主任；valid (adj.) 有效的，妥當的\n\n**122.** 答案 (C)｜難度：高\nStarting next month, Alouette's chief accountant ______ all requests for cash expenditures of $1,000 or more.\n- (A) approved\n- (B) has approved\n- (C) has to approve\n- (D) will be approved\n\n> 從下個月開始，Alouette 公司的會計主任必須批核所有 1,000 美元以上的現金支出申請。\n\n**用法如同助動詞的慣用語**\n句中缺少動詞，所有選項都是可能的答案。因為空格後面接受詞（all requests），而且要表示「從下個月開始，Alouette 公司的會計主任必須批核所有現金支出申請」的意思，所以含有用法如同助動詞的 have to（必須做…）的 (C) has to approve 是正確答案。過去式 (A) 和現在完成式 (B) 不能和表示未來的詞語（next month）連用。未來式被動態 (D) 雖然符合時間，但因為是被動態的關係，所以沒辦法接空格後面的受詞（all requests）。\n\n**單字** accountant (n.) 會計師；expenditure (n.) 支出，花費\n\n**123.** 答案 (B)｜難度：中\nBedford Airlines and the Concord Hotel chain have a partnership with ______ and sell holiday packages to a variety of global destinations.\n- (A) no\n- (B) each other\n- (C) other\n- (D) even\n\n> Bedford 航空公司與 Concord 連鎖飯店彼此合作，販賣往全球許多目的地的假期套裝方案。\n\n**不定代名詞**\n空格是介系詞（with）的受詞位置，而且要表示「航空公司和飯店彼此合作」的意思，所以不定代名詞 (B) each other（彼此）是正確答案。形容詞或副詞 (A) no（沒有…，不…）、不定形容詞 (C) other（其他的）、副詞 (D) even（甚至）都不能當介系詞的受詞。請注意 other 的形式只能當形容詞，不能當名詞使用；如果要當不定代名詞的話，必須使用 others 或 the other(s) 的形態，分別表示「（相對於已經提過的對象）其他的人事物」、「（在某範圍內的）其餘的人事物」。\n\n**單字** partnership (n.) 合夥、合作關係；destination (n.) 目的地\n\n<!-- page 533 -->\n\n**124.** 答案 (C)｜難度：高\nAccording to a report on work practices, people today spend ______ hours at the office than they ever did before.\n- (A) longest\n- (B) length\n- (C) longer\n- (D) lengthen\n\n> 根據一份關於工作習慣的報告，現今的人在辦公室度過的時間比以往都還要長。\n\n**形容詞位置 比較**\n空格後面接名詞（hours），所以能修飾名詞的形容詞 (A) 和 (C) 是可能的答案。因為句中有和比較級連用的 than（比起…），而且要表達「在辦公室度過更長的時間」的意思，所以比較級 (C) longer（比較長的）是正確答案。最高級 (A) 應該以「最高級（the + -est, the most 原級）+ of/in 或 that 子句」的形態使用。名詞 (B) 和動詞 (D) 不能修飾名詞。\n\n**單字** practice (n.) 慣例，習慣；length (n.) 長度；lengthen (n.) 延長\n\n**125.** 答案 (A)｜難度：中\nQuestions about Nedester televisions and ______ products can be directed to the company through their Web page.\n- (A) related\n- (B) relation\n- (C) relate\n- (D) relatively\n\n> 關於 Nedester 電視機與相關產品的問題，可以透過網頁傳達給該公司。\n\n**形容詞位置**\n能修飾空格後方名詞（products）的是形容詞，所以形容詞 (A) related（相關的）是正確答案。名詞 (B)、動詞 (C)、副詞 (D) 都不能修飾名詞。\n\n**單字** direct (v.) 轉達，寄（信）；relation (n.) 關係；relate (v.) 有關聯，使有關聯；relatively (adv.) 相對地，比較而言\n\n**126.** 答案 (B)｜難度：中\nEnvelopes must be properly sealed ______ dropping them into the mailbox, as the post office is not accountable for lost documents.\n- (A) among\n- (B) before\n- (C) beside\n- (D) while\n\n> 信封投入郵筒前必須封好，因為郵局不為遺失文件負責。\n\n**〔引導修飾語的成分〕副詞子句連接詞 時間**\n這個句子是有主詞（Envelopes）、動詞（must be sealed）的完整句，所以 ____ dropping them into the mailbox 的部分視為修飾語。這個修飾語是分詞構句，所以能引導分詞構句的副詞子句連接詞 (B) 和 (D) 是可能的答案。因為要表示「在信封投入郵筒前封好」的意思，所以 (B) before（在…之前）是正確答案。如果用 (D) while（在…的期間，然而）的話，意思會變成「必須在投入郵筒的同時把信封封好」，並不恰當。介系詞 (A) among（在…之中）和 (C) beside（在…旁邊）不能引導分詞構句。\n\n**單字** envelope (n.) 信封；properly (adv.) 適當地；seal (v.) 封住，密封；accountable (adj.) 對什麼負有責任的；lost (adj.) 遺失的，迷路的\n\n<!-- page 534 -->\n\n**127.** 答案 (B)｜難度：高\nSpeed-Ex Electronics was asked to make certain that all equipment for the new branch ______ by the end of June.\n- (A) will deliver\n- (B) is delivered\n- (C) delivering\n- (D) deliver\n\n> Speed-Ex Electronics 公司被要求務必讓新分店的所有設備在六月底前送到。\n\n**〔動詞位置〕主動態與被動態的區別**\n名詞子句連接詞 that 引導的名詞子句（that all ~ June）缺少動詞，所以動詞 (A)、(B)、(D) 是可能的答案。因為表示「所有設備被送到」的被動意義，而且 deliver（配送）是及物動詞，空格後面卻沒有受詞，所以被動態 (B) is delivered 是正確答案。主動態 (A) 和 (D) 後面要接受詞，而動名詞或分詞 (C) 不能用在動詞的位置。\n\n**單字** make certain (phr.) 務必做到，確認；equipment (n.) 設備，裝備\n\n**128.** 答案 (C)｜難度：最高\nThe editors of *The Pine Journal* go through all the articles before printing to check for errors and factual ______.\n- (A) investigations\n- (B) installments\n- (C) discrepancies\n- (D) gratuities\n\n> 《Pine Journal》的編輯會在印刷前仔細看過所有文章，檢查是否有錯誤和不符事實之處。\n\n**名詞詞彙**\n文意是「檢查是否有錯誤和與事實不一致處」，所以名詞 (C) discrepancies（不一致，差異）是正確答案。(A) 的名詞 investigation 表示「調查，研究」，(B) 的 installment 表示「分期付款」，(D) 的 gratuity 表示「小費」。\n\n**單字** editor (n.) 編輯者；go through (phr.) 仔細看過；factual (adj.) 事實的，如實的\n\n**129.** 答案 (C)｜難度：高\nThe city has plans to ______ local parks by planting more trees and flowers to make the areas look nicer.\n- (A) certify\n- (B) officiate\n- (C) revitalize\n- (D) aggregate\n\n> 市府計畫藉由種植更多樹木與花朵來美化區域，使地方公園恢復活力。\n\n**動詞詞彙**\n文意是「藉由讓區域看起來更好，使地方公園恢復活力」，所以動詞 (C) revitalize（使恢復生氣）是正確答案。(A) certify 表示「證明」，(B) officiate 表示「主持儀式，履行職務」，(D) aggregate 表示「聚集，合計」。\n\n**單字** plant (v.) 種植（樹木、種子等）\n\n**130.** 答案 (D)｜難度：最高\nAfter working for many years as a police officer, Paul Stone ______ his career experience to start up a personal security company for high-profile executives.\n- (A) kept after\n- (B) followed up\n- (C) pointed out\n- (D) drew on\n\n> Paul Stone 擔任警察多年後，利用自己的職業經驗成立了為知名主管級人士服務的個人保全公司。\n\n**動詞慣用語**\n文意是「利用職業經驗成立了個人保全公司」，所以動詞慣用語 draw on（利用，憑著）的過去式 (D) drew on 是正確答案。(A) 的動詞慣用語 keep after 表示「緊緊追趕」，(B) 的 follow up 表示「進一步行動，追查」，(C) 的 point out 表示「指出，提出」。\n\n**單字** police officer (phr.) 警察，警官；high-profile (adj.) 高知名度的，受矚目的；(n.) 高調的姿態；executive (n.) 高階主管\n\n<!-- page 535 -->\n\n## PART 6\n\n### Questions 131-134 refer to the following announcement. 🆕\n131-134 題參照以下公告。\n\n> Attention residents of Sudbury:\n>\n> A neighborhood gathering ______(131) at the community center next Thursday evening. This meeting is open to all local residents.\n>\n> The main issue up for discussion is the implementation of traffic calming measures on Kingston Road. This must be resolved as soon as possible because of the sharp ______(132) in the number of cars using that street. Other issues on the agenda include the garbage collection schedule and the rezoning of Hammersmith Drive. ______(133)\n>\n> Refreshments will be served from 7:30 p.m., and business will begin at 8 p.m. Please arrive ______(134) to ensure that we have enough time to address everything.\n\n**翻譯**\n> 薩德柏立居民請注意：\n>\n> [131]下週四晚間將於社區中心舉行鄰里會議。本次會議開放所有本地居民參加。\n>\n> 主要討論議題是 Kingston 路交通緩和措施的實施。[132]本案必須盡快解決，因為使用該道路的車輛數急遽增加。其他議題包括垃圾收取時程與 Hammersmith 路重新分區。[133]您可以在我們的網站上了解這些議題。\n>\n> 茶點將於晚間 7:30 開始供應，會議於晚間 8 點開始。[134]請準時到場，讓我們有足夠的時間處理所有事項。\n\n**131.**\n- (A) took place\n- (B) will take place\n- (C) has taken place\n- (D) to take place\n\n**132.**\n- (A) increase\n- (B) prohibition\n- (C) advance\n- (D) exchange\n\n**133.** 🆕\n- (A) We appreciate your having taken the time to express your opinions.\n- (B) You may familiarize yourself with these issues on our Web site.\n- (C) It is our decision to provide alternative routes for those using the street.\n- (D) Your decisions have made our community a better place to live in.\n\n**134.**\n- (A) punctuality\n- (B) punctual\n- (C) punctualities\n- (D) punctually\n\n**單字** resident (n.) 居民，居住者；neighborhood gathering (phr.) 鄰里的集會；community center (phr.) 社區中心；local (adj.) 地方的，本地的；implementation (n.) 實施，履行；calm (v.) 使緩和；(adj.) 平靜的，鎮定的；measure (n.) 措施；resolve (v.) 解決，下決心；collection (n.) 收取，收集；rezone (v.) 重新分區；refreshment (n.) 茶點，點心和飲料；address (v.) 處理（問題、狀況等）\n\n<!-- page 536 -->\n\n**131.** 答案 (B)｜難度：低\n**〔動詞位置〕未來式**\n句中缺少動詞，所以動詞 (A)、(B)、(C) 是可能的答案。因為有表示未來時間的詞語（next Thursday evening），所以未來式 (B) will take place 是正確答案。過去式 (A) 和現在完成式 (C) 不能和表示未來時間的詞語連用。to 不定詞 (D) 不能用在動詞的位置。\n\n**132.** 答案 (A)｜難度：中\n**名詞詞彙**\n文意是「因為使用該道路的車輛數急遽的增加，所以必須盡快解決」，所以名詞 (A) increase 是正確答案。(B) prohibition 表示「禁止」，(C) advance 表示「發展」，(D) exchange 表示「交換」。\n\n**133.** 🆕 答案 (B)｜難度：中\n**選出空格中正確的句子**\n這是選擇句子的題目，所以要參考空格前後或文章整體的內容。前面部分提到主要討論議題是 Kingston 路交通緩和措施的實施，而空格所在句子的上一句「Other issues on the agenda include the garbage collection schedule and the rezoning of Hammersmith Drive.」提到其他議題包括垃圾收取時程與 Hammersmith 路重新分區，所以空格的內容應該和開會前預先了解這些議題有關，正確答案是 (B) You may familiarize yourself with these issues on our Web site。\n\n**選項翻譯**\n- (A) 我們感謝您花了時間表達意見。\n- (B) 您可以在我們的網站上了解這些議題。\n- (C) 我們的決定是為使用該道路者提供替代路線。\n- (D) 您的決定使我們的社區成為了更適合居住的地方。\n\n**單字** familiarize (v.) 使熟悉；alternative (adj.) 替代的，可作為替代的；route (n.) 路線，路徑\n\n**134.** 答案 (D)｜難度：低\n**副詞位置**\n能修飾空格前方動詞（arrive）的是副詞，所以副詞 (D) punctually（準時地）是正確答案。名詞 (A) 和 (C)、形容詞 (B) 不能修飾動詞。\n\n**單字** punctuality (n.) 守時，準時；punctual (adj.) 準時的\n\n<!-- page 537 -->\n\n### Questions 135-138 refer to the following e-mail. 🆕\n135-138 題參照以下電子郵件。\n\n> To: Denise Brooks <dbrooks@atland.com>\n> From: Nelson Lee <nlee@atland.com>\n> Subject: Acton\n> Date: January 18\n>\n> Hello Denise,\n>\n> As you know, I have an appointment with a potential client from Acton, the firm interested in purchasing our computer components on a regular basis. Since the meeting will take place in a few days, I have been hard at work trying to finalize a sales ______(135).\n>\n> However, I seem to have misplaced the copy that I printed out. Although I have the file on my hard drive, the printed one is especially important because I wrote some notes on it. ______(136). Could you please check whether the draft was filed away by mistake? ______(137) I can get that particular copy back, I'll have to go over the one I have and make notes again. It's essential that we secure the Acton as a ______(138), so I would really appreciate it if you could locate the missing document for me. Thank you.\n>\n> Nelson Lee\n\n**翻譯**\n> 收件者：Denise Brooks <dbrooks@atland.com>\n> 寄件者：Nelson Lee <nlee@atland.com>\n> 主旨：Acton 公司\n> 日期：1 月 18 日\n>\n> 哈囉 Denise：\n>\n> 如你所知，我和 Acton 公司的準客戶有約，他們公司有意定期採購我們的電腦元件。[135]因為幾天以後就要會面，所以我很努力要完成銷售提案。\n>\n> 不過，我不知道把印出來的那份文件放到哪裡了。雖然我的硬碟上有檔案，但印出來的那份特別重要，因為我在上面寫了些筆記。[136]我當時沒時間把這些筆記加到電子檔上。可以請你看看這份草稿是否不小心被歸檔了嗎？[137]除非我能拿回那一份文件，不然我就得重看我有的那一份，再重新做筆記了。[138]我們爭取到 Acton 公司這個客戶很重要，所以如果你能幫我找到弄丟的文件，我會很感謝的。謝謝。\n>\n> Nelson Lee\n\n**135.**\n- (A) propose\n- (B) proposed\n- (C) proposal\n- (D) propositional\n\n**136.** 🆕\n- (A) Please make sure that the final draft is sent to the client immediately.\n- (B) Acton's order must be shipped out first thing in the morning.\n- (C) They are unwilling to agree to the deal unless we revise it.\n- (D) I haven't had the time to add these notes into the electronic file.\n\n**137.**\n- (A) Though\n- (B) Whoever\n- (C) Whether\n- (D) Unless\n\n**138.**\n- (A) developer\n- (B) vendor\n- (C) supplier\n- (D) customer\n\n**單字** potential (adj.) 潛在的，可能的；client (n.) 客戶；component (n.) 零件，元件；on a regular basis (phr.) 定期地；take place (phr.) 發生，舉行；finalize (v.) 完成，最後確定；sales (adj.) 銷售的，（推銷）業務的；misplace (v.) 放在想不起來的地方；draft (n.) 草案，草稿；file (v.) 歸檔；(n.) 檔案；essential (adj.) 必要的，本質的；secure (v.) 獲得；(adj.) 安全的；locate (v.) 找出，設置\n\n<!-- page 538 -->\n\n**135.** 答案 (C)｜難度：中\n**名詞位置**\n能被空格前方形容詞（sales）修飾的是名詞，所以名詞 (C) proposal（提案）是正確答案。動詞 (A)、動詞或分詞 (B)、形容詞 (D) 不能被形容詞修飾。如果把 sales 當成名詞複數形的話，分詞 (B) 可以修飾 sales，但 sales 前面有單數名詞用的不定冠詞（a），所以不能把 sales 當成名詞複數形，所以 (B) 不對。\n\n**136.** 🆕 答案 (D)｜難度：中\n**選出空格中正確的句子**\n這是選擇句子的題目，所以要參考空格前後或文章整體的內容。上一句「Although I have the file on my hard drive, the printed one is especially important because I wrote some notes on it.」提到雖然硬碟上有檔案，但印出來的那份特別重要，因為上面有筆記，所以空格的內容應該和電子檔與列印版本的差異有關，正確答案是 (D) I haven't had the time to add these notes into the electronic file。\n\n**選項翻譯**\n- (A) 請務必把最終草案立刻寄給客戶。\n- (B) Acton 公司的訂貨必須一早首先寄出。\n- (C) 除非我們修改協議內容，不然他們不願意同意。\n- (D) 我當時沒時間把這些筆記加到電子檔上。\n\n**單字** ship out (phr.) 寄送出去；unwilling (adj.) 不願意的，不情願的；deal (n.) 交易，協議\n\n**137.** 答案 (D)｜難度：中\n**〔引導修飾語的成分〕副詞子句連接詞 條件**\n這個句子是有主詞（I）、動詞（'ll have to go over）和受詞（the one I have）的完整子句，所以 ____ I can get that particular copy back 的部分視為修飾語。這個修飾語是有動詞（can get）的的修飾子句，而所有選項都可以引導修飾子句。因為要表示「除非能拿回那份文件，不然就要用我有的那一份重新做筆記」的意思，所以表讓步的副詞子句連接詞 (D) Unless（除非…）是正確答案。如果用 (A) Though（雖然…）和 (C) Whether（不管是否…）的話，意思會變成就算拿回那份文件，還是要重新做筆記，並不恰當。複合關係代名詞 (B) Whoever（不管是誰）當句中的主詞或受詞，所以後面接的子句會少掉主詞或受詞。\n\n**138.** 答案 (D)｜難度：中\n**名詞詞彙** 參考全文\n文意是「獲得 Acton 公司作為 ____ 很重要」，所有選項都是可能的答案。因為無法從空格所在的句子判斷答案，所以必須參考空格前後或文章整體的內容。文章前面部分提到，和 Acton 公司的準客戶（潛在客戶）有約，他們公司有意定期採購本公司的電腦元件，而且為了會面而要完成銷售提案，可知應該是希望 Acton 公司成為客戶，所以 (D) customer（顧客）是正確答案。(A) developer 表示「開發者」，(B) vendor 表示「販售者」，(C) supplier 表示「供應者」。\n\n<!-- page 539 -->\n\n### Questions 139-142 refer to the following letter. 🆕\n139-142 題參照以下信件。\n\n> James Gretsky\n> Mythos Computers, Customer Inquiries Department\n> 1511 South Lowell Boulevard, Denver, Colorado, 80236\n>\n> Dear Mr. Gretsky,\n>\n> I recently called your company's customer service line to report a problem with my laptop. I rarely make use of such services because the employees are usually ______(139). However, in this case I was pleasantly surprised.\n>\n> The employee I spoke to, Patrick Kelley, ______(140) understood my problem. He was well informed and assured me that he had encountered issues similar to mine before. ______(141). So I followed his advice and sent my laptop in for repair.\n>\n> Mr. Kelley showed me some of the finest service that I ______(142) in my life. I would appreciate if you could convey my thanks to him, and I will definitely ask for his assistance if I ever experience another problem with my device.\n>\n> Best wishes,\n>\n> Sandra Stevenson\n\n**翻譯**\n> James Gretsky\n> Mythos 電腦公司，顧客詢問部門\n> 1511 號，South Lowell 大道，丹佛，科羅拉多州，80236\n>\n> 親愛的 Gretsky 先生：\n>\n> 我最近打電話到貴公司的客服專線，回報我筆記型電腦的問題。[139]我很少使用這種服務，因為員工通常幫不上忙。不過，這次我卻很驚喜。\n>\n> [140]和我通話的員工 Patrick Kelley 馬上就明白我的問題。他知識很豐富，也向我保證以前遇過和我類似的問題。[141]他建議我盡快讓他們的技術人員看一看。所以我照著他的建議把筆記型電腦送修了。\n>\n> [142]Kelley 先生讓我感受到這輩子接受過最高等級的服務。如果您能向他傳達我的謝意，我會很感激的，而如果我的設備又出問題，我一定會請他幫忙。\n>\n> Sandra Stevenson\n\n**139.**\n- (A) secretive\n- (B) unhelpful\n- (C) enthusiastic\n- (D) supportive\n\n**140.**\n- (A) visibly\n- (B) partially\n- (C) plausibly\n- (D) immediately\n\n**141.** 🆕\n- (A) He told me he would have to direct my call to his supervisor.\n- (B) He suggested I let their technicians take a look at it as soon as possible.\n- (C) It is not the responsibility of the manufacturer to detect technical flaws.\n- (D) He highly recommended that I visit a local branch to get it renewed.\n\n**142.**\n- (A) receives\n- (B) will be receiving\n- (C) have received\n- (D) to receive\n\n**單字** inquiry (n.) 詢問，調查；rarely (adv.) 很少，難得；make use of (phr.) 利用…；pleasantly (adv.) 愉快地；well informed (phr.) 知識豐富的；encounter (v.) 遇到，遭遇；repair (n.) 修理，修補；(v.) 修理；convey (v.) 傳達，輸送\n\n<!-- page 540 -->\n\n**139.** 答案 (B)｜難度：（頁頂裁切，無法確認）\n*(本頁頂端被掃描裁切，139 題標題行與解析第一行僅部分可見；答案 (B) 取自下方解析內文)*\n…句子判斷答案，所以必須參考空格前後或文章整體的內容。下一句說這次[…無法辨識…]這次客服人員的幫忙，所以相對於這次經驗，以前遇到的客服人員應該是沒幫上什麼忙的，形容詞 (B) unhelpful（幫不上忙的）是正確答案。(A) secretive 表示「遮遮掩掩的」，(C) enthusiastic 表示「熱情的」，(D) supportive 表示「支援的」。\n\n**140.** 答案 (D)｜難度：高\n**副詞詞彙** 參考上下文\n文意是「Patrick Kelley ____ 明白我的問題」，(A)、(B)、(D) 是可能的答案。因為無法從空格所在的句子判斷答案，所以必須參考空格前後或文章整體的內容。下一句說他知識很豐富，並且說自己以前遇過類似的問題，可知他應該很快就了解問題，所以副詞 (D) immediately（立刻）是正確答案。(A) visibly 表示「可見地」，(B) partially 表示「部分地」，(C) plausibly 表示「似乎合理地」。\n\n**141.** 🆕 答案 (B)｜難度：中\n**選出空格中正確的句子**\n這是選擇句子的題目，所以要參考空格前後或文章整體的內容。下一句「So I followed his advice and sent my laptop in for repair.」說照著 Kelley 先生的建議把筆記型電腦送修了，所以空格的內容應該和 Kelley 先生建議送修有關，正確答案是 (B) He suggested I let their technicians take a look at it as soon as possible。\n\n**選項翻譯**\n- (A) 他告訴我必須把我的電話轉給主管。\n- (B) 他建議我盡快讓他們的技術人員看一看。\n- (C) 查出技術上的瑕疵不是製造商的責任。\n- (D) 他非常建議我去地方分公司把它更新。\n\n**單字** detect (v.) 發現，查出；flaw (n.) 瑕疵，裂縫；branch (n.) 分店，分公司，分支\n\n**142.** 答案 (C)｜難度：中\n**〔動詞位置〕現在完成式**\nthat 子句（that I ~ in my life）缺少動詞，所以動詞 (A)、(B)、(C) 是可能的答案。因為要表示「Kelley 先生展現出我這輩子接受過最好的服務的一部分」的意思，所以表示一段期間內的經驗的現在完成式 (C) have received 是正確答案。現在式 (A) 主要表示反覆的行為或習慣，所以不對。句子表示已經遇到的事情，所以未來式 (B) 也不對。to 不定詞 (D) 不能用在動詞的位置。\n\n<!-- page 541 -->\n\n### Questions 143-146 refer to the following advertisement. 🆕\n143-146 題參照以下廣告。\n\n> Seattle New Light Nursing Home\n>\n> We're Here to Help\n>\n> Many elderly people find themselves in nursing homes far from city life and at a considerable ______(143) from family and friends. This is not the case at Seattle New Light Nursing Home.\n>\n> The physical and mental health of seniors is our number one priority. We therefore help residents to ______(144) a healthy degree of social interaction by keeping them occupied with a variety of stimulating activities each day including exercise classes, games, and musical performances. ______(145). Furthermore, because public transportation, community centers, and parks are all easily accessible from our location, residents are free to pursue their interests while also benefiting from the daily ______(146) and attention our staff provides.\n>\n> Call us at 206-665-8924 to reserve a time to tour our facilities.\n\n**翻譯**\n> 西雅圖 New Light 安養院\n>\n> 我們在這裡提供幫助\n>\n> [143]許多年長者覺得他們住的安養院遠離城市生活，而且離家人和朋友的距離也很遠。但在西雅圖 New Light 安養院並非如此。\n>\n> 年長者的身心健康是我們的第一優先。[144]所以我們藉由每天讓入住者參與包括運動課程、遊戲、音樂表演等多種具激勵性的活動，幫助他們維持健康的社交互動程度。[145]這些活動對於促進他們的生活品質非常有幫助。[146]而且，因為從我們這裡很容易到達大眾運輸、社區中心、公園，所以入住者可以自由地追求自己的興趣，同時又能受益於我們員工所提供的每日看護與關照。\n>\n> 請撥 206-665-8924 聯絡我們，以預約參觀本設施的時間。\n\n**143.**\n- (A) distance\n- (B) distant\n- (C) distancing\n- (D) distantly\n\n**144.**\n- (A) recommend\n- (B) maintain\n- (C) require\n- (D) evaluate\n\n**145.** 🆕\n- (A) These go a long way toward improving their quality of life.\n- (B) Our center is located far from the hectic urban landscape.\n- (C) Families may also consider alternative types of physical therapy.\n- (D) Some of our patients are not permitted to leave the facility.\n\n**146.**\n- (A) burden\n- (B) influence\n- (C) care\n- (D) caution\n\n**單字** nursing home (phr.) 安養院；considerable (adj.) 相當大的，相當多的；mental (adj.) 精神上的，心理上的；number one priority (phr.) 第一優先的事；interaction (n.) 互動；occupied with (phr.) 忙於…的；stimulating (adj.) 激勵性的，給予刺激的；performance (n.) 表演，實行，表現；accessible (adj.) 容易接近的，容易到達的；pursue (v.) 追求，追趕；attention (n.) 注意，關注\n\n<!-- page 542 -->\n\n**143.** 答案 (A)｜難度：低\n**〔名詞位置〕動名詞 vs. 名詞**\n能用在介系詞（at）的受詞位置的是名詞，所以名詞 (A) 和動名詞 (C) 是可能的答案。能被空格前方形容詞（considerable）修飾的是名詞，所以名詞 (A) distance（距離）是正確答案。另外，也請記得 at a distance（隔一段〔有點遠的〕距離）這個慣用語。動名詞 (C) 不能用在不定冠詞（a）後面，也不能被形容詞修飾，而要用副詞修飾。形容詞 (B) 和副詞 (D) 不能用在名詞的位置。\n\n**單字** distant (adj.) 遠的，遠離的；distantly (adv.) 遠遠地，遠離地\n\n**144.** 答案 (B)｜難度：中\n**動詞詞彙** 參考上下文\n文意是「幫助入住者 ______ 健康的社交互動程度」，所有選項都是可能的答案。因為無法從空格所在的句子判斷答案，所以必須參考空格前後或文章整體的內容。空格所在的句子提到，安養院讓入住者參與多種具激勵性的活動，而文章後面部分提到安養院很容易到達大眾運輸、社區中心、公園等等，可知安養院能幫助入住者維持健康的社會參與，所以動詞 (B) maintain（維持）是正確答案。(A) recommend 表示「推薦」，(C) require 表示「需要，要求」，(D) evaluate 表示「評價」。\n\n**145.** 🆕 答案 (A)｜難度：中\n**選出空格中正確的句子**\n這是選擇句子的題目，所以要參考空格前後或文章整體的內容。上一句「We therefore help residents to ~ and musical performances.」提到，安養院藉由每天讓入住者參與多種具激勵性的活動，幫助他們維持健康的社交互動程度，所以空格的內容應該和這些活動的效益有關，正確答案是 (A) These go a long way toward improving their quality of life。\n\n**選項翻譯**\n- (A) 這些活動對於促進他們的生活品質非常有幫助。\n- (B) 本中心的位置遠離繁忙的城市風景。\n- (C) 家人也可以考慮其他類型的物理治療。\n- (D) 我們有些患者不被允許離開設施。\n\n**單字** go a long way toward(s) (phr.) 對於做到…很有幫助；hectic (adj.) 繁忙的；landscape (n.) 風景\n\n**146.** 答案 (C)｜難度：中\n**名詞詞彙**\n文意是「入住者受益於員工所提供的每日看護與關照」，所以名詞 (C) care（照顧）是正確答案。(A) burden 表示「負擔」，(B) influence 表示「影響」，(D) caution 表示「小心，警告」。\n\n<!-- page 543 -->\n\n## PART 7\n\n### Questions 147-148 refer to the following e-mail.\n147-148 題參照以下電子郵件。\n\n> To: Frederick Montaigne <FredM@burgundycapita 而「I seem to be having an issue ~ for account transfers」的部分則提到在網路銀行轉帳時遇到了問題，接下來說明問題發生的情況，所以 (B) To explain a problem with an online service 是正確答案。\n\n**148.** 答案 (A)｜難度：低\nWhat does Ms. Herald require from Burgundy Capital?\n- (A) A security code\n- (B) A banking card\n- (C) An account statement\n- (D) A balance confirmation\n\n> Herald 小姐向 Burgundy Capital 要求什麼？\n> (A) 安全碼\n> (B) 金融卡\n> (C) 對帳單\n> (D) 餘額確認\n\n**wh- 問題 What**\n\n<!-- page 544 -->\n\n這是問 Herald 小姐向 Burgundy Capital 要求什麼（What）的 wh- 問題，所以要尋找和問題重點 Ms. Herald require from Burgundy Capital 相關的內容。「When attempting to conduct transfers ~ I receive a message asking me to enter my six-digit security pass number.」提到，在試圖轉帳時，收到要求輸入 6 位數安全密碼的訊息，而「If you could please advise me as to how I can go about retrieving this access code, I would appreciate your assistance greatly.」的部分則請求對方告知如何找到這個密碼，所以 (A) A security code 是正確答案。\n\n### Questions 149-150 refer to the following text message chain. 🆕\n149-150 題參照以下訊息對話紀錄。\n\n> **Mitchell Roach** [11:27 a.m.]\n> Hi, Jillian, are you free for lunch this week? [150]I'd like to get your opinion on a new case I've been assigned.\n>\n> **Mitchell Roach** [11:27 a.m.]\n> [149]I understand you were the lead counsel when Brighton Industrials got into a patent dispute with Grant Industries. Ms. Baird has asked me to handle their latest case against Cromwell Holdings.\n>\n> **Jillian Barrera** [11:32 a.m.]\n> Hi, Mitchell. Sorry to keep you waiting. I just finished a meeting with Astoria Enterprises. How does Thursday morning sound? I'm afraid I'm quite busy this week.\n>\n> **Mitchell Roach** [11:33 a.m.]\n> [150]I can do it on Thursday. We could meet for coffee or at the office whenever you're free.\n>\n> **Jillian Barrera** [11:33 a.m.]\n> [150]Why don't you come by my office at 8:30 a.m. for coffee? I have about an hour before my first appointment in the morning.\n>\n> **Mitchell Roach** [11:34 a.m.]\n> That's perfect for me as well. I really appreciate you taking the time to do this I may have some good suggestions for you.」，表示因為自己很了解 Brighton 公司，所以能給 Roach 先生好建議。從這些內容可以確定 (B) Brighton Industrials 是正確答案。\n\n**150.** 🆕 答案 (C)｜難度：中\nAt 11:34 a.m., what does Mr. Roach mean when he writes, \"That's perfect for me as well\"?\n- (A) A lunchtime meeting fits into his schedule.\n- (B) A case can be dealt with right away.\n- (C) An appointment for Thursday morning is suitable.\n- (D) A client can drop by his office anytime in the morning.\n\n> 在上午 11:34，Roach 先生說的「That's perfect for me as well」是什麼意思？\n> (A) 午餐時間的會面可以排進他的時間表。\n> (B) 案件可以馬上處理。\n> (C) 約在週四上午很合適。\n> (D) 客戶可以在早上任何時候到他的辦公室。\n\n**掌握意圖**\n題目問 Roach 先生的意思，所以要掌握引用部分（That's perfect for me as well）上下文的情境。Roach 先生說「I'd like to get your opinion on a new case I've been assigned.」，表示自己被分派了新的案子，想問 Barrera 小姐的意見，之後又說「I can do it on Thursday.」，表示可以在星期四見面。Barrera 小姐接著說「Why don't you come by my office at 8:30 a.m. for coffee?」，提議上午 8:30 在她的辦公室見面喝咖啡，而 Roach 先生回答「That's perfect for me as well.」（那對我來說也非常適合），表示同意在星期四上午 8:30 和 Barrera 小姐見面，所以 (C) An appointment for Thursday morning is suitable 是正確答案。\n\n**單字** deal with (phr.) 處理；suitable (adj.) 適合的，適當的；drop by (phr.) 短暫拜訪\n\n<!-- page 546 -->\n\n### Questions 151-152 refer to the following schedule.\n151-152 題參照以下時間表。\n\n> Northeast Internet Marketers Association (NEIMA)\n> The Future of Internet Marketing Conference\n> Northeast University School of Business\n>\n> [152-B]Day 1: April 23\n\n| 時間 | 內容 |\n|---|---|\n| 9-10 a.m. | Hawthorne Room, First Floor<br>Registration and collection of name badges |\n| 10-11:30 a.m. | Opening Panel Discussion, Johnstone Auditorium, First Floor<br>Important upcoming trends in Internet marketing, with time for questions<br>Featuring James Burke (NEIMA), Andrea Harrison from Brand Solutions Limited, and Professor Ming Chao of Northeast University |\n| 11:30 a.m.-12:30 p.m. | Workshop, Washington Room, Third Floor<br>\"How To Measure Impact,\" with Simon Gleason from Gleason Search Analytics |\n| 12:30-1:30 p.m. | [152-C]Lunch<br>There is a cafeteria located in the Student Union building, which will be open for the event. |\n| 1:30-3:00 p.m. | Workshop, Dawson Room, Second Floor<br>[151]\"How Interns Can Become Invaluable: What To Look For In Student Placements,\" with Padma Singh from Northeast University Careers Office |\n| 3:00-4:30 p.m. | Closing Panel Session, Johnstone Auditorium, First Floor<br>NEIMA's Gwen Carter recaps lessons learned from the day's workshops. [152-B]Audience members will also be asked to submit topics they would like to discuss in tomorrow's interactive sessions. |\n\n**翻譯**\n> Northeast 網路行銷人員協會（NEIMA）\n> 網路行銷的未來會議\n> Northeast 大學商學院\n>\n> [152-B]第一天：4 月 23 日\n\n| 時間 | 內容 |\n|---|---|\n| 上午 9 點－10 點 | Hawthorne 室，1 樓<br>登記報到與領取名牌 |\n| 上午 10 點－11:30 | 開幕座談會，Johnstone 演講廳，1 樓<br>網路行銷將來臨的重要趨勢，有發問時間<br>與談人包括 James Burke（NEIMA）、Brand Solutions Limited 公司的 Andrea Harrison、Northeast 大學的 Ming Chao 教授 |\n| 上午 11:30－中午 12:30 | 研習會，Washington 室，3 樓<br>「如何衡量影響」，由 Gleason Search Analytics 公司的 Simon Gleason 主講 |\n| 中午 12:30－下午 1:30 | [152-C]午餐<br>學生會大樓內有自助餐廳，將為本活動開放。 |\n| 下午 1:30－3:00 | 研習會，Dawson 室，2 樓<br>[151]「實習生能如何發揮用處：該從學生實習中期待什麼」，由 Northeast 大學職涯辦公室的 Padma Singh 主講 |\n| 下午 3:00－4:30 | 閉幕座談會，Johnstone 演講廳，1 樓<br>NEIMA 的 Gwen Carter 回顧本日研習會中學到的課題。[152-B]聽眾也將被要求提出希望在次日的互動時間中討論的主題。 |\n\n**單字** association (n.) 協會，聯合；measure (v.) 測量，測定；invaluable (adj.) 無價的，非常寶貴的；recap (v.) 重新概述；registration (n.) 登記，報名；impact (n.) 影響，衝擊；look for (phr.) 期待，尋找；submit (v.) 提交，提出；upcoming (adj.) 即將來臨的；student union (phr.) 學生會；placement (n.) 就業，雇用，放置；interactive (adj.) 互動的，相互作用的\n\n**151.** 答案 (D)｜難度：低\nWhich scheduled speaker will discuss student interns?\n- (A) Simon Gleason\n- (B) Ming Chao\n- (C) Gwen Carter\n- (D) Padma Singh\n\n> 預定的哪位講者會討論實習學生？\n> (A) Simon Gleason\n> (B) Ming Chao\n> (C) Gwen Carter\n> (D) Padma Singh\n\n**wh- 問題 Which**\n這是問預定的哪位（Which）講者會討論實習學生的 wh- 問題，所以要尋找和問題重點 discuss student interns 相關的內容。「\"How Interns Can Become Invaluable: What To Look For In Student Placements,\" with Padma Singh」的部分顯示 Padma Singh 將討論如何讓實習生發揮用處，所以 (D) Padma Singh 是正確答案。\n\n<!-- page 547 -->\n\n**152.** 答案 (B)｜難度：中\nWhat is suggested about the conference?\n- (A) It includes a social event in the evening.\n- (B) It continues for a second day.\n- (C) It is held in the Student Union building.\n- (D) Its activities take place on four different floors.\n\n> 關於會議，文中顯示什麼？\n> (A) 包含晚上的社交活動。\n> (B) 會繼續進行第二天。\n> (C) 在學生會大樓舉辦。\n> (D) 活動在四個不同樓層進行。\n\n**推論** 細節資訊\n這是關於題目重點 the conference 的推論問題。「Day 1: April 23」顯示這是活動第一天的時間表，而「Audience members will also be asked to submit topics they would like to discuss in tomorrow's interactive sessions.」的部分提到，聽眾會被要求提出希望在隔天的互動時間中討論的主題，所以可以推知活動將在隔天繼續進行，(B) It continues for a second day. 是正確答案。和 (C) 相關的部分是「Lunch, There is a cafeteria located in the Student Union Building」，表示會在學生會大樓吃午餐，但這並不是整場活動舉辦的地點，所以 (C) 不對。\n\n**單字** continue (v.) 繼續，持續\n\n### Questions 153-154 refer to the following information.\n153-154 題參照以下資訊。\n\n> [153]Tax Deductions for Telecommuters\n>\n> Telecommuting employees are eligible for a number of deductions that can be applied to their income tax calculations. Those incurring home office costs related to new equipment purchases, such as computers, monitors, phones, and printers, may deduct the cost of this equipment in one of two ways. They may deduct the full cost of an item in the same year it was purchased or spread out the cost over seven years. So, for example, an item worth $70 may be fully deducted the first year or deducted by $10 each year for seven years. [154]Employees who frequently use phones for business purposes also qualify for deductions, provided they can show documents as proof that their phones were used during office hours. Occupancy expenses, including rent, mortgage payments, and home insurance coverage, are partially tax-deductible, depending on the amount of home space used for work. For questions about this information, please contact the human resources manager for your branch of the company.\n\n**翻譯**\n> [153]遠距工作者的稅捐扣除額\n>\n> 遠距工作的員工享有許多計算所得稅時適用的扣除額。因電腦、顯示器、電話、印表機等新設備採購而產生家庭辦公室費用者，可於兩種方式中擇一扣除設備費用。可於購買年度扣除物品全額費用，或者將費用分 7 年扣除。所以舉例來說，價值 70 美元的物品可於第一年全額扣抵稅額，或於 7 年間每年扣抵 10 美元。[154]經常因業務目的使用電話的員工亦享有扣抵稅額，只要能出示文件證明於上班時間使用電話即可。居住費用，包括租金、房貸還款、住宅保險，可部分扣抵稅額，視用於工作之家庭空間大小而定。關於本訊息若有疑問，請聯絡您的分公司的人事經理。\n\n**單字** deduction (n.) 扣除，扣除額；incur (v.) 產生（費用），招致；mortgage (n.) 抵押貸款；telecommuter (n.) 遠距工作者；spread out (phr.) 分攤，攤開；insurance (n.) 保險，保險金；be eligible for (phr.) 有資格得到…；occupancy (n.) 入住，居住；coverage (phr.) 保險範圍，報導\n\n<!-- page 548 -->\n\n**153.** 答案 (C)｜難度：中\nWhere would the information most likely appear?\n- (A) A promotional poster\n- (B) An equipment manual\n- (C) An employee handbook\n- (D) An insurance policy\n\n> 這則資訊最有可能出現在哪裡？\n> (A) 宣傳海報\n> (B) 設備手冊\n> (C) 員工手冊\n> (D) 保險單\n\n**推論** 整體資訊\n這是要綜合文章各處的線索，推斷資訊可能出現處的推論問題。「Tax Deductions for Telecommuters」表示這則資訊是關於遠距工作者的稅捐扣除額，而「Telecommuting employees are eligible for a number of deductions」提到遠距工作的員工享有許多扣除額，所以可以推知這是給員工看的訊息，(C) An employee handbook 是正確答案。\n\n**154.** 答案 (B)｜難度：中\nWhat is indicated in the information?\n- (A) Some expensive items require special permission to buy.\n- (B) Call records may be needed to subtract some charges.\n- (C) Expenses related to home ownership are completely tax-deductible.\n- (D) The cost of insuring property can be completely recovered.\n\n> 這則資訊中提到什麼？\n> (A) 某些昂貴的物品需要特別許可才能購買。\n> (B) 扣除某些費用時可能需要通話紀錄。\n> (C) 和持有住宅相關的支出可以全額扣抵稅額。\n> (D) 為不動產保險的費用可以全部拿回來。\n\n**推論** 細節資訊\n這是問資訊中提到什麼的推論問題。這一題沒有特定的關鍵字，所以必須找出和各選項相關的內容，並且核對是否正確。「Employees ~ qualify for deductions, provided they can show documents as proof that their phones were used during office hours.」提到，只要能出示文件證明在上班時間使用電話，就可以扣抵稅額，可以推斷要扣除電話費時需要通話紀錄，所以 (B) Call records may be needed to subtract some charges 是正確答案。\n\n<!-- page 549 -->\n\n### Questions 155-157 refer to the following e-mail.\n155-157 題參照以下電子郵件。\n\n> From: Mitchell Harcourt <harcourt@tuton.org>\n> To: Sara Brunelli <sarahb1971@easymail.ca>\n> Date: January 17\n> Subject:
