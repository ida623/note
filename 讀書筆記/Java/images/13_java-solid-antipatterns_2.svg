<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 274" aria-label="依賴反轉示意：重構前 TransferService 的箭頭直接指向 MySqlAccountStore 與 SmsSender 兩個具體類別；重構後 TransferService 指向 AccountStore 與 Notifier 兩個介面，正式的 MySQL 實作、簡訊實作，以及測試用的記憶體實作，箭頭都往上指向這兩個介面" width="784" height="274">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="274" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="so2-a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs>
  <text x="160" y="24" font-size="13" text-anchor="middle" font-weight="700">重構前：高層直接依賴細節</text>
  <text x="540" y="24" font-size="13" text-anchor="middle" font-weight="700">重構後：兩邊都依賴抽象</text>
  <rect x="90" y="44" width="140" height="36" rx="8" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="160" y="67" font-size="12" text-anchor="middle" class="mono">TransferService</text>
  <line x1="140" y1="82" x2="95" y2="158" stroke="currentColor" stroke-width="1.5" marker-end="url(#so2-a2)"/>
  <line x1="180" y1="82" x2="225" y2="158" stroke="currentColor" stroke-width="1.5" marker-end="url(#so2-a2)"/>
  <rect x="20" y="160" width="140" height="36" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="90" y="183" font-size="11" text-anchor="middle" class="mono">MySqlAccountStore</text>
  <rect x="170" y="160" width="120" height="36" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="230" y="183" font-size="11" text-anchor="middle" class="mono">SmsSender</text>
  <rect x="470" y="40" width="140" height="34" rx="8" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="540" y="62" font-size="12" text-anchor="middle" class="mono">TransferService</text>
  <line x1="510" y1="76" x2="455" y2="110" stroke="currentColor" stroke-width="1.5" marker-end="url(#so2-a2)"/>
  <line x1="570" y1="76" x2="625" y2="110" stroke="currentColor" stroke-width="1.5" marker-end="url(#so2-a2)"/>
  <rect x="380" y="112" width="140" height="32" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="450" y="133" font-size="11" text-anchor="middle" class="mono">«介面» AccountStore</text>
  <rect x="580" y="112" width="140" height="32" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="650" y="133" font-size="11" text-anchor="middle" class="mono">«介面» Notifier</text>
  <line x1="420" y1="188" x2="435" y2="148" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#so2-a2)"/>
  <line x1="500" y1="188" x2="470" y2="148" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#so2-a2)"/>
  <line x1="620" y1="188" x2="640" y2="148" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#so2-a2)"/>
  <line x1="700" y1="188" x2="668" y2="148" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#so2-a2)"/>
  <text x="420" y="204" font-size="10" text-anchor="middle" class="mono">MySQL 版</text>
  <text x="505" y="204" font-size="10" text-anchor="middle" class="mono">記憶體版（測試）</text>
  <text x="615" y="204" font-size="10" text-anchor="middle" class="mono">簡訊版</text>
  <text x="705" y="204" font-size="10" text-anchor="middle" class="mono">記錄版（測試）</text>
  <text x="380" y="238" font-size="12" text-anchor="middle" fill="var(--slate-deep)">實線＝使用；虛線＝實作。重構後，細節的箭頭反過來指向抽象</text>
</svg>
