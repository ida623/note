<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 254" aria-label="規則放在哪裡的三種做法：貧血模型的 Account 只有 getter 與 setter，規則在 AccountService，任何人都能直接呼叫 setter 繞過規則；充血模型的 Account 自己有 withdraw，沒有 setter；資料導向是不可變的 record 加上分開的 Withdrawals 函式，回傳 sealed 結果" width="784" height="254">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="254" fill="#FFFFFF" stroke="none"/>
  <text x="130" y="26" font-size="13" text-anchor="middle" font-weight="700">貧血模型</text>
  <text x="380" y="26" font-size="13" text-anchor="middle" font-weight="700">充血模型</text>
  <text x="630" y="26" font-size="13" text-anchor="middle" font-weight="700">資料導向</text>
  <rect x="40" y="44" width="180" height="56" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="130" y="66" font-size="12" text-anchor="middle" class="mono">Account</text>
  <text x="130" y="86" font-size="11" text-anchor="middle" class="mono">getBalance / setBalance</text>
  <rect x="40" y="116" width="180" height="56" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="130" y="138" font-size="12" text-anchor="middle" class="mono">AccountService</text>
  <text x="130" y="158" font-size="11" text-anchor="middle" class="mono">withdraw（規則在這）</text>
  <text x="130" y="196" font-size="11" text-anchor="middle" fill="var(--gold-deep)">setter 可以繞過規則</text>
  <rect x="290" y="44" width="180" height="128" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="380" y="70" font-size="12" text-anchor="middle" class="mono">Account</text>
  <text x="380" y="96" font-size="11" text-anchor="middle" class="mono">withdraw（規則在這）</text>
  <text x="380" y="118" font-size="11" text-anchor="middle" class="mono">balance()</text>
  <text x="380" y="140" font-size="11" text-anchor="middle">沒有 setter</text>
  <text x="380" y="196" font-size="11" text-anchor="middle" fill="var(--slate-deep)">資料與規則在一起</text>
  <rect x="540" y="44" width="180" height="56" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="630" y="66" font-size="12" text-anchor="middle" class="mono">record Account</text>
  <text x="630" y="86" font-size="11" text-anchor="middle">不可變</text>
  <rect x="540" y="116" width="180" height="56" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="630" y="138" font-size="12" text-anchor="middle" class="mono">Withdrawals.withdraw</text>
  <text x="630" y="158" font-size="11" text-anchor="middle" class="mono">回傳 sealed Result</text>
  <text x="630" y="196" font-size="11" text-anchor="middle" fill="var(--slate-deep)">資料與規則分開，但資料改不了</text>
  <text x="380" y="222" font-size="12" text-anchor="middle">灰藍框＝業務規則所在的地方</text>
</svg>
