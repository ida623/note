<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 274" aria-label="使用者態的 Java 程式經過 JVM 與 glibc 呼叫 write，透過 trap 進入核心態，由核心操作硬體，再用 return-from-trap 回到使用者態" width="784" height="274">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="274" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="os-2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor" fill-opacity=".6"/></marker><marker id="os-2-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--gold-deep)"/></marker></defs>
  <rect x="20" y="20" width="720" height="80" rx="8" fill="var(--surface)" stroke="currentColor" stroke-opacity=".5"/>
  <text x="36" y="42" font-size="13" font-weight="700">使用者態</text>
  <text x="36" y="60" font-size="11" opacity=".7">權限受限</text>
  <rect x="150" y="40" width="150" height="44" rx="6" fill="var(--surface)" stroke="currentColor"/>
  <text x="225" y="67" font-size="12" text-anchor="middle" class="mono">println("轉帳成功")</text>
  <rect x="340" y="40" width="120" height="44" rx="6" fill="var(--surface)" stroke="currentColor"/>
  <text x="400" y="67" font-size="12.5" text-anchor="middle">JVM</text>
  <rect x="500" y="40" width="150" height="44" rx="6" fill="var(--surface)" stroke="currentColor"/>
  <text x="575" y="67" font-size="12" text-anchor="middle">glibc 的 write()</text>
  <line x1="300" y1="62" x2="336" y2="62" stroke="currentColor" stroke-opacity=".6" stroke-width="1.5" marker-end="url(#os-2-arrow)"/>
  <line x1="460" y1="62" x2="496" y2="62" stroke="currentColor" stroke-opacity=".6" stroke-width="1.5" marker-end="url(#os-2-arrow)"/>
  <line x1="40" y1="122" x2="720" y2="122" stroke="currentColor" stroke-opacity=".35" stroke-dasharray="5 4"/>
  <text x="380" y="117" font-size="11.5" text-anchor="middle" opacity=".7">使用者態與核心態的界線</text>
  <rect x="20" y="140" width="720" height="90" rx="8" fill="var(--gold-soft)" stroke="var(--gold)"/>
  <text x="36" y="162" font-size="13" font-weight="700" fill="var(--gold-deep)">核心態</text>
  <text x="36" y="180" font-size="11" opacity=".7">可以碰硬體</text>
  <rect x="500" y="165" width="150" height="44" rx="6" fill="var(--surface)" stroke="var(--gold)"/>
  <text x="575" y="185" font-size="12" text-anchor="middle">核心：寫到檔案</text>
  <text x="575" y="201" font-size="11" text-anchor="middle" opacity=".75">描述子 1（標準輸出）</text>
  <line x1="590" y1="86" x2="590" y2="161" stroke="var(--gold-deep)" stroke-width="2" marker-end="url(#os-2-gold)"/>
  <text x="600" y="132" font-size="11.5" fill="var(--gold-deep)">trap 進入核心</text>
  <line x1="545" y1="163" x2="545" y2="90" stroke="currentColor" stroke-opacity=".6" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#os-2-arrow)"/>
  <text x="535" y="152" font-size="11.5" text-anchor="end" opacity=".75">return-from-trap 回來</text>
</svg>
