<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 264" aria-label="交易事件的時間軸：交易開始後發布事件，@EventListener 當下就執行；方法結束後交易提交，AFTER_COMMIT 監聽器才執行；如果交易還原，改由 AFTER_ROLLBACK 監聽器執行，AFTER_COMMIT 不會執行" width="784" height="264">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="264" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="st-04-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <line x1="40" y1="110" x2="720" y2="110" stroke="currentColor" stroke-width="1.6" marker-end="url(#st-04-arrow)"/>
  <circle cx="80" cy="110" r="6" fill="var(--gold)"/>
  <text x="80" y="138" font-size="12.5" text-anchor="middle" class="mono">交易開始</text>
  <circle cx="250" cy="110" r="6" fill="var(--gold)"/>
  <text x="250" y="138" font-size="12.5" text-anchor="middle" class="mono">publishEvent</text>
  <circle cx="450" cy="110" r="6" fill="var(--gold)"/>
  <text x="450" y="138" font-size="12.5" text-anchor="middle" class="mono">方法結束</text>
  <circle cx="605" cy="110" r="6" fill="var(--gold)"/>
  <text x="605" y="138" font-size="12.5" text-anchor="middle" class="mono">提交或還原</text>
  <rect x="185" y="30" width="130" height="44" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="250" y="57" font-size="13" text-anchor="middle">@EventListener</text>
  <text x="250" y="88" font-size="11.5" text-anchor="middle" opacity=".8">當下就執行</text>
  <rect x="540" y="150" width="130" height="40" rx="8" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
  <text x="605" y="175" font-size="13" text-anchor="middle">AFTER_COMMIT</text>
  <rect x="540" y="196" width="130" height="40" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="605" y="221" font-size="13" text-anchor="middle">AFTER_ROLLBACK</text>
  <text x="680" y="175" font-size="11.5" opacity=".8">提交才跑</text>
  <text x="680" y="221" font-size="11.5" opacity=".8">還原才跑</text>
</svg>
