<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 254" aria-label="@SpringBootApplication 等於三個註解：@SpringBootConfiguration 讓這個類別可以定義 Bean，@EnableAutoConfiguration 打開自動組態，@ComponentScan 掃描啟動類別所在套件與子套件" width="784" height="254">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="254" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="sb-01-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <rect x="250" y="20" width="260" height="50" rx="8" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
  <text x="380" y="50" font-size="15" text-anchor="middle">@SpringBootApplication</text>
  <rect x="20" y="130" width="220" height="64" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="130" y="159" font-size="13.5" text-anchor="middle">@SpringBootConfiguration</text>
  <text x="130" y="177" font-size="11.5" text-anchor="middle" opacity=".75">可以在這裡定義 @Bean</text>
  <line x1="380" y1="70" x2="130" y2="128" stroke="currentColor" stroke-width="1.6" marker-end="url(#sb-01-arrow)"/>
  <rect x="270" y="130" width="220" height="64" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="380" y="159" font-size="13.5" text-anchor="middle">@EnableAutoConfiguration</text>
  <text x="380" y="177" font-size="11.5" text-anchor="middle" opacity=".75">打開自動組態</text>
  <line x1="380" y1="70" x2="380" y2="128" stroke="currentColor" stroke-width="1.6" marker-end="url(#sb-01-arrow)"/>
  <rect x="520" y="130" width="220" height="64" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="630" y="159" font-size="13.5" text-anchor="middle">@ComponentScan</text>
  <text x="630" y="177" font-size="11.5" text-anchor="middle" opacity=".75">掃描啟動類別所在的套件</text>
  <line x1="380" y1="70" x2="630" y2="128" stroke="currentColor" stroke-width="1.6" marker-end="url(#sb-01-arrow)"/>
</svg>
