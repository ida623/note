<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 388" aria-label="資源伺服器驗 JWT 的順序：拆段解碼、驗簽章、檢查 exp 與 nbf、檢查 iss、檢查 aud，任何一步失敗都回 401 invalid_token；全部通過才把 scope 轉成 SCOPE_ 權限，交給授權規則，權限不夠才回 403" width="784" height="388">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="388" fill="#FFFFFF" stroke="none"/>
<defs><marker id="sj-m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><rect x="30" y="30" width="300" height="38" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="180" y="54" font-size="12.5" text-anchor="middle">拆三段、base64url 解碼</text><line x1="180" y1="70" x2="180" y2="80" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#sj-m2)"/><line x1="334" y1="49" x2="384" y2="49" stroke="var(--gold-deep)" stroke-opacity="1" stroke-width="1.5" marker-end="url(#sj-m2)"/><text x="392" y="54" font-size="12" fill="var(--gold-deep)">401 invalid_token：格式不對（白話）</text><rect x="30" y="82" width="300" height="38" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="180" y="106" font-size="12.5" text-anchor="middle">驗簽章（只接受 RS256）</text><line x1="180" y1="122" x2="180" y2="132" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#sj-m2)"/><line x1="334" y1="101" x2="384" y2="101" stroke="var(--gold-deep)" stroke-opacity="1" stroke-width="1.5" marker-end="url(#sj-m2)"/><text x="392" y="106" font-size="12" fill="var(--gold-deep)">401 invalid_token：Invalid signature／Unsupported algorithm</text><rect x="30" y="134" width="300" height="38" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="180" y="158" font-size="12.5" text-anchor="middle">exp、nbf（容許 60 秒時鐘誤差）</text><line x1="180" y1="174" x2="180" y2="184" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#sj-m2)"/><line x1="334" y1="153" x2="384" y2="153" stroke="var(--gold-deep)" stroke-opacity="1" stroke-width="1.5" marker-end="url(#sj-m2)"/><text x="392" y="158" font-size="12" fill="var(--gold-deep)">401 invalid_token：Jwt expired at …</text><rect x="30" y="186" width="300" height="38" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="180" y="210" font-size="12.5" text-anchor="middle">iss 是不是我信任的</text><line x1="180" y1="226" x2="180" y2="236" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#sj-m2)"/><line x1="334" y1="205" x2="384" y2="205" stroke="var(--gold-deep)" stroke-opacity="1" stroke-width="1.5" marker-end="url(#sj-m2)"/><text x="392" y="210" font-size="12" fill="var(--gold-deep)">401 invalid_token：The iss claim is not valid</text><rect x="30" y="238" width="300" height="38" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="180" y="262" font-size="12.5" text-anchor="middle">aud 有沒有我（要自己加）</text><line x1="180" y1="278" x2="180" y2="288" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#sj-m2)"/><line x1="334" y1="257" x2="384" y2="257" stroke="var(--gold-deep)" stroke-opacity="1" stroke-width="1.5" marker-end="url(#sj-m2)"/><text x="392" y="262" font-size="12" fill="var(--gold-deep)">401 invalid_token：The aud claim is not valid</text><rect x="30" y="290" width="300" height="38" rx="8" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="180" y="314" font-size="12.5" text-anchor="middle">scope → SCOPE_ 權限</text><text x="392" y="314" font-size="12.5" fill="var(--slate-deep)">通過 → 進授權規則；權限不夠才是 403</text><text x="30" y="350" font-size="12" opacity=".6">古銅字是這課實跑時 WWW-Authenticate 標頭裡 error_description 的節錄；第一關是白話說明，不是實際輸出</text>
</svg>
