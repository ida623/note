<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 500" aria-label="授權碼加 PKCE 的流程：用戶端先產生 code_verifier 與 code_challenge，把瀏覽器導去授權端點並帶上 challenge；使用者在授權伺服器登入後，帶著授權碼導回用戶端；用戶端用授權碼加 verifier 向 token 端點換到 access token 與 ID token，再帶 access token 呼叫資源伺服器" width="784" height="500">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="500" fill="#FFFFFF" stroke="none"/>
<defs><marker id="sj-m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><rect x="20" y="20" width="140" height="34" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="90" y="42" font-size="12.5" text-anchor="middle">使用者的瀏覽器</text><line x1="90" y1="56" x2="90" y2="470" stroke="currentColor" stroke-opacity=".25" stroke-dasharray="3 3"/><rect x="230" y="20" width="140" height="34" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="300" y="42" font-size="12.5" text-anchor="middle">用戶端</text><line x1="300" y1="56" x2="300" y2="470" stroke="currentColor" stroke-opacity=".25" stroke-dasharray="3 3"/><rect x="440" y="20" width="140" height="34" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="510" y="42" font-size="12.5" text-anchor="middle">授權伺服器</text><line x1="510" y1="56" x2="510" y2="470" stroke="currentColor" stroke-opacity=".25" stroke-dasharray="3 3"/><rect x="620" y="20" width="140" height="34" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="690" y="42" font-size="12.5" text-anchor="middle">資源伺服器</text><line x1="690" y1="56" x2="690" y2="470" stroke="currentColor" stroke-opacity=".25" stroke-dasharray="3 3"/><text x="300" y="74" font-size="12" text-anchor="middle" fill="var(--gold-deep)">① 產生 code_verifier，算出 code_challenge</text><line x1="300" y1="108" x2="96" y2="108" stroke="var(--gold-deep)" stroke-opacity="1" stroke-width="1.5" marker-end="url(#sj-m3)"/><text x="195" y="100" font-size="11.5" text-anchor="middle" fill="var(--gold-deep)">② 302 導向授權端點（帶 state、nonce、code_challenge）</text><line x1="90" y1="132" x2="504" y2="132" stroke="var(--gold-deep)" stroke-opacity="1" stroke-width="1.5" marker-end="url(#sj-m3)"/><text x="300" y="124" font-size="11.5" text-anchor="middle" fill="var(--gold-deep)">瀏覽器打 /oauth2/authorize?response_type=code&amp;…</text><line x1="510" y1="158" x2="96" y2="158" stroke="currentColor" stroke-opacity=".6" stroke-width="1.5" marker-end="url(#sj-m3)"/><text x="300" y="150" font-size="11.5" text-anchor="middle">③ 還沒登入 → 302 /login，使用者輸入帳密</text><line x1="510" y1="190" x2="96" y2="190" stroke="currentColor" stroke-opacity=".6" stroke-width="1.5" marker-end="url(#sj-m3)"/><text x="300" y="182" font-size="11.5" text-anchor="middle">④ 302 導回 redirect_uri?code=…&amp;state=…</text><line x1="90" y1="214" x2="294" y2="214" stroke="currentColor" stroke-opacity=".6" stroke-width="1.5" marker-end="url(#sj-m3)"/><text x="195" y="206" font-size="11.5" text-anchor="middle">瀏覽器帶著授權碼打用戶端（授權碼只用一次、很快過期）</text><line x1="300" y1="244" x2="504" y2="244" stroke="var(--gold-deep)" stroke-opacity="1" stroke-width="1.5" marker-end="url(#sj-m3)"/><text x="405" y="236" font-size="11.5" text-anchor="middle" fill="var(--gold-deep)">⑤ POST /oauth2/token：code＋code_verifier（機密用戶端再加密碼）</text><line x1="510" y1="278" x2="306" y2="278" stroke="currentColor" stroke-opacity=".6" stroke-width="1.5" marker-end="url(#sj-m3)"/><text x="405" y="270" font-size="11.5" text-anchor="middle">⑥ access_token、id_token（機密用戶端另有 refresh_token）</text><line x1="300" y1="320" x2="684" y2="320" stroke="currentColor" stroke-opacity=".6" stroke-width="1.5" marker-end="url(#sj-m3)"/><text x="495" y="312" font-size="11.5" text-anchor="middle">⑦ Authorization: Bearer access_token</text><line x1="690" y1="360" x2="306" y2="360" stroke="currentColor" stroke-opacity=".6" stroke-width="1.5" marker-end="url(#sj-m3)"/><text x="495" y="352" font-size="11.5" text-anchor="middle">⑧ 驗簽、驗聲明後回應資料</text><text x="20" y="410" font-size="12" fill="var(--gold-deep)">② 與 ⑤ 是 PKCE 的兩半：授權請求只送 challenge（雜湊），換權杖時才送原本的 verifier</text><text x="20" y="432" font-size="12">③ 的帳號密碼只交給授權伺服器，用戶端從頭到尾沒碰過</text></svg>
