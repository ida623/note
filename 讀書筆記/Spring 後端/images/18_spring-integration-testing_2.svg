<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 354" aria-label="三種測試註解各載入哪些元件。@WebMvcTest：控制器是真的，服務與 repository 是 @MockitoBean 替身，FeeClient 與資料庫不載入。@DataJpaTest：只有 repository 是真的，連到 MySQL 容器，控制器、服務、FeeClient 都不載入。@SpringBootTest 加 Testcontainers：控制器、服務、repository 都是真的，FeeClient 換成替身，連到 MySQL 容器" width="784" height="354">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="354" fill="#FFFFFF" stroke="none"/>
<text x="150" y="30" font-size="12.5" fill="currentColor" opacity=".7">元件</text><text x="330" y="30" font-size="13" text-anchor="middle" class="mono" fill="var(--gold-deep)">@WebMvcTest</text><text x="500" y="30" font-size="13" text-anchor="middle" class="mono" fill="var(--gold-deep)">@DataJpaTest</text><text x="670" y="30" font-size="13" text-anchor="middle" class="mono" fill="var(--gold-deep)">@SpringBootTest</text>
<text x="40" y="70" font-size="13" fill="currentColor">AccountController</text><text x="40" y="120" font-size="13" fill="currentColor">TransferService</text><text x="40" y="170" font-size="13" fill="currentColor">FeeClient（外部服務）</text><text x="40" y="220" font-size="13" fill="currentColor">AccountRepository</text><text x="40" y="270" font-size="13" fill="currentColor">資料庫</text>
<rect x="270" y="50" width="120" height="30" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="330" y="70" font-size="12.5" text-anchor="middle" fill="var(--gold-deep)">真的</text>
<rect x="270" y="100" width="120" height="30" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="330" y="120" font-size="12.5" text-anchor="middle" fill="var(--slate-deep)">替身</text>
<rect x="270" y="150" width="120" height="30" rx="6" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-dasharray="4 3"/><text x="330" y="170" font-size="12.5" text-anchor="middle" fill="currentColor" opacity=".55">不載入</text>
<rect x="270" y="200" width="120" height="30" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="330" y="220" font-size="12.5" text-anchor="middle" fill="var(--slate-deep)">替身</text>
<rect x="270" y="250" width="120" height="30" rx="6" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-dasharray="4 3"/><text x="330" y="270" font-size="12.5" text-anchor="middle" fill="currentColor" opacity=".55">沒有</text>
<rect x="440" y="50" width="120" height="30" rx="6" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-dasharray="4 3"/><text x="500" y="70" font-size="12.5" text-anchor="middle" fill="currentColor" opacity=".55">不載入</text>
<rect x="440" y="100" width="120" height="30" rx="6" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-dasharray="4 3"/><text x="500" y="120" font-size="12.5" text-anchor="middle" fill="currentColor" opacity=".55">不載入</text>
<rect x="440" y="150" width="120" height="30" rx="6" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-dasharray="4 3"/><text x="500" y="170" font-size="12.5" text-anchor="middle" fill="currentColor" opacity=".55">不載入</text>
<rect x="440" y="200" width="120" height="30" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="500" y="220" font-size="12.5" text-anchor="middle" fill="var(--gold-deep)">真的</text>
<rect x="440" y="250" width="120" height="30" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="500" y="270" font-size="12.5" text-anchor="middle" fill="var(--gold-deep)">MySQL 容器</text>
<rect x="610" y="50" width="120" height="30" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="670" y="70" font-size="12.5" text-anchor="middle" fill="var(--gold-deep)">真的</text>
<rect x="610" y="100" width="120" height="30" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="670" y="120" font-size="12.5" text-anchor="middle" fill="var(--gold-deep)">真的</text>
<rect x="610" y="150" width="120" height="30" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="670" y="170" font-size="12.5" text-anchor="middle" fill="var(--slate-deep)">替身</text>
<rect x="610" y="200" width="120" height="30" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="670" y="220" font-size="12.5" text-anchor="middle" fill="var(--gold-deep)">真的</text>
<rect x="610" y="250" width="120" height="30" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="670" y="270" font-size="12.5" text-anchor="middle" fill="var(--gold-deep)">MySQL 容器</text>
<text x="40" y="314" font-size="12" fill="currentColor" opacity=".6">古銅＝真的元件；灰藍＝用 @MockitoBean 換成的替身；虛線＝這個測試的 Spring 容器裡根本沒有它</text>
</svg>
