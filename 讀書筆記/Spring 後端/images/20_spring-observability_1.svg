<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 290" aria-label="三種訊號：指標回答「有沒有事」，例如每秒請求數 10.9、錯誤率 1.2%、p95 延遲 0.134 秒；追蹤回答「事在哪一段」，transfer 花 335 毫秒，其中呼叫 account 331 毫秒、account 自己處理 314 毫秒；日誌回答「那一段發生了什麼」，例如查餘額失敗 status=503、核心帳務逾時。三者靠同一個 traceId 串起來" width="784" height="290">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="290" fill="#FFFFFF" stroke="none"/>
<rect x="30" y="20" width="200" height="44" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="130.0" y="47.0" font-size="15" text-anchor="middle">指標 Metrics</text><text x="130" y="88" font-size="13" text-anchor="middle" fill="var(--gold-deep)">有沒有事？</text><text x="44" y="116" font-size="12" text-anchor="start" opacity=".85" class="mono">每秒請求數 10.9</text><text x="44" y="138" font-size="12" text-anchor="start" opacity=".85" class="mono">錯誤率 1.2%</text><text x="44" y="160" font-size="12" text-anchor="start" opacity=".85" class="mono">p95 延遲 0.134 秒</text><rect x="280" y="20" width="200" height="44" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="380.0" y="47.0" font-size="15" text-anchor="middle">追蹤 Traces</text><text x="380" y="88" font-size="13" text-anchor="middle" fill="var(--gold-deep)">事在哪一段？</text><text x="294" y="116" font-size="12" text-anchor="start" opacity=".85" class="mono">transfer 335 毫秒</text><text x="294" y="138" font-size="12" text-anchor="start" opacity=".85" class="mono">└ 呼叫 account 331 毫秒</text><text x="294" y="160" font-size="12" text-anchor="start" opacity=".85" class="mono">　└ account 處理 314 毫秒</text><rect x="530" y="20" width="200" height="44" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="630.0" y="47.0" font-size="15" text-anchor="middle">日誌 Logs</text><text x="630" y="88" font-size="13" text-anchor="middle" fill="var(--gold-deep)">那一段發生了什麼？</text><text x="544" y="116" font-size="12" text-anchor="start" opacity=".85" class="mono">WARN 查餘額失敗 status=503</text><text x="544" y="138" font-size="12" text-anchor="start" opacity=".85" class="mono">ERROR 核心帳務逾時</text><text x="544" y="160" font-size="12" text-anchor="start" opacity=".85" class="mono">account=X999</text><rect x="30" y="196" width="700" height="34" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="380" y="218" font-size="13" text-anchor="middle" fill="var(--slate-deep)" class="mono">同一個 traceId：67e70a401431e867dab5b5ae6729fde2</text><line x1="130" y1="182" x2="130" y2="196" stroke="var(--slate)" stroke-width="1.5"/><line x1="380" y1="182" x2="380" y2="196" stroke="var(--slate)" stroke-width="1.5"/><line x1="630" y1="182" x2="630" y2="196" stroke="var(--slate)" stroke-width="1.5"/><text x="30" y="254" font-size="12" text-anchor="start" opacity=".6">數字取自本課實跑：指標從 Prometheus 查出，追蹤從 Jaeger 查出，日誌從兩個服務的主控台輸出</text>
</svg>
