<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 368" aria-label="本課實跑的架構：transfer 服務在 8080 埠，用 HTTP 呼叫 8081 埠的 account 服務，請求帶著 traceparent 標頭。Prometheus 每 5 秒到兩個服務的 /actuator/prometheus 拉指標；Grafana 用 PromQL 向 Prometheus 查詢畫圖。兩個服務把每個 span 用 OTLP 推給 Jaeger。日誌以每行一筆 JSON 印在主控台" width="784" height="368">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="368" fill="#FFFFFF" stroke="none"/>
<defs><marker id="ob-m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><rect x="40" y="150" width="170" height="60" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="125.0" y="177.0" font-size="13.5" text-anchor="middle">transfer</text><text x="125.0" y="195.0" font-size="11.5" text-anchor="middle" opacity=".7">:8080</text><rect x="330" y="150" width="170" height="60" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="415.0" y="177.0" font-size="13.5" text-anchor="middle">account</text><text x="415.0" y="195.0" font-size="11.5" text-anchor="middle" opacity=".7">:8081</text><line x1="212" y1="172" x2="328" y2="172" stroke="currentColor" stroke-opacity=".65" stroke-width="1.5" marker-end="url(#ob-m2)"/><text x="270" y="162" font-size="11.5" text-anchor="middle" class="mono">HTTP</text><text x="270" y="196" font-size="11.5" text-anchor="middle" fill="var(--gold-deep)">帶 traceparent</text><rect x="165" y="20" width="200" height="52" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="265.0" y="43.0" font-size="13.5" text-anchor="middle">Prometheus</text><text x="265.0" y="61.0" font-size="11.5" text-anchor="middle" opacity=".7">:9090，每 5 秒拉一次</text><line x1="215" y1="74" x2="140" y2="148" stroke="currentColor" stroke-opacity=".65" stroke-width="1.5" marker-end="url(#ob-m2)"/><line x1="315" y1="74" x2="400" y2="148" stroke="currentColor" stroke-opacity=".65" stroke-width="1.5" marker-end="url(#ob-m2)"/><text x="20" y="98" font-size="11" text-anchor="start" opacity=".8" class="mono">GET /actuator/prometheus</text><text x="410" y="110" font-size="11" text-anchor="start" opacity=".8" class="mono">GET /actuator/prometheus</text><rect x="580" y="20" width="150" height="52" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="655.0" y="43.0" font-size="13.5" text-anchor="middle">Grafana</text><text x="655.0" y="61.0" font-size="11.5" text-anchor="middle" opacity=".7">畫圖、看儀表板</text><line x1="578" y1="46" x2="367" y2="46" stroke="currentColor" stroke-opacity=".65" stroke-width="1.5" marker-end="url(#ob-m2)"/><text x="472" y="38" font-size="11.5" text-anchor="middle">PromQL 查詢</text><rect x="560" y="240" width="170" height="52" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="645.0" y="263.0" font-size="13.5" text-anchor="middle">Jaeger</text><text x="645.0" y="281.0" font-size="11.5" text-anchor="middle" opacity=".7">:4318 收 OTLP</text><line x1="125" y1="212" x2="558" y2="262" stroke="currentColor" stroke-opacity=".65" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ob-m2)"/><line x1="415" y1="212" x2="558" y2="256" stroke="currentColor" stroke-opacity=".65" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ob-m2)"/><text x="470" y="240" font-size="11.5" text-anchor="middle" fill="var(--slate-deep)">每個 span 用 OTLP 推過去</text><rect x="40" y="260" width="300" height="40" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="190.0" y="285.0" font-size="12.5" text-anchor="middle">主控台：每行一筆 JSON 日誌（ECS）</text><line x1="125" y1="212" x2="125" y2="258" stroke="currentColor" stroke-opacity=".4" stroke-dasharray="3 3"/><text x="40" y="330" font-size="12" text-anchor="start" opacity=".6">指標是 Prometheus 主動來拉（實線往下）；追蹤是服務自己推出去（虛線）；Grafana 不在這次的示範環境裡，畫出來是說明它的位置</text>
</svg>
