<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 324" aria-label="同一個請求可以把版本放在三個地方：路徑 GET /v2/accounts/A-001、自訂標頭 API-Version: 2、Accept 的媒體類型參數 application/json;v=2；Spring 的 ApiVersionStrategy 把它解析成 2.0.0，再對到 @GetMapping(version = &quot;2&quot;) 那個方法" width="784" height="324">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="324" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="ad-ver-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <rect x="20" y="20" width="300" height="70" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="36" y="46" font-size="13" font-weight="bold">放在路徑</text>
  <text x="36" y="72" font-size="13" class="mono">GET /v2/accounts/A-001</text>
  <rect x="20" y="115" width="300" height="70" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="36" y="141" font-size="13" font-weight="bold">放在自訂標頭</text>
  <text x="36" y="167" font-size="13" class="mono">API-Version: 2</text>
  <rect x="20" y="210" width="300" height="70" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="36" y="236" font-size="13" font-weight="bold">放在媒體類型參數</text>
  <text x="36" y="262" font-size="13" class="mono">Accept: application/json;v=2</text>
  <rect x="390" y="110" width="160" height="80" rx="8" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
  <text x="470" y="142" font-size="13" text-anchor="middle">ApiVersionStrategy</text>
  <text x="470" y="166" font-size="12" text-anchor="middle" opacity=".8">解析成 2.0.0</text>
  <line x1="320" y1="55" x2="388" y2="132" stroke="currentColor" stroke-width="1.6" marker-end="url(#ad-ver-arrow)"/>
  <line x1="320" y1="150" x2="388" y2="150" stroke="currentColor" stroke-width="1.6" marker-end="url(#ad-ver-arrow)"/>
  <line x1="320" y1="245" x2="388" y2="168" stroke="currentColor" stroke-width="1.6" marker-end="url(#ad-ver-arrow)"/>
  <rect x="590" y="110" width="150" height="80" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="665" y="142" font-size="12" text-anchor="middle" class="mono">@GetMapping(</text>
  <text x="665" y="164" font-size="12" text-anchor="middle" class="mono">version = "2")</text>
  <line x1="550" y1="150" x2="588" y2="150" stroke="currentColor" stroke-width="1.6" marker-end="url(#ad-ver-arrow)"/>
</svg>
