<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 310" aria-label="分割平行的示意圖：manager Step 把 500 個帳號切成四段，交給四個 worker Step 同時處理，每段 125 個帳號；四個都完成後 manager 才結束。每個 worker 是同一個 Step 的一份，各自讀寫與記斷點" width="784" height="310">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="310" fill="#FFFFFF" stroke="none"/>
<defs><marker id="sb2-m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><rect x="30" y="90" width="170" height="60" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="115.0" y="117.0" font-size="13.5" text-anchor="middle">manager Step</text><text x="115.0" y="135.0" font-size="11.5" text-anchor="middle" opacity=".7">切成幾個分割</text><rect x="300" y="20" width="200" height="44" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="400.0" y="39.0" font-size="13.5" text-anchor="middle">worker Step 1</text><text x="400.0" y="57.0" font-size="11.5" text-anchor="middle" opacity=".7">帳號 A00001–A00125</text><line x1="202" y1="120" x2="298" y2="42" stroke="currentColor" stroke-opacity=".65" stroke-width="1.5" marker-end="url(#sb2-m4)"/><line x1="502" y1="42" x2="598" y2="120" stroke="currentColor" stroke-opacity=".4" stroke-width="1.5" marker-end="url(#sb2-m4)"/><rect x="300" y="80" width="200" height="44" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="400.0" y="99.0" font-size="13.5" text-anchor="middle">worker Step 2</text><text x="400.0" y="117.0" font-size="11.5" text-anchor="middle" opacity=".7">帳號 A00126–A00250</text><line x1="202" y1="120" x2="298" y2="102" stroke="currentColor" stroke-opacity=".65" stroke-width="1.5" marker-end="url(#sb2-m4)"/><line x1="502" y1="102" x2="598" y2="120" stroke="currentColor" stroke-opacity=".4" stroke-width="1.5" marker-end="url(#sb2-m4)"/><rect x="300" y="140" width="200" height="44" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="400.0" y="159.0" font-size="13.5" text-anchor="middle">worker Step 3</text><text x="400.0" y="177.0" font-size="11.5" text-anchor="middle" opacity=".7">帳號 A00251–A00375</text><line x1="202" y1="120" x2="298" y2="162" stroke="currentColor" stroke-opacity=".65" stroke-width="1.5" marker-end="url(#sb2-m4)"/><line x1="502" y1="162" x2="598" y2="120" stroke="currentColor" stroke-opacity=".4" stroke-width="1.5" marker-end="url(#sb2-m4)"/><rect x="300" y="200" width="200" height="44" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="400.0" y="219.0" font-size="13.5" text-anchor="middle">worker Step 4</text><text x="400.0" y="237.0" font-size="11.5" text-anchor="middle" opacity=".7">帳號 A00376–A00500</text><line x1="202" y1="120" x2="298" y2="222" stroke="currentColor" stroke-opacity=".65" stroke-width="1.5" marker-end="url(#sb2-m4)"/><line x1="502" y1="222" x2="598" y2="120" stroke="currentColor" stroke-opacity=".4" stroke-width="1.5" marker-end="url(#sb2-m4)"/><rect x="600" y="90" width="140" height="60" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="670.0" y="117.0" font-size="13.5" text-anchor="middle">全部完成</text><text x="670.0" y="135.0" font-size="11.5" text-anchor="middle" opacity=".7">manager 才結束</text><text x="30" y="272" font-size="12" text-anchor="start" opacity=".6">每個 worker 是同一個 Step 的一份，各自讀寫自己那段資料、各自記斷點；可以在同一台用多條執行緒，也可以在不同機器上跑</text>
</svg>
