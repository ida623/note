<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 804 396" aria-label="虛擬機與容器的疊層對照：虛擬機每一份自帶作業系統，容器則共用底下那一套" width="804" height="396">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="804" height="396" fill="#FFFFFF" stroke="none"/>
        <text x="196" y="24" font-size="16" text-anchor="middle" font-weight="700">虛擬機</text>
        <text x="584" y="24" font-size="16" text-anchor="middle" font-weight="700">容器</text>
        <line x1="390" y1="10" x2="390" y2="330" stroke="currentColor" stroke-opacity=".2" stroke-dasharray="4 5"/>
        <g fill="none" stroke="currentColor">
          <rect x="18" y="42" width="112" height="152" rx="4"/>
          <rect x="140" y="42" width="112" height="152" rx="4"/>
          <rect x="262" y="42" width="112" height="152" rx="4"/>
        </g>
        <g font-size="12.5" text-anchor="middle">
          <text x="74" y="66">程式</text><text x="196" y="66">程式</text><text x="318" y="66">程式</text>
        </g>
        <g font-size="12" text-anchor="middle" opacity=".7">
          <text x="74" y="92">函式庫</text><text x="196" y="92">函式庫</text><text x="318" y="92">函式庫</text>
        </g>
        <g fill="var(--slate-soft)" stroke="var(--slate)">
          <rect x="28" y="106" width="92" height="78" rx="3"/>
          <rect x="150" y="106" width="92" height="78" rx="3"/>
          <rect x="272" y="106" width="92" height="78" rx="3"/>
        </g>
        <g font-size="12" text-anchor="middle" fill="var(--slate)">
          <text x="74" y="140">作業</text><text x="74" y="158">系統</text>
          <text x="196" y="140">作業</text><text x="196" y="158">系統</text>
          <text x="318" y="140">作業</text><text x="318" y="158">系統</text>
        </g>
        <rect x="18" y="202" width="356" height="38" rx="4" fill="none" stroke="var(--gold)" stroke-width="2"/>
        <text x="196" y="226" font-size="13.5" text-anchor="middle" fill="var(--gold)">Hypervisor</text>

        <text x="584" y="80" font-size="13" text-anchor="middle" fill="var(--gold)">這一整塊省下來了</text>
        <line x1="470" y1="96" x2="470" y2="126" stroke="var(--gold)" stroke-dasharray="4 4"/>
        <line x1="584" y1="96" x2="584" y2="126" stroke="var(--gold)" stroke-dasharray="4 4"/>
        <line x1="698" y1="96" x2="698" y2="126" stroke="var(--gold)" stroke-dasharray="4 4"/>
        <g fill="none" stroke="currentColor">
          <rect x="414" y="130" width="112" height="64" rx="4"/>
          <rect x="528" y="130" width="112" height="64" rx="4"/>
          <rect x="642" y="130" width="112" height="64" rx="4"/>
        </g>
        <g font-size="12.5" text-anchor="middle">
          <text x="470" y="152">程式</text><text x="584" y="152">程式</text><text x="698" y="152">程式</text>
        </g>
        <g font-size="12" text-anchor="middle" opacity=".7">
          <text x="470" y="176">函式庫</text><text x="584" y="176">函式庫</text><text x="698" y="176">函式庫</text>
        </g>
        <rect x="414" y="202" width="340" height="38" rx="4" fill="none" stroke="var(--gold)" stroke-width="2"/>
        <text x="584" y="226" font-size="13.5" text-anchor="middle" fill="var(--gold)">容器引擎（Docker）</text>

        <rect x="18" y="250" width="356" height="36" rx="4" fill="none" stroke="currentColor" stroke-opacity=".6"/>
        <text x="196" y="273" font-size="13" text-anchor="middle" opacity=".8">主機作業系統</text>
        <rect x="414" y="250" width="340" height="36" rx="4" fill="var(--slate-soft)" stroke="var(--slate)" stroke-width="2"/>
        <text x="584" y="273" font-size="13" text-anchor="middle" fill="var(--slate)">主機作業系統（大家共用這一套）</text>
        <rect x="18" y="294" width="356" height="34" rx="4" fill="none" stroke="currentColor" stroke-opacity=".6"/>
        <text x="196" y="316" font-size="13" text-anchor="middle" opacity=".8">硬體</text>
        <rect x="414" y="294" width="340" height="34" rx="4" fill="none" stroke="currentColor" stroke-opacity=".6"/>
        <text x="584" y="316" font-size="13" text-anchor="middle" opacity=".8">硬體</text>
        <text x="390" y="358" font-size="14" text-anchor="middle" fill="var(--gold)">差別就只有這一件事：作業系統是各背一套，還是共用一套</text>
      </svg>
