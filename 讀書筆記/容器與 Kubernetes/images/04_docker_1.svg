<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 804 324" aria-label="Dockerfile 經過 build 產生映像檔，映像檔經過 run 變成執行中的容器，映像檔可推上倉庫供其他機器取用" width="804" height="324">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="804" height="324" fill="#FFFFFF" stroke="none"/>
        <g fill="none" stroke="currentColor">
          <rect x="18" y="56" width="196" height="96" rx="5"/>
          <rect x="292" y="56" width="196" height="96" rx="5"/>
        </g>
        <rect x="566" y="56" width="196" height="96" rx="5" fill="none" stroke="var(--gold)" stroke-width="2"/>
        <text x="116" y="90" font-size="16" text-anchor="middle">Dockerfile</text>
        <text x="116" y="116" font-size="13" text-anchor="middle" opacity=".7">一張食譜</text>
        <text x="116" y="138" font-size="12" text-anchor="middle" opacity=".55">純文字，進版控</text>
        <text x="390" y="90" font-size="16" text-anchor="middle">映像檔</text>
        <text x="390" y="116" font-size="13" text-anchor="middle" opacity=".7">做好的成品</text>
        <text x="390" y="138" font-size="12" text-anchor="middle" opacity=".55">不會再變</text>
        <text x="664" y="90" font-size="16" text-anchor="middle" fill="var(--gold)">容器</text>
        <text x="664" y="116" font-size="13" text-anchor="middle" fill="var(--gold)">正在跑的那一份</text>
        <text x="664" y="138" font-size="12" text-anchor="middle" fill="var(--gold)">可以同時跑很多份</text>
        <line x1="222" y1="104" x2="284" y2="104" stroke="currentColor" stroke-width="2" marker-end="url(#e1)"/>
        <text x="253" y="90" font-size="11.5" text-anchor="middle" class="mono">build</text>
        <line x1="496" y1="104" x2="558" y2="104" stroke="var(--gold)" stroke-width="2" marker-end="url(#e2)"/>
        <text x="527" y="90" font-size="11.5" text-anchor="middle" class="mono" fill="var(--gold)">run</text>
        <line x1="360" y1="160" x2="360" y2="212" stroke="currentColor" stroke-opacity=".55" marker-end="url(#e3)"/>
        <line x1="420" y1="212" x2="420" y2="160" stroke="currentColor" stroke-opacity=".55" marker-end="url(#e3)"/>
        <text x="270" y="186" font-size="12" text-anchor="end" opacity=".7">推上去</text>
        <text x="510" y="186" font-size="12" opacity=".7">別台拉下來</text>
        <rect x="252" y="216" width="276" height="58" rx="5" fill="none" stroke="currentColor" stroke-dasharray="6 4"/>
        <text x="390" y="242" font-size="15" text-anchor="middle">映像檔倉庫（Registry）</text>
        <text x="390" y="263" font-size="12" text-anchor="middle" opacity=".65">公司內部或雲端上，大家共用的架子</text>
        <defs>
          <marker id="e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="currentColor"/></marker>
          <marker id="e2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="var(--gold)"/></marker>
          <marker id="e3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="currentColor" fill-opacity=".55"/></marker>
        </defs>
      </svg>
