<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 286" aria-label="Kubernetes 的核心迴圈：你要三份，掛掉一份後它自動補回三份" width="784" height="286">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="286" fill="#FFFFFF" stroke="none"/>
        <g font-size="13" text-anchor="middle" opacity=".75">
          <text x="126" y="34">你交代的：我要 3 份</text>
          <text x="380" y="34">有一份掛了</text>
          <text x="634" y="34">它自己補一份回來</text>
        </g>
        <g fill="none" stroke="var(--gold)" stroke-width="2">
          <rect x="52" y="60" width="46" height="46" rx="4"/>
          <rect x="104" y="60" width="46" height="46" rx="4"/>
          <rect x="156" y="60" width="46" height="46" rx="4"/>
        </g>
        <g fill="none" stroke="var(--gold)" stroke-width="2">
          <rect x="306" y="60" width="46" height="46" rx="4"/>
          <rect x="358" y="60" width="46" height="46" rx="4"/>
        </g>
        <rect x="410" y="60" width="46" height="46" rx="4" fill="none" stroke="var(--danger)" stroke-width="2" stroke-dasharray="5 4"/>
        <line x1="420" y1="70" x2="446" y2="96" stroke="var(--danger)" stroke-width="2.5"/>
        <line x1="446" y1="70" x2="420" y2="96" stroke="var(--danger)" stroke-width="2.5"/>
        <g fill="none" stroke="var(--gold)" stroke-width="2">
          <rect x="560" y="60" width="46" height="46" rx="4"/>
          <rect x="612" y="60" width="46" height="46" rx="4"/>
        </g>
        <rect x="664" y="60" width="46" height="46" rx="4" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
        <text x="687" y="90" font-size="16" text-anchor="middle" fill="var(--gold)">新</text>
        <line x1="232" y1="83" x2="292" y2="83" stroke="currentColor" stroke-opacity=".45" marker-end="url(#g1)"/>
        <line x1="486" y1="83" x2="546" y2="83" stroke="currentColor" stroke-opacity=".45" marker-end="url(#g1)"/>
        <g font-size="12.5" text-anchor="middle" opacity=".7">
          <text x="126" y="132">現況 3 份 ✓</text>
          <text x="380" y="132">現況 2 份，跟單子不符</text>
          <text x="634" y="132">現況 3 份 ✓</text>
        </g>
        <path d="M634 152 L634 186 L126 186 L126 152" fill="none" stroke="var(--gold)" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#g2)"/>
        <text x="380" y="208" font-size="14" text-anchor="middle" fill="var(--gold)">這個比對，一直在跑，沒有停過</text>
        <text x="380" y="236" font-size="13" text-anchor="middle" opacity=".7">你不用寫「掛了要重開」的程式，你只要寫「我要 3 份」</text>
        <defs>
          <marker id="g1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="currentColor" fill-opacity=".45"/></marker>
          <marker id="g2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="var(--gold)"/></marker>
        </defs>
      </svg>
