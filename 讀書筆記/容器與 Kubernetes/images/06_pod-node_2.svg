<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 804 324" aria-label="純 Docker 是人登入那台機器下指令；K8s 是大腦下指令給機器上的 kubelet，再由 kubelet 叫容器執行環境起容器" width="804" height="324">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="804" height="324" fill="#FFFFFF" stroke="none"/>
        <text x="16" y="26" font-size="12" class="mono" opacity=".6">純 Docker</text>
        <rect x="16" y="36" width="748" height="98" rx="5" fill="none" stroke="currentColor" stroke-opacity=".25"/>
        <text x="52" y="92" font-size="14" text-anchor="middle">你</text>
        <text x="52" y="110" font-size="10.5" text-anchor="middle" opacity=".6">（人）</text>
        <line x1="82" y1="88" x2="152" y2="88" stroke="currentColor" stroke-width="2" marker-end="url(#n1)"/>
        <text x="117" y="76" font-size="11" text-anchor="middle" class="mono">docker run</text>
        <rect x="160" y="58" width="200" height="58" rx="5" fill="none" stroke="currentColor"/>
        <text x="260" y="84" font-size="13.5" text-anchor="middle">容器執行環境</text>
        <text x="260" y="104" font-size="11" text-anchor="middle" opacity=".6">就在你登入的這台上</text>
        <line x1="368" y1="88" x2="428" y2="88" stroke="currentColor" stroke-width="2" marker-end="url(#n1)"/>
        <rect x="436" y="58" width="130" height="58" rx="5" fill="none" stroke="currentColor"/>
        <text x="501" y="93" font-size="13.5" text-anchor="middle">容器起來了</text>
        <text x="590" y="80" font-size="12" fill="var(--danger)">你必須知道自己</text>
        <text x="590" y="99" font-size="12" fill="var(--danger)">登入在哪一台</text>

        <text x="16" y="172" font-size="12" class="mono" fill="var(--gold)">加入 K8s 之後</text>
        <rect x="16" y="182" width="748" height="98" rx="5" fill="none" stroke="var(--gold)" stroke-opacity=".4"/>
        <rect x="30" y="204" width="112" height="56" rx="5" fill="none" stroke="var(--slate)" stroke-width="2"/>
        <text x="86" y="228" font-size="13.5" text-anchor="middle" fill="var(--slate)">大腦</text>
        <text x="86" y="247" font-size="10.5" text-anchor="middle" fill="var(--slate)">在別台機器上</text>
        <line x1="150" y1="232" x2="206" y2="232" stroke="var(--slate)" stroke-width="2" marker-end="url(#n2)"/>
        <text x="178" y="220" font-size="10.5" text-anchor="middle" fill="var(--slate)">下令</text>
        <rect x="214" y="204" width="130" height="56" rx="5" fill="var(--slate-soft)" stroke="var(--slate)" stroke-width="2"/>
        <text x="279" y="228" font-size="13.5" text-anchor="middle" fill="var(--slate)" class="mono">kubelet</text>
        <text x="279" y="247" font-size="10.5" text-anchor="middle" fill="var(--slate)">這台的內應</text>
        <line x1="352" y1="232" x2="408" y2="232" stroke="currentColor" stroke-width="2" marker-end="url(#n1)"/>
        <text x="380" y="220" font-size="10.5" text-anchor="middle" opacity=".7">叫它做</text>
        <rect x="416" y="204" width="150" height="56" rx="5" fill="none" stroke="currentColor"/>
        <text x="491" y="238" font-size="13.5" text-anchor="middle">容器執行環境</text>
        <line x1="574" y1="232" x2="618" y2="232" stroke="var(--gold)" stroke-width="2" marker-end="url(#n3)"/>
        <rect x="626" y="204" width="130" height="56" rx="5" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
        <text x="691" y="238" font-size="13.5" text-anchor="middle" fill="var(--gold)">容器起來了</text>
        <defs>
          <marker id="n1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="currentColor"/></marker>
          <marker id="n2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="var(--slate)"/></marker>
          <marker id="n3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="var(--gold)"/></marker>
        </defs>
      </svg>
