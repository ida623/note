<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 804 234" aria-label="舊做法一台機器跑一個服務，容器做法一台同樣的機器上跑二十幾個 Pod" width="804" height="234">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="804" height="234" fill="#FFFFFF" stroke="none"/>
        <text x="16" y="26" font-size="12" class="mono" opacity=".6">第一代的想法</text>
        <rect x="16" y="36" width="330" height="76" rx="5" fill="none" stroke="currentColor" stroke-opacity=".6"/>
        <rect x="120" y="54" width="122" height="40" rx="4" fill="none" stroke="currentColor" stroke-opacity=".6"/>
        <text x="181" y="79" font-size="12.5" text-anchor="middle" opacity=".7">一個服務</text>
        <text x="181" y="132" font-size="12" text-anchor="middle" fill="var(--danger)">整台機器只給它用</text>

        <line x1="372" y1="30" x2="372" y2="196" stroke="currentColor" stroke-opacity=".2" stroke-dasharray="4 5"/>

        <text x="400" y="26" font-size="12" class="mono" fill="var(--gold)">同一台機器，改跑容器</text>
        <rect x="400" y="36" width="364" height="76" rx="5" fill="none" stroke="var(--gold)" stroke-width="2"/>
        <g fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="1.2">
          <rect x="412" y="46" width="38" height="26" rx="3"/><rect x="456" y="46" width="38" height="26" rx="3"/>
          <rect x="500" y="46" width="38" height="26" rx="3"/><rect x="544" y="46" width="38" height="26" rx="3"/>
          <rect x="588" y="46" width="38" height="26" rx="3"/><rect x="632" y="46" width="38" height="26" rx="3"/>
          <rect x="676" y="46" width="38" height="26" rx="3"/><rect x="720" y="46" width="38" height="26" rx="3"/>
          <rect x="412" y="78" width="38" height="26" rx="3"/><rect x="456" y="78" width="38" height="26" rx="3"/>
          <rect x="500" y="78" width="38" height="26" rx="3"/><rect x="544" y="78" width="38" height="26" rx="3"/>
          <rect x="588" y="78" width="38" height="26" rx="3"/><rect x="632" y="78" width="38" height="26" rx="3"/>
          <rect x="676" y="78" width="38" height="26" rx="3"/><rect x="720" y="78" width="38" height="26" rx="3"/>
        </g>
        <text x="582" y="132" font-size="12" text-anchor="middle" fill="var(--gold)">十幾二十個 Pod 是常態</text>

        <rect x="16" y="152" width="748" height="44" rx="5" fill="none" stroke="currentColor" stroke-opacity=".3"/>
        <text x="390" y="180" font-size="13" text-anchor="middle" opacity=".8">一台只跑一個容器的話，容器就白用了——那跟第一代沒兩樣</text>
      </svg>
