<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 804 324" aria-label="一台 master node 剖開來看，裡面是四個 Pod：櫃檯、檔案室、排班的、巡邏的，由這台自己的 kubelet 直接照顧" width="804" height="324">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="804" height="324" fill="#FFFFFF" stroke="none"/>
        <rect x="20" y="34" width="450" height="240" rx="6" fill="none" stroke="var(--slate)" stroke-width="2"/>
        <text x="34" y="54" font-size="12" fill="var(--slate)" font-weight="700">一台 master node 剖開來看</text>

        <rect x="36" y="66" width="204" height="70" rx="5" fill="var(--slate-soft)" stroke="var(--slate)" stroke-width="1.6"/>
        <text x="138" y="94" font-size="13.5" text-anchor="middle" fill="var(--slate)">櫃檯</text>
        <text x="138" y="114" font-size="10.5" text-anchor="middle" fill="var(--slate)" class="mono">API Server</text>
        <text x="138" y="130" font-size="10" text-anchor="middle" fill="var(--slate)">一個 Pod</text>

        <rect x="252" y="66" width="204" height="70" rx="5" fill="var(--slate-soft)" stroke="var(--slate)" stroke-width="1.6"/>
        <text x="354" y="94" font-size="13.5" text-anchor="middle" fill="var(--slate)">檔案室</text>
        <text x="354" y="114" font-size="10.5" text-anchor="middle" fill="var(--slate)" class="mono">etcd</text>
        <text x="354" y="130" font-size="10" text-anchor="middle" fill="var(--slate)">一個 Pod</text>

        <rect x="36" y="146" width="204" height="70" rx="5" fill="var(--slate-soft)" stroke="var(--slate)" stroke-width="1.6"/>
        <text x="138" y="174" font-size="13.5" text-anchor="middle" fill="var(--slate)">排班的</text>
        <text x="138" y="194" font-size="10.5" text-anchor="middle" fill="var(--slate)" class="mono">Scheduler</text>
        <text x="138" y="210" font-size="10" text-anchor="middle" fill="var(--slate)">一個 Pod</text>

        <rect x="252" y="146" width="204" height="70" rx="5" fill="var(--slate-soft)" stroke="var(--slate)" stroke-width="1.6"/>
        <text x="354" y="174" font-size="13.5" text-anchor="middle" fill="var(--slate)">巡邏的</text>
        <text x="354" y="194" font-size="10.5" text-anchor="middle" fill="var(--slate)" class="mono">Controller Manager</text>
        <text x="354" y="210" font-size="10" text-anchor="middle" fill="var(--slate)">一個 Pod</text>

        <rect x="36" y="226" width="420" height="32" rx="4" fill="none" stroke="currentColor" stroke-opacity=".7"/>
        <text x="246" y="247" font-size="12" text-anchor="middle" opacity=".8">這台自己的 kubelet ＋ 容器執行環境</text>

        <line x1="480" y1="150" x2="504" y2="150" stroke="currentColor" stroke-opacity=".4" stroke-width="2" marker-end="url(#t1)"/>

        <text x="514" y="76" font-size="13" font-weight="700">這四個 Pod 是特別的</text>
        <text x="514" y="106" font-size="12.5" opacity=".8">它們由這台自己的 kubelet</text>
        <text x="514" y="126" font-size="12.5" opacity=".8">直接顧，<tspan font-weight="700">不是大腦排出來的</tspan></text>
        <text x="514" y="158" font-size="12.5" fill="var(--danger)">因為雞生蛋的問題：</text>
        <text x="514" y="178" font-size="12.5" fill="var(--danger)">大腦還沒起來的時候，</text>
        <text x="514" y="198" font-size="12.5" fill="var(--danger)">誰來排大腦？</text>
        <text x="514" y="230" font-size="12.5" fill="var(--gold)">所以它們掛了，這台的</text>
        <text x="514" y="250" font-size="12.5" fill="var(--gold)">kubelet 馬上重開，</text>
        <text x="514" y="270" font-size="12.5" fill="var(--gold)">不用等誰下令</text>

        <defs>
          <marker id="t1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="currentColor" fill-opacity=".4"/></marker>
        </defs>
      </svg>
