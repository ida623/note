--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="804" height="274" fill="#FFFFFF" stroke="none"/>
      <g fill="none" stroke="currentColor">
        <rect x="18" y="60" width="188" height="88" rx="5"/>
        <rect x="546" y="60" width="216" height="88" rx="5" stroke-dasharray="6 4"/>
      </g>
      <rect x="284" y="46" width="188" height="150" rx="5" fill="none" stroke="var(--gold)" stroke-width="2"/>
      <text x="112" y="98" font-size="16" text-anchor="middle">docker</text>
      <text x="112" y="122" font-size="12.5" text-anchor="middle" opacity=".7">你打指令的那支</text>
      <text x="378" y="82" font-size="16" text-anchor="middle" fill="var(--gold)">dockerd</text>
      <text x="378" y="106" font-size="12.5" text-anchor="middle" fill="var(--gold)">真正做事的那支</text>
      <text x="378" y="140" font-size="12" text-anchor="middle" opacity=".7">管：映像檔、容器</text>
      <text x="378" y="162" font-size="12" text-anchor="middle" opacity=".7">網路、資料卷</text>
      <text x="654" y="98" font-size="15" text-anchor="middle">映像檔倉庫</text>
      <text x="654" y="122" font-size="12.5" text-anchor="middle" opacity=".7">預設是 Docker Hub</text>
      <line x1="214" y1="104" x2="276" y2="104" stroke="currentColor" stroke-width="2" marker-end="url(#a1)"/>
      <text x="245" y="90" font-size="11.5" text-anchor="middle" opacity=".75">REST API</text>
      <text x="245" y="126" font-size="11.5" text-anchor="middle" opacity=".6">走本機檔案或網路</text>
      <line x1="480" y1="104" x2="538" y2="104" stroke="currentColor" stroke-opacity=".6" stroke-width="2" marker-end="url(#a2)"/>
