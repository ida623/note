<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 804 274" aria-label="docker 用戶端透過 REST API 把指令送給 dockerd，dockerd 管映像檔、容器、網路、資料卷，並向映像檔倉庫拉取或推送映像檔" width="804" height="274">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
