<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 254" aria-label="maxSurge 1、maxUnavailable 0 的滾動更新：每一步新版先多開一份並等它就緒，舊版才收掉一份，就緒的總數一直不少於 4" width="784" height="254">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="254" fill="#FFFFFF" stroke="none"/>
  <text x="20" y="28" font-size="13" font-weight="700">replicas 4、maxSurge 1、maxUnavailable 0：就緒的總數全程不少於 4</text>
  <text x="20" y="62" font-size="12" opacity=".75">一開始</text>
  <text x="20" y="102" font-size="12" opacity=".75">多開 1 份新的</text>
  <text x="20" y="142" font-size="12" opacity=".75">新的就緒，收 1 份舊的</text>
  <text x="20" y="182" font-size="12" opacity=".75">……重複到全部換完</text>
  <g>
    <rect x="200" y="46" width="44" height="26" rx="4" fill="var(--slate-soft)" stroke="var(--slate)"/><rect x="250" y="46" width="44" height="26" rx="4" fill="var(--slate-soft)" stroke="var(--slate)"/><rect x="300" y="46" width="44" height="26" rx="4" fill="var(--slate-soft)" stroke="var(--slate)"/><rect x="350" y="46" width="44" height="26" rx="4" fill="var(--slate-soft)" stroke="var(--slate)"/>
    <text x="222" y="64" font-size="11.5" text-anchor="middle">v1</text><text x="272" y="64" font-size="11.5" text-anchor="middle">v1</text><text x="322" y="64" font-size="11.5" text-anchor="middle">v1</text><text x="372" y="64" font-size="11.5" text-anchor="middle">v1</text>
  </g>
  <g>
    <rect x="200" y="86" width="44" height="26" rx="4" fill="var(--slate-soft)" stroke="var(--slate)"/><rect x="250" y="86" width="44" height="26" rx="4" fill="var(--slate-soft)" stroke="var(--slate)"/><rect x="300" y="86" width="44" height="26" rx="4" fill="var(--slate-soft)" stroke="var(--slate)"/><rect x="350" y="86" width="44" height="26" rx="4" fill="var(--slate-soft)" stroke="var(--slate)"/>
    <rect x="400" y="86" width="44" height="26" rx="4" fill="var(--surface)" stroke="var(--gold)" stroke-dasharray="4 3"/>
    <text x="222" y="104" font-size="11.5" text-anchor="middle">v1</text><text x="272" y="104" font-size="11.5" text-anchor="middle">v1</text><text x="322" y="104" font-size="11.5" text-anchor="middle">v1</text><text x="372" y="104" font-size="11.5" text-anchor="middle">v1</text><text x="422" y="104" font-size="11.5" text-anchor="middle" fill="var(--gold-deep)">v2…</text>
  </g>
  <g>
    <rect x="200" y="126" width="44" height="26" rx="4" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-dasharray="4 3"/><rect x="250" y="126" width="44" height="26" rx="4" fill="var(--slate-soft)" stroke="var(--slate)"/><rect x="300" y="126" width="44" height="26" rx="4" fill="var(--slate-soft)" stroke="var(--slate)"/><rect x="350" y="126" width="44" height="26" rx="4" fill="var(--slate-soft)" stroke="var(--slate)"/>
    <rect x="400" y="126" width="44" height="26" rx="4" fill="var(--gold-soft)" stroke="var(--gold)"/>
    <text x="222" y="144" font-size="11" text-anchor="middle" opacity=".5">收掉</text><text x="272" y="144" font-size="11.5" text-anchor="middle">v1</text><text x="322" y="144" font-size="11.5" text-anchor="middle">v1</text><text x="372" y="144" font-size="11.5" text-anchor="middle">v1</text><text x="422" y="144" font-size="11.5" text-anchor="middle" fill="var(--gold-deep)">v2</text>
  </g>
  <g>
    <rect x="200" y="166" width="44" height="26" rx="4" fill="var(--gold-soft)" stroke="var(--gold)"/><rect x="250" y="166" width="44" height="26" rx="4" fill="var(--gold-soft)" stroke="var(--gold)"/><rect x="300" y="166" width="44" height="26" rx="4" fill="var(--gold-soft)" stroke="var(--gold)"/><rect x="350" y="166" width="44" height="26" rx="4" fill="var(--gold-soft)" stroke="var(--gold)"/>
    <text x="222" y="184" font-size="11.5" text-anchor="middle" fill="var(--gold-deep)">v2</text><text x="272" y="184" font-size="11.5" text-anchor="middle" fill="var(--gold-deep)">v2</text><text x="322" y="184" font-size="11.5" text-anchor="middle" fill="var(--gold-deep)">v2</text><text x="372" y="184" font-size="11.5" text-anchor="middle" fill="var(--gold-deep)">v2</text>
  </g>
  <text x="470" y="104" font-size="12" fill="var(--gold-deep)">虛線框：開了但還沒就緒</text>
  <text x="470" y="144" font-size="12" opacity=".8">新的就緒了，舊的才收</text>
  <text x="20" y="218" font-size="12" fill="var(--slate-deep)">灰藍＝舊版 v1、古銅＝新版 v2；就緒的總數依序是 4、4、4……沒有一刻少於 4</text>
</svg>
