  <line x1="290" y1="190" x2="250" y2="132" stroke="currentColor" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#sm-01-arrow)"/>
  <line x1="400" y1="190" x2="480" y2="132" stroke="currentColor" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#sm-01-arrow)"/>
  <rect x="540" y="200" width="200" height="96" rx="10" fill="none" stroke="currentColor" stroke-dasharray="4 3"/>
  <text x="548" y="216" font-size="11.5" opacity=".7">Pod：legacy 的 client（READY 1/1）</text>
  <rect x="556" y="226" width="110" height="56" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="611" y="251" font-size="14" text-anchor="middle">curl</text>
  <text x="611" y="269" font-size="11.5" text-anchor="middle" opacity=".75">沒有代理</text>
  <line x1="560" y1="200" x2="515" y2="134" stroke="var(--danger)" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="20" y="300" font-size="12.5" fill="var(--danger)">右下的明文連線：PERMISSIVE 收，STRICT 拒絕（curl 結束碼 56）</text>
</svg>
