<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 354" aria-label="sidecar 與 mTLS：bank 命名空間裡，client 的 Pod 有 curl 容器與 istio-proxy 兩個容器，helloworld 的 Pod 也有 istio-proxy；兩個 istio-proxy 之間是 mTLS 加密連線，雙方都出示 istiod 簽發的憑證；右下角 legacy 命名空間的 client 沒有 istio-proxy，送明文，在 STRICT 模式下被 helloworld 那一側的 istio-proxy 拒絕" width="784" height="354">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="354" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="sm-01-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <rect x="20" y="40" width="300" height="110" rx="10" fill="none" stroke="currentColor" stroke-dasharray="4 3"/>
  <text x="28" y="56" font-size="11.5" opacity=".7">Pod：bank 的 client（READY 2/2）</text>
  <rect x="36" y="66" width="110" height="64" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="91" y="95" font-size="14" text-anchor="middle">curl</text>
  <text x="91" y="113" font-size="11.5" text-anchor="middle" opacity=".75">你的程式</text>
  <rect x="190" y="66" width="116" height="64" rx="8" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
  <text x="248" y="95" font-size="14" text-anchor="middle">istio-proxy</text>
  <text x="248" y="113" font-size="11.5" text-anchor="middle" opacity=".75">Envoy 代理</text>
  <rect x="440" y="40" width="300" height="110" rx="10" fill="none" stroke="currentColor" stroke-dasharray="4 3"/>
  <text x="448" y="56" font-size="11.5" opacity=".7">Pod：helloworld-v1（READY 2/2）</text>
  <rect x="456" y="66" width="116" height="64" rx="8" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
  <text x="514" y="95" font-size="14" text-anchor="middle">istio-proxy</text>
  <text x="514" y="113" font-size="11.5" text-anchor="middle" opacity=".75">Envoy 代理</text>
  <rect x="614" y="66" width="112" height="64" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="670" y="95" font-size="14" text-anchor="middle">helloworld</text>
  <text x="670" y="113" font-size="11.5" text-anchor="middle" opacity=".75">你的程式</text>
  <line x1="146" y1="98" x2="188" y2="98" stroke="currentColor" stroke-width="1.6" marker-end="url(#sm-01-arrow)"/>
  <line x1="306" y1="98" x2="454" y2="98" stroke="var(--gold)" stroke-width="1.6" marker-end="url(#sm-01-arrow)"/>
  <text x="330" y="88" font-size="12.5" fill="var(--gold)">mTLS 加密</text>
  <line x1="572" y1="98" x2="612" y2="98" stroke="currentColor" stroke-width="1.6" marker-end="url(#sm-01-arrow)"/>
  <rect x="240" y="190" width="200" height="56" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/>
