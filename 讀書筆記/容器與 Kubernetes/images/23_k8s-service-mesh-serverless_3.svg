<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 324" aria-label="sidecar 模式與 ambient 模式：左邊 sidecar 模式，同一個節點上三個 Pod 各自帶一個 Envoy 代理；右邊 ambient 模式，Pod 裡沒有代理，每個節點一個 ztunnel 處理第四層的加密與身分，要第七層功能時才另外部署 waypoint 代理" width="784" height="324">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="324" fill="#FFFFFF" stroke="none"/>
  <text x="20" y="28" font-size="14" fill="var(--gold)">sidecar 模式：每個 Pod 一個代理</text>
  <rect x="20" y="40" width="340" height="190" rx="10" fill="none" stroke="currentColor"/>
  <text x="30" y="58" font-size="11.5" opacity=".7">節點</text>
  <rect x="34" y="70" width="100" height="140" rx="10" fill="none" stroke="currentColor" stroke-dasharray="4 3"/>
  <text x="42" y="86" font-size="11.5" opacity=".7">Pod</text>
  <rect x="42" y="96" width="84" height="44" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="84" y="123" font-size="13" text-anchor="middle">程式</text>
  <rect x="42" y="152" width="84" height="44" rx="8" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
  <text x="84" y="179" font-size="13" text-anchor="middle">Envoy</text>
  <rect x="142" y="70" width="100" height="140" rx="10" fill="none" stroke="currentColor" stroke-dasharray="4 3"/>
  <text x="150" y="86" font-size="11.5" opacity=".7">Pod</text>
  <rect x="150" y="96" width="84" height="44" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="192" y="123" font-size="13" text-anchor="middle">程式</text>
  <rect x="150" y="152" width="84" height="44" rx="8" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
  <text x="192" y="179" font-size="13" text-anchor="middle">Envoy</text>
  <rect x="250" y="70" width="100" height="140" rx="10" fill="none" stroke="currentColor" stroke-dasharray="4 3"/>
  <text x="258" y="86" font-size="11.5" opacity=".7">Pod</text>
  <rect x="258" y="96" width="84" height="44" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="300" y="123" font-size="13" text-anchor="middle">程式</text>
  <rect x="258" y="152" width="84" height="44" rx="8" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
  <text x="300" y="179" font-size="13" text-anchor="middle">Envoy</text>
  <text x="400" y="28" font-size="14" fill="var(--slate)">ambient 模式：Pod 裡沒有代理</text>
  <rect x="400" y="40" width="340" height="190" rx="10" fill="none" stroke="currentColor"/>
  <text x="410" y="58" font-size="11.5" opacity=".7">節點</text>
  <rect x="414" y="70" width="100" height="76" rx="10" fill="none" stroke="currentColor" stroke-dasharray="4 3"/>
  <text x="422" y="86" font-size="11.5" opacity=".7">Pod</text>
  <rect x="422" y="96" width="84" height="40" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="464" y="121" font-size="13" text-anchor="middle">程式</text>
  <rect x="522" y="70" width="100" height="76" rx="10" fill="none" stroke="currentColor" stroke-dasharray="4 3"/>
  <text x="530" y="86" font-size="11.5" opacity=".7">Pod</text>
  <rect x="530" y="96" width="84" height="40" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="572" y="121" font-size="13" text-anchor="middle">程式</text>
  <rect x="630" y="70" width="100" height="76" rx="10" fill="none" stroke="currentColor" stroke-dasharray="4 3"/>
  <text x="638" y="86" font-size="11.5" opacity=".7">Pod</text>
  <rect x="638" y="96" width="84" height="40" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="680" y="121" font-size="13" text-anchor="middle">程式</text>
  <rect x="414" y="160" width="316" height="56" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="572" y="185" font-size="13.5" text-anchor="middle">ztunnel（每節點一個）</text>
  <text x="572" y="203" font-size="11.5" text-anchor="middle" opacity=".75">第四層：mTLS 加密、身分</text>
  <rect x="470" y="244" width="220" height="46" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="580" y="264" font-size="12.5" text-anchor="middle">waypoint（需要時才加）</text>
  <text x="580" y="282" font-size="11.5" text-anchor="middle" opacity=".75">第七層：重試、權重、HTTP 規則</text>
  <text x="20" y="262" font-size="12.5" opacity=".85">sidecar：功能齊全，每個 Pod 都要配代理的資源</text>
  <text x="20" y="282" font-size="12.5" opacity=".85">加入網格要重啟 Pod</text>
</svg>
