<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 234" aria-label="Stream 管線三段：來源 txs.stream() 送出元素，經過中間操作 filter 與 mapToLong，最後由終端操作 sum 產生結果；沒有終端操作時前面都不會執行" width="784" height="234">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="234" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="js-1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor" fill-opacity=".6"/></marker></defs>
  <text x="95" y="30" font-size="13" text-anchor="middle" opacity=".7">來源</text>
  <text x="345" y="30" font-size="13" text-anchor="middle" fill="var(--slate-deep)">中間操作（零個或多個，惰性）</text>
  <text x="640" y="30" font-size="13" text-anchor="middle" fill="var(--gold-deep)">終端操作（剛好一個）</text>
  <rect x="20" y="50" width="150" height="56" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="95" y="83" font-size="13" text-anchor="middle" class="mono">txs.stream()</text>
  <rect x="215" y="50" width="120" height="56" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="275" y="76" font-size="13" text-anchor="middle" class="mono">filter</text>
  <text x="275" y="95" font-size="11" text-anchor="middle" opacity=".75">留下 ≥ 10,000</text>
  <rect x="365" y="50" width="130" height="56" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="430" y="76" font-size="13" text-anchor="middle" class="mono">mapToLong</text>
  <text x="430" y="95" font-size="11" text-anchor="middle" opacity=".75">交易 → 金額</text>
  <rect x="580" y="50" width="120" height="56" rx="8" fill="var(--gold-soft)" stroke="var(--gold)"/>
  <text x="640" y="76" font-size="13" text-anchor="middle" class="mono">sum</text>
  <text x="640" y="95" font-size="11" text-anchor="middle" opacity=".75">得到 287000</text>
  <line x1="170" y1="78" x2="211" y2="78" stroke="currentColor" stroke-opacity=".6" stroke-width="1.5" marker-end="url(#js-1-arrow)"/>
  <line x1="335" y1="78" x2="361" y2="78" stroke="currentColor" stroke-opacity=".6" stroke-width="1.5" marker-end="url(#js-1-arrow)"/>
  <line x1="495" y1="78" x2="576" y2="78" stroke="currentColor" stroke-opacity=".6" stroke-width="1.5" marker-end="url(#js-1-arrow)"/>
  <text x="95" y="135" font-size="12" text-anchor="middle" opacity=".75">集合、陣列、範圍、檔案的行</text>
  <text x="355" y="135" font-size="12" text-anchor="middle" opacity=".75">每個都回傳新的 Stream，只是先記下要做什麼</text>
  <text x="640" y="135" font-size="12" text-anchor="middle" opacity=".75">回傳值或做副作用，這時才開始跑</text>
  <line x1="20" y1="160" x2="700" y2="160" stroke="currentColor" stroke-opacity=".25" stroke-dasharray="5 4"/>
  <text x="360" y="188" font-size="12.5" text-anchor="middle" fill="var(--gold-deep)">沒有終端操作，來源一筆都不會被讀；跑完之後這條流就用掉了，不能再用</text>
</svg>
