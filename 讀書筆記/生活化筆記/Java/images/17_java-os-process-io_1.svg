<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 314" aria-label="一個行程裡有三條執行緒：程式碼、堆、開啟的檔案描述子是整個行程共用的；每條執行緒各有自己的堆疊、程式計數器與暫存器" width="784" height="314">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="314" fill="#FFFFFF" stroke="none"/>
  <rect x="20" y="20" width="720" height="250" rx="10" fill="none" stroke="currentColor" stroke-opacity=".5"/>
  <text x="40" y="46" font-size="14" font-weight="700">一個行程（例如一個 JVM）</text>
  <text x="720" y="46" font-size="12" text-anchor="end" opacity=".7">行程 ID、位址空間、資源限制都是這一份</text>
  <rect x="40" y="62" width="210" height="46" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="145" y="90" font-size="13" text-anchor="middle">程式碼</text>
  <rect x="270" y="62" width="210" height="46" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="375" y="84" font-size="13" text-anchor="middle">堆（heap）與全域資料</text>
  <text x="375" y="100" font-size="11" text-anchor="middle" opacity=".75">Java 的物件都在這裡</text>
  <rect x="500" y="62" width="220" height="46" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="610" y="84" font-size="13" text-anchor="middle">開啟的檔案描述子</text>
  <text x="610" y="100" font-size="11" text-anchor="middle" opacity=".75">檔案、socket、epoll</text>
  <text x="380" y="134" font-size="12.5" text-anchor="middle" fill="var(--slate-deep)">↑ 上面這排：所有執行緒共用</text>
  <rect x="60" y="150" width="190" height="100" rx="6" fill="var(--surface)" stroke="currentColor"/>
  <text x="155" y="174" font-size="13" text-anchor="middle" font-weight="700">執行緒 1</text>
  <rect x="80" y="186" width="150" height="26" rx="4" fill="var(--gold-soft)" stroke="var(--gold)"/>
  <text x="155" y="204" font-size="12" text-anchor="middle">自己的堆疊</text>
  <text x="155" y="236" font-size="11.5" text-anchor="middle" opacity=".75">自己的 PC 與暫存器</text>
  <rect x="285" y="150" width="190" height="100" rx="6" fill="var(--surface)" stroke="currentColor"/>
  <text x="380" y="174" font-size="13" text-anchor="middle" font-weight="700">執行緒 2</text>
  <rect x="305" y="186" width="150" height="26" rx="4" fill="var(--gold-soft)" stroke="var(--gold)"/>
  <text x="380" y="204" font-size="12" text-anchor="middle">自己的堆疊</text>
  <text x="380" y="236" font-size="11.5" text-anchor="middle" opacity=".75">自己的 PC 與暫存器</text>
  <rect x="510" y="150" width="190" height="100" rx="6" fill="var(--surface)" stroke="currentColor"/>
  <text x="605" y="174" font-size="13" text-anchor="middle" font-weight="700">執行緒 3</text>
  <rect x="530" y="186" width="150" height="26" rx="4" fill="var(--gold-soft)" stroke="var(--gold)"/>
  <text x="605" y="204" font-size="12" text-anchor="middle">自己的堆疊</text>
  <text x="605" y="236" font-size="11.5" text-anchor="middle" opacity=".75">自己的 PC 與暫存器</text>
</svg>
