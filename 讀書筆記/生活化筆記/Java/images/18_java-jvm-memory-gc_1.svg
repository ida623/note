<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 324" aria-label="JVM 執行期資料區：堆與方法區所有執行緒共用；每條執行緒各有 pc 暫存器、JVM 堆疊、本機方法堆疊" width="784" height="324">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="324" fill="#FFFFFF" stroke="none"/>
  <rect x="20" y="20" width="720" height="260" rx="10" fill="none" stroke="currentColor" stroke-opacity=".5"/>
  <text x="40" y="46" font-size="14" font-weight="700">一個 JVM 行程</text>
  <rect x="40" y="62" width="400" height="80" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="240" y="90" font-size="14" text-anchor="middle" font-weight="700">堆（heap）</text>
  <text x="240" y="110" font-size="12" text-anchor="middle">所有物件與陣列的實體</text>
  <text x="240" y="128" font-size="11" text-anchor="middle" opacity=".75">由垃圾回收器管理；爆了是 OutOfMemoryError</text>
  <rect x="460" y="62" width="260" height="80" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="590" y="90" font-size="14" text-anchor="middle" font-weight="700">方法區（method area）</text>
  <text x="590" y="110" font-size="12" text-anchor="middle">類別結構、執行期常數池、方法的程式碼</text>
  <text x="590" y="128" font-size="11" text-anchor="middle" opacity=".75">HotSpot 的實作叫 Metaspace</text>
  <text x="380" y="164" font-size="12.5" text-anchor="middle" fill="var(--slate-deep)">↑ 所有執行緒共用　　↓ 每條執行緒一份</text>
  <rect x="40" y="178" width="210" height="88" rx="6" fill="var(--surface)" stroke="currentColor"/>
  <text x="145" y="198" font-size="13" text-anchor="middle" font-weight="700">執行緒 1</text>
  <rect x="55" y="206" width="180" height="22" rx="4" fill="var(--gold-soft)" stroke="var(--gold)"/>
  <text x="145" y="221" font-size="11.5" text-anchor="middle">JVM 堆疊：一次呼叫一個框</text>
  <text x="145" y="242" font-size="11" text-anchor="middle" opacity=".75">pc 暫存器</text>
  <text x="145" y="258" font-size="11" text-anchor="middle" opacity=".75">本機方法堆疊</text>
  <rect x="275" y="178" width="210" height="88" rx="6" fill="var(--surface)" stroke="currentColor"/>
  <text x="380" y="198" font-size="13" text-anchor="middle" font-weight="700">執行緒 2</text>
  <rect x="290" y="206" width="180" height="22" rx="4" fill="var(--gold-soft)" stroke="var(--gold)"/>
  <text x="380" y="221" font-size="11.5" text-anchor="middle">JVM 堆疊：一次呼叫一個框</text>
  <text x="380" y="242" font-size="11" text-anchor="middle" opacity=".75">pc 暫存器</text>
  <text x="380" y="258" font-size="11" text-anchor="middle" opacity=".75">本機方法堆疊</text>
  <rect x="510" y="178" width="210" height="88" rx="6" fill="var(--surface)" stroke="currentColor"/>
  <text x="615" y="198" font-size="13" text-anchor="middle" font-weight="700">執行緒 3</text>
  <rect x="525" y="206" width="180" height="22" rx="4" fill="var(--gold-soft)" stroke="var(--gold)"/>
  <text x="615" y="221" font-size="11.5" text-anchor="middle">JVM 堆疊：一次呼叫一個框</text>
  <text x="615" y="242" font-size="11" text-anchor="middle" opacity=".75">pc 暫存器</text>
  <text x="615" y="258" font-size="11" text-anchor="middle" opacity=".75">本機方法堆疊</text>
</svg>
