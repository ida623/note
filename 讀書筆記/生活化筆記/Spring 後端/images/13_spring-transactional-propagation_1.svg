<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 314" aria-label="宣告式交易的呼叫路徑：外部呼叫先經過 Spring 產生的代理，代理裡的交易攔截器開交易，再呼叫目標物件的方法，方法正常結束就提交、丟出例外就判斷要不要還原；目標物件裡用 this 呼叫自己另一個方法，不經過代理，那個方法上的 @Transactional 不會生效" width="784" height="314">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="314" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="st-01-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <rect x="20" y="90" width="130" height="60" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="85" y="117" font-size="14" text-anchor="middle">呼叫端</text>
  <text x="85" y="135" font-size="11.5" text-anchor="middle" opacity=".75">另一個 Bean</text>
  <rect x="220" y="40" width="220" height="160" rx="8" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
  <text x="330" y="125" font-size="14" text-anchor="middle"></text>
  <text x="330" y="66" font-size="14" text-anchor="middle" fill="var(--gold-deep)">代理（Spring 產生）</text>
  <text x="330" y="96" font-size="12.5" text-anchor="middle">交易攔截器</text>
  <text x="330" y="124" font-size="12" text-anchor="middle" class="mono">① 開交易、綁到執行緒</text>
  <text x="330" y="146" font-size="12" text-anchor="middle" class="mono">③ 正常結束 → 提交</text>
  <text x="330" y="168" font-size="12" text-anchor="middle" class="mono">③ 丟出例外 → 判斷還原</text>
  <rect x="520" y="40" width="220" height="160" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="630" y="125" font-size="14" text-anchor="middle"></text>
  <text x="630" y="66" font-size="14" text-anchor="middle">目標物件（你寫的類別）</text>
  <rect x="545" y="85" width="170" height="40" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="630" y="110" font-size="13" text-anchor="middle">transfer()</text>
  <rect x="545" y="145" width="170" height="40" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="630" y="170" font-size="12.5" text-anchor="middle">@Transactional audit()</text>
  <line x1="150" y1="120" x2="218" y2="120" stroke="currentColor" stroke-width="1.6" marker-end="url(#st-01-arrow)"/>
  <line x1="440" y1="105" x2="543" y2="105" stroke="currentColor" stroke-width="1.6" marker-end="url(#st-01-arrow)"/>
  <text x="492" y="96" font-size="12" text-anchor="middle" class="mono">② 呼叫</text>
  <path d="M715 112 C 745 120, 745 150, 717 160" fill="none" stroke="var(--danger)" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#st-01-arrow)"/>
  <text x="520" y="228" font-size="12.5" fill="var(--danger)">this.audit()：自我呼叫，不經過代理</text>
  <text x="520" y="248" font-size="12.5" fill="var(--danger)">audit() 上的 @Transactional 沒人處理</text>
  <text x="20" y="270" font-size="12.5" opacity=".8">只有「從外面經過代理進來」的呼叫，才會被交易攔截器處理</text>
</svg>
