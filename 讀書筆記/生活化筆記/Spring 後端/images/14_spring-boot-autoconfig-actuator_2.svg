<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 324" aria-label="自動組態怎麼決定要不要生效：Spring Boot 讀 jar 裡 AutoConfiguration.imports 檔列出的候選類別，每個候選依序檢查條件：classpath 上有沒有某個類別、設定值是不是開著、容器裡是不是還沒有同型別的 Bean；全部通過才註冊 Bean，你自己定義了同型別的 Bean，自動組態就退開" width="784" height="324">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="324" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="sb-02-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <rect x="20" y="30" width="180" height="74" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="110" y="64" font-size="13" text-anchor="middle">AutoConfiguration</text>
  <text x="110" y="82" font-size="11.5" text-anchor="middle" opacity=".75">.imports 檔：候選名單</text>
  <rect x="250" y="20" width="250" height="70" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="375" y="52" font-size="13" text-anchor="middle">@ConditionalOnClass</text>
  <text x="375" y="70" font-size="11.5" text-anchor="middle" opacity=".75">classpath 有這個類別？</text>
  <line x1="375" y1="90" x2="375" y2="110" stroke="currentColor" stroke-width="1.6" marker-end="url(#sb-02-arrow)"/>
  <rect x="250" y="112" width="250" height="70" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="375" y="144" font-size="13" text-anchor="middle">@ConditionalOnProperty</text>
  <text x="375" y="162" font-size="11.5" text-anchor="middle" opacity=".75">設定值開著？</text>
  <line x1="375" y1="182" x2="375" y2="202" stroke="currentColor" stroke-width="1.6" marker-end="url(#sb-02-arrow)"/>
  <rect x="250" y="204" width="250" height="70" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="375" y="236" font-size="13" text-anchor="middle">@ConditionalOnMissingBean</text>
  <text x="375" y="254" font-size="11.5" text-anchor="middle" opacity=".75">你還沒定義同型別的 Bean？</text>
  <line x1="200" y1="67" x2="248" y2="55" stroke="currentColor" stroke-width="1.6" marker-end="url(#sb-02-arrow)"/>
  <rect x="560" y="200" width="180" height="70" rx="8" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
  <text x="650" y="232" font-size="14" text-anchor="middle">註冊 Bean</text>
  <text x="650" y="250" font-size="11.5" text-anchor="middle" opacity=".75">自動組態生效</text>
  <line x1="500" y1="239" x2="558" y2="236" stroke="currentColor" stroke-width="1.6" marker-end="url(#sb-02-arrow)"/>
  <text x="520" y="40" font-size="12.5" fill="var(--danger)">任何一關不通過：</text>
  <text x="520" y="60" font-size="12.5" fill="var(--danger)">這個自動組態整個（或那個 @Bean）跳過，</text>
  <text x="520" y="80" font-size="12.5" fill="var(--danger)">--debug 的報告寫在 Negative matches</text>
</svg>
