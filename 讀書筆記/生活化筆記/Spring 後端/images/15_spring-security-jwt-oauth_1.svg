<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 286" aria-label="OAuth 2.0 三個伺服器端角色在 Spring Security 裡各對應一個設定：用戶端用 oauth2Login，授權伺服器用 oauth2AuthorizationServer，資源伺服器用 oauth2ResourceServer。用戶端向授權伺服器拿權杖，再帶著 access token 呼叫資源伺服器" width="784" height="286">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="286" fill="#FFFFFF" stroke="none"/>
<defs><marker id="sj-m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><rect x="20" y="40" width="220" height="70" rx="8" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="130" y="72" font-size="13" text-anchor="middle">用戶端（client）</text><text x="130" y="90" font-size="11.5" text-anchor="middle" opacity=".7">oauth2Login()</text><rect x="270" y="40" width="220" height="70" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="380" y="72" font-size="13" text-anchor="middle">授權伺服器</text><text x="380" y="90" font-size="11.5" text-anchor="middle" opacity=".7">oauth2AuthorizationServer()</text><rect x="520" y="40" width="220" height="70" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="630" y="72" font-size="13" text-anchor="middle">資源伺服器（API）</text><text x="630" y="90" font-size="11.5" text-anchor="middle" opacity=".7">oauth2ResourceServer()</text><text x="130" y="132" font-size="12" text-anchor="middle" opacity=".75">網銀前台、行動 App</text><text x="380" y="132" font-size="12" text-anchor="middle" opacity=".75">登入頁、發權杖</text><text x="630" y="132" font-size="12" text-anchor="middle" opacity=".75">收 Bearer 權杖、驗簽</text><line x1="242" y1="58" x2="266" y2="58" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#sj-m1)"/><line x1="268" y1="92" x2="244" y2="92" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#sj-m1)"/><path d="M130 142 Q130 196 380 196 Q630 196 630 146" fill="none" stroke="var(--gold-deep)" stroke-width="1.5" marker-end="url(#sj-m1)"/><text x="380" y="216" font-size="12.5" text-anchor="middle" fill="var(--gold-deep)">帶著 access token 呼叫 API</text><text x="20" y="248" font-size="12" opacity=".6">上排箭頭：用戶端把使用者導去授權伺服器、拿回權杖；下方曲線：之後每次呼叫 API 都帶上權杖</text>
</svg>
