<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 350" aria-label="更新權杖輪替的實跑結果：登入拿到 rt1；用 rt1 換到新的存取權杖與 rt2，rt1 作廢；再用 rt1 換得到 400 invalid_grant；用 rt2 換仍然成功，因為這個設定沒有在偵測到重複使用時連帶撤銷 rt2" width="784" height="350">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="350" fill="#FFFFFF" stroke="none"/>
<defs><marker id="sj-m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><text x="20" y="30" font-size="12.5" fill="var(--gold-deep)">機密用戶端 web-portal，reuseRefreshTokens(false)</text><rect x="20" y="48" width="150" height="40" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="95" y="73" font-size="12.5" text-anchor="middle">登入換權杖</text><line x1="172" y1="68" x2="214" y2="68" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#sj-m4)"/><rect x="218" y="48" width="400" height="40" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="418" y="73" font-size="12.5" text-anchor="middle">access_token 與 refresh_token rt1</text><rect x="20" y="104" width="150" height="40" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="95" y="129" font-size="12.5" text-anchor="middle">用 rt1 換</text><line x1="172" y1="124" x2="214" y2="124" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#sj-m4)"/><rect x="218" y="104" width="400" height="40" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="418" y="129" font-size="12.5" text-anchor="middle">200：新的 access_token 與 rt2（rt1 作廢）</text><rect x="20" y="160" width="150" height="40" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="95" y="185" font-size="12.5" text-anchor="middle">再用 rt1 換</text><line x1="172" y1="180" x2="214" y2="180" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#sj-m4)"/><rect x="218" y="160" width="400" height="40" rx="8" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="418" y="185" font-size="12.5" text-anchor="middle">400 invalid_grant</text><rect x="20" y="216" width="150" height="40" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="95" y="241" font-size="12.5" text-anchor="middle">用 rt2 換</text><line x1="172" y1="236" x2="214" y2="236" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#sj-m4)"/><rect x="218" y="216" width="400" height="40" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="418" y="241" font-size="12.5" text-anchor="middle">200：rt2 仍可用（這個設定沒有連帶作廢）</text><text x="20" y="290" font-size="12" opacity=".7">RFC 9700 的做法：有人拿作廢的那把來換，伺服器分不出誰是攻擊者，就撤銷現行的那把；這個示範沒做，要另外實作</text><text x="20" y="312" font-size="12" opacity=".6">古銅＝偵測到重複使用的那一刻</text>
</svg>
