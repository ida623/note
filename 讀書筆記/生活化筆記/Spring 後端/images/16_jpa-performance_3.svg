<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 274" aria-label="持久化環境像一個延後寫入的佇列：改名字、新增序列主鍵的物件，都先排在記憶體裡，等 flush 才變成 UPDATE 與 INSERT 送到資料庫。flush 的時機有三個：交易提交之前、要查重疊的表之前、手動呼叫 flush。IDENTITY 主鍵的物件例外，persist 當下就直接送 INSERT" width="784" height="274">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="274" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="jp-a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker><marker id="jp-a1g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--gold)"/></marker></defs>
  <rect x="30" y="70" width="270" height="130" rx="10" fill="var(--surface)" stroke="currentColor"/>
  <text x="165" y="92" font-size="13" text-anchor="middle" font-weight="700">持久化環境（一級快取）</text>
  <rect x="50" y="106" width="230" height="32" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="165" y="127" font-size="12" text-anchor="middle">部門改名 → 待送 UPDATE</text>
  <rect x="50" y="148" width="230" height="32" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="165" y="169" font-size="12" text-anchor="middle">新便條（序列主鍵）→ 待送 INSERT</text>
  <line x1="304" y1="140" x2="556" y2="140" stroke="currentColor" stroke-width="1.5" marker-end="url(#jp-a1)"/>
  <text x="430" y="130" font-size="13" text-anchor="middle" font-weight="700">flush</text>
  <text x="430" y="162" font-size="11" text-anchor="middle">交易提交之前</text>
  <text x="430" y="180" font-size="11" text-anchor="middle">要查重疊的表之前</text>
  <text x="430" y="198" font-size="11" text-anchor="middle">手動呼叫 flush()</text>
  <rect x="560" y="100" width="170" height="80" rx="10" fill="var(--surface)" stroke="currentColor"/>
  <text x="645" y="145" font-size="14" text-anchor="middle" font-weight="700">資料庫</text>
  <text x="165" y="34" font-size="12" text-anchor="middle" fill="var(--gold-deep)">IDENTITY 主鍵：persist 當下</text>
  <path d="M300 30 Q 470 10 640 96" fill="none" stroke="var(--gold)" stroke-width="2" marker-end="url(#jp-a1g)"/>
  <text x="440" y="70" font-size="11" text-anchor="middle" fill="var(--gold-deep)">直接 INSERT，不排隊</text>
  <text x="380" y="236" font-size="12" text-anchor="middle" fill="var(--slate-deep)">排在一起的 INSERT、UPDATE 才有機會整批送出（下一段）</text>
</svg>
