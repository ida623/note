<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 284" aria-label="上面是直接呼叫：轉帳服務呼叫通知服務，通知服務掛掉時轉帳也跟著失敗；下面是經過 broker：轉帳服務把訊息放進佇列就回應，通知服務之後再來拿，掛掉一陣子訊息也還在" width="784" height="284">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="284" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="mq-1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
  <text x="20" y="28" font-size="13" fill="var(--slate-deep)">直接呼叫：兩邊要同時活著</text>
  <rect x="40" y="44" width="150" height="50" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="115" y="74" font-size="14" text-anchor="middle">轉帳服務</text>
  <line x1="190" y1="69" x2="468" y2="69" stroke="currentColor" marker-end="url(#mq-1-arrow)"/>
  <text x="330" y="60" font-size="12.5" text-anchor="middle">呼叫，等它回應</text>
  <rect x="470" y="44" width="150" height="50" rx="8" fill="var(--surface)" stroke="currentColor" stroke-dasharray="5 4"/>
  <text x="545" y="74" font-size="14" text-anchor="middle">通知服務（掛了）</text>
  <text x="640" y="74" font-size="12.5" fill="var(--gold-deep)">轉帳也失敗</text>
  <text x="20" y="140" font-size="13" fill="var(--slate-deep)">經過 broker：放進去就能走</text>
  <rect x="40" y="156" width="150" height="50" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="115" y="186" font-size="14" text-anchor="middle">轉帳服務</text>
  <line x1="190" y1="181" x2="258" y2="181" stroke="currentColor" marker-end="url(#mq-1-arrow)"/>
  <rect x="260" y="161" width="40" height="40" fill="var(--gold-soft)" stroke="var(--gold)"/>
  <rect x="300" y="161" width="40" height="40" fill="var(--gold-soft)" stroke="var(--gold)"/>
  <rect x="340" y="161" width="40" height="40" fill="var(--gold-soft)" stroke="var(--gold)"/>
  <rect x="380" y="161" width="40" height="40" fill="var(--surface)" stroke="currentColor"/>
  <text x="340" y="226" font-size="12.5" text-anchor="middle">broker 保管的訊息</text>
  <line x1="420" y1="181" x2="468" y2="181" stroke="currentColor" marker-end="url(#mq-1-arrow)"/>
  <rect x="470" y="156" width="150" height="50" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="545" y="186" font-size="14" text-anchor="middle">通知服務</text>
  <text x="640" y="178" font-size="12.5" fill="var(--slate-deep)">恢復後</text>
  <text x="640" y="196" font-size="12.5" fill="var(--slate-deep)">再來拿</text>
</svg>
