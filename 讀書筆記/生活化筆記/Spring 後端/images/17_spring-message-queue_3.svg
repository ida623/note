<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 324" aria-label="topic 交換器 bank.events 收到三則訊息，依綁定分到三條佇列：audit.all 綁 #，三則都收；notify.large 綁 transfer.*.large，只收 transfer.tw.large；risk.tw 綁 *.tw.*，收 transfer.tw.large 和 login.tw.web" width="784" height="324">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="324" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="mq-3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
  <text x="20" y="40" font-size="13" fill="var(--slate-deep)">送出的路由鍵</text>
  <text x="20" y="90" font-size="13" class="mono">transfer.tw.large</text>
  <text x="20" y="150" font-size="13" class="mono">transfer.jp.small</text>
  <text x="20" y="210" font-size="13" class="mono">login.tw.web</text>
  <line x1="160" y1="86" x2="228" y2="140" stroke="currentColor" marker-end="url(#mq-3-arrow)"/>
  <line x1="160" y1="146" x2="228" y2="148" stroke="currentColor" marker-end="url(#mq-3-arrow)"/>
  <line x1="160" y1="206" x2="228" y2="156" stroke="currentColor" marker-end="url(#mq-3-arrow)"/>
  <rect x="230" y="110" width="140" height="76" rx="10" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
  <text x="300" y="142" font-size="14" text-anchor="middle">bank.events</text>
  <text x="300" y="164" font-size="12.5" text-anchor="middle" fill="var(--gold-deep)">topic 交換器</text>
  <line x1="370" y1="135" x2="528" y2="70" stroke="currentColor" marker-end="url(#mq-3-arrow)"/>
  <line x1="370" y1="148" x2="528" y2="150" stroke="currentColor" marker-end="url(#mq-3-arrow)"/>
  <line x1="370" y1="161" x2="528" y2="230" stroke="currentColor" marker-end="url(#mq-3-arrow)"/>
  <text x="430" y="88" font-size="12.5" class="mono" fill="var(--gold-deep)">#</text>
  <text x="400" y="140" font-size="12.5" class="mono" fill="var(--gold-deep)">transfer.*.large</text>
  <text x="430" y="218" font-size="12.5" class="mono" fill="var(--gold-deep)">*.tw.*</text>
  <rect x="530" y="45" width="210" height="50" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="545" y="66" font-size="13" class="mono">audit.all</text>
  <text x="545" y="86" font-size="12" fill="var(--slate-deep)">三則都收</text>
  <rect x="530" y="125" width="210" height="50" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="545" y="146" font-size="13" class="mono">notify.large</text>
  <text x="545" y="166" font-size="12" fill="var(--slate-deep)">只收 transfer.tw.large</text>
  <rect x="530" y="205" width="210" height="50" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="545" y="226" font-size="13" class="mono">risk.tw</text>
  <text x="545" y="246" font-size="12" fill="var(--slate-deep)">收 transfer.tw.large、login.tw.web</text>
  <text x="20" y="285" font-size="12.5" opacity=".75">古銅字是綁定的樣式：# 代表零個或多個字，* 剛好代表一個字</text>
</svg>
