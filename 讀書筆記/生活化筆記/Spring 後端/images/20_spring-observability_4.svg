-anchor="start" fill="var(--gold-deep)" class="mono">traceparent: 00-67e70a40…-ceae3b43…-03</text><text x="30" y="250" font-size="12" text-anchor="start" opacity=".6">三段同屬一條 trace；account 那段的父節點，就是 transfer 發出呼叫那段的 span ID，也就是 traceparent 的第三欄</text>
