<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 322" aria-label="Spring Boot 啟動時 Flyway 的步驟：找腳本、比對 flyway_schema_history、validate 檢查校驗和、migrate 依版本執行沒跑過的腳本、最後跑內容變了的可重複腳本，接著 Hibernate 用 ddl-auto=validate 對照實體與表；任一步失敗應用程式就啟動失敗" width="784" height="322">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="322" fill="#FFFFFF" stroke="none"/>
<defs><marker id="fw-m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><rect x="20" y="40" width="222" height="56" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="131" y="65" font-size="13.5" text-anchor="middle">找腳本</text><text x="131" y="83" font-size="11.5" text-anchor="middle" opacity=".7">掃 spring.flyway.locations</text><line x1="244" y1="68" x2="266" y2="68" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#fw-m1)"/><rect x="268" y="40" width="222" height="56" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="379" y="65" font-size="13.5" text-anchor="middle">比對歷史表</text><text x="379" y="83" font-size="11.5" text-anchor="middle" opacity=".7">flyway_schema_history</text><line x1="492" y1="68" x2="514" y2="68" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#fw-m1)"/><rect x="516" y="40" width="222" height="56" rx="8" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="627" y="65" font-size="13.5" text-anchor="middle">validate</text><text x="627" y="83" font-size="11.5" text-anchor="middle" opacity=".7">校驗和、有沒有漏跑或多出來</text><rect x="20" y="170" width="222" height="56" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="131" y="195" font-size="13.5" text-anchor="middle">migrate</text><text x="131" y="213" font-size="11.5" text-anchor="middle" opacity=".7">沒跑過的版本化腳本，照版本</text><line x1="244" y1="198" x2="266" y2="198" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#fw-m1)"/><rect x="268" y="170" width="222" height="56" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="379" y="195" font-size="13.5" text-anchor="middle">可重複腳本</text><text x="379" y="213" font-size="11.5" text-anchor="middle" opacity=".7">內容變了的，最後跑</text><line x1="492" y1="198" x2="514" y2="198" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#fw-m1)"/><rect x="516" y="170" width="222" height="56" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="627" y="195" font-size="13.5" text-anchor="middle">Hibernate 啟動</text><text x="627" y="213" font-size="11.5" text-anchor="middle" opacity=".7">ddl-auto=validate 對照實體</text><path d="M631 98 L631 128 L131 128 L131 166" fill="none" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#fw-m1)"/><text x="20" y="260" font-size="12.5" fill="var(--gold-deep)">任何一步失敗，Spring Boot 就啟動失敗：validate 不過、腳本執行錯誤、Hibernate 對不上欄位</text><text x="20" y="284" font-size="12" opacity=".6">實跑日誌：entityManagerFactory 依賴 flywayInitializer，所以 Flyway 一定先跑完</text>
</svg>
