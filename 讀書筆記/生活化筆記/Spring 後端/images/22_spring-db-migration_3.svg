<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 306" aria-label="MySQL 上的遷移失敗：V4 腳本第一句加欄位成功並已提交，第二句打錯字失敗，歷史表記下 success 為 0。修復步驟：改好腳本、手動清掉已經生效的半套、執行 repair 移除失敗紀錄、重新啟動讓 V4 從頭跑" width="784" height="306">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="306" fill="#FFFFFF" stroke="none"/>
<defs><marker id="fw-m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><text x="20" y="28" font-size="12.5" fill="var(--gold-deep)">V4__add_status.sql 有兩句，MySQL 的 DDL 會隱含提交</text><rect x="20" y="44" width="330" height="44" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="185" y="71" font-size="13" text-anchor="middle">第 1 句：ADD COLUMN status …</text><text x="360" y="72" font-size="12.5" fill="var(--slate-deep)">成功，已經提交，退不回去</text><rect x="20" y="98" width="330" height="44" rx="8" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="185" y="125" font-size="13" text-anchor="middle">第 2 句：ADD CONSTRAINT …（打錯字）</text><text x="360" y="126" font-size="12.5" fill="var(--gold-deep)">失敗：歷史表記一筆 success = 0</text><rect x="20" y="180" width="168" height="56" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="104" y="205" font-size="13" text-anchor="middle">1. 改好腳本</text><text x="104" y="223" font-size="11.5" text-anchor="middle" opacity=".7">直接重啟還是不行</text><line x1="190" y1="208" x2="204" y2="208" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#fw-m2)"/><rect x="206" y="180" width="168" height="56" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="290" y="205" font-size="13" text-anchor="middle">2. 手動清掉半套</text><text x="290" y="223" font-size="11.5" text-anchor="middle" opacity=".7">DROP COLUMN status</text><line x1="376" y1="208" x2="390" y2="208" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#fw-m2)"/><rect x="392" y="180" width="168" height="56" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="476" y="205" font-size="13" text-anchor="middle">3. repair</text><text x="476" y="223" font-size="11.5" text-anchor="middle" opacity=".7">移除失敗的那筆</text><line x1="562" y1="208" x2="576" y2="208" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#fw-m2)"/><rect x="578" y="180" width="168" height="56" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="662" y="205" font-size="13" text-anchor="middle">4. 重新啟動</text><text x="662" y="223" font-size="11.5" text-anchor="middle" opacity=".7">V4 從頭跑一次</text><text x="20" y="268" font-size="12" opacity=".6">能在交易裡跑 DDL 的資料庫，失敗時會整支腳本退回；MySQL 不行，所以一支腳本最好只做一件 DDL</text>
</svg>
