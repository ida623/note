<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 286" aria-label="擴張收縮的三個階段：擴張時用 V5 加上可為 NULL 的 owner_name 並複製資料，舊程式繼續用 owner；遷移階段所有程式改用 owner_name；收縮時用 V6 把 owner_name 改成 NOT NULL 並刪掉 owner。owner 欄位在前兩個階段都在，收縮後才消失" width="784" height="286">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="286" fill="#FFFFFF" stroke="none"/>
<defs><marker id="fw-m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><rect x="20" y="40" width="222" height="40" rx="8" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="131" y="65" font-size="14" text-anchor="middle">擴張</text><text x="131" y="104" font-size="12" text-anchor="middle">V5：加 owner_name（可 NULL）、複製資料</text><text x="131" y="126" font-size="11.5" text-anchor="middle" opacity=".75">舊程式讀寫 owner；過渡版程式兩欄都寫</text><line x1="244" y1="60" x2="266" y2="60" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#fw-m3)"/><rect x="268" y="40" width="222" height="40" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="379" y="65" font-size="14" text-anchor="middle">遷移</text><text x="379" y="104" font-size="12" text-anchor="middle">不動結構</text><text x="379" y="126" font-size="11.5" text-anchor="middle" opacity=".75">所有程式改讀寫 owner_name，舊版全部下線</text><line x1="492" y1="60" x2="514" y2="60" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#fw-m3)"/><rect x="516" y="40" width="222" height="40" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="627" y="65" font-size="14" text-anchor="middle">收縮</text><text x="627" y="104" font-size="12" text-anchor="middle">V6：owner_name 改 NOT NULL、刪 owner</text><text x="627" y="126" font-size="11.5" text-anchor="middle" opacity=".75">同一版更新用到 owner 的 view</text><text x="20" y="176" font-size="13" class="mono">owner</text><rect x="120" y="162" width="200" height="20" rx="4" fill="var(--slate-soft)" stroke="var(--slate)"/><rect x="338" y="162" width="200" height="20" rx="4" fill="var(--slate-soft)" stroke="var(--slate)"/><rect x="556" y="162" width="200" height="20" rx="4" fill="none" stroke="currentColor" stroke-dasharray="4 3" stroke-opacity=".4"/><text x="20" y="210" font-size="13" class="mono">owner_name</text><rect x="120" y="196" width="200" height="20" rx="4" fill="var(--slate-soft)" stroke="var(--slate)"/><rect x="338" y="196" width="200" height="20" rx="4" fill="var(--slate-soft)" stroke="var(--slate)"/><rect x="556" y="196" width="200" height="20" rx="4" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="20" y="248" font-size="12" opacity=".6">灰藍＝欄位還在。任何時間點，正在跑的每一版程式都找得到它要的欄位，所以不用停機</text>
</svg>
