<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 292" aria-label="Spring Batch 的結構：一個 Job（日終交易入帳）裡有一個 Step。Step 裡 ItemReader 一次讀一筆、ItemProcessor 一次處理一筆，湊滿 1000 筆後 ItemWriter 一次寫出整個 chunk，接著提交交易，再回頭讀下一個 chunk" width="784" height="292">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="292" fill="#FFFFFF" stroke="none"/>
<defs><marker id="sb2-m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><rect x="20" y="20" width="720" height="210" rx="8" fill="none" stroke="currentColor" stroke-opacity=".35"/><text x="36" y="42" font-size="13" text-anchor="start" fill="var(--gold-deep)">Job：importTxJob（日終交易入帳）</text><rect x="40" y="56" width="680" height="160" rx="6" fill="none" stroke="var(--slate)" stroke-dasharray="5 4"/><text x="56" y="76" font-size="12.5" text-anchor="start" fill="var(--slate-deep)">Step：importStep（一個 Job 可以有好幾個 Step，依序執行）</text><rect x="70" y="100" width="150" height="56" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="145.0" y="125.0" font-size="13.5" text-anchor="middle">ItemReader</text><text x="145.0" y="143.0" font-size="11.5" text-anchor="middle" opacity=".7">一次讀一筆</text><rect x="300" y="100" width="150" height="56" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="375.0" y="125.0" font-size="13.5" text-anchor="middle">ItemProcessor</text><text x="375.0" y="143.0" font-size="11.5" text-anchor="middle" opacity=".7">一次處理一筆</text><rect x="530" y="100" width="160" height="56" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="610.0" y="125.0" font-size="13.5" text-anchor="middle">ItemWriter</text><text x="610.0" y="143.0" font-size="11.5" text-anchor="middle" opacity=".7">一次寫一整個 chunk</text><line x1="222" y1="128" x2="298" y2="128" stroke="currentColor" stroke-opacity=".65" stroke-width="1.5" marker-end="url(#sb2-m1)"/><line x1="452" y1="128" x2="528" y2="128" stroke="currentColor" stroke-opacity=".65" stroke-width="1.5" marker-end="url(#sb2-m1)"/><text x="260" y="120" font-size="11.5" text-anchor="middle" class="mono">×1000</text><text x="490" y="120" font-size="11.5" text-anchor="middle">湊滿 1000</text><path d="M610 158 Q610 200 380 200 Q150 200 145 160" fill="none" stroke="var(--slate)" stroke-width="1.5" marker-end="url(#sb2-m1)"/><text x="380" y="194" font-size="12" text-anchor="middle" fill="var(--slate-deep)">提交交易，再讀下一個 chunk</text><text x="30" y="254" font-size="12" text-anchor="start" opacity=".6">chunk 大小 1000：讀 1000 筆、逐筆處理、一次寫出、提交一次交易；1 萬筆就是 10 次提交</text>
</svg>
