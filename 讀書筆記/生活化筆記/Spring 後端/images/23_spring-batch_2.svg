<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 294" aria-label="JobInstance 與 JobExecution，取自實跑。JobInstance 1 是 runDate 2025-10-01，它的 JobExecution 1 成功；再用同樣的參數跑會被拒絕。JobInstance 2 是 runDate 2025-10-02，JobExecution 2 失敗，修好之後用同樣的參數再跑，產生 JobExecution 3 並成功，兩次執行屬於同一個 JobInstance" width="784" height="294">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="294" fill="#FFFFFF" stroke="none"/>
<defs><marker id="sb2-m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><rect x="30" y="40" width="230" height="54" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="145.0" y="64.0" font-size="13.5" text-anchor="middle">JobInstance 1</text><text x="145.0" y="82.0" font-size="11.5" text-anchor="middle" opacity=".7">runDate=2025-10-01</text><rect x="30" y="150" width="230" height="54" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="145.0" y="174.0" font-size="13.5" text-anchor="middle">JobInstance 2</text><text x="145.0" y="192.0" font-size="11.5" text-anchor="middle" opacity=".7">runDate=2025-10-02</text><rect x="340" y="40" width="170" height="54" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="425.0" y="64.0" font-size="13.5" text-anchor="middle">JobExecution 1</text><text x="425.0" y="82.0" font-size="11.5" text-anchor="middle" opacity=".7">COMPLETED</text><rect x="340" y="130" width="170" height="44" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="425.0" y="149.0" font-size="13.5" text-anchor="middle">JobExecution 2</text><text x="425.0" y="167.0" font-size="11.5" text-anchor="middle" opacity=".7">FAILED</text><rect x="340" y="186" width="170" height="44" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="425.0" y="205.0" font-size="13.5" text-anchor="middle">JobExecution 3</text><text x="425.0" y="223.0" font-size="11.5" text-anchor="middle" opacity=".7">COMPLETED</text><line x1="262" y1="67" x2="338" y2="67" stroke="currentColor" stroke-opacity=".65" stroke-width="1.5" marker-end="url(#sb2-m2)"/><line x1="262" y1="170" x2="338" y2="152" stroke="currentColor" stroke-opacity=".65" stroke-width="1.5" marker-end="url(#sb2-m2)"/><line x1="262" y1="184" x2="338" y2="206" stroke="currentColor" stroke-opacity=".65" stroke-width="1.5" marker-end="url(#sb2-m2)"/><rect x="580" y="40" width="160" height="54" rx="6" fill="var(--surface)" stroke="currentColor" stroke-dasharray="4 3" opacity=".7"/><text x="660" y="62" font-size="12.5" text-anchor="middle">再用 2025-10-01 跑</text><text x="660" y="80" font-size="12" text-anchor="middle" fill="var(--gold-deep)">被拒絕</text><line x1="578" y1="67" x2="514" y2="67" stroke="currentColor" stroke-opacity=".65" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#sb2-m2)"/><text x="530" y="162" font-size="11.5" text-anchor="start" opacity=".75">修好之後同參數再跑：</text><text x="530" y="180" font-size="11.5" text-anchor="start" opacity=".75">同一個 JobInstance</text><text x="530" y="198" font-size="11.5" text-anchor="start" opacity=".75">多一次 JobExecution</text><text x="30" y="256" font-size="12" text-anchor="start" opacity=".6">灰藍＝JobInstance（Job 加上識別用參數，一個營業日一個）；古銅＝成功的 JobExecution（每跑一次一個）</text>
</svg>
