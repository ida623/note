001–6000</text><rect x="462" y="40" width="68" height="40" rx="4" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="496.0" y="58" font-size="11.5" text-anchor="middle" class="mono">chunk 7</text><text x="496.0" y="74" font-size="10" text-anchor="middle" opacity=".7" class="mono">6001–7000</text><text x="496.0" y="100" font-size="11" text-anchor="middle" fill="var(--slate-deep)">跳過 1 筆</text><rect x="534" y="40" width="68" height="40" rx="4" fill="var(--surface)" stroke="var(--gold-deep)" stroke-dasharray="4 3"/><text x="568.0" y="58" font-size="11.5" text-anchor="middle" class="mono">chunk 8</text><text x="568.0" y="74" font-size="10" text-anchor="middle" opacity=".7" class="mono">7001–8000</text><text x="568.0" y="100" font-size="11" text-anchor="middle" fill="var(--gold-deep)">寫入失敗，還原</text><rect x="606" y="40" width="68" height="40" rx="4" fill="var(--surface)" stroke="currentColor" stroke-dasharray="4 3" opacity=".35"/><text x="640.0" y="58" font-size="11.5" text-anchor="middle" opacity=".5" class="mono">chunk 9</text><text x="640.0" y="74" font-size="10" text-anchor="middle" opacity=".7" class="mono">8001–9000</text><rect x="678" y="40" width="68" height="40" rx="4" fill="var(--surface)" stroke="currentColor" stroke-dasharray="4 3" opacity=".35"/><text x="712.0" y="58" font-size="11.5" text-anchor="middle" opacity=".5" class="mono">chunk 10</text><text x="712.0" y="74" font-size="10" text-anchor="middle" opacity=".7" class="mono">9001–10000</text><text x="30" y="124" font-size="12" text-anchor="start">提交 7 次（chunk 1–7），chunk 8 還原；斷點記下 txReader.read.count = 7000</text><text x="30" y="160" font-size="13" text-anchor="start" fill="var(--gold-deep)">JobExecution 3（修好欄位後，同參數重跑）</text><rect x="30" y="174" width="68" height="40" rx="4" fill="var(--surface)" stroke="currentColor" opacity=".3"/><text x="64.0" y="198" font-size="11" text-anchor="middle" opacity=".45">不重讀</text><rect x="102" y="174" width="68" height="40" rx="4" fill="var(--surface)" stroke="currentColor" opacity=".3"/><text x="136.0" y="198" font-size="11" text-anchor="middle" opacity=".45">不重讀</text><rect x="174" y="174" width="68" height="40" rx="4" fill="var(--surface)" stroke="currentColor" opacity=".3"/><text x="208.0" y="198" font-size="11" text-anchor="middle" opacity=".45">不重讀</text><rect x="246" y="174" width="68" height="40" rx="4" fill="var(--surface)" stroke="currentColor" opacity=".3"/><text x="280.0" y="198" font-size="11" text-anchor="middle" opacity=".45">不重讀</text><rect x="318" y="174" width="68" height="40" rx="4" fill="var(--surface)" stroke="currentColor" opacity=".3"/><text x="352.0" y="198" font-size="11" text-anchor="middle" opacity=".45">不重讀</text><rect x="390" y="174" width="68" height="40" rx="4" fill="var(--surface)" stroke="currentColor" opacity=".3"/><text x="424.0" y="198" font-size="11" text-anchor="middle" opacity=".45">不重讀</text><rect x="462" y="174" width="68" height="40" rx="4" fill="var(--surface)" stroke="currentColor" opacity=".3"/><text x="496.0" y="198" font-size="11" text-anchor="middle" opacity=".45">不重讀</text><rect x="534" y="174" width="68" height="40" rx="4" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="568.0" y="192" font-size="11.5" text-anchor="middle" class="mono">chunk 8</text><text x="568.0" y="208" font-size="10" text-anchor="middle" opacity=".7" class="mono">7001–8000</text><rect x="606" y="174" width="68" height="40" rx="4" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="640.0" y="192" font-size="11.5" text-anchor="middle" class="mono">chunk 9</text><text x="640.0" y="208" font-size="10" text-anchor="middle" opacity=".7" class="mono">8001–9000</text><rect x="678" y="174" width="68" height="40" rx="4" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="712.0" y="192" font-size="11.5" text-anchor="middle" class="mono">chunk 10</text><text x="712.0" y="208" font-size="10" text-anchor="middle" opacity=".7" class="mono">9001–10000</text><text x="30" y="238" font-size="12" text-anchor="start">從第 7001 筆接著讀，READ_COUNT 3000、COMMIT_COUNT 3；兩次加起來寫入 6998 + 3000 = 9998 筆</text><text x="30" y="262" font-size="12" text-anchor="start" opacity=".6">古銅實框＝已提交；虛線框＝這次沒有提交；數字是交易檔的第幾筆</text>
