<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 300" aria-label="失敗與重啟的 chunk 圖，取自實跑。第一次跑：chunk 1 到 7 提交，chunk 3 濾掉 1 筆、chunk 5 重試一次後成功、chunk 7 跳過 1 筆，chunk 8 寫入失敗被還原，之後的 chunk 沒有執行，斷點記下讀到第 7000 筆。修好欄位後用同樣的參數重跑：chunk 1 到 7 不重讀，從第 7001 筆接著做 chunk 8 到 10，提交 3 次，兩次共寫入 9998 筆" width="784" height="300">
<style>
