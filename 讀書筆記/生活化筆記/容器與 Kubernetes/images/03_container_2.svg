<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 804 292" aria-label="虛擬機之間隔著各自的作業系統與 Hypervisor 兩道牆；容器之間只隔著共用的同一套作業系統一道牆，那套作業系統若有漏洞就可能被跨過去" width="804" height="292">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="804" height="292" fill="#FFFFFF" stroke="none"/>
        <text x="196" y="24" font-size="14" text-anchor="middle" font-weight="700">虛擬機之間</text>
        <text x="584" y="24" font-size="14" text-anchor="middle" font-weight="700">容器之間</text>
        <line x1="390" y1="14" x2="390" y2="222" stroke="currentColor" stroke-opacity=".2" stroke-dasharray="4 5"/>

        <rect x="20" y="40" width="150" height="52" rx="5" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
        <text x="95" y="72" font-size="13" text-anchor="middle" fill="var(--gold)">虛擬機 A</text>
        <rect x="222" y="40" width="150" height="52" rx="5" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
        <text x="297" y="72" font-size="13" text-anchor="middle" fill="var(--gold)">虛擬機 B</text>

        <rect x="20" y="100" width="150" height="34" rx="4" fill="var(--slate-soft)" stroke="var(--slate)" stroke-width="2"/>
        <text x="95" y="122" font-size="11.5" text-anchor="middle" fill="var(--slate)">A 自己的作業系統</text>
        <rect x="222" y="100" width="150" height="34" rx="4" fill="var(--slate-soft)" stroke="var(--slate)" stroke-width="2"/>
        <text x="297" y="122" font-size="11.5" text-anchor="middle" fill="var(--slate)">B 自己的作業系統</text>

        <rect x="20" y="142" width="352" height="34" rx="4" fill="var(--slate-soft)" stroke="var(--slate)" stroke-width="2"/>
        <text x="196" y="164" font-size="12" text-anchor="middle" fill="var(--slate)">Hypervisor</text>

        <text x="196" y="200" font-size="12.5" text-anchor="middle" fill="var(--gold)">中間隔了兩道</text>
        <text x="196" y="218" font-size="12.5" text-anchor="middle" fill="var(--gold)">要從 A 爬到 B，很難</text>

        <rect x="408" y="40" width="150" height="52" rx="5" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
        <text x="483" y="72" font-size="13" text-anchor="middle" fill="var(--gold)">容器 A</text>
        <rect x="610" y="40" width="150" height="52" rx="5" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
        <text x="685" y="72" font-size="13" text-anchor="middle" fill="var(--gold)">容器 B</text>

        <rect x="408" y="100" width="352" height="34" rx="4" fill="var(--slate-soft)" stroke="var(--danger)" stroke-width="2"/>
        <text x="584" y="122" font-size="12" text-anchor="middle" fill="var(--danger)">同一套作業系統（兩邊共用）</text>

        <text x="584" y="164" font-size="12.5" text-anchor="middle" fill="var(--danger)">中間只隔了一道，而且是共用的</text>
        <text x="584" y="184" font-size="12.5" text-anchor="middle" fill="var(--danger)">這一道若有漏洞，就可能從 A 爬到 B</text>
        <text x="584" y="212" font-size="11.5" text-anchor="middle" opacity=".7">平常不會發生，但「不可能」和「很難」是兩回事</text>

        <rect x="20" y="234" width="740" height="26" rx="4" fill="none" stroke="currentColor" stroke-opacity=".3"/>
        <text x="390" y="252" font-size="12.5" text-anchor="middle" opacity=".8">所以法遵要求「不同客戶的東西不能跑在同一個作業系統上」時，只能用虛擬機</text>
      </svg>
