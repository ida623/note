<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 804 368" aria-label="叢集分成三台 master node 跑大腦角色，其中一台是檔案室的主、一台正在做排班工作，另外三台 worker node 跑你的 Pod" width="804" height="368">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="804" height="368" fill="#FFFFFF" stroke="none"/>
        <rect x="16" y="30" width="352" height="252" rx="6" fill="none" stroke="var(--slate)" stroke-width="2"/>
        <text x="30" y="50" font-size="12" fill="var(--slate)" font-weight="700">master node × 3（跑大腦，不跑你的程式）</text>
        <rect x="30" y="60" width="324" height="66" rx="5" fill="none" stroke="var(--slate)"/>
        <text x="44" y="99" font-size="12.5" fill="var(--slate)">master 1</text>
        <rect x="116" y="72" width="106" height="42" rx="4" fill="var(--slate-soft)" stroke="var(--slate)"/>
        <text x="169" y="89" font-size="10.5" text-anchor="middle" fill="var(--slate)">檔案室</text>
        <text x="169" y="105" font-size="10.5" text-anchor="middle" fill="var(--slate)">主</text>
        <rect x="232" y="72" width="110" height="42" rx="4" fill="var(--slate-soft)" stroke="var(--slate)"/>
        <text x="287" y="89" font-size="10.5" text-anchor="middle" fill="var(--slate)">排班／巡邏</text>
        <text x="287" y="105" font-size="10.5" text-anchor="middle" fill="var(--slate)">做事中</text>
        <rect x="30" y="134" width="324" height="66" rx="5" fill="none" stroke="currentColor" stroke-opacity=".45"/>
        <text x="44" y="173" font-size="12.5" opacity=".7">master 2</text>
        <rect x="116" y="146" width="106" height="42" rx="4" fill="none" stroke="currentColor" stroke-opacity=".45"/>
        <text x="169" y="163" font-size="10.5" text-anchor="middle" opacity=".7">檔案室</text>
        <text x="169" y="179" font-size="10.5" text-anchor="middle" opacity=".7">副本</text>
        <rect x="232" y="146" width="110" height="42" rx="4" fill="none" stroke="currentColor" stroke-opacity=".45"/>
        <text x="287" y="163" font-size="10.5" text-anchor="middle" opacity=".7">排班／巡邏</text>
        <text x="287" y="179" font-size="10.5" text-anchor="middle" opacity=".7">待命</text>
        <rect x="30" y="208" width="324" height="66" rx="5" fill="none" stroke="currentColor" stroke-opacity=".45"/>
        <text x="44" y="247" font-size="12.5" opacity=".7">master 3</text>
        <rect x="116" y="220" width="106" height="42" rx="4" fill="none" stroke="currentColor" stroke-opacity=".45"/>
        <text x="169" y="237" font-size="10.5" text-anchor="middle" opacity=".7">檔案室</text>
        <text x="169" y="253" font-size="10.5" text-anchor="middle" opacity=".7">副本</text>
        <rect x="232" y="220" width="110" height="42" rx="4" fill="none" stroke="currentColor" stroke-opacity=".45"/>
        <text x="287" y="237" font-size="10.5" text-anchor="middle" opacity=".7">排班／巡邏</text>
        <text x="287" y="253" font-size="10.5" text-anchor="middle" opacity=".7">待命</text>

        <line x1="374" y1="156" x2="404" y2="156" stroke="currentColor" stroke-opacity=".5" stroke-width="2" marker-end="url(#q1)"/>
        <text x="389" y="144" font-size="10" text-anchor="middle" opacity=".6">指揮</text>

        <rect x="412" y="30" width="352" height="252" rx="6" fill="none" stroke="var(--gold)" stroke-width="2"/>
        <text x="426" y="50" font-size="12" fill="var(--gold)" font-weight="700">worker node × 3（跑你的 Pod）</text>
        <g fill="none" stroke="currentColor" stroke-opacity=".6">
          <rect x="426" y="60" width="324" height="66" rx="5"/>
          <rect x="426" y="134" width="324" height="66" rx="5"/>
          <rect x="426" y="208" width="324" height="66" rx="5"/>
        </g>
        <g font-size="12.5" opacity=".7">
          <text x="440" y="99">worker 1</text><text x="440" y="173">worker 2</text><text x="440" y="247">worker 3</text>
        </g>
        <g fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="1.6">
          <rect x="516" y="72" width="106" height="42" rx="4"/>
          <rect x="632" y="72" width="106" height="42" rx="4"/>
          <rect x="516" y="146" width="106" height="42" rx="4"/>
          <rect x="632" y="146" width="106" height="42" rx="4"/>
          <rect x="516" y="220" width="106" height="42" rx="4"/>
        </g>
        <rect x="632" y="220" width="106" height="42" rx="4" fill="none" stroke="currentColor" stroke-opacity=".25" stroke-dasharray="5 4"/>
        <g font-size="11.5" text-anchor="middle" fill="var(--gold)">
          <text x="569" y="99">Pod</text><text x="685" y="99">Pod</text>
          <text x="569" y="173">Pod</text><text x="685" y="173">Pod</text>
          <text x="569" y="247">Pod</text>
        </g>
        <text x="685" y="246" font-size="10.5" text-anchor="middle" opacity=".4">空位</text>
        <text x="390" y="312" font-size="13" text-anchor="middle" opacity=".78">master 擺奇數台的理由：很多決定要「超過半數同意」才算數</text>
        <text x="390" y="332" font-size="12" text-anchor="middle" fill="var(--danger)">3 台可以死 1 台，5 台可以死 2 台，2 台死 1 台就完蛋（過不了半數）</text>
        <defs>
          <marker id="q1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="currentColor" fill-opacity=".5"/></marker>
        </defs>
      </svg>
