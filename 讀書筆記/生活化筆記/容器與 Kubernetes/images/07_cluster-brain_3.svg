<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 804 330" aria-label="master node 和 worker node 底層都有容器執行環境、kubelet、kube-proxy 三樣共通的東西，master 額外多跑四個大腦角色，worker 上面跑你的程式" width="804" height="330">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="804" height="330" fill="#FFFFFF" stroke="none"/>
        <rect x="16" y="30" width="364" height="230" rx="6" fill="none" stroke="var(--slate)" stroke-width="2"/>
        <text x="30" y="50" font-size="12" fill="var(--slate)" font-weight="700">master node</text>
        <g fill="var(--slate-soft)" stroke="var(--slate)" stroke-width="1.6">
          <rect x="30" y="60" width="166" height="50" rx="4"/><rect x="204" y="60" width="166" height="50" rx="4"/>
          <rect x="30" y="118" width="166" height="50" rx="4"/><rect x="204" y="118" width="166" height="50" rx="4"/>
        </g>
        <g font-size="12" text-anchor="middle" fill="var(--slate)">
          <text x="113" y="82">櫃檯</text><text x="287" y="82">檔案室</text>
          <text x="113" y="140">排班的</text><text x="287" y="140">巡邏的</text>
        </g>
        <g font-size="9.5" text-anchor="middle" fill="var(--slate)" class="mono">
          <text x="113" y="99">kube-apiserver</text><text x="287" y="99">etcd</text>
          <text x="113" y="157">kube-scheduler</text><text x="287" y="157">kube-controller-manager</text>
        </g>

        <rect x="400" y="30" width="364" height="230" rx="6" fill="none" stroke="var(--gold)" stroke-width="2"/>
        <text x="414" y="50" font-size="12" fill="var(--gold)" font-weight="700">worker node</text>
        <g fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="1.6">
          <rect x="414" y="60" width="166" height="50" rx="4"/><rect x="588" y="60" width="166" height="50" rx="4"/>
          <rect x="414" y="118" width="166" height="50" rx="4"/><rect x="588" y="118" width="166" height="50" rx="4"/>
        </g>
        <g font-size="12" text-anchor="middle" fill="var(--gold)">
          <text x="497" y="90">你的 Pod</text><text x="671" y="90">你的 Pod</text>
          <text x="497" y="148">你的 Pod</text><text x="671" y="148">你的 Pod</text>
        </g>

        <rect x="16" y="178" width="748" height="70" rx="5" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/>
        <text x="28" y="196" font-size="11" opacity=".7">兩邊都有，一模一樣</text>
        <g fill="none" stroke="currentColor" stroke-opacity=".75">
          <rect x="30" y="202" width="110" height="38" rx="4"/><rect x="148" y="202" width="110" height="38" rx="4"/><rect x="266" y="202" width="104" height="38" rx="4"/>
          <rect x="414" y="202" width="110" height="38" rx="4"/><rect x="532" y="202" width="110" height="38" rx="4"/><rect x="650" y="202" width="104" height="38" rx="4"/>
        </g>
        <g font-size="10.5" text-anchor="middle" opacity=".85">
          <text x="85" y="219">容器執行環境</text><text x="203" y="219">聯絡窗口</text><text x="318" y="219">轉發表</text>
          <text x="469" y="219">容器執行環境</text><text x="587" y="219">聯絡窗口</text><text x="702" y="219">轉發表</text>
        </g>
        <g font-size="9.5" text-anchor="middle" opacity=".6" class="mono">
          <text x="85" y="234">containerd</text><text x="203" y="234">kubelet</text><text x="318" y="234">kube-proxy</text>
          <text x="469" y="234">containerd</text><text x="587" y="234">kubelet</text><text x="702" y="234">kube-proxy</text>
        </g>

        <text x="390" y="282" font-size="13" text-anchor="middle" opacity=".8">差別只在上半部：master 跑那四個角色，worker 跑你的程式</text>
        <text x="390" y="300" font-size="11.5" text-anchor="middle" opacity=".6">正式環境會設定成「你的 Pod 不准排到 master 上」，讓大腦不被業務流量拖累</text>
      </svg>
