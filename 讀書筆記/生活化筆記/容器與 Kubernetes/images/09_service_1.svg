<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 804 372" aria-label="兩個互相垂直的軸：實體堆疊是機器包 Pod 包容器，流量路徑是呼叫方經過 Service 到 Pod，Service 不出現在實體堆疊裡" width="804" height="372">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="804" height="372" fill="#FFFFFF" stroke="none"/>
        <text x="186" y="26" font-size="13.5" text-anchor="middle" font-weight="700">① 東西住在哪裡</text>
        <text x="186" y="46" font-size="11.5" text-anchor="middle" opacity=".65">一層包一層，往下看</text>
        <rect x="46" y="60" width="280" height="200" rx="6" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="60" y="80" font-size="12" opacity=".7">機器（Node）</text>
        <rect x="66" y="90" width="240" height="152" rx="5" fill="none" stroke="currentColor" stroke-dasharray="5 4"/>
        <text x="80" y="110" font-size="12" opacity=".7">Pod</text>
        <rect x="86" y="120" width="200" height="104" rx="4" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
        <text x="186" y="146" font-size="12.5" text-anchor="middle" fill="var(--gold)">容器</text>
        <rect x="106" y="158" width="160" height="50" rx="3" fill="none" stroke="var(--gold)"/>
        <text x="186" y="188" font-size="13" text-anchor="middle" fill="var(--gold)">你的程式</text>
        <line x1="390" y1="40" x2="390" y2="288" stroke="currentColor" stroke-opacity=".2" stroke-dasharray="4 5"/>
        <text x="580" y="26" font-size="13.5" text-anchor="middle" font-weight="700">② 請求怎麼走</text>
        <text x="580" y="46" font-size="11.5" text-anchor="middle" opacity=".65">一站接一站，往右看</text>
        <rect x="430" y="118" width="88" height="60" rx="5" fill="none" stroke="currentColor"/>
        <text x="474" y="144" font-size="12.5" text-anchor="middle">呼叫方</text>
        <text x="474" y="162" font-size="10" text-anchor="middle" opacity=".55">人或 Pod</text>
        <line x1="526" y1="148" x2="562" y2="148" stroke="var(--gold)" stroke-width="2" marker-end="url(#o1)"/>
        <rect x="570" y="118" width="88" height="60" rx="5" fill="none" stroke="var(--gold)" stroke-width="2" stroke-dasharray="5 4"/>
        <text x="614" y="144" font-size="12.5" text-anchor="middle" fill="var(--gold)">Service</text>
        <text x="614" y="162" font-size="10" text-anchor="middle" fill="var(--gold)">一個名字</text>
        <line x1="666" y1="148" x2="702" y2="148" stroke="var(--gold)" stroke-width="2" marker-end="url(#o1)"/>
        <rect x="710" y="118" width="56" height="60" rx="5" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
        <text x="738" y="153" font-size="12.5" text-anchor="middle" fill="var(--gold)">Pod</text>
        <text x="580" y="212" font-size="11.5" text-anchor="middle" opacity=".7">呼叫方是外面的使用者，或是另一個 Pod</text>
        <text x="580" y="232" font-size="11.5" text-anchor="middle" opacity=".7">都是同一件事，Service 兩邊長一樣</text>
        <rect x="46" y="288" width="720" height="46" rx="5" fill="none" stroke="var(--danger)" stroke-dasharray="6 4"/>
        <text x="406" y="316" font-size="13.5" text-anchor="middle" fill="var(--danger)">左邊那張圖裡找不到 Service —— 因為它根本不是「東西住的地方」</text>
        <defs>
          <marker id="o1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="var(--gold)"/></marker>
        </defs>
      </svg>
