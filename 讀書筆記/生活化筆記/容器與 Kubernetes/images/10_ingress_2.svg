<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 804 500" aria-label="兩種請求路徑：純前端那包時瀏覽器分別打到前端與後端兩個 Service，前後端 Pod 互不通訊；伺服器端幫忙轉時則由前端 Pod 再去打後端的 Service" width="804" height="500">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="804" height="500" fill="#FFFFFF" stroke="none"/>
        <text x="16" y="22" font-size="13" font-weight="700">情況一：純前端那一包（打 API 的程式在瀏覽器裡跑）</text>
        <rect x="16" y="76" width="96" height="54" rx="5" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="64" y="108" font-size="13" text-anchor="middle">瀏覽器</text>
        <line x1="120" y1="103" x2="138" y2="103" stroke="currentColor" stroke-width="2" marker-end="url(#r1)"/>
        <rect x="146" y="76" width="110" height="54" rx="5" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="201" y="100" font-size="12.5" text-anchor="middle">對外入口</text>
        <text x="201" y="118" font-size="10" text-anchor="middle" opacity=".6">依網址分路</text>
        <path d="M256 90 C282 90 278 64 298 64" fill="none" stroke="var(--gold)" stroke-width="2" marker-end="url(#r2)"/>
        <text x="278" y="46" font-size="11" text-anchor="middle" class="mono" fill="var(--gold)">/</text>
        <path d="M256 116 C282 116 278 142 298 142" fill="none" stroke="var(--gold)" stroke-width="2" marker-end="url(#r2)"/>
        <text x="280" y="168" font-size="11" text-anchor="middle" class="mono" fill="var(--gold)">/api</text>
        <rect x="304" y="38" width="136" height="52" rx="5" fill="none" stroke="var(--gold)" stroke-width="2" stroke-dasharray="5 4"/>
        <text x="372" y="60" font-size="12.5" text-anchor="middle" fill="var(--gold)">Service</text>
        <text x="372" y="78" font-size="11" text-anchor="middle" fill="var(--gold)" class="mono">frontend</text>
        <line x1="444" y1="64" x2="466" y2="64" stroke="var(--gold)" stroke-width="2" marker-end="url(#r2)"/>
        <rect x="472" y="38" width="130" height="52" rx="5" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
        <text x="537" y="70" font-size="13" text-anchor="middle" fill="var(--gold)">前端 Pod</text>
        <rect x="304" y="116" width="136" height="52" rx="5" fill="none" stroke="var(--gold)" stroke-width="2" stroke-dasharray="5 4"/>
        <text x="372" y="138" font-size="12.5" text-anchor="middle" fill="var(--gold)">Service</text>
        <text x="372" y="156" font-size="11" text-anchor="middle" fill="var(--gold)" class="mono">backend</text>
        <line x1="444" y1="142" x2="466" y2="142" stroke="var(--gold)" stroke-width="2" marker-end="url(#r2)"/>
        <rect x="472" y="116" width="130" height="52" rx="5" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
        <text x="537" y="148" font-size="13" text-anchor="middle" fill="var(--gold)">後端 Pod</text>
        <line x1="537" y1="96" x2="537" y2="110" stroke="var(--danger)" stroke-width="2"/>
        <line x1="529" y1="96" x2="545" y2="110" stroke="var(--danger)" stroke-width="2"/>
        <line x1="545" y1="96" x2="529" y2="110" stroke="var(--danger)" stroke-width="2"/>
        <text x="622" y="98" font-size="11.5" fill="var(--danger)">這兩個 Pod</text>
        <text x="622" y="116" font-size="11.5" fill="var(--danger)">從來不講話</text>
        <text x="16" y="196" font-size="12" opacity=".7">前端 Pod 只負責把畫面那包檔案送給瀏覽器，之後打 API 的是瀏覽器自己。</text>

        <line x1="16" y1="216" x2="764" y2="216" stroke="currentColor" stroke-opacity=".18"/>

        <text x="16" y="248" font-size="13" font-weight="700">情況二：伺服器端幫忙轉（SSR，或前面擺一層組裝資料的服務）</text>
        <rect x="16" y="288" width="96" height="54" rx="5" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="64" y="320" font-size="13" text-anchor="middle">瀏覽器</text>
        <line x1="120" y1="315" x2="136" y2="315" stroke="currentColor" stroke-width="2" marker-end="url(#r1)"/>
        <rect x="142" y="288" width="110" height="54" rx="5" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="197" y="320" font-size="12.5" text-anchor="middle">對外入口</text>
        <line x1="260" y1="315" x2="276" y2="315" stroke="var(--gold)" stroke-width="2" marker-end="url(#r2)"/>
        <rect x="282" y="288" width="136" height="54" rx="5" fill="none" stroke="var(--gold)" stroke-width="2" stroke-dasharray="5 4"/>
        <text x="350" y="311" font-size="12.5" text-anchor="middle" fill="var(--gold)">Service</text>
        <text x="350" y="329" font-size="11" text-anchor="middle" fill="var(--gold)" class="mono">frontend</text>
        <line x1="426" y1="315" x2="442" y2="315" stroke="var(--gold)" stroke-width="2" marker-end="url(#r2)"/>
        <rect x="448" y="288" width="130" height="54" rx="5" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
        <text x="513" y="320" font-size="13" text-anchor="middle" fill="var(--gold)">前端 Pod</text>
        <text x="527" y="370" font-size="11" fill="var(--gold)">它自己去打後端</text>
        <rect x="286" y="386" width="136" height="54" rx="5" fill="none" stroke="var(--gold)" stroke-width="2" stroke-dasharray="5 4"/>
        <text x="354" y="409" font-size="12.5" text-anchor="middle" fill="var(--gold)">Service</text>
        <text x="354" y="427" font-size="11" text-anchor="middle" fill="var(--gold)" class="mono">backend</text>
        <path d="M513 348 L513 372 L440 372 L440 400 L430 400" fill="none" stroke="var(--gold)" stroke-width="2" marker-end="url(#r2)"/>
        <rect x="596" y="386" width="148" height="54" rx="5" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
        <text x="670" y="418" font-size="13" text-anchor="middle" fill="var(--gold)">後端 Pod</text>
        <line x1="426" y1="413" x2="590" y2="413" stroke="var(--gold)" stroke-width="2" marker-end="url(#r2)"/>
        <text x="16" y="466" font-size="12.5" fill="var(--gold)">兩種情況都一樣：前端有前端的 Service，後端有後端的 Service，請求一路往前走，不會繞回去。</text>
        <defs>
          <marker id="r1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="currentColor"/></marker>
          <marker id="r2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="var(--gold)"/></marker>
        </defs>
      </svg>
