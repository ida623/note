<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 234" aria-label="Pod 啟動後先跑啟動探針，成功之後存活探針與就緒探針才開始，兩者在整個生命週期都定期跑；存活失敗重啟容器，就緒失敗只是不再收流量" width="784" height="234">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="234" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="dp2-2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor" fill-opacity=".6"/></marker></defs>
  <line x1="30" y1="180" x2="740" y2="180" stroke="currentColor" stroke-opacity=".5" stroke-width="1.5" marker-end="url(#dp2-2-arrow)"/>
  <text x="30" y="200" font-size="12" opacity=".75">容器啟動</text>
  <text x="250" y="200" font-size="12" opacity=".75">啟動探針成功</text>
  <text x="700" y="200" font-size="12" opacity=".75" text-anchor="end">時間 →</text>
  <line x1="250" y1="30" x2="250" y2="182" stroke="currentColor" stroke-opacity=".35" stroke-dasharray="5 4"/>
  <rect x="30" y="40" width="215" height="34" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/>
  <text x="137" y="62" font-size="12.5" text-anchor="middle">啟動探針：只在這段跑</text>
  <rect x="255" y="88" width="470" height="34" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="490" y="110" font-size="12.5" text-anchor="middle">存活探針：失敗夠多次 → 重啟容器</text>
  <rect x="255" y="132" width="470" height="34" rx="6" fill="var(--surface)" stroke="currentColor"/>
  <text x="490" y="154" font-size="12.5" text-anchor="middle">就緒探針：失敗 → 不送流量，不重啟</text>
  <text x="137" y="100" font-size="11.5" text-anchor="middle" opacity=".75">這段期間另外兩種不跑</text>
  <text x="137" y="116" font-size="11.5" text-anchor="middle" opacity=".75">失敗太多次 → 殺掉重來</text>
</svg>
