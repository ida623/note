<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 314" aria-label="Lambda 執行環境的生命週期：冷啟動是準備環境、下載程式碼、Init 階段跑 handler 以外的靜態初始化，再跑 Invoke；跑完環境被凍結，下一個請求來了解凍直接 Invoke，叫熱啟動；SnapStart 在發佈版本時先做 Init 並拍下快照，之後新環境從快照 Restore 再 Invoke" width="784" height="314">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="314" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="sm-04-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <text x="20" y="30" font-size="14" fill="var(--danger)">冷啟動</text>
  <rect x="100" y="12" width="170" height="44" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="185" y="39" font-size="12.5" text-anchor="middle">準備環境、下載程式碼</text>
  <rect x="290" y="12" width="170" height="44" rx="8" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
  <text x="375" y="39" font-size="12.5" text-anchor="middle">Init：handler 外的初始化</text>
  <rect x="480" y="12" width="110" height="44" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="535" y="39" font-size="13" text-anchor="middle">Invoke</text>
  <rect x="610" y="12" width="130" height="44" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="675" y="39" font-size="12.5" text-anchor="middle">凍結，等下一個</text>
  <line x1="270" y1="34" x2="288" y2="34" stroke="currentColor" stroke-width="1.6" marker-end="url(#sm-04-arrow)"/>
  <line x1="460" y1="34" x2="478" y2="34" stroke="currentColor" stroke-width="1.6" marker-end="url(#sm-04-arrow)"/>
  <line x1="590" y1="34" x2="608" y2="34" stroke="currentColor" stroke-width="1.6" marker-end="url(#sm-04-arrow)"/>
  <text x="20" y="112" font-size="14" fill="var(--gold)">熱啟動</text>
  <rect x="290" y="94" width="170" height="44" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="375" y="121" font-size="12.5" text-anchor="middle">解凍同一個環境</text>
  <rect x="480" y="94" width="110" height="44" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="535" y="121" font-size="13" text-anchor="middle">Invoke</text>
  <line x1="460" y1="116" x2="478" y2="116" stroke="currentColor" stroke-width="1.6" marker-end="url(#sm-04-arrow)"/>
  <text x="100" y="121" font-size="12.5" opacity=".75">Init 那些不再跑</text>
  <text x="20" y="196" font-size="14" fill="var(--slate)">SnapStart</text>
  <rect x="100" y="172" width="190" height="44" rx="8" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
  <text x="195" y="199" font-size="12.5" text-anchor="middle">發佈版本時先做 Init</text>
  <rect x="310" y="172" width="150" height="44" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="385" y="199" font-size="12.5" text-anchor="middle">拍快照、加密、快取</text>
  <rect x="480" y="172" width="110" height="44" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="535" y="199" font-size="13" text-anchor="middle">Restore</text>
  <rect x="610" y="172" width="130" height="44" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="675" y="199" font-size="13" text-anchor="middle">Invoke</text>
  <line x1="290" y1="194" x2="308" y2="194" stroke="currentColor" stroke-width="1.6" marker-end="url(#sm-04-arrow)"/>
  <line x1="460" y1="194" x2="478" y2="194" stroke="currentColor" stroke-width="1.6" marker-end="url(#sm-04-arrow)"/>
  <line x1="590" y1="194" x2="608" y2="194" stroke="currentColor" stroke-width="1.6" marker-end="url(#sm-04-arrow)"/>
  <text x="100" y="250" font-size="12.5" opacity=".75">發佈時做一次</text>
  <text x="480" y="250" font-size="12.5" opacity=".75">每個新環境：從快照恢復，不必從頭 Init</text>
</svg>
