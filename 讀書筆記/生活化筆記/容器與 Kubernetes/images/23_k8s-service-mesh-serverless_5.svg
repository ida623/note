  <text x="255" y="65" font-size="13" text-anchor="middle">執行環境 1</text>
  <rect x="20" y="92" width="80" height="40" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="60" y="117" font-size="13" text-anchor="middle">請求 2</text>
  <line x1="100" y1="112" x2="178" y2="112" stroke="currentColor" stroke-width="1.6" marker-end="url(#sm-05-arrow)"/>
