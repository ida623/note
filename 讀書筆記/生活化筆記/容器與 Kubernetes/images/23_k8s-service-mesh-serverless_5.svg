  <line x1="480" y1="164" x2="578" y2="92" stroke="currentColor" stroke-width="1.6" marker-end="url(#sm-05-arrow)"/>
  <rect x="580" y="62" width="160" height="60" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="660" y="89" font-size="13.5" text-anchor="middle">執行個體 1</text>
