  <line x1="100" y1="164" x2="178" y2="164" stroke="currentColor" stroke-width="1.6" marker-end="url(#sm-05-arrow)"/>
  <rect x="180" y="144" width="150" height="40" rx="8" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
  <text x="255" y="169" font-size="13" text-anchor="middle">執行環境 3</text>
  <text x="400" y="26" font-size="14" fill="var(--slate)">Cloud Run：一個執行個體同時處理多個</text>
  <rect x="400" y="40" width="80" height="40" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="440" y="65" font-size="13" text-anchor="middle">請求 1</text>
  <line x1="480" y1="60" x2="578" y2="92" stroke="currentColor" stroke-width="1.6" marker-end="url(#sm-05-arrow)"/>
