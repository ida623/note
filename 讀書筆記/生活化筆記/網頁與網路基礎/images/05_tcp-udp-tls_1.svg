<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 356" aria-label="OSI 七層與 TCP/IP 四層對照：OSI 的應用、表現、會議三層合成 TCP/IP 的應用層（HTTP、DNS）；傳輸層一對一（TCP、UDP），以古銅色標出；網路層對網際網路層（IP）；資料鏈結與實體兩層合成網路存取層（Ethernet、Wi-Fi）。TLS 用灰藍標在應用層與傳輸層之間" width="784" height="356">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="356" fill="#FFFFFF" stroke="none"/>
<text x="130" y="40" font-size="13" text-anchor="middle" fill="var(--slate-deep)">OSI 七層（參考模型）</text><text x="345" y="40" font-size="13" text-anchor="middle" fill="var(--slate-deep)">TCP/IP 四層（網際網路實際用的）</text><text x="600" y="40" font-size="13" text-anchor="middle" fill="var(--slate-deep)">這一層的協定</text><rect x="50" y="56" width="160" height="30" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="130" y="76" font-size="13" text-anchor="middle">應用層</text><rect x="50" y="92" width="160" height="30" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="130" y="112" font-size="13" text-anchor="middle">表現層</text><rect x="50" y="128" width="160" height="30" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="130" y="148" font-size="13" text-anchor="middle">會議層</text><rect x="50" y="164" width="160" height="30" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="130" y="184" font-size="13" text-anchor="middle">傳輸層</text><rect x="50" y="200" width="160" height="30" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="130" y="220" font-size="13" text-anchor="middle">網路層</text><rect x="50" y="236" width="160" height="30" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="130" y="256" font-size="13" text-anchor="middle">資料鏈結層</text><rect x="50" y="272" width="160" height="30" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="130" y="292" font-size="13" text-anchor="middle">實體層</text><rect x="265" y="56" width="160" height="102" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="345" y="112" font-size="13.5" text-anchor="middle">應用層</text><text x="600" y="112" font-size="13" text-anchor="middle">HTTP、DNS、SMTP</text><line x1="212" y1="107" x2="263" y2="107" stroke="currentColor" stroke-width="1" stroke-opacity=".35"/><line x1="427" y1="107" x2="478" y2="107" stroke="currentColor" stroke-width="1" stroke-opacity=".35" stroke-dasharray="3 3"/><rect x="265" y="164" width="160" height="30" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="345" y="184" font-size="13.5" text-anchor="middle">傳輸層</text><text x="600" y="184" font-size="13" text-anchor="middle" fill="var(--gold-deep)">TCP、UDP</text><line x1="212" y1="179" x2="263" y2="179" stroke="currentColor" stroke-width="1" stroke-opacity=".35"/><line x1="427" y1="179" x2="478" y2="179" stroke="currentColor" stroke-width="1" stroke-opacity=".35" stroke-dasharray="3 3"/><rect x="265" y="200" width="160" height="30" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="345" y="220" font-size="13.5" text-anchor="middle">網際網路層</text><text x="600" y="220" font-size="13" text-anchor="middle">IP</text><line x1="212" y1="215" x2="263" y2="215" stroke="currentColor" stroke-width="1" stroke-opacity=".35"/><line x1="427" y1="215" x2="478" y2="215" stroke="currentColor" stroke-width="1" stroke-opacity=".35" stroke-dasharray="3 3"/><rect x="265" y="236" width="160" height="66" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="345" y="274" font-size="13.5" text-anchor="middle">網路存取層</text><text x="600" y="274" font-size="13" text-anchor="middle">Ethernet、Wi-Fi</text><line x1="212" y1="269" x2="263" y2="269" stroke="currentColor" stroke-width="1" stroke-opacity=".35"/><line x1="427" y1="269" x2="478" y2="269" stroke="currentColor" stroke-width="1" stroke-opacity=".35" stroke-dasharray="3 3"/><rect x="490" y="136" width="220" height="24" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="600" y="152" font-size="12" text-anchor="middle" fill="var(--slate-deep)">TLS：跑在 TCP 上、替應用層加密</text><text x="380" y="318" font-size="12.5" text-anchor="middle" fill="var(--gold-deep)">本課主角：傳輸層的 TCP、UDP，以及夾在應用層與傳輸層之間的 TLS</text>
</svg>
