<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 464" aria-label="四向揮手時序圖，照 RFC 9293 圖 12：用戶端主動關閉，送 FIN，進 FIN-WAIT-1；伺服器回 ACK 進 CLOSE-WAIT，用戶端收到進 FIN-WAIT-2；這段時間伺服器還可以送資料；伺服器的程式也關閉後送出自己的 FIN，進 LAST-ACK；用戶端回最後一個 ACK 進 TIME-WAIT，伺服器收到就 CLOSED；用戶端等 2 倍 MSL 才 CLOSED" width="784" height="464">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="464" fill="#FFFFFF" stroke="none"/>
<defs><marker id="tu-4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker><marker id="tu-4g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--gold)"/></marker><marker id="tu-4s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--slate)"/></marker></defs><rect x="150" y="14" width="120" height="30" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="210" y="34" font-size="14" text-anchor="middle">用戶端</text><rect x="490" y="14" width="120" height="30" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="550" y="34" font-size="14" text-anchor="middle">伺服器</text><line x1="210" y1="44" x2="210" y2="428" stroke="currentColor" stroke-width="1.2" stroke-opacity=".35"/><line x1="550" y1="44" x2="550" y2="428" stroke="currentColor" stroke-width="1.2" stroke-opacity=".35"/><line x1="212" y1="89" x2="546" y2="101" stroke="var(--gold)" stroke-width="1.6" marker-end="url(#tu-4g)"/><text x="380" y="87" font-size="12.5" text-anchor="middle" fill="var(--gold-deep)" class="mono">FIN+ACK  SEQ=100 ACK=300</text><text x="380" y="115" font-size="11.5" text-anchor="middle" opacity=".75">「我沒有資料要送了」</text><line x1="548" y1="144" x2="214" y2="156" stroke="currentColor" stroke-width="1.6" marker-end="url(#tu-4a)"/><text x="380" y="142" font-size="12.5" text-anchor="middle" class="mono">ACK  SEQ=300 ACK=101</text><text x="380" y="170" font-size="11.5" text-anchor="middle" opacity=".75">「知道了」——但我這邊可能還有資料</text><line x1="548" y1="199" x2="214" y2="211" stroke="var(--slate)" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#tu-4s)"/><text x="380" y="197" font-size="12.5" text-anchor="middle" fill="var(--slate-deep)" class="mono">（還可以繼續送資料）</text><text x="380" y="225" font-size="11.5" text-anchor="middle" opacity=".75">半關閉：只剩伺服器→用戶端這個方向</text><line x1="548" y1="254" x2="214" y2="266" stroke="var(--gold)" stroke-width="1.6" marker-end="url(#tu-4g)"/><text x="380" y="252" font-size="12.5" text-anchor="middle" fill="var(--gold-deep)" class="mono">FIN+ACK  SEQ=300 ACK=101</text><text x="380" y="280" font-size="11.5" text-anchor="middle" opacity=".75">伺服器的程式也關了，換它說沒資料</text><line x1="212" y1="309" x2="546" y2="321" stroke="currentColor" stroke-width="1.6" marker-end="url(#tu-4a)"/><text x="380" y="307" font-size="12.5" text-anchor="middle" class="mono">ACK  SEQ=101 ACK=301</text><text x="380" y="335" font-size="11.5" text-anchor="middle" opacity=".75">最後一個確認</text><text x="198" y="64" font-size="12" text-anchor="end" class="mono">ESTABLISHED</text><text x="562" y="64" font-size="12" text-anchor="start" class="mono">ESTABLISHED</text><text x="198" y="92" font-size="12" text-anchor="end" fill="var(--gold-deep)" class="mono">FIN-WAIT-1</text><text x="562" y="116" font-size="12" text-anchor="start" fill="var(--gold-deep)" class="mono">CLOSE-WAIT</text><text x="198" y="171" font-size="12" text-anchor="end" fill="var(--gold-deep)" class="mono">FIN-WAIT-2</text><text x="562" y="257" font-size="12" text-anchor="start" fill="var(--gold-deep)" class="mono">LAST-ACK</text><text x="198" y="281" font-size="12" text-anchor="end" fill="var(--danger)" class="mono">TIME-WAIT</text><text x="562" y="336" font-size="12" text-anchor="start" fill="var(--slate-deep)" class="mono">CLOSED</text><text x="198" y="420" font-size="12" text-anchor="end" fill="var(--slate-deep)" class="mono">CLOSED</text><rect x="70" y="290" width="132" height="116" rx="6" fill="none" stroke="var(--danger)" stroke-dasharray="4 3"/><text x="136" y="372" font-size="12.5" text-anchor="middle" fill="var(--danger)">等 2×MSL</text><text x="136" y="392" font-size="11" text-anchor="middle" opacity=".75">RFC 4 分鐘、Linux 60 秒</text>
</svg>
