<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 416" aria-label="SSE 斷線自動重連，時間取自 2026-10-03 用 Node 內建 EventSource 實測：用戶端送 GET /rates/stream；伺服器在第 1、2、3 秒各送一筆事件，編號 1、2、3，之後結束回應。用戶端等 retry 指定的 3000 毫秒後自動重連，請求帶 Last-Event-ID: 3；伺服器從第 4 筆接著送，用戶端在 7.1 秒收到" width="784" height="416">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="416" fill="#FFFFFF" stroke="none"/>
<defs><marker id="rt-4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker><marker id="rt-4g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--gold)"/></marker><marker id="rt-4s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--slate)"/></marker></defs><rect x="150" y="14" width="120" height="30" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="210" y="34" font-size="14" text-anchor="middle">用戶端</text><rect x="490" y="14" width="120" height="30" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="550" y="34" font-size="14" text-anchor="middle">伺服器</text><line x1="210" y1="44" x2="210" y2="380" stroke="currentColor" stroke-width="1.2" stroke-opacity=".35"/><line x1="550" y1="44" x2="550" y2="380" stroke="currentColor" stroke-width="1.2" stroke-opacity=".35"/><line x1="212" y1="75" x2="546" y2="87" stroke="currentColor" stroke-width="1.6" marker-end="url(#rt-4a)"/><text x="380" y="73" font-size="12.5" text-anchor="middle" class="mono">GET /rates/stream</text><line x1="548" y1="120" x2="214" y2="132" stroke="var(--gold)" stroke-width="1.6" marker-end="url(#rt-4g)"/><text x="380" y="118" font-size="12.5" text-anchor="middle" fill="var(--gold-deep)" class="mono">id:1  data:{…30.504}</text><line x1="548" y1="160" x2="214" y2="172" stroke="var(--gold)" stroke-width="1.6" marker-end="url(#rt-4g)"/><text x="380" y="158" font-size="12.5" text-anchor="middle" fill="var(--gold-deep)" class="mono">id:2  data:{…30.508}</text><line x1="548" y1="200" x2="214" y2="212" stroke="var(--gold)" stroke-width="1.6" marker-end="url(#rt-4g)"/><text x="380" y="198" font-size="12.5" text-anchor="middle" fill="var(--gold-deep)" class="mono">id:3  data:{…30.512}</text><text x="380" y="226" font-size="11.5" text-anchor="middle" opacity=".75">然後伺服器結束這個回應</text><line x1="212" y1="300" x2="546" y2="312" stroke="var(--slate)" stroke-width="1.6" marker-end="url(#rt-4s)"/><text x="380" y="298" font-size="12.5" text-anchor="middle" fill="var(--slate-deep)" class="mono">GET /rates/stream</text><text x="380" y="326" font-size="11.5" text-anchor="middle" opacity=".75">Last-Event-ID: 3（瀏覽器自動帶）</text><line x1="548" y1="350" x2="214" y2="362" stroke="var(--gold)" stroke-width="1.6" marker-end="url(#rt-4g)"/><text x="380" y="348" font-size="12.5" text-anchor="middle" fill="var(--gold-deep)" class="mono">id:4  data:{…30.516}</text><text x="380" y="376" font-size="11.5" text-anchor="middle" opacity=".75">從下一筆接著送</text><text x="198" y="72" font-size="12" text-anchor="end" class="mono">0.0s</text><text x="198" y="132" font-size="12" text-anchor="end" class="mono">1.1s</text><text x="198" y="172" font-size="12" text-anchor="end" class="mono">2.1s</text><text x="198" y="212" font-size="12" text-anchor="end" class="mono">3.1s</text><text x="198" y="312" font-size="12" text-anchor="end" fill="var(--slate-deep)" class="mono">約 6s</text><text x="198" y="362" font-size="12" text-anchor="end" class="mono">7.1s</text><rect x="70" y="236" width="620" height="40" rx="6" fill="none" stroke="var(--slate)" stroke-dasharray="4 3"/><text x="380" y="261" font-size="12" text-anchor="middle" fill="var(--slate-deep)">斷線 → 等 retry 指定的 3000 毫秒 → 自動重連</text>
</svg>
