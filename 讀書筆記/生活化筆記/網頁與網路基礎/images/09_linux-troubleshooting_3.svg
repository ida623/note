<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 234" aria-label="CPU 飆高的三步：top 找到吃 CPU 的行程 1698；top -H -p 1698 找到吃 CPU 的執行緒 1717，名字是 rate-calc；jstack 1698 裡找 nid=1717 那一段，看到它卡在 RateCalc.compound 第 9 行" width="784" height="234">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="234" fill="#FFFFFF" stroke="none"/>
<defs><marker id="lx-m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs>
<rect x="20" y="40" width="210" height="80" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="125" y="66" font-size="13" text-anchor="middle" class="mono">top</text><text x="125" y="88" font-size="12.5" text-anchor="middle">行程 1698：100%</text><text x="125" y="108" font-size="12" text-anchor="middle" opacity=".7">找到是哪個行程</text>
<rect x="275" y="40" width="210" height="80" rx="8" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="380" y="66" font-size="13" text-anchor="middle" class="mono">top -H -p 1698</text><text x="380" y="88" font-size="12.5" text-anchor="middle">執行緒 1717：99.9%</text><text x="380" y="108" font-size="12" text-anchor="middle" opacity=".7">找到是哪條執行緒</text>
<rect x="530" y="40" width="210" height="80" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="635" y="66" font-size="13" text-anchor="middle" class="mono">jstack 1698</text><text x="635" y="88" font-size="12.5" text-anchor="middle" class="mono">nid=1717 → 第 9 行</text><text x="635" y="108" font-size="12" text-anchor="middle" opacity=".7">找到卡在哪一行</text>
<path d="M232 80 L271 80" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#lx-m3)"/><path d="M487 80 L526 80" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#lx-m3)"/>
<text x="20" y="160" font-size="12.5" fill="var(--gold-deep)">top -H 的 PID 欄其實是執行緒 ID；jstack 的 nid 就是同一個號碼</text>
<text x="20" y="184" font-size="12" opacity=".6">JDK 21 起（25 也一樣）nid 印十進位；JDK 17、11 印十六進位（nid=0x…），要先 printf '%x' 換算</text>
</svg>
