<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 286" aria-label="三個區域：工作目錄、暫存區、儲存庫由左到右排列。git add 把工作目錄的修改放進暫存區，git commit 把暫存區存成儲存庫裡的一個 commit。灰藍箭頭往回：git restore --staged 把檔案拿出暫存區，git restore 放棄工作目錄的修改" width="784" height="286">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="286" fill="#FFFFFF" stroke="none"/>
<defs><marker id="gb-m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><rect x="40" y="60" width="190" height="96" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="135" y="94" font-size="16" text-anchor="middle" fill="var(--gold-deep)">工作目錄</text><text x="135" y="116" font-size="12" text-anchor="middle" class="mono" opacity=".7">working tree</text><text x="135" y="140" font-size="12.5" text-anchor="middle">你正在改的檔案</text><rect x="285" y="60" width="190" height="96" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="380" y="94" font-size="16" text-anchor="middle" fill="var(--gold-deep)">暫存區</text><text x="380" y="116" font-size="12" text-anchor="middle" class="mono" opacity=".7">staging area</text><text x="380" y="140" font-size="12.5" text-anchor="middle">下一個 commit 要放什麼</text><rect x="530" y="60" width="190" height="96" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="625" y="94" font-size="16" text-anchor="middle" fill="var(--gold-deep)">儲存庫</text><text x="625" y="116" font-size="12" text-anchor="middle" class="mono" opacity=".7">.git 資料夾</text><text x="625" y="140" font-size="12.5" text-anchor="middle">存好的 commit</text><line x1="232" y1="88" x2="283" y2="88" stroke="currentColor" stroke-opacity=".7" stroke-width="1.5" marker-end="url(#gb-m1)"/><text x="257.5" y="40" font-size="12.5" text-anchor="middle" class="mono" fill="var(--gold-deep)">git add</text><line x1="257.5" y1="46" x2="257.5" y2="80" stroke="var(--gold)" stroke-opacity=".6" stroke-dasharray="3 3"/><line x1="477" y1="88" x2="528" y2="88" stroke="currentColor" stroke-opacity=".7" stroke-width="1.5" marker-end="url(#gb-m1)"/><text x="502.5" y="40" font-size="12.5" text-anchor="middle" class="mono" fill="var(--gold-deep)">git commit</text><line x1="502.5" y1="46" x2="502.5" y2="80" stroke="var(--gold)" stroke-opacity=".6" stroke-dasharray="3 3"/><path d="M380 160 Q260 214 140 160" fill="none" stroke="var(--slate)" stroke-width="1.5" marker-end="url(#gb-m1)"/><text x="260" y="222" font-size="12" text-anchor="middle" class="mono" fill="var(--slate-deep)">git restore --staged：拿出暫存區</text><path d="M135 160 Q100 214 70 160" fill="none" stroke="var(--slate)" stroke-width="1.5" marker-end="url(#gb-m1)" stroke-dasharray="4 3"/><text x="40" y="246" font-size="12" class="mono" fill="var(--slate-deep)">git restore：放棄工作目錄的修改</text><text x="530" y="200" font-size="12" opacity=".7">git status 看前兩區跟最新 commit 差在哪</text>
</svg>
