<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 380" aria-label="GitHub Actions 的結構：一個 workflow 檔用 on 定義觸發事件，裡面有兩個 job。test 這個 job 在一台 runner 上依序跑三個 step；image 這個 job 寫了 needs test，等 test 成功才在另一台 runner 上跑" width="784" height="380">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="380" fill="#FFFFFF" stroke="none"/>
<defs><marker id="ci-m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><rect x="20" y="20" width="720" height="300" rx="10" fill="none" stroke="currentColor" stroke-opacity=".5"/><text x="36" y="44" font-size="13" fill="var(--gold-deep)">.github/workflows/ci.yml：一個 workflow</text><rect x="36" y="60" width="200" height="44" rx="8" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="136" y="87" font-size="12.5" text-anchor="middle">on：push、pull_request</text><text x="250" y="87" font-size="12">事件（event）發生，workflow 就跑一次（一個 run）</text><rect x="36" y="124" width="328" height="180" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="50" y="146" font-size="13" fill="var(--slate-deep)">job：test</text><text x="350" y="146" font-size="11.5" text-anchor="end" opacity=".7">一台 runner</text><rect x="50" y="158" width="300" height="36" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="200" y="181" font-size="12" text-anchor="middle">step 1　uses: actions/checkout</text><rect x="50" y="204" width="300" height="36" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="200" y="227" font-size="12" text-anchor="middle">step 2　uses: actions/setup-java</text><rect x="50" y="250" width="300" height="36" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="200" y="273" font-size="12" text-anchor="middle">step 3　run: mvn -B test</text><rect x="396" y="124" width="328" height="180" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="410" y="146" font-size="13" fill="var(--slate-deep)">job：image（needs: test）</text><text x="710" y="146" font-size="11.5" text-anchor="end" opacity=".7">一台 runner</text><rect x="410" y="158" width="300" height="36" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="560" y="181" font-size="12" text-anchor="middle">step 1　uses: actions/checkout</text><rect x="410" y="204" width="300" height="36" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="560" y="227" font-size="12" text-anchor="middle">step 2　run: mvn -B package</text><rect x="410" y="250" width="300" height="36" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="560" y="273" font-size="12" text-anchor="middle">step 3　uses: docker/build-push-action</text><line x1="366" y1="214" x2="392" y2="214" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#ci-m2)"/><text x="36" y="342" font-size="12" opacity=".6">job 預設同時跑；寫了 needs 才排先後。同一個 job 的 step 依序跑、在同一台 runner 上，看得到同一份檔案</text>
</svg>
