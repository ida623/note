<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 290" aria-label="job 的相依圖：lint 與 test 沒有 needs，一開始同時跑；image 需要 lint 和 test 都成功；deploy-staging 需要 image；notify 需要 deploy-staging，但寫了 if always()，前面失敗也照跑" width="784" height="290">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="290" fill="#FFFFFF" stroke="none"/>
<defs><marker id="ci-m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><rect x="40" y="60" width="130" height="44" rx="8" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="105" y="87" font-size="13" text-anchor="middle" class="mono">lint</text><rect x="40" y="160" width="130" height="44" rx="8" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="105" y="187" font-size="13" text-anchor="middle" class="mono">test</text><rect x="260" y="110" width="130" height="44" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="325" y="137" font-size="13" text-anchor="middle" class="mono">image</text><rect x="460" y="110" width="130" height="44" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="525" y="137" font-size="13" text-anchor="middle" class="mono">deploy-staging</text><rect x="640" y="110" width="100" height="54" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="690" y="134" font-size="13" text-anchor="middle" class="mono">notify</text><text x="690" y="152" font-size="11.5" text-anchor="middle" opacity=".7">if: always()</text><line x1="172" y1="82" x2="256" y2="126" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#ci-m3)"/><line x1="172" y1="182" x2="256" y2="144" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#ci-m3)"/><line x1="392" y1="132" x2="456" y2="132" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#ci-m3)"/><line x1="592" y1="132" x2="636" y2="132" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#ci-m3)"/><text x="40" y="40" font-size="12" fill="var(--gold-deep)">同時開始</text><text x="260" y="190" font-size="12" class="mono">needs: [lint, test]</text><text x="260" y="208" font-size="12" opacity=".7">兩個都成功才開始</text><text x="460" y="190" font-size="12" class="mono">needs: image</text><text x="742" y="190" font-size="12" text-anchor="end" class="mono">needs: deploy-staging</text><text x="742" y="208" font-size="12" text-anchor="end" opacity=".7">前面失敗也照跑</text><text x="40" y="252" font-size="12" opacity=".6">古銅＝沒有 needs、一開始就同時跑。任一個被需要的 job 失敗或被略過，下游全部略過；寫了 always() 的例外</text>
</svg>
