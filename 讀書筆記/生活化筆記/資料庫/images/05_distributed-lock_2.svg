<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 324" aria-label="三台伺服器各自有自己的鎖，三台同時扣同一筆餘額" width="784" height="324">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="324" fill="#FFFFFF" stroke="none"/>
        <g stroke="currentColor" fill="none">
          <rect x="30" y="34" width="210" height="58" rx="5"/>
          <rect x="30" y="121" width="210" height="58" rx="5"/>
          <rect x="30" y="208" width="210" height="58" rx="5"/>
        </g>
        <text x="52" y="70" font-size="15">伺服器 1</text>
        <text x="52" y="157" font-size="15">伺服器 2</text>
        <text x="52" y="244" font-size="15">伺服器 3</text>

        <g fill="none" stroke="var(--gold)" stroke-width="1.6">
          <rect x="180" y="48" width="40" height="30" rx="4"/>
          <rect x="180" y="135" width="40" height="30" rx="4"/>
          <rect x="180" y="222" width="40" height="30" rx="4"/>
        </g>
        <g font-size="12" text-anchor="middle" fill="var(--gold)">
          <text x="200" y="68">鎖</text>
          <text x="200" y="155">鎖</text>
          <text x="200" y="242">鎖</text>
        </g>
        <text x="200" y="24" font-size="12" text-anchor="middle" fill="var(--gold)">三把鎖各鎖各的</text>

        <g stroke="var(--danger)" stroke-width="2" marker-end="url(#ad)">
          <line x1="248" y1="63" x2="548" y2="140"/>
          <line x1="248" y1="150" x2="548" y2="152"/>
          <line x1="248" y1="237" x2="548" y2="164"/>
        </g>
        <text x="392" y="96" font-size="13" text-anchor="middle" fill="var(--danger)">同一秒，三個請求都覺得自己拿到鎖</text>

        <rect x="560" y="112" width="170" height="80" rx="5" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="645" y="146" font-size="15" text-anchor="middle">帳戶餘額</text>
        <text x="645" y="170" font-size="14" text-anchor="middle" fill="var(--danger)">被扣了三次</text>

        <defs>
          <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <polygon points="0,0 10,5 0,10" fill="var(--danger)"/>
          </marker>
        </defs>
      </svg>
