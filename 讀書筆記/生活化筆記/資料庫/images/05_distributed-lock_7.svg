<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 404 254" aria-label="叢集：資料依編號切成三段，分別放在三組主從上" width="404" height="254">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="404" height="254" fill="#FFFFFF" stroke="none"/>
          <text x="190" y="22" font-size="12" text-anchor="middle" opacity=".7">依鍵名算出編號，決定去哪一組</text>
          <line x1="190" y1="30" x2="190" y2="46" stroke="currentColor" stroke-opacity=".5"/>
          <line x1="66" y1="46" x2="314" y2="46" stroke="currentColor" stroke-opacity=".5"/>
          <g stroke="currentColor" stroke-opacity=".5">
            <line x1="66" y1="46" x2="66" y2="62"/>
            <line x1="190" y1="46" x2="190" y2="62"/>
            <line x1="314" y1="46" x2="314" y2="62"/>
          </g>

          <g fill="none" stroke="var(--gold)" stroke-width="2">
            <rect x="14" y="66" width="104" height="44" rx="5"/>
            <rect x="138" y="66" width="104" height="44" rx="5"/>
            <rect x="262" y="66" width="104" height="44" rx="5"/>
          </g>
          <g font-size="13" text-anchor="middle" fill="var(--gold)">
            <text x="66" y="86">主機</text>
            <text x="190" y="86">主機</text>
            <text x="314" y="86">主機</text>
          </g>
          <g class="mono" font-size="10" text-anchor="middle" fill="var(--gold)">
            <text x="66" y="103">0–5460</text>
            <text x="190" y="103">5461–10922</text>
            <text x="314" y="103">10923–16383</text>
          </g>

          <g stroke="currentColor" stroke-opacity=".5" stroke-dasharray="4 4">
            <line x1="66" y1="112" x2="66" y2="136"/>
            <line x1="190" y1="112" x2="190" y2="136"/>
            <line x1="314" y1="112" x2="314" y2="136"/>
          </g>
          <g fill="none" stroke="currentColor">
            <rect x="14" y="138" width="104" height="40" rx="5"/>
            <rect x="138" y="138" width="104" height="40" rx="5"/>
            <rect x="262" y="138" width="104" height="40" rx="5"/>
          </g>
          <g font-size="13" text-anchor="middle">
            <text x="66" y="163">從機</text>
            <text x="190" y="163">從機</text>
            <text x="314" y="163">從機</text>
          </g>

          <text x="190" y="200" font-size="13" text-anchor="middle" fill="var(--ok)">資料量和流量可以一直往上加機器</text>
          <text x="190" y="219" font-size="12" text-anchor="middle" opacity=".65">每組自己也會自動換主機</text>
        </svg>
