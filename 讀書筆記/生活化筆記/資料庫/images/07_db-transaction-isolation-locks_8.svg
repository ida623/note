<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 404" aria-label="樂觀鎖的時間軸：交易 A 與 B 都讀到餘額 10000、版本 1；A 在 2 秒用 WHERE version = 1 更新成功，版本變 2；B 在 3 秒用同樣條件更新，影響 0 列，知道被別人改過，要重讀重試" width="784" height="404">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="404" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="tx-7-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs>
  <line x1="120.0" y1="292" x2="740.0" y2="292" stroke="currentColor" stroke-opacity=".5" marker-end="url(#tx-7-a)"/>
  <line x1="120.0" y1="288" x2="120.0" y2="296" stroke="currentColor" stroke-opacity=".5"/>
  <text opacity=".6" x="120.0" y="312" font-size="11" text-anchor="middle">0 秒</text>
  <line x1="320.0" y1="288" x2="320.0" y2="296" stroke="currentColor" stroke-opacity=".5"/>
  <text opacity=".6" x="320.0" y="312" font-size="11" text-anchor="middle">1 秒</text>
  <line x1="520.0" y1="288" x2="520.0" y2="296" stroke="currentColor" stroke-opacity=".5"/>
  <text opacity=".6" x="520.0" y="312" font-size="11" text-anchor="middle">2 秒</text>
  <line x1="720.0" y1="288" x2="720.0" y2="296" stroke="currentColor" stroke-opacity=".5"/>
  <text opacity=".6" x="720.0" y="312" font-size="11" text-anchor="middle">3 秒</text>
  <text x="40" y="114" font-size="13" text-anchor="middle" font-weight="700">交易 A</text>
  <text x="40" y="214" font-size="13" text-anchor="middle" font-weight="700">交易 B</text>
  <line x1="120.0" y1="110" x2="720.0" y2="110" stroke="currentColor" stroke-opacity=".2" stroke-width="6"/>
  <line x1="120.0" y1="210" x2="720.0" y2="210" stroke="currentColor" stroke-opacity=".2" stroke-width="6"/>
  <line x1="120.0" y1="110" x2="120.0" y2="76" stroke="currentColor" stroke-opacity=".5"/>
  <circle cx="120.0" cy="110" r="4" fill="currentColor"/>
  <rect x="80" y="30" width="131" height="46" rx="5" fill="var(--surface)" stroke="currentColor"/>
  <text x="145.6" y="49" font-size="11.5" text-anchor="middle" class="mono">SELECT</text>
  <text x="145.6" y="67" font-size="11.5" text-anchor="middle" class="mono">balance, version</text>
  <text x="145.6" y="24" font-size="11.5" text-anchor="middle" fill="var(--gold-deep)" font-weight="700">10000, 1</text>
  <line x1="320.0" y1="210" x2="320.0" y2="224" stroke="currentColor" stroke-opacity=".5"/>
  <circle cx="320.0" cy="210" r="4" fill="currentColor"/>
  <rect x="254" y="224" width="131" height="46" rx="5" fill="var(--surface)" stroke="currentColor"/>
  <text x="320.0" y="243" font-size="11.5" text-anchor="middle" class="mono">SELECT</text>
  <text x="320.0" y="261" font-size="11.5" text-anchor="middle" class="mono">balance, version</text>
  <text x="320.0" y="285" font-size="11.5" text-anchor="middle" fill="var(--gold-deep)" font-weight="700">10000, 1</text>
  <line x1="520.0" y1="110" x2="520.0" y2="76" stroke="currentColor" stroke-opacity=".5"/>
  <circle cx="520.0" cy="110" r="4" fill="var(--gold)"/>
  <rect x="462" y="30" width="117" height="46" rx="5" fill="var(--gold-soft)" stroke="var(--gold)"/>
  <text x="520.0" y="49" font-size="11.5" text-anchor="middle" class="mono">UPDATE … WHERE</text>
  <text x="520.0" y="67" font-size="11.5" text-anchor="middle" class="mono">version = 1</text>
  <text x="520.0" y="24" font-size="11.5" text-anchor="middle" fill="var(--gold-deep)" font-weight="700">1 列，版本 → 2</text>
  <line x1="720.0" y1="210" x2="720.0" y2="224" stroke="currentColor" stroke-opacity=".5"/>
  <circle cx="720.0" cy="210" r="4" fill="var(--danger)"/>
  <rect x="633" y="224" width="117" height="46" rx="5" fill="var(--sunk)" stroke="var(--danger)"/>
  <text x="691.6" y="243" font-size="11.5" text-anchor="middle" class="mono">UPDATE … WHERE</text>
  <text x="691.6" y="261" font-size="11.5" text-anchor="middle" class="mono">version = 1</text>
  <text x="691.6" y="285" font-size="11.5" text-anchor="middle" fill="var(--gold-deep)" font-weight="700">0 列 → 重試</text>
  <text x="380" y="340" font-size="12" text-anchor="middle" fill="var(--slate-deep)">讀的時候不加鎖；寫的時候帶上讀到的版本號，沒人改過才寫得進去</text>
  <text x="380" y="360" font-size="12" text-anchor="middle" fill="var(--slate-deep)">影響 0 列代表衝突：應用程式重新讀一次再算</text>
</svg>
