<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 404" aria-label="死結的時間軸：交易 A 在 0 秒鎖住帳戶 1；交易 B 在 1 秒鎖住帳戶 2，緊接著要鎖帳戶 1，開始等待；A 在 2 秒要鎖帳戶 2，形成死結；InnoDB 立刻還原 A，B 在 2 秒拿到帳戶 1 的鎖並提交" width="784" height="404">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="404" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="tx-6-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs>
  <line x1="120.0" y1="292" x2="740.0" y2="292" stroke="currentColor" stroke-opacity=".5" marker-end="url(#tx-6-a)"/>
  <line x1="120.0" y1="288" x2="120.0" y2="296" stroke="currentColor" stroke-opacity=".5"/>
  <text opacity=".6" x="120.0" y="312" font-size="11" text-anchor="middle">0 秒</text>
  <line x1="320.0" y1="288" x2="320.0" y2="296" stroke="currentColor" stroke-opacity=".5"/>
  <text opacity=".6" x="320.0" y="312" font-size="11" text-anchor="middle">1 秒</text>
  <line x1="520.0" y1="288" x2="520.0" y2="296" stroke="currentColor" stroke-opacity=".5"/>
  <text opacity=".6" x="520.0" y="312" font-size="11" text-anchor="middle">2 秒</text>
  <line x1="720.0" y1="288" x2="720.0" y2="296" stroke="currentColor" stroke-opacity=".5"/>
  <text opacity=".6" x="720.0" y="312" font-size="11" text-anchor="middle">3 秒</text>
  <text x="40" y="114" font-size="13" text-anchor="middle" font-weight="700">交易 A</text>
  <text x="40" y="214" font-size="13" text-anchor="middle" font-weight="700">交易 B</text>
  <line x1="120.0" y1="110" x2="720.0" y2="110" stroke="currentColor" stroke-opacity=".2" stroke-width="6"/>
  <line x1="120.0" y1="210" x2="720.0" y2="210" stroke="currentColor" stroke-opacity=".2" stroke-width="6"/>
  <line x1="320.0" y1="210" x2="520.0" y2="210" stroke="var(--danger)" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="440.0" y="230" font-size="11" text-anchor="middle" fill="var(--danger)">B 等待鎖 1</text>
  <line x1="120.0" y1="110" x2="120.0" y2="76" stroke="currentColor" stroke-opacity=".5"/>
  <circle cx="120.0" cy="110" r="4" fill="var(--gold)"/>
  <rect x="80" y="48" width="95" height="28" rx="5" fill="var(--gold-soft)" stroke="var(--gold)"/>
  <text x="127.6" y="67" font-size="11.5" text-anchor="middle" class="mono">UPDATE id=1</text>
  <text x="127.6" y="42" font-size="11.5" text-anchor="middle" fill="var(--gold-deep)" font-weight="700">鎖住 1</text>
  <line x1="320.0" y1="210" x2="320.0" y2="224" stroke="currentColor" stroke-opacity=".5"/>
  <circle cx="320.0" cy="210" r="4" fill="var(--slate)"/>
  <rect x="272" y="224" width="95" height="28" rx="5" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="320.0" y="243" font-size="11.5" text-anchor="middle" class="mono">UPDATE id=2</text>
  <text x="320.0" y="267" font-size="11.5" text-anchor="middle" fill="var(--gold-deep)" font-weight="700">鎖住 2</text>
  <line x1="330.0" y1="210" x2="330.0" y2="180" stroke="currentColor" stroke-opacity=".5"/>
  <rect x="332" y="152" width="95" height="28" rx="5" fill="var(--surface)" stroke="currentColor"/>
  <text x="379.5" y="171" font-size="11.5" text-anchor="middle" class="mono">UPDATE id=1</text>
  <line x1="520.0" y1="110" x2="520.0" y2="76" stroke="currentColor" stroke-opacity=".5"/>
  <circle cx="520.0" cy="110" r="4" fill="var(--danger)"/>
  <rect x="472" y="48" width="95" height="28" rx="5" fill="var(--sunk)" stroke="var(--danger)"/>
  <text x="520.0" y="67" font-size="11.5" text-anchor="middle" class="mono">UPDATE id=2</text>
  <text x="520.0" y="42" font-size="11.5" text-anchor="middle" fill="var(--gold-deep)" font-weight="700">ERROR 1213 還原</text>
  <line x1="525.0" y1="210" x2="525.0" y2="240" stroke="currentColor" stroke-opacity=".5"/>
  <circle cx="525.0" cy="210" r="4" fill="var(--slate)"/>
  <rect x="495" y="240" width="60" height="46" rx="5" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="525.0" y="259" font-size="11.5" text-anchor="middle" class="mono">拿到 1</text>
  <text x="525.0" y="277" font-size="11.5" text-anchor="middle" class="mono">COMMIT</text>
  <text x="380" y="340" font-size="12" text-anchor="middle" fill="var(--slate-deep)">A 等 B 手上的 2、B 等 A 手上的 1，誰也等不到；InnoDB 立刻偵測並還原其中一筆</text>
  <text x="380" y="360" font-size="12" text-anchor="middle" fill="var(--slate-deep)">這次還原的是 A（ERROR 1213），B 等了約 1 秒後完成</text>
</svg>
