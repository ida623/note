<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 244" aria-label="Cache-Aside 的讀與寫。左邊讀取：應用程式先向 Redis GET，命中就回傳；未命中就查資料庫，再把結果回填到 Redis 並設 TTL。右邊寫入：應用程式先更新資料庫，再刪掉 Redis 裡那把 key，下一個讀取未命中時自然回填新值" width="784" height="244">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="244" fill="#FFFFFF" stroke="none"/>
<defs><marker id="cr-m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><text x="40" y="26" font-size="13" text-anchor="start" fill="var(--gold-deep)">讀：先查快取，沒有才查資料庫並回填</text><rect x="40" y="50" width="120" height="46" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="100.0" y="78.0" font-size="13.5" text-anchor="middle">應用程式</text><rect x="260" y="50" width="120" height="46" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="320.0" y="78.0" font-size="13.5" text-anchor="middle">Redis</text><rect x="260" y="150" width="120" height="46" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="320.0" y="178.0" font-size="13.5" text-anchor="middle">資料庫</text><line x1="162" y1="66" x2="258" y2="66" stroke="currentColor" stroke-opacity=".65" stroke-width="1.5" marker-end="url(#cr-m2)"/><text x="210" y="60" font-size="11.5" text-anchor="middle" class="mono">① GET</text><line x1="258" y1="84" x2="162" y2="84" stroke="currentColor" stroke-opacity=".65" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#cr-m2)"/><text x="210" y="100" font-size="11.5" text-anchor="middle" opacity=".75">命中就回傳</text><line x1="130" y1="98" x2="258" y2="162" stroke="currentColor" stroke-opacity=".65" stroke-width="1.5" marker-end="url(#cr-m2)"/><text x="160" y="146" font-size="11.5" text-anchor="start">② 未命中：查資料庫</text><line x1="320" y1="148" x2="320" y2="98" stroke="var(--gold)" stroke-opacity=".65" stroke-width="1.5" marker-end="url(#cr-m2)"/><text x="330" y="128" font-size="11.5" text-anchor="start" fill="var(--gold-deep)">③ 回填（加 TTL）</text><line x1="400" y1="30" x2="400" y2="210" stroke="currentColor" stroke-opacity=".15"/><text x="430" y="26" font-size="13" text-anchor="start" fill="var(--gold-deep)">寫：先更新資料庫，再刪快取</text><rect x="430" y="50" width="120" height="46" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="490.0" y="78.0" font-size="13.5" text-anchor="middle">應用程式</text><rect x="610" y="50" width="120" height="46" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="670.0" y="78.0" font-size="13.5" text-anchor="middle">Redis</text><rect x="610" y="150" width="120" height="46" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="670.0" y="178.0" font-size="13.5" text-anchor="middle">資料庫</text><line x1="510" y1="98" x2="608" y2="162" stroke="currentColor" stroke-opacity=".65" stroke-width="1.5" marker-end="url(#cr-m2)"/><text x="520" y="146" font-size="11.5" text-anchor="start" class="mono">① UPDATE</text><line x1="552" y1="72" x2="608" y2="72" stroke="currentColor" stroke-opacity=".65" stroke-width="1.5" marker-end="url(#cr-m2)"/><text x="580" y="64" font-size="11.5" text-anchor="middle" class="mono">② DEL</text><text x="670" y="116" font-size="11.5" text-anchor="middle" fill="var(--slate-deep)">下一個讀取未命中，</text><text x="670" y="132" font-size="11.5" text-anchor="middle" fill="var(--slate-deep)">自然回填新值</text>
</svg>
