<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 282" aria-label="雪崩、穿透、擊穿三格。雪崩：一大批 key 同一刻到期，很多請求同時打到資料庫，解法是 TTL 加隨機秒數。穿透：一直查根本不存在的資料，快取每次都未命中，解法是 Bloom Filter 與快取空結果。擊穿：一把熱門 key 剛好到期，大量請求同時去重建，解法是互斥重建或邏輯過期" width="784" height="282">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="282" fill="#FFFFFF" stroke="none"/>
<defs><marker id="cr-m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><text x="130" y="26" font-size="15" text-anchor="middle" fill="var(--gold-deep)">雪崩</text><text x="130" y="46" font-size="12" text-anchor="middle" opacity=".75">一大批 key 同一刻到期</text><rect x="60" y="150" width="140" height="40" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="130.0" y="175.0" font-size="13.5" text-anchor="middle">資料庫</text><text x="380" y="26" font-size="15" text-anchor="middle" fill="var(--gold-deep)">穿透</text><text x="380" y="46" font-size="12" text-anchor="middle" opacity=".75">查根本不存在的資料</text><rect x="310" y="150" width="140" height="40" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="380.0" y="175.0" font-size="13.5" text-anchor="middle">資料庫</text><text x="630" y="26" font-size="15" text-anchor="middle" fill="var(--gold-deep)">擊穿</text><text x="630" y="46" font-size="12" text-anchor="middle" opacity=".75">一把熱 key 剛好到期</text><rect x="560" y="150" width="140" height="40" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="630.0" y="175.0" font-size="13.5" text-anchor="middle">資料庫</text><rect x="40" y="70" width="26" height="22" rx="3" fill="var(--surface)" stroke="currentColor" stroke-dasharray="3 3" opacity=".5"/><line x1="53" y1="94" x2="90" y2="148" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5" marker-end="url(#cr-m4)"/><rect x="72" y="70" width="26" height="22" rx="3" fill="var(--surface)" stroke="currentColor" stroke-dasharray="3 3" opacity=".5"/><line x1="85" y1="94" x2="100" y2="148" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5" marker-end="url(#cr-m4)"/><rect x="104" y="70" width="26" height="22" rx="3" fill="var(--surface)" stroke="currentColor" stroke-dasharray="3 3" opacity=".5"/><line x1="117" y1="94" x2="110" y2="148" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5" marker-end="url(#cr-m4)"/><rect x="136" y="70" width="26" height="22" rx="3" fill="var(--surface)" stroke="currentColor" stroke-dasharray="3 3" opacity=".5"/><line x1="149" y1="94" x2="120" y2="148" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5" marker-end="url(#cr-m4)"/><rect x="168" y="70" width="26" height="22" rx="3" fill="var(--surface)" stroke="currentColor" stroke-dasharray="3 3" opacity=".5"/><line x1="181" y1="94" x2="130" y2="148" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5" marker-end="url(#cr-m4)"/><text x="130" y="214" font-size="12" text-anchor="middle" fill="var(--slate-deep)">解法：TTL 加隨機秒數</text><text x="300" y="86" font-size="15" text-anchor="middle" opacity=".7" class="mono">?</text><line x1="304" y1="92" x2="350" y2="148" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5" marker-end="url(#cr-m4)"/><text x="340" y="86" font-size="15" text-anchor="middle" opacity=".7" class="mono">?</text><line x1="344" y1="92" x2="358" y2="148" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5" marker-end="url(#cr-m4)"/><text x="380" y="86" font-size="15" text-anchor="middle" opacity=".7" class="mono">?</text><line x1="384" y1="92" x2="366" y2="148" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5" marker-end="url(#cr-m4)"/><text x="420" y="86" font-size="15" text-anchor="middle" opacity=".7" class="mono">?</text><line x1="424" y1="92" x2="374" y2="148" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5" marker-end="url(#cr-m4)"/><rect x="290" y="100" width="180" height="16" rx="3" fill="none" stroke="var(--gold)" stroke-dasharray="4 3"/><text x="380" y="62" font-size="11" text-anchor="middle" opacity=".7">（快取每次都未命中）</text><text x="380" y="214" font-size="12" text-anchor="middle" fill="var(--slate-deep)">解法：Bloom Filter、快取空結果</text><rect x="595" y="70" width="70" height="22" rx="3" fill="var(--gold-soft)" stroke="var(--gold)" stroke-dasharray="3 3"/><text x="630" y="86" font-size="11" text-anchor="middle" class="mono">hot key</text><line x1="600" y1="94" x2="610" y2="148" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5" marker-end="url(#cr-m4)"/><line x1="612" y1="94" x2="614" y2="148" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5" marker-end="url(#cr-m4)"/><line x1="624" y1="94" x2="618" y2="148" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5" marker-end="url(#cr-m4)"/><line x1="636" y1="94" x2="622" y2="148" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5" marker-end="url(#cr-m4)"/><line x1="648" y1="94" x2="626" y2="148" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5" marker-end="url(#cr-m4)"/><line x1="660" y1="94" x2="630" y2="148" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5" marker-end="url(#cr-m4)"/><text x="630" y="214" font-size="12" text-anchor="middle" fill="var(--slate-deep)">解法：互斥重建、邏輯過期</text><text x="380" y="246" font-size="12" text-anchor="middle" opacity=".6">三個名字是業界慣用語，共同點都是「快取沒接住，請求直接打到資料庫」</text>
</svg>
