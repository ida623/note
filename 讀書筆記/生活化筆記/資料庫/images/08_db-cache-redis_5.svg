<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 338" aria-label="兩層快取：上排三台應用程式各有自己的本地快取，下面共用一個 Redis，最下面是資料庫。讀取先查本地、再查 Redis、最後才查資料庫。資料改了除了刪 Redis，還要用 Pub/Sub 或 Redis 的用戶端追蹤發失效通知，讓每一台的本地快取也刪掉那筆；最簡單的做法是本地快取只設很短的 TTL" width="784" height="338">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="338" fill="#FFFFFF" stroke="none"/>
<defs><marker id="cr-m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><rect x="60" y="40" width="160" height="56" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="140.0" y="65.0" font-size="13.5" text-anchor="middle">應用程式 甲</text><text x="140.0" y="83.0" font-size="11.5" text-anchor="middle" opacity=".7">本地快取（短 TTL）</text><rect x="300" y="40" width="160" height="56" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="380.0" y="65.0" font-size="13.5" text-anchor="middle">應用程式 乙</text><text x="380.0" y="83.0" font-size="11.5" text-anchor="middle" opacity=".7">本地快取（短 TTL）</text><rect x="540" y="40" width="160" height="56" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="620.0" y="65.0" font-size="13.5" text-anchor="middle">應用程式 丙</text><text x="620.0" y="83.0" font-size="11.5" text-anchor="middle" opacity=".7">本地快取（短 TTL）</text><rect x="260" y="150" width="240" height="46" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="380.0" y="178.0" font-size="13.5" text-anchor="middle">Redis（共用快取）</text><rect x="260" y="236" width="240" height="40" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="380.0" y="261.0" font-size="13.5" text-anchor="middle">資料庫</text><line x1="140" y1="98" x2="308.0" y2="148" stroke="currentColor" stroke-opacity=".5" stroke-width="1.5" marker-end="url(#cr-m5)"/><line x1="350" y1="98" x2="350" y2="148" stroke="currentColor" stroke-opacity=".5" stroke-width="1.5" marker-end="url(#cr-m5)"/><line x1="410" y1="150" x2="410" y2="100" stroke="var(--slate)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#cr-m5)"/><line x1="620" y1="98" x2="452.0" y2="148" stroke="currentColor" stroke-opacity=".5" stroke-width="1.5" marker-end="url(#cr-m5)"/><line x1="380" y1="198" x2="380" y2="234" stroke="currentColor" stroke-opacity=".5" stroke-width="1.5" marker-end="url(#cr-m5)"/><path d="M500 168 Q690 168 640 100" fill="none" stroke="var(--slate)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#cr-m5)"/><path d="M260 168 Q90 168 140 100" fill="none" stroke="var(--slate)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#cr-m5)"/><text x="650" y="196" font-size="11.5" text-anchor="middle" fill="var(--slate-deep)">失效通知（Pub/Sub 或</text><text x="650" y="212" font-size="11.5" text-anchor="middle" fill="var(--slate-deep)">用戶端追蹤）</text><text x="380" y="300" font-size="12" text-anchor="middle" opacity=".65">讀：本地 → Redis → 資料庫；改資料時除了刪 Redis，還要讓每一台的本地快取也失效</text>
</svg>
