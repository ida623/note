  <rect x="584" y="36" width="56" height="40" fill="var(--surface)" stroke="currentColor"/>
  <rect x="640" y="36" width="56" height="40" fill="var(--surface)" stroke="currentColor"/>
  <rect x="696" y="36" width="56" height="40" fill="var(--surface)" stroke="currentColor"/>
  <g font-size="12" text-anchor="middle" opacity=".6"><text x="348" y="92">0</text><text x="404" y="92">1</text><text x="460" y="92">2</text><text x="516" y="92">3</text><text x="612" y="92">16</text><text x="668" y="92">17</text><text x="724" y="92">18</text></g>
  <g stroke="currentColor" stroke-width="1.5"><line x1="404" y1="96" x2="404" y2="112" marker-end="url(#ht-a4)"/><line x1="460" y1="96" x2="460" y2="112" marker-end="url(#ht-a4)"/><line x1="668" y1="96" x2="668" y2="112" marker-end="url(#ht-a4)"/><line x1="724" y1="96" x2="724" y2="112" marker-end="url(#ht-a4)"/></g>
  <rect x="378" y="114" width="52" height="26" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="404" y="132" font-size="12" text-anchor="middle" class="mono">cherry</text>
  <rect x="434" y="114" width="52" height="26" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="460" y="132" font-size="12" text-anchor="middle" class="mono">kiwi</text>
  <rect x="642" y="114" width="52" height="26" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="668" y="132" font-size="12" text-anchor="middle" class="mono">apple</text>
  <rect x="698" y="114" width="52" height="26" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="724" y="132" font-size="12" text-anchor="middle" class="mono">lemon</text>
  <rect x="30" y="206" width="16" height="14" rx="3" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="54" y="218" font-size="12">hash &amp; 16 是 0：留在原位</text>
  <rect x="30" y="232" width="16" height="14" rx="3" fill="var(--gold-soft)" stroke="var(--gold)"/>
  <text x="54" y="244" font-size="12">hash &amp; 16 不是 0：搬到「原位＋16」</text>
  <text x="320" y="218" font-size="12" opacity=".8">同一條串列拆成兩條，相對順序不變</text>
  <text x="320" y="244" font-size="12" opacity=".8">不必重新呼叫 hashCode()</text>
</svg>
