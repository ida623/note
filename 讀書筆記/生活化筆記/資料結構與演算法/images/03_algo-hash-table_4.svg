<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 294" aria-label="擴容示意：16 個桶時，1 號桶串著 apple、cherry，2 號桶串著 kiwi、lemon；擴容成 32 個桶後，cherry 留在 1 號、kiwi 留在 2 號，apple 搬到 17 號、lemon 搬到 18 號" width="784" height="294">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="294" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="ht-a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs>
  <text x="30" y="22" font-size="13" font-weight="700">擴容前：16 個桶</text>
  <rect x="30" y="36" width="56" height="40" fill="var(--surface)" stroke="currentColor"/>
  <rect x="86" y="36" width="56" height="40" fill="var(--surface)" stroke="currentColor"/>
  <rect x="142" y="36" width="56" height="40" fill="var(--surface)" stroke="currentColor"/>
  <rect x="198" y="36" width="56" height="40" fill="var(--surface)" stroke="currentColor"/>
  <text x="264" y="61" font-size="13" opacity=".6">⋯ 15</text>
  <g font-size="12" text-anchor="middle" opacity=".6"><text x="58" y="92">0</text><text x="114" y="92">1</text><text x="170" y="92">2</text><text x="226" y="92">3</text></g>
  <g stroke="currentColor" stroke-width="1.5"><line x1="114" y1="96" x2="114" y2="112" marker-end="url(#ht-a4)"/><line x1="170" y1="96" x2="170" y2="112" marker-end="url(#ht-a4)"/><line x1="114" y1="140" x2="114" y2="156" marker-end="url(#ht-a4)"/><line x1="170" y1="140" x2="170" y2="156" marker-end="url(#ht-a4)"/></g>
  <rect x="88" y="114" width="52" height="26" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="114" y="132" font-size="12" text-anchor="middle" class="mono">apple</text>
  <rect x="88" y="158" width="52" height="26" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="114" y="176" font-size="12" text-anchor="middle" class="mono">cherry</text>
  <rect x="144" y="114" width="52" height="26" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="170" y="132" font-size="12" text-anchor="middle" class="mono">kiwi</text>
  <rect x="144" y="158" width="52" height="26" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="170" y="176" font-size="12" text-anchor="middle" class="mono">lemon</text>
  <text x="320" y="22" font-size="13" font-weight="700">擴容後：32 個桶</text>
  <rect x="320" y="36" width="56" height="40" fill="var(--surface)" stroke="currentColor"/>
  <rect x="376" y="36" width="56" height="40" fill="var(--surface)" stroke="currentColor"/>
