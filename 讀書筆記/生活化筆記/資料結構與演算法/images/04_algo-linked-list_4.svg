  <text x="370" y="212" font-size="12" fill="var(--slate-deep)">回傳 dummy.next，也就是 2</text>
  <rect x="30" y="252" width="16" height="14" rx="3" fill="var(--gold-soft)" stroke="var(--gold)"/>
  <text x="54" y="264" font-size="12">要刪的節點</text>
  <rect x="150" y="252" width="16" height="14" rx="3" fill="var(--surface)" stroke="currentColor" stroke-dasharray="4 3"/>
  <text x="174" y="264" font-size="12">虛擬頭節點（值隨便填，不算資料）</text>
