<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 330" aria-label="快慢指標找中點：串列 1 到 5，slow 一次走一步、fast 一次走兩步；開始都在 1，一輪後 slow 在 2、fast 在 3，兩輪後 slow 在 3、fast 在 5，fast 走到底，slow 在中點 3" width="784" height="330">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
