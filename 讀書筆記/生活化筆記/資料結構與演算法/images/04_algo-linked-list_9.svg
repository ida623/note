  <text x="68" y="112" font-size="11" text-anchor="middle" opacity=".7" class="mono">dummy</text>
  <text x="68" y="216" font-size="11" text-anchor="middle" opacity=".7" class="mono">dummy</text>
  <text x="30" y="136" font-size="13" font-weight="700">兩個一起走，直到 fast 停在最後一個節點</text>
  <rect x="40" y="164" width="56" height="36" rx="7" fill="var(--surface)" stroke="currentColor" stroke-dasharray="4 3"/><text x="68" y="187" font-size="14" text-anchor="middle" class="mono">0</text><line x1="96" y1="182" x2="128" y2="182" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a9)"/><rect x="130" y="164" width="56" height="36" rx="7" fill="var(--surface)" stroke="currentColor"/><text x="158" y="187" font-size="14" text-anchor="middle" class="mono">10</text><line x1="186" y1="182" x2="218" y2="182" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a9)"/><rect x="220" y="164" width="56" height="36" rx="7" fill="var(--surface)" stroke="currentColor"/><text x="248" y="187" font-size="14" text-anchor="middle" class="mono">20</text><line x1="276" y1="182" x2="308" y2="182" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a9)"/><rect x="310" y="164" width="56" height="36" rx="7" fill="var(--surface)" stroke="currentColor"/><text x="338" y="187" font-size="14" text-anchor="middle" class="mono">30</text><line x1="366" y1="182" x2="398" y2="182" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a9)"/><rect x="400" y="164" width="56" height="36" rx="7" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="428" y="187" font-size="14" text-anchor="middle" class="mono">40</text><line x1="456" y1="182" x2="488" y2="182" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a9)"/><rect x="490" y="164" width="56" height="36" rx="7" fill="var(--surface)" stroke="currentColor"/><text x="518" y="187" font-size="14" text-anchor="middle" class="mono">50</text><line x1="546" y1="182" x2="578" y2="182" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a9)"/><text x="580" y="187" font-size="13" opacity=".55" class="mono">null</text>
  <text x="338" y="150" font-size="12" text-anchor="middle" fill="var(--gold-deep)" class="mono">slow</text><path d="M333 155 L343 155 L338 162z" fill="var(--gold-deep)"/>
  <text x="518" y="150" font-size="12" text-anchor="middle" fill="var(--gold-deep)" class="mono">fast</text><path d="M513 155 L523 155 L518 162z" fill="var(--gold-deep)"/>
  <text x="428" y="222" font-size="12" fill="var(--gold-deep)" text-anchor="middle">要刪的</text>
  <text x="30" y="254" font-size="13" fill="var(--slate-deep)">slow 停在要刪的前一個：slow.next = slow.next.next，結果 10、20、30、50</text>
</svg>
