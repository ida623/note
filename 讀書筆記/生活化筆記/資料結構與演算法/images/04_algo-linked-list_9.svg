<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 296" aria-label="刪除倒數第 2 個：在 10 到 50 前面接 dummy，fast 先從 dummy 走 2 步到 20，然後 slow 與 fast 一起走，fast 停在最後的 50 時 slow 停在 30，刪掉 30 的下一個 40，結果是 10、20、30、50" width="784" height="296">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="296" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="ll-a9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs>
  <text x="30" y="24" font-size="13" font-weight="700">k = 2：fast 先從 dummy 走 2 步</text>
  <rect x="40" y="60" width="56" height="36" rx="7" fill="var(--surface)" stroke="currentColor" stroke-dasharray="4 3"/><text x="68" y="83" font-size="14" text-anchor="middle" class="mono">0</text><line x1="96" y1="78" x2="128" y2="78" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a9)"/><rect x="130" y="60" width="56" height="36" rx="7" fill="var(--surface)" stroke="currentColor"/><text x="158" y="83" font-size="14" text-anchor="middle" class="mono">10</text><line x1="186" y1="78" x2="218" y2="78" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a9)"/><rect x="220" y="60" width="56" height="36" rx="7" fill="var(--surface)" stroke="currentColor"/><text x="248" y="83" font-size="14" text-anchor="middle" class="mono">20</text><line x1="276" y1="78" x2="308" y2="78" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a9)"/><rect x="310" y="60" width="56" height="36" rx="7" fill="var(--surface)" stroke="currentColor"/><text x="338" y="83" font-size="14" text-anchor="middle" class="mono">30</text><line x1="366" y1="78" x2="398" y2="78" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a9)"/><rect x="400" y="60" width="56" height="36" rx="7" fill="var(--surface)" stroke="currentColor"/><text x="428" y="83" font-size="14" text-anchor="middle" class="mono">40</text><line x1="456" y1="78" x2="488" y2="78" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a9)"/><rect x="490" y="60" width="56" height="36" rx="7" fill="var(--surface)" stroke="currentColor"/><text x="518" y="83" font-size="14" text-anchor="middle" class="mono">50</text><line x1="546" y1="78" x2="578" y2="78" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a9)"/><text x="580" y="83" font-size="13" opacity=".55" class="mono">null</text>
  <text x="68" y="46" font-size="12" text-anchor="middle" fill="var(--gold-deep)" class="mono">slow</text><path d="M63 51 L73 51 L68 58z" fill="var(--gold-deep)"/>
