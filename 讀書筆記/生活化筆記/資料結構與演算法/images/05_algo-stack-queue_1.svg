<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 286" aria-label="堆疊的五個步驟：依序 push 1、2、3，三個數由下往上疊；pop 拿走最上面的 3；peek 只看頂端的 2、不拿走" width="784" height="286">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="286" fill="#FFFFFF" stroke="none"/>
<defs><marker id="sq-m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><text x="86" y="30" font-size="14" text-anchor="middle" class="mono" fill="var(--gold-deep)">push(1)</text><path d="M52.0 56 L52.0 196 L120.0 196 L120.0 56" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5"/><rect x="58.0" y="150" width="56" height="40" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="86.0" y="175.0" font-size="14" text-anchor="middle" class="mono">1</text><text x="86" y="226" font-size="12.5" text-anchor="middle">頂端是 1</text><line x1="126" y1="120" x2="190" y2="120" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5" marker-end="url(#sq-m1)"/><text x="233" y="30" font-size="14" text-anchor="middle" class="mono" fill="var(--gold-deep)">push(2)</text><path d="M199.0 56 L199.0 196 L267.0 196 L267.0 56" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5"/><rect x="205.0" y="150" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="233.0" y="175.0" font-size="14" text-anchor="middle" class="mono">1</text><rect x="205.0" y="110" width="56" height="40" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="233.0" y="135.0" font-size="14" text-anchor="middle" class="mono">2</text><text x="233" y="226" font-size="12.5" text-anchor="middle">頂端是 2</text><line x1="273" y1="120" x2="337" y2="120" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5" marker-end="url(#sq-m1)"/><text x="380" y="30" font-size="14" text-anchor="middle" class="mono" fill="var(--gold-deep)">push(3)</text><path d="M346.0 56 L346.0 196 L414.0 196 L414.0 56" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5"/><rect x="352.0" y="150" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="380.0" y="175.0" font-size="14" text-anchor="middle" class="mono">1</text><rect x="352.0" y="110" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="380.0" y="135.0" font-size="14" text-anchor="middle" class="mono">2</text><rect x="352.0" y="70" width="56" height="40" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="380.0" y="95.0" font-size="14" text-anchor="middle" class="mono">3</text><text x="380" y="226" font-size="12.5" text-anchor="middle">頂端是 3</text><line x1="420" y1="120" x2="484" y2="120" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5" marker-end="url(#sq-m1)"/><text x="527" y="30" font-size="14" text-anchor="middle" class="mono" fill="var(--gold-deep)">pop() → 3</text><path d="M493.0 56 L493.0 196 L561.0 196 L561.0 56" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5"/><rect x="499.0" y="150" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="527.0" y="175.0" font-size="14" text-anchor="middle" class="mono">1</text><rect x="499.0" y="110" width="56" height="40" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="527.0" y="135.0" font-size="14" text-anchor="middle" class="mono">2</text><text x="527" y="226" font-size="12.5" text-anchor="middle">拿走 3，頂端變 2</text><line x1="567" y1="120" x2="631" y2="120" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5" marker-end="url(#sq-m1)"/><text x="674" y="30" font-size="14" text-anchor="middle" class="mono" fill="var(--gold-deep)">peek() → 2</text><path d="M640.0 56 L640.0 196 L708.0 196 L708.0 56" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5"/><rect x="646.0" y="150" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="674.0" y="175.0" font-size="14" text-anchor="middle" class="mono">1</text><rect x="646.0" y="110" width="56" height="40" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="674.0" y="135.0" font-size="14" text-anchor="middle" class="mono">2</text><text x="674" y="226" font-size="12.5" text-anchor="middle">只看不拿</text><text x="40" y="250" font-size="12" opacity=".6">古銅格＝這一步之後的頂端；所有動作都只碰頂端</text>
</svg>
