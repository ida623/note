<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 306" aria-label="用兩個堆疊做佇列，分三格：第一格 offer 1、2、3 之後，in 堆疊由底到頂是 1、2、3，out 是空的。第二格 poll 時 out 是空的，把 in 整批彈出、推進 out，out 由底到頂變成 3、2、1。第三格 out 彈出頂端的 1" width="784" height="306">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="306" fill="#FFFFFF" stroke="none"/>
<defs><marker id="sq-m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><text x="125" y="28" font-size="13" text-anchor="middle" fill="var(--gold-deep)">offer 1、2、3 之後</text><path d="M41.0 76 L41.0 216 L109.0 216 L109.0 76" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5"/><rect x="47.0" y="170" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="75.0" y="195.0" font-size="14" text-anchor="middle" class="mono">1</text><rect x="47.0" y="130" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="75.0" y="155.0" font-size="14" text-anchor="middle" class="mono">2</text><rect x="47.0" y="90" width="56" height="40" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="75.0" y="115.0" font-size="14" text-anchor="middle" class="mono">3</text><path d="M141.0 76 L141.0 216 L209.0 216 L209.0 76" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5"/><text x="75" y="240" font-size="13" text-anchor="middle" class="mono">in</text><text x="175" y="240" font-size="13" text-anchor="middle" class="mono">out</text><text x="125" y="266" font-size="12.5" text-anchor="middle">in 頂端是 3</text><line x1="242" y1="140" x2="276" y2="140" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5" marker-end="url(#sq-m6)"/><text x="375" y="28" font-size="13" text-anchor="middle" fill="var(--gold-deep)">poll()：out 空了，整批倒過去</text><path d="M291.0 76 L291.0 216 L359.0 216 L359.0 76" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5"/><path d="M391.0 76 L391.0 216 L459.0 216 L459.0 76" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5"/><rect x="397.0" y="170" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="425.0" y="195.0" font-size="14" text-anchor="middle" class="mono">3</text><rect x="397.0" y="130" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="425.0" y="155.0" font-size="14" text-anchor="middle" class="mono">2</text><rect x="397.0" y="90" width="56" height="40" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="425.0" y="115.0" font-size="14" text-anchor="middle" class="mono">1</text><text x="325" y="240" font-size="13" text-anchor="middle" class="mono">in</text><text x="425" y="240" font-size="13" text-anchor="middle" class="mono">out</text><text x="375" y="266" font-size="12.5" text-anchor="middle">out 頂端變成 1</text><path d="M325 70 Q375 40 420 70" fill="none" stroke="var(--slate)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#sq-m6)"/><line x1="492" y1="140" x2="526" y2="140" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5" marker-end="url(#sq-m6)"/><text x="625" y="28" font-size="13" text-anchor="middle" fill="var(--gold-deep)">out.pop() → 1</text><path d="M541.0 76 L541.0 216 L609.0 216 L609.0 76" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5"/><path d="M641.0 76 L641.0 216 L709.0 216 L709.0 76" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5"/><rect x="647.0" y="170" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="675.0" y="195.0" font-size="14" text-anchor="middle" class="mono">3</text><rect x="647.0" y="130" width="56" height="40" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="675.0" y="155.0" font-size="14" text-anchor="middle" class="mono">2</text><text x="575" y="240" font-size="13" text-anchor="middle" class="mono">in</text><text x="675" y="240" font-size="13" text-anchor="middle" class="mono">out</text><text x="625" y="266" font-size="12.5" text-anchor="middle">最早進來的 1 先出去</text>
</svg>
