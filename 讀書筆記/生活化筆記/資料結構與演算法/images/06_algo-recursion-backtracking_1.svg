<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 358" aria-label="呼叫堆疊：factorial(4) 遞迴到最深時，由下往上依序是 main、factorial(4)、factorial(3)、factorial(2)、factorial(1)，每一框各有自己的 n。最上面的 factorial(1) 碰到終止條件回傳 1，接著右邊的箭頭一層一層往下回傳 2、6、24" width="784" height="358">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="358" fill="#FFFFFF" stroke="none"/>
<defs><marker id="rc-m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><text x="60" y="28" font-size="13" fill="var(--gold-deep)">呼叫堆疊（最深的那一刻）</text><rect x="60" y="254" width="330" height="40" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="74" y="279" font-size="14" class="mono">main</text><text x="192" y="279" font-size="13" class="mono" fill="var(--gold-deep)"></text><text x="256" y="279" font-size="12" opacity=".75">等 factorial(4) 回傳</text><rect x="60" y="208" width="330" height="40" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="74" y="233" font-size="14" class="mono">factorial(4)</text><text x="192" y="233" font-size="13" class="mono" fill="var(--gold-deep)">n = 4</text><text x="256" y="233" font-size="12" opacity=".75">等 factorial(3) 回傳</text><rect x="60" y="162" width="330" height="40" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="74" y="187" font-size="14" class="mono">factorial(3)</text><text x="192" y="187" font-size="13" class="mono" fill="var(--gold-deep)">n = 3</text><text x="256" y="187" font-size="12" opacity=".75">等 factorial(2) 回傳</text><rect x="60" y="116" width="330" height="40" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="74" y="141" font-size="14" class="mono">factorial(2)</text><text x="192" y="141" font-size="13" class="mono" fill="var(--gold-deep)">n = 2</text><text x="256" y="141" font-size="12" opacity=".75">等 factorial(1) 回傳</text><rect x="60" y="70" width="330" height="40" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="74" y="95" font-size="14" class="mono">factorial(1)</text><text x="192" y="95" font-size="13" class="mono" fill="var(--gold-deep)">n = 1</text><text x="256" y="95" font-size="12" opacity=".75">終止條件：直接回傳 1</text><text x="60" y="322" font-size="12" opacity=".6">每呼叫一次就在頂端多一框；每一框有自己的 n</text><path d="M396 90 Q436 113.0 398 136" fill="none" stroke="var(--slate)" stroke-width="1.5" marker-end="url(#rc-m1)"/><text x="444" y="118.0" font-size="13" fill="var(--slate-deep)">回傳 1</text><path d="M396 136 Q436 159.0 398 182" fill="none" stroke="var(--slate)" stroke-width="1.5" marker-end="url(#rc-m1)"/><text x="444" y="164.0" font-size="13" fill="var(--slate-deep)">回傳 2 × 1 = 2</text><path d="M396 182 Q436 205.0 398 228" fill="none" stroke="var(--slate)" stroke-width="1.5" marker-end="url(#rc-m1)"/><text x="444" y="210.0" font-size="13" fill="var(--slate-deep)">回傳 3 × 2 = 6</text><path d="M396 228 Q436 251.0 398 274" fill="none" stroke="var(--slate)" stroke-width="1.5" marker-end="url(#rc-m1)"/><text x="444" y="256.0" font-size="13" fill="var(--slate-deep)">回傳 4 × 6 = 24</text><text x="444" y="28" font-size="13" fill="var(--slate-deep)">回傳時一框一框拿掉</text>
</svg>
