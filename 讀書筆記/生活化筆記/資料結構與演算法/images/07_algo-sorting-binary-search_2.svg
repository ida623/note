<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 390" aria-label="插入排序的五輪：陣列 5、2、4、6、1、3。每一輪把下一張插進前面已排好的那一段，比它大的往右挪一格。最後得到 1 到 6" width="784" height="390">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
