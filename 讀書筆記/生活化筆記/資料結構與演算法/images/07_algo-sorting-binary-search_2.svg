xt><rect x="380" y="74" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="408" y="99" font-size="14" text-anchor="middle" class="mono">3</text><text x="454" y="99" font-size="12.5">2 比 5 小，5 右移，2 放到最前面</text><text x="30" y="153" font-size="13" class="mono">i = 2</text><rect x="100" y="128" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="128" y="153" font-size="14" text-anchor="middle" class="mono">2</text><rect x="156" y="128" width="56" height="40" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="184" y="153" font-size="14" text-anchor="middle" class="mono">4</text><rect x="212" y="128" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="240" y="153" font-size="14" text-anchor="middle" class="mono">5</text><rect x="268" y="128" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="296" y="153" font-size="14" text-anchor="middle" class="mono">6</text><rect x="324" y="128" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="352" y="153" font-size="14" text-anchor="middle" class="mono">1</text><rect x="380" y="128" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="408" y="153" font-size="14" text-anchor="middle" class="mono">3</text><text x="454" y="153" font-size="12.5">4 插到 2 和 5 中間</text><text x="30" y="207" font-size="13" class="mono">i = 3</text><rect x="100" y="182" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="128" y="207" font-size="14" text-anchor="middle" class="mono">2</text><rect x="156" y="182" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="184" y="207" font-size="14" text-anchor="middle" class="mono">4</text><rect x="212" y="182" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="240" y="207" font-size="14" text-anchor="middle" class="mono">5</text><rect x="268" y="182" width="56" height="40" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="296" y="207" font-size="14" text-anchor="middle" class="mono">6</text><rect x="324" y="182" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="352" y="207" font-size="14" text-anchor="middle" class="mono">1</text><rect x="380" y="182" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="408" y="207" font-size="14" text-anchor="middle" class="mono">3</text><text x="454" y="207" font-size="12.5">6 比前面都大，不用動</text><text x="30" y="261" font-size="13" class="mono">i = 4</text><rect x="100" y="236" width="56" height="40" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="128" y="261" font-size="14" text-anchor="middle" class="mono">1</text><rect x="156" y="236" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="184" y="261" font-size="14" text-anchor="middle" class="mono">2</text><rect x="212" y="236" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="240" y="261" font-size="14" text-anchor="middle" class="mono">4</text><rect x="268" y="236" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="296" y="261" font-size="14" text-anchor="middle" class="mono">5</text><rect x="324" y="236" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="352" y="261" font-size="14" text-anchor="middle" class="mono">6</text><rect x="380" y="236" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="408" y="261" font-size="14" text-anchor="middle" class="mono">3</text><text x="454" y="261" font-size="12.5">前面四個都右移，1 放到最前面</text><text x="30" y="315" font-size="13" class="mono">i = 5</text><rect x="100" y="290" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="128" y="315" font-size="14" text-anchor="middle" class="mono">1</text><rect x="156" y="290" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="184" y="315" font-size="14" text-anchor="middle" class="mono">2</text><rect x="212" y="290" width="56" height="40" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="240" y="315" font-size="14" text-anchor="middle" class="mono">3</text><rect x="268" y="290" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="296" y="315" font-size="14" text-anchor="middle" class="mono">4</text><rect x="324" y="290" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="352" y="315" font-size="14" text-anchor="middle" class="mono">5</text><rect x="380" y="290" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="408" y="315" font-size="14" text-anchor="middle" class="mono">6</text><text x="454" y="315" font-size="12.5">4、5、6 右移，3 放到 2 後面</text><text x="30" y="352" font-size="12" opacity=".6">古銅格＝這一輪插進去的那張；灰藍格＝已經排好的前段；白格＝還沒處理</text>
</svg>
