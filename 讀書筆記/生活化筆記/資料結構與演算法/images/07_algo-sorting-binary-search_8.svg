<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 228" aria-label="在答案上二分：容量 4 到 12 各要幾天運完。容量 4 要 5 天、5 要 4 天，都超過 3 天；從容量 6 開始只要 3 天以內。第一個做得到的容量 6 就是答案" width="784" height="228">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="228" fill="#FFFFFF" stroke="none"/>
<rect x="110" y="60" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="138" y="85" font-size="14" text-anchor="middle" class="mono">4</text><text x="138" y="120" font-size="12.5" text-anchor="middle">5 天</text><text x="138" y="140" font-size="13" text-anchor="middle">✗</text><rect x="166" y="60" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="194" y="85" font-size="14" text-anchor="middle" class="mono">5</text><text x="194" y="120" font-size="12.5" text-anchor="middle">4 天</text><text x="194" y="140" font-size="13" text-anchor="middle">✗</text><rect x="222" y="60" width="56" height="40" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="250" y="85" font-size="14" text-anchor="middle" class="mono">6</text><text x="250" y="120" font-size="12.5" text-anchor="middle" fill="var(--slate-deep)">3 天</text><text x="250" y="140" font-size="13" text-anchor="middle" fill="var(--slate-deep)">✓</text><rect x="278" y="60" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="306" y="85" font-size="14" text-anchor="middle" class="mono">7</text><text x="306" y="120" font-size="12.5" text-anchor="middle" fill="var(--slate-deep)">3 天</text><text x="306" y="140" font-size="13" text-anchor="middle" fill="var(--slate-deep)">✓</text><rect x="334" y="60" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="362" y="85" font-size="14" text-anchor="middle" class="mono">8</text><text x="362" y="120" font-size="12.5" text-anchor="middle" fill="var(--slate-deep)">3 天</text><text x="362" y="140" font-size="13" text-anchor="middle" fill="var(--slate-deep)">✓</text><rect x="390" y="60" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="418" y="85" font-size="14" text-anchor="middle" class="mono">9</text><text x="418" y="120" font-size="12.5" text-anchor="middle" fill="var(--slate-deep)">2 天</text><text x="418" y="140" font-size="13" text-anchor="middle" fill="var(--slate-deep)">✓</text><rect x="446" y="60" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="474" y="85" font-size="14" text-anchor="middle" class="mono">10</text><text x="474" y="120" font-size="12.5" text-anchor="middle" fill="var(--slate-deep)">2 天</text><text x="474" y="140" font-size="13" text-anchor="middle" fill="var(--slate-deep)">✓</text><rect x="502" y="60" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="530" y="85" font-size="14" text-anchor="middle" class="mono">11</text><text x="530" y="120" font-size="12.5" text-anchor="middle" fill="var(--slate-deep)">2 天</text><text x="530" y="140" font-size="13" text-anchor="middle" fill="var(--slate-deep)">✓</text><rect x="558" y="60" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="586" y="85" font-size="14" text-anchor="middle" class="mono">12</text><text x="586" y="120" font-size="12.5" text-anchor="middle" fill="var(--slate-deep)">2 天</text><text x="586" y="140" font-size="13" text-anchor="middle" fill="var(--slate-deep)">✓</text><text x="630" y="85" font-size="14" class="mono">… 16</text><text x="30" y="85" font-size="13">容量</text><text x="30" y="120" font-size="13">要幾天</text><text x="30" y="140" font-size="13">3 天內</text><path d="M244 46 L256 46 L250 56z" fill="var(--gold-deep)"/><text x="250" y="40" font-size="13" text-anchor="middle" class="mono" fill="var(--gold-deep)">答案 6</text><text x="30" y="190" font-size="12" opacity=".6">貨物重量 3、2、2、4、1、4，要在 3 天內運完。容量越大天數越少：左邊一段都做不到，右邊一段都做得到</text>
</svg>
