<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 390" aria-label="用雙端佇列求滑動視窗最大值：陣列 4、2、5、1、3、6、2，視窗長度 3。i 等於 4 時 deque 裡是 5 與 3，最大值是前端的 5；i 等於 5 時前端的 5 滑出視窗，6 進來前把 3 也丟掉，deque 只剩 6" width="784" height="390">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="390" fill="#FFFFFF" stroke="none"/>
<rect x="110" y="30" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="138" y="55" font-size="14" text-anchor="middle" class="mono">4</text><text x="138" y="86" font-size="12" text-anchor="middle" class="mono" opacity=".6">0</text><rect x="166" y="30" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="194" y="55" font-size="14" text-anchor="middle" class="mono">2</text><text x="194" y="86" font-size="12" text-anchor="middle" class="mono" opacity=".6">1</text><rect x="222" y="30" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="250" y="55" font-size="14" text-anchor="middle" class="mono">5</text><text x="250" y="86" font-size="12" text-anchor="middle" class="mono" opacity=".6">2</text><rect x="278" y="30" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="306" y="55" font-size="14" text-anchor="middle" class="mono">1</text><text x="306" y="86" font-size="12" text-anchor="middle" class="mono" opacity=".6">3</text><rect x="334" y="30" width="56" height="40" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="362" y="55" font-size="14" text-anchor="middle" class="mono">3</text><text x="362" y="86" font-size="12" text-anchor="middle" class="mono" opacity=".6">4</text><rect x="390" y="30" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="418" y="55" font-size="14" text-anchor="middle" class="mono">6</text><text x="418" y="86" font-size="12" text-anchor="middle" class="mono" opacity=".6">5</text><rect x="446" y="30" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="474" y="55" font-size="14" text-anchor="middle" class="mono">2</text><text x="474" y="86" font-size="12" text-anchor="middle" class="mono" opacity=".6">6</text><rect x="218" y="26" width="176" height="48" rx="6" fill="none" stroke="var(--gold)" stroke-width="2.5"/><text x="20" y="55" font-size="13" class="mono">i = 4</text><text x="20" y="127" font-size="13" class="mono">deque</text><text x="76" y="116" font-size="11" opacity=".6">前端</text><rect x="110" y="102" width="72" height="40" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="146" y="127" font-size="14" text-anchor="middle" class="mono">5（2）</text><rect x="182" y="102" width="72" height="40" fill="var(--surface)" stroke="currentColor"/><text x="218" y="127" font-size="14" text-anchor="middle" class="mono">3（4）</text><text x="346" y="127" font-size="12.5">i = 4：3 進來前，尾端的 1 比 3 小，丟掉；最大值是前端的 5</text><rect x="110" y="200" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="138" y="225" font-size="14" text-anchor="middle" class="mono">4</text><text x="138" y="256" font-size="12" text-anchor="middle" class="mono" opacity=".6">0</text><rect x="166" y="200" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="194" y="225" font-size="14" text-anchor="middle" class="mono">2</text><text x="194" y="256" font-size="12" text-anchor="middle" class="mono" opacity=".6">1</text><rect x="222" y="200" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="250" y="225" font-size="14" text-anchor="middle" class="mono">5</text><text x="250" y="256" font-size="12" text-anchor="middle" class="mono" opacity=".6">2</text><rect x="278" y="200" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="306" y="225" font-size="14" text-anchor="middle" class="mono">1</text><text x="306" y="256" font-size="12" text-anchor="middle" class="mono" opacity=".6">3</text><rect x="334" y="200" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="362" y="225" font-size="14" text-anchor="middle" class="mono">3</text><text x="362" y="256" font-size="12" text-anchor="middle" class="mono" opacity=".6">4</text><rect x="390" y="200" width="56" height="40" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="418" y="225" font-size="14" text-anchor="middle" class="mono">6</text><text x="418" y="256" font-size="12" text-anchor="middle" class="mono" opacity=".6">5</text><rect x="446" y="200" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="474" y="225" font-size="14" text-anchor="middle" class="mono">2</text><text x="474" y="256" font-size="12" text-anchor="middle" class="mono" opacity=".6">6</text><rect x="274" y="196" width="176" height="48" rx="6" fill="none" stroke="var(--gold)" stroke-width="2.5"/><text x="20" y="225" font-size="13" class="mono">i = 5</text><text x="20" y="297" font-size="13" class="mono">deque</text><text x="76" y="286" font-size="11" opacity=".6">前端</text><rect x="110" y="272" width="72" height="40" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="146" y="297" font-size="14" text-anchor="middle" class="mono">6（5）</text><text x="346" y="297" font-size="12.5">i = 5：前端索引 2 滑出視窗，丟掉；6 進來前把尾端的 3 也丟掉；最大值 6</text><text x="20" y="352" font-size="12" opacity=".6">視窗長度 3。deque 放索引（括號裡），對應的值由前到後遞減，所以前端永遠是視窗裡最大的</text>
</svg>
