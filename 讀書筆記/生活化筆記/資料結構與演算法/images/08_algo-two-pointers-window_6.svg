<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 310" aria-label="前綴和：陣列 a 是 3、1、4、1、5、9，前綴和 p 是 0、3、4、8、9、14、23。要算 a 索引 2 到 4 的和，用 p[5] 減 p[2]，14 減 4 等於 10" width="784" height="310">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="310" fill="#FFFFFF" stroke="none"/>
<text x="20" y="75" font-size="14" class="mono">a</text><rect x="178" y="50" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="206" y="75" font-size="14" text-anchor="middle" class="mono">3</text><text x="206" y="106" font-size="12" text-anchor="middle" class="mono" opacity=".6">0</text><rect x="234" y="50" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="262" y="75" font-size="14" text-anchor="middle" class="mono">1</text><text x="262" y="106" font-size="12" text-anchor="middle" class="mono" opacity=".6">1</text><rect x="290" y="50" width="56" height="40" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="318" y="75" font-size="14" text-anchor="middle" class="mono">4</text><text x="318" y="106" font-size="12" text-anchor="middle" class="mono" opacity=".6">2</text><rect x="346" y="50" width="56" height="40" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="374" y="75" font-size="14" text-anchor="middle" class="mono">1</text><text x="374" y="106" font-size="12" text-anchor="middle" class="mono" opacity=".6">3</text><rect x="402" y="50" width="56" height="40" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="430" y="75" font-size="14" text-anchor="middle" class="mono">5</text><text x="430" y="106" font-size="12" text-anchor="middle" class="mono" opacity=".6">4</text><rect x="458" y="50" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="486" y="75" font-size="14" text-anchor="middle" class="mono">9</text><text x="486" y="106" font-size="12" text-anchor="middle" class="mono" opacity=".6">5</text><text x="20" y="185" font-size="14" class="mono">p</text><rect x="150" y="160" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="178" y="185" font-size="14" text-anchor="middle" class="mono">0</text><text x="178" y="216" font-size="12" text-anchor="middle" class="mono" opacity=".6">0</text><rect x="206" y="160" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="234" y="185" font-size="14" text-anchor="middle" class="mono">3</text><text x="234" y="216" font-size="12" text-anchor="middle" class="mono" opacity=".6">1</text><rect x="262" y="160" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="290" y="185" font-size="14" text-anchor="middle" class="mono">4</text><text x="290" y="216" font-size="12" text-anchor="middle" class="mono" opacity=".6">2</text><rect x="318" y="160" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="346" y="185" font-size="14" text-anchor="middle" class="mono">8</text><text x="346" y="216" font-size="12" text-anchor="middle" class="mono" opacity=".6">3</text><rect x="374" y="160" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="402" y="185" font-size="14" text-anchor="middle" class="mono">9</text><text x="402" y="216" font-size="12" text-anchor="middle" class="mono" opacity=".6">4</text><rect x="430" y="160" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="458" y="185" font-size="14" text-anchor="middle" class="mono">14</text><text x="458" y="216" font-size="12" text-anchor="middle" class="mono" opacity=".6">5</text><rect x="486" y="160" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="514" y="185" font-size="14" text-anchor="middle" class="mono">23</text><text x="514" y="216" font-size="12" text-anchor="middle" class="mono" opacity=".6">6</text><text x="374" y="32" font-size="12.5" text-anchor="middle" fill="var(--gold-deep)">a[2..4] = 4 + 1 + 5 = 10</text><text x="566" y="178" font-size="12.5">p[i] = a[0] + … + a[i−1]</text><text x="566" y="198" font-size="12.5">p[0] = 0</text><text x="346" y="244" font-size="13" text-anchor="middle" fill="var(--slate-deep)">p[5] − p[2] = 14 − 4 = 10</text><text x="20" y="272" font-size="12" opacity=".6">a 的格子跟 p 錯開半格：p[i] 是 a 的第 i 格「左邊」全部的和。a[l..r] 的和 = p[r+1] − p[l]</text>
</svg>
