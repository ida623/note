<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 354" aria-label="上浮：在最小堆 1、3、8、5、9 加入 2。先放到最後一格（第 5 格，父節點是第 2 格的 8），2 比 8 小就交換；再跟父節點 1 比，2 比 1 大，停。結果是 1、3、2、5、9、8" width="784" height="354">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="354" fill="#FFFFFF" stroke="none"/>
  <line x1="190" y1="50" x2="105" y2="120" stroke="currentColor" stroke-opacity=".45"/>
  <line x1="190" y1="50" x2="275" y2="120" stroke="currentColor" stroke-opacity=".45"/>
  <line x1="105" y1="120" x2="62" y2="190" stroke="currentColor" stroke-opacity=".45"/>
  <line x1="105" y1="120" x2="148" y2="190" stroke="currentColor" stroke-opacity=".45"/>
  <line x1="275" y1="120" x2="232" y2="190" stroke="var(--gold)" stroke-width="3"/>
  <circle cx="190" cy="50" r="19" fill="var(--surface)" stroke="currentColor"/>
  <text x="190" y="55" font-size="14" text-anchor="middle" class="mono">1</text>
  <text x="190" y="82" font-size="11" text-anchor="middle" class="mono" opacity=".6">[0]</text>
  <circle cx="105" cy="120" r="19" fill="var(--surface)" stroke="currentColor"/>
  <text x="105" y="125" font-size="14" text-anchor="middle" class="mono">3</text>
  <text x="105" y="152" font-size="11" text-anchor="middle" class="mono" opacity=".6">[1]</text>
  <circle cx="275" cy="120" r="19" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="275" y="125" font-size="14" text-anchor="middle" class="mono">8</text>
  <text x="275" y="152" font-size="11" text-anchor="middle" class="mono" opacity=".6">[2]</text>
  <circle cx="62" cy="190" r="19" fill="var(--surface)" stroke="currentColor"/>
  <text x="62" y="195" font-size="14" text-anchor="middle" class="mono">5</text>
  <text x="62" y="222" font-size="11" text-anchor="middle" class="mono" opacity=".6">[3]</text>
  <circle cx="148" cy="190" r="19" fill="var(--surface)" stroke="currentColor"/>
  <text x="148" y="195" font-size="14" text-anchor="middle" class="mono">9</text>
  <text x="148" y="222" font-size="11" text-anchor="middle" class="mono" opacity=".6">[4]</text>
  <circle cx="232" cy="190" r="19" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
  <text x="232" y="195" font-size="14" text-anchor="middle" class="mono">2</text>
  <text x="232" y="222" font-size="11" text-anchor="middle" class="mono" opacity=".6">[5]</text>
  <text x="30" y="250" font-size="13" fill="var(--gold-deep)">① 放到最後一格</text>
  <text x="30" y="272" font-size="13">父節點 8 比 2 大：交換</text>
  <text x="30" y="300" font-size="12.5" class="mono" opacity=".8">陣列 [1, 3, 8, 5, 9, 2]</text>
  <line x1="570" y1="50" x2="485" y2="120" stroke="currentColor" stroke-opacity=".45"/>
  <line x1="570" y1="50" x2="655" y2="120" stroke="var(--gold)" stroke-width="3"/>
  <line x1="485" y1="120" x2="442" y2="190" stroke="currentColor" stroke-opacity=".45"/>
  <line x1="485" y1="120" x2="528" y2="190" stroke="currentColor" stroke-opacity=".45"/>
  <line x1="655" y1="120" x2="612" y2="190" stroke="currentColor" stroke-opacity=".45"/>
  <circle cx="570" cy="50" r="19" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="570" y="55" font-size="14" text-anchor="middle" class="mono">1</text>
  <text x="570" y="82" font-size="11" text-anchor="middle" class="mono" opacity=".6">[0]</text>
  <circle cx="485" cy="120" r="19" fill="var(--surface)" stroke="currentColor"/>
  <text x="485" y="125" font-size="14" text-anchor="middle" class="mono">3</text>
  <text x="485" y="152" font-size="11" text-anchor="middle" class="mono" opacity=".6">[1]</text>
  <circle cx="655" cy="120" r="19" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
  <text x="655" y="125" font-size="14" text-anchor="middle" class="mono">2</text>
  <text x="655" y="152" font-size="11" text-anchor="middle" class="mono" opacity=".6">[2]</text>
  <circle cx="442" cy="190" r="19" fill="var(--surface)" stroke="currentColor"/>
  <text x="442" y="195" font-size="14" text-anchor="middle" class="mono">5</text>
  <text x="442" y="222" font-size="11" text-anchor="middle" class="mono" opacity=".6">[3]</text>
  <circle cx="528" cy="190" r="19" fill="var(--surface)" stroke="currentColor"/>
  <text x="528" y="195" font-size="14" text-anchor="middle" class="mono">9</text>
  <text x="528" y="222" font-size="11" text-anchor="middle" class="mono" opacity=".6">[4]</text>
  <circle cx="612" cy="190" r="19" fill="var(--surface)" stroke="currentColor"/>
  <text x="612" y="195" font-size="14" text-anchor="middle" class="mono">8</text>
  <text x="612" y="222" font-size="11" text-anchor="middle" class="mono" opacity=".6">[5]</text>
  <text x="410" y="250" font-size="13" fill="var(--gold-deep)">② 2 上到第 2 格</text>
  <text x="410" y="272" font-size="13">父節點 1 比 2 小：停</text>
  <text x="410" y="300" font-size="12.5" class="mono" opacity=".8">陣列 [1, 3, 2, 5, 9, 8]</text>
  <text x="378" y="130" font-size="22" text-anchor="middle">→</text>
</svg>
