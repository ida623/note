<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 254" aria-label="兩個堆找中位數：加入 5、15、1、3、8 之後，左半是最大堆，放 1、3、5，堆頂 5；右半是最小堆，放 8、15，堆頂 8。左半比右半多一個，中位數就是左半的堆頂 5" width="784" height="254">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="254" fill="#FFFFFF" stroke="none"/>
  <text x="60" y="40" font-size="13" fill="var(--slate-deep)">左半：最大堆（堆頂是左半最大的）</text>
  <rect x="90" y="60" width="56" height="40" fill="var(--surface)" stroke="currentColor"/>
  <text x="118" y="85" font-size="14" text-anchor="middle" class="mono">1</text>
  <rect x="146" y="60" width="56" height="40" fill="var(--surface)" stroke="currentColor"/>
  <text x="174" y="85" font-size="14" text-anchor="middle" class="mono">3</text>
  <rect x="202" y="60" width="56" height="40" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
  <text x="230" y="85" font-size="14" text-anchor="middle" class="mono">5</text>
  <text x="430" y="40" font-size="13" fill="var(--slate-deep)">右半：最小堆（堆頂是右半最小的）</text>
  <rect x="460" y="60" width="56" height="40" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
  <text x="488" y="85" font-size="14" text-anchor="middle" class="mono">8</text>
  <rect x="516" y="60" width="56" height="40" fill="var(--surface)" stroke="currentColor"/>
  <text x="544" y="85" font-size="14" text-anchor="middle" class="mono">15</text>
  <line x1="380" y1="50" x2="380" y2="120" stroke="currentColor" stroke-dasharray="4 4" opacity=".5"/>
  <text x="268" y="85" font-size="13" fill="var(--gold-deep)">堆頂 5</text>
  <text x="580" y="85" font-size="13" fill="var(--gold-deep)">堆頂 8</text>
  <text x="60" y="150" font-size="13">規則一：左半全部 ≤ 右半全部</text>
  <text x="60" y="174" font-size="13">規則二：左半的個數 = 右半，或多一個</text>
  <text x="60" y="206" font-size="13" fill="var(--gold-deep)">5 個數，左半多一個 → 中位數是左半堆頂 5；偶數個時是兩個堆頂的平均</text>
  <text x="60" y="126" font-size="11.5" opacity=".7">（格子只是示意哪些數在哪一半，堆裡的實際排列不一定是排好序）</text>
</svg>
