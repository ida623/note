<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 320" aria-label="BFS 走訪示意：七個頂點 0 到 6，邊是 0-1、0-2、1-3、2-3、2-5、3-4、5-6。依離 0 的步數分成四欄：0 步是 0；1 步是 1、2；2 步是 3、5；3 步是 4、6。拜訪順序依序是 0、1、2、3、5、4、6" width="784" height="320">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="320" fill="#FFFFFF" stroke="none"/>
  <defs></defs>
  <rect x="30" y="36" width="120" height="216" rx="10" fill="var(--gold-soft)" fill-opacity=".35" stroke="currentColor" stroke-opacity=".15"/>
  <text x="90" y="28" font-size="12" text-anchor="middle" fill="var(--slate-deep)">離 0 有 0 步</text>
  <rect x="190" y="36" width="120" height="216" rx="10" fill="none" fill-opacity=".35" stroke="currentColor" stroke-opacity=".15"/>
  <text x="250" y="28" font-size="12" text-anchor="middle" fill="var(--slate-deep)">離 0 有 1 步</text>
  <rect x="350" y="36" width="120" height="216" rx="10" fill="none" fill-opacity=".35" stroke="currentColor" stroke-opacity=".15"/>
  <text x="410" y="28" font-size="12" text-anchor="middle" fill="var(--slate-deep)">離 0 有 2 步</text>
  <rect x="510" y="36" width="120" height="216" rx="10" fill="none" fill-opacity=".35" stroke="currentColor" stroke-opacity=".15"/>
  <text x="570" y="28" font-size="12" text-anchor="middle" fill="var(--slate-deep)">離 0 有 3 步</text>
  <line x1="108.7" y1="133.0" x2="231.3" y2="87.0" stroke="currentColor" stroke-width="1.5"/>
  <line x1="108.7" y1="147.0" x2="231.3" y2="193.0" stroke="currentColor" stroke-width="1.5"/>
  <line x1="270.0" y1="80.0" x2="390.0" y2="80.0" stroke="currentColor" stroke-width="1.5"/>
  <line x1="266.0" y1="188.0" x2="394.0" y2="92.0" stroke="currentColor" stroke-width="1.5"/>
  <line x1="270.0" y1="200.0" x2="390.0" y2="200.0" stroke="currentColor" stroke-width="1.5"/>
  <line x1="430.0" y1="80.0" x2="550.0" y2="80.0" stroke="currentColor" stroke-width="1.5"/>
  <line x1="430.0" y1="200.0" x2="550.0" y2="200.0" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="90" cy="140" r="20" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="90" y="145" font-size="14" text-anchor="middle" class="mono">0</text>
  <circle cx="250" cy="80" r="20" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="250" y="85" font-size="14" text-anchor="middle" class="mono">1</text>
  <circle cx="250" cy="200" r="20" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="250" y="205" font-size="14" text-anchor="middle" class="mono">2</text>
  <circle cx="410" cy="80" r="20" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="410" y="85" font-size="14" text-anchor="middle" class="mono">3</text>
  <circle cx="410" cy="200" r="20" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="410" y="205" font-size="14" text-anchor="middle" class="mono">5</text>
  <circle cx="570" cy="80" r="20" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="570" y="85" font-size="14" text-anchor="middle" class="mono">4</text>
  <circle cx="570" cy="200" r="20" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="570" y="205" font-size="14" text-anchor="middle" class="mono">6</text>
  <text x="90" y="113" font-size="11" text-anchor="middle" fill="var(--gold-deep)">第1</text>
  <text x="250" y="53" font-size="11" text-anchor="middle" fill="var(--gold-deep)">第2</text>
  <text x="250" y="238" font-size="11" text-anchor="middle" fill="var(--gold-deep)">第3</text>
  <text x="410" y="53" font-size="11" text-anchor="middle" fill="var(--gold-deep)">第4</text>
  <text x="410" y="238" font-size="11" text-anchor="middle" fill="var(--gold-deep)">第5</text>
  <text x="570" y="53" font-size="11" text-anchor="middle" fill="var(--gold-deep)">第6</text>
  <text x="570" y="238" font-size="11" text-anchor="middle" fill="var(--gold-deep)">第7</text>
  <text x="380" y="282" font-size="12" text-anchor="middle">BFS 從 0 出發的拜訪順序：0、1、2、3、5、4、6（鄰居照編號由小到大）</text>
</svg>
