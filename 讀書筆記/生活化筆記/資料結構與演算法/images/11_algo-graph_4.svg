<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 328" aria-label="DFS 走訪示意：同一張圖從 0 出發，一路往深處走 0 到 1 到 3 到 2 到 5 到 6，6 沒有新鄰居，一路退回 3 再走到 4。拜訪順序是 0、1、3、2、5、6、4；0-2 那條邊走到時 2 已經拜訪過，畫成虛線" width="784" height="328">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="328" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="gr-a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--gold)"/></marker></defs>
  <line x1="108.7" y1="133.0" x2="229.4" y2="87.7" stroke="var(--gold)" stroke-width="2.2" marker-end="url(#gr-a4)"/>
  <line x1="108.7" y1="147.0" x2="231.3" y2="193.0" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" stroke-opacity=".5"/>
  <line x1="270.0" y1="80.0" x2="388.0" y2="80.0" stroke="var(--gold)" stroke-width="2.2" marker-end="url(#gr-a4)"/>
  <line x1="394.0" y1="92.0" x2="267.6" y2="186.8" stroke="var(--gold)" stroke-width="2.2" marker-end="url(#gr-a4)"/>
  <line x1="270.0" y1="200.0" x2="388.0" y2="200.0" stroke="var(--gold)" stroke-width="2.2" marker-end="url(#gr-a4)"/>
  <line x1="430.0" y1="80.0" x2="548.0" y2="80.0" stroke="var(--gold)" stroke-width="2.2" marker-end="url(#gr-a4)"/>
  <line x1="430.0" y1="200.0" x2="548.0" y2="200.0" stroke="var(--gold)" stroke-width="2.2" marker-end="url(#gr-a4)"/>
  <circle cx="90" cy="140" r="20" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="90" y="145" font-size="14" text-anchor="middle" class="mono">0</text>
  <circle cx="250" cy="80" r="20" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="250" y="85" font-size="14" text-anchor="middle" class="mono">1</text>
  <circle cx="250" cy="200" r="20" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="250" y="205" font-size="14" text-anchor="middle" class="mono">2</text>
  <circle cx="410" cy="80" r="20" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="410" y="85" font-size="14" text-anchor="middle" class="mono">3</text>
  <circle cx="410" cy="200" r="20" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="410" y="205" font-size="14" text-anchor="middle" class="mono">5</text>
  <circle cx="570" cy="80" r="20" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="570" y="85" font-size="14" text-anchor="middle" class="mono">4</text>
  <circle cx="570" cy="200" r="20" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="570" y="205" font-size="14" text-anchor="middle" class="mono">6</text>
  <text x="90" y="113" font-size="11" text-anchor="middle" fill="var(--gold-deep)">第1</text>
  <text x="250" y="53" font-size="11" text-anchor="middle" fill="var(--gold-deep)">第2</text>
  <text x="410" y="53" font-size="11" text-anchor="middle" fill="var(--gold-deep)">第3</text>
  <text x="250" y="238" font-size="11" text-anchor="middle" fill="var(--gold-deep)">第4</text>
  <text x="410" y="238" font-size="11" text-anchor="middle" fill="var(--gold-deep)">第5</text>
  <text x="570" y="238" font-size="11" text-anchor="middle" fill="var(--gold-deep)">第6</text>
  <text x="570" y="53" font-size="11" text-anchor="middle" fill="var(--gold-deep)">第7</text>
  <text x="380" y="270" font-size="12" text-anchor="middle">DFS 從 0 出發的拜訪順序：0、1、3、2、5、6、4</text>
  <text x="380" y="290" font-size="12" text-anchor="middle" fill="var(--slate-deep)">古銅箭頭＝第一次走到某個頂點的那條邊；虛線＝走到時對面已經拜訪過</text>
</svg>
