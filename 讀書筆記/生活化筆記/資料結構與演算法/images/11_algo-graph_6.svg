  <text x="240" y="104" font-size="11" text-anchor="middle" fill="var(--slate-deep)">入度 1</text>
  <rect x="198.0" y="193.0" width="84" height="34" rx="7" fill="var(--surface)" stroke="currentColor"/><text x="240" y="215" font-size="13" text-anchor="middle" class="mono">cache</text>
