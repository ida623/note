<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 310" aria-label="服務啟動順序的有向無環圖：config 指向 db 與 cache；db 指向 auth 與 account；cache 指向 account；auth 指向 gateway；account 指向 payment；payment 指向 gateway。每個方塊下面標入度：config 0、db 1、cache 1、auth 1、account 2、payment 1、gateway 2" width="784" height="310">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
