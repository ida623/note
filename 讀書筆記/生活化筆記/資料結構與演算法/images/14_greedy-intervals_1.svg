<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 234" aria-label="同樣是貪婪找零：新臺幣面額湊 67 元拿 50、10、5、1、1 共 5 枚，跟最佳解一樣；面額 1、3、4 湊 6 元，貪婪拿 4、1、1 共 3 枚，最佳是 3、3 兩枚" width="784" height="234">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="234" fill="#FFFFFF" stroke="none"/>
  <text x="20" y="34" font-size="13" font-weight="700">新臺幣湊 67 元</text>
  <g font-size="13" text-anchor="middle" class="mono">
  <circle cx="190" cy="30" r="20" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="190" y="35">50</text>
  <circle cx="240" cy="30" r="20" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="240" y="35">10</text>
  <circle cx="290" cy="30" r="20" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="290" y="35">5</text>
  <circle cx="340" cy="30" r="20" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="340" y="35">1</text>
  <circle cx="390" cy="30" r="20" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="390" y="35">1</text>
  </g>
  <text x="430" y="35" font-size="12">貪婪 5 枚 ＝ 最佳 5 枚</text>
  <text x="20" y="104" font-size="13" font-weight="700">面額 1、3、4 湊 6 元</text>
  <g font-size="13" text-anchor="middle" class="mono">
  <circle cx="190" cy="100" r="20" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="190" y="105">4</text>
  <circle cx="240" cy="100" r="20" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="240" y="105">1</text>
  <circle cx="290" cy="100" r="20" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="290" y="105">1</text>
  <circle cx="190" cy="160" r="20" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="190" y="165">3</text>
  <circle cx="240" cy="160" r="20" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="240" y="165">3</text>
  </g>
  <text x="330" y="105" font-size="12" fill="var(--gold-deep)">貪婪：先拿最大的 4，3 枚</text>
  <text x="280" y="165" font-size="12" fill="var(--slate-deep)">動態規劃：3 + 3，2 枚</text>
  <text x="380" y="200" font-size="12" text-anchor="middle">古銅＝貪婪的選法；灰藍＝最佳解</text>
</svg>
