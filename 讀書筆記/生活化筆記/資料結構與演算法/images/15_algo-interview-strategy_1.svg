<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 344" aria-label="解題流程六步：問清楚、暴力解、找瓶頸、寫程式、自己跑、講複雜度。前三步在上排由左到右，後三步在下排由右到左；自己跑發現錯誤時，虛線箭頭回到寫程式" width="784" height="344">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
