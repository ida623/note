.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="344" fill="#FFFFFF" stroke="none"/>
<defs><marker id="is-m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><rect x="40" y="40" width="210" height="64" rx="8" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="145.0" y="67" font-size="15" text-anchor="middle" fill="var(--gold-deep)">1 問清楚</text><text x="145.0" y="88" font-size="12.5" text-anchor="middle">輸入範圍、邊界、回傳什麼</text><rect x="275" y="40" width="210" height="64" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="380.0" y="67" font-size="15" text-anchor="middle" fill="var(--gold-deep)">2 暴力解</text><text x="380.0" y="88" font-size="12.5" text-anchor="middle">先講會對的寫法與複雜度</text><rect x="510" y="40" width="210" height="64" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="615.0" y="67" font-size="15" text-anchor="middle" fill="var(--gold-deep)">3 找瓶頸</text><text x="615.0" y="88" font-size="12.5" text-anchor="middle">換資料結構或手法</text><rect x="510" y="170" width="210" height="64" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="615.0" y="197" font-size="15" text-anchor="middle" fill="var(--gold-deep)">4 寫程式</text><text x="615.0" y="218" font-size="12.5" text-anchor="middle">邊寫邊說在做什麼</text><rect x="275" y="170" width="210" height="64" rx="8" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="380.0" y="197" font-size="15" text-anchor="middle" fill="var(--gold-deep)">5 自己跑</text><text x="380.0" y="218" font-size="12.5" text-anchor="middle">用小例子與邊界走一遍</text><rect x="40" y="170" width="210" height="64" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="145.0" y="197" font-size="15" text-anchor="middle" fill="var(--gold-deep)">6 講複雜度</text><text x="145.0" y="218" font-size="12.5" text-anchor="middle">時間、空間、假設</text><line x1="250" y1="72" x2="273" y2="72" stroke="currentColor" stroke-opacity=".6" stroke-width="1.5" marker-end="url(#is-m1)"/><line x1="485" y1="72" x2="508" y2="72" stroke="currentColor" stroke-opacity=".6" stroke-width="1.5" marker-end="url(#is-m1)"/><line x1="615" y1="104" x2="615" y2="168" stroke="currentColor" stroke-opacity=".6" stroke-width="1.5" marker-end="url(#is-m1)"/><line x1="508" y1="202" x2="487" y2="202" stroke="currentColor" stroke-opacity=".6" stroke-width="1.5" marker-end="url(#is-m1)"/><line x1="273" y1="202" x2="252" y2="202" stroke="currentColor" stroke-opacity=".6" stroke-width="1.5" marker-end="url(#is-m1)"/><path d="M380 236 Q470 270 560 236" fill="none" stroke="var(--slate)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#is-m1)"/><text x="470" y="284" font-size="12" text-anchor="middle" fill="var(--slate-deep)">跑出錯就回去改</text><text x="40" y="306" font-size="12" opacity=".6">古銅框是容易被跳過的兩步：一開始沒問清楚、寫完沒自己跑</text>
</svg>
