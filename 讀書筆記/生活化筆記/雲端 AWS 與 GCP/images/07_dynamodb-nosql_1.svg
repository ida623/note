<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 294" aria-label="分割鍵決定放哪個分割區，排序鍵決定分割區裡的順序。左邊三個項目的分割鍵分別是 ACCT#A001、ACCT#A002、ACCT#B777，經過雜湊函式後各自落到分割區一、分割區二、分割區三。放大分割區一：分割鍵都是 ACCT#A001 的項目排成一列，依排序鍵 PROFILE、TX#2026-09-30、TX#2026-10-01、TX#2026-10-02 由小到大排好，這一群叫項目集合" width="784" height="294">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="294" fill="#FFFFFF" stroke="none"/>
<defs><marker id="dy-m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><text x="90" y="26" font-size="12.5" text-anchor="middle" opacity=".75">項目的分割鍵</text><rect x="22" y="40" width="136" height="32" rx="5" fill="var(--surface)" stroke="currentColor"/><text x="90" y="61" font-size="12.5" text-anchor="middle" class="mono">ACCT#A001</text><rect x="22" y="86" width="136" height="32" rx="5" fill="var(--surface)" stroke="currentColor"/><text x="90" y="107" font-size="12.5" text-anchor="middle" class="mono">ACCT#A002</text><rect x="22" y="132" width="136" height="32" rx="5" fill="var(--surface)" stroke="currentColor"/><text x="90" y="153" font-size="12.5" text-anchor="middle" class="mono">ACCT#B777</text><rect x="210" y="70" width="110" height="64" rx="8" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="265" y="98" font-size="13.5" text-anchor="middle">雜湊函式</text><text x="265" y="117" font-size="11" text-anchor="middle" opacity=".7">同樣輸入、同樣輸出</text><line x1="160" y1="56" x2="208" y2="88" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#dy-m1)"/><line x1="160" y1="102" x2="208" y2="102" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#dy-m1)"/><line x1="160" y1="148" x2="208" y2="116" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#dy-m1)"/><rect x="380" y="34" width="110" height="36" rx="5" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="435" y="57" font-size="13" text-anchor="middle">分割區一</text><rect x="380" y="84" width="110" height="36" rx="5" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="435" y="107" font-size="13" text-anchor="middle">分割區二</text><rect x="380" y="134" width="110" height="36" rx="5" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="435" y="157" font-size="13" text-anchor="middle">分割區三</text><line x1="322" y1="88" x2="378" y2="54" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#dy-m1)"/><line x1="322" y1="102" x2="378" y2="102" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#dy-m1)"/><line x1="322" y1="116" x2="378" y2="150" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#dy-m1)"/><text x="268" y="196" font-size="11.5" text-anchor="middle" opacity=".7">A001 → 一、A002 → 二、B777 → 三（示意）</text><path d="M492 52 L540 52" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/><rect x="540" y="22" width="200" height="176" rx="8" fill="none" stroke="var(--gold)" stroke-dasharray="4 3"/><text x="640" y="42" font-size="12" text-anchor="middle" fill="var(--gold-deep)">分割區一裡的 ACCT#A001</text><rect x="556" y="54" width="168" height="26" rx="4" fill="var(--surface)" stroke="currentColor"/><text x="640" y="72" font-size="11.5" text-anchor="middle" class="mono">PROFILE</text><rect x="556" y="86" width="168" height="26" rx="4" fill="var(--surface)" stroke="currentColor"/><text x="640" y="104" font-size="11.5" text-anchor="middle" class="mono">TX#2026-09-30…</text><rect x="556" y="118" width="168" height="26" rx="4" fill="var(--surface)" stroke="currentColor"/><text x="640" y="136" font-size="11.5" text-anchor="middle" class="mono">TX#2026-10-01…</text><rect x="556" y="150" width="168" height="26" rx="4" fill="var(--surface)" stroke="currentColor"/><text x="640" y="168" font-size="11.5" text-anchor="middle" class="mono">TX#2026-10-02…</text><text x="640" y="192" font-size="11" text-anchor="middle" opacity=".7">依排序鍵由小到大</text><text x="380" y="232" font-size="12.5" text-anchor="middle">分割鍵決定「放哪一格」，排序鍵決定「格子裡怎麼排」</text><text x="380" y="254" font-size="11.5" text-anchor="middle" opacity=".6">古銅虛線框＝一個項目集合：分割鍵相同的項目，存在一起、排好順序</text>
</svg>
