<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 274" aria-label="熱分割區示意：四個分割區的每秒寫入量長條圖，上限虛線是每秒 1,000 個寫入單位。分割區一、二、四各約 200，分割區三被「今天日期」這個分割鍵灌到 1,400，超過上限的部分被限流。右邊的改法是在日期後面加 1 到 200 的後綴，寫入分散到很多分割鍵" width="784" height="274">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="274" fill="#FFFFFF" stroke="none"/>
<defs><marker id="dy-m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><line x1="60" y1="200" x2="470" y2="200" stroke="currentColor" stroke-opacity=".4" stroke-width="1.5"/><line x1="60" y1="80" x2="470" y2="80" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="6 4"/><text x="64" y="72" font-size="11.5" text-anchor="start" fill="var(--gold-deep)">每個分割區的上限：每秒 1,000</text><rect x="80" y="176" width="70" height="24" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="115" y="218" font-size="12" text-anchor="middle">分割區一</text><rect x="180" y="176" width="70" height="24" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="215" y="218" font-size="12" text-anchor="middle">分割區二</text><rect x="280" y="80" width="70" height="120" fill="var(--slate-soft)" stroke="var(--slate)"/><rect x="280" y="32" width="70" height="48" fill="var(--gold-soft)" stroke="var(--gold)" stroke-dasharray="4 3"/><text x="315" y="60" font-size="11.5" text-anchor="middle" fill="var(--gold-deep)">被限流</text><text x="315" y="218" font-size="12" text-anchor="middle">分割區三</text><text x="315" y="236" font-size="11" text-anchor="middle" opacity=".7" class="mono">2026-10-03</text><rect x="380" y="176" width="70" height="24" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="415" y="218" font-size="12" text-anchor="middle">分割區四</text><text x="40" y="84" font-size="11" text-anchor="end" opacity=".6">1,000</text><text x="40" y="204" font-size="11" text-anchor="end" opacity=".6">0</text><line x1="492" y1="120" x2="530" y2="120" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#dy-m2)"/><rect x="536" y="40" width="204" height="160" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="638" y="64" font-size="13" text-anchor="middle" fill="var(--gold-deep)">改法：日期後面加後綴</text><text x="638" y="92" font-size="11.5" text-anchor="middle" class="mono">2026-10-03.1</text><text x="638" y="112" font-size="11.5" text-anchor="middle" class="mono">2026-10-03.2</text><text x="638" y="132" font-size="11.5" text-anchor="middle" class="mono">……</text><text x="638" y="152" font-size="11.5" text-anchor="middle" class="mono">2026-10-03.200</text><text x="638" y="180" font-size="11" text-anchor="middle" opacity=".7">寫入散到 200 個分割鍵</text><text x="265" y="22" font-size="12.5" text-anchor="middle">每秒寫入量（示意）</text>
</svg>
