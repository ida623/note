<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 324" aria-label="使用者連到 ALB，ALB 把請求分給目標群組裡的 EC2；這些 EC2 屬於一個 Auto Scaling 群組，分散在兩個可用區。EC2 把耗時的工作送到 SNS 主題，主題扇出到兩條 SQS 佇列，各由背景服務處理" width="784" height="324">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="324" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="lb-1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
  <rect x="20" y="120" width="90" height="50" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="65" y="150" font-size="14" text-anchor="middle">使用者</text>
  <line x1="110" y1="145" x2="148" y2="145" stroke="currentColor" marker-end="url(#lb-1-arrow)"/>
  <rect x="150" y="115" width="90" height="60" rx="8" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
  <text x="195" y="142" font-size="14" text-anchor="middle">ALB</text>
  <text x="195" y="162" font-size="11.5" text-anchor="middle" fill="var(--gold-deep)">一個入口</text>
  <rect x="270" y="30" width="230" height="240" rx="10" fill="none" stroke="var(--slate)" stroke-dasharray="6 4"/>
  <text x="280" y="50" font-size="12.5" fill="var(--slate-deep)">Auto Scaling 群組</text>
  <text x="280" y="22" font-size="12" fill="var(--slate-deep)">（註冊到 ALB 的目標群組）</text>
  <rect x="285" y="62" width="95" height="196" rx="6" fill="none" stroke="currentColor" stroke-opacity=".35"/>
  <text x="332" y="80" font-size="11.5" text-anchor="middle" opacity=".7">可用區 a</text>
  <rect x="390" y="62" width="95" height="196" rx="6" fill="none" stroke="currentColor" stroke-opacity=".35"/>
  <text x="437" y="80" font-size="11.5" text-anchor="middle" opacity=".7">可用區 c</text>
  <rect x="297" y="95" width="70" height="40" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="332" y="120" font-size="13" text-anchor="middle">EC2</text>
  <rect x="297" y="150" width="70" height="40" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="332" y="175" font-size="13" text-anchor="middle">EC2</text>
  <rect x="402" y="95" width="70" height="40" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="437" y="120" font-size="13" text-anchor="middle">EC2</text>
  <rect x="402" y="205" width="70" height="40" rx="6" fill="none" stroke="var(--slate)" stroke-dasharray="4 3"/>
  <text x="437" y="230" font-size="12" text-anchor="middle" opacity=".8">新加的</text>
  <line x1="240" y1="135" x2="295" y2="117" stroke="currentColor" marker-end="url(#lb-1-arrow)"/>
  <line x1="240" y1="150" x2="295" y2="168" stroke="currentColor" marker-end="url(#lb-1-arrow)"/>
  <polyline points="240,122 290,88 437,88 437,93" fill="none" stroke="currentColor" marker-end="url(#lb-1-arrow)"/>
  <line x1="500" y1="145" x2="538" y2="145" stroke="currentColor" marker-end="url(#lb-1-arrow)"/>
  <rect x="540" y="120" width="70" height="50" rx="8" fill="var(--gold-soft)" stroke="var(--gold)"/>
  <text x="575" y="150" font-size="14" text-anchor="middle">SNS</text>
  <line x1="610" y1="135" x2="648" y2="100" stroke="currentColor" marker-end="url(#lb-1-arrow)"/>
  <line x1="610" y1="155" x2="648" y2="190" stroke="currentColor" marker-end="url(#lb-1-arrow)"/>
  <rect x="650" y="75" width="95" height="44" rx="6" fill="var(--surface)" stroke="currentColor"/>
  <text x="697" y="102" font-size="12.5" text-anchor="middle">SQS：通知</text>
  <rect x="650" y="170" width="95" height="44" rx="6" fill="var(--surface)" stroke="currentColor"/>
  <text x="697" y="197" font-size="12.5" text-anchor="middle">SQS：帳務</text>
  <text x="20" y="292" font-size="12.5" opacity=".75">虛線框的 EC2 是負載變大時，Auto Scaling 自動加開的那一台</text>
</svg>
