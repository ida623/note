<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 274" aria-label="ALB 的 HTTPS 443 監聽器有三條規則：優先順序 10 的 path-pattern /api/* 送到 api 目標群組；優先順序 20 的 host-header admin.example.com 送到 admin 目標群組；都不符合時走預設規則，送到 web 目標群組" width="784" height="274">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="274" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="lb-2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
  <rect x="20" y="95" width="140" height="60" rx="8" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
  <text x="90" y="122" font-size="13" text-anchor="middle">ALB 監聽器</text>
  <text x="90" y="141" font-size="12" text-anchor="middle" class="mono">HTTPS :443</text>
  <rect x="200" y="30" width="330" height="44" rx="6" fill="var(--surface)" stroke="currentColor"/>
  <text x="212" y="57" font-size="12.5" class="mono">優先 10　path-pattern /api/*</text>
  <rect x="200" y="103" width="330" height="44" rx="6" fill="var(--surface)" stroke="currentColor"/>
  <text x="212" y="130" font-size="12.5" class="mono">優先 20　host-header admin.example.com</text>
  <rect x="200" y="176" width="330" height="44" rx="6" fill="var(--surface)" stroke="currentColor" stroke-dasharray="5 4"/>
  <text x="212" y="203" font-size="12.5">預設規則（前面都不符合）</text>
  <line x1="160" y1="115" x2="198" y2="55" stroke="currentColor" marker-end="url(#lb-2-arrow)"/>
  <line x1="160" y1="125" x2="198" y2="125" stroke="currentColor" marker-end="url(#lb-2-arrow)"/>
  <line x1="160" y1="135" x2="198" y2="195" stroke="currentColor" marker-end="url(#lb-2-arrow)"/>
  <line x1="530" y1="52" x2="588" y2="52" stroke="currentColor" marker-end="url(#lb-2-arrow)"/>
  <line x1="530" y1="125" x2="588" y2="125" stroke="currentColor" marker-end="url(#lb-2-arrow)"/>
  <line x1="530" y1="198" x2="588" y2="198" stroke="currentColor" marker-end="url(#lb-2-arrow)"/>
  <rect x="590" y="30" width="150" height="44" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="665" y="57" font-size="12.5" text-anchor="middle" class="mono">api-tg</text>
  <rect x="590" y="103" width="150" height="44" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="665" y="130" font-size="12.5" text-anchor="middle" class="mono">admin-tg</text>
  <rect x="590" y="176" width="150" height="44" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="665" y="203" font-size="12.5" text-anchor="middle" class="mono">web-tg</text>
  <text x="200" y="243" font-size="12" opacity=".75">由上往下比，第一條符合的就用；admin.example.com/api/x 會先被優先 10 那條接走</text>
</svg>
