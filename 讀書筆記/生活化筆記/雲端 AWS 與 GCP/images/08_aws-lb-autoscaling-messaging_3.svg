<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 234" aria-label="可見性逾時的時間線：第 0 秒消費者收走訊息，接下來 5 秒其他人看不到；沒刪除的話第 5 秒重新可見，第 6 秒又被收走，收到次數變 2；處理完呼叫 DeleteMessage 才真的從佇列消失" width="784" height="234">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="234" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="lb-3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
  <line x1="40" y1="110" x2="730" y2="110" stroke="currentColor" stroke-opacity=".4" marker-end="url(#lb-3-arrow)"/>
  <rect x="60" y="88" width="250" height="44" fill="var(--gold-soft)" stroke="var(--gold)"/>
  <text x="185" y="115" font-size="13" text-anchor="middle">看不到（可見性逾時 5 秒）</text>
  <rect x="310" y="88" width="40" height="44" fill="var(--surface)" stroke="currentColor"/>
  <text x="330" y="152" font-size="11.5" text-anchor="middle">重新可見</text>
  <rect x="350" y="88" width="300" height="44" fill="var(--gold-soft)" stroke="var(--gold)"/>
  <text x="405" y="115" font-size="13" text-anchor="middle">又看不到</text>
  <text x="60" y="70" font-size="12.5">第 0 秒：第一次收</text>
  <text x="60" y="48" font-size="12" fill="var(--gold-deep)">收到次數 1</text>
  <text x="350" y="70" font-size="12.5">第 6 秒：第二次收</text>
  <text x="350" y="48" font-size="12" fill="var(--gold-deep)">收到次數 2</text>
  <rect x="470" y="93" width="130" height="34" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="535" y="115" font-size="13" text-anchor="middle">DeleteMessage</text>
  <text x="535" y="152" font-size="12" text-anchor="middle" fill="var(--slate-deep)">逾時內刪除，這時才真的消失</text>
  <text x="40" y="195" font-size="12.5" opacity=".75">「收走」不等於「處理完」：沒刪除，逾時一到就會再被別人（或自己）收到</text>
</svg>
