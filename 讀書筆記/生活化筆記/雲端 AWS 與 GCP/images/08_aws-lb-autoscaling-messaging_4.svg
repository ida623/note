<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 254" aria-label="SNS 扇出：發布兩則事件到主題 transfer-events，三條 SQS 佇列訂閱。notify 收到兩則，包在 SNS 的 JSON 信封裡；ledger 開了原始訊息傳遞，收到兩則原始內容；risk-large 有篩選政策 amount 大於等於 100000，只收到 250000 那一則" width="784" height="254">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="254" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="lb-4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
  <text x="20" y="90" font-size="12.5" class="mono">t-5001 金額 3000</text>
  <text x="20" y="140" font-size="12.5" class="mono">t-5002 金額 250000</text>
  <line x1="160" y1="98" x2="218" y2="110" stroke="currentColor" marker-end="url(#lb-4-arrow)"/>
  <line x1="160" y1="136" x2="218" y2="124" stroke="currentColor" marker-end="url(#lb-4-arrow)"/>
  <rect x="220" y="85" width="150" height="60" rx="8" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
  <text x="295" y="112" font-size="13" text-anchor="middle">SNS 主題</text>
  <text x="295" y="131" font-size="11.5" text-anchor="middle" class="mono">transfer-events</text>
  <line x1="370" y1="105" x2="438" y2="45" stroke="currentColor" marker-end="url(#lb-4-arrow)"/>
  <line x1="370" y1="115" x2="438" y2="115" stroke="currentColor" marker-end="url(#lb-4-arrow)"/>
  <line x1="370" y1="125" x2="438" y2="185" stroke="currentColor" marker-end="url(#lb-4-arrow)"/>
  <rect x="440" y="20" width="300" height="50" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="452" y="41" font-size="12.5" class="mono">notify</text>
  <text x="452" y="60" font-size="12">兩則都收；包在 SNS 的 JSON 信封裡</text>
  <rect x="440" y="90" width="300" height="50" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="452" y="111" font-size="12.5" class="mono">ledger（原始訊息傳遞）</text>
  <text x="452" y="130" font-size="12">兩則都收；只有原始內容</text>
  <rect x="440" y="160" width="300" height="50" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="452" y="181" font-size="12.5" class="mono">risk-large（篩選 amount ≥ 100000）</text>
  <text x="452" y="200" font-size="12">只收 t-5002</text>
</svg>
