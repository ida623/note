      <text x="381" y="53" font-size="14" font-weight="700" fill="#22242A" text-anchor="middle">Controller</text>
      <text x="381" y="73" font-size="11.5" fill="#55575E" text-anchor="middle">指揮：收請求、叫人做事</text>
      <line x1="466" y1="58" x2="586" y2="58" stroke="#8B8D94" stroke-width="2"/>
      <polygon points="586,58 576,53 576,63" fill="#8B8D94"/>
      <text x="526" y="50" font-size="11.5" fill="#55575E" text-anchor="middle">更新</text>
