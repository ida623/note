<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 234" aria-label="45 分鐘系統設計面試的時間軸：理解問題 3 到 10 分鐘，整體設計 10 到 15 分鐘，深入設計 10 到 25 分鐘，收尾 3 到 5 分鐘。下方標示每段要交出的東西：假設清單、方框圖加粗估、兩三個關鍵元件、瓶頸與回顧" width="784" height="234">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="234" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="sd-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <rect x="20" y="40" width="120" height="50" rx="8" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
  <text x="80" y="62" font-size="13" text-anchor="middle" font-weight="700">理解問題</text>
  <text x="80" y="80" font-size="11.5" text-anchor="middle" opacity=".8">3〜10 分</text>
  <rect x="150" y="40" width="170" height="50" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="235" y="62" font-size="13" text-anchor="middle" font-weight="700">整體設計</text>
  <text x="235" y="80" font-size="11.5" text-anchor="middle" opacity=".8">10〜15 分</text>
  <rect x="330" y="40" width="300" height="50" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="480" y="62" font-size="13" text-anchor="middle" font-weight="700">深入設計</text>
  <text x="480" y="80" font-size="11.5" text-anchor="middle" opacity=".8">10〜25 分</text>
  <rect x="640" y="40" width="100" height="50" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="690" y="62" font-size="13" text-anchor="middle" font-weight="700">收尾</text>
  <text x="690" y="80" font-size="11.5" text-anchor="middle" opacity=".8">3〜5 分</text>
  <line x1="20" y1="112" x2="738" y2="112" stroke="currentColor" stroke-opacity=".5" marker-end="url(#sd-flow-arrow)"/>
  <text x="80" y="140" font-size="12" text-anchor="middle">假設寫在白板上</text>
  <text x="235" y="140" font-size="12" text-anchor="middle">方框圖＋粗估</text>
  <text x="480" y="140" font-size="12" text-anchor="middle">挑兩三個關鍵元件往下挖</text>
  <text x="690" y="140" font-size="12" text-anchor="middle">瓶頸與回顧</text>
  <text x="380" y="186" font-size="12" text-anchor="middle" fill="var(--slate-deep)">每一段結束前問一句「這樣的方向可以嗎？」，取得同意再往下</text>
</svg>
