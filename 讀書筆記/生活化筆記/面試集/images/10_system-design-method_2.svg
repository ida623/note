<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 324" aria-label="架構一步步長大：第一步是用戶端、一台應用伺服器、一個資料庫；第二步加上負載平衡與多台伺服器；第三步加快取與讀取複本；第四步把慢的工作丟進佇列交給背景工作者；第五步資料庫分片並跨可用區複寫。每一步旁邊註明是哪個數字逼出來的" width="784" height="324">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="324" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="sd-evolve-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <rect x="20" y="30" width="130" height="150" rx="8" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
  <text x="85" y="54" font-size="13" text-anchor="middle" font-weight="700">先能動</text>
  <text x="85" y="84" font-size="12" text-anchor="middle">用戶端</text>
  <text x="85" y="110" font-size="12" text-anchor="middle">一台伺服器</text>
  <text x="85" y="136" font-size="12" text-anchor="middle">一個資料庫</text>
  <rect x="170" y="30" width="130" height="150" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="235" y="54" font-size="13" text-anchor="middle" font-weight="700">多台＋負載平衡</text>
  <text x="235" y="96" font-size="12" text-anchor="middle">伺服器無狀態</text>
  <text x="235" y="122" font-size="12" text-anchor="middle">掛一台照常服務</text>
  <rect x="320" y="30" width="130" height="150" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="385" y="54" font-size="13" text-anchor="middle" font-weight="700">快取＋讀取複本</text>
  <text x="385" y="96" font-size="12" text-anchor="middle">讀的量</text>
  <text x="385" y="122" font-size="12" text-anchor="middle">大到資料庫撐不住</text>
  <rect x="470" y="30" width="130" height="150" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="535" y="54" font-size="13" text-anchor="middle" font-weight="700">佇列＋背景工作</text>
  <text x="535" y="96" font-size="12" text-anchor="middle">尖峰遠高於平均</text>
  <text x="535" y="122" font-size="12" text-anchor="middle">後段慢或靠外部</text>
  <rect x="620" y="30" width="120" height="150" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="680" y="54" font-size="13" text-anchor="middle" font-weight="700">分片＋跨區</text>
  <text x="680" y="96" font-size="12" text-anchor="middle">寫入或資料量</text>
  <text x="680" y="122" font-size="12" text-anchor="middle">超過一台上限</text>
  <line x1="150" y1="105" x2="168" y2="105" stroke="currentColor" stroke-width="1.6" marker-end="url(#sd-evolve-arrow)"/>
  <line x1="300" y1="105" x2="318" y2="105" stroke="currentColor" stroke-width="1.6" marker-end="url(#sd-evolve-arrow)"/>
  <line x1="450" y1="105" x2="468" y2="105" stroke="currentColor" stroke-width="1.6" marker-end="url(#sd-evolve-arrow)"/>
  <line x1="600" y1="105" x2="618" y2="105" stroke="currentColor" stroke-width="1.6" marker-end="url(#sd-evolve-arrow)"/>
  <text x="380" y="222" font-size="12.5" text-anchor="middle">每往右一步，都要說得出「是哪個數字或需求逼我加的」，以及「代價是什麼」</text>
  <text x="380" y="248" font-size="12.5" text-anchor="middle" fill="var(--slate-deep)">粗估顯示一台就夠時，停在左邊也是正確答案</text>
</svg>
