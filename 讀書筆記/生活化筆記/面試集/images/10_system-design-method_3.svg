<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 354" aria-label="交易通知服務的整體架構：帳務系統在交易提交時把事件寫進 Outbox，送進交易通知佇列；行銷後台把一次活動拆成許多批次送進行銷佇列；通知工作者優先消化交易佇列，查使用者偏好與裝置清單，寫一筆通知紀錄後呼叫推播服務或簡訊廠商；失敗用指數退避加抖動重試，用盡進死信佇列；App 從通知紀錄查歷史" width="784" height="354">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="354" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="sd-notify-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <rect x="20" y="30" width="140" height="56" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="90" y="54" font-size="13" text-anchor="middle" font-weight="700">帳務系統</text>
  <text x="90" y="74" font-size="11.5" text-anchor="middle" opacity=".8">交易提交＋Outbox</text>
  <rect x="20" y="170" width="140" height="56" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="90" y="194" font-size="13" text-anchor="middle" font-weight="700">行銷後台</text>
  <text x="90" y="214" font-size="11.5" text-anchor="middle" opacity=".8">活動拆成批次</text>
  <rect x="210" y="30" width="140" height="56" rx="8" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
  <text x="280" y="54" font-size="13" text-anchor="middle" font-weight="700">交易通知佇列</text>
  <text x="280" y="74" font-size="11.5" text-anchor="middle" opacity=".8">優先處理</text>
  <rect x="210" y="170" width="140" height="56" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="280" y="194" font-size="13" text-anchor="middle" font-weight="700">行銷佇列</text>
  <text x="280" y="214" font-size="11.5" text-anchor="middle" opacity=".8">限速、避開整點</text>
  <line x1="160" y1="58" x2="208" y2="58" stroke="currentColor" stroke-width="1.6" marker-end="url(#sd-notify-arrow)"/>
  <line x1="160" y1="198" x2="208" y2="198" stroke="currentColor" stroke-width="1.6" marker-end="url(#sd-notify-arrow)"/>
  <rect x="400" y="95" width="150" height="70" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="475" y="122" font-size="13" text-anchor="middle" font-weight="700">通知工作者</text>
  <text x="475" y="142" font-size="11.5" text-anchor="middle" opacity=".85">查偏好、去重、記紀錄</text>
  <line x1="350" y1="58" x2="398" y2="110" stroke="currentColor" stroke-width="1.6" marker-end="url(#sd-notify-arrow)"/>
  <line x1="350" y1="198" x2="398" y2="150" stroke="currentColor" stroke-width="1.6" marker-end="url(#sd-notify-arrow)"/>
  <rect x="400" y="230" width="150" height="50" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="475" y="252" font-size="12.5" text-anchor="middle" font-weight="700">偏好與裝置清單</text>
  <text x="475" y="270" font-size="11.5" text-anchor="middle" opacity=".8">＋通知紀錄（一年）</text>
  <line x1="475" y1="165" x2="475" y2="228" stroke="currentColor" stroke-width="1.6" marker-end="url(#sd-notify-arrow)"/>
  <rect x="600" y="30" width="140" height="56" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="670" y="54" font-size="13" text-anchor="middle" font-weight="700">推播服務</text>
  <text x="670" y="74" font-size="11.5" text-anchor="middle" opacity=".8">全專案每分鐘 60 萬</text>
  <rect x="600" y="110" width="140" height="56" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="670" y="134" font-size="13" text-anchor="middle" font-weight="700">簡訊廠商</text>
  <text x="670" y="154" font-size="11.5" text-anchor="middle" opacity=".8">每則要錢</text>
  <rect x="600" y="190" width="140" height="56" rx="8" fill="var(--surface)" stroke="currentColor" stroke-dasharray="5 4"/>
  <text x="670" y="214" font-size="13" text-anchor="middle" font-weight="700">死信佇列</text>
  <text x="670" y="234" font-size="11.5" text-anchor="middle" opacity=".8">重試用盡、告警</text>
  <line x1="550" y1="112" x2="598" y2="64" stroke="currentColor" stroke-width="1.6" marker-end="url(#sd-notify-arrow)"/>
  <line x1="550" y1="130" x2="598" y2="138" stroke="currentColor" stroke-width="1.6" marker-end="url(#sd-notify-arrow)"/>
  <line x1="550" y1="150" x2="598" y2="212" stroke="currentColor" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#sd-notify-arrow)"/>
  <text x="380" y="314" font-size="12.5" text-anchor="middle" fill="var(--slate-deep)">兩條佇列分開，行銷一次發 500 萬則也不會讓交易通知排在後面</text>
</svg>
