<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 324" aria-label="轉帳系統整體架構：用戶端帶冪等鍵呼叫 API，先過限流與風控評分，再進轉帳服務；轉帳服務在一筆交易裡寫帳戶、分錄、轉帳與 Outbox 表；Outbox 轉送程式把跨行指令送到清算機構；對帳批次讀分錄與清算明細；監控收集指標與追蹤；分錄定期歸檔到 WORM 儲存" width="784" height="324">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="324" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="xfer-a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs>
  <rect x="10" y="40" width="100" height="44" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="60" y="60" font-size="12" text-anchor="middle">用戶端</text><text x="60" y="76" font-size="10" text-anchor="middle">帶冪等鍵</text>
  <rect x="150" y="40" width="120" height="44" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="210" y="60" font-size="12" text-anchor="middle">API 閘道</text><text x="210" y="76" font-size="10" text-anchor="middle">限流</text>
  <rect x="310" y="40" width="120" height="44" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="370" y="66" font-size="12" text-anchor="middle">風控評分</text>
  <rect x="470" y="30" width="150" height="64" rx="8" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="545" y="56" font-size="13" text-anchor="middle" font-weight="700">轉帳服務</text><text x="545" y="76" font-size="10" text-anchor="middle">一筆交易：鎖、限額、分錄</text>
  <line x1="112" y1="62" x2="146" y2="62" stroke="currentColor" stroke-width="1.5" marker-end="url(#xfer-a2)"/>
  <line x1="272" y1="62" x2="306" y2="62" stroke="currentColor" stroke-width="1.5" marker-end="url(#xfer-a2)"/>
  <line x1="432" y1="62" x2="466" y2="62" stroke="currentColor" stroke-width="1.5" marker-end="url(#xfer-a2)"/>
  <rect x="415" y="140" width="260" height="64" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="545" y="164" font-size="12" text-anchor="middle">帳務資料庫</text><text x="545" y="184" font-size="10" text-anchor="middle" class="mono">account・journal_entry・transfer・outbox</text>
  <line x1="545" y1="96" x2="545" y2="136" stroke="currentColor" stroke-width="1.5" marker-end="url(#xfer-a2)"/>
  <rect x="250" y="150" width="140" height="44" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="320" y="176" font-size="12" text-anchor="middle">Outbox 轉送</text>
  <line x1="413" y1="172" x2="394" y2="172" stroke="currentColor" stroke-width="1.5" marker-end="url(#xfer-a2)"/>
  <rect x="40" y="150" width="150" height="44" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="115" y="176" font-size="12" text-anchor="middle">清算機構（跨行）</text>
  <line x1="248" y1="172" x2="194" y2="172" stroke="currentColor" stroke-width="1.5" marker-end="url(#xfer-a2)"/>
  <rect x="40" y="240" width="150" height="44" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="115" y="266" font-size="12" text-anchor="middle">對帳批次</text>
  <line x1="115" y1="196" x2="115" y2="236" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#xfer-a2)"/>
  <line x1="413" y1="200" x2="194" y2="256" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#xfer-a2)"/>
  <rect x="440" y="240" width="100" height="44" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="490" y="266" font-size="12" text-anchor="middle">監控與追蹤</text>
  <line x1="490" y1="206" x2="490" y2="236" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#xfer-a2)"/>
  <rect x="560" y="240" width="160" height="44" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="640" y="260" font-size="12" text-anchor="middle">WORM 歸檔</text><text x="640" y="276" font-size="10" text-anchor="middle">分錄與稽核紀錄</text>
  <line x1="600" y1="206" x2="630" y2="236" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#xfer-a2)"/>
  <text x="680" y="20" font-size="11" text-anchor="end" fill="var(--slate-deep)">實線＝請求流程；虛線＝批次或非同步</text>
</svg>
