<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 364" aria-label="TCP 三向交握時序圖，照 RFC 9293 圖 6 的數字：用戶端送 SYN，序號 100，進入 SYN-SENT；伺服器回 SYN 加 ACK，序號 300、確認號 101，進入 SYN-RECEIVED；用戶端回 ACK，序號 101、確認號 301，用戶端此時已是 ESTABLISHED，伺服器收到後也進入 ESTABLISHED；之後開始送資料" width="784" height="364">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="364" fill="#FFFFFF" stroke="none"/>
<defs><marker id="tu-2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker><marker id="tu-2g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--gold)"/></marker></defs><rect x="150" y="20" width="120" height="30" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="210" y="40" font-size="14" text-anchor="middle">用戶端</text><rect x="490" y="20" width="120" height="30" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="550" y="40" font-size="14" text-anchor="middle">伺服器</text><line x1="210" y1="50" x2="210" y2="328" stroke="currentColor" stroke-width="1.2" stroke-opacity=".35"/><line x1="550" y1="50" x2="550" y2="328" stroke="currentColor" stroke-width="1.2" stroke-opacity=".35"/><line x1="212" y1="99" x2="546" y2="111" stroke="var(--gold)" stroke-width="1.6" marker-end="url(#tu-2g)"/><text x="380" y="97" font-size="12.5" text-anchor="middle" fill="var(--gold-deep)" class="mono">SYN  SEQ=100</text><text x="380" y="125" font-size="11.5" text-anchor="middle" opacity=".75">「我的起始序號是 100」</text><line x1="548" y1="159" x2="214" y2="171" stroke="var(--gold)" stroke-width="1.6" marker-end="url(#tu-2g)"/><text x="380" y="157" font-size="12.5" text-anchor="middle" fill="var(--gold-deep)" class="mono">SYN+ACK  SEQ=300 ACK=101</text><text x="380" y="185" font-size="11.5" text-anchor="middle" opacity=".75">「100 收到，下一個給我 101；我的起始序號是 300」</text><line x1="212" y1="219" x2="546" y2="231" stroke="var(--gold)" stroke-width="1.6" marker-end="url(#tu-2g)"/><text x="380" y="217" font-size="12.5" text-anchor="middle" fill="var(--gold-deep)" class="mono">ACK  SEQ=101 ACK=301</text><text x="380" y="245" font-size="11.5" text-anchor="middle" opacity=".75">「300 收到，下一個給我 301」</text><line x1="212" y1="289" x2="546" y2="301" stroke="currentColor" stroke-width="1.6" marker-end="url(#tu-2a)"/><text x="380" y="287" font-size="12.5" text-anchor="middle" class="mono">ACK＋資料  SEQ=101 ACK=301</text><text x="380" y="315" font-size="11.5" text-anchor="middle" opacity=".75">交握完成，開始送資料（第三步其實就能帶資料）</text><text x="198" y="76" font-size="12" text-anchor="end" class="mono">CLOSED</text><text x="562" y="76" font-size="12" text-anchor="start" class="mono">LISTEN</text><text x="198" y="96" font-size="12" text-anchor="end" fill="var(--gold-deep)" class="mono">SYN-SENT</text><text x="562" y="126" font-size="12" text-anchor="start" fill="var(--gold-deep)" class="mono">SYN-RECEIVED</text><text x="198" y="186" font-size="12" text-anchor="end" fill="var(--slate-deep)" class="mono">ESTABLISHED</text><text x="562" y="246" font-size="12" text-anchor="start" fill="var(--slate-deep)" class="mono">ESTABLISHED</text>
</svg>
