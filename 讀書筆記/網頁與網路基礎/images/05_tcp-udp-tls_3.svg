<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 424" aria-label="舊的重複 SYN 怎麼被擋下，照 RFC 9293 圖 8：用戶端這次送的 SYN 序號是 100，但先到伺服器的是上一輪遺留、序號 90 的舊 SYN。伺服器照常回 SYN 加 ACK、確認號 91；用戶端發現 91 不是自己要的 101，回 RST，伺服器回到 LISTEN。等序號 100 的 SYN 抵達，交握照正常流程完成。如果只有兩步，伺服器在回完 SYN 加 ACK 時就已經把舊連線當真" width="784" height="424">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="424" fill="#FFFFFF" stroke="none"/>
<defs><marker id="tu-3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker><marker id="tu-3g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--gold)"/></marker><marker id="tu-3d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--danger)"/></marker></defs><rect x="150" y="14" width="120" height="30" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="210" y="34" font-size="14" text-anchor="middle">用戶端</text><rect x="490" y="14" width="120" height="30" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="550" y="34" font-size="14" text-anchor="middle">伺服器</text><line x1="210" y1="44" x2="210" y2="388" stroke="currentColor" stroke-width="1.2" stroke-opacity=".35"/><line x1="550" y1="44" x2="550" y2="388" stroke="currentColor" stroke-width="1.2" stroke-opacity=".35"/><line x1="212" y1="80" x2="546" y2="80" stroke="var(--danger)" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#tu-3d)"/><text x="380" y="72" font-size="12.5" text-anchor="middle" fill="var(--danger)" class="mono">SYN  SEQ=90（舊的）</text><text x="380" y="100" font-size="11.5" text-anchor="middle" opacity=".75">上一輪卡在網路裡、現在才到</text><line x1="548" y1="139" x2="214" y2="151" stroke="currentColor" stroke-width="1.6" marker-end="url(#tu-3a)"/><text x="380" y="137" font-size="12.5" text-anchor="middle" class="mono">SYN+ACK  SEQ=300 ACK=91</text><text x="380" y="165" font-size="11.5" text-anchor="middle" opacity=".75">伺服器分不出新舊，照常回</text><line x1="212" y1="199" x2="546" y2="211" stroke="var(--danger)" stroke-width="1.6" marker-end="url(#tu-3d)"/><text x="380" y="197" font-size="12.5" text-anchor="middle" fill="var(--danger)" class="mono">RST  SEQ=91</text><text x="380" y="225" font-size="11.5" text-anchor="middle" opacity=".75">「ACK=91 不對，我送的是 100」→ 重設</text><line x1="212" y1="254" x2="546" y2="266" stroke="var(--gold)" stroke-width="1.6" marker-end="url(#tu-3g)"/><text x="380" y="252" font-size="12.5" text-anchor="middle" fill="var(--gold-deep)" class="mono">SYN  SEQ=100</text><text x="380" y="280" font-size="11.5" text-anchor="middle" opacity=".75">真正這一次的 SYN 到了</text><line x1="548" y1="304" x2="214" y2="316" stroke="var(--gold)" stroke-width="1.6" marker-end="url(#tu-3g)"/><text x="380" y="302" font-size="12.5" text-anchor="middle" fill="var(--gold-deep)" class="mono">SYN+ACK  SEQ=400 ACK=101</text><line x1="212" y1="354" x2="546" y2="366" stroke="var(--gold)" stroke-width="1.6" marker-end="url(#tu-3g)"/><text x="380" y="352" font-size="12.5" text-anchor="middle" fill="var(--gold-deep)" class="mono">ACK  SEQ=101 ACK=401</text><text x="380" y="380" font-size="11.5" text-anchor="middle" opacity=".75">雙方對上號，連線建立</text><text x="198" y="64" font-size="12" text-anchor="end" fill="var(--gold-deep)" class="mono">SYN-SENT（送了 100）</text><text x="562" y="64" font-size="12" text-anchor="start" class="mono">LISTEN</text><text x="562" y="136" font-size="12" text-anchor="start" class="mono">SYN-RECEIVED</text><text x="562" y="226" font-size="12" text-anchor="start" fill="var(--danger)" class="mono">回到 LISTEN</text><text x="198" y="326" font-size="12" text-anchor="end" fill="var(--slate-deep)" class="mono">ESTABLISHED</text><text x="562" y="376" font-size="12" text-anchor="start" fill="var(--slate-deep)" class="mono">ESTABLISHED</text>
</svg>
