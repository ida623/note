<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 536" aria-label="TLS 1.2 與 TLS 1.3 完整握手並排比較，兩邊都先畫一趟 TCP 三向交握。左邊 TLS 1.2：ClientHello；伺服器回 ServerHello、Certificate、ServerKeyExchange、ServerHelloDone；用戶端送 ClientKeyExchange、ChangeCipherSpec、Finished；伺服器回 ChangeCipherSpec、Finished；共兩趟來回後才送應用資料。右邊 TLS 1.3：ClientHello 就帶 key_share；伺服器回 ServerHello 與 key_share，接著 EncryptedExtensions、Certificate、CertificateVerify、Finished 都已加密；用戶端送 Finished 時就能接著送應用資料，只要一趟來回" width="784" height="536">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="536" fill="#FFFFFF" stroke="none"/>
<defs><marker id="tu-5a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker><marker id="tu-5g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--gold)"/></marker></defs><text x="205" y="26" font-size="15" text-anchor="middle" fill="var(--gold-deep)">TLS 1.2（RFC 5246）</text><text x="90" y="50" font-size="12.5" text-anchor="middle">用戶端</text><text x="320" y="50" font-size="12.5" text-anchor="middle">伺服器</text><line x1="90" y1="58" x2="90" y2="470" stroke="currentColor" stroke-width="1.2" stroke-opacity=".35"/><line x1="320" y1="58" x2="320" y2="470" stroke="currentColor" stroke-width="1.2" stroke-opacity=".35"/><line x1="92" y1="77" x2="316" y2="85" stroke="currentColor" stroke-width="1.5" stroke-opacity=".6" marker-end="url(#tu-5a)"/><text x="205" y="75" font-size="11.5" text-anchor="middle" class="mono">SYN</text><line x1="318" y1="107" x2="94" y2="115" stroke="currentColor" stroke-width="1.5" stroke-opacity=".6" marker-end="url(#tu-5a)"/><text x="205" y="105" font-size="11.5" text-anchor="middle" class="mono">SYN+ACK</text><line x1="92" y1="137" x2="316" y2="145" stroke="currentColor" stroke-width="1.5" stroke-opacity=".6" marker-end="url(#tu-5a)"/><text x="205" y="135" font-size="11.5" text-anchor="middle" class="mono">ACK</text><line x1="92" y1="173.5" x2="316" y2="181.5" stroke="var(--gold)" stroke-width="1.5" marker-end="url(#tu-5g)"/><text x="205" y="171.5" font-size="11.5" text-anchor="middle" fill="var(--gold-deep)" class="mono">ClientHello</text><line x1="318" y1="253.5" x2="94" y2="261.5" stroke="var(--gold)" stroke-width="1.5" marker-end="url(#tu-5g)"/><text x="205" y="221.5" font-size="11.5" text-anchor="middle" fill="var(--gold-deep)" class="mono">ServerHello、Certificate</text><text x="205" y="236.5" font-size="11.5" text-anchor="middle" fill="var(--gold-deep)" class="mono">ServerKeyExchange</text><text x="205" y="251.5" font-size="11.5" text-anchor="middle" fill="var(--gold-deep)" class="mono">ServerHelloDone</text><line x1="92" y1="338.5" x2="316" y2="346.5" stroke="var(--gold)" stroke-width="1.5" marker-end="url(#tu-5g)"/><text x="205" y="321.5" font-size="11.5" text-anchor="middle" fill="var(--gold-deep)" class="mono">ClientKeyExchange</text><text x="205" y="336.5" font-size="11.5" text-anchor="middle" fill="var(--gold-deep)" class="mono">ChangeCipherSpec、Finished</text><line x1="318" y1="403.5" x2="94" y2="411.5" stroke="var(--gold)" stroke-width="1.5" marker-end="url(#tu-5g)"/><text x="205" y="401.5" font-size="11.5" text-anchor="middle" fill="var(--gold-deep)" class="mono">ChangeCipherSpec、Finished</text><line x1="92" y1="447" x2="316" y2="455" stroke="currentColor" stroke-width="1.5" stroke-opacity=".6" marker-end="url(#tu-5a)"/><text x="205" y="445" font-size="11.5" text-anchor="middle" class="mono">應用資料</text><text x="80" y="111" font-size="11" text-anchor="end" opacity=".75">TCP 1 趟</text><text x="80" y="210" font-size="11" text-anchor="end" opacity=".75">TLS 第 1 趟</text><text x="80" y="380" font-size="11" text-anchor="end" opacity=".75">TLS 第 2 趟</text><text x="205" y="498" font-size="12.5" text-anchor="middle" fill="var(--gold-deep)">TCP 1 趟＋TLS 2 趟，才送得出第一筆應用資料</text><text x="592" y="26" font-size="15" text-anchor="middle" fill="var(--gold-deep)">TLS 1.3（RFC 8446）</text><text x="477" y="50" font-size="12.5" text-anchor="middle">用戶端</text><text x="707" y="50" font-size="12.5" text-anchor="middle">伺服器</text><line x1="477" y1="58" x2="477" y2="470" stroke="currentColor" stroke-width="1.2" stroke-opacity=".35"/><line x1="707" y1="58" x2="707" y2="470" stroke="currentColor" stroke-width="1.2" stroke-opacity=".35"/><line x1="479" y1="77" x2="703" y2="85" stroke="currentColor" stroke-width="1.5" stroke-opacity=".6" marker-end="url(#tu-5a)"/><text x="592" y="75" font-size="11.5" text-anchor="middle" class="mono">SYN</text><line x1="705" y1="107" x2="481" y2="115" stroke="currentColor" stroke-width="1.5" stroke-opacity=".6" marker-end="url(#tu-5a)"/><text x="592" y="105" font-size="11.5" text-anchor="middle" class="mono">SYN+ACK</text><line x1="479" y1="137" x2="703" y2="145" stroke="currentColor" stroke-width="1.5" stroke-opacity=".6" marker-end="url(#tu-5a)"/><text x="592" y="135" font-size="11.5" text-anchor="middle" class="mono">ACK</text><line x1="479" y1="183.5" x2="703" y2="191.5" stroke="var(--gold)" stroke-width="1.5" marker-end="url(#tu-5g)"/><text x="592" y="181.5" font-size="11.5" text-anchor="middle" fill="var(--gold-deep)" class="mono">ClientHello + key_share</text><line x1="705" y1="283.5" x2="481" y2="291.5" stroke="var(--gold)" stroke-width="1.5" marker-end="url(#tu-5g)"/><text x="592" y="221.5" font-size="11.5" text-anchor="middle" fill="var(--gold-deep)" class="mono">ServerHello + key_share</text><text x="592" y="236.5" font-size="11.5" text-anchor="middle" fill="var(--slate-deep)" class="mono">{EncryptedExtensions}</text><text x="592" y="251.5" font-size="11.5" text-anchor="middle" fill="var(--slate-deep)" class="mono">{Certificate}</text><text x="592" y="266.5" font-size="11.5" text-anchor="middle" fill="var(--slate-deep)" class="mono">{CertificateVerify}</text><text x="592" y="281.5" font-size="11.5" text-anchor="middle" fill="var(--slate-deep)" class="mono">{Finished}</text><line x1="479" y1="338.5" x2="703" y2="346.5" stroke="var(--gold)" stroke-width="1.5" marker-end="url(#tu-5g)"/><text x="592" y="321.5" font-size="11.5" text-anchor="middle" fill="var(--slate-deep)" class="mono">{Finished}</text><text x="592" y="336.5" font-size="11.5" text-anchor="middle" fill="var(--slate-deep)" class="mono">[應用資料]</text><text x="467" y="111" font-size="11" text-anchor="end" opacity=".75">TCP 1 趟</text><text x="467" y="240" font-size="11" text-anchor="end" opacity=".75">TLS 第 1 趟</text><text x="592" y="498" font-size="12.5" text-anchor="middle" fill="var(--gold-deep)">TCP 1 趟＋TLS 1 趟；{ } 裡的訊息已加密</text><line x1="398" y1="30" x2="398" y2="480" stroke="currentColor" stroke-width="1" stroke-opacity=".2" stroke-dasharray="4 4"/>
</svg>
