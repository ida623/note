<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 264" aria-label="憑證鏈，由左到右：伺服器憑證 *.github.io 由 YR1 簽發；YR1 由 Root YR 簽發；Root YR 由 ISRG Root X1 簽發；ISRG Root X1 是本機信任清單裡的根憑證。前三張是伺服器送來的，最右邊那張是用戶端自己帶的。箭頭表示用右邊那張的公鑰驗證左邊那張的簽章" width="784" height="264">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="264" fill="#FFFFFF" stroke="none"/>
<defs><marker id="tu-6a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><rect x="40" y="70" width="150" height="92" rx="8" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="115" y="100" font-size="14" text-anchor="middle" class="mono">*.github.io</text><text x="115" y="124" font-size="11.5" text-anchor="middle" opacity=".8">簽發者：YR1</text><text x="115" y="148" font-size="11.5" text-anchor="middle" fill="var(--gold-deep)">伺服器憑證（第 0 張）</text><rect x="220" y="70" width="150" height="92" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="295" y="100" font-size="14" text-anchor="middle" class="mono">YR1</text><text x="295" y="124" font-size="11.5" text-anchor="middle" opacity=".8">簽發者：Root YR</text><text x="295" y="148" font-size="11.5" text-anchor="middle">中繼憑證（第 1 張）</text><rect x="400" y="70" width="150" height="92" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="475" y="100" font-size="14" text-anchor="middle" class="mono">Root YR</text><text x="475" y="124" font-size="11.5" text-anchor="middle" opacity=".8">簽發者：ISRG Root X1</text><text x="475" y="148" font-size="11.5" text-anchor="middle">中繼憑證（第 2 張）</text><rect x="580" y="70" width="150" height="92" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="655" y="100" font-size="14" text-anchor="middle" class="mono">ISRG Root X1</text><text x="655" y="124" font-size="11.5" text-anchor="middle" opacity=".8">自己簽自己</text><text x="655" y="148" font-size="11.5" text-anchor="middle" fill="var(--slate-deep)">本機信任清單裡的根</text><line x1="218" y1="116" x2="190" y2="116" stroke="currentColor" stroke-width="1.6" marker-end="url(#tu-6a)"/><line x1="398" y1="116" x2="370" y2="116" stroke="currentColor" stroke-width="1.6" marker-end="url(#tu-6a)"/><line x1="578" y1="116" x2="550" y2="116" stroke="currentColor" stroke-width="1.6" marker-end="url(#tu-6a)"/><path d="M40 52 L40 44 L550 44 L550 52" fill="none" stroke="var(--gold)" stroke-width="1.4"/><text x="295" y="36" font-size="12" text-anchor="middle" fill="var(--gold-deep)">伺服器在 Certificate 訊息裡送來的三張（openssl -showcerts 實測，2026-10-02）</text><path d="M580 52 L580 44 L730 44 L730 52" fill="none" stroke="var(--slate)" stroke-width="1.4"/><text x="655" y="36" font-size="12" text-anchor="middle" fill="var(--slate-deep)">用戶端自己帶的</text><text x="380" y="196" font-size="12.5" text-anchor="middle">箭頭：用右邊那張的公鑰，驗左邊那張上的簽章。從信任的根一路驗回伺服器憑證，每張都要在有效期間內</text><text x="380" y="222" font-size="12.5" text-anchor="middle">最後再檢查第 0 張的名稱：*.github.io 只配得上一層，hhtim.github.io 可以，a.hhtim.github.io 不行</text>
</svg>
