<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 386" aria-label="狀態碼五大類：1xx 資訊，收到了還在處理，例如 100；2xx 成功，例如 200、201、204；3xx 重新導向，例如 301、302、304、307、308；4xx 用戶端錯誤，例如 400、401、403、404、409、422、429；5xx 伺服器錯誤，例如 500、502、503、504。第一位數決定類別，看不懂的碼照同類的 x00 處理" width="784" height="386">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="386" fill="#FFFFFF" stroke="none"/>
<rect x="15" y="20" width="140" height="300" rx="8" fill="var(--surface)" stroke="currentColor"/><rect x="15" y="20" width="140" height="62" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="85" y="46" font-size="18" text-anchor="middle" class="mono">1xx</text><text x="85" y="70" font-size="13" text-anchor="middle">資訊</text><text x="85" y="104" font-size="11.5" text-anchor="middle" opacity=".8">收到了，還在處理</text><text x="85" y="136" font-size="12.5" text-anchor="middle">100 繼續送</text><rect x="165" y="20" width="140" height="300" rx="8" fill="var(--surface)" stroke="var(--ok)"/><rect x="165" y="20" width="140" height="62" rx="8" fill="var(--ok-soft)" stroke="var(--ok)"/><text x="235" y="46" font-size="18" text-anchor="middle" class="mono">2xx</text><text x="235" y="70" font-size="13" text-anchor="middle">成功</text><text x="235" y="104" font-size="11.5" text-anchor="middle" opacity=".8">收到、看懂、接受了</text><text x="235" y="136" font-size="12.5" text-anchor="middle">200 成功</text><text x="235" y="160" font-size="12.5" text-anchor="middle">201 建了新資源</text><text x="235" y="184" font-size="12.5" text-anchor="middle">204 成功但沒內容</text><rect x="315" y="20" width="140" height="300" rx="8" fill="var(--surface)" stroke="var(--slate)"/><rect x="315" y="20" width="140" height="62" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="385" y="46" font-size="18" text-anchor="middle" class="mono">3xx</text><text x="385" y="70" font-size="13" text-anchor="middle">重新導向</text><text x="385" y="104" font-size="11.5" text-anchor="middle" opacity=".8">還要再做一步才完成</text><text x="385" y="136" font-size="12.5" text-anchor="middle">301 永久搬家</text><text x="385" y="160" font-size="12.5" text-anchor="middle">302 暫時在別處</text><text x="385" y="184" font-size="12.5" text-anchor="middle">304 沒變，用你的</text><text x="385" y="208" font-size="12.5" text-anchor="middle">307／308 不改方法</text><rect x="465" y="20" width="140" height="300" rx="8" fill="var(--surface)" stroke="var(--gold)"/><rect x="465" y="20" width="140" height="62" rx="8" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="535" y="46" font-size="18" text-anchor="middle" class="mono">4xx</text><text x="535" y="70" font-size="13" text-anchor="middle">用戶端錯誤</text><text x="535" y="104" font-size="11.5" text-anchor="middle" opacity=".8">請求有問題或做不到</text><text x="535" y="136" font-size="12.5" text-anchor="middle">400 請求壞了</text><text x="535" y="160" font-size="12.5" text-anchor="middle">401 不知道你是誰</text><text x="535" y="184" font-size="12.5" text-anchor="middle">403 知道但不准</text><text x="535" y="208" font-size="12.5" text-anchor="middle">404 找不到</text><text x="535" y="232" font-size="12.5" text-anchor="middle">409 跟現況衝突</text><text x="535" y="256" font-size="12.5" text-anchor="middle">422 內容不合理</text><text x="535" y="280" font-size="12.5" text-anchor="middle">429 送太多了</text><rect x="615" y="20" width="140" height="300" rx="8" fill="var(--surface)" stroke="var(--danger)"/><rect x="615" y="20" width="140" height="62" rx="8" fill="var(--surface)" stroke="var(--danger)"/><text x="685" y="46" font-size="18" text-anchor="middle" class="mono">5xx</text><text x="685" y="70" font-size="13" text-anchor="middle">伺服器錯誤</text><text x="685" y="104" font-size="11" text-anchor="middle" opacity=".8">請求沒錯，伺服器沒做到</text><text x="685" y="136" font-size="12.5" text-anchor="middle">500 伺服器出錯</text><text x="685" y="160" font-size="12.5" text-anchor="middle">502 上游回了壞的</text><text x="685" y="184" font-size="12.5" text-anchor="middle">503 暫時撐不住</text><text x="685" y="208" font-size="12.5" text-anchor="middle">504 上游沒回</text><text x="380" y="346" font-size="12.5" text-anchor="middle" fill="var(--gold-deep)">第一位數決定類別，後兩位數不分類；用戶端看不懂的碼，照同類的 x00 處理（例如 471 當 400）</text>
</svg>
