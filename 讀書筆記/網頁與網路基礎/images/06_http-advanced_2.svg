<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 436" aria-label="HTTP/1.1、HTTP/2、HTTP/3 的連線比較。上：HTTP/1.1 開三條 TCP 連線，每條一次只處理一個請求，下一個排在後面等。中：HTTP/2 只用一條 TCP 連線，串流 1、3、5 的訊框交錯傳送；中間一個封包遺失後，後面三個串流的資料全部卡住等重傳。下：HTTP/3 用 QUIC，三個串流各自傳送，串流 3 遺失一包只有它自己要等，串流 1 和 5 繼續前進" width="784" height="436">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="436" fill="#FFFFFF" stroke="none"/>
<text x="20" y="26" font-size="13" text-anchor="start" fill="var(--gold-deep)">HTTP/1.1：一條 TCP 連線一次一個請求，要同時抓就多開幾條</text><text x="20" y="55" font-size="11.5" text-anchor="start" class="mono" opacity=".75">TCP 1</text><line x1="80" y1="50" x2="740" y2="50" stroke="currentColor" stroke-width="1" stroke-opacity=".25"/><rect x="90" y="40" width="150" height="20" rx="3" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="165" y="54" font-size="11" text-anchor="middle" class="mono">請求→回應</text><rect x="260" y="40" width="220" height="20" rx="3" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="370" y="54" font-size="11" text-anchor="middle" class="mono">下一個（排在後面等）</text><text x="20" y="85" font-size="11.5" text-anchor="start" class="mono" opacity=".75">TCP 2</text><line x1="80" y1="80" x2="740" y2="80" stroke="currentColor" stroke-width="1" stroke-opacity=".25"/><rect x="102" y="70" width="150" height="20" rx="3" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="177" y="84" font-size="11" text-anchor="middle" class="mono">請求→回應</text><rect x="272" y="70" width="220" height="20" rx="3" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="382" y="84" font-size="11" text-anchor="middle" class="mono">下一個（排在後面等）</text><text x="20" y="115" font-size="11.5" text-anchor="start" class="mono" opacity=".75">TCP 3</text><line x1="80" y1="110" x2="740" y2="110" stroke="currentColor" stroke-width="1" stroke-opacity=".25"/><rect x="114" y="100" width="150" height="20" rx="3" fill="var(--ok-soft)" stroke="var(--ok)"/><text x="189" y="114" font-size="11" text-anchor="middle" class="mono">請求→回應</text><rect x="284" y="100" width="220" height="20" rx="3" fill="var(--ok-soft)" stroke="var(--ok)"/><text x="394" y="114" font-size="11" text-anchor="middle" class="mono">下一個（排在後面等）</text><text x="735" y="140" font-size="11.5" text-anchor="end" opacity=".75">常見的做法是對同一台主機開 6 條平行連線</text><text x="20" y="172" font-size="13" text-anchor="start" fill="var(--gold-deep)">HTTP/2：一條 TCP 連線，多個串流的訊框交錯送；但 TCP 只看到一條位元組串流</text><text x="20" y="203" font-size="11.5" text-anchor="start" class="mono" opacity=".75">TCP</text><rect x="90" y="188" width="34" height="20" rx="3" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="107" y="202" font-size="11" text-anchor="middle" class="mono">1</text><rect x="130" y="188" width="34" height="20" rx="3" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="147" y="202" font-size="11" text-anchor="middle" class="mono">3</text><rect x="170" y="188" width="34" height="20" rx="3" fill="var(--ok-soft)" stroke="var(--ok)"/><text x="187" y="202" font-size="11" text-anchor="middle" class="mono">5</text><rect x="210" y="188" width="34" height="20" rx="3" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="227" y="202" font-size="11" text-anchor="middle" class="mono">1</text><rect x="250" y="188" width="34" height="20" rx="3" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="267" y="202" font-size="11" text-anchor="middle" class="mono">3</text><rect x="290" y="188" width="34" height="20" rx="3" fill="none" stroke="var(--danger)" stroke-dasharray="3 2"/><text x="307" y="203" font-size="11" text-anchor="middle" fill="var(--danger)">遺失</text><rect x="330" y="188" width="34" height="20" rx="3" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="347" y="202" font-size="11" text-anchor="middle" class="mono">1</text><rect x="370" y="188" width="34" height="20" rx="3" fill="var(--ok-soft)" stroke="var(--ok)"/><text x="387" y="202" font-size="11" text-anchor="middle" class="mono">5</text><rect x="410" y="188" width="34" height="20" rx="3" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="427" y="202" font-size="11" text-anchor="middle" class="mono">3</text><rect x="450" y="188" width="34" height="20" rx="3" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="467" y="202" font-size="11" text-anchor="middle" class="mono">1</text><rect x="490" y="188" width="34" height="20" rx="3" fill="var(--ok-soft)" stroke="var(--ok)"/><text x="507" y="202" font-size="11" text-anchor="middle" class="mono">5</text><rect x="330" y="184" width="194" height="28" rx="4" fill="none" stroke="var(--danger)"/><text x="427" y="232" font-size="11.5" text-anchor="middle" fill="var(--danger)">後面全部卡住：串流 1、3、5 都要等那一包重傳（TCP 層的隊頭阻塞）</text><text x="560" y="203" font-size="11" text-anchor="start" opacity=".75">數字＝串流編號（用戶端開的是奇數）</text><text x="20" y="290" font-size="13" text-anchor="start" fill="var(--gold-deep)">HTTP/3：QUIC（跑在 UDP 上）每個串流各自重傳</text><text x="20" y="319" font-size="11.5" text-anchor="start" class="mono" opacity=".75">串流 1</text><line x1="80" y1="314" x2="740" y2="314" stroke="currentColor" stroke-width="1" stroke-opacity=".25"/><rect x="90" y="304" width="48" height="20" rx="3" fill="var(--gold-soft)" stroke="var(--gold)"/><rect x="150" y="304" width="48" height="20" rx="3" fill="var(--gold-soft)" stroke="var(--gold)"/><rect x="210" y="304" width="48" height="20" rx="3" fill="var(--gold-soft)" stroke="var(--gold)"/><rect x="270" y="304" width="48" height="20" rx="3" fill="var(--gold-soft)" stroke="var(--gold)"/><rect x="330" y="304" width="48" height="20" rx="3" fill="var(--gold-soft)" stroke="var(--gold)"/><rect x="390" y="304" width="48" height="20" rx="3" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="20" y="347" font-size="11.5" text-anchor="start" class="mono" opacity=".75">串流 3</text><line x1="80" y1="342" x2="740" y2="342" stroke="currentColor" stroke-width="1" stroke-opacity=".25"/><rect x="102" y="332" width="48" height="20" rx="3" fill="var(--slate-soft)" stroke="var(--slate)"/><rect x="162" y="332" width="48" height="20" rx="3" fill="var(--slate-soft)" stroke="var(--slate)"/><rect x="222" y="332" width="48" height="20" rx="3" fill="none" stroke="var(--danger)" stroke-dasharray="3 2"/><text x="246" y="347" font-size="11" text-anchor="middle" fill="var(--danger)">遺失</text><rect x="282" y="332" width="48" height="20" rx="3" fill="none" stroke="var(--slate)" stroke-dasharray="2 2"/><text x="306" y="347" font-size="11" text-anchor="middle" fill="var(--slate-deep)">等</text><rect x="342" y="332" width="48" height="20" rx="3" fill="var(--slate-soft)" stroke="var(--slate)"/><rect x="402" y="332" width="48" height="20" rx="3" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="20" y="375" font-size="11.5" text-anchor="start" class="mono" opacity=".75">串流 5</text><line x1="80" y1="370" x2="740" y2="370" stroke="currentColor" stroke-width="1" stroke-opacity=".25"/><rect x="114" y="360" width="48" height="20" rx="3" fill="var(--ok-soft)" stroke="var(--ok)"/><rect x="174" y="360" width="48" height="20" rx="3" fill="var(--ok-soft)" stroke="var(--ok)"/><rect x="234" y="360" width="48" height="20" rx="3" fill="var(--ok-soft)" stroke="var(--ok)"/><rect x="294" y="360" width="48" height="20" rx="3" fill="var(--ok-soft)" stroke="var(--ok)"/><rect x="354" y="360" width="48" height="20" rx="3" fill="var(--ok-soft)" stroke="var(--ok)"/><rect x="414" y="360" width="48" height="20" rx="3" fill="var(--ok-soft)" stroke="var(--ok)"/><text x="470" y="400" font-size="11.5" text-anchor="middle" fill="var(--danger)">只有串流 3 等重傳，串流 1、5 照常往前</text>
</svg>
