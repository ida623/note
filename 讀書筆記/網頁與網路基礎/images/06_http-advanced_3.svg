<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 392" aria-label="快取判斷流程：瀏覽器要一個網址，先看快取裡有沒有；沒有就送一般 GET，拿到 200 和內容存起來。有的話看還新鮮嗎，也就是 Age 小於 max-age；新鮮就直接用，完全不連伺服器。過期了就送條件式請求，帶 If-None-Match 與存著的 ETag；伺服器回 304 表示沒變，不帶內容，快取更新新鮮度後繼續用；回 200 表示變了，用新內容換掉舊的。no-cache 等於每次都走過期那條，no-store 等於每次都走沒有那條" width="784" height="392">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="392" fill="#FFFFFF" stroke="none"/>
<defs><marker id="ha-3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><rect x="20" y="30" width="130" height="50" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="85" y="52" font-size="12.5" text-anchor="middle">瀏覽器要</text><text x="85" y="70" font-size="12.5" text-anchor="middle">一個網址</text><line x1="152" y1="55" x2="188" y2="55" stroke="currentColor" stroke-width="1.5" marker-end="url(#ha-3a)"/><polygon points="255,20 320,55 255,90 190,55" fill="var(--surface)" stroke="currentColor"/><text x="255" y="59" font-size="12.5" text-anchor="middle">快取裡有嗎？</text><line x1="320" y1="55" x2="368" y2="55" stroke="currentColor" stroke-width="1.5" marker-end="url(#ha-3a)"/><text x="344" y="48" font-size="11.5" text-anchor="middle">有</text><polygon points="445,18 520,55 445,92 370,55" fill="var(--surface)" stroke="currentColor"/><text x="445" y="55" font-size="12.5" text-anchor="middle">還新鮮嗎？</text><text x="445" y="71" font-size="10.5" text-anchor="middle" class="mono" opacity=".75">Age &lt; max-age</text><line x1="520" y1="55" x2="568" y2="55" stroke="currentColor" stroke-width="1.5" marker-end="url(#ha-3a)"/><text x="544" y="48" font-size="11.5" text-anchor="middle">是</text><rect x="570" y="28" width="170" height="54" rx="8" fill="var(--ok-soft)" stroke="var(--ok)"/><text x="655" y="51" font-size="12.5" text-anchor="middle">直接用存著的那份</text><text x="655" y="70" font-size="11.5" text-anchor="middle" opacity=".75">完全不連伺服器</text><line x1="255" y1="90" x2="255" y2="268" stroke="currentColor" stroke-width="1.5" marker-end="url(#ha-3a)"/><text x="266" y="140" font-size="11.5" text-anchor="start">沒有</text><rect x="170" y="270" width="170" height="54" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="255" y="293" font-size="12.5" text-anchor="middle" class="mono">一般 GET</text><text x="255" y="312" font-size="11.5" text-anchor="middle">→ 200＋內容，存起來</text><line x1="445" y1="92" x2="445" y2="148" stroke="currentColor" stroke-width="1.5" marker-end="url(#ha-3a)"/><text x="456" y="124" font-size="11.5" text-anchor="start">過期了</text><rect x="350" y="150" width="190" height="58" rx="8" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="445" y="173" font-size="12.5" text-anchor="middle">條件式請求</text><text x="445" y="193" font-size="11" text-anchor="middle" class="mono">If-None-Match: "ETag"</text><line x1="542" y1="168" x2="588" y2="140" stroke="currentColor" stroke-width="1.5" marker-end="url(#ha-3a)"/><line x1="542" y1="192" x2="588" y2="236" stroke="currentColor" stroke-width="1.5" marker-end="url(#ha-3a)"/><rect x="590" y="108" width="150" height="62" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="665" y="130" font-size="12.5" text-anchor="middle" fill="var(--slate-deep)">沒變：304</text><text x="665" y="148" font-size="11.5" text-anchor="middle" opacity=".75">不帶內容</text><text x="665" y="163" font-size="11.5" text-anchor="middle" opacity=".75">更新新鮮度、繼續用</text><rect x="590" y="210" width="150" height="54" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="665" y="233" font-size="12.5" text-anchor="middle">變了：200</text><text x="665" y="251" font-size="11.5" text-anchor="middle" opacity=".75">新內容，換掉舊的</text><text x="380" y="352" font-size="12" text-anchor="middle" fill="var(--gold-deep)">no-cache：每次都走「過期了」那條（先問再用）；no-store：根本不進快取，每次都走「沒有」那條</text>
</svg>
