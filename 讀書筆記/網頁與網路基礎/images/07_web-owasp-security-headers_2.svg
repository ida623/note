<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 264" aria-label="防 XSS 的兩道牆：使用者輸入要放進頁面前，第一道是輸出編碼，把角括號這類字元換成實體，讓瀏覽器當成文字顯示；萬一漏了，第二道是 CSP 標頭，瀏覽器拒絕執行不被允許的指令碼" width="784" height="264">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="264" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="ow-02-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <rect x="20" y="80" width="140" height="64" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="90" y="109" font-size="14" text-anchor="middle">使用者輸入</text>
  <text x="90" y="127" font-size="11.5" text-anchor="middle" opacity=".75">&lt;script&gt;…</text>
  <rect x="220" y="60" width="170" height="104" rx="8" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
  <text x="305" y="109" font-size="13.5" text-anchor="middle">第一道：輸出編碼</text>
  <text x="305" y="127" font-size="11.5" text-anchor="middle" opacity=".75">&lt; 變成 &amp;lt;，當文字顯示</text>
  <rect x="450" y="60" width="170" height="104" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="535" y="109" font-size="13.5" text-anchor="middle">第二道：CSP</text>
  <text x="535" y="127" font-size="11.5" text-anchor="middle" opacity=".75">不允許的指令碼不執行</text>
  <rect x="670" y="80" width="80" height="64" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="710" y="117" font-size="13.5" text-anchor="middle">瀏覽器</text>
  <line x1="160" y1="112" x2="218" y2="112" stroke="currentColor" stroke-width="1.6" marker-end="url(#ow-02-arrow)"/>
  <line x1="390" y1="112" x2="448" y2="112" stroke="currentColor" stroke-width="1.6" marker-end="url(#ow-02-arrow)"/>
  <line x1="620" y1="112" x2="668" y2="112" stroke="currentColor" stroke-width="1.6" marker-end="url(#ow-02-arrow)"/>
  <text x="20" y="200" font-size="12.5" opacity=".85">輸出編碼與框架的自動編碼是主要防線；CSP 是額外的一層，不能取代輸出編碼。</text>
</svg>
