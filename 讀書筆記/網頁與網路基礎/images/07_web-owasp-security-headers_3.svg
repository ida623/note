<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 294" aria-label="SSRF：攻擊者把網址參數改成內部位址，伺服器替他去連內部管理介面或雲端中繼資料服務；防法是在伺服器發請求前，用允許清單只放行事先登記的外部網址" width="784" height="294">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="294" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="ow-03-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <rect x="20" y="100" width="130" height="60" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="85" y="127" font-size="14" text-anchor="middle">攻擊者</text>
  <text x="85" y="145" font-size="11.5" text-anchor="middle" opacity=".75">送出內部網址</text>
  <rect x="220" y="90" width="170" height="80" rx="8" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
  <text x="305" y="127" font-size="14" text-anchor="middle">你的伺服器</text>
  <text x="305" y="145" font-size="11.5" text-anchor="middle" opacity=".75">照網址去下載</text>
  <rect x="500" y="20" width="240" height="56" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="620" y="45" font-size="13.5" text-anchor="middle">雲端中繼資料服務</text>
  <text x="620" y="63" font-size="11.5" text-anchor="middle" opacity=".75">放著臨時金鑰</text>
  <rect x="500" y="102" width="240" height="56" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="620" y="127" font-size="13.5" text-anchor="middle">內部管理介面</text>
  <text x="620" y="145" font-size="11.5" text-anchor="middle" opacity=".75">只在內網開放</text>
  <rect x="500" y="184" width="240" height="56" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="620" y="209" font-size="13.5" text-anchor="middle">允許清單上的外部網址</text>
  <text x="620" y="227" font-size="11.5" text-anchor="middle" opacity=".75">例如合作廠商的 API</text>
  <line x1="150" y1="130" x2="218" y2="130" stroke="currentColor" stroke-width="1.6" marker-end="url(#ow-03-arrow)"/>
  <line x1="390" y1="115" x2="498" y2="52" stroke="var(--danger)" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ow-03-arrow)"/>
  <line x1="390" y1="130" x2="498" y2="130" stroke="var(--danger)" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ow-03-arrow)"/>
  <line x1="390" y1="150" x2="498" y2="210" stroke="currentColor" stroke-width="1.6" marker-end="url(#ow-03-arrow)"/>
  <text x="418" y="148" font-size="12" fill="var(--danger)">應該擋掉</text>
  <text x="230" y="254" font-size="12.5" opacity=".85">伺服器在內網裡，攻擊者連不到的地方它連得到：發請求前先比對允許清單</text>
</svg>
