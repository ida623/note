<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 296" aria-label="Sec-WebSocket-Accept 的算法：把用戶端隨機產生的 Sec-WebSocket-Key（範例 dGhlIHNhbXBsZSBub25jZQ==）接上 RFC 6455 寫死的 GUID 258EAFA5-E914-47DA-95CA-C5AB0DC85B11，做 SHA-1 得到 20 位元組，再轉 Base64，得到 s3pPLMBiTxaQ9kYGzzhZRbK+xOo=。用途是證明伺服器懂 WebSocket，不是加密也不是身分驗證" width="784" height="296">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="296" fill="#FFFFFF" stroke="none"/>
<defs><marker id="rt-3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><rect x="20" y="30" width="300" height="62" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="170" y="52" font-size="12" text-anchor="middle">Sec-WebSocket-Key（用戶端每次隨機）</text><text x="170" y="76" font-size="12.5" text-anchor="middle" class="mono">dGhlIHNhbXBsZSBub25jZQ==</text><rect x="20" y="112" width="300" height="62" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="170" y="134" font-size="12" text-anchor="middle" fill="var(--slate-deep)">固定的 GUID（RFC 6455 寫死）</text><text x="170" y="158" font-size="11" text-anchor="middle" class="mono">258EAFA5-E914-47DA-95CA-C5AB0DC85B11</text><path d="M322 61 L360 61 L360 143 L322 143" fill="none" stroke="currentColor" stroke-opacity=".55" stroke-width="1.4"/><line x1="360" y1="102" x2="392" y2="102" stroke="currentColor" stroke-width="1.5" marker-end="url(#rt-3a)"/><text x="376" y="94" font-size="11" text-anchor="middle" opacity=".75">接起來</text><rect x="395" y="78" width="100" height="48" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="445" y="107" font-size="14" text-anchor="middle" class="mono">SHA-1</text><line x1="497" y1="102" x2="527" y2="102" stroke="currentColor" stroke-width="1.5" marker-end="url(#rt-3a)"/><rect x="530" y="78" width="100" height="48" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="580" y="99" font-size="12" text-anchor="middle">20 位元組</text><text x="580" y="116" font-size="11.5" text-anchor="middle" class="mono">→ Base64</text><line x1="580" y1="128" x2="580" y2="196" stroke="currentColor" stroke-width="1.5" marker-end="url(#rt-3a)"/><rect x="390" y="200" width="360" height="56" rx="8" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="570" y="222" font-size="12" text-anchor="middle">Sec-WebSocket-Accept</text><text x="570" y="244" font-size="13" text-anchor="middle" class="mono">s3pPLMBiTxaQ9kYGzzhZRbK+xOo=</text><text x="20" y="214" font-size="12" text-anchor="start">用途：證明伺服器真的懂 WebSocket，</text><text x="20" y="234" font-size="12" text-anchor="start">不是剛好把請求原樣回來的一般 HTTP 伺服器。</text><text x="20" y="254" font-size="12" text-anchor="start" fill="var(--danger)">它不是加密，也不是身分驗證。</text>
</svg>
