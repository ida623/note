<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 554" aria-label="WebSocket 連線的一生：用戶端送 GET 請求，帶 Upgrade: websocket、Connection: Upgrade 與 Sec-WebSocket-Key；伺服器回 101，帶 Upgrade 與 Sec-WebSocket-Accept。這之後同一條 TCP 連線改講 WebSocket：用戶端送有遮罩的文字訊框，伺服器回沒有遮罩的文字訊框；伺服器送 Ping，用戶端回 Pong；最後雙方各送一個 Close，再關閉 TCP 連線" width="784" height="554">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="554" fill="#FFFFFF" stroke="none"/>
<defs><marker id="rt-2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker><marker id="rt-2g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--gold)"/></marker><marker id="rt-2s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--slate)"/></marker></defs><rect x="150" y="14" width="120" height="30" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="210" y="34" font-size="14" text-anchor="middle">用戶端</text><rect x="490" y="14" width="120" height="30" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="550" y="34" font-size="14" text-anchor="middle">伺服器</text><line x1="210" y1="44" x2="210" y2="518" stroke="currentColor" stroke-width="1.2" stroke-opacity=".35"/><line x1="550" y1="44" x2="550" y2="518" stroke="currentColor" stroke-width="1.2" stroke-opacity=".35"/><line x1="212" y1="80" x2="546" y2="92" stroke="var(--gold)" stroke-width="1.6" marker-end="url(#rt-2g)"/><text x="380" y="78" font-size="12.5" text-anchor="middle" fill="var(--gold-deep)" class="mono">GET /ws/echo HTTP/1.1</text><text x="380" y="106" font-size="11.5" text-anchor="middle" opacity=".75">Upgrade: websocket、Connection: Upgrade、Sec-WebSocket-Key</text><line x1="548" y1="140" x2="214" y2="152" stroke="var(--gold)" stroke-width="1.6" marker-end="url(#rt-2g)"/><text x="380" y="138" font-size="12.5" text-anchor="middle" fill="var(--gold-deep)" class="mono">HTTP/1.1 101</text><text x="380" y="166" font-size="11.5" text-anchor="middle" opacity=".75">Upgrade: websocket、Sec-WebSocket-Accept</text><line x1="212" y1="235" x2="546" y2="247" stroke="currentColor" stroke-width="1.6" marker-end="url(#rt-2a)"/><text x="380" y="233" font-size="12.5" text-anchor="middle" class="mono">文字訊框「USD/TWD?」（有遮罩）</text><text x="380" y="261" font-size="11.5" text-anchor="middle" opacity=".75">用戶端送的訊框一定要遮罩</text><line x1="548" y1="290" x2="214" y2="302" stroke="currentColor" stroke-width="1.6" marker-end="url(#rt-2a)"/><text x="380" y="288" font-size="12.5" text-anchor="middle" class="mono">文字訊框「echo: USD/TWD?」</text><text x="380" y="316" font-size="11.5" text-anchor="middle" opacity=".75">伺服器送的訊框不遮罩</text><line x1="548" y1="345" x2="214" y2="357" stroke="var(--slate)" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#rt-2s)"/><text x="380" y="343" font-size="12.5" text-anchor="middle" fill="var(--slate-deep)" class="mono">Ping</text><text x="380" y="371" font-size="11.5" text-anchor="middle" opacity=".75">確認對方還在</text><line x1="212" y1="390" x2="546" y2="402" stroke="var(--slate)" stroke-width="1.6" marker-end="url(#rt-2s)"/><text x="380" y="388" font-size="12.5" text-anchor="middle" fill="var(--slate-deep)" class="mono">Pong</text><text x="380" y="416" font-size="11.5" text-anchor="middle" opacity=".75">收到 Ping 必須回 Pong</text><line x1="212" y1="450" x2="546" y2="462" stroke="currentColor" stroke-width="1.6" marker-end="url(#rt-2a)"/><text x="380" y="448" font-size="12.5" text-anchor="middle" class="mono">Close</text><line x1="548" y1="490" x2="214" y2="502" stroke="currentColor" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#rt-2a)"/><text x="380" y="488" font-size="12.5" text-anchor="middle" class="mono">Close</text><text x="380" y="516" font-size="11.5" text-anchor="middle" opacity=".75">兩邊都送過 Close，再關 TCP</text><text x="198" y="70" font-size="12" text-anchor="end" fill="var(--gold-deep)" class="mono">HTTP</text><text x="562" y="70" font-size="12" text-anchor="start" fill="var(--gold-deep)" class="mono">HTTP</text><text x="198" y="215" font-size="12" text-anchor="end" fill="var(--slate-deep)" class="mono">WebSocket</text><text x="562" y="215" font-size="12" text-anchor="start" fill="var(--slate-deep)" class="mono">WebSocket</text><line x1="60" y1="184" x2="700" y2="184" stroke="var(--gold)" stroke-width="1.2" stroke-opacity=".7" stroke-dasharray="5 4"/><text x="380" y="202" font-size="11.5" text-anchor="middle" fill="var(--gold-deep)">在這條線之前講 HTTP，之後同一條 TCP 連線改講 WebSocket</text>
</svg>
