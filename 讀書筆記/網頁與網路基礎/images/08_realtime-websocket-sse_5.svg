<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 308" aria-label="STOMP 在 Spring 裡的訊息路線：送出方 SEND 到 /app/transfer，因為以 /app 開頭，交給標了 @MessageMapping(&quot;/transfer&quot;) 的方法；方法的回傳值依 @SendTo 送到 /topic/notifications，交給簡易訊息代理；訊息代理把 MESSAGE 廣播給所有 SUBSCRIBE 了 /topic/notifications 的用戶端" width="784" height="308">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="308" fill="#FFFFFF" stroke="none"/>
<defs><marker id="rt-6a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><rect x="20" y="40" width="170" height="70" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="105" y="64" font-size="12.5" text-anchor="middle">行員 App（送出方）</text><text x="105" y="88" font-size="11" text-anchor="middle" fill="var(--gold-deep)" class="mono">SEND /app/transfer</text><rect x="15" y="170" width="195" height="70" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="112" y="194" font-size="12.5" text-anchor="middle">客戶 App（訂閱方）</text><text x="112" y="218" font-size="9.5" text-anchor="middle" fill="var(--slate-deep)" class="mono">SUBSCRIBE /topic/notifications</text><rect x="280" y="40" width="215" height="70" rx="8" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="387" y="64" font-size="10.5" text-anchor="middle" class="mono">@MessageMapping("/transfer")</text><text x="387" y="86" font-size="10" text-anchor="middle" class="mono">@SendTo("/topic/notifications")</text><rect x="560" y="105" width="180" height="70" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="650" y="132" font-size="12" text-anchor="middle" fill="var(--slate-deep)">簡易訊息代理（simple broker）</text><text x="650" y="154" font-size="11.5" text-anchor="middle">管 /topic 開頭的訂閱</text><line x1="192" y1="75" x2="286" y2="75" stroke="var(--gold)" stroke-width="1.5" marker-end="url(#rt-6a)"/><text x="239" y="66" font-size="10.5" text-anchor="middle" fill="var(--gold-deep)">/app 開頭</text><line x1="497" y1="85" x2="556" y2="125" stroke="currentColor" stroke-width="1.5" marker-end="url(#rt-6a)"/><text x="520" y="92" font-size="10.5" text-anchor="middle" opacity=".75">回傳值</text><line x1="558" y1="160" x2="214" y2="205" stroke="var(--slate)" stroke-width="1.5" marker-end="url(#rt-6a)"/><text x="380" y="202" font-size="11" text-anchor="middle" fill="var(--slate-deep)">MESSAGE（廣播給所有訂閱者）</text><text x="380" y="268" font-size="12.5" text-anchor="middle" fill="var(--gold-deep)">目的地開頭決定路線：/app 進你的程式，/topic 直接交給訊息代理廣播</text>
</svg>
