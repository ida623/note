<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 294" aria-label="Nginx 代理 WebSocket：瀏覽器送出帶 Upgrade: websocket 與 Connection: Upgrade 的請求。這兩個是逐跳標頭，Nginx 預設不會往後傳，要用 proxy_set_header 明確補上；補了，後面的 Spring Boot 回 101；沒補，Spring Boot 看不到升級要求，2026-10-02 實測回 400。另外連線閒置超過 proxy_read_timeout 預設 60 秒會被關掉，SSE 則要關掉代理緩衝" width="784" height="294">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="294" fill="#FFFFFF" stroke="none"/>
<defs><marker id="rt-5a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker><marker id="rt-5d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--danger)"/></marker></defs><rect x="20" y="60" width="150" height="120" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="95" y="84" font-size="14" text-anchor="middle">瀏覽器</text><text x="95" y="108" font-size="10.5" text-anchor="middle" class="mono">GET /ws/echo</text><text x="95" y="126" font-size="10.5" text-anchor="middle" fill="var(--gold-deep)" class="mono">Upgrade: websocket</text><text x="95" y="144" font-size="10.5" text-anchor="middle" fill="var(--gold-deep)" class="mono">Connection: Upgrade</text><text x="95" y="162" font-size="10.5" text-anchor="middle" class="mono">Sec-WebSocket-Key: …</text><rect x="300" y="40" width="160" height="160" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="380" y="64" font-size="13" text-anchor="middle" fill="var(--slate-deep)">Nginx（反向代理）</text><text x="380" y="92" font-size="11.5" text-anchor="middle">Upgrade、Connection</text><text x="380" y="110" font-size="11.5" text-anchor="middle">是逐跳標頭，</text><text x="380" y="128" font-size="11.5" text-anchor="middle" fill="var(--danger)">預設不往後傳</text><text x="380" y="156" font-size="11" text-anchor="middle" class="mono">proxy_set_header</text><text x="380" y="172" font-size="11.5" text-anchor="middle" fill="var(--gold-deep)">明確補上才會傳</text><rect x="590" y="60" width="150" height="120" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="665" y="84" font-size="14" text-anchor="middle">Spring Boot</text><text x="665" y="112" font-size="11.5" text-anchor="middle" fill="var(--gold-deep)">有 Upgrade → 101</text><text x="665" y="134" font-size="11.5" text-anchor="middle" fill="var(--danger)">沒有 → 400</text><text x="665" y="156" font-size="10.5" text-anchor="middle" opacity=".7">（經 nginx 1.29.8 實測）</text><line x1="172" y1="120" x2="296" y2="120" stroke="currentColor" stroke-width="1.5" marker-end="url(#rt-5a)"/><line x1="462" y1="100" x2="586" y2="100" stroke="var(--gold)" stroke-width="1.5" marker-end="url(#rt-5a)"/><text x="524" y="92" font-size="11" text-anchor="middle" fill="var(--gold-deep)">有補標頭</text><line x1="462" y1="140" x2="586" y2="140" stroke="var(--danger)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#rt-5a)"/><text x="524" y="158" font-size="11" text-anchor="middle" fill="var(--danger)">沒補</text><text x="380" y="232" font-size="12" text-anchor="middle">另一個坑：連線閒置超過 proxy_read_timeout（預設 60 秒）會被 Nginx 關掉；用 Ping 或加長逾時</text><text x="380" y="254" font-size="12" text-anchor="middle">SSE 也走 Nginx 時，回應要能一筆一筆送出去：關掉代理緩衝（X-Accel-Buffering: no 或 proxy_buffering off）</text>
</svg>
