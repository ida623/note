<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 324" aria-label="線上排查的起手式：先用 uptime、top 看整體，再依症狀分三條路。CPU 高看 top 的 us 與 sy，接著 top -H 找執行緒、jstack 對堆疊；磁碟滿看 df，接著 du 找大檔，對不上時用 lsof +L1 找已刪除但還開著的檔案，df -i 看 inode；連線問題看 ss -s，接著 ss 依狀態篩選 TIME_WAIT 與 CLOSE_WAIT" width="784" height="324">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="324" fill="#FFFFFF" stroke="none"/>
<defs><marker id="lx-m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs>
<rect x="270" y="16" width="220" height="48" rx="8" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="380" y="38" font-size="13.5" text-anchor="middle">先看整體</text><text x="380" y="56" font-size="12" text-anchor="middle" class="mono">uptime、top 頭五行</text>
<path d="M330 66 L130 106" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#lx-m1)"/><path d="M380 66 L380 106" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#lx-m1)"/><path d="M430 66 L630 106" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#lx-m1)"/>
<rect x="30" y="110" width="200" height="40" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="130" y="135" font-size="13.5" text-anchor="middle">CPU 高：us 或 sy 很高</text>
<rect x="280" y="110" width="200" height="40" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="380" y="135" font-size="13.5" text-anchor="middle">磁碟滿：df 看 Use%</text>
<rect x="530" y="110" width="200" height="40" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="630" y="135" font-size="13.5" text-anchor="middle">連線問題：ss -s</text>
<rect x="30" y="170" width="200" height="40" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="130" y="195" font-size="12.5" text-anchor="middle" class="mono">top -H -p PID</text>
<rect x="30" y="230" width="200" height="40" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="130" y="255" font-size="12.5" text-anchor="middle" class="mono">jstack PID → 對執行緒</text>
<rect x="280" y="170" width="200" height="40" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="380" y="195" font-size="12.5" text-anchor="middle" class="mono">du 找大檔；df -i</text>
<rect x="280" y="230" width="200" height="40" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="380" y="255" font-size="12.5" text-anchor="middle" class="mono">對不上：lsof +L1</text>
<rect x="530" y="170" width="200" height="40" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="630" y="195" font-size="12.5" text-anchor="middle" class="mono">ss -tan state …</text>
<rect x="530" y="230" width="200" height="40" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="630" y="255" font-size="12.5" text-anchor="middle">誰在 TIME_WAIT／CLOSE_WAIT</text>
<path d="M130 152 L130 166" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#lx-m1)"/><path d="M130 212 L130 226" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#lx-m1)"/><path d="M380 152 L380 166" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#lx-m1)"/><path d="M380 212 L380 226" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#lx-m1)"/><path d="M630 152 L630 166" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#lx-m1)"/><path d="M630 212 L630 226" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#lx-m1)"/>
<text x="30" y="292" font-size="12" opacity=".6">每一格都是「看到什麼 → 下一個指令」</text>
</svg>
