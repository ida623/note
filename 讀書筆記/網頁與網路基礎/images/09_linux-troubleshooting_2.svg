<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 260" aria-label="已刪除但還開著的檔案：rm 只拿掉目錄裡的名字，Java 行程的第 4 號檔案描述子還指著那個 inode 與 30 MB 的資料區塊，所以 du 看不到、df 還算著；把描述子截成 0 或結束行程後，空間才釋放" width="784" height="260">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="260" fill="#FFFFFF" stroke="none"/>
<defs><marker id="lx-m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs>
<rect x="30" y="40" width="200" height="70" rx="8" fill="none" stroke="currentColor" stroke-dasharray="5 4" stroke-opacity=".5"/><text x="130" y="68" font-size="13" text-anchor="middle">目錄 /data/logs</text><text x="130" y="92" font-size="12.5" text-anchor="middle" class="mono" opacity=".6">app.log（已 rm）</text>
<rect x="30" y="140" width="200" height="60" rx="8" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="130" y="166" font-size="13" text-anchor="middle">Java 行程 386</text><text x="130" y="186" font-size="12.5" text-anchor="middle" class="mono">fd 4（開來寫）</text>
<rect x="320" y="90" width="180" height="70" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="410" y="118" font-size="13" text-anchor="middle">inode 4</text><text x="410" y="142" font-size="12.5" text-anchor="middle" class="mono">NLINK 0</text>
<rect x="580" y="90" width="150" height="70" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="655" y="118" font-size="13" text-anchor="middle">資料區塊</text><text x="655" y="142" font-size="12.5" text-anchor="middle" class="mono">30 MB</text>
<path d="M232 76 L316 112" stroke="currentColor" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="5 4"/><text x="270" y="78" font-size="12" opacity=".6">名字沒了</text>
<path d="M232 170 L316 140" stroke="var(--gold-deep)" stroke-width="1.5" marker-end="url(#lx-m2)"/>
<path d="M502 125 L576 125" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#lx-m2)"/>
<text x="30" y="226" font-size="12" opacity=".6">du 從目錄走，看不到它；df 看區塊占用，還算著它。關掉 fd（截斷或重啟行程）才釋放</text>
</svg>
