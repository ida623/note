<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 288" aria-label="分支是指向 commit 的標籤。左圖：git branch limit 之後，main 和 limit 兩個標籤都指向 commit ae9d，HEAD 指向 main。右圖：git switch limit 再 commit 一次之後，新的 commit 99ea 的父節點是 ae9d，limit 跟著移到 99ea，HEAD 指向 limit，main 留在 ae9d" width="784" height="288">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="288" fill="#FFFFFF" stroke="none"/>
<defs><marker id="gb-m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><text x="40" y="26" font-size="13" fill="var(--gold-deep)">git branch limit 之後</text><circle cx="80" cy="150" r="20" fill="var(--surface)" stroke="currentColor"/><text x="80" y="154" font-size="11.5" text-anchor="middle" class="mono">08f3</text><circle cx="180" cy="150" r="20" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="180" y="154" font-size="11.5" text-anchor="middle" class="mono">ae9d</text><line x1="159.0" y1="150.0" x2="103.0" y2="150.0" stroke="currentColor" stroke-opacity=".6" stroke-width="1.5" marker-end="url(#gb-m2)"/><rect x="154.2" y="84" width="51.6" height="24" rx="5" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="180" y="100.5" font-size="12.5" text-anchor="middle" class="mono" fill="var(--gold-deep)">main</text><line x1="180" y1="108" x2="180" y2="128" stroke="currentColor" stroke-opacity=".6" stroke-width="1.2" marker-end="url(#gb-m2)"/><rect x="150.0" y="198" width="60.0" height="24" rx="5" fill="var(--surface)" stroke="currentColor"/><text x="180" y="214.5" font-size="12.5" text-anchor="middle" class="mono" fill="currentColor">limit</text><line x1="180" y1="198" x2="180" y2="173" stroke="currentColor" stroke-opacity=".6" stroke-width="1.2" marker-end="url(#gb-m2)"/><rect x="154.2" y="40" width="51.6" height="24" rx="5" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="180" y="56.5" font-size="12.5" text-anchor="middle" class="mono" fill="var(--slate-deep)">HEAD</text><line x1="180" y1="64" x2="180" y2="82" stroke="currentColor" stroke-opacity=".6" stroke-width="1.2" marker-end="url(#gb-m2)"/><line x1="370" y1="30" x2="370" y2="236" stroke="currentColor" stroke-opacity=".15"/><text x="400" y="26" font-size="13" fill="var(--gold-deep)">git switch limit、再 commit 一次之後</text><circle cx="440" cy="150" r="20" fill="var(--surface)" stroke="currentColor"/><text x="440" y="154" font-size="11.5" text-anchor="middle" class="mono">08f3</text><circle cx="540" cy="150" r="20" fill="var(--surface)" stroke="currentColor"/><text x="540" y="154" font-size="11.5" text-anchor="middle" class="mono">ae9d</text><circle cx="640" cy="150" r="20" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="640" y="154" font-size="11.5" text-anchor="middle" class="mono">99ea</text><line x1="519.0" y1="150.0" x2="463.0" y2="150.0" stroke="currentColor" stroke-opacity=".6" stroke-width="1.5" marker-end="url(#gb-m2)"/><line x1="619.0" y1="150.0" x2="563.0" y2="150.0" stroke="currentColor" stroke-opacity=".6" stroke-width="1.5" marker-end="url(#gb-m2)"/><rect x="514.2" y="198" width="51.6" height="24" rx="5" fill="var(--surface)" stroke="currentColor"/><text x="540" y="214.5" font-size="12.5" text-anchor="middle" class="mono" fill="currentColor">main</text><line x1="540" y1="198" x2="540" y2="173" stroke="currentColor" stroke-opacity=".6" stroke-width="1.2" marker-end="url(#gb-m2)"/><rect x="610.0" y="84" width="60.0" height="24" rx="5" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="640" y="100.5" font-size="12.5" text-anchor="middle" class="mono" fill="var(--gold-deep)">limit</text><line x1="640" y1="108" x2="640" y2="128" stroke="currentColor" stroke-opacity=".6" stroke-width="1.2" marker-end="url(#gb-m2)"/><rect x="614.2" y="40" width="51.6" height="24" rx="5" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="640" y="56.5" font-size="12.5" text-anchor="middle" class="mono" fill="var(--slate-deep)">HEAD</text><line x1="640" y1="64" x2="640" y2="82" stroke="currentColor" stroke-opacity=".6" stroke-width="1.2" marker-end="url(#gb-m2)"/><text x="40" y="250" font-size="12" opacity=".6">圓圈是 commit（裡面是雜湊的前四碼），箭頭指向父節點；方框是分支，灰藍的 HEAD 指向目前所在的分支</text>
</svg>
