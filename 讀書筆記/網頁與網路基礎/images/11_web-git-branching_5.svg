<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 294" aria-label="遠端追蹤分支。左圖：git fetch 之後，origin/main 移到同事推上去的 c64d，自己的 main 還在 3191，git status 說落後 1 個 commit。右圖：git pull 之後 main 快轉到 c64d，跟 origin/main 指向同一個 commit" width="784" height="294">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="294" fill="#FFFFFF" stroke="none"/>
<defs><marker id="gb-m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><text x="40" y="26" font-size="13" fill="var(--gold-deep)">git fetch 之後（還沒 pull）</text><circle cx="120" cy="120" r="20" fill="var(--surface)" stroke="currentColor"/><text x="120" y="124" font-size="11.5" text-anchor="middle" class="mono">3191</text><circle cx="240" cy="120" r="20" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="240" y="124" font-size="11.5" text-anchor="middle" class="mono">c64d</text><line x1="219.0" y1="120.0" x2="143.0" y2="120.0" stroke="currentColor" stroke-opacity=".6" stroke-width="1.5" marker-end="url(#gb-m5)"/><rect x="94.2" y="54" width="51.6" height="24" rx="5" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="120" y="70.5" font-size="12.5" text-anchor="middle" class="mono" fill="var(--gold-deep)">main</text><line x1="120" y1="78" x2="120" y2="98" stroke="currentColor" stroke-opacity=".6" stroke-width="1.2" marker-end="url(#gb-m5)"/><rect x="184.8" y="166" width="110.4" height="24" rx="5" fill="var(--surface)" stroke="currentColor"/><text x="240" y="182.5" font-size="12.5" text-anchor="middle" class="mono" fill="currentColor">origin/main</text><line x1="240" y1="166" x2="240" y2="143" stroke="currentColor" stroke-opacity=".6" stroke-width="1.2" marker-end="url(#gb-m5)"/><text x="180" y="222" font-size="12.5" text-anchor="middle">Your branch is behind 'origin/main' by 1 commit</text><line x1="390" y1="30" x2="390" y2="240" stroke="currentColor" stroke-opacity=".15"/><text x="420" y="26" font-size="13" fill="var(--gold-deep)">git pull 之後（快轉）</text><circle cx="480" cy="120" r="20" fill="var(--surface)" stroke="currentColor"/><text x="480" y="124" font-size="11.5" text-anchor="middle" class="mono">3191</text><circle cx="600" cy="120" r="20" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="600" y="124" font-size="11.5" text-anchor="middle" class="mono">c64d</text><line x1="579.0" y1="120.0" x2="503.0" y2="120.0" stroke="currentColor" stroke-opacity=".6" stroke-width="1.5" marker-end="url(#gb-m5)"/><rect x="574.2" y="54" width="51.6" height="24" rx="5" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="600" y="70.5" font-size="12.5" text-anchor="middle" class="mono" fill="var(--gold-deep)">main</text><line x1="600" y1="78" x2="600" y2="98" stroke="currentColor" stroke-opacity=".6" stroke-width="1.2" marker-end="url(#gb-m5)"/><rect x="544.8" y="166" width="110.4" height="24" rx="5" fill="var(--surface)" stroke="currentColor"/><text x="600" y="182.5" font-size="12.5" text-anchor="middle" class="mono" fill="currentColor">origin/main</text><line x1="600" y1="166" x2="600" y2="143" stroke="currentColor" stroke-opacity=".6" stroke-width="1.2" marker-end="url(#gb-m5)"/><text x="40" y="256" font-size="12" opacity=".6">灰藍＝fetch 抓下來、但工作目錄還沒有的 commit；origin/main 是「上次連線時遠端 main 在哪」的書籤</text>
</svg>
