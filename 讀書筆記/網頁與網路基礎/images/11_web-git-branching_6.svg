<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 294" aria-label="左圖 revert：main 原本在調成 20 元的 5599，git revert HEAD 新增一個改回 15 元的 commit 58c3，main 往前移到 58c3。右圖 reset：main 原本在草稿二 f080，git reset --hard HEAD~2 把 main 標籤移回 58c3，草稿一 067f 與草稿二 f080 變成虛線，沒有分支指著，但 reflog 還記得" width="784" height="294">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="294" fill="#FFFFFF" stroke="none"/>
<defs><marker id="gb-m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><text x="40" y="26" font-size="13" fill="var(--gold-deep)">git revert HEAD：多一個反向的 commit</text><circle cx="70" cy="110" r="20" fill="var(--surface)" stroke="currentColor"/><text x="70" y="114" font-size="11.5" text-anchor="middle" class="mono">bc40</text><circle cx="170" cy="110" r="20" fill="var(--surface)" stroke="currentColor"/><text x="170" y="114" font-size="11.5" text-anchor="middle" class="mono">5599</text><circle cx="270" cy="110" r="20" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="270" y="114" font-size="11.5" text-anchor="middle" class="mono">58c3</text><line x1="149.0" y1="110.0" x2="93.0" y2="110.0" stroke="currentColor" stroke-opacity=".6" stroke-width="1.5" marker-end="url(#gb-m6)"/><line x1="249.0" y1="110.0" x2="193.0" y2="110.0" stroke="currentColor" stroke-opacity=".6" stroke-width="1.5" marker-end="url(#gb-m6)"/><rect x="244.2" y="44" width="51.6" height="24" rx="5" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="270" y="60.5" font-size="12.5" text-anchor="middle" class="mono" fill="var(--gold-deep)">main</text><line x1="270" y1="68" x2="270" y2="88" stroke="currentColor" stroke-opacity=".6" stroke-width="1.2" marker-end="url(#gb-m6)"/><text x="170" y="160" font-size="11.5" text-anchor="middle" opacity=".7">調成 20 元</text><text x="270" y="160" font-size="11.5" text-anchor="middle" fill="var(--gold-deep)">改回 15 元</text><text x="40" y="200" font-size="12.5">歷史只往前加，已經推出去也安全</text><line x1="370" y1="30" x2="370" y2="240" stroke="currentColor" stroke-opacity=".15"/><text x="400" y="26" font-size="13" fill="var(--gold-deep)">git reset --hard HEAD~2：標籤往回移</text><circle cx="440" cy="110" r="20" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="440" y="114" font-size="11.5" text-anchor="middle" class="mono">58c3</text><circle cx="540" cy="110" r="20" fill="var(--surface)" stroke="currentColor" stroke-dasharray="4 3" opacity=".55"/><text x="540" y="114" font-size="11.5" text-anchor="middle" class="mono" opacity=".55">067f</text><circle cx="640" cy="110" r="20" fill="var(--surface)" stroke="currentColor" stroke-dasharray="4 3" opacity=".55"/><text x="640" y="114" font-size="11.5" text-anchor="middle" class="mono" opacity=".55">f080</text><line x1="519.0" y1="110.0" x2="463.0" y2="110.0" stroke="currentColor" stroke-opacity=".3" stroke-width="1.5" marker-end="url(#gb-m6)"/><line x1="619.0" y1="110.0" x2="563.0" y2="110.0" stroke="currentColor" stroke-opacity=".3" stroke-width="1.5" marker-end="url(#gb-m6)"/><rect x="414.2" y="44" width="51.6" height="24" rx="5" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="440" y="60.5" font-size="12.5" text-anchor="middle" class="mono" fill="var(--gold-deep)">main</text><line x1="440" y1="68" x2="440" y2="88" stroke="currentColor" stroke-opacity=".6" stroke-width="1.2" marker-end="url(#gb-m6)"/><path d="M640 64 Q560 30 470 50" fill="none" stroke="var(--slate)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#gb-m6)"/><text x="540" y="160" font-size="11.5" text-anchor="middle" opacity=".7">草稿一</text><text x="640" y="160" font-size="11.5" text-anchor="middle" opacity=".7">草稿二</text><text x="400" y="200" font-size="12.5">兩個草稿沒有分支指著，reflog 還找得到</text><text x="400" y="222" font-size="12.5">只用在還沒推出去的 commit</text><text x="40" y="256" font-size="12" opacity=".6">虛線圓圈＝沒有任何分支指著的 commit；灰藍虛線箭頭是 main 標籤往回移的方向</text>
</svg>
