<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 348" aria-label="CI/CD 管線：上排是持續整合，push 或 PR 觸發後依序建置、測試、靜態檢查、安全掃描；下排是持續交付，打映像檔、推上 registry、部署測試環境、人工核准、部署正式環境。拿掉人工核准就是持續部署" width="784" height="348">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="348" fill="#FFFFFF" stroke="none"/>
<defs><marker id="ci-m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><rect x="30" y="50" width="120" height="52" rx="8" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="90" y="73" font-size="13" text-anchor="middle">push／PR</text><text x="90" y="91" font-size="11.5" text-anchor="middle" opacity=".7">觸發</text><line x1="152" y1="76" x2="172" y2="76" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#ci-m1)"/><rect x="175" y="50" width="120" height="52" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="235" y="73" font-size="13" text-anchor="middle">建置</text><text x="235" y="91" font-size="11.5" text-anchor="middle" opacity=".7">編譯、打包</text><line x1="297" y1="76" x2="317" y2="76" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#ci-m1)"/><rect x="320" y="50" width="120" height="52" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="380" y="73" font-size="13" text-anchor="middle">測試</text><text x="380" y="91" font-size="11.5" text-anchor="middle" opacity=".7">單元、整合</text><line x1="442" y1="76" x2="462" y2="76" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#ci-m1)"/><rect x="465" y="50" width="120" height="52" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="525" y="73" font-size="13" text-anchor="middle">靜態檢查</text><text x="525" y="91" font-size="11.5" text-anchor="middle" opacity=".7">風格、常見錯誤</text><line x1="587" y1="76" x2="607" y2="76" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#ci-m1)"/><rect x="610" y="50" width="120" height="52" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="670" y="73" font-size="13" text-anchor="middle">安全掃描</text><text x="670" y="91" font-size="11.5" text-anchor="middle" opacity=".7">相依套件、密碼外洩</text><rect x="30" y="180" width="120" height="52" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="90" y="203" font-size="13" text-anchor="middle">打映像檔</text><text x="90" y="221" font-size="11.5" text-anchor="middle" opacity=".7">docker build</text><line x1="152" y1="206" x2="172" y2="206" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#ci-m1)"/><rect x="175" y="180" width="120" height="52" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="235" y="203" font-size="13" text-anchor="middle">推上 registry</text><text x="235" y="221" font-size="11.5" text-anchor="middle" opacity=".7">標籤用 commit</text><line x1="297" y1="206" x2="317" y2="206" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#ci-m1)"/><rect x="320" y="180" width="120" height="52" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="380" y="203" font-size="13" text-anchor="middle">部署測試環境</text><text x="380" y="221" font-size="11.5" text-anchor="middle" opacity=".7">staging</text><line x1="442" y1="206" x2="462" y2="206" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#ci-m1)"/><rect x="465" y="180" width="120" height="52" rx="8" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="525" y="203" font-size="13" text-anchor="middle">人工核准</text><text x="525" y="221" font-size="11.5" text-anchor="middle" opacity=".7">正式環境才要</text><line x1="587" y1="206" x2="607" y2="206" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#ci-m1)"/><rect x="610" y="180" width="120" height="52" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="670" y="203" font-size="13" text-anchor="middle">部署正式環境</text><text x="670" y="221" font-size="11.5" text-anchor="middle" opacity=".7">production</text><path d="M670.0 104 L670.0 130 L90.0 130 L90.0 174" fill="none" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#ci-m1)"/><text x="30" y="34" font-size="12.5" fill="var(--gold-deep)">持續整合（CI）：每次推上來都自動建置、測試，壞了馬上知道</text><text x="30" y="262" font-size="12.5" fill="var(--slate-deep)">持續交付（CD）：通過的版本隨時可以上線；按下核准才進正式環境</text><text x="30" y="284" font-size="12.5">持續部署：拿掉「人工核准」這一格，通過就自動上正式環境</text><text x="30" y="310" font-size="12" opacity=".6">任何一格失敗，後面的格子都不會跑；修好再推一次，整條重來</text>
</svg>
