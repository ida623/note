<defs><marker id="ci-m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><rect x="20" y="40" width="430" height="300" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="34" y="62" font-size="13" fill="var(--slate-deep)">job：build（ubuntu-latest）</text><rect x="34" y="74" width="402" height="30" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="235" y="94" font-size="12.5" text-anchor="middle">checkout：把 repo 抓下來</text><rect x="34" y="111" width="402" height="30" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="235" y="131" font-size="12.5" text-anchor="middle">setup-python：裝 Python 3.14</text><rect x="34" y="148" width="402" height="30" rx="8" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="235" y="168" font-size="12.5" text-anchor="middle">測試：unittest</text><rect x="34" y="185" width="402" height="30" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="235" y="205" font-size="12.5" text-anchor="middle">建置：build.py 產出 dist/</text><rect x="34" y="222" width="402" height="30" rx="8" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="235" y="242" font-size="12.5" text-anchor="middle">檢查 JavaScript 語法：node --check</text><rect x="34" y="259" width="402" height="30" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="235" y="279" font-size="12.5" text-anchor="middle">configure-pages</text><rect x="34" y="296" width="402" height="30" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="235" y="316" font-size="12.5" text-anchor="middle">upload-pages-artifact：把 dist/ 打包上傳</text><rect x="510" y="150" width="230" height="110" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="524" y="172" font-size="13" fill="var(--slate-deep)">job：deploy（needs: build）</text><text x="524" y="190" font-size="12" opacity=".8">environment：github-pages</text><rect x="524" y="202" width="202" height="40" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="625" y="227" font-size="12.5" text-anchor="middle">deploy-pages：發佈</text><line x1="452" y1="316" x2="520" y2="240" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ci-m4)"/><text x="458" y="340" font-size="12" fill="var(--gold-deep)">artifact「github-pages」</text><text x="20" y="28" font-size="12.5" fill="var(--gold-deep)">on: push 到 main，或在 Actions 頁手動按 Run workflow</text><text x="20" y="366" font-size="12" opacity=".6">古銅格是會擋下發佈的檢查：測試或語法檢查失敗，build 失敗，deploy 不會跑，網站維持舊版</text>
