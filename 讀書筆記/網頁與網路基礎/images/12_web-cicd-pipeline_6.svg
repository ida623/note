<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 338" aria-label="部署到 Kubernetes 的兩種方式。推：管線把映像檔推上 registry，再用 kubectl 從外面連進叢集部署，管線要有叢集的憑證。拉：管線只改設定 Git repo 裡的映像檔標籤，叢集裡的 Argo CD 持續比對 Git 裡的設定並同步" width="784" height="338">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="338" fill="#FFFFFF" stroke="none"/>
<defs><marker id="ci-m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><text x="20" y="30" font-size="13" fill="var(--gold-deep)">推（push）：管線自己連進叢集部署</text><rect x="20" y="46" width="150" height="50" rx="8" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="95" y="68" font-size="13" text-anchor="middle">CI/CD 管線</text><text x="95" y="86" font-size="11.5" text-anchor="middle" opacity=".7">有叢集的憑證</text><rect x="300" y="46" width="150" height="50" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="375" y="68" font-size="13" text-anchor="middle">registry</text><text x="375" y="86" font-size="11.5" text-anchor="middle" opacity=".7">放映像檔</text><rect x="560" y="46" width="170" height="50" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="645" y="76" font-size="13" text-anchor="middle">Kubernetes 叢集</text><line x1="172" y1="64" x2="296" y2="64" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#ci-m6)"/><text x="234" y="58" font-size="11.5" text-anchor="middle">推映像檔</text><path d="M95 98 Q95 128 380 128 Q645 128 645 100" fill="none" stroke="var(--gold-deep)" stroke-width="1.5" marker-end="url(#ci-m6)"/><text x="380" y="146" font-size="12" text-anchor="middle" fill="var(--gold-deep)">kubectl apply／set image（從外面打進叢集）</text><text x="20" y="190" font-size="13" fill="var(--slate-deep)">拉（GitOps）：叢集裡的工具看 Git、自己同步</text><rect x="20" y="206" width="150" height="50" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="95" y="228" font-size="13" text-anchor="middle">CI/CD 管線</text><text x="95" y="246" font-size="11.5" text-anchor="middle" opacity=".7">只改 Git 裡的 YAML</text><rect x="300" y="206" width="150" height="50" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="375" y="228" font-size="13" text-anchor="middle">設定用的 Git repo</text><text x="375" y="246" font-size="11.5" text-anchor="middle" opacity=".7">期望狀態</text><rect x="560" y="206" width="170" height="50" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="645" y="228" font-size="13" text-anchor="middle">叢集裡的 Argo CD</text><text x="645" y="246" font-size="11.5" text-anchor="middle" opacity=".7">比對、同步</text><line x1="172" y1="231" x2="296" y2="231" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#ci-m6)"/><text x="234" y="225" font-size="11.5" text-anchor="middle">改映像檔標籤</text><line x1="556" y1="231" x2="454" y2="231" stroke="var(--slate)" stroke-opacity="1" stroke-width="1.5" marker-end="url(#ci-m6)"/><text x="505" y="225" font-size="11.5" text-anchor="middle" fill="var(--slate-deep)">持續比對</text><text x="20" y="300" font-size="12" opacity=".6">推：簡單直接，但管線要握有叢集的權限。拉：叢集的權限留在叢集裡，Git 紀錄就是部署紀錄</text>
</svg>
