<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 204" aria-label="時間軸圖例：灰色橫線是時間，中間直線是現在；古銅色圓點是發生一次的動作，灰藍色長條是持續一段時間的動作，一排小圓點是反覆發生的習慣，灰藍虛線是參考的時刻，古銅色箭頭表示一路持續到參考點" width="784" height="204">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="204" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="ts-arr-0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker><marker id="ts-arrg-0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--gold)"/></marker></defs>
  <line x1="30" y1="110" x2="730" y2="110" stroke="currentColor" stroke-opacity=".45" stroke-width="2" marker-end="url(#ts-arr-0)"/>
  <text x="30" y="140" font-size="12" opacity=".6">過去</text>
  <text x="700" y="140" font-size="12" opacity=".6">未來</text>
  <circle cx="70" cy="110" r="4" fill="var(--gold)" opacity=".4"/>
  <circle cx="100" cy="110" r="4" fill="var(--gold)"/>
  <circle cx="130" cy="110" r="4" fill="var(--gold)"/>
  <circle cx="160" cy="110" r="4" fill="var(--gold)"/>
  <circle cx="190" cy="110" r="4" fill="var(--gold)" opacity=".4"/>
  <text x="130" y="88" font-size="13" text-anchor="middle" fill="var(--gold-deep)">反覆</text>
  <text x="130" y="168" font-size="12" text-anchor="middle" opacity=".75">習慣、一再發生</text>
  <circle cx="240" cy="110" r="7" fill="var(--gold)"/>
  <text x="240" y="88" font-size="13" text-anchor="middle" fill="var(--gold-deep)">點</text>
  <text x="240" y="168" font-size="12" text-anchor="middle" opacity=".75">發生一次</text>
  <rect x="275" y="101" width="80" height="18" rx="3" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="315" y="88" font-size="13" text-anchor="middle" fill="var(--slate-deep)">段</text>
  <text x="315" y="168" font-size="12" text-anchor="middle" opacity=".75">持續一段時間</text>
  <line x1="380" y1="60" x2="380" y2="130" stroke="currentColor" stroke-width="2"/>
  <text x="380" y="50" font-size="12.5" text-anchor="middle">現在 now</text>
  <circle cx="455" cy="110" r="7" fill="var(--gold)"/>
  <line x1="463" y1="110" x2="634" y2="110" stroke="var(--gold)" stroke-width="3" marker-end="url(#ts-arrg-0)"/>
  <text x="545" y="96" font-size="12" text-anchor="middle" fill="var(--gold-deep)">到那時為止</text>
  <text x="540" y="168" font-size="12" text-anchor="middle" opacity=".75">一直到參考點（完成式）</text>
  <line x1="640" y1="60" x2="640" y2="130" stroke="var(--slate)" stroke-dasharray="5 4"/>
  <text x="640" y="50" font-size="12" text-anchor="middle" fill="var(--slate)">參考點</text>
  <text x="660" y="168" font-size="12" text-anchor="middle" opacity=".75">某個時刻</text>
</svg>
