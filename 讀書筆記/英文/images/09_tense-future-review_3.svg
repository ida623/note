<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 194" aria-label="未來完成進行式：工作從過去開始，經過現在，一直持續到未來的十二月" width="784" height="194">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="194" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="tr-arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker><marker id="tr-gold3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--gold)"/></marker></defs>
  <line x1="30" y1="110" x2="730" y2="110" stroke="currentColor" stroke-opacity=".45" stroke-width="2" marker-end="url(#tr-arr3)"/>
  <text x="30" y="140" font-size="12" opacity=".6">過去</text>
  <text x="700" y="140" font-size="12" opacity=".6">未來</text>
  <line x1="380" y1="60" x2="380" y2="130" stroke="currentColor" stroke-width="2"/>
  <text x="380" y="50" font-size="12.5" text-anchor="middle">現在 now</text>
  <rect x="220" y="101" width="400" height="18" rx="3" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="515" y="92" font-size="13" text-anchor="middle" class="mono" fill="var(--slate-deep)">will have been working</text>
  <line x1="620" y1="66" x2="620" y2="130" stroke="var(--slate)" stroke-dasharray="5 4"/>
  <text x="620" y="148" font-size="12" text-anchor="middle" fill="var(--slate-deep)" class="mono">by December</text>
  <line x1="220" y1="72" x2="618" y2="72" stroke="var(--gold)" stroke-width="2.5" marker-end="url(#tr-gold3)"/>
  <text x="520" y="65" font-size="12" text-anchor="middle" fill="var(--gold-deep)">到那時為止</text>
  <text x="220" y="140" font-size="12" text-anchor="middle" opacity=".75">開始</text>
</svg>
