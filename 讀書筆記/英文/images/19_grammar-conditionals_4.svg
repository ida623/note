<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 194" aria-label="混合條件句：過去的條件影響現在的結果。過去的位置有虛線空心圓 had accepted，灰色弧線箭頭指到現在那條線上的虛線空心圓 would be working；左上角寫事實：當年沒接受那份工作，現在也不在東京" width="784" height="194">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="194" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="cf-arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs>
  <text x="30" y="28" font-size="12" fill="var(--slate)">事實：當年沒接受那份工作，現在也不在東京工作</text>
  <line x1="30" y1="110" x2="730" y2="110" stroke="currentColor" stroke-opacity=".45" stroke-width="2" marker-end="url(#cf-arr4)"/>
  <text x="30" y="140" font-size="12" opacity=".6">過去</text>
  <text x="700" y="140" font-size="12" opacity=".6">未來</text>
  <line x1="480" y1="60" x2="480" y2="130" stroke="currentColor" stroke-width="2"/>
  <text x="480" y="50" font-size="12.5" text-anchor="middle">現在 now</text>
  <line x1="170" y1="96" x2="170" y2="130" stroke="var(--slate)" stroke-dasharray="5 4"/>
  <circle cx="170" cy="110" r="8" fill="var(--surface)" stroke="var(--gold)" stroke-width="2" stroke-dasharray="3 2"/>
  <text x="170" y="88" font-size="13" text-anchor="middle" class="mono" fill="var(--gold-deep)">had accepted</text>
  <text x="170" y="148" font-size="12" text-anchor="middle" fill="var(--slate)" class="mono">five years ago</text>
  <path d="M182 102 Q325 50 468 102" fill="none" stroke="currentColor" stroke-opacity=".5" stroke-width="1.5" marker-end="url(#cf-arr4)"/>
  <circle cx="480" cy="110" r="8" fill="var(--surface)" stroke="var(--gold)" stroke-width="2" stroke-dasharray="3 2"/>
  <text x="492" y="88" font-size="13" class="mono" fill="var(--gold-deep)">would be working</text>
</svg>
