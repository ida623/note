<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 224" aria-label="STAR 的時間分配：建議情境約兩成、任務約一成、行動約六成、結果約一成；行動要講我做了什麼，結果要有數字" width="784" height="224">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="224" fill="#FFFFFF" stroke="none"/>
  <rect x="20" y="40" width="144" height="70" rx="6" fill="var(--surface)" stroke="currentColor" stroke-width="1.6"/>
  <text x="92" y="70" font-size="13" text-anchor="middle">20%</text>
  <text x="92" y="92" font-size="12.5" text-anchor="middle" opacity=".85">Situation 情境</text>
  <rect x="164" y="40" width="72" height="70" rx="6" fill="var(--surface)" stroke="currentColor" stroke-width="1.6"/>
  <text x="200" y="70" font-size="13" text-anchor="middle">10%</text>
  <rect x="236" y="40" width="432" height="70" rx="6" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="1.6"/>
  <text x="452" y="70" font-size="13" text-anchor="middle">60%</text>
  <text x="452" y="92" font-size="12.5" text-anchor="middle" opacity=".85">Action 行動：講「I」做了什麼</text>
  <rect x="668" y="40" width="72" height="70" rx="6" fill="var(--slate-soft)" stroke="var(--slate)" stroke-width="1.6"/>
  <text x="704" y="70" font-size="13" text-anchor="middle">10%</text>
  <text x="200" y="132" font-size="12" text-anchor="middle" opacity=".85">Task 任務</text>
  <text x="704" y="132" font-size="12" text-anchor="middle" opacity=".85">Result 結果</text>
  <text x="20" y="170" font-size="12.5" opacity=".85">情境與任務各一兩句帶過；結果用數字收尾，再補一句學到什麼</text>
