<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 744 224" aria-label="同一台伺服器裡，兩件工作搶同一個鎖，只有一個能通過去改餘額" width="744" height="224">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="744" height="224" fill="#FFFFFF" stroke="none"/>
        <rect x="30" y="26" width="380" height="150" rx="6" fill="none" stroke="currentColor" stroke-opacity=".35"/>
        <text x="46" y="48" font-size="12" opacity=".6">一台伺服器裡面</text>

        <circle cx="100" cy="88" r="20" fill="none" stroke="currentColor"/>
        <text x="100" y="93" font-size="14" text-anchor="middle">A</text>
        <circle cx="100" cy="148" r="20" fill="none" stroke="currentColor"/>
        <text x="100" y="153" font-size="14" text-anchor="middle">B</text>

        <rect x="250" y="76" width="56" height="76" rx="5" fill="none" stroke="var(--gold)" stroke-width="2"/>
        <text x="278" y="120" font-size="15" text-anchor="middle" fill="var(--gold)">鎖</text>

        <line x1="124" y1="90" x2="242" y2="102" stroke="var(--gold)" stroke-width="2" marker-end="url(#a1)"/>
        <text x="150" y="80" font-size="12" fill="var(--gold)">進去了</text>

        <line x1="124" y1="146" x2="242" y2="132" stroke="currentColor" stroke-opacity=".5" stroke-dasharray="5 4" marker-end="url(#a2)"/>
        <text x="152" y="170" font-size="12" opacity=".6">在外面等</text>

        <line x1="310" y1="114" x2="500" y2="114" stroke="var(--gold)" stroke-width="2" marker-end="url(#a1)"/>
        <rect x="510" y="84" width="170" height="60" rx="4" fill="none" stroke="currentColor"/>
        <text x="595" y="120" font-size="15" text-anchor="middle">帳戶餘額</text>

        <defs>
          <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <polygon points="0,0 10,5 0,10" fill="var(--gold)"/>
          </marker>
          <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <polygon points="0,0 10,5 0,10" fill="currentColor" fill-opacity=".5"/>
          </marker>
        </defs>
      </svg>
