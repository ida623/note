<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 314" aria-label="三台伺服器都向同一個 Redis 要鎖，只有一台拿到，才能去改餘額" width="784" height="314">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="314" fill="#FFFFFF" stroke="none"/>
        <g stroke="currentColor" fill="none">
          <rect x="24" y="34" width="170" height="52" rx="5"/>
          <rect x="24" y="118" width="170" height="52" rx="5"/>
          <rect x="24" y="202" width="170" height="52" rx="5"/>
        </g>
        <text x="44" y="66" font-size="15">伺服器 1</text>
        <text x="44" y="150" font-size="15">伺服器 2</text>
        <text x="44" y="234" font-size="15">伺服器 3</text>

        <line x1="202" y1="60" x2="316" y2="128" stroke="var(--gold)" stroke-width="2" marker-end="url(#a3)"/>
        <line x1="202" y1="144" x2="316" y2="144" stroke="currentColor" stroke-opacity=".45" stroke-dasharray="5 4" marker-end="url(#a4)"/>
        <line x1="202" y1="228" x2="316" y2="160" stroke="currentColor" stroke-opacity=".45" stroke-dasharray="5 4" marker-end="url(#a4)"/>

        <rect x="324" y="98" width="150" height="94" rx="5" fill="none" stroke="var(--gold)" stroke-width="2"/>
        <text x="399" y="134" font-size="15" text-anchor="middle" fill="var(--gold)">Redis</text>
        <text x="399" y="160" font-size="13" text-anchor="middle" fill="var(--gold)">唯一的鑰匙</text>

        <text x="252" y="86" font-size="12" fill="var(--gold)">給我</text>
        <text x="236" y="196" font-size="12" opacity=".6">給我</text>

        <line x1="484" y1="145" x2="586" y2="145" stroke="var(--gold)" stroke-width="2" marker-end="url(#a3)"/>
        <text x="535" y="132" font-size="12" text-anchor="middle" fill="var(--gold)">只有 1 拿到</text>

        <rect x="596" y="115" width="140" height="60" rx="5" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="666" y="151" font-size="15" text-anchor="middle">帳戶餘額</text>

        <text x="399" y="228" font-size="13" text-anchor="middle" opacity=".65">2 和 3 拿不到，只能等或放棄</text>

        <defs>
          <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <polygon points="0,0 10,5 0,10" fill="var(--gold)"/>
          </marker>
          <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <polygon points="0,0 10,5 0,10" fill="currentColor" fill-opacity=".45"/>
          </marker>
        </defs>
      </svg>
