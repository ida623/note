<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 404 254" aria-label="哨兵：三個監看程序盯著主從，主機掛了自動把從機升上來" width="404" height="254">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="404" height="254" fill="#FFFFFF" stroke="none"/>
          <rect x="30" y="24" width="130" height="52" rx="5" fill="none" stroke="var(--gold)" stroke-width="2"/>
          <text x="95" y="55" font-size="15" text-anchor="middle" fill="var(--gold)">主機</text>
          <rect x="30" y="118" width="130" height="48" rx="5" fill="none" stroke="currentColor"/>
          <text x="95" y="147" font-size="14" text-anchor="middle">從機</text>
          <line x1="95" y1="80" x2="95" y2="112" stroke="currentColor" stroke-opacity=".55" stroke-dasharray="5 4" marker-end="url(#b3)"/>

          <g fill="none" stroke="var(--ok)" stroke-width="1.8">
            <circle cx="268" cy="46" r="19"/>
            <circle cx="322" cy="86" r="19"/>
            <circle cx="268" cy="126" r="19"/>
          </g>
          <g font-size="12" text-anchor="middle" fill="var(--ok)">
            <text x="268" y="51">哨兵</text>
            <text x="322" y="91">哨兵</text>
            <text x="268" y="131">哨兵</text>
          </g>

          <line x1="248" y1="52" x2="168" y2="48" stroke="var(--ok)" stroke-dasharray="4 4" marker-end="url(#b4)"/>
          <line x1="248" y1="126" x2="168" y2="140" stroke="var(--ok)" stroke-dasharray="4 4" marker-end="url(#b4)"/>
          <text x="208" y="90" font-size="11" text-anchor="middle" fill="var(--ok)">PING 確認活著</text>

          <text x="190" y="196" font-size="13" text-anchor="middle" fill="var(--ok)">主機掛了 → 自動把從機升為新主機</text>
          <text x="190" y="216" font-size="12" text-anchor="middle" opacity=".65">資料量還是「一台能裝多少」</text>
          <defs>
            <marker id="b3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <polygon points="0,0 10,5 0,10" fill="currentColor" fill-opacity=".55"/>
            </marker>
            <marker id="b4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <polygon points="0,0 10,5 0,10" fill="var(--ok)"/>
            </marker>
          </defs>
        </svg>
