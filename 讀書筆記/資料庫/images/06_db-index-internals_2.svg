<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 286" aria-label="叢集索引與二級索引：左邊二級索引的葉節點存帳號、日期與主鍵 id；右邊叢集索引的葉節點存整列資料。查詢 SELECT 星號時，先在二級索引找到 id，再拿 id 到叢集索引找整列，這一趟叫回表" width="784" height="286">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="286" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="ix-a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker><marker id="ix-a2g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--gold)"/></marker></defs>
  <text x="190" y="22" font-size="13" text-anchor="middle" font-weight="700">二級索引 idx_acct_date</text>
  <text x="580" y="22" font-size="13" text-anchor="middle" font-weight="700">叢集索引（主鍵 id）</text>
  <rect x="110" y="40" width="160" height="34" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="190.0" y="61.0" font-size="12" text-anchor="middle" class="mono">根</text>
  <rect x="500" y="40" width="160" height="34" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="580.0" y="61.0" font-size="12" text-anchor="middle" class="mono">根</text>
  <line x1="190" y1="74" x2="190" y2="108" stroke="currentColor" stroke-width="1.4" marker-end="url(#ix-a2)"/>
  <line x1="580" y1="74" x2="580" y2="108" stroke="currentColor" stroke-width="1.4" marker-end="url(#ix-a2)"/>
  <rect x="60" y="110" width="260" height="80" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="190.0" y="134.0" font-size="11" text-anchor="middle" class="mono">(0000001234, 2026-03-23) → id 3234</text><text x="190.0" y="154.0" font-size="11" text-anchor="middle" class="mono">(0000001234, 2026-03-23) → id 19234</text><text x="190.0" y="174.0" font-size="11" text-anchor="middle" class="mono">…</text>
  <rect x="410" y="110" width="340" height="80" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="580.0" y="134.0" font-size="10.5" text-anchor="middle" class="mono">id 3234 | 0000001234 | 2026-03-23 | 93586.00 | ATM</text><text x="580.0" y="154.0" font-size="10.5" text-anchor="middle" class="mono">id 19234 | 0000001234 | 2026-03-23 | 57586.00 | ATM</text><text x="580.0" y="174.0" font-size="10.5" text-anchor="middle" class="mono">…</text>
  <path d="M320 136 C 360 136, 370 136, 408 136" fill="none" stroke="var(--gold)" stroke-width="2" marker-end="url(#ix-a2g)"/>
  <path d="M320 156 C 360 156, 370 160, 408 160" fill="none" stroke="var(--gold)" stroke-width="2" marker-end="url(#ix-a2g)"/>
  <text x="369" y="124" font-size="12" text-anchor="middle" fill="var(--gold-deep)" font-weight="700">回表</text>
  <text x="190" y="214" font-size="12" text-anchor="middle" fill="var(--slate-deep)">葉節點只有索引欄位＋主鍵</text>
  <text x="580" y="214" font-size="12" text-anchor="middle" fill="var(--gold-deep)">葉節點就是整列資料</text>
  <text x="380" y="246" font-size="12" text-anchor="middle">SELECT * 用二級索引找到 id 後，還要拿 id 到叢集索引再找一次；只要 id、帳號、日期就不必回表（覆蓋索引）</text>
</svg>
