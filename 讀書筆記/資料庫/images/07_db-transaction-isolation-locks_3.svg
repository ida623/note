<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 404" aria-label="幻讀的時間軸：交易 A 在 REPEATABLE READ 下 0 秒數出餘額 8000 以上的帳戶有 3 個；交易 B 在 1 秒新增一個 9000 的帳戶並提交；A 在 2 秒用一般 SELECT 再數仍是 3，但改用 FOR SHARE 數就是 4" width="784" height="404">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="404" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="tx-3-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs>
  <line x1="120.0" y1="292" x2="740.0" y2="292" stroke="currentColor" stroke-opacity=".5" marker-end="url(#tx-3-a)"/>
  <line x1="120.0" y1="288" x2="120.0" y2="296" stroke="currentColor" stroke-opacity=".5"/>
  <text opacity=".6" x="120.0" y="312" font-size="11" text-anchor="middle">0 秒</text>
  <line x1="320.0" y1="288" x2="320.0" y2="296" stroke="currentColor" stroke-opacity=".5"/>
  <text opacity=".6" x="320.0" y="312" font-size="11" text-anchor="middle">1 秒</text>
  <line x1="520.0" y1="288" x2="520.0" y2="296" stroke="currentColor" stroke-opacity=".5"/>
  <text opacity=".6" x="520.0" y="312" font-size="11" text-anchor="middle">2 秒</text>
  <line x1="720.0" y1="288" x2="720.0" y2="296" stroke="currentColor" stroke-opacity=".5"/>
  <text opacity=".6" x="720.0" y="312" font-size="11" text-anchor="middle">3 秒</text>
  <text x="40" y="114" font-size="13" text-anchor="middle" font-weight="700">交易 A</text>
  <text x="40" y="214" font-size="13" text-anchor="middle" font-weight="700">交易 B</text>
  <line x1="120.0" y1="110" x2="720.0" y2="110" stroke="currentColor" stroke-opacity=".2" stroke-width="6"/>
  <line x1="120.0" y1="210" x2="720.0" y2="210" stroke="currentColor" stroke-opacity=".2" stroke-width="6"/>
  <line x1="120.0" y1="110" x2="120.0" y2="76" stroke="currentColor" stroke-opacity=".5"/>
  <circle cx="120.0" cy="110" r="4" fill="currentColor"/>
  <rect x="80" y="30" width="124" height="46" rx="5" fill="var(--surface)" stroke="currentColor"/>
  <text x="142.0" y="49" font-size="11.5" text-anchor="middle" class="mono">COUNT(*) WHERE</text>
  <text x="142.0" y="67" font-size="11.5" text-anchor="middle" class="mono">balance >= 8000</text>
  <text x="142.0" y="24" font-size="11.5" text-anchor="middle" fill="var(--gold-deep)" font-weight="700">3</text>
  <line x1="320.0" y1="210" x2="320.0" y2="224" stroke="currentColor" stroke-opacity=".5"/>
  <circle cx="320.0" cy="210" r="4" fill="var(--gold)"/>
  <rect x="272" y="224" width="95" height="46" rx="5" fill="var(--gold-soft)" stroke="var(--gold)"/>
  <text x="320.0" y="243" font-size="11.5" text-anchor="middle" class="mono">INSERT 9000</text>
  <text x="320.0" y="261" font-size="11.5" text-anchor="middle" class="mono">（自動提交）</text>
  <line x1="520.0" y1="110" x2="520.0" y2="76" stroke="currentColor" stroke-opacity=".5"/>
  <circle cx="520.0" cy="110" r="4" fill="currentColor"/>
  <rect x="455" y="48" width="130" height="28" rx="5" fill="var(--surface)" stroke="currentColor"/>
  <text x="520.0" y="67" font-size="11.5" text-anchor="middle" class="mono">同一句一般 SELECT</text>
  <text x="520.0" y="42" font-size="11.5" text-anchor="middle" fill="var(--gold-deep)" font-weight="700">3（快照）</text>
  <line x1="720.0" y1="110" x2="720.0" y2="76" stroke="currentColor" stroke-opacity=".5"/>
  <circle cx="720.0" cy="110" r="4" fill="var(--danger)"/>
  <rect x="618" y="48" width="134" height="28" rx="5" fill="var(--sunk)" stroke="var(--danger)"/>
  <text x="685" y="67" font-size="11.5" text-anchor="middle" class="mono">同一句加 FOR SHARE</text>
  <text x="685" y="42" font-size="11.5" text-anchor="middle" fill="var(--gold-deep)" font-weight="700">4（讀最新）</text>
  <text x="380" y="340" font-size="12" text-anchor="middle" fill="var(--slate-deep)">REPEATABLE READ 的一般 SELECT 讀快照，看不到 B 新增的列</text>
  <text x="380" y="360" font-size="12" text-anchor="middle" fill="var(--slate-deep)">鎖定讀讀的是最新版本；READ COMMITTED 下第二次一般 SELECT 就是 4</text>
</svg>
