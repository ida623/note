<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 234" aria-label="Next-Key 鎖的範圍：idx_balance 上有 5000、8000、10000、12000 四筆記錄。交易 A 執行 balance 大於等於 8000 的 FOR UPDATE，鎖住 8000、10000、12000 三筆記錄與它們前面的間隙（從 5000 之後開始），以及 12000 之後到正無限的間隙。交易 B 想插入 9000，落在 8000 到 10000 之間的間隙，只能等待" width="784" height="234">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="234" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="tx-8a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs>
  <line x1="40" y1="110" x2="720" y2="110" stroke="currentColor" stroke-width="1.5" marker-end="url(#tx-8a)"/>
  <rect x="136" y="94" width="148" height="32" rx="4" fill="var(--gold-soft)" stroke="var(--gold)" stroke-dasharray="4 3"/>
  <rect x="296" y="94" width="148" height="32" rx="4" fill="var(--gold-soft)" stroke="var(--gold)" stroke-dasharray="4 3"/>
  <rect x="456" y="94" width="148" height="32" rx="4" fill="var(--gold-soft)" stroke="var(--gold)" stroke-dasharray="4 3"/>
  <rect x="616" y="94" width="93" height="32" rx="4" fill="var(--gold-soft)" stroke="var(--gold)" stroke-dasharray="4 3"/>
  <circle cx="130" cy="110" r="9" fill="var(--surface)" stroke="currentColor"/>
  <text x="130" y="144" font-size="12" text-anchor="middle" font-weight="700" class="mono">5000</text>
  <text opacity=".6" x="130" y="160" font-size="11" text-anchor="middle">id 2</text>
  <circle cx="290" cy="110" r="9" fill="var(--gold)" stroke="var(--gold)"/>
  <text x="290" y="144" font-size="12" text-anchor="middle" font-weight="700" class="mono">8000</text>
  <text opacity=".6" x="290" y="160" font-size="11" text-anchor="middle">id 5</text>
  <circle cx="450" cy="110" r="9" fill="var(--gold)" stroke="var(--gold)"/>
  <text x="450" y="144" font-size="12" text-anchor="middle" font-weight="700" class="mono">10000</text>
  <text opacity=".6" x="450" y="160" font-size="11" text-anchor="middle">id 1</text>
  <circle cx="610" cy="110" r="9" fill="var(--gold)" stroke="var(--gold)"/>
  <text x="610" y="144" font-size="12" text-anchor="middle" font-weight="700" class="mono">12000</text>
  <text opacity=".6" x="610" y="160" font-size="11" text-anchor="middle">id 9</text>
  <text x="70" y="144" font-size="12" text-anchor="middle" class="mono">−∞</text>
  <text x="705" y="144" font-size="12" text-anchor="middle" class="mono">+∞</text>
  <text x="370" y="86" font-size="11" text-anchor="middle" fill="var(--gold-deep)" class="mono">(8000, 10000]</text>
  <text x="530" y="86" font-size="11" text-anchor="middle" fill="var(--gold-deep)" class="mono">(10000, 12000]</text>
  <text x="662" y="86" font-size="11" text-anchor="middle" fill="var(--gold-deep)" class="mono">(12000, +∞)</text>
  <text x="210" y="86" font-size="11" text-anchor="middle" fill="var(--gold-deep)" class="mono">(5000, 8000]</text>
  <circle cx="370" cy="110" r="7" fill="var(--sunk)" stroke="var(--danger)"/>
  <text x="370" y="186" font-size="12" text-anchor="middle" fill="var(--danger)" font-weight="700">B 想插入 9000：落在 (8000, 10000] 這段間隙 → 等待</text>
  <text x="370" y="30" font-size="13" text-anchor="middle" font-weight="700">idx_balance 的索引記錄；A 執行 SELECT … WHERE balance >= 8000 FOR UPDATE</text>
  <text x="370" y="52" font-size="12" text-anchor="middle" fill="var(--slate-deep)">古銅實心圓＝記錄鎖；古銅虛線框＝間隙鎖；記錄＋它前面那段間隙＝Next-Key 鎖</text>
</svg>
