<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 252" aria-label="快取放在哪裡：由左到右是瀏覽器、CDN、應用程式記憶體裡的本地快取、Redis、資料庫。請求從左往右找，找到就停，找不到才往下一層。越左越近越快、容量越小，越右越遠越慢、容量越大，資料庫是最終權威。本課的主角是本地快取與 Redis" width="784" height="252">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="252" fill="#FFFFFF" stroke="none"/>
<defs><marker id="cr-m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><rect x="22" y="70" width="128" height="60" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="86.0" y="97.0" font-size="13.5" text-anchor="middle">瀏覽器</text><text x="86.0" y="115.0" font-size="11.5" text-anchor="middle" opacity=".7">HTTP 快取</text><line x1="152" y1="100" x2="170" y2="100" stroke="currentColor" stroke-opacity=".65" stroke-width="1.5" marker-end="url(#cr-m1)"/><rect x="170" y="70" width="128" height="60" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="234.0" y="97.0" font-size="13.5" text-anchor="middle">CDN</text><text x="234.0" y="115.0" font-size="11.5" text-anchor="middle" opacity=".7">共用的 HTTP 快取</text><line x1="300" y1="100" x2="318" y2="100" stroke="currentColor" stroke-opacity=".65" stroke-width="1.5" marker-end="url(#cr-m1)"/><rect x="318" y="70" width="128" height="60" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="382.0" y="97.0" font-size="13.5" text-anchor="middle">應用程式記憶體</text><text x="382.0" y="115.0" font-size="11.5" text-anchor="middle" opacity=".7">本地快取</text><line x1="448" y1="100" x2="466" y2="100" stroke="currentColor" stroke-opacity=".65" stroke-width="1.5" marker-end="url(#cr-m1)"/><rect x="466" y="70" width="128" height="60" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="530.0" y="97.0" font-size="13.5" text-anchor="middle">Redis</text><text x="530.0" y="115.0" font-size="11.5" text-anchor="middle" opacity=".7">遠端共用快取</text><line x1="596" y1="100" x2="614" y2="100" stroke="currentColor" stroke-opacity=".65" stroke-width="1.5" marker-end="url(#cr-m1)"/><rect x="614" y="70" width="128" height="60" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="678.0" y="97.0" font-size="13.5" text-anchor="middle">資料庫</text><text x="678.0" y="115.0" font-size="11.5" text-anchor="middle" opacity=".7">最終權威</text><text x="380" y="40" font-size="12.5" text-anchor="middle">請求從左往右找，找到就停（命中）；找不到才往下一層（未命中）</text><line x1="40" y1="160" x2="720" y2="160" stroke="currentColor" stroke-opacity=".35" stroke-width="1.5" marker-end="url(#cr-m1)"/><text x="40" y="182" font-size="12" text-anchor="start" opacity=".75">離使用者近、快、容量小</text><text x="720" y="182" font-size="12" text-anchor="end" opacity=".75">離使用者遠、慢、容量大、資料最新</text><text x="380" y="214" font-size="12" text-anchor="middle" opacity=".6">古銅＝這課的主角：應用程式自己管的快取；HTTP 那兩層由瀏覽器與 CDN 依標頭自動處理</text>
</svg>
