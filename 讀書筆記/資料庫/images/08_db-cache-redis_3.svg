<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 282" aria-label="兩種失效順序的時間軸。上面是先刪快取再更新資料庫：A 刪快取，B 未命中讀到舊的 31.5，A 把資料庫改成 31.7，B 把 31.5 回填，快取留著舊值直到 TTL 到期。下面是先更新資料庫再刪快取：A 改資料庫，B 命中讀到 31.5，A 刪快取，B 未命中回填 31.7，只有 A 兩步之間短暫讀到舊值" width="784" height="282">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="282" fill="#FFFFFF" stroke="none"/>
<defs><marker id="cr-m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><text x="40" y="20" font-size="13" text-anchor="start" fill="var(--gold-deep)">先刪快取、再更新資料庫（錯的順序）</text><line x1="40" y1="64" x2="720" y2="64" stroke="currentColor" stroke-opacity=".35" stroke-width="1.5" marker-end="url(#cr-m3)"/><text x="722" y="80" font-size="11.5" text-anchor="end" opacity=".6">時間</text><circle cx="90" cy="64" r="6" fill="var(--gold)"/><text x="90" y="48" font-size="12" text-anchor="middle">A：刪快取</text><circle cx="250" cy="64" r="6" fill="var(--slate)"/><text x="250" y="48" font-size="12" text-anchor="middle">B：未命中，讀到舊的 31.5</text><circle cx="410" cy="64" r="6" fill="var(--gold)"/><text x="410" y="48" font-size="12" text-anchor="middle">A：資料庫改成 31.7</text><circle cx="570" cy="64" r="6" fill="var(--slate)"/><text x="570" y="48" font-size="12" text-anchor="middle">B：把 31.5 回填</text><text x="40" y="102" font-size="12.5" text-anchor="start" fill="var(--gold-deep)">結果：快取留著舊值 31.5，直到 TTL 到期</text><text x="40" y="130" font-size="13" text-anchor="start" fill="var(--gold-deep)">先更新資料庫、再刪快取（對的順序）</text><line x1="40" y1="174" x2="720" y2="174" stroke="currentColor" stroke-opacity=".35" stroke-width="1.5" marker-end="url(#cr-m3)"/><text x="722" y="190" font-size="11.5" text-anchor="end" opacity=".6">時間</text><circle cx="90" cy="174" r="6" fill="var(--gold)"/><text x="90" y="158" font-size="12" text-anchor="middle">A：資料庫改成 31.7</text><circle cx="250" cy="174" r="6" fill="var(--slate)"/><text x="250" y="158" font-size="12" text-anchor="middle">B：命中，讀到 31.5</text><circle cx="410" cy="174" r="6" fill="var(--gold)"/><text x="410" y="158" font-size="12" text-anchor="middle">A：刪快取</text><circle cx="570" cy="174" r="6" fill="var(--slate)"/><text x="570" y="158" font-size="12" text-anchor="middle">B：未命中，回填 31.7</text><text x="40" y="212" font-size="12.5" text-anchor="start" fill="var(--slate-deep)">結果：只有 A 兩步之間的短暫空檔讀到舊值</text><text x="40" y="246" font-size="12" text-anchor="start" opacity=".6">古銅點＝更新匯率的請求 A；灰藍點＝讀匯率的請求 B</text>
</svg>
