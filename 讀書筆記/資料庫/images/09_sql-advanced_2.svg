<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 254" aria-label="NOT IN 遇到 NULL 的三值邏輯：105 NOT IN (102, 101, 104, 103, NULL) 展開成 105 不等於 102、不等於 101、不等於 104、不等於 103 都是 TRUE，但 105 不等於 NULL 是 UNKNOWN；全部用 AND 連起來，結果是 UNKNOWN，WHERE 不保留" width="784" height="254">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="254" fill="#FFFFFF" stroke="none"/>
<text x="40" y="30" font-size="13" class="mono" fill="currentColor">105 NOT IN (102, 101, 104, 103, NULL)  等於</text>
<g font-size="12.5" class="mono">
<rect x="40" y="48" width="110" height="34" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text class="mono" style="white-space:pre" x="95" y="70" text-anchor="middle" fill="var(--gold-deep)">105≠102</text>
<rect x="170" y="48" width="110" height="34" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text class="mono" style="white-space:pre" x="225" y="70" text-anchor="middle" fill="var(--gold-deep)">105≠101</text>
<rect x="300" y="48" width="110" height="34" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text class="mono" style="white-space:pre" x="355" y="70" text-anchor="middle" fill="var(--gold-deep)">105≠104</text>
<rect x="430" y="48" width="110" height="34" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text class="mono" style="white-space:pre" x="485" y="70" text-anchor="middle" fill="var(--gold-deep)">105≠103</text>
<rect x="560" y="48" width="140" height="34" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/><text class="mono" style="white-space:pre" x="630" y="70" text-anchor="middle" fill="var(--slate-deep)">105≠NULL</text>
</g>
<text x="160" y="96" font-size="11" text-anchor="middle" fill="currentColor" opacity=".7">AND</text><text x="290" y="96" font-size="11" text-anchor="middle" fill="currentColor" opacity=".7">AND</text><text x="420" y="96" font-size="11" text-anchor="middle" fill="currentColor" opacity=".7">AND</text><text x="550" y="96" font-size="11" text-anchor="middle" fill="currentColor" opacity=".7">AND</text>
<text x="95" y="106" font-size="12.5" text-anchor="middle" fill="var(--gold-deep)">TRUE</text><text x="225" y="106" font-size="12.5" text-anchor="middle" fill="var(--gold-deep)">TRUE</text><text x="355" y="106" font-size="12.5" text-anchor="middle" fill="var(--gold-deep)">TRUE</text><text x="485" y="106" font-size="12.5" text-anchor="middle" fill="var(--gold-deep)">TRUE</text><text x="630" y="106" font-size="12.5" text-anchor="middle" fill="var(--slate-deep)">UNKNOWN</text>
<rect x="250" y="134" width="260" height="34" rx="6" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="380" y="156" font-size="13" text-anchor="middle" fill="var(--slate-deep)">整體：UNKNOWN（顯示成 NULL）</text>
<text x="40" y="200" font-size="12.5" fill="currentColor">WHERE 只留 TRUE 的列 → 105 被濾掉；每個帳戶都會碰到那個 NULL，所以一列都不回</text>
</svg>
