<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 264" aria-label="連續登入的分組技巧：陳小美的登入日期 10/1、10/3、10/4、10/5、10/6，依序編號 1 到 5，日期減去編號天數得到 9/30、10/1、10/1、10/1、10/1，後四天得到同一個值，就是一段連續 4 天的登入" width="784" height="264">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="264" fill="#FFFFFF" stroke="none"/>
<text x="40" y="30" font-size="13" fill="currentColor">陳小美（102）</text>
<g font-size="12.5" class="mono" text-anchor="middle">
<text class="mono" style="white-space:pre" x="150" y="60" fill="currentColor" opacity=".7">登入日</text><text class="mono" style="white-space:pre" x="150" y="100" fill="currentColor" opacity=".7">編號</text><text class="mono" style="white-space:pre" x="150" y="140" fill="currentColor" opacity=".7">日期 − 編號</text>
<rect x="210" y="44" width="90" height="26" rx="5" fill="var(--surface)" stroke="currentColor"/><text class="mono" style="white-space:pre" x="255" y="62" fill="currentColor">10/01</text>
<rect x="320" y="44" width="90" height="26" rx="5" fill="var(--gold-soft)" stroke="var(--gold)"/><text class="mono" style="white-space:pre" x="365" y="62" fill="var(--gold-deep)">10/03</text>
<rect x="430" y="44" width="90" height="26" rx="5" fill="var(--gold-soft)" stroke="var(--gold)"/><text class="mono" style="white-space:pre" x="475" y="62" fill="var(--gold-deep)">10/04</text>
<rect x="540" y="44" width="90" height="26" rx="5" fill="var(--gold-soft)" stroke="var(--gold)"/><text class="mono" style="white-space:pre" x="585" y="62" fill="var(--gold-deep)">10/05</text>
<rect x="650" y="44" width="90" height="26" rx="5" fill="var(--gold-soft)" stroke="var(--gold)"/><text class="mono" style="white-space:pre" x="695" y="62" fill="var(--gold-deep)">10/06</text>
<text class="mono" style="white-space:pre" x="255" y="100" fill="currentColor">1</text><text class="mono" style="white-space:pre" x="365" y="100" fill="currentColor">2</text><text class="mono" style="white-space:pre" x="475" y="100" fill="currentColor">3</text><text class="mono" style="white-space:pre" x="585" y="100" fill="currentColor">4</text><text class="mono" style="white-space:pre" x="695" y="100" fill="currentColor">5</text>
<rect x="210" y="124" width="90" height="26" rx="5" fill="var(--surface)" stroke="currentColor"/><text class="mono" style="white-space:pre" x="255" y="142" fill="currentColor">09/30</text>
<rect x="320" y="124" width="90" height="26" rx="5" fill="var(--slate-soft)" stroke="var(--slate)"/><text class="mono" style="white-space:pre" x="365" y="142" fill="var(--slate-deep)">10/01</text>
<rect x="430" y="124" width="90" height="26" rx="5" fill="var(--slate-soft)" stroke="var(--slate)"/><text class="mono" style="white-space:pre" x="475" y="142" fill="var(--slate-deep)">10/01</text>
<rect x="540" y="124" width="90" height="26" rx="5" fill="var(--slate-soft)" stroke="var(--slate)"/><text class="mono" style="white-space:pre" x="585" y="142" fill="var(--slate-deep)">10/01</text>
<rect x="650" y="124" width="90" height="26" rx="5" fill="var(--slate-soft)" stroke="var(--slate)"/><text class="mono" style="white-space:pre" x="695" y="142" fill="var(--slate-deep)">10/01</text>
</g>
<path d="M320 166 L740 166" stroke="var(--slate)" stroke-width="1.5"/><text x="530" y="190" font-size="12.5" text-anchor="middle" fill="var(--slate-deep)">同一個值 → 同一段連續登入，COUNT = 4</text>
<text x="40" y="224" font-size="12" fill="currentColor" opacity=".6">日期每多一天、編號也多一，相減不變；中間斷一天，相減的結果就跳到下一個值</text>
</svg>
