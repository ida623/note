<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 234" aria-label="一個長度 5 的 int 陣列：五個格子連在一起，索引從 0 到 4；每格 4 個位元組，假設起點在位址 1000，第 3 格的位址就是 1000 加 3 乘 4 等於 1012，算一次就到" width="784" height="234">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="234" fill="#FFFFFF" stroke="none"/>
  <rect x="160" y="80" width="56" height="40" fill="var(--surface)" stroke="currentColor"/>
  <text x="188" y="105" font-size="14" text-anchor="middle" class="mono">1200</text>
  <text x="188" y="134" font-size="12" text-anchor="middle" class="mono" opacity=".6">0</text>
  <rect x="216" y="80" width="56" height="40" fill="var(--surface)" stroke="currentColor"/>
  <text x="244" y="105" font-size="14" text-anchor="middle" class="mono">0</text>
  <text x="244" y="134" font-size="12" text-anchor="middle" class="mono" opacity=".6">1</text>
  <rect x="272" y="80" width="56" height="40" fill="var(--surface)" stroke="currentColor"/>
  <text x="300" y="105" font-size="14" text-anchor="middle" class="mono">0</text>
  <text x="300" y="134" font-size="12" text-anchor="middle" class="mono" opacity=".6">2</text>
  <rect x="328" y="80" width="56" height="40" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
  <text x="356" y="105" font-size="14" text-anchor="middle" class="mono">560</text>
  <text x="356" y="134" font-size="12" text-anchor="middle" class="mono" opacity=".6">3</text>
  <rect x="384" y="80" width="56" height="40" fill="var(--surface)" stroke="currentColor"/>
  <text x="412" y="105" font-size="14" text-anchor="middle" class="mono">0</text>
  <text x="412" y="134" font-size="12" text-anchor="middle" class="mono" opacity=".6">4</text>
  <text x="188" y="70" font-size="11" text-anchor="middle" class="mono" fill="var(--slate-deep)">1000</text>
  <text x="244" y="70" font-size="11" text-anchor="middle" class="mono" fill="var(--slate-deep)">1004</text>
  <text x="300" y="70" font-size="11" text-anchor="middle" class="mono" fill="var(--slate-deep)">1008</text>
  <text x="356" y="70" font-size="11" text-anchor="middle" class="mono" fill="var(--slate-deep)">1012</text>
  <text x="412" y="70" font-size="11" text-anchor="middle" class="mono" fill="var(--slate-deep)">1016</text>
  <text x="20" y="70" font-size="12" fill="var(--slate-deep)">位址（示意）</text>
  <text x="20" y="105" font-size="13">balances</text>
  <text x="20" y="134" font-size="12" opacity=".6">索引</text>
  <text x="470" y="92" font-size="13">balances[3] 在哪裡？</text>
  <text x="470" y="114" font-size="13" class="mono" fill="var(--gold-deep)">1000 + 3 × 4 = 1012</text>
  <text x="470" y="136" font-size="13">乘一次、加一次就到：O(1)</text>
  <text x="160" y="166" font-size="12" opacity=".75">每格 4 個位元組（int 是 32 位元），格子一個緊接一個</text>
</svg>
