<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 254" aria-label="String 不可變：a 和 b 原本都指向「銀行」這個字串物件；執行 a = a + 帳戶 之後，產生一個新的「銀行帳戶」物件，a 改指向新物件，b 還指向原本的「銀行」，原本的物件內容沒有被改" width="784" height="254">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="254" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="ar-03-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <text x="40" y="30" font-size="13" fill="var(--slate-deep)">執行 a = a + "帳戶" 之前</text>
  <text x="70" y="85" font-size="14" class="mono" text-anchor="end">a</text>
  <text x="70" y="145" font-size="14" class="mono" text-anchor="end">b</text>
  <line x1="78" y1="80" x2="178" y2="102" stroke="currentColor" marker-end="url(#ar-03-arrow)"/>
  <line x1="78" y1="140" x2="178" y2="122" stroke="currentColor" marker-end="url(#ar-03-arrow)"/>
  <rect x="180" y="92" width="110" height="40" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="235.0" y="117" font-size="14" text-anchor="middle">"銀行"</text>
  <text x="420" y="30" font-size="13" fill="var(--slate-deep)">之後</text>
  <text x="450" y="85" font-size="14" class="mono" text-anchor="end">a</text>
  <text x="450" y="145" font-size="14" class="mono" text-anchor="end">b</text>
  <line x1="458" y1="80" x2="560" y2="72" stroke="currentColor" marker-end="url(#ar-03-arrow)"/>
  <line x1="458" y1="140" x2="560" y2="140" stroke="currentColor" marker-end="url(#ar-03-arrow)"/>
  <rect x="562" y="52" width="150" height="40" rx="8" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
  <text x="637.0" y="77" font-size="14" text-anchor="middle">"銀行帳戶"</text>
  <rect x="562" y="120" width="110" height="40" rx="8" fill="var(--surface)" stroke="currentColor"/>
  <text x="617.0" y="145" font-size="14" text-anchor="middle">"銀行"</text>
  <text x="420" y="200" font-size="12" opacity=".75">舊物件原封不動，只是 a 改指向新做出來的物件</text>
</svg>
