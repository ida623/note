  <rect x="200" y="100" width="56" height="40" fill="var(--surface)" stroke="currentColor"/>
  <text x="228" y="125" font-size="14" text-anchor="middle" class="mono">2</text>
  <rect x="256" y="100" width="56" height="40" fill="var(--surface)" stroke="currentColor"/>
  <text x="284" y="125" font-size="14" text-anchor="middle" class="mono">9</text>
  <rect x="312" y="100" width="56" height="40" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
  <text x="340" y="125" font-size="14" text-anchor="middle" class="mono">4</text>
  <rect x="368" y="100" width="56" height="40" fill="var(--surface)" stroke="currentColor"/>
  <text x="396" y="125" font-size="14" text-anchor="middle" class="mono">8</text>
