  <text x="284" y="165" font-size="14" text-anchor="middle" class="mono">0</text>
  <rect x="312" y="140" width="56" height="40" fill="var(--surface)" stroke="currentColor"/>
  <text x="340" y="165" font-size="14" text-anchor="middle" class="mono">6</text>
  <rect x="368" y="140" width="56" height="40" fill="var(--surface)" stroke="currentColor"/>
  <text x="396" y="165" font-size="14" text-anchor="middle" class="mono">3</text>
  <text x="464" y="125" font-size="13" class="mono" fill="var(--gold-deep)">grid[1][2] = 4</text>
  <text x="464" y="147" font-size="12">先寫列 r、再寫欄 c</text>
  <line x1="208" y1="94" x2="440" y2="94" stroke="var(--slate)" stroke-width="2" opacity=".55" marker-end="url(#ar-05-arrow)"/>
  <line x1="208" y1="134" x2="440" y2="134" stroke="var(--slate)" stroke-width="2" opacity=".55" marker-end="url(#ar-05-arrow)"/>
  <line x1="208" y1="174" x2="440" y2="174" stroke="var(--slate)" stroke-width="2" opacity=".55" marker-end="url(#ar-05-arrow)"/>
  <text x="200" y="210" font-size="12" opacity=".75">灰藍箭頭：一列一列走（外層 r、內層 c），每格剛好看一次，3 × 4 = 12 格</text>
