<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 324" aria-label="在 prev 後面插入新節點：操作前串列是 1、2、3，prev 指向 1，新節點 9 還沒接上；先讓 9 的 next 指向 2，再讓 1 的 next 指向 9；操作後是 1、9、2、3" width="784" height="324">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="324" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="ll-a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs>
  <text x="30" y="24" font-size="13" font-weight="700">操作前</text>
  <rect x="60" y="40" width="56" height="36" rx="7" fill="var(--surface)" stroke="currentColor"/><text x="88" y="63" font-size="14" text-anchor="middle" class="mono">1</text><text x="88" y="26" font-size="12" text-anchor="middle" fill="var(--gold-deep)" class="mono">prev</text><path d="M83 31 L93 31 L88 38z" fill="var(--gold-deep)"/><line x1="116" y1="58" x2="148" y2="58" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a2)"/><rect x="150" y="40" width="56" height="36" rx="7" fill="var(--surface)" stroke="currentColor"/><text x="178" y="63" font-size="14" text-anchor="middle" class="mono">2</text><line x1="206" y1="58" x2="238" y2="58" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a2)"/><rect x="240" y="40" width="56" height="36" rx="7" fill="var(--surface)" stroke="currentColor"/><text x="268" y="63" font-size="14" text-anchor="middle" class="mono">3</text><line x1="296" y1="58" x2="328" y2="58" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a2)"/><text x="330" y="63" font-size="13" opacity=".55" class="mono">null</text>
  <rect x="150" y="112" width="56" height="36" rx="7" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="178" y="135" font-size="14" text-anchor="middle" class="mono">9</text>
  <text x="214" y="136" font-size="12" fill="var(--gold-deep)">node（新節點）</text>
  <text x="30" y="196" font-size="13" fill="var(--gold-deep)">① node.next = prev.next　② prev.next = node</text>
  <text x="30" y="230" font-size="13" font-weight="700">操作後</text>
  <rect x="60" y="246" width="56" height="36" rx="7" fill="var(--surface)" stroke="currentColor"/><text x="88" y="269" font-size="14" text-anchor="middle" class="mono">1</text><text x="88" y="232" font-size="12" text-anchor="middle" fill="var(--gold-deep)" class="mono">prev</text><path d="M83 237 L93 237 L88 244z" fill="var(--gold-deep)"/><line x1="116" y1="264" x2="148" y2="264" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a2)"/><rect x="150" y="246" width="56" height="36" rx="7" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="178" y="269" font-size="14" text-anchor="middle" class="mono">9</text><line x1="206" y1="264" x2="238" y2="264" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a2)"/><rect x="240" y="246" width="56" height="36" rx="7" fill="var(--surface)" stroke="currentColor"/><text x="268" y="269" font-size="14" text-anchor="middle" class="mono">2</text><line x1="296" y1="264" x2="328" y2="264" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a2)"/><rect x="330" y="246" width="56" height="36" rx="7" fill="var(--surface)" stroke="currentColor"/><text x="358" y="269" font-size="14" text-anchor="middle" class="mono">3</text><line x1="386" y1="264" x2="418" y2="264" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a2)"/><text x="420" y="269" font-size="13" opacity=".55" class="mono">null</text>
</svg>
