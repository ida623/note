<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 284" aria-label="刪掉 prev 的下一個節點：串列 9、3、7、1，prev 指向 9，讓 9 的 next 直接跳過 3 指向 7；操作後是 9、7、1，3 沒有人指向，會被垃圾回收" width="784" height="284">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="284" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="ll-a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker><marker id="ll-a3s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--slate)"/></marker></defs>
  <text x="30" y="24" font-size="13" font-weight="700">操作前</text>
  <rect x="60" y="40" width="56" height="36" rx="7" fill="var(--surface)" stroke="currentColor"/><text x="88" y="63" font-size="14" text-anchor="middle" class="mono">9</text><text x="88" y="26" font-size="12" text-anchor="middle" fill="var(--gold-deep)" class="mono">prev</text><path d="M83 31 L93 31 L88 38z" fill="var(--gold-deep)"/><line x1="116" y1="58" x2="148" y2="58" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a3)"/><rect x="150" y="40" width="56" height="36" rx="7" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="178" y="63" font-size="14" text-anchor="middle" class="mono">3</text><line x1="206" y1="58" x2="238" y2="58" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a3)"/><rect x="240" y="40" width="56" height="36" rx="7" fill="var(--surface)" stroke="currentColor"/><text x="268" y="63" font-size="14" text-anchor="middle" class="mono">7</text><line x1="296" y1="58" x2="328" y2="58" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a3)"/><rect x="330" y="40" width="56" height="36" rx="7" fill="var(--surface)" stroke="currentColor"/><text x="358" y="63" font-size="14" text-anchor="middle" class="mono">1</text><line x1="386" y1="58" x2="418" y2="58" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a3)"/><text x="420" y="63" font-size="13" opacity=".55" class="mono">null</text>
  <path d="M88 76 C 88 120, 268 120, 268 80" fill="none" stroke="var(--slate)" stroke-width="1.8" marker-end="url(#ll-a3s)"/>
  <text x="178" y="136" font-size="12" fill="var(--slate-deep)" text-anchor="middle">prev.next = prev.next.next</text>
  <text x="30" y="186" font-size="13" font-weight="700">操作後</text>
  <rect x="60" y="202" width="56" height="36" rx="7" fill="var(--surface)" stroke="currentColor"/><text x="88" y="225" font-size="14" text-anchor="middle" class="mono">9</text><text x="88" y="188" font-size="12" text-anchor="middle" fill="var(--gold-deep)" class="mono">prev</text><path d="M83 193 L93 193 L88 200z" fill="var(--gold-deep)"/><line x1="116" y1="220" x2="148" y2="220" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a3)"/><rect x="150" y="202" width="56" height="36" rx="7" fill="var(--surface)" stroke="currentColor"/><text x="178" y="225" font-size="14" text-anchor="middle" class="mono">7</text><line x1="206" y1="220" x2="238" y2="220" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a3)"/><rect x="240" y="202" width="56" height="36" rx="7" fill="var(--surface)" stroke="currentColor"/><text x="268" y="225" font-size="14" text-anchor="middle" class="mono">1</text><line x1="296" y1="220" x2="328" y2="220" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a3)"/><text x="330" y="225" font-size="13" opacity=".55" class="mono">null</text>
  <text x="460" y="224" font-size="12" fill="var(--slate-deep)">3 沒有人指向它，之後會被回收</text>
</svg>
