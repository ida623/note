<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 334" aria-label="反轉串列：操作前是 1 指向 2 指向 3 指向 4；做到一半時 1 與 2 的箭頭已經改成往回指，prev 在 2、cur 在 3；操作後每個箭頭都往回指，4 是新的頭、1 指向 null" width="784" height="334">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="334" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="ll-a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs>
  <text x="30" y="24" font-size="13" font-weight="700">操作前</text>
  <rect x="60" y="40" width="56" height="36" rx="7" fill="var(--surface)" stroke="currentColor"/><text x="88" y="63" font-size="14" text-anchor="middle" class="mono">1</text><text x="88" y="26" font-size="12" text-anchor="middle" fill="var(--gold-deep)" class="mono">cur</text><path d="M83 31 L93 31 L88 38z" fill="var(--gold-deep)"/><line x1="116" y1="58" x2="148" y2="58" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a5)"/><rect x="150" y="40" width="56" height="36" rx="7" fill="var(--surface)" stroke="currentColor"/><text x="178" y="63" font-size="14" text-anchor="middle" class="mono">2</text><line x1="206" y1="58" x2="238" y2="58" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a5)"/><rect x="240" y="40" width="56" height="36" rx="7" fill="var(--surface)" stroke="currentColor"/><text x="268" y="63" font-size="14" text-anchor="middle" class="mono">3</text><line x1="296" y1="58" x2="328" y2="58" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a5)"/><rect x="330" y="40" width="56" height="36" rx="7" fill="var(--surface)" stroke="currentColor"/><text x="358" y="63" font-size="14" text-anchor="middle" class="mono">4</text><line x1="386" y1="58" x2="418" y2="58" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a5)"/><text x="420" y="63" font-size="13" opacity=".55" class="mono">null</text>
  <text x="30" y="120" font-size="13" font-weight="700">第二輪做完：1、2 已經掉頭，cur 走到 3</text>
  <text x="10" y="173" font-size="13" opacity=".55" class="mono">null</text>
  <rect x="90" y="150" width="56" height="36" rx="7" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="118" y="173" font-size="14" text-anchor="middle" class="mono">1</text>
  <rect x="180" y="150" width="56" height="36" rx="7" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="208" y="173" font-size="14" text-anchor="middle" class="mono">2</text>
  <text x="208" y="136" font-size="12" text-anchor="middle" fill="var(--gold-deep)" class="mono">prev</text><path d="M203 141 L213 141 L208 148z" fill="var(--gold-deep)"/>
  <rect x="270" y="150" width="56" height="36" rx="7" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="298" y="173" font-size="14" text-anchor="middle" class="mono">3</text>
  <text x="298" y="136" font-size="12" text-anchor="middle" fill="var(--gold-deep)" class="mono">cur</text><path d="M293 141 L303 141 L298 148z" fill="var(--gold-deep)"/>
  <rect x="360" y="150" width="56" height="36" rx="7" fill="var(--surface)" stroke="currentColor"/><text x="388" y="173" font-size="14" text-anchor="middle" class="mono">4</text>
  <line x1="90" y1="168" x2="48" y2="168" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a5)"/>
  <line x1="180" y1="168" x2="148" y2="168" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a5)"/>
  <line x1="326" y1="168" x2="358" y2="168" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a5)"/>
  <line x1="416" y1="168" x2="448" y2="168" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a5)"/>
  <text x="452" y="173" font-size="13" opacity=".55" class="mono">null</text>
  <text x="500" y="166" font-size="12" fill="var(--gold-deep)">下一步：先存 next＝4，</text>
  <text x="500" y="184" font-size="12" fill="var(--gold-deep)">再讓 3 指回 2</text>
  <text x="30" y="236" font-size="13" font-weight="700">操作後</text>
  <text x="10" y="275" font-size="13" opacity=".55" class="mono">null</text>
  <rect x="90" y="252" width="56" height="36" rx="7" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="118" y="275" font-size="14" text-anchor="middle" class="mono">1</text>
  <line x1="90" y1="270" x2="48" y2="270" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a5)"/>
  <rect x="180" y="252" width="56" height="36" rx="7" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="208" y="275" font-size="14" text-anchor="middle" class="mono">2</text>
  <line x1="180" y1="270" x2="148" y2="270" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a5)"/>
  <rect x="270" y="252" width="56" height="36" rx="7" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="298" y="275" font-size="14" text-anchor="middle" class="mono">3</text>
  <line x1="270" y1="270" x2="238" y2="270" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a5)"/>
  <rect x="360" y="252" width="56" height="36" rx="7" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="388" y="275" font-size="14" text-anchor="middle" class="mono">4</text>
  <line x1="360" y1="270" x2="328" y2="270" stroke="currentColor" stroke-width="1.5" marker-end="url(#ll-a5)"/>
  <text x="388" y="238" font-size="12" text-anchor="middle" fill="var(--gold-deep)" class="mono">prev（新的頭）</text><path d="M383 243 L393 243 L388 250z" fill="var(--gold-deep)"/>
</svg>
