<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 160" aria-label="佇列：A、B、C、D 由左到右排成一列，左邊是前端、右邊是尾端。offer 從尾端加入新元素 E，poll 從前端拿走最早來的 A" width="784" height="160">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="160" fill="#FFFFFF" stroke="none"/>
<g transform="translate(0,-40)"><defs><marker id="sq-m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><rect x="250" y="80" width="56" height="40" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="278.0" y="105.0" font-size="14" text-anchor="middle" class="mono">A</text><rect x="306" y="80" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="334.0" y="105.0" font-size="14" text-anchor="middle" class="mono">B</text><rect x="362" y="80" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="390.0" y="105.0" font-size="14" text-anchor="middle" class="mono">C</text><rect x="418" y="80" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="446.0" y="105.0" font-size="14" text-anchor="middle" class="mono">D</text><text x="278" y="66" font-size="12.5" text-anchor="middle" fill="var(--gold-deep)">前端（head）</text><text x="446" y="66" font-size="12.5" text-anchor="middle">尾端（tail）</text><line x1="640" y1="100" x2="482" y2="100" stroke="currentColor" stroke-opacity=".6" stroke-width="1.5" marker-end="url(#sq-m2)"/><text x="560" y="88" font-size="13" text-anchor="middle" class="mono">offer(E)</text><text x="560" y="124" font-size="12" text-anchor="middle" opacity=".7">新來的排到尾端</text><line x1="244" y1="100" x2="90" y2="100" stroke="currentColor" stroke-opacity=".6" stroke-width="1.5" marker-end="url(#sq-m2)"/><text x="168" y="88" font-size="13" text-anchor="middle" class="mono">poll() → A</text><text x="168" y="124" font-size="12" text-anchor="middle" opacity=".7">最早來的先離開</text><text x="40" y="160" font-size="12" opacity=".6">A、B、C、D 依序進來；古銅格是下一個要離開的</text></g>
</svg>
