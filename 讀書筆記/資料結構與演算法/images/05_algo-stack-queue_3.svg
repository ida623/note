<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 282" aria-label="ArrayDeque 的環狀陣列：容量 8 格，索引 0 到 7。A 在索引 6、B 在索引 7、C 繞回索引 0，其餘格子是 null。head 指在索引 6，tail 指在索引 1，虛線箭頭表示走到最後一格會繞回開頭" width="784" height="282">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="282" fill="#FFFFFF" stroke="none"/>
<defs><marker id="sq-m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><rect x="156" y="90" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="184.0" y="115.0" font-size="14" text-anchor="middle" class="mono">C</text><text x="184.0" y="146" font-size="12" text-anchor="middle" opacity=".6" class="mono">0</text><rect x="212" y="90" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="240.0" y="115" font-size="12" text-anchor="middle" class="mono" opacity=".5">null</text><text x="240.0" y="146" font-size="12" text-anchor="middle" opacity=".6" class="mono">1</text><rect x="268" y="90" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="296.0" y="115" font-size="12" text-anchor="middle" class="mono" opacity=".5">null</text><text x="296.0" y="146" font-size="12" text-anchor="middle" opacity=".6" class="mono">2</text><rect x="324" y="90" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="352.0" y="115" font-size="12" text-anchor="middle" class="mono" opacity=".5">null</text><text x="352.0" y="146" font-size="12" text-anchor="middle" opacity=".6" class="mono">3</text><rect x="380" y="90" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="408.0" y="115" font-size="12" text-anchor="middle" class="mono" opacity=".5">null</text><text x="408.0" y="146" font-size="12" text-anchor="middle" opacity=".6" class="mono">4</text><rect x="436" y="90" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="464.0" y="115" font-size="12" text-anchor="middle" class="mono" opacity=".5">null</text><text x="464.0" y="146" font-size="12" text-anchor="middle" opacity=".6" class="mono">5</text><rect x="492" y="90" width="56" height="40" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="520.0" y="115.0" font-size="14" text-anchor="middle" class="mono">A</text><text x="520.0" y="146" font-size="12" text-anchor="middle" opacity=".6" class="mono">6</text><rect x="548" y="90" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="576.0" y="115.0" font-size="14" text-anchor="middle" class="mono">B</text><text x="576.0" y="146" font-size="12" text-anchor="middle" opacity=".6" class="mono">7</text><text x="520.0" y="58" font-size="13" text-anchor="middle" class="mono" fill="var(--gold-deep)">head</text><path d="M514.0 66 L526.0 66 L520.0 78z" fill="var(--gold-deep)"/><text x="240.0" y="58" font-size="13" text-anchor="middle" class="mono" fill="var(--gold-deep)">tail</text><path d="M234.0 66 L246.0 66 L240.0 78z" fill="var(--gold-deep)"/><path d="M594 152 Q594 196 380 196 Q166 196 184.0 154" fill="none" stroke="var(--slate)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#sq-m3)"/><text x="380" y="218" font-size="12.5" text-anchor="middle" fill="var(--slate-deep)">走到最後一格就繞回索引 0</text><text x="40" y="244" font-size="12" opacity=".6">先進出過六個元素，head 走到索引 6；接著 offer A、B、C，C 繞回索引 0，下一個 offer 放進 tail 指的索引 1</text>
</svg>
