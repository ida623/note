<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 274" aria-label="括號配對的過程：字串是 ([]{})。讀到左括號就放進堆疊；讀到右括號就彈出頂端，看是不是同一種的左括號。六步之後堆疊清空，字串合法" width="784" height="274">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="274" fill="#FFFFFF" stroke="none"/>
<text x="78" y="30" font-size="12" text-anchor="middle" opacity=".7">讀到</text><text x="78" y="54" font-size="18" text-anchor="middle" class="mono" fill="var(--gold-deep)">(</text><path d="M44.0 76 L44.0 176 L112.0 176 L112.0 76" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5"/><rect x="50.0" y="130" width="56" height="40" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="78.0" y="155.0" font-size="14" text-anchor="middle" class="mono">(</text><text x="78" y="204" font-size="12.5" text-anchor="middle" fill="currentColor">push</text><text x="199" y="30" font-size="12" text-anchor="middle" opacity=".7">讀到</text><text x="199" y="54" font-size="18" text-anchor="middle" class="mono" fill="var(--gold-deep)">[</text><path d="M165.0 76 L165.0 176 L233.0 176 L233.0 76" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5"/><rect x="171.0" y="130" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="199.0" y="155.0" font-size="14" text-anchor="middle" class="mono">(</text><rect x="171.0" y="90" width="56" height="40" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="199.0" y="115.0" font-size="14" text-anchor="middle" class="mono">[</text><text x="199" y="204" font-size="12.5" text-anchor="middle" fill="currentColor">push</text><text x="320" y="30" font-size="12" text-anchor="middle" opacity=".7">讀到</text><text x="320" y="54" font-size="18" text-anchor="middle" class="mono" fill="var(--gold-deep)">]</text><path d="M286.0 76 L286.0 176 L354.0 176 L354.0 76" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5"/><rect x="292.0" y="130" width="56" height="40" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="320.0" y="155.0" font-size="14" text-anchor="middle" class="mono">(</text><text x="320" y="204" font-size="12.5" text-anchor="middle" fill="var(--slate-deep)">彈出 [，配對</text><text x="441" y="30" font-size="12" text-anchor="middle" opacity=".7">讀到</text><text x="441" y="54" font-size="18" text-anchor="middle" class="mono" fill="var(--gold-deep)">{</text><path d="M407.0 76 L407.0 176 L475.0 176 L475.0 76" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5"/><rect x="413.0" y="130" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="441.0" y="155.0" font-size="14" text-anchor="middle" class="mono">(</text><rect x="413.0" y="90" width="56" height="40" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="441.0" y="115.0" font-size="14" text-anchor="middle" class="mono">{</text><text x="441" y="204" font-size="12.5" text-anchor="middle" fill="currentColor">push</text><text x="562" y="30" font-size="12" text-anchor="middle" opacity=".7">讀到</text><text x="562" y="54" font-size="18" text-anchor="middle" class="mono" fill="var(--gold-deep)">}</text><path d="M528.0 76 L528.0 176 L596.0 176 L596.0 76" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5"/><rect x="534.0" y="130" width="56" height="40" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="562.0" y="155.0" font-size="14" text-anchor="middle" class="mono">(</text><text x="562" y="204" font-size="12.5" text-anchor="middle" fill="var(--slate-deep)">彈出 {，配對</text><text x="683" y="30" font-size="12" text-anchor="middle" opacity=".7">讀到</text><text x="683" y="54" font-size="18" text-anchor="middle" class="mono" fill="var(--gold-deep)">)</text><path d="M649.0 76 L649.0 176 L717.0 176 L717.0 76" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5"/><text x="683" y="204" font-size="12.5" text-anchor="middle" fill="var(--slate-deep)">彈出 (，配對</text><text x="40" y="236" font-size="12" opacity=".6">每一欄是讀完那個字元之後的堆疊；讀完時堆疊是空的，所以 ([]{}) 合法</text>
</svg>
