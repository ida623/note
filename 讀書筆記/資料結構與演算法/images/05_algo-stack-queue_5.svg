entColor" stroke-opacity=".45" stroke-width="1.5"/><rect x="122.0" y="228" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="150.0" y="253.0" font-size="14" text-anchor="middle" class="mono">24</text><text x="108.0" y="252.0" font-size="11.5" text-anchor="end" opacity=".6" class="mono">1</text><rect x="122.0" y="188" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="150.0" y="213.0" font-size="14" text-anchor="middle" class="mono">21</text><text x="108.0" y="212.0" font-size="11.5" text-anchor="end" opacity=".6" class="mono">2</text><rect x="122.0" y="148" width="56" height="40" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="150.0" y="173.0" font-size="14" text-anchor="middle" class="mono">20</text><text x="108.0" y="172.0" font-size="11.5" text-anchor="end" opacity=".6" class="mono">3</text><text x="150" y="300" font-size="12.5" text-anchor="middle">處理 25 之前</text><text x="40" y="324" font-size="11.5" opacity=".6">格子左邊的小字是索引</text><line x1="214" y1="200" x2="300" y2="200" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5" marker-end="url(#sq-m5)"/><text x="316" y="150" font-size="13" fill="var(--slate-deep)">20 &lt; 25：彈出索引 3，答案 4 − 3 = 1</text><text x="316" y="180" font-size="13" fill="var(--slate-deep)">21 &lt; 25：彈出索引 2，答案 4 − 2 = 2</text><text x="316" y="210" font-size="13" fill="var(--slate-deep)">24 &lt; 25：彈出索引 1，答案 4 − 1 = 3</text><text x="316" y="240" font-size="13" fill="var(--gold-deep)">堆疊空了：放入索引 4</text><line x1="590" y1="200" x2="640" y2="200" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5" marker-end="url(#sq-m5)"/><path d="M666.0 134 L666.0 274 L734.0 274 L734.0 134" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5"/><rect x="672.0" y="228" width="56" height="40" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="700.0" y="253.0" font-size="14" text-anchor="middle" class="mono">25</text><text x="658.0" y="252.0" font-size="11.5" text-anchor="end" opacity=".6" class="mono">4</text><text x="700" y="300" font-size="12.5" text-anchor="middle">處理之後</text>
