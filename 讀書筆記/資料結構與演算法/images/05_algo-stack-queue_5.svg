<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 362" aria-label="單調堆疊處理每日溫度：溫度陣列是 23、24、21、20、25、22，現在處理索引 4 的 25。處理前堆疊由底到頂是索引 1、2、3（24、21、20），一路變小。25 比它們都高，依序彈出索引 3、2、1，各自的答案是 1、2、3 天；最後放入索引 4" width="784" height="362">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
