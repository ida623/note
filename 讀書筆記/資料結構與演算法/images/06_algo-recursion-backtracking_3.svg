xt><rect x="127.0" y="104" width="86" height="32" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="170" y="125" font-size="13" text-anchor="middle" class="mono">[1]</text><circle cx="213.0" cy="104" r="9" fill="var(--slate)"/><text x="213.0" y="108" font-size="10.5" text-anchor="middle" fill="var(--surface)">2</text><rect x="387.0" y="104" width="86" height="32" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="430" y="125" font-size="13" text-anchor="middle" class="mono">[2]</text><circle cx="473.0" cy="104" r="9" fill="var(--slate)"/><text x="473.0" y="108" font-size="10.5" text-anchor="middle" fill="var(--surface)">6</text><rect x="577.0" y="104" width="86" height="32" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="620" y="125" font-size="13" text-anchor="middle" class="mono">[3]</text><circle cx="663.0" cy="104" r="9" fill="var(--slate)"/><text x="663.0" y="108" font-size="10.5" text-anchor="middle" fill="var(--surface)">8</text><rect x="47.0" y="184" width="86" height="32" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="90" y="205" font-size="13" text-anchor="middle" class="mono">[1, 2]</text><circle cx="133.0" cy="184" r="9" fill="var(--slate)"/><text x="133.0" y="188" font-size="10.5" text-anchor="middle" fill="var(--surface)">3</text><rect x="207.0" y="184" width="86" height="32" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="250" y="205" font-size="13" text-anchor="middle" class="mono">[1, 3]</text><circle cx="293.0" cy="184" r="9" fill="var(--slate)"/><text x="293.0" y="188" font-size="10.5" text-anchor="middle" fill="var(--surface)">5</text><rect x="387.0" y="184" width="86" height="32" rx="6" fill="var(--surface)" stroke="currentColor"/><text x="430" y="205" font-size="13" text-anchor="middle" class="mono">[2, 3]</text><circle cx="473.0" cy="184" r="9" fill="var(--slate)"/><text x="473.0" y="188" font-size="10.5" text-anchor="middle" fill="var(--surface)">7</text><rect x="47.0" y="264" width="86" height="32" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="90" y="285" font-size="13" text-anchor="middle" class="mono">[1, 2, 3]</text><circle cx="133.0" cy="264" r="9" fill="var(--slate)"/><text x="133.0" y="268" font-size="10.5" text-anchor="middle" fill="var(--surface)">4</text><text x="300" y="282" font-size="12" opacity=".7">走到 [1, 2, 3] 沒路了，撤銷 3、撤銷 2，回到 [1] 再試 +3</text><text x="40" y="326" font-size="12" opacity=".6">灰藍圓圈的數字是存進答案的順序；每條邊上的 +k 是「選擇」，往回走就是「撤銷選擇」</text>
</svg>
