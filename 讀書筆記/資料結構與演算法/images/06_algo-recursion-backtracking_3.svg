<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 364" aria-label="子集的回溯樹：根是空集合 []，往下分出 [1]、[2]、[3]；[1] 再分出 [1, 2]、[1, 3]；[2] 分出 [2, 3]；[1, 2] 分出 [1, 2, 3]。共 8 個節點，每個節點都是一個子集。存進答案的順序依序是 []、[1]、[1, 2]、[1, 2, 3]、[1, 3]、[2]、[2, 3]、[3]" width="784" height="364">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
