<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 282" aria-label="左邊：result.add(path) 讓 result 的每一格都指向同一個 path 物件，path 在回溯結束時被撤銷成空的，所以每一格看起來都是 []。右邊：result.add(new ArrayList&lt;&gt;(path)) 讓每一格各自指向當下的複本 []、[1]、[1, 2]、[1, 2, 3]" width="784" height="282">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="282" fill="#FFFFFF" stroke="none"/>
<defs><marker id="rc-m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs><text x="40" y="24" font-size="13" fill="var(--gold-deep)">result.add(path)：存的是同一個清單</text><text x="88" y="50" font-size="12" text-anchor="middle" opacity=".6" class="mono">0</text><rect x="60" y="56" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><circle cx="88" cy="76" r="4" fill="currentColor"/><line x1="88" y1="80" x2="169" y2="146" stroke="currentColor" stroke-opacity=".55" marker-end="url(#rc-m4)"/><text x="152" y="50" font-size="12" text-anchor="middle" opacity=".6" class="mono">1</text><rect x="124" y="56" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><circle cx="152" cy="76" r="4" fill="currentColor"/><line x1="152" y1="80" x2="183" y2="146" stroke="currentColor" stroke-opacity=".55" marker-end="url(#rc-m4)"/><text x="216" y="50" font-size="12" text-anchor="middle" opacity=".6" class="mono">2</text><rect x="188" y="56" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><circle cx="216" cy="76" r="4" fill="currentColor"/><line x1="216" y1="80" x2="197" y2="146" stroke="currentColor" stroke-opacity=".55" marker-end="url(#rc-m4)"/><text x="280" y="50" font-size="12" text-anchor="middle" opacity=".6" class="mono">3</text><rect x="252" y="56" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><circle cx="280" cy="76" r="4" fill="currentColor"/><line x1="280" y1="80" x2="211" y2="146" stroke="currentColor" stroke-opacity=".55" marker-end="url(#rc-m4)"/><text x="330" y="82" font-size="14" class="mono" opacity=".6">…</text><rect x="140" y="150" width="100" height="36" rx="6" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="190" y="173" font-size="13" text-anchor="middle" class="mono">path</text><text x="190" y="208" font-size="12" text-anchor="middle">回溯結束時已撤銷成 []</text><text x="420" y="24" font-size="13" fill="var(--slate-deep)">result.add(new ArrayList&lt;&gt;(path))：各存一份</text><text x="468" y="50" font-size="12" text-anchor="middle" opacity=".6" class="mono">0</text><rect x="440" y="56" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><circle cx="468" cy="76" r="4" fill="currentColor"/><line x1="468" y1="80" x2="468" y2="134" stroke="currentColor" stroke-opacity=".55" marker-end="url(#rc-m4)"/><text x="532" y="50" font-size="12" text-anchor="middle" opacity=".6" class="mono">1</text><rect x="504" y="56" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><circle cx="532" cy="76" r="4" fill="currentColor"/><line x1="532" y1="80" x2="532" y2="156" stroke="currentColor" stroke-opacity=".55" marker-end="url(#rc-m4)"/><text x="596" y="50" font-size="12" text-anchor="middle" opacity=".6" class="mono">2</text><rect x="568" y="56" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><circle cx="596" cy="76" r="4" fill="currentColor"/><line x1="596" y1="80" x2="596" y2="178" stroke="currentColor" stroke-opacity=".55" marker-end="url(#rc-m4)"/><text x="660" y="50" font-size="12" text-anchor="middle" opacity=".6" class="mono">3</text><rect x="632" y="56" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><circle cx="660" cy="76" r="4" fill="currentColor"/><line x1="660" y1="80" x2="660" y2="200" stroke="currentColor" stroke-opacity=".55" marker-end="url(#rc-m4)"/><rect x="434" y="136" width="68" height="18" rx="4" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="468" y="149" font-size="11" text-anchor="middle" class="mono">[]</text><rect x="498" y="158" width="68" height="18" rx="4" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="532" y="171" font-size="11" text-anchor="middle" class="mono">[1]</text><rect x="562" y="180" width="68" height="18" rx="4" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="596" y="193" font-size="11" text-anchor="middle" class="mono">[1, 2]</text><rect x="626" y="202" width="68" height="18" rx="4" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="660" y="215" font-size="11" text-anchor="middle" class="mono">[1, 2, 3]</text><text x="40" y="244" font-size="12" opacity=".6">方格是 result 的每一格，上面的數字是索引；黑點出發的箭頭指向那一格存的清單物件</text>
</svg>
