" class="mono">500</text><text x="716" y="161" font-size="14" text-anchor="end" class="mono">09:20</text><rect x="550" y="180" width="180" height="40" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="564" y="205" font-size="14" class="mono">T1</text><text x="642" y="205" font-size="14" text-anchor="middle" class="mono">500</text><text x="716" y="205" font-size="14" text-anchor="end" class="mono">09:00</text><text x="380" y="248" font-size="12.5" text-anchor="middle" fill="var(--slate-deep)">穩定：T1 仍在 T3 前面（09:00 早於 09:20）</text><text x="640" y="248" font-size="12.5" text-anchor="middle" fill="var(--gold-deep)">不穩定：T3 跑到 T1 前面</text><text x="30" y="274" font-size="12" opacity=".6">古銅格是金額同為 500 的兩筆；兩種排序的金額順序都對，差在同金額的兩筆誰先</text>
</svg>
