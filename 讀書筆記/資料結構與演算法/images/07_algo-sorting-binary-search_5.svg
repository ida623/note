le" class="mono">4</text><text x="570" y="106" font-size="12" text-anchor="middle" class="mono" opacity=".6">7</text><path d="M172 36 L184 36 L178 46z" fill="var(--gold-deep)"/><text x="178" y="30" font-size="13" text-anchor="middle" class="mono" fill="var(--gold-deep)">i, j</text><text x="614" y="75" font-size="12.5" fill="var(--gold-deep)">pivot = 4（最後一格）</text><text x="30" y="193" font-size="13">掃到一半</text><rect x="150" y="168" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="178" y="193" font-size="14" text-anchor="middle" class="mono">2</text><text x="178" y="224" font-size="12" text-anchor="middle" class="mono" opacity=".6">0</text><rect x="206" y="168" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="234" y="193" font-size="14" text-anchor="middle" class="mono">1</text><text x="234" y="224" font-size="12" text-anchor="middle" class="mono" opacity=".6">1</text><rect x="262" y="168" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="290" y="193" font-size="14" text-anchor="middle" class="mono">3</text><text x="290" y="224" font-size="12" text-anchor="middle" class="mono" opacity=".6">2</text><rect x="318" y="168" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="346" y="193" font-size="14" text-anchor="middle" class="mono">8</text><text x="346" y="224" font-size="12" text-anchor="middle" class="mono" opacity=".6">3</text><rect x="374" y="168" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="402" y="193" font-size="14" text-anchor="middle" class="mono">6</text><text x="402" y="224" font-size="12" text-anchor="middle" class="mono" opacity=".6">4</text><rect x="430" y="168" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="458" y="193" font-size="14" text-anchor="middle" class="mono">7</text><text x="458" y="224" font-size="12" text-anchor="middle" class="mono" opacity=".6">5</text><rect x="486" y="168" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="514" y="193" font-size="14" text-anchor="middle" class="mono">5</text><text x="514" y="224" font-size="12" text-anchor="middle" class="mono" opacity=".6">6</text><rect x="542" y="168" width="56" height="40" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="570" y="193" font-size="14" text-anchor="middle" class="mono">4</text><text x="570" y="224" font-size="12" text-anchor="middle" class="mono" opacity=".6">7</text><path d="M340 154 L352 154 L346 164z" fill="var(--gold-deep)"/><text x="346" y="148" font-size="13" text-anchor="middle" class="mono" fill="var(--gold-deep)">i</text><path d="M508 154 L520 154 L514 164z" fill="var(--gold-deep)"/><text x="514" y="148" font-size="13" text-anchor="middle" class="mono" fill="var(--gold-deep)">j</text><text x="614" y="186" font-size="12.5" fill="var(--slate-deep)">i 左邊都 &lt; 4</text><text x="614" y="204" font-size="12.5">i 到 j 之前都 ≥ 4</text><text x="30" y="311" font-size="13">結束</text><rect x="150" y="286" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="178" y="311" font-size="14" text-anchor="middle" class="mono">2</text><text x="178" y="342" font-size="12" text-anchor="middle" class="mono" opacity=".6">0</text><rect x="206" y="286" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="234" y="311" font-size="14" text-anchor="middle" class="mono">1</text><text x="234" y="342" font-size="12" text-anchor="middle" class="mono" opacity=".6">1</text><rect x="262" y="286" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="290" y="311" font-size="14" text-anchor="middle" class="mono">3</text><text x="290" y="342" font-size="12" text-anchor="middle" class="mono" opacity=".6">2</text><rect x="318" y="286" width="56" height="40" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="346" y="311" font-size="14" text-anchor="middle" class="mono">4</text><text x="346" y="342" font-size="12" text-anchor="middle" class="mono" opacity=".6">3</text><rect x="374" y="286" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="402" y="311" font-size="14" text-anchor="middle" class="mono">6</text><text x="402" y="342" font-size="12" text-anchor="middle" class="mono" opacity=".6">4</text><rect x="430" y="286" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="458" y="311" font-size="14" text-anchor="middle" class="mono">7</text><text x="458" y="342" font-size="12" text-anchor="middle" class="mono" opacity=".6">5</text><rect x="486" y="286" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="514" y="311" font-size="14" text-anchor="middle" class="mono">5</text><text x="514" y="342" font-size="12" text-anchor="middle" class="mono" opacity=".6">6</text><rect x="542" y="286" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="570" y="311" font-size="14" text-anchor="middle" class="mono">8</text><text x="570" y="342" font-size="12" text-anchor="middle" class="mono" opacity=".6">7</text><text x="614" y="304" font-size="12.5" fill="var(--gold-deep)">a[i] 和 pivot 交換</text><text x="614" y="322" font-size="12.5" fill="var(--gold-deep)">4 到了最終位置 3</text><text x="30" y="378" font-size="12" opacity=".6">灰藍＝比 pivot 小的一群；白格＝大於等於 pivot；之後左右兩群各自再分割</text>
