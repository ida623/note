<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 350" aria-label="固定長度的滑動視窗：每天交易總額 5、1、3、8、2、6、4，視窗長度 3。第一個視窗和是 9；往右滑一格，減掉離開的 5、加上進來的 8，得到 12；最大的視窗是索引 3 到 5，和為 16" width="784" height="350">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
