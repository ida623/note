ize="12.5">滑一格：9 − 5 + 8 = 12</text><rect x="110" y="222" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="138" y="247" font-size="14" text-anchor="middle" class="mono">5</text><text x="138" y="278" font-size="12" text-anchor="middle" class="mono" opacity=".6">0</text><rect x="166" y="222" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="194" y="247" font-size="14" text-anchor="middle" class="mono">1</text><text x="194" y="278" font-size="12" text-anchor="middle" class="mono" opacity=".6">1</text><rect x="222" y="222" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="250" y="247" font-size="14" text-anchor="middle" class="mono">3</text><text x="250" y="278" font-size="12" text-anchor="middle" class="mono" opacity=".6">2</text><rect x="278" y="222" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="306" y="247" font-size="14" text-anchor="middle" class="mono">8</text><text x="306" y="278" font-size="12" text-anchor="middle" class="mono" opacity=".6">3</text><rect x="334" y="222" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="362" y="247" font-size="14" text-anchor="middle" class="mono">2</text><text x="362" y="278" font-size="12" text-anchor="middle" class="mono" opacity=".6">4</text><rect x="390" y="222" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="418" y="247" font-size="14" text-anchor="middle" class="mono">6</text><text x="418" y="278" font-size="12" text-anchor="middle" class="mono" opacity=".6">5</text><rect x="446" y="222" width="56" height="40" fill="var(--surface)" stroke="currentColor"/><text x="474" y="247" font-size="14" text-anchor="middle" class="mono">4</text><text x="474" y="278" font-size="12" text-anchor="middle" class="mono" opacity=".6">6</text><rect x="274" y="218" width="176" height="48" rx="6" fill="none" stroke="var(--gold)" stroke-width="2.5"/><text x="526" y="247" font-size="12.5" fill="var(--gold-deep)">最大的視窗：8 + 2 + 6 = 16</text><text x="20" y="312" font-size="12" opacity=".6">每天的交易總額，k = 3。框起來的是視窗；滑一格時只做兩件事：減掉離開的那天（虛線）、加上進來的那天（古銅）</text>
</svg>
