  <text x="230" y="255" font-size="14" text-anchor="middle" class="mono">6</text>
  <circle cx="270" cy="292" r="16" fill="var(--surface)" stroke="currentColor"/>
  <text x="270" y="297" font-size="14" text-anchor="middle" class="mono">7</text>
  <line x1="490" y1="140" x2="450" y2="220" stroke="currentColor" stroke-opacity=".45"/>
  <line x1="570" y1="60" x2="490" y2="140" stroke="currentColor" stroke-opacity=".45"/>
  <line x1="490" y1="140" x2="530" y2="220" stroke="currentColor" stroke-opacity=".45"/>
  <line x1="650" y1="140" x2="610" y2="220" stroke="currentColor" stroke-opacity=".45"/>
  <line x1="570" y1="60" x2="650" y2="140" stroke="currentColor" stroke-opacity=".45"/>
  <line x1="650" y1="140" x2="690" y2="220" stroke="currentColor" stroke-opacity=".45"/>
  <circle cx="450" cy="220" r="18" fill="var(--surface)" stroke="currentColor"/>
  <text x="450" y="225" font-size="14" text-anchor="middle" class="mono">1</text>
  <circle cx="490" cy="140" r="18" fill="var(--surface)" stroke="currentColor"/>
  <text x="490" y="145" font-size="14" text-anchor="middle" class="mono">2</text>
  <circle cx="530" cy="220" r="18" fill="var(--surface)" stroke="currentColor"/>
  <text x="530" y="225" font-size="14" text-anchor="middle" class="mono">3</text>
  <circle cx="570" cy="60" r="18" fill="var(--surface)" stroke="currentColor"/>
  <text x="570" y="65" font-size="14" text-anchor="middle" class="mono">4</text>
  <circle cx="610" cy="220" r="18" fill="var(--surface)" stroke="currentColor"/>
  <text x="610" y="225" font-size="14" text-anchor="middle" class="mono">5</text>
  <circle cx="650" cy="140" r="18" fill="var(--surface)" stroke="currentColor"/>
  <text x="650" y="145" font-size="14" text-anchor="middle" class="mono">6</text>
  <circle cx="690" cy="220" r="18" fill="var(--surface)" stroke="currentColor"/>
  <text x="690" y="225" font-size="14" text-anchor="middle" class="mono">7</text>
  <text x="30" y="330" font-size="13" fill="var(--gold-deep)">依序插入 1〜7：高度 6，像鏈結串列</text>
  <text x="430" y="330" font-size="13" fill="var(--slate-deep)">照 4、2、6、1、3、5、7 插入：高度 2</text>
</svg>
