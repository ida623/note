  <circle cx="70" cy="82" r="16" fill="var(--surface)" stroke="currentColor"/>
  <text x="70" y="87" font-size="14" text-anchor="middle" class="mono">2</text>
  <circle cx="110" cy="124" r="16" fill="var(--surface)" stroke="currentColor"/>
  <text x="110" y="129" font-size="14" text-anchor="middle" class="mono">3</text>
  <circle cx="150" cy="166" r="16" fill="var(--surface)" stroke="currentColor"/>
  <text x="150" y="171" font-size="14" text-anchor="middle" class="mono">4</text>
  <circle cx="190" cy="208" r="16" fill="var(--surface)" stroke="currentColor"/>
  <text x="190" y="213" font-size="14" text-anchor="middle" class="mono">5</text>
