  <circle cx="420" cy="200" r="18" fill="var(--surface)" stroke="currentColor"/>
  <text x="420" y="205" font-size="14" text-anchor="middle" class="mono">20</text>
  <circle cx="466" cy="130" r="18" fill="var(--surface)" stroke="currentColor"/>
  <text x="466" y="135" font-size="14" text-anchor="middle" class="mono">30</text>
  <circle cx="512" cy="200" r="18" fill="var(--surface)" stroke="currentColor"/>
  <text x="512" y="205" font-size="14" text-anchor="middle" class="mono">40</text>
  <circle cx="558" cy="60" r="18" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="558" y="65" font-size="14" text-anchor="middle" class="mono">60</text>
  <circle cx="604" cy="200" r="18" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="604" y="205" font-size="14" text-anchor="middle" class="mono">65</text>
  <circle cx="650" cy="130" r="18" fill="var(--surface)" stroke="currentColor"/>
  <text x="650" y="135" font-size="14" text-anchor="middle" class="mono">70</text>
  <circle cx="696" cy="200" r="18" fill="var(--surface)" stroke="currentColor"/>
  <text x="696" y="205" font-size="14" text-anchor="middle" class="mono">80</text>
  <text x="30" y="24" font-size="13" fill="var(--gold-deep)">刪 50：右子樹一路往左，找到最小的 60</text>
  <text x="420" y="24" font-size="13" fill="var(--slate-deep)">60 搬到根；原本的 60 被刪掉，65 頂上</text>
  <text x="380" y="190" font-size="22" text-anchor="middle">→</text>
  <text x="380" y="322" font-size="12.5" text-anchor="middle" opacity=".75">刪完中序仍是 20 30 40 60 65 70 80：順序沒被破壞</text>
</svg>
