<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 359" aria-label="刪除有兩個孩子的根 50：先在右子樹找最小的 60（後繼者），把 60 搬到根的位置，再把原本的 60 刪掉，60 只有右孩子 65，所以 65 頂上來" width="784" height="359">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="359" fill="#FFFFFF" stroke="none"/>
  <line x1="76" y1="130" x2="30" y2="200" stroke="currentColor" stroke-opacity=".45"/>
  <line x1="168" y1="60" x2="76" y2="130" stroke="currentColor" stroke-opacity=".45"/>
  <line x1="76" y1="130" x2="122" y2="200" stroke="currentColor" stroke-opacity=".45"/>
  <line x1="306" y1="130" x2="214" y2="200" stroke="var(--gold)" stroke-width="3"/>
  <line x1="214" y1="200" x2="260" y2="270" stroke="currentColor" stroke-opacity=".45"/>
  <line x1="168" y1="60" x2="306" y2="130" stroke="var(--gold)" stroke-width="3"/>
  <line x1="306" y1="130" x2="352" y2="200" stroke="currentColor" stroke-opacity=".45"/>
  <circle cx="30" cy="200" r="18" fill="var(--surface)" stroke="currentColor"/>
  <text x="30" y="205" font-size="14" text-anchor="middle" class="mono">20</text>
  <circle cx="76" cy="130" r="18" fill="var(--surface)" stroke="currentColor"/>
  <text x="76" y="135" font-size="14" text-anchor="middle" class="mono">30</text>
  <circle cx="122" cy="200" r="18" fill="var(--surface)" stroke="currentColor"/>
  <text x="122" y="205" font-size="14" text-anchor="middle" class="mono">40</text>
  <circle cx="168" cy="60" r="18" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
  <text x="168" y="65" font-size="14" text-anchor="middle" class="mono">50</text>
  <circle cx="214" cy="200" r="18" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="214" y="205" font-size="14" text-anchor="middle" class="mono">60</text>
  <circle cx="260" cy="270" r="18" fill="var(--surface)" stroke="currentColor"/>
  <text x="260" y="275" font-size="14" text-anchor="middle" class="mono">65</text>
  <circle cx="306" cy="130" r="18" fill="var(--surface)" stroke="currentColor"/>
  <text x="306" y="135" font-size="14" text-anchor="middle" class="mono">70</text>
  <circle cx="352" cy="200" r="18" fill="var(--surface)" stroke="currentColor"/>
  <text x="352" y="205" font-size="14" text-anchor="middle" class="mono">80</text>
  <line x1="466" y1="130" x2="420" y2="200" stroke="currentColor" stroke-opacity=".45"/>
  <line x1="558" y1="60" x2="466" y2="130" stroke="currentColor" stroke-opacity=".45"/>
  <line x1="466" y1="130" x2="512" y2="200" stroke="currentColor" stroke-opacity=".45"/>
  <line x1="650" y1="130" x2="604" y2="200" stroke="currentColor" stroke-opacity=".45"/>
