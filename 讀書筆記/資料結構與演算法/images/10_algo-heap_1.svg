<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 384" aria-label="最小堆 1、3、2、5、9、8 的兩種樣子：上面是完全二元樹，下面是陣列；第 i 格的左孩子在 2i+1、右孩子在 2i+2、父節點在 (i−1)/2，例如第 1 格的 3，孩子是第 3 格的 5 和第 4 格的 9" width="784" height="384">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="384" fill="#FFFFFF" stroke="none"/>
  <line x1="270" y1="40" x2="165" y2="115" stroke="currentColor" stroke-opacity=".45"/>
  <line x1="270" y1="40" x2="375" y2="115" stroke="currentColor" stroke-opacity=".45"/>
  <line x1="165" y1="115" x2="112" y2="190" stroke="currentColor" stroke-opacity=".45"/>
  <line x1="165" y1="115" x2="218" y2="190" stroke="currentColor" stroke-opacity=".45"/>
  <line x1="375" y1="115" x2="322" y2="190" stroke="currentColor" stroke-opacity=".45"/>
  <circle cx="270" cy="40" r="19" fill="var(--surface)" stroke="currentColor"/>
  <text x="270" y="45" font-size="14" text-anchor="middle" class="mono">1</text>
  <text x="270" y="72" font-size="11" text-anchor="middle" class="mono" opacity=".6">[0]</text>
  <circle cx="165" cy="115" r="19" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
  <text x="165" y="120" font-size="14" text-anchor="middle" class="mono">3</text>
  <text x="165" y="147" font-size="11" text-anchor="middle" class="mono" opacity=".6">[1]</text>
  <circle cx="375" cy="115" r="19" fill="var(--surface)" stroke="currentColor"/>
  <text x="375" y="120" font-size="14" text-anchor="middle" class="mono">2</text>
  <text x="375" y="147" font-size="11" text-anchor="middle" class="mono" opacity=".6">[2]</text>
  <circle cx="112" cy="190" r="19" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="112" y="195" font-size="14" text-anchor="middle" class="mono">5</text>
  <text x="112" y="222" font-size="11" text-anchor="middle" class="mono" opacity=".6">[3]</text>
  <circle cx="218" cy="190" r="19" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="218" y="195" font-size="14" text-anchor="middle" class="mono">9</text>
  <text x="218" y="222" font-size="11" text-anchor="middle" class="mono" opacity=".6">[4]</text>
  <circle cx="322" cy="190" r="19" fill="var(--surface)" stroke="currentColor"/>
  <text x="322" y="195" font-size="14" text-anchor="middle" class="mono">8</text>
  <text x="322" y="222" font-size="11" text-anchor="middle" class="mono" opacity=".6">[5]</text>
  <rect x="102" y="265" width="56" height="40" fill="var(--surface)" stroke="currentColor"/>
  <text x="130" y="290" font-size="14" text-anchor="middle" class="mono">1</text>
  <text x="130" y="319" font-size="12" text-anchor="middle" class="mono" opacity=".6">0</text>
  <rect x="158" y="265" width="56" height="40" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/>
  <text x="186" y="290" font-size="14" text-anchor="middle" class="mono">3</text>
  <text x="186" y="319" font-size="12" text-anchor="middle" class="mono" opacity=".6">1</text>
  <rect x="214" y="265" width="56" height="40" fill="var(--surface)" stroke="currentColor"/>
  <text x="242" y="290" font-size="14" text-anchor="middle" class="mono">2</text>
  <text x="242" y="319" font-size="12" text-anchor="middle" class="mono" opacity=".6">2</text>
  <rect x="270" y="265" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="298" y="290" font-size="14" text-anchor="middle" class="mono">5</text>
  <text x="298" y="319" font-size="12" text-anchor="middle" class="mono" opacity=".6">3</text>
  <rect x="326" y="265" width="56" height="40" fill="var(--slate-soft)" stroke="var(--slate)"/>
  <text x="354" y="290" font-size="14" text-anchor="middle" class="mono">9</text>
  <text x="354" y="319" font-size="12" text-anchor="middle" class="mono" opacity=".6">4</text>
  <rect x="382" y="265" width="56" height="40" fill="var(--surface)" stroke="currentColor"/>
  <text x="410" y="290" font-size="14" text-anchor="middle" class="mono">8</text>
  <text x="410" y="319" font-size="12" text-anchor="middle" class="mono" opacity=".6">5</text>
  <text x="20" y="290" font-size="13">陣列</text>
  <text x="520" y="60" font-size="13" fill="var(--gold-deep)">第 i 格的</text>
  <text x="520" y="86" font-size="13" class="mono">左孩子 = 2i + 1</text>
  <text x="520" y="110" font-size="13" class="mono">右孩子 = 2i + 2</text>
  <text x="520" y="134" font-size="13" class="mono">父節點 = (i − 1) / 2</text>
  <text x="520" y="170" font-size="12.5" fill="var(--slate-deep)">例：i = 1（值 3）</text>
  <text x="520" y="192" font-size="12.5" fill="var(--slate-deep)">孩子在 3、4 格（5、9）</text>
  <text x="520" y="214" font-size="12.5" fill="var(--slate-deep)">父節點在 0 格（1）</text>
</svg>
