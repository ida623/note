<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 324" aria-label="有權重的最短路徑：0 到 1 權重 4、0 到 2 權重 1、2 到 1 權重 2、1 到 3 權重 1、2 到 3 權重 5。從 0 出發的最短距離是 0 到 0 為 0、到 2 為 1、到 1 為 3、到 3 為 4，最短路徑 0、2、1、3 用古銅色標出" width="784" height="324">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="324" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="gr-a7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker><marker id="gr-a7g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--gold)"/></marker></defs>
  <line x1="129.0" y1="133.9" x2="339.0" y2="66.7" stroke="currentColor" stroke-width="1.5" marker-end="url(#gr-a7)"/>
  <text x="235.0" y="88.0" font-size="13" text-anchor="middle" font-weight="700" class="mono">4</text>
  <line x1="129.0" y1="146.1" x2="339.0" y2="213.3" stroke="var(--gold)" stroke-width="2.2" marker-end="url(#gr-a7g)"/>
  <text x="229.0" y="194.0" font-size="13" text-anchor="middle" fill="var(--gold-deep)" font-weight="700" class="mono">1</text>
  <line x1="360.0" y1="200.0" x2="360.0" y2="82.0" stroke="var(--gold)" stroke-width="2.2" marker-end="url(#gr-a7g)"/>
  <text x="374.0" y="140.0" font-size="13" text-anchor="middle" fill="var(--gold-deep)" font-weight="700" class="mono">2</text>
  <line x1="379.0" y1="66.1" x2="589.0" y2="133.3" stroke="var(--gold)" stroke-width="2.2" marker-end="url(#gr-a7g)"/>
  <text x="489.0" y="88.0" font-size="13" text-anchor="middle" fill="var(--gold-deep)" font-weight="700" class="mono">1</text>
  <line x1="379.0" y1="213.9" x2="589.0" y2="146.7" stroke="currentColor" stroke-width="1.5" marker-end="url(#gr-a7)"/>
  <text x="491.0" y="196.0" font-size="13" text-anchor="middle" font-weight="700" class="mono">5</text>
  <circle cx="110" cy="140" r="20" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="110" y="145" font-size="14" text-anchor="middle" class="mono">0</text>
  <circle cx="360" cy="60" r="20" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="360" y="65" font-size="14" text-anchor="middle" class="mono">1</text>
  <circle cx="360" cy="220" r="20" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="360" y="225" font-size="14" text-anchor="middle" class="mono">2</text>
  <circle cx="610" cy="140" r="20" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="610" y="145" font-size="14" text-anchor="middle" class="mono">3</text>
  <text x="110" y="180" font-size="12" text-anchor="middle" fill="var(--slate-deep)">距離 0</text>
  <text x="360" y="30" font-size="12" text-anchor="middle" fill="var(--slate-deep)">距離 3</text>
  <text x="360" y="260" font-size="12" text-anchor="middle" fill="var(--slate-deep)">距離 1</text>
  <text x="610" y="180" font-size="12" text-anchor="middle" fill="var(--slate-deep)">距離 4</text>
  <text x="380" y="288" font-size="12" text-anchor="middle">直接 0 → 1 要 4，繞 0 → 2 → 1 只要 3：邊數少不代表比較近</text>
</svg>
