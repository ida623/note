<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 276" aria-label="最小硬幣數的表：硬幣面額 1、3、4，dp[0] 到 dp[6] 依序是 0、1、2、1、1、2、2。dp[6] 從三個地方來：最後一枚 1 元看 dp[5] 加 1 等於 3，最後一枚 3 元看 dp[3] 加 1 等於 2，最後一枚 4 元看 dp[2] 加 1 等於 3，取最小 2" width="784" height="276">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="276" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="dp-a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker><marker id="dp-a2g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--gold)"/></marker></defs>
  <text x="140" y="82" font-size="13" text-anchor="end" class="mono">dp[x]</text>
  <text x="140" y="48" font-size="12" text-anchor="end">x（元）</text>
  <rect x="150" y="60" width="64" height="34" fill="var(--surface)" stroke="currentColor"/><text x="182.0" y="82.0" font-size="14" text-anchor="middle" class="mono">0</text>
  <text opacity=".6" x="182.0" y="48" font-size="12" text-anchor="middle" class="mono">0</text>
  <rect x="214" y="60" width="64" height="34" fill="var(--surface)" stroke="currentColor"/><text x="246.0" y="82.0" font-size="14" text-anchor="middle" class="mono">1</text>
  <text opacity=".6" x="246.0" y="48" font-size="12" text-anchor="middle" class="mono">1</text>
  <rect x="278" y="60" width="64" height="34" fill="var(--surface)" stroke="currentColor"/><text x="310.0" y="82.0" font-size="14" text-anchor="middle" class="mono">2</text>
  <text opacity=".6" x="310.0" y="48" font-size="12" text-anchor="middle" class="mono">2</text>
  <rect x="342" y="60" width="64" height="34" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="374.0" y="82.0" font-size="14" text-anchor="middle" class="mono">1</text>
  <text opacity=".6" x="374.0" y="48" font-size="12" text-anchor="middle" class="mono">3</text>
  <rect x="406" y="60" width="64" height="34" fill="var(--surface)" stroke="currentColor"/><text x="438.0" y="82.0" font-size="14" text-anchor="middle" class="mono">1</text>
  <text opacity=".6" x="438.0" y="48" font-size="12" text-anchor="middle" class="mono">4</text>
  <rect x="470" y="60" width="64" height="34" fill="var(--surface)" stroke="currentColor"/><text x="502.0" y="82.0" font-size="14" text-anchor="middle" class="mono">2</text>
  <text opacity=".6" x="502.0" y="48" font-size="12" text-anchor="middle" class="mono">5</text>
  <rect x="534" y="60" width="64" height="34" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="566.0" y="82.0" font-size="14" text-anchor="middle" class="mono">2</text>
  <text opacity=".6" x="566.0" y="48" font-size="12" text-anchor="middle" class="mono">6</text>
  <path d="M556.0 96 Q 531.0 123.0 506.0 98" fill="none" stroke="currentColor" stroke-width="1.3" marker-end="url(#dp-a2)"/>
  <text x="40" y="156" font-size="12" text-anchor="start">最後一枚 1 元：dp[5] + 1 = 3</text>
  <path d="M564.0 96 Q 471.0 149.0 378.0 98" fill="none" stroke="var(--gold)" stroke-width="2" marker-end="url(#dp-a2g)"/>
  <text x="40" y="178" font-size="12" text-anchor="start" fill="var(--gold-deep)">最後一枚 3 元：dp[3] + 1 = 2</text>
  <path d="M572.0 96 Q 443.0 175.0 314.0 98" fill="none" stroke="currentColor" stroke-width="1.3" marker-end="url(#dp-a2)"/>
  <text x="40" y="200" font-size="12" text-anchor="start">最後一枚 4 元：dp[2] + 1 = 3</text>
  <text x="380" y="236" font-size="12" text-anchor="middle" fill="var(--slate-deep)">dp[6] = min(3, 2, 3) = 2：最後一枚用 3 元最好，答案是 3 + 3</text>
</svg>
