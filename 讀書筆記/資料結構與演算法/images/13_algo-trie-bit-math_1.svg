<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 354" aria-label="放進 car、card、care、cat、dog 五個字的 Trie：根節點往下有 c 與 d 兩條路；c 往下是 a，a 往下分成 r 與 t；r 往下分成 d 與 e。car、card、care、cat、dog 結束的節點用古銅色標出，ca 結束的節點沒有標記，所以 search(ca) 是 false。共 10 個節點" width="784" height="354">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="354" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="tb-a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs>
  <line x1="300" y1="56" x2="214" y2="102" stroke="currentColor" stroke-width="1.5" marker-end="url(#tb-a1)"/>
  <line x1="340" y1="56" x2="456" y2="102" stroke="currentColor" stroke-width="1.5" marker-end="url(#tb-a1)"/>
  <line x1="200" y1="140" x2="200" y2="172" stroke="currentColor" stroke-width="1.5" marker-end="url(#tb-a1)"/>
  <line x1="190" y1="212" x2="134" y2="246" stroke="currentColor" stroke-width="1.5" marker-end="url(#tb-a1)"/>
  <line x1="212" y1="212" x2="268" y2="246" stroke="currentColor" stroke-width="1.5" marker-end="url(#tb-a1)"/>
  <line x1="112" y1="284" x2="68" y2="302" stroke="currentColor" stroke-width="1.5" marker-end="url(#tb-a1)"/>
  <line x1="132" y1="284" x2="168" y2="302" stroke="currentColor" stroke-width="1.5" marker-end="url(#tb-a1)"/>
  <line x1="470" y1="140" x2="470" y2="172" stroke="currentColor" stroke-width="1.5" marker-end="url(#tb-a1)"/>
  <line x1="470" y1="212" x2="470" y2="244" stroke="currentColor" stroke-width="1.5" marker-end="url(#tb-a1)"/>
  <circle cx="320" cy="40" r="20" fill="var(--surface)" stroke="currentColor"/><text x="320" y="45" font-size="12" text-anchor="middle">根</text>
  <circle cx="200" cy="120" r="20" fill="var(--surface)" stroke="currentColor"/><text x="200" y="125" font-size="14" text-anchor="middle" class="mono">c</text>
  <circle cx="200" cy="192" r="20" fill="var(--surface)" stroke="currentColor"/><text x="200" y="197" font-size="14" text-anchor="middle" class="mono">a</text>
  <circle cx="122" cy="264" r="20" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="122" y="269" font-size="14" text-anchor="middle" class="mono">r</text>
  <circle cx="282" cy="264" r="20" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="282" y="269" font-size="14" text-anchor="middle" class="mono">t</text>
  <circle cx="56" cy="312" r="16" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="56" y="317" font-size="13" text-anchor="middle" class="mono">d</text>
  <circle cx="180" cy="312" r="16" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="180" y="317" font-size="13" text-anchor="middle" class="mono">e</text>
  <circle cx="470" cy="120" r="20" fill="var(--surface)" stroke="currentColor"/><text x="470" y="125" font-size="14" text-anchor="middle" class="mono">d</text>
  <circle cx="470" cy="192" r="20" fill="var(--surface)" stroke="currentColor"/><text x="470" y="197" font-size="14" text-anchor="middle" class="mono">o</text>
  <circle cx="470" cy="264" r="20" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="470" y="269" font-size="14" text-anchor="middle" class="mono">g</text>
  <text x="80" y="258" font-size="11" text-anchor="end" fill="var(--gold-deep)">car</text>
  <text x="312" y="268" font-size="11" text-anchor="start" fill="var(--gold-deep)">cat</text>
  <text x="30" y="300" font-size="11" text-anchor="end" fill="var(--gold-deep)">card</text>
  <text x="204" y="316" font-size="11" text-anchor="start" fill="var(--gold-deep)">care</text>
  <text x="500" y="268" font-size="11" text-anchor="start" fill="var(--gold-deep)">dog</text>
  <text x="232" y="196" font-size="11" text-anchor="start" fill="var(--slate-deep)">ca：路存在，但沒有字在這裡結束</text>
  <text x="560" y="60" font-size="12" text-anchor="start">古銅＝有一個字在這裡結束</text>
  <text x="560" y="82" font-size="12" text-anchor="start">白色＝只是路過的前綴</text>
  <text x="560" y="104" font-size="12" text-anchor="start">共 10 個節點（含根）</text>
</svg>
