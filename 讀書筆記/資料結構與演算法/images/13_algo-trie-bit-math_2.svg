<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 254" aria-label="n 等於 10110100、n 減 1 等於 10110011、兩者 AND 等於 10110000。n 最右邊的 1 在第 2 位，用古銅色標出；減 1 之後那一位變 0、右邊兩位變 1；AND 之後左邊五位不變、右邊三位全是 0" width="784" height="254">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="254" fill="#FFFFFF" stroke="none"/>
  <text x="150" y="58" font-size="13" text-anchor="end" class="mono">n</text>
  <text x="150" y="108" font-size="13" text-anchor="end" class="mono">n - 1</text>
  <text x="150" y="168" font-size="13" text-anchor="end" class="mono">n &amp; (n-1)</text>
  <g font-size="14" text-anchor="middle" class="mono">
    <rect x="170" y="36" width="56" height="34" fill="var(--surface)" stroke="currentColor"/><text x="198" y="58">1</text>
    <rect x="226" y="36" width="56" height="34" fill="var(--surface)" stroke="currentColor"/><text x="254" y="58">0</text>
    <rect x="282" y="36" width="56" height="34" fill="var(--surface)" stroke="currentColor"/><text x="310" y="58">1</text>
    <rect x="338" y="36" width="56" height="34" fill="var(--surface)" stroke="currentColor"/><text x="366" y="58">1</text>
    <rect x="394" y="36" width="56" height="34" fill="var(--surface)" stroke="currentColor"/><text x="422" y="58">0</text>
    <rect x="450" y="36" width="56" height="34" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="478" y="58">1</text>
    <rect x="506" y="36" width="56" height="34" fill="var(--surface)" stroke="currentColor"/><text x="534" y="58">0</text>
    <rect x="562" y="36" width="56" height="34" fill="var(--surface)" stroke="currentColor"/><text x="590" y="58">0</text>
    <rect x="170" y="86" width="56" height="34" fill="var(--surface)" stroke="currentColor"/><text x="198" y="108">1</text>
    <rect x="226" y="86" width="56" height="34" fill="var(--surface)" stroke="currentColor"/><text x="254" y="108">0</text>
    <rect x="282" y="86" width="56" height="34" fill="var(--surface)" stroke="currentColor"/><text x="310" y="108">1</text>
    <rect x="338" y="86" width="56" height="34" fill="var(--surface)" stroke="currentColor"/><text x="366" y="108">1</text>
    <rect x="394" y="86" width="56" height="34" fill="var(--surface)" stroke="currentColor"/><text x="422" y="108">0</text>
    <rect x="450" y="86" width="56" height="34" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="478" y="108">0</text>
    <rect x="506" y="86" width="56" height="34" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="534" y="108">1</text>
    <rect x="562" y="86" width="56" height="34" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="590" y="108">1</text>
    <rect x="170" y="146" width="56" height="34" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="198" y="168">1</text>
    <rect x="226" y="146" width="56" height="34" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="254" y="168">0</text>
    <rect x="282" y="146" width="56" height="34" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="310" y="168">1</text>
    <rect x="338" y="146" width="56" height="34" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="366" y="168">1</text>
    <rect x="394" y="146" width="56" height="34" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="422" y="168">0</text>
    <rect x="450" y="146" width="56" height="34" fill="var(--surface)" stroke="currentColor"/><text x="478" y="168">0</text>
    <rect x="506" y="146" width="56" height="34" fill="var(--surface)" stroke="currentColor"/><text x="534" y="168">0</text>
    <rect x="562" y="146" width="56" height="34" fill="var(--surface)" stroke="currentColor"/><text x="590" y="168">0</text>
  </g>
  <text x="640" y="58" font-size="12" text-anchor="start">= 180</text>
  <text x="640" y="108" font-size="12" text-anchor="start">= 179</text>
  <text x="640" y="168" font-size="12" text-anchor="start">= 176</text>
  <text x="394" y="210" font-size="12" text-anchor="middle" fill="var(--slate-deep)">古銅＝減 1 時改變的位；灰藍＝AND 之後原封不動的左半邊</text>
</svg>
