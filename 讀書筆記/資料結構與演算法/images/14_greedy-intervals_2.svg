<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 268" aria-label="五個區間依起點排好是 [1,4]、[3,5]、[7,9]、[8,11]、[13,15]；[1,4] 與 [3,5] 合併成 [1,5]，[7,9] 與 [8,11] 合併成 [7,11]，[13,15] 自己一段" width="784" height="268">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
