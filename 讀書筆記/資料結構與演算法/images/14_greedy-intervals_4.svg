<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 274" aria-label="六場會議 9-10、9-12、10-11、10-13、11-14、13-15。用最小堆分配：會議室一放 9-10、10-11、11-14，會議室二放 9-12、13-15，會議室三放 10-13。10 點到 11 點之間同時有 9-12、10-11、10-13 三場，深度 3，所以至少要 3 間" width="784" height="274">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="274" fill="#FFFFFF" stroke="none"/>
  <rect x="250" y="22" width="90" height="150" fill="var(--slate-soft)" opacity=".6"/>
  <text x="295" y="16" font-size="11" text-anchor="middle" fill="var(--slate-deep)">10～11 點同時 3 場（深度 3）</text>
  <text x="140" y="54" font-size="12" text-anchor="end">會議室一</text>
  <rect x="162" y="36" width="86" height="26" rx="4" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="205" y="56" font-size="11" text-anchor="middle" class="mono">9–10</text>
  <rect x="252" y="36" width="86" height="26" rx="4" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="295" y="56" font-size="11" text-anchor="middle" class="mono">10–11</text>
  <rect x="342" y="36" width="266" height="26" rx="4" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="475" y="56" font-size="11" text-anchor="middle" class="mono">11–14</text>
  <text x="140" y="100" font-size="12" text-anchor="end">會議室二</text>
  <rect x="162" y="82" width="266" height="26" rx="4" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="295" y="102" font-size="11" text-anchor="middle" class="mono">9–12</text>
  <rect x="522" y="82" width="176" height="26" rx="4" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="610" y="102" font-size="11" text-anchor="middle" class="mono">13–15</text>
  <text x="140" y="146" font-size="12" text-anchor="end">會議室三</text>
  <rect x="252" y="128" width="266" height="26" rx="4" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="385" y="148" font-size="11" text-anchor="middle" class="mono">10–13</text>
  <line x1="160" y1="182" x2="700" y2="182" stroke="currentColor" stroke-opacity=".4"/>
  <line x1="160" y1="182" x2="160" y2="187" stroke="currentColor" stroke-opacity=".4"/><text x="160" y="200" font-size="11" text-anchor="middle" opacity=".6" class="mono">9</text>
  <line x1="250" y1="182" x2="250" y2="187" stroke="currentColor" stroke-opacity=".4"/><text x="250" y="200" font-size="11" text-anchor="middle" opacity=".6" class="mono">10</text>
  <line x1="340" y1="182" x2="340" y2="187" stroke="currentColor" stroke-opacity=".4"/><text x="340" y="200" font-size="11" text-anchor="middle" opacity=".6" class="mono">11</text>
  <line x1="430" y1="182" x2="430" y2="187" stroke="currentColor" stroke-opacity=".4"/><text x="430" y="200" font-size="11" text-anchor="middle" opacity=".6" class="mono">12</text>
  <line x1="520" y1="182" x2="520" y2="187" stroke="currentColor" stroke-opacity=".4"/><text x="520" y="200" font-size="11" text-anchor="middle" opacity=".6" class="mono">13</text>
  <line x1="610" y1="182" x2="610" y2="187" stroke="currentColor" stroke-opacity=".4"/><text x="610" y="200" font-size="11" text-anchor="middle" opacity=".6" class="mono">14</text>
  <line x1="700" y1="182" x2="700" y2="187" stroke="currentColor" stroke-opacity=".4"/><text x="700" y="200" font-size="11" text-anchor="middle" opacity=".6" class="mono">15</text>
  <text x="430" y="236" font-size="12" text-anchor="middle">古銅＝一場會議；同一列是同一間會議室</text>
</svg>
