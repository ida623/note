<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 784 314" aria-label="跨行轉帳的 Saga 狀態：已受理，扣款並轉入中間帳戶後變成已扣款，送出跨行指令後變成已送出；對方成功回覆變成完成；對方拒絕則補償，把中間帳戶的錢退回客戶，變成已退回；逾時或結果不明則先查詢，查不出來就進人工處理" width="784" height="314">
<style>
svg{--paper:#FFFFFF;--surface:#FFFFFF;--sunk:#F7F9F6;--ink:#233831;--ink2:#5A6B65;--mut:#8A9792;--line:#DEE5DD;
--gold:#E0805C;--gold-deep:#A9492A;--gold-soft:#F2CEAE;--slate:#5FA58B;--slate-deep:#2F6B57;--slate-soft:#C5E0D7;
--danger:#D9603A;--ok:#1F8A5B;--ok-soft:#C5E0D7;--mut-deep:#5A6B65;--mint:#A9D9C7;--peach:#F29F80;--amber:#FBC580;
color:#233831;background:#FFFFFF}
text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
text:not([fill]){fill:currentColor}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
[fill="#FFFFFF"]{fill:var(--surface)}[fill="#F6E9D2"]{fill:var(--gold-soft)}[fill="#B5730F"]{fill:var(--gold)}
[fill="#8A5809"]{fill:var(--gold-deep)}[fill="#22242A"]{fill:var(--ink)}[fill="#55575E"]{fill:var(--ink2)}[fill="#8B8D94"]{fill:var(--mut)}
[stroke="#B5730F"]{stroke:var(--gold)}[stroke="#8A5809"]{stroke:var(--gold-deep)}[stroke="#5E7A9B"]{stroke:var(--slate)}[stroke="#8B8D94"]{stroke:var(--mut)}
</style>
<rect x="-12" y="-12" width="784" height="314" fill="#FFFFFF" stroke="none"/>
  <defs><marker id="xfer-a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs>
  <rect x="20" y="40" width="110" height="40" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="75" y="65" font-size="13" text-anchor="middle">已受理</text>
  <rect x="200" y="40" width="110" height="40" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="255" y="65" font-size="13" text-anchor="middle">已扣款</text>
  <rect x="380" y="40" width="110" height="40" rx="8" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="435" y="65" font-size="13" text-anchor="middle">已送出</text>
  <rect x="600" y="40" width="130" height="40" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="665" y="65" font-size="13" text-anchor="middle">完成</text>
  <rect x="600" y="140" width="130" height="40" rx="8" fill="var(--slate-soft)" stroke="var(--slate)"/><text x="665" y="165" font-size="13" text-anchor="middle">已退回</text>
  <rect x="380" y="220" width="110" height="40" rx="8" fill="var(--surface)" stroke="currentColor"/><text x="435" y="245" font-size="13" text-anchor="middle">人工處理</text>
  <line x1="132" y1="60" x2="196" y2="60" stroke="currentColor" stroke-width="1.5" marker-end="url(#xfer-a1)"/>
  <text x="164" y="32" font-size="11" text-anchor="middle">扣款＋轉入</text><text x="164" y="100" font-size="11" text-anchor="middle">中間帳戶</text>
  <line x1="312" y1="60" x2="376" y2="60" stroke="currentColor" stroke-width="1.5" marker-end="url(#xfer-a1)"/>
  <text x="344" y="32" font-size="11" text-anchor="middle">寫 Outbox</text><text x="344" y="100" font-size="11" text-anchor="middle">送出指令</text>
  <line x1="492" y1="60" x2="596" y2="60" stroke="currentColor" stroke-width="1.5" marker-end="url(#xfer-a1)"/>
  <text x="544" y="50" font-size="11" text-anchor="middle">對方成功</text>
  <line x1="492" y1="72" x2="598" y2="150" stroke="currentColor" stroke-width="1.5" marker-end="url(#xfer-a1)"/>
  <text x="604" y="114" font-size="11" text-anchor="start">對方拒絕：補償</text>
  <line x1="435" y1="82" x2="435" y2="216" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#xfer-a1)"/>
  <text x="445" y="140" font-size="11" text-anchor="start" fill="var(--gold-deep)">逾時、結果不明</text>
  <text x="445" y="158" font-size="11" text-anchor="start" fill="var(--gold-deep)">先查詢，查不出來</text>
  <text x="20" y="200" font-size="12" text-anchor="start">每一步：一筆本地交易</text>
  <text x="20" y="220" font-size="12" text-anchor="start">＋同一個轉帳序號（冪等）</text>
  <text x="20" y="240" font-size="12" text-anchor="start">＋狀態只往前走</text>
</svg>
