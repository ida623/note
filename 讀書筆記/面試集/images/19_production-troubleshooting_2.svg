  <rect x="284" y="42" width="168" height="26" rx="5" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="368" y="60" font-size="12" text-anchor="middle">對帳單（借出）</text>
  <rect x="284" y="72" width="168" height="26" rx="5" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="368" y="90" font-size="12" text-anchor="middle">對帳單（借出）</text>
  <rect x="284" y="102" width="168" height="26" rx="5" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="368" y="120" font-size="12" text-anchor="middle">對帳單（借出）</text>
  <rect x="284" y="132" width="168" height="26" rx="5" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="368" y="150" font-size="12" text-anchor="middle">對帳單（借出）</text>
  <rect x="284" y="162" width="168" height="26" rx="5" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="368" y="180" font-size="12" text-anchor="middle">對帳單（借出）</text>
  <line x1="472" y1="115" x2="560" y2="115" stroke="currentColor" stroke-width="1.5" marker-end="url(#pt-a2)"/>
