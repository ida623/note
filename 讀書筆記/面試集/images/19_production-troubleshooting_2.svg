  <text x="653" y="136" font-size="11" text-anchor="middle">全表掃描 400 萬列</text>
  <text x="20" y="226" font-size="12" text-anchor="start" fill="var(--gold-deep)">等超過 2 秒 → SQLTransientConnectionException（total=5, active=5, idle=0, waiting=39）</text>
